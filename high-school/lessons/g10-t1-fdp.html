 glossary:[['Order of operations','The order for calculating: Brackets, then Powers (Orders), then Division and Multiplication (left to right), then Addition and Subtraction (left to right). Often remembered as BODMAS.'],['Numerator','The top number of a fraction.'],['Denominator','The bottom number of a fraction.'],['Percent (%)','Out of 100. 35% means 35 out of 100.'],['Decimal places','The digits after the decimal point.'],['Significant figures','The digits in a number that carry meaning, counted from the first non-zero digit.'],['Scientific notation','A number written as a × 10ⁿ, where 1 ≤ a < 10 and n is an integer. Also called standard form.'],['Recurring decimal','A decimal with a digit or group of digits that repeats forever, such as 0.333…']],

   blocks:[{type:'mcq',star:true,questions:[{q:'Which fraction is equivalent to 3/4?',o:['6/8','4/3','3/8'],a:0,why:'Multiply the top and bottom by 2: 6/8.',teach:'Equivalent fractions are made by multiplying (or dividing) the numerator and denominator by the same number. 3/4 × 2/2 = 6/8.'},{q:'Simplify 12/18.',o:['2/3','4/6','6/9'],a:0,why:'Divide top and bottom by 6 (the HCF).',teach:'To simplify, divide the numerator and denominator by their highest common factor. The HCF of 12 and 18 is 6, so 12/18 = 2/3. (4/6 and 6/9 are equal, but not in simplest form.)'},{q:'What is 0.7 × 10?',o:['0.07','7','70'],a:1,why:'Multiplying by 10 moves each digit one place left.',teach:'Multiplying by 10 makes a number 10 times bigger: each digit moves one place to the left. 0.7 → 7.'},{q:'In 4.632, which digit is in the hundredths place?',o:['6','3','2'],a:1,why:'Tenths, then hundredths: 6 is tenths, 3 is hundredths.',teach:'After the decimal point the places are tenths, hundredths, thousandths. In 4.632: 6 tenths, 3 hundredths, 2 thousandths.'}]}]},

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="cvIn">Type a number:</label><input type="text" id="cvIn" value="3/8" placeholder="e.g. 3/8, 0.375 or 37.5%"></div><div class="scene cvBar"></div><div class="explain cvOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge cvN"></span> <strong class="cvTask"></strong></p><div class="controls"><input type="text" class="cvA" aria-label="Your answer" placeholder="your answer"><button type="button" class="go cvC">Check</button></div><div class="fb cvFb" aria-live="polite">Use the converter to help you.</div></div>',
     init:function(box,api){var inp=box.querySelector('#cvIn');function parse(s){s=String(s).replace(/\s/g,'');var m;if((m=s.match(/^(-?\d*\.?\d+)%$/)))return{v:+m[1]/100};if((m=s.match(/^(-?\d+)\/(\d+)$/))&&+m[2])return{v:+m[1]/+m[2],n:+m[1],d:+m[2]};if(/^-?\d*\.?\d+$/.test(s))return{v:+s};return null}function frac(v){for(var d=1;d<=1000;d++){var n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9){var g=gcd(n,d);return(n/g)+'/'+(d/g)}}return'≈ '+v.toFixed(4)}function draw(){var p=parse(inp.value),o=box.querySelector('.cvOut');if(!p){o.textContent='Type a fraction such as 3/8, a decimal such as 0.375, or a percentage such as 37.5%.';box.querySelector('.cvBar').innerHTML='';return}var v=p.v,dec=String(+v.toFixed(6)),pc=String(+(v*100).toFixed(4));box.querySelector('.cvBar').innerHTML=BAR(v,'A bar shaded '+pc+' percent');o.innerHTML='<strong>Fraction:</strong> '+frac(v)+' | <strong>Decimal:</strong> '+dec+' | <strong>Percentage:</strong> '+pc+'%'+(p.d?'<br>How: '+p.n+' ÷ '+p.d+' = '+dec+', and '+dec+' × 100 = '+pc+'%.':'')}inp.addEventListener('input',draw);var T=[{t:'Write 7/20 as a decimal.',a:[0.35]},{t:'Write 0.125 as a percentage. (Type just the number.)',a:[12.5]},{t:'Write 45% as a fraction in its simplest form.',a:['9/20']}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.cvN').textContent='All done';box.querySelector('.cvTask').textContent='You completed every challenge!';box.querySelector('.cvC').disabled=true;return}box.querySelector('.cvN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.cvTask').textContent=T[k].t}box.querySelector('.cvC').onclick=function(){var a=String(box.querySelector('.cvA').value).replace(/[\s%]/g,''),fb=box.querySelector('.cvFb'),ok=T[k].a.some(function(x){return typeof x==='number'?Math.abs(parseFloat(a)-x)<1e-9:a===x});if(ok){fb.className='fb ok cvFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.cvA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no cvFb';fb.textContent='Not yet. Type it into the converter at the top and read the form you need.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: calculating with fractions and %',title:'Learn: order of operations, conversions and percentages',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The order of operations',explain:'<p>Try this on two friends: what is 2 + 3 × 4? One might say 20 (add first, then multiply). The other might say 14 (multiply first, then add). They cannot both be right! To make sure everyone in the world gets the same answer, mathematicians agreed on an order for doing calculations.</p><p>That agreement is the {{order of operations|Brackets, Orders (powers), Division and Multiplication, Addition and Subtraction}}, often remembered as <strong>BODMAS</strong>. Work out <strong>B</strong>rackets first. Then <strong>O</strong>rders, which means powers and roots. Then <strong>D</strong>ivision and <strong>M</strong>ultiplication, working from left to right. Finally, <strong>A</strong>ddition and <strong>S</strong>ubtraction, again from left to right.</p><p>So 2 + 3 × 4 = 2 + 12 = 14. The same rules apply whether the numbers are whole numbers, fractions or decimals. Scientific calculators follow these rules too, which is why it is worth knowing them.</p>',
     example:{q:'Evaluate 2.5 + 3 × (1/2)².',steps:[{do:'Brackets and powers first: (1/2)² = 1/4.',why:'Orders come before multiplication and addition.'},{do:'Multiplication next: 3 × 1/4 = 3/4 = 0.75.'},{do:'Addition last: 2.5 + 0.75 = 3.25.'}]},
     mistake:'Working straight from left to right: 2.5 + 3 = 5.5, then × ¼ = 1.375. That ignores the order of operations.',
     check:{q:'Evaluate 8 − 6 ÷ 3.',o:['2/3','6','2'],a:1,why:'Division first: 6 ÷ 3 = 2, then 8 − 2 = 6.',hint:'Division comes before subtraction.'}},
    {title:'Converting between fractions, decimals and percentages',explain:'<p>A half, 0.5 and 50% all describe exactly the same amount, just in different “languages”. Being able to switch between them is a real superpower, because sometimes one form is much easier to work with than another.</p><p><strong>From a fraction to a decimal:</strong> a fraction is really a division, so divide the top by the bottom. 3/8 = 3 ÷ 8 = 0.375.<br><strong>From a decimal to a percentage:</strong> per cent means “out of 100”, so multiply by 100. 0.375 → 37.5%.<br><strong>From a percentage to a fraction:</strong> write it over 100 and simplify. 45% = 45/100 = 9/20.<br><strong>From a decimal to a fraction:</strong> use place value. 0.35 is 35 hundredths, so 35/100 = 7/20.</p><p>When you need to compare amounts that are written in different forms, like a test score of 17/20 and another of 82%, change them all into the same form first. Then the comparison is easy.</p>',visual:BAR(0.375,'A bar shaded three-eighths, which is 37.5 percent'),
     example:{q:'Settle the argument: Kemar got 17/20 and Shanice got 82%.',steps:[{do:'Change 17/20 to a decimal: 17 ÷ 20 = 0.85.',why:'Converting to the same form lets us compare fairly.'},{do:'Change 0.85 to a percentage: 0.85 × 100 = 85%.'},{do:'Compare: 85% is more than 82%.'},{do:'So Kemar did better. Was your prediction right?'}]},
     mistake:'Thinking 0.5 = 5%. To change a decimal to a percentage, multiply by 100: 0.5 = 50%.',
     check:{q:'Write 3/5 as a percentage.',o:['35%','60%','0.6%'],a:1,why:'3 ÷ 5 = 0.6, and 0.6 × 100 = 60%.',hint:'Divide, then multiply by 100.'}},
    {title:'Fractions and percentages of quantities',explain:'<p>Percentages are everywhere in daily life: sales, taxes, test scores, survey results. There are three kinds of question you will meet, and each has its own simple method.</p><p><strong>Finding a percentage of an amount.</strong> “What is 15% of $4,000?” Change the percentage to a decimal and multiply: 0.15 × 4,000 = $600.</p><p><strong>Writing one amount as a percentage of another.</strong> “30 out of 120 students walk. What percentage is that?” Write it as a fraction of the whole, then multiply by 100: 30/120 × 100 = 25%.</p><p><strong>Finding the whole.</strong> “20% of the price is $300. What is the full price?” This one trips people up. Think of it in steps: if 20% is $300, then 1% is $300 ÷ 20 = $15, and the whole 100% is $15 × 100 = $1,500. Finding 1% first is the key.</p>',
     example:{q:'A school has 750 students. 40% of them take the bus. How many take the bus? Then, if 270 students walk, what percentage walk?',steps:[{do:'40% of 750 = 0.40 × 750 = 300 students take the bus.'},{do:'Walkers as a fraction of all students: 270/750.',why:'"As a percentage of" means put it over the whole.'},{do:'270 ÷ 750 = 0.36, and 0.36 × 100 = 36% walk.'}]},
     mistake:'In reverse problems, adding the percentage on again. If 20% of the price is $300, the price is NOT $300 + 20%. Find 1%, then 100%.',
     check:{q:'25% of a number is 60. What is the number?',o:['15','240','75'],a:1,why:'25% is a quarter, so the whole is 4 × 60 = 240.',hint:'25% is one quarter of the whole.'}}]}]},
  {phase:'explain',name:'Teach: rounding and standard form',title:'Learn: decimal places, significant figures and scientific notation',lead:'Next, how to give numbers to a sensible accuracy, and how to write very large and very small numbers.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Big number an tiny number dem can write short.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Rounding to decimal places',explain:'<p>Your calculator might tell you that something costs $14.666666… That is far too precise to be useful, because nobody pays two-thirds of a cent! So we round. One common way is to round to a number of {{decimal places|digits after the decimal point}}.</p><p>Decimal places are simply the digits after the decimal point. To round to 2 decimal places, keep 2 digits after the point. Then look at the very next digit to decide: if it is 5 or more, round up; if it is 4 or less, leave it. So $14.666… to 2 decimal places is $14.67.</p><p>Sometimes rounding creates zeros at the end, and those zeros still matter. 2.996 rounded to 2 decimal places is 3.00, not just 3, because the question asked for 2 decimal places.</p>',
     example:{q:'Round 3.14159 to 2 decimal places.',steps:[{do:'Count 2 digits after the point: 3.14|159.'},{do:'The next digit is 1, which is less than 5.'},{do:'So keep 3.14.'}]},
     mistake:'Forgetting to keep zeros that matter. 2.996 to 2 d.p. is 3.00, not 3, because the question asks for 2 decimal places.',
     check:{q:'Round 7.2648 to 1 decimal place.',o:['7.2','7.3','7.26'],a:1,why:'The next digit is 6, so round 7.2 up to 7.3.',hint:'Look at the second digit after the point.'}},
    {title:'Rounding to significant figures',explain:'<p>Decimal places count from the decimal point. But sometimes that is not helpful. Imagine a scientist measuring a tiny insect, 0.004 27 m long: rounded to 2 decimal places, it would be 0.00, which tells us nothing! {{Significant figures|digits counted from the first non-zero digit}} solve this problem.</p><p>To count significant figures, start at the <strong>first digit that is not zero</strong>, wherever it is. The zeros at the front of 0.004 27 are only there to show the size, so they do not count. The first significant figure is 4. To 2 significant figures, we keep 4 and 2, then round: 0.0043.</p><p>For large numbers, it works the same way, but you must fill the gaps with zeros to keep the number the right size. 48,762 to 2 significant figures is 49,000, not 49. A population of 49 would be very different from a population of 49,000!</p>',
     example:{q:'Round 0.06375 to 3 significant figures, and 2,849 to 1 significant figure.',steps:[{do:'0.06375: the first non-zero digit is 6. Count 3 digits: 6, 3, 7.',why:'The zeros at the start are only placeholders.'},{do:'The next digit is 5, so round up: 0.0638.'},{do:'2,849 to 1 s.f.: the first digit is 2; the next is 8, so round up to 3,000.',why:'Zeros keep the number the right size.'}]},
     mistake:'Counting the zeros at the front of a small number. 0.004 has only 1 significant figure.',
     check:{q:'Round 52,371 to 2 significant figures.',o:['52','52,000','53,000'],a:1,why:'The first two digits are 5 and 2; the next digit (3) is less than 5. Zeros keep the size: 52,000.',hint:'Keep the number the same size with zeros.'}},
    {title:'Scientific notation (standard form)',explain:'<p>Scientists deal with numbers that are unbelievably big and unbelievably small. The Sun is about 150,000,000,000 metres away. A virus is about 0.000 000 1 metres wide. Writing all those zeros is slow, and it is very easy to miss one.</p><p>{{Scientific notation|a number written as a × 10ⁿ, where a is at least 1 but less than 10}} is a short way to write them. Put the decimal point just after the first non-zero digit, then multiply by a power of 10 that shows how far the point moved.</p><p>For a big number like 759,000: put the point after the 7 to get 7.59. The point moved 5 places, so 759,000 = 7.59 × 10⁵. For a small number like 0.00759: again we want 7.59, but this time the point moved 3 places to the <em>right</em>, so the power is negative: 0.00759 = 7.59 × 10⁻³.</p><p>A quick check: big numbers have positive powers, and numbers smaller than 1 have negative powers.</p>',
     example:{q:'Write 759,000 and 0.00759 in scientific notation.',steps:[{do:'759,000: put the point after the first digit: 7.59.',why:'a must be between 1 and 10.'},{do:'Count how far the point moved: 5 places. So 759,000 = 7.59 × 10⁵.'},{do:'0.00759: the first digit that is not zero is 7, so a = 7.59.'},{do:'The point moved 3 places to the right, so n = −3: 7.59 × 10⁻³.'}]},
     mistake:'Writing 75.9 × 10⁴. The number in front must be between 1 and 10, so it should be 7.59 × 10⁵.',
     check:{q:'Write 0.00042 in scientific notation.',o:['4.2 × 10⁻⁴','42 × 10⁻⁵','4.2 × 10⁴'],a:0,why:'Move the point 4 places to make 4.2; small numbers have a negative power.',hint:'Small number → negative power.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Order of operations',text:'Brackets, Orders, Division and Multiplication (left to right), Addition and Subtraction (left to right). For example, 4 + 2 × 3 = 10, not 18.'},{title:'Converting',text:'Fraction → decimal: divide. Decimal → %: × 100. % → fraction: over 100, then simplify. For example, 3/8 = 0.375 = 37.5%.'},{title:'Percentages of quantities',text:'x% of Q = (x ÷ 100) × Q. A as a % of B = A/B × 100%. To find the whole: find 1%, then × 100.'},{title:'Accuracy and size',text:'d.p. counts after the point; s.f. counts from the first non-zero digit. Scientific notation: a × 10ⁿ with 1 ≤ a < 10.'}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Multiplying a number by a fraction makes it smaller.',a:'sometimes',why:'× 1/2 makes 10 smaller (5), but × 3/2 makes it bigger (15), and multiplying a negative number by ½ makes it bigger.',hint:'Try a fraction bigger than 1.'},{s:'A percentage can be more than 100%.',a:'sometimes',why:'You cannot score more than 100% on a test, but prices can rise by 150%.',hint:'Think of price increases.'},{s:'Rounding to 2 significant figures and to 2 decimal places gives the same answer.',a:'sometimes',why:'For 0.456 they match (0.46 both ways), but for 45.67 they differ: 46 to 2 s.f. and 45.67 to 2 d.p.',hint:'Try a number bigger than 10.'},{s:'In scientific notation, small numbers (less than 1) have a negative power of 10.',a:'always',why:'You move the point to the right, which gives a negative power.'},{s:'50% of a number is bigger than the number.',a:'sometimes',why:'For positive numbers it is smaller, but 50% of −10 is −5, which is bigger than −10.',hint:'Try a negative number.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Daniel',q:'Evaluate 10 − 2 × 3.',lines:['10 − 2 = 8','8 × 3 = 24'],wrong:0,reasons:['He should do the multiplication first','He should add instead','The answer should be 8'],reason:0,fix:'2 × 3 = 6, then 10 − 6 = 4.'},{who:'Tanesha',q:'Round 0.00387 to 2 significant figures.',lines:['The first two digits are 0 and 0','So the answer is 0.0'],wrong:0,reasons:['Leading zeros are not significant; start counting from 3','She should round to 2 decimal places','0.00387 has no significant figures'],reason:0,fix:'Start at the first non-zero digit: 3 and 8, then round: 0.0039.'},{who:'Jermaine',q:'A price after a 20% increase is $6,000. What was the original price?',lines:['20% of $6,000 = $1,200','Original = $6,000 − $1,200 = $4,800'],wrong:0,reasons:['The 20% is of the ORIGINAL price, not the new price','He should add $1,200','20% of $6,000 is $120'],reason:0,fix:'The new price is 120% of the original: 1% = 6,000 ÷ 120 = $50, so the original was $5,000.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire conversions and percentages.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,3);if(r===0){var F=[[1,4],[3,4],[1,5],[2,5],[3,8],[7,10],[9,20],[1,8]],f=F[R(0,7)],v=f[0]/f[1];return{q:'Write '+f[0]+'/'+f[1]+' as a percentage.',o:[+(v*100).toFixed(1)+'%',+(v*10).toFixed(2)+'%',f[0]+f[1]+'%'],a:0,why:f[0]+' ÷ '+f[1]+' = '+v+', × 100.'}}if(r===1){var p=[5,10,15,20,25,40][R(0,5)],n=R(2,20)*100;return{q:p+'% of $'+n.toLocaleString('en-JM')+' = ?',o:['$'+(p*n/100).toLocaleString('en-JM'),'$'+(p*n/10).toLocaleString('en-JM'),'$'+(n-p).toLocaleString('en-JM')],a:0,why:p+'/100 × '+n+'.'}}if(r===2){var a=R(11,99)/10,e=R(2,6),num=Math.round(a*Math.pow(10,e));return{q:'Write '+num.toLocaleString('en-JM')+' in scientific notation.',o:[a+' × 10^'+e,a+' × 10^'+(e+1),(Math.round(a*100)/10)+' × 10^'+(e-1)],a:0,why:'Point after the first digit; it moved '+e+' places.'}}var x=R(1001,9999)/1000;return{q:'Round '+x+' to 1 decimal place.',o:[x.toFixed(1),(Math.floor(x*10)/10===+x.toFixed(1)?(+x.toFixed(1)+0.1).toFixed(1):(Math.floor(x*10)/10).toFixed(1)),x.toFixed(2)],a:0,why:'Look at the second decimal digit.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent numbers that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a fraction that is between 60% and 70%.',placeholder:'e.g. a/b',check:function(v){var m=String(v).replace(/\s/g,'').match(/^(\d+)\/(\d+)$/);if(!m||!+m[2])return{ok:false,msg:'Type a fraction like 2/3.'};var x=m[1]/m[2];return x>0.6&&x<0.7?{ok:true,msg:'Yes! '+v+' = '+(x*100).toFixed(1)+'%.'}:{ok:false,msg:v+' = '+(x*100).toFixed(1)+'%, which is not between 60% and 70%.'}}},{q:'Type a number that rounds to 0.05 when rounded to 2 significant figures but is NOT exactly 0.05.',placeholder:'e.g. …',check:function(v){var x=parseFloat(v);if(isNaN(x)||x===0.05)return{ok:false,msg:'Type a number close to, but not equal to, 0.05.'};var r=+x.toPrecision(2);return r===0.05?{ok:true,msg:'Correct! '+x+' rounds to 0.050 (2 s.f.).'}:{ok:false,msg:x+' rounds to '+r+' (2 s.f.). Try something between 0.0495 and 0.0505.'}}},{q:'Type a number greater than 1 million, written in scientific notation, like 2.5 × 10^6.',placeholder:'a × 10^n',check:function(v){var m=String(v).replace(/\s/g,'').match(/^(\d+(?:\.\d+)?)[x×]10\^(-?\d+)$/);if(!m)return{ok:false,msg:'Use the form a × 10^n, for example 2.5 × 10^6.'};var a=+m[1],n=+m[2];if(a<1||a>=10)return{ok:false,msg:'The first number must be at least 1 and less than 10.'};return a*Math.pow(10,n)>1e6?{ok:true,msg:'Yes! '+a+' × 10^'+n+' is more than a million.'}:{ok:false,msg:'That is not more than 1,000,000 (= 1 × 10^6).'}}}]}},
    {icon:'📊',title:'Mission: the school survey',desc:'Analyse a survey of students at a Kingston high school.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'A Kingston high school with 1,250 students surveyed everyone about how they get to school.',parts:[{q:'2/5 of the students take a taxi. How many students is that?',a:500,hint:'2/5 × 1,250.',sol:'1,250 ÷ 5 × 2 = 500 students.'},{q:'350 students take the bus. What percentage is that?',a:28,hint:'350/1,250 × 100.',sol:'350 ÷ 1,250 = 0.28, so 28%.',placeholder:'percent'},{q:'The rest walk. What fraction of the school walks? Give it in simplest form.',a:['8/25'],hint:'1,250 − 500 − 350 = 400 walk. Write 400/1,250 and simplify.',sol:'400/1,250 = 8/25.'},{q:'Next year, the number of students who walk is expected to rise by 15%. How many will walk next year?',a:460,hint:'15% of 400 = 60. Add it on.',sol:'400 × 1.15 = 460 students.'},{q:'Jamaica has about 2,800,000 people. Write this in scientific notation as a × 10^n. Type just the power n.',a:6,hint:'2,800,000 = 2.8 × 10^?',sol:'2.8 × 10⁶, so n = 6.'}],done:'You used fractions, percentages, simplifying and scientific notation to analyse real survey data.'}}
