 steps:[
  {phase:'engage',name:'The data plan',title:'How much data can you buy?',lead:'Tia has $2,000. Her phone company charges a $500 service fee, plus $150 for each gigabyte (GB) of data.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><span>x</span><select id="ilS" aria-label="Inequality symbol"><option>&lt;</option><option>≤</option><option>&gt;</option><option>≥</option></select><input type="range" id="ilV" min="-5" max="5" value="1" aria-label="Number"><output class="big ilO"></output></div><div class="scene ilSvg"></div><div class="explain ilX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge ilB"></span> <strong class="ilT"></strong></p><div class="controls"><input type="number" class="ilA" aria-label="Your answer" placeholder="number" hidden><button type="button" class="go ilC">Check</button></div><div class="fb ilFb" aria-live="polite">Set up the number line, then check.</div></div>',
     init:function(box,api){var s=box.querySelector('#ilS'),v=box.querySelector('#ilV');api.nudges(v);var W={'<':'is less than','≤':'is less than or equal to','>':'is greater than','≥':'is greater than or equal to'};function draw(){var S=s.value,V=+v.value,ints=[];for(var i=-6;i<=6;i++){if((S==='<'&&i<V)||(S==='≤'&&i<=V)||(S==='>'&&i>V)||(S==='≥'&&i>=V))ints.push(i<0?'−'+(-i):i)}box.querySelector('.ilO').textContent=V<0?'−'+(-V):V;box.querySelector('.ilSvg').innerHTML=INEQ(S,V);box.querySelector('.ilX').innerHTML='<strong>x '+S+' '+(V<0?'−'+(-V):V)+'</strong> means x '+W[S]+' '+(V<0?'−'+(-V):V)+'. Integers shown that fit: '+ints.join(', ')+(ints.length?', …':'')}s.onchange=draw;v.addEventListener('input',draw);var T=[{t:'Show x ≥ −2 on the number line.',ok:function(){return s.value==='≥'&&+v.value===-2},hint:'Choose ≥ and move the number to −2.'},{t:'Show x < 3 on the number line.',ok:function(){return s.value==='<'&&+v.value===3},hint:'Choose < and move the number to 3. The circle should be open.'},{t:'How many integers satisfy x > 1 AND x ≤ 4? Type the number.',num:3,hint:'List them: they are bigger than 1 and no bigger than 4.'}],q=api.get('k')||0,inp=box.querySelector('.ilA');function task(){if(q>=T.length){box.querySelector('.ilB').textContent='All done';box.querySelector('.ilT').textContent='You completed every challenge!';box.querySelector('.ilC').disabled=true;inp.hidden=true;return}box.querySelector('.ilB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ilT').textContent=T[q].t;inp.hidden=T[q].num==null}box.querySelector('.ilC').onclick=function(){var t=T[q],fb=box.querySelector('.ilFb'),ok=t.num!=null?+inp.value===t.num:t.ok();if(ok){fb.className='fb ok ilFb';fb.textContent='✓ Correct!';q++;api.set('k',q);inp.value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ilFb';fb.textContent='Not yet. '+t.hint}};draw();task()}}]},
  {phase:'explain',name:'Teach: changing the subject',title:'Learn: changing the subject of a formula',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Undo di operation dem, backwards.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What "the subject" means',explain:'<p>You have probably used a formula without even noticing. The perimeter of a square is <strong>P = 4s</strong>: add up four equal sides. If you know the side, say 9 cm, you put it in and get P = 36 cm. Easy.</p><p>But what if a carpenter tells you the perimeter is 36 cm and asks how long each side is? Now you know P and you want s. The formula is “the wrong way round” for this question. Changing the subject means turning the formula around so that the thing you want is on its own.</p><p>The variable on its own on one side is called the {{subject|the variable on its own on one side of a formula}}. In P = 4s, P is the subject. To make s the subject, think about what has been done to s: it has been multiplied by 4. To get s on its own, we undo that by doing the opposite, the {{inverse operation|the operation that undoes another: + and − undo each other, × and ÷ undo each other}}: divide by 4. And just like a balance scale, whatever we do to one side, we must do to the other side too.</p>',
     example:{q:'Make s the subject of P = 4s.',steps:[{do:'s is multiplied by 4.',why:'4s means 4 × s.'},{do:'Undo × 4 by dividing both sides by 4: P ÷ 4 = s.'},{do:'So s = P/4. For example, a square with perimeter 36 cm has sides of 36 ÷ 4 = 9 cm.'}]},
     mistake:'Doing the operation to only one side. Whatever you do to one side, you must do to the other.',
     check:{q:'Make b the subject of a = b + 5.',o:['b = a + 5','b = a − 5','b = 5a'],a:1,why:'Undo + 5 by subtracting 5 from both sides.',hint:'What undoes + 5?'}},
    {title:'Using a flow diagram: C = 2πr',explain:'<p>When a formula has more going on, a flow diagram helps you see the steps clearly. It is like following a recipe.</p><p>Look at the formula for the distance around a circle, <strong>C = 2πr</strong>. Start with r, the radius. What happens to it? It gets multiplied by 2π, and out comes C, the circumference. That is a one-step recipe: r → × 2π → C.</p><p>To change the subject, we walk the recipe <strong>backwards</strong>. Start from C and undo each step with its opposite. The opposite of “multiply by 2π” is “divide by 2π”. So C → ÷ 2π → r, which gives us r = C ÷ 2π, usually written r = C/(2π).</p><p>Why bother? Because now, if a groundsman measures the distance around a circular cricket pitch, he can work out its radius straight away, without guessing.</p>',visual:FLOW,
     example:{q:'Make r the subject of C = 2πr, then find r when C = 44 cm (π = 22/7).',steps:[{do:'r is multiplied by 2π. Undo it: divide both sides by 2π.'},{do:'r = C ÷ 2π, often written r = C/(2π).'},{do:'When C = 44: r = 44 ÷ (2 × 22/7) = 44 ÷ 44/7 = 7 cm.'}]},
     mistake:'Dividing by 2 and forgetting π, or the other way round. Undo the WHOLE multiplier 2π.',
     check:{q:'Make h the subject of A = bh.',o:['h = A − b','h = A/b','h = Ab'],a:1,why:'h is multiplied by b, so divide both sides by b.',hint:'What undoes × b?'}},
    {title:'Two-step formulas',explain:'<p>Some formulas have two steps, and then the <em>order</em> of undoing really matters. Think about getting dressed: you put on your socks, then your shoes. To undress, you do the opposite in the <strong>reverse order</strong>: shoes off first, then socks. Undoing a formula works exactly the same way.</p><p>Take <strong>y = 3x + 2</strong>. Follow what happens to x: first it is multiplied by 3, then 2 is added. So the last thing that happened was “add 2”, which means it is the first thing we undo. Subtract 2 from both sides: y − 2 = 3x. Then undo “multiply by 3” by dividing both sides by 3: x = (y − 2)/3.</p><p>If you do it in the wrong order, dividing by 3 first, you get the wrong answer. So before you start, always ask: “What happened to the letter, and in what order?” Then undo it backwards.</p>',
     example:{q:'Make t the subject of v = u + at.',steps:[{do:'Subtract u from both sides: v − u = at.',why:'u was added last, so undo it first.'},{do:'Divide both sides by a: (v − u)/a = t.'},{do:'So t = (v − u)/a.'}]},
     mistake:'Dividing by a before subtracting u. That gives v/a − u, which is wrong.',
     check:{q:'Make x the subject of y = 3x + 2.',o:['x = (y − 2)/3','x = y/3 − 2','x = 3y + 2'],a:0,why:'Subtract 2 first, then divide by 3.',hint:'Undo + 2 first, then × 3.'}}]}]},
  {phase:'explain',name:'Teach: inequalities',title:'Learn: writing, drawing and solving inequalities',lead:'Next, inequalities: statements about limits, such as "at most" and "more than".',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'"At least" mean di number or more.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Writing inequalities',explain:'<p>Not every situation in life is about exact amounts. Lots of rules are about <em>limits</em>. You must be at least 18 to vote. A minibus can carry no more than 15 passengers. A taxi fare is more than $200. These are not equations, because the amount is not one exact number. They are {{inequalities|statements that compare amounts using less than, greater than, at most or at least}}.</p><p>We use four symbols: <strong>&lt;</strong> means “is less than”, <strong>&gt;</strong> means “is greater than”, <strong>≤</strong> means “is less than or equal to” and <strong>≥</strong> means “is greater than or equal to”. A handy way to remember: the open mouth of the symbol always faces the bigger amount.</p><p>The trickiest part is the words. {{At least|that number or more}} 18 means 18 is allowed, and so is anything bigger: a ≥ 18. {{At most|that number or less}} 15 means 15 or fewer: p ≤ 15. But “more than 200” does not include 200 itself: f &gt; 200. Always ask yourself: is the number itself allowed?</p>',
     example:{q:'Write inequalities for: (a) you must be at least 18 to vote; (b) a minibus carries fewer than 16 passengers.',steps:[{do:'(a) Let a be the age. "At least 18" means 18 or more: a ≥ 18.'},{do:'(b) Let p be the number of passengers. "Fewer than 16" means less than 16: p < 16.',why:'16 itself is not allowed.'}]},
     mistake:'Reading "at least" as "less than". At least 18 means 18 or MORE.',
     check:{q:'"The temperature was at most 32 °C." Which inequality matches, using t for temperature?',o:['t < 32','t ≤ 32','t ≥ 32'],a:1,why:'At most 32 means 32 or less.',hint:'At most = no more than.'}},
    {title:'Inequalities on a number line',explain:'<p>An inequality usually has lots of answers, not just one. If x &lt; 3, then x could be 2, or 1, or 0, or 2.5, or −10… far too many to list! So instead of listing them, we draw them on a number line.</p><p>First, put a circle on the boundary number. The circle answers the question “Is this number included?” A <strong>filled circle ●</strong> means yes, it is included (for ≤ and ≥). An <strong>open circle ○</strong> means no, it is not included (for &lt; and &gt;). Then draw an arrow showing which way the answers go: to the left for smaller numbers, to the right for bigger ones.</p><p>So x ≥ −2 gets a filled circle at −2 (because −2 itself works) with an arrow to the right. And x &lt; 3 gets an open circle at 3 (because 3 itself does not work) with an arrow to the left.</p>',visual:INEQ('≥',-2,'Number line for x greater than or equal to minus 2'),
     example:{q:'Show x ≥ −2 and x < 3 on number lines.',steps:[{do:'x ≥ −2: filled circle at −2 (−2 is included), arrow to the right.',why:'≥ includes the number itself.'},{do:'x < 3: open circle at 3 (3 is not included), arrow to the left.'}]},
     mistake:'Using a filled circle for < or >. Filled circles are only for ≤ and ≥.',
     check:{q:'Which inequality has an OPEN circle at 4 and an arrow to the right?',o:['x > 4','x ≥ 4','x < 4'],a:0,why:'Open circle: 4 not included. Arrow right: greater than.',hint:'Open circle and pointing to bigger numbers.'}},
    {title:'Solving linear inequalities',explain:'<p>Here is some good news: you already know how to solve inequalities, because you solve them almost exactly like equations. Whatever you do to one side, you do to the other, and you undo operations until the letter is on its own.</p><p>There is just one twist, and it is important. If you multiply or divide both sides by a <strong>negative</strong> number, you must <strong>flip the inequality sign</strong>. Why? Try it with real numbers. We know 2 &lt; 5. Now multiply both sides by −1: we get −2 and −5. But −2 is to the right of −5 on the number line, so −2 &gt; −5. Multiplying by a negative flipped the order, so the sign has to flip too.</p><p>If you only add, subtract, or multiply and divide by positive numbers, the sign stays exactly as it is.</p>',
     example:{q:'The data plan: $500 fee plus $150 per GB, with $2,000 to spend. Write and solve an inequality.',steps:[{do:'Let g be the number of GB. Total cost: 500 + 150g ≤ 2,000.',why:'"At most $2,000" means ≤.'},{do:'Subtract 500 from both sides: 150g ≤ 1,500.'},{do:'Divide both sides by 150: g ≤ 10.'},{do:'So Tia can buy at most 10 GB. Was your prediction right?'}]},
     mistake:'Forgetting to reverse the sign when dividing by a negative: −2x < 6 gives x > −3, not x < −3.',
     check:{q:'Solve 3x − 5 < 13.',o:['x < 6','x > 6','x < 18'],a:0,why:'Add 5: 3x < 18. Divide by 3: x < 6.',hint:'Add 5 to both sides first.'}}]},{type:'recall',text:'500 + 150g ≤ 2,000 gives g ≤ 10, so Tia can buy at most 10 GB.'}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Dividing both sides of an inequality by a negative number reverses the sign.',a:'always',why:'For example, 2 < 4 but −1 > −2.'},{s:'x > 3 includes the number 3.',a:'never',why:'> does not include the end number.'},{s:'Adding the same number to both sides of an inequality keeps it true.',a:'always',why:'Shifting both sides by the same amount keeps their order.'},{s:'An inequality has exactly one solution.',a:'sometimes',why:'Usually there are infinitely many (x < 5), though in a limited set like the whole numbers, x < 1 has only 0.',hint:'Think about x < 5.'},{s:'Multiplying both sides of an inequality by 2 reverses the sign.',a:'never',why:'Only multiplying or dividing by a NEGATIVE reverses the sign.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jordan',q:'Solve −2x < 6.',lines:['Divide both sides by −2','x < −3'],wrong:1,reasons:['Dividing by a negative reverses the sign: x > −3','He should multiply by −2','He should add 2'],reason:0,fix:'x > −3.'},{who:'Tanya',q:'Make x the subject of y = 3x + 2.',lines:['Divide by 3: y/3 = x + 2','Subtract 2: x = y/3 − 2'],wrong:0,reasons:['She must subtract 2 first, then divide by 3','She should multiply by 3','She should add 2'],reason:0,fix:'y − 2 = 3x, so x = (y − 2)/3.'},{who:'Malik',q:'Show x ≤ 5 on a number line.',lines:['Open circle at 5','Arrow to the left'],wrong:0,reasons:['≤ includes 5, so the circle should be filled','The arrow should point right','The circle should be at 4'],reason:0,fix:'Filled circle at 5, arrow to the left.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire inequalities.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(2,6),x=R(1,9),b=R(1,9),c=a*x+b;return{q:'Solve '+a+'x + '+b+' < '+c+'.',o:['x < '+x,'x > '+x,'x < '+(x+b)],a:0,why:'Subtract '+b+', then divide by '+a+'.'}}if(r===1){var P=[['x < 4','open circle, arrow left'],['x ≥ 4','filled circle, arrow right'],['x > 4','open circle, arrow right'],['x ≤ 4','filled circle, arrow left']],p=P[R(0,3)],o=[p[1]],rest=P.filter(function(z){return z!==p}).map(function(z){return z[1]});o.push(rest[0],rest[1]);return{q:'How do you show '+p[0]+' on a number line?',o:o,a:0,why:'Open for < and >, filled for ≤ and ≥.'}}var a2=R(2,5),k=R(1,6),c2=-a2*k;return{q:'Solve −'+a2+'x < '+c2+'.',o:['x > '+k,'x < '+k,'x < −'+k],a:0,why:'Dividing by −'+a2+' reverses the sign.'}}}},

    {icon:'🚌',title:'Mission: the class trip budget',desc:'Plan a Grade 8 trip to Dunn\'s River Falls on a budget.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'A Grade 8 class is planning a trip to Dunn\'s River Falls. The bus costs $30,000, and each student\'s entry fee is $1,500. The class has raised $105,000.',parts:[{q:'Write the cost for s students and solve 30,000 + 1,500s ≤ 105,000. What is the greatest number of students who can go?',a:50,hint:'Subtract 30,000, then divide by 1,500.',sol:'1,500s ≤ 75,000, so s ≤ 50.'},{q:'The bus needs at least 20 students to run. Write the smallest number allowed.',a:20,hint:'"At least 20" means s ≥ 20.',sol:'s ≥ 20, so the smallest is 20.'},{q:'So the number of students must satisfy 20 ≤ s ≤ 50. How many different whole numbers of students are possible?',a:31,hint:'Count from 20 to 50, including both ends.',sol:'50 − 20 + 1 = 31.'},{q:'The cost formula is C = 30,000 + 1,500s. Make s the subject. If C = 81,000, how many students went?',a:34,hint:'s = (C − 30,000)/1,500.',sol:'(81,000 − 30,000) ÷ 1,500 = 34.'},{q:'The bus travels at an average speed v = d/t. The trip is 90 km and takes 2 hours. Find v in km/h.',a:45,hint:'90 ÷ 2.',sol:'45 km/h.',placeholder:'km/h'}],done:'You used inequalities, number ranges and changing the subject to plan a real class trip.'}}
