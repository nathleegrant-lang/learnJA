var ROUTE=function(b1,d1,b2,d2){var R=Math.PI/180,P=[0,0],Q=[d1*Math.sin(b1*R),d1*Math.cos(b1*R)],Rr=[Q[0]+d2*Math.sin(b2*R),Q[1]+d2*Math.cos(b2*R)],xs=[0,Q[0],Rr[0]],ys=[0,Q[1],Rr[1]],mnx=Math.min.apply(null,xs),mxx=Math.max.apply(null,xs),mny=Math.min.apply(null,ys),mxy=Math.max.apply(null,ys),sc=Math.min(300/Math.max(mxx-mnx,1),220/Math.max(mxy-mny,1)),X=function(x){return 50+(x-mnx)*sc},Y=function(y){return 270-(y-mny)*sc},v1=[P[0]-Q[0],P[1]-Q[1]],v2=[Rr[0]-Q[0],Rr[1]-Q[1]],ang=Math.acos((v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(v1[0],v1[1])*Math.hypot(v2[0],v2[1])))/R,pr=Math.hypot(Rr[0],Rr[1]),br=((Math.atan2(Rr[0],Rr[1])/R)+360)%360,home=(br+180)%360,s='<svg viewBox="0 0 400 300" role="img" aria-label="A two-leg boat journey from P to Q to R with North lines at P and Q"><rect width="400" height="300" fill="#eaf4fb"/>';[P,Q].forEach(function(p,i){s+='<line x1="'+X(p[0])+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+(Y(p[1])-45)+'" stroke="#3d2a73" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(X(p[0])-4)+'" y="'+(Y(p[1])-49)+'" font-size="12" font-weight="700">N</text>'});s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(Q[0])+'" y2="'+Y(Q[1])+'" stroke="#a85d00" stroke-width="3"/><line x1="'+X(Q[0])+'" y1="'+Y(Q[1])+'" x2="'+X(Rr[0])+'" y2="'+Y(Rr[1])+'" stroke="#a85d00" stroke-width="3"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(Rr[0])+'" y2="'+Y(Rr[1])+'" stroke="#c02d5f" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="'+X(0)+'" cy="'+Y(0)+'" r="5" fill="#3d2a73"/><text x="'+(X(0)-16)+'" y="'+(Y(0)+16)+'" font-size="13" font-weight="700">P (Port Royal)</text><text x="'+(X(Q[0])+6)+'" y="'+(Y(Q[1])-6)+'" font-size="13" font-weight="700">Q</text><text x="'+(X(Rr[0])+6)+'" y="'+(Y(Rr[1])+14)+'" font-size="13" font-weight="700">R</text></svg>';return{svg:s,ang:ang,pr:pr,br:br,home:home}};

b = 5 and C = 60°, then read the results.'}};draw();task()}},
    {type:'recall',text:'The boats are 7 km apart: c² = 8² + 5² − 2(8)(5) cos 60° = 64 + 25 − 40 = 49, so c = 7 km.'}]},
  {phase:'explain',name:'Teach: sine and cosine rules',title:'Learn: the sine rule and the cosine rule',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Side opposite angle: label dem careful.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Labelling, and the sine rule',explain:PIC('Two Coast Guard lighthouses, A and B, stand 10 km apart on a straight stretch of coast, with a guard watching from the top of each. A fishing boat C is in distress out at sea. Each guard measures the angle between the line of the coast and the direction of the boat. Being high up helps them SEE the boat, but the angle they measure is across the sea, so the triangle is drawn at sea level, with its corners at the towers. Now they know one side (AB = 10 km) and the two angles at its ends, so the triangle ABC is fixed. But it has no right angle, so SOH CAH TOA cannot be used directly. The sine rule is the tool for this.',SCN['Labelling, and the sine rule'])+'<p>SOH CAH TOA only works in right-angled triangles. For <strong>any</strong> triangle, we use two new rules. First, label the triangle carefully: the angles are capital letters A, B, C, and each side gets the small letter of the angle <strong>opposite</strong> it: side a is opposite angle A, and so on.</p><p>The {{sine rule|a/sin A = b/sin B = c/sin C}} says that each side divided by the sine of its opposite angle gives the same number:</p><p><strong>a/sin A = b/sin B = c/sin C</strong></p><p>Use it when you know a side <strong>and its opposite angle</strong>, plus one more side or angle. To find an angle, it is easier to flip it: sin A/a = sin B/b.</p>'+WHY('Why does a/sin A = b/sin B? Drop a perpendicular h from C to AB. It splits the triangle into two right triangles. In one, h = b sin A; in the other, h = a sin B. Both are the same height, so b sin A = a sin B, and dividing gives a/sin A = b/sin B. The sine rule is SOH CAH TOA used twice, on one shared height.')+WORK('<strong>Coast Guard and search-and-rescue teams</strong> locate a vessel from two lookouts in exactly this way (triangulation). <strong>Land surveyors</strong> fix boundary points from a measured baseline. The same idea is used to locate a radio signal or a lightning strike from two receiving stations.'),
     example:{q:'In triangle ABC, A = 40°, B = 75° and a = 10 cm. Find b.',steps:[{do:'Known pair: a = 10 with A = 40°. Want b, opposite B = 75°.'},{do:'b/sin 75° = 10/sin 40°.'},{do:'b = 10 sin 75° ÷ sin 40° ≈ 15.03 cm.'}]},
     mistake:'Using the sine rule without a matching side–angle pair. You need at least one side together with its OPPOSITE angle.',
     check:{q:'Which equation is the sine rule?',o:['a/sin A = b/sin B','a/sin B = b/sin A','a sin A = b sin B'],a:0,why:'Each side over the sine of its opposite angle.',hint:'Side over its own angle.'}},
    {title:'The cosine rule',explain:PIC('Two fishing boats leave Port Royal together. One sails 8 km and the other 5 km, and their courses are 60° apart. How far apart are they now? You know two sides and the angle BETWEEN them, but no side with its opposite angle, so the sine rule cannot start. The cosine rule can.',SCN['The cosine rule'])+'<p>When you know <strong>two sides and the angle between them</strong> (the {{included angle|the angle between two given sides}}), or <strong>all three sides</strong>, there is no matching side–angle pair, so use the {{cosine rule|a² = b² + c² − 2bc cos A}}:</p><p><strong>a² = b² + c² − 2bc cos A</strong></p><p>To find an <strong>angle</strong> from three sides, rearrange it: <strong>cos A = (b² + c² − a²) / 2bc</strong>.</p><p>Notice something lovely: if A = 90°, then cos A = 0, and the rule becomes a² = b² + c², which is Pythagoras! The cosine rule is Pythagoras with a correction for angles that are not right angles. You saw this in the solver.</p>'+WHY('The cosine rule a² = b² + c² − 2bc cos A is Pythagoras with a correction. If A = 90°, cos A = 0 and the correction disappears: a² = b² + c². If A is smaller than 90°, cos A is positive, so we subtract: the third side is SHORTER than Pythagoras gives (boats on close courses stay close together). If A is larger than 90°, cos A is negative, so we add: the third side is LONGER. It matches common sense: the wider the angle, the further apart.')+WORK('<strong>Air traffic controllers</strong> work out the distance between two aircraft from their radar distances and the angle between them. <strong>Engineers</strong> measure the distance across a gully or a lake from a point where both ends are visible. <strong>Carpenters</strong> build triangular roof trusses to exact lengths.'),visual:TRI(8,5,60,'The boats triangle: sides 8 and 5 with 60 degrees between them'),
     example:{q:'A triangle has sides 7 cm, 8 cm and 10 cm. Find the largest angle.',steps:[{do:'The largest angle is opposite the longest side, 10 cm.'},{do:'cos θ = (7² + 8² − 10²) ÷ (2 × 7 × 8) = 13 ÷ 112 ≈ 0.1161.'},{do:'θ = cos⁻¹(0.1161) ≈ 83.33°.'}]},
     mistake:'Forgetting the square root at the end. The cosine rule gives a², so take √ to find a.',
     check:{q:'Sides 6 and 4 with an included angle of 90°. The third side is…',o:['√52 ≈ 7.21','10','2'],a:0,why:'cos 90° = 0, so it is Pythagoras: √(36 + 16).',hint:'cos 90° = 0.'}},
    {title:'Choosing the right rule',explain:PIC('Think of a mechanic choosing a spanner: each tool fits a particular kind of bolt. The sine rule and the cosine rule each fit a particular kind of information. Before reaching for one, look at what you know.')+'<p>The first step in any non-right-angled triangle problem is to decide which rule to use. Ask: <strong>do I know a side together with its opposite angle?</strong></p><p><strong>Yes</strong> → use the <strong>sine rule</strong> (for example, two angles and a side, or two sides and a non-included angle).</p><p><strong>No</strong> → use the <strong>cosine rule</strong>: either two sides and the included angle (to find the third side), or three sides (to find an angle).</p><p>Often you use both: the cosine rule to find a side first, which then gives you a matching pair for the sine rule. And remember, the angles always add up to 180°, which can save a calculation.</p>'+WHY('The sine rule compares pairs: each side with its opposite angle. So it needs at least one COMPLETE pair to compare with. The cosine rule links all three sides with one angle, so it works when no complete pair is known: two sides with the angle between them, or all three sides.')+WORK('<strong>Engineers and surveyors</strong> always list the known measurements first, then choose the method. That habit (write down what you know, then decide) prevents most mistakes in this topic.'),
     example:{q:'You know sides b = 9, c = 12 and angle A = 50°. Which rule finds side a?',steps:[{do:'A is between b and c, so it is the included angle.'},{do:'There is no side–angle pair yet.'},{do:'Use the cosine rule: a² = 81 + 144 − 216 cos 50° ≈ 86.16, so a ≈ 9.28.'}]},
     mistake:'Reaching for the sine rule automatically. Check first: is there a known side opposite a known angle?',
     check:{q:'You know all three sides of a triangle. To find an angle, use…',o:['the cosine rule','the sine rule','SOH CAH TOA'],a:0,why:'No angle is known, so there is no matching pair.',hint:'No side–angle pair.'}}]}]},
  {phase:'explain',name:'Teach: area, segments and bearings',title:'Learn: area of a triangle, segments and bearings',lead:'Next, areas without a perpendicular height, and navigating with bearings.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Segment = sector minus triangle.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Area of a triangle: ½ab sin C',explain:PIC('A farmer in St. Elizabeth has a triangular field. She can walk along two fences with a measuring wheel, and measure the angle where they meet. But a pond sits in the middle, so she cannot measure the perpendicular height that ½ × base × height needs. The formula ½ab sin C finds the area anyway.',SCN['Area of a triangle: ½ab sin C'])+'<p>You know area = ½ × base × height. But often you do not know the perpendicular height. If you know <strong>two sides and the angle between them</strong>, use the {{area formula|area of a triangle = ½ab sin C}}:</p><p><strong>Area = ½ab sin C</strong></p><p>Why does it work? If side a is the base, the height is b sin C (from SOH: opposite = hypotenuse × sin). So ½ × base × height = ½ × a × b sin C.</p><p>The angle must be the <strong>included</strong> angle, the one between the two sides you use. For the boats: area = ½ × 8 × 5 × sin 60° ≈ 17.32 km².</p>'+WHY('Why ½ab sin C? Take side a as the base. The perpendicular height is opposite angle C in a right triangle with hypotenuse b, so height = b sin C (SOH). Then ½ × base × height = ½ × a × b sin C. Check: if C = 90°, sin C = 1, and it becomes the familiar ½ab for a right triangle.')+WORK('<strong>Farmers</strong> work out how much seed and fertilizer a field needs. <strong>Land surveyors and valuators</strong> price land per square metre. <strong>Roofers</strong> order sheeting for the triangular gable ends of a house.'),
     example:{q:'Find the area of a triangle with sides 12 cm and 9 cm and an included angle of 35°.',steps:[{do:'Area = ½ × 12 × 9 × sin 35°.'},{do:'= 54 × 0.5736.'},{do:'≈ 30.97 cm².'}]},
     mistake:'Using an angle that is not between the two sides. The angle must be the INCLUDED angle.',
     check:{q:'Sides 10 and 6 with an included angle of 30°. Area?',o:['15','30','60'],a:0,why:'½ × 10 × 6 × 0.5 = 15.',hint:'sin 30° = 0.5.'}},
    {title:'Area of a segment',explain:PIC('Picture a cylindrical water tank lying on its side, partly full. Look at its round end: the flat surface of the water is a straight line (a chord) across the circle, and the water below it fills a segment. To know how much water is left, you need the area of that segment.',SCN['Area of a segment'])+'<p>A {{sector|the region between two radii and an arc}} is a “slice” of a circle between two radii. A {{segment|the region between a chord and an arc}} is the region between a <strong>chord</strong> and the arc: like the crust end of the slice, with the triangle cut away.</p><p>So: <strong>area of segment = area of sector − area of triangle</strong>.</p><p>Sector area = (θ/360) × πr². Triangle area = ½r² sin θ (using ½ab sin C, where both sides are radii). Put together: segment = (θ/360)πr² − ½r² sin θ.</p>'+WHY('Why sector − triangle? The sector is the slice between two radii. It contains the triangle made by the two radii and the chord, plus the segment. Remove the triangle, and only the segment is left. Both parts come from earlier work: the sector from the fraction θ/360 of the circle, and the triangle from ½ab sin C with a = b = r.')+WORK('<strong>Plumbers and engineers</strong> work out the water in partly full pipes and tanks. <strong>Glaziers and welders</strong> cut arched windows and gate tops, whose shapes are segments of circles.'),visual:SEG,
     example:{q:'A circle has radius 10 cm. Find the area of the segment cut off by a chord that subtends 120° at the centre.',steps:[{do:'Sector: (120/360) × π × 100 ≈ 104.72 cm².'},{do:'Triangle: ½ × 10 × 10 × sin 120° ≈ 43.30 cm².'},{do:'Segment ≈ 104.72 − 43.30 = 61.42 cm².'}]},
     mistake:'Adding the triangle instead of subtracting it. The segment is what is LEFT when the triangle is removed from the sector.',
     check:{q:'Sector area 50 cm², triangle area 18 cm². Segment area?',o:['32 cm²','68 cm²','18 cm²'],a:0,why:'50 − 18.',hint:'Sector minus triangle.'}},
    {title:'Solving problems with bearings',explain:PIC('A fisherman sails from Port Royal on one bearing, then turns onto another. To get home safely, he needs the distance and the bearing back to port. The two legs and the way home make a triangle: draw it with a North line at every turning point.',SCN['Solving problems with bearings'])+'<p>{{Bearings|directions measured clockwise from North, with three figures}} are measured <strong>clockwise from North</strong> and written with three figures, such as 060°. The syllabus asks you to find the position of one point from another, and the bearing of one point from another.</p><p>A careful diagram is essential. <strong>1.</strong> Draw a North line at <strong>every</strong> point where a bearing is measured. <strong>2.</strong> Mark the bearings and distances. <strong>3.</strong> Use angle facts (co-interior angles between parallel North lines add to 180°) to find the angles inside the triangle. <strong>4.</strong> Use the sine or cosine rule.</p><p>The {{back bearing|the reverse bearing: add or subtract 180°}} for the return journey is the bearing ± 180°. If Q is on a bearing of 060° from P, then P is on a bearing of 240° from Q.</p>'+WHY('Why does a North line at each point help? All North lines are parallel. So the angle facts for parallel lines (co-interior angles add to 180°; alternate angles are equal) carry a bearing from one point to the next, and give the angle inside the triangle. And a back bearing differs by 180° because it is the same line, travelled in the opposite direction.')+WORK('<strong>The Coast Guard</strong> plots search patterns with bearings. <strong>Pilots and air traffic controllers</strong> fly and track routes by bearing. <strong>Surveyors</strong> record land boundaries as bearings and distances. <strong>Hikers</strong> on Blue Mountain trails use a compass bearing when the mist comes down.'),visual:BRG,
     example:{q:'A ship sails 20 km from P on a bearing of 060° to Q, then 15 km on a bearing of 150° to R. Find PR.',steps:[{do:'At Q, the back bearing to P is 240°. The angle PQR = 240° − 150° = 90°.'},{do:'Since angle Q = 90°, use Pythagoras (or the cosine rule): PR² = 20² + 15² = 625.'},{do:'PR = 25 km.'}]},
     mistake:'Forgetting to draw a North line at the second point. Each bearing is measured from ITS OWN North line.',
     check:{q:'B is on a bearing of 110° from A. What is the bearing of A from B?',o:['290°','070°','250°'],a:0,why:'110° + 180° = 290°.',hint:'Add 180°.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Give answers to 2 decimal places.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, the sine rule, the cosine rule and bearings decide where a rescue boat goes, how much fence a farmer buys, and whether a boat has enough fuel. Choose a job, sketch the situation, and make the decision.',
   mission:['Choose a job card.','Draw a quick sketch of the situation first, then work through the questions.','Complete any 3 jobs for a star. Complete all 4 to become a Maths at Work Champion.'],

   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'🛟',title:'Search and rescue: where is the boat?',desc:'Locate a boat in distress from two lookouts.',level:'⭐⭐⭐ Coast Guard',mins:8,block:{type:'mission',story:'Two Coast Guard lookouts, A and B, are 10 km apart on a straight coast. A boat in distress, C, is seen from A at an angle of 50° to the coast, and from B at an angle of 70° to the coast. The boat is taking on water and could sink in about 20 minutes.',parts:[{q:'What is angle ACB, at the boat? (degrees)',a:60,hint:'Angles in a triangle add to 180°.',sol:'180 − 50 − 70 = 60°.',placeholder:'degrees'},{q:'How far is the boat from A, to 2 decimal places? (km)',a:10.85,tol:0.01,hint:'Sine rule: AC = 10 sin 70° ÷ sin 60°.',sol:'≈ 10.85 km.',placeholder:'km'},{q:'How far is the boat from B, to 2 decimal places? (km)',a:8.85,tol:0.01,hint:'BC = 10 sin 50° ÷ sin 60°.',sol:'≈ 8.85 km.',placeholder:'km'},{q:'Which lookout should send its rescue boat? (Type A or B.)',a:['b'],hint:'The closer one.',sol:'B: about 2 km closer.'},{q:'The rescue boat travels at 30 km/h. How many minutes will it take from B, to 1 decimal place?',a:17.7,tol:0.1,hint:'Time = distance ÷ speed, then × 60.',sol:'8.85 ÷ 30 × 60 ≈ 17.7 minutes.',placeholder:'minutes'},{q:'Can it reach the boat before it sinks (in about 20 minutes)? (Type yes or no.)',a:['yes'],hint:'Compare 17.7 with 20.',sol:'Yes, with about 2 minutes to spare. Choosing lookout A would have taken over 21 minutes: too late.'}],done:'Two angles and one measured baseline located the boat, and the sine rule decided which rescue boat to send.'}},
    {icon:'🌾',title:'The farmer: fencing a field',desc:'Find the area and fencing for a triangular field.',level:'⭐⭐ Farming',mins:7,block:{type:'mission',story:'A farmer in St. Elizabeth has a triangular field. Two fences measure 80 m and 65 m, and the angle between them is 72°. She needs fertilizer (one bag covers 500 m²) and a new fence on all three sides (fencing is sold in 25 m rolls).',parts:[{q:'Find the area of the field, to 1 decimal place. (m²)',a:2472.7,tol:0.2,hint:'½ × 80 × 65 × sin 72°.',sol:'≈ 2,472.7 m².',placeholder:'m²'},{q:'How many bags of fertilizer must she buy?',a:5,hint:'2,472.7 ÷ 500, rounded UP.',sol:'4.95, so 5 bags.'},{q:'Find the length of the third side, to 2 decimal places. (m)',a:86.09,tol:0.01,hint:'Cosine rule: c² = 80² + 65² − 2(80)(65) cos 72°.',sol:'c² ≈ 7,411.2, so c ≈ 86.09 m.',placeholder:'m'},{q:'How many 25 m rolls of fencing does she need for all three sides?',a:10,hint:'Perimeter ≈ 231.09 m; divide by 25 and round UP.',sol:'231.09 ÷ 25 = 9.24, so 10 rolls.'},{q:'She already has 9 rolls. Is that enough? (Type yes or no.)',a:['no'],hint:'She needs 10.',sol:'No: she must buy one more roll.'}],done:'Without measuring a single height, the farmer knew how much fertilizer and fencing to buy.'}},
    {icon:'🎣',title:'The fisherman: enough fuel to get home?',desc:'Plan a fishing trip with bearings.',level:'⭐⭐⭐ Fishing',mins:8,block:{type:'mission',story:'A fisherman sails from Port Royal (P) 12 km on a bearing of 060° to Q, then 9 km on a bearing of 150° to his fishing ground R. His boat uses 1 litre of fuel for every 3 km, and he has 10 litres.',parts:[{q:'What is angle PQR? (degrees)',a:90,hint:'At Q, the bearing back to P is 240°. 240 − 150 = ?',sol:'90°.',placeholder:'degrees'},{q:'How far is R from Port Royal? (km)',a:15,hint:'Right angle at Q: Pythagoras (or the cosine rule).',sol:'√(12² + 9²) = 15 km.',placeholder:'km'},{q:'What bearing must he sail to return home from R, to 1 decimal place?',a:276.9,tol:0.06,hint:'Angle QPR = tan⁻¹(9 ÷ 12) ≈ 36.9°, so R is on 096.9° from P. Add 180°.',sol:'≈ 276.9°.',placeholder:'degrees'},{q:'How many litres of fuel does the whole trip (out and home) need?',a:12,hint:'12 + 9 + 15 = 36 km; ÷ 3.',sol:'12 litres.',placeholder:'litres'},{q:'He has 10 litres. Is that enough? (Type yes or no.)',a:['no'],hint:'Compare 12 with 10.',sol:'No: he must buy at least 2 more litres before setting out, or he could be stranded at sea.'}],done:'The bearings and the triangle told the fisherman his way home, and whether he could make it.'}},
    {icon:'🚰',title:'The plumber: how much water is left?',desc:'Find the water in a tank lying on its side.',level:'⭐⭐⭐ Plumbing',mins:8,block:{type:'mission',story:'A cylindrical water tank lies on its side. It has radius 1 m and length 3 m. Looking at its round end, the water’s surface is a chord that subtends 120° at the centre, and the water fills the minor segment below it. A family uses about 150 litres a day.',parts:[{q:'Find the area of the sector, to 3 decimal places. (m²)',a:1.047,tol:0.002,hint:'(120/360) × π × 1².',sol:'≈ 1.047 m².',placeholder:'m²'},{q:'Find the area of the triangle, to 3 decimal places. (m²)',a:0.433,tol:0.002,hint:'½ × 1 × 1 × sin 120°.',sol:'≈ 0.433 m².',placeholder:'m²'},{q:'Find the area of the water segment, to 3 decimal places. (m²)',a:0.614,tol:0.002,hint:'Sector − triangle.',sol:'≈ 0.614 m².',placeholder:'m²'},{q:'How many litres of water are in the tank, to the nearest litre? (1 m³ = 1,000 litres)',a:1843,tol:2,hint:'Keep full accuracy: 0.6142 × 3 m long ≈ 1.843 m³.',sol:'≈ 1,843 litres.',placeholder:'litres'},{q:'Will the water last the family two weeks (14 days)? (Type yes or no.)',a:['no'],hint:'1,843 ÷ 150 ≈ 12.3 days.',sol:'No: only about 12 days. They should arrange a refill.'}],done:'The segment of a circle told the family how many days of water they had left.'}}

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The cosine rule becomes Pythagoras when the angle is 90°.',a:'always',why:'cos 90° = 0.'},{s:'The largest angle is opposite the longest side.',a:'always',why:'Bigger angles face longer sides.'},{s:'cos A is negative.',a:'sometimes',why:'Only when A is obtuse (between 90° and 180°).'},{s:'½ab sin C works with any angle of the triangle.',a:'never',why:'C must be the angle BETWEEN sides a and b.'},{s:'A back bearing is the bearing plus 180°.',a:'sometimes',why:'Add 180° if the bearing is less than 180°; otherwise subtract 180°.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'b = 5, c = 7, A = 60°. Find a.',lines:['a² = 25 + 49 − 70 cos 60° = 39','a = 39'],wrong:1,reasons:['He forgot the square root: a = √39 ≈ 6.24','a should be 74','a should be 19.5'],reason:0,fix:'a ≈ 6.24.'},{who:'Tia',q:'Sides 8 and 6; the angle opposite the 6 is 40°. Area?',lines:['Area = ½ × 8 × 6 × sin 40°'],wrong:0,reasons:['40° is not the angle BETWEEN the sides 8 and 6, so the formula cannot be used directly','The answer should use cos 40°','The answer is ½ × 8 × 6'],reason:0,fix:'First find the included angle, then use ½ab sin C.'},{who:'Omar',q:'Q is on a bearing of 250° from P. Bearing of P from Q?',lines:['250° + 180° = 430°'],wrong:0,reasons:['Bearings are less than 360°: subtract 180° to get 070°','The answer is 250°','The answer is 110°'],reason:0,fix:'070°.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire rules and bearings.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var b=R(10,350);var bb=b<180?b+180:b-180,p=function(n){return('00'+n).slice(-3)+'°'};return{q:'Back bearing of '+p(b)+'?',o:[p(bb),p((b+90)%360),p(360-b===bb?(b+45)%360:360-b)],a:0,why:'± 180°.'}}if(r===1){var a=R(4,12)*2,c=R(3,10);return{q:'Sides '+a+' and '+c+', included angle 30°. Area?',o:[fr(a*c/4),fr(a*c/2),fr(a*c)],a:0,why:'½ × '+a+' × '+c+' × 0.5.'}}var Q=[['Two angles and a side','sine rule'],['Two sides and the included angle','cosine rule'],['Three sides, find an angle','cosine rule'],['A side, its opposite angle, and another angle','sine rule']],q=Q[R(0,3)];return{q:q[0]+': which rule?',o:[q[1],q[1]==='sine rule'?'cosine rule':'sine rule','SOH CAH TOA'],a:0,why:'Is there a side–angle pair?'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent triangles that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Two sides are 10 and 8. What included angle gives the largest possible area?',placeholder:'degrees',check:function(v){return parseFloat(v)===90?{ok:true,msg:'Yes! sin 90° = 1 is the largest value of sine, so the area is 40.'}:{ok:false,msg:'Which angle makes sin C as large as possible?'}}},{q:'In triangle ABC, A = 30° and B = 45°. What is angle C?',placeholder:'degrees',check:function(v){return parseFloat(v)===105?{ok:true,msg:'Correct! 180 − 30 − 45.'}:{ok:false,msg:'Angles in a triangle add up to 180°.'}}},{q:'Q is on a bearing of 090° from P (due East). What is the bearing of P from Q?',placeholder:'degrees',check:function(v){return parseFloat(String(v).replace('°',''))===270?{ok:true,msg:'Yes! Due West: 270°.'}:{ok:false,msg:'Add 180°.'}}}]}},
    {icon:'⛵',title:'Mission: the regatta course',desc:'Plan a sailing regatta course off Port Royal.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A sailing club plans a triangular regatta course off Port Royal. From the start P, boats sail 12 km on a bearing of 040° to buoy Q, then 9 km to buoy R, where angle PQR = 70°. Give answers to 2 decimal places.',parts:[{q:'Use the cosine rule to find PR, the length of the final leg. (km)',a:12.29,tol:0.02,hint:'PR² = 12² + 9² − 2(12)(9) cos 70°.',sol:'PR² = 144 + 81 − 216 × 0.3420 ≈ 151.12, so PR ≈ 12.29 km.',placeholder:'km'},{q:'What is the area of the triangle enclosed by the course? (km²)',a:50.74,tol:0.02,hint:'½ × 12 × 9 × sin 70°.',sol:'≈ 50.74 km².',placeholder:'km²'},{q:'What is the bearing of P from Q? (degrees)',a:220,hint:'040° + 180°.',sol:'220°.',placeholder:'degrees'},{q:'A marker buoy sits on a circle of radius 2 km around Q. What is the area of the segment cut off by a chord subtending 90° at Q? (km²)',a:1.14,tol:0.01,hint:'π − 2.',sol:'Sector π ≈ 3.14, triangle 2, so ≈ 1.14 km².',placeholder:'km²'},{q:'Use the sine rule to find angle QPR. (degrees, 1 d.p.) Use PR = 12.29 km.',a:43.5,tol:0.2,hint:'sin P = 9 sin 70° ÷ 12.29.',sol:'sin P ≈ 0.688, so P ≈ 43.5°.',placeholder:'degrees'}],done:'You used the cosine rule, sine rule, triangle and segment areas and bearings to plan a real course.'}}
