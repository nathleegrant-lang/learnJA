var TRI=function(a,b,C,lbl){var c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(C*DG)),P={x:0,y:0},Q={x:a,y:0},R={x:b*Math.cos(C*DG),y:b*Math.sin(C*DG)},xs=[P.x,Q.x,R.x],ys=[P.y,Q.y,R.y],minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),maxy=Math.max.apply(null,ys),sc=Math.min(400/(maxx-minx),190/Math.max(maxy,1)),X=function(x){return 60+(x-minx)*sc},Y=function(y){return 240-y*sc},s='<svg viewBox="0 0 540 280" role="img" aria-label="'+(lbl||'Triangle with sides a = '+a+', b = '+b+' and included angle C = '+C+' degrees')+'"><rect width="540" height="280" fill="#faf8fe"/><polygon points="'+X(P.x)+','+Y(P.y)+' '+X(Q.x)+','+Y(Q.y)+' '+X(R.x)+','+Y(R.y)+'" fill="#e4ecfb" stroke="#2f5fc4" stroke-width="3"/>';s+='<text x="'+(X(P.x)-14)+'" y="'+(Y(P.y)+18)+'" font-size="15" font-weight="700" fill="#3d2a73">C</text><text x="'+(X(Q.x)+6)+'" y="'+(Y(Q.y)+18)+'" font-size="15" font-weight="700" fill="#3d2a73">B</text><text x="'+(X(R.x)-4)+'" y="'+(Y(R.y)-10)+'" font-size="15" font-weight="700" fill="#3d2a73">A</text><text x="'+((X(P.x)+X(Q.x))/2)+'" y="'+(Y(0)+20)+'" text-anchor="middle" font-size="13" fill="#2f5fc4">a = '+a+'</text><text x="'+((X(P.x)+X(R.x))/2-16)+'" y="'+((Y(P.y)+Y(R.y))/2)+'" text-anchor="end" font-size="13" fill="#2f5fc4">b = '+b+'</text><text x="'+((X(Q.x)+X(R.x))/2+10)+'" y="'+((Y(Q.y)+Y(R.y))/2)+'" font-size="13" fill="#c02d5f">c = '+fr(c)+'</text><path d="M'+(X(P.x)+30)+' '+Y(0)+' A30 30 0 0 0 '+(X(P.x)+30*Math.cos(C*DG))+' '+(Y(0)-30*Math.sin(C*DG))+'" fill="none" stroke="#a85d00" stroke-width="2.5"/><text x="'+(X(P.x)+36)+'" y="'+(Y(0)-8)+'" font-size="12" font-weight="700" fill="#7a4300">'+C+'°</text>';return s+'</svg>'};

   blocks:[{type:'mcq',star:true,questions:[{q:'What is sin 30°?',o:['0.5','0.866','1'],a:0,why:'A standard value.',teach:'sin 30° = 0.5. If your calculator gives −0.988, it is in radian mode.'},{q:'What is cos 120°?',o:['−0.5','0.5','−0.866'],a:0,why:'Cosine is negative for obtuse angles.',teach:'cos 120° = −0.5. Cosine is negative for angles between 90° and 180°.'},{q:'The angles of a triangle add up to…',o:['180°','360°','90°'],a:0,why:'Angle sum.',teach:'The interior angles of any triangle add up to 180°.'},{q:'Area of a sector with radius 6 and angle 60°?',o:['6π ≈ 18.85','36π','12π'],a:0,why:'60/360 × π × 36.',teach:'Sector area = (θ/360) × πr² = (60/360) × π × 36 = 6π.'}]}]},
  {phase:'explore',name:'Triangle solver',title:'Explore: the triangle solver',lead:'Set two sides, a and b, and the angle C between them. The solver uses the cosine rule to find side c, the area formula for the area, and the sine rule for the other angles.',
   mission:['Change the angle C. Watch side c and the area.','Set C = 90°. What does the cosine rule become?','Complete all 3 challenges for a star.'],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="tsA">a:</label><input type="range" id="tsA" min="3" max="12" value="8"><output class="big tsAO"></output><label for="tsB">b:</label><input type="range" id="tsB" min="3" max="12" value="5"><output class="big tsBO"></output><label for="tsC">C (°):</label><input type="range" id="tsC" min="20" max="150" value="60"><output class="big tsCO"></output></div><div class="scene tsSvg"></div><div class="tile tsOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge tsN"></span> <strong class="tsQ"></strong></p><div class="controls"><input type="number" step="0.01" class="tsIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go tsGo">Check</button></div><div class="fb tsFb" aria-live="polite">Use the solver to help you.</div></div>',
     init:function(box,api){var A=box.querySelector('#tsA'),B=box.querySelector('#tsB'),C=box.querySelector('#tsC');[A,B,C].forEach(function(e){api.nudges(e)});function draw(){var a=+A.value,b=+B.value,Cc=+C.value,c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(Cc*DG)),area=0.5*a*b*Math.sin(Cc*DG),cosA=(b*b+c*c-a*a)/(2*b*c),Aa=Math.acos(Math.max(-1,Math.min(1,cosA)))/DG,Bb=180-Cc-Aa;box.querySelector('.tsAO').textContent=a;box.querySelector('.tsBO').textContent=b;box.querySelector('.tsCO').textContent=Cc+'°';box.querySelector('.tsSvg').innerHTML=TRI(a,b,Cc);box.querySelector('.tsOut').innerHTML='<strong>Cosine rule:</strong> c² = '+a+'² + '+b+'² − 2('+a+')('+b+') cos '+Cc+'° = '+fr(c*c)+', so <strong>c = '+fr(c)+'</strong>'+(Cc===90?' (with C = 90°, cos 90° = 0, so this is just Pythagoras!)':'')+'<br><strong>Area</strong> = ½('+a+')('+b+') sin '+Cc+'° = <strong>'+fr(area)+'</strong><br><strong>Other angles</strong> (sine or cosine rule): A ≈ '+fr(Aa)+'°, B ≈ '+fr(Bb)+'° (check: '+fr(Aa)+' + '+fr(Bb)+' + '+Cc+' = 180)'}[A,B,C].forEach(function(e){e.addEventListener('input',draw)});var Q=[{t:'a = 8, b = 5, C = 60°. What is side c?',a:7},{t:'a = 8, b = 5, C = 60°. What is the area, to 2 decimal places?',a:17.32},{t:'a = 8, b = 5, C = 60°. What is angle A, to 2 decimal places? (degrees)',a:81.79}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.tsN').textContent='All done';box.querySelector('.tsQ').textContent='You completed every challenge!';box.querySelector('.tsGo').disabled=true;return}box.querySelector('.tsN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.tsQ').textContent=Q[q].t}box.querySelector('.tsGo').onclick=function(){var v=parseFloat(box.querySelector('.tsIn').value),fb=box.querySelector('.tsFb');if(Math.abs(v-Q[q].a)<0.015){fb.className='fb ok tsFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.tsIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no tsFb';fb.textContent='Not yet. Set a = 8, b = 5 and C = 60°, then read the results.'}};draw();task()}},
    {type:'recall',text:'The boats are 7 km apart: c² = 8² + 5² − 2(8)(5) cos 60° = 64 + 25 − 40 = 49, so c = 7 km.'}]},
  {phase:'explain',name:'Teach: sine and cosine rules',title:'Learn: the sine rule and the cosine rule',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Side opposite angle: label dem careful.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Labelling, and the sine rule',explain:'<p>SOH CAH TOA only works in right-angled triangles. For <strong>any</strong> triangle, we use two new rules. First, label the triangle carefully: the angles are capital letters A, B, C, and each side gets the small letter of the angle <strong>opposite</strong> it: side a is opposite angle A, and so on.</p><p>The {{sine rule|a/sin A = b/sin B = c/sin C}} says that each side divided by the sine of its opposite angle gives the same number:</p><p><strong>a/sin A = b/sin B = c/sin C</strong></p><p>Use it when you know a side <strong>and its opposite angle</strong>, plus one more side or angle. To find an angle, it is easier to flip it: sin A/a = sin B/b.</p>',
     example:{q:'In triangle ABC, A = 40°, B = 75° and a = 10 cm. Find b.',steps:[{do:'Known pair: a = 10 with A = 40°. Want b, opposite B = 75°.'},{do:'b/sin 75° = 10/sin 40°.'},{do:'b = 10 sin 75° ÷ sin 40° ≈ 15.03 cm.'}]},
     mistake:'Using the sine rule without a matching side–angle pair. You need at least one side together with its OPPOSITE angle.',
     check:{q:'Which equation is the sine rule?',o:['a/sin A = b/sin B','a/sin B = b/sin A','a sin A = b sin B'],a:0,why:'Each side over the sine of its opposite angle.',hint:'Side over its own angle.'}},
    {title:'The cosine rule',explain:'<p>When you know <strong>two sides and the angle between them</strong> (the {{included angle|the angle between two given sides}}), or <strong>all three sides</strong>, there is no matching side–angle pair, so use the {{cosine rule|a² = b² + c² − 2bc cos A}}:</p><p><strong>a² = b² + c² − 2bc cos A</strong></p><p>To find an <strong>angle</strong> from three sides, rearrange it: <strong>cos A = (b² + c² − a²) / 2bc</strong>.</p><p>Notice something lovely: if A = 90°, then cos A = 0, and the rule becomes a² = b² + c², which is Pythagoras! The cosine rule is Pythagoras with a correction for angles that are not right angles. You saw this in the solver.</p>',visual:TRI(8,5,60,'The boats triangle: sides 8 and 5 with 60 degrees between them'),
     example:{q:'A triangle has sides 7 cm, 8 cm and 10 cm. Find the largest angle.',steps:[{do:'The largest angle is opposite the longest side, 10 cm.'},{do:'cos θ = (7² + 8² − 10²) ÷ (2 × 7 × 8) = 13 ÷ 112 ≈ 0.1161.'},{do:'θ = cos⁻¹(0.1161) ≈ 83.33°.'}]},
     mistake:'Forgetting the square root at the end. The cosine rule gives a², so take √ to find a.',
     check:{q:'Sides 6 and 4 with an included angle of 90°. The third side is…',o:['√52 ≈ 7.21','10','2'],a:0,why:'cos 90° = 0, so it is Pythagoras: √(36 + 16).',hint:'cos 90° = 0.'}},
    {title:'Choosing the right rule',explain:'<p>The first step in any non-right-angled triangle problem is to decide which rule to use. Ask: <strong>do I know a side together with its opposite angle?</strong></p><p><strong>Yes</strong> → use the <strong>sine rule</strong> (for example, two angles and a side, or two sides and a non-included angle).</p><p><strong>No</strong> → use the <strong>cosine rule</strong>: either two sides and the included angle (to find the third side), or three sides (to find an angle).</p><p>Often you use both: the cosine rule to find a side first, which then gives you a matching pair for the sine rule. And remember, the angles always add up to 180°, which can save a calculation.</p>',
     example:{q:'You know sides b = 9, c = 12 and angle A = 50°. Which rule finds side a?',steps:[{do:'A is between b and c, so it is the included angle.'},{do:'There is no side–angle pair yet.'},{do:'Use the cosine rule: a² = 81 + 144 − 216 cos 50° ≈ 86.16, so a ≈ 9.28.'}]},
     mistake:'Reaching for the sine rule automatically. Check first: is there a known side opposite a known angle?',
     check:{q:'You know all three sides of a triangle. To find an angle, use…',o:['the cosine rule','the sine rule','SOH CAH TOA'],a:0,why:'No angle is known, so there is no matching pair.',hint:'No side–angle pair.'}}]}]},
  {phase:'explain',name:'Teach: area, segments and bearings',title:'Learn: area of a triangle, segments and bearings',lead:'Next, areas without a perpendicular height, and navigating with bearings.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Segment = sector minus triangle.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Area of a triangle: ½ab sin C',explain:'<p>You know area = ½ × base × height. But often you do not know the perpendicular height. If you know <strong>two sides and the angle between them</strong>, use the {{area formula|area of a triangle = ½ab sin C}}:</p><p><strong>Area = ½ab sin C</strong></p><p>Why does it work? If side a is the base, the height is b sin C (from SOH: opposite = hypotenuse × sin). So ½ × base × height = ½ × a × b sin C.</p><p>The angle must be the <strong>included</strong> angle, the one between the two sides you use. For the boats: area = ½ × 8 × 5 × sin 60° ≈ 17.32 km².</p>',
     example:{q:'Find the area of a triangle with sides 12 cm and 9 cm and an included angle of 35°.',steps:[{do:'Area = ½ × 12 × 9 × sin 35°.'},{do:'= 54 × 0.5736.'},{do:'≈ 30.97 cm².'}]},
     mistake:'Using an angle that is not between the two sides. The angle must be the INCLUDED angle.',
     check:{q:'Sides 10 and 6 with an included angle of 30°. Area?',o:['15','30','60'],a:0,why:'½ × 10 × 6 × 0.5 = 15.',hint:'sin 30° = 0.5.'}},
    {title:'Area of a segment',explain:'<p>A {{sector|the region between two radii and an arc}} is a “slice” of a circle between two radii. A {{segment|the region between a chord and an arc}} is the region between a <strong>chord</strong> and the arc: like the crust end of the slice, with the triangle cut away.</p><p>So: <strong>area of segment = area of sector − area of triangle</strong>.</p><p>Sector area = (θ/360) × πr². Triangle area = ½r² sin θ (using ½ab sin C, where both sides are radii). Put together: segment = (θ/360)πr² − ½r² sin θ.</p>',visual:SEG,
     example:{q:'A circle has radius 10 cm. Find the area of the segment cut off by a chord that subtends 120° at the centre.',steps:[{do:'Sector: (120/360) × π × 100 ≈ 104.72 cm².'},{do:'Triangle: ½ × 10 × 10 × sin 120° ≈ 43.30 cm².'},{do:'Segment ≈ 104.72 − 43.30 = 61.42 cm².'}]},
     mistake:'Adding the triangle instead of subtracting it. The segment is what is LEFT when the triangle is removed from the sector.',
     check:{q:'Sector area 50 cm², triangle area 18 cm². Segment area?',o:['32 cm²','68 cm²','18 cm²'],a:0,why:'50 − 18.',hint:'Sector minus triangle.'}},
    {title:'Solving problems with bearings',explain:'<p>{{Bearings|directions measured clockwise from North, with three figures}} are measured <strong>clockwise from North</strong> and written with three figures, such as 060°. The syllabus asks you to find the position of one point from another, and the bearing of one point from another.</p><p>A careful diagram is essential. <strong>1.</strong> Draw a North line at <strong>every</strong> point where a bearing is measured. <strong>2.</strong> Mark the bearings and distances. <strong>3.</strong> Use angle facts (co-interior angles between parallel North lines add to 180°) to find the angles inside the triangle. <strong>4.</strong> Use the sine or cosine rule.</p><p>The {{back bearing|the reverse bearing: add or subtract 180°}} for the return journey is the bearing ± 180°. If Q is on a bearing of 060° from P, then P is on a bearing of 240° from Q.</p>',visual:BRG,
     example:{q:'A ship sails 20 km from P on a bearing of 060° to Q, then 15 km on a bearing of 150° to R. Find PR.',steps:[{do:'At Q, the back bearing to P is 240°. The angle PQR = 240° − 150° = 90°.'},{do:'Since angle Q = 90°, use Pythagoras (or the cosine rule): PR² = 20² + 15² = 625.'},{do:'PR = 25 km.'}]},
     mistake:'Forgetting to draw a North line at the second point. Each bearing is measured from ITS OWN North line.',
     check:{q:'B is on a bearing of 110° from A. What is the bearing of A from B?',o:['290°','070°','250°'],a:0,why:'110° + 180° = 290°.',hint:'Add 180°.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Give answers to 2 decimal places.',

   blocks:[{type:'facts',facts:[{title:'Sine rule',text:'a/sin A = b/sin B = c/sin C. Needs a side WITH its opposite angle.'},{title:'Cosine rule',text:'a² = b² + c² − 2bc cos A (two sides + included angle). cos A = (b² + c² − a²)/2bc (three sides).'},{title:'Areas',text:'Triangle = ½ab sin C (included angle). Segment = sector − triangle = (θ/360)πr² − ½r² sin θ.'},{title:'Bearings',text:'Clockwise from North, three figures. North line at every point. Back bearing = ± 180°.'}]},
    {type:'guided',star:true,items:[

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The cosine rule becomes Pythagoras when the angle is 90°.',a:'always',why:'cos 90° = 0.'},{s:'The largest angle is opposite the longest side.',a:'always',why:'Bigger angles face longer sides.'},{s:'cos A is negative.',a:'sometimes',why:'Only when A is obtuse (between 90° and 180°).'},{s:'½ab sin C works with any angle of the triangle.',a:'never',why:'C must be the angle BETWEEN sides a and b.'},{s:'A back bearing is the bearing plus 180°.',a:'sometimes',why:'Add 180° if the bearing is less than 180°; otherwise subtract 180°.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'b = 5, c = 7, A = 60°. Find a.',lines:['a² = 25 + 49 − 70 cos 60° = 39','a = 39'],wrong:1,reasons:['He forgot the square root: a = √39 ≈ 6.24','a should be 74','a should be 19.5'],reason:0,fix:'a ≈ 6.24.'},{who:'Tia',q:'Sides 8 and 6; the angle opposite the 6 is 40°. Area?',lines:['Area = ½ × 8 × 6 × sin 40°'],wrong:0,reasons:['40° is not the angle BETWEEN the sides 8 and 6, so the formula cannot be used directly','The answer should use cos 40°','The answer is ½ × 8 × 6'],reason:0,fix:'First find the included angle, then use ½ab sin C.'},{who:'Omar',q:'Q is on a bearing of 250° from P. Bearing of P from Q?',lines:['250° + 180° = 430°'],wrong:0,reasons:['Bearings are less than 360°: subtract 180° to get 070°','The answer is 250°','The answer is 110°'],reason:0,fix:'070°.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire rules and bearings.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var b=R(10,350);var bb=b<180?b+180:b-180,p=function(n){return('00'+n).slice(-3)+'°'};return{q:'Back bearing of '+p(b)+'?',o:[p(bb),p((b+90)%360),p(360-b===bb?(b+45)%360:360-b)],a:0,why:'± 180°.'}}if(r===1){var a=R(4,12)*2,c=R(3,10);return{q:'Sides '+a+' and '+c+', included angle 30°. Area?',o:[fr(a*c/4),fr(a*c/2),fr(a*c)],a:0,why:'½ × '+a+' × '+c+' × 0.5.'}}var Q=[['Two angles and a side','sine rule'],['Two sides and the included angle','cosine rule'],['Three sides, find an angle','cosine rule'],['A side, its opposite angle, and another angle','sine rule']],q=Q[R(0,3)];return{q:q[0]+': which rule?',o:[q[1],q[1]==='sine rule'?'cosine rule':'sine rule','SOH CAH TOA'],a:0,why:'Is there a side–angle pair?'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent triangles that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Two sides are 10 and 8. What included angle gives the largest possible area?',placeholder:'degrees',check:function(v){return parseFloat(v)===90?{ok:true,msg:'Yes! sin 90° = 1 is the largest value of sine, so the area is 40.'}:{ok:false,msg:'Which angle makes sin C as large as possible?'}}},{q:'In triangle ABC, A = 30° and B = 45°. What is angle C?',placeholder:'degrees',check:function(v){return parseFloat(v)===105?{ok:true,msg:'Correct! 180 − 30 − 45.'}:{ok:false,msg:'Angles in a triangle add up to 180°.'}}},{q:'Q is on a bearing of 090° from P (due East). What is the bearing of P from Q?',placeholder:'degrees',check:function(v){return parseFloat(String(v).replace('°',''))===270?{ok:true,msg:'Yes! Due West: 270°.'}:{ok:false,msg:'Add 180°.'}}}]}},
    {icon:'⛵',title:'Mission: the regatta course',desc:'Plan a sailing regatta course off Port Royal.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A sailing club plans a triangular regatta course off Port Royal. From the start P, boats sail 12 km on a bearing of 040° to buoy Q, then 9 km to buoy R, where angle PQR = 70°. Give answers to 2 decimal places.',parts:[{q:'Use the cosine rule to find PR, the length of the final leg. (km)',a:12.29,tol:0.02,hint:'PR² = 12² + 9² − 2(12)(9) cos 70°.',sol:'PR² = 144 + 81 − 216 × 0.3420 ≈ 151.12, so PR ≈ 12.29 km.',placeholder:'km'},{q:'What is the area of the triangle enclosed by the course? (km²)',a:50.74,tol:0.02,hint:'½ × 12 × 9 × sin 70°.',sol:'≈ 50.74 km².',placeholder:'km²'},{q:'What is the bearing of P from Q? (degrees)',a:220,hint:'040° + 180°.',sol:'220°.',placeholder:'degrees'},{q:'A marker buoy sits on a circle of radius 2 km around Q. What is the area of the segment cut off by a chord subtending 90° at Q? (km²)',a:1.14,tol:0.01,hint:'π − 2.',sol:'Sector π ≈ 3.14, triangle 2, so ≈ 1.14 km².',placeholder:'km²'},{q:'Use the sine rule to find angle QPR. (degrees, 1 d.p.) Use PR = 12.29 km.',a:43.5,tol:0.2,hint:'sin P = 9 sin 70° ÷ 12.29.',sol:'sin P ≈ 0.688, so P ≈ 43.5°.',placeholder:'degrees'}],done:'You used the cosine rule, sine rule, triangle and segment areas and bearings to plan a real course.'}}
