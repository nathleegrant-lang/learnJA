     init:function(box,api){var B=box.querySelector('#fxB'),C=box.querySelector('#fxC');api.nudges(B);api.nudges(C);function draw(){var b=+B.value,c=+C.value,rows=[],win=null;box.querySelector('.fxBO').textContent=ff(b);box.querySelector('.fxCO').textContent=ff(c);box.querySelector('.fxE').textContent=TRI(b,c);if(c===0){box.querySelector('.fxT').innerHTML='';box.querySelector('.fxSvg').innerHTML='';box.querySelector('.fxX').innerHTML='When c = 0, take out the common factor x: x² '+(b<0?'− '+(-b):'+ '+b)+'x = x(x '+(b<0?'− '+(-b):'+ '+b)+').';return}for(var p=-Math.abs(c);p<=Math.abs(c);p++){if(p===0||c%p!==0)continue;var q=c/p;if(p>q)continue;var ok=p+q===b;rows.push('<tr'+(ok?' style="font-weight:700;background:#dcf3ee"':'')+'><td>'+ff(p)+' and '+ff(q)+'</td><td>'+ff(p*q)+'</td><td>'+ff(p+q)+(ok?' ✓':'')+'</td></tr>');if(ok)win=[p,q]}box.querySelector('.fxT').innerHTML='<thead><tr><th>Pair</th><th>Product (must be '+ff(c)+')</th><th>Sum (must be '+ff(b)+')</th></tr></thead><tbody>'+rows.join('')+'</tbody>';if(win){box.querySelector('.fxSvg').innerHTML=AREA2(win[0],win[1]);box.querySelector('.fxX').innerHTML='The pair <strong>'+ff(win[0])+' and '+ff(win[1])+'</strong> works. So '+TRI(b,c)+' = <strong>'+BR(win[0])+BR(win[1])+'</strong>. Check by expanding: the four pieces of the rectangle add back to '+TRI(b,c)+'.'}else{box.querySelector('.fxSvg').innerHTML='';box.querySelector('.fxX').innerHTML='No pair of whole numbers works, so '+TRI(b,c)+' cannot be factorised with whole numbers. (You will meet the quadratic formula for these.)'}}B.addEventListener('input',draw);C.addEventListener('input',draw);var T=[{t:'Factorise x² + 7x + 12.',a:[3,4]},{t:'Factorise x² − x − 6.',a:[-3,2]},{t:'Factorise x² − 9. (Hint: b = 0.)',a:[-3,3]}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.fxN').textContent='All done';box.querySelector('.fxQ').textContent='You completed every challenge!';box.querySelector('.fxGo').disabled=true;return}box.querySelector('.fxN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.fxQ').textContent=T[q].t}box.querySelector('.fxGo').onclick=function(){var p=PAIRS(box.querySelector('.fxA').value),fb=box.querySelector('.fxFb');if(p&&p[0]===T[q].a[0]&&p[1]===T[q].a[1]){fb.className='fb ok fxFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.fxA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no fxFb';fb.textContent=p?'Not quite. Set b and c to match, and read the winning pair.':'Type it like (x+3)(x−2).'}};draw();task()}},

  {phase:'explain',name:'Teach: expanding and simple factorising',title:'Learn: expanding, common factors, grouping and the difference of two squares',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Factorise a di opposite a expand.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Expanding with the distributive law',explain:'<p>To {{expand|multiply out brackets}} means to multiply out the brackets, using the distributive law: <strong>x(a + b) = ax + bx</strong>. The term outside multiplies every term inside.</p><p>For two brackets, every term in the first bracket multiplies every term in the second: <strong>(a + b)(x + y) = ax + ay + bx + by</strong>. With quadratics, collect the like terms afterwards: (x + 3)(x − 5) = x² − 5x + 3x − 15 = x² − 2x − 15.</p><p>The area model shows why: a rectangle with sides (x + 3) and (x − 5) splits into four pieces, and the area is the sum of all four.</p>',visual:AREA2(3,4),
     example:{q:'Expand (2x − 1)(x + 4).',steps:[{do:'2x × x = 2x² and 2x × 4 = 8x.'},{do:'−1 × x = −x and −1 × 4 = −4.'},{do:'Collect: 2x² + 8x − x − 4 = 2x² + 7x − 4.'}]},
     mistake:'Expanding (x + 3)² as x² + 9. Write it as (x + 3)(x + 3): x² + 6x + 9. The middle term never disappears.',
     check:{q:'Expand (x − 4)².',o:['x² − 8x + 16','x² + 16','x² − 16'],a:0,why:'(x − 4)(x − 4) = x² − 4x − 4x + 16.',hint:'Write it as two brackets.'}},
    {title:'Common factors and grouping',explain:'<p>To {{factorise|write an expression as a product of factors}} means to reverse expanding: put the brackets back. Always start by looking for a {{common factor|a factor shared by every term}}: the HCF of every term. For example, 6x² − 9x = 3x(2x − 3), and the syllabus type ax² + b: 2x² + 8 = 2(x² + 4).</p><p>With <strong>four terms</strong>, try {{grouping|pairing terms and taking out a common factor from each pair}}, the syllabus type ax + bx + ay + by. Pair the terms, take a common factor from each pair, and look for a matching bracket:</p><p>ax + bx + ay + by = x(a + b) + y(a + b) = <strong>(a + b)(x + y)</strong>.</p><p>The shared bracket (a + b) is itself a common factor, so it comes out to the front.</p>',
     example:{q:'Factorise 3x − 6 + xy − 2y.',steps:[{do:'Group: (3x − 6) + (xy − 2y).'},{do:'Factor each pair: 3(x − 2) + y(x − 2).',why:'Both pairs now contain (x − 2).'},{do:'Take out (x − 2): (x − 2)(3 + y).'}]},
     mistake:'Taking out a factor that is not the HIGHEST common factor. 6x² − 9x = 3(2x² − 3x) is not finished; x is still common.',
     check:{q:'Factorise ab + 2a + 3b + 6.',o:['(a + 3)(b + 2)','(a + 2)(b + 3)','ab(2 + 3)'],a:0,why:'a(b + 2) + 3(b + 2) = (b + 2)(a + 3).',hint:'Group the first two and last two terms.'}},
    {title:'The difference of two squares',explain:'<p>Expand (a − b)(a + b): a² + ab − ab − b². The middle terms cancel out, leaving <strong>a² − b²</strong>. Reading this backwards gives a powerful pattern, the {{difference of two squares|a² − b² = (a − b)(a + b)}}:</p><p><strong>a² − b² = (a − b)(a + b)</strong></p><p>Look for two perfect squares with a minus sign between them: x² − 25 = (x − 5)(x + 5); 9y² − 4 = (3y − 2)(3y + 2).</p><p>It also makes mental maths easy, which is the student’s trick: 101² − 99² = (101 − 99)(101 + 99) = 2 × 200 = 400. And always {{factorise completely|until no factor can be factorised further}}: 2x² − 18 = 2(x² − 9) = 2(x − 3)(x + 3).</p>',
     example:{q:'Factorise completely 3x² − 48.',steps:[{do:'Common factor first: 3(x² − 16).'},{do:'x² − 16 is a difference of two squares: (x − 4)(x + 4).'},{do:'Answer: 3(x − 4)(x + 4).'}]},
     mistake:'Trying to factorise a SUM of squares like x² + 9. Only a DIFFERENCE of squares factorises this way.',
     check:{q:'Factorise 4x² − 49.',o:['(2x − 7)(2x + 7)','(4x − 7)(x + 7)','(2x − 7)²'],a:0,why:'(2x)² − 7².',hint:'What squares give 4x² and 49?'}}]}]},
  {phase:'explain',name:'Teach: trinomials and fractions',title:'Learn: factorising quadratics and algebraic fractions',lead:'Next, quadratic trinomials, and using factorising to work with algebraic fractions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Factorise first, den cancel di factor dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Factorising x² + bx + c',explain:'<p>A {{quadratic expression|an expression whose highest power is 2}} like x² + 7x + 12 often factorises into two brackets: (x + p)(x + q). When you expand that, you get x² + (p + q)x + pq. So we need two numbers p and q that:</p><p><strong>multiply to give c</strong> and <strong>add to give b</strong>.</p><p>For x² + 7x + 12: pairs that multiply to 12 are 1 and 12, 2 and 6, 3 and 4. Only 3 and 4 add to 7. So x² + 7x + 12 = (x + 3)(x + 4).</p><p>Signs help you search. If c is <strong>positive</strong>, both numbers have the same sign as b. If c is <strong>negative</strong>, the numbers have opposite signs, and the bigger one has the sign of b.</p>',
     example:{q:'Factorise x² − 2x − 15.',steps:[{do:'Need: multiply to −15, add to −2.'},{do:'c is negative, so the signs differ. Pairs: 3 and −5 (sum −2) ✓.'},{do:'x² − 2x − 15 = (x + 3)(x − 5). Check: x² − 5x + 3x − 15 ✓'}]},
     mistake:'Getting the signs mixed up: x² − 2x − 15 is NOT (x − 3)(x + 5), which expands to x² + 2x − 15.',
     check:{q:'Factorise x² + x − 12.',o:['(x + 4)(x − 3)','(x − 4)(x + 3)','(x + 6)(x − 2)'],a:0,why:'4 × −3 = −12 and 4 + (−3) = 1.',hint:'Multiply to −12, add to 1.'}},
    {title:'Factorising ax² + bx + c when a ≠ 1',explain:'<p>When the x² term has a coefficient other than 1, like 2x² + 7x + 3, here is a reliable method, sometimes called the “ac method”.</p><p><strong>1.</strong> Multiply a × c: 2 × 3 = 6. <strong>2.</strong> Find two numbers that multiply to 6 and add to b = 7: that is 1 and 6. <strong>3.</strong> Split the middle term using them: 2x² + x + 6x + 3. <strong>4.</strong> Factorise by grouping: x(2x + 1) + 3(2x + 1) = <strong>(2x + 1)(x + 3)</strong>.</p><p>Always check by expanding: (2x + 1)(x + 3) = 2x² + 6x + x + 3 = 2x² + 7x + 3 ✓. And remember to look for a common factor first: 4x² + 14x + 6 = 2(2x² + 7x + 3).</p>',
     example:{q:'Factorise 3x² − 10x + 8.',steps:[{do:'a × c = 24. Need: multiply to 24, add to −10: that is −4 and −6.'},{do:'Split: 3x² − 4x − 6x + 8 = x(3x − 4) − 2(3x − 4).'},{do:'= (3x − 4)(x − 2).'}]},
     mistake:'Forgetting to multiply a × c. For 2x² + 7x + 3, you need numbers that multiply to 6, not 3.',
     check:{q:'Factorise 2x² + 5x + 2.',o:['(2x + 1)(x + 2)','(2x + 2)(x + 1)','(x + 2)²'],a:0,why:'a × c = 4: 1 and 4 add to 5.',hint:'Split 5x into x + 4x.'}},
    {title:'Simplifying algebraic fractions',explain:'<p>An {{algebraic fraction|a fraction with algebra in the numerator or denominator}} follows the same rules as ordinary fractions. The key skill is: <strong>factorise first, then cancel common factors</strong>.</p><p>For example, (x² − 9)/(x + 3) = (x − 3)(x + 3)/(x + 3) = x − 3. You may only cancel <strong>factors</strong> (things multiplied), never <strong>terms</strong> (things added). (x + 3)/3 does NOT simplify to x.</p><p><strong>Adding and subtracting:</strong> use a common denominator: 2/x + 3/(x + 1) = [2(x + 1) + 3x]/[x(x + 1)] = (5x + 2)/[x(x + 1)]. <strong>Multiplying:</strong> factorise everything, cancel, then multiply. <strong>Dividing:</strong> keep, flip, multiply.</p>',
     example:{q:'Simplify (x² + 5x + 6)/(x² − 4).',steps:[{do:'Factorise the top: (x + 2)(x + 3).'},{do:'Factorise the bottom: (x − 2)(x + 2).'},{do:'Cancel (x + 2): (x + 3)/(x − 2).'}]},
     mistake:'Cancelling terms: (x + 6)/(x + 2) is NOT 6/2 or 3. Nothing cancels, because x is a term, not a factor.',
     check:{q:'Simplify (3x + 6)/(x + 2).',o:['3','3x','x + 3'],a:0,why:'3(x + 2)/(x + 2) = 3.',hint:'Factorise the top first.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Expanding',text:'Every term times every term. (x + 3)² = x² + 6x + 9, never x² + 9.'},{title:'Factorising: always check in this order',text:'1. Common factor. 2. Four terms: grouping. 3. Two squares with a minus: (a − b)(a + b). 4. Trinomial: multiply to c (or ac), add to b.'},{title:'Signs in trinomials',text:'c positive: both numbers share the sign of b. c negative: opposite signs.'},{title:'Algebraic fractions',text:'Factorise, then cancel FACTORS only. Add/subtract with a common denominator. Divide: keep, flip, multiply.'}]},
