[1,'Number Theory and Computation','Write 0.00759 in scientific notation.',['7.59 × 10⁻³','7.59 × 10³','75.9 × 10⁻⁴','0.759 × 10⁻²'],'Move the decimal point 3 places right to get 7.59, so the power is −3.'],
[1,'Number Theory and Computation','What is the H.C.F. of 36 and 60?',['12','6','180','4'],'36 = 2² × 3², 60 = 2² × 3 × 5. Common: 2² × 3 = 12.'],
[1,'Number Theory and Computation','Write 3.14159 correct to 3 significant figures.',['3.14','3.141','3.15','3.142'],'The first three significant figures are 3, 1, 4; the next digit (1) rounds down.'],
[1,'Number Theory and Computation','What is the value, in base ten, of the leftmost digit of 1011₂?',['8','1','4','2'],'In base two the place values are 8, 4, 2, 1. The leftmost 1 is worth 8.'],
[1,'Consumer Arithmetic','An item marked $2,500 is sold at a 20% discount. What is the selling price?',['$2,000','$500','$2,480','$3,000'],'20% of 2,500 = 500; 2,500 − 500 = 2,000.'],
[1,'Consumer Arithmetic','Find the simple interest on $40,000 at 5% per annum for 3 years.',['$6,000','$2,000','$46,000','$600'],'I = PRT/100 = 40,000 × 5 × 3 ÷ 100 = 6,000.'],
[1,'Consumer Arithmetic','A radio bought for $800 is sold for $1,000. What is the percentage profit?',['25%','20%','200%','80%'],'Profit 200 ÷ cost 800 × 100 = 25%.'],
[1,'Consumer Arithmetic','$10,000 is invested at 10% per annum compound interest. What is the amount after 2 years?',['$12,100','$12,000','$11,000','$2,100'],'10,000 × 1.1² = 12,100.'],
[1,'Sets','n(A) = 12, n(B) = 9 and n(A ∩ B) = 4. Find n(A ∪ B).',['17','21','25','13'],'n(A ∪ B) = 12 + 9 − 4 = 17.'],
[1,'Sets','How many subsets does {a, b, c, d} have?',['16','8','4','15'],'A set with n elements has 2ⁿ subsets: 2⁴ = 16.'],
[1,'Sets','U = {1, 2, …, 10} and A is the set of prime numbers in U. Find n(A′).',['6','4','5','10'],'A = {2, 3, 5, 7}, so n(A) = 4 and n(A′) = 10 − 4 = 6.'],
[1,'Measurement','Find the circumference of a circle of radius 7 cm. (Use π = 22/7.)',['44 cm','22 cm','154 cm','88 cm'],'C = 2πr = 2 × 22/7 × 7 = 44.'],
[1,'Measurement','A triangle has base 10 cm and perpendicular height 6 cm. What is its area?',['30 cm²','60 cm²','16 cm²','32 cm²'],'½ × 10 × 6 = 30.'],

[1,'Measurement','Convert 2.5 km to metres.',['2,500 m','250 m','25,000 m','25 m'],'1 km = 1,000 m, so 2.5 km = 2,500 m.'],
[1,'Introduction to Graphs','What is the y-intercept of y = 3x − 4?',['−4','3','4','−3'],'In y = mx + c, c = −4.'],
[1,'Introduction to Graphs','Where does 2x + y = 8 cross the x-axis?',['(4, 0)','(0, 8)','(8, 0)','(0, 4)'],'Put y = 0: 2x = 8, x = 4.'],
[1,'Algebra 1','Simplify 3a² × 4a³.',['12a⁵','7a⁵','12a⁶','7a⁶'],'Multiply the numbers (12) and add the indices (5).'],
[1,'Algebra 1','Solve 5x − 3 = 2x + 9.',['4','2','6','12'],'3x = 12, so x = 4.'],
[1,'Algebra 1','Factorise completely 6x² − 9x.',['3x(2x − 3)','3(2x² − 3x)','x(6x − 9)','6x(x − 9)'],'The HCF is 3x.'],
[2,'Relations, Functions and Graphs 1','f(x) = 2x + 1 and g(x) = x². Find fg(3).',['19','49','10','7'],'fg(3) = f(g(3)) = f(9) = 19.'],
[2,'Relations, Functions and Graphs 1','f(x) = (x − 4)/3. Find f⁻¹(x).',['3x + 4','3x − 4','(x + 4)/3','(x − 3)/4'],'y = (x − 4)/3, so x = 3y + 4.'],
[2,'Relations, Functions and Graphs 1','Find the gradient of the line through (1, 2) and (4, 11).',['3','1/3','9','13/5'],'(11 − 2) ÷ (4 − 1) = 3.'],
[2,'Relations, Functions and Graphs 1','What is the axis of symmetry of y = (x − 2)² + 5?',['x = 2','x = −2','x = 5','y = 5'],'Axis x = −h; here (x − 2) means h = −2, so x = 2.'],

[2,'Algebra 2','Solve x + y = 7 and x − y = 3.',['x = 5, y = 2','x = 2, y = 5','x = 4, y = 3','x = 10, y = −3'],'Add: 2x = 10.'],

   blocks:[{type:'teach',star:true,chunks:[
    {title:'The format of Paper 01',explain:'<p>{{Paper 01|the multiple-choice paper}} is the multiple-choice paper. From the syllabus:</p><p>• <strong>Regular sitting:</strong> 60 multiple-choice questions, 20 from each of the three modules, in <strong>1 hour 30 minutes</strong>.<br>• <strong>Modular sitting:</strong> one module has 20 items in <strong>30 minutes</strong>; two modules have 40 items in <strong>1 hour</strong>.<br>• Each item is worth <strong>one mark</strong>.</p><p>The syllabus also lists how many items come from each topic. In Module 3, for example, there are 6 items on Relations, Functions and Graphs 2, 6 on Geometry and Trigonometry 2, 4 on Statistics 2 and 4 on Vectors and Matrices 2. The mini-paper follows exactly this mix, so you practise what you will meet.</p>',
     example:{q:'A student is sitting Modules 2 and 3 together. How many items, and how long?',steps:[{do:'Two modules: 40 items (20 from each).'},{do:'Time: 1 hour.'},{do:'That is 1½ minutes per item, the same pace as the regular paper.'}]},
     mistake:'Thinking some items are worth more than others. Every Paper 01 item is worth one mark.',
     check:{q:'How many Paper 01 items come from each module in the regular sitting?',o:['20','30','60'],a:0,why:'60 items ÷ 3 modules.',hint:'Shared equally.'}},
    {title:'Pacing yourself',explain:'<p>With 60 items in 90 minutes, you have about <strong>1½ minutes per item</strong>. Some items take 20 seconds; others take 3 minutes. The aim is to use your time where it earns marks.</p><p>A good plan is <strong>two passes</strong>. <strong>Pass 1:</strong> answer every item you can do quickly, and mark (circle) any that look long or hard. <strong>Pass 2:</strong> go back to the marked items with the time you saved.</p><p>Check the clock at milestones: about 20 items done after 30 minutes, 40 after 60 minutes. And never leave an item blank: a wrong answer loses nothing, but a blank can never earn the mark.</p>',
     example:{q:'After 45 minutes, a student has answered 22 items. Is she on pace for the 60-item paper?',steps:[{do:'At 1½ minutes per item, 45 minutes should cover about 30 items.'},{do:'She has done 22, so she is behind.'},{do:'She should skip long items for now and return to them later.'}]},
     mistake:'Getting stuck on one hard item for 5 minutes. Mark it, move on, and come back.',
     check:{q:'In a 30-minute, 20-item module paper, roughly how long per item?',o:['1½ minutes','3 minutes','30 seconds'],a:0,why:'30 ÷ 20.',hint:'Divide.'}},
    {title:'What the items test: CK, AK and R',explain:'<p>The syllabus classifies every item by the kind of thinking it needs:</p><p>• {{Conceptual Knowledge|recalling facts, rules and definitions}} (CK): recalling facts, rules, definitions and procedures; for example, “What is the order of rotational symmetry of a square?”<br>• {{Algorithmic Knowledge|applying techniques to solve problems}} (AK): applying a technique; for example, “Solve 5x − 3 = 2x + 9.”<br>• {{Reasoning|interpreting, combining methods and justifying}} (R): interpreting, combining methods, or working backwards; for example, “Which point satisfies both inequalities?”</p><p>In Paper 01, the syllabus allocates 6 raw marks to CK, 8 to AK and 6 to R in each module. So you need fast recall AND fluent methods AND careful reasoning.</p>',
     example:{q:'Classify: "The bearing of Q from P is 065°. Find the bearing of P from Q."',steps:[{do:'It needs the back-bearing rule (± 180°).'},{do:'Applying a known procedure to a situation is Algorithmic Knowledge (AK).'}]},

  {phase:'explain',name:'Teach: strategies',title:'Learn: strategies for multiple-choice items, and common traps',lead:'Next, the techniques that turn knowledge into marks.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Read each example and the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Work it out first. Den find it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Solve first, then match; eliminate distractors',explain:'<p>Each item has a {{stem|the question part}} and usually four {{options|the possible answers}}. The wrong options are {{distractors|wrong options that catch common mistakes}}, deliberately written to catch common mistakes.</p><p><strong>Strategy 1: Solve first, then match.</strong> Cover the options, work out the answer, then look for it. This stops a distractor from steering you.</p><p><strong>Strategy 2: Eliminate.</strong> If you are unsure, cross out options that cannot be right: a negative length, a probability bigger than 1, an answer with the wrong units, or an option much too large. Even ruling out two options doubles your chance of choosing correctly.</p>',
     example:{q:'"P(rolling a number greater than 4 on a fair die) = ?" Options: A 1/3, B 4/6, C 5/6, D 1/4.',steps:[{do:'Solve first: the outcomes 5 and 6, so 2/6 = 1/3.'},{do:'Match: option A.'},{do:'Notice: B is the distractor for students who count 1 to 4 instead.'}]},
     mistake:'Reading the options before solving, then being tempted by a distractor that "looks familiar".',
     check:{q:'Which option can be eliminated immediately for "the length of a side"?',o:['−5 cm','5 cm','12 cm'],a:0,why:'A length cannot be negative.',hint:'Impossible answers.'}},
    {title:'Substitute, work backwards, and estimate',explain:'<p><strong>Strategy 3: Substitute the options.</strong> For “Solve 5x − 3 = 2x + 9”, try each option in the equation: x = 4 gives 17 = 17 ✓. This is quick, and it checks your answer.</p><p><strong>Strategy 4: Work backwards.</strong> For “Which matrix maps (1, 0) to (−1, 0)?”, multiply each option by (1; 0) and see which works.</p><p><strong>Strategy 5: Estimate.</strong> For “Find 4.9 × 21.2”, estimate 5 × 20 = 100, then choose the option close to 100 (103.88), not 10.388 or 1038.8.</p><p>These are the syllabus’s own problem-solving ideas: use simple numbers, guess and check, and make full use of calculators.</p>',
     example:{q:'"Factorise x² − 5x − 14." Options include (x − 7)(x + 2) and (x + 7)(x − 2). Check quickly.',steps:[{do:'Expand (x − 7)(x + 2) = x² + 2x − 7x − 14 = x² − 5x − 14 ✓'},{do:'So (x − 7)(x + 2) is correct; no need to test the others.'}]},
     mistake:'Not checking. Substituting back takes seconds and catches sign errors.',
     check:{q:'"Solve 3x + 1 = 13." The fastest check of the option x = 4 is…',o:['3(4) + 1 = 13 ✓','Draw a graph','Ask a friend'],a:0,why:'Substitute it.',hint:'Put it in.'}},
    {title:'Common traps, and calculators',explain:'<p>Many lost marks come from small slips, not from not knowing the mathematics:</p><p>• Missing <strong>NOT</strong> or <strong>EXCEPT</strong> in the stem: underline them.<br>• <strong>Units</strong>: is the answer in cm or m, cm² or cm³?<br>• <strong>Form</strong>: “in terms of π”, “to 3 significant figures”, “in standard form”.<br>• <strong>Signs</strong>: especially with negatives, gradients and bearings.<br>• <strong>Order</strong>: for example, fg(x) means g first.</p><p>The syllabus says you may use a silent, non-programmable electronic calculator (battery or solar powered), and that calculators with graphical display, data bank, dictionary or communication abilities are not allowed. Make sure it is in <strong>degree mode</strong> for trigonometry, and bring spare batteries.</p>',
     example:{q:'"Which of the following is NOT a prime number? 2, 3, 9, 11."',steps:[{do:'Underline NOT.'},{do:'2, 3 and 11 are prime; 9 = 3 × 3 is not.'},{do:'Answer: 9.'}]},
     mistake:'Missing the word NOT and choosing a prime number.',
     check:{q:'Which calculator is allowed?',o:['A silent, non-programmable calculator','A graphing calculator','A phone'],a:0,why:'As the syllabus states.',hint:'Non-programmable.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Format',text:'Regular: 60 items (20 per module), 1 h 30 min. One module: 20 items, 30 min. Two modules: 40 items, 1 h. One mark each.'},{title:'Pacing',text:'About 1½ minutes per item. Two passes: quick items first, mark hard ones, return. Never leave a blank.'},{title:'Strategies',text:'Solve first, then match. Eliminate impossible options. Substitute options. Work backwards. Estimate.'},{title:'Traps',text:'Underline NOT/EXCEPT. Check units, form and signs. Non-programmable calculator, in degree mode.'}]},
