var CANOE=function(th){var R=Math.PI/180,u=5,c=3,ac=u*Math.cos(th*R),dn=c-u*Math.sin(th*R),t=60/ac,drift=dn*t,S=[150,215],k=28,s='<svg viewBox="0 0 520 250" role="img" aria-label="A canoe crossing a river, aimed '+th+' degrees upstream, with its velocity vectors"><rect width="520" height="250" fill="#9ccc7a"/><rect x="0" y="35" width="520" height="180" fill="#7fb8e0"/>';for(var x=30;x<520;x+=110)s+='<path d="M'+x+' 60 h40 M'+(x+32)+' 55 l8 5 l-8 5" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>';var P=[S[0]-u*Math.sin(th*R)*k,S[1]-ac*k],C=[S[0]+c*k,S[1]],Rz=[S[0]+dn*k,S[1]-ac*k],end=[S[0]+drift*3,35];s+=SC.dash(S[0],S[1],end[0],end[1],'#c02d5f',2.5)+'<line x1="'+S[0]+'" y1="'+S[1]+'" x2="'+P[0].toFixed(1)+'" y2="'+P[1].toFixed(1)+'" stroke="#2f5fc4" stroke-width="4"/><line x1="'+P[0].toFixed(1)+'" y1="'+P[1].toFixed(1)+'" x2="'+(P[0]+c*k).toFixed(1)+'" y2="'+P[1].toFixed(1)+'" stroke="#a85d00" stroke-width="4"/><line x1="'+S[0]+'" y1="'+S[1]+'" x2="'+Rz[0].toFixed(1)+'" y2="'+Rz[1].toFixed(1)+'" stroke="#c02d5f" stroke-width="4"/>';s+='<ellipse cx="'+S[0]+'" cy="'+S[1]+'" rx="16" ry="6" fill="#7a4300"/>'+SC.dot(S[0],35,'#155c35',6)+SC.t(S[0],28,'jetty','#155c35',12,'middle',1)+SC.t(505,100,'current 3 m/s →','#fff',13,'end',1);return s+SC.t(16,232,'blue: paddling 5 m/s · brown: current · red: actual motion','#2a2140',11,'start',1)+'</svg>'};
var STORY_V=STORYBLOCK({story:'"A canoeist on the Rio Grande in Portland paddles straight across the river at 3 m/s, while the current carries the canoe downstream at 4 m/s." Which sketch shows the canoe’s REAL path?',sk:VSK,fb:VFB,correct:'C',p2title:'Aim the canoe.',p2lead:'This canoeist paddles at 5 m/s, and the current flows at 3 m/s. Aim the canoe upstream by different angles. Watch the red resultant, and where the canoe lands. Can you make it land at the jetty directly opposite?',p2html:'<div class="controls"><label for="cnT">Aim upstream by:</label><input type="range" id="cnT" min="0" max="60" step="1" value="0"><output class="big cnTO"></output></div><div class="scene cnSvg"></div><div class="tile cnOut" aria-live="polite"></div>',goal:'aim the canoe so that it travels straight across, to the jetty',done:'About 37° upstream: the upstream part of the paddling, 5 sin 37° ≈ 3 m/s, exactly cancels the 3 m/s current, so the resultant points straight across.',

 goals:['explain vector concepts: magnitude, direction, unit vectors, scalars, and equal, parallel and inverse vectors','simplify vector expressions using addition, subtraction, scalar multiplication, and the triangle and parallelogram laws','write position vectors, and find the magnitude and direction of a vector, including unit vectors','use vectors to solve problems in geometry (points in a straight line, parallel lines) and with displacement, velocity and weight','see how two movements or forces combine in real life, and use vectors to make real decisions'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 1',unit:'Module 2: Vectors and Matrices 1; Module 3: Vectors and Matrices 2',strand:'Vectors and Matrices',standard:'Modules 2 and 3, Vectors and Matrices: demonstrate the ability to use vector and matrix notations and concepts to model and solve real-world problems; understand that vectors and matrices do not satisfy the same rules of operation as the real number system.',
  objectives:['M2 5.1 explain concepts associated with vectors;','M2 5.2 simplify expressions involving vectors;','M3 4.1 write the position vector of a point P(a, b) as OP = (a b) where O is the origin (0, 0);','M3 4.2 determine the magnitude of a vector;','M3 4.3 determine the direction of a vector;','M3 4.4 use vectors to solve problems in geometry;'],
  focus:'Concept of a vector, magnitude, unit vector, direction, scalar; scalar multiples (parallel, equal and inverse vectors); vector addition, subtraction and scalar multiplication; the triangle law and parallelogram law; position and displacement vectors; magnitude and unit vectors; direction as an angle or bearing; points in a straight line (collinearity) and parallel lines; displacement, velocity and weight.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 2, Section 5 (5.1, 5.2) and Module 3, Section 4 (4.1–4.4). The syllabus suggests the effect of a river current as a vector quantity, and using vectors to give clues in a treasure hunt.'},
 glossary:[['Vector','A quantity with both magnitude (size) and direction.'],['Scalar','A quantity with magnitude only, such as mass or temperature.'],['Magnitude','The length of a vector: |(x y)| = √(x² + y²).'],['Unit vector','A vector of magnitude 1: the vector divided by its magnitude.'],['Equal vectors','Vectors with the same magnitude AND the same direction.'],['Parallel vectors','Vectors where one is a scalar multiple of the other.'],['Inverse vector','The vector of the same size in the opposite direction: −a.'],['Position vector','The vector from the origin O to a point P: OP.'],['Resultant','The single vector equal to the sum of two or more vectors.'],['Collinear','Lying on the same straight line.']],
 teacher:{time:'about 110 minutes over three periods',flow:[['Engage','8 min','The canoe crossing the Rio Grande: where does it land?','Use a river-crossing video or diagram.'],['Explore','20 min','Vector adder: sums, differences, magnitude and direction.','Ask: "Does the order of adding matter?"'],['Explain','50 min','Concepts, algebra, the triangle and parallelogram laws; position vectors, magnitude, direction, geometry; I do, we do, you do.','Do the syllabus treasure-hunt activity.'],['Elaborate','22 min','Challenge Zone and Bronze to Gold problems.','Practise CSEC collinearity proofs.'],['Evaluate','10 min','Quiz and reflection.','Watch for magnitude found by adding components.']],

  {phase:'explore',name:'Picture it: the canoe',title:'Picture it: how do two motions combine?',lead:'When two movements happen at once, they add as vectors: nose to tail. Start here: choose the canoe’s real path across a flowing river, then aim the canoe yourself so that it lands at the jetty.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><span>a:</span><label for="vaAx">x</label><input type="range" id="vaAx" min="-5" max="6" value="3"><label for="vaAy">y</label><input type="range" id="vaAy" min="-5" max="6" value="4"><output class="big vaAO"></output></div><div class="controls"><span>b:</span><label for="vaBx">x</label><input type="range" id="vaBx" min="-5" max="6" value="1"><label for="vaBy">y</label><input type="range" id="vaBy" min="-5" max="6" value="-2"><output class="big vaBO"></output><label for="vaM">Show:</label><select id="vaM"><option value="add">a + b</option><option value="sub">a − b</option></select></div><div class="scene vaSvg"></div><div class="tile vaOut" aria-live="polite" style="line-height:2.3"></div><div class="tile"><p style="margin:0"><span class="badge vaN"></span> <strong class="vaQ"></strong></p><div class="controls"><input type="text" class="vaIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go vaC">Check</button></div><div class="fb vaFb" aria-live="polite">Use the adder to help you.</div></div>',
     init:function(box,api){var g=function(id){return+box.querySelector(id).value};function draw(){var a=[g('#vaAx'),g('#vaAy')],b=[g('#vaBx'),g('#vaBy')],m=box.querySelector('#vaM').value,r=m==='sub'?[a[0]-b[0],a[1]-b[1]]:[a[0]+b[0],a[1]+b[1]],mag=function(v){return Math.sqrt(v[0]*v[0]+v[1]*v[1])},ang=function(v){var t=Math.atan2(v[1],v[0])*180/Math.PI;return t<0?t+360:t};box.querySelector('.vaAO').textContent='('+a.join(', ')+')';box.querySelector('.vaBO').textContent='('+b.join(', ')+')';box.querySelector('.vaSvg').innerHTML=VA(a,b,m);var R=mag(r),h='a = '+CV(a[0],a[1])+'  |a| = √('+a[0]+'² + '+a[1]+'²) = <strong>'+fv(mag(a))+'</strong>  direction '+fv(ang(a))+'° from the positive x-axis<br>b = '+CV(b[0],b[1])+'  |b| = '+fv(mag(b))+'<br><strong>'+(m==='sub'?'a − b':'a + b')+'</strong> = '+CV(r[0],r[1])+'  magnitude '+fv(R);if(R>0)h+=', direction '+fv(ang(r))+'°, unit vector '+CV(r[0]/R,r[1]/R);box.querySelector('.vaOut').innerHTML=h}['#vaAx','#vaAy','#vaBx','#vaBy','#vaM'].forEach(function(id){box.querySelector(id).addEventListener('input',draw);box.querySelector(id).addEventListener('change',draw)});function pv(v){var m=String(v).replace(/−/g,'-').replace(/[()\[\]\s]/g,'').match(/^(-?[\d.]+),(-?[\d.]+)$/);return m?[+m[1],+m[2]]:null}var T=[{t:'For a = (3, 4), what is |a|?',ok:function(v){return parseFloat(v)===5}},{t:'For a = (3, 4) and b = (1, −2), what is a + b? (Type x, y.)',ok:function(v){var p=pv(v);return p&&p[0]===4&&p[1]===2}},{t:'What angle does a = (3, 4) make with the positive x-axis, to 2 decimal places? (degrees)',ok:function(v){return Math.abs(parseFloat(v)-53.13)<0.015}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.vaN').textContent='All done';box.querySelector('.vaQ').textContent='You completed every challenge!';box.querySelector('.vaC').disabled=true;return}box.querySelector('.vaN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.vaQ').textContent=T[q].t}box.querySelector('.vaC').onclick=function(){var v=String(box.querySelector('.vaIn').value).trim(),fb=box.querySelector('.vaFb');if(T[q].ok(v)){fb.className='fb ok vaFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.vaIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no vaFb';fb.textContent='Not yet. Use the starting vectors a = (3, 4) and b = (1, −2), and read the results.'}};draw();task()}},
    {type:'recall',text:'The raft moves at 5 m/s. Its velocity is the resultant of 3 m/s across and 4 m/s downstream: √(3² + 4²) = 5 m/s.'}]},
  {phase:'explain',name:'Teach: concepts and algebra',title:'Learn: vector concepts and vector algebra',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Parallel mean one a multiple a di odda.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Vectors, scalars, and special vectors',explain:PIC('Two route taxis both travel at 50 km/h. One is heading north to Constant Spring; the other is heading south to Downtown. Their SPEEDS are equal (a scalar: just a size), but their VELOCITIES are different (a vector: a size AND a direction). If you only know "50 km/h", you do not know where the taxi will be in an hour.',SCN['Vectors, scalars, and special vectors'])+'<p>A {{vector|a quantity with magnitude and direction}} has both a <strong>magnitude</strong> (size) and a <strong>direction</strong>: displacement (5 km north), velocity (20 m/s east), force and weight. A {{scalar|magnitude only}} has magnitude only: mass, time, temperature, speed.</p><p>The syllabus names some special relationships, all based on <strong>scalar multiples</strong>:</p><p>• {{Equal vectors|same magnitude and same direction}} have the same magnitude and the same direction (they can be in different places).<br>• {{Parallel vectors|one is a scalar multiple of the other}}: one is a scalar multiple of the other. 2a is parallel to a and twice as long; −3a is parallel to a but points the opposite way.<br>• The {{inverse vector|same size, opposite direction}} of a is −a: the same size, opposite direction. So BA = −AB.<br>• A {{unit vector|a vector of magnitude 1}} has magnitude 1.</p>'+WHY('Why do we need vectors at all? Many quantities only make sense with a direction: a push, a wind, a journey, a current. Adding two forces of 5 N can give anything from 0 N (pulling in opposite directions) to 10 N (pulling the same way). Without the direction, the answer cannot be found.')+WORK('<strong>Pilots and ship captains</strong> plan with velocities, not just speeds. <strong>Engineers</strong> work with forces, which are vectors. <strong>Weather forecasters</strong> report wind as a speed and a direction.'),
     example:{q:'Which of these are parallel to (2; −3)? (a) (4; −6); (b) (−6; 9); (c) (3; −2).',steps:[{do:'(a) (4; −6) = 2(2; −3): parallel, same direction.'},{do:'(b) (−6; 9) = −3(2; −3): parallel, opposite direction.'},{do:'(c) (3; −2) is not a multiple of (2; −3): not parallel.'}]},
     mistake:'Thinking parallel vectors must point the same way. −2a is parallel to a, just reversed.',
     check:{q:'Which is a scalar?',o:['Mass of 5 kg','Velocity of 5 m/s north','A force of 10 N downward'],a:0,why:'Mass has no direction.',hint:'No direction.'}},
    {title:'Adding, subtracting and multiplying by a scalar',explain:PIC('A delivery rider leaves the depot, rides 3 km east, then 4 km north. Each leg is a vector: (3; 0) and (0; 4). Adding them, column by column, gives the overall displacement (3; 4). If tomorrow’s route is exactly twice as long in each direction, the scalar 2 doubles the whole vector: (6; 8).',SCN['Adding, subtracting and multiplying by a scalar'])+'<p>With column vectors, the algebra is simple: work on each component separately.</p><p><strong>Addition:</strong> (a; b) + (c; d) = (a + c; b + d). <strong>Subtraction:</strong> (a; b) − (c; d) = (a − c; b − d). <strong>Scalar multiplication:</strong> k(a; b) = (ka; kb).</p><p>In letter form, vector expressions are simplified just like algebra: 3a + 2b − a + b = 2a + 3b. You can collect “like vectors”, but you cannot combine a and b into one term.</p><p>Vector addition is commutative: a + b = b + a, as the dashed path showed in the explorer.</p>'+WHY('Why add column by column? The top number is the east–west movement and the bottom is the north–south movement. East movements add to east movements, and north to north, separately, because they are at right angles and do not affect each other. That is why we add matching components.')+WORK('<strong>Delivery companies</strong> plan routes as sums of legs. <strong>Robot and game programmers</strong> move characters by adding vectors each frame. <strong>Surveyors</strong> add measured legs to find a final position.'),
     example:{q:'If a = (2; 5) and b = (−1; 3), find 3a − 2b.',steps:[{do:'3a = (6; 15) and 2b = (−2; 6).'},{do:'3a − 2b = (6 − (−2); 15 − 6).'},{do:'= (8; 9).'}]},
     mistake:'Subtracting a negative incorrectly: 6 − (−2) = 8, not 4.',
     check:{q:'If p = (4; −1) and q = (2; 3), what is p + q?',o:['(6; 2)','(2; −4)','(6; −4)'],a:0,why:'(4 + 2; −1 + 3).',hint:'Add each component.'}},
    {title:'The triangle law and the parallelogram law',explain:PIC('A ship is pulled out of Kingston Harbour by two tug boats, one pulling slightly to the left and one slightly to the right. Where does the ship actually go? The two pulls add as vectors. Draw them nose to tail, and the line from the start to the end, the resultant, is the ship’s real direction of motion.',SCN['The triangle law and the parallelogram law'])+'<p>The <strong>triangle law</strong>: to add two vectors, place them <strong>head to tail</strong>. The {{resultant|the single vector equal to the sum}} goes from the start of the first to the end of the second. In letters: <strong>AB + BC = AC</strong>.</p><p>The <strong>parallelogram law</strong>: place the two vectors <strong>tail to tail</strong>, and complete the parallelogram. The resultant is the diagonal from the shared starting point. Both laws give the same answer: they are two ways of seeing a + b = b + a.</p><p>To find a vector in a diagram, find a <strong>route</strong> along known vectors: for example, in a parallelogram OABC with OA = a and OC = c, the diagonal OB = OA + AB = a + c, and AC = AO + OC = −a + c.</p>'+WHY('Why nose to tail? Doing the first movement and THEN the second takes you from the start of the first vector to the end of the second. The parallelogram law draws both vectors from the same point and takes the diagonal: it is the same triangle, just drawn twice, so both laws give the same resultant.')+WORK('<strong>Harbour pilots and tug captains</strong> combine pulls. <strong>Pilots</strong> combine their heading with the wind. <strong>Engineers</strong> combine forces on bridges, cranes and buildings.'),visual:VA([3,4],[1,-2],'add','The triangle law and parallelogram law for a = (3, 4) and b = (1, −2)'),
     example:{q:'In triangle OAB, OA = a and OB = b. M is the midpoint of AB. Find OM.',steps:[{do:'AB = AO + OB = −a + b.'},{do:'AM = ½AB = ½(b − a).'},{do:'OM = OA + AM = a + ½b − ½a = ½a + ½b = ½(a + b).'}]},
     mistake:'Adding vectors that are not head to tail. In AB + BC, the first must END where the second STARTS.',
     check:{q:'PQ + QR = ?',o:['PR','RP','QQ'],a:0,why:'The triangle law.',hint:'Head to tail.'}}]}]},
  {phase:'explain',name:'Teach: position, magnitude, direction and geometry',title:'Learn: position vectors, magnitude, direction and geometry',lead:'Next, coordinates, lengths and angles of vectors, and using them to prove geometric facts.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Collinear: parallel AN share a point.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Position vectors and displacement vectors',explain:PIC('On a map of Kingston with Half Way Tree as the origin O, a school is at (6; 1) and a shop is at (3; 5), in kilometres. These are position vectors: arrows from O. The journey from the school to the shop is a displacement vector: (3; 5) − (6; 1) = (−3; 4), a trip of 5 km. It describes the trip itself, wherever it starts.',SCN['Position vectors and displacement vectors'])+'<p>The {{position vector|the vector from O to a point}} of a point P(a, b) is the vector from the origin O to P. The syllabus writes it as <strong>OP = (a; b)</strong>: simply the coordinates written as a column.</p><p>A <strong>displacement vector</strong> describes a movement from one point to another: <strong>AB = OB − OA</strong> (“end minus start”), which comes from the route A → O → B: AB = AO + OB = −OA + OB.</p><p>So if A is (2, 1) and B is (6, 4), then OA = (2; 1), OB = (6; 4), and AB = (6 − 2; 4 − 1) = (4; 3).</p>'+WHY('Why is AB = OB − OA? Going from A to B directly is the same as going from A back to O (that is −OA), then from O out to B (that is OB). So AB = −OA + OB = OB − OA: "where you finish minus where you start".')+WORK('<strong>GPS and map apps</strong> store places as position vectors and journeys as displacements. <strong>Air traffic controllers</strong> track aircraft positions. <strong>Game developers</strong> place every object with a position vector.'),
     example:{q:'P is (−1, 3) and Q is (5, −5). Find OP, OQ and PQ.',steps:[{do:'OP = (−1; 3), OQ = (5; −5).'},{do:'PQ = OQ − OP = (5 − (−1); −5 − 3).'},{do:'PQ = (6; −8).'}]},
     mistake:'Writing AB = OA − OB. It is OB − OA: where you end, minus where you start.',
     check:{q:'A is (3, 2) and B is (7, 9). AB = ?',o:['(4; 7)','(10; 11)','(−4; −7)'],a:0,why:'(7 − 3; 9 − 2).',hint:'End minus start.'}},
    {title:'Magnitude, unit vectors and direction',explain:PIC('A delivery drone flies 6 km east and 8 km north. How far is it from the depot, and in what direction? The size of its displacement vector (its magnitude) is √(6² + 8²) = 10 km, and its direction is the angle with tan θ = 6 ÷ 8, a bearing of about 036.9°.',SCN['Magnitude, unit vectors and direction'])+'<p>The <strong>magnitude</strong> of v = (x; y) is its length, by Pythagoras: <strong>|v| = √(x² + y²)</strong>. For PQ = (6; −8): |PQ| = √(36 + 64) = 10.</p><p>A <strong>unit vector</strong> in the direction of v has magnitude 1: divide v by its magnitude. The unit vector in the direction of (6; −8) is (6/10; −8/10) = (0.6; −0.8).</p><p>The <strong>direction</strong> of a vector is usually given as an angle. For v = (x; y), the angle θ with the positive x-axis satisfies <strong>tan θ = y/x</strong>; sketch the vector first to see which quadrant it is in, then adjust. In navigation, direction is often given as a bearing (measured clockwise from North).</p>'+WHY('Why is the magnitude √(x² + y²)? The two components are at right angles, so the vector is the hypotenuse of a right triangle with sides x and y: Pythagoras gives its length. A unit vector keeps the direction but has length 1, so dividing a vector by its magnitude shows the direction alone.')+WORK('<strong>Drone and aircraft pilots</strong> find distance and bearing. <strong>Physicists</strong> find the size of a force or velocity. <strong>Navigation apps</strong> show "10 km, north-east" from exactly this calculation.'),
     example:{q:'Find the magnitude and the direction (angle with the positive x-axis) of v = (5; 12).',steps:[{do:'|v| = √(25 + 144) = √169 = 13.'},{do:'tan θ = 12/5 = 2.4.'},{do:'θ = tan⁻¹(2.4) ≈ 67.38°. (Both components are positive, so it is in the first quadrant.)'}]},
     mistake:'Adding the components for the magnitude: |(5; 12)| is 13, not 17.',
     check:{q:'What is the unit vector in the direction of (3; 4)?',o:['(0.6; 0.8)','(3; 4)','(0.75; 1)'],a:0,why:'Divide by 5.',hint:'Divide by the magnitude.'}},
    {title:'Vectors in geometry and the physical world',explain:PIC('A shop sign in Ocho Rios hangs from two cables. Gravity pulls it straight down; each cable pulls up and sideways. The sign stays still because the three forces, added as vectors, come to zero. The sideways pulls cancel, and the upward pulls balance the weight.',SCN['Vectors in geometry and the physical world'])+'<p><strong>Points in a straight line (collinear):</strong> to prove A, B and C are {{collinear|on the same straight line}}, show that AB and BC (or AB and AC) are <strong>parallel</strong> (one is a scalar multiple of the other) <strong>and</strong> share a common point (B). For example, if AB = (2; 3) and BC = (4; 6) = 2AB, then AB is parallel to BC, and since they share B, A, B and C are collinear.</p><p><strong>Parallel lines:</strong> show that the vectors along the lines are scalar multiples.</p><p><strong>Physical problems:</strong> displacement, velocity and weight (a force) are vectors, and they add by the triangle law. The raft: velocity across (3; 0) plus current (0; −4) gives a resultant velocity (3; −4), with speed 5 m/s.</p>'+WHY('Why does "still" mean the vectors add to zero? If the forces did not balance, there would be a resultant force, and the sign would start to move in that direction. In geometry, the same idea proves facts about shapes: if two vectors are multiples of each other, the lines are parallel.')+WORK('<strong>Structural engineers</strong> make sure the forces on signs, bridges and roofs balance. <strong>Crane operators</strong> plan loads. <strong>Physicists</strong> analyse motion and forces with vectors.'),
     example:{q:'A(1, 2), B(3, 5) and C(7, 11). Show that A, B and C are collinear.',steps:[{do:'AB = (3 − 1; 5 − 2) = (2; 3). BC = (7 − 3; 11 − 5) = (4; 6).'},{do:'BC = 2(2; 3) = 2AB, so AB is parallel to BC.'},{do:'They share the point B, so A, B and C lie on one straight line.'}]},
     mistake:'Stopping at "parallel". Parallel vectors could be on different lines; you must also mention the shared point.',
     check:{q:'To prove three points are collinear, you show the vectors are parallel AND…',o:['share a common point','have equal magnitudes','are perpendicular'],a:0,why:'Otherwise they could be on separate parallel lines.',hint:'A shared point.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Type vectors as x, y.',

   blocks:[{type:'facts',facts:[{title:'Concepts',text:'Vector: size and direction; scalar: size only. Parallel: one is a scalar multiple of the other. Inverse: −a. Unit: magnitude 1.'},{title:'Algebra and laws',text:'Add, subtract and multiply component by component. Triangle law: AB + BC = AC. Parallelogram law: the diagonal.'},{title:'Position, magnitude, direction',text:'OP = (a; b). AB = OB − OA. |v| = √(x² + y²). Unit vector = v ÷ |v|. tan θ = y/x.'},{title:'Geometry',text:'Collinear: parallel AND a shared point. Parallel lines: scalar multiples. Velocities and forces add by the triangle law.'}]},

    {icon:'✈️',title:'The pilot: blown off course?',desc:'Find where a plane really goes in a crosswind.',level:'⭐⭐⭐ Aviation',mins:7,block:{type:'mission',story:'A light aircraft leaves Kingston heading due east at 200 km/h. A wind blows towards the north at 50 km/h.',parts:[{q:'What is the resultant speed, to 1 decimal place? (km/h)',a:206.2,tol:0.06,hint:'√(200² + 50²).',sol:'√42,500 ≈ 206.2 km/h.',placeholder:'km/h'},{q:'By how many degrees north of east is it blown, to 1 decimal place?',a:14,tol:0.06,hint:'tan θ = 50 ÷ 200.',sol:'tan⁻¹(0.25) ≈ 14.0°.',placeholder:'degrees'},{q:'What is the plane’s actual bearing, to 1 decimal place?',a:76,tol:0.06,hint:'090° − 14.0°.',sol:'076.0°.',placeholder:'degrees'},{q:'To travel due east, should the pilot aim slightly north or slightly south? (Type north or south.)',a:['south'],hint:'Aim against the wind.',sol:'South: aiming into the wind cancels its northward push.'}],done:'Adding the wind vector showed the pilot how far off course the plane would drift, and which way to correct.'}},
    {icon:'🚁',title:'The drone operator: enough battery?',desc:'Check a delivery drone’s round trip.',level:'⭐⭐ Delivery',mins:6,block:{type:'mission',story:'A delivery drone flies from its depot O to A, where OA = (3; 4) km, then on to B, where AB = (5; 0) km, then straight back to O. Its battery lasts for 20 km of flying.',parts:[{q:'How long is the first leg, OA? (km)',a:5,hint:'√(3² + 4²).',sol:'5 km.',placeholder:'km'},{q:'What is the position vector OB? Type the top number.',a:8,hint:'OA + AB = (3 + 5; 4 + 0).',sol:'OB = (8; 4).'},{q:'How far is the flight back from B to O, to 2 decimal places? (km)',a:8.94,tol:0.01,hint:'√(8² + 4²).',sol:'√80 ≈ 8.94 km.',placeholder:'km'},{q:'What is the total distance flown? (km, to 2 decimal places)',a:18.94,tol:0.01,hint:'5 + 5 + 8.94.',sol:'18.94 km.',placeholder:'km'},{q:'Is the battery enough? (Type yes or no.)',a:['yes'],hint:'Compare with 20 km.',sol:'Yes, with about 1 km to spare.'}],done:'Adding the legs as vectors gave the way home, and the magnitudes gave the battery check.'}},
    {icon:'🛶',title:'The river guide: where will we land?',desc:'Predict where a canoe reaches the far bank.',level:'⭐⭐ Tourism',mins:6,block:{type:'mission',story:'A river guide on the Rio Grande paddles straight across a river 60 m wide at 3 m/s. The current flows downstream at 4 m/s. The landing jetty is directly opposite the start.',parts:[{q:'How long does the crossing take? (seconds)',a:20,hint:'60 ÷ 3: only the across speed matters for crossing.',sol:'20 s.',placeholder:'seconds'},{q:'How far downstream does the current carry the canoe in that time? (m)',a:80,hint:'4 × 20.',sol:'80 m.',placeholder:'m'},{q:'What is the canoe’s actual speed? (m/s)',a:5,hint:'√(3² + 4²).',sol:'5 m/s.',placeholder:'m/s'},{q:'Will the canoe land at the jetty? (Type yes or no.)',a:['no'],hint:'Is it carried downstream?',sol:'No: 80 m downstream. The guide must aim upstream to reach the jetty.'}],done:'The two velocity components told the guide exactly where the canoe would land.'}},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire vectors.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2),c=function(x,y){return'('+fv(x)+'; '+fv(y)+')'};if(r===0){var T=[[3,4,5],[6,8,10],[5,12,13],[8,15,17]],t=T[R(0,3)],sx=R(0,1)?1:-1;return{q:'|'+c(t[0]*sx,t[1])+'| = ?',o:[String(t[2]),String(t[0]+t[1]),String(t[2]*t[2])],a:0,why:'√('+t[0]+'² + '+t[1]+'²).'}}if(r===1){var a=R(-4,5),b=R(-4,5),d=R(-4,5),e=R(-4,5),o=[c(a+d,b+e)];[c(a-d,b-e),c(a*d,b*e),c(a+d+1,b+e)].forEach(function(z){if(o.length<3&&o.indexOf(z)<0)o.push(z)});return{q:c(a,b)+' + '+c(d,e)+' = ?',o:o,a:0,why:'Add each component.'}}var k=R(2,4),x=R(1,4),y=R(-3,3)||1;return{q:'k'+c(x,y)+' = '+c(k*x,k*y)+'. k = ?',o:[String(k),String(k+1),String(-k)],a:0,why:'Divide a component.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent vectors that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a vector parallel to (3; −2) but pointing the opposite way. (Type x, y.)',placeholder:'x, y',check:function(v){var n=String(v).replace(/−/g,'-').replace(/[()\s]/g,'').split(',').map(Number);if(n.length!==2||n.some(isNaN))return{ok:false,msg:'Type x, y.'};var k=n[0]/3;return k<0&&Math.abs(n[1]-(-2)*k)<1e-9?{ok:true,msg:'Yes! It is '+fv(k)+' × (3; −2).'}:{ok:false,msg:'Use a negative multiple, such as (−6, 4).'}}},{q:'Type a vector with magnitude 13. (Type x, y, with neither 0.)',placeholder:'x, y',check:function(v){var n=String(v).replace(/−/g,'-').replace(/[()\s]/g,'').split(',').map(Number);return n.length===2&&n[0]&&n[1]&&Math.abs(Math.sqrt(n[0]*n[0]+n[1]*n[1])-13)<1e-9?{ok:true,msg:'Correct! The magnitude is 13.'}:{ok:false,msg:'Try 5, 12.'}}},{q:'In parallelogram OABC with OA = a and OC = c, write AC in terms of a and c.',placeholder:'…',check:function(v){var t=String(v).replace(/\s/g,'').replace(/−/g,'-').toLowerCase();return t==='c-a'||t==='-a+c'?{ok:true,msg:'Yes! AC = AO + OC = −a + c.'}:{ok:false,msg:'Route: A → O → C.'}}}]}},
