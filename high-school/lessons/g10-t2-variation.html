var VG2=function(key,k){var f=VT[key][2],W=360,H=260,X=function(x){return 40+x/6*300},ymax=Math.max(10,f(k,key[0]==='d'?6:0.5)),Y=function(y){return 230-Math.min(y,ymax)/ymax*200},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of '+VT[key][1]+' with k = '+k+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><line x1="40" y1="230" x2="345" y2="230" stroke="#3d2a73" stroke-width="2"/><line x1="40" y1="230" x2="40" y2="20" stroke="#3d2a73" stroke-width="2"/>',p=[];for(var x=0.2;x<=6.0001;x+=0.05){var y=f(k,x);if(y<=ymax*1.05)p.push(X(x).toFixed(1)+','+Y(y).toFixed(1))}s+='<polyline points="'+p.join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/>';for(var i=1;i<=6;i++){s+='<text x="'+X(i)+'" y="246" text-anchor="middle" font-size="11" fill="#5d5478">'+i+'</text>';var yy=f(k,i);if(yy<=ymax)s+='<circle cx="'+X(i)+'" cy="'+Y(yy)+'" r="4" fill="#c02d5f"/>'}return s+'<text x="190" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a73">'+VT[key][1]+', k = '+k+'</text></svg>'};

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 2',unit:'Module 2: Algebra 2',strand:'Algebra',standard:'Module 2, Algebra 2: appreciate the use of algebra as a language and a form of communication; appreciate the role of symbols and algebraic techniques in solving problems in mathematics and related fields.',
  objectives:['2.8 represent direct and inverse variation symbolically;','2.9 solve problems involving direct variation and inverse variation.'],
  focus:'Direct variation y ∝ x, y = kx; inverse variation y ∝ 1/x, y = k/x (as given in the syllabus); finding k from one pair of values; variation with powers and roots (y ∝ x², y ∝ √x, y ∝ 1/x²); recognising variation from tables and graphs; the effect of doubling or halving.',

 teacher:{time:'about 80 minutes, or two periods split after the first teaching page',flow:[['Engage','8 min','Taxi fare and journey time predictions.','Ask: "What happens when one quantity doubles?"'],['Explore','15 min','Variation lab: compare four kinds of variation.','Ask students to describe each graph’s shape.'],['Explain','35 min','Direct variation, finding k, powers; inverse variation, inverse square, recognising variation; I do, we do, you do.','Use real data, such as wages and speed.'],['Elaborate','12 min','Challenge Zone and Bronze to Gold problems.','Practise CSEC-style "find k" questions.'],['Evaluate','10 min','Quiz and reflection.','Watch for using y = kx for inverse variation.']],

 steps:[
  {phase:'engage',name:'Doubling',title:'What happens when you double it?',lead:'Two facts about a journey from Kingston to Mandeville. A worker’s pay varies directly with hours worked. The time a bus takes varies inversely with its speed.',

   patois:'If di bus go two time faster, wah happen to di time?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'If the bus travels twice as fast, what happens to the journey time?',options:['It doubles','It halves','It stays the same'],after:'You will see why on the second teaching page.'},{type:'write',fields:[{id:'know',label:'What I remember about direct and inverse proportion:',placeholder:'Example: more workers, less time'},{id:'wonder',label:'Two quantities in my life that are linked:',placeholder:'Example: hours worked and pay'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

   blocks:[{type:'mcq',star:true,questions:[{q:'3 pens cost $90. How much do 7 pens cost?',o:['$210','$630','$97'],a:0,why:'1 pen = $30.',teach:'Use the unitary method: 1 pen costs $90 ÷ 3 = $30, so 7 pens cost $210.'},{q:'4 workers take 6 days. How long would 8 workers take?',o:['3 days','12 days','10 days'],a:0,why:'Twice the workers, half the time.',teach:'This is inverse proportion: 24 worker-days ÷ 8 = 3 days.'},{q:'Solve 20 = k × 4.',o:['5','80','16'],a:0,why:'Divide by 4.',teach:'Divide both sides by 4: k = 5.'},{q:'Solve 6 = k ÷ 3.',o:['18','2','9'],a:0,why:'Multiply by 3.',teach:'Multiply both sides by 3: k = 18.'}]}]},
  {phase:'explore',name:'Variation lab',title:'Explore: the variation lab',lead:'Choose a type of variation and a value of k. The lab builds a table of values and draws the graph. Watch what happens to y when x doubles.',
   mission:['Try all four types. In each, compare y when x = 1, 2 and 4.','Notice the shape of each graph.','Complete all 3 challenges for a star.'],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="vlT">Type:</label><select id="vlT"><option value="d1">y ∝ x (direct)</option><option value="d2">y ∝ x² (direct, square)</option><option value="i1">y ∝ 1/x (inverse)</option><option value="i2">y ∝ 1/x² (inverse square)</option></select><label for="vlK">k:</label><input type="range" id="vlK" min="1" max="24" value="4"><output class="big vlKO"></output></div><div class="scene vlSvg"></div><div class="tile vlOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge vlN"></span> <strong class="vlQ"></strong></p><div class="controls"><input type="number" step="0.01" class="vlA" aria-label="Your answer" placeholder="answer"><button type="button" class="go vlC">Check</button></div><div class="fb vlFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var T=box.querySelector('#vlT'),K=box.querySelector('#vlK');api.nudges(K);function draw(){var key=T.value,k=+K.value,f=VT[key][2];box.querySelector('.vlKO').textContent=k;box.querySelector('.vlSvg').innerHTML=VG2(key,k);var r1=f(k,2)/f(k,1);box.querySelector('.vlOut').innerHTML='<table class="rec" style="max-width:none"><thead><tr><th>x</th>'+[1,2,3,4,6].map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody><tr><td><strong>y</strong></td>'+[1,2,3,4,6].map(function(x){return'<td>'+fv2(f(k,x))+'</td>'}).join('')+'</tr></tbody></table><p style="margin:6px 0 0">When x doubles (1 → 2), y is <strong>'+(r1>1?'multiplied by '+fv2(r1):'divided by '+fv2(1/r1))+'</strong>.'+(key[0]==='d'?' The graph goes up and passes through the origin.':' The graph comes down, getting closer to the axes but never touching them.')+'</p>'}T.onchange=draw;K.addEventListener('input',draw);var Q=[{t:'y ∝ x, and y = 12 when x = 3. Find y when x = 5.',a:20},{t:'y ∝ 1/x, and y = 6 when x = 4. Find y when x = 8.',a:3},{t:'y ∝ x². If x is doubled, y is multiplied by what number?',a:4}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.vlN').textContent='All done';box.querySelector('.vlQ').textContent='You completed every challenge!';box.querySelector('.vlC').disabled=true;return}box.querySelector('.vlN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.vlQ').textContent=Q[q].t}box.querySelector('.vlC').onclick=function(){var v=parseFloat(box.querySelector('.vlA').value),fb=box.querySelector('.vlFb');if(Math.abs(v-Q[q].a)<0.001){fb.className='fb ok vlFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.vlA').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no vlFb';fb.textContent=q<2?'Find k first, then use it. You can set k in the lab to check.':'Set the type to y ∝ x² and compare y at x = 1 and x = 2.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: direct variation',title:'Learn: direct variation',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Fus find k. Den use it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What direct variation means',explain:'<p>A worker paid by the hour earns more the longer she works. Work twice as long, earn twice as much. Work three times as long, earn three times as much. When two quantities are linked like this, we say one {{varies directly|when x is multiplied by a number, y is multiplied by the same number}} with the other.</p><p>We write this with the symbol <strong>{{∝|varies as}}</strong>, which means “varies as” or “is proportional to”: <strong>y ∝ x</strong>.</p><p>To turn this into an equation, we bring in a number called the {{constant of variation|the fixed number linking the quantities}}, k: <strong>y = kx</strong>. For the worker, k is her pay per hour. If she earns $800 an hour, her pay is P = 800h.</p><p>On a graph, direct variation is a straight line through the origin: no hours, no pay.</p>',visual:VG2('d1',4),
     example:{q:'The cost C of fabric varies directly with its length l. Write this symbolically.',steps:[{do:'In words: C varies directly as l.'},{do:'With the symbol: C ∝ l.'},{do:'As an equation: C = kl, where k is the cost per metre.'}]},
     mistake:'Writing y ∝ x as y = x + k. Direct variation MULTIPLIES by k.',
     check:{q:'"m varies directly as n" is written…',o:['m = kn','m = k/n','m = n + k'],a:0,why:'Direct: multiply by k.',hint:'y = kx.'}},
    {title:'Finding k, and solving problems',explain:'<p>Variation questions almost always follow the same three steps. It is worth learning them by heart.</p><p><strong>1. Write the equation</strong> with k, such as y = kx. <strong>2. Find k</strong> by substituting the pair of values you are given. <strong>3. Use k</strong>: rewrite the equation with the number for k, then substitute the new value to find what is asked.</p><p>Writing the full equation with k, such as y = 4x, is an important step: it is often worth a mark on its own in CSEC, and it makes the rest easy.</p>',
     example:{q:'y varies directly as x, and y = 12 when x = 3. Find y when x = 5.',steps:[{do:'Equation: y = kx.'},{do:'Find k: 12 = k × 3, so k = 4. So y = 4x.'},{do:'Use it: y = 4 × 5 = 20.'}]},
     mistake:'Skipping the step of finding k and guessing the answer. Always find k first.',
     check:{q:'p ∝ q, and p = 21 when q = 7. Find p when q = 10.',o:['30','70','15'],a:0,why:'k = 3, so p = 3 × 10.',hint:'Find k: 21 = 7k.'}},
    {title:'Direct variation with powers and roots',explain:'<p>Sometimes y varies with a power of x. The area of a circle varies as the <strong>square</strong> of its radius: A ∝ r² (here k = π). The distance a stone falls varies as the square of the time.</p><p>The same three steps work. If y ∝ x², write <strong>y = kx²</strong>. If y ∝ √x, write <strong>y = k√x</strong>. If y ∝ x³, write <strong>y = kx³</strong>.</p><p>Squares have a big effect. If y ∝ x² and x is doubled, y is multiplied by 2² = 4. If x is tripled, y is multiplied by 3² = 9. That is why a pizza with twice the diameter has four times as much pizza!</p>',visual:VG2('d2',1),
     example:{q:'d varies as the square of t, and d = 45 when t = 3. Find d when t = 5.',steps:[{do:'Equation: d = kt².'},{do:'45 = k × 9, so k = 5. So d = 5t².'},{do:'d = 5 × 25 = 125.'}]},
     mistake:'Forgetting to square: with d = kt² and t = 3, you must use 9, not 3.',
     check:{q:'y ∝ x². If x is tripled, y is multiplied by…',o:['9','3','6'],a:0,why:'3² = 9.',hint:'Square the factor.'}}]}]},
  {phase:'explain',name:'Teach: inverse variation',title:'Learn: inverse variation, and recognising variation',lead:'Next, quantities that move in opposite directions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'One go up, di odda go dung.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What inverse variation means',explain:'<p>A bus travelling from Kingston to Mandeville: the faster it goes, the less time the journey takes. Double the speed, and the time is halved. Triple the speed, and the time is divided by 3. When quantities are linked like this, one {{varies inversely|when x is multiplied by a number, y is divided by it}} with the other.</p><p>As the syllabus writes it: <strong>y ∝ 1/x</strong>, and as an equation, <strong>y = k/x</strong>. Another way to see it: <strong>xy = k</strong>, the product of the two quantities is always the same. For the bus, speed × time = distance, which is fixed.</p><p>On a graph, inverse variation is a curve that comes down steeply and then levels off, getting closer and closer to the axes without ever touching them.</p>',visual:VG2('i1',12),
     example:{q:'t varies inversely as s, and t = 2 hours when s = 60 km/h. Find t when s = 80 km/h.',steps:[{do:'Equation: t = k/s.'},{do:'Find k: 2 = k/60, so k = 120 (the distance, 120 km). So t = 120/s.'},{do:'t = 120/80 = 1.5 hours.'}]},
     mistake:'Using y = kx for inverse variation. "Inversely" means y = k/x.',
     check:{q:'y ∝ 1/x, and y = 5 when x = 4. What is k?',o:['20','1.25','9'],a:0,why:'5 = k/4, so k = 20.',hint:'Multiply both sides by 4.'}},
    {title:'Inverse square variation',explain:'<p>Some things weaken very quickly with distance. The brightness of a lamp, the strength of a phone signal, and the pull of gravity all follow an {{inverse square|y ∝ 1/x²: y = k/x²}} law: <strong>y ∝ 1/x²</strong>, or <strong>y = k/x²</strong>.</p><p>That means if you go <strong>twice as far</strong> away, the effect is divided by 2² = 4, not just by 2. Three times as far: divided by 9.</p><p>The three steps are exactly the same as before: write the equation with k, find k from the given values, then use it.</p>',visual:VG2('i2',24),
     example:{q:'I varies inversely as the square of d, and I = 50 when d = 2. Find I when d = 5.',steps:[{do:'Equation: I = k/d².'},{do:'50 = k/4, so k = 200. So I = 200/d².'},{do:'I = 200/25 = 8.'}]},
     mistake:'Forgetting to square d: with I = k/d² and d = 2, divide by 4, not 2.',
     check:{q:'y ∝ 1/x². If x is doubled, y is…',o:['divided by 4','divided by 2','multiplied by 4'],a:0,why:'2² = 4.',hint:'Square the factor.'}},
    {title:'Recognising variation from a table',explain:'<p>Given a table of values, how can you tell which kind of variation it is? Test the pattern.</p><p>For <strong>direct variation</strong>, y ÷ x is the same every time (that is k). For <strong>inverse variation</strong>, x × y is the same every time. For <strong>y ∝ x²</strong>, y ÷ x² is the same every time.</p><p>For example: x = 1, 2, 4 and y = 12, 6, 3. Here x × y = 12 every time, so y varies inversely as x, with k = 12: y = 12/x.</p>',
     example:{q:'Which variation fits x = 2, 3, 5 with y = 8, 18, 50?',steps:[{do:'y ÷ x: 4, 6, 10. Not constant, so not y ∝ x.'},{do:'y ÷ x²: 8/4 = 2, 18/9 = 2, 50/25 = 2. Constant!'},{do:'So y ∝ x², with k = 2: y = 2x².'}]},
     mistake:'Deciding from just two pairs of values. Check every pair in the table.',
     check:{q:'x = 1, 2, 3 and y = 6, 3, 2. What type of variation?',o:['Inverse: y = 6/x','Direct: y = 6x','y ∝ x²'],a:0,why:'x × y = 6 every time.',hint:'Try x × y.'}}]},{type:'recall',text:'Twice as fast means half the time: time varies inversely as speed, because speed × time = distance, which stays the same.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Direct',text:'y ∝ x → y = kx. y ∝ x² → y = kx². y ∝ √x → y = k√x. Graph of y = kx: straight line through the origin.'},{title:'Inverse',text:'y ∝ 1/x → y = k/x (so xy = k). y ∝ 1/x² → y = k/x².'},{title:'Three steps',text:'1. Write the equation with k. 2. Substitute the given pair to find k. 3. Rewrite with k and use it.'},{title:'Doubling x',text:'y ∝ x: y × 2. y ∝ x²: y × 4. y ∝ 1/x: y ÷ 2. y ∝ 1/x²: y ÷ 4.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'y varies as the square root of x, and y = 12 when x = 9. Find y when x = 25.',steps:[{do:'y = k√x.'},{do:'12 = k × 3, so k = 4. y = 4√x.'},{do:'y = 4 × 5 = 20.'}]},
     {type:'fill',q:'y ∝ 1/x, and y = 10 when x = 3. Find y when x = 6.',steps:[{text:'10 = k/3, so k = 30.'},{text:'y = 30/6 = ___',blank:true,a:5,hint:'30 ÷ 6.'}],sol:'5.'},
     {type:'own',q:'P ∝ Q. P = 35 when Q = 5. Find P when Q = 9.',a:63,hint:'k = 7.',sol:'P = 7 × 9 = 63.'},
     {type:'own',q:'F ∝ 1/d². F = 36 when d = 2. Find F when d = 6.',a:4,hint:'k = 36 × 4 = 144.',sol:'F = 144/36 = 4.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Direct or inverse?',desc:'Sort each real-life situation.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Do they go up together (direct), or does one go down as the other goes up (inverse)?',bins:[{id:'d',label:'Direct variation'},{id:'i',label:'Inverse variation'}],items:[{label:'Hours worked and wages',bin:'d'},{label:'Speed and time for a fixed journey',bin:'i'},{label:'Litres of petrol and its cost',bin:'d'},{label:'Number of workers and days to finish a job',bin:'i'},{label:'Number of patties and total cost',bin:'d'},{label:'People sharing a prize and each share',bin:'i'}]}},
    {icon:'🃏',title:'Match the equations',desc:'Match each statement to its equation.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['y varies directly as x','y = kx'],['y varies inversely as x','y = k/x'],['y varies as the square of x','y = kx²'],['y varies inversely as the square of x','y = k/x²'],['y varies as the square root of x','y = k√x'],['y varies as the cube of x','y = kx³']]}},
    {icon:'📏',title:'Order the effects',desc:'Order by what happens to y when x is doubled.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'When x is doubled, y is multiplied by some number. Tap from the smallest multiplier to the largest.',rounds:[[{label:'y ∝ 1/x²',v:0.25,show:'× ¼'},{label:'y ∝ 1/x',v:0.5,show:'× ½'},{label:'y ∝ x',v:2,show:'× 2'},{label:'y ∝ x²',v:4,show:'× 4'},{label:'y ∝ x³',v:8,show:'× 8'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'If y ∝ x, the graph passes through the origin.',a:'always',why:'y = kx gives y = 0 when x = 0.'},{s:'If y ∝ 1/x, then x × y is constant.',a:'always',why:'xy = k.'},{s:'A straight-line graph shows direct variation.',a:'sometimes',why:'Only if it passes through the origin; y = 2x + 3 does not.',hint:'Think of y = 2x + 3.'},{s:'If y ∝ 1/x, the graph touches the x-axis.',a:'never',why:'y = k/x is never 0.'},{s:'If y ∝ x² and x doubles, y doubles.',a:'never',why:'y is multiplied by 4.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'y varies inversely as x; y = 4 when x = 5. Find k.',lines:['y = kx','4 = 5k, so k = 0.8'],wrong:0,reasons:['Inverse variation is y = k/x: 4 = k/5, so k = 20','k should be 9','k should be 1.25'],reason:0,fix:'k = 20.'},{who:'Tia',q:'d ∝ t²; d = 20 when t = 2. Find k.',lines:['d = kt²','20 = 2k, so k = 10'],wrong:1,reasons:['She forgot to square: 20 = k × 4, so k = 5','k should be 40','k should be 18'],reason:0,fix:'k = 5.'},{who:'Omar',q:'y ∝ x. y = 15 when x = 3. Find y when x = 7.',lines:['y = 15 + (7 − 3) = 19'],wrong:0,reasons:['Direct variation multiplies: k = 5, so y = 35','He should subtract','y = 21'],reason:0,fix:'y = 35.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire variation.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,1),k=R(2,9),x1=R(1,6),x2=R(2,8);if(x1===x2)x2++;if(r===0){var y1=k*x1;return{q:'y ∝ x. y = '+y1+' when x = '+x1+'. y when x = '+x2+'?',o:[String(k*x2),String(y1+x2-x1),String(Math.round(y1/x2*100)/100)],a:0,why:'k = '+k+'.'}}var K=k*x1*x2,y=K/x1;return{q:'y ∝ 1/x. y = '+y+' when x = '+x1+'. y when x = '+x2+'?',o:[String(K/x2),String(y*x2/x1),String(y+x2-x1)].filter(function(z,i,a){return a.indexOf(z)===i}).concat([String(K/x2+1)]).slice(0,3),a:0,why:'k = '+K+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent variation problems that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'y ∝ x and y = 18 when x = 6. Choose a new x, and type x, y for a matching pair.',placeholder:'x, y',check:function(v){var n=String(v).split(',').map(parseFloat);return n.length===2&&!n.some(isNaN)&&Math.abs(n[1]-3*n[0])<1e-9?{ok:true,msg:'Yes! k = 3, so y = 3x.'}:{ok:false,msg:'First find k (18 = 6k), then use y = kx.'}}},{q:'y ∝ 1/x. Type a table pair x, y that matches y = 24 when x = 2.',placeholder:'x, y',check:function(v){var n=String(v).split(',').map(parseFloat);return n.length===2&&!n.some(isNaN)&&Math.abs(n[0]*n[1]-48)<1e-9?{ok:true,msg:'Yes! x × y = 48 every time.'}:{ok:false,msg:'k = 48, so x × y must equal 48.'}}},{q:'A pizza with a 10-inch diameter feeds 2 people. Area ∝ diameter². How many people could a 20-inch pizza feed?',placeholder:'people',check:function(v){return+v===8?{ok:true,msg:'Correct! Doubling the diameter multiplies the area by 4.'}:{ok:false,msg:'Doubling the diameter multiplies the area by 2².'}}}]}},
    {icon:'🚌',title:'Mission: the bus company',desc:'Use variation to plan a bus service.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A bus company runs routes from Kingston. Fuel cost varies directly with distance, and journey time varies inversely with average speed.',parts:[{q:'Fuel for 50 km costs $1,500. Write C = kd. What is k (dollars per km)?',a:30,hint:'1,500 = 50k.',sol:'k = 30.'},{q:'What does fuel cost for the 100 km trip from Kingston to Mandeville?',a:3000,hint:'C = 30 × 100.',sol:'$3,000.',placeholder:'dollars'},{q:'At 50 km/h, the 100 km trip takes 2 hours. Write t = k/s. What is k?',a:100,hint:'2 = k/50.',sol:'k = 100 (the distance).'},{q:'How long does the trip take at 80 km/h? (hours)',a:1.25,tol:0.001,hint:'t = 100/80.',sol:'1.25 hours (1 hour 15 minutes).',placeholder:'hours'},{q:'The phone signal on the bus varies inversely as the square of the distance from the tower. It is 36 units at 2 km. What is it at 6 km?',a:4,hint:'k = 36 × 4 = 144; 144/36.',sol:'4 units.'}],done:'You used direct variation, inverse variation and the inverse-square law to plan a real bus service.'}}
