<script>
var K=window.LessonKit;
var SHOE=[[5,3],[6,7],[7,9],[8,6],[9,3],[10,2]];
var RAIN=[['Jan',80],['Feb',60],['Mar',50],['Apr',90],['May',180],['Jun',150],['Jul',100],['Aug',140],['Sep',190],['Oct',230],['Nov',150],['Dec',90]];
var CL=['#2f5fc4','#ffb02e','#16766a','#c02d5f','#6a3fc0','#a85d00','#3f9a5a','#e8941a'];
var BAR=function(lab,val,ttl){var W=600,H=280,mx=Math.max.apply(null,val),bw=440/lab.length,s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart: '+ttl+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><text x="300" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2a73">'+ttl+'</text><line x1="70" y1="240" x2="560" y2="240" stroke="#3d2a73" stroke-width="2"/><line x1="70" y1="40" x2="70" y2="240" stroke="#3d2a73" stroke-width="2"/>';for(var t=0;t<=mx;t+=Math.max(1,Math.ceil(mx/5))){var y=240-t/mx*190;s+='<line x1="66" y1="'+y+'" x2="560" y2="'+y+'" stroke="#e6dff4"/><text x="60" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#5d5478">'+t+'</text>'}lab.forEach(function(l,i){var h=val[i]/mx*190,x=80+i*bw;s+='<rect x="'+(x+bw*0.15)+'" y="'+(240-h)+'" width="'+(bw*0.7)+'" height="'+h+'" fill="'+CL[i%CL.length]+'"/><text x="'+(x+bw/2)+'" y="258" text-anchor="middle" font-size="12" fill="#3d2a73">'+l+'</text>'});return s+'</svg>'};
var PIE=function(lab,val,ttl){var tot=val.reduce(function(a,b){return a+b},0),a0=-90,s='<svg viewBox="0 0 600 280" role="img" aria-label="Pie chart: '+ttl+'"><rect width="600" height="280" fill="#faf8fe"/><text x="300" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2a73">'+ttl+'</text>',cx=200,cy=150,r=110;val.forEach(function(v,i){var ang=v/tot*360,a1=a0+ang,p=function(a){return[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)]},P=p(a0),Q=p(a1);s+='<path d="M'+cx+' '+cy+' L'+P[0].toFixed(1)+' '+P[1].toFixed(1)+' A'+r+' '+r+' 0 '+(ang>180?1:0)+' 1 '+Q[0].toFixed(1)+' '+Q[1].toFixed(1)+' Z" fill="'+CL[i%CL.length]+'" stroke="#fff" stroke-width="2"/>';s+='<rect x="360" y="'+(50+i*28)+'" width="16" height="16" fill="'+CL[i%CL.length]+'"/><text x="384" y="'+(63+i*28)+'" font-size="13" fill="#3d2a73">'+lab[i]+': '+v+' ('+Math.round(ang)+'°)</text>';a0=a1});return s+'</svg>'};
var PICTO=function(lab,val,ttl){var s='<svg viewBox="0 0 600 '+(50+lab.length*34)+'" role="img" aria-label="Pictograph: '+ttl+'"><rect width="600" height="'+(50+lab.length*34)+'" fill="#faf8fe"/><text x="300" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2a73">'+ttl+'</text>';lab.forEach(function(l,i){var y=40+i*34;s+='<text x="80" y="'+(y+20)+'" text-anchor="end" font-size="13" fill="#3d2a73">'+l+'</text>';var full=Math.floor(val[i]/2),half=val[i]%2;for(var k=0;k<full;k++)s+='<text x="'+(95+k*30)+'" y="'+(y+22)+'" font-size="22">👟</text>';if(half)s+='<g><clipPath id="hc'+i+'"><rect x="'+(95+full*30)+'" y="'+y+'" width="12" height="30"/></clipPath><text x="'+(95+full*30)+'" y="'+(y+22)+'" font-size="22" clip-path="url(#hc'+i+')">👟</text></g>'});return s+'<text x="580" y="'+(40+lab.length*34)+'" text-anchor="end" font-size="12" fill="#5d5478">Key: 👟 = 2 students</text></svg>'};
var LINE=function(lab,val,ttl){var mx=Math.max.apply(null,val),s='<svg viewBox="0 0 600 280" role="img" aria-label="Line graph: '+ttl+'"><rect width="600" height="280" fill="#faf8fe"/><text x="300" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2a73">'+ttl+'</text><line x1="60" y1="240" x2="570" y2="240" stroke="#3d2a73" stroke-width="2"/><line x1="60" y1="40" x2="60" y2="240" stroke="#3d2a73" stroke-width="2"/>',pts=val.map(function(v,i){return[75+i*(480/(val.length-1)),240-v/mx*190]});for(var t=0;t<=mx;t+=50){var y=240-t/mx*190;s+='<line x1="56" y1="'+y+'" x2="570" y2="'+y+'" stroke="#e6dff4"/><text x="52" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#5d5478">'+t+'</text>'}s+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/>';pts.forEach(function(p,i){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="#c02d5f"/><text x="'+p[0].toFixed(1)+'" y="258" text-anchor="middle" font-size="11" fill="#3d2a73">'+lab[i]+'</text>'});return s+'</svg>'};

 glossary:[['Frequency table','A table showing each value and how many times it occurs.'],['Frequency (f)','How many times a value occurs.'],['fx','A value multiplied by its frequency: the total contributed by that value.'],['Cumulative frequency','A running total of the frequencies.'],['Pictograph','A chart using small pictures, with a key saying what each picture stands for.'],['Bar chart','A chart using bars whose heights show frequencies.'],['Pie chart','A circle divided into sectors whose angles show each share of the total.'],['Line graph','Points joined by lines, used to show how something changes over time.'],['Key','The part of a pictograph that tells you what one picture stands for.']],
 teacher:{time:'about 80 minutes, or two periods split after the first teaching page',flow:[['Engage','8 min','Shoe-shop prediction.','Collect real class shoe sizes as the guide suggests.'],['Explore','15 min','Frequency-table lab: averages and four graph types from one data set.','Ask: "Which graph shows this data best? Why?"'],['Explain','35 min','Averages from frequency tables; interpreting; pictographs, bar charts, pie charts and line graphs; I do, we do, you do.','Have students draw a pie chart with a protractor.'],['Elaborate','12 min','Challenge Zone and Bronze to Gold problems.','Use real Jamaican rainfall or sports data.'],['Evaluate','10 min','Quiz and reflection.','Watch for dividing Σfx by the number of rows.']],
  misconceptions:['Finding the mean by dividing Σfx by the number of rows instead of Σf.','Giving the frequency as the mode instead of the value.','Finding the median from the middle row of the table instead of the middle value.','Using a pie chart for data that changes over time.','Ignoring the key on a pictograph.'],

 steps:[
  {phase:'engage',name:'The shoe shop',title:'Which size should the shop order most?',lead:'A shoe shop in Half Way Tree is ordering school shoes for the new term. The owner surveyed 30 Grade 8 students and made a frequency table of their shoe sizes.',
   mission:['Type your name.','Predict which average the shop owner should use.','Write what you already know about averages and graphs.'],
   patois:'Di shoe shop fi order nuff a which size?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'Which average is most useful for deciding which shoe size to order the most of?',options:['The mean','The median','The mode'],after:'The frequency-table lab will help you decide.'},{type:'write',fields:[{id:'know',label:'Kinds of graph I have seen (in newspapers, on TV):',placeholder:'Example: a pie chart of election results'},{id:'wonder',label:'Something I would like to survey my class about:',placeholder:'Example: favourite sport'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'The mode of 3, 5, 5, 6, 8 is…',o:['5','6','3'],a:0,why:'5 appears most often.',teach:'The mode is the value that appears most often. 5 appears twice; every other value only once.'},{q:'The median of 2, 4, 7, 9, 10 is…',o:['7','4','6.4'],a:0,why:'7 is in the middle.',teach:'The median is the middle value of ordered data. With 5 values, the middle is the 3rd: 7.'},{q:'The mean of 2, 4, 6 is…',o:['4','12','6'],a:0,why:'12 ÷ 3 = 4.',teach:'Add the values (12) and divide by how many there are (3): 4.'},{q:'What is 1/4 of 360°?',o:['90°','45°','120°'],a:0,why:'360 ÷ 4 = 90.',teach:'A quarter of a full turn is 360° ÷ 4 = 90°.'}]}]},
  {phase:'explore',name:'Frequency-table lab',title:'Explore: one data set, many views',lead:'Here are the shoe sizes of 30 Grade 8 students as a frequency table. The lab works out the averages, step by step, and draws the data four different ways.',
   mission:['Study how the fx and cumulative frequency columns are made.','Switch between the four graphs. Which shows the data best?','Complete all 3 challenges for a star.'],
   patois:'Same data, four different picture.',
   blocks:[{type:'custom',star:true,html:'<table class="rec ftT"></table><div class="explain ftX"></div><div class="controls" role="group" aria-label="Choose a graph"><button type="button" class="ftG" data-g="bar">Bar chart</button><button type="button" class="ftG" data-g="pie">Pie chart</button><button type="button" class="ftG" data-g="pic">Pictograph</button><button type="button" class="ftG" data-g="line">Line graph</button></div><div class="scene ftSvg"></div><p class="ftNote" style="font-size:.9rem"></p><div class="tile"><p style="margin:0"><span class="badge ftB"></span> <strong class="ftQ"></strong></p><div class="controls"><input type="number" step="0.01" class="ftA" aria-label="Your answer" placeholder="answer"><button type="button" class="go ftC">Check</button></div><div class="fb ftFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var tot=0,sfx=0,cum=0,rows='';SHOE.forEach(function(r){tot+=r[1];sfx+=r[0]*r[1];cum+=r[1];rows+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[0]*r[1]+'</td><td>'+cum+'</td></tr>'});box.querySelector('.ftT').innerHTML='<thead><tr><th>Shoe size (x)</th><th>Frequency (f)</th><th>fx</th><th>Cumulative f</th></tr></thead><tbody>'+rows+'<tr><td><strong>Total</strong></td><td><strong>'+tot+'</strong></td><td><strong>'+sfx+'</strong></td><td></td></tr></tbody>';box.querySelector('.ftX').innerHTML='<strong>Mode</strong> = 7 (the highest frequency, 9). <strong>Median</strong>: the middle is between the 15th and 16th students; the cumulative frequency passes 15 in the size-7 row, so the median is 7. <strong>Mean</strong> = Σfx ÷ Σf = '+sfx+' ÷ '+tot+' ≈ '+(sfx/tot).toFixed(2)+'.';var lab=SHOE.map(function(r){return'Size '+r[0]}),val=SHOE.map(function(r){return r[1]});function show(g){[].forEach.call(box.querySelectorAll('.ftG'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-g')===g))});var svg,note;if(g==='bar'){svg=BAR(lab,val,'Shoe sizes of 30 students');note='A bar chart makes it easy to compare sizes and spot the mode (the tallest bar).'}else if(g==='pie'){svg=PIE(lab,val,'Shoe sizes of 30 students');note='A pie chart shows each size as a share of the whole class. Angle = f ÷ 30 × 360°.'}else if(g==='pic'){svg=PICTO(lab,val,'Shoe sizes of 30 students');note='A pictograph uses pictures. Always read the key: here one shoe stands for 2 students.'}else{svg=LINE(RAIN.map(function(r){return r[0]}),RAIN.map(function(r){return r[1]}),'Monthly rainfall in Kingston (mm), example data');note='A line graph shows change over TIME, so it suits rainfall by month, not shoe sizes. (Rainfall figures are rounded example data.)'}box.querySelector('.ftSvg').innerHTML=svg;box.querySelector('.ftNote').textContent=note}[].forEach.call(box.querySelectorAll('.ftG'),function(b){b.onclick=function(){show(b.getAttribute('data-g'))}});var T=[{t:'What is the mean shoe size, to 2 decimal places?',a:7.17,tol:0.006},{t:'What is the median shoe size?',a:7,tol:0},{t:'In the pie chart, what angle is the size-6 sector, in degrees?',a:84,tol:0.5}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ftB').textContent='All done';box.querySelector('.ftQ').textContent='You completed every challenge!';box.querySelector('.ftC').disabled=true;return}box.querySelector('.ftB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ftQ').textContent=T[q].t}box.querySelector('.ftC').onclick=function(){var v=parseFloat(box.querySelector('.ftA').value),fb=box.querySelector('.ftFb');if(Math.abs(v-T[q].a)<=T[q].tol){fb.className='fb ok ftFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ftA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ftFb';fb.textContent=q===2?'Angle = 7 ÷ 30 × 360°. Check the pie chart key.':'Not yet. Read the table and the explanation under it.'}};show('bar');task()}},
    {type:'recall',text:'The mode (size 7) is the most useful for the shop: it is the size most students wear. The mean, 7.17, is not even a real shoe size!'}]},
  {phase:'explain',name:'Teach: averages from frequency tables',title:'Learn: averages from a frequency table',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Di frequency tell yuh how much time a number show up.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The mode and median from a table',explain:'<p>When a survey has lots of answers, nobody wants to read a list of 30 numbers. A {{frequency table|a table showing each value and how many times it occurs}} squeezes it into a few rows: each value, and how many times it occurred, its {{frequency|how many times a value occurs}}.</p><p>The <strong>mode</strong> is the easiest to find: look for the biggest number in the frequency column, and read across to its value. Be careful: the mode is the shoe size, not the frequency.</p><p>For the <strong>median</strong>, imagine all 30 students lined up in order of shoe size. The middle is between the 15th and 16th students. To find where they are, add up the frequencies as you go down the table: a running total called the {{cumulative frequency|a running total of the frequencies}}. 3, then 10, then 19. The total passes 15 in the size-7 row, so the 15th and 16th students both wear size 7. The median is 7.</p>',
     example:{q:'Goals scored in 20 matches: 0 goals (f = 4), 1 (f = 7), 2 (f = 5), 3 (f = 3), 4 (f = 1). Find the mode and median.',steps:[{do:'Mode: the highest frequency is 7, for 1 goal. So the mode is 1 goal.'},{do:'Median: 20 matches, so the middle is between the 10th and 11th.'},{do:'Cumulative frequency: 4, 11, … The 10th and 11th matches are both in the "1 goal" row.',why:'4 matches had 0 goals; matches 5 to 11 had 1 goal.'},{do:'So the median is 1 goal.'}]},
     mistake:'Picking the middle ROW of the table as the median. The median is the middle VALUE when all the data is lined up, so use the cumulative frequency.',
     check:{q:'Scores 1 (f = 2), 2 (f = 6), 3 (f = 4). What is the mode?',o:['2','6','3'],a:0,why:'Score 2 has the highest frequency.',hint:'The value, not the frequency.'}},
    {title:'The mean from a table',explain:'<p>To find the mean, you need the total of all the values. But the table only lists each value once! Here is the trick: if 7 students wear size 6, those students contribute 6 × 7 = 42 to the total. So add a column called <strong>{{fx|a value multiplied by its frequency}}</strong>: each value times its frequency.</p><p>Add up the fx column to get the grand total, written <strong>Σfx</strong> (Σ is a Greek letter meaning “add them all up”). Add up the frequency column to get how many values there are, <strong>Σf</strong>.</p><p>Then <strong>mean = Σfx ÷ Σf</strong>. For the shoe sizes: 215 ÷ 30 ≈ 7.17.</p>',
     example:{q:'Find the mean number of goals: 0 goals (f = 4), 1 (f = 7), 2 (f = 5), 3 (f = 3), 4 (f = 1).',steps:[{do:'fx column: 0 × 4 = 0, 1 × 7 = 7, 2 × 5 = 10, 3 × 3 = 9, 4 × 1 = 4.'},{do:'Σfx = 0 + 7 + 10 + 9 + 4 = 30 goals. Σf = 20 matches.'},{do:'Mean = 30 ÷ 20 = 1.5 goals per match.'}]},
     mistake:'Dividing by the number of rows (5) instead of the total frequency (20). There were 20 matches, not 5.',
     check:{q:'Σfx = 120 and Σf = 40. What is the mean?',o:['3','80','160'],a:0,why:'120 ÷ 40 = 3.',hint:'Σfx ÷ Σf.'}},
    {title:'Interpreting the averages',explain:'<p>Finding the averages is only half the job. The real skill is deciding what they tell you.</p><p>The <strong>mode</strong> tells you the most popular value. That is why it suits the shoe shop: they want to stock the size most people wear. The <strong>median</strong> tells you the middle, so half are below it and half above. The <strong>mean</strong> spreads everything out evenly, which is useful for totals, but it can give an answer that is not a real value, like a shoe size of 7.17.</p><p>Compare the averages to tell a story. If the mean is much bigger than the median, a few large values are pulling it up. Always connect your answer back to the real situation: "The typical student wears size 7."</p>',
     example:{q:'A taxi driver’s daily earnings: median $6,000, mean $8,500. What does this suggest?',steps:[{do:'The mean is much higher than the median.'},{do:'So a few days had very high earnings, pulling the mean up.',why:'The median is not affected much by a few very big values.'},{do:'A typical day is closer to $6,000.'}]},
     mistake:'Thinking the mean is always the best average. For “most popular”, use the mode; with a few extreme values, use the median.',
     check:{q:'A clothing store wants to know which T-shirt size to stock most. Which average?',o:['Mode','Mean','Range'],a:0,why:'The mode is the most popular size.',hint:'Most popular.'}}]}]},
  {phase:'explain',name:'Teach: statistical graphs',title:'Learn: pictographs, bar charts, pie charts and line graphs',lead:'Next, four ways to show data as a picture, and how to choose the right one.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Pick di right graph fi di right data.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Pictographs and bar charts',explain:'<p>A {{pictograph|a chart using small pictures, with a key}} uses small pictures to show data. It is eye-catching, so you often see them in newspapers. The most important part is the {{key|the part of a pictograph that says what one picture stands for}}: it tells you what one picture stands for. If one shoe stands for 2 students, then half a shoe means 1 student.</p><p>A {{bar chart|a chart using bars whose heights show frequencies}} uses bars instead. The height of each bar shows the frequency, read against the scale on the side. Bar charts make it easy to compare: the tallest bar is the mode.</p><p>When you draw a bar chart, give it a title, label both axes, use an even scale, and make all the bars the same width with equal gaps.</p>',visual:BAR(SHOE.map(function(r){return'Size '+r[0]}),SHOE.map(function(r){return r[1]}),'Shoe sizes of 30 students'),
     example:{q:'In a pictograph, one 👟 stands for 2 students. Size 6 shows 3½ shoes. How many students wear size 6?',steps:[{do:'Each full shoe = 2 students, so 3 shoes = 6 students.'},{do:'Half a shoe = 1 student.'},{do:'Total: 6 + 1 = 7 students.'}]},
     mistake:'Counting the pictures without reading the key. 3½ pictures is not 3½ students when each picture stands for 2.',
     check:{q:'In a pictograph, one 🍊 = 4 oranges. A row shows 5 🍊. How many oranges?',o:['20','5','9'],a:0,why:'5 × 4 = 20.',hint:'Use the key.'}},
    {title:'Pie charts',explain:'<p>A {{pie chart|a circle divided into sectors whose angles show each share of the total}} shows how a whole is shared out, like slices of a pizza. Bigger slices mean bigger shares. It is perfect for answering “what fraction of the class…?”</p><p>A full circle is 360°, and that stands for the whole total. To draw a pie chart, work out each slice’s angle: <strong>angle = frequency ÷ total × 360°</strong>. Then measure each angle with a protractor.</p><p>For the shoe sizes, size 6 has 7 out of 30 students: 7 ÷ 30 × 360° = 84°. A quick check: all the angles must add up to 360°.</p><p>To read a pie chart, work backwards: a 90° slice is 90/360 = ¼ of the total.</p>',visual:PIE(SHOE.map(function(r){return'Size '+r[0]}),SHOE.map(function(r){return r[1]}),'Shoe sizes of 30 students'),
     example:{q:'In a survey of 60 students, 15 chose cricket. What angle is the cricket sector?',steps:[{do:'Fraction of the total: 15 ÷ 60 = ¼.'},{do:'Angle = ¼ × 360° = 90°.'}]},
     mistake:'Using the frequency as the angle (15°). You must change each frequency into a share of 360°.',
     check:{q:'In a pie chart of 40 people, a sector is 90°. How many people does it show?',o:['10','90','20'],a:0,why:'90° is ¼ of 360°, and ¼ of 40 is 10.',hint:'What fraction of 360° is 90°?'}},
    {title:'Line graphs, and choosing the right graph',explain:'<p>A {{line graph|points joined by lines, showing change over time}} shows how something <strong>changes over time</strong>: temperature during the day, rainfall each month, or the price of petrol each week. Plot a point for each time, then join the points with straight lines. The ups and downs show the trend.</p><p>Look at Kingston’s rainfall: the line climbs in May and October, the two rainy seasons, and dips in the drier months.</p><p>So which graph should you choose? Use a <strong>bar chart</strong> to compare separate groups. Use a <strong>pie chart</strong> to show shares of a whole. Use a <strong>pictograph</strong> for a simple, eye-catching display. And use a <strong>line graph</strong> only for data that changes over time. Joining shoe sizes with a line would not make sense!</p>',visual:LINE(RAIN.map(function(r){return r[0]}),RAIN.map(function(r){return r[1]}),'Monthly rainfall in Kingston (mm), example data'),
     example:{q:'Choose a graph for: (a) the temperature every hour on Sports Day; (b) the favourite fruits of a class.',steps:[{do:'(a) Temperature changes over time: a line graph.'},{do:'(b) Separate categories to compare: a bar chart (or a pie chart to show shares).'}]},
     mistake:'Using a line graph for categories like favourite fruits. There is no “between mango and banana”, so joining the points makes no sense.',
     check:{q:'Which graph best shows how a baby’s mass changes month by month?',o:['Line graph','Pie chart','Pictograph'],a:0,why:'It changes over time.',hint:'Change over time.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'From a frequency table',text:'Mode: value with the highest frequency. Median: use cumulative frequency to find the middle value. Mean: Σfx ÷ Σf.'},{title:'Interpreting',text:'Mode = most popular. Median = the middle. Mean = an even share; it may not be a real value and is pulled by extreme values.'},{title:'Pie charts',text:'Angle = frequency ÷ total × 360°. All the angles add up to 360°.'},{title:'Choosing a graph',text:'Bar chart: compare groups. Pie chart: shares of a whole. Pictograph: simple display with a key. Line graph: change over time.'}]},
    {type:'guided',star:true,items:[

  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',

   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Which graph?',desc:'Choose the best graph for each set of data.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Over time → line. Shares of a whole → pie. Comparing groups → bar.',bins:[{id:'l',label:'Line graph'},{id:'p',label:'Pie chart'},{id:'b',label:'Bar chart'}],items:[{label:'Temperature each hour of the day',bin:'l'},{label:'How a family spends its monthly income',bin:'p'},{label:'Goals scored by 5 different teams',bin:'b'},{label:'Petrol price each week for a year',bin:'l'},{label:'Share of students in each house at sports day',bin:'p'},{label:'Number of students in each grade',bin:'b'}]}},
    {icon:'🃏',title:'Match the words',desc:'Match each term to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Frequency','how many times a value occurs'],['fx','value × frequency'],['Σf','total number of values'],['Cumulative frequency','a running total'],['Key','what one picture stands for'],['Sector angle','frequency ÷ total × 360°']]}},
    {icon:'📏',title:'Order the sectors',desc:'Work out each pie chart angle, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'A survey of 120 students: Football 45, Cricket 30, Netball 25, Track 20. Work out each angle, then tap from smallest to largest.',rounds:[[{label:'Track',v:60,show:'60°'},{label:'Netball',v:75,show:'75°'},{label:'Cricket',v:90,show:'90°'},{label:'Football',v:135,show:'135°'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The angles of a pie chart add up to 360°.',a:'always',why:'The whole circle stands for the whole total.'},{s:'The mean from a frequency table is one of the values in the table.',a:'sometimes',why:'The goals mean was 1.5, not a value; but means can be whole values too.',hint:'Remember the shoe sizes.'},{s:'The mode is the biggest number in the frequency column.',a:'never',why:'The mode is the VALUE with the biggest frequency, not the frequency itself.'},{s:'A line graph is suitable for favourite colours.',a:'never',why:'Colours are categories, not times; joining them with a line makes no sense.'},{s:'Σf tells you how many values there are.',a:'always',why:'Adding the frequencies counts every value once.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Find the mean: 1 (f = 4), 2 (f = 3), 3 (f = 3).',lines:['Σfx = 4 + 6 + 9 = 19','Mean = 19 ÷ 3 rows ≈ 6.3'],wrong:1,reasons:['Divide by Σf (10 values), not the number of rows','Σfx should be 6','The mean should be 2'],reason:0,fix:'19 ÷ 10 = 1.9.'},{who:'Shanice',q:'Sizes 5 (f = 2), 6 (f = 9), 7 (f = 4). Find the mode.',lines:['The biggest frequency is 9','So the mode is 9'],wrong:1,reasons:['The mode is the value (size 6), not the frequency','The mode is 7','There is no mode'],reason:0,fix:'The mode is size 6.'},{who:'Kemar',q:'In a pie chart of 40 students, 10 like cricket. Find the angle.',lines:['Angle = 10°'],wrong:0,reasons:['Angle = 10 ÷ 40 × 360° = 90°','The angle is 40°','The angle is 360°'],reason:0,fix:'90°.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire table and chart questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var T=[30,36,40,60,72,90,120][R(0,6)],f=T/[2,3,4,6][R(0,3)];return{q:'Total '+T+'. A category has '+f+'. Pie chart angle?',o:[f/T*360+'°',f+'°',(f/T*180)+'°'],a:0,why:f+' ÷ '+T+' × 360.'}}if(r===1){var s=R(2,9)*10,n=s/[2,5,10][R(0,2)];return{q:'Σfx = '+s+', Σf = '+n+'. Mean?',o:[String(s/n),String(s*n),String(s-n)],a:0,why:'Σfx ÷ Σf.'}}var k=[2,4,5][R(0,2)],p=R(2,6);return{q:'Key: 1 picture = '+k+' people. A row has '+p+' pictures. How many people?',o:[String(k*p),String(p),String(k+p)],a:0,why:p+' × '+k+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Design data that fits each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A pie chart has 4 sectors. Three are 90°, 120° and 60°. What is the fourth angle?',placeholder:'degrees',check:function(v){return parseFloat(v)===90?{ok:true,msg:'Yes! 360 − 270 = 90°.'}:{ok:false,msg:'The angles must add up to 360°.'}}},{q:'Frequencies for scores 1, 2 and 3 so that the mode is 3 and there are 10 values. (Type f1, f2, f3.)',placeholder:'f1, f2, f3',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==3||n.some(function(x){return!(x>=0)||x%1}))return{ok:false,msg:'Type three whole numbers.'};var s=n[0]+n[1]+n[2];if(s!==10)return{ok:false,msg:'They add up to '+s+'. You need 10 values.'};return n[2]>n[0]&&n[2]>n[1]?{ok:true,msg:'Yes! Score 3 has the highest frequency, so it is the mode.'}:{ok:false,msg:'Score 3 needs the highest frequency.'}}},{q:'In a pictograph, 1 picture = 4 students. How many pictures are needed to show 18 students?',placeholder:'pictures',check:function(v){return parseFloat(v)===4.5?{ok:true,msg:'Yes! 18 ÷ 4 = 4.5, so 4 full pictures and a half.'}:{ok:false,msg:'Divide the number of students by what one picture stands for.'}}}]}},
    {icon:'👟',title:'Mission: the class shoe survey',desc:'Carry out the guide’s shoe-size survey with a Grade 8 class.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A Grade 8 class in Montego Bay measured their shoe sizes, as the NSC guide suggests. Sizes: 6 (f = 4), 7 (f = 8), 8 (f = 10), 9 (f = 6), 10 (f = 2).',parts:[{q:'How many students were surveyed?',a:30,hint:'Add the frequencies.',sol:'30.'},{q:'What is the mode?',a:8,hint:'The highest frequency.',sol:'Size 8.'},{q:'What is Σfx?',a:240,hint:'24 + 56 + 80 + 54 + 20.',sol:'240.'},{q:'What is the mean shoe size?',a:8,tol:0.001,hint:'240 ÷ 30.',sol:'8.'},{q:'In a pie chart, what angle would size 8 have?',a:120,hint:'10 ÷ 30 × 360°.',sol:'120°.',placeholder:'degrees'}],done:'You carried out a real survey, found the averages from a frequency table, and planned a pie chart.'}}
