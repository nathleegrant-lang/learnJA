 sq:{name:'Square ABCD, sides 5 cm',steps:function(){var A=[80,300],B=[280,300],D=[80,100],C=[280,100];return[

  ['Open the compasses to 5 cm. With the point on A, mark D on the vertical line.',ARC(80,300,200,80,100,'#c02d5f')+PT(D,'D',-16,-6)],
  ['Keep the compasses at 5 cm. Draw an arc from B and an arc from D. They cross at C.',ARC(280,300,200,80,100,'#c02d5f')+ARC(80,100,200,-10,10,'#c02d5f')+PT(C,'C',6,-6)],

  ['Set the compasses to 4 cm. From A, mark D on the vertical line.',ARC(80,300,160,80,100,'#c02d5f')+PT(D,'D',-16,-6)],

 trap:{name:'Trapezium ABCD, AB = 7 cm, angle A = 90°, AD = 3 cm, DC = 4 cm with DC ∥ AB',steps:function(){var A=[80,300],B=[360,300],D=[80,180],C=[240,180];return[

  ['Construct 90° at D, so the line through D is parallel to AB. (Two angles of 90° make the lines parallel.)',ARC(80,180,50,-105,-75)+ARC(80,180,50,75,105)+ARC(80,230,80,15,45)+ARC(80,130,80,-45,-15)+LN(D,[460,180],'#2f5fc4',2,true)],

 glossary:[['Construct','Draw accurately using only a ruler (straight edge) and compasses, plus a protractor only to check.'],['Arc','Part of a circle, drawn with compasses.'],['Perpendicular','At right angles (90°).'],['Parallel','Always the same distance apart, never meeting.'],['Square','4 equal sides and 4 right angles.'],['Rectangle','4 right angles; opposite sides equal.'],['Parallelogram','Opposite sides equal and parallel.'],['Rhombus','4 equal sides; opposite sides parallel.'],['Trapezium','Exactly one pair of parallel sides.'],['Diagonal','A line joining opposite corners.']],

 steps:[
  {phase:'engage',name:'The garden bed',title:'Making a perfect garden bed',lead:'A school in Christiana wants a rectangular vegetable bed, 6 m by 4 m. The groundsman marks it out with string, but the corners look a bit crooked. A student says, "If the two diagonals are the same length, the corners must be right angles."',
   mission:['Type your name.','Predict whether the student is right.','Write what you already know about constructions.'],

   blocks:[{type:'name'},{type:'predict',star:true,q:'For a four-sided shape with opposite sides equal, do equal diagonals prove the corners are right angles?',options:['Yes, it must be a rectangle','No, it tells you nothing','Only if all sides are equal'],after:'You will use this check on the first teaching page.'},{type:'write',fields:[{id:'know',label:'Constructions I can already do (angles, triangles, bisectors):',placeholder:'Example: bisect a line'},{id:'wonder',label:'Where builders need exact right angles:',placeholder:'Example: house foundations'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'Bisecting a 90° angle gives…',o:['45°','30°','60°'],a:0,why:'Half of 90°.',teach:'To bisect means to cut in half. Half of 90° is 45°.'},{q:'Which angle can you make with compasses by drawing two equal arcs, like an equilateral triangle?',o:['60°','90°','45°'],a:0,why:'An equilateral triangle has 60° angles.',teach:'Arcs of the same radius from A and from P make an equilateral triangle, whose angles are all 60°.'},{q:'A quadrilateral with exactly one pair of parallel sides is a…',o:['trapezium','parallelogram','rhombus'],a:0,why:'Only one pair is parallel.',teach:'A trapezium has exactly one pair of parallel sides.'},{q:'A rhombus has…',o:['4 equal sides','4 right angles','only one pair of equal sides'],a:0,why:'Like a pushed-over square.',teach:'A rhombus has four equal sides; its opposite sides are parallel, but its angles need not be 90°.'}]}]},
  {phase:'explore',name:'Construction player',title:'Explore: the construction player',lead:'Choose a quadrilateral and step through its construction. Watch each arc and line appear. Better still, build it on paper with your own ruler and compasses as you go!',
   mission:['Step through all four constructions. Notice which angle each one starts with.','Build at least one on paper alongside the player.','Complete all 3 challenges for a star.'],
   patois:'Step by step. Nuh change di compass width inna di middle.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="cpK">Construction:</label><select id="cpK"><option value="sq">Square, 5 cm</option><option value="rect">Rectangle, 6 cm by 4 cm</option><option value="par">Parallelogram, 6 cm and 4 cm, angle 60°</option><option value="trap">Trapezium, 7 cm, 3 cm and 4 cm</option></select></div><div class="scene cpSvg"></div><div class="explain cpX" aria-live="polite"></div><div class="controls"><button type="button" class="cpB">◀ Back</button><button type="button" class="go cpN">Next step ▶</button></div><div class="tile"><p style="margin:0"><span class="badge cpTN"></span> <strong class="cpQ"></strong></p><div class="controls"><input type="text" class="cpA" aria-label="Your answer" placeholder="answer"><button type="button" class="go cpC">Check</button></div><div class="fb cpFb" aria-live="polite">Use the player to help you.</div></div>',
     init:function(box,api){var sel=box.querySelector('#cpK'),n=0;function draw(){var c=C9[sel.value],st=c.steps();n=Math.max(0,Math.min(n,st.length-1));box.querySelector('.cpSvg').innerHTML=DRAW9(sel.value,n);box.querySelector('.cpX').innerHTML='<strong>'+c.name+'</strong><br>Step '+(n+1)+' of '+st.length+': '+st[n][0];box.querySelector('.cpB').disabled=n===0;box.querySelector('.cpN').disabled=n===st.length-1}box.querySelector('.cpN').onclick=function(){n++;draw()};box.querySelector('.cpB').onclick=function(){n--;draw()};sel.onchange=function(){n=0;draw()};var T=[{t:'Which angle do you construct at A to start the square and the rectangle? (Type the number of degrees.)',ok:function(v){return parseFloat(v)===90}},{t:'Which angle is constructed at A for the parallelogram?',ok:function(v){return parseFloat(v)===60}},{t:'In the trapezium, why is a second 90° angle constructed at D? (Type parallel or equal.)',ok:function(v){return/parallel/.test(v)}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.cpTN').textContent='All done';box.querySelector('.cpQ').textContent='You completed every challenge!';box.querySelector('.cpC').disabled=true;return}box.querySelector('.cpTN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.cpQ').textContent=T[q].t}box.querySelector('.cpC').onclick=function(){var v=String(box.querySelector('.cpA').value).trim().toLowerCase().replace('°',''),fb=box.querySelector('.cpFb');if(T[q].ok(v)){fb.className='fb ok cpFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.cpA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no cpFb';fb.textContent='Not yet. Step through that construction and read step 2 (or step 4 for the trapezium).'}};draw();task()}}]},
  {phase:'explain',name:'Teach: squares and rectangles',title:'Learn: instruments, angles, squares and rectangles',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Sharp pencil, tight compass, an keep di arc dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Instruments, good habits and key angles',explain:'<p>To {{construct|draw accurately using only a ruler and compasses}} a shape means to draw it accurately using a ruler and compasses. A protractor is only used at the end, to check your work.</p><p>Good habits make all the difference. Use a <strong>sharp pencil</strong>, so lines are thin and exact. Make sure your compasses are <strong>tight</strong>, so the width does not slip. And always leave your {{arcs|parts of circles drawn with compasses}} on the page: they show your method, and examiners look for them.</p><p>Two angle constructions do almost all the work. A <strong>90° angle</strong> comes from the perpendicular construction you learned in Grade 7. A <strong>60° angle</strong> comes from two arcs of the same radius, which make an equilateral triangle. From these, you can make more: bisect 90° to get 45°, bisect 60° to get 30°, and add them to get 120°, 135° or 150°.</p>',
     example:{q:'How could you construct a 135° angle?',steps:[{do:'Construct a 90° angle.'},{do:'Bisect the 90° on the other side to get 45° next to it.',why:'135° = 90° + 45°.'},{do:'Together they make 135°.'}]},
     mistake:'Measuring an angle with a protractor when the question says "construct". You must use compasses and a ruler.',
     check:{q:'Bisecting a 60° angle gives…',o:['30°','120°','45°'],a:0,why:'Half of 60° is 30°.',hint:'Bisect = cut in half.'}},
    {title:'Constructing a square and a rectangle',explain:'<p>Squares and rectangles both have four right angles, so both start the same way: draw one side, then construct a 90° angle at one end.</p><p><strong>The plan:</strong> draw AB the right length. Construct 90° at A. Use compasses to mark D the right distance up the new line. Then find C, the last corner, with two arcs: one from D (the length of AB) and one from B (the length of AD). Where they cross is C. Finally, join it all up.</p><p>Why do the two arcs give the right corner? Because C must be the right distance from both B and D at the same time, and only one point (on that side) does that.</p><p>For a square, every length is the same, so you never need to change your compass width after setting it. For a rectangle, you change between the two lengths, so be careful.</p>',visual:DRAW9('rect',4),
     example:{q:'Plan the construction of a rectangle 7 cm by 3 cm.',steps:[{do:'Rough sketch first, labelled with the lengths.',why:'A sketch shows where each corner goes.'},{do:'Draw AB = 7 cm; construct 90° at A; mark AD = 3 cm.'},{do:'Arc from D with radius 7 cm; arc from B with radius 3 cm; they cross at C. Join BC and DC.'}]},
     mistake:'Using the wrong radius for the final arcs. From D, use the length of AB; from B, use the length of AD.',
     check:{q:'To find C in rectangle ABCD (AB = 6, AD = 4), the arc from D should have radius…',o:['6 cm','4 cm','10 cm'],a:0,why:'DC must equal AB = 6 cm.',hint:'DC is opposite AB.'}},
    {title:'Checking with diagonals',explain:'<p>How do you know your construction is accurate? Use the properties of the shape.</p><p>A rectangle has a special property: its two {{diagonals|lines joining opposite corners}} are <strong>equal in length</strong>. A square goes further: its diagonals are equal AND cross at right angles AND cut each other in half.</p><p>This is exactly what the student in the opening puzzle meant. If a four-sided shape already has opposite sides equal (a parallelogram), and its diagonals are equal, then its corners must be right angles: it is a rectangle. Builders and groundsmen use this check all the time to make sure foundations and garden beds are truly square.</p><p>So after constructing, measure your diagonals. If they match (within a millimetre), your right angles are accurate.</p>',
     example:{q:'A groundsman marks a 6 m by 4 m bed. The diagonals measure 7.2 m and 7.4 m. What should he do?',steps:[{do:'The diagonals are not equal, so the corners are not right angles.'},{do:'He should move the corners until both diagonals are the same.'},{do:'For 6 m by 4 m, each diagonal should be about 7.2 m (by Pythagoras: √52 ≈ 7.21).'}]},
     mistake:'Thinking any shape with equal diagonals is a rectangle. A kite or trapezium can have equal diagonals too; the check works for shapes with opposite sides equal.',
     check:{q:'Which shape’s diagonals are equal AND perpendicular?',o:['Square','Rectangle that is not square','Parallelogram'],a:0,why:'A square has both properties.',hint:'The most symmetrical one.'}}]},{type:'recall',text:'The student is right, provided opposite sides are equal: a parallelogram with equal diagonals is a rectangle, so its corners are right angles.'}]},
  {phase:'explain',name:'Teach: other quadrilaterals',title:'Learn: parallelograms, rhombuses and trapezia',lead:'Next, quadrilaterals that do not have four right angles.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Sketch it first, den construct it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Constructing a parallelogram',explain:'<p>A {{parallelogram|opposite sides equal and parallel}} has opposite sides that are equal and parallel, but its corners need not be right angles. To construct one, you usually need two side lengths and the angle between them.</p><p>The method is just like the rectangle, but with a different angle at A. Draw AB. Construct the given angle at A, such as 60°. Mark AD along that line. Then find C with two arcs: from D with the length of AB, and from B with the length of AD.</p><p>Notice the pattern? For every quadrilateral, the final corner is found with two arcs. That works because opposite sides of a parallelogram are equal: DC = AB and BC = AD.</p>',visual:DRAW9('par',4),
     example:{q:'Construct parallelogram PQRS with PQ = 5 cm, PS = 3 cm and angle P = 120°.',steps:[{do:'Draw PQ = 5 cm.'},{do:'Construct 120° at P (60° + 60°, by stepping the same arc twice).'},{do:'Mark PS = 3 cm. Arc from S radius 5 cm, arc from Q radius 3 cm: they meet at R. Join QR and SR.'}]},
     mistake:'Putting the angle at the wrong corner. Read carefully which angle is given, and construct it at that corner.',
     check:{q:'In parallelogram ABCD, AB = 8 cm. How long is DC?',o:['8 cm','4 cm','16 cm'],a:0,why:'Opposite sides are equal.',hint:'DC is opposite AB.'}},
    {title:'Constructing a rhombus',explain:'<p>A {{rhombus|4 equal sides; opposite sides parallel}} has four equal sides. It looks like a square that has been pushed over, so its angles are not usually 90°.</p><p>Because all the sides are equal, the rhombus is a lovely construction: once you set your compasses to the side length, you never change them! Draw AB. Construct the given angle at A. Mark D along the new line. Then, with the same width, draw arcs from B and from D. They cross at C.</p><p>You could also construct a rhombus from its diagonals. The diagonals of a rhombus cross at right angles and cut each other in half, so you can draw one diagonal, construct its perpendicular bisector, and mark half of the other diagonal on each side.</p>',
     example:{q:'Construct a rhombus with sides 5 cm and an angle of 60°.',steps:[{do:'Draw AB = 5 cm. Construct 60° at A.'},{do:'Keep the compasses at 5 cm. Mark D on the 60° line.',why:'All sides are 5 cm, so the width never changes.'},{do:'Arcs from B and D (still 5 cm) meet at C. Join up.'}]},
     mistake:'Changing the compass width. In a rhombus, every side is the same, so keep the same width throughout.',
     check:{q:'In a rhombus, the diagonals…',o:['cross at right angles','are always equal','are parallel'],a:0,why:'A rhombus’s diagonals are perpendicular bisectors of each other.',hint:'Think about the diagonal method.'}},
    {title:'Constructing a trapezium, and planning any construction',explain:'<p>A {{trapezium|exactly one pair of parallel sides}} has exactly one pair of parallel sides. To construct one, you need to make a line through a point that is parallel to the base.</p><p>A neat way: if the trapezium has a right angle at A, construct 90° at A, mark D, and then construct another 90° at D. Two lines both perpendicular to AD must be parallel to each other. Then mark C along the parallel line, and join CB.</p><p>For any construction, follow the same plan: <strong>1.</strong> Make a rough sketch and label every given measurement. <strong>2.</strong> Decide which side to draw first, usually the longest or the base. <strong>3.</strong> Construct angles, never measure them. <strong>4.</strong> Use arcs to mark lengths and to find the last corner. <strong>5.</strong> Check with a ruler and protractor.</p>',visual:DRAW9('trap',4),
     example:{q:'Construct trapezium ABCD with AB = 7 cm, angle A = 90°, AD = 3 cm, DC = 4 cm and DC parallel to AB.',steps:[{do:'Draw AB = 7 cm; construct 90° at A; mark AD = 3 cm.'},{do:'Construct 90° at D, giving a line through D parallel to AB.'},{do:'Mark DC = 4 cm on that line. Join CB.'}]},
     mistake:'Guessing that a line "looks" parallel. Construct it, using two right angles or equal corresponding angles.',
     check:{q:'What should you always do BEFORE starting a construction?',o:['Make a labelled rough sketch','Measure all the angles','Rub out the arcs'],a:0,why:'The sketch plans where everything goes.',hint:'Plan first.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Use your instruments.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Do the "You do" constructions on paper, then answer the check question.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Key angles',text:'90° (perpendicular), 60° (equal arcs). Bisect for 45° and 30°; combine for 120°, 135° and 150°.'},{title:'Squares and rectangles',text:'Draw AB, construct 90° at A, mark AD, then arcs from D (length AB) and B (length AD) meet at C. Check: equal diagonals.'},{title:'Parallelograms and rhombuses',text:'Same method with the given angle. Rhombus: keep the same compass width throughout.'},{title:'Trapezia and planning',text:'Two right angles make parallel lines. Always sketch first, construct angles, keep arcs, and check.'}]},
    {type:'guided',star:true,items:[
