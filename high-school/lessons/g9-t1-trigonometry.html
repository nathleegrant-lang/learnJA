var RT=function(th,h,lbl){var r=th*Math.PI/180,W=600,H=300,sc=Math.min(420/(h*Math.cos(r)),220/(h*Math.sin(r))),ax=60,ay=260,bx=ax+h*Math.cos(r)*sc,cy=ay-h*Math.sin(r)*sc;return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'A right-angled triangle with the angle at A')+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><polygon points="'+ax+','+ay+' '+bx+','+ay+' '+bx+','+cy+'" fill="#e4ecfb" stroke="#2f5fc4" stroke-width="3"/><path d="M'+(bx-16)+' '+ay+' v-16 h16" fill="none" stroke="#3d2a73" stroke-width="2"/><path d="M'+(ax+42)+' '+ay+' A42 42 0 0 0 '+(ax+42*Math.cos(r))+' '+(ay-42*Math.sin(r))+'" fill="none" stroke="#c02d5f" stroke-width="3"/><text x="'+(ax+50)+'" y="'+(ay-10)+'" font-size="15" font-weight="700" fill="#c02d5f">'+th+'°</text><g font-size="15" font-weight="700"><text x="'+((ax+bx)/2)+'" y="'+(ay+24)+'" text-anchor="middle" fill="#16766a">adjacent</text><text x="'+(bx+8)+'" y="'+((ay+cy)/2)+'" fill="#a85d00">opposite</text><text x="'+((ax+bx)/2-30)+'" y="'+((ay+cy)/2-12)+'" text-anchor="end" fill="#3d2a73" transform="rotate('+(-th)+' '+((ax+bx)/2-30)+' '+((ay+cy)/2-12)+')">hypotenuse</text></g></svg>'};

 glossary:[['Right-angled triangle','A triangle with one angle of exactly 90°.'],['Hypotenuse','The longest side of a right-angled triangle, opposite the right angle.'],['Pythagoras’ theorem','In a right-angled triangle, the square on the hypotenuse equals the sum of the squares on the other two sides: c² = a² + b².'],['Opposite','The side across from the angle you are working with.'],['Adjacent','The side next to the angle you are working with (not the hypotenuse).'],['Sine (sin)','opposite ÷ hypotenuse.'],['Cosine (cos)','adjacent ÷ hypotenuse.'],['Tangent (tan)','opposite ÷ adjacent.'],['Angle of elevation','The angle you look UP through, measured from the horizontal.'],['Angle of depression','The angle you look DOWN through, measured from the horizontal.'],['Clinometer','An instrument for measuring angles of elevation and depression.']],

 steps:[
  {phase:'engage',name:'The ladder',title:'Will the ladder reach?',lead:'A painter in Kingston needs to reach a window 4 m up a wall. For safety, the foot of her ladder must stand 3 m away from the wall. She has a 5 m ladder.',
   mission:['Type your name.','Predict whether the ladder will reach the window.','Write what you already know about triangles.'],

   blocks:[{type:'name'},{type:'predict',star:true,q:'With its foot 3 m from the wall, will the 5 m ladder reach exactly 4 m up?',options:['Yes, exactly','No, it will be too short','No, it will go higher than 4 m'],after:'You will be able to prove the answer with Pythagoras’ theorem.'},{type:'write',fields:[{id:'know',label:'What I know about right-angled triangles:',placeholder:'Example: one angle is 90°'},{id:'wonder',label:'Something tall I wish I could measure without climbing it:',placeholder:'Example: the school flagpole'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],

   blocks:[{type:'mcq',star:true,questions:[{q:'What is 7²?',o:['14','49','72'],a:1,why:'7 × 7 = 49.',teach:'Squaring means multiplying a number by itself: 7² = 7 × 7 = 49.'},{q:'What is √81?',o:['9','40.5','27'],a:0,why:'9 × 9 = 81.',teach:'The square root asks: what number times itself gives 81? 9 × 9 = 81, so √81 = 9.'},{q:'The angles in a triangle add up to…',o:['90°','180°','360°'],a:1,why:'Every triangle: 180°.',teach:'The three angles of any triangle add up to 180°. In a right-angled triangle, one angle is 90°, so the other two add up to 90°.'},{q:'Solve x/5 = 3.',o:['15','8','0.6'],a:0,why:'Multiply both sides by 5.',teach:'To undo ÷ 5, multiply both sides by 5: x = 15.'}]}]},
  {phase:'explore',name:'Right-triangle lab',title:'Explore: the right-triangle lab',lead:'Change the angle and the size of a right-angled triangle. The lab measures the sides and works out three ratios. Watch carefully: what changes, and what stays the same?',
   mission:['Keep the angle the same and change the size. What happens to the three ratios?','Then change the angle and watch the ratios change.','Complete all 3 challenges for a star.'],
   patois:'Mek di triangle big or small. Di ratio dem stay di same!',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="rlA">Angle at A:</label><input type="range" id="rlA" min="10" max="80" value="30"><output class="big rlAO"></output></div><div class="controls"><label for="rlH">Hypotenuse length:</label><input type="range" id="rlH" min="2" max="20" value="10"><output class="big rlHO"></output></div><div class="scene rlSvg"></div><div class="tile rlT" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge rlN"></span> <strong class="rlQ"></strong></p><div class="controls"><input type="number" step="0.01" class="rlIn" aria-label="Your answer" placeholder="decimal"><button type="button" class="go rlC">Check</button></div><div class="fb rlFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var A=box.querySelector('#rlA'),H=box.querySelector('#rlH');api.nudges(A);api.nudges(H);var f=function(n){return(Math.round(n*1000)/1000).toFixed(3)};function draw(){var th=+A.value,h=+H.value,r=th*Math.PI/180,adj=h*Math.cos(r),opp=h*Math.sin(r);box.querySelector('.rlAO').textContent=th+'°';box.querySelector('.rlHO').textContent=h;box.querySelector('.rlSvg').innerHTML=RT(th,h);box.querySelector('.rlT').innerHTML='<p style="margin:0 0 6px">Sides: hypotenuse <strong>'+h+'</strong>, opposite <strong>'+f(opp)+'</strong>, adjacent <strong>'+f(adj)+'</strong>.</p><table class="rec" style="max-width:none"><thead><tr><th>Ratio</th><th>Value</th><th>Name</th></tr></thead><tbody><tr><td>opposite ÷ hypotenuse</td><td><strong>'+f(opp/h)+'</strong></td><td>sin '+th+'°</td></tr><tr><td>adjacent ÷ hypotenuse</td><td><strong>'+f(adj/h)+'</strong></td><td>cos '+th+'°</td></tr><tr><td>opposite ÷ adjacent</td><td><strong>'+f(opp/adj)+'</strong></td><td>tan '+th+'°</td></tr></tbody></table><p style="margin:6px 0 0">Check: opposite² + adjacent² = '+f(opp*opp+adj*adj)+' = hypotenuse² = '+h*h+'.</p>'}A.addEventListener('input',draw);H.addEventListener('input',draw);var T=[{t:'Set the angle to 30°. What is opposite ÷ hypotenuse?',a:0.5},{t:'Set the angle to 45°. What is opposite ÷ adjacent?',a:1},{t:'Set the angle to 60°. What is adjacent ÷ hypotenuse?',a:0.5}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.rlN').textContent='All done';box.querySelector('.rlQ').textContent='You completed every challenge! Did you notice the ratios never changed when you changed only the size?';box.querySelector('.rlC').disabled=true;return}box.querySelector('.rlN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.rlQ').textContent=T[q].t}box.querySelector('.rlC').onclick=function(){var v=parseFloat(box.querySelector('.rlIn').value),fb=box.querySelector('.rlFb');if(Math.abs(v-T[q].a)<=0.01){fb.className='fb ok rlFb';fb.textContent='✓ Correct! Now try a different hypotenuse length: the ratio stays the same.';q++;api.set('k',q);box.querySelector('.rlIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no rlFb';fb.textContent='Not yet. Set the angle as the challenge says and read the ratio table.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: Pythagoras’ theorem',title:'Learn: Pythagoras’ theorem',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Square di two short side, add dem, an yuh get di square a di long side.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The hypotenuse, and a proof using areas',explain:'<p>Over 2,500 years ago, people noticed something amazing about every {{right-angled triangle|a triangle with one angle of exactly 90°}}. Builders in ancient Egypt even used it to make perfect square corners for their buildings, with a rope knotted into 3, 4 and 5 equal parts.</p><p>First, a name. The longest side, the one across from the right angle, is called the {{hypotenuse|the longest side of a right-angled triangle, opposite the right angle}}.</p><p>Now look at the picture. A square has been drawn on each side of a triangle with sides 3, 4 and 5. The small squares have areas 3² = 9 and 4² = 16. The big square on the hypotenuse has area 5² = 25. And 9 + 16 = 25! The two smaller squares, cut up and rearranged, would fill the big one exactly.</p><p>This works for <strong>every</strong> right-angled triangle, and it is called {{Pythagoras’ theorem|c² = a² + b² in a right-angled triangle, where c is the hypotenuse}}: <strong>the square on the hypotenuse equals the sum of the squares on the other two sides</strong>. As a formula: <strong>c² = a² + b²</strong>, where c is the hypotenuse.</p>',visual:PYTH,
     example:{q:'Check Pythagoras’ theorem for a triangle with sides 6, 8 and 10.',steps:[{do:'The hypotenuse is the longest side: 10.'},{do:'Squares on the shorter sides: 6² + 8² = 36 + 64 = 100.'},{do:'Square on the hypotenuse: 10² = 100. They are equal, so this is a right-angled triangle ✓'}]},
     mistake:'Using the hypotenuse as one of the two smaller sides. The hypotenuse is always the longest side and always on its own: c² = a² + b².',
     check:{q:'In a right-angled triangle, which side is the hypotenuse?',o:['The shortest side','The side opposite the right angle','Any side next to the right angle'],a:1,why:'It is opposite the right angle and is always the longest side.',hint:'Look across from the square corner.'}},
    {title:'Finding the hypotenuse',explain:'<p>If you know the two shorter sides, you can find the hypotenuse in three steps. <strong>Square</strong> both shorter sides. <strong>Add</strong> them. Then take the <strong>square root</strong>, because that gives you c instead of c².</p><p>Let’s solve the ladder puzzle the other way round. If the foot of a ladder is 3 m from the wall and the top is 4 m up, how long is the ladder? c² = 3² + 4² = 9 + 16 = 25, so c = √25 = 5 m. So a 5 m ladder fits exactly!</p><p>Often the answer will not be a whole number. Then use a calculator for the square root and round sensibly, usually to 1 or 2 decimal places.</p>',
     example:{q:'A rectangular field in Clarendon is 60 m long and 25 m wide. How long is the path straight across, from corner to corner?',steps:[{do:'The diagonal is the hypotenuse of a right-angled triangle with sides 60 and 25.'},{do:'c² = 60² + 25² = 3,600 + 625 = 4,225.'},{do:'c = √4,225 = 65 m.',why:'Taking the square root undoes the squaring.'}]},
     mistake:'Adding the sides instead of their squares: 3 + 4 = 7. The theorem is about SQUARES.',
     check:{q:'A right-angled triangle has shorter sides 5 cm and 12 cm. How long is the hypotenuse?',o:['17 cm','13 cm','169 cm'],a:1,why:'25 + 144 = 169, and √169 = 13.',hint:'Square, add, then square root.'}},
    {title:'Finding a shorter side',explain:'<p>What if you know the hypotenuse but one of the shorter sides is missing? Rearrange the theorem: if c² = a² + b², then <strong>a² = c² − b²</strong>.</p><p>So this time you <strong>subtract</strong> the squares instead of adding them. A good way to remember: the hypotenuse is the longest side, so its square is the biggest number. To find a shorter side, take something away from it.</p><p>For the painter: the ladder is 5 m (the hypotenuse) and the foot is 3 m from the wall. How high does it reach? a² = 5² − 3² = 25 − 9 = 16, so a = √16 = 4 m. Exactly the height of the window!</p>',
     example:{q:'A 13 m wire holds up a pole. The wire is fixed to the ground 5 m from the pole. How tall is the pole?',steps:[{do:'The wire is the hypotenuse: c = 13. One shorter side is 5.'},{do:'a² = 13² − 5² = 169 − 25 = 144.',why:'For a shorter side, subtract.'},{do:'a = √144 = 12 m.'}]},
     mistake:'Adding the squares when finding a shorter side. If the hypotenuse is known, subtract.',
     check:{q:'The hypotenuse is 10 cm and one side is 6 cm. How long is the other side?',o:['8 cm','11.7 cm','4 cm'],a:0,why:'100 − 36 = 64, and √64 = 8.',hint:'Subtract the squares.'}}]},{type:'recall',text:'Yes, the ladder reaches exactly: 3² + 4² = 9 + 16 = 25 = 5². The ladder, the wall and the ground make a 3-4-5 right-angled triangle.'}]},
  {phase:'explain',name:'Teach: sine, cosine and tangent',title:'Learn: the trigonometric ratios',lead:'Pythagoras works with sides only. Trigonometry links sides AND angles, so you can find heights and distances you could never measure directly.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'SOH CAH TOA! Remember it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Naming the sides, and SOH CAH TOA',explain:'<p>In the lab, you discovered something powerful: for a fixed angle, the ratios of the sides never change, no matter how big or small the triangle is. At 30°, opposite ÷ hypotenuse is always 0.5. That is the key idea of trigonometry.</p><p>To use it, we name the sides <em>from the point of view of the angle we are working with</em>. The {{hypotenuse|the longest side, opposite the right angle}} is the longest side, as before. The {{opposite|the side across from the angle}} side is the one across from our angle. The {{adjacent|the side next to the angle that is not the hypotenuse}} side is the one next to our angle (that is not the hypotenuse).</p><p>The three ratios have names: {{sine|opposite ÷ hypotenuse}} = opposite ÷ hypotenuse, {{cosine|adjacent ÷ hypotenuse}} = adjacent ÷ hypotenuse, and {{tangent|opposite ÷ adjacent}} = opposite ÷ adjacent. A famous memory trick is <strong>SOH CAH TOA</strong>: <strong>S</strong>in = <strong>O</strong>pp/<strong>H</strong>yp, <strong>C</strong>os = <strong>A</strong>dj/<strong>H</strong>yp, <strong>T</strong>an = <strong>O</strong>pp/<strong>A</strong>dj.</p>',visual:RT(35,10,'A right-angled triangle with the sides labelled opposite, adjacent and hypotenuse for a 35 degree angle'),
     example:{q:'A right-angled triangle has sides 3, 4 and 5, with the angle θ opposite the 3 cm side. Write sin θ, cos θ and tan θ.',steps:[{do:'Label the sides from θ: opposite = 3, adjacent = 4, hypotenuse = 5.'},{do:'sin θ = opp/hyp = 3/5 = 0.6 and cos θ = adj/hyp = 4/5 = 0.8.'},{do:'tan θ = opp/adj = 3/4 = 0.75.'}]},
     mistake:'Labelling the sides without looking at the angle. The opposite and adjacent sides SWAP if you use the other angle.',
     check:{q:'Which ratio is opposite ÷ adjacent?',o:['sine','cosine','tangent'],a:2,why:'TOA: Tan = Opp/Adj.',hint:'SOH CAH TOA.'}},
    {title:'Finding a side',explain:'<p>Now you can find lengths you cannot measure. The plan is always the same.</p><p><strong>1.</strong> Label the sides from the angle you know: opposite, adjacent, hypotenuse. <strong>2.</strong> Look at which side you know and which side you want. <strong>3.</strong> Choose the ratio that uses exactly those two sides (SOH, CAH or TOA). <strong>4.</strong> Write the equation and solve it.</p><p>Your calculator knows the values: sin 30° = 0.5, tan 40° ≈ 0.839, and so on. One very important thing: make sure your calculator is in <strong>degree mode</strong> (it usually shows a small D or DEG on the screen). In radian mode, every answer will be wrong.</p>',
     example:{q:'A ramp is 10 m long and rises at an angle of 30° to the ground. How high does it rise?',steps:[{do:'Label from the 30° angle: the ramp is the hypotenuse (10); the height is opposite.'},{do:'We know the hypotenuse and want the opposite, so use SOH: sin 30° = opp/10.'},{do:'Multiply both sides by 10: opp = 10 × sin 30° = 10 × 0.5 = 5 m.'}]},
     mistake:'Choosing a ratio before labelling the sides. Always label first, then pick the ratio that uses the two sides in the question.',
     check:{q:'You know the adjacent side and want the opposite side. Which ratio do you use?',o:['sine','cosine','tangent'],a:2,why:'Opposite and adjacent: TOA.',hint:'Which ratio has opp and adj?'}},
    {title:'Finding an angle',explain:'<p>What if you know two sides and want the angle? Then you work backwards. Find the value of the ratio first, then ask your calculator: “which angle has this sine (or cosine, or tangent)?”</p><p>That backwards button is called the {{inverse|the opposite of a trig function; it finds an angle from a ratio}} function, written sin⁻¹, cos⁻¹ or tan⁻¹. On most calculators you press SHIFT and then sin, cos or tan.</p><p>For example, if opposite = 3 and adjacent = 4, then tan θ = 3/4 = 0.75, and θ = tan⁻¹(0.75) ≈ 36.9°. The little “−1” does not mean “one over”; it just means “work backwards to the angle”.</p>',
     example:{q:'A ladder 6 m long reaches 5 m up a wall. What angle does it make with the ground?',steps:[{do:'From the angle at the ground: the wall height (5) is opposite, the ladder (6) is the hypotenuse.'},{do:'SOH: sin θ = 5/6 ≈ 0.833.'},{do:'θ = sin⁻¹(0.833) ≈ 56.4°.',why:'The inverse function turns a ratio back into an angle.'}]},
     mistake:'Pressing sin instead of sin⁻¹ when finding an angle. sin turns an angle into a ratio; sin⁻¹ turns a ratio into an angle.',
     check:{q:'tan θ = 1. What is θ?',o:['1°','45°','90°'],a:1,why:'tan 45° = 1, because the opposite and adjacent are equal.',hint:'Remember the lab at 45°.'}}]}]},
  {phase:'explain',name:'Teach: elevation and depression',title:'Learn: angles of elevation and depression',lead:'Finally, the real-world use of trigonometry: measuring heights and distances by looking up and looking down.',

   patois:'Look up: elevation. Look dung: depression.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Angles of elevation',explain:'<p>Stand on the ground and look straight ahead, then lift your eyes to the top of a tall tree. The angle your eyes turned through, measured <strong>up from the horizontal</strong>, is called the {{angle of elevation|the angle you look up through, measured from the horizontal}}.</p><p>Surveyors and builders measure this angle with a {{clinometer|an instrument for measuring angles of elevation and depression}}, or with a free protractor app on a phone. If they also know how far away they are standing, they can work out the height of a tree, a building or a tower without ever climbing it.</p><p>The ground, the tree and your line of sight make a right-angled triangle. Your distance from the tree is the adjacent side, the height is the opposite side, so you use <strong>tan</strong>.</p>',visual:ELEV('e'),
     example:{q:'Kemar stands 20 m from a tree and measures the angle of elevation to the top as 35°. How tall is the tree? (Ignore Kemar’s height.)',steps:[{do:'From Kemar’s angle: the distance (20 m) is adjacent; the height is opposite.'},{do:'TOA: tan 35° = height/20.'},{do:'Height = 20 × tan 35° ≈ 20 × 0.700 = 14.0 m.'}]},
     mistake:'Measuring the angle from the vertical (straight up) instead of from the horizontal (straight ahead).',
     check:{q:'An angle of elevation is measured…',o:['up from the horizontal','down from the vertical','from the top of the object'],a:0,why:'You start looking straight ahead and turn up.',hint:'Elevation = looking up.'}},
    {title:'Angles of depression',explain:'<p>Now imagine standing at the top of the Morant Point lighthouse, looking out to sea. You look straight ahead at the horizon, then lower your eyes to a fishing boat. The angle your eyes turned through, measured <strong>down from the horizontal</strong>, is the {{angle of depression|the angle you look down through, measured from the horizontal}}.</p><p>Here is a neat fact. The angle of depression from the top of the lighthouse to the boat is exactly equal to the angle of elevation from the boat up to the top of the lighthouse. Why? The horizontal line at the top and the ground at the bottom are parallel, so the two angles are <strong>alternate angles</strong> (the Z shape you met in Grade 7), and alternate angles are equal.</p><p>That means you can put the angle inside the triangle at the boat, and solve it just like an elevation problem.</p>',visual:ELEV('d'),
     example:{q:'From the top of a 50 m lighthouse, the angle of depression to a boat is 20°. How far is the boat from the foot of the lighthouse?',steps:[{do:'The angle of elevation from the boat is also 20° (alternate angles).'},{do:'From the boat: the height (50 m) is opposite; the distance is adjacent. tan 20° = 50/d.'},{do:'d = 50 ÷ tan 20° ≈ 50 ÷ 0.364 ≈ 137.4 m.',why:'The unknown is on the bottom, so rearrange: divide 50 by tan 20°.'}]},
     mistake:'Putting the angle of depression inside the triangle at the top. It is measured from the horizontal line, which is outside the triangle; move it down to the bottom angle using alternate angles.',
     check:{q:'The angle of depression from a cliff top to a boat is 30°. What is the angle of elevation from the boat to the cliff top?',o:['30°','60°','150°'],a:0,why:'They are alternate angles, so they are equal.',hint:'Remember the Z shape.'}},
    {title:'Combining Pythagoras and trigonometry',explain:'<p>Many real problems need both tools. A good question to ask yourself is: “What do I know, and what do I want?”</p><p>If the problem involves <strong>only sides</strong> (two sides known, third side wanted), use <strong>Pythagoras</strong>. If it involves <strong>an angle</strong>, either given or wanted, use <strong>trigonometry</strong>.</p><p>Sometimes you need one to get the information for the other. For example, you might use trigonometry to find a height, then Pythagoras to find a slanted distance. Always sketch a clear diagram first, label the right angle, and write what you know on it.</p>',
     example:{q:'A kite string is 50 m long and makes an angle of 60° with the ground. How high is the kite, and how far along the ground is it from the person flying it?',steps:[{do:'Height: the string is the hypotenuse; the height is opposite 60°. sin 60° = h/50, so h = 50 × 0.866 ≈ 43.3 m.'},{do:'Ground distance: now we know two sides, so Pythagoras works: d² = 50² − 43.3² ≈ 2,500 − 1,875 = 625.'},{do:'d ≈ √625 = 25 m. (Check with trig: 50 × cos 60° = 25 m ✓)'}]},
     mistake:'Using Pythagoras when only one side is known. Pythagoras needs two sides; with one side and an angle, use trigonometry.',
     check:{q:'You know the hypotenuse and one angle, and you want a side. Which tool do you need?',o:['Pythagoras only','Trigonometry','Neither'],a:1,why:'An angle is involved, so use trigonometry.',hint:'Is there an angle in the problem?'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Use a calculator in degree mode.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'Pythagoras',text:'c² = a² + b², where c is the hypotenuse. Hypotenuse: square, add, square root. Shorter side: square, subtract, square root.'},{title:'SOH CAH TOA',text:'sin = opp/hyp, cos = adj/hyp, tan = opp/adj. Label the sides from the angle first.'},{title:'Angles',text:'Use sin⁻¹, cos⁻¹ or tan⁻¹ to turn a ratio back into an angle. Keep your calculator in degree mode.'},{title:'Elevation and depression',text:'Both are measured from the horizontal. The angle of depression from A to B equals the angle of elevation from B to A.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A wheelchair ramp rises 0.5 m over a horizontal distance of 6 m. Find the angle of the ramp.',steps:[{do:'The rise (0.5) is opposite the angle; the horizontal (6) is adjacent.'},{do:'TOA: tan θ = 0.5/6 ≈ 0.0833.'},{do:'θ = tan⁻¹(0.0833) ≈ 4.8°.'}]},

    {icon:'📏',title:'Pythagorean triples',desc:'Order the hypotenuses of famous right-angled triangles.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the hypotenuse of each triangle, then tap from shortest to longest.',rounds:[[{label:'sides 6 and 8',v:10,show:'10'},{label:'sides 5 and 12',v:13,show:'13'},{label:'sides 3 and 4',v:5,show:'5'},{label:'sides 8 and 15',v:17,show:'17'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The hypotenuse is the longest side of a right-angled triangle.',a:'always',why:'It is opposite the biggest angle, the 90° angle.'},{s:'sin θ is bigger than 1.',a:'never',why:'sin θ = opp/hyp, and the opposite is always shorter than the hypotenuse.'},{s:'tan θ is bigger than 1.',a:'sometimes',why:'For angles above 45°, the opposite is longer than the adjacent, so tan θ > 1; below 45° it is less.',hint:'Try 30° and 60°.'},{s:'The angle of depression from A to B equals the angle of elevation from B to A.',a:'always',why:'They are alternate angles between parallel horizontal lines.'},{s:'Pythagoras’ theorem works for any triangle.',a:'never',why:'It only works for right-angled triangles. (In other triangles, a² + b² ≠ c².)'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Rohan',q:'Find the hypotenuse of a triangle with sides 6 and 8.',lines:['c = 6 + 8','c = 14'],wrong:0,reasons:['Pythagoras uses squares: c² = 6² + 8² = 100, so c = 10','He should subtract','He should multiply'],reason:0,fix:'c = √(36 + 64) = 10.'},{who:'Tia',q:'Hypotenuse 13, one side 5. Find the other side.',lines:['a² = 13² + 5² = 194','a = √194 ≈ 13.9'],wrong:0,reasons:['For a shorter side, SUBTRACT: 169 − 25 = 144','13 should not be squared','She should use tan'],reason:0,fix:'a = √144 = 12.'},{who:'Andre',q:'A tree is 20 m away; the angle of elevation is 35°. Find its height.',lines:['sin 35° = h/20','h = 20 × sin 35° ≈ 11.5 m'],wrong:0,reasons:['The distance is ADJACENT, not the hypotenuse: use tan','He should use Pythagoras','The angle should be 55°'],reason:0,fix:'h = 20 × tan 35° ≈ 14.0 m.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire Pythagoras and trig questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},T=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]],t=T[R(0,5)],r=R(0,2);if(r===0)return{q:'Shorter sides '+t[0]+' and '+t[1]+'. Hypotenuse?',o:[String(t[2]),String(t[0]+t[1]),String(t[2]+1)],a:0,why:t[0]+'² + '+t[1]+'² = '+t[2]*t[2]+'.'};if(r===1)return{q:'Hypotenuse '+t[2]+', one side '+t[0]+'. Other side?',o:[String(t[1]),String(t[2]-t[0]),String(t[1]+2)],a:0,why:t[2]+'² − '+t[0]+'² = '+t[1]*t[1]+'.'};var Q=[['opposite and hypotenuse','sin'],['adjacent and hypotenuse','cos'],['opposite and adjacent','tan']],q=Q[R(0,2)];return{q:'Which ratio uses the '+q[0]+'?',o:[q[1]].concat(['sin','cos','tan'].filter(function(z){return z!==q[1]})),a:0,why:'SOH CAH TOA.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent triangles that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a Pythagorean triple (three whole numbers a, b, c with a² + b² = c²) that is NOT 3, 4, 5.',placeholder:'a, b, c',check:function(v){var n=String(v).split(',').map(Number).sort(function(a,b){return a-b});if(n.length!==3||n.some(function(x){return!(x>0)||x%1}))return{ok:false,msg:'Type three whole numbers separated by commas.'};if(n.join()==='3,4,5')return{ok:false,msg:'Try a different one! Hint: what about doubling 3, 4, 5?'};return n[0]*n[0]+n[1]*n[1]===n[2]*n[2]?{ok:true,msg:'Yes! '+n[0]+'² + '+n[1]+'² = '+n[2]+'².'}:{ok:false,msg:n[0]+'² + '+n[1]+'² = '+(n[0]*n[0]+n[1]*n[1])+', but '+n[2]+'² = '+n[2]*n[2]+'.'}}},{q:'Type an angle θ (in degrees) for which tan θ is bigger than 2.',placeholder:'degrees',check:function(v){var x=parseFloat(v);if(!(x>0&&x<90))return{ok:false,msg:'Choose an angle between 0° and 90°.'};var t=Math.tan(x*Math.PI/180);return t>2?{ok:true,msg:'Yes! tan '+x+'° ≈ '+t.toFixed(3)+'.'}:{ok:false,msg:'tan '+x+'° ≈ '+t.toFixed(3)+'. Try a bigger angle.'}}},{q:'In a right-angled triangle, one angle is 90° and another is 35°. What is the third angle?',placeholder:'degrees',check:function(v){return parseFloat(v)===55?{ok:true,msg:'Correct! 180 − 90 − 35 = 55°.'}:{ok:false,msg:'The angles add up to 180°.'}}}]}},
