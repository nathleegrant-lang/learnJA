function GRIDSVG(img,opt){opt=opt||{};var S=26,O=169,X=function(x){return O+S*x},Y=function(y){return O-S*y},s='<svg viewBox="0 0 338 338" role="img" aria-label="'+(opt.label||'A grid showing an L-shaped object and its image')+'"><rect width="338" height="338" fill="#faf8fe"/>';for(var i=-6;i<=6;i++){s+='<line x1="'+X(i)+'" y1="'+Y(-6)+'" x2="'+X(i)+'" y2="'+Y(6)+'" stroke="#e1d9f3"/><line x1="'+X(-6)+'" y1="'+Y(i)+'" x2="'+X(6)+'" y2="'+Y(i)+'" stroke="#e1d9f3"/>'}if(opt.mirror==='v')s+='<line x1="'+X(0)+'" y1="'+Y(6)+'" x2="'+X(0)+'" y2="'+Y(-6)+'" stroke="#c02d5f" stroke-width="3" stroke-dasharray="8 6"/><text x="'+(X(0)+6)+'" y="18" font-size="13" fill="#c02d5f">mirror line</text>';if(opt.mirror==='h')s+='<line x1="'+X(-6)+'" y1="'+Y(0)+'" x2="'+X(6)+'" y2="'+Y(0)+'" stroke="#c02d5f" stroke-width="3" stroke-dasharray="8 6"/><text x="6" y="'+(Y(0)-6)+'" font-size="13" fill="#c02d5f">mirror line</text>';if(opt.centre)s+='<circle cx="'+X(0)+'" cy="'+Y(0)+'" r="6" fill="#c02d5f"/><text x="'+(X(0)+8)+'" y="'+(Y(0)+18)+'" font-size="13" fill="#c02d5f">centre</text>';var poly=function(P,f,st){return'<polygon points="'+P.map(function(p){return X(p[0])+','+Y(p[1])}).join(' ')+'" fill="'+f+'" fill-opacity=".8" stroke="'+st+'" stroke-width="2.5"/>'};s+=poly(FLAG,'#d9cff5','#4b3aa8');if(img)s+=poly(img,'#ffd98a','#a85d00');s+='<text x="'+X(1.1)+'" y="'+Y(4.3)+'" font-size="13" font-weight="700" fill="#4b3aa8">object</text>';if(img){var c=img.reduce(function(a,p){return[Math.min(a[0],p[0]),Math.max(a[1],p[1])]},[99,-99]);s+='<text x="'+X(c[0])+'" y="'+(Y(c[1])-6)+'" font-size="13" font-weight="700" fill="#a85d00">image</text>'}return s+'</svg>'}

 grade:7, term:1, subject:'Mathematics', strand:'Geometry',
 title:'Transformations, Triangles and Quadrilaterals',
 goals:['describe what stays the same and what changes when a shape is translated, reflected or rotated','carry out translations, reflections and rotations on a grid','use the side, angle and symmetry properties of triangles','use the side, angle and symmetry properties of quadrilaterals'],
 curriculum:{framework:'NSC Mathematics, Grade 7',term:'Term 1',unit:'Unit 4: Transformations',strand:'Geometry',standard:'Explore paths, geometric shapes, and space and make generalizations about geometric relationships within the environment.',
  objectives:['State the relationships between an object and its image in a plane when it undergoes a translation in that plane;','State the relationships between an object and its image in a plane when it is reflected in a line in that plane;','State the relationships between an object and its image in a plane when it is rotated about a point (the center of rotation) in that plane;','Identify and use angle, side and symmetry properties of triangles and quadrilaterals;'],
  focus:'Translation, reflection and rotation on a grid, congruence and orientation, and the side, angle and symmetry properties of triangles and quadrilaterals.',
  note:'Source: National Standards Curriculum Guide, Mathematics Grades 7-9 (MoEYI, 2018), Grade 7, Term 1, Unit 4. Transformations using coordinate axes come in Grade 8.'},
 glossary:[['Transformation','A change in the position or orientation of a shape.'],['Object','The shape before it is transformed.'],['Image','The shape after it is transformed.'],['Translation','A slide: every point moves the same distance in the same direction.'],['Reflection','A flip over a mirror line.'],['Rotation','A turn about a fixed point called the centre of rotation.'],['Congruent','Exactly the same size and shape.'],['Orientation','Which way a shape is facing.'],['Line of symmetry','A line that divides a shape into two mirror-image halves.'],['Rotational symmetry','A shape has rotational symmetry if it looks the same after a turn of less than 360°. The order is how many times it fits onto itself in one full turn.'],['Isosceles triangle','A triangle with two equal sides and two equal angles.'],['Equilateral triangle','A triangle with three equal sides and three 60° angles.']],
 teacher:{time:'about 80 minutes, or two periods split after the teaching pages',flow:[['Engage','8 min','Predict what changes when a shape is flipped.','Have students try it with tracing paper.'],['Explore','17 min','Transformation lab: translate, reflect and rotate a flag shape; complete 3 challenges.','Ask: "What stays the same? What changes?"'],['Explain','30 min','Teaching pages on the three transformations and on triangle and quadrilateral properties; I do, we do, you do.','Use mirrors and tracing paper for reflections and rotations.'],['Elaborate','15 min','Challenge Zone and Bronze to Gold problems.','Link symmetry to Jamaican craft and tile designs.'],['Evaluate','10 min','Quiz and reflection.','Watch for confusion between orientation and size.']],
  misconceptions:['Thinking a transformation changes the size of a shape (translations, reflections and rotations never do).','Reflecting a shape by sliding it instead of flipping it.','Counting the diagonals of a rectangle as lines of symmetry.','Thinking an isosceles triangle\'s equal angles are the top angle and one base angle.'],
  extension:'Research tessellations and the artist M. C. Escher. Design a tile using translations or rotations that could cover a floor with no gaps.'},
 steps:[
  {phase:'engage',name:'Mirror, mirror',title:'What changes in a mirror?',lead:'When you look in a mirror, you see your image. Raise your right hand: which hand does your mirror image raise?',
   mission:['Type your name.','Make your prediction.','Write what you already know about shapes and symmetry.'],
   patois:'When yuh look inna mirror, wah change an wah stay di same?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'When a shape is reflected in a mirror, what happens to it?',options:['It gets bigger or smaller','It stays the same size, but it is flipped','It stays exactly the same, facing the same way'],after:'You will test this in the Transformation lab.'},{type:'write',fields:[{id:'know',label:'Shapes I know with lines of symmetry:',placeholder:'Example: a butterfly, the letter A'},{id:'wonder',label:'Something I wonder about shapes:',placeholder:'Example: why do tiles fit together?'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'A quarter turn is…',o:['45°','90°','180°'],a:1,why:'A full turn is 360°, so a quarter turn is 90°.',teach:'A full turn is 360°. A half turn is 180° and a quarter turn is 90°.'},{q:'Which letter has a vertical line of symmetry?',o:['F','A','R'],a:1,why:'A can be folded down the middle so both halves match.',teach:'A line of symmetry splits a shape into two matching mirror halves. If you fold along it, the halves fit exactly. The letter A has one down the middle.'},{q:'The angles in a triangle add up to…',o:['90°','180°','360°'],a:1,why:'Every triangle\'s angles add up to 180°.',teach:'If you tear off the three corners of any paper triangle and put them together, they make a straight line: 180°.'},{q:'A square has…',o:['4 equal sides and 4 right angles','4 equal sides and no right angles','2 equal sides'],a:0,why:'A square has 4 equal sides and 4 right angles.',teach:'A square is a quadrilateral (4 sides) with all four sides equal and all four angles 90°.'}]}]},
  {phase:'explore',name:'Transformation lab',title:'Explore: the transformation lab',lead:'Choose a transformation and watch what happens to the purple object. Its image appears in gold.',
   mission:['Try all three transformations. For each, ask: same size? same shape? facing the same way?','Complete the 3 challenges.','Then answer the questions below.'],
   patois:'Slide it, flip it, turn it. Watch wah change.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="tfT">Transformation:</label><select id="tfT"><option value="translate">Translation (slide)</option><option value="refv">Reflection in a vertical mirror line</option><option value="refh">Reflection in a horizontal mirror line</option><option value="r90">Rotation 90° anticlockwise</option><option value="r180">Rotation 180°</option><option value="r270">Rotation 270° anticlockwise</option></select></div><div class="controls tfMove"><label for="tfX">Move right/left:</label><input type="range" id="tfX" min="-6" max="4" value="2"><output class="big tfXO"></output><label for="tfY">Move up/down:</label><input type="range" id="tfY" min="-6" max="2" value="-3"><output class="big tfYO"></output></div><div class="scene tfSvg"></div><div class="explain tfX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge tfN"></span> <strong class="tfTask"></strong></p><div class="controls"><button type="button" class="go tfC">Check</button></div><div class="fb tfFb" aria-live="polite">Set up the transformation, then check.</div></div>',
     init:function(box,api){var t=box.querySelector('#tfT'),x=box.querySelector('#tfX'),y=box.querySelector('#tfY');api.nudges(x);api.nudges(y);var NOTE={translate:'<strong>Translation.</strong> Every point moved the same distance in the same direction. The image is the same size and shape (congruent), and it faces the SAME way.',refv:'<strong>Reflection.</strong> The image is the same size and shape (congruent), but it is FLIPPED: it faces the opposite way. Each point is the same distance from the mirror line as its image.',refh:'<strong>Reflection.</strong> The image is congruent but flipped upside down. Each point and its image are the same distance from the mirror line.',r90:'<strong>Rotation 90°.</strong> The image is congruent but TURNED a quarter turn about the centre. Each point stays the same distance from the centre.',r180:'<strong>Rotation 180°.</strong> The image is congruent but turned a half turn about the centre: it is upside down.',r270:'<strong>Rotation 270°.</strong> The image is congruent but turned three-quarters of a turn anticlockwise (the same as a quarter turn clockwise).'};function draw(){var k=t.value,o={dx:+x.value,dy:+y.value};box.querySelector('.tfMove').hidden=k!=='translate';box.querySelector('.tfXO').textContent=(o.dx>0?'+':'')+o.dx;box.querySelector('.tfYO').textContent=(o.dy>0?'+':'')+o.dy;var img=FLAG.map(function(p){return TR[k](p,o)});box.querySelector('.tfSvg').innerHTML=GRIDSVG(img,{mirror:k==='refv'?'v':k==='refh'?'h':null,centre:/^r\d/.test(k)});box.querySelector('.tfX').innerHTML=NOTE[k]+(k==='translate'?' Here it moved '+Math.abs(o.dx)+' square'+(Math.abs(o.dx)===1?'':'s')+' '+(o.dx>=0?'right':'left')+' and '+Math.abs(o.dy)+' '+(o.dy>=0?'up':'down')+'.':'')}var T=[{t:'Translate the shape 3 squares right and 2 squares down.',ok:function(){return t.value==='translate'&&+x.value===3&&+y.value===-2},hint:'Choose Translation, then set right/left to +3 and up/down to −2.'},{t:'Reflect the shape so that its image faces the opposite way, across a vertical mirror line.',ok:function(){return t.value==='refv'},hint:'Choose the reflection in a vertical mirror line.'},{t:'Turn the shape upside down with a half turn about the centre.',ok:function(){return t.value==='r180'},hint:'A half turn is 180°.'}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.tfN').textContent='All done';box.querySelector('.tfTask').textContent='You completed every challenge!';box.querySelector('.tfC').disabled=true;return}box.querySelector('.tfN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.tfTask').textContent=T[k].t}box.querySelector('.tfC').onclick=function(){var fb=box.querySelector('.tfFb');if(T[k].ok()){fb.className='fb ok tfFb';fb.textContent='✓ Correct!';k++;api.set('k',k);task();if(k===T.length)api.complete()}else{fb.className='fb no tfFb';fb.textContent='Not yet. '+T[k].hint}};[t,x,y].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});draw();task()}},
    {type:'mcq',star:true,title:'What did you notice?',questions:[{q:'After a translation, reflection or rotation, the image is…',o:['bigger than the object','the same size and shape as the object','smaller than the object'],a:1,why:'These transformations never change size or shape: the image is congruent to the object.',hint:'Compare the purple and gold shapes.'},{q:'Which transformation makes the image face the opposite way (flipped)?',o:['Translation','Reflection','Rotation'],a:1,why:'A reflection flips the shape, like a mirror image.',hint:'Which one is like a mirror?'},{q:'In a translation, the image…',o:['faces the same way as the object','is upside down','is flipped'],a:0,why:'A translation only slides the shape; it does not turn or flip it.',hint:'Try the translation again and compare.'}]},
    {type:'recall',text:'A reflection keeps the shape the same size but flips it. Was your prediction right?'}]},
  {phase:'explain',name:'Teach: transformations',title:'Learn: translation, reflection and rotation',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Slide, flip an turn. Di size neva change.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Translation: a slide',explain:'<p>Picture a chess piece sliding across the board, or a car pulling forward into a parking space. It moves to a new place, but it does not turn around, flip over or change size. That kind of movement is a {{translation|a slide: every point moves the same distance in the same direction}}.</p><p>In maths, moving a shape is called a {{transformation|a change in the position or orientation of a shape}}. The shape you start with is the {{object|the shape before it is transformed}}, and the shape you end up with is the {{image|the shape after it is transformed}}.</p><p>In a translation, every single point of the shape moves exactly the same distance in exactly the same direction. So what changes? Only the position. What stays the same? The size, the shape, and the {{orientation|which way a shape is facing}}: the image is still facing the same way. Because the object and image are exactly the same size and shape, we say they are {{congruent|exactly the same size and shape}}.</p>',visual:GRIDSVG(FLAG.map(function(p){return[p[0]-5,p[1]-3]}),{label:'A translation of 5 squares left and 3 squares down'}),
     example:{q:'Describe the translation in the picture.',steps:[{do:'Choose one corner of the object and find the matching corner of the image.',why:'Every point moves the same way, so one corner is enough.'},{do:'Count across: the corner moved 5 squares to the left.'},{do:'Count up or down: it moved 3 squares down.'},{do:'The translation is 5 squares left and 3 squares down.'}]},
     mistake:'Counting the gap between the shapes instead of how far one point moved. Always count from a corner to its own matching corner.',
     check:{q:'After a translation, the image…',o:['is congruent and faces the same way','is congruent but flipped','is bigger'],a:0,why:'A slide changes only the position.',hint:'A translation is just a slide.'}},
    {title:'Reflection: a flip',explain:'<p>Stand in front of a mirror and wave your right hand. Your reflection waves back, but it looks like it is using its left hand! The reflection is the same size as you, but it is flipped.</p><p>A {{reflection|a flip over a mirror line}} in maths works just like that. The shape is flipped over a line called the mirror line. The image is still congruent, the same size and shape, but now it faces the <strong>opposite way</strong>. That flip is what makes a reflection different from a translation.</p><p>There is another neat thing about mirrors. If you stand 2 metres in front of a mirror, your reflection seems to be 2 metres behind it. In the same way, every point of a shape and its image are exactly the same distance from the mirror line, one on each side. That is how you can draw a reflection accurately: measure how far each corner is from the line, then go the same distance on the other side.</p>',visual:GRIDSVG(FLAG.map(TR.refv),{mirror:'v',label:'A reflection in a vertical mirror line'}),
     example:{q:'A corner of a shape is 3 squares to the right of a vertical mirror line. Where is its image?',steps:[{do:'The image is the same distance from the mirror line: 3 squares.',why:'In a reflection, distances to the mirror line are equal.'},{do:'It is on the OTHER side: 3 squares to the left of the line.'},{do:'So the corner and its image are 6 squares apart.'}]},
     mistake:'Sliding the shape across the mirror line instead of flipping it. A reflected shape must face the opposite way.',
     check:{q:'A point is 4 cm from a mirror line. How far is its image from the mirror line?',o:['2 cm','4 cm','8 cm'],a:1,why:'A point and its image are the same distance from the mirror line.',hint:'Think of standing in front of a mirror.'}},
    {title:'Rotation: a turn',explain:'<p>Think of the hands of a clock, a ceiling fan, or a steering wheel. They all turn around a fixed point in the middle. That kind of movement is a {{rotation|a turn about a fixed point called the centre of rotation}}.</p><p>In a rotation, the shape turns around one point that stays still, called the <strong>centre of rotation</strong>. Every other point moves in a curve around it, but each point stays the same distance from the centre the whole time.</p><p>To describe a rotation completely, you need three pieces of information. Where is the <strong>centre</strong>? How far does it turn, the <strong>angle</strong>, such as 90° (a quarter turn) or 180° (a half turn)? And which <strong>direction</strong>: clockwise, like a clock’s hands, or anticlockwise, the opposite way? After a rotation, the image is still congruent, but it has been turned to face a new direction.</p>',visual:GRIDSVG(FLAG.map(TR.r90),{centre:true,label:'A rotation of 90 degrees anticlockwise about the centre'}),
     example:{q:'Describe the rotation in the picture.',steps:[{do:'The red dot is the centre of rotation.'},{do:'The flag pointed up; now it points left. That is a quarter turn: 90°.'},{do:'It turned anticlockwise (the opposite way to clock hands).'},{do:'So it is a rotation of 90° anticlockwise about the centre.'}]},
     mistake:'Forgetting to give the direction. "90°" alone could mean clockwise or anticlockwise, which give different images.',
     check:{q:'Which transformation turns a shape about a point?',o:['Translation','Reflection','Rotation'],a:2,why:'A rotation is a turn about a centre.',hint:'Turn = ?'}}]}]},
  {phase:'explain',name:'Teach: triangles and quadrilaterals',title:'Learn: properties of triangles and quadrilaterals',lead:'Next, the sides, angles and symmetry of triangles and four-sided shapes.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Count di equal side dem an di line a symmetry.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Triangles',explain:'<p>Triangles are everywhere: in roof frames, bridges and road signs. Builders love them because they are so strong. Let’s get to know them properly.</p><p>First, a fact about every triangle in the world: its three angles always add up to <strong>180°</strong>. Try it: tear the three corners off a paper triangle and put them side by side. They always make a straight line!</p><p>We sort triangles into families by their sides. An {{equilateral triangle|three equal sides and three 60° angles}} has all three sides equal, so its three angles are also equal: 180° ÷ 3 = 60° each. An {{isosceles triangle|two equal sides and two equal angles}} has two equal sides, and the two angles at the bottom of those sides, the base angles, are equal too. A <strong>scalene</strong> triangle has no equal sides and no equal angles. In drawings, little dashes on the sides show which ones are equal.</p>',visual:TRISVG,
     example:{q:'An isosceles triangle has a top angle of 40°. Find each base angle.',steps:[{do:'The angles add up to 180°, so the two base angles together are 180° − 40° = 140°.'},{do:'In an isosceles triangle, the two base angles are equal.',why:'They are opposite the two equal sides.'},{do:'Each base angle = 140° ÷ 2 = 70°.'},{do:'Check: 40° + 70° + 70° = 180° ✓'}]},
     mistake:'Forgetting to halve. 140° is the total of BOTH base angles, not each one.',
     check:{q:'What is each angle of an equilateral triangle?',o:['45°','60°','90°'],a:1,why:'180° ÷ 3 = 60°.',hint:'Three equal angles that add up to 180°.'}},
    {title:'Quadrilaterals',explain:'<p>A {{quadrilateral|a flat shape with 4 straight sides}} is any flat shape with four straight sides. Look around: doors, windows, tiles, books, kites. Quadrilaterals are everywhere.</p><p>Here is a fact that is true for all of them: the four angles always add up to <strong>360°</strong>. Why? Draw a line from one corner to the opposite corner, and you split the quadrilateral into two triangles. Each triangle has 180°, so together they make 360°.</p><p>Then there are the special quadrilaterals, each with its own personality. A <strong>square</strong> has 4 equal sides and 4 right angles. A <strong>rectangle</strong> has 4 right angles, and its opposite sides are equal. A <strong>rhombus</strong> has 4 equal sides, like a squashed square. A <strong>parallelogram</strong> has opposite sides that are equal and parallel, like a rectangle that has been pushed over. A <strong>kite</strong> has two pairs of equal sides next to each other. A <strong>trapezium</strong> has just one pair of parallel sides.</p>',
     example:{q:'A quadrilateral has angles of 90°, 110° and 70°. Find the fourth angle.',steps:[{do:'The angles of a quadrilateral add up to 360°.',why:'A quadrilateral can be split into two triangles: 2 × 180° = 360°.'},{do:'Add the known angles: 90° + 110° + 70° = 270°.'},{do:'Fourth angle = 360° − 270° = 90°.'}]},
     mistake:'Using 180° for a quadrilateral. That is the angle sum of a TRIANGLE. Quadrilaterals add up to 360°.',
     check:{q:'A parallelogram has one angle of 70°. What is the angle opposite it?',o:['70°','110°','290°'],a:0,why:'Opposite angles of a parallelogram are equal.',hint:'Opposite angles of a parallelogram are…'}},
    {title:'Symmetry',explain:'<p>Take a piece of paper, fold it in half, and cut out a shape along the fold. When you open it up, the two halves match perfectly. The fold line is a {{line of symmetry|a line that divides a shape into two mirror-image halves}}: a line that splits a shape into two mirror-image halves.</p><p>Some shapes have more than one. A square can be folded four ways and still match: down the middle, across the middle, and along both diagonals. A rectangle can only be folded two ways; try folding one along its diagonal and you will see the halves do not match.</p><p>There is a second kind of symmetry. Put a shape on a table and slowly turn it. If it looks exactly the same before you have turned it all the way around, it has {{rotational symmetry|it looks the same after a turn of less than 360°}}. The <strong>order</strong> is how many times it looks the same in one full turn. A square fits onto itself 4 times, so it has order 4. A parallelogram has no lines of symmetry at all, but it does fit onto itself after a half turn, so it has order 2.</p>',visual:SYMSVG,
     example:{q:'How many lines of symmetry does a rectangle have, and what is its order of rotational symmetry?',steps:[{do:'Fold it top to bottom: the halves match. That is 1 line.'},{do:'Fold it left to right: the halves match. That is 2 lines.'},{do:'Fold along a diagonal: the halves do NOT match. So only 2 lines.',why:'Try it with a piece of paper.'},{do:'Turn it: it fits onto itself after a half turn and a full turn, so its order is 2.'}]},
     mistake:'Counting the diagonals of a rectangle as lines of symmetry. Only a square\'s diagonals are lines of symmetry.',
     check:{q:'How many lines of symmetry does a square have?',o:['2','4','8'],a:1,why:'2 through the middles of the sides and 2 along the diagonals = 4.',hint:'Remember the diagonals of a square.'}}]}]},

    {icon:'🗂️',title:'Lines of symmetry',desc:'Sort shapes by how many lines of symmetry they have.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Imagine folding each shape. How many ways do the halves match?',bins:[{id:'0',label:'0 lines'},{id:'1',label:'1 line'},{id:'2',label:'2 lines'},{id:'3',label:'3 or more'}],items:[{label:'Square',bin:'3'},{label:'Rectangle',bin:'2'},{label:'Kite',bin:'1'},{label:'Parallelogram',bin:'0'},{label:'Equilateral triangle',bin:'3'},{label:'Isosceles triangle',bin:'1'},{label:'Scalene triangle',bin:'0'},{label:'Rhombus',bin:'2'}]}},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A reflection changes the size of a shape.',a:'never',why:'Reflections, translations and rotations never change size.'},{s:'A translated shape is congruent to the original.',a:'always',why:'A slide does not change size or shape.'},{s:'A triangle can have two right angles.',a:'never',why:'Two right angles already make 180°, leaving 0° for the third angle.'},{s:'A quadrilateral with 4 equal sides is a square.',a:'sometimes',why:'It could be a square, or a rhombus without right angles.',hint:'Think of a rhombus.'},{s:'A shape with 2 lines of symmetry also has rotational symmetry.',a:'always',why:'Two perpendicular lines of symmetry mean the shape also fits onto itself after a half turn.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Rhea',q:'How many lines of symmetry does a rectangle have?',lines:['Fold top to bottom: 1 line','Fold left to right: 2 lines','The two diagonals: 4 lines altogether'],wrong:2,reasons:['A rectangle\'s diagonals are not lines of symmetry','A rectangle has no lines of symmetry','She should have counted 3'],reason:0,fix:'A rectangle has only 2 lines of symmetry.'},{who:'Chris',q:'An isosceles triangle has a top angle of 50°. Find each base angle.',lines:['180° − 50° = 130°','So each base angle is 130°'],wrong:1,reasons:['He forgot to divide 130° between the two equal base angles','He should have used 360°','The base angles are 50° each'],reason:0,fix:'130° ÷ 2 = 65° each.'},{who:'Ann',q:'Describe the transformation: the image is the same size, faces the same way, and is 4 squares to the right.',lines:['The image faces the same way','So it is a reflection'],wrong:1,reasons:['A shape that faces the same way and has only moved is a translation','It must be a rotation','The image must be bigger'],reason:0,fix:'It is a translation of 4 squares to the right.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire angle and symmetry questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(30,100),b=R(20,140-a+20),c=180-a-b;if(c<=0){b=40;c=180-a-b}return{q:'A triangle has angles '+a+'° and '+b+'°. The third angle is…',o:[c+'°',(360-a-b)+'°',(c+10)+'°'],a:0,why:'180° − '+a+'° − '+b+'° = '+c+'°.'}}if(r===1){var p=R(60,120),q=R(60,120),s=R(60,Math.min(120,330-p-q)),t=360-p-q-s;return{q:'A quadrilateral has angles '+p+'°, '+q+'° and '+s+'°. The fourth is…',o:[t+'°',(t+20)+'°',(t>40?t-20:t+40)+'°'],a:0,why:'360° minus the other three = '+t+'°.'}}var S=[['square',4],['rectangle',2],['kite',1],['parallelogram',0],['equilateral triangle',3],['isosceles triangle',1],['rhombus',2]],x=S[R(0,6)],o=[x[1],(x[1]+1)%5,(x[1]+2)%5].map(String);return{q:'How many lines of symmetry does a '+x[0]+' have?',o:o,a:0,why:'A '+x[0]+' has '+x[1]+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent shapes and angles that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type the three angles of an isosceles triangle that has one angle of 100°. (For example: a, b, c)',placeholder:'angle, angle, angle',check:function(v){var n=String(v).replace(/°/g,'').split(',').map(Number);if(n.length!==3||n.some(isNaN))return{ok:false,msg:'Type three angles separated by commas.'};n.sort(function(a,b){return a-b});var ok=n[0]+n[1]+n[2]===180&&n[0]===n[1]&&n[2]===100;return ok?{ok:true,msg:'Yes! 100° + 40° + 40° = 180°, with two equal base angles.'}:{ok:false,msg:'The angles must add up to 180°, include 100°, and have two equal angles. 100° cannot be one of the equal pair (two 100° angles would be too big).'}}},{q:'Type the four angles of a quadrilateral in which every angle is different. (For example: a, b, c, d)',placeholder:'a, b, c, d',check:function(v){var n=String(v).replace(/°/g,'').split(',').map(Number);if(n.length!==4||n.some(isNaN)||n.some(function(x){return x<=0}))return{ok:false,msg:'Type four positive angles separated by commas.'};var sum=n.reduce(function(a,b){return a+b},0),uniq=n.filter(function(x,i){return n.indexOf(x)===i}).length===4;if(sum!==360)return{ok:false,msg:'They add up to '+sum+'°. A quadrilateral\'s angles must add up to 360°.'};return uniq?{ok:true,msg:'Correct! They add up to 360° and are all different.'}:{ok:false,msg:'They add up to 360°, but some are the same. Make every angle different.'}}},{q:'Type the translation that moves a shape back to where it started after it was moved 3 right and 2 up. Type it like: 3 left 2 down',placeholder:'e.g. … left … down',check:function(v){var t=String(v).toLowerCase();return /3\s*left/.test(t)&&/2\s*down/.test(t)?{ok:true,msg:'Yes! To undo a translation, move the same distances in the opposite directions.'}:{ok:false,msg:'Think: what slide undoes 3 right and 2 up?'}}}]}},
    {icon:'🎨',title:'Mission: the tile designer',desc:'Design a floor tile pattern for a new hotel in Negril.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'A hotel in Negril wants a patterned floor. You are designing the tiles using transformations and symmetry.',parts:[{q:'The main tile is a square. How many lines of symmetry does it have?',a:4,hint:'Remember the diagonals.',sol:'A square has 4 lines of symmetry.'},{q:'The hotel logo on each tile is rotated 90° at a time. How many 90° turns bring it back to where it started?',a:4,hint:'A full turn is 360°.',sol:'360° ÷ 90° = 4 turns.'},{q:'The border uses equilateral triangle tiles. What is each angle of an equilateral triangle?',a:60,hint:'180° ÷ 3.',sol:'60°.',placeholder:'degrees'},{q:'How many equilateral triangle tiles fit together around one point with no gaps?',a:6,hint:'The angles around a point add up to 360°.',sol:'360° ÷ 60° = 6 tiles.'},{q:'Along the corridor, the tile design is translated 25 cm to the right each time. After 8 translations, how far is the last design from the first, in cm?',a:200,hint:'8 slides of 25 cm.',sol:'8 × 25 = 200 cm.',placeholder:'cm'}],done:'You used symmetry, rotation, angle facts and translation to design a real tiled floor.'}}
