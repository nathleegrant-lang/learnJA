 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Measurement',strand:'Measurement',standard:'Module 1, Measurement: understand that the attributes of geometrical objects can be quantified using measurement; demonstrate the ability to use concepts in measurement to model and solve real-world problems.',

 glossary:[['Volume','The amount of space a solid takes up, in cubic units such as cm³ or m³.'],['Capacity','How much a container can hold, often in litres. 1 litre = 1,000 cm³.'],['Surface area','The total area of all the faces or surfaces of a solid.'],['Cross-section','The shape you see when you cut straight through a prism. It is the same all the way along.'],['Prism','A solid with the same cross-section all along its length.'],['Pyramid','A solid with a base and sloping triangular faces meeting at a point.'],['Cone','A pyramid with a circular base.'],['Slant height (l)','The distance from the tip of a cone down its side to the edge of the base.'],['Sphere','A perfectly round solid, like a ball.'],['Net','The flat shape that folds to make a solid; its area is the surface area.']],

     init:function(box,api){var DIM={cuboid:['l','w','h'],cylinder:['r','h'],cone:['r','h'],sphere:['r'],pyramid:['l','h']},NM={l:'length',w:'width',h:'height',r:'radius'},val={l:5,w:4,h:3,r:3},k=box.querySelector('#slK');function dims(){var d=box.querySelector('.slDims');d.innerHTML='';DIM[k.value].forEach(function(x){var row=document.createElement('div');row.className='controls';row.innerHTML='<label for="sl'+x+'">'+NM[x]+' (cm):</label><input type="range" id="sl'+x+'" min="1" max="12" value="'+val[x]+'"><output class="big">'+val[x]+'</output>';d.appendChild(row);var inp=row.querySelector('input');api.nudges(inp);inp.addEventListener('input',function(){val[x]=+inp.value;row.querySelector('output').textContent=inp.value;draw()})});draw()}function draw(){var t=k.value,l=val.l,w=val.w,h=val.h,r=val.r,V,S,how;if(t==='cuboid'){V=l*w*h;S=2*(l*w+l*h+w*h);how='V = l × w × h = '+l+' × '+w+' × '+h+'<br>SA = 2(lw + lh + wh) = 2('+l*w+' + '+l*h+' + '+w*h+')'}else if(t==='cylinder'){V=P*r*r*h;S=2*P*r*r+2*P*r*h;how='V = πr²h = 3.14 × '+r+'² × '+h+'<br>SA = 2πr² + 2πrh'}else if(t==='cone'){var sl=Math.sqrt(r*r+h*h);V=P*r*r*h/3;S=P*r*sl+P*r*r;how='V = ⅓πr²h = ⅓ × 3.14 × '+r+'² × '+h+'<br>slant height l = √(r² + h²) = '+r2(sl)+'; SA = πrl + πr²'}else if(t==='sphere'){V=4/3*P*r*r*r;S=4*P*r*r;how='V = 4/3 πr³ = 4/3 × 3.14 × '+r+'³<br>SA = 4πr² = 4 × 3.14 × '+r+'²'}else{var s2=Math.sqrt(h*h+(l/2)*(l/2));V=l*l*h/3;S=l*l+4*(0.5*l*s2);how='V = ⅓ × base area × h = ⅓ × '+l+'² × '+h+'<br>SA = base + 4 triangles (slant height '+r2(s2)+')'}box.querySelector('.slSvg').innerHTML=SOLIDSVG(t,val,t);box.querySelector('.slX').innerHTML=how+'<br><strong>Volume = '+r2(V)+' cm³</strong> | <strong>Surface area = '+r2(S)+' cm²</strong>'}k.onchange=dims;var T=[{t:'A cuboid is 5 cm by 4 cm by 3 cm. What is its volume (cm³)?',a:60,tol:0.01},{t:'What is the surface area of the same cuboid (cm²)?',a:94,tol:0.01},{t:'A sphere has radius 3 cm. What is its volume, to 1 decimal place (π = 3.14)?',a:113.04,tol:0.1}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.slN').textContent='All done';box.querySelector('.slT').textContent='You completed every challenge!';box.querySelector('.slC').disabled=true;return}box.querySelector('.slN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.slT').textContent=T[q].t}box.querySelector('.slC').onclick=function(){var a=parseFloat(String(box.querySelector('.slA').value).replace(/,/g,'')),fb=box.querySelector('.slFb');if(Math.abs(a-T[q].a)<=T[q].tol){fb.className='fb ok slFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.slA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no slFb';fb.textContent='Not yet. Set up the solid in the lab with these measurements and read the result.'}};dims();task()}}]},
  {phase:'explain',name:'Teach: volume',title:'Learn: volume of solids',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Volume a how much space inside.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Volume of a prism',explain:'<p>{{Volume|the space a solid takes up, in cubic units}} is the space a solid takes up, measured in <strong>cubic units</strong> (cm³, m³).</p><p>A {{prism|a solid with the same cross-section all along}} has the same {{cross-section|the shape you see when you cut straight through}} all along its length. So: <strong>V = area of cross-section × length</strong>.</p><p>A cuboid is a prism with a rectangle cross-section: <strong>V = l × w × h</strong>. Capacity: <strong>1 litre = 1,000 cm³</strong>.</p>',visual:SOLIDSVG('cuboid',{l:10,w:6,h:4},'A cuboid 10 by 6 by 4'),
     example:{q:'A triangular prism has a cross-section that is a triangle with base 6 cm and height 4 cm. The prism is 10 cm long. Find its volume.',steps:[{do:'Area of the cross-section: ½ × 6 × 4 = 12 cm².'},{do:'Volume = 12 × 10 = 120 cm³.',why:'The triangle is repeated all along the 10 cm length.'}]},
     mistake:'Multiplying all the numbers together for a triangular prism (6 × 4 × 10 = 240). You must find the triangle\'s area first, which includes the ½.',
     check:{q:'A box is 10 cm by 6 cm by 4 cm. What is its volume?',o:['20 cm³','240 cm³','120 cm³'],a:1,why:'10 × 6 × 4 = 240 cm³.',hint:'l × w × h.'}},
    {title:'Volume of a cylinder',explain:'<p>A {{cylinder|a solid with two circular ends and a curved surface}} is a prism with a circle cross-section. So:</p><p><strong>V = πr²h</strong></p><p>Always use the <strong>radius</strong>. If you are given the diameter, halve it first.</p>',visual:SOLIDSVG('cylinder',{r:'r',h:'h'},'A cylinder with radius r and height h'),
     example:{q:'The opening puzzle: Drum A has diameter 60 cm and height 90 cm; Drum B has diameter 90 cm and height 60 cm. Which holds more? (π = 3.14)',steps:[{do:'Drum A: r = 30, so V = 3.14 × 30² × 90 = 254,340 cm³.'},{do:'Drum B: r = 45, so V = 3.14 × 45² × 60 = 381,510 cm³.',why:'The radius is squared, so making a drum wider increases its volume much more than making it taller.'},{do:'Drum B, the wide one, holds more: about 381.5 litres compared with 254.3 litres. Was your prediction right?'}]},
     mistake:'Using the diameter instead of the radius. With r = 60 instead of 30, the volume would be 4 times too big.',
     check:{q:'A cylinder has r = 7 cm and h = 10 cm. What is its volume? (π = 22/7)',o:['440 cm³','1,540 cm³','220 cm³'],a:1,why:'22/7 × 49 × 10 = 154 × 10 = 1,540 cm³.',hint:'πr² first, then × h.'}},
    {title:'Pyramids, cones and spheres',explain:'<p>A {{pyramid|a base with sloping faces meeting at a point}} or {{cone|a pyramid with a circular base}} holds exactly <strong>one third</strong> of the prism or cylinder with the same base and height:</p><p><strong>Pyramid: V = ⅓ × base area × h</strong> &nbsp; <strong>Cone: V = ⅓πr²h</strong></p><p>For a {{sphere|a perfectly round solid}}: <strong>V = 4/3 πr³</strong>.</p>',visual:SOLIDSVG('cone',{r:'r',h:'h'},'A cone with radius r and height h'),
     example:{q:'Find the volume of a cone with radius 3 cm and height 4 cm (π = 3.14).',steps:[{do:'V = ⅓ × 3.14 × 3² × 4.'},{do:'3² × 4 = 36, and 3.14 × 36 = 113.04.'},{do:'⅓ × 113.04 = 37.68 cm³.',why:'A cone is one third of the cylinder that fits around it.'}]},
     mistake:'Forgetting the ⅓ for cones and pyramids. Without it, the answer is three times too big.',
     check:{q:'A sphere has radius 3 cm. Its volume is closest to… (π = 3.14)',o:['37.7 cm³','113.0 cm³','339.1 cm³'],a:1,why:'4/3 × 3.14 × 27 = 113.04 cm³.',hint:'4/3 × π × r³.'}}]}]},
  {phase:'explain',name:'Teach: surface area',title:'Learn: surface area of solids',lead:'Next, the total area of the outside of a solid: what you would paint or wrap.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Surface area a weh yuh woulda paint.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Surface area of a cuboid',explain:'<p>{{Surface area|the total area of all the faces of a solid}} is the total area of all the faces, measured in <strong>square units</strong> (cm², m²). It is the area of the solid\'s {{net|the flat shape that folds into the solid}}.</p><p>A cuboid has <strong>6 faces in 3 matching pairs</strong>: SA = 2(lw + lh + wh).</p>',visual:SOLIDSVG('cuboid',{l:5,w:4,h:3},'A cuboid 5 by 4 by 3'),
     example:{q:'Find the surface area of a cuboid 5 cm by 4 cm by 3 cm.',steps:[{do:'Top and bottom: 5 × 4 = 20 each.'},{do:'Front and back: 5 × 3 = 15 each. Two sides: 4 × 3 = 12 each.'},{do:'SA = 2(20 + 15 + 12) = 2 × 47 = 94 cm².',why:'Each face has a matching opposite face.'}]},
     mistake:'Adding only three faces (20 + 15 + 12 = 47). A cuboid has six faces, so double it.',
     check:{q:'What is the surface area of a cube with sides of 3 cm?',o:['27 cm²','54 cm²','18 cm²'],a:1,why:'6 faces × 9 cm² = 54 cm².',hint:'A cube has 6 equal square faces.'}},
    {title:'Surface area of a cylinder',explain:'<p>A cylinder\'s net is <strong>two circles</strong> and <strong>one rectangle</strong>. The rectangle wraps around, so its length is the circumference 2πr, and its width is the height h.</p><p><strong>SA = 2πr² + 2πrh</strong> (two ends + curved surface). If the cylinder is open at the top, leave out one circle.</p>',
     example:{q:'Find the total surface area of a closed cylinder with r = 3 cm and h = 10 cm (π = 3.14).',steps:[{do:'Two ends: 2 × 3.14 × 3² = 56.52 cm².'},{do:'Curved surface: 2 × 3.14 × 3 × 10 = 188.4 cm².',why:'The rectangle is 2πr long and h wide.'},{do:'Total: 56.52 + 188.4 = 244.92 cm².'}]},
     mistake:'Forgetting the curved surface, or including both circles for an open container such as a cup.',
     check:{q:'A closed cylinder has r = 7 cm and h = 10 cm (π = 22/7). What is the area of its curved surface?',o:['440 cm²','154 cm²','748 cm²'],a:0,why:'2 × 22/7 × 7 × 10 = 440 cm².',hint:'Curved surface = 2πrh.'}},
    {title:'Surface area of cones and spheres',explain:'<p>The curved surface of a cone uses the {{slant height|the distance from the tip down the side to the edge}} l: <strong>curved SA = πrl</strong>. The total adds the base: <strong>πrl + πr²</strong>. If you only know the vertical height h, find l with Pythagoras: l = √(r² + h²).</p><p>A sphere\'s surface area is <strong>SA = 4πr²</strong>: exactly 4 times the area of a circle with the same radius.</p>',visual:SOLIDSVG('sphere',{r:'r'},'A sphere with radius r'),
     example:{q:'Find the surface area of a ball with radius 5 cm (π = 3.14).',steps:[{do:'SA = 4 × 3.14 × 5².'},{do:'5² = 25, and 4 × 25 = 100.'},{do:'SA = 3.14 × 100 = 314 cm².'}]},
     mistake:'Using the vertical height instead of the slant height for a cone\'s curved surface.',
     check:{q:'A cone has radius 6 cm and slant height 10 cm. What is its curved surface area? (π = 3.14)',o:['188.4 cm²','376.8 cm²','113.04 cm²'],a:0,why:'3.14 × 6 × 10 = 188.4 cm².',hint:'πrl.'}}]},{type:'recall',text:'Drum B (wide) holds more: about 381.5 litres compared with 254.3 litres. Because the radius is squared, width matters more than height.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key formulas. Then watch a full example, fill in a missing step, and try some on your own. Use π = 3.14 unless told otherwise.',
