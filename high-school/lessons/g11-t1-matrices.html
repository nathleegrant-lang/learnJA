var fm=function(n){n=Math.round(n*100)/100;return n<0?'−'+(-n):String(n)};

 glossary:[['Matrix','A rectangular array of numbers in rows and columns.'],['Order','Rows × columns, such as 2 × 3.'],['Square matrix','A matrix with the same number of rows and columns.'],['Rectangular matrix','A matrix with different numbers of rows and columns.'],['Identity matrix (I)','A square matrix with 1s on the leading diagonal and 0s elsewhere: AI = IA = A.'],['Zero matrix','A matrix of all 0s: the identity for addition.'],['Conformable','Two matrices can be multiplied (AB) when the number of columns of A equals the number of rows of B.'],['Non-commutative','In general, AB ≠ BA.'],['Data matrix','A matrix that stores real information, such as quantities or prices.']],

 steps:[
  {phase:'engage',name:'The tuck shop',title:'One calculation for the whole bill?',lead:'At a school tuck shop in Linstead, patties cost $250, juice $150 and buns $200. On Monday, Form 4A buys 10 patties, 12 juices and 5 buns; Form 4B buys 8 patties, 15 juices and 6 buns.',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

  {phase:'explore',name:'Matrix multiplier',title:'Explore: the matrix multiplier',lead:'Edit matrix A and matrix B, and choose the order of B. The multiplier checks whether AB can be found, works out each element as row × column, and compares AB with BA.',

   blocks:[{type:'custom',star:true,html:'<div class="tile"><p style="margin:0 0 6px"><strong>A</strong> (2 × 2)</p><div class="mmA" style="display:grid;grid-template-columns:repeat(2,64px);gap:6px"></div><div class="controls"><label for="mmO">Order of B:</label><select id="mmO"><option value="22">2 × 2</option><option value="21">2 × 1</option><option value="12">1 × 2</option></select></div><p style="margin:6px 0"><strong>B</strong></p><div class="mmB"></div></div><div class="tile mmOut" aria-live="polite" style="line-height:2.4"></div><div class="tile"><p style="margin:0"><span class="badge mmN"></span> <strong class="mmQ"></strong></p><div class="controls"><input type="text" class="mmIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go mmC">Check</button></div><div class="fb mmFb" aria-live="polite">Use the multiplier to help you.</div></div>',
     init:function(box,api){var A=[[2,1],[3,4]],Bs={'22':[[1,0],[2,5]],'21':[[3],[1]],'12':[[2,6]]},O=box.querySelector('#mmO'),hl=[0,0];function grid(el,M,cols){el.innerHTML='';el.style.display='grid';el.style.gridTemplateColumns='repeat('+cols+',64px)';el.style.gap='6px';M.forEach(function(r,i){r.forEach(function(x,j){var e=document.createElement('input');e.type='number';e.value=x;e.style.width='60px';e.setAttribute('aria-label','row '+(i+1)+' column '+(j+1));e.addEventListener('input',function(){M[i][j]=parseFloat(e.value)||0;draw()});el.appendChild(e)})})}function draw(){var B=Bs[O.value],AB=MUL(A,B),BA=MUL(B,A),h='<strong>A</strong> is '+ORD(A)+', <strong>B</strong> is '+ORD(B)+'.<br>';if(!AB)h+='<strong>AB is not possible</strong>: A has '+A[0].length+' columns but B has '+B.length+' row(s). They are not conformable.';else{if(hl[0]>=AB.length||hl[1]>=AB[0].length)hl=[0,0];var i=hl[0],j=hl[1],terms=A[i].map(function(x,k){return fm(x)+' × '+fm(B[k][j])});h+=MX(AB,'AB',hl)+'  (order '+ORD(AB)+')<br>Highlighted element: row '+(i+1)+' of A × column '+(j+1)+' of B = '+terms.join(' + ')+' = <strong>'+fm(AB[i][j])+'</strong><br><span class="mmPick">Click to pick an element: '+AB.map(function(r,ii){return r.map(function(_,jj){return'<button type="button" data-i="'+ii+'" data-j="'+jj+'" style="margin:2px">row '+(ii+1)+', col '+(jj+1)+'</button>'}).join('')}).join('')+'</span>'}h+='<br>'+(BA?MX(BA,'BA')+'  '+(AB&&JSON.stringify(AB)===JSON.stringify(BA)?'(here AB = BA)':'(AB ≠ BA: matrix multiplication is NOT commutative)'):'<strong>BA is not possible</strong>: B has '+B[0].length+' column(s) but A has '+A.length+' rows.');box.querySelector('.mmOut').innerHTML=h;[].forEach.call(box.querySelectorAll('.mmPick button'),function(bt){bt.onclick=function(){hl=[+bt.getAttribute('data-i'),+bt.getAttribute('data-j')];draw()}})}grid(box.querySelector('.mmA'),A,2);function setB(){var B=Bs[O.value];grid(box.querySelector('.mmB'),B,B[0].length);draw()}O.onchange=setB;var T=[{t:'With A = (2 1; 3 4) and B = (1 0; 2 5), what is the top-left element of AB?',ok:function(v){return v==='4'}},{t:'Same A and B: what is the bottom-right element of AB?',ok:function(v){return v==='20'}},{t:'Same A and B: is AB equal to BA? (Type yes or no.)',ok:function(v){return v==='no'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.mmN').textContent='All done';box.querySelector('.mmQ').textContent='You completed every challenge!';box.querySelector('.mmC').disabled=true;return}box.querySelector('.mmN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.mmQ').textContent=T[q].t}box.querySelector('.mmC').onclick=function(){var v=String(box.querySelector('.mmIn').value).trim().toLowerCase(),fb=box.querySelector('.mmFb');if(T[q].ok(v)){fb.className='fb ok mmFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.mmIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no mmFb';fb.textContent='Not yet. Use the starting matrices with B as 2 × 2, and click that element.'}};setB();task()}},
    {type:'recall',text:'Form 4A’s bill is $5,300: 10 × 250 + 12 × 150 + 5 × 200 = 2,500 + 1,800 + 1,000. That is exactly a row × column calculation in matrix multiplication.'}]},
  {phase:'explain',name:'Teach: concepts and basic operations',title:'Learn: matrix concepts, equality, addition and scalar multiplication',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Same order fi add. Any order fi scalar.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Types of matrix',explain:'<p>A {{matrix|a rectangular array of numbers}} is a rectangular array of numbers. Its {{order|rows × columns}} is rows × columns. The syllabus names several types:</p><p>• A <strong>row matrix</strong> has one row (order 1 × n); a <strong>column matrix</strong> has one column (n × 1).<br>• A {{square matrix|same number of rows and columns}} has equal numbers of rows and columns, like 2 × 2.<br>• A {{rectangular matrix|different numbers of rows and columns}} has different numbers, like 2 × 3.<br>• The {{identity matrix|1s on the leading diagonal, 0s elsewhere}} I has 1s on the leading diagonal (top-left to bottom-right) and 0s everywhere else: for 2 × 2, I = '+MX([[1,0],[0,1]])+'.<br>• The {{zero matrix|all 0s}} has every element 0.</p>',
     example:{q:'Classify a matrix with rows (3, 0, 2) and (1, 4, 5).',steps:[{do:'2 rows and 3 columns: order 2 × 3.'},{do:'Rows ≠ columns, so it is rectangular.'},{do:'It has 6 elements.'}]},
     mistake:'Thinking the identity matrix is all 1s. It has 1s ONLY on the leading diagonal.',
     check:{q:'Which is the 2 × 2 identity matrix?',o:['(1 0; 0 1)','(1 1; 1 1)','(0 1; 1 0)'],a:0,why:'1s on the leading diagonal only.',hint:'Leading diagonal.'}},
    {title:'Equality, addition and subtraction',explain:'<p>Two matrices are <strong>equal</strong> if they have the same order and every pair of matching elements is equal. This lets you find unknowns: if the matrix with first row (2x, 3) equals the matrix with first row (8, 3), then 2x = 8, so x = 4.</p><p>To <strong>add or subtract</strong> matrices, they must have the <strong>same order</strong>; then add or subtract the matching elements. The zero matrix is the identity for addition: A + O = A.</p><p>As you showed in Grade 9, matrix addition is commutative: A + B = B + A.</p>',
     example:{q:'If (x + 2, 5; 3, y) − (1, 2; 0, 4) = (6, 3; 3, 1), find x and y.',steps:[{do:'Top-left: x + 2 − 1 = 6, so x = 5.'},{do:'Bottom-right: y − 4 = 1, so y = 5.'},{do:'Check the others: 5 − 2 = 3 ✓, 3 − 0 = 3 ✓.'}]},
     mistake:'Adding matrices of different orders. A 2 × 2 and a 2 × 3 matrix cannot be added.',
     check:{q:'(3 1; 0 2) + (1 4; 5 −2) = ?',o:['(4 5; 5 0)','(3 4; 0 −4)','(4 5; 5 4)'],a:0,why:'Add matching elements.',hint:'Element by element.'}},
    {title:'Scalar multiplication, and conformability',explain:'<p><strong>Scalar multiplication</strong> multiplies every element by the same number: 3 × (2 −1; 0 4) = (6 −3; 0 12).</p><p>Before multiplying two matrices together, check whether they are {{conformable|AB exists when columns of A = rows of B}}. <strong>AB exists only if the number of columns of A equals the number of rows of B.</strong></p><p>Write the orders side by side: A is (m × <strong>n</strong>) and B is (<strong>n</strong> × p). The inner numbers must match, and the outer numbers give the order of the answer: AB is <strong>m × p</strong>. For example, (2 × 3) times (3 × 1) gives a 2 × 1 matrix; but (2 × 3) times (2 × 3) is not possible.</p>',
     example:{q:'A is 2 × 3 and B is 3 × 2. Can you find AB and BA? What are their orders?',steps:[{do:'AB: (2 × 3)(3 × 2): the inner numbers match (3 = 3), so AB is 2 × 2.'},{do:'BA: (3 × 2)(2 × 3): the inner numbers match (2 = 2), so BA is 3 × 3.'},{do:'Both exist, but they are different orders, so AB ≠ BA.'}]},
     mistake:'Getting the order of the product wrong. AB has the rows of A and the columns of B.',
     check:{q:'A is 1 × 3 and B is 3 × 2. What is the order of AB?',o:['1 × 2','3 × 3','It cannot be found'],a:0,why:'Inner 3s match; outer 1 and 2.',hint:'Outer numbers.'}}]}]},
  {phase:'explain',name:'Teach: multiplication and data',title:'Learn: multiplying matrices, the identity, and data matrices',lead:'Next, how to multiply matrices, and why it is so useful.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Row across, column dung.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Multiplying two matrices',explain:'<p>Matrix multiplication is <strong>not</strong> done by multiplying matching elements. Each element of AB comes from a <strong>row of A</strong> combined with a <strong>column of B</strong>: multiply the pairs of numbers, then add.</p><p>For A = '+MX([[2,1],[3,4]])+' and B = '+MX([[1,0],[2,5]])+':</p><p>Row 1 × column 1: 2 × 1 + 1 × 2 = 4. Row 1 × column 2: 2 × 0 + 1 × 5 = 5. Row 2 × column 1: 3 × 1 + 4 × 2 = 11. Row 2 × column 2: 3 × 0 + 4 × 5 = 20.</p><p>So AB = '+MX([[4,5],[11,20]])+'. Run your finger along the row of A and down the column of B at the same time.</p>',
     example:{q:'Find (1 3; 2 −1) × (4; 2), a 2 × 2 times a 2 × 1 matrix.',steps:[{do:'Conformable: (2 × 2)(2 × 1) gives a 2 × 1 matrix.'},{do:'Row 1: 1 × 4 + 3 × 2 = 10. Row 2: 2 × 4 + (−1) × 2 = 6.'},{do:'Answer: the column matrix (10; 6).'}]},
     mistake:'Multiplying matching elements: (2 1; 3 4)(1 0; 2 5) is NOT (2 0; 6 20).',
     check:{q:'(1 2)(3; 4) = ?',o:['(11)','(3 8)','(4 6)'],a:0,why:'1 × 3 + 2 × 4 = 11.',hint:'Row × column.'}},
    {title:'Non-commutativity and the identity',explain:'<p>With numbers, 3 × 5 = 5 × 3. But with matrices, <strong>AB is usually NOT equal to BA</strong>: matrix multiplication is {{non-commutative|in general, AB ≠ BA}}. This is one of the ways, as the syllabus puts it, that matrices do not follow the same rules as real numbers.</p><p>With the matrices above, AB = (4 5; 11 20), but BA = (2 1; 19 22). Sometimes BA does not even exist when AB does, because of conformability.</p><p>The <strong>identity matrix</strong> I behaves like the number 1: <strong>AI = IA = A</strong> for any square matrix A of the same order. So the order matters in general, but not when one of the matrices is I.</p>',
     example:{q:'Show that A × I = A for A = (3 −1; 2 5).',steps:[{do:'Row 1: 3 × 1 + (−1) × 0 = 3, and 3 × 0 + (−1) × 1 = −1.'},{do:'Row 2: 2 × 1 + 5 × 0 = 2, and 2 × 0 + 5 × 1 = 5.'},{do:'AI = (3 −1; 2 5) = A ✓'}]},
     mistake:'Assuming AB = BA. Always calculate in the order given.',
     check:{q:'For 2 × 2 matrices A and B, which is always true?',o:['AI = IA = A','AB = BA','A + B = AB'],a:0,why:'I is the multiplicative identity.',hint:'Like multiplying by 1.'}},
    {title:'Data matrices and solving problems',explain:'<p>A {{data matrix|a matrix storing real information}} stores real information, such as quantities sold or prices. Matrix multiplication can combine data in one step.</p><p>For the tuck shop, put the quantities in a matrix Q (one row per class, one column per item) and the prices in a column matrix P. Then <strong>QP</strong> gives each class’s total bill:</p><p>Q = '+MX([[10,12,5],[8,15,6]])+', P = '+MX([[250],[150],[200]])+', QP = '+MX([[5300],[5450]])+'</p><p>The orders tell you it works: (2 × 3)(3 × 1) = (2 × 1), one total per class. Matrices are also used for equality problems in algebra, finding unknowns by matching elements.</p>',
     example:{q:'A shop sells small and large juices at $120 and $200. On Saturday it sold 30 small and 20 large; on Sunday 25 small and 35 large. Use matrices to find each day’s income.',steps:[{do:'Quantities: rows (30 20) and (25 35). Prices: column (120; 200).'},{do:'Saturday: 30 × 120 + 20 × 200 = 3,600 + 4,000 = 7,600.'},{do:'Sunday: 25 × 120 + 35 × 200 = 3,000 + 7,000 = 10,000. Income matrix (7,600; 10,000).'}]},
     mistake:'Setting up the data so that the matrices are not conformable. Arrange them so the inner orders match.',
     check:{q:'Quantities are 2 × 3 and prices are 3 × 1. The product gives…',o:['a 2 × 1 matrix of totals','a 3 × 3 matrix','no answer'],a:0,why:'(2 × 3)(3 × 1) = 2 × 1.',hint:'Outer numbers.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Types',text:'Row, column, square, rectangular, identity I (1s on the leading diagonal), zero matrix. Order = rows × columns.'},{title:'Add, subtract, scalar',text:'Same order to add or subtract; match elements. Scalar: multiply every element. Equal matrices: match elements.'},{title:'Multiplication',text:'AB exists if columns of A = rows of B; order (m × n)(n × p) = m × p. Element = row of A · column of B.'},{title:'Rules',text:'AB ≠ BA in general. AI = IA = A. Data: quantities × prices = totals.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Find (2 0; 1 3)(4 1; 2 −1).',steps:[{do:'Row 1: 2 × 4 + 0 × 2 = 8; 2 × 1 + 0 × (−1) = 2.'},{do:'Row 2: 1 × 4 + 3 × 2 = 10; 1 × 1 + 3 × (−1) = −2.'},{do:'Answer: (8 2; 10 −2).'}]},
     {type:'fill',q:'Find (3 2)(1; 5).',steps:[{text:'3 × 1 + 2 × 5 = 3 + ___ = 13',blank:true,a:10,hint:'2 × 5.'}],sol:'(13).'},
     {type:'own',q:'A is 3 × 2 and B is 2 × 4. How many elements does AB have?',a:12,hint:'AB is 3 × 4.',sol:'12.'},
     {type:'own',q:'If (2x 1; 0 y) = (10 1; 0 −3), what is x + y?',a:2,hint:'2x = 10, y = −3.',sol:'5 + (−3) = 2.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Can AB be found?',desc:'Sort each pair of orders (A then B).',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Columns of A must equal rows of B.',bins:[{id:'y',label:'AB exists'},{id:'n',label:'AB does not exist'}],items:[{label:'2 × 3 and 3 × 1',bin:'y'},{label:'2 × 2 and 3 × 2',bin:'n'},{label:'1 × 2 and 2 × 2',bin:'y'},{label:'3 × 1 and 3 × 1',bin:'n'},{label:'2 × 2 and 2 × 1',bin:'y'},{label:'2 × 3 and 2 × 3',bin:'n'}]}},
    {icon:'🃏',title:'Match the orders',desc:'Match each product to the order of the answer.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['(2 × 3)(3 × 1)','2 × 1'],['(1 × 2)(2 × 3)','1 × 3'],['(3 × 2)(2 × 3)','3 × 3'],['(2 × 2)(2 × 2)','2 × 2'],['(1 × 3)(3 × 1)','1 × 1'],['(3 × 1)(1 × 2)','3 × 2']]}},
