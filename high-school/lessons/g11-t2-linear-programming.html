var K=window.LessonKit;
var fl=function(n){n=Math.round(n*100)/100;return n<0?'−'+(-n):String(n)};
var CONS=[['x ≥ 2',function(x,y){return x>=2-1e-9},[1,0,2,'>']],['y ≥ 1',function(x,y){return y>=1-1e-9},[0,1,1,'>']],['x + y ≤ 10',function(x,y){return x+y<=10+1e-9},[1,1,10,'<']],['2x + y ≤ 16',function(x,y){return 2*x+y<=16+1e-9},[2,1,16,'<']]];
var VERTS=function(on){var lines=[[1,0,0],[0,1,0]].concat(CONS.filter(function(c,i){return on[i]}).map(function(c){return c[2]})),pts=[];for(var i=0;i<lines.length;i++)for(var j=i+1;j<lines.length;j++){var a=lines[i],b=lines[j],d=a[0]*b[1]-a[1]*b[0];if(Math.abs(d)<1e-9)continue;var x=(a[2]*b[1]-a[1]*b[2])/d,y=(a[0]*b[2]-a[2]*b[0])/d;if(x<-1e-9||y<-1e-9)continue;if(CONS.every(function(c,k){return!on[k]||c[1](x,y)})&&x<=12&&y<=14)pts.push([Math.round(x*100)/100,Math.round(y*100)/100])}var u=[];pts.forEach(function(p){if(!u.some(function(q){return q[0]===p[0]&&q[1]===p[1]}))u.push(p)});return u};
var LPG=function(on,pv,lbl){var W=420,H=380,X=function(x){return 40+x*30},Y=function(y){return 340-y*24},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Feasible region for the bakery problem')+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/>';for(var i=0;i<=12;i++){s+='<line x1="'+X(i)+'" y1="'+Y(0)+'" x2="'+X(i)+'" y2="'+Y(14)+'" stroke="#eee8f8"/><text x="'+X(i)+'" y="'+(Y(0)+14)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+i+'</text>'}for(var j=0;j<=14;j++){s+='<line x1="'+X(0)+'" y1="'+Y(j)+'" x2="'+X(12)+'" y2="'+Y(j)+'" stroke="#eee8f8"/>';if(j%2===0)s+='<text x="'+(X(0)-6)+'" y="'+(Y(j)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">'+j+'</text>'}var cells='';for(var gx=0;gx<12;gx+=0.25)for(var gy=0;gy<14;gy+=0.25){var cx=gx+0.125,cy=gy+0.125;if(CONS.every(function(c,k){return!on[k]||c[1](cx,cy)}))cells+='<rect x="'+X(gx)+'" y="'+Y(gy+0.25)+'" width="7.6" height="6.1" fill="#16766a" fill-opacity=".22"/>'}if(on.every(Boolean)){var Vp=VERTS(on),cx0=Vp.reduce(function(t,v){return t+v[0]},0)/Vp.length,cy0=Vp.reduce(function(t,v){return t+v[1]},0)/Vp.length;Vp.sort(function(p,q){return Math.atan2(p[1]-cy0,p[0]-cx0)-Math.atan2(q[1]-cy0,q[0]-cx0)});s+='<polygon points="'+Vp.map(function(v){return X(v[0])+','+Y(v[1])}).join(' ')+'" fill="#16766a" fill-opacity=".25"/>'}else s+=cells;s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(12)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(14)+'" stroke="#3d2a73" stroke-width="2"/><text x="'+X(12)+'" y="'+(Y(0)+30)+'" font-size="12" text-anchor="end" fill="#3d2a73">x (hundreds of patties)</text><text x="'+(X(0)+6)+'" y="'+(Y(14)+12)+'" font-size="12" fill="#3d2a73">y (hundreds of coco bread)</text>';var cols=['#2f5fc4','#a85d00','#c02d5f','#6a3fc0'];CONS.forEach(function(c,k){if(!on[k])return;var a=c[2],p1,p2;if(a[1]===0){p1=[a[2]/a[0],0];p2=[a[2]/a[0],14]}else if(a[0]===0){p1=[0,a[2]];p2=[12,a[2]]}else{p1=[0,a[2]/a[1]];p2=[a[2]/a[0],0]}s+='<line x1="'+X(p1[0])+'" y1="'+Y(p1[1])+'" x2="'+X(p2[0])+'" y2="'+Y(p2[1])+'" stroke="'+cols[k]+'" stroke-width="2.5"/>'});if(pv!==undefined){s+='<line x1="'+X(0)+'" y1="'+Y(pv/2)+'" x2="'+X(pv/3)+'" y2="'+Y(0)+'" stroke="#c02d5f" stroke-width="2.5" stroke-dasharray="8 5"/>'}VERTS(on).forEach(function(v){s+='<circle cx="'+X(v[0])+'" cy="'+Y(v[1])+'" r="5" fill="#3d2a73"/><text x="'+(X(v[0])+6)+'" y="'+(Y(v[1])-6)+'" font-size="10" font-weight="700" fill="#3d2a73">('+fl(v[0])+', '+fl(v[1])+')</text>'});return s+'</svg>'};

 title:'Linear Inequalities and Linear Programming',
 goals:['represent the solution of linear inequalities in one variable on a number line and on a graph','draw a graph to represent a linear inequality in two variables','form inequalities from worded problems and identify the feasible region','use linear programming to find the maximum or minimum value of an objective function'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 2',unit:'Module 3: Relations, Functions and Graphs 2',strand:'Relations, Functions and Graphs',standard:'Module 3, Relations, Functions and Graphs 2: appreciate that many mathematical relations may be represented in symbolic form, tabular or pictorial form; appreciate the usefulness of concepts in relations, functions and graphs to solve real-world problems.',

  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 3, Section 2 (2.1–2.3). The syllabus suggests using real-life examples of items that fit related categories as an analogy to linear programming, and break-even analysis in business. Shading conventions vary: CSEC questions state whether to shade the required or the unwanted region, so always follow the question.'},
 glossary:[['Linear inequality','An inequality whose graph boundary is a straight line, such as 2x + y ≤ 16.'],['Boundary line','The line where the two sides are equal; solid for ≤ or ≥, broken for < or >.'],['Test point','A point (often the origin) used to decide which side of the boundary to shade.'],['Feasible region','The region where ALL the inequalities are satisfied.'],['Constraint','A condition or limit, written as an inequality.'],['Objective function','The quantity to maximise or minimise, such as profit P = 3x + 2y.'],['Vertex','A corner of the feasible region; the maximum or minimum occurs at a vertex.'],['Linear programming','A method for finding the best value of an objective function subject to linear constraints.']],
 teacher:{time:'about 120 minutes over three periods',flow:[['Engage','8 min','The bakery: how many patties and coco bread for the most profit?','Bring a real price list from a bakery.'],['Explore','20 min','Bakery planner: switch constraints on, see the feasible region, move the profit line.','Ask: "Where does the profit line leave the region?"'],['Explain','50 min','One-variable inequalities, two-variable inequalities, feasible regions; forming constraints, the objective function, vertices; I do, we do, you do.','Draw on graph paper with clear scales.'],['Elaborate','30 min','Challenge Zone and Bronze to Gold problems.','Practise CSEC linear programming questions in full.'],['Evaluate','12 min','Quiz and reflection.','Check which region the question asks students to shade.']],
  misconceptions:['Using a solid line for < or >, or a broken line for ≤ or ≥.','Shading the wrong side (always use a test point).','Forming the inequality the wrong way round: "at least" means ≥ and "at most" means ≤.','Testing the objective function at random points instead of at the vertices.','Forgetting that x and y are often whole numbers in real problems.'],

 steps:[
  {phase:'engage',name:'The bakery',title:'How much of each should the bakery make?',lead:'A bakery in Kingston makes patties (x hundred) and coco bread (y hundred) each morning. It must make at least 200 patties and 100 coco bread. The oven can bake at most 1,000 items in total, and the dough limits it to 2x + y ≤ 16. Each hundred patties earns $300 profit and each hundred coco bread $200.',
   mission:['Type your name.','Predict the best combination.','Write what you already know about inequalities.'],
   patois:'Patty an coco bread. How much a each fi mek di most profit?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'Which combination gives the most profit?',options:['As many patties as possible','A mix of 600 patties and 400 coco bread','As many coco bread as possible'],after:'The bakery planner will find the best point: one of the corners of the feasible region.'},{type:'write',fields:[{id:'know',label:'What I remember about inequalities and their graphs:',placeholder:'Example: y > x + 1 is shaded above the line'},{id:'wonder',label:'A business decision with limits:',placeholder:'Example: how many of each item to stock'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'Solve 3x − 2 ≥ 7.',o:['x ≥ 3','x ≤ 3','x ≥ 5/3'],a:0,why:'3x ≥ 9.',teach:'Add 2 (3x ≥ 9), then divide by 3: x ≥ 3.'},{q:'Is (1, 2) in the region y > x + 2?',o:['No','Yes'],a:0,why:'2 > 3 is false.',teach:'Substitute: is 2 > 1 + 2 = 3? No, so the point is not in the region.'},{q:'Where do x + y = 10 and 2x + y = 16 meet?',o:['(6, 4)','(4, 6)','(8, 2)'],a:0,why:'Subtract: x = 6.',teach:'Subtract the equations: x = 6, then y = 4.'},{q:'"At least 5" is written…',o:['≥ 5','≤ 5','> 5'],a:0,why:'5 or more.',teach:'"At least 5" means 5 or more: ≥ 5.'}]}]},
  {phase:'explore',name:'Bakery planner',title:'Explore: the bakery planner',lead:'Switch each constraint on or off. The shaded green region shows the points that satisfy every constraint that is on: the feasible region. Then move the profit line P = 3x + 2y (in hundreds of dollars) and watch where it last touches the region.',
   mission:['Switch the constraints on one by one and watch the region shrink.','With all four on, increase the profit P until the dashed line is about to leave the region.','Complete all 3 challenges for a star.'],
   patois:'Di best point deh pon a corner.',
   blocks:[{type:'custom',star:true,html:'<div class="controls lpOn"></div><div class="controls"><label for="lpP">Profit line P = 3x + 2y =</label><input type="range" id="lpP" min="2" max="36" value="12"><output class="big lpPO"></output></div><div class="scene lpSvg"></div><div class="tile lpOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge lpN"></span> <strong class="lpQ"></strong></p><div class="controls"><input type="number" step="0.01" class="lpIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go lpC">Check</button></div><div class="fb lpFb" aria-live="polite">Use the planner to help you.</div></div>',
     init:function(box,api){var on=[true,true,true,true],wrap=box.querySelector('.lpOn'),P=box.querySelector('#lpP');api.nudges(P);CONS.forEach(function(c,i){var l=document.createElement('label'),e=document.createElement('input');e.type='checkbox';e.checked=true;e.addEventListener('change',function(){on[i]=e.checked;draw()});l.appendChild(e);l.appendChild(document.createTextNode(' '+c[0]+'  '));wrap.appendChild(l)});function draw(){var pv=+P.value,V=VERTS(on),inside=false;for(var x=0;x<=12;x+=0.05){var y=(pv-3*x)/2;if(y>=0&&y<=14&&CONS.every(function(c,k){return!on[k]||c[1](x,y)})){inside=true;break}}box.querySelector('.lpPO').textContent=pv;box.querySelector('.lpSvg').innerHTML=LPG(on,pv);var best=V.map(function(v){return[v,3*v[0]+2*v[1]]}).sort(function(a,b){return b[1]-a[1]});box.querySelector('.lpOut').innerHTML=(on.every(Boolean)?'<strong>Vertices of the feasible region</strong> and profit P = 3x + 2y:<br>'+best.map(function(b){return'('+fl(b[0][0])+', '+fl(b[0][1])+'): P = '+fl(b[1])}).join('<br>')+'<br>The <strong>maximum</strong> is at the top of this list.':'Switch on all four constraints to see the full feasible region and its vertices.')+'<br>The profit line P = '+pv+' '+(inside?'<strong>crosses</strong> the feasible region, so this profit is possible.':'<strong>misses</strong> the feasible region, so this profit is NOT possible.')}P.addEventListener('input',draw);var Q=[{t:'With all four constraints on, how many vertices does the feasible region have?',a:4},{t:'What is the maximum profit P (in hundreds of dollars)?',a:26},{t:'How many hundred patties (x) give the maximum profit?',a:6}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.lpN').textContent='All done';box.querySelector('.lpQ').textContent='You completed every challenge!';box.querySelector('.lpC').disabled=true;return}box.querySelector('.lpN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.lpQ').textContent=Q[q].t}box.querySelector('.lpC').onclick=function(){var v=parseFloat(box.querySelector('.lpIn').value),fb=box.querySelector('.lpFb');if(Math.abs(v-Q[q].a)<0.01){fb.className='fb ok lpFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.lpIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no lpFb';fb.textContent='Not yet. Switch on all four constraints and read the list of vertices.'}};draw();task()}},
    {type:'recall',text:'The best plan is 600 patties and 400 coco bread: the vertex (6, 4) gives P = 3(6) + 2(4) = 26 hundred dollars, more than any other corner.'}]},
  {phase:'explain',name:'Teach: inequalities and regions',title:'Learn: inequalities in one and two variables, and the feasible region',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Solid fi ≤ an ≥; broken fi < an >. Test a point.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Inequalities in one variable: number line and graph',explain:'<p>The syllabus asks you to show the solution of a one-variable inequality in two ways.</p><p><strong>(a) On a number line:</strong> a filled circle for ≤ or ≥ (the end value is included), an open circle for < or > (not included), and a thick line in the direction of the solution.</p><p><strong>(b) On a graph:</strong> an inequality in x alone, such as x ≥ 2, is a <strong>vertical</strong> boundary line x = 2 with the region to its right. An inequality in y alone, such as y < 3, has a <strong>horizontal</strong> boundary y = 3 with the region below it.</p><p>Solve first, then show the solution. For example, 2x − 1 ≥ 3 gives x ≥ 2, which is {x : x ≥ 2}.</p>',visual:NL('≥',2,'Number line for x ≥ 2'),
     example:{q:'Solve 5 − 2x > 1 and show the solution on a number line.',steps:[{do:'Subtract 5: −2x > −4.'},{do:'Divide by −2 and REVERSE the sign: x < 2.'},{do:'Number line: an open circle at 2, shaded to the left. In set notation: {x : x < 2}.'}]},
     mistake:'Using a filled circle for < or >. The end value is NOT included, so the circle is open.',
     check:{q:'On a graph, the region x ≤ −1 lies…',o:['to the left of the vertical line x = −1','above the line y = −1','to the right of x = −1'],a:0,why:'x values less than −1 are to the left.',hint:'x is horizontal.'}},
    {title:'Graphing a linear inequality in two variables',explain:'<p>To draw a {{linear inequality|an inequality with a straight-line boundary}} such as 2x + y ≤ 16:</p><p><strong>1.</strong> Draw the {{boundary line|where the two sides are equal}} 2x + y = 16 (find two points, such as the intercepts (0, 16) and (8, 0)). Use a <strong>solid</strong> line for ≤ or ≥, and a <strong>broken</strong> line for < or >.</p><p><strong>2.</strong> Choose a {{test point|a point used to decide which side to shade}} not on the line, usually the origin (0, 0). Substitute: is 2(0) + 0 ≤ 16? Yes, so the origin’s side is the region you want.</p><p><strong>3.</strong> Shade as the question instructs. Some CSEC questions ask you to shade the <strong>required</strong> region; others ask you to shade the <strong>unwanted</strong> region, leaving the required region clear. Always read carefully.</p>',
     example:{q:'Describe the graph of y > 2x − 3.',steps:[{do:'Boundary: y = 2x − 3, drawn as a BROKEN line (because of >).'},{do:'Test (0, 0): is 0 > −3? Yes.'},{do:'So the required region is the side containing the origin: above the line.'}]},
     mistake:'Choosing a test point that lies ON the boundary line. Use a point clearly on one side.',
     check:{q:'For x + 2y ≥ 6, is the origin in the required region?',o:['No','Yes'],a:0,why:'0 ≥ 6 is false.',hint:'Substitute (0, 0).'}},
    {title:'Several inequalities: the feasible region',explain:'<p>Real problems have several {{constraints|conditions written as inequalities}}. Draw each boundary line, and find the region that satisfies <strong>all</strong> of them at the same time: the {{feasible region|where all the inequalities are satisfied}}.</p><p>For the bakery: x ≥ 2 (right of x = 2), y ≥ 1 (above y = 1), x + y ≤ 10 (below that line), and 2x + y ≤ 16 (below that line). The feasible region is the four-sided shape where all four overlap, as you saw in the planner.</p><p>Its corners are the {{vertices|corners of the feasible region}}. Find them from the graph, or more accurately by solving the equations of the lines that meet there as simultaneous equations. For example, x + y = 10 and 2x + y = 16 meet at (6, 4).</p>',visual:LPG([true,true,true,true],undefined,'The feasible region of the bakery problem with its four vertices'),
     example:{q:'Find the vertex where x = 2 meets x + y = 10, and the vertex where y = 1 meets 2x + y = 16.',steps:[{do:'x = 2: 2 + y = 10, so y = 8. Vertex (2, 8).'},{do:'y = 1: 2x + 1 = 16, so x = 7.5. Vertex (7.5, 1).'},{do:'With (2, 1) and (6, 4), the region has four vertices.'}]},
     mistake:'Reading vertices roughly from a sketch. Solve the pairs of equations for exact coordinates.',
     check:{q:'Which point is in the bakery’s feasible region?',o:['(4, 3)','(1, 5)','(8, 4)'],a:0,why:'It satisfies all four: 4 ≥ 2, 3 ≥ 1, 7 ≤ 10, 11 ≤ 16.',hint:'Test every inequality.'}}]}]},
  {phase:'explain',name:'Teach: linear programming',title:'Learn: forming constraints and optimising',lead:'Next, turning a real problem into inequalities, and finding the best solution.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Check every corner. Di best one win.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Forming inequalities from words',explain:'<p>{{Linear programming|finding the best value subject to linear constraints}} starts with translating a story into inequalities. First, define the variables clearly: “let x be the number of hundreds of patties”.</p><p>Then turn each condition into an inequality. Key phrases: “<strong>at least</strong>” → ≥; “<strong>at most</strong>”, “<strong>no more than</strong>” or “<strong>cannot exceed</strong>” → ≤; “<strong>more than</strong>” → >; “<strong>fewer than</strong>” → <. Don’t forget hidden constraints: you cannot make a negative number of items, so x ≥ 0 and y ≥ 0.</p><p>Resource limits often look like: (amount used per item × number of items) added up ≤ amount available. If each hundred patties uses 2 kg of dough, each hundred coco bread 1 kg, and there are 16 kg, then 2x + y ≤ 16.</p>',
     example:{q:'A taxi operator has cars (x) and buses (y). She needs at least 3 cars, no more than 5 buses, and at most 10 vehicles in total. Write the constraints.',steps:[{do:'At least 3 cars: x ≥ 3.'},{do:'No more than 5 buses: y ≤ 5. And y ≥ 0.'},{do:'At most 10 vehicles: x + y ≤ 10.'}]},
     mistake:'Writing "at least 3" as x ≤ 3. "At least 3" means 3 OR MORE: x ≥ 3.',
     check:{q:'"The number of girls must be more than twice the number of boys." With g girls and b boys:',o:['g > 2b','2g > b','g < 2b'],a:0,why:'Girls exceed twice the boys.',hint:'Girls > 2 × boys.'}},
    {title:'The objective function and the vertex method',explain:'<p>The {{objective function|the quantity to maximise or minimise}} is the quantity you want to make as big (or as small) as possible: profit, income, cost or time. For the bakery: P = 3x + 2y (hundreds of dollars).</p><p>A key fact makes linear programming work: <strong>the maximum or minimum value always occurs at a vertex of the feasible region</strong>. So:</p><p><strong>1.</strong> Find all the vertices. <strong>2.</strong> Substitute each vertex into the objective function. <strong>3.</strong> The largest value is the maximum; the smallest is the minimum.</p><p>You can also see it with a <strong>profit line</strong>: slide the line P = 3x + 2y outwards (as in the planner). The last point it touches before leaving the region gives the maximum.</p>',
     example:{q:'Maximise P = 3x + 2y for the bakery. Vertices: (2, 1), (2, 8), (6, 4), (7.5, 1).',steps:[{do:'P(2, 1) = 8. P(2, 8) = 22.'},{do:'P(6, 4) = 26. P(7.5, 1) = 24.5.'},{do:'Maximum P = 26 (hundred dollars) at (6, 4): 600 patties and 400 coco bread.'}]},
     mistake:'Testing random points inside the region. The maximum and minimum are always at the VERTICES.',
     check:{q:'Vertices (0, 0), (4, 0), (3, 2) and (0, 3). Maximise P = 2x + 3y.',o:['12 at (3, 2)','8 at (4, 0)','9 at (0, 3)'],a:0,why:'P(3, 2) = 6 + 6 = 12, the largest.',hint:'Test each vertex.'}},
    {title:'Interpreting the answer',explain:'<p>Always answer the question in context: “The bakery should make 600 patties and 400 coco bread each morning, for a maximum profit of $2,600.”</p><p>Watch for <strong>whole-number</strong> requirements. If a vertex has fractions, such as (7.5, 1), and you need whole items, test the nearby whole-number points that are still inside the feasible region.</p><p>For <strong>minimum</strong> problems, such as minimising cost, look for the vertex with the <strong>smallest</strong> value of the objective function. And check the answer makes sense: it must satisfy every constraint.</p>',
     example:{q:'Minimise the cost C = 4x + 5y over the bakery region.',steps:[{do:'C(2, 1) = 13. C(2, 8) = 48.'},{do:'C(6, 4) = 44. C(7.5, 1) = 35.'},{do:'Minimum cost 13 at (2, 1): the smallest allowed production.'}]},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire inequalities.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,4),b=R(1,4),c=R(4,12),x=R(0,4),y=R(0,4),ok=a*x+b*y<=c;return{q:'Is ('+x+', '+y+') in '+a+'x + '+b+'y ≤ '+c+'?',o:[ok?'Yes':'No',ok?'No':'Yes'],a:0,why:a*x+b*y+' ≤ '+c+' is '+(ok?'true':'false')+'.'}}if(r===1){var p=R(1,5),q=R(1,5),V=[[0,0],[R(2,6),0],[R(1,4),R(1,4)],[0,R(2,6)]],vals=V.map(function(v){return p*v[0]+q*v[1]}),m=Math.max.apply(null,vals);return{q:'Maximise '+p+'x + '+q+'y at vertices '+V.map(function(v){return'('+v[0]+','+v[1]+')'}).join(' ')+'.',o:[String(m),String(Math.min.apply(null,vals.filter(function(z){return z!==m}).concat([m-1]))),String(m+p)],a:0,why:'Test each vertex.'}}var s=['≤','≥','<','>'][R(0,3)];return{q:'Boundary for y '+s+' 2x + 1?',o:[s==='≤'||s==='≥'?'solid':'broken',s==='≤'||s==='≥'?'broken':'solid'],a:0,why:'≤ ≥ solid; < > broken.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent constraints that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Write the constraint: "Each table seats 4 people, each bench seats 6, and there are at most 60 seats." (t tables, b benches)',placeholder:'…',check:function(v){var t=String(v).replace(/\s/g,'').replace(/≤/g,'<=');return/^4t\+6b<=60$/.test(t)||/^6b\+4t<=60$/.test(t)?{ok:true,msg:'Yes! 4t + 6b ≤ 60.'}:{ok:false,msg:'Seats used ≤ 60: 4t + 6b ≤ 60.'}}},{q:'Give a point (x, y) that is in the region x ≥ 2, y ≥ 1, x + y ≤ 10 AND 2x + y ≤ 16, with both coordinates whole numbers and x + y = 10.',placeholder:'(x, y)',check:function(v){var m=String(v).replace(/\s/g,'').match(/^\(?(\d+),(\d+)\)?$/);if(!m)return{ok:false,msg:'Type (x, y).'};var x=+m[1],y=+m[2];return x>=2&&y>=1&&x+y===10&&2*x+y<=16?{ok:true,msg:'Correct! It lies on the edge of the feasible region.'}:{ok:false,msg:'Try x from 2 to 6, with y = 10 − x.'}}},{q:'Which vertex of the bakery region gives the most coco bread (largest y)? (Type (x, y).)',placeholder:'(x, y)',check:function(v){var m=String(v).replace(/\s/g,'').match(/^\(?(\d+),(\d+)\)?$/);return m&&+m[1]===2&&+m[2]===8?{ok:true,msg:'Yes! (2, 8): 200 patties and 800 coco bread.'}:{ok:false,msg:'Look at the four vertices: which has the biggest y?'}}}]}},
