var QFB={A:'Not this one. This is a picture of the ball’s PATH (straight up and down). But the graph shows HEIGHT against TIME. As time moves forward (to the right), the height rises and then falls, so the graph cannot be a vertical line: time never stands still.',B:'Close: height rises then falls. But straight sides would mean the ball moves at the same speed all the way up and down. A real ball slows down as it rises, stops for an instant at the top, then speeds up as it falls. That makes the graph CURVE: it is a parabola.',C:'Yes! Height rises quickly at first, slows near the top, turns, then falls faster and faster. The graph is a smooth, symmetrical curve: a parabola. The graph is not a picture of the path; it shows how the height changes over time.'};
var THROW=function(u){var W=420,H=280,tmax=4.2,hmax=22,X=function(t){return 40+t/tmax*360},Y=function(h){return 250-h/hmax*225},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of height against time for a ball thrown straight up at '+u+' metres per second"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/>';for(var t=0;t<=4;t++)s+='<line x1="'+X(t)+'" y1="'+Y(0)+'" x2="'+X(t)+'" y2="'+Y(hmax)+'" stroke="#eee8f8"/><text x="'+X(t)+'" y="'+(Y(0)+14)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+t+' s</text>';for(var h=0;h<=20;h+=5)s+='<line x1="'+X(0)+'" y1="'+Y(h)+'" x2="'+X(tmax)+'" y2="'+Y(h)+'" stroke="#eee8f8"/><text x="'+(X(0)-6)+'" y="'+(Y(h)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">'+h+'</text>';s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(tmax)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(hmax)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(5)+'" x2="'+X(tmax)+'" y2="'+Y(5)+'" stroke="#16766a" stroke-width="2" stroke-dasharray="7 5"/><text x="'+(X(tmax)-4)+'" y="'+(Y(5)-6)+'" font-size="11" text-anchor="end" fill="#155c35">roof gutter, 5 m</text>';var T=u/5,p=[];for(var x=0;x<=T+1e-9;x+=T/80)p.push(X(x).toFixed(1)+','+Y(Math.max(0,u*x-5*x*x)).toFixed(1));s+='<polyline points="'+p.join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/><circle cx="'+X(u/10)+'" cy="'+Y(u*u/20)+'" r="5" fill="#a85d00"/><circle cx="'+X(T)+'" cy="'+Y(0)+'" r="5" fill="none" stroke="#c02d5f" stroke-width="2.5"/>';return s+'<text x="'+(X(0)+6)+'" y="'+(Y(hmax)+12)+'" font-size="11" fill="#3d2a73">height (m)</text><text x="'+(X(tmax))+'" y="'+(Y(0)-6)+'" font-size="11" text-anchor="end" fill="#3d2a73">time</text></svg>'};

 teacher:{time:'about 100 minutes over two or three periods',flow:[['Engage','8 min','The shot put: how high, and where does it land?','Show a slow-motion shot put video if possible.'],['Explore','20 min','Quadratic graph reader: change a, h and k; read features; draw tangents.','Ask: "How do h and k move the graph?"'],['Explain','45 min','Drawing and reading features; vertex form, sketching, gradient and intervals; I do, we do, you do.','Use graph paper with scales from CSEC past papers.'],['Elaborate','20 min','Challenge Zone and Bronze to Gold problems.','Practise reading graphs at an exam scale.'],['Evaluate','10 min','Quiz and reflection.','Watch for the axis of symmetry written as x = h instead of x = −h.']],
  misconceptions:['Treating a graph as a picture of the situation: for example, expecting the height–time graph of a ball thrown straight up to be a vertical line. A graph shows how one quantity changes as another changes.','Writing the axis of symmetry of y = (x − 3)² + 1 as x = −3 (it is x = 3).','Joining points with straight lines instead of a smooth curve.','Reading the gradient of a curve from two far-apart points instead of a tangent.','Confusing "the image of 2" (a y-value) with "the value with image 2" (an x-value).','Thinking every parabola has two roots.'],
  extension:'Find the equation of a parabola that has a turning point at (2, −5) and passes through (4, 3). Write it in the form a(x + h)² + k, then expand it.'},

   blocks:[{type:'mcq',star:true,questions:[{q:'If y = x² − 2x − 3, what is y when x = −2?',o:['5','−3','−11'],a:0,why:'4 + 4 − 3 = 5.',teach:'Substitute with brackets: (−2)² − 2(−2) − 3 = 4 + 4 − 3 = 5.'},{q:'Write x² − 6x + 5 as (x + h)² + k.',o:['(x − 3)² − 4','(x − 6)² + 5','(x + 3)² − 4'],a:0,why:'(x − 3)² = x² − 6x + 9; 5 − 9 = −4.',teach:'Halve −6 to get −3: (x − 3)² = x² − 6x + 9, which is 4 too many, so subtract 4.'},{q:'Gradient of the line through (1, 2) and (3, 8)?',o:['3','6','1/3'],a:0,why:'6 ÷ 2.',teach:'Change in y ÷ change in x = (8 − 2) ÷ (3 − 1) = 3.'},{q:'Solve (x − 1)(x − 5) = 0.',o:['x = 1 or 5','x = −1 or −5','x = 6'],a:0,why:'Each factor = 0.',teach:'If a product is zero, a factor is zero: x = 1 or x = 5.'}]}]},

  {phase:'explore',name:'Quadratic graph reader',title:'Explore: the quadratic graph reader',lead:'Every graph here is in vertex form, y = a(x + h)² + k. Change a, h and k, and the reader shows the features CSEC asks about. Slide the tangent point to see how the gradient changes along the curve.',
   mission:['Change h and k. How do they move the turning point?','Change a to negative. What happens to the turning point?','Complete all 3 challenges for a star.'],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="grA">a:</label><select id="grA"><option>-2</option><option>-1</option><option selected>1</option><option>2</option></select><label for="grH">h:</label><input type="range" id="grH" min="-4" max="4" value="-2"><output class="big grHO"></output><label for="grK">k:</label><input type="range" id="grK" min="-9" max="9" value="-9"><output class="big grKO"></output></div><div class="controls"><label for="grT">Tangent at x =</label><input type="range" id="grT" min="-6" max="6" value="4"><output class="big grTO"></output></div><div class="scene grSvg"></div><div class="tile grOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge grN"></span> <strong class="grQ"></strong></p><div class="controls"><input type="text" class="grIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go grC">Check</button></div><div class="fb grFb" aria-live="polite">Use the reader to help you.</div></div>',
     init:function(box,api){var A=box.querySelector('#grA'),H=box.querySelector('#grH'),Kk=box.querySelector('#grK'),Tt=box.querySelector('#grT');[H,Kk,Tt].forEach(function(e){api.nudges(e)});function draw(){var a=+A.value,h=+H.value,k=+Kk.value,t=+Tt.value,f=function(x){return a*(x+h)*(x+h)+k},n=a*k<0?2:k===0?1:0,r=n?Math.sqrt(-k/a):0;box.querySelector('.grHO').textContent=fg(h);box.querySelector('.grKO').textContent=fg(k);box.querySelector('.grTO').textContent=fg(t);box.querySelector('.grSvg').innerHTML=PG(a,h,k,{axis:true,tp:true,roots:true,tan:t});box.querySelector('.grOut').innerHTML='<strong>'+VF(a,h,k)+'</strong>  (expanded: '+EXP(a,h,k)+')<br><strong>Turning point:</strong> ('+fg(-h)+', '+fg(k)+'), a <strong>'+(a>0?'minimum':'maximum')+'</strong>. '+(a>0?'Minimum':'Maximum')+' value = '+fg(k)+'.<br><strong>Axis of symmetry:</strong> x = '+fg(-h)+'<br><strong>Roots:</strong> '+(n===0?'none (0 roots): the curve never reaches the x-axis':n===1?'one repeated root, x = '+fg(-h):'two roots, x = '+fg(-h-r)+' and x = '+fg(-h+r))+'<br><strong>y-intercept:</strong> (0, '+fg(f(0))+')<br><strong>Tangent at x = '+fg(t)+':</strong> image '+fg(f(t))+', gradient '+fg(2*a*(t+h))+(2*a*(t+h)===0?' (the turning point: the tangent is flat)':'')}[A,H,Kk,Tt].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});function nums(v){return String(v).replace(/−/g,'-').replace(/x=|or|and/gi,',').split(/[,\s]+/).filter(function(z){return z!==''}).map(Number).sort(function(p,q){return p-q})}var T=[{t:'For y = (x − 2)² − 9, what is x in the axis of symmetry x = ?',ok:function(v){return parseFloat(v.replace(/x=|\s/g,''))===2}},{t:'For y = (x − 2)² − 9, what is the minimum value of y?',ok:function(v){return parseFloat(v.replace(/−/g,'-'))===-9}},{t:'For y = (x − 2)² − 9, what are the roots? (Type both, like −1, 5.)',ok:function(v){var n=nums(v);return n.length===2&&n[0]===-1&&n[1]===5}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.grN').textContent='All done';box.querySelector('.grQ').textContent='You completed every challenge!';box.querySelector('.grC').disabled=true;return}box.querySelector('.grN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.grQ').textContent=T[q].t}box.querySelector('.grC').onclick=function(){var v=String(box.querySelector('.grIn').value).trim(),fb=box.querySelector('.grFb');if(T[q].ok(v)){fb.className='fb ok grFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.grIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no grFb';fb.textContent='Not yet. (x − 2) means h = −2. Set a = 1, h = −2, k = −9 and read the features.'}};draw();task()}},
    {type:'recall',text:'The greatest height is 9 m. In y = −(x − 4)² + 9, the turning point is (4, 9): a maximum, because a is negative. The shot put reaches 9 m when it has travelled 4 m horizontally.'}]},
  {phase:'explain',name:'Teach: drawing and reading features',title:'Learn: drawing quadratic graphs and reading their features',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Smooth curve. Read across an dung carefully.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Drawing a quadratic graph accurately',explain:PIC('A cricket ball is hit high into the air at Sabina Park. Every half-second, a camera records its height. The table of values is just those readings: time in one row, height in the other. Plotting them and joining them smoothly shows how the height changes over time.',SCN['Drawing a quadratic graph accurately'])+'<p>CSEC Paper 2 often asks you to complete a table of values and draw a quadratic graph to a given scale. Accuracy earns the marks.</p><p><strong>1.</strong> Complete the table, using brackets for negative values: for y = x² − 2x − 3 at x = −2, y = (−2)² − 2(−2) − 3 = 5. <strong>2.</strong> Use the scale given exactly. <strong>3.</strong> Plot each point with a small, neat cross. <strong>4.</strong> Join them with one <strong>smooth curve</strong>, never with straight lines, and with a rounded bottom (or top), never a sharp point.</p><p>The graph is a {{parabola|the U-shaped graph of a quadratic function}}. It is symmetrical, so the y-values in the table should match in pairs either side of the lowest (or highest) point. If one does not, recheck it.</p>'+WHY('Why a SMOOTH curve, and not straight lines between the points? The ball does not jump from one reading to the next: between two readings it passes through every height in between, rising more and more slowly. And why do the y-values match in pairs? In y = (x − 1)² − 4, the values x = −1 and x = 3 are both 2 away from 1, so (x − 1)² is 4 for both: the graph is symmetrical about x = 1.')+WORK('<strong>Engineers and scientists</strong> plot measurements from experiments to see the pattern hiding in the numbers. <strong>Sports analysts</strong> plot the flight of a ball to study a shot.'),visual:PG(1,-1,-4,{label:'Graph of y = (x − 1)² − 4, which is y = x² − 2x − 3'}),
     example:{q:'Complete the table for y = x² − 2x − 3 for x = −2 to 4.',steps:[{do:'x = −2, −1, 0, 1, 2, 3, 4 gives y = 5, 0, −3, −4, −3, 0, 5.'},{do:'The values match in pairs around x = 1: a good check.'},{do:'Plot the seven points and join them with a smooth U-shaped curve.'}]},
     mistake:'Squaring a negative to get a negative: (−2)² = 4, not −4.',
     check:{q:'For y = x² − 4x, what is y when x = −1?',o:['5','−3','3'],a:0,why:'1 + 4 = 5.',hint:'(−1)² − 4(−1).'}},
    {title:'Images, values with a given image, and roots',explain:PIC('Think of the cricket ball again. The image of 2 is the ball’s height after 2 seconds. "The values of t whose image is 15" are the moments when the ball is 15 m high: once on the way up, and once on the way down. That is why there are usually TWO answers. The roots are the moments when the height is 0: when the ball is at ground level.',SCN['Images, values with a given image, and roots'])+'<p>The syllabus asks you to read several features from a graph.</p><p>The {{image|the y-value an x-value maps to}} of an x-value is its y-value: go <strong>up or down</strong> from x to the curve, then <strong>across</strong> to the y-axis.</p><p>An <strong>element of the domain that has a given image</strong> works the other way: go <strong>across</strong> from the y-value to the curve, then <strong>down or up</strong> to the x-axis. There are often <strong>two</strong> answers, because a horizontal line usually crosses a parabola twice.</p><p>The {{roots|x-values where the graph crosses the x-axis}} are the x-values where the curve crosses the x-axis, where y = 0. They are the solutions of the equation “quadratic = 0”.</p>'+WHY('Why two answers? A parabola goes up and then comes down (or down and then up). So a horizontal line at any height between the top and the ground crosses it twice. Only at the turning point itself is there exactly one answer.')+WORK('<strong>Fireworks designers</strong> (such as those planning New Year’s displays over Kingston) time when a rocket reaches the height to burst. <strong>Cricket and football analysts</strong> work out how long a ball stays above a player’s reach.'),
     example:{q:'From the graph of y = x² − 2x − 3: find the image of 4, the values of x with image −3, and the roots.',steps:[{do:'Image of 4: up from x = 4 to the curve: y = 5.'},{do:'Image −3: across from y = −3, the curve is met at x = 0 and x = 2.'},{do:'Roots: the curve crosses the x-axis at x = −1 and x = 3.'}]},
     mistake:'Mixing up the two questions. "The image of 2" asks for a y-value; "the value of x whose image is 2" asks for an x-value.',
     check:{q:'On y = x² − 2x − 3, how many values of x have image 0?',o:['2','1','0'],a:0,why:'The roots −1 and 3.',hint:'Where does y = 0?'}},
    {title:'Maximum or minimum, and the axis of symmetry',explain:PIC('A patty vendor sets her price. Too cheap, and she earns little on each patty. Too expensive, and few people buy. As the price rises, her profit first goes up, reaches a peak, then falls. That peak, the maximum point of a parabola, is the best price.',SCN['Maximum or minimum, and the axis of symmetry'])+'<p>Every parabola has a {{turning point|the minimum or maximum point}}. If the x² term is positive, the parabola is U-shaped and the turning point is a <strong>minimum</strong>; the <strong>minimum value</strong> of the function is its y-coordinate. If the x² term is negative, the turning point is a <strong>maximum</strong>.</p><p>The {{axis of symmetry|the vertical line through the turning point}} is the vertical line through the turning point. Its equation is <strong>x = (the x-coordinate of the turning point)</strong>. You can find it from a graph, or halfway between the two roots: for roots −1 and 3, the axis is x = (−1 + 3)/2 = 1.</p><p>For y = x² − 2x − 3, the turning point is (1, −4). So the minimum value is −4, and the axis of symmetry is x = 1.</p>'+WHY('Why is the axis of symmetry halfway between the roots? The parabola is a mirror image of itself. Every height on the left side has a matching height on the right side, the same distance from the axis. The two roots are a matching pair (both at height 0), so the axis must be exactly halfway between them.')+WORK('<strong>Business owners</strong> use profit graphs to choose the best price. <strong>Engineers</strong> design arches and bridges with the highest point exactly on the axis of symmetry. <strong>Farmers</strong> find the planting density that gives the biggest harvest.'),visual:PG(1,-1,-4,{axis:true,tp:true,roots:true,label:'y = (x − 1)² − 4 with its axis of symmetry, turning point and roots marked'}),
     example:{q:'A parabola has roots at x = −3 and x = 5. Find its axis of symmetry.',steps:[{do:'The axis is halfway between the roots.'},{do:'x = (−3 + 5)/2 = 1.'},{do:'Axis of symmetry: x = 1.'}]},
     mistake:'Giving the axis of symmetry as a number, such as "1". It is a line, so write the equation: x = 1.',
     check:{q:'The turning point of a parabola is (−2, 7), a maximum. What is the maximum value?',o:['7','−2','5'],a:0,why:'The maximum value is the y-coordinate.',hint:'The y-value at the top.'}}]}]},
  {phase:'explain',name:'Teach: vertex form, sketching and interpreting',title:'Learn: vertex form, sketching, gradient and intervals',lead:'Next, the vertex form a(x + h)² + k, and interpreting graphs more deeply.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Turning point a (−h, k). Mind di sign!',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The vertex form a(x + h)² + k',explain:PIC('Completing the square rewrites a quadratic like a recipe card that tells you the most important fact first: where the top (or bottom) of the curve is. In y = −(x − 4)² + 9, you can read straight off that the shot put reaches its highest point of 9 m when it has travelled 4 m.',SCN['The vertex form a(x + h)² + k'])+'<p>In Term 2, you learned to complete the square, writing a quadratic as <strong>a(x + h)² + k</strong>. This {{vertex form|y = a(x + h)² + k, with turning point (−h, k)}} tells you the turning point at a glance.</p><p>Why? A square, (x + h)², is never negative; its smallest value is 0, when x = −h. So if a > 0, y is smallest when x = −h, and that smallest value is k. The turning point is <strong>(−h, k)</strong>, and the axis of symmetry is <strong>x = −h</strong>.</p><p>Watch the sign carefully. y = (x − 3)² + 1 has h = −3, so the turning point is (3, 1) and the axis is x = 3. The shot put, y = −(x − 4)² + 9, has a maximum at (4, 9).</p>'+WHY('Why is the turning point at x = −h? A square can never be negative: (x + h)² is smallest, 0, when x = −h. So y = (x + h)² + k is smallest when x = −h, and its smallest value is k. If a is negative, everything flips upside down, and k becomes the LARGEST value instead.')+WORK('<strong>Engineers</strong> designing parabolic arches, satellite dishes and car headlight reflectors write the shape in vertex form, because the vertex (the centre of the dish or the top of the arch) is where everything is measured from.'),
     example:{q:'Find the axis of symmetry and the minimum value of y = 2x² + 12x + 7.',steps:[{do:'Complete the square: 2(x² + 6x) + 7 = 2[(x + 3)² − 9] + 7 = 2(x + 3)² − 11.'},{do:'h = 3, so the axis of symmetry is x = −3.'},{do:'a = 2 > 0, so the minimum value is k = −11, at (−3, −11).'}]},
     mistake:'Getting the sign of the turning point wrong: y = (x + 2)² − 5 has its turning point at (−2, −5), not (2, −5).',
     check:{q:'What is the turning point of y = (x − 5)² + 2?',o:['(5, 2)','(−5, 2)','(2, 5)'],a:0,why:'h = −5, so x = 5.',hint:'(−h, k).'}},
    {title:'Sketching, and the number of roots',explain:PIC('Will a firework rocket reach 25 m? Sketch its height graph and draw the line at 25 m. If the top of the curve is below the line, the rocket NEVER reaches 25 m: there are no solutions. If the top just touches the line, there is exactly one. If the curve goes above it, there are two moments at that height.',SCN['Sketching, and the number of roots'])+'<p>A <strong>sketch</strong> is not drawn to scale, but it must show the key features: the shape, the turning point, the y-intercept, and the roots if there are any.</p><p>From y = a(x + h)² + k: <strong>1.</strong> Shape: U if a > 0, upside-down if a < 0. <strong>2.</strong> Plot the turning point (−h, k). <strong>3.</strong> Find the y-intercept by putting x = 0. <strong>4.</strong> Decide the number of roots.</p><p>The number of roots comes straight from the turning point. For a U-shape (a > 0): if the minimum is <strong>below</strong> the x-axis (k < 0), there are 2 roots; <strong>on</strong> it (k = 0), 1 root; <strong>above</strong> it (k > 0), 0 roots. For an upside-down shape, it is the other way round.</p>'+WHY('Why does the turning point decide the number of roots? For a U-shaped curve, the turning point is the lowest point. If it is below the x-axis, the curve must cross the axis on both sides (2 roots). If it sits exactly on the axis, it touches once (1 root). If it is above, the curve never reaches the axis (0 roots).')+WORK('<strong>Engineers</strong> check whether a water jet from a fountain clears a wall, or whether a truck fits under an arched bridge, by comparing the curve with a horizontal line.'),visual:PG(1,1,3,{tp:true,label:'y = (x + 1)² + 3 has its minimum above the x-axis, so it has no roots'}),
     example:{q:'How many roots does y = −(x − 1)² + 4 have?',steps:[{do:'a = −1 < 0: upside-down, with a maximum at (1, 4).'},{do:'The maximum is above the x-axis, so the curve comes down through the axis on both sides.'},{do:'2 roots (they are x = −1 and x = 3).'}]},
     mistake:'Thinking every parabola crosses the x-axis. If a U-shape has its minimum above the axis, there are no roots.',
     check:{q:'How many roots does y = (x + 2)² + 1 have?',o:['0','1','2'],a:0,why:'Its minimum, (−2, 1), is above the x-axis.',hint:'Where is the minimum?'}},
    {title:'Gradient at a point, and intervals',explain:PIC('Watch the ball again: it shoots up fast at first, slows down near the top, stops rising for an instant, then falls faster and faster. The STEEPNESS of the graph at each moment shows how fast the height is changing then: the gradient of the curve. And "when is the ball above 3 m?" is an interval of time: the window a fielder has to react.',SCN['Gradient at a point, and intervals'])+'<p>A curve’s steepness changes from point to point. The {{gradient of a curve|the gradient of the tangent at that point}} at a point is the gradient of the {{tangent|a line touching a curve at one point}} there: a straight line that just touches the curve at that point. To <strong>estimate</strong> it, draw the tangent carefully with a ruler, pick two points far apart on it, and calculate change in y ÷ change in x. At the turning point, the tangent is flat, so the gradient is 0.</p><p>The syllabus also asks for the <strong>interval of the domain</strong> where y is greater or less than a given number. Draw a horizontal line at that y-value, and see where the curve is above or below it. For y = x² − 2x − 3, y < 0 (below the x-axis) between the roots: <strong>−1 < x < 3</strong>. And y > 0 when x < −1 or x > 3.</p>'+WHY('Why use a tangent? A curve’s steepness keeps changing, so there is no single gradient. Take two points on the curve close together: the line through them is almost the tangent. Bring them closer and closer, and the line becomes the tangent at that point, whose gradient is the gradient of the curve there. At the turning point, the tangent is flat: gradient 0, the instant the ball stops rising.')+WORK('<strong>Physicists and engineers</strong> find speed from a height–time graph using its gradient. <strong>Economists</strong> use the gradient of a profit curve to see whether raising a price still helps. <strong>Coaches</strong> use intervals to see how long a ball stays in play.'),visual:PG(1,-1,-4,{tan:3,band:0,label:'Tangent drawn to y = (x − 1)² − 4 at x = 3'}),
     example:{q:'For y = x² − 2x − 3, find the interval where y ≤ 5.',steps:[{do:'Draw the line y = 5. It meets the curve where x² − 2x − 3 = 5, at x = −2 and x = 4.'},{do:'Between those, the curve is below the line.'},{do:'So y ≤ 5 for −2 ≤ x ≤ 4.'}]},
     mistake:'Estimating a curve’s gradient from two points ON the curve far apart. Use two points on the TANGENT.',
     check:{q:'At the turning point of a parabola, the gradient is…',o:['0','1','undefined'],a:0,why:'The tangent there is horizontal.',hint:'The tangent is flat.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Drawing and reading',text:'Smooth curve to the given scale. Image: x → up → across. Given image: y → across → down (often 2 answers). Roots: where y = 0.'},{title:'Turning point and axis',text:'a > 0: minimum; a < 0: maximum. Axis of symmetry: x = the turning point’s x (halfway between the roots).'},{title:'Vertex form',text:'y = a(x + h)² + k: turning point (−h, k); axis x = −h; max or min value k.'},{title:'Interpreting',text:'Roots: 2, 1 or 0 from the turning point’s position. Gradient at a point: tangent. Intervals: compare with a horizontal line.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'For y = −(x + 1)² + 4: give the turning point, its type, the axis, the y-intercept and the number of roots.',steps:[{do:'Turning point (−1, 4), a maximum (a = −1).'},{do:'Axis of symmetry x = −1. y-intercept: −(1)² + 4 = 3, so (0, 3).'},{do:'The maximum is above the x-axis and the curve opens down, so there are 2 roots (x = −3 and x = 1).'}]},

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, a quadratic graph decides the best price, whether a catch can be made, whether a truck fits under a bridge, and how much space an event can have. Choose a job, sketch the graph, and make the decision.',
   mission:['Choose a job card.','Sketch the graph first: where is the turning point? Where are the roots?','Complete any 3 jobs for a star. Complete all 4 to become a Maths at Work Champion.'],
   patois:'Di turning point a di best (or di worst). Find it!',
   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'🥟',title:'The patty vendor: the best price',desc:'Find the price that gives the most profit.',level:'⭐⭐ Business',mins:7,block:{type:'mission',story:'A patty vendor in Half Way Tree pays $100 to make each patty. If she charges x dollars, she sells (400 − x) patties a day. Her daily profit is P = (x − 100)(400 − x) dollars.',parts:[{q:'What is her profit if she charges $200? ($)',a:20000,hint:'(200 − 100)(400 − 200).',sol:'100 × 200 = $20,000.',placeholder:'dollars'},{q:'What price gives the maximum profit? ($) (Hint: the roots are 100 and 400.)',a:250,hint:'The axis of symmetry is halfway between the roots.',sol:'$250.',placeholder:'dollars'},{q:'What is the maximum daily profit? ($)',a:22500,hint:'(250 − 100)(400 − 250).',sol:'150 × 150 = $22,500.',placeholder:'dollars'},{q:'A friend says charge $280; another says $200. Which gives more profit? (Type 280 or 200.)',a:['280'],hint:'P(280) = 180 × 120.',sol:'$280 gives $21,600, more than $20,000 at $200 (because 280 is closer to the best price, 250).'},{q:'Above what price does she make no profit at all? ($)',a:400,hint:'The larger root.',sol:'$400: nobody buys.',placeholder:'dollars'}],done:'The turning point told the vendor her best price, and the roots told her the prices to avoid.'}},
    {icon:'🏏',title:'The fielder: can she make the catch?',desc:'Decide whether a high catch is possible.',level:'⭐⭐⭐ Sport',mins:7,block:{type:'mission',story:'A batter hits a ball high into the air. Its height after t seconds is h = −5t² + 20t + 1.5 metres. A fielder needs 3.5 seconds to run under the ball.',parts:[{q:'How high is the ball after 1 second? (m)',a:16.5,tol:0.01,hint:'−5 + 20 + 1.5.',sol:'16.5 m.',placeholder:'m'},{q:'After how many seconds does it reach its highest point?',a:2,hint:'Write h = −5(t − 2)² + 21.5, or use t = −b ÷ 2a.',sol:'2 s.',placeholder:'seconds'},{q:'What is its maximum height? (m)',a:21.5,tol:0.01,hint:'h(2).',sol:'21.5 m.',placeholder:'m'},{q:'After how many seconds does it reach the ground, to 2 decimal places?',a:4.07,tol:0.01,hint:'Solve −5t² + 20t + 1.5 = 0 with the formula; take the positive root.',sol:'t = [20 + √430] ÷ 10 ≈ 4.07 s.',placeholder:'seconds'},{q:'Can the fielder get under it in time? (Type yes or no.)',a:['yes'],hint:'Compare 3.5 s with 4.07 s.',sol:'Yes, with about half a second to spare.'}],done:'The root of the quadratic told the fielder exactly how long she had.'}},
    {icon:'🌉',title:'The engineer: will the truck fit?',desc:'Check a truck against an arched bridge.',level:'⭐⭐⭐ Engineering',mins:8,block:{type:'mission',story:'A road passes under an arch whose height is y = −0.24(x − 5)² + 6 metres, where x is the distance in metres from one side of the road (the arch meets the road at x = 0 and x = 10).',parts:[{q:'How wide is the arch at road level? (m)',a:10,hint:'The roots are 0 and 10.',sol:'10 m.',placeholder:'m'},{q:'What is the greatest height of the arch? (m)',a:6,hint:'Read k from the vertex form.',sol:'6 m, in the middle (x = 5).',placeholder:'m'},{q:'A truck 3 m wide drives along the middle, so its sides are at x = 3.5 and x = 6.5. How high is the arch at x = 3.5? (m)',a:5.46,tol:0.01,hint:'−0.24 × 1.5² + 6.',sol:'5.46 m.',placeholder:'m'},{q:'Can a truck 3 m wide and 5.2 m tall pass along the middle? (Type yes or no.)',a:['yes'],hint:'Compare 5.2 with 5.46.',sol:'Yes: 5.46 m of clearance at its edges.'},{q:'A wider truck, 4 m wide and 5.2 m tall, has its sides at x = 3 and x = 7. Can it pass? (Type yes or no.)',a:['no'],hint:'The arch height at x = 3 is −0.24 × 4 + 6 = 5.04 m.',sol:'No: at its edges the arch is only 5.04 m high, lower than 5.2 m. The top corners would hit the arch.'}],done:'The same truck height passes or fails depending on its width, because the arch is a curve. Engineers put height-limit signs on bridges for exactly this reason.'}},
    {icon:'🎪',title:'The event planner: the biggest space',desc:'Fence the largest area against a wall.',level:'⭐⭐ Events',mins:6,block:{type:'mission',story:'An event planner has 60 m of portable fencing to make a rectangular area against the long wall of a school hall in May Pen (the wall forms one side). If each side going out from the wall is x m long, the area is A = x(60 − 2x) m².',parts:[{q:'What is the area if x = 10? (m²)',a:400,hint:'10 × 40.',sol:'400 m².',placeholder:'m²'},{q:'The roots are x = 0 and x = 30. What value of x gives the largest area? (m)',a:15,hint:'Halfway between the roots.',sol:'x = 15 m.',placeholder:'m'},{q:'What is the largest possible area? (m²)',a:450,hint:'15 × 30.',sol:'450 m².',placeholder:'m²'},{q:'The stage and chairs need 500 m². Is 60 m of fencing enough? (Type yes or no.)',a:['no'],hint:'The maximum is 450 m².',sol:'No: even the best shape gives only 450 m². She needs more fencing.'}],done:'The turning point showed the best possible shape, and that even the best was not enough.'}}

  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A parabola is symmetrical about its axis of symmetry.',a:'always',why:'That is what the axis means.'},{s:'The turning point of y = (x − h)² + k is (h, k).',a:'always',why:'(x − h) means the x-coordinate is +h.'},{s:'The gradient of a parabola is the same everywhere.',a:'never',why:'It changes along the curve; only straight lines have constant gradient.'},{s:'A horizontal line crosses a parabola twice.',a:'sometimes',why:'Twice, once (at the turning point) or not at all.'},{s:'If a > 0 and k > 0 in y = a(x + h)² + k, the graph has roots.',a:'never',why:'Its minimum is above the x-axis.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Axis of symmetry of y = (x − 3)² + 2.',lines:['h = −3','Axis: x = −3'],wrong:1,reasons:['The axis is x = −h = 3','The axis is x = 2','The axis is y = 3'],reason:0,fix:'x = 3.'},{who:'Tia',q:'Roots of y = (x + 1)² + 4.',lines:['Set y = 0: (x + 1)² = −4','So x = −1 ± 2'],wrong:1,reasons:['A square cannot equal −4, so there are NO real roots','x = 1 and x = −3','x = 3'],reason:0,fix:'No roots: the minimum (−1, 4) is above the x-axis.'},{who:'Omar',q:'Interval where x² − 4 < 0.',lines:['Roots at −2 and 2','So x < −2 or x > 2'],wrong:1,reasons:['The curve is BELOW the axis between the roots: −2 < x < 2','x > 0','x < 2 only'],reason:0,fix:'−2 < x < 2.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire graph features.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},h=R(-5,5)||2,k=R(-8,8)||-3,a=[1,-1,2][R(0,2)],r=R(0,2),o,add=function(z){if(o.length<3&&o.indexOf(z)<0)o.push(z)};if(r===0){o=['('+fg(-h)+', '+fg(k)+')'];['('+fg(h)+', '+fg(k)+')','('+fg(k)+', '+fg(-h)+')','('+fg(-h)+', '+fg(-k)+')'].forEach(add);return{q:'Turning point of '+VF(a,h,k)+'?',o:o,a:0,why:'(−h, k).'}}if(r===1){o=['x = '+fg(-h)];['x = '+fg(h),'y = '+fg(k),'x = '+fg(k)].forEach(add);return{q:'Axis of symmetry of '+VF(a,h,k)+'?',o:o,a:0,why:'x = −h.'}}var n=a*k<0?'2':'0';return{q:'Number of roots of '+VF(a,h,k)+'?',o:[n,n==='2'?'0':'2','1'],a:0,why:(a>0?'Minimum':'Maximum')+' at y = '+fg(k)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent quadratics that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Write a quadratic in vertex form with a maximum at (2, 6).',placeholder:'y = …',check:function(v){var t=String(v).replace(/\s|y=/gi,'').replace(/−/g,'-').replace(/\^2|²/g,'²'),m=t.match(/^(-\d*)\(x-2\)²\+6$/);return m?{ok:true,msg:'Yes! A negative a gives a maximum at (2, 6).'}:{ok:false,msg:'Use a negative a: y = −(x − 2)² + 6.'}}},{q:'Choose k so that y = (x − 1)² + k has exactly ONE root.',placeholder:'k',check:function(v){return+v===0?{ok:true,msg:'Correct! The minimum (1, 0) touches the x-axis.'}:{ok:false,msg:'The minimum must sit exactly on the x-axis.'}}},{q:'A U-shaped parabola has roots −4 and 2. What is its axis of symmetry? (Type x = …)',placeholder:'x = …',check:function(v){return parseFloat(String(v).replace(/x=|\s/gi,'').replace(/−/g,'-'))===-1?{ok:true,msg:'Yes! Halfway between −4 and 2.'}:{ok:false,msg:'Halfway between the roots.'}}}]}},
