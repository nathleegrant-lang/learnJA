 curriculum:{framework:'NSC Mathematics, Grade 8',term:'Term 1',unit:'Unit 1: Indices, Bases & Estimations',strand:'Number',standard:'Use the basic operations, number relationships, patterns, number facts, calculators and software to compute and estimate in order to solve real world problems involving fractions, percentages and decimals.',

 glossary:[['Index (power)','The small raised number that says how many times the base is multiplied by itself. In 2⁵, the index is 5.'],['Base (of a power)','The number being multiplied. In 2⁵, the base is 2.'],['Standard form','A number written as A × 10ⁿ, where 1 ≤ A < 10. For example, 4,700 = 4.7 × 10³.'],['Decimal places','Digits after the decimal point.'],['Significant figures','Digits counted from the first non-zero digit.'],['Number base','How many digits a counting system uses. Base 10 uses 0 to 9; base 5 uses 0 to 4.'],['Place value','What a position in a number is worth, such as 5² = 25 in base 5.'],['Binary','Base 2, which uses only the digits 0 and 1.']],
 teacher:{time:'about 80 minutes, or two periods split after the teaching pages',flow:[['Engage','10 min','The "spread" prediction: how many after 10 steps?','Run the guide\'s standing-up activity with the class if space allows.'],['Explore','15 min','Spread simulator: each person passes it to 2, 3 or 4 others.','Ask: "How can we write 2 × 2 × 2 × 2 × 2 more quickly?"'],['Explain','30 min','Indices, standard form and rounding; place value, converting and calculating in other bases; I do, we do, you do.','Use bundles of straws to model grouping in base 5.'],['Elaborate','15 min','Challenge Zone and Bronze to Gold problems.','Link to the size of pathogens and distances to planets.'],['Evaluate','10 min','Quiz and reflection.','Watch for 2³ = 6.']],

     init:function(box,api){var k=box.querySelector('#spK'),n=box.querySelector('#spN');api.nudges(n);function draw(){var K=+k.value,N=+n.value,v=Math.pow(K,N),rep=N?Array(N).fill(K).join(' × '):'(nobody has passed it on yet)';box.querySelector('.spNO').textContent=N;box.querySelector('.spSvg').innerHTML=SPREAD(K,N);box.querySelector('.spX').innerHTML='New people at step '+N+' = '+rep+(N?' = <strong>'+v.toLocaleString('en-JM')+'</strong>':' : just <strong>1</strong> person')+'.<br>Short way: <strong>'+K+'<sup>'+N+'</sup> = '+v.toLocaleString('en-JM')+'</strong>'+(N===0?' (any number to the power 0 is 1)':'')+'.'}k.onchange=draw;n.addEventListener('input',draw);var T=[{t:'Each person passes it to 2 others. How many new people at step 5?',a:'32'},{t:'Each person passes it to 3 others. How many new people at step 4?',a:'81'},{t:'64 = 2 to the power of what number?',a:'6'}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.spB').textContent='All done';box.querySelector('.spT').textContent='You completed every challenge!';box.querySelector('.spC').disabled=true;return}box.querySelector('.spB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.spT').textContent=T[q].t}box.querySelector('.spC').onclick=function(){var v=String(box.querySelector('.spA').value).replace(/[\s,]/g,''),fb=box.querySelector('.spFb');if(v===T[q].a){fb.className='fb ok spFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.spA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no spFb';fb.textContent='Not yet. Set the simulator to match the challenge and read the result.'}};draw();task()}},

  {phase:'explain',name:'Teach: indices and standard form',title:'Learn: indices, standard form and rounding',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Di likkle number up top tell yuh how much time fi multiply.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What aᵐ means',explain:'<p>A power is a short way to write repeated multiplication. In <strong>aᵐ</strong>, <strong>a</strong> is the {{base|the number being multiplied}} and <strong>m</strong> is the {{index|how many times the base is multiplied}} (or power).</p><p>2⁵ = 2 × 2 × 2 × 2 × 2 = 32. We read it as "2 to the power 5".</p><p>Special cases: a¹ = a, and <strong>a⁰ = 1</strong> for any non-zero a. (In the simulator, step 0 had just 1 person.)</p>',visual:SPREAD(2,4),
     example:{q:'Evaluate 3⁴ and 10³.',steps:[{do:'3⁴ = 3 × 3 × 3 × 3.',why:'The index 4 tells you to use four 3s.'},{do:'3 × 3 = 9, 9 × 3 = 27, 27 × 3 = 81.'},{do:'10³ = 10 × 10 × 10 = 1,000.',why:'A power of 10 is a 1 followed by that many zeros.'}]},
     mistake:'Multiplying the base by the index: 2³ is NOT 2 × 3 = 6. It is 2 × 2 × 2 = 8.',
     check:{q:'What is 5³?',o:['15','125','53'],a:1,why:'5 × 5 × 5 = 125.',hint:'Use three 5s.'}},
    {title:'Evaluating aᵐ × bⁿ and aᵐ ÷ bⁿ',explain:'<p>When an expression has powers with different bases, <strong>work out each power first</strong>, then multiply or divide.</p><p>When the bases are the same, there is a shortcut you will meet again in Grade 9: 2³ × 2² = (2 × 2 × 2) × (2 × 2) = 2⁵, so you add the indices.</p>',
     example:{q:'Evaluate 2³ × 3² and 5³ ÷ 5.',steps:[{do:'2³ = 8 and 3² = 9.',why:'Powers come before multiplication.'},{do:'2³ × 3² = 8 × 9 = 72.'},{do:'5³ ÷ 5 = 125 ÷ 5 = 25.'}]},
     mistake:'Multiplying the bases and adding the indices when the bases are different: 2³ × 3² is NOT 6⁵.',
     check:{q:'Evaluate 2⁴ × 5.',o:['80','40','100'],a:0,why:'2⁴ = 16, and 16 × 5 = 80.',hint:'Work out 2⁴ first.'}},
    {title:'Standard form and rounding',explain:'<p>{{Standard form|A × 10ⁿ with 1 ≤ A < 10}} writes a large number as <strong>A × 10ⁿ</strong>, where A is at least 1 but less than 10. For example, 4,700 = 4.7 × 10³ and 384,000 = 3.84 × 10⁵.</p><p>To round to {{decimal places|digits after the decimal point}}, count digits after the point. To round to {{significant figures|digits counted from the first non-zero digit}}, count from the first non-zero digit, and keep the number the right size with zeros. In both, look at the next digit: 5 or more rounds up.</p>',
     example:{q:'Write 384,000 in standard form. Round 3,847 to 2 significant figures and 6.387 to 2 decimal places.',steps:[{do:'384,000: put the point after the first digit: 3.84. The point moved 5 places, so 3.84 × 10⁵.'},{do:'3,847 to 2 s.f.: the first two digits are 3 and 8; the next digit is 4, so keep 38 and fill with zeros: 3,800.',why:'Zeros keep the number the right size.'},{do:'6.387 to 2 d.p.: 6.38|7. The next digit is 7, so round up: 6.39.'}]},
     mistake:'Writing 38.4 × 10⁴ for standard form. The first number must be between 1 and 10: 3.84 × 10⁵.',
     check:{q:'Write 52,000 in standard form.',o:['52 × 10³','5.2 × 10⁴','5.2 × 10³'],a:1,why:'5.2 is between 1 and 10, and the point moved 4 places.',hint:'Put the point after the first digit.'}}]}]},
  {phase:'explain',name:'Teach: number bases',title:'Learn: place value and calculating in other bases',lead:'Next, number systems that count in groups other than ten.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Base five count inna group a five.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Place value in any base',explain:'<p>Base 10 groups in tens: the places are worth 1, 10, 100, 1,000, … In {{base n|a number system that groups in n}}, the places are worth <strong>1, n, n², n³, …</strong></p><p>Base 5 places are worth 1, 5, 25, 125, …, and the only digits are 0, 1, 2, 3 and 4. A digit can never be as big as the base.</p><p>A small number after a numeral shows its base: 243₅ means "2, 4, 3 in base 5".</p>',visual:PVB(5,['2','4','3']),
     example:{q:'In 243₅, what is the place value of the 2, and what is the 2 worth?',steps:[{do:'The places, from the right, are worth 1, 5 and 25.'},{do:'The 2 is in the 25s place (5²).'},{do:'So it is worth 2 × 25 = 50.'}]},
     mistake:'Using 10s and 100s for every base. In base 5, the second place is worth 5, not 10.',
     check:{q:'In base 4, the places are worth…',o:['1, 4, 16, 64','1, 10, 100, 1,000','1, 4, 8, 12'],a:0,why:'Powers of 4: 4⁰, 4¹, 4², 4³.',hint:'Powers of the base.'}},
    {title:'Converting between base n and base 10',explain:'<p><strong>Base n → base 10:</strong> multiply each digit by its place value and add.</p><p><strong>Base 10 → base n:</strong> divide by n again and again, writing down the remainders. Then read the remainders from the <strong>bottom up</strong>.</p>',
     example:{q:'Change 243₅ to base 10, and change 45 to base 2.',steps:[{do:'243₅ = 2 × 25 + 4 × 5 + 3 × 1 = 50 + 20 + 3 = 73.'},{do:'45 ÷ 2 = 22 r 1; 22 ÷ 2 = 11 r 0; 11 ÷ 2 = 5 r 1; 5 ÷ 2 = 2 r 1; 2 ÷ 2 = 1 r 0; 1 ÷ 2 = 0 r 1.',why:'Each division finds how many groups of 2 are left over.'},{do:'Read the remainders from the bottom up: 101101₂.'},{do:'Check: 32 + 8 + 4 + 1 = 45 ✓'}]},
     mistake:'Reading the remainders from the top down. That gives the digits in reverse order.',
     check:{q:'What is 32₄ in base 10?',o:['14','32','11'],a:0,why:'3 × 4 + 2 × 1 = 14.',hint:'The places are worth 4 and 1.'}},
    {title:'Adding, subtracting and multiplying in base n',explain:'<p>Calculate column by column, just like base 10, but <strong>carry and borrow in groups of n</strong>, not 10.</p><p>In base 5, if a column adds up to 5 or more, write the remainder after taking out 5s, and carry the number of 5s to the next column.</p>',
     example:{q:'Work out 34₅ + 23₅.',steps:[{do:'Ones column: 4 + 3 = 7. In base 5, 7 = one 5 and 2 left over. Write 2, carry 1.',why:'We carry when we make a group of 5, not 10.'},{do:'Fives column: 3 + 2 + 1 (carried) = 6 = one 25 and 1 left over. Write 1, carry 1.'},{do:'Answer: 112₅.'},{do:'Check in base 10: 34₅ = 19, 23₅ = 13, 19 + 13 = 32, and 112₅ = 25 + 5 + 2 = 32 ✓'}]},
     mistake:'Carrying only when a column reaches 10. In base 5 you carry as soon as a column reaches 5.',
     check:{q:'What is 12₃ + 1₃?',o:['13₃','20₃','21₃'],a:1,why:'2 + 1 = 3, which is one group of 3: write 0, carry 1. Then 1 + 1 = 2. Answer 20₃.',hint:'In base 3 there is no digit 3.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'Powers',text:'aᵐ = a × a × … (m times). a¹ = a; a⁰ = 1. Work out each power first: 2³ × 3² = 8 × 9 = 72.'},{title:'Standard form',text:'A × 10ⁿ with 1 ≤ A < 10. For example, 4,700 = 4.7 × 10³ and 384,000 = 3.84 × 10⁵.'},{title:'Converting bases',text:'Base n → 10: multiply each digit by its place value and add. Base 10 → n: divide by n repeatedly and read the remainders from the bottom up.'},{title:'Calculating in base n',text:'Work column by column and carry or borrow groups of n. For example, in base 5, 4 + 3 = 12₅ (write 2, carry 1).'}]},
    {type:'guided',star:true,items:[

   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Can it be base 5?',desc:'Decide which numbers could be written in base 5.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Base 5 only uses the digits 0, 1, 2, 3 and 4.',bins:[{id:'y',label:'Could be base 5'},{id:'n',label:'Cannot be base 5'}],items:[{label:'243',bin:'y'},{label:'305',bin:'n'},{label:'1,000',bin:'y'},{label:'47',bin:'n'},{label:'4,444',bin:'y'},{label:'125',bin:'n'},{label:'31',bin:'y'},{label:'59',bin:'n'}]}},

    {icon:'📏',title:'Order the powers',desc:'Work out each power, then put them in order.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Tap from smallest to largest.',rounds:[[{label:'2¹⁰',v:1024,show:'1,024'},{label:'3⁶',v:729,show:'729'},{label:'10³',v:1000,show:'1,000'},{label:'5⁴',v:625,show:'625'}],[{label:'2.5 × 10⁴',v:25000,show:'25,000'},{label:'9.9 × 10³',v:9900,show:'9,900'},{label:'1.2 × 10⁵',v:120000,show:'120,000'},{label:'3 × 10⁴',v:30000,show:'30,000'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Any non-zero number to the power 0 equals 1.',a:'always',why:'a⁰ = 1 for every non-zero a.'},{s:'aᵐ is bigger than a.',a:'sometimes',why:'2³ = 8 is bigger than 2, but 1⁵ = 1 is not, and a¹ = a.',hint:'Try a = 1, or m = 1.'},{s:'A number in base 6 can contain the digit 6.',a:'never',why:'Base 6 uses only 0 to 5.'},{s:'The same number looks longer in base 2 than in base 10.',a:'sometimes',why:'Usually, because base 2 groups in twos; but 0 and 1 look the same in both.',hint:'Try the number 1.'},{s:'In standard form, the first number is between 1 and 10 (including 1 but not 10).',a:'always',why:'That is the rule for standard form.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jason',q:'Evaluate 2³ + 4⁰.',lines:['2³ = 6','4⁰ = 1','Answer: 6 + 1 = 7'],wrong:0,reasons:['2³ means 2 × 2 × 2 = 8, not 2 × 3','He should add the indices','4⁰ should be 0'],reason:0,fix:'2³ = 8 and 4⁰ = 1, so the answer is 9.'},{who:'Alicia',q:'Change 13 to base 2.',lines:['13 ÷ 2 = 6 r 1; 6 ÷ 2 = 3 r 0; 3 ÷ 2 = 1 r 1; 1 ÷ 2 = 0 r 1','Read from the top: 1011₂'],wrong:1,reasons:['The remainders must be read from the bottom up','She should divide by 10','She should add the remainders'],reason:0,fix:'Read from the bottom up: 1101₂ (8 + 4 + 1 = 13).'},{who:'Damian',q:'Work out 4₅ + 3₅.',lines:['4 + 3 = 7','Answer: 7₅'],wrong:1,reasons:['There is no digit 7 in base 5: 7 = 1 five and 2, so 12₅','The answer should be 1₅','He should multiply'],reason:0,fix:'12₅.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire powers and bases.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(2,6),m=R(0,4),v=Math.pow(a,m);return{q:a+' to the power '+m+' = ?',o:[String(v),String(a*m),String(v+a)],a:0,why:m===0?'Anything (except 0) to the power 0 is 1.':a+' used '+m+' times.'}}if(r===1){var b=[2,3,4,5,8][R(0,4)],n=R(b,b*b*2-1),d=n.toString(b);return{q:d+' in base '+b+' = ? in base 10',o:[String(n),d,String(n+1)],a:0,why:'Multiply each digit by its place value.'}}var A=R(11,99)/10,e=R(3,6),num=Math.round(A*Math.pow(10,e));return{q:'Write '+num.toLocaleString('en-JM')+' in standard form.',o:[A+' × 10^'+e,(Math.round(A*100)/10)+' × 10^'+(e-1),A+' × 10^'+(e+1)],a:0,why:'Point after the first digit; it moved '+e+' places.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent numbers that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a power (like 2^5) whose value is between 100 and 200.',placeholder:'a^m',check:function(v){var m=String(v).replace(/\s/g,'').match(/^(\d+)\^(\d+)$/);if(!m)return{ok:false,msg:'Type it like 2^5.'};var x=Math.pow(+m[1],+m[2]);return x>100&&x<200?{ok:true,msg:'Yes! '+m[1]+'^'+m[2]+' = '+x+'.'}:{ok:false,msg:m[1]+'^'+m[2]+' = '+x+'. Try again.'}}},{q:'Type the number 20 written in base 3.',placeholder:'digits',check:function(v){return String(v).trim()==='202'?{ok:true,msg:'Correct! 2 × 9 + 0 × 3 + 2 = 20.'}:{ok:false,msg:'Divide 20 by 3 repeatedly and read the remainders from the bottom up.'}}},{q:'Type a number that rounds to 5,000 when rounded to 1 significant figure, but to 5,400 when rounded to 2 significant figures.',placeholder:'e.g. …',check:function(v){var x=+String(v).replace(/,/g,'');var s1=+x.toPrecision(1),s2=+x.toPrecision(2);return s1===5000&&s2===5400?{ok:true,msg:'Yes! '+x+' rounds to 5,000 (1 s.f.) and 5,400 (2 s.f.).'}:{ok:false,msg:'That rounds to '+s1+' and '+s2+'. Try a number from 5,350 to 5,449.'}}}]}},
    {icon:'🦠',title:'Mission: stopping the spread',desc:'Help a school nurse plan how to slow a flu outbreak.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'A school nurse in Spanish Town is tracking a flu outbreak. Each sick student passes it to 3 others at each step, unless the school acts.',parts:[{q:'How many NEW students catch it at step 4? (Write it as 3⁴ and work it out.)',a:81,hint:'3 × 3 × 3 × 3.',sol:'3⁴ = 81.'},{q:'If hand-washing stations cut it to 2 new people per sick person, how many new cases at step 4?',a:16,hint:'2⁴.',sol:'2⁴ = 16.'},{q:'How many FEWER new cases at step 4 does hand-washing give?',a:65,hint:'81 − 16.',sol:'65 fewer.'},{q:'A flu virus is about 0.0000001 m across. The school has 1,800 students. Write 1,800 in standard form, and type just the power of 10.',a:3,hint:'1,800 = 1.8 × 10^?',sol:'1.8 × 10³, so the power is 3.'},{q:'The nurse records the number of sick students, 13, in binary for a computer project. What is 13 in base 2?',a:['1101'],hint:'13 = 8 + 4 + 1.',sol:'1101₂.'}],done:'You used powers, standard form and binary to understand and slow down a real outbreak.'}}
