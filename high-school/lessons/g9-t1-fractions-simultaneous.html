b.textContent='The '+p.n1+' price is right! Now use List 2: '+p.a2+' × $'+p.v1+' + '+p.b2+' '+p.n2+(p.b2>1?'s':'')+' = $'+p.t2+'.'}else{fb.className='fb no spFb';fb.textContent=shown?'Look at the leftover row: it shows the price of the '+p.n1+'s on their own.':'Press the button to take List 2 away from List 1 first.'}};load()}},

  {phase:'explain',name:'Teach: algebraic fractions',title:'Learn: working with algebraic fractions',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Same rule dem as normal fraction.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Adding and subtracting algebraic fractions',explain:'<p>An {{algebraic fraction|a fraction with letters in it, such as x/3}} is simply a fraction with letters in it, like x/3 or 5/y. Here is the good news: they follow exactly the same rules as ordinary fractions. If you can add 1/3 + 1/4, you can add x/3 + x/4.</p><p>Think about what you do with ordinary fractions. You cannot add thirds and quarters straight away, because they are different-sized pieces. First, you change both fractions into pieces of the same size, using a {{common denominator|a shared bottom number}}. For 3 and 4, twelfths work.</p><p>So x/3 = 4x/12 (multiply the top and bottom by 4), and x/4 = 3x/12 (multiply the top and bottom by 3). Now the pieces match, and you just add the tops: 4x/12 + 3x/12 = <strong>7x/12</strong>. Subtracting works the same way: x/3 − x/4 = 4x/12 − 3x/12 = x/12.</p>',
     example:{q:'Simplify 2x/5 + x/3.',steps:[{do:'A common denominator for 5 and 3 is 15.'},{do:'2x/5 = 6x/15 and x/3 = 5x/15.',why:'Multiply the top and bottom of each fraction by the same number.'},{do:'Add the tops: 6x/15 + 5x/15 = 11x/15.'}]},
     mistake:'Adding the denominators: x/3 + x/4 is NOT 2x/7. You need a common denominator first, then you add only the tops.',
     check:{q:'Simplify x/2 + x/5.',o:['2x/7','7x/10','x/10'],a:1,why:'5x/10 + 2x/10 = 7x/10.',hint:'Use 10 as the common denominator.'}},
    {title:'Multiplying algebraic fractions',explain:'<p>Multiplying fractions is actually easier than adding them, because you do not need a common denominator. Just multiply the tops together and the bottoms together.</p><p>For example, (x/3) × (6/y) = 6x/(3y). Then simplify by cancelling any common factors, just as you would with 6/3: here 6 and 3 share a factor of 3, so 6x/(3y) = <strong>2x/y</strong>.</p><p>A smart habit is to cancel <em>before</em> you multiply, so the numbers stay small. Look for a number or letter on the top of one fraction that shares a factor with the bottom of either fraction. For (2a/5) × (10/a), the a on top cancels the a below, and 10 and 5 share a 5, leaving 2 × 2 = 4.</p>',
     example:{q:'Simplify (3x/4) × (8/x²).',steps:[{do:'Multiply the tops and bottoms: 24x/(4x²).'},{do:'24 ÷ 4 = 6.'},{do:'x/x² = 1/x, so the answer is 6/x.',why:'One x on top cancels one of the two x’s underneath.'}]},
     mistake:'Cancelling terms that are added, not multiplied. In (x + 2)/x you cannot cancel the x’s, because the x on top is part of a sum.',
     check:{q:'Simplify (x/5) × (10/y).',o:['2x/y','10x/5y','x/2y'],a:0,why:'10x/(5y) = 2x/y.',hint:'Multiply, then cancel the 10 and 5.'}},
    {title:'Dividing algebraic fractions',explain:'<p>How many halves are in 3? Six! So 3 ÷ ½ = 6, which is the same as 3 × 2. Dividing by a fraction is the same as multiplying by its upside-down version, its {{reciprocal|a fraction turned upside down}}.</p><p>So to divide algebraic fractions: <strong>keep</strong> the first fraction, <strong>flip</strong> the second one, and change ÷ to ×. Then multiply and simplify as before.</p><p>For example, (x/4) ÷ (x/8) = (x/4) × (8/x) = 8x/(4x) = <strong>2</strong>. Does that make sense? x/8 is half the size of x/4, so x/8 fits into x/4 exactly twice.</p>',
     example:{q:'Simplify (2a/3) ÷ (4/9).',steps:[{do:'Keep, flip, multiply: (2a/3) × (9/4).',why:'Dividing by 4/9 is the same as multiplying by 9/4.'},{do:'Multiply: 18a/12.'},{do:'Simplify: 18a/12 = 3a/2.'}]},
     mistake:'Flipping the first fraction instead of the second. Only the fraction you are dividing BY gets turned upside down.',
     check:{q:'Simplify (x/2) ÷ (x/6).',o:['3','x²/12','1/3'],a:0,why:'(x/2) × (6/x) = 6x/(2x) = 3.',hint:'Keep, flip, multiply.'}}]}]},
  {phase:'explain',name:'Teach: simultaneous equations',title:'Learn: solving simultaneous equations',lead:'Next, the method behind the canteen puzzle: solving two equations at the same time.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Two equation, two unknown, one answer weh fit both.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What simultaneous equations are',explain:'<p>One equation with two unknowns, like p + d = 450, has lots of possible answers. The patty could be $250 and the drink $200, or the patty $300 and the drink $150, and so on. One clue is not enough.</p><p>But give a second clue, like 2p + d = 700, and now only one pair of prices fits <em>both</em> clues at the same time. Two equations that must be true at the same time are called {{simultaneous equations|two equations that are true at the same time, for the same values}}. "Simultaneous" just means "at the same time".</p><p>Solving them means finding the values that work in both equations. There are two main methods: elimination and substitution. And there is one golden rule for both: when you have your answer, <strong>check it in both equations</strong>.</p>',
     example:{q:'Do p = 250 and d = 200 solve p + d = 450 and 2p + d = 700?',steps:[{do:'First equation: 250 + 200 = 450 ✓'},{do:'Second equation: 2 × 250 + 200 = 500 + 200 = 700 ✓'},{do:'Both are true, so p = 250, d = 200 is the solution.'}]},
     mistake:'Checking only one equation. A pair of values can fit one equation but not the other.',
     check:{q:'Which pair solves x + y = 10 and x − y = 4?',o:['x = 6, y = 4','x = 7, y = 3','x = 5, y = 5'],a:1,why:'7 + 3 = 10 and 7 − 3 = 4.',hint:'Test each pair in BOTH equations.'}},
    {title:'The elimination method',explain:'<p>In the shopping-list explorer, you took one list away from the other, and the drinks disappeared, leaving only patties. That is exactly the {{elimination|removing one letter by adding or subtracting the equations}} method: you get rid of one letter by adding or subtracting the equations.</p><p>It works when one letter has the same {{coefficient|the number in front of a letter}} in both equations. If the signs are the same, <strong>subtract</strong> the equations. If the signs are opposite (like +y and −y), <strong>add</strong> them, because +y and −y cancel to zero.</p><p>Once one letter is gone, solve for the other. Then put that value back into either equation to find the letter you removed.</p>',visual:BARS({n1:'patty',n2:'drink',a1:2,b1:1,t1:700,a2:1,b2:1,t2:450},true),
     example:{q:'Solve x + y = 10 and x − y = 4.',steps:[{do:'The y’s have opposite signs, so ADD the equations: (x + y) + (x − y) = 10 + 4.',why:'+y and −y cancel out.'},{do:'2x = 14, so x = 7.'},{do:'Put x = 7 into x + y = 10: 7 + y = 10, so y = 3.'},{do:'Check in x − y = 4: 7 − 3 = 4 ✓'}]},
     mistake:'Subtracting only some of the terms. When you subtract one equation from another, subtract EVERY term, including the numbers on the right-hand side.',
     check:{q:'Solve 2a + b = 11 and a + b = 7. What is a?',o:['4','3','9'],a:0,why:'Subtract: a = 11 − 7 = 4.',hint:'The b’s are the same, so subtract.'}},
    {title:'The substitution method',explain:'<p>Sometimes one equation already tells you exactly what one letter equals, like y = 2x. Then there is a quicker way. {{Substitution|replacing a letter with an equal expression}} means swapping a letter for something it is equal to.</p><p>If y = 2x, then wherever you see y in the other equation, you can write 2x instead. Now that equation has only x in it, and you can solve it like any normal equation.</p><p>For example, with y = 2x and x + y = 15: replace y with 2x to get x + 2x = 15. So 3x = 15, and x = 5. Then y = 2 × 5 = 10.</p><p>Choose substitution when one letter is already on its own. Choose elimination when the coefficients of a letter match.</p>',
     example:{q:'Solve y = x + 3 and 2x + y = 18.',steps:[{do:'Replace y with (x + 3) in the second equation: 2x + (x + 3) = 18.',why:'y and x + 3 are equal, so we can swap them.'},{do:'3x + 3 = 18, so 3x = 15 and x = 5.'},{do:'y = 5 + 3 = 8.'},{do:'Check: 2 × 5 + 8 = 18 ✓'}]},
     mistake:'Finding x and stopping. Simultaneous equations have TWO answers: always find the second letter as well.',
     check:{q:'Solve y = 3x and x + y = 12. What is x?',o:['3','4','9'],a:0,why:'x + 3x = 12, so 4x = 12 and x = 3.',hint:'Swap y for 3x.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'Adding and subtracting',text:'Find a common denominator, then add or subtract the tops. x/3 + x/4 = 4x/12 + 3x/12 = 7x/12.'},{title:'Multiplying and dividing',text:'Multiply tops and bottoms, then cancel. To divide: keep, flip, multiply. (x/4) ÷ (x/8) = (x/4) × (8/x) = 2.'},{title:'Elimination',text:'Make one letter’s coefficients match. Same signs: subtract. Opposite signs: add. Solve, then substitute back.'},{title:'Substitution',text:'If one letter is on its own (y = 2x), swap it into the other equation, solve, then find the second letter. Always check in both equations.'}]},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire fractions and simultaneous equations.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,1);if(r===0){var d=R(3,9),a=R(1,4),b=R(1,4);return{q:'Simplify '+a+'x/'+d+' + '+b+'x/'+d+'.',o:[(a+b)+'x/'+d,(a+b)+'x/'+(2*d),(a*b)+'x/'+d],a:0,why:'Same denominator: add the tops.'}}var x=R(1,9),y=R(1,9),s=x+y,t=x-y;return{q:'x + y = '+s+' and x − y = '+(t<0?'−'+(-t):t)+'. What is x?',o:[String(x),String(y===x?x+1:y),String(s)],a:0,why:'Add the equations: 2x = '+(s+t)+'.'}}}},

    {icon:'🥤',title:'Mission: the canteen price list',desc:'Help the canteen manager work out her prices.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Miss Daley, the canteen manager at a Portmore high school, lost her price list. She only remembers some orders from today.',parts:[{q:'2 patties + 1 drink cost $700, and 1 patty + 1 drink cost $450. How much is one patty?',a:250,hint:'Subtract the second order from the first.',sol:'$700 − $450 = $250.',placeholder:'dollars'},{q:'How much is one drink?',a:200,hint:'1 patty + 1 drink = $450.',sol:'$450 − $250 = $200.',placeholder:'dollars'},{q:'3 coco breads + 1 cheese cost $460, and 1 coco bread + 1 cheese cost $240. How much is one coco bread?',a:110,hint:'Subtract: 2 coco breads = $220.',sol:'$220 ÷ 2 = $110.',placeholder:'dollars'},{q:'A slice of bun costs twice as much as a fruit cup: b = 2f. Together they cost $300: b + f = 300. How much is the bun?',a:200,hint:'Substitute: 2f + f = 300.',sol:'f = 100, so b = $200.',placeholder:'dollars'},{q:'Miss Daley sells drinks in 1/4 litre cups. How many cups are in 3/2 litres? (Work out (3/2) ÷ (1/4).)',a:6,hint:'Keep, flip, multiply: 3/2 × 4.',sol:'3/2 × 4 = 6 cups.'}],done:'You used elimination, substitution and fraction division to rebuild a real price list.'}}
