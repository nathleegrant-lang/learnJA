     init:function(box,api){var g=function(id){return+box.querySelector(id).value/(id.indexOf('M')>0?2:1)};['#leM','#leC'].forEach(function(id){api.nudges(box.querySelector(id))});function draw(){var m=g('#leM'),c=g('#leC'),two=box.querySelector('#le2').checked,m2=g('#leM2'),c2=g('#leC2'),L=[{m:m,c:c}],pt=null,txt;if(two)L.push({m:m2,c:c2});box.querySelector('.leMO').textContent=fm8(m);box.querySelector('.leCO').textContent=fm8(c);txt='<strong>'+EQ(m,c)+'</strong>: gradient '+fm8(m)+' ('+(m>0?'goes UP from left to right':m<0?'goes DOWN from left to right':'flat')+'), crosses the y-axis at (0, '+fm8(c)+').<br>Table: '+[-2,-1,0,1,2].map(function(x){return'('+fm8(x)+', '+fm8(m*x+c)+')'}).join(', ');if(two){txt+='<br><strong>'+EQ(m2,c2)+'</strong>. ';if(m===m2)txt+=(c===c2?'The lines are the SAME line.':'Same gradient: the lines are <strong>parallel</strong> and never meet.');else{var x=(c2-c)/(m-m2),y=m*x+c;pt=[x,y];txt+='The lines cross at <strong>('+fm8(x)+', '+fm8(y)+')</strong>. This point satisfies both equations.'}}box.querySelector('.leSvg').innerHTML=LG(L,{tri:!two,pt:pt&&Math.abs(pt[0])<=6&&Math.abs(pt[1])<=6?pt:null,label:'Graph of '+L.map(function(l){return EQ(l.m,l.c)}).join(' and ')});box.querySelector('.leX').innerHTML=txt}['#leM','#leC','#leM2','#leC2','#le2'].forEach(function(id){box.querySelector(id).addEventListener('input',draw);box.querySelector(id).addEventListener('change',draw)});var T=[{t:'What is the y-intercept of y = 3x − 2?',ok:function(v){return parseFloat(v.replace(/−/g,'-'))===-2}},{t:'A line goes through (0, 1) and (2, 5). What is its gradient?',ok:function(v){return parseFloat(v)===2}},{t:'Where do y = x + 1 and y = −x + 3 cross? (Type (x, y).)',ok:function(v){var m=v.replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?[\d.]+),(-?[\d.]+)\)?$/);return m&&+m[1]===1&&+m[2]===2}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.leN').textContent='All done';box.querySelector('.leQ').textContent='You completed every challenge!';box.querySelector('.leC').disabled=true;return}box.querySelector('.leN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.leQ').textContent=T[q].t}box.querySelector('.leC').onclick=function(){var v=String(box.querySelector('.leA').value).trim(),fb=box.querySelector('.leFb');if(T[q].ok(v)){fb.className='fb ok leFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.leA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no leFb';fb.textContent='Not yet. Set up the explorer to match the question.'}};draw();task()}},
    {type:'recall',text:'The taxis cost the same at 4 km: Taxi A = 200 + 50 × 4 = $400 and Taxi B = 100 × 4 = $400. On a graph, that is where the two lines cross.'}]},
  {phase:'explain',name:'Teach: plotting and gradient',title:'Learn: plotting lines, gradient and intercept',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Rise ovah run. Up fi every one across.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'From a mapping to a graph',explain:'<p>In Grade 7 you met mappings like “double it and add 1”. Each input and output makes an ordered pair, and every ordered pair is a point you can plot. When you plot the points of a rule like y = 2x + 1, something lovely happens: they all line up in a straight line!</p><p>To draw the graph, make a {{table of values|a table of x-values and their y-values}}. Choose a few x-values, such as −2, −1, 0, 1 and 2, and work out y for each. For y = 2x + 1: x = −2 gives y = −3; x = 0 gives y = 1; x = 2 gives y = 5.</p><p>Plot each pair (x, y), then join the points with a ruler, extending the line past the end points. If one point is not in line with the others, check your working: you have probably made a calculation slip.</p>',visual:LG([{m:2,c:1}],{dots:[[-2,-3],[-1,-1],[0,1],[1,3],[2,5]],label:'Graph of y = 2x + 1 with plotted points'}),
     example:{q:'Make a table of values for y = −x + 3 for x = −1, 0, 1, 2 and 3.',steps:[{do:'x = −1: y = 1 + 3 = 4. x = 0: y = 3.'},{do:'x = 1: y = 2. x = 2: y = 1. x = 3: y = 0.'},{do:'Points: (−1, 4), (0, 3), (1, 2), (2, 1), (3, 0). Plot them and join with a ruler.'}]},
     mistake:'Joining the points with a wobbly freehand line, or stopping at the end points. Use a ruler and extend the line.',
     check:{q:'For y = 3x − 1, what is y when x = 2?',o:['5','7','6'],a:0,why:'3 × 2 − 1 = 5.',hint:'Substitute x = 2.'}},
    {title:'Gradient: how steep is the line?',explain:'<p>Some lines are steep, like a hill road up to Mavis Bank; others are gentle, like a road across the plains of St. Catherine. The {{gradient|how steep a line is: rise divided by run}} measures how steep a line is.</p><p>Pick two points on the line. The {{rise|how far the line goes up}} is how far it goes up between them, and the {{run|how far the line goes across}} is how far it goes across. Then:</p><p><strong>gradient = rise ÷ run</strong></p><p>If the line goes <strong>up</strong> from left to right, the gradient is <strong>positive</strong>. If it goes <strong>down</strong>, the gradient is <strong>negative</strong>. A flat line has a gradient of 0. The bigger the number (ignoring the sign), the steeper the line.</p><p>Gradient is also a {{rate of change|how fast one quantity changes compared with another}}. For Taxi A, every extra km adds $50 to the fare, so the gradient of its graph is 50: fifty dollars per kilometre.</p>',visual:LG([{m:2,c:1}],{tri:true,label:'Graph of y = 2x + 1 showing a rise of 2 for a run of 1'}),
     example:{q:'Find the gradient of the line through (1, 2) and (4, 8).',steps:[{do:'Rise: from y = 2 to y = 8, so 8 − 2 = 6.'},{do:'Run: from x = 1 to x = 4, so 4 − 1 = 3.'},{do:'Gradient = 6 ÷ 3 = 2.'}]},
     mistake:'Dividing run by rise. Gradient is rise ÷ run: "up over across".',
     check:{q:'A line goes through (0, 5) and (2, 1). What is its gradient?',o:['−2','2','−0.5'],a:0,why:'Rise = 1 − 5 = −4, run = 2; −4 ÷ 2 = −2.',hint:'It goes down, so the gradient is negative.'}},
    {title:'The y-intercept, and drawing with m and c',explain:'<p>The {{y-intercept|where a line crosses the y-axis}} is where a line crosses the y-axis. It is the value of y when x = 0.</p><p>Here is the big idea of this lesson. Every straight line (except vertical ones) can be written as <strong>{{y = mx + c|the equation of a line with gradient m and intercept c}}</strong>, where <strong>m is the gradient</strong> and <strong>c is the y-intercept</strong>. You saw this in the explorer: m changed the steepness, and c slid the line up and down.</p><p>So you can draw a line without a table! For y = 2x − 3: start at the intercept, (0, −3). The gradient 2 means “up 2 for every 1 across”, so from (0, −3) go 1 right and 2 up to (1, −1), then again to (2, 1). Join the points with a ruler.</p>',
     example:{q:'Give the gradient and y-intercept of y = −3x + 4, and describe how to draw it.',steps:[{do:'m = −3 and c = 4.'},{do:'Start at (0, 4) on the y-axis.'},{do:'Gradient −3: for every 1 across, go 3 DOWN: (1, 1), (2, −2). Join with a ruler.'}]},
     mistake:'Reading the intercept from the x-axis. The y-intercept is where the line crosses the y-AXIS (where x = 0).',
     check:{q:'What is the gradient of y = 5x − 2?',o:['5','−2','3'],a:0,why:'In y = mx + c, m is the number multiplying x.',hint:'The number in front of x.'}}]}]},
  {phase:'explain',name:'Teach: equations, intersections and regions',title:'Learn: equations of lines, intersections and inequality regions',lead:'Next, working backwards from a line to its equation, finding where lines meet, and shading regions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Where di two line cross, dat point work fi both.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Finding the equation of a line',explain:'<p>If you can see a line, you can find its equation. You need just two things: the gradient m and the y-intercept c.</p><p><strong>From a graph:</strong> read c from where the line crosses the y-axis. Then pick two clear points and work out rise ÷ run for m. Write y = mx + c.</p><p><strong>From two points:</strong> first find the gradient, rise ÷ run. Then put one of the points into y = mx + c and solve for c. For example, through (1, 5) and (3, 9): m = (9 − 5) ÷ (3 − 1) = 2. Using (1, 5): 5 = 2 × 1 + c, so c = 3. The equation is y = 2x + 3.</p><p>Always check with the other point: 2 × 3 + 3 = 9 ✓.</p>',
     example:{q:'Find the equation of the line through (2, 1) and (4, −3).',steps:[{do:'Gradient: rise = −3 − 1 = −4; run = 4 − 2 = 2; m = −2.'},{do:'Use (2, 1): 1 = −2 × 2 + c, so 1 = −4 + c, and c = 5.'},{do:'Equation: y = −2x + 5. Check (4, −3): −8 + 5 = −3 ✓'}]},
     mistake:'Finding m and forgetting c. You need BOTH to write the equation.',
     check:{q:'A line has gradient 3 and passes through (0, −1). What is its equation?',o:['y = 3x − 1','y = −x + 3','y = 3x + 1'],a:0,why:'m = 3 and c = −1.',hint:'(0, −1) is the y-intercept.'}},
    {title:'Two lines and their point of intersection',explain:'<p>Back to the taxis. Taxi A’s fare is y = 50x + 200, and Taxi B’s fare is y = 100x. If you draw both lines on the same axes, they cross at one point: the {{point of intersection|where two lines cross; it satisfies both equations}}.</p><p>That point is special because it lies on <strong>both</strong> lines, so its coordinates make both equations true at the same time. For the taxis, the lines cross at (4, 400): at 4 km, both fares are $400. For shorter trips Taxi B is cheaper; for longer trips Taxi A is cheaper.</p><p>This is exactly the solution of the simultaneous equations y = 50x + 200 and y = 100x. A graph lets you see it!</p><p>Not every pair of lines meets. If two lines have the same gradient, they are {{parallel|having the same gradient and never meeting}} and never cross, so their equations have no common solution.</p>',visual:LG([{m:1,c:1},{m:-1,c:3}],{pt:[1,2],label:'Graphs of y = x + 1 and y = −x + 3 crossing at (1, 2)'}),
     example:{q:'Where do y = x + 1 and y = −x + 3 cross?',steps:[{do:'At the crossing point, both y-values are equal: x + 1 = −x + 3.'},{do:'Add x to both sides: 2x + 1 = 3, so 2x = 2 and x = 1.'},{do:'y = 1 + 1 = 2. The lines cross at (1, 2).'}]},
     mistake:'Thinking every two lines must cross. Lines with the same gradient are parallel and never meet.',
     check:{q:'Do y = 2x + 1 and y = 2x − 4 cross?',o:['No, they are parallel','Yes, at (0, 1)','Yes, at (1, 2)'],a:0,why:'They have the same gradient, 2.',hint:'Compare the gradients.'}},
    {title:'Linear inequalities as regions',explain:'<p>An equation like y = x + 1 is a line. An inequality like y > x + 1 is a whole <strong>{{region|the part of the graph where an inequality is true}}</strong> of the graph: every point where y is bigger than x + 1.</p><p>To graph it: first draw the boundary line y = x + 1. Use a <strong>broken (dashed) line</strong> for &lt; or &gt;, because points on the line are not included. Use a <strong>solid line</strong> for ≤ or ≥, because they are included. This matches the open and filled circles you used on number lines.</p><p>Then decide which side to shade. Test a point that is not on the line, such as the origin (0, 0). For y > x + 1: is 0 > 0 + 1? No, so the origin is NOT in the region. Shade the other side, above the line.</p>',visual:LG([{m:1,c:1,dash:true}],{shade:{m:1,c:1,above:true},label:'The region y greater than x + 1 shaded above a broken line'}),
     example:{q:'Describe the graph of y ≤ 2x − 1.',steps:[{do:'Boundary: y = 2x − 1, drawn SOLID because of ≤.'},{do:'Test (0, 0): is 0 ≤ 2 × 0 − 1 = −1? No.'},{do:'So shade the side that does NOT contain the origin: below the line.'}]},
     mistake:'Using a solid line for < or >. A strict inequality does not include the line, so draw it broken.',
     check:{q:'For y > 3x, the boundary line should be…',o:['broken (dashed)','solid','not drawn'],a:0,why:'> does not include the line itself.',hint:'Like an open circle.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Drawing lines',text:'Table of values: choose x, find y, plot, join with a ruler. Or start at (0, c) and use the gradient: m up for every 1 across.'},{title:'Gradient and intercept',text:'m = rise ÷ run (up is +, down is −). c = where the line crosses the y-axis. Gradient = rate of change.'},{title:'Equations and intersections',text:'Find m, then substitute a point to find c. Where two lines cross satisfies both equations. Same gradient: parallel, no crossing.'},{title:'Inequality regions',text:'Broken line for < or >, solid for ≤ or ≥. Test (0, 0) to decide which side to shade.'}]},
