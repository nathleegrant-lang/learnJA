 curriculum:{framework:'NSC Mathematics, Grade 7',term:'Term 1',unit:'Unit 1: Operations on Real Numbers',strand:'Number',standard:'Use the basic operations, number relationships, patterns, number facts, calculators and software to compute and estimate in order to solve real-world problems involving fractions, percentages, and decimals.',
  objectives:['Describe different types of numbers in the real number system (Natural, Whole, Integer, Rational, Irrational);','Give reasonable estimates of the results of operations on numbers;','By rounding off, approximate a given number to the nearest thousandths, hundredths, tenths, tens, hundreds, thousands, etc.;','Identify, without calculation, whole numbers divisible by 2, 3, 5, 6 and 9 (Divisibility rules).'],

 glossary:[['Natural numbers','The counting numbers 1, 2, 3, …'],['Whole numbers','0, 1, 2, 3, …'],['Integers','Whole numbers and their negatives.'],['Rational numbers','Numbers that can be written as a fraction of two integers.'],['Irrational numbers','Numbers that cannot be written as a fraction, such as π and √2.'],['Place value','The value of a digit because of its position, such as tens or hundredths.'],['Rounding','Replacing a number with a simpler number that is close to it.'],['Estimate','A sensible, quick answer that is close to the exact answer.'],['Divisible','A number is divisible by another if it divides exactly, with no remainder.'],['Digit sum','The total you get by adding all the digits of a number. The digit sum of 2,457 is 2 + 4 + 5 + 7 = 18.'],['Factor','A number that divides exactly into another number.']],
 teacher:{time:'about 80 minutes, or two periods split after the teaching pages',flow:[['Engage','10 min','Mango-sharing puzzle; objectives; prior-knowledge check.','Ask for a show of hands on the prediction.'],['Explore','15 min','Divisibility detective: test numbers and look for patterns.','Ask: "What do all the numbers that divide by 9 have in common?"'],['Explain','30 min','Teaching pages on number families, rounding, estimating and divisibility rules; I do, we do, you do.','Model rounding on a number line.'],['Elaborate','15 min','Challenge Zone and Bronze to Gold problems.','Encourage estimating before every calculation.'],['Evaluate','10 min','Quiz and reflection.','Note students who mix up rounding places.']],
  misconceptions:['Rounding by looking at the wrong digit (the digit itself instead of the one to its right).','Thinking 4.5 rounds down.','Thinking a number divisible by 3 must end in 3.','Thinking a number divisible by 2 and 3 is not automatically divisible by 6.','Treating an estimate as wrong because it is not exact.'],

 steps:[
  {phase:'engage',name:'The mango puzzle',title:'Share the mangoes',lead:'A farmer in St. Mary picked 2,457 mangoes. She wants to share them equally among 9 vendors at Coronation Market, with none left over.',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'This lesson builds on place value and times tables. Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'In 3,482, what is the value of the digit 4?',o:['4','40','400'],a:2,why:'The 4 is in the hundreds place, so it is worth 400.',teach:'Each place is worth 10 times the place to its right: ones, tens, hundreds, thousands. In 3,482 the 2 is ones, 8 is tens, 4 is hundreds and 3 is thousands. So the 4 is worth 400.'},{q:'In 5.36, which digit is in the tenths place?',o:['5','3','6'],a:1,why:'The first digit after the decimal point is tenths: 3.',teach:'After the decimal point, the places are tenths, then hundredths, then thousandths. In 5.36, 3 is in the tenths place and 6 is in the hundredths place.'},{q:'What is 9 × 7?',o:['56','63','72'],a:1,why:'9 × 7 = 63.',teach:'A trick for the 9 times table: 10 × 7 = 70, then take away one 7: 70 − 7 = 63.'},{q:'Which of these is a factor of 12?',o:['5','8','4'],a:2,why:'12 ÷ 4 = 3 exactly, so 4 is a factor of 12.',teach:'A factor divides exactly into a number with nothing left over. The factors of 12 are 1, 2, 3, 4, 6 and 12.'}]}]},
  {phase:'explore',name:'Divisibility detective',title:'Explore: be a divisibility detective',lead:'Type any whole number. The detective board shows the last digit, the digit sum, and whether it divides exactly by 2, 3, 5, 6 and 9. Look for patterns.',

   blocks:[{type:'custom',html:'<div class="controls"><label for="ddN">Number:</label><input type="number" id="ddN" min="1" max="999999" value="2457"><button type="button" class="ddR">🎲 Random number</button></div><div class="tile ddOut"></div><p class="ddCount" style="font-weight:600;color:#4b2a9a"></p>',
     init:function(box,api){var inp=box.querySelector('#ddN'),out=box.querySelector('.ddOut'),tried={};function draw(){var n=Math.floor(Math.abs(+inp.value));if(!n){out.innerHTML='Type a whole number.';return}tried[n]=1;var d=String(n).split('').map(Number),s=d.reduce(function(a,b){return a+b},0),last=d[d.length-1];var row=function(k){var q=Math.floor(n/k),r=n%k;return'<tr><td><strong>÷ '+k+'</strong></td><td>'+n.toLocaleString('en-JM')+' ÷ '+k+' = '+q.toLocaleString('en-JM')+(r?' remainder '+r:'')+'</td><td style="font-weight:700;color:'+(r?'#8f1f2b':'#155c35')+'">'+(r?'✗ No':'✓ Yes')+'</td></tr>'};out.innerHTML='<p style="margin:0 0 6px"><strong>Last digit:</strong> '+last+' | <strong>Digit sum:</strong> '+d.join(' + ')+' = '+s+'</p><table class="rec" style="max-width:none"><thead><tr><th>Test</th><th>Division</th><th>Divisible?</th></tr></thead><tbody>'+[2,3,5,6,9].map(row).join('')+'</tbody></table>';box.querySelector('.ddCount').textContent='Numbers tried: '+Object.keys(tried).length+(Object.keys(tried).length>=5?' ✓ Now answer the questions below.':' (try at least 5)')}inp.addEventListener('input',draw);box.querySelector('.ddR').onclick=function(){inp.value=10+Math.floor(Math.random()*9990);draw()};draw()}},
    {type:'mcq',star:true,title:'What patterns did you notice?',questions:[{q:'Which numbers divided exactly by 5?',o:['Numbers ending in 0 or 5','Numbers with a digit sum of 5','Odd numbers'],a:0,why:'Multiples of 5 always end in 0 or 5.',hint:'Try 35, 40 and 41. Look at the last digit.'},{q:'Which numbers divided exactly by 9?',o:['Numbers ending in 9','Numbers whose digit sum divides by 9','Numbers bigger than 90'],a:1,why:'2,457 has digit sum 18, which divides by 9, so 2,457 divides by 9.',hint:'Try 2457, 819 and 199. Compare their digit sums.'},{q:'Which numbers divided exactly by 2?',o:['Numbers ending in 0, 2, 4, 6 or 8','Numbers whose digit sum is even','Numbers ending in 2 only'],a:0,why:'Even numbers end in 0, 2, 4, 6 or 8.',hint:'Try 34, 50 and 47.'}]},
    {type:'recall',text:'2,457 has a digit sum of 2 + 4 + 5 + 7 = 18, and 18 divides by 9. So yes: the mangoes share out exactly, 273 each!'}]},
  {phase:'explain',name:'Teach: number families and rounding',title:'Learn: number families, rounding and estimating',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The number families',explain:'<p>Numbers belong to families that fit inside each other:</p><p>{{Natural numbers|the counting numbers 1, 2, 3, …}} are the counting numbers: 1, 2, 3, … Add zero and you get the {{whole numbers|0, 1, 2, 3, …}}. Add the negative numbers and you get the {{integers|…, −2, −1, 0, 1, 2, …}}.</p><p>{{Rational numbers|numbers that can be written as one integer over another}} can be written as a fraction: ½, 0.75 and −3 are all rational. {{Irrational numbers|numbers that cannot be written as a fraction, such as π}} cannot be written as a fraction: their decimals go on forever without repeating, like π = 3.14159…</p><p>All of these together are the <strong>real numbers</strong>.</p>',
     example:{q:'Which families does 7 belong to? Which does 0.5 belong to?',steps:[{do:'7 is a counting number, so it is natural.',why:'Natural numbers are the counting numbers.'},{do:'Every natural number is also whole, an integer, rational and real. So 7 belongs to all five of those families.'},{do:'0.5 = ½, a fraction. So it is rational and real, but NOT natural, whole or an integer.',why:'It is not a whole number.'}]},
     mistake:'Thinking 0 is a natural number. Natural numbers start at 1. Zero is the first whole number.',
     check:{q:'Which family does −4 NOT belong to?',o:['Integers','Rational numbers','Whole numbers'],a:2,why:'Whole numbers are 0, 1, 2, … They are never negative.',hint:'Can a whole number be negative?'}},
    {title:'Rounding',explain:'<p>{{Rounding|replacing a number with a simpler number that is close to it}} replaces a number with a simpler one that is close to it. Prices, distances and populations are often rounded.</p><p>To round: <strong>1.</strong> Find the place you are rounding to and underline that digit. <strong>2.</strong> Look at the digit just to its <strong>right</strong>. <strong>3.</strong> If that digit is 5 or more, round <strong>up</strong> (add 1 to the underlined digit). If it is 4 or less, keep the underlined digit the same. <strong>4.</strong> Replace the digits after it with zeros (or drop them, after a decimal point).</p>',visual:K.numberLine(3460,3480,[{v:3473,label:'3,473'}],{h:110,every:5,label:'Number line from 3,460 to 3,480 with 3,473 marked, closer to 3,470'}),
     example:{q:'Round 3,473 to the nearest ten, and 6.248 to the nearest tenth.',steps:[{do:'3,473: the tens digit is 7. The digit to its right is 3.',why:'Always look one place to the right of the place you are rounding to.'},{do:'3 is less than 5, so the 7 stays. Answer: 3,470.',why:'On the number line, 3,473 is closer to 3,470 than to 3,480.'},{do:'6.248: the tenths digit is 2. The digit to its right is 4.'},{do:'4 is less than 5, so the 2 stays. Answer: 6.2.'}]},
     mistake:'Looking at the digit you are rounding instead of the digit to its RIGHT. To round 3,473 to the nearest ten, look at the 3 (ones), not the 7.',
     check:{q:'Round 5,861 to the nearest hundred.',o:['5,800','5,900','5,860'],a:1,why:'The hundreds digit is 8; the next digit is 6, which is 5 or more, so round up to 5,900.',hint:'Look at the tens digit, the one just right of the hundreds.'}},
    {title:'Estimating answers',explain:'<p>An {{estimate|a sensible, quick answer that is close to the exact answer}} is a quick, sensible answer that is close to the exact one. To estimate, <strong>round each number</strong> to something easy, then calculate.</p><p>Estimating helps you check your work. If your exact answer is far from your estimate, you have probably made a mistake.</p>',
     example:{q:'A taxi driver earns $2,976 a day. Estimate how much he earns in 5 days.',steps:[{do:'Round $2,976 to the nearest thousand: $3,000.',why:'$3,000 is easy to multiply.'},{do:'$3,000 × 5 = $15,000.'},{do:'Estimate: about $15,000. (The exact answer is $14,880, which is close.)'}]},
     mistake:'Thinking an estimate is "wrong" because it is not exact. An estimate is meant to be close, not exact.',
     check:{q:'Estimate 398 × 21 by rounding each number first.',o:['About 800','About 8,000','About 80,000'],a:1,why:'398 ≈ 400 and 21 ≈ 20, and 400 × 20 = 8,000.',hint:'Round 398 to 400 and 21 to 20.'}}]}]},
  {phase:'explain',name:'Teach: divisibility rules',title:'Learn: the divisibility rules',lead:'These rules let you check whether a number divides exactly, without doing any division.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Look pon di last digit fi 2 an 5. Add up di digit dem fi 3 an 9.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Rules for 2 and 5: look at the last digit',explain:'<p>A number is {{divisible|it divides exactly, with no remainder}} by another number if it divides exactly, with nothing left over.</p><p><strong>Divisible by 2:</strong> the last digit is 0, 2, 4, 6 or 8 (the number is even).</p><p><strong>Divisible by 5:</strong> the last digit is 0 or 5.</p><p>Why does this work? Every ten divides by 2 and by 5, so only the ones digit can cause a remainder.</p>',
     example:{q:'Is 3,740 divisible by 2? By 5?',steps:[{do:'The last digit is 0.'},{do:'0 is even, so 3,740 is divisible by 2.'},{do:'The last digit is 0, so 3,740 is also divisible by 5.',why:'Numbers ending in 0 divide by 2, 5 and 10.'}]},
     mistake:'Checking the first digit instead of the last. 512 starts with 5 but does NOT divide by 5, because it ends in 2.',
     check:{q:'Which number is divisible by 5?',o:['552','1,235','5,001'],a:1,why:'1,235 ends in 5.',hint:'Look only at the last digit.'}},
    {title:'Rules for 3 and 9: add the digits',explain:'<p>For 3 and 9, add up all the digits to get the {{digit sum|the total of all the digits of a number}}.</p><p><strong>Divisible by 3:</strong> the digit sum divides by 3.</p><p><strong>Divisible by 9:</strong> the digit sum divides by 9.</p><p>If the digit sum is still big, you can add its digits again.</p>',
     example:{q:'Is 2,457 divisible by 9? (The mango puzzle!)',steps:[{do:'Add the digits: 2 + 4 + 5 + 7 = 18.',why:'For 3 and 9 we use the digit sum, not the last digit.'},{do:'18 ÷ 9 = 2 exactly, so 18 divides by 9.'},{do:'So 2,457 is divisible by 9. Each vendor gets 2,457 ÷ 9 = 273 mangoes.'}]},
     mistake:'Thinking a number divisible by 3 must end in 3. 123 divides by 3 (digit sum 6), but so does 120 (digit sum 3), and 13 does not.',
     check:{q:'Is 471 divisible by 3?',o:['Yes','No'],a:0,why:'4 + 7 + 1 = 12, and 12 divides by 3. (471 ÷ 3 = 157.)',hint:'Add the digits. Does the total divide by 3?'}},
    {title:'Rule for 6: both 2 and 3',explain:'<p>6 = 2 × 3, so a number is <strong>divisible by 6</strong> if it is divisible by <strong>both 2 and 3</strong>.</p><p>Check two things: is it even? Does its digit sum divide by 3? If both answers are yes, it divides by 6.</p>',
     example:{q:'Is 1,374 divisible by 6?',steps:[{do:'Test for 2: the last digit is 4, which is even. ✓'},{do:'Test for 3: 1 + 3 + 7 + 4 = 15, and 15 divides by 3. ✓'},{do:'It passes both tests, so 1,374 is divisible by 6. (1,374 ÷ 6 = 229.)'}]},
     mistake:'Checking only one test. 2,005 has a digit sum of 7 and 315 is odd: neither divides by 6. A number must pass BOTH tests.',
     check:{q:'Which number is divisible by 6?',o:['327','424','522'],a:2,why:'522 is even, and 5 + 2 + 2 = 9 divides by 3.',hint:'It must be even AND have a digit sum that divides by 3.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Rounding',text:'Look at the digit to the RIGHT of the place you are rounding to. 5 or more: round up. 4 or less: keep it. For example, 7,350 to the nearest hundred is 7,400.'},{title:'Estimating',text:'Round each number to something easy, then calculate. For example, 49 × 31 ≈ 50 × 30 = 1,500.'},{title:'Divisible by 2 and 5',text:'By 2: the number ends in 0, 2, 4, 6 or 8. By 5: it ends in 0 or 5. For example, 4,390 divides by both.'},{title:'Divisible by 3, 9 and 6',text:'By 3 or 9: the digit sum divides by 3 or 9. By 6: it is even AND divides by 3. For example, 378: digit sum 18, and it is even, so it divides by 3, 6 and 9.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Round 47.682 to the nearest hundredth.',steps:[{do:'The hundredths digit is 8 (47.682).',why:'Hundredths is the second place after the decimal point.'},{do:'The digit to its right is 2, which is less than 5.'},{do:'So the 8 stays. Answer: 47.68.'}]},
     {type:'fill',q:'Is 5,832 divisible by 9?',steps:[{text:'Digit sum: 5 + 8 + 3 + 2 = ___',blank:true,a:18,hint:'Add the four digits.'},{text:'18 divides by 9.'},{text:'So 5,832 is divisible by 9.'}],sol:'5 + 8 + 3 + 2 = 18, which divides by 9, so 5,832 is divisible by 9.'},
     {type:'own',q:'Round 18,649 to the nearest thousand.',a:19000,hint:'The thousands digit is 8. Look at the hundreds digit.',sol:'The hundreds digit is 6 (5 or more), so round up: 19,000.'},
     {type:'own',q:'Estimate 612 ÷ 29 by rounding each number. Type your estimate.',a:20,tol:2,hint:'612 ≈ 600 and 29 ≈ 30.',sol:'600 ÷ 30 = 20.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like. Try di hard one dem too!',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Divides by 3?',desc:'Sort numbers by whether they divide by 3.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Add the digits. Does the total divide by 3?',bins:[{id:'y',label:'Divisible by 3',hint:'digit sum divides by 3'},{id:'n',label:'Not divisible by 3',hint:'digit sum does not'}],items:[{label:'123',bin:'y'},{label:'250',bin:'n'},{label:'4,005',bin:'y'},{label:'712',bin:'n'},{label:'3,333',bin:'y'},{label:'1,001',bin:'n'},{label:'81',bin:'y'},{label:'44',bin:'n'}]}},
    {icon:'🃏',title:'Match the rounding',desc:'Match each number to its rounded value.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['3,476 to the nearest 10','3,480'],['3,476 to the nearest 100','3,500'],['3,476 to the nearest 1,000','3,000'],['6.35 to the nearest tenth','6.4'],['6.349 to the nearest hundredth','6.35'],['6.35 to the nearest whole number','6']]}},
    {icon:'📏',title:'Order it!',desc:'Put the estimates in order from smallest to largest.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Estimate each one by rounding, then tap them from smallest to largest.',rounds:[[{label:'49 × 21',v:1029,show:'≈ 1,000'},{label:'198 × 3',v:594,show:'≈ 600'},{label:'3,012 ÷ 2',v:1506,show:'≈ 1,500'},{label:'89 + 312',v:401,show:'≈ 400'}],[{label:'6,980 − 3,010',v:3970,show:'≈ 4,000'},{label:'101 × 51',v:5151,show:'≈ 5,000'},{label:'9,020 ÷ 3',v:3006.7,show:'≈ 3,000'},{label:'4,990 ÷ 2',v:2495,show:'≈ 2,500'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A number that divides by 9 also divides by 3.',a:'always',why:'9 = 3 × 3, so anything that divides by 9 must divide by 3.'},{s:'A number that divides by 3 also divides by 9.',a:'sometimes',why:'27 divides by both, but 12 divides by 3 and not by 9.',hint:'Try 12.'},{s:'An even number divides by 6.',a:'sometimes',why:'12 is even and divides by 6, but 8 is even and does not.',hint:'Try 8.'},{s:'Rounding to the nearest ten gives a number ending in 0.',a:'always',why:'Multiples of ten always end in 0.'},{s:'A number ending in 5 divides by 2.',a:'never',why:'Numbers ending in 5 are odd, and odd numbers never divide by 2.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jada',q:'Round 2,749 to the nearest hundred.',lines:['The hundreds digit is 7','The digit after it is 4, so keep the 7','Answer: 2,740'],wrong:2,reasons:['She kept the tens digit instead of replacing it with 0','She looked at the wrong digit','She should have rounded up'],reason:0,fix:'2,700. When rounding to the nearest hundred, the tens and ones become 0.'},{who:'Omar',q:'Is 4,113 divisible by 3?',lines:['It ends in 3','so it is divisible by 3'],wrong:1,reasons:['For 3, you must use the digit sum, not the last digit','4,113 is an even number','He should have checked for 9 instead'],reason:0,fix:'4 + 1 + 1 + 3 = 9, which divides by 3, so yes. But the reason is the digit sum, not the last digit: 13 ends in 3 and does NOT divide by 3.'},{who:'Brianna',q:'Is 2,358 divisible by 6?',lines:['It is even, so it divides by 2','So it divides by 6'],wrong:1,reasons:['She must also check that it divides by 3','Even numbers never divide by 6','She should check the first digit'],reason:0,fix:'Digit sum 2 + 3 + 5 + 8 = 18 divides by 3, AND it is even, so it does divide by 6. You need both tests.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire rounding and divisibility questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var n=R(1000,9999),p=[10,100,1000][R(0,2)],v=Math.round(n/p)*p,w=Math.floor(n/p)*p===v?v+p:Math.floor(n/p)*p;return{q:'Round '+n.toLocaleString('en-JM')+' to the nearest '+p.toLocaleString('en-JM')+'.',o:[v.toLocaleString('en-JM'),w.toLocaleString('en-JM'),(n===v||n===w?v+2*p:n).toLocaleString('en-JM')],a:0,why:'Look at the digit to the right of the '+(p===10?'tens':p===100?'hundreds':'thousands')+' place.'}}var k=[2,3,5,6,9][R(0,4)],m=R(20,999),x=Math.random()<0.5?k*m:k*m+R(1,k-1);var yes=x%k===0;return{q:'Is '+x.toLocaleString('en-JM')+' divisible by '+k+'?',o:['Yes','No'],a:yes?0:1,why:k===2||k===5?'Check the last digit.':k===6?'Check: even AND digit sum divides by 3.':'Check the digit sum.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent numbers that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a 4-digit number that is divisible by 9.',placeholder:'e.g. …',check:function(v){var n=+String(v).replace(/,/g,'');if(!(n>=1000&&n<=9999)||n%1)return{ok:false,msg:'Type a whole number with exactly 4 digits.'};var s=String(n).split('').reduce(function(a,b){return a+ +b},0);return n%9===0?{ok:true,msg:'Yes! Digit sum '+s+' divides by 9, so '+n+' divides by 9.'}:{ok:false,msg:'Its digit sum is '+s+', which does not divide by 9. Change a digit so the digits add to 9, 18, 27 or 36.'}}},{q:'Type a number that is divisible by 6 but NOT by 9.',placeholder:'e.g. …',check:function(v){var n=+String(v).replace(/,/g,'');if(!(n>0)||n%1)return{ok:false,msg:'Type a positive whole number.'};if(n%6===0&&n%9!==0)return{ok:true,msg:'Correct! '+n+' is even with a digit sum that divides by 3, but not by 9.'};if(n%6!==0)return{ok:false,msg:'That is not divisible by 6. It must be even and have a digit sum that divides by 3.'};return{ok:false,msg:'That one divides by 9 as well. Try one with a digit sum like 3, 6, 12 or 15.'}}},{q:'Type a number that rounds to 500 when rounded to the nearest hundred.',placeholder:'e.g. …',check:function(v){var n=+String(v).replace(/,/g,'');if(isNaN(n))return{ok:false,msg:'Type a number.'};if(n>=450&&n<550)return{ok:true,msg:'Yes! Any number from 450 up to (but not including) 550 rounds to 500.'};return{ok:false,msg:Math.round(n/100)*100+' is what that rounds to. You need a number from 450 to 549.'}}}]}},
