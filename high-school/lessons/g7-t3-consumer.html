 steps:[
  {phase:'engage',name:'The big bag',title:'Is the big bag always cheaper?',lead:'At a supermarket in Mandeville, rice comes in three sizes: a 1 kg bag for $380, a 2 kg bag for $720 and a 5 kg bag for $1,850. Kemar’s mother always buys the biggest bag, “because big bags are always better value”.',

     init:function(box,api){var sel=box.querySelector('#bbP');function draw(){var it=SHELF[sel.value],unit=it[1][0][2]==='kg'?['kg',1]:it[1][0][2]==='mL'?['L',1000]:['100 g',100],ups=it[1].map(function(p){return p[3]/p[1]*unit[1]}),best=ups.indexOf(Math.min.apply(null,ups));box.querySelector('.bbSvg').innerHTML=SHELFSVG(it,best);box.querySelector('.bbT').innerHTML='<thead><tr><th>Pack</th><th>Price</th><th>Cost per '+unit[0]+'</th></tr></thead><tbody>'+it[1].map(function(p,i){return'<tr'+(i===best?' style="font-weight:700"':'')+'><td>'+p[0]+'</td><td>'+JM(p[3])+'</td><td>'+JM(ups[i])+(i===best?' ★':'')+'</td></tr>'}).join('')+'</tbody>';box.querySelector('.bbX').innerHTML='The best buy is the <strong>'+it[1][best][0]+'</strong>, with the lowest cost per '+unit[0]+'. '+(best===2?'Here the biggest pack is the best value.':'Notice: the biggest pack is NOT the best value here!')}sel.onchange=draw;var T=[{t:'What is the cost per kg of the 5 kg bag of rice? (dollars)',ok:function(v){return parseFloat(v)===370}},{t:'Which size of rice is the best buy? (Type 1, 2 or 5.)',ok:function(v){return parseFloat(v)===2}},{t:'Which juice is the best buy? (Type 250, 1 or 2 for 250 mL, 1 L or 2 L.)',ok:function(v){return parseFloat(v)===1}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.bbN').textContent='All done';box.querySelector('.bbQ').textContent='You completed every challenge!';box.querySelector('.bbC').disabled=true;return}box.querySelector('.bbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.bbQ').textContent=T[q].t}box.querySelector('.bbC').onclick=function(){var v=String(box.querySelector('.bbA').value).replace(/[$,\s]|kg|l$/gi,''),fb=box.querySelector('.bbFb');if(T[q].ok(v)){fb.className='fb ok bbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.bbA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no bbFb';fb.textContent='Not yet. Choose the product and read the unit prices.'}};draw();task()}},
    {type:'recall',text:'The 2 kg bag is the best value: $360 per kg, compared with $380 for the 1 kg bag and $370 for the 5 kg bag. Bigger is not always cheaper!'}]},
  {phase:'explain',name:'Teach: unit price and best buys',title:'Learn: total price, unit price, quantity and best buys',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Price fi one, times how much, give yuh di total.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Total price, unit price and quantity',explain:'<p>Every time you buy several of the same thing, three numbers are linked. The {{unit price|the cost of ONE item or one unit}} is the cost of <strong>one</strong>, like $250 for one patty. The <strong>quantity</strong> is how many you buy. And the {{total price|the cost of the whole amount}} is what you pay altogether.</p><p>They are linked by one simple rule: <strong>total price = quantity × unit price</strong>. Four patties at $250 each cost 4 × $250 = $1,000.</p><p>The rule can be turned around. If you know the total and the quantity, divide to find the unit price: <strong>unit price = total ÷ quantity</strong>. If you know the total and the unit price, divide to find how many: <strong>quantity = total ÷ unit price</strong>. A triangle with “total” on top and “quantity × unit price” underneath helps you remember: cover the one you want.</p>',
     example:{q:'(a) 6 bottles of water cost $540. Find the unit price. (b) With $1,200, how many $150 snacks can you buy?',steps:[{do:'(a) Unit price = $540 ÷ 6 = $90 per bottle.'},{do:'(b) Quantity = $1,200 ÷ $150 = 8 snacks.',why:'Total ÷ unit price gives the quantity.'}]},
     mistake:'Multiplying when you should divide. To find the price of ONE, share the total by the quantity.',
     check:{q:'5 exercise books cost $650. What is the unit price?',o:['$130','$3,250','$645'],a:0,why:'650 ÷ 5 = 130.',hint:'Total ÷ quantity.'}},
    {title:'Comparing unit costs to find the best buy',explain:'<p>Shops sell the same product in different sizes, and the bigger pack is not always cheaper per kilogram or litre. To find the {{best buy|the option with the lowest unit price}}, compare the <strong>unit costs</strong>: the cost of the same amount, such as 1 kg or 1 L, for each option.</p><p>Find each unit cost by dividing the price by the amount: price ÷ quantity. The option with the <strong>lowest unit cost</strong> is the best buy.</p><p>For the rice: 1 kg costs $380 per kg; 2 kg costs $720 ÷ 2 = $360 per kg; 5 kg costs $1,850 ÷ 5 = $370 per kg. So the 2 kg bag wins. Kemar’s mother would save money by buying two 2 kg bags and one 1 kg bag instead of a 5 kg bag!</p>',visual:SHELFSVG(SHELF.rice,1),
     example:{q:'Juice: 250 mL for $90, 1 L for $320, or 2 L for $680. Which is the best buy?',steps:[{do:'Change everything to the cost of 1 L: 250 mL is ¼ L, so $90 × 4 = $360 per L.'},{do:'1 L: $320 per L. 2 L: $680 ÷ 2 = $340 per L.'},{do:'Best buy: the 1 L carton, at $320 per litre.'}]},
     mistake:'Comparing the prices without making the amounts the same. You cannot fairly compare $90 for 250 mL with $320 for 1 L until both are per litre.',
     check:{q:'Bread: 400 g for $240 or 800 g for $440. Which is the better buy?',o:['800 g','400 g','They are the same'],a:0,why:'400 g: $60 per 100 g. 800 g: $55 per 100 g.',hint:'Find the cost per 100 g.'}},
    {title:'Bargains and sensible shopping',explain:'<p>A {{bargain|a good deal: paying less than usual for something you need}} is when you pay less than usual for something you actually need. Shops use lots of offers: “Buy 2, get 1 free”, “20% off”, “family size”. Unit prices help you see through them.</p><p>For “buy 2, get 1 free”, work out what you really pay for 3: the price of 2. So the unit price is (2 × price) ÷ 3.</p><p>But a bargain is only a bargain if you can use it. A huge pack that spoils before you finish it, or something you did not need at all, wastes money. Smart shoppers ask two questions: “What is the unit price?” and “Do I really need this much?”</p>',
     example:{q:'Patties cost $250 each, or "buy 2 get 1 free". What is the unit price with the offer?',steps:[{do:'For 3 patties you pay for 2: 2 × $250 = $500.'},{do:'Unit price = $500 ÷ 3 ≈ $166.67.'},{do:'That saves about $83 per patty, if you want 3.'}]},
     mistake:'Thinking an offer is always a saving. If you only need one patty, buying three is not a bargain.',
     check:{q:'A $600 item has a "buy 3 for $1,500" offer. What is the unit price with the offer?',o:['$500','$600','$450'],a:0,why:'1,500 ÷ 3 = 500.',hint:'Total ÷ quantity.'}}]}]},
  {phase:'explain',name:'Teach: profit, loss and currency',title:'Learn: profit, loss and changing currency',lead:'Next, what happens when you sell things, and how to change money for travel or online shopping.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Sell fi more dan yuh pay: profit. Sell fi less: loss.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Profit and loss in dollars',explain:'<p>Picture a student selling bag juice at sports day. She buys each one for $40 and sells it for $60. The price she paid is the {{cost price|what a seller paid for an item}}, and the price customers pay her is the {{selling price|what a customer pays the seller}}.</p><p>If the selling price is <strong>higher</strong> than the cost price, she makes a {{profit|selling price minus cost price}}: <strong>profit = selling price − cost price</strong>. Here, $60 − $40 = $20 on each bag juice.</p><p>If the selling price is <strong>lower</strong>, she makes a {{loss|cost price minus selling price}}: <strong>loss = cost price − selling price</strong>. If the juice got warm and she had to sell some for $30, she would lose $40 − $30 = $10 on each.</p>',
     example:{q:'A vendor buys 50 mangoes for $1,500 and sells them all for $50 each. Find the profit.',steps:[{do:'Total selling price: 50 × $50 = $2,500.'},{do:'Profit = $2,500 − $1,500 = $1,000.'}]},
     mistake:'Subtracting the wrong way round. Decide first: is it a profit (sold for more) or a loss (sold for less)?',
     check:{q:'A book bought for $800 is sold for $650. What is the loss?',o:['$150','$1,450','$650'],a:0,why:'800 − 650 = 150.',hint:'Cost price − selling price.'}},
    {title:'Profit and loss as a percentage',explain:'<p>Is a $20 profit good? It depends on how much you spent! A $20 profit on a $40 bag juice is excellent, but a $20 profit on a $40,000 phone is tiny. That is why we also give profit and loss as a <strong>percentage</strong>.</p><p>We always compare the profit (or loss) with the <strong>cost price</strong>, because that is the money the seller risked:</p><p><strong>Percentage profit = profit ÷ cost price × 100</strong></p><p><strong>Percentage loss = loss ÷ cost price × 100</strong></p><p>For the bag juice: $20 ÷ $40 × 100 = 50% profit. That means she made back her money plus half as much again.</p>',
     example:{q:'A bicycle is bought for $25,000 and sold for $30,000. Find the percentage profit.',steps:[{do:'Profit = $30,000 − $25,000 = $5,000.'},{do:'Percentage profit = 5,000 ÷ 25,000 × 100.'},{do:'= 20%.',why:'Always divide by the cost price.'}]},
     mistake:'Dividing by the selling price. Percentage profit and loss are always worked out on the COST price.',
     check:{q:'An item bought for $200 is sold for $150. Percentage loss?',o:['25%','33%','50%'],a:0,why:'50 ÷ 200 × 100 = 25%.',hint:'Loss ÷ cost price × 100.'}},
    {title:'Converting currencies',explain:'<p>If you travel to Miami, buy something online from another country, or get money from a relative abroad, you need to change currencies. An {{exchange rate|how much of one currency equals one unit of another}} tells you how much one unit of a currency is worth in another. In this lesson we use example rates: US$1 = J$157, CA$1 = J$115 and £1 = J$200. Real rates change every day.</p><p>Here is how to decide whether to multiply or divide. One US dollar is worth many Jamaican dollars. So when you change <strong>US$ into J$</strong>, the number gets <strong>bigger</strong>: multiply by the rate. When you change <strong>J$ into US$</strong>, the number gets <strong>smaller</strong>: divide by the rate.</p><p>Always ask: does my answer make sense? US$20 should be thousands of Jamaican dollars, not a few cents.</p>',
     example:{q:'Using US$1 = J$157: (a) change US$20 to J$; (b) change J$7,850 to US$.',steps:[{do:'(a) US$ to J$: multiply. 20 × 157 = J$3,140.'},{do:'(b) J$ to US$: divide. 7,850 ÷ 157 = US$50.',why:'Jamaican dollar amounts are bigger numbers, so changing to US$ makes the number smaller.'}]},
     mistake:'Multiplying when changing J$ into US$. That gives a huge, wrong answer; divide instead.',
     check:{q:'Using £1 = J$200, change £15 to J$.',o:['J$3,000','J$13.33','J$215'],a:0,why:'15 × 200 = 3,000.',hint:'Pounds to J$: multiply.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Price rules',text:'Total = quantity × unit price. Unit price = total ÷ quantity. Quantity = total ÷ unit price.'},{title:'Best buys',text:'Compare the cost of the same amount (per kg, per L, per 100 g). Lowest unit cost = best buy.'},{title:'Profit and loss',text:'Profit = SP − CP; loss = CP − SP. Percentage = profit (or loss) ÷ cost price × 100.'},{title:'Currency (example rates)',text:'Foreign to J$: multiply by the rate. J$ to foreign: divide by the rate. US$1 = J$157 in this lesson.'}]},

    {icon:'🗂️',title:'Profit or loss?',desc:'Sort each sale.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Sold for more than it cost → profit.',bins:[{id:'p',label:'Profit'},{id:'l',label:'Loss'}],items:[{label:'Bought $40, sold $60',bin:'p'},{label:'Bought $500, sold $450',bin:'l'},{label:'Bought $1,000, sold $1,200',bin:'p'},{label:'Bought $75, sold $70',bin:'l'},{label:'Bought 10 for $900, sold each for $100',bin:'p'},{label:'Bought 5 for $1,000, sold each for $180',bin:'l'}]}},

    {icon:'📏',title:'Cheapest per kilogram',desc:'Order the bags of sugar by unit cost.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the cost per kg of each bag of sugar, then tap from cheapest to dearest per kg.',rounds:[[{label:'2 kg for $500',v:250,show:'$250/kg'},{label:'1 kg for $270',v:270,show:'$270/kg'},{label:'5 kg for $1,200',v:240,show:'$240/kg'},{label:'500 g for $140',v:280,show:'$280/kg'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The biggest pack is the best buy.',a:'sometimes',why:'It was for flour, but not for rice or juice in the explorer.'},{s:'Percentage profit is worked out on the cost price.',a:'always',why:'That is the rule.'},{s:'Changing US$ to J$ gives a bigger number.',a:'always',why:'One US dollar is worth many Jamaican dollars.'},{s:'A "buy 2 get 1 free" offer is a bargain.',a:'sometimes',why:'Only if you actually need three!'},{s:'A loss happens when the selling price is higher than the cost price.',a:'never',why:'That is a profit.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Bought for $400, sold for $500. Percentage profit?',lines:['Profit = $100','Percentage = 100 ÷ 500 × 100 = 20%'],wrong:1,reasons:['Divide by the COST price: 100 ÷ 400 × 100 = 25%','The profit is $900','It should be 100%'],reason:0,fix:'25%.'},{who:'Tia',q:'Change J$3,140 to US$ (US$1 = J$157).',lines:['3,140 × 157 = US$492,980'],wrong:0,reasons:['J$ to US$: DIVIDE. 3,140 ÷ 157 = US$20','She should add 157','She should subtract 157'],reason:0,fix:'US$20.'},{who:'Andre',q:'Which is the better buy: 250 mL for $90, or 1 L for $320?',lines:['$90 is less than $320','So the 250 mL box is the better buy'],wrong:1,reasons:['Compare the cost per litre: $360 vs $320, so the 1 L carton is better','They are the same','The 250 mL box is free'],reason:0,fix:'The 1 L carton ($320 per L).'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire money questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2),f=function(n){return'$'+n.toLocaleString('en-JM')};if(r===0){var q=R(2,9),u=R(2,9)*50;return{q:q+' items cost '+f(q*u)+'. Unit price?',o:[f(u),f(q*u*q),f(q*u-q)],a:0,why:'Total ÷ quantity.'}}if(r===1){var cp=R(2,10)*100,pc=[10,20,25,50][R(0,3)],sp=cp*(100+pc)/100;return{q:'Bought for '+f(cp)+', sold for '+f(sp)+'. Percentage profit?',o:[pc+'%',Math.round((sp-cp)/sp*100)+'%',(pc*2)+'%'].filter(function(z,i,a){return a.indexOf(z)===i}).concat([(pc+5)+'%']).slice(0,3),a:0,why:'Profit ÷ cost price × 100.'}}var us=R(2,20)*5;return{q:'US$'+us+' in J$ (US$1 = J$157)?',o:['J$'+(us*157).toLocaleString('en-JM'),'J$'+(Math.round(us/157*100)/100),'J$'+(us+157)],a:0,why:us+' × 157.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Work backwards to fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A 3 kg bag of rice should be a better buy than the 2 kg bag ($360 per kg). Type a price for the 3 kg bag that does this (in dollars).',placeholder:'price',check:function(v){var p=parseFloat(String(v).replace(/[$,]/g,''));if(!(p>0))return{ok:false,msg:'Type a price.'};return p/3<360?{ok:true,msg:'Yes! That is $'+(p/3).toFixed(2)+' per kg, less than $360.'}:{ok:false,msg:'That is $'+(p/3).toFixed(2)+' per kg. It must be less than $360 per kg (less than $1,080).'}}},{q:'You buy a T-shirt for $1,000. What should you sell it for to make a 30% profit?',placeholder:'price',check:function(v){return+String(v).replace(/[$,]/g,'')===1300?{ok:true,msg:'Correct! 30% of $1,000 is $300.'}:{ok:false,msg:'Find 30% of the cost price, then add it.'}}},{q:'How many US dollars would J$15,700 buy, at US$1 = J$157?',placeholder:'US$',check:function(v){return+String(v).replace(/[$,US]/gi,'')===100?{ok:true,msg:'Yes! 15,700 ÷ 157 = US$100.'}:{ok:false,msg:'J$ to US$: divide by 157.'}}}]}},
