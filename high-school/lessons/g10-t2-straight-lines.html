.replace(/−/g,'-').replace(/\s/g,'');return t==='-1/2'||t==='-0.5'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.tlN').textContent='All done';box.querySelector('.tlQ').textContent='You completed every challenge!';box.querySelector('.tlC').disabled=true;return}box.querySelector('.tlN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.tlQ').textContent=T[q].t}box.querySelector('.tlC').onclick=function(){var v=String(box.querySelector('.tlIn').value).trim(),fb=box.querySelector('.tlFb');if(T[q].ok(v)){fb.className='fb ok tlFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.tlIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no tlFb';fb.textContent='Not yet. Set A and B to match the question, then read the results.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: lines, intercepts and gradient',title:'Learn: linear graphs, intercepts, gradient and equations',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Change in y ovah change in x.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Linear functions and their intercepts',explain:'<p>A {{linear function|a function whose graph is a straight line}} has a straight-line graph. The syllabus names three types. <strong>y = c</strong> is a horizontal line (for example, y = 3; and y = 0 is the x-axis). <strong>x = k</strong> is a vertical line (for example, x = −2; and x = 0 is the y-axis). And <strong>y = mx + c</strong> is a sloping line with gradient m and y-intercept c.</p><p>To draw y = mx + c, make a table of three values and join the points with a ruler.</p><p>The intercepts can be found <strong>algebraically</strong> as well as from a graph. For the {{y-intercept|where a line crosses the y-axis (x = 0)}}, put <strong>x = 0</strong>. For the {{x-intercept|where a line crosses the x-axis (y = 0)}}, put <strong>y = 0</strong> and solve. For 2x + 3y = 12: x = 0 gives y = 4, and y = 0 gives x = 6. The line crosses at (0, 4) and (6, 0).</p>',
     example:{q:'Find the intercepts of y = 2x − 6.',steps:[{do:'y-intercept: x = 0 gives y = −6, so (0, −6).'},{do:'x-intercept: y = 0 gives 0 = 2x − 6, so x = 3, so (3, 0).'},{do:'You can draw the line just by joining these two points.'}]},
     mistake:'Thinking x = 4 is a horizontal line. Every point on it has x = 4, so it is VERTICAL.',
     check:{q:'Where does 3x + 2y = 12 cross the x-axis?',o:['(4, 0)','(0, 6)','(6, 0)'],a:0,why:'y = 0 gives 3x = 12.',hint:'Put y = 0.'}},
    {title:'Gradient from two points',explain:'<p>The {{gradient|change in y ÷ change in x}} of a line measures its steepness. Between two points (x₁, y₁) and (x₂, y₂):</p><p><strong>m = (y₂ − y₁) / (x₂ − x₁)</strong>, the change in y divided by the change in x.</p><p>A line that rises from left to right has a <strong>positive</strong> gradient; one that falls has a <strong>negative</strong> gradient. A horizontal line has gradient <strong>0</strong>, and a vertical line’s gradient is <strong>undefined</strong> (you cannot divide by 0).</p><p>Back to the ramp: it rises 0.5 m over 5 m, so its gradient is 0.5/5 = 1/10. Since 1/10 is bigger than 1/12, the planned ramp is <strong>too steep</strong>. To meet the guideline, it would need a horizontal length of 0.5 × 12 = 6 m.</p>',visual:TPL([1,2],[5,6],{tri:true,label:'Line through (1, 2) and (5, 6) with its rise and run'}),
     example:{q:'Find the gradient of the line through (−2, 5) and (4, −1).',steps:[{do:'m = (−1 − 5) / (4 − (−2)).'},{do:'= −6 / 6.'},{do:'= −1. The line falls from left to right.'}]},
     mistake:'Subtracting in different orders: (y₂ − y₁)/(x₁ − x₂) gives the wrong sign. Keep the same order on top and bottom.',
     check:{q:'Gradient of the line through (2, 3) and (6, 11)?',o:['2','1/2','8'],a:0,why:'(11 − 3)/(6 − 2) = 8/4.',hint:'Change in y ÷ change in x.'}},
    {title:'Finding the equation of a line',explain:'<p>The syllabus lists four ways to find the equation of a line. In every case, you need a gradient and a point.</p><p><strong>(a) From the graph:</strong> read c where the line crosses the y-axis, and work out m from two clear points. <strong>(b) From two points:</strong> find m first, then use one point. <strong>(c) From a gradient and a point:</strong> use <strong>y − y₁ = m(x − x₁)</strong>, or substitute into y = mx + c to find c. <strong>(d) From a point and its relationship to another line:</strong> parallel or perpendicular (the next teaching page).</p><p>For example, through (3, 5) with gradient 2: y − 5 = 2(x − 3), so y = 2x − 1.</p>',
     example:{q:'Find the equation of the line through (1, 4) and (3, 10).',steps:[{do:'m = (10 − 4)/(3 − 1) = 6/2 = 3.'},{do:'Using (1, 4): y − 4 = 3(x − 1), so y = 3x + 1.'},{do:'Check with (3, 10): 3(3) + 1 = 10 ✓'}]},
     mistake:'Finding m and stopping. You also need c (or the point form) to write the full equation.',
     check:{q:'A line has gradient −2 and passes through (0, 7). Its equation is…',o:['y = −2x + 7','y = 7x − 2','y = −2x − 7'],a:0,why:'m = −2, c = 7.',hint:'(0, 7) is the y-intercept.'}}]}]},
  {phase:'explain',name:'Teach: parallel, perpendicular, length and midpoint',title:'Learn: parallel and perpendicular lines, length, midpoint and graphical solutions',lead:'Next, how lines relate to each other, and measuring line segments.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Perpendicular: flip di fraction an change di sign.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Parallel and perpendicular lines',explain:'<p>{{Parallel lines|lines with the same gradient}} run in exactly the same direction, so they have the <strong>same gradient</strong>: m₁ = m₂. The lines y = 3x + 1 and y = 3x − 4 are parallel.</p><p>{{Perpendicular lines|lines meeting at 90° whose gradients multiply to −1}} meet at a right angle. Their gradients multiply to give <strong>−1</strong>: m₁ × m₂ = −1. So to find a perpendicular gradient, take the <strong>negative reciprocal</strong>: flip the fraction and change the sign. If m = 2/3, the perpendicular gradient is −3/2. If m = 2, it is −1/2. You saw this in the lab: the two gradients always multiplied to −1.</p><p>This is option (d) for finding an equation: if a line passes through a point and is parallel or perpendicular to a known line, you know its gradient.</p>',visual:TPL([-2,-1],[2,3],{perp:true,label:'A line and its perpendicular through the midpoint'}),
     example:{q:'Find the equation of the line through (4, 1) perpendicular to y = 2x + 5.',steps:[{do:'The given gradient is 2, so the perpendicular gradient is −1/2.'},{do:'y − 1 = −½(x − 4), so y − 1 = −½x + 2.'},{do:'y = −½x + 3.'}]},
     mistake:'Using −m instead of −1/m. The perpendicular to a gradient of 2 is −1/2, not −2.',
     check:{q:'A line has gradient −3/4. A perpendicular line has gradient…',o:['4/3','−4/3','3/4'],a:0,why:'Flip and change the sign: 4/3.',hint:'Negative reciprocal.'}},
    {title:'Length and midpoint of a line segment',explain:'<p>A {{line segment|the part of a line between two points}} has two endpoints, A(x₁, y₁) and B(x₂, y₂).</p><p>The <strong>length</strong> comes from Pythagoras: the horizontal and vertical changes are the two short sides of a right-angled triangle. So <strong>AB = √((x₂ − x₁)² + (y₂ − y₁)²)</strong>.</p><p>The {{midpoint|the point exactly halfway between two points}} is halfway along: average the x-coordinates and average the y-coordinates. <strong>M = ((x₁ + x₂)/2, (y₁ + y₂)/2)</strong>.</p><p>For A(1, 2) and B(5, 10): the length is √(4² + 8²) = √80 ≈ 8.94, and the midpoint is (3, 6).</p>',
     example:{q:'Find the length and midpoint of the segment from P(−3, 4) to Q(5, −2).',steps:[{do:'Changes: x changes by 8, y changes by −6.'},{do:'Length = √(8² + (−6)²) = √100 = 10.'},{do:'Midpoint = ((−3 + 5)/2, (4 + (−2))/2) = (1, 1).'}]},
     mistake:'Adding the coordinates without halving for the midpoint. The midpoint is the AVERAGE.',
     check:{q:'Midpoint of (2, 7) and (8, −1)?',o:['(5, 3)','(10, 6)','(3, 4)'],a:0,why:'(10/2, 6/2).',hint:'Average each coordinate.'}},
    {title:'Solving simultaneous equations graphically',explain:'<p>Every linear equation is a straight line. So two simultaneous equations are two lines, and the solution is the point where they <strong>cross</strong>: it is the only point on both lines.</p><p>To solve graphically: <strong>1.</strong> Draw both lines accurately on the same axes (a table of values or the intercepts works well). <strong>2.</strong> Read off the coordinates of the crossing point. <strong>3.</strong> Check by substituting into both equations.</p><p>If the lines are parallel (same gradient), they never cross, so there is no solution. A graph also helps in real problems: for example, where a cost line crosses an income line is the break-even point.</p>',visual:TWO(1,1,-1,3,'The lines y = x + 1 and y = −x + 3 crossing at (1, 2)'),
     example:{q:'Solve y = x + 1 and y = −x + 3 graphically.',steps:[{do:'Draw y = x + 1 through (0, 1) and (2, 3); draw y = −x + 3 through (0, 3) and (3, 0).'},{do:'They cross at (1, 2).'},{do:'Check: 1 + 1 = 2 ✓ and −1 + 3 = 2 ✓. So x = 1, y = 2.'}]},
     mistake:'Reading the crossing point carelessly from a rough sketch. Draw accurately with a ruler and check algebraically.',
     check:{q:'Two lines cross at (3, −1). What is the solution of their equations?',o:['x = 3, y = −1','x = −1, y = 3','There is no solution'],a:0,why:'The crossing point gives x and y.',hint:'(x, y).'}}]},{type:'recall',text:'The ramp is too steep: its gradient is 0.5/5 = 1/10, which is steeper than 1/12. A 6 m horizontal run would give exactly 1/12.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',

   blocks:[{type:'facts',facts:[{title:'Lines and intercepts',text:'y = c horizontal; x = k vertical; y = mx + c sloping. y-intercept: x = 0. x-intercept: y = 0.'},{title:'Gradient and equation',text:'m = (y₂ − y₁)/(x₂ − x₁). Equation: y − y₁ = m(x − x₁), or y = mx + c.'},{title:'Parallel and perpendicular',text:'Parallel: m₁ = m₂. Perpendicular: m₁ × m₂ = −1 (negative reciprocal).'},{title:'Length, midpoint, graphs',text:'Length = √((x₂ − x₁)² + (y₂ − y₁)²). Midpoint = averages. Simultaneous equations: where the lines cross.'}]},

   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Parallel, perpendicular or neither?',desc:'Compare each pair of lines with y = 2x + 1.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Same gradient → parallel. Gradients multiply to −1 → perpendicular.',bins:[{id:'p',label:'Parallel to y = 2x + 1'},{id:'q',label:'Perpendicular to y = 2x + 1'},{id:'n',label:'Neither'}],items:[{label:'y = 2x − 5',bin:'p'},{label:'y = −½x + 3',bin:'q'},{label:'y = −2x + 1',bin:'n'},{label:'2y = 4x + 7',bin:'p'},{label:'y = ½x',bin:'n'},{label:'x + 2y = 6',bin:'q'}]}},
    {icon:'🃏',title:'Match the lines',desc:'Match each description to its equation.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['horizontal line through (0, 3)','y = 3'],['vertical line through (−2, 0)','x = −2'],['the x-axis','y = 0'],['gradient 2, y-intercept −1','y = 2x − 1'],['gradient −1, through the origin','y = −x'],['the y-axis','x = 0']]}},
    {icon:'📏',title:'Order the gradients',desc:'Find each gradient, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the gradient through each pair of points, then tap from smallest to largest.',rounds:[[{label:'(0, 0) and (2, −6)',v:-3,show:'−3'},{label:'(1, 1) and (5, 3)',v:0.5,show:'1/2'},{label:'(2, 4) and (6, 4)',v:0,show:'0'},{label:'(0, 1) and (1, 5)',v:4,show:'4'},{label:'(−1, 3) and (1, 1)',v:-1,show:'−1'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Parallel lines have equal gradients.',a:'always',why:'They rise at the same rate.'},{s:'The gradients of perpendicular lines multiply to −1.',a:'sometimes',why:'True whenever both gradients exist; a horizontal and a vertical line are perpendicular, but the vertical gradient is undefined.'},{s:'The line x = 5 has gradient 0.',a:'never',why:'x = 5 is vertical; its gradient is undefined.'},{s:'The midpoint of a segment lies on the segment.',a:'always',why:'It is halfway along it.'},{s:'Two different straight lines cross exactly once.',a:'sometimes',why:'Unless they are parallel.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Gradient through (1, 5) and (4, −1).',lines:['m = (−1 − 5)/(1 − 4) = −6/−3','m = 2'],wrong:0,reasons:['He subtracted in different orders; it should be (−1 − 5)/(4 − 1) = −2','The gradient is −6','The gradient is 3'],reason:0,fix:'m = −2.'},{who:'Shanice',q:'Perpendicular gradient to m = 3.',lines:['Perpendicular gradient = −3'],wrong:0,reasons:['It is the negative RECIPROCAL: −1/3','It is 1/3','It is 3'],reason:0,fix:'−1/3.'},{who:'Andre',q:'Midpoint of (2, 6) and (8, 10).',lines:['(2 + 8, 6 + 10) = (10, 16)'],wrong:0,reasons:['He forgot to halve: (5, 8)','It should be (6, 4)','It should be (4, 6)'],reason:0,fix:'(5, 8).'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire line questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2),o,add=function(z){if(o.length<3&&o.indexOf(z)<0)o.push(z)};if(r===0){var x1=R(-4,3),y1=R(-4,4),run=R(1,4),m=R(-3,3)||2,x2=x1+run,y2=y1+m*run;o=[fl(m)];[fl(-m),FR(run,m*run||1),fl(m+1)].forEach(add);return{q:'Gradient through ('+fl(x1)+', '+fl(y1)+') and ('+fl(x2)+', '+fl(y2)+')?',o:o,a:0,why:'('+fl(y2)+' − '+fl(y1)+') ÷ '+run+'.'}}if(r===1){var mm=[2,3,-2,-3,4][R(0,4)];o=[FR(-1,mm)];[fl(-mm),FR(1,mm),fl(mm)].forEach(add);return{q:'Perpendicular gradient to m = '+fl(mm)+'?',o:o,a:0,why:'Negative reciprocal.'}}var a=R(-4,4),b=R(-4,4),c=R(-4,6),d=R(-4,6);if((a+c)%2)c++;if((b+d)%2)d++;o=['('+fl((a+c)/2)+', '+fl((b+d)/2)+')'];['('+fl(a+c)+', '+fl(b+d)+')','('+fl((c-a)/2)+', '+fl((d-b)/2)+')','('+fl((a+c)/2+1)+', '+fl((b+d)/2)+')'].forEach(add);return{q:'Midpoint of ('+fl(a)+', '+fl(b)+') and ('+fl(c)+', '+fl(d)+')?',o:o,a:0,why:'Average each coordinate.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent lines that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Write the equation of a line perpendicular to y = ½x + 2 that passes through the origin.',placeholder:'y = …',check:function(v){var t=String(v).replace(/\s|y=/gi,'').replace(/−/g,'-');return t==='-2x'?{ok:true,msg:'Yes! Gradient −2, through (0, 0).'}:{ok:false,msg:'The negative reciprocal of ½ is −2.'}}},{q:'Give the coordinates of B so that the midpoint of A(1, 3) and B is (4, 5).',placeholder:'(x, y)',check:function(v){var m=String(v).replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?[\d.]+),(-?[\d.]+)\)?$/);return m&&+m[1]===7&&+m[2]===7?{ok:true,msg:'Correct! (1 + 7)/2 = 4 and (3 + 7)/2 = 5.'}:{ok:false,msg:'Work backwards: (1 + x)/2 = 4 and (3 + y)/2 = 5.'}}},{q:'Type a point (other than the origin) whose distance from the origin is exactly 13.',placeholder:'(x, y)',check:function(v){var m=String(v).replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?[\d.]+),(-?[\d.]+)\)?$/);if(!m)return{ok:false,msg:'Type a point like (5, 12).'};var d=Math.sqrt(m[1]*m[1]+m[2]*m[2]);return Math.abs(d-13)<1e-9?{ok:true,msg:'Yes! The distance is 13.'}:{ok:false,msg:'That is '+Math.round(d*100)/100+' away. Try (5, 12).'}}}]}},
    {icon:'♿',title:'Mission: the accessible school',desc:'Design ramps and paths for an accessible school.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A school in Spanish Town is improving access for wheelchair users. On the site plan, each unit is 1 m. The guideline is a ramp gradient no steeper than 1/12.',parts:[{q:'The planned ramp rises 0.5 m over 5 m. What is its gradient, as a decimal?',a:0.1,tol:0.0001,hint:'0.5 ÷ 5.',sol:'0.1 (= 1/10), which is steeper than 1/12 ≈ 0.083.'},{q:'What horizontal length (m) would give exactly 1/12 for a 0.5 m rise?',a:6,hint:'0.5 × 12.',sol:'6 m.',placeholder:'metres'},{q:'A path runs from the gate G(0, 0) to the door D(12, 5). How long is it, in m?',a:13,hint:'√(144 + 25).',sol:'13 m.',placeholder:'metres'},{q:'A bench goes at the midpoint of GD. What are its coordinates? (Type (x, y).)',a:['(6,2.5)','6,2.5'],hint:'Average the coordinates.',sol:'(6, 2.5).'},{q:'A second path from the door must be perpendicular to GD (gradient 5/12). What is its gradient? (Type a fraction.)',a:['-12/5','-2.4'],hint:'Negative reciprocal.',sol:'−12/5.'}],done:'You used gradient, length, midpoint and perpendicular lines to design a real, accessible school.'}}
