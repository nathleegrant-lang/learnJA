  {phase:'explain',name:'Teach: working with ratios',title:'Learn: ratios as fractions and decimals, combining and changing ratios',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Turn di ratio inna 1 to sinting fi compare easy.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Ratios as fractions, decimals and unit ratios',explain:'<p>Which school has more students per teacher: one with 840 students and 30 teachers, or one with 1,125 students and 45 teachers? The ratios 840 : 30 and 1,125 : 45 are hard to compare as they are.</p><p>The trick is to turn each into a {{unit ratio|a ratio written as 1 : n or n : 1}}, where one side is 1. Divide both parts by the same number. 840 : 30 = 28 : 1, and 1,125 : 45 = 25 : 1. Now it is easy: the first school has 28 students per teacher, the second has 25.</p><p>A ratio can also be written as a fraction or a decimal. The ratio of boys to girls 3 : 5 means there are 3/5 = 0.6 times as many boys as girls. And the boys are 3/8 of the whole class, because there are 8 parts altogether.</p>',
     example:{q:'Map A has a scale of 2 cm : 5 km and map B has 1 cm : 3 km. Which map shows more detail?',steps:[{do:'Map A as a unit ratio: 1 cm : 2.5 km.'},{do:'Map B: 1 cm : 3 km.'},{do:'On map A, 1 cm covers less ground, so map A is larger and shows more detail.'}]},
     mistake:'Writing a ratio a : b as the fraction a/b of the WHOLE. In 3 : 5, the first part is 3/8 of the whole, not 3/5.',
     check:{q:'Write 45 : 9 as a unit ratio.',o:['5 : 1','1 : 5','9 : 1'],a:0,why:'Divide both by 9.',hint:'Make the second part 1.'}},
    {title:'Combining two ratios',explain:'<p>Sometimes information comes in two separate ratios that share a part. For example, in a school band the ratio of drummers to trumpeters is 2 : 3, and trumpeters to guitarists is 4 : 5. Can we find drummers : trumpeters : guitarists?</p><p>The trumpeters appear in both ratios, but as 3 in one and 4 in the other. To combine them, we must make the shared part the <strong>same number</strong> in both. The lowest common multiple of 3 and 4 is 12.</p><p>So scale the first ratio by 4: 2 : 3 = 8 : 12. Scale the second by 3: 4 : 5 = 12 : 15. Now the trumpeters match, and we can join them: <strong>drummers : trumpeters : guitarists = 8 : 12 : 15</strong>.</p>',
     example:{q:'a : b = 1 : 2 and b : c = 3 : 4. Find a : b : c.',steps:[{do:'The shared part b is 2 and 3. The LCM is 6.'},{do:'a : b = 1 : 2 = 3 : 6 (multiply by 3). b : c = 3 : 4 = 6 : 8 (multiply by 2).'},{do:'a : b : c = 3 : 6 : 8.'}]},
     mistake:'Joining the ratios without matching the shared part: 1 : 2 and 3 : 4 does NOT make 1 : 2 : 4.',
     check:{q:'x : y = 2 : 5 and y : z = 5 : 3. Find x : y : z.',o:['2 : 5 : 3','2 : 5 : 8','10 : 25 : 3'],a:0,why:'y is already 5 in both.',hint:'Is the shared part already the same?'}},
    {title:'Increasing and decreasing in a ratio',explain:'<p>Photocopiers and printers often enlarge or reduce pictures “in a ratio”. If a photo is enlarged in the ratio 5 : 3, every length becomes 5/3 of what it was. If a recipe is reduced in the ratio 2 : 3, every amount becomes 2/3 of what it was.</p><p>Here is how to think about it. The ratio <strong>new : old</strong> tells you what fraction to multiply by: new = old × (first number ÷ second number). If the first number is bigger, it is an increase; if it is smaller, it is a decrease.</p><p>So enlarging a 12 cm photo in the ratio 5 : 3 gives 12 × 5/3 = 20 cm. Reducing $900 in the ratio 2 : 3 gives 900 × 2/3 = $600.</p>',
     example:{q:'A recipe for 6 people uses 450 g of rice. It is changed in the ratio 4 : 3 for a bigger family. How much rice is needed?',steps:[{do:'The ratio is new : old = 4 : 3, so multiply by 4/3.'},{do:'450 × 4/3 = 450 ÷ 3 × 4 = 150 × 4.'},{do:'= 600 g of rice (enough for 8 people).'}]},
     mistake:'Multiplying by the fraction upside down. For an increase, the fraction must be bigger than 1 (4/3, not 3/4).',
     check:{q:'Decrease $1,500 in the ratio 3 : 5.',o:['$900','$2,500','$300'],a:0,why:'1,500 × 3/5 = 900.',hint:'A decrease, so multiply by a fraction less than 1.'}}]}]},
  {phase:'explain',name:'Teach: scale and similar figures',title:'Learn: scale drawings, maps, similar figures and multi-step problems',lead:'Next, using ratio to measure the real world: on maps, on plans, and with similar shapes.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Same shape, different size: dat a similar.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Scale drawings and maps',explain:'<p>Architects cannot draw a house full size, and map-makers cannot draw Jamaica full size. So they make a {{scale drawing|an accurate drawing where every length is shrunk by the same scale}}, where every length is shrunk by the same amount. The {{scale|the ratio of a drawing length to the real length}} tells you how much.</p><p>A scale of <strong>1 : 500,000</strong> means 1 cm on the map stands for 500,000 cm in real life. That number is hard to picture, so convert it: 500,000 cm = 5,000 m = 5 km. So every 1 cm on the map is 5 km of road.</p><p>To find a <strong>real</strong> length, multiply the map length by the scale number, then convert units. To find a <strong>map</strong> length, convert the real length to cm, then divide by the scale number. For Kingston to Spanish Town: 4 cm × 500,000 = 2,000,000 cm = 20 km.</p>',visual:PLAN(100),
     example:{q:'A plan of a house has a scale of 1 : 50. A bedroom is 7 cm long on the plan. How long is it in real life?',steps:[{do:'Real length = 7 × 50 = 350 cm.'},{do:'Convert: 350 cm = 3.5 m.',why:'Give real lengths in sensible units.'}]},
     mistake:'Forgetting to convert units. 4 cm × 500,000 is 2,000,000 cm, which is 20 km, not 2,000,000 km!',
     check:{q:'On a 1 : 100 plan, a hall is 15 cm long. How long is it in real life?',o:['15 m','1.5 m','150 m'],a:0,why:'15 × 100 = 1,500 cm = 15 m.',hint:'Multiply, then change cm to m.'}},
    {title:'Similar figures and missing lengths',explain:'<p>Two shapes are {{similar|having the same angles, with every side multiplied by the same scale factor}} when one is an exact enlargement of the other: the same shape, but a different size. All their angles are equal, and every pair of matching sides is in the same ratio, the {{scale factor|the number every length is multiplied by}}.</p><p>To find a missing length, first find the scale factor using a pair of matching sides you know: big side ÷ small side. Then multiply (or divide) the other side by it.</p><p>This gives a famous trick for measuring tall things. On a sunny day, a 1.5 m student casts a 2 m shadow, while a tree casts a 12 m shadow. The sun’s rays make two similar triangles, so the scale factor is 12 ÷ 2 = 6, and the tree is 1.5 × 6 = 9 m tall!</p>',visual:SIMT(2),
     example:{q:'Two triangles are similar. The small one has sides 6 cm and 4 cm. The matching side to 6 cm on the big one is 12 cm. Find the side matching 4 cm.',steps:[{do:'Scale factor = 12 ÷ 6 = 2.'},{do:'Missing side = 4 × 2 = 8 cm.',why:'Every side is multiplied by the same scale factor.'}]},
     mistake:'Adding instead of multiplying: the 6 cm side grew by 6 to make 12, but that does NOT mean the 4 cm side grows by 6 to 10.',
     check:{q:'A photo 10 cm wide and 8 cm tall is enlarged to 25 cm wide. How tall is it now?',o:['20 cm','23 cm','10 cm'],a:0,why:'Scale factor 2.5: 8 × 2.5 = 20.',hint:'25 ÷ 10 = ?'}},
    {title:'Multi-step proportion problems',explain:'<p>Real problems often need more than one step, and sometimes they mix direct and inverse proportion. The key is to deal with one change at a time, and to ask at each step: “If this goes up, does that go up (direct) or down (inverse)?”</p><p>Look at this: 4 painters paint 2 classrooms in 6 hours. How long would 6 painters take to paint 3 classrooms? Take it step by step. More classrooms means more time (direct). More painters means less time (inverse).</p><p>A tidy way is to find the time for <strong>1 painter and 1 classroom</strong> first: 4 painters × 6 hours = 24 painter-hours for 2 rooms, so 12 painter-hours per room. Then for 3 rooms: 36 painter-hours. Shared between 6 painters: 36 ÷ 6 = <strong>6 hours</strong>.</p>',
     example:{q:'5 machines make 400 bottles in 2 hours. How many bottles would 8 machines make in 3 hours?',steps:[{do:'One machine in one hour: 400 ÷ 5 ÷ 2 = 40 bottles.'},{do:'8 machines for 3 hours: 40 × 8 × 3.'},{do:'= 960 bottles.'}]},
     mistake:'Changing two things at once and getting confused. Reduce to ONE of everything first, then build up.',
     check:{q:'3 taps fill a tank in 8 hours. How long would 4 taps take?',o:['6 hours','10.7 hours','2 hours'],a:0,why:'24 tap-hours ÷ 4 = 6 hours.',hint:'More taps, less time.'}}]},{type:'recall',text:'Kingston to Spanish Town: 4 cm × 500,000 = 2,000,000 cm = 20 km.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Comparing and combining',text:'Unit ratios (1 : n) make comparison easy. To combine a : b and b : c, make the shared part b the same number in both.'},{title:'Changing in a ratio',text:'New = old × (first ÷ second). 12 cm enlarged in the ratio 5 : 3 = 12 × 5/3 = 20 cm.'},{title:'Scale',text:'1 : n. Real = drawing × n (then convert). Drawing = real (in cm) ÷ n. 1 km = 100,000 cm.'},{title:'Similar figures and multi-step',text:'Scale factor = big side ÷ matching small side. For multi-step problems, reduce to ONE of everything first.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A map has a scale of 1 : 25,000. A road is 2.5 km long. How long is it on the map?',steps:[{do:'Convert to cm: 2.5 km = 250,000 cm.'},{do:'Map length = 250,000 ÷ 25,000 = 10 cm.'}]},

    {icon:'🗂️',title:'Bigger or smaller?',desc:'Does each change make the quantity bigger or smaller?',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'new : old. Is the first number bigger or smaller?',bins:[{id:'b',label:'Bigger (an increase)'},{id:'s',label:'Smaller (a decrease)'}],items:[{label:'Change in the ratio 5 : 3',bin:'b'},{label:'Change in the ratio 2 : 3',bin:'s'},{label:'Enlargement, scale factor 4',bin:'b'},{label:'Change in the ratio 3 : 4',bin:'s'},{label:'Change in the ratio 7 : 2',bin:'b'},{label:'A 1 : 100 scale drawing of a room',bin:'s'}]}},

    {icon:'📏',title:'Real distances',desc:'Work out each real distance, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out each real distance, then tap from shortest to longest.',rounds:[[{label:'3 cm on a 1 : 100,000 map',v:3,show:'3 km'},{label:'2 cm on a 1 : 500,000 map',v:10,show:'10 km'},{label:'8 cm on a 1 : 50,000 map',v:4,show:'4 km'},{label:'5 cm on a 1 : 250,000 map',v:12.5,show:'12.5 km'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Similar triangles have equal angles.',a:'always',why:'Enlarging does not change angles.'},{s:'Two rectangles are similar.',a:'sometimes',why:'Only if their sides are in the same ratio; 2 × 4 and 3 × 6 are, but 2 × 4 and 3 × 4 are not.',hint:'Try 2 × 4 and 3 × 4.'},{s:'A bigger scale number (like 1 : 500,000 instead of 1 : 50,000) gives a more detailed map.',a:'never',why:'A bigger scale number shrinks things more, so it shows less detail.'},{s:'Changing a quantity in the ratio 3 : 4 makes it smaller.',a:'always',why:'You multiply by 3/4, which is less than 1.'},{s:'All squares are similar.',a:'always',why:'All squares have 90° angles and sides in the ratio 1 : 1.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Kemar',q:'A map is 1 : 200,000. Two towns are 3 cm apart. Real distance?',lines:['3 × 200,000 = 600,000','So the towns are 600,000 km apart'],wrong:1,reasons:['600,000 is in CENTIMETRES: 600,000 cm = 6 km','He should divide by 200,000','It should be 60 km'],reason:0,fix:'6 km.'},{who:'Tia',q:'Similar triangles: 5 cm → 15 cm. The 4 cm side becomes?',lines:['The 5 cm side grew by 10 cm','So 4 cm becomes 14 cm'],wrong:1,reasons:['Similar shapes scale by MULTIPLYING: × 3 gives 12 cm','It should be 9 cm','It should be 20 cm'],reason:0,fix:'4 × 3 = 12 cm.'},{who:'Andre',q:'a : b = 1 : 2, b : c = 3 : 4. Find a : b : c.',lines:['a : b : c = 1 : 2 : 4'],wrong:0,reasons:['b must match: 3 : 6 and 6 : 8 give 3 : 6 : 8','It should be 1 : 3 : 4','It should be 1 : 5 : 4'],reason:0,fix:'3 : 6 : 8.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire ratio and scale questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var s=[50,100,200][R(0,2)],c=R(2,12);return{q:c+' cm on a 1 : '+s+' plan. Real length?',o:[c*s/100+' m',c*s+' m',c*s/10+' m'],a:0,why:c+' × '+s+' = '+c*s+' cm.'}}if(r===1){var a=R(2,6),k=[2,3,4,5][R(0,3)],b=R(2,9);return{q:'Similar shapes: '+a+' cm → '+a*k+' cm. What does '+b+' cm become?',o:[b*k+' cm',(b+a*k-a)+' cm',(b*k+1)+' cm'].filter(function(z,i,arr){return arr.indexOf(z)===i}).concat([(b*k+2)+' cm']).slice(0,3),a:0,why:'Scale factor '+k+'.'}}var n=R(2,9)*30,p=[2,3,4,5][R(0,3)],q=p+R(1,3);return{q:'Change '+n+' in the ratio '+q+' : '+p+'.',o:[String(n*q/p),String(n*p/q),String(n+q-p)],a:0,why:n+' × '+q+'/'+p+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Design drawings and shapes that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A 20 m long school hall must fit on a plan as a 10 cm line. What scale should you use? (Type 1 : n.)',placeholder:'1 : n',check:function(v){var n=String(v).replace(/\s|,/g,'').split(':').map(Number);return n.length===2&&n[0]===1&&n[1]===200?{ok:true,msg:'Yes! 2,000 cm ÷ 10 cm = 200, so 1 : 200.'}:{ok:false,msg:'Convert 20 m to cm, then divide by 10.'}}},{q:'Give the sides of a rectangle similar to a 3 cm by 5 cm rectangle, with a longer side of 20 cm. (Type short, long.)',placeholder:'short, long',check:function(v){var n=String(v).split(',').map(parseFloat);return n.length===2&&n[0]===12&&n[1]===20?{ok:true,msg:'Correct! Scale factor 4: 12 cm by 20 cm.'}:{ok:false,msg:'5 × ? = 20. Use the same scale factor on the 3 cm side.'}}},{q:'Combine p : q = 3 : 4 and q : r = 2 : 5 into p : q : r. (Type a : b : c.)',placeholder:'a : b : c',check:function(v){var n=String(v).replace(/\s/g,'').split(':').map(Number);return n.length===3&&n[0]===3&&n[1]===4&&n[2]===10?{ok:true,msg:'Yes! q : r = 2 : 5 = 4 : 10, so 3 : 4 : 10.'}:{ok:false,msg:'Make q the same in both: 4.'}}}]}},
    {icon:'🏠',title:'Mission: the new classroom block',desc:'Plan a new classroom block with scale drawings.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A school in Morant Bay is building a new classroom block. The architect’s plan uses a scale of 1 : 100.',parts:[{q:'A classroom is 9 cm long on the plan. How long is it in real life, in metres?',a:9,tol:0.001,hint:'9 × 100 = 900 cm.',sol:'9 m.',placeholder:'metres'},{q:'The real corridor is 30 m long. How long is it on the plan, in cm?',a:30,tol:0.001,hint:'3,000 cm ÷ 100.',sol:'30 cm.',placeholder:'cm'},{q:'A 1.5 m worker casts a 2 m shadow, while the old water tower casts a 16 m shadow. How tall is the tower, in metres?',a:12,tol:0.001,hint:'Scale factor 16 ÷ 2 = 8.',sol:'1.5 × 8 = 12 m.',placeholder:'metres'},{q:'Sand : cement : gravel are mixed 4 : 1 : 6. The builders use 5 bags of cement. How many bags of gravel?',a:30,hint:'Scale factor 5.',sol:'30 bags.'},{q:'8 workers can finish the block in 45 days. How many days would 12 workers take?',a:30,hint:'360 worker-days ÷ 12.',sol:'30 days.',placeholder:'days'}],done:'You used scale drawings, similar triangles, ratio and inverse proportion to plan a real building.'}}
