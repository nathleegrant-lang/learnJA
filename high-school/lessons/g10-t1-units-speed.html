     init:function(box,api){var d=box.querySelector('#jpD'),s=box.querySelector('#jpS'),m=box.querySelector('#jpM');[d,s,m].forEach(function(e){api.nudges(e)});function hm(t){var h=Math.floor(t),mi=Math.round((t-h)*60);if(mi===60){h++;mi=0}return h+' h '+mi+' min'}function draw(){var D=+d.value,S=+s.value,M=+m.value,T=D/S;box.querySelector('.jpDO').textContent=D;box.querySelector('.jpSO').textContent=S;box.querySelector('.jpMO').textContent=M;box.querySelector('.jpX').innerHTML='Time = distance ÷ speed = '+D+' ÷ '+S+' = <strong>'+(Math.round(T*100)/100)+' hours</strong> = '+hm(T)+'.';var cm=M*50000;box.querySelector('.jpY').innerHTML='Real distance = '+M+' × 50,000 = '+cm.toLocaleString('en-JM')+' cm = '+(cm/100).toLocaleString('en-JM')+' m = <strong>'+(cm/100000)+' km</strong>.'}[d,s,m].forEach(function(e){e.addEventListener('input',draw)});var T=[{t:'How long does a 90 km trip take at 60 km/h? Give the answer in hours as a decimal.',a:1.5,tol:0.001},{t:'On a 1 : 50,000 map, two towns are 8 cm apart. How far apart are they in real life, in km?',a:4,tol:0.001},{t:'A bus travels 150 km in 2.5 hours. What is its average speed in km/h?',a:60,tol:0.001}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.jpN').textContent='All done';box.querySelector('.jpT').textContent='You completed every challenge!';box.querySelector('.jpC').disabled=true;return}box.querySelector('.jpN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.jpT').textContent=T[k].t}box.querySelector('.jpC').onclick=function(){var v=parseFloat(String(box.querySelector('.jpA').value).replace(/,/g,'')),fb=box.querySelector('.jpFb');if(Math.abs(v-T[k].a)<=T[k].tol){fb.className='fb ok jpFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.jpA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no jpFb';fb.textContent='Not yet. Set the sliders to match the challenge and read the result.'}};draw();task()}},

  {phase:'explain',name:'Teach: units and speed',title:'Learn: converting units, SI units and speed',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Distance = speed × time. Cover di one yuh want.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Converting units and SI units',explain:'<p>Scientists all over the world agreed on a common set of units, so that everyone measures the same way. These are {{SI units|the international system: metre, kilogram, second, and units built from them}}: the metre for length, the kilogram for mass, the second for time, and units built from them, such as m² for area, m³ for volume and m/s for speed. It is good to choose a unit that suits the size of the job: a farm in hectares, a truck’s load in tonnes, a cup of juice in millilitres.</p><p>Converting lengths, masses and capacities is like Grade 7: multiply when you change to a smaller unit, divide when you change to a bigger one. But areas and volumes need extra care.</p><p>An area has two directions, so you must convert both. 1 m = 100 cm, so 1 m² = 100 × 100 = 10,000 cm². A volume has three directions: 1 m³ = 100 × 100 × 100 = 1,000,000 cm³, which is the same as 1,000 litres. That is why a small water tank of 1 m³ holds a thousand litres!</p>',
     example:{q:'Change 2.5 m² to cm², and 3,500,000 cm³ to m³.',steps:[{do:'1 m² = 10,000 cm², so 2.5 m² = 2.5 × 10,000 = 25,000 cm².',why:'Each metre is 100 cm in BOTH directions.'},{do:'1 m³ = 1,000,000 cm³.'},{do:'3,500,000 ÷ 1,000,000 = 3.5 m³.',why:'m³ is the bigger unit, so divide.'}]},
     mistake:'Using the length conversion for areas or volumes: 1 m² is NOT 100 cm², and 1 m³ is NOT 100 cm³.',
     check:{q:'How many cm² are in 3 m²?',o:['300 cm²','30,000 cm²','3,000 cm²'],a:1,why:'3 × 10,000 = 30,000 cm².',hint:'1 m² = 100 × 100 cm².'}},
    {title:'Speed, distance and time',explain:'<p>When a taxi travels at 60 kilometres per hour, it means that in 1 hour it covers 60 km. {{Speed|how far something travels in a unit of time}} tells you how far something goes in each unit of time.</p><p>Three quantities are linked: distance, speed and time. If you know any two, you can find the third. The triangle in the picture helps you remember. Cover the one you want, and the other two show you what to do: <strong>distance = speed × time</strong>, <strong>speed = distance ÷ time</strong>, <strong>time = distance ÷ speed</strong>.</p><p>Keep your units matching: if the speed is in km per hour, the distance should be in km and the time in hours. And be careful with time answers. 1.5 hours is NOT 1 hour 50 minutes. The .5 is half an hour, which is 30 minutes. Multiply the decimal part by 60 to change it into minutes.</p>',visual:SDT,
     example:{q:'The opening trip: 90 km at an average speed of 60 km/h. How long does it take?',steps:[{do:'T = D ÷ S = 90 ÷ 60 = 1.5 hours.'},{do:'Change the decimal part to minutes: 0.5 × 60 = 30 minutes.',why:'0.5 hours is half an hour, not 50 minutes.'},{do:'So the trip takes 1 hour 30 minutes. Was your prediction right?'}]},
     mistake:'Writing 1.5 hours as 1 hour 50 minutes. Multiply the decimal part by 60.',
     check:{q:'A car travels at 72 km/h. What is that in m/s?',o:['20 m/s','259.2 m/s','7.2 m/s'],a:0,why:'72 ÷ 3.6 = 20 m/s.',hint:'Divide by 3.6.'}},
    {title:'Average speed',explain:'<p>On a real journey, your speed keeps changing. A bus crawls through Half Way Tree traffic, then speeds up on the highway, then slows down again. So we often talk about the {{average speed|total distance ÷ total time}} for the whole trip.</p><p>Average speed is the speed you would need to travel at a steady pace to cover the same distance in the same time. To find it, use the whole journey: <strong>average speed = total distance ÷ total time</strong>.</p><p>Here is a trap to avoid: you cannot just add the speeds and divide by 2. Imagine a bus that drives slowly for 2 hours, then fast for only 1 hour. It spends more time going slowly, so the slow part should count more. Using total distance ÷ total time takes care of that automatically.</p>',
     example:{q:'A bus travels 60 km in 1 hour, then 90 km in 2 hours. Find its average speed.',steps:[{do:'Total distance: 60 + 90 = 150 km.'},{do:'Total time: 1 + 2 = 3 hours.'},{do:'Average speed: 150 ÷ 3 = 50 km/h.',why:'Averaging the two speeds (60 and 45) would give 52.5, which is wrong because the slower part took longer.'}]},
     mistake:'Adding the speeds and dividing by 2. Always use total distance ÷ total time.',
     check:{q:'A cyclist rides 30 km in 2 hours and then 30 km in 1 hour. What is the average speed?',o:['20 km/h','22.5 km/h','30 km/h'],a:0,why:'60 km ÷ 3 h = 20 km/h.',hint:'Total distance ÷ total time.'}}]}]},
  {phase:'explain',name:'Teach: scales and error',title:'Learn: scale drawings and margin of error',lead:'Next, how maps and plans work, and why no measurement is perfectly exact.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Every measurement have likkle error.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Scales and maps',explain:'<p>A map of Jamaica fits on a sheet of paper, but the real island is about 235 km long. Maps and plans work because everything is shrunk by the same amount. The {{scale|the link between a drawing and real life}} tells you how much.</p><p>A scale like <strong>1 : 50,000</strong> means 1 cm on the map stands for 50,000 cm in real life. To find a real distance, measure on the map, then multiply by 50,000. Then change the units into something sensible, because 400,000 cm is not easy to picture! Remember that 100 cm = 1 m and 100,000 cm = 1 km. So 8 cm on the map is 8 × 50,000 = 400,000 cm, which is 4 km.</p><p>To go the other way, from a real distance to a map distance, change it into cm and divide by the scale number.</p>',
     example:{q:'On a 1 : 50,000 map, two towns are 8 cm apart. How far apart are they in real life?',steps:[{do:'Real distance = 8 × 50,000 = 400,000 cm.'},{do:'Change to km: 400,000 ÷ 100,000 = 4 km.',why:'1 km = 1,000 m = 100,000 cm.'}]},
     mistake:'Forgetting to convert the units. 400,000 cm is not 400 km.',
     check:{q:'On a 1 : 25,000 map, a road measures 6 cm. How long is the road in km?',o:['1.5 km','15 km','150 km'],a:0,why:'6 × 25,000 = 150,000 cm = 1.5 km.',hint:'Multiply, then ÷ 100,000.'}},
    {title:'Areas on scale drawings',explain:'<p>Here is a puzzle that catches many people. A house plan uses a scale of 1 : 100, so every length in real life is 100 times bigger than on the plan. Is every area also 100 times bigger? No!</p><p>Think about a room drawn as a 1 cm square on the plan. In real life, it is 100 cm long AND 100 cm wide. Its area is 100 × 100 = 10,000 times bigger, not 100. Areas grow by the {{scale factor|how many times bigger real life is than the drawing}} <em>squared</em>, because an area has two directions.</p><p>The easiest way to avoid mistakes: change each length on the drawing into a real length first, then work out the area using the real lengths. A room that is 5 cm by 4 cm on a 1 : 100 plan is really 5 m by 4 m, so its area is 20 m².</p>',
     example:{q:'A house plan uses a scale of 1 : 100. A room measures 5 cm by 4 cm on the plan. Find its real area.',steps:[{do:'Real length: 5 × 100 = 500 cm = 5 m. Real width: 4 × 100 = 400 cm = 4 m.'},{do:'Real area: 5 × 4 = 20 m².',why:'Convert the lengths first, then multiply.'},{do:'Check: plan area 20 cm² × 100² = 200,000 cm² = 20 m² ✓'}]},
     mistake:'Multiplying the plan area by 100 instead of 100². Areas scale by the square of the scale factor.',
     check:{q:'On a 1 : 200 plan, a garden is 3 cm by 2 cm. What is its real area?',o:['12 m²','24 m²','1,200 m²'],a:1,why:'Real sides: 6 m and 4 m, so the area is 24 m².',hint:'Convert each side first: 3 × 200 cm and 2 × 200 cm.'}},
    {title:'Margin of error, maximum and minimum',explain:'<p>No measurement is ever perfectly exact. If a carpenter says a plank is 8 cm wide to the nearest centimetre, its true width could be anything that would round to 8. That means anything from 7.5 cm up to just below 8.5 cm.</p><p>So the measurement could be up to half a centimetre out in either direction. That is the {{margin of error|how far a measurement could be from the true value}}: always <strong>half of the unit</strong> you measured to. We write it as 8 cm ± 0.5 cm.</p><p>The smallest the true value could be is the {{lower bound|the smallest value it could have been}} (7.5 cm), and the largest is the {{upper bound|the largest value it could have been}} (8.5 cm). These matter in real life. A builder ordering material for a frame might use the upper bounds, to make sure there is enough. And to find the biggest possible perimeter or area, you use the upper bounds of every measurement.</p>',visual:RULER(8),
     example:{q:'A rectangle measures 12 cm by 8 cm, each to the nearest cm. Find the maximum possible perimeter.',steps:[{do:'Margin of error: ± 0.5 cm.'},{do:'Maximum length 12.5 cm; maximum width 8.5 cm.'},{do:'Maximum perimeter = 2 × (12.5 + 8.5) = 42 cm.',why:'Use the upper bounds to get the largest result.'}]},
     mistake:'Using ± 1 cm for a measurement to the nearest cm. The margin is HALF the unit: ± 0.5 cm.',
     check:{q:'A mass is 250 g to the nearest 10 g. What is the lower bound?',o:['240 g','245 g','249 g'],a:1,why:'Half of 10 g is 5 g, so 250 − 5 = 245 g.',hint:'Half the unit you measured to.'}}]}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Average speed is the average of the speeds of each part of a journey.',a:'sometimes',why:'It only works if each part takes the same TIME. In general, use total distance ÷ total time.',hint:'What if one part takes much longer?'},{s:'Doubling the speed halves the time for the same distance.',a:'always',why:'T = D ÷ S, so doubling S halves T.'},{s:'On a 1 : 100 plan, areas are 100 times bigger in real life.',a:'never',why:'Areas are 100² = 10,000 times bigger.'},{s:'A measurement of 5 m to the nearest metre could be 5.4 m.',a:'always',why:'5.4 m rounds to 5 m, so it is within the bounds (4.5 m to 5.5 m).'},{s:'The upper bound of a rounded measurement is bigger than the measurement.',a:'always',why:'It is the value plus half a unit.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Tyrone',q:'A car travels 120 km in 1.5 hours. How long is that in hours and minutes?',lines:['1.5 hours','= 1 hour 50 minutes'],wrong:1,reasons:['0.5 hours = 0.5 × 60 = 30 minutes','1.5 hours = 1 hour 5 minutes','He should divide by 100'],reason:0,fix:'1 hour 30 minutes.'},{who:'Shanice',q:'A bus goes 40 km at 40 km/h, then 40 km at 80 km/h. Find the average speed.',lines:['(40 + 80) ÷ 2','= 60 km/h'],wrong:0,reasons:['Average speed = total distance ÷ total time','She should add the speeds','She should multiply the speeds'],reason:0,fix:'Times: 1 h and 0.5 h. 80 km ÷ 1.5 h ≈ 53.3 km/h.'},{who:'Devon',q:'A plan uses 1 : 100. A room is 20 cm² on the plan. Find its real area.',lines:['20 × 100 = 2,000 cm²'],wrong:0,reasons:['Areas scale by 100², not 100','He should divide by 100','The scale should be 1 : 1,000'],reason:0,fix:'20 × 10,000 = 200,000 cm² = 20 m².'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire speed and measurement questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,3);if(r===0){var s=R(4,12)*10,t=R(1,4);return{q:'A car travels at '+s+' km/h for '+t+' hours. Distance?',o:[s*t+' km',s/t+' km',(s+t)+' km'],a:0,why:'D = S × T.'}}if(r===1){var v=R(1,9)*18;return{q:v+' km/h in m/s?',o:[Math.round(v/3.6*100)/100+' m/s',Math.round(v*3.6*100)/100+' m/s',Math.round(v/36*100)/100+' m/s'],a:0,why:'÷ 3.6.'}}if(r===2){var m=R(2,20),sc=[25000,50000,100000][R(0,2)];return{q:'Map scale 1 : '+sc.toLocaleString('en-JM')+'. '+m+' cm on the map = ? km',o:[m*sc/100000+' km',m*sc/1000+' km',m*sc/100+' km'],a:0,why:m+' × '+sc.toLocaleString('en-JM')+' cm ÷ 100,000.'}}var x=R(3,40),u=[1,10][R(0,1)],val=x*u;return{q:val+(u===1?' cm to the nearest cm':' g to the nearest 10 g')+'. Lower bound?',o:[(val-u/2)+(u===1?' cm':' g'),(val-u)+(u===1?' cm':' g'),(val+u/2)+(u===1?' cm':' g')],a:0,why:'Subtract half the unit.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent journeys and measurements that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Invent a journey with an average speed of exactly 50 km/h. Type it as distance in km, time in hours (for example 100, 2).',placeholder:'km, hours',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==2||n.some(function(x){return!(x>0)}))return{ok:false,msg:'Type two positive numbers separated by a comma.'};return Math.abs(n[0]/n[1]-50)<1e-9?{ok:true,msg:'Yes! '+n[0]+' ÷ '+n[1]+' = 50 km/h.'}:{ok:false,msg:'That gives '+(Math.round(n[0]/n[1]*100)/100)+' km/h.'}}},{q:'On a 1 : 50,000 map, how many cm would show a real distance of 2.5 km?',placeholder:'cm',check:function(v){return Math.abs(parseFloat(v)-5)<1e-9?{ok:true,msg:'Correct! 2.5 km = 250,000 cm, and ÷ 50,000 = 5 cm.'}:{ok:false,msg:'Change 2.5 km to cm first, then divide by 50,000.'}}},{q:'A length is measured as 15 cm to the nearest cm. Type a true length it could have been (not 15).',placeholder:'cm',check:function(v){var x=parseFloat(v);return x>=14.5&&x<15.5&&x!==15?{ok:true,msg:'Yes! '+x+' cm rounds to 15 cm.'}:{ok:false,msg:'It must be at least 14.5 cm and less than 15.5 cm.'}}}]}},
    {icon:'🗺️',title:'Mission: the road trip to Negril',desc:'Plan a family road trip using a map and speeds.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'The Campbell family is planning a road trip to Negril. Their road map has a scale of 1 : 500,000.',parts:[{q:'One stretch of road measures 12 cm on the map. How long is it in real life, in km?',a:60,hint:'12 × 500,000 cm, then ÷ 100,000.',sol:'6,000,000 cm = 60 km.',placeholder:'km'},{q:'They drive this 60 km stretch at an average of 80 km/h. How many MINUTES does it take?',a:45,hint:'60 ÷ 80 = 0.75 h. Then × 60.',sol:'0.75 × 60 = 45 minutes.',placeholder:'minutes'},{q:'The whole trip is 240 km and takes 4 hours, including stops. What is the average speed for the whole trip, in km/h?',a:60,hint:'Total distance ÷ total time.',sol:'240 ÷ 4 = 60 km/h.',placeholder:'km/h'},{q:'What is 60 km/h in m/s? Give your answer to 1 decimal place.',a:16.7,tol:0.06,hint:'÷ 3.6.',sol:'60 ÷ 3.6 ≈ 16.7 m/s.',placeholder:'m/s'},{q:'The trip distance was measured as 240 km to the nearest 10 km. What is the shortest it could really have been, in km?',a:235,hint:'Half of 10 km is 5 km.',sol:'240 − 5 = 235 km.',placeholder:'km'}],done:'You used map scales, speed, unit conversion and margins of error to plan a real trip.'}}
