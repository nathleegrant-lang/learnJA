function crossMini(t,known,unknown,ul='x'){const cx=150,cy=80;let s='<svg viewBox="0 0 300 160" role="img" aria-label="Two crossing lines"><rect width="300" height="160" fill="#faf8fe"/>';const regs=[[0,t],[t,180],[180,180+t],[180+t,360]];regs.forEach(([a0,a1],i)=>{if(i===known||i===unknown)s+='<path d="'+sector(cx,cy,28,a0,a1)+'" fill="'+(i===unknown&&ul==='x'?'#f4a3c0':'#ffd98a')+'"/>'});const[x1,y1]=pt(cx,cy,110,t),[x2,y2]=pt(cx,cy,110,t+180);s+='<line x1="30" y1="80" x2="270" y2="80" stroke="#4b3aa8" stroke-width="4"/><line x1="'+x2+'" y1="'+y2+'" x2="'+x1+'" y2="'+y1+'" stroke="#4b3aa8" stroke-width="4"/>';[[known,t+'°'],[unknown,ul]].forEach(([i,l])=>{const[a0,a1]=regs[i],[x,y]=pt(cx,cy,48,(a0+a1)/2);s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="'+(l==='x'?'#8a1c4b':'#3d2a73')+'">'+l+'</text>'});return s+'</svg>'}

  note:'Source: National Standards Curriculum Guide, Mathematics Grades 7-9 (MoEYI, 2018), Grade 8, Term 1, Unit 4 (Geometry). This lesson introduces it early, in Grade 7.'},
 glossary:[['Point','An exact location. It has no length or width. Named with a capital letter, like A.'],['Line','A straight path that goes on forever in both directions. Drawn with arrows at both ends.'],['Line segment','Part of a line with two endpoints. It has a length you can measure.'],['Ray','Part of a line with one endpoint. It goes on forever in one direction.'],['Vertex','The point where two rays or lines meet to make an angle.'],['Angle','The amount of turn between two rays that meet at a vertex.'],['Degree (°)','The unit for measuring angles. A full turn is 360°.'],['Parallel lines','Lines that are always the same distance apart and never meet. Symbol: ∥'],['Intersecting lines','Lines that cross at a point.'],['Perpendicular lines','Lines that meet at a right angle (90°). Symbol: ⊥'],['Transversal','A line that crosses two or more other lines.'],['Acute angle','More than 0° and less than 90°.'],['Right angle','Exactly 90°. Marked with a small square.'],['Obtuse angle','More than 90° and less than 180°.'],['Straight angle','Exactly 180°. It looks like a straight line.'],['Reflex angle','More than 180° and less than 360°.'],['Complementary angles','Two angles that add up to 90°.'],['Supplementary angles','Two angles that add up to 180°.'],['Vertically opposite angles','Angles opposite each other where two lines cross. They are equal.'],['Corresponding angles','Angles in the same position at each crossing of a transversal. Equal when the lines are parallel.'],['Alternate interior angles','Angles between the parallel lines, on opposite sides of the transversal. They are equal.'],['Co-interior angles','Angles between the parallel lines, on the same side of the transversal. They add up to 180°.']],

  {phase:'explain',name:'Teach: lines and angles',title:'Learn: lines, and how we name angles',lead:'Now let\'s put proper names to what you explored. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time. Answer di question fi open di next one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Points, segments, rays and lines',explain:'<p>Look around your classroom for a moment. The edge of your ruler, a beam of light from a torch, a straight road stretching into the distance… they are all “straight”, but they are not quite the same. Mathematicians give each one its own name.</p><p>A {{point|an exact location, named with a capital letter}} is simply a position, like a tiny dot. We name it with a capital letter, such as A. A {{line segment|part of a line with two endpoints}} is a straight path that stops at <strong>both ends</strong>, like the edge of a ruler, so you can measure it. A {{ray|part of a line with one endpoint that goes on forever in one direction}} starts at one point and goes on forever in <strong>one</strong> direction, like the beam from a torch. And a {{line|a straight path that goes on forever in both directions}} goes on forever in <strong>both</strong> directions; it never ends.</p><p>In drawings, a dot shows an endpoint (where it stops), and an arrow shows that it keeps going forever.</p>',visual:LINESVG,
     example:{q:'Name the object each one models: (a) the edge of a ruler; (b) a beam of light from a torch.',steps:[{do:'(a) A ruler edge stops at both ends.',why:'Two ends means two endpoints.'},{do:'So it models a line segment.'},{do:'(b) The light starts at the torch and keeps going in one direction.',why:'One starting point, then forever one way.'},{do:'So it models a ray.'}]},
     mistake:'Calling a line segment a "line". In maths, a line has NO endpoints. If it stops at both ends, it is a segment.',
     check:{q:'How many endpoints does a ray have?',o:['None','One','Two'],a:1,why:'A ray starts at one endpoint and goes on forever in one direction.',hint:'Think of a torch beam: where does it start?'}},
    {title:'Parallel, intersecting and perpendicular lines',explain:'<p>Imagine flying over Kingston in a helicopter and looking down at the roads. Some roads run side by side and never meet. Some cross each other. And some cross at a perfect square corner.</p><p>Lines that run side by side, always the same distance apart and never meeting, are {{parallel lines|lines that stay the same distance apart and never meet; symbol ∥}}, like the two rails of a train track. Lines that cross each other at a point are {{intersecting lines|lines that cross at a point}}.</p><p>{{Perpendicular lines|lines that meet at a right angle (90°); symbol ⊥}} are a special kind of intersecting lines: they meet at exactly 90°, a perfect square corner, like the corner of your exercise book or where a wall meets the floor. In drawings, we mark that corner with a tiny square.</p><p>One thing to watch: parallel lines do not have to be flat or horizontal. They can slope at any angle, as long as they stay the same distance apart.</p>',visual:RELSVG,
     example:{q:'Describe each pair: (a) the top and bottom edges of a door; (b) a wall and the floor; (c) the two lines of the letter X.',steps:[{do:'(a) The top and bottom edges never meet and stay the same distance apart: parallel.'},{do:'(b) A wall meets the floor at a square corner: perpendicular.',why:'A square corner is 90°.'},{do:'(c) The lines of an X cross, but not at 90°: intersecting (not perpendicular).'}]},
     mistake:'Thinking parallel lines must be horizontal. Lines can be parallel at any slant, as long as they never meet and stay the same distance apart.',
     check:{q:'Two roads meet at exactly 90°. They are…',o:['parallel','perpendicular','neither'],a:1,why:'Lines that meet at 90° are perpendicular.',hint:'What do we call lines that make a square corner?'}},
    {title:'Measuring and naming angles',explain:'<p>Open a door slowly, and watch it swing. The bigger the swing, the bigger the angle. An {{angle|the amount of turn between two arms that meet at a vertex}} measures how much something has <strong>turned</strong>.</p><p>Every angle has two arms that meet at a corner called the {{vertex|the point where the two arms of an angle meet}}. We measure angles in {{degrees|the unit for angles; a full turn is 360°}}, written °. A complete turn, all the way around back to where you started, is 360°. Half a turn is 180°, which makes a straight line. A quarter turn is 90°, a right angle.</p><p>We sort angles into families by size. An <strong>acute</strong> angle is smaller than a right angle (less than 90°). A <strong>right</strong> angle is exactly 90°. An <strong>obtuse</strong> angle is between 90° and 180°. A <strong>straight</strong> angle is exactly 180°. A <strong>reflex</strong> angle is bigger than a straight line, between 180° and 360°.</p><p>Remember: the length of the arms does not matter. Only the amount of turn does.</p>',visual:ICONS([[45,'acute'],[90,'right'],[135,'obtuse'],[180,'straight'],[250,'reflex']]),
     example:{q:'Name an angle of 135°.',steps:[{do:'Compare it with 90°: 135° is bigger than a right angle.'},{do:'Compare it with 180°: 135° is smaller than a straight angle.'},{do:'Between 90° and 180° means obtuse.',why:'Obtuse angles are bigger than a square corner but smaller than a straight line.'}]},
     mistake:'Thinking a longer arm makes a bigger angle. The size of an angle is the amount of TURN, not the length of the arms.',
     check:{q:'An angle measures 250°. What type is it?',o:['Obtuse','Straight','Reflex'],a:2,why:'250° is more than 180° and less than 360°, so it is reflex.',hint:'Is it more or less than a straight angle (180°)?'}}]}]},
  {phase:'explain',name:'Angle types explorer',title:'Explore the angle types',lead:'Turn the hand anticlockwise from the start line and watch the name change.',
   mission:['Turn the hand to make each of the 5 angle types.','Right and straight angles must be exact, so use −1 and +1 to fine-tune.','Collect all 5 for a star.'],
   patois:'Less than 90 a acute. Exactly 90 a right angle. Between 90 an 180 a obtuse. More than 180 a reflex.',
   blocks:[{type:'custom',star:true,html:'<div class="chips" id="typeSeen" aria-label="Angle types found"></div>  <div class="scene"><svg viewBox="0 0 650 340" role="img" aria-label="Clock-style angle model. A hand turns anticlockwise from the start line and the turn is shaded."><circle cx="325" cy="167" r="137" fill="#fff" stroke="#4b3aa8" stroke-width="8"/><g id="ticks"></g><path id="clockArc" fill="#d4c6f7" opacity=".75"/><line x1="325" y1="167" x2="448" y2="167" stroke="#aab7c6" stroke-width="5"/><line id="clockHand" x1="325" y1="167" x2="448" y2="167" stroke="#c4553f" stroke-width="8" stroke-linecap="round"/><circle cx="325" cy="167" r="9" fill="#2a1d52"/><text x="470" y="173" font-size="17">Start</text></svg></div>  <div class="controls"><label for="typeRange">Turn:</label><input id="typeRange" type="range" min="0" max="360" value="120"><output class="big" id="typeOut">120°</output></div>  <div class="explain" id="typeExplanation" aria-live="polite"></div>  <div class="grid2"><div class="tile say"><strong>Acute</strong>: more than 0° and less than 90°.<br><strong>Right</strong>: exactly 90°.<br><strong>Obtuse</strong>: more than 90° and less than 180°.</div><div class="tile say"><strong>Straight</strong>: exactly 180°.<br><strong>Reflex</strong>: more than 180° and less than 360°.<br><strong>Full turn</strong>: exactly 360°.</div></div>  ',init:function(box,api){
const typeSeen=new Set();const TYPES=['acute','right','obtuse','straight','reflex'];
for(let i=0;i<12;i++){const[x1,y1]=pt(325,167,116,i*30),[x2,y2]=pt(325,167,130,i*30);$('ticks').insertAdjacentHTML('beforeend','<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#7a6aa8" stroke-width="3"/>')}
function typeUpdate(){const v=+$('typeRange').value,[x,y]=pt(325,167,123,v),k=angleKind(v);$('clockHand').setAttribute('x2',x);$('clockHand').setAttribute('y2',y);$('clockArc').setAttribute('d',sector(325,167,85,0,v));$('typeOut').textContent=v+'°';const extra={zero:'Start turning the hand.',acute:'Smaller than a square corner.',right:'A perfect square corner: a quarter turn.',obtuse:'Bigger than a square corner but less than a straight line.',straight:'A half turn. The arms form a straight line.',reflex:'More than a half turn but less than a full turn.',full:'All the way around: a full turn.'}[k];$('typeExplanation').innerHTML='<strong>'+KIND_NAME[k]+'</strong>, a turn of '+v+'°. '+extra;if(TYPES.includes(k)&&!typeSeen.has(k)){typeSeen.add(k);if(typeSeen.size===5)api.complete()}$('typeSeen').innerHTML=TYPES.map(t=>'<span class="chip'+(typeSeen.has(t)?' on':'')+'">'+(typeSeen.has(t)?'✓ ':'')+t+'</span>').join('')}
$('typeRange').oninput=typeUpdate;
api.nudges($('typeRange'));typeUpdate();}}]},
  {phase:'explain',name:'Teach: angle facts',title:'Learn: angle facts for finding missing angles',lead:'These facts let you find angles you cannot measure. Each one matches something you discovered in the Explore phase.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Angle dem pon a straight line add up to 180. Round a point dem add up to 360.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Straight lines and full turns',explain:'<p>Stand facing the board, then turn to face the back of the room. You have made half a turn: 180°. If you stopped part of the way and then finished the turn, the two parts would still add up to 180°.</p><p>That is the idea behind this angle fact. Angles that sit together on a straight line make a half turn, so they always {{add up to 180°|angles on a straight line are supplementary: they total 180°}}. If you know one of them, you can find the other by subtracting from 180°.</p><p>In the same way, if you keep turning all the way around back to the board, you have made a full turn: 360°. So angles that go all the way around a point add up to <strong>360°</strong>.</p><p>These two facts let you find angles you cannot measure. Just add up the angles you know, then subtract from 180° or 360°.</p>',visual:fan([{v:140,l:'x',hi:1},{v:40,l:'40°'}]),
     example:{q:'Find x on the straight line, where the other angle is 40°.',steps:[{do:'The angles sit on a straight line, so they add up to 180°.',why:'A straight line is a half turn.'},{do:'x + 40° = 180°.'},{do:'x = 180° − 40° = 140°.'},{do:'Check: 140° + 40° = 180° ✓. And x looks obtuse, which 140° is.'}]},
     mistake:'Using 360° for angles on a straight line. A straight line is only half a turn: 180°.',
     check:{q:'One angle on a straight line is 65°. What is the other?',o:['25°','115°','295°'],a:1,why:'180° − 65° = 115°.',hint:'Angles on a straight line add up to 180°.'}},
    {title:'Vertically opposite angles',explain:'<p>Make an X with your two index fingers. You have made four angles: one at the top, one at the bottom, and one on each side.</p><p>Now look carefully: the top angle and the bottom angle face each other across the crossing point, and they look the same size. The two side angles also match each other. These pairs are called {{vertically opposite angles|angles opposite each other where two lines cross; they are equal}}, and they are always <strong>equal</strong>.</p><p>Why? Each angle sits on a straight line with its neighbour, so each pair of neighbours adds up to 180°. The top angle and the bottom angle both share the same neighbour, so they must be the same size.</p><p>You saw this in the crossing lines investigation: no matter how you moved the slider, angle a always matched angle c, and b always matched d.</p>',visual:crossMini(55,0,2,'55°'),
     example:{q:'Two straight lines cross. One angle is 48°. Find the other three angles.',steps:[{do:'The angle opposite 48° is also 48°.',why:'Vertically opposite angles are equal.'},{do:'The angle next to 48° sits on a straight line with it: 180° − 48° = 132°.'},{do:'The angle opposite that one is also 132°.'},{do:'Check: 48° + 132° + 48° + 132° = 360° ✓'}]},
     mistake:'Thinking the angles NEXT to each other are equal. Only the angles directly OPPOSITE each other are equal.',
     check:{q:'Two lines cross. One angle is 72°. What is the vertically opposite angle?',o:['72°','108°','288°'],a:0,why:'Vertically opposite angles are equal.',hint:'Which angle faces it across the crossing point?'}},
    {title:'Parallel lines and a transversal',explain:'<p>Think back to the transversal lab: two parallel streets, crossed by one diagonal road. That diagonal line is called a {{transversal|a line that crosses two or more other lines}}, and it makes eight angles, four at each crossing.</p><p>Because the streets are parallel, the diagonal road crosses both of them at exactly the same slant. So the two crossings look identical. That gives us three special pairs of angles.</p><p><strong>Corresponding angles</strong> are in the same position at each crossing, for example both in the top right. Trace them and you get an <strong>F</strong> shape. They are <strong>equal</strong>. <strong>Alternate angles</strong> sit between the parallel lines on opposite sides of the transversal, making a <strong>Z</strong> shape. They are <strong>equal</strong> too. <strong>Co-interior angles</strong> sit between the parallel lines on the <em>same</em> side, making a <strong>C</strong> shape. These ones are not equal; they <strong>add up to 180°</strong>.</p><p>Remember: these rules only work when the lines really are parallel.</p>',visual:transMini(65,{topUR:'known',bottomLR:'unknown'},{topUR:'65°',bottomLR:'z'}),
     example:{q:'The lines are parallel. One angle is 65°. Find angle z.',steps:[{do:'At the bottom crossing, the angle in the same position as 65° is also 65°.',why:'Corresponding angles are equal.'},{do:'That 65° and angle z sit together on a straight line.'},{do:'z = 180° − 65° = 115°.'},{do:'Check: z looks obtuse, and 115° is obtuse ✓'}]},
     mistake:'Thinking co-interior angles are equal. They ADD UP to 180°. Only corresponding, alternate and vertically opposite angles are equal.',
     check:{q:'One co-interior angle is 70°. What is the other?',o:['70°','110°','290°'],a:1,why:'Co-interior angles add up to 180°: 180° − 70° = 110°.',hint:'Co-interior angles add up to 180°.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are all the angle facts in one place. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the angle facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Angles on a straight line add up to 180°.',text:'For example, if one angle is 130°, the other is 180° − 130° = 50°. Check: 130° + 50° = 180°.',svg:fan([{v:130,l:'130°'},{v:50,l:'50°'}])},{title:'Angles around a point add up to 360°.',text:'A full turn is 360°. For example, 120° + 150° + 90° = 360°. If you know all the angles but one, subtract their total from 360°.',svg:fan([{v:120,l:'120°'},{v:150,l:'150°'},{v:90,l:'90°'}],true)},{title:'Vertically opposite angles are equal.',text:'When two straight lines cross, the angles facing each other are the same size. For example, if one angle is 55°, the angle directly opposite it is also 55°.',svg:crossMini(55,0,2,'55°')},{title:'Corresponding angles are equal (parallel lines).',text:'They sit in the same position at each crossing, making an F shape. For example, if one is 60°, the matching angle at the other crossing is also 60°.',svg:transMini(60,{topUR:'pick',bottomUR:'pick'},{topUR:'60°',bottomUR:'60°'})},{title:'Alternate interior angles are equal (parallel lines).',text:'They sit between the parallel lines, on opposite sides of the transversal, making a Z shape. For example, both angles in the Z are 60°.',svg:transMini(60,{topLL:'pick',bottomUR:'pick'},{topLL:'60°',bottomUR:'60°'})},{title:'Co-interior angles add up to 180° (parallel lines).',text:'They sit between the parallel lines, on the same side of the transversal, making a C shape. For example, 120° + 60° = 180°.',svg:transMini(60,{topLR:'pick',bottomUR:'pick'},{topLR:'120°',bottomUR:'60°'})}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Angles around a point are 100°, 120° and x. Find x.',steps:[{do:'Angles around a point add up to 360°.',why:'They make a full turn.'},{do:'Add the angles you know: 100° + 120° = 220°.'},{do:'x = 360° − 220° = 140°.'}]},
     {type:'fill',q:'Three angles on a straight line are 40°, x and 65°. Find x.',steps:[{text:'Add the known angles: 40° + 65° = ___°',blank:true,a:105,hint:'40 + 65.'},{text:'Angles on a straight line add up to 180°.'},{text:'x = 180° − 105° = 75°.'}],sol:'40 + 65 = 105, so x = 180 − 105 = 75°.'},
     {type:'own',q:'Two lines cross. One angle is 35°. What is the angle NEXT to it (on the same straight line)?',a:145,hint:'The two angles sit on a straight line.',sol:'180° − 35° = 145°.',placeholder:'degrees'},
     {type:'own',q:'Parallel lines are crossed by a transversal. One alternate interior angle is 58°. What is the other?',a:58,hint:'Alternate interior angles are equal.',sol:'Alternate interior angles are equal, so it is 58°.',placeholder:'degrees'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Nine different challenges. Pick the ones that interest you, in any order. Some are quick, some are tough. All of them make you think.',

   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Sort the angles',desc:'Put 8 angle cards into the right boxes.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Compare each angle with 90° (a square corner) and 180° (a straight line).',bins:[{id:'acute',label:'Acute',hint:'less than 90°'},{id:'right',label:'Right',hint:'exactly 90°'},{id:'obtuse',label:'Obtuse',hint:'90° to 180°'},{id:'straight',label:'Straight',hint:'exactly 180°'},{id:'reflex',label:'Reflex',hint:'more than 180°'}],items:[35,90,150,180,220,75,300,120].map(function(v){return{label:v+'°',say:'Angle of '+v+' degrees',svg:angleIcon(v),bin:angleKind(v)}})}},
    {icon:'🃏',title:'Match it',desc:'Match each angle pair or line type to its description.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Corresponding angles','F shape, equal'],['Alternate interior angles','Z shape, equal'],['Co-interior angles','C shape, add to 180°'],['Vertically opposite angles','X shape, equal'],['Perpendicular lines','meet at 90°'],['Parallel lines','never meet']]}},
    {icon:'📏',title:'Order it!',desc:'Put angles in order of size. Work each one out first!',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the size of each angle, then tap them from smallest to largest.',rounds:[[{label:'a right angle',v:90,show:'90°'},{label:'three-quarters of a turn',v:270,show:'270°'},{label:'half a turn',v:180,show:'180°'},{label:'one-eighth of a turn',v:45,show:'45°'}],[{label:'the angle on a straight line with 30°',v:150,show:'150°'},{label:'the angle vertically opposite 75°',v:75,show:'75°'},{label:'the co-interior partner of 100°',v:80,show:'80°'},{label:'the angles around a point with 300°',v:60,show:'60°'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement about angles is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Two acute angles add up to less than 180°.',a:'always',why:'Each acute angle is less than 90°, so two of them total less than 180°.'},{s:'An obtuse angle and an acute angle add up to 180°.',a:'sometimes',why:'120° + 60° = 180°, but 120° + 30° = 150°.',hint:'Try 120° with two different acute angles.'},{s:'Vertically opposite angles are equal.',a:'always',why:'They are always equal, whatever angle the lines cross at.'},{s:'Co-interior angles are equal.',a:'sometimes',why:'They add up to 180°, so they are only equal when both are 90° (a perpendicular transversal).',hint:'What if the transversal crosses at 90°?'},{s:'Perpendicular lines are parallel.',a:'never',why:'Perpendicular lines meet at 90°; parallel lines never meet.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Shane',q:'One angle on a straight line is 130°. Find the other.',lines:['Angles on a straight line add up to 360°','x = 360° − 130° = 230°'],wrong:0,reasons:['Angles on a straight line add up to 180°, not 360°','He subtracted the wrong way','130° is not a real angle'],reason:0,fix:'x = 180° − 130° = 50°.'},{who:'Kerry-Ann',q:'One co-interior angle is 70°. Find the other.',lines:['Co-interior angles are equal','so the other angle is 70°'],wrong:0,reasons:['Co-interior angles add up to 180°','She should have used 360°','Co-interior angles are always 90°'],reason:0,fix:'180° − 70° = 110°.'},{who:'Ryan',q:'Name an angle of 200°.',lines:['200° is more than 90°','so it is an obtuse angle'],wrong:1,reasons:['Obtuse angles stop at 180°; 200° is reflex','200° is acute','200° is a right angle'],reason:0,fix:'200° is between 180° and 360°, so it is a reflex angle.'}]}},
    {icon:'🛣️',title:'Transversal challenge',desc:'Name the angle pair and find the missing angle. Get 3 right.',level:'⭐⭐⭐ Skill builder',mins:6,block:{type:'custom',html:'<div class="scene"><svg viewBox="0 0 650 390" role="img" id="tchalSvg" aria-label="Parallel lines and a transversal with one known angle and one unknown angle"><g id="tchalG"></g></svg></div>  <p id="tchalPrompt" class="explain" aria-live="polite"></p>  <div class="controls"><label for="tchalRel">Relationship:</label><select id="tchalRel"><option value="">Choose…</option><option value="corresponding">Corresponding</option><option value="alternate">Alternate interior</option><option value="co">Co-interior</option><option value="opposite">Vertically opposite</option></select>  <label for="tchalAns">Pink angle:</label><input id="tchalAns" type="number" min="0" max="360" inputmode="numeric" placeholder="degrees"></div>  <div class="controls"><button type="button" class="go" id="tchalCheck">Check my answer</button><button type="button" id="tchalHint">Give me a hint</button><button type="button" id="tchalNew">New challenge</button></div>  <div class="fb" id="tchalFb" aria-live="polite">Look at where the two angles sit: between the parallel lines or outside them? Same side of the transversal or opposite sides?</div>  <p>Correct so far: <strong id="tchalScore">0</strong> of 3</p>',init:function(box,api){
const PAIRS={corresponding:[['topUR','bottomUR'],['topUL','bottomUL'],['topLL','bottomLL'],['topLR','bottomLR']],alternate:[['topLL','bottomUR'],['topLR','bottomUL']],co:[['topLR','bottomUR'],['topLL','bottomUL']],opposite:[['topUR','topLL'],['topUL','topLR'],['bottomUR','bottomLL'],['bottomUL','bottomLR']]};
const RULE={corresponding:'Corresponding angles are equal.',alternate:'Alternate interior angles are equal.',co:'Co-interior angles add up to 180°.',opposite:'Vertically opposite angles are equal.'};
const WHERE={corresponding:'They are in the same position at each crossing.',alternate:'Both are between the parallel lines, on opposite sides of the transversal (a Z shape).',co:'Both are between the parallel lines, on the same side of the transversal (a C shape).',opposite:'They are at the same crossing, facing each other.'};
let ch=null,chScore=0,chHint=0;
function newChal(){const t=30+5*rand(10),types=Object.keys(PAIRS),type=types[rand(4)],pr=PAIRS[type][rand(PAIRS[type].length)],sw=rand(2),known=pr[sw],unknown=pr[1-sw];ch={t,type,known,unknown,ans:tSize(unknown,t),kv:tSize(known,t)};chHint=0;const hi={};hi[known]='known';hi[unknown]='unknown';const labels={};labels[known]=ch.kv+'°';labels[unknown]='?';$('tchalG').innerHTML=transInner(t,hi,k=>labels[k]||'');$('tchalPrompt').textContent='The gold angle is '+ch.kv+'°. Find the pink angle marked ?.';$('tchalRel').value='';$('tchalAns').value='';$('tchalFb').className='fb';$('tchalFb').textContent='Look at where the two angles sit: between the parallel lines or outside them? Same side of the transversal or opposite sides?';$('tchalHint').disabled=false}
$('tchalNew').onclick=newChal;
$('tchalHint').onclick=()=>{const H=['Where are the angles? '+WHERE[ch.type],'Rule: '+RULE[ch.type],'Answer: '+(ch.type==='co'?'180° − '+ch.kv+'° = '+ch.ans+'°':ch.ans+'°, the same as the gold angle')+'. Try a new challenge to practise on your own.'];$('tchalFb').className='fb';$('tchalFb').textContent='Hint '+(chHint+1)+': '+H[chHint];chHint++;if(chHint>=3)$('tchalHint').disabled=true};
$('tchalCheck').onclick=()=>{const rel=$('tchalRel').value,v=$('tchalAns').value;const fb=$('tchalFb');if(!rel||v===''){fb.className='fb no';fb.textContent='Choose a relationship and type an angle first.';return}const relOk=rel===ch.type,numOk=+v===ch.ans;if(relOk&&numOk){chScore++;$('tchalScore').textContent=chScore;fb.className='fb ok';fb.textContent='✓ Correct! '+RULE[ch.type]+(chScore>=3?' Challenge complete! Keep practising if you like.':' Press New challenge for the next one.');if(chScore>=3)api.complete()}else if(!relOk&&numOk){fb.className='fb no';fb.textContent='Your angle is right, but check the name. '+WHERE[ch.type]}else if(relOk){fb.className='fb no';fb.textContent='Good, the relationship is right! Now use the rule: '+RULE[ch.type]}else{fb.className='fb no';fb.textContent='Not yet. Start with the position: are the angles inside the parallel lines? On the same side of the transversal?'}};
newChal();}}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire angle questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=Math.floor(Math.random()*3);if(r===0){var v=[R(5,85),90,R(95,175),180,R(185,355)][R(0,4)],k=angleKind(v),N=['acute','right','obtuse','straight','reflex'];var o=[k],rest=N.filter(function(x){return x!==k});o.push(rest[R(0,1)]);o.push(rest[R(2,3)]);return{q:'What type of angle is '+v+'°?',o:o,a:0,why:v+'° is '+k+'.'}}if(r===1){var a=R(20,160);return{q:'One angle on a straight line is '+a+'°. The other is…',o:[(180-a)+'°',(360-a)+'°',(90-a>0?90-a:a+10)+'°'],a:0,why:'180° − '+a+'° = '+(180-a)+'°.'}}var x=R(60,150),y=R(60,150);return{q:'Angles around a point: '+x+'°, '+y+'° and a third angle. The third is…',o:[(360-x-y)+'°',(180-x-y>0?180-x-y:360-x-y+10)+'°',(360-x)+'°'],a:0,why:'360° − '+x+'° − '+y+'° = '+(360-x-y)+'°.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent angles that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type an obtuse angle that is a multiple of 25.',placeholder:'degrees',check:function(v,num){var x=num(String(v).replace('°',''));if(isNaN(x))return{ok:false,msg:'Type a number of degrees.'};if(x>90&&x<180&&x%25===0)return{ok:true,msg:'Yes! '+x+'° is obtuse and a multiple of 25. (The possible answers are 100°, 125°, 150° and 175°.)'};if(x%25!==0)return{ok:false,msg:'That is not a multiple of 25.'};return{ok:false,msg:'That is not obtuse. Obtuse angles are between 90° and 180°.'}}},{q:'Type two angles that add up to 180° (supplementary). For example: 120, 60',placeholder:'angle, angle',check:function(v){var n=String(v).replace(/°/g,'').split(',').map(Number);if(n.length!==2||n.some(isNaN)||n.some(function(x){return x<=0}))return{ok:false,msg:'Type two positive angles separated by a comma.'};if(n[0]+n[1]===180)return{ok:true,msg:'Correct! '+n[0]+'° + '+n[1]+'° = 180°. They could sit together on a straight line.'};return{ok:false,msg:'They add up to '+(n[0]+n[1])+'°. You need 180°.'}}},{q:'Type a reflex angle that is less than 200°.',placeholder:'degrees',check:function(v,num){var x=num(String(v).replace('°',''));if(x>180&&x<200)return{ok:true,msg:'Yes! '+x+'° is more than 180° (reflex) and less than 200°.'};return{ok:false,msg:'Reflex angles are more than 180°. You need one between 180° and 200°.'}}}]}},
    {icon:'🚦',title:'Mission: the Spanish Town junction',desc:'Help road engineers plan a new junction.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Road engineers are planning a junction in Spanish Town. Two parallel streets, Street A and Street B, are crossed by a new diagonal road. Help them work out the angles they need to paint the road markings.',svg:transMini(65,{topUR:'known',bottomUR:'unknown'},{topUR:'65°',bottomUR:'?'}),parts:[{q:'The diagonal road meets Street A at 65°. What is the corresponding angle at Street B (the pink angle)?',a:65,hint:'Corresponding angles on parallel lines are equal.',sol:'Corresponding angles are equal, so it is 65°.',placeholder:'degrees'},{q:'What is the angle on the other side of the diagonal road, along the same straight line of Street A?',a:115,hint:'Angles on a straight line add up to 180°.',sol:'180° − 65° = 115°.',placeholder:'degrees'},{q:'A traffic sign on a pole can turn three-quarters of a full turn. How many degrees is that?',a:270,hint:'A full turn is 360°. Find three-quarters of it.',sol:'¾ × 360° = 270°.',placeholder:'degrees'},{q:'A footpath is built perpendicular to Street A. What angle does it make with Street A?',a:90,hint:'Perpendicular means meeting at a right angle.',sol:'Perpendicular lines meet at 90°.',placeholder:'degrees'},{q:'The footpath and the diagonal road both start at the same point on Street A, on the same side. What angle is between the footpath and the diagonal road?',a:25,hint:'The footpath is at 90° to the street and the diagonal road is at 65°.',sol:'90° − 65° = 25°.',placeholder:'degrees'}],done:'You used corresponding angles, straight-line angles, turns and right angles to plan a real junction.'}}

  {phase:'elaborate',name:'Real-life problems',title:'Angles in real life: choose your challenge',lead:'Builders, road engineers and carpenters across Jamaica use angle facts every day. Pick a level and solve their problems.',

   blocks:[{type:'problems',star:true,need:2,levels:{bronze:[{c:'A side road leaves Spanish Town Road, which is straight. The angle on one side of the side road is 125°.',svg:fan([{v:125,l:'125°'},{v:55,l:'x',hi:1}]),q:'Find angle x.',a:55,h:['The two angles sit on a straight road. What do angles on a straight line add up to?','x + 125° = 180°'],sol:'x = 180° − 125° = 55°'},{c:'Two straight footpaths cross in Hope Gardens. One of the angles they make is 47°.',svg:crossMini(47,0,2),q:'Find angle x, which is opposite the 47° angle.',a:47,h:['The angles face each other across the crossing point. What do we call them?','Vertically opposite angles are equal.'],sol:'x = 47° (vertically opposite angles are equal)'}],silver:[{c:'Three roads meet at a point in Half Way Tree. Two of the angles between the roads are 110° and 140°.',svg:fan([{v:110,l:'110°'},{v:140,l:'140°'},{v:110,l:'x',hi:1}],true),q:'Find angle x.',a:110,h:['The angles go all the way around one point. What do they add up to?','110° + 140° + x = 360°'],sol:'x = 360° − 250° = 110°'},{c:'A carpenter in Mandeville fixes two braces to a straight beam. The angles along the beam are 40°, x and 65°.',svg:fan([{v:40,l:'40°'},{v:75,l:'x',hi:1},{v:65,l:'65°'}]),q:'Find angle x.',a:75,h:['All three angles sit on the straight beam. What do they add up to?','40° + x + 65° = 180°'],sol:'x = 180° − 105° = 75°'}],gold:[{c:'Two parallel streets in downtown Kingston are crossed by a diagonal road. One angle is 72°.',svg:transMini(72,{topUR:'known',bottomUL:'unknown'},{topUR:'72°',bottomUL:'x'}),q:'Find angle x.',a:108,h:['First find the angle at the bottom crossing that corresponds to 72°.','That angle and x sit together on a straight line, so they add up to 180°.'],sol:'Corresponding angle = 72°, so x = 180° − 72° = 108°'},{c:'A road surveyor marks two angles on a straight kerb. One angle is twice the size of the other.',svg:fan([{v:120,l:'2x'},{v:60,l:'x',hi:1}]),q:'Find the value of x.',a:60,h:['The angles are on a straight
