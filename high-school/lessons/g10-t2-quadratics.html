     init:function(box,api){var A=box.querySelector('#qsA'),B=box.querySelector('#qsB'),C=box.querySelector('#qsC');[A,B,C].forEach(function(e){api.nudges(e)});function draw(){var a=+A.value,b=+B.value,c=+C.value,D=b*b-4*a*c,h=b/(2*a),k=c-b*b/(4*a),roots=D<0?[]:[(-b-Math.sqrt(D))/(2*a),(-b+Math.sqrt(D))/(2*a)],fac='—';box.querySelector('.qsAO').textContent=a;box.querySelector('.qsBO').textContent=fq(b);box.querySelector('.qsCO').textContent=fq(c);if(D>=0&&Number.isInteger(Math.sqrt(D))){fac='The roots are rational, so it factorises: x = '+roots.map(fq).join(' or x = ')}else fac='Does not factorise with whole numbers.';box.querySelector('.qsSvg').innerHTML=QGR(a,b,c,roots);box.querySelector('.qsOut').innerHTML='<strong>'+QE(a,b,c)+' = 0</strong><br><strong>1. Factorisation:</strong> '+fac+'<br><strong>2. Completing the square:</strong> '+QE(a,b,c)+' = '+(a===1?'':a)+'(x '+(h<0?'− '+fq(-h):'+ '+fq(h))+')² '+(k<0?'− '+fq(-k):'+ '+fq(k))+'<br><strong>3. Formula:</strong> discriminant b² − 4ac = '+fq(D)+(D>0?' (positive: two roots)':D===0?' (zero: one repeated root)':' (negative: no real roots)')+(D>=0?'; x = '+roots.map(fq).filter(function(z,i,arr){return arr.indexOf(z)===i}).join(' or x = '):'')}[A,B,C].forEach(function(e){e.addEventListener('input',draw)});function nums(v){return String(v).replace(/−/g,'-').replace(/x=|or|and/gi,',').split(/[,\s]+/).filter(function(z){return z!==''}).map(Number).sort(function(p,q){return p-q})}var T=[{t:'Solve x² − 5x + 6 = 0. (Type both roots, like 2, 3.)',ok:function(v){var n=nums(v);return n.length===2&&n[0]===2&&n[1]===3}},{t:'Write x² + 6x + 5 as (x + h)² + k. What is k?',ok:function(v){return parseFloat(v.replace(/−/g,'-'))===-4}},{t:'Solve x² + 2x − 4 = 0, to 2 decimal places. (Type both roots.)',ok:function(v){var n=nums(v);return n.length===2&&Math.abs(n[0]+3.24)<0.006&&Math.abs(n[1]-1.24)<0.006}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.qsN').textContent='All done';box.querySelector('.qsQ').textContent='You completed every challenge!';box.querySelector('.qsC').disabled=true;return}box.querySelector('.qsN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.qsQ').textContent=T[q].t}box.querySelector('.qsC').onclick=function(){var v=String(box.querySelector('.qsIn').value).trim(),fb=box.querySelector('.qsFb');if(T[q].ok(v)){fb.className='fb ok qsFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.qsIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no qsFb';fb.textContent='Not yet. Set a, b and c to match, and read the results.'}};draw();task()}},
    {type:'recall',text:'The garden is 5 m wide: x(x + 3) = 40 gives x² + 3x − 40 = 0, so (x + 8)(x − 5) = 0. x = −8 is impossible for a width, so x = 5 m (and the length is 8 m).'}]},
  {phase:'explain',name:'Teach: factorisation and completing the square',title:'Learn: solving by factorisation and by completing the square',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Mek it equal zero first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Solving by factorisation',explain:'<p>A {{quadratic equation|an equation where the highest power of x is 2}} has an x² term. To solve one by factorising, everything rests on one simple fact, the {{zero-product rule|if A × B = 0, then A = 0 or B = 0}}: <strong>if two things multiply to give 0, at least one of them must be 0</strong>.</p><p>So the method is: <strong>1.</strong> Rearrange so one side is 0. <strong>2.</strong> Factorise. <strong>3.</strong> Set each factor equal to 0 and solve. A quadratic usually has two solutions, called {{roots|the solutions of a quadratic equation}}.</p><p>For the garden: x(x + 3) = 40 becomes x² + 3x − 40 = 0, which factorises to (x + 8)(x − 5) = 0. So x = −8 or x = 5. A width cannot be negative, so the width is 5 m.</p>',
     example:{q:'Solve x² − 7x = 0 and 2x² + x − 6 = 0.',steps:[{do:'x² − 7x = 0: factorise to x(x − 7) = 0, so x = 0 or x = 7.',why:'Do not divide by x; you would lose the root 0.'},{do:'2x² + x − 6 = 0: ac = −12, numbers 4 and −3: 2x² + 4x − 3x − 6 = 2x(x + 2) − 3(x + 2) = (2x − 3)(x + 2).'},{do:'So x = 3/2 or x = −2.'}]},
     mistake:'Factorising when the equation does not equal 0. For (x − 2)(x − 3) = 6, you must expand and rearrange first.',
     check:{q:'Solve (x − 4)(x + 1) = 0.',o:['x = 4 or x = −1','x = −4 or x = 1','x = 4 only'],a:0,why:'Each factor equals 0.',hint:'Set each bracket to 0.'}},
    {title:'Completing the square',explain:'<p>Some expressions are {{perfect squares|expressions like (x + 3)² = x² + 6x + 9}}: (x + 3)² = x² + 6x + 9. Notice that the 3 is <strong>half of the 6</strong>. That pattern lets us rewrite any quadratic in the form <strong>a(x + h)² + k</strong>, called {{completing the square|rewriting ax² + bx + c as a(x + h)² + k}}.</p><p>For x² + 6x + 5: halve the 6 to get 3, and write (x + 3)². But (x + 3)² = x² + 6x + 9, which is 4 too many, so subtract 4: <strong>x² + 6x + 5 = (x + 3)² − 4</strong>.</p><p>The general recipe for x² + bx + c: <strong>(x + b/2)² − (b/2)² + c</strong>. If a ≠ 1, take a out of the first two terms first: 2x² + 12x + 7 = 2(x² + 6x) + 7 = 2[(x + 3)² − 9] + 7 = 2(x + 3)² − 11.</p>',
     example:{q:'Write x² − 8x + 3 in the form (x + h)² + k.',steps:[{do:'Halve −8: −4. So start with (x − 4)², which is x² − 8x + 16.'},{do:'We need +3, not +16, so subtract 13: (x − 4)² − 13.'},{do:'So h = −4 and k = −13.'}]},
     mistake:'Forgetting to subtract the square of half: x² + 6x + 5 is NOT (x + 3)² + 5.',
     check:{q:'Write x² + 10x + 30 as (x + h)² + k.',o:['(x + 5)² + 5','(x + 10)² + 30','(x + 5)² + 30'],a:0,why:'(x + 5)² = x² + 10x + 25; 30 − 25 = 5.',hint:'Halve 10, then adjust.'}},
    {title:'Solving by completing the square',explain:'<p>Completing the square gives a second way to solve quadratics, and it works even when factorising fails.</p><p><strong>1.</strong> Complete the square. <strong>2.</strong> Get the bracket on its own. <strong>3.</strong> Square-root both sides, remembering <strong>±</strong>. <strong>4.</strong> Solve for x.</p><p>For x² + 6x + 5 = 0: (x + 3)² − 4 = 0, so (x + 3)² = 4. Square-root: x + 3 = ±2. So x = −1 or x = −5. The ± matters: both 2² and (−2)² equal 4.</p><p>When the number is not a perfect square, the roots are irrational; give them in surd form or to the decimal places asked.</p>',
     example:{q:'Solve x² − 4x − 1 = 0 by completing the square, to 2 decimal places.',steps:[{do:'(x − 2)² − 4 − 1 = 0, so (x − 2)² = 5.'},{do:'x − 2 = ±√5, so x = 2 ± √5.'},{do:'x ≈ 2 + 2.236 = 4.24 or x ≈ 2 − 2.236 = −0.24.'}]},
     mistake:'Forgetting the ± and finding only one root.',
     check:{q:'Solve (x − 1)² = 9.',o:['x = 4 or x = −2','x = 4 only','x = 10 or x = −8'],a:0,why:'x − 1 = ±3.',hint:'Remember ±.'}}]}]},
  {phase:'explain',name:'Teach: the formula and applications',title:'Learn: the quadratic formula, worded problems, and linear–quadratic pairs',lead:'Next, the formula that always works, and using quadratics to solve real problems.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Di formula always work.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The quadratic formula',explain:'<p>The {{quadratic formula|x = (−b ± √(b² − 4ac)) / 2a}} solves any quadratic equation ax² + bx + c = 0:</p><p><strong>x = (−b ± √(b² − 4ac)) / 2a</strong></p><p>It comes from completing the square on the general equation, and it is given on the CSEC formula sheet. Write down a, b and c carefully, <strong>including their signs</strong>, then substitute using brackets.</p><p>The part under the square root, <strong>b² − 4ac</strong>, is the {{discriminant|b² − 4ac: it tells you how many real roots there are}}. If it is positive, there are two roots. If it is zero, there is one (repeated) root. If it is negative, there are no real roots, because you cannot square-root a negative number. On a graph, those are the cases where the parabola crosses the x-axis twice, touches it once, or misses it.</p>',visual:QGR(1,2,-4,[-3.236,1.236]),
     example:{q:'Solve 2x² − 3x − 4 = 0, to 2 decimal places.',steps:[{do:'a = 2, b = −3, c = −4. Discriminant: (−3)² − 4(2)(−4) = 9 + 32 = 41.'},{do:'x = (3 ± √41)/4.'},{do:'x ≈ (3 + 6.403)/4 = 2.35 or x ≈ (3 − 6.403)/4 = −0.85.'}]},
     mistake:'Getting the sign of −b wrong. If b = −3, then −b = +3.',
     check:{q:'For x² + 4x + 5 = 0, the discriminant is…',o:['−4: no real roots','36: two roots','0: one root'],a:0,why:'16 − 20 = −4.',hint:'b² − 4ac.'}},
    {title:'Worded problems with quadratics',explain:'<p>Many real problems lead to quadratic equations: areas of rectangles, consecutive numbers, the path of a ball, or profit. The steps are the same as for linear problems: define the unknown, form the equation, solve, then interpret.</p><p>The extra step for quadratics: you often get <strong>two answers</strong>, and you must decide whether both make sense. A length, a number of people or a time cannot usually be negative, so <strong>reject</strong> answers that are impossible in the situation, and say why.</p>',
     example:{q:'The product of two consecutive positive integers is 132. Find them.',steps:[{do:'Let them be n and n + 1: n(n + 1) = 132, so n² + n − 132 = 0.'},{do:'Factorise: (n + 12)(n − 11) = 0, so n = −12 or n = 11.'},{do:'The integers are positive, so reject −12. The integers are 11 and 12. Check: 132 ✓'}]},
     mistake:'Keeping an impossible answer, such as a negative width. Always check each root against the situation.',
     check:{q:'A square has area 64 cm². x² = 64 gives x = ±8. What is the side length?',o:['8 cm','−8 cm','8 cm or −8 cm'],a:0,why:'A length cannot be negative.',hint:'Can a side be negative?'}},
    {title:'A linear and a quadratic equation together',explain:'<p>Sometimes you must solve two equations together where one is linear and the other quadratic, such as y = x + 1 and y = x² − 1. On a graph, that is where a straight line crosses a parabola: there can be two crossing points, one, or none.</p><p>Use <strong>substitution</strong>. Rearrange the linear equation to get one letter alone if needed, substitute it into the quadratic, and you get a quadratic in one unknown. Solve it, then find the matching values of the other letter from the <strong>linear</strong> equation.</p><p>The answer comes in pairs: each x goes with its own y.</p>',
     example:{q:'Solve y = x + 1 and y = x² − 1.',steps:[{do:'Substitute: x² − 1 = x + 1, so x² − x − 2 = 0.'},{do:'Factorise: (x − 2)(x + 1) = 0, so x = 2 or x = −1.'},{do:'From y = x + 1: x = 2 gives y = 3; x = −1 gives y = 0. Solutions: (2, 3) and (−1, 0).'}]},
     mistake:'Finding the x values but not the y values. Each solution is a PAIR (x, y).',
     check:{q:'Solve y = 2x and y = x² by substitution. Which is one solution?',o:['(2, 4)','(4, 2)','(1, 1)'],a:0,why:'x² = 2x gives x = 0 or 2; x = 2 gives y = 4.',hint:'x² − 2x = 0.'}}]}]},
