     init:function(box,api){var E=[[1,5,12],[2,3,11],[3,4,19]],k=api.get('k')||0,a,b,c,log;function load(){if(k>=E.length){box.querySelector('.bsN').textContent='All done';box.querySelector('.bsQ').textContent='You solved every equation with the balancing method!';['.bs1','.bsAll','.bsDiv','.bsR'].forEach(function(s){box.querySelector(s).disabled=true});return}a=E[k][0];b=E[k][1];c=E[k][2];log=[];box.querySelector('.bsN').textContent='Equation '+(k+1)+' of 3';box.querySelector('.bsQ').textContent='Solve '+(a>1?a:'')+'x + '+b+' = '+c+'.';draw('Both sides balance. Remove things carefully, doing the same to both sides.')}function draw(msg){box.querySelector('.bsSvg').innerHTML=SCALE(a,b,c,'Balance with '+a+' x boxes and '+b+' balls on the left, '+c+' balls on the right');box.querySelector('.bsX').innerHTML=msg+(log.length?'<br><strong>Your steps:</strong> '+log.join(' → '):'')}box.querySelector('.bs1').onclick=function(){if(b<1){draw('There are no loose balls on the left to take away.');return}b--;c--;log.push('−1 both sides');draw('You took 1 ball from each side. Still balanced!');check()};box.querySelector('.bsAll').onclick=function(){if(b<1){draw('There are no loose balls on the left to take away.');return}var t=b;c-=t;b=0;log.push('−'+t+' both sides');draw('You took '+t+' balls from each side. Still balanced!');check()};box.querySelector('.bsDiv').onclick=function(){if(b>0){draw('First remove the loose balls from the left, so only x boxes are left. Otherwise you cannot share fairly.');return}if(a===1){draw('There is already just one box. You have found x!');return}var t=a;c=c/t;a=1;log.push('÷'+t+' both sides');draw('You shared each side into '+t+' equal groups and kept one group. Still balanced!');check()};box.querySelector('.bsR').onclick=load;function check(){if(a===1&&b===0){var x=c;draw('🎉 One box balances '+x+' balls, so <strong>x = '+x+'</strong>. Check: '+(E[k][0]>1?E[k][0]+' × ':'')+x+' + '+E[k][1]+' = '+E[k][2]+' ✓');k++;api.set('k',k);if(k===E.length)api.complete();setTimeout(load,2200)}}load()}},

  {phase:'explain',name:'Teach: expressions and like terms',title:'Learn: rules, the language of algebra, and like terms',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Algebra a jus maths wid letter fi di number weh change.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Using letters for quantities that change',explain:'<p>Think about the hurricane kit. For 1 person, the family needs 12 litres of water. For 2 people, 24 litres. For 5 people, 60 litres. The number of people changes from family to family, but the <em>rule</em> stays the same: multiply the number of people by 12.</p><p>Instead of writing a new sentence every time, we can use a letter to stand for the number that changes. Let p stand for the number of people. Then the water needed is <strong>12 × p</strong>, which we write as <strong>12p</strong>. A letter used like this is called a {{variable|a letter that stands for a number that can change}}, because its value can vary.</p><p>You already know rules like this from arithmetic. Since 3 + 5 = 5 + 3, and 7 + 2 = 2 + 7, the rule for any numbers is a + b = b + a. Using letters lets us write a rule that works for <em>every</em> number at once.</p>',
     example:{q:'Bottles of water cost $80 each. Write a rule for the cost of b bottles, and use it for 6 bottles.',steps:[{do:'The cost is 80 times the number of bottles: C = 80b.',why:'b can be any number of bottles, so it is a variable.'},{do:'For 6 bottles, replace b with 6: C = 80 × 6.'},{do:'C = $480.'}]},
     mistake:'Writing 12 + p instead of 12p. “12 litres for each person” means multiply, not add.',
     check:{q:'Patties cost $250 each. Which expression gives the cost of n patties?',o:['250 + n','250n','n − 250'],a:1,why:'250 for each patty means 250 × n.',hint:'Each patty costs the same, so multiply.'}},
    {title:'The language of algebra',explain:'<p>Algebra has its own vocabulary, a bit like football has words such as “corner” and “offside”. Let’s look at <strong>3x + 5</strong>.</p><p>The letter x is the <strong>variable</strong>. Each separate part, 3x and 5, is called a {{term|one part of an expression, such as 3x or 5}}. The number in front of the letter, 3, is the {{coefficient|the number in front of a letter}}: it tells you how many x’s there are. The 5 on its own is a {{constant|a term with no letter, whose value never changes}}, because it never changes.</p><p>The whole thing, 3x + 5, is an {{expression|terms joined by + or −, with no equals sign}}. An expression is just a phrase; it does not say anything is equal to anything. When you add an equals sign, like 3x + 5 = 20, it becomes an {{equation|a statement that two things are equal}}, a full sentence that can be solved. The signs +, −, × and ÷ are the operations.</p>',
     example:{q:'Name the parts of 7y − 2.',steps:[{do:'Variable: y.'},{do:'Terms: 7y and −2.'},{do:'Coefficient of y: 7. Constant: −2.',why:'The constant keeps its sign.'},{do:'It has no equals sign, so it is an expression, not an equation.'}]},
     mistake:'Calling 4x + 1 an equation. Without an equals sign, it is an expression.',
     check:{q:'In 5a + 9, what is the coefficient of a?',o:['5','9','a'],a:0,why:'The coefficient is the number in front of the letter.',hint:'The number stuck to the letter.'}},
    {title:'Like terms, and simplifying',explain:'<p>Imagine a market stall with 3 bags of mangoes and 4 bags of oranges. Someone adds 2 more bags of mangoes. Now there are 5 bags of mangoes, but still 4 bags of oranges. You cannot combine mangoes and oranges into “9 bags of mango-oranges”!</p><p>Algebra works the same way. {{Like terms|terms with exactly the same letter}} have exactly the same letter, like 3m and 2m: they can be added or subtracted, so 3m + 2m = 5m. {{Unlike terms|terms with different letters, or no letter}}, like 3m and 4p, or 3m and 5, cannot be combined; they stay separate.</p><p>To {{simplify|write an expression more neatly by combining like terms}} an expression, group the like terms together and combine each group. For 3m + 4p + 2m − p: the m terms make 5m, and the p terms make 3p, so it simplifies to 5m + 3p.</p>',
     example:{q:'Simplify 4x + 7 + 2x − 3.',steps:[{do:'Group the like terms: (4x + 2x) + (7 − 3).',why:'The x terms go together, and the constants go together.'},{do:'4x + 2x = 6x, and 7 − 3 = 4.'},{do:'Answer: 6x + 4.',why:'6x and 4 are unlike, so they stay separate.'}]},
     mistake:'Adding unlike terms: 3x + 2 is NOT 5x. A number without a letter cannot join the x terms.',
     check:{q:'Simplify 5a + 3b − 2a.',o:['3a + 3b','6ab','8a − 2a'],a:0,why:'5a − 2a = 3a; 3b stays.',hint:'Only combine the a terms.'}}]}]},
  {phase:'explain',name:'Teach: writing and solving equations',title:'Learn: writing equations, and two ways to solve them',lead:'Next, turning a word problem into an equation, and then solving it.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Wah yuh do to one side, do it to di odda side.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Writing equations from word problems',explain:'<p>Many puzzles in real life can be turned into equations. The trick is to read the problem slowly and translate it, piece by piece, into algebra.</p><p>First, decide what the unknown number is, and give it a letter. Then turn each part of the sentence into maths: “more than” and “added” mean +; “less than” and “taken away” mean −; “times” and “each” mean ×; “shared” means ÷; and “is”, “equals” or “makes” become the equals sign.</p><p>For example: “Kemar thinks of a number, doubles it and adds 5. The answer is 23.” Let the number be n. Doubling it gives 2n. Adding 5 gives 2n + 5. The answer is 23, so the equation is <strong>2n + 5 = 23</strong>.</p>',
     example:{q:'A taxi fare is $150 plus $60 for every kilometre. Tia’s fare was $510. Write an equation for the distance, d km.',steps:[{do:'Unknown: the distance, d.'},{do:'$60 for every km: 60d. Plus $150: 60d + 150.'},{do:'The fare was $510, so 60d + 150 = 510.'}]},
     mistake:'Getting “less than” backwards. “5 less than a number” is n − 5, not 5 − n.',
     check:{q:'“A number multiplied by 4, then 3 is added, makes 31.” Which equation matches?',o:['4n + 3 = 31','4 + 3n = 31','4(n + 3) = 31'],a:0,why:'Multiply by 4 first, then add 3.',hint:'Follow the order of the words.'}},
    {title:'Solving with a flow diagram',explain:'<p>A flow diagram shows what has happened to the unknown number, step by step, like following someone’s footprints.</p><p>For 2n + 5 = 23: start with n. It is <strong>multiplied by 2</strong>, then <strong>5 is added</strong>, and the result is 23. To find n, walk the footprints <strong>backwards</strong>, doing the opposite (the inverse) of each step. Start from 23. The last step was “+ 5”, so undo it: 23 − 5 = 18. Before that was “× 2”, so undo it: 18 ÷ 2 = 9. So n = 9.</p><p>Finally, check by putting 9 back into the original problem: 2 × 9 + 5 = 18 + 5 = 23 ✓.</p>',visual:FLOWD(['n','× 2','+ 5','23'],'Flow diagram: n, times 2, plus 5, makes 23'),
     example:{q:'Solve 3x − 4 = 11 using a flow diagram.',steps:[{do:'Forwards: x → × 3 → − 4 → 11.'},{do:'Backwards from 11: undo − 4 by adding 4: 11 + 4 = 15.',why:'Undo the last step first.'},{do:'Undo × 3 by dividing by 3: 15 ÷ 3 = 5. So x = 5.'},{do:'Check: 3 × 5 − 4 = 11 ✓'}]},
     mistake:'Undoing the steps in the wrong order. Always start from the answer and undo the LAST step first.',
     check:{q:'Solve x ÷ 2 + 3 = 10.',o:['14','6.5','26'],a:0,why:'Undo + 3: 7. Undo ÷ 2: 14.',hint:'Start from 10 and work backwards.'}},
    {title:'The balancing method',explain:'<p>You used the balancing method in the explorer. An equation is like a balanced scale: whatever is on the left weighs exactly the same as whatever is on the right.</p><p>To keep it balanced, there is one golden rule: <strong>whatever you do to one side, you must do to the other side</strong>. You can add, subtract, multiply or divide, as long as you do the same to both sides.</p><p>The aim is to get the letter on its own. For 2x + 3 = 11: first take 3 away from both sides, which leaves 2x = 8. Then divide both sides by 2, which leaves x = 4. Each step keeps the scale perfectly balanced, so the answer must be right. And you can always check it by putting it back in.</p>',visual:SCALE(2,3,11,'A balance scale showing 2x plus 3 equals 11'),
     example:{q:'Solve 4x + 6 = 30 using the balancing method.',steps:[{do:'Subtract 6 from both sides: 4x = 24.',why:'This removes the loose weights from the side with x.'},{do:'Divide both sides by 4: x = 6.',why:'Share each side into 4 equal groups.'},{do:'Check: 4 × 6 + 6 = 30 ✓'}]},
     mistake:'Doing something to only one side, such as subtracting 6 on the left but not on the right. The scale would tip, and the answer would be wrong.',
     check:{q:'Solve 5x − 2 = 18.',o:['4','3.2','20'],a:0,why:'Add 2: 5x = 20. Divide by 5: x = 4.',hint:'Add 2 to both sides first.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Vocabulary',text:'In 3x + 5: x is the variable, 3 is the coefficient, 5 is the constant, 3x and 5 are terms. With an equals sign, it becomes an equation.'},{title:'Like terms',text:'Only like terms combine: 4x + 2x = 6x. Unlike terms stay separate: 6x + 4 cannot be simplified further.'},{title:'Writing equations',text:'Choose a letter for the unknown. “Each” or “times” → ×; “more” → +; “less” → −; “is” → =.'},{title:'Solving',text:'Flow diagram: undo the steps backwards. Balancing: do the same to both sides. Always check your answer.'}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'3x + 2x = 5x.',a:'always',why:'They are like terms: 3 lots of x plus 2 lots of x is 5 lots of x.'},{s:'3x + 2 = 5x.',a:'sometimes',why:'It is only true when x = 1. 3x and 2 are unlike terms, so in general you cannot combine them.',hint:'Try x = 1, then x = 2.'},{s:'An expression has an equals sign.',a:'never',why:'With an equals sign, it is an equation.'},{s:'Doing the same thing to both sides keeps an equation balanced.',a:'always',why:'That is the golden rule of the balancing method. (Except dividing by 0, which is never allowed.)'},{s:'A variable always stands for the same number.',a:'sometimes',why:'In one equation it has a fixed value, but in a rule like C = 80b, b can be any number.',hint:'Think of the cost rule.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Kemar',q:'Simplify 4x + 3.',lines:['4x + 3 = 7x'],wrong:0,reasons:['4x and 3 are unlike terms; it cannot be simplified','It should be 12x','It should be 4x3'],reason:0,fix:'4x + 3 is already as simple as it can be.'},{who:'Sasha',q:'Solve 2x + 4 = 14.',lines:['Subtract 4 from the left: 2x = 14','x = 7'],wrong:0,reasons:['She must subtract 4 from BOTH sides: 2x = 10','She should add 4','She should divide by 4'],reason:0,fix:'2x = 10, so x = 5.'},{who:'Andre',q:'Solve 3x − 5 = 10 with a flow diagram.',lines:['Undo × 3 first: 10 ÷ 3','Then undo − 5'],wrong:0,reasons:['Undo the LAST step first: add 5, then divide by 3','He should multiply by 3','He should subtract 5'],reason:0,fix:'10 + 5 = 15, then 15 ÷ 3 = 5.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire simplifying and solving.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,1);if(r===0){var a=R(2,9),b=R(1,8),c=R(1,9);return{q:'Simplify '+a+'x + '+b+'x + '+c+'.',o:[(a+b)+'x + '+c,(a+b+c)+'x',(a*b)+'x + '+c],a:0,why:'Combine the x terms only.'}}var k=R(2,6),x=R(1,9),m=R(1,10);return{q:'Solve '+k+'x + '+m+' = '+(k*x+m)+'.',o:['x = '+x,'x = '+(x+1),'x = '+(k*x+m-m+1)],a:0,why:'Subtract '+m+', then divide by '+k+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent equations that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Write an equation of the form ax + b = c whose answer is x = 4. (For example: 3x + 2 = 14)',placeholder:'ax + b = c',check:function(v){var m=String(v).replace(/\s/g,'').match(/^(\d*)x\+(\d+)=(\d+)$/);if(!m)return{ok:false,msg:'Type it like 3x + 2 = 14.'};var a=m[1]===''?1:+m[1],b=+m[2],c=+m[3];return a*4+b===c?{ok:true,msg:'Yes! '+a+' × 4 + '+b+' = '+c+'.'}:{ok:false,msg:'With x = 4, the left side is '+(a*4+b)+', not '+c+'.'}}},{q:'Simplify 6p + 4q − 2p + q.',placeholder:'…',check:function(v){var t=String(v).replace(/\s/g,'');return t==='4p+5q'||t==='5q+4p'?{ok:true,msg:'Correct! 6p − 2p = 4p and 4q + q = 5q.'}:{ok:false,msg:'Combine the p terms and the q terms separately. (q means 1q.)'}}},{q:'A disaster kit needs 3 cans of food per person per day. Write an expression for p people for 5 days.',placeholder:'…',check:function(v){var t=String(v).replace(/\s|\*|×/g,'').toLowerCase();return t==='15p'||t==='p15'||t==='3p5'||t==='5p3'||t==='3(5p)'||t==='5(3p)'?{ok:true,msg:'Yes! 3 × 5 = 15 cans per person, so 15p.'}:{ok:false,msg:'How many cans does ONE person need for 5 days?'}}}]}},
    {icon:'🌀',title:'Mission: the disaster kit project',desc:'Plan a hurricane kit for families, as the NSC guide suggests.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'For the school disaster-preparedness project, your group is planning kits for families in your community. Each person needs 4 litres of water a day, and kits must last 3 days.',parts:[{q:'Write an expression for the litres of water for p people for 3 days. (Type it like 12p.)',a:['12p'],hint:'4 litres × 3 days per person.',sol:'12p litres.'},{q:'How many litres for a family of 5?',a:60,hint:'12 × 5.',sol:'60 litres.',placeholder:'litres'},{q:'A kit costs $500 plus $250 per person. The Brown family’s kit cost $2,000. Solve 250p + 500 = 2,000 to find how many people are in the family.',a:6,hint:'Subtract 500, then divide by 250.',sol:'250p = 1,500, so p = 6.'},{q:'Simplify the total batteries for two kits: 4b + 2 + 3b + 6.',a:['7b+8','8+7b'],hint:'Combine the b terms and the numbers.',sol:'7b + 8.'},{q:'The Clarke family has only 18 litres of water. There are 3 of them, needing 4 litres each per day (12 litres a day). How many FULL days will their water last?',a:1,hint:'3 people × 4 litres = 12 litres a day. 18 ÷ 12 = 1.5.',sol:'1.5 days, so only 1 full day. They need more water!'}],done:'You used expressions and equations to plan real disaster kits, just like the NSC project.'}}
