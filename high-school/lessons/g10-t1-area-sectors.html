window.LESSON={
 id:'g10-t1-maths-csec-area',
 grade:10, term:1, subject:'Mathematics', strand:'Measurement',
 title:'Perimeter, Area, Arcs and Sectors',
 goals:['find the perimeter and area of polygons, circles and compound shapes','estimate the area of an irregular shape without a formula','calculate the length of an arc and the perimeter of a sector','calculate the area of a sector of a circle'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Measurement',strand:'Measurement',standard:'Module 1, Measurement: understand that the attributes of geometrical objects can be quantified using measurement; demonstrate the ability to use concepts in measurement to model and solve real-world problems.',
  objectives:['4.3 determine the perimeter of a plane shape;','4.4 calculate the length of an arc of a circle;','4.5 estimate the area of plane shapes;','4.6 calculate the area of polygons and circles;','4.7 calculate the area of a sector of a circle;'],
  focus:'Perimeter and area of polygons, circles and compound shapes; estimating area by counting squares; arc length, sector perimeter and sector area as fractions of a full circle (θ/360°).',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 1, Section 4. Answers using π = 3.14 or π = 22/7 are both accepted.'},
 glossary:[['Perimeter','The total distance around the outside of a shape.'],['Area','The amount of surface a shape covers, measured in square units.'],['Circumference','The perimeter of a circle: C = 2πr or πd.'],['Radius (r)','The distance from the centre of a circle to its edge.'],['Diameter (d)','A straight line through the centre from edge to edge: d = 2r.'],['Arc','Part of the circumference of a circle.'],['Sector','A "pizza slice" of a circle, between two radii and an arc.'],['Arc length','(θ ÷ 360°) × 2πr.'],['Sector area','(θ ÷ 360°) × πr².'],['Compound shape','A shape made by joining simpler shapes.']],
 teacher:{time:'about 70 minutes',flow:[['Engage','8 min','Estimate the area of an irregular pond by counting squares; predict.','Accept a range of estimates.'],['Explore','20 min','Change radius and angle of a sector and watch arc length and area.','Ask: "What fraction of the circle is this sector?"'],['Explain','15 min','Formulas and worked examples, including a compound shape.','Emphasise units: cm for length, cm² for area.'],['Elaborate','15 min','Sort length vs area; Bronze to Gold problems.','Link to tiling, fencing and roofing jobs.'],['Evaluate','12 min','Quiz and reflection.','Look for confusion between r and d.']],

  extension:'Measure a real circular object (a bucket lid or tank cover), calculate its circumference and area, and compare with a tape measure.'},
 steps:[
  {phase:'engage',name:'Estimate the pond',title:'How big is the pond?',lead:'A pond in a Hope Gardens drawing is not a neat shape. How can we find its area without a formula?',

   blocks:[{type:'name'},{type:'svg',alt:'An irregular pond drawn on a grid of 1 metre squares. It covers about 18 to 22 squares.',svg:'<svg viewBox="0 0 400 260"><rect width="400" height="260" fill="#faf8fe"/><g stroke="#d8ccf6" stroke-width="1">'+(function(){var s='';for(var x=40;x<=360;x+=40)s+='<line x1="'+x+'" y1="20" x2="'+x+'" y2="240"/>';for(var y=20;y<=240;y+=40)s+='<line x1="40" y1="'+y+'" x2="360" y2="'+y+'"/>';return s})()+'</g><path d="M90 70 C140 30 230 40 280 70 C340 100 330 170 290 200 C240 235 150 230 110 200 C60 165 50 100 90 70Z" fill="#5b8fd6" fill-opacity=".55" stroke="#2f5fc4" stroke-width="3"/><text x="44" y="256" font-size="13" fill="#3d2a73">Each square = 1 m²</text></svg>'},{type:'mcq',title:'Estimate',questions:[{q:'Count full squares, and pair up part squares. About how big is the pond?',o:['About 8 m²','About 20 m²','About 45 m²'],a:1,why:'Counting full squares and combining partial ones gives roughly 18 to 22 m².',hint:'Count the squares that are mostly blue.'}]},{type:'predict',star:true,q:'A sector is a quarter of a circle. Its area is…',options:['a quarter of the circle\'s area','half of the circle\'s area','the same as the circle\'s area'],after:'You will test it in the Explore phase.'}]},
  {phase:'explore',name:'Sector explorer',title:'Explore: arcs and sectors',lead:'Change the radius and the angle. Watch how the arc length and sector area change.',

    init:function(box,api){var r=box.querySelector('#seR'),a=box.querySelector('#seA');api.nudges(r);api.nudges(a);var P=3.14;var T=[{t:'Make a semicircle with radius 4 cm.',ok:function(R,A){return R===4&&A===180},hint:'A semicircle is half a circle: 180°.'},{t:'Using radius 7 cm, make a sector with an arc length of about 11 cm.',ok:function(R,A){return R===7&&Math.abs(A/360*2*P*R-11)<0.3},hint:'Arc = θ/360 × 2 × 3.14 × 7. Try different angles. The answer is a common angle.'},{t:'Make any sector with an area of about 50 cm² (within 1 cm²).',ok:function(R,A){return Math.abs(A/360*P*R*R-50)<=1},hint:'Sector area = θ/360 × 3.14 × r². Try radius 8 and a quarter circle, or radius 4 and a full circle.'}];var k=api.get('k')||0;function draw(){var R=+r.value,A=+a.value,arc=A/360*2*P*R,ar=A/360*P*R*R,s=13,cx=200,cy=150;box.querySelector('.seRO').textContent=R;box.querySelector('.seAO').textContent=A+'°';var path=api.kit.sector(cx,cy,R*s,0,A);box.querySelector('.seSvg').innerHTML='<svg viewBox="0 0 400 300" role="img" aria-label="Sector of a circle with radius '+R+' cm and angle '+A+' degrees"><rect width="400" height="300" fill="#faf8fe"/><circle cx="'+cx+'" cy="'+cy+'" r="'+R*s+'" fill="none" stroke="#d8ccf6" stroke-width="2" stroke-dasharray="6 5"/><path d="'+path+'" fill="#ffb02e" fill-opacity=".75" stroke="#a85d00" stroke-width="2"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#3d2a73"/><text x="'+(cx+R*s/2-10)+'" y="'+(cy+20)+'" font-size="15" fill="#3d2a73">r = '+R+'</text></svg>';box.querySelector('.seX').innerHTML='This sector is <strong>'+A+'/360</strong> of the circle.<br>Arc length = '+A+'/360 × 2 × 3.14 × '+R+' = <strong>'+arc.toFixed(2)+' cm</strong><br>Sector area = '+A+'/360 × 3.14 × '+R+'² = <strong>'+ar.toFixed(2)+' cm²</strong><br>Perimeter of sector = arc + 2r = <strong>'+(arc+2*R).toFixed(2)+' cm</strong>'}function task(){if(k>=T.length){box.querySelector('.seN').textContent='All done';box.querySelector('.seT').textContent='You completed every challenge!';box.querySelector('.seC').disabled=true;return}box.querySelector('.seN').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.seT').textContent=T[k].t}r.addEventListener('input',draw);a.addEventListener('input',draw);box.querySelector('.seC').onclick=function(){var fb=box.querySelector('.seF');if(T[k].ok(+r.value,+a.value)){fb.className='fb ok seF';fb.textContent='✓ Yes! Well done.';k++;api.set('k',k);task();if(k===T.length)api.complete()}else{fb.className='fb no seF';fb.textContent='Not yet. '+T[k].hint}};draw();task()}},
    {type:'recall',text:'A quarter circle (90°) is 90/360 = ¼ of the circle, so its area is a quarter of the circle\'s area.'}]},
  {phase:'explain',name:'Key words',title:'Key words: measuring shapes',lead:'Flip each card to see the meaning and the formula.',

  {phase:'explain',name:'Formulas and examples',title:'Formulas and worked examples',lead:'The key idea for arcs and sectors: work out what fraction of the circle you have.',

   patois:'Find di fraction a di circle first.',
   blocks:[{type:'facts',facts:[{text:'Lengths are in cm or m. Areas are in cm² or m².'},{text:'A sector with angle θ is θ/360 of the whole circle.'},{text:'Arc length = (θ/360) × 2πr.   Sector area = (θ/360) × πr².'},{text:'Perimeter of a sector = arc length + 2r (do not forget the two straight edges).'}]},
    {type:'examples',star:true,examples:[{q:'Find the arc length of a sector with radius 21 cm and angle 60°. Use π = 22/7.',steps:['Fraction of the circle: 60/360 = 1/6.','Full circumference = 2 × 22/7 × 21 = 132 cm.','Arc length = 1/6 × 132 = 22 cm.']},{q:'Find the area of a sector with radius 6 cm and angle 120°. Use π = 3.14.',steps:['Fraction of the circle: 120/360 = 1/3.','Area of the full circle = 3.14 × 6² = 3.14 × 36 = 113.04 cm².','Sector area = 1/3 × 113.04 = 37.68 cm².']},{q:'A garden is a 10 m by 6 m rectangle with a semicircle on one 6 m end. Find its area. Use π = 3.14.',steps:['Rectangle: 10 × 6 = 60 m².','Semicircle: diameter 6 m, so radius 3 m. Area = ½ × 3.14 × 3² = 14.13 m².','Total area = 60 + 14.13 = 74.13 m².']}]}]},
  {phase:'elaborate',name:'Length or area?',title:'Sort: length or area?',lead:'Is each job asking for a length (perimeter) or an area?',

  {phase:'elaborate',name:'Real-life problems',title:'Measuring in real life: choose your challenge',lead:'Builders, farmers and designers measure every day. Use π = 3.14 or 22/7. Pick a level.',
   mission:['Choose Bronze, Silver or Gold.','Use the hints if you are stuck.','Solve any 2 problems for a star.'],
   patois:'Pick yuh level. Remember yuh unit dem.',
   blocks:[{type:'problems',star:true,need:2,levels:{
    bronze:[{c:'A rectangular school garden in Portland is 12 m long and 8 m wide.',q:'How much fencing is needed to go around it, in metres?',a:40,h:['Perimeter = 2 × (length + width).','2 × (12 + 8) = ?'],sol:'2 × (12 + 8) = 40 m.',placeholder:'metres'},{c:'A triangular banner has a base of 10 cm and a height of 6 cm.',q:'Find its area in cm².',a:30,h:['Area of a triangle = ½ × base × height.','½ × 10 × 6 = ?'],sol:'½ × 10 × 6 = 30 cm².',placeholder:'cm²'}],
    silver:[{c:'A circular water tank cover in St. Elizabeth has a diameter of 1.4 m.',q:'Find its circumference, in metres.',a:4.4,tol:0.06,h:['C = πd.','3.14 × 1.4 or 22/7 × 1.4.'],sol:'C = πd ≈ 3.14 × 1.4 = 4.396 m (or 4.4 m using 22/7).',placeholder:'metres'},{c:'A circular fountain in a Kingston park has a radius of 5 m.',q:'Find the area of the fountain, in m².',a:78.5,tol:0.6,h:['A = πr².','3.14 × 5 × 5.'],sol:'A = 3.14 × 25 = 78.5 m².',wrong:'Check that you used the radius (5 m) and squared it.',placeholder:'m²'}],
    gold:[{c:'A slice of a round cake has a radius of 14 cm and an angle of 45°.',q:'Find the perimeter of the slice (the arc plus the two straight edges), in cm.',a:39,tol:0.1,h:['Arc = 45/360 × 2 × 22/7 × 14 = 11 cm.','Add the two radii: 11 + 14 + 14.'],sol:'Arc = 11 cm, so the perimeter = 11 + 28 = 39 cm.',wrong:'Did you remember to add both straight edges (2r)?',placeholder:'cm'},{c:'A lawn sprinkler waters a sector of radius 9 m through an angle of 80°.',q:'Find the area watered, in m². Use π = 3.14.',a:56.52,tol:0.1,h:['Fraction = 80/360 = 2/9.','Area = 2/9 × 3.14 × 81.'],sol:'Area = 80/360 × 3.14 × 9² = 56.52 m².',placeholder:'m²'}]}}]},
  {phase:'evaluate',name:'Check your understanding',title:'Check your understanding',lead:'8 questions. If you get one wrong, you get a hint and a second try.',
   mission:['Read each question carefully.','If it is wrong, read the hint and try again.','At the end, see which parts to review.'],
   patois:'Tek yuh time. Read di hint if yuh need it.',
   blocks:[{type:'quiz',star:true,questions:[{q:'Area is measured in…',o:['cm','cm²','cm³'],a:1,hint:'Area covers a surface: square units.',why:'Area uses square units, like cm².',review:3},{q:'The circumference of a circle with radius 7 cm (π = 22/7) is…',o:['22 cm','44 cm','154 cm'],a:1,hint:'C = 2πr.',why:'2 × 22/7 × 7 = 44 cm.',review:4},{q:'The area of a circle with radius 7 cm (π = 22/7) is…',o:['44 cm²','154 cm²','308 cm²'],a:1,hint:'A = πr².',why:'22/7 × 49 = 154 cm².',review:4},{q:'A sector has angle 90°. What fraction of the circle is it?',o:['1/2','1/4','1/90'],a:1,hint:'90 ÷ 360.',why:'90/360 = 1/4.',review:1},{q:'The arc length of a 180° sector with radius 7 cm (π = 22/7) is…',o:['22 cm','44 cm','77 cm'],a:0,hint:'Half the circumference.',why:'½ × 44 = 22 cm.',review:4},{q:'The perimeter of a sector equals…',o:['arc length only','arc length + 2r','2πr'],a:1,hint:'Walk all the way around the slice.',why:'Two straight edges (radii) plus the curved arc.',review:4},{q:'Tiling a floor needs…',o:['the perimeter','the area'],a:1,hint:'Tiles cover a surface.',why:'Covering a surface means area.',review:5},{q:'A triangle has base 8 m and height 5 m. Its area is…',o:['13 m²','20 m²','40 m²'],a:1,hint:'½ × base × height.',why:'½ × 8 × 5 = 20 m².',review:6}]}]},
