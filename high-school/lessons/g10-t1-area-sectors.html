<script>
var K=window.LessonKit;
window.LESSON={
 id:'g10-t1-maths-csec-area',
 grade:10, term:1, subject:'Mathematics', strand:'Measurement',
 title:'Perimeter, Area, Arcs and Sectors',
 goals:['find the perimeter and area of polygons, circles and compound shapes','estimate the area of an irregular shape without a formula','calculate the length of an arc and the perimeter of a sector','calculate the area of a sector of a circle'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Measurement',strand:'Measurement',standard:'Module 1, Measurement: understand that the attributes of geometrical objects can be quantified using measurement; demonstrate the ability to use concepts in measurement to model and solve real-world problems.',
  objectives:['4.3 determine the perimeter of a plane shape;','4.4 calculate the length of an arc of a circle;','4.5 estimate the area of plane shapes;','4.6 calculate the area of polygons and circles;','4.7 calculate the area of a sector of a circle;'],
  focus:'Perimeter and area of polygons, circles and compound shapes; estimating area by counting squares; arc length, sector perimeter and sector area as fractions of a full circle (θ/360°).',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 1, Section 4. Answers using π = 3.14 or π = 22/7 are both accepted.'},
 glossary:[['Perimeter','The total distance around the outside of a shape.'],['Area','The amount of surface a shape covers, measured in square units.'],['Circumference','The perimeter of a circle: C = 2πr or πd.'],['Radius (r)','The distance from the centre of a circle to its edge.'],['Diameter (d)','A straight line through the centre from edge to edge: d = 2r.'],['Arc','Part of the circumference of a circle.'],['Sector','A "pizza slice" of a circle, between two radii and an arc.'],['Arc length','(θ ÷ 360°) × 2πr.'],['Sector area','(θ ÷ 360°) × πr².'],['Compound shape','A shape made by joining simpler shapes.']],
 teacher:{time:'about 80 minutes, or two shorter periods split after the teaching pages',flow:[['Engage','8 min','Estimate the area of an irregular pond by counting squares; predict.','Accept a range of estimates.'],['Explore','20 min','Change radius and angle of a sector and watch arc length and area.','Ask: "What fraction of the circle is this sector?"'],['Explain','15 min','Formulas and worked examples, including a compound shape.','Emphasise units: cm for length, cm² for area.'],['Elaborate','15 min','Sort length vs area; Bronze to Gold problems.','Link to tiling, fencing and roofing jobs.'],['Evaluate','12 min','Quiz and reflection.','Look for confusion between r and d.']],
  misconceptions:['Using the diameter in a formula that needs the radius.','Mixing up circumference (2πr) and area (πr²).','Giving area in cm instead of cm².','Forgetting the two radii when finding the perimeter of a sector.'],
  extension:'Measure a real circular object (a bucket lid or tank cover), calculate its circumference and area, and compare with a tape measure.'},
 steps:[
  {phase:'engage',name:'Estimate the pond',title:'How big is the pond?',lead:'A pond in a Hope Gardens drawing is not a neat shape. How can we find its area without a formula?',
   mission:['Type your name.','Estimate the area by counting squares.','Make your prediction about circles.'],
   patois:'Count di square dem fi estimate how big di pond be.',
   blocks:[{type:'name'},{type:'svg',alt:'An irregular pond drawn on a grid of 1 metre squares. It covers about 18 to 22 squares.',svg:'<svg viewBox="0 0 400 260"><rect width="400" height="260" fill="#faf8fe"/><g stroke="#d8ccf6" stroke-width="1">'+(function(){var s='';for(var x=40;x<=360;x+=40)s+='<line x1="'+x+'" y1="20" x2="'+x+'" y2="240"/>';for(var y=20;y<=240;y+=40)s+='<line x1="40" y1="'+y+'" x2="360" y2="'+y+'"/>';return s})()+'</g><path d="M90 70 C140 30 230 40 280 70 C340 100 330 170 290 200 C240 235 150 230 110 200 C60 165 50 100 90 70Z" fill="#5b8fd6" fill-opacity=".55" stroke="#2f5fc4" stroke-width="3"/><text x="44" y="256" font-size="13" fill="#3d2a73">Each square = 1 m²</text></svg>'},{type:'mcq',title:'Estimate',questions:[{q:'Count full squares, and pair up part squares. About how big is the pond?',o:['About 8 m²','About 20 m²','About 45 m²'],a:1,why:'Counting full squares and combining partial ones gives roughly 18 to 22 m².',hint:'Count the squares that are mostly blue.'}]},{type:'predict',star:true,q:'A sector is a quarter of a circle. Its area is…',options:['a quarter of the circle\'s area','half of the circle\'s area','the same as the circle\'s area'],after:'You will test it in the Explore phase.'}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Measuring shapes uses multiplication, fractions and circle words. Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'What is 7²?',o:['14','49','72'],a:1,why:'7² = 7 × 7 = 49.',teach:'The small 2 means "multiplied by itself". So 7² = 7 × 7 = 49, not 7 × 2.'},{q:'The radius of a circle is…',o:['the distance from the centre to the edge','the distance all the way across the circle','the distance around the circle'],a:0,why:'The radius goes from the centre to the edge. Across the whole circle is the diameter.',teach:'The radius goes from the centre of a circle out to its edge. The diameter goes all the way across through the centre, so the diameter is twice the radius.'},{q:'What fraction is 90 out of 360?',o:['1/2','1/3','1/4'],a:2,why:'90 × 4 = 360, so 90/360 = 1/4.',teach:'Simplify 90/360: divide the top and bottom by 90. 90 ÷ 90 = 1 and 360 ÷ 90 = 4, so 90/360 = 1/4.'},{q:'What is half of 12 × 5?',o:['30','60','17'],a:0,why:'12 × 5 = 60, and half of 60 is 30.',teach:'Work it out step by step: first 12 × 5 = 60, then half of 60 is 30.'}]}]},
  {phase:'explore',name:'Sector explorer',title:'Explore: arcs and sectors',lead:'Change the radius and the angle. Watch how the arc length and sector area change.',
   mission:['Move the sliders (or use −1 and +1).','Complete each challenge, then press Check.','Finish all 3 challenges for a star.'],
   patois:'Di angle tell yuh how much a di circle yuh have.',
   blocks:[{type:'custom',star:true,
    html:'<div class="controls"><label for="seR">Radius (cm):</label><input type="range" id="seR" min="1" max="10" value="7"><output class="big seRO">7</output></div><div class="controls"><label for="seA">Angle (°):</label><input type="range" id="seA" min="10" max="360" step="5" value="90"><output class="big seAO">90°</output></div><div class="scene seSvg"></div><div class="explain seX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge seN"></span> <strong class="seT"></strong></p><div class="controls"><button type="button" class="go seC">Check</button></div><div class="fb seF" aria-live="polite">Set the sliders, then check.</div></div>',
    init:function(box,api){var r=box.querySelector('#seR'),a=box.querySelector('#seA');api.nudges(r);api.nudges(a);var P=3.14;var T=[{t:'Make a semicircle with radius 4 cm.',ok:function(R,A){return R===4&&A===180},hint:'A semicircle is half a circle: 180°.'},{t:'Using radius 7 cm, make a sector with an arc length of about 11 cm.',ok:function(R,A){return R===7&&Math.abs(A/360*2*P*R-11)<0.3},hint:'Arc = θ/360 × 2 × 3.14 × 7. Try different angles. The answer is a common angle.'},{t:'Make any sector with an area of about 50 cm² (within 1 cm²).',ok:function(R,A){return Math.abs(A/360*P*R*R-50)<=1},hint:'Sector area = θ/360 × 3.14 × r². Try radius 8 and a quarter circle, or radius 4 and a full circle.'}];var k=api.get('k')||0;function draw(){var R=+r.value,A=+a.value,arc=A/360*2*P*R,ar=A/360*P*R*R,s=13,cx=200,cy=150;box.querySelector('.seRO').textContent=R;box.querySelector('.seAO').textContent=A+'°';var path=api.kit.sector(cx,cy,R*s,0,A);box.querySelector('.seSvg').innerHTML='<svg viewBox="0 0 400 300" role="img" aria-label="Sector of a circle with radius '+R+' cm and angle '+A+' degrees"><rect width="400" height="300" fill="#faf8fe"/><circle cx="'+cx+'" cy="'+cy+'" r="'+R*s+'" fill="none" stroke="#d8ccf6" stroke-width="2" stroke-dasharray="6 5"/><path d="'+path+'" fill="#ffb02e" fill-opacity=".75" stroke="#a85d00" stroke-width="2"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#3d2a73"/><text x="'+(cx+R*s/2-10)+'" y="'+(cy+20)+'" font-size="15" fill="#3d2a73">r = '+R+'</text></svg>';box.querySelector('.seX').innerHTML='This sector is <strong>'+A+'/360</strong> of the circle.<br>Arc length = '+A+'/360 × 2 × 3.14 × '+R+' = <strong>'+arc.toFixed(2)+' cm</strong><br>Sector area = '+A+'/360 × 3.14 × '+R+'² = <strong>'+ar.toFixed(2)+' cm²</strong><br>Perimeter of sector = arc + 2r = <strong>'+(arc+2*R).toFixed(2)+' cm</strong>'}function task(){if(k>=T.length){box.querySelector('.seN').textContent='All done';box.querySelector('.seT').textContent='You completed every challenge!';box.querySelector('.seC').disabled=true;return}box.querySelector('.seN').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.seT').textContent=T[k].t}r.addEventListener('input',draw);a.addEventListener('input',draw);box.querySelector('.seC').onclick=function(){var fb=box.querySelector('.seF');if(T[k].ok(+r.value,+a.value)){fb.className='fb ok seF';fb.textContent='✓ Yes! Well done.';k++;api.set('k',k);task();if(k===T.length)api.complete()}else{fb.className='fb no seF';fb.textContent='Not yet. '+T[k].hint}};draw();task()}},
    {type:'recall',text:'A quarter circle (90°) is 90/360 = ¼ of the circle, so its area is a quarter of the circle\'s area.'}]},
  {phase:'explain',name:'Teach: perimeter and area',title:'Learn: perimeter and area of flat shapes',lead:'Let\'s learn the difference between perimeter and area, and how to find each. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Perimeter a di distance round di edge. Area a di space inside.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Perimeter',explain:'<p>The {{perimeter|the total distance around the outside of a shape}} is the total distance around the outside of a shape. Think of walking all the way around a yard, or putting a fence around a garden.</p><p>To find it, <strong>add up the lengths of all the sides</strong>. For a rectangle, there are two lengths and two widths: P = 2 × (length + width).</p><p>Perimeter is a length, so it is measured in cm or m.</p>',
     example:{q:'A school garden is a rectangle 12 m long and 8 m wide. How much fencing goes around it?',steps:[{do:'Fencing goes around the outside, so we need the perimeter.'},{do:'The sides are 12 m, 8 m, 12 m and 8 m.',why:'A rectangle has two pairs of equal sides.'},{do:'P = 12 + 8 + 12 + 8 = 40 m. Or: 2 × (12 + 8) = 40 m.'}]},
     mistake:'Adding only the two numbers you are given (12 + 8 = 20). A rectangle has FOUR sides, so count each length and width twice.',
     check:{q:'A square has sides of 6 cm. What is its perimeter?',o:['12 cm','24 cm','36 cm'],a:1,why:'4 sides × 6 cm = 24 cm.',hint:'A square has 4 equal sides.'}},
    {title:'Area of rectangles and triangles',explain:'<p>The {{area|the amount of surface a shape covers, in square units}} is the amount of surface a shape covers. It is counted in squares, so it is measured in <strong>square units</strong>: cm² or m².</p><p><strong>Rectangle:</strong> area = length × width.</p><p><strong>Triangle:</strong> area = ½ × base × height. The picture shows why: a triangle is exactly half of a rectangle with the same base and height. The {{height|the perpendicular (straight up, at 90°) distance from the base to the top}} must be measured straight up from the base, at a right angle.</p>',visual:'<svg viewBox="0 0 520 200" role="img" aria-label="A rectangle cut along a diagonal into two equal triangles"><rect width="520" height="200" fill="#faf8fe"/><rect x="60" y="30" width="240" height="140" fill="#ffd98a" stroke="#a85d00" stroke-width="2"/><path d="M60 170 L300 30" stroke="#3d2a73" stroke-width="3" stroke-dasharray="8 6"/><path d="M60 170 L300 170 L300 30Z" fill="#d9cff5" fill-opacity=".8"/><text x="150" y="192" font-size="16" fill="#3d2a73">base</text><text x="308" y="105" font-size="16" fill="#3d2a73">height</text><text x="330" y="80" font-size="16" fill="#3d2a73">The purple triangle is</text><text x="330" y="102" font-size="16" fill="#3d2a73">half of the rectangle,</text><text x="330" y="124" font-size="16" fill="#3d2a73">so area = ½ × b × h.</text></svg>',
     example:{q:'A triangular banner has a base of 10 cm and a height of 6 cm. Find its area.',steps:[{do:'Use area = ½ × base × height.',why:'A triangle is half of a rectangle with the same base and height.'},{do:'½ × 10 × 6 = ½ × 60.'},{do:'= 30 cm².',why:'Area is in SQUARE units.'}]},
     mistake:'Forgetting the ½ for a triangle (10 × 6 = 60 cm²). That is the area of the whole rectangle, not the triangle.',
     check:{q:'A triangle has base 8 m and height 5 m. What is its area?',o:['13 m²','20 m²','40 m²'],a:1,why:'½ × 8 × 5 = 20 m².',hint:'Multiply base × height, then halve it.'}},
    {title:'Compound shapes and estimating area',explain:'<p>A {{compound shape|a shape made by joining simpler shapes}} is made by joining simpler shapes. To find its area, <strong>split it</strong> into rectangles, triangles or circles, find each area, and add them.</p><p>For an irregular shape with no formula, such as a pond or a leaf, place it on a grid and <strong>count squares</strong>. Count whole squares, and pair up part-squares to make about one whole each.</p>',visual:'<svg viewBox="0 0 520 210" role="img" aria-label="An L-shaped floor split into a 10 by 4 rectangle and a 4 by 3 rectangle"><rect width="520" height="210" fill="#faf8fe"/><path d="M60 40 H360 V160 H180 V190 H60 Z" fill="none"/><rect x="60" y="40" width="300" height="120" fill="#ffd98a" stroke="#a85d00" stroke-width="2"/><rect x="60" y="160" width="120" height="40" fill="#d9cff5" stroke="#4b3aa8" stroke-width="2"/><text x="170" y="105" font-size="16" fill="#3d2a73">10 m × 4 m</text><text x="78" y="186" font-size="14" fill="#3d2a73">4 m × 3 m</text><text x="380" y="80" font-size="15" fill="#3d2a73">Split the L-shape</text><text x="380" y="102" font-size="15" fill="#3d2a73">into two rectangles.</text></svg>',
     example:{q:'An L-shaped floor is made of a 10 m × 4 m rectangle and a 4 m × 3 m rectangle. Find its area.',steps:[{do:'Split the shape into two rectangles.',why:'We know the formula for rectangles.'},{do:'Big rectangle: 10 × 4 = 40 m².'},{do:'Small rectangle: 4 × 3 = 12 m².'},{do:'Total area = 40 + 12 = 52 m².'}]},
     mistake:'Counting a section twice where the shapes overlap. Make sure your pieces fit together without overlapping.',
     check:{q:'A shape is a 6 cm × 5 cm rectangle with a triangle (base 6 cm, height 4 cm) on top. What is its total area?',o:['42 cm²','54 cm²','30 cm²'],a:0,why:'Rectangle 30 cm² + triangle ½ × 6 × 4 = 12 cm². Total 42 cm².',hint:'Find each area separately, then add.'}}]}]},
  {phase:'explain',name:'Teach: circles, arcs and sectors',title:'Learn: circles, arcs and sectors',lead:'Next, circles: the distance around them, the space inside them, and parts of them.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Find di fraction a di circle first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Circumference',explain:'<p>The perimeter of a circle is called its {{circumference|the distance around a circle: C = 2πr or πd}}.</p><p>For every circle, the circumference is a little more than 3 times the {{diameter|the distance across a circle through its centre; d = 2r}}. This number is called <strong>π</strong> (pi). We use π ≈ 3.14 or π ≈ 22/7.</p><p><strong>C = πd</strong>, or, since the diameter is twice the radius, <strong>C = 2πr</strong>.</p>',
     example:{q:'A circular water tank cover has a diameter of 1.4 m. Find its circumference. Use π = 22/7.',steps:[{do:'We are given the diameter, so use C = πd.',why:'Choose the formula that matches the measurement you have.'},{do:'C = 22/7 × 1.4.'},{do:'1.4 ÷ 7 = 0.2, and 22 × 0.2 = 4.4. So C = 4.4 m.',why:'Dividing by 7 first keeps the numbers simple.'}]},
     mistake:'Using the radius in C = πd (or the diameter in C = 2πr). This gives an answer that is half, or double, the right size.',
     check:{q:'A circle has radius 7 cm. What is its circumference? Use π = 22/7.',o:['22 cm','44 cm','154 cm'],a:1,why:'C = 2 × 22/7 × 7 = 44 cm.',hint:'Use C = 2πr.'}},
    {title:'Area of a circle',explain:'<p>The area of a circle is <strong>A = πr²</strong>. That means π × r × r.</p><p>Always use the <strong>radius</strong>. If you are given the diameter, halve it first.</p><p>Area is in square units, such as cm² or m².</p>',
     example:{q:'A circular fountain has a radius of 5 m. Find its area. Use π = 3.14.',steps:[{do:'Square the radius first: 5² = 25.',why:'r² means r × r.'},{do:'Multiply by π: 3.14 × 25 = 78.5.'},{do:'A = 78.5 m².'}]},
     mistake:'Mixing up the formulas: 2πr is the circumference (a length); πr² is the area. Another common mistake is squaring the diameter instead of the radius.',
     check:{q:'A circle has radius 7 cm. What is its area? Use π = 22/7.',o:['44 cm²','154 cm²','308 cm²'],a:1,why:'22/7 × 7 × 7 = 22 × 7 = 154 cm².',hint:'A = π × r × r.'}},
    {title:'Arcs and sectors',explain:'<p>An {{arc|part of the circumference of a circle}} is part of the circumference. A {{sector|a slice of a circle between two radii and an arc}} is a "slice" of the circle, like a slice of pizza.</p><p>The key idea: a sector with angle θ is <strong>θ/360</strong> of the whole circle. So:</p><p><strong>Arc length = (θ/360) × 2πr</strong><br><strong>Sector area = (θ/360) × πr²</strong><br><strong>Perimeter of a sector = arc length + 2r</strong></p>',
     example:{q:'Find the arc length of a sector with radius 21 cm and angle 60°. Use π = 22/7.',steps:[{do:'Fraction of the circle: 60/360 = 1/6.',why:'The angle tells us what fraction of the full turn (360°) we have.'},{do:'Full circumference = 2 × 22/7 × 21 = 132 cm.'},{do:'Arc length = 1/6 × 132 = 22 cm.'}]},
     mistake:'Forgetting the two straight edges when finding the perimeter of a sector. Perimeter = arc + r + r.',
     check:{q:'A sector has radius 14 cm and angle 90°. What is its arc length? Use π = 22/7.',o:['22 cm','44 cm','88 cm'],a:0,why:'90/360 = 1/4, and the circumference is 2 × 22/7 × 14 = 88 cm. 1/4 × 88 = 22 cm.',hint:'Find the fraction of the circle, then that fraction of the circumference.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts to remember. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Units for length and area',text:'Lengths (like perimeter) are measured in cm or m. Areas are measured in square units: cm² or m². For example, a 5 cm by 4 cm rectangle has a perimeter of 18 cm, but an area of 20 cm², because 20 squares of 1 cm by 1 cm fit inside it.'},{title:'What fraction of the circle?',text:'A sector with angle θ is θ/360 of the whole circle. For example, a sector with an angle of 90° is 90/360 = 1/4 of the circle. So its arc is 1/4 of the circumference, and its area is 1/4 of the circle\'s area.'},{title:'Arc length and sector area',text:'Arc length = (θ/360) × 2πr. Sector area = (θ/360) × πr². For example, with r = 7 cm and θ = 90°: arc length = 1/4 × 2 × 22/7 × 7 = 11 cm, and sector area = 1/4 × 22/7 × 7 × 7 = 38.5 cm².'},{title:'Perimeter of a sector',text:'Perimeter of a sector = arc length + 2r. Do not forget the two straight edges. For example, the 90° sector above has a perimeter of 11 + 7 + 7 = 25 cm.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Find the area of a sector with radius 6 cm and angle 120°. Use π = 3.14.',steps:[{do:'Fraction of the circle: 120/360 = 1/3.'},{do:'Area of the full circle = 3.14 × 6² = 3.14 × 36 = 113.04 cm².'},{do:'Sector area = 1/3 × 113.04 = 37.68 cm².'}]},
     {type:'fill',q:'Find the arc length of a sector with radius 7 cm and angle 90°. Use π = 22/7.',steps:[{text:'Fraction of the circle: 90/360 = ___ (type it as a fraction or decimal)',blank:true,a:[0.25,'1/4'],tol:0.001,hint:'Simplify 90/360 by dividing top and bottom by 90.'},{text:'Full circumference = 2 × 22/7 × 7 = 44 cm.'},{text:'Arc length = 1/4 × 44 = 11 cm.'}],sol:'90/360 = 1/4, so the arc is 1/4 of 44 cm = 11 cm.'},
     {type:'own',q:'Find the area of a circle with radius 10 cm. Use π = 3.14.',a:314,tol:0.5,hint:'A = πr² = 3.14 × 10 × 10.',sol:'3.14 × 100 = 314 cm².',placeholder:'cm²'},
     {type:'own',q:'Find the perimeter of a semicircle with radius 7 cm (the curved edge plus the straight edge). Use π = 22/7.',a:36,tol:0.1,hint:'Curved edge = half of 2πr = 22 cm. The straight edge is the diameter, 14 cm.',sol:'22 + 14 = 36 cm.',placeholder:'cm'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order. Some are quick, some are tough. All of them make you think.',
   mission:['Choose a challenge card. Each one shows how hard it is and roughly how long it takes.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like. Try di hard one dem too!',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Length or area?',desc:'Decide whether each job needs a length or an area.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Going AROUND the edge is a length. COVERING a surface is an area.',bins:[{id:'len',label:'Length (perimeter)',hint:'around the edge'},{id:'area',label:'Area',hint:'covering a surface'}],items:[{label:'Fencing a yard',bin:'len'},{label:'Tiling a kitchen floor',bin:'area'},{label:'Painting a wall',bin:'area'},{label:'Putting trim around a door',bin:'len'},{label:'Grass seed for a lawn',bin:'area'},{label:'Running one lap of a track',bin:'len'},{label:'Zinc sheets for a roof',bin:'area'},{label:'Ribbon around a cake',bin:'len'}]}},
    {icon:'🃏',title:'Match the formulas',desc:'Match each measurement to its formula.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Area of a rectangle','l × w'],['Area of a triangle','½ × b × h'],['Circumference','2πr'],['Area of a circle','πr²'],['Arc length','(θ/360) × 2πr'],['Sector area','(θ/360) × πr²']]}},
    {icon:'📏',title:'Which is biggest?',desc:'Order shapes by area. Some are very close!',level:'⭐⭐ Skill builder',mins:6,block:{type:'order',prompt:'Work out each area (π = 3.14), then tap the shapes from smallest area to largest.',rounds:[[{label:'Square, side 5 cm',v:25,show:'25 cm²'},{label:'Rectangle 4 cm × 7 cm',v:28,show:'28 cm²'},{label:'Triangle, base 10 cm, height 4 cm',v:20,show:'20 cm²'},{label:'Circle, radius 3 cm',v:28.26,show:'28.26 cm²'}],[{label:'Semicircle, radius 4 cm',v:25.12,show:'25.12 cm²'},{label:'Quarter circle, radius 5 cm',v:19.625,show:'19.63 cm²'},{label:'60° sector, radius 7 cm',v:25.643,show:'25.64 cm²'},{label:'Full circle, radius 2 cm',v:12.56,show:'12.56 cm²'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement about shapes is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Doubling the radius of a circle doubles its area.',a:'never',why:'Area = πr². Doubling r makes r² four times bigger, so the area is multiplied by 4, not 2.',hint:'Try r = 1 and r = 2.'},{s:'A shape with a bigger perimeter has a bigger area.',a:'sometimes',why:'A 1 × 9 rectangle has perimeter 20 and area 9; a 4 × 4 square has a smaller perimeter (16) but a bigger area (16).',hint:'Compare a long thin rectangle with a square.'},{s:'The perimeter of a sector is longer than its arc.',a:'always',why:'The perimeter is the arc PLUS two radii, so it is always longer.'},{s:'Area is measured in square units.',a:'always',why:'Area counts how many squares cover a surface: cm², m² and so on.'},{s:'Two rectangles with the same area have the same perimeter.',a:'sometimes',why:'2 × 6 and 3 × 4 both have area 12, but perimeters 16 and 14. A 3 × 4 and a 4 × 3 have the same perimeter.',hint:'Try a 2 × 6 rectangle and a 3 × 4 rectangle.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Damion',q:'Find the area of a circle with radius 5 cm (π = 3.14).',lines:['A = 2πr','= 2 × 3.14 × 5','= 31.4 cm²'],wrong:0,reasons:['He used the circumference formula instead of πr²','He used the wrong value of π','He should have used the diameter'],reason:0,fix:'A = πr² = 3.14 × 25 = 78.5 cm².'},{who:'Nadine',q:'Find the perimeter of a 90° sector with radius 7 cm (π = 22/7).',lines:['Arc = 90/360 × 2 × 22/7 × 7 = 11 cm','Perimeter = 11 cm'],wrong:1,reasons:['She forgot to add the two radii','The arc length is wrong','She should have used 180°'],reason:0,fix:'Perimeter = 11 + 7 + 7 = 25 cm.'},{who:'Chris',q:'Find the area of a triangle with base 12 cm and height 5 cm.',lines:['Area = base × height','= 12 × 5 = 60 cm²'],wrong:0,reasons:['The area of a triangle is HALF of base × height','He should have added 12 and 5','The answer should be in cm'],reason:0,fix:'Area = ½ × 12 × 5 = 30 cm².'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire perimeter and area questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=Math.floor(Math.random()*4);if(r===0){var l=R(3,12),w=R(2,9);if(l*w===2*(l+w))l++;return{q:'Rectangle '+l+' cm × '+w+' cm. Area?',o:[l*w+' cm²',2*(l+w)+' cm²',(l+w)+' cm²'],a:0,why:l+' × '+w+' = '+l*w+' cm².'}}if(r===1){var l2=R(3,12),w2=R(2,9);if(l2*w2===2*(l2+w2))l2++;return{q:'Rectangle '+l2+' cm × '+w2+' cm. Perimeter?',o:[2*(l2+w2)+' cm',l2*w2+' cm',(l2+w2)+' cm'],a:0,why:'2 × ('+l2+' + '+w2+') = '+2*(l2+w2)+' cm.'}}if(r===2){var b=2*R(2,8),h=R(3,10);return{q:'Triangle, base '+b+' cm, height '+h+' cm. Area?',o:[b*h/2+' cm²',b*h+' cm²',(b+h)+' cm²'],a:0,why:'½ × '+b+' × '+h+' = '+b*h/2+' cm².'}}var A=[[90,'1/4'],[180,'1/2'],[120,'1/3'],[60,'1/6'],[45,'1/8'],[270,'3/4']],t=A[Math.floor(Math.random()*A.length)],o=[t[1]],pool=['1/4','1/2','1/3','1/6','1/8','3/4'].filter(function(x){return x!==t[1]});o.push(pool[0]);o.push(pool[3]);return{q:'A '+t[0]+'° sector is what fraction of a circle?',o:o,a:0,why:t[0]+'/360 = '+t[1]+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Design shapes that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:5,block:{type:'create',tasks:[{q:'Give the length and width of a rectangle with an area of 24 cm². Type them as length, width (for example 6, 4).',placeholder:'length, width',check:function(v){var n=String(v).split(/[,x×]/).map(function(x){return parseFloat(x)});if(n.length!==2||n.some(isNaN))return{ok:false,msg:'Type two numbers separated by a comma.'};var a=n[0]*n[1];if(Math.abs(a-24)<0.001)return{ok:true,msg:'Yes! '+n[0]+' × '+n[1]+' = 24 cm². Its perimeter is '+2*(n[0]+n[1])+' cm. Try another pair and compare the perimeters!'};return{ok:false,msg:'That rectangle has an area of '+a+' cm². You need length × width = 24.'}}},{q:'Give the length and width of a rectangle with a perimeter of 20 cm.',placeholder:'length, width',check:function(v){var n=String(v).split(/[,x×]/).map(function(x){return parseFloat(x)});if(n.length!==2||n.some(isNaN)||n.some(function(x){return x<=0}))return{ok:false,msg:'Type two positive numbers separated by a comma.'};var p=2*(n[0]+n[1]);if(Math.abs(p-20)<0.001)return{ok:true,msg:'Correct! 2 × ('+n[0]+' + '+n[1]+') = 20 cm. Its area is '+n[0]*n[1]+' cm². Which rectangle with perimeter 20 has the biggest area?'};return{ok:false,msg:'That perimeter is '+p+' cm. Length + width must add up to 10.'}}},{q:'Type the angle of a sector that is exactly one third of a circle.',placeholder:'degrees',check:function(v,num){var x=num(String(v).replace('°',''));if(x===120)return{ok:true,msg:'Yes! 120/360 = 1/3.'};return{ok:false,msg:'One third of 360° is 360 ÷ 3.'}}}]}},
    {icon:'🌺',title:'Mission: the circular school garden',desc:'Design a circular garden for a school in Portland.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A school in Portland is building a circular garden with a radius of 7 m. A quarter of the garden will be a flower bed, and the rest will be grass. Use π = 22/7 to plan it.',parts:[{q:'Edging will go all the way around the garden. How many metres of edging are needed?',a:44,tol:0.1,hint:'Circumference = 2 × 22/7 × 7.',sol:'2 × 22/7 × 7 = 44 m.',placeholder:'metres'},{q:'What is the area of the whole garden?',a:154,tol:0.2,hint:'A = πr² = 22/7 × 7 × 7.',sol:'22/7 × 49 = 154 m².',placeholder:'m²'},{q:'The flower bed is a quarter of the circle (a 90° sector). What is its area?',a:38.5,tol:0.1,hint:'One quarter of 154 m².',sol:'154 ÷ 4 = 38.5 m².',placeholder:'m²'},{q:'A small fence goes around the flower bed only (the arc and the two radii). How long is it?',a:25,tol:0.1,hint:'Arc = 1/4 × 44 = 11 m. Add two radii of 7 m.',sol:'11 + 7 + 7 = 25 m.',placeholder:'metres'},{q:'The rest of the garden is grass. One bag of grass seed covers 20 m². How many bags are needed?',a:6,hint:'Grass area = 154 − 38.5 = 115.5 m². Divide by 20, then round UP, because you cannot buy part of a bag.',sol:'115.5 ÷ 20 = 5.775, so 6 bags are needed.'}],done:'You used circumference, circle area, sectors and rounding up to design a real garden.'}}
