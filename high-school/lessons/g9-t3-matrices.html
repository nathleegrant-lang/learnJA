    {type:'recall',text:'Multiplying the whole table by 2 at once is quickest: every number doubles. That is scalar multiplication, and it is one of the main things you will learn today.'}]},
  {phase:'explain',name:'Teach: what a matrix is',title:'Learn: matrices, elements and order',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Row go across, column go dung.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What a matrix is',explain:'<p>You see tables of numbers everywhere: league tables, school timetables, shop sales records. A {{matrix|a rectangular arrangement of numbers in rows and columns}} is simply a table of numbers, written inside large brackets, with the labels left off.</p><p>For the juice stands, Monday’s sales can be written as a matrix with one row for each stand and one column for each size:</p><p>'+MX([[12,8],[10,15]],'M')+'</p><p>The first {{row|a horizontal line of elements}} is Half Way Tree (12 small, 8 large), and the second row is Papine (10 small, 15 large). The first {{column|a vertical line of elements}} is small juices, and the second is large juices. Each number is called an {{element|one number in a matrix}}.</p><p>Matrices are a powerful way to organise information, and computers use them for everything from video game graphics to search engines.</p>',
     example:{q:'A shop sells 5 red and 3 blue pens on Monday, and 4 red and 6 blue on Tuesday. Write a matrix with a row for each day.',steps:[{do:'Row 1 (Monday): 5 red, 3 blue.'},{do:'Row 2 (Tuesday): 4 red, 6 blue.'},{do:'The matrix has two rows: [5, 3] on top and [4, 6] underneath.'}]},
     mistake:'Mixing up rows and columns. Rows go ACROSS (like rows of seats); columns go DOWN (like the columns holding up a building).',
     check:{q:'In the matrix M above, which element is in row 2, column 1?',o:['10','8','15'],a:0,why:'Row 2 is [10, 15]; its first element is 10.',hint:'Row 2 first, then column 1.'}},
    {title:'The order of a matrix',explain:'<p>The {{order|the size of a matrix: rows × columns}} of a matrix tells you its size: the number of <strong>rows</strong> × the number of <strong>columns</strong>, always in that order. A matrix with 2 rows and 3 columns has order <strong>2 × 3</strong>, read “2 by 3”.</p><p>A handy way to remember: “RC”, like the Roman Catholic church, or “Rows before Columns”.</p><p>Some matrices have special names. A matrix with one row is a <strong>row matrix</strong> (order 1 × n). A matrix with one column is a <strong>column matrix</strong> (order n × 1). A matrix with the same number of rows and columns, like 2 × 2, is a <strong>square matrix</strong>.</p>',
     example:{q:'Give the order of a matrix with 3 rows and 4 columns, and say how many elements it has.',steps:[{do:'Order: rows × columns = 3 × 4.'},{do:'Number of elements: 3 × 4 = 12.',why:'Multiplying the order gives the number of elements.'}]},
     mistake:'Writing the order as columns × rows. A 2-row, 3-column matrix is 2 × 3, not 3 × 2.',
     check:{q:'A matrix has 1 row and 4 columns. What is its order?',o:['1 × 4','4 × 1','4'],a:0,why:'Rows × columns.',hint:'Rows first.'}},
    {title:'Equal matrices',explain:'<p>Two matrices are <strong>equal</strong> only if they have the <strong>same order</strong> AND every pair of matching elements is the same. If even one element is different, they are not equal.</p><p>This idea lets you find unknown elements. If a matrix containing x is equal to another matrix, the matching elements must be equal, so you can write and solve a simple equation.</p><p>For example, if the matrix with first row [x, 4] equals the matrix with first row [7, 4] (and the second rows match), then x = 7.</p>',
     example:{q:'The matrix with rows [2x, 5] and [3, y + 1] equals the matrix with rows [10, 5] and [3, 9]. Find x and y.',steps:[{do:'Match row 1, column 1: 2x = 10, so x = 5.'},{do:'Match row 2, column 2: y + 1 = 9, so y = 8.'}]},
     mistake:'Matching elements in different positions. Only elements in exactly the same row and column must be equal.',
     check:{q:'Can a 2 × 2 matrix equal a 2 × 3 matrix?',o:['No','Yes, if the numbers match'],a:0,why:'Equal matrices must have the same order.',hint:'Check the order first.'}}]}]},
  {phase:'explain',name:'Teach: operations and properties',title:'Learn: adding, scalar multiplication and the properties',lead:'Next, calculating with matrices, and the properties the guide asks you to illustrate.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Add di matching number dem. Scalar multiply every one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Adding and subtracting matrices',explain:'<p>Suppose Monday’s juice sales are M and Tuesday’s are T. To find the total for both days, add the matching elements: small juices at Half Way Tree on Monday plus small juices at Half Way Tree on Tuesday, and so on for every position.</p><p>That is all matrix addition is: <strong>add the elements in the same positions</strong>. Subtraction works the same way: subtract the matching elements.</p><p>There is one rule: you can only add or subtract matrices of the <strong>same order</strong>. A 2 × 2 matrix and a 2 × 3 matrix cannot be added, because some elements would have no partner.</p>',
     example:{q:'Add '+'the matrices with rows [3, −1], [2, 4] and [5, 2], [−6, 1].',steps:[{do:'Row 1: 3 + 5 = 8 and −1 + 2 = 1.'},{do:'Row 2: 2 + (−6) = −4 and 4 + 1 = 5.'},{do:'Answer: rows [8, 1] and [−4, 5].'}]},
     mistake:'Adding matrices of different orders. Check the orders first; they must match.',
     check:{q:'Can you add a 2 × 3 matrix and a 3 × 2 matrix?',o:['No','Yes'],a:0,why:'Their orders are different.',hint:'Same order only.'}},
    {title:'Scalar multiplication',explain:'<p>Back to the opening question. If the juice stands sell exactly the same amounts on Tuesday as on Monday, the total is M + M, which is 2 × M. Every element doubles.</p><p>Multiplying a matrix by an ordinary number is called {{scalar multiplication|multiplying every element of a matrix by the same number}}. The ordinary number is called a {{scalar|an ordinary number used to multiply a matrix}}. The rule is simple: <strong>multiply every element by the scalar</strong>.</p><p>So 3M means multiply every element of M by 3. And −1 × M changes the sign of every element. The order of the matrix does not change.</p>',
     example:{q:'Find 3M, where M has rows [12, 8] and [10, 15].',steps:[{do:'Multiply every element by 3.'},{do:'Row 1: 36, 24. Row 2: 30, 45.'},{do:'3M has rows [36, 24] and [30, 45]: the sales for three identical days.'}]},
     mistake:'Multiplying only the first row or column. The scalar multiplies EVERY element.',
     check:{q:'If A has rows [2, −1] and [0, 4], what is the element in row 1, column 2 of 5A?',o:['−5','5','4'],a:0,why:'5 × −1 = −5.',hint:'Multiply that element by 5.'}},
    {title:'Commutative and distributive properties',explain:'<p>The guide asks you to illustrate two properties with calculations, just as you did in the matrix lab.</p><p><strong>Matrix addition is {{commutative|the order does not matter}}:</strong> A + B = B + A. Why? Each element of A + B is a sum of two numbers, like 3 + 5, and adding numbers in either order gives the same answer. So the matrices match in every position.</p><p><strong>Scalar multiplication is {{distributive|k(A + B) = kA + kB}} over addition:</strong> k(A + B) = kA + kB. Why? Each element on the left is k × (a + b), and each element on the right is k × a + k × b, and those are equal by the ordinary distributive law you know from numbers.</p><p>To illustrate a property, choose two matrices, calculate both sides separately, and show the results are identical.</p>',
     example:{q:'With A = [1, 2] and B = [3, −1] (row matrices) and k = 2, show that k(A + B) = kA + kB.',steps:[{do:'Left side: A + B = [4, 1], so 2(A + B) = [8, 2].'},{do:'Right side: 2A = [2, 4] and 2B = [6, −2], so 2A + 2B = [8, 2].'},{do:'Both sides are [8, 2] ✓'}]},
     mistake:'Showing a property with just one side. To illustrate it, calculate BOTH sides and compare.',
     check:{q:'If A + B has rows [4, 6] and [1, 0], what is B + A?',o:['Rows [4, 6] and [1, 0]','Rows [6, 4] and [0, 1]','It cannot be found'],a:0,why:'Addition of matrices is commutative.',hint:'Does the order matter?'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Matrices and order',text:'A matrix is numbers in rows (across) and columns (down). Order = rows × columns, such as 2 × 3.'},{title:'Adding and subtracting',text:'Only for matrices of the same order. Add or subtract the elements in matching positions.'},{title:'Scalar multiplication',text:'Multiply EVERY element by the scalar k. The order stays the same.'},{title:'Properties',text:'A + B = B + A (commutative). k(A + B) = kA + kB (distributive). Illustrate by calculating both sides.'}]},

    {icon:'🗂️',title:'Can they be added?',desc:'Sort each pair of orders.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Only matrices of exactly the same order can be added.',bins:[{id:'y',label:'Can be added'},{id:'n',label:'Cannot be added'}],items:[{label:'2 × 2 and 2 × 2',bin:'y'},{label:'2 × 3 and 3 × 2',bin:'n'},{label:'1 × 4 and 1 × 4',bin:'y'},{label:'3 × 1 and 1 × 3',bin:'n'},{label:'3 × 3 and 3 × 3',bin:'y'},{label:'2 × 2 and 2 × 3',bin:'n'}]}},
    {icon:'🃏',title:'Match the words',desc:'Match each word to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Row','a horizontal line of elements'],['Column','a vertical line of elements'],['Order','rows × columns'],['Element','one number in a matrix'],['Scalar','an ordinary number multiplying a matrix'],['Square matrix','same number of rows and columns']]}},
    {icon:'📏',title:'Count the elements',desc:'Order the matrices by number of elements.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out how many elements each matrix has, then tap from fewest to most.',rounds:[[{label:'Order 1 × 3',v:3,show:'3'},{label:'Order 2 × 2',v:4,show:'4'},{label:'Order 2 × 3',v:6,show:'6'},{label:'Order 3 × 3',v:9,show:'9'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A + B = B + A (when they can be added).',a:'always',why:'Matrix addition is commutative.'},{s:'A 2 × 3 matrix can be added to a 3 × 2 matrix.',a:'never',why:'They have different orders.'},{s:'Scalar multiplication changes the order of a matrix.',a:'never',why:'The order stays the same; only the elements change.'},{s:'k(A + B) = kA + kB.',a:'always',why:'This is the distributive property.'},{s:'A matrix is a square matrix.',a:'sometimes',why:'Only when it has the same number of rows and columns.'}]}},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire matrix questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,4),b=R(1,4);if(a===b)b++;return{q:a+' rows and '+b+' columns. Order?',o:[a+' × '+b,b+' × '+a,String(a*b)],a:0,why:'Rows × columns.'}}if(r===1){var k=R(2,5),x=R(-6,9)||3;return{q:'Element '+f9m(x)+' in A. The matching element of '+k+'A?',o:[f9m(k*x),f9m(k+x),f9m(x)],a:0,why:k+' × '+f9m(x)+'.'}}var p=R(-5,8),q=R(-5,8);return{q:'Matching elements '+f9m(p)+' and '+f9m(q)+'. Element of A + B?',o:[f9m(p+q),f9m(p*q===p+q?p*q+1:p*q),f9m(p-q===p+q?p-q+2:p-q)],a:0,why:'Add the matching elements.'}}}},
