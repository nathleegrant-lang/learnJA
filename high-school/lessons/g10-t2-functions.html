  {phase:'explain',name:'Teach: relations and functions',title:'Learn: relations, functions and function notation',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'A function: every input get exactly one output.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Relations: domain, co-domain, range and image',explain:'<p>A {{relation|a rule linking elements of one set to another}} links elements of one set to elements of another. The set of inputs is the {{domain|the set of inputs}}. The set the outputs are drawn from is the {{co-domain|the set outputs are taken from}}. Each output is the {{image|the output an input maps to}} of its input, and the set of images actually produced is the {{range|the set of outputs actually produced}}.</p><p>The range and the co-domain are not always the same. If the relation “x → x²” maps the domain {−2, −1, 0, 1, 2} into the co-domain {0, 1, 2, 3, 4}, the range is only {0, 1, 4}: 2 and 3 are never used.</p><p>The syllabus asks you to represent relations in several ways: as a set of <strong>ordered pairs</strong>, an <strong>arrow diagram</strong>, a <strong>graph</strong>, or <strong>algebraically</strong> (a rule). Relations can be one-to-one, many-to-one, one-to-many or many-to-many.</p>',
     example:{q:'The relation "is a factor of" links A = {2, 3} to B = {4, 6, 9}. List it as ordered pairs.',steps:[{do:'2 is a factor of 4 and 6: (2, 4), (2, 6).'},{do:'3 is a factor of 6 and 9: (3, 6), (3, 9).'},{do:'Relation: {(2, 4), (2, 6), (3, 6), (3, 9)}. It is many-to-many.'}]},
     mistake:'Confusing the range with the co-domain. The range is only the outputs actually reached.',
     check:{q:'For x → 2x with domain {1, 2, 3}, the range is…',o:['{2, 4, 6}','{1, 2, 3}','{2, 3, 4, 5, 6}'],a:0,why:'The images are 2, 4 and 6.',hint:'The outputs actually produced.'}},
    {title:'What makes a function',explain:'<p>A {{function|a relation where every element of the domain has exactly one image}} is a relation with a special property: <strong>every element of the domain has exactly one image</strong>. One-to-one and many-to-one relations are functions. One-to-many and many-to-many relations are not, because some input has more than one output.</p><p>To decide from a <strong>graph</strong>, use the <strong>vertical line test</strong>: if any vertical line crosses the graph more than once, some input has two outputs, so it is not a function. The parabola y = x² passes the test; a circle fails it.</p><p>The syllabus also suggests describing a function by its properties, not just its rule: what it does to each input.</p>',
     example:{q:'Is {(1, 4), (2, 5), (3, 4), (1, 6)} a function?',steps:[{do:'Look at the inputs: 1 appears twice.'},{do:'1 maps to 4 and also to 6: two images.'},{do:'So it is NOT a function.'}]},
     mistake:'Thinking a repeated OUTPUT stops it being a function. Repeated outputs are fine (many-to-one); repeated INPUTS with different outputs are not.',
     check:{q:'Which relation is a function?',o:['{(1, 3), (2, 3), (3, 3)}','{(1, 2), (1, 3)}','{(2, 1), (2, 5), (3, 4)}'],a:0,why:'Each input has exactly one output.',hint:'Check for repeated inputs.'}},
    {title:'Function notation and evaluating',explain:'<p>The syllabus uses three equivalent ways of writing a function: <strong>f : x → x²</strong> (f maps x to x²), <strong>f(x) = x²</strong>, and <strong>y = f(x)</strong>.</p><p>To <strong>evaluate</strong> a function at a value means to substitute it: if f(x) = 3x² − 2, then f(−2) = 3(−2)² − 2 = 12 − 2 = 10. Use brackets around negative values.</p><p>You can also work backwards: if f(x) = 2x + 3 and f(a) = 15, then 2a + 3 = 15, so a = 6. This is finding the element of the domain that has a given image.</p>',visual:MACH([{v:'4'},{box:'f',rule:'f(x) = 2x + 3'},{v:'11'}]),
     example:{q:'f : x → 5 − 2x. Find f(3), f(−1), and the value of x for which f(x) = −7.',steps:[{do:'f(3) = 5 − 6 = −1. f(−1) = 5 + 2 = 7.'},{do:'f(x) = −7: 5 − 2x = −7, so −2x = −12.'},{do:'x = 6.'}]},
     mistake:'Reading f(x) as f × x. It means "the output of f when the input is x".',
     check:{q:'g(x) = x² − 3x. What is g(−2)?',o:['10','−2','2'],a:0,why:'4 + 6 = 10.',hint:'(−2)² − 3(−2).'}}]}]},
  {phase:'explain',name:'Teach: composite and inverse functions',title:'Learn: composite functions and inverse functions',lead:'Next, combining functions, and functions that undo each other.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'f⁻¹ undo wah f do.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Composite functions',explain:'<p>A {{composite function|applying one function and then another: fg(x) = f[g(x)]}} applies one function and then another, like two machines in a row. In CSEC notation, <strong>fg(x) = f[g(x)]</strong>: <strong>g is applied first</strong>, then f. Read it from the inside out.</p><p>To find fg(x) as an expression, substitute the whole of g(x) into f wherever x appears. If f(x) = 2x + 3 and g(x) = x², then fg(x) = f(x²) = 2x² + 3, while gf(x) = g(2x + 3) = (2x + 3)².</p><p>Notice that fg and gf are different: composite functions are <strong>not commutative</strong> in general, just like the shop discounts. And <strong>f²(x)</strong> means f[f(x)]: apply f twice. It does NOT mean [f(x)]².</p>',
     example:{q:'f(x) = x − 4 and g(x) = 3x. Find fg(x), gf(x) and f²(x).',steps:[{do:'fg(x) = f(3x) = 3x − 4.'},{do:'gf(x) = g(x − 4) = 3(x − 4) = 3x − 12.',why:'Different from fg(x).'},{do:'f²(x) = f(x − 4) = (x − 4) − 4 = x − 8.'}]},
     mistake:'Doing fg in the wrong order. fg(x) = f[g(x)]: the function NEXT to x (g) acts first.',
     check:{q:'f(x) = x + 5, g(x) = 2x. What is fg(3)?',o:['11','16','10'],a:0,why:'g(3) = 6, then f(6) = 11.',hint:'g first.'}},
    {title:'Inverse functions',explain:'<p>The {{inverse function|the function that undoes f}} f⁻¹ <strong>undoes</strong> what f does. If f doubles, f⁻¹ halves. The syllabus compares it to the route from home to school and back: the return trip reverses the journey, step by step, in reverse order.</p><p>To derive f⁻¹(x): <strong>1.</strong> Write y = f(x). <strong>2.</strong> Make x the subject. <strong>3.</strong> Swap x and y (or just write the result as f⁻¹(x)). For f(x) = 2x + 3: y = 2x + 3, so x = (y − 3)/2, and f⁻¹(x) = (x − 3)/2.</p><p>The key relationship: <strong>f f⁻¹(x) = f⁻¹ f(x) = x</strong>. Applying a function and its inverse, in either order, gets you back where you started. On a graph, f⁻¹ is the reflection of f in the line y = x. And f⁻¹(x) does NOT mean 1/f(x).</p>',
     example:{q:'Find the inverse of f(x) = (x + 1)/2, and check it.',steps:[{do:'y = (x + 1)/2, so 2y = x + 1, so x = 2y − 1.'},{do:'f⁻¹(x) = 2x − 1.'},{do:'Check: f(3) = 2, and f⁻¹(2) = 3 ✓'}]},
     mistake:'Thinking f⁻¹(x) = 1/f(x). The −1 means "inverse function", not "one over".',
     check:{q:'f(x) = 4x − 1. What is f⁻¹(x)?',o:['(x + 1)/4','4x + 1','1/(4x − 1)'],a:0,why:'y = 4x − 1, so x = (y + 1)/4.',hint:'Undo in reverse order.'}},
    {title:'Evaluating f⁻¹(a), fg(a) and (fg)⁻¹',explain:'<p>The syllabus asks you to evaluate expressions like f(a), f⁻¹(a) and fg(a). For f⁻¹(a), either find f⁻¹(x) first and substitute, or solve f(x) = a. For fg(a), work from the inside: find g(a), then put that into f.</p><p>You also need the inverse of a composite, <strong>(fg)⁻¹</strong>. Think of socks and shoes: you put on socks (g) first, then shoes (f). To undo it, you take off the shoes first, then the socks. So <strong>(fg)⁻¹ = g⁻¹f⁻¹</strong>: the inverses in reverse order.</p><p>Alternatively, find fg(x) as a single expression, then find its inverse in the usual way. Both methods give the same answer.</p>',
     example:{q:'f(x) = x + 2 and g(x) = 3x. Find (fg)⁻¹(x) and (fg)⁻¹(11).',steps:[{do:'fg(x) = f(3x) = 3x + 2.'},{do:'Inverse: y = 3x + 2, so x = (y − 2)/3. So (fg)⁻¹(x) = (x − 2)/3.'},{do:'(fg)⁻¹(11) = 9/3 = 3. Check: fg(3) = 11 ✓'}]},
     mistake:'Writing (fg)⁻¹ = f⁻¹g⁻¹. The order reverses: (fg)⁻¹ = g⁻¹f⁻¹.',
     check:{q:'f(x) = 2x − 1. What is f⁻¹(9)?',o:['5','17','4'],a:0,why:'2x − 1 = 9 gives x = 5.',hint:'Solve f(x) = 9.'}}]}]},
