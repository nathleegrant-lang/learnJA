 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 2',unit:'Module 2: Algebra 2',strand:'Algebra',standard:'Module 2, Algebra 2: appreciate the use of algebra as a language and a form of communication; appreciate the role of symbols and algebraic techniques in solving problems in mathematics and related fields; demonstrate the ability to reason with abstract entities.',

   blocks:[{type:'mcq',star:true,questions:[{q:'Solve 3x − 4 = 11.',o:['5','7/3','2.33'],a:0,why:'3x = 15.',teach:'Add 4 to both sides (3x = 15), then divide by 3.'},{q:'Multiply 2x − 3y = 5 by 3.',o:['6x − 9y = 15','6x − 3y = 5','6x − 9y = 5'],a:0,why:'Every term is multiplied.',teach:'Multiply EVERY term on both sides by 3: 6x − 9y = 15.'},{q:'(5x + 2y) − (5x − 3y) = ?',o:['5y','−y','10x − y'],a:0,why:'2y − (−3y) = 5y.',teach:'5x − 5x = 0, and 2y − (−3y) = 2y + 3y = 5y.'},{q:'If y = 2x and x + y = 12, what is x?',o:['4','6','3'],a:0,why:'x + 2x = 12.',teach:'Swap y for 2x: 3x = 12, so x = 4.'}]}]},

   blocks:[{type:'custom',star:true,html:'<div class="tile"><p style="margin:0"><span class="badge ewN"></span> <strong class="ewQ"></strong></p><p class="ewE" style="margin:6px 0 0;font-size:1.08rem"></p></div><div class="controls"><label for="ewM1">Multiply (1) by</label><select id="ewM1"></select><label for="ewM2">Multiply (2) by</label><select id="ewM2"></select><label for="ewOp">then</label><select id="ewOp"><option value="add">add them</option><option value="sub">subtract (1) − (2)</option></select></div><div class="tile ewOut" aria-live="polite" style="font-size:1.05rem"></div><div class="controls"><input type="text" class="ewA" aria-label="Your answer" placeholder="x, y"><button type="button" class="go ewC">Check</button></div><div class="fb ewFb" aria-live="polite">Use the workbench, then type the solution.</div>',
     init:function(box,api){var P=[[[2,3,12],[4,-3,6],[3,2]],[[3,2,16],[1,2,8],[4,2]],[[3,4,18],[2,3,13],[2,3]]],k=api.get('k')||0;['#ewM1','#ewM2'].forEach(function(id){var s=box.querySelector(id);[-5,-4,-3,-2,-1,1,2,3,4,5].forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;if(v===1)o.selected=true;s.appendChild(o)})});function draw(){if(k>=P.length){box.querySelector('.ewN').textContent='All done';box.querySelector('.ewQ').textContent='You solved every pair!';box.querySelector('.ewE').textContent='';box.querySelector('.ewOut').textContent='';box.querySelector('.ewC').disabled=true;return}var p=P[k],m1=+box.querySelector('#ewM1').value,m2=+box.querySelector('#ewM2').value,op=box.querySelector('#ewOp').value,e1=p[0].map(function(v){return v*m1}),e2=p[1].map(function(v){return v*m2}),r=e1.map(function(v,i){return op==='add'?v+e2[i]:v-e2[i]});box.querySelector('.ewN').textContent='Pair '+(k+1)+' of 3';box.querySelector('.ewQ').textContent='Solve:';box.querySelector('.ewE').innerHTML='(1) '+EQS(p[0][0],p[0][1],p[0][2])+'<br>(2) '+EQS(p[1][0],p[1][1],p[1][2]);var msg='(1) × '+fs(m1)+':  '+EQS(e1[0],e1[1],e1[2])+'<br>(2) × '+fs(m2)+':  '+EQS(e2[0],e2[1],e2[2])+'<br><strong>'+(op==='add'?'Add':'Subtract')+':  '+EQS(r[0],r[1],r[2])+'</strong><br>';if(r[0]===0&&r[1]!==0)msg+='✓ x is eliminated! So y = '+fs(r[2])+' ÷ '+fs(r[1])+' = <strong>'+fs(r[2]/r[1])+'</strong>. Now substitute back into (1) to find x.';else if(r[1]===0&&r[0]!==0)msg+='✓ y is eliminated! So x = '+fs(r[2])+' ÷ '+fs(r[0])+' = <strong>'+fs(r[2]/r[0])+'</strong>. Now substitute back into (1) to find y.';else msg+='Neither unknown has disappeared yet. Try different multipliers, or switch between add and subtract.';box.querySelector('.ewOut').innerHTML=msg}['#ewM1','#ewM2','#ewOp'].forEach(function(id){box.querySelector(id).addEventListener('change',draw)});box.querySelector('.ewC').onclick=function(){var m=String(box.querySelector('.ewA').value).replace(/−/g,'-').replace(/[()\sxy=]/gi,'').split(',').map(Number),fb=box.querySelector('.ewFb'),s=P[k][2];if(m.length===2&&m[0]===s[0]&&m[1]===s[1]){fb.className='fb ok ewFb';fb.textContent='✓ Correct! x = '+s[0]+', y = '+s[1]+'. It works in both equations.';k++;api.set('k',k);box.querySelector('.ewA').value='';box.querySelector('#ewM1').value='1';box.querySelector('#ewM2').value='1';draw();if(k===P.length)api.complete()}else{fb.className='fb no ewFb';fb.textContent='Not yet. Eliminate one unknown, find it, then substitute to find the other. Type x, y.'}};draw()}},
    {type:'recall',text:'An adult ticket is $800 (and a student ticket $600). Multiply 2a + 3s = 3,400 by 2 to get 4a + 6s = 6,800; subtract 4a + s = 3,800: 5s = 3,000, so s = 600, then a = 800.'}]},
  {phase:'explain',name:'Teach: elimination',title:'Learn: simultaneous equations and elimination',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Same sign: subtract. Different sign: add.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What simultaneous equations are',explain:'<p>One equation with two unknowns, like 2a + 3s = 3,400, has endless solutions: a could be $800 and s $600, or a $1,100 and s $400, and so on. One clue is not enough.</p><p>A second equation, 4a + s = 3,800, narrows it down to exactly one pair that works in <strong>both</strong> equations at the same time. Two equations like this are called {{simultaneous equations|two equations that must both be true at the same time}}: “simultaneous” means “at the same time”.</p><p>On a graph, each linear equation is a straight line, and the solution is where the two lines cross. Algebraically, the two main methods are elimination and substitution. Whichever you use, always check your answer in <strong>both</strong> original equations.</p>',
     example:{q:'Is x = 3, y = 2 the solution of 2x + 3y = 12 and 4x − 3y = 6?',steps:[{do:'First equation: 2(3) + 3(2) = 6 + 6 = 12 ✓'},{do:'Second equation: 4(3) − 3(2) = 12 − 6 = 6 ✓'},{do:'It works in both, so it is the solution.'}]},
     mistake:'Checking in only one equation. A pair can satisfy one equation and fail the other.',
     check:{q:'Which pair solves x + y = 7 and x − y = 1?',o:['x = 4, y = 3','x = 5, y = 2','x = 3, y = 4'],a:0,why:'4 + 3 = 7 and 4 − 3 = 1.',hint:'Test in both.'}},
    {title:'Elimination by adding or subtracting',explain:'<p>The idea of {{elimination|removing one unknown by adding or subtracting the equations}} is to add or subtract the equations so that one unknown disappears completely.</p><p>Look at the {{coefficients|numbers in front of the letters}} of one letter. If they are the <strong>same number with opposite signs</strong>, like +3y and −3y, <strong>add</strong> the equations: they cancel to 0. If they are the <strong>same number with the same sign</strong>, like +2y and +2y, <strong>subtract</strong> one equation from the other.</p><p>A handy memory: “<strong>S</strong>ame <strong>S</strong>ign <strong>S</strong>ubtract.” Once one unknown is gone, solve for the other, then substitute it back into either original equation.</p>',
     example:{q:'Solve 3x + 2y = 16 and x + 2y = 8.',steps:[{do:'The y terms are both +2y: same sign, so subtract.'},{do:'(3x + 2y) − (x + 2y) = 16 − 8, so 2x = 8 and x = 4.'},{do:'Substitute into x + 2y = 8: 4 + 2y = 8, so y = 2. Check: 12 + 4 = 16 ✓'}]},
     mistake:'Subtracting only some terms. Subtract EVERY term, including the right-hand side.',
     check:{q:'Solve 5x + y = 17 and 2x − y = 4. What is x?',o:['3','13/3','7'],a:0,why:'Add: 7x = 21.',hint:'+y and −y: add.'}},
    {title:'Multiplying first, then eliminating',explain:'<p>Often neither unknown has matching coefficients. Then <strong>multiply</strong> one or both equations by a number so that one unknown does match. Remember to multiply <strong>every</strong> term, on both sides.</p><p>For 3x + 4y = 18 and 2x + 3y = 13: to match the x terms, multiply the first by 2 and the second by 3. That gives 6x + 8y = 36 and 6x + 9y = 39. Now the x terms are the same, so subtract: −y = −3, so y = 3. Then 3x + 12 = 18, so x = 2.</p><p>It is like finding a common denominator: you make the coefficients of one letter equal to their lowest common multiple.</p>',
     example:{q:'The concert puzzle: 2a + 3s = 3,400 and 4a + s = 3,800.',steps:[{do:'Multiply the first equation by 2: 4a + 6s = 6,800.',why:'Now both equations have 4a.'},{do:'Subtract the second: (4a + 6s) − (4a + s) = 6,800 − 3,800, so 5s = 3,000 and s = 600.'},{do:'Substitute: 4a + 600 = 3,800, so 4a = 3,200 and a = 800. Adult $800, student $600.'}]},
     mistake:'Multiplying the left side but not the right. 2a + 3s = 3,400 times 2 is 4a + 6s = 6,800, not 3,400.',
     check:{q:'To eliminate y from 2x + 3y = 7 and 5x − 2y = 8, multiply the equations by…',o:['2 and 3, then add','3 and 2, then subtract','5 and 2, then add'],a:0,why:'6y and −6y, then add.',hint:'Make the y coefficients 6 and −6.'}}]}]},
  {phase:'explain',name:'Teach: substitution and worded problems',title:'Learn: substitution, worded problems, and demand and supply',lead:'Next, a second algebraic method, and real problems that need two equations.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'One letter alone? Swap it inna di odda equation.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The substitution method',explain:'<p>{{Substitution|replacing a letter with an equal expression from the other equation}} is best when one equation already has a letter on its own, like y = 2x − 1, or can easily be rearranged to give one.</p><p>The steps: <strong>1.</strong> Make one letter the subject of one equation. <strong>2.</strong> Substitute that expression into the other equation, which now has only one unknown. <strong>3.</strong> Solve it. <strong>4.</strong> Substitute back to find the other letter.</p><p>Use brackets when you substitute, so the signs come out right: if y = 2x − 1, then 3x − 2y = 1 becomes 3x − 2(2x − 1) = 1.</p>',
     example:{q:'Solve y = 2x − 1 and 3x − 2y = 1.',steps:[{do:'Substitute: 3x − 2(2x − 1) = 1.'},{do:'Expand: 3x − 4x + 2 = 1, so −x = −1 and x = 1.'},{do:'y = 2(1) − 1 = 1. Check: 3 − 2 = 1 ✓'}]},
     mistake:'Forgetting the brackets: 3x − 2 × 2x − 1 gives the wrong sign on the 1.',
     check:{q:'Solve x = 3y and x + y = 20. What is y?',o:['5','15','4'],a:0,why:'3y + y = 20, so 4y = 20.',hint:'Swap x for 3y.'}},
    {title:'Forming equations from worded problems',explain:'<p>Many CSEC questions give a story, and you must create the two equations yourself. Here is a reliable plan.</p><p><strong>1.</strong> Choose a letter for each unknown, and write down what it means, such as “let a = the cost of an adult ticket, in dollars”. <strong>2.</strong> Turn each fact in the story into one equation. <strong>3.</strong> Solve the pair. <strong>4.</strong> Answer the question in words, with units, and check that the answer makes sense in the story.</p><p>Look for two separate facts, often two purchases, two totals, or a total and a difference.</p>',
     example:{q:'A farmer has chickens and goats: 30 animals with 84 legs in total. How many of each?',steps:[{do:'Let c = chickens and g = goats. Animals: c + g = 30. Legs: 2c + 4g = 84.'},{do:'Multiply the first by 2: 2c + 2g = 60. Subtract from the second: 2g = 24, so g = 12.'},{do:'c = 30 − 12 = 18. So 18 chickens and 12 goats. Check legs: 36 + 48 = 84 ✓'}]},
     mistake:'Using one letter for two different things. Define each letter clearly before you start.',
     check:{q:'Two numbers add to 50 and differ by 14. What is the bigger number?',o:['32','18','36'],a:0,why:'x + y = 50 and x − y = 14, so 2x = 64.',hint:'Add the equations.'}},
    {title:'Demand and supply',explain:'<p>The syllabus links simultaneous equations to business studies. The {{demand|how much buyers want at each price}} for a product is how much buyers want at each price: usually, as the price goes up, people buy less. The {{supply|how much sellers offer at each price}} is how much sellers will offer: as the price goes up, they want to sell more.</p><p>Both can be written as linear equations linking price p and quantity q. The {{equilibrium|where demand equals supply}} is the price where the amount people want to buy equals the amount sellers offer. It is the solution of the two equations: where the demand and supply lines cross.</p><p>For example, if demand is p = 200 − 2q and supply is p = 50 + 3q, then at equilibrium 200 − 2q = 50 + 3q, so 150 = 5q, q = 30, and p = $140.</p>',visual:SDG(),
     example:{q:'Mango demand: p = 120 − q. Supply: p = 40 + q (p in dollars, q in hundreds of mangoes). Find the equilibrium.',steps:[{do:'At equilibrium, the prices are equal: 120 − q = 40 + q.'},{do:'80 = 2q, so q = 40 (4,000 mangoes).'},{do:'p = 120 − 40 = $80 each.'}]},
     mistake:'Solving for q and forgetting to find the price p. Equilibrium needs BOTH the price and the quantity.',
     check:{q:'Demand p = 90 − 3q, supply p = 30 + q. What is q at equilibrium?',o:['15','30','20'],a:0,why:'90 − 3q = 30 + q, so 60 = 4q.',hint:'Set them equal.'}}]}]},
