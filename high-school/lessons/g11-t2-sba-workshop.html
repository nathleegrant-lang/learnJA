 goals:['explain what the CSEC Mathematics SBA project requires: format, length, group size and submission','choose a suitable real-world topic and write a clear title and objectives','plan, collect, present and analyse data, showing every step','write a conclusion based on the analysis, and use the official mark scheme to check the project'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 2',unit:'School-Based Assessment (Paper 031)',strand:'School-Based Assessment',standard:'Guidelines for the School-Based Assessment: the project should allow candidates to probe, describe and explain a mathematical area of interest and communicate the findings using mathematical symbols, language and tools.',
  objectives:['Paper 031 comprises a project. The project requires candidates to demonstrate the practical application of Mathematics in everyday life.','The topic(s) chosen may be from any section or combination of different sections of the syllabus.','The length of the report should be maximum 1000 words, not including appropriate quotations, sources, charts, graphs, tables, pictures, references and appendices.','Students are encouraged to work in groups of no more than six.','The project will be presented in the form of a report and will have the following parts: Project Title; Introduction; Method of Data Collection; Presentation of Data; Analysis of Data; Conclusion.'],
  focus:'The purpose of the project; choosing a real-world topic (the syllabus gives "Hire Purchase or Cash?" and "Sports Utility Vehicles versus Cars" as sample areas); the main activities (stating the task, planning, carrying out, recording, concluding); the six parts of the report; the 30-mark scheme (Title 2, Introduction 6, Method 3, Presentation 8, Analysis 6, Conclusion 3, Overall presentation 2); the seven problem-solving strategies; electronic submission.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Guidelines for the School-Based Assessment. All criteria and marks in this lesson are quoted from the syllabus mark scheme. Note: the syllabus text describes Paper 031 as "30 per cent of Total Assessment", while its Assessment Grid allocates the SBA 20 of 100 weighted marks; teachers should confirm the current weighting with CXC. Always follow your teacher’s and CXC’s latest instructions.'},
 glossary:[['SBA','School-Based Assessment: the project part of the CSEC examination (Paper 031).'],['Objective','A clear statement of what the project aims to find out.'],['Primary data','Data you collect yourself, for example by survey, measurement or observation.'],['Secondary data','Data collected by someone else, such as from a website or a report.'],['Raw data','The original data, before it is organised or analysed.'],['Analysis','Using mathematics (calculations, formulas, statistics) to make sense of the data.'],['Conclusion','The findings, based on the analysis, that answer the objectives.'],['Moderation','CXC re-marks a sample of projects to check that teachers’ marks are consistent.']],

  misconceptions:['Choosing a topic with no real data to collect or analyse.','Writing objectives that do not match the title.','Presenting graphs without titles, labels or scales.','Showing only final answers in the analysis (all steps must be shown).','Writing a conclusion that is not based on the analysis, or that ignores the objectives.','Going far over the 1,000-word limit.'],

 steps:[
  {phase:'engage',name:'Choosing a topic',title:'Which topic would make the best project?',lead:'Four groups at a school in May Pen suggest SBA topics: (A) "My favourite football team"; (B) "Is it cheaper to buy a fridge by hire purchase or cash?"; (C) "The history of mathematics"; (D) "Why maths is important".',

  {phase:'explore',name:'Mark scheme self-check',title:'Explore: the mark scheme self-check',lead:'These are the official CSEC criteria for the SBA project, worth 30 marks in total. Tick every criterion a project meets, and the tool adds up the marks section by section.',
   mission:['Tick the criteria for a strong project. Which sections carry the most marks?','Untick "ALL steps of the analysis shown". What happens?','Complete all 3 challenges for a star.'],
   patois:'Know di mark scheme before yuh start.',
   blocks:[{type:'custom',star:true,html:'<div class="tile sbList"></div><div class="scene sbSvg"></div><div class="tile sbOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge sbN"></span> <strong class="sbQ"></strong></p><div class="controls"><input type="number" class="sbIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go sbC">Check</button></div><div class="fb sbFb" aria-live="polite">Use the self-check to help you.</div></div>',
     init:function(box,api){var list=box.querySelector('.sbList'),boxes=[];CRIT.forEach(function(sec,si){var h=document.createElement('p');h.style.margin='8px 0 4px';h.innerHTML='<strong>'+sec[0]+'</strong>';list.appendChild(h);sec[1].forEach(function(c){var l=document.createElement('label');l.style.display='block';l.style.margin='2px 0';var e=document.createElement('input');e.type='checkbox';e.addEventListener('change',draw);boxes.push([e,si,c[1]]);l.appendChild(e);l.appendChild(document.createTextNode(' '+c[0]+' ('+c[1]+' mark'+(c[1]>1?'s':'')+')'));list.appendChild(l)})});function draw(){var sc=[0,0,0,0,0,0,0];boxes.forEach(function(b){if(b[0].checked)sc[b[1]]+=b[2]});var t=sc.reduce(function(a,b){return a+b},0);box.querySelector('.sbSvg').innerHTML=BAR(sc);box.querySelector('.sbOut').innerHTML='<strong>Total: '+t+' / 30</strong>.'+(t===30?' A perfect score!':'')+' The biggest sections are Presentation of Data (8 marks), Introduction (6) and Analysis of Data (6).'}var Q=[{t:'How many marks are available for Presentation of Data?',a:8},{t:'What is the maximum length of the report, in words?',a:1000},{t:'What is the largest group size the syllabus encourages?',a:6}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.sbN').textContent='All done';box.querySelector('.sbQ').textContent='You completed every challenge!';box.querySelector('.sbC').disabled=true;return}box.querySelector('.sbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.sbQ').textContent=Q[q].t}box.querySelector('.sbC').onclick=function(){var v=parseFloat(box.querySelector('.sbIn').value),fb=box.querySelector('.sbFb');if(v===Q[q].a){fb.className='fb ok sbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.sbIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no sbFb';fb.textContent=q===0?'Add up the marks in the Presentation of Data section.':'Not yet. Look back at the lesson introduction, or the teacher notes.'}};draw();task()}},
    {type:'recall',text:'Topic B is best: it is a real-world problem, you can collect genuine data (prices, interest, instalments), and the mathematics (consumer arithmetic, percentages) gives a clear answer. Topics A, C and D have no clear question to investigate with data.'}]},
  {phase:'explain',name:'Teach: the project and its parts',title:'Learn: what the SBA is, choosing a topic, and the six parts',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Read each example and the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Real problem, real data, real maths.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What the SBA project is',explain:'<p>The {{SBA|School-Based Assessment, Paper 031}} (Paper 031) is a <strong>project</strong>. The syllabus says it “requires candidates to demonstrate the practical application of Mathematics in everyday life”: to investigate, describe and explain something real, using mathematics.</p><p>Key facts from the syllabus:</p><p>• The topic can come from <strong>any section</strong>, or a combination of sections, of the syllabus.<br>• The report has a <strong>maximum of 1,000 words</strong> (not counting quotations, sources, charts, graphs, tables, pictures, references and appendices).<br>• You are encouraged to work in groups of <strong>no more than six</strong>.<br>• The project is marked out of <strong>30</strong> by your teacher, then a sample is checked by CXC through {{moderation|CXC re-marking a sample to check consistency}}.<br>• It is submitted electronically, as a single word-processing document (preferably PDF) with all images embedded.</p>',
     example:{q:'A group writes 1,600 words of text, plus four graphs and two tables. Is that within the limit?',steps:[{do:'Graphs and tables do not count towards the 1,000 words.'},{do:'But 1,600 words of text is over the maximum.'},{do:'They should cut the text to 1,000 words or fewer.'}]},
     mistake:'Thinking the word limit includes tables and graphs. It does not, but the written text must stay within 1,000 words.',
     check:{q:'What is the SBA project marked out of?',o:['30','100','20'],a:0,why:'The mark scheme totals 30.',hint:'Add up the sections.'}},
    {title:'Choosing a good topic',explain:'<p>A good topic is a <strong>real-world problem</strong> that you can investigate with <strong>genuine data</strong> and answer with <strong>mathematics</strong>. The syllabus gives two sample areas:</p><p>• <strong>Hire Purchase or Cash?</strong> An explanation of the advantages and disadvantages of hire purchase, using data collected from at least two stores.<br>• <strong>Sports Utility Vehicles versus Cars:</strong> comparing the costs of different types of vehicles, considering fuel economy, maintenance and features.</p><p>Other good Jamaican examples: Which phone plan is best value for students? Does the time spent on homework relate to test scores? Which route to school is fastest? How much water does a household use, and what does it cost?</p><p>The {{objective|what the project aims to find out}} should be clear and testable. The syllabus suggests defining problems in personal ways, by what motivated them.</p>',
     example:{q:'Turn "Phones" into a good SBA title.',steps:[{do:'"Phones" is a subject, not a problem.'},{do:'Make it a real question you can answer with data: "Which mobile data plan gives students the best value for money?"'},{do:'You can collect prices and data allowances, then calculate the cost per GB.'}]},
     mistake:'Choosing a topic with no data to analyse, such as "The history of mathematics".',
     check:{q:'Which title relates to a real-world problem?',o:['Is it cheaper to buy a laptop by hire purchase or cash?','Mathematics','My favourite number'],a:0,why:'It is a real question with data to collect.',hint:'A question you can investigate.'}},
    {title:'The six parts of the report',explain:'<p>The syllabus says the report has six parts:</p><p><strong>1. Project Title</strong>: clear, concise, about a real-world problem (a statement or a question).<br><strong>2. Introduction</strong>: the objective(s), the background (context), the purpose, and the method of analysis you will use.<br><strong>3. Method of Data Collection</strong>: how you collected the data, described clearly enough for someone else to repeat.<br><strong>4. Presentation of Data</strong>: your data, organised in at least one table and at least one graph, chart or diagram, with titles, headers and labels.<br><strong>5. Analysis of Data</strong>: the mathematics, with accurate formulas and <strong>every step shown</strong>.<br><strong>6. Conclusion</strong>: your findings, based on the analysis, answering your objectives.</p>',visual:BAR([2,6,3,8,6,3,2],'The maximum marks for each section of the SBA'),
     example:{q:'In which part does "We surveyed 40 students at our school using a questionnaire during lunch" belong?',steps:[{do:'It describes HOW the data was collected.'},{do:'So it belongs in the Method of Data Collection.'}]},
     mistake:'Putting the method of analysis only in the analysis section. The Introduction must also STATE the method of analysis (2 marks).',
     check:{q:'Which part is worth the most marks?',o:['Presentation of Data (8)','Project Title (2)','Conclusion (3)'],a:0,why:'8 marks.',hint:'Look at the bar chart.'}}]}]},
  {phase:'explain',name:'Teach: data, analysis and conclusion',title:'Learn: collecting and presenting data, analysis, and the conclusion',lead:'Next, how to earn the marks in the middle and final sections.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Read each example and the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Show ALL di steps.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Collecting and presenting data',explain:'<p>Your data must be <strong>genuinely obtained, accurate and well organised</strong> (2 marks). {{Primary data|data you collect yourself}} comes from your own survey, measurement or observation; {{secondary data|data collected by someone else}} comes from stores, websites or reports. Many good projects use both.</p><p>Describe your method clearly: who, what, when, where, how many. For example: “We visited three appliance stores in May Pen on 12 March and recorded the cash price and hire-purchase terms for the same fridge model.”</p><p>Presentation marks (8 in total) need: at least one <strong>table</strong>, clearly presented, with a title and headers; and at least one <strong>graph, chart or diagram</strong>, with a title, correct labels, and scales or keys. The syllabus warns: if {{raw data|the original data before analysis}} is NOT presented, you can earn at most 2 marks here. Put it in a table or an appendix.</p>',
     example:{q:'A group’s bar chart has bars but no title and no axis labels. Which marks does it lose?',steps:[{do:'"At least one graph with an appropriate title" (1 mark): lost.'},{do:'"Correct labels, scales and keys" (2 marks): lost.'},{do:'Adding a title and labelled axes earns those 3 marks back.'}]},
     mistake:'Leaving out the raw data. Without it, Presentation of Data is capped at 2 marks.',
     check:{q:'If raw data is NOT presented, the most you can earn for Presentation of Data is…',o:['2 marks','8 marks','0 marks'],a:0,why:'The syllabus caps it at 2.',hint:'A note in the mark scheme.'}},
    {title:'Analysis of data: show every step',explain:'<p>The {{analysis|using mathematics to make sense of the data}} is where your mathematics shines (6 marks). You need to: attempt the analysis (1); use accurate formulas or equations (1); use the data accurately, in a way that relates to your objectives (2); and show <strong>all</strong> steps, accurately (2).</p><p>The syllabus is clear: candidates who do not show working will NOT be awarded full marks for this section.</p><p>Choose mathematics that fits your question: percentages and interest for consumer topics; mean, median, range and graphs for surveys; rates and unit costs for comparisons; gradients for trends. Write each formula, substitute your numbers, and give the result with units.</p>',
     example:{q:'Hire purchase: a fridge costs $85,000 cash, or a $15,000 deposit plus 12 payments of $7,000. Show the analysis.',steps:[{do:'Total hire-purchase price = deposit + instalments = $15,000 + 12 × $7,000 = $15,000 + $84,000 = $99,000.'},{do:'Extra cost = $99,000 − $85,000 = $14,000.'},{do:'Percentage extra = 14,000 ÷ 85,000 × 100 ≈ 16.5%.'}]},
     mistake:'Writing only "HP costs $14,000 more". Show the formula and every calculation.',
     check:{q:'How many marks can you get for Analysis without showing working?',o:['Not full marks','Full marks','Exactly 6'],a:0,why:'All steps must be shown for full marks.',hint:'Show your work.'}},
    {title:'Conclusion, presentation and strategies',explain:'<p>The {{conclusion|findings based on the analysis}} (3 marks) must be <strong>based on your analysis</strong> (1) and <strong>related to your objectives</strong> (2). Answer your question directly: “Buying the fridge by hire purchase costs about 16.5% more than paying cash, so cash is cheaper if the family can save the full price.” You can also comment on how to improve the findings or make them more useful.</p><p><strong>Overall presentation</strong> (2 marks) rewards clear, logical writing with correct grammar.</p><p>The syllabus lists <strong>seven strategies</strong> for solving problems: use simple numbers first; sketch a simple diagram; make a table of results; guess and check; look for patterns; use algebraic symbols; and make full use of calculators. Use the ones that fit your project.</p>',
     example:{q:'A conclusion says: "We think hire purchase is bad." What is wrong with it?',steps:[{do:'It is an opinion, not based on the analysis.'},{do:'It does not mention the numbers or the objective.'},{do:'Better: "Our analysis shows hire purchase costs $14,000 (16.5%) more, so cash is the cheaper option."'}]},
     mistake:'Writing a conclusion that introduces new ideas not supported by your analysis.',
     check:{q:'A conclusion earns full marks when it is…',o:['based on the analysis and related to the objectives','long and detailed','written as an opinion'],a:0,why:'Those are the two criteria.',hint:'Evidence and objectives.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then work through a project plan step by step.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Answer the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'The basics',text:'Paper 031 project, marked out of 30. Maximum 1,000 words of text. Groups of no more than 6. Submit one document (preferably PDF) with images embedded.'},{title:'The six parts',text:'Title (2), Introduction (6), Method of Data Collection (3), Presentation of Data (8), Analysis of Data (6), Conclusion (3), plus Overall Presentation (2).'},{title:'Earning marks',text:'Clear objectives; genuine data; at least one titled table and one titled, labelled graph; raw data shown; every analysis step shown.'},{title:'Conclusion',text:'Based on the analysis and related to the objectives. Comment on improvements.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Plan the Introduction for "Which mobile data plan gives students the best value?"',steps:[{do:'Objective: to find which of three data plans has the lowest cost per gigabyte.'},{do:'Background: many students buy data for school work, and prices vary.'},{do:'Method of analysis: calculate the cost per GB for each plan and compare them in a bar chart.'}]},
     {type:'fill',q:'A plan costs $1,500 for 6 GB. Find the cost per GB.',steps:[{text:'Cost per GB = 1,500 ÷ 6 = $___',blank:true,a:250,hint:'Divide.'}],sol:'$250 per GB.'},
     {type:'own',q:'How many marks does the mark scheme give for the Conclusion?',a:3,hint:'1 + 2.',sol:'3.'},

  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Which section?',desc:'Sort each sentence into its report section.',level:'⭐ Warm-up',mins:5,block:{type:'sort',tip:'What job does each sentence do?',bins:[{id:'i',label:'Introduction'},{id:'m',label:'Method'},{id:'a',label:'Analysis'},{id:'c',label:'Conclusion'}],items:[{label:'Our objective is to find the cheapest data plan.',bin:'i'},{label:'We surveyed 40 students during lunch on Friday.',bin:'m'},{label:'Mean = 1,240 ÷ 40 = 31 minutes.',bin:'a'},{label:'Plan B is the best value, at $200 per GB.',bin:'c'},{label:'Many students struggle to afford data for school work.',bin:'i'},{label:'Percentage extra = 14,000 ÷ 85,000 × 100 ≈ 16.5%.',bin:'a'}]}},
    {icon:'🃏',title:'Match the marks',desc:'Match each section to its marks.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Project Title','2 marks'],['Introduction','6 marks'],['Method of Data Collection','3 marks'],['Presentation of Data','8 marks'],['Analysis of Data','6 marks'],['Conclusion','3 marks']]}},
    {icon:'📏',title:'Project steps',desc:'Order the main project activities from the syllabus.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Tap the main activities for the project in the order the syllabus gives them.',rounds:[[{label:'State the task: its nature, scope and focus',v:1,show:'step 1'},{label:'Plan: what, how, materials, procedures',v:2,show:'step 2'},{label:'Carry out the plan',v:3,show:'step 3'},{label:'Record what you did, how and why',v:4,show:'step 4'},{label:'Conclusion: findings, comments, improvements',v:5,show:'step 5'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Graphs and tables count towards the 1,000-word limit.',a:'never',why:'They are excluded from the word count.'},{s:'A project can use topics from more than one section of the syllabus.',a:'always',why:'The syllabus allows any section or combination.'},{s:'Full Analysis marks can be earned without showing working.',a:'never',why:'All steps must be shown.'},{s:'A group project has more than six members.',a:'never',why:'Groups should have no more than six.'},{s:'Secondary data can be used in the project.',a:'sometimes',why:'Yes, but it must be genuine, accurate and well organised, and your teacher may prefer primary data.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the problem in each project extract.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Group A',q:'Title.',lines:['Title: "Maths in Jamaica"'],wrong:0,reasons:['It is not a clear, concise real-world problem; make it a question to investigate','It is too short','It needs a picture'],reason:0,fix:'For example: "Which route from Spanish Town to school is the fastest?"'},{who:'Group B',q:'Presentation of Data.',lines:['A bar chart with no title or axis labels'],wrong:0,reasons:['Graphs need a title, labelled axes and a scale (3 marks)','It should be a pie chart','It should be coloured'],reason:0,fix:'Add a title, axis labels with units, and a scale.'},{who:'Group C',q:'Conclusion.',lines:['"We feel cars are better than SUVs."'],wrong:0,reasons:['It is an opinion: it must be based on the analysis and related to the objectives','It is too short','It should be in the Introduction'],reason:0,fix:'State what the analysis showed, e.g. "The car costs $X less per year to run…"'}]}},
