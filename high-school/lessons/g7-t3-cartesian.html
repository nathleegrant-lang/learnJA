var CART=function(pts,o){o=o||{};var S=24,O=170,X=function(x){return O+S*x},Y=function(y){return O-S*y},s='<svg viewBox="0 0 340 340" role="img" aria-label="'+(o.label||'Cartesian plane')+'"><rect width="340" height="340" fill="#faf8fe"/>';for(var i=-6;i<=6;i++){s+='<line x1="'+X(i)+'" y1="'+Y(-6)+'" x2="'+X(i)+'" y2="'+Y(6)+'" stroke="#e6dff4"/><line x1="'+X(-6)+'" y1="'+Y(i)+'" x2="'+X(6)+'" y2="'+Y(i)+'" stroke="#e6dff4"/>';if(i)s+='<text x="'+X(i)+'" y="'+(O+14)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+f7(i)+'</text><text x="'+(O-5)+'" y="'+(Y(i)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">'+f7(i)+'</text>'}s+='<line x1="'+X(-6)+'" y1="'+O+'" x2="'+X(6)+'" y2="'+O+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+O+'" y1="'+Y(-6)+'" x2="'+O+'" y2="'+Y(6)+'" stroke="#3d2a73" stroke-width="2"/><text x="'+(X(6)-4)+'" y="'+(O-6)+'" font-size="13" font-weight="700" text-anchor="end" fill="#3d2a73">x</text><text x="'+(O+6)+'" y="'+(Y(6)+12)+'" font-size="13" font-weight="700" fill="#3d2a73">y</text>';if(o.quad)s+='<g font-size="14" font-weight="700" fill="#6a3fc0" opacity=".7"><text x="'+X(3)+'" y="'+Y(5)+'" text-anchor="middle">1st (+, +)</text><text x="'+X(-3)+'" y="'+Y(5)+'" text-anchor="middle">2nd (−, +)</text><text x="'+X(-3)+'" y="'+Y(-5)+'" text-anchor="middle">3rd (−, −)</text><text x="'+X(3)+'" y="'+Y(-5)+'" text-anchor="middle">4th (+, −)</text></g><text x="'+(O+6)+'" y="'+(O-6)+'" font-size="12" fill="#c02d5f">origin (0, 0)</text>';if(pts&&pts.length){if(o.join)s+='<polyline points="'+pts.map(function(p){return X(p[0])+','+Y(p[1])}).join(' ')+'" fill="'+(o.fill||'none')+'" stroke="#2f5fc4" stroke-width="3"/>';pts.forEach(function(p,i){s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="#c02d5f"/>'+(o.lab?'<text x="'+(X(p[0])+6)+'" y="'+(Y(p[1])-6)+'" font-size="11" font-weight="700" fill="#8f1f2b">'+(o.lab===true?p7(p):o.lab[i])+'</text>':'')})}return s+'</svg>'};
var MAP7=function(dom,cod,pairs,lbl,names){var H=Math.max(dom.length,cod.length)*40+20,s='<svg viewBox="0 0 600 '+(H+50)+'" role="img" aria-label="'+(lbl||'Mapping diagram')+'"><defs><marker id="m7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#c02d5f"/></marker></defs><rect width="600" height="'+(H+50)+'" fill="#faf8fe"/><ellipse cx="150" cy="'+(H/2+35)+'" rx="95" ry="'+(H/2)+'" fill="#e4ecfb" stroke="#2f5fc4" stroke-width="2"/><ellipse cx="450" cy="'+(H/2+35)+'" rx="95" ry="'+(H/2)+'" fill="#fff1dc" stroke="#a85d00" stroke-width="2"/><text x="150" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4a9c">'+(names?names[0]:'Inputs')+'</text><text x="450" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4300">'+(names?names[1]:'Outputs')+'</text>',y=function(i,n){return 35+H/2-(n-1)*20+i*40};dom.forEach(function(d,i){s+='<text x="150" y="'+(y(i,dom.length)+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2140">'+d+'</text>'});cod.forEach(function(c,i){s+='<text x="450" y="'+(y(i,cod.length)+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2140">'+c+'</text>'});pairs.forEach(function(p){var a=dom.indexOf(p[0]),b=cod.indexOf(p[1]);s+='<line x1="'+(150+String(p[0]).length*4+14)+'" y1="'+y(a,dom.length)+'" x2="'+(450-String(p[1]).length*4-16)+'" y2="'+y(b,cod.length)+'" stroke="#c02d5f" stroke-width="2" marker-end="url(#m7)"/>'});return s+'</svg>'};

 glossary:[['Cartesian plane','A flat grid made by two number lines (axes) crossing at right angles.'],['x-axis','The horizontal number line.'],['y-axis','The vertical number line.'],['Origin','The point (0, 0), where the axes cross.'],['Ordered pair','Two numbers in brackets, (x, y), giving a point’s position: across first, then up or down.'],['Quadrant','One of the four regions the axes divide the plane into.'],['Mapping','A rule that links each input to one or more outputs.'],['One-to-one','Each input has one output, and no outputs are shared.'],['Many-to-one','Several inputs share one output.'],['One-to-many','One input has several outputs.'],['Many-to-many','Inputs can have several outputs, and outputs can be shared.']],

 steps:[
  {phase:'engage',name:'The treasure map',title:'Where is the treasure buried?',lead:'A pirate map of a cay off Port Royal says: "Start at the old palm tree. The treasure is at (3, 2)." Two friends argue about where to dig.',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

   blocks:[{type:'mcq',star:true,questions:[{q:'On a number line, where is −3?',o:['3 steps left of 0','3 steps right of 0','At 0'],a:0,why:'Negative numbers are left of zero.',teach:'On a horizontal number line, negative numbers are to the left of zero: −3 is three steps left.'},{q:'Which is bigger: −2 or −5?',o:['−2','−5','They are equal'],a:0,why:'−2 is further right.',teach:'The number further to the right on the number line is bigger. −2 is to the right of −5.'},{q:'If the rule is "add 3", what does 4 become?',o:['7','12','1'],a:0,why:'4 + 3 = 7.',teach:'Follow the rule: 4 + 3 = 7.'},{q:'What is the input if "double it" gives 10?',o:['5','20','8'],a:0,why:'5 × 2 = 10.',teach:'Work backwards: half of 10 is 5.'}]}]},
  {phase:'explore',name:'Point plotter',title:'Explore: the point plotter',lead:'Type a pair of coordinates, such as (3, 2), and press Plot. Each point joins to the one before it. Can you plot the secret shape?',
   mission:['Plot these points in order: (−3, −2), (−3, 2), (0, 5), (3, 2), (3, −2), (−3, −2). What shape appears?','Then try your own points, in all four quadrants.','Complete all 3 challenges for a star.'],
   patois:'Across first, den up or dung.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="ppIn">Point (x, y):</label><input type="text" id="ppIn" placeholder="(3, 2)" style="width:120px"><button type="button" class="go ppGo">Plot</button><button type="button" class="ppUndo">Undo</button><button type="button" class="ppClr">Clear</button></div><div class="scene ppSvg"></div><div class="explain ppX" aria-live="polite">Type a point and press Plot.</div><div class="tile"><p style="margin:0"><span class="badge ppN"></span> <strong class="ppQ"></strong></p><div class="controls"><input type="text" class="ppA" aria-label="Your answer" placeholder="answer"><button type="button" class="go ppC">Check</button></div><div class="fb ppFb" aria-live="polite">Use the plotter to help you.</div></div>',
     init:function(box,api){var pts=[];function parse(s){var m=String(s).replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?\d+),(-?\d+)\)?$/);return m?[+m[1],+m[2]]:null}function quad(p){if(p[0]===0||p[1]===0)return'on an axis';return p[0]>0?(p[1]>0?'1st quadrant':'4th quadrant'):(p[1]>0?'2nd quadrant':'3rd quadrant')}function draw(){box.querySelector('.ppSvg').innerHTML=CART(pts,{join:true,lab:true,quad:!pts.length,label:'Cartesian plane with '+pts.length+' plotted points'});var house=pts.length===HOUSE.length&&pts.every(function(p,i){return p[0]===HOUSE[i][0]&&p[1]===HOUSE[i][1]});if(pts.length){var last=pts[pts.length-1];box.querySelector('.ppX').innerHTML='Last point '+p7(last)+': '+f7(last[0])+' across, then '+f7(last[1])+' up or down. It is in the <strong>'+quad(last)+'</strong>.'+(house?'<br>🏠 You drew a house! The order of the points made the outline.':'')}else box.querySelector('.ppX').textContent='Type a point and press Plot.'}box.querySelector('.ppGo').onclick=function(){var p=parse(box.querySelector('#ppIn').value);if(!p||Math.abs(p[0])>6||Math.abs(p[1])>6){box.querySelector('.ppX').textContent='Type a point like (3, −2), with numbers from −6 to 6.';return}pts.push(p);box.querySelector('#ppIn').value='';draw()};box.querySelector('#ppIn').addEventListener('keydown',function(e){if(e.key==='Enter')box.querySelector('.ppGo').click()});box.querySelector('.ppUndo').onclick=function(){pts.pop();draw()};box.querySelector('.ppClr').onclick=function(){pts=[];draw()};var T=[{t:'Plot the six points in your mission. What shape do they make? (Type one word.)',ok:function(v){return/house|home/.test(v)}},{t:'Which quadrant is the point (−2, 4) in? (Type 1, 2, 3 or 4.)',ok:function(v){return v==='2'||v==='2nd'||v==='second'}},{t:'What are the coordinates of the top of the house’s roof?',ok:function(v){var p=parse(v);return p&&p[0]===0&&p[1]===5}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ppN').textContent='All done';box.querySelector('.ppQ').textContent='You completed every challenge!';box.querySelector('.ppC').disabled=true;return}box.querySelector('.ppN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ppQ').textContent=T[q].t}box.querySelector('.ppC').onclick=function(){var v=String(box.querySelector('.ppA').value).trim().toLowerCase(),fb=box.querySelector('.ppFb');if(T[q].ok(v)){fb.className='fb ok ppFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ppA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ppFb';fb.textContent='Not yet. Use the plotter and look carefully.'}};draw();task()}},
    {type:'recall',text:'(3, 2) means 3 steps ACROSS from the palm tree, then 2 steps UP. The first number is always across (x); the second is up or down (y).'}]},
  {phase:'explain',name:'Teach: the Cartesian plane',title:'Learn: the Cartesian plane and coordinates',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Walk along di corridor, den tek di stairs.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The Cartesian plane',explain:'<p>Long ago, the French mathematician René Descartes had a brilliant idea: what if we could describe the position of any point using just two numbers? The grid he invented is called the {{Cartesian plane|a flat grid made by two number lines crossing at right angles}}, after him.</p><p>It is made of two number lines crossing at right angles. The horizontal one is the {{x-axis|the horizontal number line}}, and the vertical one is the {{y-axis|the vertical number line}}. They cross at the {{origin|the point (0, 0), where the axes cross}}, the point (0, 0), which is the starting point for everything.</p><p>The axes cut the plane into four regions called {{quadrants|the four regions the axes divide the plane into}}. They are numbered 1st, 2nd, 3rd and 4th, going anticlockwise and starting at the top right.</p>',visual:CART([],{quad:true,label:'Cartesian plane showing the four quadrants and the origin'}),
     example:{q:'In which quadrant are both coordinates negative?',steps:[{do:'Negative x means left of the y-axis. Negative y means below the x-axis.'},{do:'Left and below: the bottom-left region.'},{do:'That is the 3rd quadrant.'}]},
     mistake:'Numbering the quadrants clockwise. They go ANTICLOCKWISE: 1st top right, 2nd top left, 3rd bottom left, 4th bottom right.',
     check:{q:'Where do the x-axis and y-axis cross?',o:['At the origin, (0, 0)','At (1, 1)','At the top of the grid'],a:0,why:'The origin is where both axes are zero.',hint:'The starting point.'}},
    {title:'Writing, plotting and reading coordinates',explain:'<p>Every point on the plane has an address: an {{ordered pair|two numbers in brackets, (x, y)}} written as <strong>(x, y)</strong>. The first number, x, tells you how far to go <strong>across</strong>: right if it is positive, left if it is negative. The second number, y, tells you how far to go <strong>up</strong> (positive) or <strong>down</strong> (negative).</p><p>The order really matters. (3, 2) and (2, 3) are different points! A handy way to remember: “Along the corridor, then up the stairs.” You walk along first, then climb.</p><p>To <strong>plot</strong> a point, always start at the origin, move across, then up or down, and mark a dot. To <strong>read</strong> a point, do the opposite: from the origin, count how far across it is, then how far up or down.</p>',visual:CART([[3,2],[-4,1],[-2,-3],[4,-2]],{lab:true,label:'Points (3, 2), (−4, 1), (−2, −3) and (4, −2) plotted'}),
     example:{q:'Plot the points A(−4, 1) and B(2, −3).',steps:[{do:'A(−4, 1): from the origin, go 4 LEFT, then 1 UP.',why:'Negative x means left.'},{do:'B(2, −3): go 2 RIGHT, then 3 DOWN.',why:'Negative y means down.'},{do:'A is in the 2nd quadrant; B is in the 4th.'}]},
     mistake:'Writing coordinates the wrong way round. (2, 5) means 2 across and 5 up, not 5 across and 2 up.',
     check:{q:'A point is 5 to the left of the origin and 2 up. What are its coordinates?',o:['(−5, 2)','(2, −5)','(5, −2)'],a:0,why:'Across first (−5, left), then up (2).',hint:'Along the corridor, then up the stairs.'}},
    {title:'Connecting points to form patterns',explain:'<p>When you join plotted points in order, they can make shapes and pictures, like the house in the explorer. Video game designers and animators do exactly this: every shape on a screen is built from coordinates.</p><p>Points can also form <strong>patterns</strong>. Look at (1, 2), (2, 3), (3, 4) and (4, 5). Each time x goes up by 1, y goes up by 1 too, and y is always 1 more than x. When you plot them, they line up in a perfectly straight line.</p><p>Spotting a pattern lets you predict the next points without drawing them. Following this pattern, the next point would be (5, 6). You will study these straight-line patterns much more in later grades.</p>',visual:CART([[1,2],[2,3],[3,4],[4,5]],{join:true,lab:true,label:'Points (1, 2), (2, 3), (3, 4), (4, 5) in a straight line'}),
     example:{q:'The points (0, 1), (1, 3), (2, 5) form a pattern. What is the next point?',steps:[{do:'x goes up by 1 each time: 0, 1, 2, then 3.'},{do:'y goes up by 2 each time: 1, 3, 5, then 7.'},{do:'The next point is (3, 7).'}]},
     mistake:'Joining points out of order. The order in the list tells you which point joins to which.',
     check:{q:'(2, 0), (2, 1), (2, 2), (2, 3) form…',o:['a vertical line','a horizontal line','a circle'],a:0,why:'x is always 2, so the points stack straight up.',hint:'Which number stays the same?'}}]}]},
  {phase:'explain',name:'Teach: mappings',title:'Learn: mappings and their types',lead:'Next, mappings: rules that link inputs to outputs, shown in three ways.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Count di arrow dem weh lef an reach every number.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Three ways to show a mapping',explain:'<p>A {{mapping|a rule that links each input to one or more outputs}} links each input to an output, using a rule. Think of a machine: you put a number in, the machine does something to it, and a new number comes out.</p><p>We can show the same mapping in three ways. <strong>(a) By a rule</strong>, in words or algebra: “add 3”, or x → x + 3. <strong>(b) By a diagram</strong>: an arrow diagram with the inputs in one oval and the outputs in another, joined by arrows. <strong>(c) By a set of ordered pairs</strong>: each input with its output, such as (1, 4), (2, 5), (3, 6).</p><p>Ordered pairs connect beautifully to the Cartesian plane: each pair is a point you can plot!</p>',visual:MAP7([1,2,3],[4,5,6],[[1,4],[2,5],[3,6]],'Mapping diagram for the rule add 3'),
     example:{q:'The rule "double it" maps {1, 2, 3}. Show it as ordered pairs.',steps:[{do:'1 → 2, 2 → 4, 3 → 6.'},{do:'Ordered pairs: (1, 2), (2, 4), (3, 6).',why:'Input first, then output.'}]},
     mistake:'Writing ordered pairs output first. Always write (input, output).',
     check:{q:'The rule is "subtract 2" on {5, 6, 7}. What ordered pair starts with 6?',o:['(6, 4)','(4, 6)','(6, 8)'],a:0,why:'6 − 2 = 4.',hint:'(input, output).'}},
    {title:'One-to-one and many-to-one',explain:'<p>Mappings come in different types, depending on how the arrows connect. Count the arrows leaving each input, and the arrows arriving at each output.</p><p>In a {{one-to-one|each input has one output, and no outputs are shared}} mapping, each input has exactly one output, and no two inputs share an output. “Each student → their own school ID number” is one-to-one.</p><p>In a {{many-to-one|several inputs share one output}} mapping, several inputs can point to the same output. “Each student → their class” is many-to-one: lots of students share 7A. And “each number → is it even or odd?” is many-to-one too: 2, 4 and 6 all map to “even”.</p>',
     example:{q:'What type of mapping is "each person → their birthday month"?',steps:[{do:'Each person has exactly one birthday month.'},{do:'But many people share a month: lots of people are born in March.'},{do:'So it is many-to-one.'}]},
     mistake:'Thinking a mapping is wrong if outputs are shared. Many-to-one mappings are perfectly normal.',
     check:{q:'"Each country → its capital city" is…',o:['one-to-one','many-to-one','one-to-many'],a:0,why:'Each country has its own capital, and no two countries share one.',hint:'Are any outputs shared?'}},
    {title:'One-to-many and many-to-many',explain:'<p>There are two more types. In a {{one-to-many|one input has several outputs}} mapping, one input points to <strong>several</strong> outputs. “Each mother → her children” is one-to-many if a mother has more than one child. “Each number → its factors” is one-to-many too: 6 maps to 1, 2, 3 and 6.</p><p>In a {{many-to-many|inputs can have several outputs, and outputs can be shared}} mapping, inputs can have several outputs, and outputs can be shared as well. Think of “students → the clubs they join”: one student can join several clubs, and each club has many students.</p><p>So to name the type, ask two questions. Does any input have more than one arrow leaving it? Does any output have more than one arrow arriving? No and no: one-to-one. No and yes: many-to-one. Yes and no: one-to-many. Yes and yes: many-to-many.</p>',visual:MAP7(['Ava','Ben','Chen'],['Chess','Drama','Football'],[['Ava','Chess'],['Ava','Drama'],['Ben','Drama'],['Chen','Football'],['Ben','Football']],'Mapping diagram of students to clubs: many-to-many',['Students','Clubs']),
     example:{q:'What type is "each number in {4, 6} → its factors"?',steps:[{do:'4 → 1, 2, 4 and 6 → 1, 2, 3, 6.'},{do:'Each input has several arrows leaving it.'},{do:'1 and 2 each receive two arrows (from 4 and 6). So it is many-to-many.'}]},
     mistake:'Only checking the inputs. You need to check the arrows arriving at the outputs too.',
     check:{q:'"Each teacher → the classes they teach" (teachers teach several classes, and each class has several teachers) is…',o:['many-to-many','one-to-one','many-to-one'],a:0,why:'Both inputs and outputs have several arrows.',hint:'Ask both questions.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Type coordinates like (2, −3).',
