     init:function(box,api){var N=box.querySelector('#sgN');api.nudges(N);function draw(){var n=+N.value,arr=FRUIT.slice(0,n),S=SUBS(arr),by={};S.forEach(function(s){(by[s.length]=by[s.length]||[]).push(s)});box.querySelector('.sgNO').textContent=n;box.querySelector('.sgOut').innerHTML='<p style="margin:0 0 6px"><strong>Set:</strong> {'+arr.join(', ')+'}</p>'+Object.keys(by).map(function(k){return'<p style="margin:2px 0"><strong>'+k+' element'+(k==='1'?'':'s')+'</strong> ('+by[k].length+'): '+by[k].map(function(s){return'{'+s.join(', ')+'}'}).join('  ')+'</p>'}).join('')+'<p style="margin:8px 0 0"><strong>Total: '+S.length+' subsets</strong> = 2'+'<sup>'+n+'</sup>. Each fruit is either IN or OUT, so each one doubles the number of choices.</p>'}N.addEventListener('input',draw);var T=[{t:'How many subsets does a set with 3 elements have?',a:8},{t:'How many subsets does a set with 4 elements have?',a:16},{t:'With all 4 fruits, how many subsets have exactly 2 fruits?',a:6}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.sgB').textContent='All done';box.querySelector('.sgQ').textContent='You completed every challenge!';box.querySelector('.sgC').disabled=true;return}box.querySelector('.sgB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.sgQ').textContent=T[q].t}box.querySelector('.sgC').onclick=function(){var v=+box.querySelector('.sgA').value,fb=box.querySelector('.sgFb');if(v===T[q].a){fb.className='fb ok sgFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.sgA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no sgFb';fb.textContent='Not yet. Set the generator to that number of fruits and count.'}};draw();task()}},
    {type:'recall',text:'Shanice has 16 choices: each of the 4 fruits is either in or out of the bowl, so 2 × 2 × 2 × 2 = 16, including the empty bowl and the bowl with everything.'}]},
  {phase:'explain',name:'Teach: subsets and set problems',title:'Learn: subsets and problems with two sets',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'In or out: two choice fi every element.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Listing all the subsets',explain:'<p>A {{subset|a set whose elements all belong to another set}} is any set you can make using only elements from a given set. You met subsets in Grade 7. Now let’s list <strong>all</strong> of them, without missing any.</p><p>The secret is to be <strong>systematic</strong>: list them in order of size. Start with the subset with <strong>no</strong> elements: the empty set, { }. Then all the subsets with <strong>one</strong> element. Then all those with <strong>two</strong>. Keep going until you reach the whole set itself.</p><p>Two subsets are easy to forget: the empty set { }, and the whole set. Both count! The empty set is a subset of every set, and every set is a subset of itself.</p>',
     example:{q:'List all the subsets of {a, b, c}.',steps:[{do:'0 elements: { }.'},{do:'1 element: {a}, {b}, {c}.'},{do:'2 elements: {a, b}, {a, c}, {b, c}.'},{do:'3 elements: {a, b, c}. That is 8 subsets altogether.'}]},
     mistake:'Forgetting { } and the whole set. A 3-element set has 8 subsets, not 6.',
     check:{q:'Which is NOT a subset of {1, 2, 3}?',o:['{1, 4}','{ }','{1, 2, 3}'],a:0,why:'4 is not in {1, 2, 3}.',hint:'Every element must be in the original set.'}},
    {title:'Counting subsets: 2ⁿ',explain:'<p>Listing every subset is fine for small sets, but what about a set with 10 elements? Here is a much quicker way to count them.</p><p>When you build a subset, you go through the elements one at a time and make a choice for each: <strong>in</strong> or <strong>out</strong>. That is 2 choices for each element. With 1 element, there are 2 subsets. With 2 elements, 2 × 2 = 4. With 3, 2 × 2 × 2 = 8. With 4, 16.</p><p>So a set with <strong>n</strong> elements has <strong>2ⁿ subsets</strong>. In the explorer, you saw the number double every time you added a fruit. A set with 10 elements has 2¹⁰ = 1,024 subsets!</p>',
     example:{q:'How many subsets does the set of vowels {a, e, i, o, u} have?',steps:[{do:'n = 5 elements.'},{do:'Number of subsets = 2⁵.'},{do:'= 32.'}]},
     mistake:'Multiplying by 2 instead of using powers: 5 elements give 2⁵ = 32 subsets, not 10.',
     check:{q:'A set has 6 elements. How many subsets does it have?',o:['64','12','36'],a:0,why:'2⁶ = 64.',hint:'2 to the power 6.'}},
    {title:'Problems with two sets',explain:'<p>In Grade 7, you read information from Venn diagrams. Now let’s solve problems where some numbers are missing.</p><p>The key formula is: <strong>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</strong>. Why subtract the overlap? Because when you add n(A) and n(B), the people in both sets get counted twice: once in A and once in B. Subtracting n(A ∩ B) once fixes the double count.</p><p>A reliable method for any two-set problem: <strong>fill in the overlap first</strong>. Then work out each “only” region by subtracting the overlap from the set’s total. Then find the region outside both circles. Finally, check that all four regions add up to the universal set.</p>',visual:VENN2(15,6,9,0,'Football (21)','Cricket (15)','Venn diagram: football only 15, both 6, cricket only 9'),
     example:{q:'In a class of 30, 21 play football, 15 play cricket, and 6 play both. How many play neither?',steps:[{do:'Overlap first: both = 6.'},{do:'Football only = 21 − 6 = 15. Cricket only = 15 − 6 = 9.'},{do:'At least one sport: 15 + 6 + 9 = 30. Neither: 30 − 30 = 0.'}]},
     mistake:'Adding 21 + 15 = 36 and saying 36 students play a sport. That counts the 6 who play both twice.',
     check:{q:'n(A) = 12, n(B) = 9 and n(A ∩ B) = 4. What is n(A ∪ B)?',o:['17','21','25'],a:0,why:'12 + 9 − 4 = 17.',hint:'Subtract the overlap once.'}}]}]},
  {phase:'explain',name:'Teach: logic',title:'Learn: propositions and the language of logic',lead:'Next, logic: the mathematics of true and false statements, which computers use for every decision they make.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'A proposition haffi be true or false. No in-between.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Propositions: simple and compound',explain:'<p>A {{proposition|a statement that is either true or false}} is a statement that is either <strong>true</strong> or <strong>false</strong>, with nothing in between. “Kingston is the capital of Jamaica” is a proposition (true). “7 is an even number” is also a proposition (false). But “Close the door!” is not a proposition (it is a command), and neither is “What time is it?” (a question).</p><p>A {{simple proposition|a single statement with no connecting words}} makes one single claim, such as “It is raining.” A {{compound proposition|simple propositions joined by connecting words}} joins two or more simple ones with connecting words such as <strong>and</strong>, <strong>or</strong>, <strong>not</strong>, or <strong>if…then</strong>: “It is raining <strong>and</strong> the road is wet.”</p><p>To write propositions quickly, we use letters: let p = “It is raining” and q = “The road is wet”.</p>',
     example:{q:'Which are propositions? (a) "Jamaica is an island." (b) "Please sit down." (c) "5 + 5 = 11."',steps:[{do:'(a) A statement that is true: a proposition ✓'},{do:'(b) A command, not true or false: not a proposition ✗'},{do:'(c) A statement that is false: still a proposition ✓',why:'False statements are propositions too.'}]},
     mistake:'Thinking a false statement is not a proposition. A proposition can be true OR false; it just cannot be a question, a command or an opinion with no clear truth value.',
     check:{q:'Which is a compound proposition?',o:['I like mangoes and I like ackee.','I like mangoes.','Do you like mangoes?'],a:0,why:'Two simple propositions joined by "and".',hint:'Look for a connecting word.'}},
    {title:'Negation, conjunction and disjunction',explain:'<p>Logic has special words, and symbols, for joining propositions.</p><p>The {{negation|"not p": the opposite of p}} of p, written <strong>~p</strong> (or ¬p), means “not p”. If p is “It is raining”, then ~p is “It is not raining”. If p is true, ~p is false, and vice versa.</p><p>A {{conjunction|"p and q": true only when both are true}}, written <strong>p ∧ q</strong>, means “p <strong>and</strong> q”. It is true only when <strong>both</strong> parts are true.</p><p>A {{disjunction|"p or q": true when at least one is true}}, written <strong>p ∨ q</strong>, means “p <strong>or</strong> q”. It is true when <strong>at least one</strong> part is true, including when both are. A memory tip: ∧ looks like an “A” for <strong>A</strong>nd, and ∨ points down like a “v” for “or” (from the Latin <em>vel</em>).</p>',
     example:{q:'Let p = "I have a computer" and q = "I have a DVD player". Write p ∧ q, p ∨ q and ~q in words.',steps:[{do:'p ∧ q: "I have a computer and I have a DVD player."'},{do:'p ∨ q: "I have a computer or I have a DVD player (or both)."'},{do:'~q: "I do not have a DVD player."'}]},
     mistake:'Thinking "p or q" is false when both are true. In logic, "or" includes the case where both are true.',
     check:{q:'p = "2 is even" (true), q = "3 is even" (false). Is p ∧ q true or false?',o:['False','True'],a:0,why:'"And" needs BOTH to be true.',hint:'Are both parts true?'}},
    {title:'If…then, and equivalence',explain:'<p>The {{conditional|"if p, then q"}} <strong>p → q</strong> means “<strong>if</strong> p, <strong>then</strong> q”. For example, if p = “It rains” and q = “The match is cancelled”, then p → q is “If it rains, then the match is cancelled.” The first part, p, is the condition; the second part, q, is the result.</p><p>The {{equivalence|"p if and only if q"}} <strong>p ↔ q</strong> means “p <strong>if and only if</strong> q”. Both parts are linked in both directions: if p then q, AND if q then p. For example, “A triangle is equilateral if and only if all its sides are equal.”</p><p>You can now translate both ways: from words to symbols, and from symbols to words. Choose a letter for each simple proposition, then replace the connecting words with symbols.</p>',
     example:{q:'p = "Kemar studies", q = "Kemar passes". Write in symbols: "If Kemar studies, then he passes." Then write ~p → ~q in words.',steps:[{do:'"If Kemar studies, then he passes" is p → q.'},{do:'~p → ~q: "If Kemar does not study, then he does not pass."'}]},
     mistake:'Swapping the parts of a conditional. "If p, then q" (p → q) is not the same as "If q, then p" (q → p).',
     check:{q:'p = "It is sunny", q = "We go to the beach". What is "If it is sunny, then we go to the beach"?',o:['p → q','q → p','p ∧ q'],a:0,why:'If p, then q.',hint:'The condition comes first.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Subsets',text:'List by size: { } first, then 1 element, 2 elements…, ending with the whole set. A set with n elements has 2ⁿ subsets.'},{title:'Two-set problems',text:'Fill in the overlap first. n(A ∪ B) = n(A) + n(B) − n(A ∩ B). All regions add up to n(U).'},{title:'Propositions',text:'A statement that is true or false. Simple = one claim; compound = joined by and, or, not, if…then.'},{title:'Symbols',text:'~p (not p), p ∧ q (p and q), p ∨ q (p or q), p → q (if p then q), p ↔ q (p if and only if q).'}]},

    {icon:'🗂️',title:'Proposition or not?',desc:'Sort each sentence.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Can it be clearly true or false?',bins:[{id:'y',label:'Proposition'},{id:'n',label:'Not a proposition'}],items:[{label:'Jamaica has 14 parishes.',bin:'y'},{label:'Shut the window!',bin:'n'},{label:'9 is a prime number.',bin:'y'},{label:'What is your name?',bin:'n'},{label:'Usain Bolt was born in Jamaica.',bin:'y'},{label:'Please pass the salt.',bin:'n'}]}},
    {icon:'🃏',title:'Match the symbols',desc:'Match each symbol to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['~p','not p'],['p ∧ q','p and q'],['p ∨ q','p or q'],['p → q','if p, then q'],['p ↔ q','p if and only if q'],['2ⁿ','number of subsets of an n-element set']]}},
    {icon:'📏',title:'Count the subsets',desc:'Order sets by how many subsets they have.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out how many subsets each set has, then tap from fewest to most.',rounds:[[{label:'{a, b}',v:4,show:'4'},{label:'{1, 2, 3, 4, 5}',v:32,show:'32'},{label:'{x}',v:2,show:'2'},{label:'{red, blue, green}',v:8,show:'8'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The empty set is a subset of every set.',a:'always',why:'It has no elements that could fail to be in the other set.'},{s:'p ∧ q is true.',a:'sometimes',why:'Only when both p and q are true.'},{s:'p ∨ q is false when both p and q are true.',a:'never',why:'"Or" is true when at least one part is true.'},{s:'If p is true, then ~p is false.',a:'always',why:'Negation flips the truth value.'},{s:'n(A ∪ B) = n(A) + n(B).',a:'sometimes',why:'Only when A and B are disjoint (no overlap).',hint:'What if they overlap?'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'List the subsets of {a, b}.',lines:['{a}, {b}, {a, b}','So there are 3 subsets'],wrong:1,reasons:['He forgot the empty set { }: there are 4 subsets','There are 2 subsets','{a, b} is not a subset'],reason:0,fix:'{ }, {a}, {b}, {a, b}: 4 subsets.'},{who:'Keisha',q:'25 like rice, 20 like bread, 10 like both. How many like at least one?',lines:['25 + 20 = 45'],wrong:0,reasons:['Subtract the overlap: 25 + 20 − 10 = 35','It should be 55','It should be 10'],reason:0,fix:'35.'},{who:'Omar',q:'p = "It rains", q = "We stay inside". Write "If it rains, we stay inside".',lines:['q → p'],wrong:0,reasons:['The condition comes first: p → q','It is p ∧ q','It is ~p'],reason:0,fix:'p → q.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire sets and logic.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var n=R(1,6);return{q:'A set has '+n+' elements. Number of subsets?',o:[String(Math.pow(2,n)),String(2*n),String(n*n===Math.pow(2,n)?n*n+1:n*n)],a:0,why:'2^'+n+'.'}}if(r===1){var a=R(8,20),b=R(6,15),c=R(1,5);return{q:'n(A) = '+a+', n(B) = '+b+', n(A ∩ B) = '+c+'. n(A ∪ B)?',o:[String(a+b-c),String(a+b),String(a+b+c)],a:0,why:a+' + '+b+' − '+c+'.'}}var Q=[['p true, q false. p ∧ q?','false'],['p true, q false. p ∨ q?','true'],['p false, q false. p ∨ q?','false'],['p true, q true. p ∧ q?','true'],['p true. ~p?','false'],['p false. ~p?','true']],q=Q[R(0,5)];return{q:q[0],o:[q[1],q[1]==='true'?'false':'true'],a:0,why:'Check the rule for the connective.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent propositions and sets that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A set has 32 subsets. How many elements does it have?',placeholder:'elements',check:function(v){return+v===5?{ok:true,msg:'Yes! 2⁵ = 32.'}:{ok:false,msg:'Which power of 2 is 32?'}}},{q:'Let p = "I have homework" and q = "I watch TV". Write ~q in words.',placeholder:'in words',check:function(v){var t=String(v).toLowerCase();return/not|don.?t|do not/.test(t)&&/tv|television/.test(t)?{ok:true,msg:'Yes! "I do not watch TV."'}:{ok:false,msg:'~q is the opposite of q.'}}},{q:'Write a compound proposition using "and" that is TRUE.',placeholder:'… and …',check:function(v){var t=String(v).toLowerCase();return/\band\b/.test(t)&&t.length>12?{ok:true,msg:'Good! Remember: an "and" statement is only true if BOTH parts are true. Check both parts of yours.'}:{ok:false,msg:'Join two true statements with "and".'}}}]}},
    {icon:'📀',title:'Mission: the home technology survey',desc:'Run the guide’s DVD player and computer survey.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Following the NSC logic activity, a Grade 8 class in Falmouth surveyed its 35 students. 20 have a computer at home, 15 have a DVD player, and 6 have both.',parts:[{q:'How many have a computer only?',a:14,hint:'20 − 6.',sol:'14.'},{q:'How many have at least one of the two?',a:29,hint:'20 + 15 − 6.',sol:'29.'},{q:'How many have neither?',a:6,hint:'35 − 29.',sol:'6.'},{q:'Let p = "has a computer" and q = "has a DVD player". Which region of the Venn diagram is p ∧ q? (Type both, p only, q only or neither.)',a:['both'],hint:'"And" means both.',sol:'Both: the overlap, 6 students.'},{q:'How many students make p ∨ q true (have a computer OR a DVD player OR both)?',a:29,hint:'At least one.',sol:'29.'}],done:'You used two-set problems and the language of logic on real survey data, just like the NSC activity.'}}
