 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Consumer Arithmetic',strand:'Consumer Arithmetic',standard:'Module 1, Consumer Arithmetic: develop the ability to perform the calculations required in normal business transactions, and in computing their own budgets; demonstrate the ability to use concepts in consumer arithmetic to describe, model and solve real-world problems.',

   blocks:[{type:'mcq',star:true,questions:[{q:'What does 25% mean?',o:['25 out of 100','25 out of 10','25 whole ones'],a:0,why:'Per cent means "out of 100".',teach:'"Per cent" means "out of every hundred". So 25% means 25 out of every 100, which is the same as 25/100 or 0.25.'},{q:'What is 10% of $500?',o:['$5','$50','$510'],a:1,why:'10% = 1/10, and $500 ÷ 10 = $50.',teach:'10% is one tenth. To find 10% of an amount, divide it by 10. So 10% of $500 = $500 ÷ 10 = $50.'},{q:'Write 15% as a decimal.',o:['1.5','0.15','15.0'],a:1,why:'15% = 15/100 = 0.15.',teach:'To change a percentage to a decimal, divide by 100: move the decimal point two places to the left. 15% → 0.15.'},{q:'$1,000 − $750 = ?',o:['$250','$350','$1,750'],a:0,why:'1,000 − 750 = 250.',teach:'Count up from 750 to 1,000: 750 + 250 = 1,000. So 1,000 − 750 = 250.'}]}]},

   blocks:[{type:'custom',star:true,
    html:'<div class="controls"><label for="cpR">Cost price ($):</label><input type="range" id="cpR" min="100" max="2000" step="10" value="800"><output class="big cpO">$800</output></div><div class="controls"><label for="spR">Selling price ($):</label><input type="range" id="spR" min="100" max="2000" step="10" value="1000"><output class="big spO">$1000</output></div><div class="scene mkSvg"></div><div class="explain mkX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge mkN"></span> <strong class="mkT"></strong></p><div class="controls"><button type="button" class="go mkC">Check</button></div><div class="fb mkF" aria-live="polite">Set the prices, then check.</div></div>',
    init:function(box,api){var cp=box.querySelector('#cpR'),sp=box.querySelector('#spR');api.nudges(cp);api.nudges(sp);var T=[{t:'The cost price is $800. Set a selling price that gives a profit of exactly 25%.',ok:function(c,s){return c===800&&s===1000},hint:'Keep cost at $800. 25% of 800 = 200. Add it to the cost.'},{t:'Set the prices to make a loss of exactly $150.',ok:function(c,s){return c-s===150},hint:'Loss = cost price − selling price. Make the selling price $150 less than the cost price.'},{t:'Set any prices where you break even (no profit, no loss).',ok:function(c,s){return c===s},hint:'Break even means selling price = cost price.'},{t:'The cost price is $1200. Set a selling price that gives a 10% loss.',ok:function(c,s){return c===1200&&s===1080},hint:'10% of 1200 = 120. Take it away from 1200. (Use −1/+1 to get the exact value.)'}];var k=api.get('k')||0;function f(n){return'$'+n.toLocaleString('en-JM')}function draw(){var c=+cp.value,s=+sp.value,d=s-c,p=Math.round(1000*Math.abs(d)/c)/10;box.querySelector('.cpO').textContent=f(c);box.querySelector('.spO').textContent=f(s);var W=600,sc=W/2000;var svg='<svg viewBox="0 0 700 150" role="img" aria-label="Bar comparing cost price and selling price"><rect width="700" height="150" fill="#faf8fe"/><text x="10" y="45" font-size="15" fill="#3d2a73">Cost</text><rect x="70" y="25" width="'+(c*sc)+'" height="30" rx="6" fill="#b3a6d6"/><text x="10" y="105" font-size="15" fill="#3d2a73">Selling</text><rect x="70" y="85" width="'+(s*sc)+'" height="30" rx="6" fill="'+(d>0?'#16766a':d<0?'#c02d5f':'#a85d00')+'"/></svg>';box.querySelector('.mkSvg').innerHTML=svg;box.querySelector('.mkX').innerHTML=d>0?'<strong>Profit of '+f(d)+'</strong>. Percentage profit = '+f(d)+' ÷ '+f(c)+' × 100% = <strong>'+p+'%</strong>.':d<0?'<strong>Loss of '+f(-d)+'</strong>. Percentage loss = '+f(-d)+' ÷ '+f(c)+' × 100% = <strong>'+p+'%</strong>.':'<strong>Break even.</strong> No profit and no loss.'}function task(){if(k>=T.length){box.querySelector('.mkN').textContent='All done';box.querySelector('.mkT').textContent='You completed every challenge!';box.querySelector('.mkC').disabled=true;return}box.querySelector('.mkN').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.mkT').textContent=T[k].t}cp.addEventListener('input',draw);sp.addEventListener('input',draw);box.querySelector('.mkC').onclick=function(){var fb=box.querySelector('.mkF');if(T[k].ok(+cp.value,+sp.value)){fb.className='fb ok mkF';fb.textContent='✓ Yes! Well done.';k++;api.set('k',k);task();if(k===T.length)api.complete()}else{fb.className='fb no mkF';fb.textContent='Not yet. '+T[k].hint}};draw();task()}}]},
  {phase:'explore',name:'Percentage of what?',title:'Explore: percentage of what?',lead:'The most common mistake in consumer arithmetic is using the wrong amount as the "whole". Test yourself.',
   mission:['Read each question.','Choose your answer. Use the hint if you are stuck.','Answer all 3 for a star.'],

  {phase:'explain',name:'Teach: profit and loss',title:'Learn: profit, loss and mark-up',lead:'Now let\'s learn how businesses work out profit and loss. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time. Answer di question fi open di next one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Profit and loss',explain:'<p>Picture a vendor at Coronation Market. Early in the morning she buys a box of mangoes from a farmer for $1,500. By evening she has sold them all for $2,100. Did she make money? Of course: she has $600 more than she started with.</p><p>Business people have special names for these amounts. What the vendor paid is the {{cost price (CP)|what the seller paid for the item}}. What the customers paid her is the {{selling price (SP)|what the customer pays the seller}}. If she sells for <strong>more</strong> than she paid, the difference is her {{profit|selling price minus cost price}}: profit = SP − CP.</p><p>But business does not always go well. If the mangoes start to spoil and she has to sell them cheaply, she might only get $1,200. Now she has sold for <strong>less</strong> than she paid, and she has made a {{loss|cost price minus selling price}}: loss = CP − SP = $300. And if the two prices are exactly the same, she has broken even.</p><p>A good habit: first decide whether it is a profit or a loss, then subtract the smaller price from the bigger one.</p>',
     example:{q:'A vendor buys a box of mangoes for $1,500 and sells them all for $2,100. Find the profit or loss.',steps:[{do:'Identify the prices: CP = $1,500 and SP = $2,100.',why:'The vendor paid $1,500 and received $2,100.'},{do:'SP is more than CP, so it is a profit.'},{do:'Profit = SP − CP = $2,100 − $1,500 = $600.',why:'Always subtract the smaller amount from the bigger one, and say whether it is a profit or a loss.'}]},
     mistake:'Subtracting in the wrong order and getting a negative "profit". Decide first whether it is a profit or a loss, then subtract the smaller price from the bigger one.',
     check:{q:'A bike is bought for $9,000 and sold for $7,500. What is the result?',o:['A profit of $1,500','A loss of $1,500','A loss of $16,500'],a:1,why:'SP is less than CP, so it is a loss: $9,000 − $7,500 = $1,500.',hint:'Is the selling price bigger or smaller than the cost price?'}},
    {title:'Percentage profit and loss',explain:'<p>Is a $200 profit good? It depends! If you bought a phone case for $400 and sold it for $600, a $200 profit is fantastic: you made half your money back again. But if you bought a car for $2,000,000 and sold it for $2,000,200, a $200 profit is hardly worth the trouble.</p><p>To compare fairly, we turn the profit into a percentage of what the seller <strong>paid</strong>. That is the percentage profit: divide the profit by the cost price, then multiply by 100. Percentage loss works the same way, using the loss.</p><p>Why the cost price, and not the selling price? Because the cost price is the money the seller risked at the start. The percentage tells them how much their money grew, or shrank, compared with what they put in.</p>',
     example:{q:'A bag costs a vendor $800 and is sold for $1,000. Find the percentage profit.',steps:[{do:'Profit = $1,000 − $800 = $200.'},{do:'Divide the profit by the COST price: 200 ÷ 800 = 0.25.',why:'The percentage compares the profit with what the seller paid.'},{do:'Multiply by 100%: 0.25 × 100% = 25%.'},{do:'Answer: a 25% profit.'}]},
     mistake:'Dividing by the selling price: 200 ÷ 1,000 × 100% = 20%. That is wrong. Percentage profit and loss always use the COST price.',
     check:{q:'CP = $500 and SP = $600. What is the percentage profit?',o:['16.7%','20%','100%'],a:1,why:'Profit = $100, and 100 ÷ 500 × 100% = 20%.',hint:'Find the profit first, then divide by the cost price.'}},
    {title:'Mark-up and marked price',explain:'<p>Have you ever wondered how a shop decides what price to put on the tag? The shop buys each item from a supplier at the cost price. Then it adds an extra amount on top, so that it can pay its staff and its rent, and still make a profit. That extra amount is the {{mark-up|the amount added to the cost price}}.</p><p>The price you see on the tag is the {{marked price|the price shown on the tag}}: cost price + mark-up. Shops usually decide the mark-up as a percentage of the cost price. A 30% mark-up on a $20,000 phone adds $6,000, making the marked price $26,000.</p><p>Here is a quick way to do it: adding 30% is the same as multiplying by 1.30, because the new price is 100% + 30% = 130% of the cost price.</p>',
     example:{q:'A store buys a phone for $20,000 and marks it up by 30%. Find the marked price.',steps:[{do:'Mark-up = 30% of $20,000 = 0.30 × 20,000 = $6,000.',why:'The mark-up percentage is a percentage of the cost price.'},{do:'Marked price = $20,000 + $6,000 = $26,000.'},{do:'Shortcut: $20,000 × 1.30 = $26,000.',why:'Adding 30% is the same as multiplying by 1.30 (100% + 30%).'}]},
     mistake:'Forgetting to add the mark-up back to the cost price. The mark-up ($6,000) is not the marked price.',
     check:{q:'An item costs $400 and is marked up by 25%. What is the marked price?',o:['$100','$425','$500'],a:2,why:'25% of $400 = $100, so the marked price is $400 + $100 = $500.',hint:'Find 25% of $400, then add it on.'}}]}]},
  {phase:'explain',name:'Teach: discounts and tax',title:'Learn: discounts, sales tax and a percentage puzzle',lead:'Next, how shoppers pay less with a discount, and more with sales tax.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Discount mek di price go dung. Tax mek it go up.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Discount',explain:'<p>“20% OFF EVERYTHING!” You have probably seen signs like this in store windows at back-to-school time or at Christmas. A {{discount|an amount taken off the marked price}} is an amount taken off the marked price, to tempt customers to buy.</p><p>The discount is usually given as a percentage of the marked price. So to find the sale price, first work out how much money comes off, then subtract it. On $6,500 shoes with 20% off, the discount is 20% of $6,500, which is $1,300, so you pay $5,200.</p><p>There is also a handy shortcut. If 20% comes off, you still pay the other 80%. So you can multiply straight away by 0.80: $6,500 × 0.80 = $5,200.</p><p>Be careful never to subtract the percentage number itself. “20% off” does not mean “$20 off”!</p>',
     example:{q:'A pair of shoes is marked $6,500. The store gives a 20% discount. Find the sale price.',steps:[{do:'Change 20% to a decimal: 0.20.'},{do:'Discount = 0.20 × $6,500 = $1,300.',why:'The discount is a percentage of the marked price.'},{do:'Sale price = $6,500 − $1,300 = $5,200.'},{do:'Shortcut: you pay 80% of the price, so $6,500 × 0.80 = $5,200.',why:'100% − 20% = 80%.'}]},
     mistake:'Subtracting the percentage number instead of the discount: $6,500 − 20 = $6,480. You must first find 20% OF the price.',
     check:{q:'A uniform is marked $3,000 with 10% off. What is the sale price?',o:['$2,990','$2,700','$300'],a:1,why:'10% of $3,000 = $300, so the sale price is $2,700.',hint:'Find 10% of $3,000 first.'}},
    {title:'Sales tax (GCT)',explain:'<p>When you buy many things in Jamaica, the price at the till is a bit higher than the price on the shelf. That is because the government adds a tax called {{GCT|General Consumption Tax, a sales tax added to many goods and services}}, General Consumption Tax. The money helps pay for roads, schools and hospitals.</p><p>A sales tax is a percentage of the price, and it is always <strong>added on</strong>. To find the total, work out the tax, then add it to the price. For a $8,000 blender with 15% GCT, the tax is 15% of $8,000, which is $1,200, so the total is $9,200.</p><p>The shortcut works here too, but in the other direction: you pay the price plus 15%, which is 115%, so you can multiply by 1.15. Each question will tell you which tax rate to use, since rates can change over time.</p>',
     example:{q:'A blender costs $8,000 before tax. GCT is 15%. Find the total price.',steps:[{do:'Tax = 15% of $8,000 = 0.15 × 8,000 = $1,200.'},{do:'Total = $8,000 + $1,200 = $9,200.',why:'Tax is always added to the price.'},{do:'Shortcut: $8,000 × 1.15 = $9,200.',why:'100% + 15% = 115% = 1.15.'}]},
     mistake:'Taking the tax away instead of adding it. Tax makes the price go UP.',
     check:{q:'An item costs $2,000 before 15% GCT. What is the total?',o:['$1,700','$2,015','$2,300'],a:2,why:'15% of $2,000 = $300, so the total is $2,300.',hint:'Find 15% of $2,000, then add it.'}},
    {title:'The percentage puzzle: up, then down',explain:'<p>Remember the puzzle at the very start? A $20,000 phone is marked up 20%, then the marked price is discounted 20%. Most people guess it ends up back at $20,000. It does not! It ends up at $19,200.</p><p>Here is the secret: the two percentages are taken of <strong>different amounts</strong>. The mark-up is 20% of $20,000, which adds $4,000. But the discount is 20% of the new, bigger price, $24,000, which takes off $4,800. Because the discount is calculated on a bigger number, it removes more than the mark-up added.</p><p>This is one of the most important ideas in percentages: always ask “a percentage of <em>what</em>?” The same percentage of a different amount is a different amount of money.</p>',
     example:{q:'A phone costs $20,000. It is marked up 20%, then discounted 20%. Find the final price.',steps:[{do:'Mark-up: 20% of $20,000 = $4,000. Marked price = $24,000.'},{do:'Discount: 20% of $24,000 = $4,800.',why:'The 20% is now of $24,000, a bigger number, so the discount is bigger.'},{do:'Final price = $24,000 − $4,800 = $19,200.'},{do:'The final price is LESS than $20,000. Was your prediction right?'}]},
     mistake:'Thinking that +20% and −20% cancel out. They do not, because each percentage is taken of a different amount.',
     check:{q:'A $100 item rises by 10%, then falls by 10%. What is the final price?',o:['$100','$99','$101'],a:1,why:'$100 → $110 (up $10) → $110 − $11 = $99.',hint:'The 10% decrease is taken from $110, not $100.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key formulas. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key formulas.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Profit and loss',text:'Profit = selling price − cost price, when you sell for more than you paid. Loss = cost price − selling price, when you sell for less than you paid. For example, a vendor buys a bag for $800 and sells it for $1,000. Profit = $1,000 − $800 = $200.'},{title:'Percentage profit and loss',text:'Percentage profit = (profit ÷ cost price) × 100%. Percentage loss = (loss ÷ cost price) × 100%. Always divide by the COST price, because that is what the seller started with. For example, a $200 profit on a bag that cost $800 is 200 ÷ 800 × 100% = 25%.'},{title:'Discount',text:'Discount = discount % × marked price. Then sale price = marked price − discount. For example, 15% off a $2,000 tag: discount = 0.15 × 2,000 = $300, so the sale price is $2,000 − $300 = $1,700.'},{title:'Adding sales tax (GCT)',text:'Find the tax and add it to the price. For example, at 15%: tax on $2,000 = 0.15 × 2,000 = $300, so the price with tax is $2,000 + $300 = $2,300. A shortcut is to multiply by 1.15: $2,000 × 1.15 = $2,300.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A used laptop was bought for $60,000 and sold for $48,000. Find the percentage loss.',steps:[{do:'SP is less than CP, so it is a loss: $60,000 − $48,000 = $12,000.'},{do:'Divide by the cost price: 12,000 ÷ 60,000 = 0.2.',why:'Percentage loss uses the cost price.'},{do:'0.2 × 100% = 20%. Answer: a 20% loss.'}]},
     {type:'fill',q:'A bag is marked $4,000 with a 15% discount. Find the sale price.',steps:[{text:'Discount = 15% of $4,000 = $___',blank:true,a:600,hint:'0.15 × 4,000. Or find 10% ($400) and 5% ($200) and add them.'},{text:'Sale price = $4,000 − discount.'},{text:'Sale price = $3,400.'}],sol:'15% of $4,000 = $600, so the sale price is $3,400.'},
     {type:'own',q:'A fan costs $6,000 before 15% GCT. What is the total price?',a:6900,hint:'Find 15% of $6,000 and add it, or multiply by 1.15.',sol:'15% of $6,000 = $900, so the total is $6,900.',placeholder:'dollars'},
     {type:'own',q:'CP = $1,250 and SP = $1,500. What is the percentage profit? Type the number.',a:20,hint:'Profit = $250. Divide by the cost price, then × 100.',sol:'250 ÷ 1,250 × 100% = 20%.',placeholder:'percent'}]}]},

    {icon:'🗂️',title:'Profit, loss or break even?',desc:'Sort 8 deals into the right box.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Compare SP with CP: bigger, smaller or equal?',bins:[{id:'p',label:'Profit',hint:'SP > CP'},{id:'l',label:'Loss',hint:'SP < CP'},{id:'b',label:'Break even',hint:'SP = CP'}],items:[{label:'CP $500, SP $650',bin:'p'},{label:'CP $1,200, SP $1,080',bin:'l'},{label:'CP $900, SP $900',bin:'b'},{label:'CP $2,500, SP $2,499',bin:'l'},{label:'CP $70, SP $100',bin:'p'},{label:'Bought for $3,000, sold for $3,000',bin:'b'},{label:'Bought for $4,800, sold for $5,000',bin:'p'},{label:'Bought for $15,000, sold for $12,000',bin:'l'}]}},
    {icon:'🃏',title:'Match it',desc:'Match each percentage of an amount to its value.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['10% of $500','$50'],['25% of $800','$200'],['15% of $2,000','$300'],['50% of $1,500','$750'],['20% of $2,500','$500'],['1% of $9,000','$90']]}},
    {icon:'🛒',title:'Best buy',desc:'Put the deals in order from cheapest to most expensive.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out what you would actually pay for each deal, then tap them from cheapest to most expensive.',rounds:[[{label:'$1,000 with 20% off',v:800,show:'$800'},{label:'$900 with 10% off',v:810,show:'$810'},{label:'$850, no discount',v:850,show:'$850'},{label:'$750 plus 15% GCT',v:862.5,show:'$862.50'}],[{label:'$2,400 with 25% off',v:1800,show:'$1,800'},{label:'$1,600 plus 15% GCT',v:1840,show:'$1,840'},{label:'$2,000 with 15% off',v:1700,show:'$1,700'},{label:'$3,000 with half price off',v:1500,show:'$1,500'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each business statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'If you sell an item for more than you paid, you make a profit.',a:'always',why:'Profit = SP − CP, which is positive whenever SP is bigger than CP.'},{s:'A 10% discount followed by 10% tax brings the price back to the original.',a:'never',why:'$100 → $90 → $90 + $9 = $99. The tax is taken of a smaller amount, so it never quite makes up the discount.',hint:'Try it with $100.'},{s:'Percentage profit is worked out using the selling price.',a:'never',why:'Percentage profit always uses the COST price.'},{s:'A bigger profit in dollars means a bigger percentage profit.',a:'sometimes',why:'$200 profit on an $800 item is 25%, but $300 profit on a $3,000 item is only 10%.',hint:'Try two items with very different cost prices.'},{s:'A discount makes the price lower.',a:'always',why:'A discount is always taken away from the marked price.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Ricardo',q:'CP = $800, SP = $1,000. Find the percentage profit.',lines:['Profit = $1,000 − $800 = $200','% profit = 200 ÷ 1,000 × 100%','= 20%'],wrong:1,reasons:['He divided by the selling price instead of the cost price','He found the profit wrongly','He should have multiplied by 10'],reason:0,fix:'% profit = 200 ÷ 800 × 100% = 25%.'},{who:'Tamika',q:'A dress is marked $3,500 with 20% off. Find the sale price.',lines:['Sale price = $3,500 − 20','= $3,480'],wrong:0,reasons:['She subtracted 20 instead of 20% of the price','She should have added 20','The discount should be 20% of the sale price'],reason:0,fix:'20% of $3,500 = $700, so the sale price is $2,800.'},{who:'Marlon',q:'A TV costs $40,000 before 15% GCT. Find the total.',lines:['GCT = 15% of $40,000 = $6,000','Total = $40,000 − $6,000','= $34,000'],wrong:1,reasons:['Tax is added, not taken away','The GCT is calculated wrongly','He should have used 1.5%'],reason:0,fix:'Total = $40,000 + $6,000 = $46,000.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire percentage and profit questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a){return a[Math.floor(Math.random()*a.length)]},m=function(n){return'$'+n.toLocaleString('en-JM')},r=Math.floor(Math.random()*3);if(r===0){var p=R([10,20,25,50,5]),n=R([200,400,800,1000,1200,2000,3000]),v=n*p/100;return{q:'What is '+p+'% of '+m(n)+'?',o:[m(v),m(v*2),m(n-v)],a:0,why:p+'% of '+m(n)+' = '+m(v)+'.'}}if(r===1){var c=R([500,800,1200,1500,2000]),d=R([100,200,300,-100,-200]),s=c+d;return{q:'CP = '+m(c)+', SP = '+m(s)+'. Profit or loss?',o:['Profit of '+m(Math.abs(d)),'Loss of '+m(Math.abs(d))],a:d>0?0:1,why:'SP is '+(d>0?'more':'less')+' than CP.'}}var c2=R([200,400,500,800,1000]),pp=R([10,20,25,50]),sp=c2*(1+pp/100);return{q:'CP = '+m(c2)+', SP = '+m(sp)+'. Percentage profit?',o:[pp+'%',Math.round(100*(sp-c2)/sp)+'%',(pp*2)+'%'],a:0,why:'Profit '+m(sp-c2)+' ÷ '+m(c2)+' × 100% = '+pp+'%.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent prices that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:5,block:{type:'create',tasks:[{q:'Choose a cost price and a selling price that give a profit of exactly 50%. Type them as CP, SP (for example 200, 300).',placeholder:'CP, SP',check:function(v){var n=String(v).replace(/[$\s]/g,'').split(',').map(Number);if(n.length!==2||n.some(isNaN)||n[0]<=0)return{ok:false,msg:'Type two numbers separated by a comma, such as 200, 300.'};var p=100*(n[1]-n[0])/n[0];if(Math.abs(p-50)<0.001)return{ok:true,msg:'Yes! Profit = '+(n[1]-n[0])+', and '+(n[1]-n[0])+' ÷ '+n[0]+' × 100% = 50%.'};return{ok:false,msg:'That gives a '+(Math.round(p*10)/10)+'% '+(p>=0?'profit':'loss')+'. For 50%, the selling price must be 1.5 times the cost price.'}}},{q:'An item cost $1,200. Type a selling price that gives a loss (not break even).',placeholder:'dollars',check:function(v,num){var x=num(String(v).replace(/[$,]/g,''));if(isNaN(x))return{ok:false,msg:'Type a price, such as 1000.'};if(x>0&&x<1200)return{ok:true,msg:'Correct! Selling for $'+x+' gives a loss of $'+(1200-x)+'.'};if(x===1200)return{ok:false,msg:'That breaks even. Make it a bit lower.'};return{ok:false,msg:'That would be a profit (or not a real price). Choose a price below $1,200.'}}},{q:'Type a price where 15% GCT comes to exactly $90.',placeholder:'dollars',check:function(v,num){var x=num(String(v).replace(/[$,]/g,''));if(Math.abs(x*0.15-90)<0.001)return{ok:true,msg:'Yes! 15% of $600 = $90.'};return{ok:false,msg:'15% of that is $'+(isNaN(x)?'?':Math.round(x*15)/100)+'. Think: what number times 0.15 makes 90?'}}}]}},
    {icon:'🍧',title:'Mission: the sports day snow cone stand',desc:'Run a snow cone stand at your school\'s sports day.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Your class is running a snow cone stand at sports day. You spend $3,600 on ice, syrup and cups, which is enough for 120 snow cones. Work out how your business does.',parts:[{q:'What is the cost of making one snow cone?',a:30,hint:'Total cost ÷ number of cones: 3,600 ÷ 120.',sol:'$3,600 ÷ 120 = $30 per cone.',placeholder:'dollars'},{q:'You sell each cone for $50. What is the profit on one cone?',a:20,hint:'Profit = SP − CP.',sol:'$50 − $30 = $20 profit per cone.',placeholder:'dollars'},{q:'What is the percentage profit on one cone? Round to 1 decimal place.',a:66.7,tol:0.06,hint:'20 ÷ 30 × 100%.',sol:'20 ÷ 30 × 100% ≈ 66.7%.',placeholder:'percent'},{q:'You sell 100 cones at $50. Near the end, you sell the last 20 at a 40% discount. How much money do you take in altogether?',a:5600,hint:'A 40% discount on $50 is $20 off, so the last 20 cost $30 each.',sol:'100 × $50 = $5,000, plus 20 × $30 = $600. Total = $5,600.',placeholder:'dollars'},{q:'What is your total profit for the day?',a:2000,hint:'Total money in − total cost.',sol:'$5,600 − $3,600 = $2,000 profit.',placeholder:'dollars'}],done:'You used cost price, profit, percentage profit and discounts to run a real business.'}}
   ]}]},
