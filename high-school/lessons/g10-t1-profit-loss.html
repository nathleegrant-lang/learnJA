<script>
var K=window.LessonKit;
window.LESSON={
 id:'g10-t1-maths-csec-profit',
 grade:10, term:1, subject:'Mathematics', strand:'Consumer Arithmetic',
 title:'Profit, Loss, Discount and Sales Tax',
 goals:['calculate profit and loss from cost price and selling price','express profit, loss, discount and mark-up as a percentage','calculate discounts and sales tax (GCT) on prices','solve problems involving marked price, selling price and cost price'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Consumer Arithmetic',strand:'Consumer Arithmetic',standard:'Module 1, Consumer Arithmetic: develop the ability to perform the calculations required in normal business transactions, and in computing their own budgets; demonstrate the ability to use concepts in consumer arithmetic to describe, model and solve real-world problems.',
  objectives:['2.1 calculate: (a) discount; (b) sales tax; (c) profit; and, (d) loss.','2.2 calculate: (a) percentage profit; and, (b) percentage loss.','2.3 express a profit, loss, discount, markup and purchase tax, as a percentage of some value;','2.4 solve problems involving marked price, selling price, cost price, profit, loss or discount;'],
  focus:'Profit and loss in dollars and as a percentage of cost price, mark-up, discount on marked price, and General Consumption Tax (GCT) in Jamaican shopping contexts.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 1, Section 2. GCT rates in problems are given in each question; check the current rate before using real prices.'},
 glossary:[['Cost price (CP)','What the seller paid for an item.'],['Selling price (SP)','What the customer pays the seller.'],['Profit','Selling price minus cost price, when SP is more than CP.'],['Loss','Cost price minus selling price, when SP is less than CP.'],['Percentage profit','Profit ÷ cost price × 100%.'],['Percentage loss','Loss ÷ cost price × 100%.'],['Mark-up','The amount added to the cost price to get the marked price.'],['Marked price','The price shown on the tag before any discount.'],['Discount','An amount taken off the marked price.'],['GCT','General Consumption Tax, a sales tax added to the price of many goods and services in Jamaica.']],
 teacher:{time:'about 70 minutes',flow:[['Engage','8 min','Predict the result of a 20% mark-up followed by a 20% discount.','Do not reveal the answer yet.'],['Explore','20 min','Run a market stall: set cost and selling prices to meet targets.','Ask: "Percentage of what?"'],['Explain','15 min','Key words, formulas and three worked examples.','Stress that percentage profit uses cost price.'],['Elaborate','15 min','Sort profit, loss or break even; Bronze to Gold problems.','Use real flyers or receipts if available.'],['Evaluate','12 min','Quiz and reflection.','Check work on percentage of cost vs selling price.']],
  misconceptions:['Calculating percentage profit using the selling price instead of the cost price.','Thinking a 20% increase followed by a 20% decrease returns to the original price.','Adding GCT before applying a discount when the question says otherwise.','Forgetting to convert a percentage to a decimal (15% = 0.15).'],
  extension:'Collect three supermarket receipts and check the GCT calculations. Present any items that are zero-rated.'},
 steps:[
  {phase:'engage',name:'Price puzzle',title:'Up 20%, then down 20%',lead:'A phone shop in Half Way Tree buys a phone for $20,000. It marks the price up by 20%, then later gives a 20% discount on the marked price.',
   mission:['Type your name.','Predict the final price.','Write what you already know about profit and loss.'],
   patois:'Up 20 percent, den dung 20 percent. Yuh tink it come back to di same price?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'What happens to the final price compared with $20,000?',options:['It is the same: $20,000','It is less than $20,000','It is more than $20,000'],after:'You will check it in the worked examples.'},{type:'write',fields:[{id:'know',label:'What I know about profit and loss:',placeholder:'Example: profit is when you sell for more than you paid'},{id:'wonder',label:'Where I have seen discounts or GCT:',placeholder:'Example: on a supermarket receipt'}]}]},
  {phase:'explore',name:'Market stall',title:'Explore: run a market stall',lead:'You sell school bags at Coronation Market. Change the cost price and selling price and watch the profit or loss change.',
   mission:['Move the sliders (or use −1 and +1) to set the prices.','Complete each challenge, then press Check.','Finish all 4 challenges for a star.'],
   patois:'Yuh a run a stall a Coronation Market. Set yuh price dem.',
   blocks:[{type:'custom',star:true,
    html:'<div class="controls"><label for="cpR">Cost price ($):</label><input type="range" id="cpR" min="100" max="2000" step="10" value="800"><output class="big cpO">$800</output></div><div class="controls"><label for="spR">Selling price ($):</label><input type="range" id="spR" min="100" max="2000" step="10" value="1000"><output class="big spO">$1000</output></div><div class="scene mkSvg"></div><div class="explain mkX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge mkN"></span> <strong class="mkT"></strong></p><div class="controls"><button type="button" class="go mkC">Check</button></div><div class="fb mkF" aria-live="polite">Set the prices, then check.</div></div>',
    init:function(box,api){var cp=box.querySelector('#cpR'),sp=box.querySelector('#spR');api.nudges(cp);api.nudges(sp);var T=[{t:'The cost price is $800. Set a selling price that gives a profit of exactly 25%.',ok:function(c,s){return c===800&&s===1000},hint:'Keep cost at $800. 25% of 800 = 200. Add it to the cost.'},{t:'Set the prices to make a loss of exactly $150.',ok:function(c,s){return c-s===150},hint:'Loss = cost price − selling price. Make the selling price $150 less than the cost price.'},{t:'Set any prices where you break even (no profit, no loss).',ok:function(c,s){return c===s},hint:'Break even means selling price = cost price.'},{t:'The cost price is $1200. Set a selling price that gives a 10% loss.',ok:function(c,s){return c===1200&&s===1080},hint:'10% of 1200 = 120. Take it away from 1200. (Use −1/+1 to get the exact value.)'}];var k=api.get('k')||0;function f(n){return'$'+n.toLocaleString('en-JM')}function draw(){var c=+cp.value,s=+sp.value,d=s-c,p=Math.round(1000*Math.abs(d)/c)/10;box.querySelector('.cpO').textContent=f(c);box.querySelector('.spO').textContent=f(s);var W=600,sc=W/2000;var svg='<svg viewBox="0 0 700 150" role="img" aria-label="Bar comparing cost price and selling price"><rect width="700" height="150" fill="#faf8fe"/><text x="10" y="45" font-size="15" fill="#3d2a73">Cost</text><rect x="70" y="25" width="'+(c*sc)+'" height="30" rx="6" fill="#b3a6d6"/><text x="10" y="105" font-size="15" fill="#3d2a73">Selling</text><rect x="70" y="85" width="'+(s*sc)+'" height="30" rx="6" fill="'+(d>0?'#16766a':d<0?'#c02d5f':'#a85d00')+'"/></svg>';box.querySelector('.mkSvg').innerHTML=svg;box.querySelector('.mkX').innerHTML=d>0?'<strong>Profit of '+f(d)+'</strong>. Percentage profit = '+f(d)+' ÷ '+f(c)+' × 100% = <strong>'+p+'%</strong>.':d<0?'<strong>Loss of '+f(-d)+'</strong>. Percentage loss = '+f(-d)+' ÷ '+f(c)+' × 100% = <strong>'+p+'%</strong>.':'<strong>Break even.</strong> No profit and no loss.'}function task(){if(k>=T.length){box.querySelector('.mkN').textContent='All done';box.querySelector('.mkT').textContent='You completed every challenge!';box.querySelector('.mkC').disabled=true;return}box.querySelector('.mkN').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.mkT').textContent=T[k].t}cp.addEventListener('input',draw);sp.addEventListener('input',draw);box.querySelector('.mkC').onclick=function(){var fb=box.querySelector('.mkF');if(T[k].ok(+cp.value,+sp.value)){fb.className='fb ok mkF';fb.textContent='✓ Yes! Well done.';k++;api.set('k',k);task();if(k===T.length)api.complete()}else{fb.className='fb no mkF';fb.textContent='Not yet. '+T[k].hint}};draw();task()}}]},
  {phase:'explore',name:'Percentage of what?',title:'Explore: percentage of what?',lead:'The most common mistake in consumer arithmetic is using the wrong amount as the "whole". Test yourself.',
   mission:['Read each question.','Choose your answer. Use the hint if you are stuck.','Answer all 3 for a star.'],
   patois:'Always ask: percentage a WAH?',
   blocks:[{type:'mcq',star:true,questions:[{q:'Percentage profit is worked out as a percentage of the…',o:['cost price','selling price','discount'],a:0,why:'Profit % = profit ÷ cost price × 100%.',hint:'What did the seller start with?'},{q:'A discount of 10% is worked out as a percentage of the…',o:['cost price','marked price','profit'],a:1,why:'Discounts are taken off the marked (tag) price.',hint:'Which price is on the tag in the store?'},{q:'GCT is added to the…',o:['price of the item before tax','profit only','cost price the shop paid'],a:0,why:'Sales tax is a percentage of the price before tax.',hint:'The customer pays tax on what they buy.'}]}]},
  {phase:'explain',name:'Key words',title:'Key words: the language of business',lead:'Learn these terms. They appear in every consumer arithmetic question.',
   mission:['Say the word, then flip the card.','Use 🔊 Hear it if you want.','Flip at least 6 cards for a star.'],
   patois:'Learn di word dem. Dem come up inna every question.',
   blocks:[{type:'cards',star:true,need:6,cards:[{term:'Cost price',def:'What the seller paid.',eg:'A shop buys a bag for $800.'},{term:'Selling price',def:'What the customer pays.',eg:'The shop sells it for $1,000.'},{term:'Profit',def:'SP − CP (when SP > CP).',eg:'$1,000 − $800 = $200'},{term:'Loss',def:'CP − SP (when SP < CP).',eg:'$800 − $650 = $150'},{term:'% profit',def:'Profit ÷ CP × 100%.',eg:'200 ÷ 800 × 100% = 25%'},{term:'Marked price',def:'The price on the tag.',eg:'Tag says $5,000.'},{term:'Discount',def:'Amount taken off the marked price.',eg:'10% off $5,000 = $500 off'},{term:'GCT',def:'Sales tax added to the price.',eg:'At 15%, tax on $2,000 = $300'}]}]},
  {phase:'explain',name:'Formulas and examples',title:'Formulas and worked examples',lead:'Use these formulas, and always ask "percentage of what?"',
   mission:['Read the formulas.','Work out each next step, then press Show next step.','Finish all 3 examples for a star.'],
   patois:'Use di formula, an check yuh answer.',
   blocks:[{type:'facts',facts:[{title:'Profit and loss',text:'Profit = selling price − cost price, when you sell for more than you paid. Loss = cost price − selling price, when you sell for less than you paid. For example, a vendor buys a bag for $800 and sells it for $1,000. Profit = $1,000 − $800 = $200.'},{title:'Percentage profit and loss',text:'Percentage profit = (profit ÷ cost price) × 100%. Percentage loss = (loss ÷ cost price) × 100%. Always divide by the COST price, because that is what the seller started with. For example, a $200 profit on a bag that cost $800 is 200 ÷ 800 × 100% = 25%.'},{title:'Discount',text:'Discount = discount % × marked price. Then sale price = marked price − discount. For example, 15% off a $2,000 tag: discount = 0.15 × 2,000 = $300, so the sale price is $2,000 − $300 = $1,700.'},{title:'Adding sales tax (GCT)',text:'Find the tax and add it to the price. For example, at 15%: tax on $2,000 = 0.15 × 2,000 = $300, so the price with tax is $2,000 + $300 = $2,300. A shortcut is to multiply by 1.15: $2,000 × 1.15 = $2,300.'}]},
    {type:'examples',star:true,examples:[{q:'A bag costs a vendor $800 and is sold for $1,000. Find the percentage profit.',steps:['Profit = $1,000 − $800 = $200.','% profit = 200 ÷ 800 × 100%.','= 0.25 × 100% = 25%.']},{q:'A pair of shoes is marked $6,500. A 20% discount is given. GCT of 15% is then added. Find the final price.',steps:['Discount = 20% of $6,500 = 0.20 × 6,500 = $1,300.','Sale price = $6,500 − $1,300 = $5,200.','GCT = 15% of $5,200 = $780.','Final price = $5,200 + $780 = $5,980.']},{q:'The Engage puzzle: $20,000 is marked up 20%, then discounted 20%. Find the final price.',steps:['Mark-up: 20% of $20,000 = $4,000. Marked price = $24,000.','Discount: 20% of $24,000 = $4,800. (The 20% is now of a bigger number!)','Final price = $24,000 − $4,800 = $19,200.','So the final price is LESS than $20,000. Was your prediction right?']}]}]},
  {phase:'elaborate',name:'Profit or loss?',title:'Sort: profit, loss or break even?',lead:'Each card shows a cost price (CP) and a selling price (SP).',
   mission:['Tap a card, then tap the right box.','Sort all 8 cards.','Press Check my sorting.'],
   patois:'Compare di cost an di selling price.',
   blocks:[{type:'sort',star:true,tip:'Compare SP with CP: bigger, smaller or equal?',bins:[{id:'p',label:'Profit',hint:'SP > CP'},{id:'l',label:'Loss',hint:'SP < CP'},{id:'b',label:'Break even',hint:'SP = CP'}],items:[{label:'CP $500, SP $650',bin:'p'},{label:'CP $1,200, SP $1,080',bin:'l'},{label:'CP $900, SP $900',bin:'b'},{label:'CP $2,500, SP $2,499',bin:'l'},{label:'CP $70, SP $100',bin:'p'},{label:'Bought for $3,000, sold for $3,000',bin:'b'},{label:'Bought for $4,800, sold for $5,000',bin:'p'},{label:'Bought for $15,000, sold for $12,000',bin:'l'}]}]},
  {phase:'elaborate',name:'Real-life problems',title:'Shopping and selling: choose your challenge',lead:'From the corner shop to the car dealership, these skills save and make money. Pick a level.',
   mission:['Choose Bronze, Silver or Gold.','Use the hints if you are stuck.','Solve any 2 problems for a star.'],
   patois:'Pick yuh level. Every dollar count.',
   blocks:[{type:'problems',star:true,need:2,levels:{
    bronze:[{c:'A vendor buys a box of mangoes for $1,500 and sells them all for $2,100.',q:'How much profit does the vendor make, in dollars?',a:600,h:['Profit = selling price − cost price.','2,100 − 1,500 = ?'],sol:'$2,100 − $1,500 = $600 profit.',placeholder:'dollars'},{c:'A school uniform is marked $4,000. The store gives a 10% discount.',q:'How much is the discount, in dollars?',a:400,h:['Discount = 10% of the marked price.','10% of 4,000 = 4,000 ÷ 10.'],sol:'10% of $4,000 = $400.',placeholder:'dollars'}],
    silver:[{c:'A used laptop was bought for $60,000 and sold for $48,000.',q:'Find the percentage loss.',a:20,tol:0.01,h:['Loss = 60,000 − 48,000 = 12,000.','% loss = loss ÷ cost price × 100%.'],sol:'Loss = $12,000. % loss = 12,000 ÷ 60,000 × 100% = 20%.',wrong:'Remember to divide by the COST price.',placeholder:'percent'},{c:'A blender costs $8,000 before GCT. GCT is charged at 15%.',q:'What is the total price the customer pays?',a:9200,h:['GCT = 15% of 8,000.','15% of 8,000 = 1,200. Add it to the price.'],sol:'GCT = $1,200, so the total is $9,200.',placeholder:'dollars'}],
    gold:[{c:'A furniture store in Montego Bay sells a chair for $13,800, making a profit of 15% on the cost price.',q:'What was the cost price of the chair?',a:12000,h:['Selling price = 115% of the cost price.','Cost price = 13,800 ÷ 1.15.'],sol:'CP = $13,800 ÷ 1.15 = $12,000.',wrong:'Do not take 15% of the selling price. The profit is 15% of the COST.',placeholder:'dollars'},{c:'A TV is marked at $90,000. It is sold at a 12% discount, and the store still makes a 10% profit.',q:'What was the cost price of the TV?',a:72000,h:['Sale price = 88% of $90,000 = $79,200.','That sale price is 110% of the cost price, so divide by 1.10.'],sol:'Sale price = $79,200. CP = 79,200 ÷ 1.10 = $72,000.',placeholder:'dollars'}]}}]},
  {phase:'evaluate',name:'Check your understanding',title:'Check your understanding',lead:'8 questions. If you get one wrong, you get a hint and a second try.',
   mission:['Read each question carefully.','If it is wrong, read the hint and try again.','At the end, see which parts to review.'],
   patois:'Tek yuh time. Read di hint if yuh need it.',
   blocks:[{type:'quiz',star:true,questions:[{q:'CP = $400, SP = $500. The profit is…',o:['$100','$900','25%'],a:0,hint:'Profit = SP − CP.',why:'$500 − $400 = $100.',review:1},{q:'CP = $400, SP = $500. The percentage profit is…',o:['20%','25%','100%'],a:1,hint:'Divide the profit by the cost price.',why:'100 ÷ 400 × 100% = 25%.',review:2},{q:'An item marked $2,000 has a 15% discount. The sale price is…',o:['$1,700','$300','$2,300'],a:0,hint:'Find 15% of 2,000 and subtract it.',why:'Discount = $300, so the sale price is $1,700.',review:4},{q:'GCT at 15% on $1,000 is…',o:['$15','$150','$1,150'],a:1,hint:'15% of 1,000.',why:'0.15 × 1,000 = $150.',review:4},{q:'A car bought for $1,000,000 is sold for $850,000. The percentage loss is…',o:['15%','17.6%','85%'],a:0,hint:'Loss ÷ cost price × 100%.',why:'150,000 ÷ 1,000,000 × 100% = 15%.',review:6},{q:'Which situation is a loss?',o:['CP $50, SP $60','CP $80, SP $75','CP $90, SP $90'],a:1,hint:'A loss is when SP < CP.',why:'$75 is less than $80.',review:5},{q:'A price is increased by 10% and then decreased by 10%. The final price is…',o:['the same as before','lower than before','higher than before'],a:1,hint:'The 10% decrease is taken from a bigger amount.',why:'For $100: up to $110, then down $11 to $99.',review:4},{q:'Mark-up is the amount added to the…',o:['selling price','cost price','discount'],a:1,hint:'A shop marks up what it paid.',why:'Marked price = cost price + mark-up.',review:3}]}]},
  {phase:'evaluate',name:'Reflect and summary',title:'Reflect on your learning',lead:'How confident do you feel about each goal? Be honest.',
   mission:['Rate yourself on each goal.','Complete the 3-2-1 reflection.','Print or save your summary.'],
   patois:'Tink bout wah yuh learn today.',
   blocks:[{type:'reflect',star:true,two:'2 places in Jamaica where I could use profit, discount or GCT calculations:'}]}
 ]
};
