  {phase:'explain',name:'Teach: properties of arithmetic',title:'Learn: the properties of arithmetic',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Dem rule yah mek maths easier inna yuh head.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Commutative and associative',explain:'<p>Have you noticed that 3 + 5 and 5 + 3 give the same answer? It does not matter which number comes first. Mathematicians call this the {{commutative|the order does not matter}} property: for adding and multiplying, <strong>the order does not matter</strong>. 3 × 5 = 5 × 3 = 15.</p><p>Here is a second one. If you add 2 + 3 + 4, you could do (2 + 3) first and then add 4, or you could do (3 + 4) first and then add 2. Either way, you get 9. That is the {{associative|the grouping does not matter}} property: for adding and multiplying, <strong>the grouping does not matter</strong>.</p><p>These are not just fancy names; they make mental maths much easier. To work out 25 + 39 + 75, swap the order and group the friendly numbers: (25 + 75) + 39 = 100 + 39 = 139.</p><p>But be careful: they do NOT work for subtraction or division. 8 − 3 is 5, but 3 − 8 is −5.</p>',
     example:{q:'Work out 4 × 17 × 25 in your head.',steps:[{do:'Swap the order: 4 × 25 × 17.',why:'Commutative: the order of multiplying does not matter.'},{do:'Group the friendly pair: (4 × 25) × 17 = 100 × 17.',why:'Associative: the grouping does not matter.'},{do:'100 × 17 = 1,700.'}]},
     mistake:'Swapping the order in a subtraction or division. 12 ÷ 4 = 3, but 4 ÷ 12 = 1/3.',
     check:{q:'Which shows the commutative property?',o:['6 + 9 = 9 + 6','6 − 9 = 9 − 6','(6 + 9) + 1 = 6 + (9 + 1)'],a:0,why:'The order changed and the answer stayed the same.',hint:'Commutative is about order.'}},
    {title:'The distributive property',explain:'<p>Imagine buying 4 patties at $213 each. That is awkward to multiply in your head. But $213 is the same as $200 + $13. So 4 × 213 = 4 × 200 + 4 × 13 = 800 + 52 = $852.</p><p>You just used the {{distributive|multiplying over a bracket: a × (b + c) = a × b + a × c}} property. It says that multiplying a sum is the same as multiplying each part and then adding: <strong>a × (b + c) = a × b + a × c</strong>. The number outside “distributes” itself to every part inside the bracket, like a teacher handing a worksheet to every student in a group.</p><p>It works with subtraction too: 6 × 99 = 6 × (100 − 1) = 600 − 6 = 594. This property is the reason long multiplication works, and you will use it a lot in algebra.</p>',
     example:{q:'Use the distributive property to work out 7 × 48.',steps:[{do:'Split 48 into 40 + 8.'},{do:'7 × 40 = 280 and 7 × 8 = 56.',why:'The 7 multiplies BOTH parts.'},{do:'280 + 56 = 336.'}]},
     mistake:'Multiplying only one part: 7 × (40 + 8) is NOT 280 + 8. The 7 must multiply the 8 as well.',
     check:{q:'5 × (20 + 3) = ?',o:['103','115','28'],a:1,why:'5 × 20 + 5 × 3 = 100 + 15 = 115.',hint:'Multiply both parts by 5.'}},
    {title:'Identity and inverses',explain:'<p>Some numbers are very special because they leave things exactly as they are. Add 0 to any number, and nothing changes: 7 + 0 = 7. Multiply any number by 1, and nothing changes: 7 × 1 = 7. These special numbers are called {{identities|numbers that leave things unchanged: 0 for adding, 1 for multiplying}}: <strong>0 is the identity for adding</strong>, and <strong>1 is the identity for multiplying</strong>.</p><p>An {{inverse|the number that undoes another and gets you back to the identity}} is a number that “undoes” another one, bringing you back to the identity. For adding, the inverse of 5 is −5, because 5 + (−5) = 0. For multiplying, the inverse of 5 is 1/5, because 5 × 1/5 = 1.</p><p>Think of walking 5 steps forward and then 5 steps back: you end up exactly where you started. That is what an inverse does. Inverses are the secret to solving equations later on.</p>',
     example:{q:'Find the additive inverse and the multiplicative inverse of 4.',steps:[{do:'Additive inverse: 4 + ? = 0, so it is −4.',why:'Adding the inverse brings you back to 0, the identity for adding.'},{do:'Multiplicative inverse: 4 × ? = 1, so it is 1/4.',why:'Multiplying by the inverse brings you back to 1, the identity for multiplying.'}]},
     mistake:'Thinking the identity for multiplying is 0. Multiplying by 0 changes everything to 0; it is multiplying by 1 that leaves things unchanged.',
     check:{q:'What is the multiplicative inverse of 3?',o:['−3','1/3','0'],a:1,why:'3 × 1/3 = 1.',hint:'What do you multiply 3 by to get 1?'}}]}]},
  {phase:'explain',name:'Teach: ratio and proportion',title:'Learn: ratio, sharing and proportion',lead:'Next, ratio: a way of comparing amounts that you use every time you mix, share or cook.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Add up di part dem first, den share.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Ratios and fractions',explain:'<p>A {{ratio|a comparison of two or more quantities, written a : b}} compares amounts. In Auntie May’s sorrel, there are 2 cups of sorrel to 6 cups of water. We write this as <strong>2 : 6</strong> and read it as “2 to 6”.</p><p>Just like fractions, ratios can be simplified by dividing both numbers by the same number. 2 and 6 both divide by 2, so 2 : 6 = 1 : 3. That is the {{simplest form|a ratio whose numbers have no common factor except 1}}: one cup of sorrel for every three cups of water.</p><p>Ratios and fractions are closely linked, but be careful. In the ratio 1 : 3, there are 1 + 3 = 4 parts altogether. So the sorrel is <strong>1/4</strong> of the whole drink, not 1/3. And going the other way, if 2/5 of a class are boys, then 3/5 are girls, so the ratio of boys to girls is 2 : 3.</p>',
     example:{q:'A class has 12 boys and 18 girls. Write the ratio of boys to girls in simplest form, and the fraction of the class that are boys.',steps:[{do:'Ratio: 12 : 18. Divide both by 6: 2 : 3.',why:'6 is the biggest number that goes into both.'},{do:'Total parts: 2 + 3 = 5.'},{do:'Fraction of boys: 2/5 of the class.',why:'The boys are 2 of the 5 equal parts.'}]},
     mistake:'Turning the ratio 2 : 3 into the fraction 2/3 of the whole. With 5 parts altogether, the boys are 2/5.',
     check:{q:'Simplify 15 : 20.',o:['3 : 4','5 : 4','15 : 20'],a:0,why:'Divide both by 5.',hint:'What divides into both 15 and 20?'}},
    {title:'Comparing and sharing with ratios',explain:'<p>Ratios are great for comparing. Which is stronger: sorrel made 2 : 5 or 3 : 8? It is hard to tell from the numbers. But change each into a fraction of the drink that is sorrel: 2/7 and 3/11. Or ask how much water there is for each cup of sorrel: 2.5 cups in the first, but 2.67 cups in the second. So 2 : 5 has less water per cup, and it is stronger.</p><p>Ratios also help us share fairly. To share $5,000 in the ratio 2 : 3: first <strong>add the parts</strong> (2 + 3 = 5 equal shares). Then <strong>find one share</strong> ($5,000 ÷ 5 = $1,000). Then <strong>multiply</strong>: 2 shares = $2,000 and 3 shares = $3,000. Finally, check they add up to $5,000.</p>',
     example:{q:'Share 35 mangoes between Kemar and Jada in the ratio 3 : 4.',steps:[{do:'Total parts: 3 + 4 = 7.'},{do:'One part: 35 ÷ 7 = 5 mangoes.'},{do:'Kemar: 3 × 5 = 15. Jada: 4 × 5 = 20.'},{do:'Check: 15 + 20 = 35 ✓'}]},
     mistake:'Forgetting to add the parts first. In the ratio 3 : 4, there are 7 shares, not 3 or 4.',
     check:{q:'Share $40 in the ratio 1 : 3. What is the bigger share?',o:['$30','$10','$13.33'],a:0,why:'4 parts of $10: 3 × $10 = $30.',hint:'Add the parts: 1 + 3.'}},
    {title:'Quantities in proportion',explain:'<p>Two quantities are in {{proportion|their ratios are equal, so they grow or shrink at the same rate}} when they always keep the same ratio. If you double one, the other doubles too. If you halve one, the other halves.</p><p>Think about buying patties. 1 patty costs $250, 2 cost $500, 4 cost $1,000. The cost and the number of patties are in proportion, because the cost per patty is always $250.</p><p>Here is a simple test. Divide one quantity by the other for every pair. If you always get the same answer, they are in proportion. For the patties: 500 ÷ 2 = 250, 1,000 ÷ 4 = 250. Same every time, so they are proportional.</p><p>Not everything that grows together is in proportion. Your age and your height both go up, but if you double your age, your height does not double!</p>',
     example:{q:'Are these in proportion? 3 m of cloth cost $900; 5 m cost $1,500; 8 m cost $2,400.',steps:[{do:'Cost per metre: 900 ÷ 3 = $300.'},{do:'1,500 ÷ 5 = $300 and 2,400 ÷ 8 = $300.'},{do:'The cost per metre is always $300, so yes, they are in proportion.'}]},
     mistake:'Thinking two quantities are in proportion just because they both increase. The ratio must stay exactly the same.',
     check:{q:'1 bag of rice costs $400; 3 bags cost $1,200; 5 bags cost $1,800. Are the costs in proportion?',o:['Yes','No'],a:1,why:'400 and 1,200 ÷ 3 = 400, but 1,800 ÷ 5 = 360. Not always the same.',hint:'Find the cost of one bag each time.'}}]}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'a + b = b + a.',a:'always',why:'Addition is commutative.'},{s:'a − b = b − a.',a:'sometimes',why:'Only when a and b are equal; 5 − 3 ≠ 3 − 5.',hint:'Try a = b.'},{s:'Multiplying a number by 1 changes it.',a:'never',why:'1 is the identity for multiplication.'},{s:'In the ratio 1 : 3, the first quantity is 1/3 of the whole.',a:'never',why:'There are 4 parts, so it is 1/4 of the whole.'},{s:'Two quantities that both increase are in proportion.',a:'sometimes',why:'Cost and number of patties are; age and height are not.',hint:'Think of age and height.'}]}},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire ratio and properties questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,5),b=R(1,6),k=R(2,6);if(a===b)b++;var g=g7gcd(a,b);a/=g;b/=g;return{q:'Simplify '+a*k+' : '+b*k+'.',o:[a+' : '+b,b+' : '+a,(a*k/2)+' : '+(b*k/2)],a:0,why:'Divide both by '+k+'.'}}if(r===1){var p=R(1,4),q=R(1,5),u=R(2,9)*10;if(p===q)q++;var T=(p+q)*u;return{q:'Share $'+T+' in the ratio '+p+' : '+q+'. First share?',o:['$'+p*u,'$'+q*u,'$'+T/2],a:0,why:(p+q)+' parts of $'+u+'.'}}var n=R(2,9);return[{q:'Additive inverse of '+n+'?',o:['−'+n,'1/'+n,'0'],a:0,why:n+' + (−'+n+') = 0.'},{q:'Multiplicative inverse of '+n+'?',o:['1/'+n,'−'+n,'1'],a:0,why:n+' × 1/'+n+' = 1.'}][R(0,1)]}}},
