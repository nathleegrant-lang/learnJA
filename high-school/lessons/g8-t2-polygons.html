     init:function(box,api){var N=box.querySelector('#ptN'),seen=api.get('s')||{};api.nudges(N);function draw(){var n=+N.value;seen[n]=1;api.set('s',seen);box.querySelector('.ptNO').textContent=n;box.querySelector('.ptSvg').innerHTML=POLY(n,{tri:true,label:'A '+PNAME[n]+' split into '+(n-2)+' triangles from one corner'});box.querySelector('.ptX').innerHTML='A <strong>'+PNAME[n]+'</strong> has '+n+' sides. From one corner, the diagonals cut it into <strong>'+(n-2)+' triangle'+(n-2>1?'s':'')+'</strong>. Each triangle holds 180°, so the angles add up to '+(n-2)+' × 180° = <strong>'+(n-2)*180+'°</strong>.';box.querySelector('.ptT tbody').innerHTML=Object.keys(seen).map(Number).sort(function(a,b){return a-b}).map(function(k){return'<tr><td>'+k+'</td><td>'+PNAME[k]+'</td><td>'+(k-2)+'</td><td>'+(k-2)*180+'°</td></tr>'}).join('')}N.addEventListener('input',draw);var T=[{t:'What is the angle sum of a hexagon?',a:720},{t:'How many triangles does a decagon (10 sides) split into?',a:8},{t:'A stop sign is a regular octagon. What size is each angle?',a:135}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ptB').textContent='All done';box.querySelector('.ptQ').textContent='You completed every challenge!';box.querySelector('.ptC').disabled=true;return}box.querySelector('.ptB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ptQ').textContent=T[q].t}box.querySelector('.ptC').onclick=function(){var v=+box.querySelector('.ptA').value,fb=box.querySelector('.ptFb');if(v===T[q].a){fb.className='fb ok ptFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ptA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ptFb';fb.textContent=q===2?'Find the angle sum of an octagon first, then share it equally between the 8 equal angles.':'Not yet. Set the triangulator to this polygon and read the table.'}};draw();task()}},
    {type:'recall',text:'Each angle of a stop sign is 135°. An octagon splits into 6 triangles: 6 × 180° = 1,080°, shared equally between 8 angles: 1,080 ÷ 8 = 135°.'}]},
  {phase:'explain',name:'Teach: polygons and their properties',title:'Learn: polygons and their properties',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],

   blocks:[{type:'teach',star:true,chunks:[
    {title:'What makes a polygon',explain:'<p>Look around your school: windows, floor tiles, the stop sign at the gate, the hexagons in a honeycomb. They are all {{polygons|flat, closed shapes made of straight sides}}: flat, closed shapes made entirely of straight sides.</p><p>All three parts of that description matter. A circle is not a polygon, because its edge is curved. A shape with a gap in it is not a polygon, because it is not closed. And a 3-D box is not a polygon, because it is not flat.</p><p>Every corner, where two sides meet, is a {{vertex|a corner where two sides meet; plural vertices}}. Here is a neat fact: a polygon always has exactly as many vertices as it has sides, and as many interior angles too. A pentagon has 5 sides, 5 vertices and 5 interior angles.</p>',visual:POLY(5,{label:'A regular pentagon'}),
     example:{q:'Which of these are polygons: a triangle, a circle, a stop sign, a semicircle?',steps:[{do:'Triangle: flat, closed, straight sides. ✓ Polygon.'},{do:'Circle: curved edge. ✗ Not a polygon.'},{do:'Stop sign: flat, closed, 8 straight sides. ✓ Polygon.'},{do:'Semicircle: one curved edge. ✗ Not a polygon.',why:'Every side of a polygon must be straight.'}]},
     mistake:'Calling a circle or a semicircle a polygon. Every side of a polygon must be a straight line.',
     check:{q:'How many vertices does a hexagon have?',o:['5','6','8'],a:1,why:'A polygon has as many vertices as sides.',hint:'Hexa- means six.'}},
    {title:'Naming polygons, 3 to 10 sides',explain:'<p>Polygons are named by counting their sides, and the names come from old Greek words for numbers. A 3-sided shape is a <strong>triangle</strong>, and a 4-sided shape is a <strong>quadrilateral</strong>.</p><p>After that, the names follow a pattern: <strong>penta</strong>gon (5), <strong>hexa</strong>gon (6), <strong>hepta</strong>gon (7), <strong>octa</strong>gon (8), <strong>nona</strong>gon (9) and <strong>deca</strong>gon (10). You may know some of these word beginnings already: an octopus has 8 legs, and a decade is 10 years.</p><p>A handy way to remember them is to link each name to something you have seen: a pentagon for a house shape on a drawing, a hexagon for a honeycomb cell, an octagon for a stop sign.</p>',
     example:{q:'Name a polygon with 7 sides and one with 9 sides.',steps:[{do:'7 sides: hepta- means 7, so a heptagon.'},{do:'9 sides: nona- means 9, so a nonagon.'}]},
     mistake:'Mixing up hexagon (6) and heptagon (7). Remember: hex has an x, like six.',
     check:{q:'How many sides does a decagon have?',o:['8','10','12'],a:1,why:'Deca- means 10, like a decade.',hint:'Think of a decade.'}},
    {title:'Regular and irregular polygons, and diagonals',explain:'<p>A {{regular polygon|a polygon with all sides equal and all angles equal}} has all of its sides equal AND all of its angles equal. A stop sign is a regular octagon, and a square is a regular quadrilateral. An {{irregular polygon|a polygon whose sides or angles are not all equal}} does not have all its sides and angles equal. A rectangle is irregular, because its sides are not all the same length, even though its angles are.</p><p>A {{diagonal|a straight line joining two vertices that are not next to each other}} is a straight line joining two corners that are not next to each other. From one vertex of a polygon with n sides, you can draw a diagonal to every other vertex except itself and its two neighbours. That is n − 3 diagonals from each corner, and these diagonals are what cut a polygon into triangles.</p>',visual:POLY(6,{irr:true,label:'An irregular hexagon'}),
     example:{q:'How many diagonals can be drawn from ONE vertex of a hexagon?',steps:[{do:'There are 6 vertices altogether.'},{do:'You cannot draw a diagonal to the vertex itself or to its two neighbours: that rules out 3.'},{do:'So 6 − 3 = 3 diagonals from one vertex, which split the hexagon into 4 triangles.'}]},
     mistake:'Thinking every hexagon has equal sides. Only a REGULAR hexagon does; most hexagons are irregular.',
     check:{q:'Is a rectangle a regular polygon?',o:['Yes','No'],a:1,why:'Its angles are equal, but its sides are not all equal.',hint:'Regular needs equal sides AND equal angles.'}}]}]},
  {phase:'explain',name:'Teach: angle sums',title:'Learn: the angle sum of a polygon',lead:'Next, the formula the guide asks you to derive: the angle sum of any polygon.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Take two off di side dem, den times by 180.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Deriving the angle-sum formula',explain:'<p>You already know two angle sums. A triangle’s angles add up to 180°, and a quadrilateral’s add up to 360°. But what about a hexagon, or a decagon? Instead of measuring every angle, we can find a rule that works for all of them.</p><p>Here is the clever idea you saw in the triangulator. Stand at one corner and draw every diagonal you can. The polygon is cut into triangles, and all of their corners fit exactly into the polygon’s corners. So the {{angle sum|the total of all the interior angles of a polygon}} is just the number of triangles × 180°.</p><p>How many triangles? Look at your table: 3 sides gave 1 triangle, 4 sides gave 2, 5 sides gave 3, 6 sides gave 4. The number of triangles is always <strong>2 less than the number of sides</strong>. So for a polygon with n sides:</p><p><strong>Angle sum = (n − 2) × 180°</strong></p>',visual:POLY(7,{tri:true,label:'A heptagon split into 5 triangles from one corner'}),
     example:{q:'Find the angle sum of a heptagon (7 sides).',steps:[{do:'Number of triangles: 7 − 2 = 5.',why:'From one corner, a 7-sided shape splits into 5 triangles.'},{do:'Angle sum = 5 × 180°.'},{do:'= 900°.'}]},
     mistake:'Using n × 180°. A hexagon is NOT 6 × 180° = 1,080°; it splits into only 4 triangles, so 720°.',
     check:{q:'What is the angle sum of a pentagon?',o:['540°','900°','360°'],a:0,why:'(5 − 2) × 180° = 3 × 180° = 540°.',hint:'(n − 2) × 180°.'}},
    {title:'One angle of a regular polygon',explain:'<p>In a regular polygon, all the angles are equal. So once you know the angle sum, you can find each angle by sharing it out equally.</p><p><strong>Each interior angle = angle sum ÷ number of angles = (n − 2) × 180° ÷ n</strong>.</p><p>That solves the stop-sign puzzle. An octagon has an angle sum of (8 − 2) × 180° = 1,080°, and 1,080° ÷ 8 = <strong>135°</strong>.</p><p>Here is something interesting to notice: the more sides a regular polygon has, the bigger each angle gets. A triangle has 60° angles, a square 90°, a hexagon 120°, a decagon 144°. As the number of sides grows, the shape looks more and more like a circle.</p>',
     example:{q:'Find each interior angle of a regular hexagon.',steps:[{do:'Angle sum: (6 − 2) × 180° = 720°.'},{do:'There are 6 equal angles.'},{do:'Each angle = 720° ÷ 6 = 120°.',why:'Honeycomb cells are regular hexagons, so their angles are 120°.'}]},
     mistake:'Forgetting to divide by n. The angle sum (720°) is all six angles together, not one of them.',
     check:{q:'What is each interior angle of a regular pentagon?',o:['108°','540°','72°'],a:0,why:'540° ÷ 5 = 108°.',hint:'Angle sum first, then share between 5.'}},
    {title:'Finding a missing angle',explain:'<p>Many polygons are irregular, with angles of different sizes. If you know all of the angles except one, you can still find the missing one.</p><p>First, find the total that all the angles must add up to, using (n − 2) × 180°. Then add up the angles you already know. Whatever is left over must be the missing angle.</p><p>This is just like knowing the total cost of a shopping basket and the price of every item but one: subtract the ones you know from the total.</p>',
     example:{q:'A pentagon has angles of 100°, 110°, 95° and 120°. Find the fifth angle.',steps:[{do:'Angle sum of a pentagon: (5 − 2) × 180° = 540°.'},{do:'Add the known angles: 100 + 110 + 95 + 120 = 425°.'},{do:'Missing angle = 540° − 425° = 115°.'}]},
     mistake:'Subtracting from 360° for every polygon. 360° is only for quadrilaterals; find the correct angle sum for the number of sides first.',
     check:{q:'A quadrilateral has angles 80°, 95° and 105°. What is the fourth angle?',o:['80°','180°','100°'],a:0,why:'360 − 280 = 80°.',hint:'A quadrilateral adds up to 360°.'}}]}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A polygon has the same number of sides as vertices.',a:'always',why:'Each side ends at a vertex, and each vertex joins two sides.'},{s:'A hexagon has angles of 120°.',a:'sometimes',why:'A REGULAR hexagon does; an irregular hexagon’s angles vary (but still add to 720°).',hint:'Regular or irregular?'},{s:'The angle sum of a polygon is a multiple of 180°.',a:'always',why:'It is (n − 2) × 180°.'},{s:'Adding one more side adds 180° to the angle sum.',a:'always',why:'One more side means one more triangle.'},{s:'A regular polygon has an interior angle of 180°.',a:'never',why:'Each angle is always less than 180°, getting closer as sides increase, but never reaching it.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Rohan',q:'Find the angle sum of a hexagon.',lines:['A hexagon has 6 sides','6 × 180° = 1,080°'],wrong:1,reasons:['The formula is (n − 2) × 180°, so 4 × 180° = 720°','He should use 360°','A hexagon has 8 sides'],reason:0,fix:'(6 − 2) × 180° = 720°.'},{who:'Tia',q:'Find each angle of a regular octagon.',lines:['Angle sum = (8 − 2) × 180° = 1,080°','Each angle = 1,080°'],wrong:1,reasons:['She must divide by 8: 135°','The angle sum is wrong','She should multiply by 8'],reason:0,fix:'1,080° ÷ 8 = 135°.'},{who:'Andre',q:'A pentagon has angles 100°, 110°, 120° and 90°. Find the fifth.',lines:['Total of the known angles: 420°','Fifth angle = 360° − 420°'],wrong:1,reasons:['A pentagon’s angles add to 540°, not 360°','He added wrongly','The fifth angle is 0°'],reason:0,fix:'540° − 420° = 120°.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire polygon questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},n=R(3,10),r=R(0,2),S=(n-2)*180;if(r===0)return{q:'Angle sum of a '+PNAME[n]+'?',o:[S+'°',n*180+'°',(S+180)+'°'],a:0,why:'('+n+' − 2) × 180°.'};if(r===1){var reg=[3,4,5,6,8,9,10][R(0,6)],each=(reg-2)*180/reg;return{q:'One angle of a regular '+PNAME[reg]+'?',o:[each+'°',(reg-2)*180+'°',(each+10)+'°'],a:0,why:'Angle sum ÷ '+reg+'.'}}return{q:'How many sides does a '+PNAME[n]+' have?',o:[String(n),String(n===10?8:n+1),String(n===3?5:n-1)],a:0,why:'Count from the name.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent polygons that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A polygon has an angle sum of 1,260°. How many sides does it have?',placeholder:'sides',check:function(v){return+v===9?{ok:true,msg:'Yes! 1,260 ÷ 180 = 7 triangles, so 7 + 2 = 9 sides: a nonagon.'}:{ok:false,msg:'Divide by 180 to find the triangles, then add 2.'}}},{q:'Type the angles of an irregular quadrilateral (all different) that add up correctly. (For example: a, b, c, d)',placeholder:'a, b, c, d',check:function(v){var n=String(v).replace(/°/g,'').split(',').map(Number);if(n.length!==4||n.some(function(x){return!(x>0&&x<360)}))return{ok:false,msg:'Type four angles separated by commas.'};var s=n.reduce(function(a,b){return a+b},0),u=n.filter(function(x,i){return n.indexOf(x)===i}).length===4;return s===360&&u?{ok:true,msg:'Yes! They add up to 360° and are all different.'}:{ok:false,msg:s!==360?'They add up to '+s+'°. A quadrilateral needs 360°.':'Make every angle different.'}}},{q:'Which regular polygon has interior angles of 140°? Type its number of sides.',placeholder:'sides',check:function(v){return+v===9?{ok:true,msg:'Correct! A regular nonagon: 1,260° ÷ 9 = 140°.'}:{ok:false,msg:'Try each polygon: angle sum ÷ number of sides.'}}}]}},
    {icon:'🎬',title:'Mission: the polygon movie',desc:'Plan the guide’s polygon video around your school.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'For the NSC polygon movie project, your group is filming polygons around a school in Mandeville and calculating their angles.',parts:[{q:'Scene 1: the stop sign at the school gate is a regular octagon. What is its angle sum?',a:1080,hint:'(8 − 2) × 180°.',sol:'1,080°.',placeholder:'degrees'},{q:'What is each angle of the stop sign?',a:135,hint:'1,080 ÷ 8.',sol:'135°.',placeholder:'degrees'},{q:'Scene 2: a floor tile is a regular hexagon. What is each of its angles?',a:120,hint:'720 ÷ 6.',sol:'120°.',placeholder:'degrees'},{q:'How many of those hexagonal tiles meet at a point with no gaps? (The angles around a point add to 360°.)',a:3,hint:'360 ÷ 120.',sol:'3 tiles.'},{q:'Scene 3: the school’s pentagonal sign has angles of 108°, 108°, 108° and 116°. What is the fifth angle?',a:100,hint:'540° − 440°.',sol:'100°.',placeholder:'degrees'}],done:'You found polygons in the real world and used angle sums to explain them, just like the NSC video project.'}}
