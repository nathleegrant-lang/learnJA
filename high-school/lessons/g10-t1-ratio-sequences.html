var RATIOBAR=function(parts,total,cols){var sum=parts.reduce(function(a,b){return a+b},0),w=480,x=40,s='<svg viewBox="0 0 560 110" role="img" aria-label="A bar divided in the ratio '+parts.join(' to ')+'"><rect width="560" height="110" fill="#faf8fe"/>';parts.forEach(function(p,i){for(var k=0;k<p;k++){s+='<rect x="'+x+'" y="20" width="'+(w/sum)+'" height="40" fill="'+cols[i]+'" stroke="#fff" stroke-width="2"/>';x+=w/sum}});s+='<text x="40" y="88" font-size="15" fill="#3d2a73">'+sum+' equal parts. Each part = '+(total?'$'+total.toLocaleString('en-JM')+' ÷ '+sum+' = $'+(total/sum).toLocaleString('en-JM'):'1 share')+'</text>';return s+'</svg>'};

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Number Theory and Computation',strand:'Number Theory and Computation',standard:'Module 1, Number Theory and Computation: demonstrate computational skills; appreciate the need for numeracy in everyday life; develop the ability to use patterns, trends and investigative skills.',

 glossary:[['Ratio','A comparison of two or more quantities, written a : b.'],['Simplest form','A ratio whose parts have no common factor except 1.'],['Rate','A comparison of two different kinds of quantity, such as km per hour or dollars per kilogram.'],['Unit price','The cost of one unit, such as the price per 100 g.'],['Proportion','Two quantities are in proportion if they increase or decrease at the same rate.'],['24-hour clock','A way of writing times from 00:00 (midnight) to 23:59, with no a.m. or p.m.'],['Sequence','A list of numbers that follows a rule.'],['Term','One number in a sequence.'],['Common difference','The amount added each time in an arithmetic (linear) sequence.'],['nth term','A rule that gives any term of a sequence from its position n.']],

 steps:[

     init:function(box,api){var r=box.querySelector('#msN'),seen={};api.nudges(r);function draw(){var n=+r.value;seen[n]=1;box.querySelector('.msO').textContent=n;box.querySelector('.msSvg').innerHTML=STICKS(n);box.querySelector('.msT tbody').innerHTML=Object.keys(seen).map(Number).sort(function(a,b){return a-b}).map(function(k){return'<tr><td>'+k+'</td><td>'+(3*k+1)+'</td></tr>'}).join('')}r.addEventListener('input',draw);var T=[{t:'How many matchsticks are needed for 10 squares?',ok:function(v){return+v===31},hint:'Each extra square adds 3 matchsticks. Keep going from 8 squares (25 sticks).'},{t:'Write the rule for n squares. (Use n, for example 2n + 5.)',ok:function(v){var t=String(v).toLowerCase().replace(/\s|×|\*/g,'');return t==='3n+1'||t==='1+3n'},hint:'The number of matchsticks goes up by 3 each time, so the rule starts with 3n. What do you add?'},{t:'How many squares can you make with 61 matchsticks?',ok:function(v){return+v===20},hint:'Solve 3n + 1 = 61.'}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.msNum').textContent='All done';box.querySelector('.msTask').textContent='You completed every challenge!';box.querySelector('.msC').disabled=true;return}box.querySelector('.msNum').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.msTask').textContent=T[k].t}box.querySelector('.msC').onclick=function(){var v=box.querySelector('.msA').value,fb=box.querySelector('.msFb');if(T[k].ok(v)){fb.className='fb ok msFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.msA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no msFb';fb.textContent='Not yet. '+T[k].hint}};draw();task()}}]},
  {phase:'explain',name:'Teach: ratio and proportion',title:'Learn: ratio, sharing, rates and proportion',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Add up di part dem first, den share.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Ratio and simplest form',explain:'<p>A {{ratio|a comparison of two or more quantities, written a : b}} compares quantities. If a class has 12 boys and 18 girls, the ratio of boys to girls is 12 : 18.</p><p>Simplify a ratio like a fraction: divide every part by the HCF. 12 : 18 = 2 : 3.</p><p>Before writing a ratio, make sure both quantities are in the <strong>same units</strong>.</p>',
     example:{q:'Write 50 cm : 2 m in its simplest form.',steps:[{do:'Change to the same units: 2 m = 200 cm.',why:'You can only compare like with like.'},{do:'The ratio is 50 : 200.'},{do:'Divide both parts by 50: 1 : 4.'}]},
     mistake:'Simplifying before changing to the same units: 50 : 2 = 25 : 1 is wrong, because one part is in cm and the other in m.',
     check:{q:'Simplify 24 : 36.',o:['2 : 3','4 : 6','12 : 18'],a:0,why:'Divide both by 12, the HCF.',hint:'Divide both parts by the HCF.'}},
    {title:'Dividing a quantity in a ratio',explain:'<p>To share an amount in a ratio:</p><p><strong>1.</strong> Add the parts to find the total number of equal shares. <strong>2.</strong> Divide the amount by that total to find one share. <strong>3.</strong> Multiply one share by each part.</p><p>This works for three parts too, such as 1 : 2 : 3.</p>',visual:RATIOBAR([2,3],5000,['#2f5fc4','#ffb02e']),
     example:{q:'Share the $5,000 profit in the ratio 2 : 3 (the opening puzzle).',steps:[{do:'Total parts: 2 + 3 = 5.',why:'The ratio means 5 equal shares altogether.'},{do:'One share: $5,000 ÷ 5 = $1,000.'},{do:'Cousin 1: 2 × $1,000 = $2,000. Cousin 2: 3 × $1,000 = $3,000.'},{do:'Check: $2,000 + $3,000 = $5,000 ✓. Was your prediction right?'}]},
     mistake:'Treating 2 : 3 as "2/3 and 1/3". The parts are 2 out of 5 and 3 out of 5.',
     check:{q:'Share $12,000 in the ratio 1 : 2 : 3. What is the largest share?',o:['$4,000','$6,000','$8,000'],a:1,why:'6 parts, so each is $2,000; the largest is 3 × $2,000 = $6,000.',hint:'Add the parts first: 1 + 2 + 3.'}},
    {title:'Rates, proportion and best buys',explain:'<p>A {{rate|a comparison of two different kinds of quantity}} compares two different kinds of quantity, such as km per hour or dollars per kilogram.</p><p>Two quantities are in {{proportion|they increase or decrease at the same rate}} if they change at the same rate: double one and the other doubles. Use the <strong>unitary method</strong>: find the value for 1, then multiply.</p><p>To find the <strong>best buy</strong>, compare {{unit prices|the cost of one unit, such as per 100 g}}: the price for the same amount of each product.</p>',
     example:{q:'Rice: 500 g for $350, or 750 g for $480. Which is the better buy?',steps:[{do:'Find the price per 100 g for each pack.',why:'Comparing the same amount makes it fair.'},{do:'500 g: $350 ÷ 5 = $70 per 100 g.'},{do:'750 g: $480 ÷ 7.5 = $64 per 100 g.'},{do:'The 750 g pack is the better buy, because each 100 g costs less.'}]},
     mistake:'Choosing the cheaper pack or the bigger pack without comparing unit prices.',
     check:{q:'A car travels 150 km in 2 hours. What is its average speed?',o:['75 km/h','300 km/h','152 km/h'],a:0,why:'150 ÷ 2 = 75 km per hour.',hint:'Speed = distance ÷ time.'}}]}]},
  {phase:'explain',name:'Teach: units and sequences',title:'Learn: converting units, the 24-hour clock and sequences',lead:'Next, converting between units, and finding rules for number patterns.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Find di difference, an yuh find di rule.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Converting units and the 24-hour clock',explain:'<p>To convert units, use the link between them: to a smaller unit, multiply; to a bigger unit, divide. For time, remember 60 seconds = 1 minute, 60 minutes = 1 hour.</p><p>The {{24-hour clock|times written from 00:00 to 23:59, with no a.m. or p.m.}} counts hours from 00:00 (midnight) to 23:59. For p.m. times, <strong>add 12</strong> to the hour: 3:45 p.m. = 15:45. To change back, subtract 12.</p>',
     example:{q:'Change 2.75 hours to hours and minutes, and write 8:20 p.m. in 24-hour time.',steps:[{do:'2.75 hours = 2 hours + 0.75 hours.'},{do:'0.75 × 60 = 45 minutes, so 2.75 hours = 2 hours 45 minutes.',why:'Do not read 0.75 hours as 75 minutes.'},{do:'8:20 p.m. is after noon, so add 12 to the hour: 20:20.'}]},
     mistake:'Reading 2.75 hours as 2 hours 75 minutes, or reading 15:45 as 5:45 p.m. (subtract 12, not 10: it is 3:45 p.m.).',
     check:{q:'What is 17:30 in 12-hour time?',o:['7:30 p.m.','5:30 p.m.','5:30 a.m.'],a:1,why:'17 − 12 = 5, so 5:30 p.m.',hint:'Subtract 12 from the hour.'}},
    {title:'Finding terms of a sequence',explain:'<p>A {{sequence|a list of numbers that follows a rule}} is a list of numbers that follow a rule. Each number is a {{term|one number in a sequence}}.</p><p>A <strong>term-to-term rule</strong> says how to get from one term to the next, such as "add 4". A <strong>position-to-term rule</strong> (the {{nth term|a rule giving any term from its position n}}) gives any term from its position n, such as 4n + 3.</p><p>The nth term lets you jump straight to the 50th term without listing the first 49.</p>',
     example:{q:'A sequence has nth term 4n + 3. Find the first three terms and the 50th term.',steps:[{do:'n = 1: 4 × 1 + 3 = 7.'},{do:'n = 2: 11. n = 3: 15. So the sequence starts 7, 11, 15, …'},{do:'n = 50: 4 × 50 + 3 = 203.',why:'Substitute the position into the rule.'}]},
     mistake:'Substituting the previous term instead of the position. In 4n + 3, n is the term NUMBER (1st, 2nd, 3rd), not the term before.',
     check:{q:'The nth term of a sequence is 2n − 1. What is the 10th term?',o:['19','21','9'],a:0,why:'2 × 10 − 1 = 19.',hint:'Put n = 10 into the rule.'}},
    {title:'Finding the rule from the terms',explain:'<p>For a {{linear sequence|a sequence that goes up or down by the same amount each time}}, the difference between terms is always the same: the <strong>common difference</strong> d.</p><p>The nth term is <strong>dn + c</strong>. To find c, work out what to add to d × 1 to get the first term.</p><p>Not every sequence is linear: 1, 4, 9, 16, … are the square numbers, n².</p>',visual:STICKS(4),
     example:{q:'Find the nth term of 5, 8, 11, 14, …',steps:[{do:'The common difference is 3, so the rule starts 3n.',why:'The sequence goes up by 3 each time, like the 3 times table.'},{do:'Compare with the 3 times table: 3, 6, 9, 12. Each term is 2 more.'},{do:'So the nth term is 3n + 2.'},{do:'Check: n = 4: 3 × 4 + 2 = 14 ✓'}]},
     mistake:'Writing n + 3 because the sequence goes up by 3. The difference goes in FRONT of n: 3n.',
     check:{q:'What is the nth term of 6, 10, 14, 18, …?',o:['n + 4','4n + 2','4n + 6'],a:1,why:'The difference is 4, and 4 × 1 + 2 = 6.',hint:'The common difference goes in front of n.'}}]},{type:'recall',text:'The profit is shared as $2,000 and $3,000: there are 5 equal parts of $1,000 each.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Ratio',text:'Same units first, then divide by the HCF. To share: add the parts, divide to find one share, multiply.'},{title:'Rates and best buys',text:'Speed = distance ÷ time. Unitary method: find the value for 1, then multiply. Compare unit prices for best buys.'},{title:'Time',text:'0.5 h = 30 min; 0.25 h = 15 min; 0.75 h = 45 min. p.m. to 24-hour: add 12 to the hour.'},{title:'Sequences',text:'Linear: nth term = dn + c, where d is the common difference. For example, 5, 8, 11, … has nth term 3n + 2.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Share $12,000 in the ratio 1 : 2 : 3.',steps:[{do:'Total parts: 1 + 2 + 3 = 6.'},{do:'One share: $12,000 ÷ 6 = $2,000.'},{do:'Shares: $2,000, $4,000 and $6,000.'}]},
     {type:'fill',q:'Juice: 1 L for $260 or 1.5 L for $360. Which is the better buy?',steps:[{text:'1 L pack: $260 per litre.'},{text:'1.5 L pack: $360 ÷ 1.5 = $___ per litre',blank:true,a:240,hint:'360 ÷ 1.5.'},{text:'So the 1.5 L pack is the better buy.'}],sol:'$360 ÷ 1.5 = $240 per litre, which is less than $260.'},
     {type:'own',q:'Write 15:45 in 12-hour time. (Type it like 3:45 pm.)',a:['3:45pm','3:45p.m.','3.45pm','3:45 pm'],hint:'Subtract 12 from the hour.',sol:'15 − 12 = 3, so 3:45 p.m.'},
     {type:'own',q:'Find the 20th term of 5, 8, 11, 14, …',a:62,hint:'The nth term is 3n + 2.',sol:'3 × 20 + 2 = 62.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🃏',title:'Match the times',desc:'Match each 24-hour time to its 12-hour time.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['00:15','12:15 a.m.'],['09:30','9:30 a.m.'],['12:00','12:00 noon'],['13:05','1:05 p.m.'],['18:45','6:45 p.m.'],['23:10','11:10 p.m.']]}},
    {icon:'🛒',title:'Best buy',desc:'Order the packs from best value to worst.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the price per 100 g (or per 100 mL), then tap them from cheapest per 100 to dearest.',rounds:[[{label:'Flour: 2 kg for $560',v:28,show:'$28 per 100 g'},{label:'Flour: 500 g for $160',v:32,show:'$32 per 100 g'},{label:'Flour: 1 kg for $250',v:25,show:'$25 per 100 g'},{label:'Flour: 5 kg for $1,500',v:30,show:'$30 per 100 g'}],[{label:'Juice: 250 mL for $90',v:36,show:'$36 per 100 mL'},{label:'Juice: 1 L for $300',v:30,show:'$30 per 100 mL'},{label:'Juice: 2 L for $640',v:32,show:'$32 per 100 mL'},{label:'Juice: 500 mL for $175',v:35,show:'$35 per 100 mL'}]]}},
    {icon:'🗂️',title:'Linear or not?',desc:'Sort sequences by whether they go up by the same amount each time.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Find the differences between neighbouring terms. Are they all the same?',bins:[{id:'l',label:'Linear (same difference)'},{id:'n',label:'Not linear'}],items:[{label:'4, 9, 14, 19, …',bin:'l'},{label:'1, 4, 9, 16, …',bin:'n'},{label:'20, 17, 14, 11, …',bin:'l'},{label:'2, 4, 8, 16, …',bin:'n'},{label:'0.5, 1, 1.5, 2, …',bin:'l'},{label:'1, 1, 2, 3, 5, …',bin:'n'}]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The bigger pack is the better buy.',a:'sometimes',why:'Often true, but not always: you must compare unit prices.',hint:'Look back at the Best buy challenge.'},{s:'In the ratio 2 : 3, the first share is 2/3 of the total.',a:'never',why:'It is 2/5 of the total, because there are 5 parts.'},{s:'A linear sequence has the same difference between every pair of neighbouring terms.',a:'always',why:'That is what makes it linear.'},{s:'Doubling the time at the same speed doubles the distance.',a:'always',why:'Distance and time are in direct proportion when the speed stays the same.'},{s:'To write a p.m. time in the 24-hour clock, you add 12 to the hour.',a:'sometimes',why:'It works for 1 p.m. to 11 p.m. (3:45 p.m. = 15:45), but 12:30 p.m. stays 12:30, not 24:30.',hint:'Think about 12:30 p.m.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jordan',q:'Share $900 in the ratio 1 : 2.',lines:['1 : 2 means one person gets 1/2','$900 ÷ 2 = $450 each'],wrong:0,reasons:['There are 3 parts, so the shares are 1/3 and 2/3','The ratio should be 2 : 1','He should multiply by 2'],reason:0,fix:'3 parts of $300: $300 and $600.'},{who:'Keisha',q:'Write 18:20 in 12-hour time.',lines:['18 − 10 = 8','So it is 8:20 p.m.'],wrong:0,reasons:['She should subtract 12, not 10','She should add 12','18:20 is in the morning'],reason:0,fix:'18 − 12 = 6, so 6:20 p.m.'},{who:'Andre',q:'Find the nth term of 7, 10, 13, 16, …',lines:['The difference is 3','So the nth term is n + 3'],wrong:1,reasons:['The difference goes in front of n: 3n + 4','The difference is 7','The nth term is 7n'],reason:0,fix:'3n + 4 (check: 3 × 1 + 4 = 7 ✓).'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire ratio, time and sequence questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,5),b=R(1,5);if(a===b)b++;var k=R(1,6)*100,T=(a+b)*k;return{q:'Share $'+T.toLocaleString('en-JM')+' in the ratio '+a+' : '+b+'. The first share is…',o:['$'+(a*k).toLocaleString('en-JM'),'$'+(b*k).toLocaleString('en-JM'),'$'+(T/2).toLocaleString('en-JM')],a:0,why:(a+b)+' parts of $'+k+'.'}}if(r===1){var h=R(13,23),m=[0,15,30,45][R(0,3)],mm=m<10?'0'+m:m;return{q:'Write '+h+':'+mm+' in 12-hour time.',o:[(h-12)+':'+mm+' p.m.',(h-10)+':'+mm+' p.m.',(h-12)+':'+mm+' a.m.'],a:0,why:'Subtract 12 from the hour.'}}var d=R(2,7),c=R(-3,6),n=R(8,20);return{q:'The nth term is '+d+'n '+(c<0?'− '+(-c):'+ '+c)+'. What is term '+n+'?',o:[String(d*n+c),String(d*(n-1)+c),String(d+n+c)],a:0,why:d+' × '+n+(c<0?' − '+(-c):' + '+c)+' = '+(d*n+c)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent ratios and sequences that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a ratio that simplifies to 3 : 4 but uses numbers bigger than 20. (For example: a : b)',placeholder:'a : b',check:function(v){var n=String(v).split(':').map(Number);if(n.length!==2||n.some(isNaN))return{ok:false,msg:'Type it like 30 : 40.'};if(n[0]<=20||n[1]<=20)return{ok:false,msg:'Both numbers must be bigger than 20.'};return n[0]*4===n[1]*3?{ok:true,msg:'Yes! '+n[0]+' : '+n[1]+' simplifies to 3 : 4.'}:{ok:false,msg:'That does not simplify to 3 : 4. Multiply 3 and 4 by the same number.'}}},{q:'Type the first four terms of a linear sequence with a common difference of −5. (For example: a, b, c, d)',placeholder:'a, b, c, d',check:function(v){var n=String(v).replace(/−/g,'-').split(',').map(Number);if(n.length!==4||n.some(isNaN))return{ok:false,msg:'Type four numbers separated by commas.'};return n[1]-n[0]===-5&&n[2]-n[1]===-5&&n[3]-n[2]===-5?{ok:true,msg:'Correct! Each term is 5 less than the one before.'}:{ok:false,msg:'Each term must be exactly 5 LESS than the one before.'}}},{q:'Type the nth term of a sequence whose 1st term is 10 and which goes up by 6 each time.',placeholder:'e.g. …n + …',check:function(v){var t=String(v).toLowerCase().replace(/\s|×|\*/g,'');return t==='6n+4'||t==='4+6n'?{ok:true,msg:'Yes! 6n + 4 gives 10, 16, 22, …'}:{ok:false,msg:'The difference is 6, so start with 6n. What do you add to 6 × 1 to get 10?'}}}]}},
    {icon:'🍲',title:'Mission: rice and peas for the harvest',desc:'Scale a family recipe to cook for a church harvest lunch.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Grandma\'s rice and peas recipe serves 6 people. It uses 2 cups of rice, 1 cup of red peas and 400 mL of coconut milk. The church harvest lunch needs enough for 30 people.',parts:[{q:'By what number must every ingredient be multiplied?',a:5,hint:'30 ÷ 6.',sol:'30 ÷ 6 = 5.'},{q:'How many cups of rice are needed?',a:10,hint:'2 × 5.',sol:'10 cups.'},{q:'How much coconut milk is needed, in litres?',a:2,tol:0.0001,hint:'400 mL × 5 = 2,000 mL. Then change to litres.',sol:'2,000 mL = 2 L.',placeholder:'litres'},{q:'Cooking starts at 10:45 and takes 1 hour 35 minutes. At what time (24-hour clock) is it ready? Type it like 12:20.',a:['12:20'],hint:'10:45 + 1 h = 11:45. Then add 35 minutes.',sol:'11:45 + 35 min = 12:20.'},{q:'The 30 servings are shared between two tables in the ratio 2 : 3. How many servings go to the larger table?',a:18,hint:'5 parts of 6.',sol:'30 ÷ 5 = 6, so 3 × 6 = 18 servings.'}],done:'You used proportion, unit conversion, the 24-hour clock and ratio to plan a real meal.'}}
