var VG=function(A,B,o){o=o||{};var S=26,O=170,X=function(x){return O+S*x},Y=function(y){return O-S*y},s='<svg viewBox="0 0 340 340" role="img" aria-label="'+(o.label||'A grid with vectors')+'"><defs><marker id="va" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#c02d5f"/></marker><marker id="vb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f5fc4"/></marker></defs><rect width="340" height="340" fill="#faf8fe"/>';for(var i=-6;i<=6;i++){s+='<line x1="'+X(i)+'" y1="'+Y(-6)+'" x2="'+X(i)+'" y2="'+Y(6)+'" stroke="#e6dff4"/><line x1="'+X(-6)+'" y1="'+Y(i)+'" x2="'+X(6)+'" y2="'+Y(i)+'" stroke="#e6dff4"/>'}s+='<line x1="'+X(-6)+'" y1="'+O+'" x2="'+X(6)+'" y2="'+O+'" stroke="#3d2a73" stroke-width="1.5"/><line x1="'+O+'" y1="'+Y(-6)+'" x2="'+O+'" y2="'+Y(6)+'" stroke="#3d2a73" stroke-width="1.5"/><text x="'+(O-12)+'" y="'+(O+14)+'" font-size="12" font-weight="700" fill="#3d2a73">O</text>';if(o.pos){s+='<line x1="'+O+'" y1="'+O+'" x2="'+X(A[0])+'" y2="'+Y(A[1])+'" stroke="#2f5fc4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vb)"/><line x1="'+O+'" y1="'+O+'" x2="'+X(B[0])+'" y2="'+Y(B[1])+'" stroke="#2f5fc4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vb)"/>'}if(o.tri)s+='<path d="M'+X(A[0])+' '+Y(A[1])+' H'+X(B[0])+' V'+Y(B[1])+'" fill="none" stroke="#a85d00" stroke-width="2.5" stroke-dasharray="4 3"/><text x="'+((X(A[0])+X(B[0]))/2)+'" y="'+(Y(A[1])+(B[1]>=A[1]?16:-6))+'" text-anchor="middle" font-size="11" fill="#7a4300">'+fv(B[0]-A[0])+' across</text><text x="'+(X(B[0])+5)+'" y="'+((Y(A[1])+Y(B[1]))/2)+'" font-size="11" fill="#7a4300">'+fv(B[1]-A[1])+' up</text>';s+='<line x1="'+X(A[0])+'" y1="'+Y(A[1])+'" x2="'+X(B[0])+'" y2="'+Y(B[1])+'" stroke="#c02d5f" stroke-width="3.5" marker-end="url(#va)"/><circle cx="'+X(A[0])+'" cy="'+Y(A[1])+'" r="5" fill="#3d2a73"/><circle cx="'+X(B[0])+'" cy="'+Y(B[1])+'" r="5" fill="#3d2a73"/><text x="'+(X(A[0])-14)+'" y="'+(Y(A[1])-6)+'" font-size="13" font-weight="700" fill="#3d2a73">A</text><text x="'+(X(B[0])+6)+'" y="'+(Y(B[1])-6)+'" font-size="13" font-weight="700" fill="#3d2a73">B</text>';return s+'</svg>'};

   blocks:[{type:'mcq',star:true,questions:[{q:'A triangle has shorter sides 3 and 4. Hypotenuse?',o:['5','7','25'],a:0,why:'√(9 + 16) = 5.',teach:'Pythagoras: c² = 3² + 4² = 9 + 16 = 25, so c = 5.'},{q:'A translation vector has top 2 and bottom −3. It moves a point…',o:['2 right and 3 down','2 up and 3 left','3 right and 2 down'],a:0,why:'Top = across, bottom = up/down.',teach:'In a column vector, the top number is across (+ right) and the bottom is up (+) or down (−).'},{q:'What is 6 − (−2)?',o:['8','4','−8'],a:0,why:'Subtracting a negative adds.',teach:'6 − (−2) = 6 + 2 = 8.'},{q:'1/3 of 12 is…',o:['4','3','36'],a:0,why:'12 ÷ 3 = 4.',teach:'To find a third, divide by 3: 12 ÷ 3 = 4.'}]}]},
  {phase:'explore',name:'Vector grid',title:'Explore: the vector grid',lead:'Move the points A and B. The grid shows the position vectors OA and OB (dashed), the vector AB (red), its right-angled triangle, and its length.',
   mission:['Move A and B around. Watch how AB is related to OA and OB.','Compare the triangle’s sides with the length of AB.','Complete all 3 challenges for a star. Type column vectors as across, up, like 3, 4.'],
   patois:'Across, den up. Pythagoras gi yuh di length.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><span>A:</span><label for="vgAx">x</label><input type="range" id="vgAx" min="-6" max="6" value="1"><label for="vgAy">y</label><input type="range" id="vgAy" min="-6" max="6" value="2"></div><div class="controls"><span>B:</span><label for="vgBx">x</label><input type="range" id="vgBx" min="-6" max="6" value="4"><label for="vgBy">y</label><input type="range" id="vgBy" min="-6" max="6" value="6"></div><div class="scene vgSvg"></div><div class="tile vgOut" aria-live="polite" style="line-height:2.4"></div><div class="tile"><p style="margin:0"><span class="badge vgN"></span> <strong class="vgQ"></strong></p><div class="controls"><input type="text" class="vgA" aria-label="Your answer" placeholder="answer"><button type="button" class="go vgC">Check</button></div><div class="fb vgFb" aria-live="polite">Use the grid to help you.</div></div>',
     init:function(box,api){var g=function(id){return+box.querySelector(id).value};function draw(){var A=[g('#vgAx'),g('#vgAy')],B=[g('#vgBx'),g('#vgBy')];var dx=B[0]-A[0],dy=B[1]-A[1],len=Math.sqrt(dx*dx+dy*dy);box.querySelector('.vgSvg').innerHTML=VG(A,B,{pos:true,tri:true,label:'A at ('+A[0]+', '+A[1]+') and B at ('+B[0]+', '+B[1]+') with vector AB'});box.querySelector('.vgOut').innerHTML='OA = '+CV(A[0],A[1])+'  OB = '+CV(B[0],B[1])+'<br><strong>AB = OB − OA</strong> = '+CV(dx,dy)+'  (move '+fv(dx)+' across and '+fv(dy)+' up)<br><strong>|AB|</strong> = √('+fv(dx)+'² + '+fv(dy)+'²) = √'+(dx*dx+dy*dy)+' ≈ <strong>'+(Math.round(len*100)/100)+'</strong><br>Reverse: <strong>BA = −AB</strong> = '+CV(-dx,-dy)}['#vgAx','#vgAy','#vgBx','#vgBy'].forEach(function(id){box.querySelector(id).addEventListener('input',draw)});function pv(v){var m=String(v).replace(/−/g,'-').replace(/[()\[\]\s]/g,'').match(/^(-?[\d.]+),(-?[\d.]+)$/);return m?[+m[1],+m[2]]:null}var T=[{t:'With A(1, 2) and B(4, 6), what is the column vector AB? (Type across, up.)',ok:function(v){var p=pv(v);return p&&p[0]===3&&p[1]===4}},{t:'What is the length |AB| for A(1, 2) and B(4, 6)?',ok:function(v){return parseFloat(v)===5}},{t:'What is the reverse vector BA? (Type across, up.)',ok:function(v){var p=pv(v);return p&&p[0]===-3&&p[1]===-4}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.vgN').textContent='All done';box.querySelector('.vgQ').textContent='You completed every challenge!';box.querySelector('.vgC').disabled=true;return}box.querySelector('.vgN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.vgQ').textContent=T[q].t}box.querySelector('.vgC').onclick=function(){var v=String(box.querySelector('.vgA').value).trim(),fb=box.querySelector('.vgFb');if(T[q].ok(v)){fb.className='fb ok vgFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.vgA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no vgFb';fb.textContent='Not yet. Set A to (1, 2) and B to (4, 6), then read the results.'}};draw();task()}},
    {type:'recall',text:'The boat is 5 km from Port Royal, not 7. Its journey is the vector with 3 across and 4 up, and Pythagoras gives √(3² + 4²) = 5.'}]},
  {phase:'explain',name:'Teach: vectors and their length',title:'Learn: vectors, column form, position vectors and length',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Vector have size AN direction.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What a vector is, in column form',explain:'<p>“The shop is 2 km away” does not tell you how to get there. “The shop is 2 km north” does. A {{vector|a quantity with both size and direction}} has both a <strong>size</strong> and a <strong>direction</strong>.</p><p>On a grid, any movement can be broken into two parts: how far <strong>across</strong> (horizontal) and how far <strong>up</strong> (vertical). A vector is the total of these two {{displacements|changes of position}}. The boat’s journey is 3 across (east) and 4 up (north).</p><p>We write vectors in {{column form|top number across, bottom number up}}: the <strong>top</strong> number is across (right is +, left is −) and the <strong>bottom</strong> number is up (up is +, down is −). So the boat’s journey is '+CV(3,4)+'. You met this in Grade 8 with translation vectors; it is the same idea.</p>',
     example:{q:'A drone flies 5 units left and 2 units up. Write its displacement as a column vector.',steps:[{do:'Across: 5 left, so −5 (top).'},{do:'Up: 2 up, so 2 (bottom).'},{do:'The vector has top −5 and bottom 2.'}]},
     mistake:'Writing the column upside down. The across part ALWAYS goes on top.',
     check:{q:'Which column vector means 4 right and 1 down?',o:['top 4, bottom −1','top −1, bottom 4','top 4, bottom 1'],a:0,why:'Across (4) on top; down 1 is −1 at the bottom.',hint:'Top = across.'}},
    {title:'Position vectors and relative position vectors',explain:'<p>A {{position vector|the vector from the origin O to a point}} tells you where a point is, starting from the origin O. If A is the point (1, 2), its position vector is OA = '+CV(1,2)+': simply its coordinates written as a column. We often call it <strong>a</strong>.</p><p>A {{relative position vector|the vector from one point to another}} tells you how to get from one point to another. To go from A to B, you could go back from A to O, then from O to B. That gives the key rule:</p><p><strong>AB = OB − OA</strong>, or <strong>b − a</strong></p><p>In other words: “where you end up, minus where you start.” For A(1, 2) and B(4, 6): AB = '+CV(4,6)+' − '+CV(1,2)+' = '+CV(3,4)+'.</p>',visual:VG([1,2],[4,6],{pos:true,label:'Position vectors OA and OB, and the vector AB from A to B'}),
     example:{q:'P is (−2, 3) and Q is (4, −1). Find PQ.',steps:[{do:'OP has top −2 and bottom 3; OQ has top 4 and bottom −1.'},{do:'PQ = OQ − OP: top 4 − (−2) = 6; bottom −1 − 3 = −4.'},{do:'PQ has top 6 and bottom −4.'}]},
     mistake:'Subtracting the wrong way round: AB = OB − OA (end minus start), not OA − OB.',
     check:{q:'A is (2, 1) and B is (5, 7). What is AB?',o:['top 3, bottom 6','top −3, bottom −6','top 7, bottom 8'],a:0,why:'5 − 2 = 3 and 7 − 1 = 6.',hint:'End minus start.'}},
    {title:'Length of a vector, and the reverse vector',explain:'<p>Every vector can be drawn as the long side of a <strong>right-angled triangle</strong>: the across part is one short side, and the up part is the other. That means you can find the vector’s length, its {{magnitude|the length of a vector}}, with Pythagoras’ theorem:</p><p><strong>|vector| = √(across² + up²)</strong></p><p>For the boat: √(3² + 4²) = √25 = 5 km. That is why the boat is 5 km away, not 3 + 4 = 7 km.</p><p>The {{reverse vector|the vector pointing the opposite way}} goes the opposite way. BA takes you back from B to A, so it is <strong>BA = −AB</strong>: multiply both numbers by −1. If AB = '+CV(3,4)+', then BA = '+CV(-3,-4)+'. It has the same length, but the opposite direction.</p>',visual:VG([0,0],[3,4],{tri:true,label:'The vector 3 across and 4 up drawn as the hypotenuse of a right-angled triangle'}),
     example:{q:'Find the length of the vector with top 5 and bottom −12, and write its reverse.',steps:[{do:'Length = √(5² + (−12)²) = √(25 + 144) = √169 = 13.',why:'Squaring removes the minus sign.'},{do:'Reverse: multiply by −1: top −5, bottom 12.'}]},
     mistake:'Adding the components to find the length. The length is √(x² + y²), not x + y.',
     check:{q:'What is the length of the vector with top 6 and bottom 8?',o:['10','14','100'],a:0,why:'√(36 + 64) = 10.',hint:'Pythagoras.'}}]}]},
  {phase:'explain',name:'Teach: combining vectors',title:'Learn: adding vectors, ratios and polygons',lead:'Next, combining vectors to solve geometry problems.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Follow di path: AB plus BC give yuh AC.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Adding vectors: following a path',explain:'<p>Think about a taxi journey: from Half Way Tree to Cross Roads, then from Cross Roads to Downtown. Altogether, you have gone from Half Way Tree to Downtown. Vectors work the same way:</p><p><strong>AB + BC = AC</strong></p><p>This is sometimes called the triangle rule: travelling along two sides of a triangle gets you to the same place as the third side.</p><p>With column vectors, just add the top numbers and add the bottom numbers. And you can use the rule to find any vector by following a path made of vectors you already know. For example, AB = AO + OB = −a + b, which is the same as b − a, the rule you already learned.</p>',
     example:{q:'AB has top 2 and bottom 5; BC has top 3 and bottom −1. Find AC.',steps:[{do:'AC = AB + BC.'},{do:'Top: 2 + 3 = 5. Bottom: 5 + (−1) = 4.'},{do:'AC has top 5 and bottom 4.'}]},
     mistake:'Adding vectors that do not join up. In AB + BC, the first vector must END where the second one STARTS.',
     check:{q:'PQ has top 1, bottom 4; QR has top −3, bottom 2. What is PR?',o:['top −2, bottom 6','top 4, bottom 2','top −3, bottom 8'],a:0,why:'1 + (−3) = −2 and 4 + 2 = 6.',hint:'Add tops, add bottoms.'}},
    {title:'Dividing a line in a ratio',explain:'<p>Points are {{collinear|lying on the same straight line}} when they lie on the same straight line. Suppose M lies on the line AB, and divides it in the ratio <strong>AM : MB = 1 : 2</strong>. How do we find AM?</p><p>Think about the parts. The ratio 1 : 2 has 1 + 2 = <strong>3 parts</strong> altogether, and AM is 1 of them. So AM is <strong>1/3</strong> of the whole of AB: <strong>AM = ⅓ AB</strong>.</p><p>In general, if AM : MB = m : n, then <strong>AM = m/(m + n) × AB</strong>. Then the position vector of M is OM = OA + AM. A special case: the midpoint divides AB in the ratio 1 : 1, so AM = ½ AB.</p>',
     example:{q:'A is (1, 1) and B is (7, 4). M divides AB in the ratio 1 : 2. Find OM.',steps:[{do:'AB = OB − OA: top 6, bottom 3.'},{do:'AM = ⅓ AB: top 2, bottom 1.',why:'1 part out of 3.'},{do:'OM = OA + AM: top 1 + 2 = 3, bottom 1 + 1 = 2. So M is (3, 2).'}]},
     mistake:'Using 1/2 for a ratio of 1 : 2. The ratio 1 : 2 has 3 parts, so AM is 1/3 of AB.',
     check:{q:'M divides AB in the ratio 3 : 1. AM is what fraction of AB?',o:['3/4','3/1','1/4'],a:0,why:'3 parts out of 4.',hint:'Add the parts of the ratio.'}},
    {title:'Using polygons: equal and parallel vectors',explain:'<p>Two vectors are <strong>equal</strong> if they have the same length AND the same direction, even if they are in different places. Two vectors are {{parallel|pointing in the same or opposite direction}} if one is a multiple of the other, like a and 2a.</p><p>Polygons give us equal and parallel vectors for free. In a <strong>parallelogram</strong> OABC, opposite sides are equal and parallel. So if OA = <strong>a</strong> and OC = <strong>c</strong>, then CB = <strong>a</strong> too, and AB = <strong>c</strong> too.</p><p>That lets you find vectors that are not drawn directly. For example, OB = OA + AB = <strong>a + c</strong> (the diagonal), and AC = AO + OC = <strong>−a + c</strong> (the other diagonal).</p>',visual:PARA,
     example:{q:'In parallelogram OABC, OA = a and OC = c. M is the midpoint of AB. Find OM.',steps:[{do:'AB = OC = c (opposite sides are equal and parallel).'},{do:'AM = ½ AB = ½c.'},{do:'OM = OA + AM = a + ½c.'}]},
     mistake:'Getting the direction wrong. CB = a (same direction as OA), but BC = −a (the opposite direction).',
     check:{q:'In parallelogram OABC with OA = a and OC = c, what is CB?',o:['a','c','−a'],a:0,why:'CB is opposite and parallel to OA, in the same direction.',hint:'Opposite sides are equal.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Type column vectors as across, up.',
