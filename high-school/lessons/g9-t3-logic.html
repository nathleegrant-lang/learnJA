  {phase:'engage',name:'The three sisters',title:'How old is each sister?',lead:'Rihanna, Tamara and Miley are sisters, aged 9, 12 and 14, but we do not know who is which. Clue 1: Tamara’s age is not in the 4 times table. Clue 2: Miley’s age can be divided exactly by the number of days in a week.',

     init:function(box,api){var A=box.querySelector('#tbA'),B=box.querySelector('#tbB');Object.keys(EXPR).forEach(function(k){[A,B].forEach(function(s){var o=document.createElement('option');o.value=k;o.textContent=EXPR[k][0];s.appendChild(o)})});A.value='nand';B.value='dm';function draw(){box.querySelector('.tbOut').innerHTML=TT([A.value,B.value]);var same=[[1,1],[1,0],[0,1],[0,0]].every(function(r){return EXPR[A.value][1](!!r[0],!!r[1])===EXPR[B.value][1](!!r[0],!!r[1])});box.querySelector('.tbX').innerHTML=A.value===B.value?'Choose two different propositions to compare.':same?'The two columns are identical in every row, so <strong>'+EXPR[A.value][0]+'</strong> and <strong>'+EXPR[B.value][0]+'</strong> are <strong>logically equivalent</strong>.':'The columns differ in at least one row, so they are <strong>not</strong> equivalent.'}A.onchange=draw;B.onchange=draw;var T=[{t:'How many rows of the truth table for p ∧ q are TRUE?',ok:function(v){return v==='1'}},{t:'Is p → q logically equivalent to ~p ∨ q? (Type yes or no.)',ok:function(v){return v==='yes'}},{t:'Is p → q logically equivalent to q → p? (Type yes or no.)',ok:function(v){return v==='no'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.tbN').textContent='All done';box.querySelector('.tbQ').textContent='You completed every challenge!';box.querySelector('.tbC').disabled=true;return}box.querySelector('.tbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.tbQ').textContent=T[q].t}box.querySelector('.tbC').onclick=function(){var v=String(box.querySelector('.tbAns').value).trim().toLowerCase(),fb=box.querySelector('.tbFb');if(T[q].ok(v)){fb.className='fb ok tbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.tbAns').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no tbFb';fb.textContent='Not yet. Build the table(s) and compare carefully.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: three sets and truth tables',title:'Learn: three-set problems and truth tables',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Two proposition: four row. Every combination a T an F.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Problems with three subsets',explain:'<p>In Grade 8, you solved problems with two sets. Now let’s add a third set, C, that does not overlap with the others. For example, in a school, some students play football (A), some play cricket (B), and some are in the chess club (C), which meets at the same time as sports practice, so nobody in chess plays football or cricket.</p><p>In the Venn diagram, A and B overlap, but C sits on its own. The method is the same as before: <strong>fill in the overlap first</strong>, then the “only” regions, then the separate set C, then the region outside all the circles.</p><p>Check your work by adding every region: the total must equal n(U).</p>',visual:V3,
     example:{q:'Using the diagram: how many students are in the class, and how many play at least one sport (football or cricket)?',steps:[{do:'Total: 12 + 5 + 8 + 7 + 3 = 35 students.'},{do:'At least one sport: 12 + 5 + 8 = 25.',why:'Chess students play neither sport, so C is not included.'}]},
     mistake:'Adding C into A ∪ B. Since C does not overlap with A or B, its members are not in A ∪ B.',
     check:{q:'Using the diagram, how many students play football?',o:['17','12','25'],a:0,why:'12 + 5 = 17.',hint:'Football only + both.'}},
    {title:'Truth tables for ~, ∧ and ∨',explain:'<p>In Grade 8 you met the connectives. A {{truth table|a table showing the truth value for every combination of T and F}} shows, in one neat grid, whether a compound proposition is true or false in every possible situation.</p><p>With two propositions p and q, there are exactly <strong>4 combinations</strong>: TT, TF, FT and FF. So a truth table has 4 rows. (With three propositions, it would have 8.)</p><p>The basic rules: <strong>~p</strong> flips the {{truth value|whether a proposition is true or false}}. <strong>p ∧ q</strong> is true only in the first row, where both are true. <strong>p ∨ q</strong> is true in every row except the last, where both are false.</p><p>For longer propositions, add a column for each step. For ~(p ∧ q), first fill in a p ∧ q column, then negate it.</p>',
     example:{q:'Complete the truth table for ~(p ∧ q).',steps:[{do:'p ∧ q column: T, F, F, F (true only when both are true).'},{do:'Negate each value: F, T, T, T.'},{do:'So ~(p ∧ q) is false only when both p and q are true.'}]},
     mistake:'Leaving out rows. Two propositions always need 4 rows: TT, TF, FT, FF.',
     check:{q:'In how many rows of the truth table is p ∨ q false?',o:['1','2','3'],a:0,why:'Only when both are false.',hint:'"Or" needs just one true.'}},
    {title:'Truth tables for → and ↔',explain:'<p>The conditional <strong>p → q</strong> (“if p, then q”) has a surprising truth table. Think of it as a promise: “If you finish your chores, then you can go to the party.”</p><p>When is the promise <strong>broken</strong>? Only if you finish your chores (p is true) and still cannot go (q is false). In every other case, the promise is kept, including when you do not finish your chores, because the promise said nothing about that! So <strong>p → q is false only when p is true and q is false</strong>. Its column is T, F, T, T.</p><p>The equivalence <strong>p ↔ q</strong> (“p if and only if q”) is true when p and q have the <strong>same</strong> truth value: both true or both false. Its column is T, F, F, T.</p>',
     example:{q:'p = "It rains" (false), q = "The road is wet" (true). What is the truth value of p → q?',steps:[{do:'p is false and q is true.'},{do:'p → q is only false when p is true and q is false.'},{do:'So p → q is TRUE. (The road could be wet for another reason.)'}]},
     mistake:'Thinking p → q is false whenever p is false. It is only false in ONE row: p true and q false.',
     check:{q:'When is p ↔ q true?',o:['When p and q have the same truth value','Only when both are true','When p is true'],a:0,why:'Both true or both false.',hint:'"If and only if": they match.'}}]}]},
  {phase:'explain',name:'Teach: equivalence and arguments',title:'Learn: logical equivalence, arguments and validity',lead:'Next, using truth tables to compare propositions, and reasoning carefully from given facts.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'A valid argument mean: if di premise dem true, di conclusion haffi true.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Logical equivalence',explain:'<p>Two propositions are {{logically equivalent|having exactly the same truth values in every row}} if they have <strong>exactly the same truth value in every row</strong> of a truth table. They might look different, but they always say the same thing.</p><p>Two famous examples are <strong>De Morgan’s laws</strong>: ~(p ∧ q) is equivalent to ~p ∨ ~q, and ~(p ∨ q) is equivalent to ~p ∧ ~q. In words: “It is not true that I have homework AND a test” means the same as “I do not have homework OR I do not have a test.”</p><p>Another useful one: <strong>p → q is equivalent to ~p ∨ q</strong>. But be careful: p → q is <strong>not</strong> equivalent to q → p. “If it is a mango, then it is a fruit” is true, but “If it is a fruit, then it is a mango” is not!</p>',
     example:{q:'Use a truth table to show that ~(p ∨ q) and ~p ∧ ~q are equivalent.',steps:[{do:'~(p ∨ q): p ∨ q is T, T, T, F, so ~(p ∨ q) is F, F, F, T.'},{do:'~p ∧ ~q: ~p is F, F, T, T and ~q is F, T, F, T, so ~p ∧ ~q is F, F, F, T.'},{do:'The columns match in every row, so they are logically equivalent.'}]},
     mistake:'Deciding two propositions are equivalent after checking only one or two rows. They must match in ALL rows.',
     check:{q:'Are p → q and q → p logically equivalent?',o:['No','Yes'],a:0,why:'They differ when p and q have different truth values.',hint:'Think of mangoes and fruit.'}},
    {title:'Arguments: valid argument versus true conclusion',explain:'<p>An {{argument|premises followed by a conclusion claimed to follow from them}} is a set of statements called {{premises|statements given as starting points}}, followed by a {{conclusion|the statement claimed to follow from the premises}} that is supposed to follow from them. For example:</p><p><em>Premise 1: If it rains, the match is cancelled. Premise 2: It rains. Conclusion: The match is cancelled.</em></p><p>An argument is {{valid|if the premises are true, the conclusion must be true}} when, <strong>if</strong> the premises are true, the conclusion <strong>must</strong> be true. Validity is about the <strong>structure</strong> of the reasoning, not whether the statements are actually true in real life.</p><p>That leads to an important difference. A <strong>valid argument</strong> can have a false conclusion if a premise is false (“All fish can fly; a shark is a fish; so a shark can fly” is valid but false). And an argument can reach a true conclusion by invalid reasoning. Always check the reasoning itself.</p>',
     example:{q:'Is this argument valid? "All Grade 9 students study maths. Tia is a Grade 9 student. So Tia studies maths."',steps:[{do:'If both premises are true, Tia must be in the group that studies maths.'},{do:'The conclusion must follow, so the argument is valid.'}]},
     mistake:'Judging an argument only by whether its conclusion sounds true. A true conclusion does not make the reasoning valid.',
     check:{q:'"All cats can swim. Tom is a cat. So Tom can swim." This argument is…',o:['valid (but a premise may be false)','invalid','neither'],a:0,why:'The structure is valid; whether all cats swim is a separate question.',hint:'If the premises were true, would the conclusion have to be?'}},
    {title:'Deductive reasoning and valid forms',explain:'<p>{{Deductive reasoning|reasoning from given facts to a conclusion that must follow}} means starting from facts you know and working step by step to what must follow, like a detective. The sisters puzzle is a perfect example. Clue 2 says Miley’s age divides by 7, so she must be 14. Clue 1 rules out 12 for Tamara. With 14 taken, Tamara must be 9, and Rihanna is 12.</p><p>Some argument patterns are always valid. <strong>If p → q, and p is true, then q is true</strong> (“If it rains, the match is cancelled. It rains. So the match is cancelled.”). And <strong>if p → q, and q is false, then p is false</strong> (“The match was not cancelled, so it did not rain.”).</p><p>But one common pattern is <strong>invalid</strong>: if p → q, and q is true, you <strong>cannot</strong> conclude p. “The match was cancelled” does not prove it rained; it could have been cancelled for another reason.</p>',
     example:{q:'"If a number ends in 0, it is divisible by 5. 35 is divisible by 5. So 35 ends in 0." Is this valid?',steps:[{do:'The pattern is: p → q, q is true, therefore p.'},{do:'That pattern is invalid: q can be true without p.'},{do:'Indeed, 35 is divisible by 5 but ends in 5. The argument is invalid.'}]},
     mistake:'Accepting "p → q, and q, so p". This is a classic logical mistake: q can happen for other reasons.',
     check:{q:'"If I study, I pass. I did not pass." What follows?',o:['I did not study','I studied','Nothing at all'],a:0,why:'If p → q and q is false, then p is false.',hint:'The match was not cancelled, so…'}}]},{type:'recall',text:'Tamara is 9. Miley’s age divides by 7, so Miley is 14. Tamara is not 12 (12 is in the 4 times table), so Tamara is 9, and Rihanna is 12.'}]},

   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'Truth tables',text:'4 rows for p and q: TT, TF, FT, FF. ~ flips. ∧: only TT is true. ∨: only FF is false.'},{title:'→ and ↔',text:'p → q is false ONLY when p is true and q is false (T, F, T, T). p ↔ q is true when p and q match (T, F, F, T).'},{title:'Equivalence',text:'Same truth values in every row. De Morgan: ~(p ∧ q) ≡ ~p ∨ ~q; ~(p ∨ q) ≡ ~p ∧ ~q. p → q ≡ ~p ∨ q, but not q → p.'},{title:'Arguments',text:'Valid: if the premises are true, the conclusion must be. Valid forms: p → q, p ⊢ q; p → q, ~q ⊢ ~p. Invalid: p → q, q ⊢ p.'}]},

    {icon:'🗂️',title:'Valid or invalid?',desc:'Sort each argument.',level:'⭐ Warm-up',mins:5,block:{type:'sort',tip:'If the premises were true, would the conclusion HAVE to be true?',bins:[{id:'v',label:'Valid'},{id:'i',label:'Invalid'}],items:[{label:'If it rains, the grass is wet. It rains. So the grass is wet.',bin:'v'},{label:'If it rains, the grass is wet. The grass is wet. So it rained.',bin:'i'},{label:'If it rains, the grass is wet. The grass is not wet. So it did not rain.',bin:'v'},{label:'All mangoes are fruit. This is a fruit. So it is a mango.',bin:'i'},{label:'All Grade 9 students take maths. Kemar is in Grade 9. So Kemar takes maths.',bin:'v'},{label:'Some birds cannot fly. A doctor bird is a bird. So it cannot fly.',bin:'i'}]}},
