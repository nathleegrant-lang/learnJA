0">'+ang+'° (depression)</text><text x="28" y="'+((ct+260)/2)+'" text-anchor="end" font-size="13" fill="#3d2a73">'+d+' m</text><text x="'+((cx+bx)/2)+'" y="282" text-anchor="middle" font-size="13" fill="#3d2a73">distance = ?</text><text x="'+(cx+300)+'" y="'+(ct-6)+'" text-anchor="end" font-size="11" fill="#5d5478">horizontal</text>'}return s+'</svg>'};

     init:function(box,api){var M=box.querySelector('#elM'),D=box.querySelector('#elD'),A=box.querySelector('#elA');api.nudges(D);api.nudges(A);function draw(){var m=M.value,d=+D.value,a=+A.value;box.querySelector('.elDL').textContent=m==='e'?'Distance from the building (m):':'Height of the cliff (m):';box.querySelector('.elDO').textContent=d;box.querySelector('.elAO').textContent=a+'°';box.querySelector('.elSvg').innerHTML=ELV(m,d,a);if(m==='e'){var h=d*Math.tan(a*RAD),L=Math.sqrt(d*d+h*h);box.querySelector('.elOut').innerHTML='Opposite (height) and adjacent (distance), so use <strong>tan</strong>:<br>tan '+a+'° = h ÷ '+d+', so h = '+d+' × tan '+a+'° = <strong>'+ft(h)+' m</strong><br>Line of sight (hypotenuse) by Pythagoras: √('+d+'² + '+ft(h)+'²) = '+ft(L)+' m'}else{var x=d/Math.tan(a*RAD);box.querySelector('.elOut').innerHTML='The angle of depression from the cliff top equals the angle of elevation from the boat ('+a+'°), because they are alternate angles.<br>Opposite (cliff height) and adjacent (distance), so use <strong>tan</strong>:<br>tan '+a+'° = '+d+' ÷ x, so x = '+d+' ÷ tan '+a+'° = <strong>'+ft(x)+' m</strong>'}}[M,D,A].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var Q=[{t:'Elevation: 50 m from a building, angle 30°. How tall is it, to 2 decimal places? (m)',a:28.87},{t:'Depression: from a 40 m cliff, the angle of depression to a boat is 25°. How far is the boat from the foot of the cliff, to 2 decimal places? (m)',a:85.78},{t:'For the first building, how long is the line of sight (the hypotenuse), to 2 decimal places? (m)',a:57.74}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.elN').textContent='All done';box.querySelector('.elQ').textContent='You completed every challenge!';box.querySelector('.elC').disabled=true;return}box.querySelector('.elN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.elQ').textContent=Q[q].t}box.querySelector('.elC').onclick=function(){var v=parseF   {phase:'explain',name:'Teach: Pythagoras and the ratios',title:'Learn: Pythagoras’ theorem and the trigonometric ratios',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'SOH CAH TOA. Calculator inna degree mode!',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Pythagoras’ theorem, in 2D and 3D',explain:'<p>In any right-angled triangle, <strong>c² = a² + b²</strong>, where c is the {{hypotenuse|the longest side, opposite the right angle}}, the longest side, opposite the right angle. You can use it to find any side when you know the other two: to find a shorter side, subtract: a² = c² − b².</p><p>It also works in <strong>three dimensions</strong>. To find the diagonal of a box (a cuboid) of length l, width w and height h, use Pythagoras twice: first the diagonal of the base, √(l² + w²); then the space diagonal, √(l² + w² + h²).</p><p>Pythagoras only works for <strong>right-angled</strong> triangles. Always look for the right angle first, and identify the hypotenuse.</p>',
     example:{q:'A box is 4 m long, 3 m wide and 12 m high. Find the length of its space diagonal.',steps:[{do:'Base diagonal: √(4² + 3²) = √25 = 5 m.'},{do:'Space diagonal: √(5² + 12²) = √169 = 13 m.',why:'The base diagonal and the height make another right triangle.'},{do:'Or in one step: √(16 + 9 + 144) = 13 m.'}]},
     mistake:'Adding when finding a shorter side. If c = 13 and b = 5, then a² = 169 − 25, not 169 + 25.',
     check:{q:'A 10 m ladder reaches 8 m up a wall. How far is its foot from the wall?',o:['6 m','12.8 m','2 m'],a:0,why:'√(100 − 64) = 6.',hint:'Subtract to find a shorter side.'}},
    {title:'Defining sine, cosine and tangent',explain:'<p>In a right triangle, choose one of the acute angles and call it θ. Then name the sides from θ’s point of view: the {{opposite|the side across from θ}} side is across from θ; the {{adjacent|the side next to θ, not the hypotenuse}} side is next to θ (and is not the hypotenuse); and the hypotenuse is opposite the right angle.</p><p>The three trigonometric ratios are:</p><p><strong>{{sin θ|opposite ÷ hypotenuse}} = O/H</strong>   <strong>{{cos θ|adjacent ÷ hypotenuse}} = A/H</strong>   <strong>{{tan θ|opposite ÷ adjacent}} = O/A</strong></p><p>Remember them as <strong>SOH CAH TOA</strong>. These ratios depend only on the angle, not on the size of the triangle. That is why they work for flagpoles, roofs and mountains alike.</p>',visual:RT,
     example:{q:'In a right triangle, the side opposite θ is 5 and the hypotenuse is 13. Write sin θ, cos θ and tan θ.',steps:[{do:'Adjacent: √(13² − 5²) = √144 = 12.'},{do:'sin θ = 5/13, cos θ = 12/13.'},{do:'tan θ = 5/12.'}]},
     mistake:'Labelling the sides from the wrong angle. Opposite and adjacent depend on WHICH angle you are using.',
     check:{q:'cos θ = ?',o:['adjacent ÷ hypotenuse','opposite ÷ hypotenuse','opposite ÷ adjacent'],a:0,why:'CAH.',hint:'SOH CAH TOA.'}},
    {title:'Finding sides and angles',explain:'<p>To use trigonometry: <strong>1.</strong> Label the sides O, A and H from the angle. <strong>2.</strong> Tick the two sides involved (the one you know and the one you want). <strong>3.</strong> Choose the ratio that uses both. <strong>4.</strong> Write the equation and solve.</p><p><strong>Finding a side:</strong> if the unknown is on top, multiply: x = 12 sin 35°. If it is on the bottom, divide: x = 12 ÷ cos 35°.</p><p><strong>Finding an angle:</strong> use the inverse function on your calculator: if tan θ = 0.75, then θ = tan⁻¹(0.75) ≈ 36.9°.</p><p>Make sure your calculator is in <strong>degree mode</strong> (it usually shows D or DEG). In radian mode, every answer will be wrong.</p>',
     example:{q:'A ramp is 6 m long and rises 1.2 m. What angle does it make with the ground?',steps:[{do:'Opposite = 1.2, hypotenuse = 6: use sin.'},{do:'sin θ = 1.2 ÷ 6 = 0.2.'},{do:'θ = sin⁻¹(0.2) ≈ 11.5°.'}]},
     mistake:'Using the calculator in radian mode. sin 30° should give 0.5; if not, change to degrees.',
     check:{q:'In a right triangle, the hypotenuse is 20 and θ = 30°. What is the opposite side?',o:['10','17.32','40'],a:0,why:'20 × sin 30° = 10.',hint:'O = H × sin θ.'}}]}]},
  {phase:'explain',name:'Teach: the physical world',title:'Learn: elevation, depression, bearings and two-triangle problems',lead:'Next, using trigonometry to measure the world around us.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Always measure from di horizontal.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Angles of elevation and depression',explain:'<p>When you look <strong>up</strong> at something, the angle between the horizontal and your line of sight is the {{angle of elevation|the angle UP from the horizontal}}. When you look <strong>down</strong>, the angle between the horizontal and your line of sight is the {{angle of depression|the angle DOWN from the horizontal}}.</p><p>Both are always measured from the <strong>horizontal</strong>, never from the vertical.</p><p>Here is a neat fact: if a person on a cliff looks down at a boat with an angle of depression of 25°, then a person in the boat looks up at the cliff top with an angle of elevation of 25°. The two horizontal lines are parallel, so the angles are <strong>alternate angles</strong>, and alternate angles are equal. That means you can always put the 25° inside the right triangle at the boat.</p>',visual:ELV('d',40,25),
     example:{q:'From the top of a 40 m cliff, the angle of depression of a boat is 25°. How far is the boat from the foot of the cliff?',steps:[{do:'At the boat, the angle of elevation is 25° (alternate angles).'},{do:'Opposite = 40 (cliff), adjacent = x (distance): tan 25° = 40 ÷ x.'},{do:'x = 40 ÷ tan 25° ≈ 85.78 m.'}]},
     mistake:'Measuring the angle of depression from the vertical cliff face. It is measured from the HORIZONTAL.',
     check:{q:'The angle of depression from a lighthouse to a ship is 18°. The angle of elevation from the ship to the lighthouse is…',o:['18°','72°','162°'],a:0,why:'They are alternate angles, so they are equal.',hint:'Parallel horizontals.'}},
    {title:'Bearings',explain:'<p>The syllabus lists {{bearings|directions measured clockwise from North, with three figures}} as another way trigonometry describes the physical world. A bearing is a direction, measured <strong>clockwise from North</strong>, and always written with <strong>three figures</strong>: East is 090°, South is 180°, West is 270°, and a direction 60° clockwise from North is <strong>060°</strong> (not 60°).</p><p>When two places are connected by a journey north or south and then east or west, the directions make a right angle, so you can use Pythagoras and trigonometry. For example, a boat sails 6 km east and 8 km north: it is √(36 + 64) = 10 km away, on a bearing of tan⁻¹(6/8) ≈ 036.9°.</p><p>You will study bearings in more depth, with the sine and cosine rules, in the next lesson.</p>',visual:BR,
     example:{q:'A ship sails 5 km north, then 12 km east. How far is it from its start, and on what bearing?',steps:[{do:'Distance: √(5² + 12²) = 13 km.'},{do:'Angle from North: tan θ = 12/5 = 2.4, so θ ≈ 67.4°.'},{do:'Bearing: 067.4° (clockwise from North).'}]},
     mistake:'Writing a bearing with two figures. 45° should be written 045°.',
     check:{q:'What is the bearing of due West?',o:['270°','090°','180°'],a:0,why:'Three-quarters of a turn clockwise from North.',hint:'N 000°, E 090°, S 180°…'}},
    {title:'Problems with two right triangles',explain:'<p>Many CSEC questions involve <strong>two</strong> right triangles that share a side, or a measurement taken from two places. Sketch the situation, mark every known length and angle, and look for the shared side.</p><p>Work through one triangle to find the shared side, then use it in the second triangle. Keep full calculator values until the end, and only round your final answer, otherwise rounding errors build up.</p><p>The syllabus also mentions <strong>scale drawing</strong>: you can draw the situation accurately to scale and measure, but trigonometry gives a more accurate answer.</p>',
     example:{q:'From a point A, the angle of elevation of a tower’s top is 40°. From point B, 20 m closer, it is 55°. Find the tower’s height h. (Let the distance from B to the tower be x.)',steps:[{do:'From B: h = x tan 55°. From A: h = (x + 20) tan 40°.'},{do:'So x tan 55° = (x + 20) tan 40°, giving x(tan 55° − tan 40°) = 20 tan 40°.'},{do:'x ≈ 16.78 ÷ 0.5890 ≈ 28.49 m, so h ≈ 28.49 × tan 55° ≈ 40.69 m.'}]},
     mistake:'Rounding the shared side early, then using the rounded value. Keep full accuracy until the final answer.',
     check:{q:'In a two-triangle problem, what should you do first?',o:['Draw a clear sketch and mark all the measurements','Round every number','Use the sine rule'],a:0,why:'A sketch shows the shared side.',hint:'Plan first.'}}]}]},
