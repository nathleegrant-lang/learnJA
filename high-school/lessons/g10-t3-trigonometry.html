     init:function(box,api){var M=box.querySelector('#elM'),D=box.querySelector('#elD'),A=box.querySelector('#elA');api.nudges(D);api.nudges(A);function draw(){var m=M.value,d=+D.value,a=+A.value;box.querySelector('.elDL').textContent=m==='e'?'Distance from the building (m):':'Height of the building (m):';box.querySelector('.elDO').textContent=d;box.querySelector('.elAO').textContent=a+'°';box.querySelector('.elSvg').innerHTML=ELV(m,d,a);if(m==='e'){var h=d*Math.tan(a*RAD),L=Math.sqrt(d*d+h*h);box.querySelector('.elOut').innerHTML='Opposite (height) and adjacent (distance), so use <strong>tan</strong>:<br>tan '+a+'° = h ÷ '+d+', so h = '+d+' × tan '+a+'° = <strong>'+ft(h)+' m</strong><br>Line of sight (hypotenuse) by Pythagoras: √('+d+'² + '+ft(h)+'²) = '+ft(L)+' m'}else{var x=d/Math.tan(a*RAD);box.querySelector('.elOut').innerHTML='The angle of depression from the top of the building equals the angle of elevation from the car ('+a+'°), because they are alternate angles.<br>Opposite (building height) and adjacent (distance), so use <strong>tan</strong>:<br>tan '+a+'° = '+d+' ÷ x, so x = '+d+' ÷ tan '+a+'° = <strong>'+ft(x)+' m</strong>'}}[M,D,A].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var Q=[{t:'Elevation: 50 m from a building, angle 30°. How tall is it, to 2 decimal places? (m)',a:28.87},{t:'Depression: from the top of a 40 m building, the angle of depression to a car is 25°. How far is the car from the foot of the building, to 2 decimal places? (m)',a:85.78},{t:'For the first building, how long is the line of sight (the hypotenuse), to 2 decimal places? (m)',a:57.74}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.elN').textContent='All done';box.querySelector('.elQ').textContent='You completed every challenge!';box.querySelector('.elC').disabled=true;return}box.querySelector('.elN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.elQ').textContent=Q[q].t}box.querySelector('.elC').o   {phase:'explain',name:'Teach: Pythagoras and the ratios',title:'Learn: Pythagoras’ theorem and the trigonometric ratios',lead:'Work through each idea in order. Each one starts with a real picture, explains why the rule works, and shows who uses it at work. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Picture each situation before you calculate. Read the "Why it works" box: it is the reason the rule is true.','Step through the worked example, then answer "Your turn" to unlock the next idea.'],
   patois:'See di picture fus. Den di maths mek sense.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Pythagoras’ theorem, in 2D and 3D',explain:PIC('<p style="margin:0">Stand outside your house and look at where the wall meets the yard. The wall goes straight <strong>up</strong>; the ground goes straight <strong>across</strong>. Where they meet, there is a perfect corner: a right angle. Now lean a ladder so that its foot is on the ground and its top rests on the wall. Three things now make a triangle: the wall, the ground, and the ladder. The ladder is the slanting side, opposite the right-angle corner. It is always the longest side: the {{hypotenuse|the longest side, opposite the right angle}}.</p>',SCN['Pythagoras’ theorem, in 2D and 3D'])+'<p>In every right-angled triangle, <strong>c² = a² + b²</strong>, where c is the hypotenuse. To find the hypotenuse, add the squares. To find a <strong>shorter</strong> side, such as how far the ladder’s foot is from the wall, subtract: a² = c² − b².</p><p>It also works in <strong>three dimensions</strong>. Picture the longest pole you could fit in a box, from one bottom corner to the opposite top corner. Use Pythagoras twice: first across the floor of the box, √(l² + w²), then up to the top corner: √(l² + w² + h²).</p>'+WHY('<p style="margin:0 0 6px">Why does c² = a² + b²? Think of the "square" in a² as a real square drawn on each side. For a triangle with sides 3, 4 and 5, the squares on the two short sides have areas 9 and 16. Together, 25: exactly the area of the square on the hypotenuse. That is true for <strong>every</strong> right-angled triangle, and it is why the theorem works.</p>'+PYSQ)+WORK('<p style="margin:0"><strong>Masons and carpenters</strong> use this every day to "square" a building. To check that the corner of a new house foundation is exactly 90°, a mason measures 3 m along one wall line and 4 m along the other, then checks that the diagonal is exactly 5 m. If it is 5.1 m, the corner is not square, and every wall built on it will be crooked. <strong>Electricians, JPS line technicians, painters and firefighters</strong> use it to choose and set up ladders safely.</p>'),
     example:{q:'A box is 4 m long, 3 m wide and 12 m high. Find the length of its space diagonal.',steps:[{do:'Base diagonal: √(4² + 3²) = √25 = 5 m.'},{do:'Space diagonal: √(5² + 12²) = √169 = 13 m.',why:'The base diagonal and the height make another right triangle, standing up inside the box.'},{do:'Or in one step: √(16 + 9 + 144) = 13 m.'}]},
     mistake:'Adding when finding a shorter side. If c = 13 and b = 5, then a² = 169 − 25, not 169 + 25. Picture it: the foot of the ladder is closer than the ladder is long, so the answer must be SMALLER than the hypotenuse.',
     check:{q:'A 10 m ladder reaches 8 m up a wall. How far is its foot from the wall?',o:['6 m','12.8 m','2 m'],a:0,why:'√(100 − 64) = 6 m. But notice: with its foot 6 m out, this ladder makes only about 53° with the ground. A worker would say it is far too shallow and could slide out. (See "Maths at work".)',hint:'The foot is closer than the ladder is long: subtract.'}},
    {title:'Defining sine, cosine and tangent',explain:PIC('<p style="margin:0">Picture a wheelchair ramp outside a clinic. Walk up it, and you rise a little for every step forward. A steep ramp rises a lot for each metre forward; a gentle ramp rises only a little. That "rise for every metre across" is a ratio of two sides of a right triangle, and it tells you how steep the angle is. Trigonometry is simply naming these ratios.</p>',SCN['Defining sine, cosine and tangent'])+'<p>Choose one acute angle of a right triangle and call it θ. Name the sides from θ’s point of view: the {{opposite|the side across from θ}} side is across from θ; the {{adjacent|the side next to θ, not the hypotenuse}} side is next to θ (not the hypotenuse); and the hypotenuse is opposite the right angle.</p><p><strong>{{sin θ|opposite ÷ hypotenuse}} = O/H</strong>   <strong>{{cos θ|adjacent ÷ hypotenuse}} = A/H</strong>   <strong>{{tan θ|opposite ÷ adjacent}} = O/A</strong>   (SOH CAH TOA)</p><p>For the ramp, tan θ = rise ÷ run: the steepness.</p>'+WHY('<p style="margin:0 0 6px">Why does a ratio depend only on the angle, and not on the size of the triangle? Draw three right triangles, small, medium and large, all with a 30° angle. They are the same shape (similar triangles); one is just an enlargement of another. When a triangle is enlarged, every side is multiplied by the same number, so the ratio O ÷ H does not change. That is why sin 30° is always 0.5, whether the triangle is a roof truss or a mountain.</p>'+SIMT)+WORK('<p style="margin:0"><strong>Builders and architects</strong> use these ratios for wheelchair ramps (often limited to a gradient of about 1 in 12), roof pitches and staircases. <strong>Surveyors</strong> use them to measure heights and distances they cannot reach. <strong>Road engineers</strong> use them for the steepness of hills on roads like the Junction Road through St. Mary.</p>'),visual:RT,
     example:{q:'In a right triangle, the side opposite θ is 5 and the hypotenuse is 13. Write sin θ, cos θ and tan θ.',steps:[{do:'Adjacent: √(13² − 5²) = √144 = 12.'},{do:'sin θ = 5/13, cos θ = 12/13.'},{do:'tan θ = 5/12.'}]},
     mistake:'Labelling the sides from the wrong angle. Opposite and adjacent depend on WHICH angle you are standing at. Picture yourself at the angle: the side you face is the opposite.',
     check:{q:'cos θ = ?',o:['adjacent ÷ hypotenuse','opposite ÷ hypotenuse','opposite ÷ adjacent'],a:0,why:'CAH: Cos = Adjacent ÷ Hypotenuse.',hint:'SOH CAH TOA.'}},
    {title:'Finding sides and angles',explain:PIC('<p style="margin:0">A JPS line technician leans a 7 m ladder against a utility pole at 75° to the ground. How high up the pole can she reach? Picture it: the pole is straight up, the ground is flat, the ladder is the hypotenuse, and the height she reaches is the side OPPOSITE the 75° angle at the foot of the ladder. Once the picture is right, the choice of ratio is easy.</p>',SCN['Finding sides and angles'])+'<p><strong>1.</strong> Draw the picture and mark the right angle. <strong>2.</strong> Label O, A and H from the angle you know. <strong>3.</strong> Tick the side you know and the side you want. <strong>4.</strong> Choose the ratio with both (SOH, CAH or TOA). <strong>5.</strong> Write the equation and solve.</p><p>For the technician: sin 75° = height ÷ 7, so height = 7 × sin 75° ≈ 6.76 m.</p><p><strong>Finding an angle:</strong> use the inverse button. If tan θ = 0.75, then θ = tan⁻¹(0.75) ≈ 36.9°. Your calculator must be in <strong>degree mode</strong>: check that sin 30° gives 0.5.</p>'+WHY('<p style="margin:0">Why the inverse? sin, cos and tan turn an angle into a ratio. When you already know the ratio and want the angle, you need to go backwards: sin⁻¹, cos⁻¹ and tan⁻¹ turn a ratio back into its angle.</p>')+WORK('<p style="margin:0"><strong>Ramp builders</strong> check angles: a ramp that rises 1.2 m over a 6 m slope makes sin θ = 0.2, so θ ≈ 11.5°, which is too steep for many wheelchair users. <strong>Carpenters</strong> cut rafters to the right angle for a roof. <strong>Pilots</strong> at Norman Manley and Sangster airports descend at about 3° to the runway.</p>'),
     example:{q:'A ramp is 6 m long and rises 1.2 m. What angle does it make with the ground?',steps:[{do:'Picture it: the ramp is the hypotenuse (6 m); the rise is opposite the angle (1.2 m). Use sin.'},{do:'sin θ = 1.2 ÷ 6 = 0.2.'},{do:'θ = sin⁻¹(0.2) ≈ 11.5°.'}]},
     mistake:'Using the calculator in radian mode. sin 30° should give 0.5; if it does not, change to degrees.',
     check:{q:'In a right triangle, the hypotenuse is 20 and θ = 30°. What is the opposite side?',o:['10','17.32','40'],a:0,why:'20 × sin 30° = 20 × 0.5 = 10.',hint:'O = H × sin θ.'}}]}]},

   patois:'Always measure from di horizontal.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Angles of elevation and depression',explain:PIC('<p style="margin:0">Picture a security officer on the roof of a tall office building in New Kingston, and a driver in the car park below. They look at each other along the <strong>same straight line of sight</strong>. The officer first looks straight ahead, level with her eyes, then lowers her eyes to see the car: that downward turn is the {{angle of depression|the angle DOWN from the horizontal}}. The driver first looks straight ahead, then raises his eyes to see the officer: that upward turn is the {{angle of elevation|the angle UP from the horizontal}}.</p>')+'<p>Each person measures from their <strong>own horizontal</strong>, the level line through their own eyes, never from the vertical wall of the building. That is why the angle of depression is drawn at the <strong>top</strong> of the diagram (where the officer is), and the angle of elevation at the <strong>bottom</strong> (where the driver is). It works the same from any high place: a building, a lighthouse, a tower, a plane or a drone.</p>'+WHY('<p style="margin:0 0 6px"><strong>Why measure an angle at all?</strong> Because it lets you find a distance you cannot reach. A Coast Guard officer on a lookout cannot run a tape measure across the sea to a boat. But the officer does know the height of the lookout (measured once, when it was built), and can measure the angle easily: look straight out at the horizon, then tilt the eyes, binoculars or a clinometer down until the boat is in view. The height, the line of sight and the sea make a right-angled triangle, so:</p><p style="margin:0 0 6px;text-align:center"><strong>distance = height ÷ tan(angle)</strong></p><p style="margin:0 0 6px">One fixed height and one quick angle reading give a distance that could never be measured directly. Even before calculating, the angle tells you something: the <strong>steeper</strong> you look down, the <strong>closer</strong> the boat. From a 50 m lookout:</p><table style="border-collapse:collapse;margin:8px 0;font-size:.95rem"><thead><tr><th style="border:1px solid #b3c6e8;padding:4px 10px;background:#dfe9fb">Angle of depression</th><th style="border:1px solid #b3c6e8;padding:4px 10px;background:#dfe9fb">Distance to the vessel</th></tr></thead><tbody><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">5°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 571 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">10°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 284 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">12°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 235 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">20°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 137 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">30°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 87 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">45°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">50 m</td></tr><tr><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">60°</td><td style="border:1px solid #b3c6e8;padding:3px 10px;text-align:center">about 29 m</td></tr></tbody></table><p style="margin:0 0 10px">So if the angle grows from 12° to 20°, the officer knows at once that the boat is coming closer, and the calculation shows by how much. Notice the pattern: far out, a small change in angle means a big change in distance (from 5° to 10°, the boat moves about 288 m), so careful angle readings matter most when a boat is far away.</p><p style="margin:0"><strong>Why are the two angles equal?</strong> The officer’s horizontal line and the ground are <strong>parallel</strong> (both are level). The line of sight cuts across both of them, like a transversal. The angle of depression and the angle of elevation are <strong>alternate angles</strong> (they make a "Z" shape), and alternate angles between parallel lines are equal. So you can always put the angle inside the right triangle, at the car, and use it there.</p>')+WORK('<p style="margin:0 0 6px">Angles of depression are used by anyone who looks DOWN at a target and needs to know how far away it is, or where to aim:</p><p style="margin:0"><strong>CCTV and security installers</strong> tilt cameras down from a building so that they cover the gate and car park. <strong>Cell-tower technicians</strong> set the “downtilt” of antennas so that the signal reaches the right streets. <strong>Pilots</strong> see the runway at an angle of depression of about 3° on approach. <strong>Lighthouse keepers and the Coast Guard</strong> judge how far away a ship is. <strong>Lifeguards</strong> on tall chairs spot swimmers. <strong>Drone pilots and photographers</strong> tilt the camera down. <strong>Stadium architects</strong> design seating so that every spectator looks down at the field at a comfortable angle.</p>'),visual:ELV('d',40,25),
     example:{q:'From the top of a 40 m office building in New Kingston, a security officer sees a car in the car park at an angle of depression of 25°. How far is the car from the foot of the building?',steps:[{do:'Picture it: the building stands straight up, the car park is flat, and the officer’s line of sight slants down to the car.'},{do:'At the car, the angle of elevation is also 25° (alternate angles). The building (40 m) is opposite it; the distance x is adjacent: tan 25° = 40 ÷ x.'},{do:'x = 40 ÷ tan 25° ≈ 85.78 m.'}]},
     mistake:'Measuring the angle of depression from the vertical wall of the building. It is measured from the HORIZONTAL, through the observer’s eyes.',
     check:{q:'The angle of depression from a lighthouse to a ship is 18°. The angle of elevation from the ship to the lighthouse is…',o:['18°','72°','162°'],a:0,why:'They are alternate angles between parallel horizontals, so they are equal.',hint:'Same line of sight, parallel horizontals.'}},
    {title:'Bearings',explain:PIC('<p style="margin:0">Picture a fisherman leaving Port Royal before dawn. There are no roads at sea, so he steers by direction. He faces North, then turns clockwise until he faces his fishing ground. If he has turned 60°, his direction is a {{bearing|a direction measured clockwise from North, with three figures}} of 060°.</p>',SCN['Bearings'])+'<p>A bearing is measured <strong>clockwise from North</strong> and always written with <strong>three figures</strong>: East is 090°, South is 180°, West is 270°.</p><p>When a journey goes north or south, then east or west, the two legs meet at a right angle, so Pythagoras and trigonometry apply. A boat that sails 6 km east and 8 km north is √(36 + 64) = 10 km from its start, on a bearing of tan⁻¹(6 ÷ 8) ≈ 036.9°.</p>'+WHY('<p style="margin:0">Why three figures, and why from North? Everyone needs the same starting line and the same direction of turning, or "60°" could mean many different directions. Three figures (060°, not 60°) avoid confusion when bearings are read out over a radio or written quickly: 060 cannot be mistaken for 600 or 06.</p>')+WORK('<p style="margin:0"><strong>Fishermen, ship captains and the Coast Guard</strong> navigate by bearings. <strong>Pilots</strong> name runways by bearings: a runway numbered 12 points roughly 120°. <strong>Surveyors</strong> record property boundaries on land titles as bearings and distances.</p>')+'<p style="margin:8px 0 0">You will study bearings further, with the sine and cosine rules, in the next lesson.</p>',visual:BR,
     example:{q:'A ship sails 5 km north, then 12 km east. How far is it from its start, and on what bearing?',steps:[{do:'Picture it: north is straight up the page, east is to the right; the two legs meet at a right angle.'},{do:'Distance: √(5² + 12²) = 13 km. Angle from North: tan θ = 12 ÷ 5 = 2.4, so θ ≈ 67.4°.'},{do:'Bearing: 067.4° (clockwise from North).'}]},
     mistake:'Writing a bearing with two figures. 45° should be written 045°.',
     check:{q:'What is the bearing of due West?',o:['270°','090°','180°'],a:0,why:'Three-quarters of a full turn clockwise from North.',hint:'N 000°, E 090°, S 180°…'}},
    {title:'Problems with two right triangles',explain:PIC('<p style="margin:0">Picture a surveyor who must find the height of a tall tower on the far bank of the Rio Minho. She cannot cross the river to measure the distance to its foot. Instead, she measures the angle of elevation from one spot, walks 20 m straight towards the tower, and measures again. Now there are two right triangles that share the same height: the tower.</p>',SCN['Problems with two right triangles'])+'<p>Sketch the situation, mark every known length and angle, and look for the <strong>shared side</strong>. Write the shared side in two ways (one from each triangle), and set them equal; or work through one triangle to find the shared side, then use it in the second.</p><p>Keep full calculator values until the very end, and only round the final answer. Rounding early lets errors build up.</p>'+WHY('<p style="margin:0">Why does this work? Each triangle gives one equation, and both equations describe the same height. Two equations let you find two unknowns: the height and the distance you could not measure. This is how heights of mountains were measured long before anyone could climb them with a tape measure.</p>')+WORK('<p style="margin:0"><strong>Land surveyors</strong> map hills and property in places they cannot reach. <strong>Engineers</strong> plan bridges across rivers and gullies. <strong>Telecommunications technicians</strong> check the height of cell towers before installing equipment.</p>'),
     example:{q:'From A, the angle of elevation of a tower’s top is 40°. From B, 20 m closer, it is 55°. Find the tower’s height h. (Let the distance from B to the tower be x.)',steps:[{do:'From B: h = x tan 55°. From A: h = (x + 20) tan 40°.'},{do:'So x tan 55° = (x + 20) tan 40°, giving x(tan 55° − tan 40°) = 20 tan 40°.'},{do:'x ≈ 16.78 ÷ 0.5890 ≈ 28.49 m, so h ≈ 28.49 × tan 55° ≈ 40.69 m.'}]},
     mistake:'Rounding the shared side early, then using the rounded value. Keep full accuracy until the final answer.',
     check:{q:'In a two-triangle problem, what should you do first?',o:['Draw a clear sketch and mark all the measurements','Round every number','Use the sine rule'],a:0,why:'A sketch shows the shared side, and turns the story into a picture.',hint:'Picture it first.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Give answers to 2 decimal places.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Pythagoras',text:'c² = a² + b² (right triangles only). 3D: diagonal = √(l² + w² + h²).'},{title:'Ratios',text:'sin = O/H, cos = A/H, tan = O/A (SOH CAH TOA). Angles: use sin⁻¹, cos⁻¹, tan⁻¹. Degree mode!'},{title:'Elevation and depression',text:'Both measured from the horizontal. The angle of depression = the angle of elevation from the other end (alternate angles).'},{title:'Bearings and two triangles',text:'Bearings: clockwise from North, three figures (060°). Two triangles: find the shared side first; round only at the end.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A kite string is 60 m long and makes an angle of 52° with the ground. How high is the kite?',steps:[{do:'Hypotenuse 60, want the opposite: use sin.'},{do:'h = 60 sin 52°.'},{do:'h ≈ 47.28 m.'}]},
     {type:'fill',q:'Find θ if tan θ = 7/24.',steps:[{text:'θ = tan⁻¹(7 ÷ 24) = tan⁻¹(0.2917).'},{text:'θ ≈ ___° (1 decimal place)',blank:true,a:16.3,tol:0.05,hint:'Use tan⁻¹.'}],sol:'≈ 16.3°.'},
     {type:'own',q:'A tree casts a 15 m shadow when the angle of elevation of the sun is 40°. How tall is the tree? (m, 2 d.p.)',a:12.59,tol:0.015,hint:'h = 15 tan 40°.',sol:'≈ 12.59 m.',placeholder:'metres'},
     {type:'own',q:'A cuboid is 6 cm by 8 cm by 24 cm. Find its space diagonal. (cm)',a:26,tol:0.01,hint:'√(36 + 64 + 576).',sol:'√676 = 26 cm.',placeholder:'cm'}]}]},
  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, Pythagoras and trigonometry are not exercises: the answers decide whether a wall is straight, a ladder is safe, or a ramp can be used. Choose a job, picture the situation, and make the decision.',
   mission:['Choose a job card.','Draw a quick sketch of the situation first, then work through the questions.','Complete any 3 jobs for a star. Complete all 6 to become a Maths at Work Champion.'],
   patois:'Di maths decide if it safe. Real life!',
   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'🧱',title:'The mason: squaring a foundation',desc:'Check that the corner of a new house is exactly 90°.',level:'⭐⭐ Building',mins:6,block:{type:'mission',story:'A mason in Spanish Town marks out the corner of a house foundation with string lines. To check that the corner is exactly 90°, she uses the 3–4–5 rule: she measures 3 m along one string line and 4 m along the other, then measures the diagonal between those two points.',parts:[{q:'If the corner is exactly 90°, how long should the diagonal be? (m)',a:5,hint:'√(3² + 4²).',sol:'5 m: a 3–4–5 right triangle.',placeholder:'m'},{q:'She measures the diagonal as 5.1 m. Is the corner exactly 90°? (Type yes or no.)',a:['no'],hint:'Is 3² + 4² equal to 5.1²?',sol:'No. 5.1² = 26.01, not 25. The corner is slightly more than 90°, so she must adjust the string line.'},{q:'For a larger, more accurate check, she uses 6 m and 8 m. How long should the diagonal be? (m)',a:10,hint:'Double 3–4–5.',sol:'10 m (6–8–10 is the 3–4–5 triangle enlarged by 2).',placeholder:'m'},{q:'Using 9 m and 12 m, what diagonal should she measure? (m)',a:15,hint:'Three times 3–4–5.',sol:'15 m.',placeholder:'m'}],done:'Masons have used the 3–4–5 rule for thousands of years. Every straight, square house starts with Pythagoras.'}},
    {icon:'⚡',title:'The line technician: a safe ladder',desc:'Choose the right ladder to reach a utility pole safely.',level:'⭐⭐ Electricity',mins:7,block:{type:'mission',story:'A JPS line technician must reach a point 7.2 m up a utility pole. Safety rules say she must set her ladder using the 4-to-1 rule: for every 4 m up, the foot of the ladder goes 1 m out from the pole.',parts:[{q:'How far from the pole should the foot of the ladder be? (m)',a:1.8,tol:0.001,hint:'7.2 ÷ 4.',sol:'1.8 m.',placeholder:'m'},{q:'How long must the ladder be, to 2 decimal places? (m)',a:7.42,tol:0.01,hint:'√(7.2² + 1.8²).',sol:'√(51.84 + 3.24) = √55.08 ≈ 7.42 m.',placeholder:'m'},{q:'What angle does the ladder make with the ground, to 1 decimal place?',a:76,tol:0.06,hint:'tan θ = 7.2 ÷ 1.8 = 4.',sol:'tan⁻¹(4) ≈ 76.0°: the 4-to-1 rule always gives about 76°.',placeholder:'degrees'},{q:'Her van carries ladders of 6 m, 8 m and 10 m. Which is the shortest ladder that will do the job? (m)',a:8,hint:'It must be at least 7.42 m.',sol:'The 8 m ladder (6 m is too short; 10 m is longer than needed).',placeholder:'m'}],done:'The 4-to-1 rule turns a safety guideline into a right triangle. Choosing the wrong ladder could cost a life.'}},
    {icon:'🚒',title:'The firefighter: the aerial ladder',desc:'Position a fire truck’s ladder to reach a window.',level:'⭐⭐⭐ Emergency services',mins:7,block:{type:'mission',story:'A Jamaica Fire Brigade crew must reach a window 15 m above the ground. The base of the aerial ladder sits on the truck, 3 m above the ground, and the truck parks 9 m from the building.',parts:[{q:'How far must the ladder rise above its base? (m)',a:12,hint:'15 − 3.',sol:'12 m.',placeholder:'m'},{q:'How long must the ladder extend? (m)',a:15,hint:'√(9² + 12²).',sol:'√(81 + 144) = 15 m.',placeholder:'m'},{q:'At what angle of elevation must the ladder be raised, to 1 decimal place?',a:53.1,tol:0.06,hint:'tan θ = 12 ÷ 9.',sol:'tan⁻¹(1.333) ≈ 53.1°.',placeholder:'degrees'},{q:'Parked cars force the truck to stop 16 m from the building. How long must the ladder extend now? (m)',a:20,hint:'√(16² + 12²).',sol:'√(256 + 144) = 20 m. Parking further away needs 5 m more ladder.',placeholder:'m'}],done:'Firefighters make these calculations quickly under pressure. Where the truck parks changes everything.'}},
    {icon:'📐',title:'The surveyor: is the building too tall?',desc:'Check a building’s height against its planning permission.',level:'⭐⭐⭐ Land and planning',mins:7,block:{type:'mission',story:'A surveyor checks a new building in New Kingston. Its planning permission allows a maximum height of 25 m. She stands 30 m from the building, and with a clinometer at her eye level (1.5 m above the ground) she measures the angle of elevation of the top as 40°.',parts:[{q:'How far does the building rise above her eye level, to 2 decimal places? (m)',a:25.17,tol:0.01,hint:'30 × tan 40°.',sol:'30 × 0.8391 ≈ 25.17 m.',placeholder:'m'},{q:'What is the total height of the building, to 2 decimal places? (m)',a:26.67,tol:0.01,hint:'Add her eye height.',sol:'25.17 + 1.5 = 26.67 m.',placeholder:'m'},{q:'Is the building within its 25 m limit? (Type yes or no.)',a:['no'],hint:'Compare 26.67 with 25.',sol:'No: it is about 1.67 m too tall. The surveyor’s report could stop the developer adding another floor.'}],done:'Surveyors measure what they cannot reach. Forgetting the eye height would have made the building look about 1.5 m shorter than it really is.'}},
    {icon:'⚓',title:'The Coast Guard: an approaching vessel',desc:'Track a vessel from a cliff-top lookout.',level:'⭐⭐⭐ Coast Guard',mins:8,block:{type:'mission',story:'Late at night, a JDF Coast Guard officer at a cliff-top lookout 50 m above the sea spots a vessel with no lights, heading straight for the beach below the lookout. The angle of depression is 12°. Five minutes later, it is 20°. Nobody can measure the distance across the water, but the officer knows the height of the lookout and can measure the angle.',parts:[{q:'How far was the vessel from the foot of the cliff at first, to 2 decimal places? (m)',a:235.23,tol:0.05,hint:'50 ÷ tan 12°. (The angle of elevation at the vessel is also 12°.)',sol:'50 ÷ 0.2126 ≈ 235.23 m.',placeholder:'m'},{q:'How far was it five minutes later, to 2 decimal places? (m)',a:137.37,tol:0.05,hint:'50 ÷ tan 20°.',sol:'50 ÷ 0.3640 ≈ 137.37 m.',placeholder:'m'},{q:'How far did the vessel travel towards the coast, to 2 decimal places? (m)',a:97.86,tol:0.1,hint:'Subtract.',sol:'≈ 97.86 m.',placeholder:'m'},{q:'What was its average speed in metres per minute, to 2 decimal places?',a:19.57,tol:0.05,hint:'Distance ÷ 5.',sol:'≈ 19.57 m per minute.',placeholder:'m/min'},{q:'At this speed, how many more minutes until the vessel reaches the shore, to 1 decimal place?',a:7.0,tol:0.1,hint:'Distance still to go ÷ speed: 137.37 ÷ 19.57.',sol:'≈ 7.0 minutes.',placeholder:'minutes'},{q:'The patrol boat needs 10 minutes to launch and reach the beach. Can it get there before the vessel lands? (Type yes or no.)',a:['no'],hint:'Compare 7 minutes with 10 minutes.',sol:'No: the vessel lands in about 7 minutes, 3 minutes before the patrol boat can arrive. The officer must radio the police team on land to meet the vessel at the beach instead.'}],done:'The officer could not measure a single distance across the water, but two angle readings and the height of the lookout told them how far away the vessel was, how fast it was coming, and when it would land. That is the decision the mathematics made possible: send the land team, because the patrol boat would arrive too late.'}},
    {icon:'♿',title:'The building inspector: an accessible ramp',desc:'Decide whether a wheelchair ramp meets the guideline.',level:'⭐⭐ Accessibility',mins:6,block:{type:'mission',story:'A building inspector checks a new wheelchair ramp at a health centre in May Pen. The entrance is 0.6 m above the ground. A common accessibility guideline says a ramp should rise no more than 1 m for every 12 m of horizontal run (a gradient of 1 in 12).',parts:[{q:'Following the guideline, what is the shortest horizontal run the ramp can have? (m)',a:7.2,tol:0.001,hint:'0.6 × 12.',sol:'7.2 m.',placeholder:'m'},{q:'What angle does a 1-in-12 ramp make with the ground, to 1 decimal place?',a:4.8,tol:0.06,hint:'tan θ = 1 ÷ 12.',sol:'tan⁻¹(0.0833) ≈ 4.8°: gentle enough for a wheelchair user.',placeholder:'degrees'},{q:'The contractor built the ramp with a horizontal run of only 5 m. Does it meet the guideline? (Type yes or no.)',a:['no'],hint:'Gradient 0.6 ÷ 5 = 0.12. Compare with 1 ÷ 12 ≈ 0.083.',sol:'No: 0.12 is steeper than 0.083. The ramp must be rebuilt longer.'},{q:'How long is the sloping surface of a ramp with a 7.2 m run, to 2 decimal places? (m)',a:7.22,tol:0.01,hint:'√(7.2² + 0.6²).',sol:'√52.2 ≈ 7.22 m.',placeholder:'m'}],done:'A few degrees make the difference between a ramp that someone can use independently and one that is dangerous.'}}
   ]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Which ratio?',desc:'Choose the ratio for each problem.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Which two sides are involved: O, A or H?',bins:[{id:'s',label:'sin (O and H)'},{id:'c',label:'cos (A and H)'},{id:'t',label:'tan (O and A)'}],items:[{label:'Know the hypotenuse, want the opposite',bin:'s'},{label:'Know the adjacent, want the opposite',bin:'t'},{label:'Know the hypotenuse, want the adjacent',bin:'c'},{label:'Height of a building from a distance and an elevation angle',bin:'t'},{label:'Height of a kite from the string length and angle',bin:'s'},{label:'Distance along the ground from a ladder’s length and angle',bin:'c'}]}},
    {icon:'🃏',title:'Match the bearings',desc:'Match each direction to its bearing.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['North','000°'],['East','090°'],['South','180°'],['West','270°'],['North-East','045°'],['South-West','225°']]}},
    {icon:'📏',title:'Order the heights',desc:'Find each height from 20 m away, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'From 20 m away, each angle of elevation gives a height h = 20 tan θ. Tap from shortest to tallest.',rounds:[[{label:'θ = 15°',v:5.36,show:'5.36 m'},{label:'θ = 30°',v:11.55,show:'11.55 m'},{label:'θ = 45°',v:20,show:'20 m'},{label:'θ = 60°',v:34.64,show:'34.64 m'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The hypotenuse is the longest side of a right triangle.',a:'always',why:'It is opposite the largest angle (90°).'},{s:'sin θ is greater than 1.',a:'never',why:'The opposite side is never longer than the hypotenuse.'},{s:'Pythagoras works for any triangle.',a:'never',why:'Only for right-angled triangles.'},{s:'tan θ is greater than 1.',a:'sometimes',why:'When θ > 45°, the opposite side is longer than the adjacent.'},{s:'An angle of depression equals the matching angle of elevation.',a:'always',why:'They are alternate angles between parallel horizontals.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Opposite 5, adjacent 12. Find the hypotenuse.',lines:['c² = 12² − 5² = 119','c ≈ 10.91'],wrong:0,reasons:['For the hypotenuse, ADD: 144 + 25 = 169, so c = 13','c = 17','c = 7'],reason:0,fix:'13.'},{who:'Tia',q:'From a 30 m tower, the angle of depression to a car is 20°. Find the distance.',lines:['The angle at the car is 70°','tan 70° = 30/x'],wrong:0,reasons:['The angle at the car equals the angle of depression, 20° (alternate angles)','The angle at the car is 90°','She should use sin'],reason:0,fix:'tan 20° = 30/x, so x ≈ 82.42 m.'},{who:'Omar',q:'A ship is 5 km north and 5 km east of port. Bearing from port?',lines:['tan θ = 5/5 = 1, so θ = 45°','Bearing: 45°'],wrong:1,reasons:['Bearings use three figures: 045°','The bearing is 315°','The bearing is 135°'],reason:0,fix:'045°.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire trigonometry.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},T=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25]],t=T[R(0,4)],r=R(0,2);if(r===0)return{q:'Legs '+t[0]+' and '+t[1]+'. Hypotenuse?',o:[String(t[2]),String(t[0]+t[1]),String(t[2]+1)],a:0,why:'√('+t[0]+'² + '+t[1]+'²).'};if(r===1)return{q:'O = '+t[0]+', H = '+t[2]+'. sin θ = ?',o:[t[0]+'/'+t[2],t[1]+'/'+t[2],t[0]+'/'+t[1]],a:0,why:'O/H.'};return{q:'O = '+t[0]+', A = '+t[1]+'. tan θ = ?',o:[t[0]+'/'+t[1],t[1]+'/'+t[0],t[0]+'/'+t[2]],a:0,why:'O/A.'}}}},
