  {phase:'explain',name:'Teach: indices, equations and identities',title:'Learn: indices, linear equations and identities',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Wah yuh do to one side, do it to di odda side.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The laws of indices with integral indices',explain:'<p>You met the laws of indices in Grade 9. For CSEC, the {{index|the small raised number in xⁿ}} m and n can be any integers, positive, zero or negative. Here are the four laws from the syllabus:</p><p><strong>xᵐ × xⁿ = xᵐ⁺ⁿ</strong>   <strong>xᵐ ÷ xⁿ = xᵐ⁻ⁿ</strong>   <strong>(xᵐ)ⁿ = xᵐⁿ</strong>   <strong>x⁻ᵐ = 1/xᵐ</strong></p><p>The last one is the most surprising. A {{negative index|x⁻ᵐ = 1/xᵐ}} does not make the number negative; it means “one over”. You can see why with the division law: x² ÷ x⁵ = x⁻³, but cancelling gives 1/x³.</p><p>In CSEC questions, you will often simplify an expression with several laws at once. Deal with the numbers and each letter separately, and give the final answer with positive indices unless told otherwise.</p>',
     example:{q:'Simplify (2x³y⁻²)² × 3x⁻⁴y.',steps:[{do:'Bracket first: (2x³y⁻²)² = 4x⁶y⁻⁴.',why:'Square the 2, and multiply each index by 2.'},{do:'Multiply: 4 × 3 = 12; x⁶ × x⁻⁴ = x²; y⁻⁴ × y¹ = y⁻³.'},{do:'Answer: 12x²y⁻³ = 12x²/y³.'}]},
     mistake:'Thinking x⁻² is negative. It is 1/x², which is positive when x is positive.',
     check:{q:'Simplify x⁵ ÷ x⁸.',o:['x⁻³ = 1/x³','x³','x¹³'],a:0,why:'5 − 8 = −3.',hint:'Subtract the indices.'}},
    {title:'Solving linear equations',explain:'<p>A {{linear equation|an equation where the unknown has power 1}} has an unknown with power 1. The method is always the balance: <strong>do the same to both sides</strong> until x is alone.</p><p>A good order of jobs: <strong>1.</strong> Clear any fractions by multiplying both sides by the denominator (or the LCM of the denominators). <strong>2.</strong> Expand any brackets. <strong>3.</strong> Collect the x terms on one side and the numbers on the other. <strong>4.</strong> Divide by the coefficient of x.</p><p>For the phone plans: 500 + 3m = 200 + 5m. Subtract 3m from both sides: 500 = 200 + 2m. Subtract 200: 300 = 2m. Divide by 2: m = 150. Always check by substituting back into the original equation.</p>',visual:BAL(5,3,2,15),
     example:{q:'Solve (x + 4)/3 − (x − 2)/2 = 1.',steps:[{do:'Multiply every term by 6: 2(x + 4) − 3(x − 2) = 6.',why:'6 is the LCM of 3 and 2.'},{do:'Expand: 2x + 8 − 3x + 6 = 6, so −x + 14 = 6.'},{do:'−x = −8, so x = 8. Check: 12/3 − 6/2 = 4 − 3 = 1 ✓'}]},
     mistake:'Multiplying only some terms by the LCM. Every term, on both sides, must be multiplied.',
     check:{q:'Solve 4(x − 1) = 2x + 6.',o:['5','1','2.5'],a:0,why:'4x − 4 = 2x + 6, so 2x = 10.',hint:'Expand, then collect x terms.'}},
    {title:'Equations versus identities',explain:'<p>An {{equation|true only for particular values}} is true only for particular values. 2x + 1 = 7 is true only when x = 3.</p><p>An {{identity|true for every value of the variable}} is true for <strong>every</strong> value of the variable. (x + 1)² = x² + 2x + 1 is true whatever x is: try 2, −5, or 100. We often write identities with the symbol <strong>≡</strong>, “is identically equal to”.</p><p>To <strong>prove</strong> two expressions are identical, start with one side and use algebra (expanding, simplifying, factorising) until it becomes exactly the other side. Do not just test a few numbers: a few matching numbers do not prove it is true for all.</p>',
     example:{q:'Prove that (a + b)² − (a − b)² ≡ 4ab.',steps:[{do:'Expand: (a² + 2ab + b²) − (a² − 2ab + b²).'},{do:'Remove the brackets carefully: a² + 2ab + b² − a² + 2ab − b².'},{do:'Simplify: 4ab. The left side equals the right side for all a and b ✓'}]},
     mistake:'"Proving" an identity by testing one or two numbers. You must show it algebraically for all values.',
     check:{q:'Which is an identity?',o:['2(x + 3) ≡ 2x + 6','2x + 3 = 9','x² = 4'],a:0,why:'It is true for every x.',hint:'True for all values.'}}]}]},
  {phase:'explain',name:'Teach: inequalities, formulae and worded problems',title:'Learn: inequalities, changing the subject and worded problems',lead:'Next, inequalities in set builder notation, rearranging harder formulae, and turning words into equations.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Divide by a negative? Flip di sign.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Linear inequalities and set builder notation',explain:'<p>Solve an {{inequality|a statement using <, ≤, > or ≥}} just like an equation, with one important rule: if you <strong>multiply or divide both sides by a negative number, reverse the inequality sign</strong>. For example, 2 < 5, but −2 > −5.</p><p>The syllabus asks you to give the solution in {{set builder notation|writing a set by a rule, such as {x : x > 3}}}. The solution x > 3 is written as <strong>{x : x > 3}</strong>, read “the set of all x such that x is greater than 3”. If x must be a whole number or integer, say so: {x : x > 3, x ∈ ℤ}.</p><p>On a number line, use an open circle for < and >, and a filled circle for ≤ and ≥.</p>',visual:NLI('≥',-2),
     example:{q:'Solve 5 − 3x ≤ 11, and write the solution in set builder notation.',steps:[{do:'Subtract 5: −3x ≤ 6.'},{do:'Divide by −3 and REVERSE the sign: x ≥ −2.'},{do:'Solution: {x : x ≥ −2}.'}]},
     mistake:'Forgetting to reverse the sign when dividing by a negative: −3x ≤ 6 gives x ≥ −2, not x ≤ −2.',
     check:{q:'Solve 2x + 7 > 1.',o:['{x : x > −3}','{x : x < −3}','{x : x > 4}'],a:0,why:'2x > −6, so x > −3.',hint:'Subtract 7, then divide by 2.'}},
    {title:'Changing the subject, including powers and roots',explain:'<p>To change the {{subject|the variable on its own on one side}} of a formula, undo what has been done to the letter you want, step by step, in the reverse order. Do the same to both sides each time.</p><p>Powers and roots undo each other. If the letter is <strong>squared</strong> or <strong>cubed</strong>, take the square root or cube root of both sides. If it is under a <strong>square root</strong>, square both sides.</p><p>For the sphere formula V = 4/3πr³: multiply both sides by 3 (3V = 4πr³), divide by 4π (r³ = 3V/4π), then take the cube root: <strong>r = ∛(3V/4π)</strong>. For the pendulum formula T = 2π√(l/g): divide by 2π, square both sides (T²/4π² = l/g), then multiply by g: <strong>l = gT²/(4π²)</strong>.</p>',
     example:{q:'Make x the subject of P = c/(2x), one of the syllabus formulae.',steps:[{do:'Multiply both sides by 2x: 2xP = c.',why:'This gets x out of the denominator.'},{do:'Divide both sides by 2P: x = c/(2P).'}]},
     mistake:'Taking the square root of each term separately: if y² = a² + b², then y = √(a² + b²), NOT a + b.',
     check:{q:'Make r the subject of A = πr².',o:['r = √(A/π)','r = A/(2π)','r = √A − π'],a:0,why:'Divide by π, then square-root.',hint:'Undo the squaring last.'}},
    {title:'Solving worded problems',explain:'<p>CSEC often hides an equation or inequality inside a story. The method is always the same.</p><p><strong>1.</strong> Decide what the unknown is, and choose a letter for it. <strong>2.</strong> Translate the story into an equation or inequality, piece by piece. <strong>3.</strong> Solve it. <strong>4.</strong> Answer the question in words, with units, and check that it makes sense.</p><p>Watch for clue words. “Is”, “equals” and “costs the same” mean =. “At least” means ≥, and “at most” or “no more than” mean ≤. “Consecutive numbers” are n, n + 1, n + 2.</p>',
     example:{q:'Three consecutive integers add up to 72. Find them.',steps:[{do:'Let them be n, n + 1 and n + 2.'},{do:'n + (n + 1) + (n + 2) = 72, so 3n + 3 = 72.'},{do:'3n = 69, n = 23. The integers are 23, 24 and 25. Check: 72 ✓'}]},
     mistake:'Stopping at n = 23. Answer the actual question: all three numbers.',
     check:{q:'A taxi charges $150 plus $60 per km. The fare was $690. How many km?',o:['9','11.5','14'],a:0,why:'150 + 60k = 690, so 60k = 540.',hint:'Write 150 + 60k = 690.'}}]}]},
