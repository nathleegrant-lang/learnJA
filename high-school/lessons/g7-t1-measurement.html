     init:function(box,api){var U={len:[['km',1000],['m',1],['cm',0.01],['mm',0.001]],mass:[['kg',1000],['g',1],['mg',0.001]],cap:[['L',1],['mL',0.001]]};var q=box.querySelector('#ucQ'),f=box.querySelector('#ucF'),t=box.querySelector('#ucT'),v=box.querySelector('#ucV'),out=box.querySelector('.ucOut');function fill(){var u=U[q.value];f.innerHTML=u.map(function(x,i){return'<option value="'+i+'">'+x[0]+'</option>'}).join('');t.innerHTML=f.innerHTML;f.value=0;t.value=1;draw()}function fmt(n){return(Math.round(n*1e6)/1e6).toLocaleString('en-JM',{maximumFractionDigits:6})}function draw(){var u=U[q.value],a=u[+f.value],b=u[+t.value],x=+v.value,r=x*a[1]/b[1],k=a[1]/b[1];var how=k>1?'1 '+a[0]+' = '+fmt(k)+' '+b[0]+'. You are changing to a SMALLER unit, so you need MORE of them: <strong>multiply by '+fmt(k)+'</strong>.':k<1?'1 '+b[0]+' = '+fmt(1/k)+' '+a[0]+'. You are changing to a BIGGER unit, so you need FEWER of them: <strong>divide by '+fmt(1/k)+'</strong>.':'Same unit: no change.';out.innerHTML='<strong>'+fmt(x)+' '+a[0]+' = '+fmt(r)+' '+b[0]+'</strong><br>'+how}[q,f,t].forEach(function(e){e.addEventListener('change',e===q?fill:draw)});v.addEventListener('input',draw);var T=[{t:'Change 3.5 m to centimetres.',a:350},{t:'Change 2,400 g to kilograms.',a:2.4},{t:'Change 0.75 L to millilitres.',a:750},{t:'Change 45 mm to centimetres.',a:4.5}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.ucN').textContent='All done';box.querySelector('.ucTask').textContent='You completed every challenge!';box.querySelector('.ucC').disabled=true;return}box.querySelector('.ucN').textContent='Challenge '+(k+1)+' of 4';box.querySelector('.ucTask').textContent=T[k].t}box.querySelector('.ucC').onclick=function(){var fb=box.querySelector('.ucFb'),x=parseFloat(String(box.querySelector('.ucA').value).replace(/,/g,''));if(Math.abs(x-T[k].a)<1e-6){fb.className='fb ok ucFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.ucA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no ucFb';fb.textContent='Not yet. Set up the converter with these units and read the answer, then think about why it multiplies or divides.'}};fill();task()}}]},
  {phase:'explain',name:'Teach: measuring and converting',title:'Learn: units, instruments and converting',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Bigger unit to smaller unit: multiply. Smaller to bigger: divide.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Instruments and units',explain:'<p>Every time you measure something, you need two things: the right tool and the right unit. A doctor uses a scale to weigh a baby, a carpenter uses a tape measure for a door frame, and a cook uses a measuring jug for juice.</p><p>Most of the world, including Jamaica, uses the {{metric system|units based on 10s: metres, grams and litres}}. For <strong>length</strong>, we use millimetres, centimetres, metres and kilometres, measured with a ruler or tape. For <strong>mass</strong> (how heavy something is), we use grams and kilograms, measured on a scale. For <strong>capacity</strong> (how much a container holds), we use millilitres and litres, measured with a jug or cylinder. Time is measured with a clock or stopwatch, and temperature with a thermometer, in °C.</p><p>Choosing a sensible unit matters too. You would measure a pencil in centimetres, but a trip to Montego Bay in kilometres. A good unit gives you a number that is easy to understand.</p>',
     example:{q:'Choose an instrument and a unit for: (a) the mass of a newborn baby; (b) the distance from Kingston to Ocho Rios.',steps:[{do:'(a) Mass is measured with a scale. A baby weighs a few kilograms, so use kg.',why:'Grams would give a very big number (about 3,200 g).'},{do:'(b) A long distance is measured in km, for example with a car\'s odometer or a map.',why:'Metres would give a huge number.'}]},
     mistake:'Choosing a unit that is far too small or too big, such as measuring a road in millimetres.',
     check:{q:'Which unit is best for the capacity of a teaspoon?',o:['mL','L','kg'],a:0,why:'A teaspoon holds about 5 mL. Litres are far too big, and kg measures mass.',hint:'Is a teaspoon\'s capacity small or large?'}},
    {title:'Converting metric units',explain:'<p>The metric system was designed to be easy, because everything goes up in tens. The beginning of each unit’s name tells you how big it is: {{kilo-|a thousand}} means a thousand, so a kilometre is 1,000 metres. {{Centi-|a hundredth}} means a hundredth, so there are 100 centimetres in a metre. {{Milli-|a thousandth}} means a thousandth, so there are 1,000 millilitres in a litre.</p><p>When you convert, ask yourself one question: am I changing to a smaller unit or a bigger one? Think about it with money. One $1,000 note is worth the same as a thousand $1 coins; when you change to the smaller coin, you need <em>more</em> of them. It is the same with units. Changing to a <strong>smaller unit</strong>, you need more of them, so <strong>multiply</strong>. Changing to a <strong>bigger unit</strong>, you need fewer, so <strong>divide</strong>.</p><p>The staircase picture helps: going down the stairs to smaller units, multiply; climbing up to bigger units, divide.</p>',visual:STAIRS,
     example:{q:'Change 2.5 km to metres, and 3,750 g to kilograms.',steps:[{do:'2.5 km → m: m is smaller than km, so multiply by 1,000.',why:'Each km contains 1,000 m, so there will be MORE metres.'},{do:'2.5 × 1,000 = 2,500 m.'},{do:'3,750 g → kg: kg is bigger, so divide by 1,000.',why:'It takes 1,000 g to make each kg, so there will be FEWER kilograms.'},{do:'3,750 ÷ 1,000 = 3.75 kg.'}]},
     mistake:'Dividing when you should multiply. Ask: "Am I changing to a smaller unit?" If yes, the number must get BIGGER.',
     check:{q:'Change 4.2 m to centimetres.',o:['0.042 cm','42 cm','420 cm'],a:2,why:'cm are smaller, so multiply by 100: 4.2 × 100 = 420 cm.',hint:'1 m = 100 cm. Is the new unit smaller or bigger?'}},
    {title:'Converting square units',explain:'<p>Here is a puzzle that catches out even adults. 1 metre is 100 centimetres. So is 1 square metre the same as 100 square centimetres? It sounds right, but it is not!</p><p>Picture a square, 1 metre on each side. Now cover it with tiny squares, each 1 cm on each side. Along the bottom edge, you can fit 100 tiny squares, because 1 m = 100 cm. But you also need 100 rows of them to reach the top! So you need 100 × 100 = <strong>10,000</strong> tiny squares. That means 1 m² = 10,000 cm².</p><p>The same thing happens with smaller units: a 1 cm square is 10 mm by 10 mm, so 1 cm² = 10 × 10 = 100 mm².</p><p>The secret is that an area has two directions, length and width, so you have to convert <strong>both</strong>. That is why the sticker puzzle had such a huge answer.</p>',visual:GRID,
     example:{q:'The Engage puzzle: a floor is 8 m by 6 m. How many 1 cm² stickers cover it?',steps:[{do:'Area in m²: 8 × 6 = 48 m².'},{do:'1 m² = 10,000 cm².',why:'1 m² is 100 cm by 100 cm.'},{do:'48 × 10,000 = 480,000 cm². So 480,000 stickers!'},{do:'Check another way: 800 cm × 600 cm = 480,000 cm² ✓. Was your prediction right?'}]},
     mistake:'Thinking 1 m² = 100 cm². That converts only one side. A square metre is 100 cm long AND 100 cm wide.',
     check:{q:'Change 2 cm² to mm².',o:['20 mm²','200 mm²','2,000 mm²'],a:1,why:'1 cm² = 100 mm², so 2 cm² = 200 mm².',hint:'1 cm² = 10 × 10 mm².'}}]}]},
  {phase:'explain',name:'Teach: composite shapes',title:'Learn: perimeter and area of composite shapes',lead:'Now let\'s measure shapes made from rectangles, like L-shaped rooms and yards.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Find di missing side dem first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Perimeter of a composite shape',explain:'<p>Not every room or yard is a neat rectangle. Many houses have L-shaped rooms, and some school compounds are all sorts of shapes. A shape made by joining simpler shapes together is called a {{composite shape|a shape made by joining simpler shapes}}.</p><p>The perimeter is still just the distance all the way around the outside, as if you were walking along the fence. The tricky part is that a drawing often does not label every side. Before you add, you have to be a bit of a detective and work out the missing sides.</p><p>Here is the trick. Look at the opposite side that is fully labelled. The pieces on one side must add up to the whole length on the other side. For example, if the bottom of an L-shape is 10 m long, then the two top pieces together must also make 10 m.</p><p>Once every side has a number, walk around the shape and tick each side as you add it, so you don’t miss any.</p>',visual:LSHAPE({top:'? m',right:'? m'}),
     example:{q:'Find the perimeter of the L-shaped floor (10 m by 8 m, with a 4 m by 3 m corner cut out).',steps:[{do:'Missing top side: 10 − 4 = 6 m.',why:'The top side and the notch together make the full 10 m width.'},{do:'Missing right side: 8 − 3 = 5 m.',why:'The right side and the notch drop together make the full 8 m height.'},{do:'Add all six sides: 10 + 5 + 4 + 3 + 6 + 8 = 36 m.'},{do:'Interesting: that is the same as the full 10 by 8 rectangle (2 × 18 = 36 m). Cutting a corner notch moves edges, but does not change the perimeter.'}]},
     mistake:'Adding only the labelled sides. Every edge around the outside counts, including the ones you had to work out.',
     check:{q:'An L-shape has sides of 7 cm, 3 cm, 4 cm, 2 cm, 3 cm and 5 cm. What is its perimeter?',o:['19 cm','24 cm','84 cm'],a:1,why:'7 + 3 + 4 + 2 + 3 + 5 = 24 cm.',hint:'Add all six sides.'}},
    {title:'Area by splitting',explain:'<p>You already know how to find the area of a rectangle: length × width. So when you meet a composite shape, the easiest plan is to turn it into shapes you already know.</p><p>Draw a line to cut the shape into rectangles. Then work out the length and width of each piece, find each area, and add them together. It is like cutting a slice of cake into two pieces to measure them more easily: the total amount of cake does not change.</p><p>The most important step is checking the measurements of each piece. When you cut an L-shape, one of the rectangles is often shorter than the whole shape, so be careful to use its own height, not the height of the whole shape. Labelling each piece before you multiply helps you get it right.</p>',visual:LSHAPE({split:true}),
     example:{q:'Find the area of the L-shaped floor by splitting it.',steps:[{do:'Split it with a vertical line into a left piece and a right piece.'},{do:'Left piece: 6 m wide and 8 m tall: 6 × 8 = 48 m².'},{do:'Right piece: 4 m wide and 5 m tall: 4 × 5 = 20 m².',why:'The right piece is only as tall as the right side, 5 m.'},{do:'Total area = 48 + 20 = 68 m².'}]},
     mistake:'Using the wrong height for one of the pieces. Check that each piece\'s measurements match its own sides.',
     check:{q:'A shape is made of a 5 m × 4 m rectangle and a 3 m × 2 m rectangle. What is its area?',o:['26 m²','20 m²','14 m²'],a:0,why:'20 + 6 = 26 m².',hint:'Find each area, then add.'}},
    {title:'Area by subtracting',explain:'<p>Sometimes splitting is not the quickest way. Imagine a big rectangle with a small corner bitten out of it. Instead of cutting it into pieces, you can work out the area of the whole rectangle, as if the corner were still there, and then <strong>take away</strong> the bit that is missing.</p><p>This is also the best way to deal with shapes that have holes. Think of a lawn with a swimming pool in the middle, or a wall with a window in it. Find the area of the whole lawn or wall, then subtract the area of the pool or window.</p><p>A nice bonus: you can use both methods on the same shape and compare. If splitting and subtracting give the same answer, you can be confident you are right.</p>',visual:LSHAPE({sub:true}),
     example:{q:'Find the area of the L-shaped floor by subtracting.',steps:[{do:'Whole rectangle: 10 × 8 = 80 m².'},{do:'Missing corner: 4 × 3 = 12 m².'},{do:'Area = 80 − 12 = 68 m².',why:'The same answer as splitting: a good way to check your work.'}]},
     mistake:'Adding the missing piece instead of subtracting it.',
     check:{q:'A garden is 12 m by 9 m. A 4 m by 3 m pool is in the middle. What is the area of grass?',o:['96 m²','108 m²','120 m²'],a:0,why:'108 − 12 = 96 m².',hint:'Whole garden minus the pool.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Metric links',text:'1 km = 1,000 m; 1 m = 100 cm; 1 cm = 10 mm; 1 kg = 1,000 g; 1 L = 1,000 mL.'},{title:'Which way?',text:'To a smaller unit: multiply. To a bigger unit: divide. For example, 6 m = 600 cm, and 600 cm = 6 m.'},{title:'Square units',text:'1 cm² = 100 mm² and 1 m² = 10,000 cm², because you convert the length AND the width.'},{title:'Composite shapes',text:'Perimeter: find missing sides, then add every outside edge. Area: split into rectangles and add, or subtract a missing piece from a whole rectangle.'}]},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire conversions and area questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},P=[['m','cm',100],['km','m',1000],['cm','mm',10],['kg','g',1000],['L','mL',1000]],p=P[R(0,4)],r=R(0,2);var f=function(n){return(Math.round(n*1000)/1000).toLocaleString('en-JM')};if(r===0){var x=R(2,95)/10;return{q:f(x)+' '+p[0]+' = ? '+p[1],o:[f(x*p[2]),f(x/p[2]),f(x*p[2]/10)],a:0,why:'Smaller unit: multiply by '+p[2]+'.'}}if(r===1){var y=R(1,99)*p[2]/10;return{q:f(y)+' '+p[1]+' = ? '+p[0],o:[f(y/p[2]),f(y*p[2]),f(y/p[2]*10)],a:0,why:'Bigger unit: divide by '+p[2]+'.'}}var a=R(3,12),b=R(2,9),c=R(1,a-1),d=R(1,b-1);return{q:'A '+a+' m × '+b+' m rectangle has a '+c+' m × '+d+' m corner cut out. Area?',o:[(a*b-c*d)+' m²',(a*b)+' m²',(a*b+c*d)+' m²'],a:0,why:a*b+' − '+c*d+' = '+(a*b-c*d)+' m².'}}}},
