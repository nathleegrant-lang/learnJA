   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="rsK">Batch size (times the basic recipe):</label><input type="range" id="rsK" min="1" max="8" value="1"><output class="big rsKO"></output></div><div class="scene rsSvg"></div><div class="explain rsX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge rsN"></span> <strong class="rsQ"></strong></p><div class="controls"><input type="number" class="rsA" aria-label="Your answer" placeholder="answer"><button type="button" class="go rsC">Check</button></div><div class="fb rsFb" aria-live="polite">Use the scaler to help you.</div></div>',
     init:function(box,api){var K=box.querySelector('#rsK');api.nudges(K);function draw(){var k=+K.value;box.querySelector('.rsKO').textContent='× '+k;box.querySelector('.rsSvg').innerHTML=JARS(k);box.querySelector('.rsX').innerHTML='Papaya : sugar : coconut oil = <strong>'+2*k+' : '+k+' : '+3*k+'</strong>. Every part is multiplied by the same scale factor, '+k+', so the ratio still simplifies to 2 : 1 : 3. Total: <strong>'+6*k+' tablespoons</strong>.'}K.addEventListener('input',draw);var T=[{t:'They use 9 tablespoons of coconut oil. How much papaya pulp do they need?',a:6},{t:'They want 30 tablespoons of moisturiser altogether. How much brown sugar is needed?',a:5},{t:'They use 12 tablespoons of coconut oil. How much papaya is needed? (The opening puzzle.)',a:8}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.rsN').textContent='All done';box.querySelector('.rsQ').textContent='You completed every challenge!';box.querySelector('.rsC').disabled=true;return}box.querySelector('.rsN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.rsQ').textContent=T[q].t}box.querySelector('.rsC').onclick=function(){var v=+box.querySelector('.rsA').value,fb=box.querySelector('.rsFb');if(v===T[q].a){fb.className='fb ok rsFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.rsA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no rsFb';fb.textContent='Not yet. Find the batch size that matches the amount you know, then read the other amounts.'}};draw();task()}},
    {type:'recall',text:'12 tablespoons of coconut oil is 4 times the basic 3, so they need 4 × 2 = 8 tablespoons of papaya. (Adding 9 to the 2 to make 11 would spoil the recipe!)'}]},
  {phase:'explain',name:'Teach: finding unknowns',title:'Learn: unknowns, proportion equations and the unitary method',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Multiply every part by di same number.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Finding an unknown with equivalent ratios',explain:'<p>In the recipe scaler, you saw that when the batch grows, every ingredient is multiplied by the same number. That number is the {{scale factor|the number you multiply every part of a ratio by}}. Ratios made this way are {{equivalent ratios|ratios that simplify to the same thing}}: 2 : 1 : 3 and 8 : 4 : 12 describe exactly the same recipe.</p><p>So to find an unknown amount, ask: “What did I multiply by to get from the ratio to the amount I know?” Then multiply the other parts by the same number.</p><p>For the opening puzzle: coconut oil went from 3 to 12, so the scale factor is 12 ÷ 3 = 4. The papaya must also be multiplied by 4: 2 × 4 = 8 tablespoons.</p><p>Notice that we <strong>multiply</strong>, never add. Adding 9 to every part would give 11 : 10 : 12, a completely different recipe.</p>',visual:JARS(4),
     example:{q:'Cement and sand are mixed in the ratio 1 : 4. A builder uses 6 bags of cement. How many bags of sand?',steps:[{do:'Cement went from 1 to 6, so the scale factor is 6.'},{do:'Multiply the sand by the same scale factor: 4 × 6 = 24 bags.',why:'Every part of a ratio grows by the same multiplier.'}]},
     mistake:'Adding instead of multiplying. To go from 1 : 4 to 6 : ?, you do not add 5 to get 9; you multiply by 6 to get 24.',
     check:{q:'Boys : girls = 3 : 5. There are 15 boys. How many girls?',o:['25','17','9'],a:0,why:'Scale factor 5, so 5 × 5 = 25 girls.',hint:'3 became 15. What did you multiply by?'}},
    {title:'Writing proportion equations',explain:'<p>Sometimes the scale factor is not a nice whole number. Then it helps to write the problem as an equation. A {{proportion|an equation saying two ratios are equal}} says that two ratios are equal, and we can write each ratio as a fraction.</p><p>Suppose papaya : coconut oil = 2 : 3, and you have 10 tablespoons of papaya. How much oil? Let the oil be x. Then <strong>2/3 = 10/x</strong>, with papaya on top both times and oil on the bottom both times.</p><p>To solve it, “cross-multiply”: multiply each top by the opposite bottom. 2 × x = 3 × 10, so 2x = 30 and x = 15 tablespoons. The golden rule: keep the same quantity in the same place on both sides.</p>',
     example:{q:'A map uses 2 cm for every 5 km. Two towns are 7 cm apart on the map. How far apart are they really?',steps:[{do:'Write the proportion with cm on top both times: 2/5 = 7/x.'},{do:'Cross-multiply: 2x = 5 × 7 = 35.'},{do:'x = 17.5 km.'}]},
     mistake:'Mixing up the positions: 2/5 = x/7 puts the km in different places on each side, which gives the wrong answer.',
     check:{q:'Solve the proportion 3/4 = 9/x.',o:['12','6.75','36'],a:0,why:'3x = 36, so x = 12.',hint:'Cross-multiply: 3 × x = 4 × 9.'}},
    {title:'The unitary method and direct proportion',explain:'<p>Here is a method that works for almost any proportion problem, and it is easy to remember. The {{unitary method|finding the value of ONE first, then multiplying up}} has two steps: first find the value of <strong>one</strong>, then multiply up to however many you need.</p><p>If 2 jars of moisturiser cost $900, then 1 jar costs $900 ÷ 2 = $450, and 5 jars cost 5 × $450 = $2,250.</p><p>This works because the cost and the number of jars are in {{direct proportion|when one quantity doubles, the other doubles too}}: twice as many jars cost twice as much, and half as many cost half as much. Most everyday buying and cooking problems are like this.</p>',
     example:{q:'A recipe for 6 people needs 450 g of flour. How much flour for 10 people?',steps:[{do:'Flour for 1 person: 450 ÷ 6 = 75 g.',why:'Find the value of one first.'},{do:'Flour for 10 people: 10 × 75 = 750 g.'}]},
     mistake:'Multiplying straight away by the new number: 450 × 10. Always find the value of ONE first.',
     check:{q:'4 bottles of juice cost $560. How much do 7 bottles cost?',o:['$980','$140','$3,920'],a:0,why:'1 bottle = $140; 7 × $140 = $980.',hint:'Find the cost of 1 bottle first.'}}]}]},
  {phase:'explain',name:'Teach: sharing and inverse proportion',title:'Learn: sharing problems and inverse proportion',lead:'Next, harder sharing problems, and a different kind of proportion where one thing goes down as the other goes up.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'More worker, less day. Dat a inverse proportion.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Sharing in three parts',explain:'<p>In Grade 7, you shared amounts in two-part ratios. Three parts work exactly the same way. Say the moisturiser business makes $12,000 profit, shared by three partners in the ratio 2 : 1 : 3, according to how much each one put in.</p><p>The plan is the same as before. <strong>Add the parts</strong> to find the total number of equal shares: 2 + 1 + 3 = 6. <strong>Find one share</strong>: $12,000 ÷ 6 = $2,000. <strong>Multiply</strong> each part: $4,000, $2,000 and $6,000.</p><p>Always finish with a check: $4,000 + $2,000 + $6,000 = $12,000. If your shares do not add back to the total, something has gone wrong.</p>',
     example:{q:'Share 48 jars between three shops in the ratio 3 : 4 : 5.',steps:[{do:'Total parts: 3 + 4 + 5 = 12.'},{do:'One part: 48 ÷ 12 = 4 jars.'},{do:'Shares: 3 × 4 = 12, 4 × 4 = 16, 5 × 4 = 20 jars. Check: 48 ✓'}]},
     mistake:'Dividing the total by the number of people (3) instead of the number of parts (12).',
     check:{q:'Share $900 in the ratio 1 : 2 : 6. What is the largest share?',o:['$600','$300','$450'],a:0,why:'9 parts of $100: 6 × $100 = $600.',hint:'Add the parts: 1 + 2 + 6.'}},
    {title:'When you know one share or the difference',explain:'<p>Sometimes a question does not tell you the total. Instead, it tells you one person’s share, or how much more one person got than another. Do not panic: use the parts.</p><p><strong>If you know one share:</strong> say Kemar and Tia share money in the ratio 3 : 5, and Kemar gets $1,200. Kemar has 3 parts, so 1 part is $1,200 ÷ 3 = $400. Tia has 5 parts: $2,000.</p><p><strong>If you know the difference:</strong> say Tia gets $800 more than Kemar. In the ratio 3 : 5, the difference is 5 − 3 = 2 parts. So 2 parts = $800, 1 part = $400, and you can find anything you need.</p><p>In both cases, the key move is the same: work out what <strong>one part</strong> is worth.</p>',
     example:{q:'Boys and girls in a club are in the ratio 4 : 7. There are 21 more girls than boys. How many members altogether?',steps:[{do:'The difference is 7 − 4 = 3 parts.'},{do:'3 parts = 21, so 1 part = 7.',why:'Find what one part is worth.'},{do:'Total = 11 parts = 11 × 7 = 77 members.'}]},
     mistake:'Dividing the known share by the total number of parts. If Kemar’s $1,200 is 3 parts, divide by 3, not by 8.',
     check:{q:'A : B = 2 : 3, and A gets $500. How much does B get?',o:['$750','$333','$1,250'],a:0,why:'1 part = $250, so B = 3 × $250 = $750.',hint:'A is 2 parts. What is 1 part?'}},
    {title:'Inverse proportion',explain:'<p>Not every relationship works the “double and double” way. Think about painting a classroom. If 1 painter takes 12 hours, would 2 painters take 24 hours? Of course not! With twice as many people, the job takes <strong>half</strong> the time: 6 hours.</p><p>This is {{inverse proportion|when one quantity doubles, the other halves}}: as one quantity goes up, the other goes down in the same proportion. Double one, and the other halves. Triple one, and the other is divided by 3.</p><p>The trick for inverse proportion is to find the <strong>total amount of work</strong> first. 1 painter × 12 hours = 12 painter-hours. That total stays the same, however you share it. So 3 painters would take 12 ÷ 3 = 4 hours.</p><p>Always ask: “If I had more of this, would I get more or less of that?” More gives more: direct. More gives less: inverse.</p>',
     example:{q:'4 workers can build a wall in 6 days. How long would 3 workers take?',steps:[{do:'Fewer workers means MORE days: this is inverse proportion.'},{do:'Total work: 4 workers × 6 days = 24 worker-days.'},{do:'With 3 workers: 24 ÷ 3 = 8 days.'}]},
     mistake:'Treating inverse proportion like direct: “fewer workers, fewer days” makes no sense. Think about what really happens.',
     check:{q:'2 pumps empty a tank in 10 hours. How long would 5 pumps take?',o:['4 hours','25 hours','7 hours'],a:0,why:'Total 20 pump-hours ÷ 5 = 4 hours.',hint:'More pumps means less time.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Unknowns',text:'Find the scale factor (new ÷ old) and multiply every part by it. Or write a proportion, such as 2/3 = 10/x, and cross-multiply.'},{title:'Unitary method',text:'Find the value of ONE, then multiply up. 2 jars cost $900, so 1 costs $450 and 5 cost $2,250.'},{title:'Sharing',text:'Total known: add the parts. One share or the difference known: find what ONE part is worth first.'},{title:'Direct or inverse?',text:'Direct: more gives more (cost and items). Inverse: more gives less (workers and days). For inverse, find the total work first.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Papaya : sugar : oil = 2 : 1 : 3. The group uses 15 tbsp of oil. How much papaya and sugar?',steps:[{do:'Oil went from 3 to 15: scale factor 5.'},{do:'Papaya: 2 × 5 = 10 tbsp. Sugar: 1 × 5 = 5 tbsp.'}]},
     {type:'fill',q:'Solve the proportion 5/8 = x/24.',steps:[{text:'Cross-multiply: 8x = 5 × 24 = 120.'},{text:'x = 120 ÷ 8 = ___',blank:true,a:15,hint:'120 ÷ 8.'}],sol:'15.'},

  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Direct or inverse?',desc:'Sort each situation.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'More of one gives more of the other → direct. More gives less → inverse.',bins:[{id:'d',label:'Direct proportion'},{id:'i',label:'Inverse proportion'}],items:[{label:'Number of patties and their total cost',bin:'d'},{label:'Number of painters and hours to paint a room',bin:'i'},{label:'Litres of petrol and distance driven',bin:'d'},{label:'Speed of a bus and time for the journey',bin:'i'},{label:'Hours worked and wages earned',bin:'d'},{label:'People sharing a pizza and slices each',bin:'i'}]}},
    {icon:'🃏',title:'Match the equivalent ratios',desc:'Match each ratio to an equivalent one.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['2 : 1 : 3','8 : 4 : 12'],['1 : 4','6 : 24'],['3 : 5','15 : 25'],['2 : 7','10 : 35'],['5 : 2','20 : 8'],['1 : 2 : 6','3 : 6 : 18']]}},
    {icon:'📏',title:'Order the shares',desc:'Work out each share, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'$12,000 profit is shared by four partners in the ratio 1 : 2 : 4 : 5. Work out each share, then tap from smallest to largest.',rounds:[[{label:'Partner A (1 part)',v:1000,show:'$1,000'},{label:'Partner B (2 parts)',v:2000,show:'$2,000'},{label:'Partner C (4 parts)',v:4000,show:'$4,000'},{label:'Partner D (5 parts)',v:5000,show:'$5,000'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Adding the same number to every part of a ratio keeps it the same.',a:'never',why:'You must MULTIPLY. 1 : 2 becomes 6 : 7 if you add 5, which is a different ratio. (Unless the ratio is 1 : 1.)',hint:'Try 1 : 2.'},{s:'Multiplying every part of a ratio by the same number keeps it the same.',a:'always',why:'That makes an equivalent ratio.'},{s:'More workers means the job takes longer.',a:'never',why:'More workers share the work, so it takes less time (inverse proportion).'},{s:'If 3 items cost $x, then 6 items cost $2x.',a:'always',why:'Cost and number of items are in direct proportion.'},{s:'In a sharing problem, you need to know the total.',a:'sometimes',why:'You can also share if you know one share or the difference.',hint:'Look back at Kemar and Tia.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jordan',q:'Cement : sand = 1 : 4. With 6 bags of cement, how much sand?',lines:['Cement went up by 5','So sand = 4 + 5 = 9 bags'],wrong:0,reasons:['Ratios scale by MULTIPLYING: the scale factor is 6, so 24 bags','He should subtract','Sand should be 6 bags'],reason:0,fix:'4 × 6 = 24 bags.'},{who:'Keisha',q:'3 painters take 8 hours. How long for 6 painters?',lines:['Twice as many painters','So twice as long: 16 hours'],wrong:1,reasons:['This is inverse proportion: twice the painters means half the time','The answer should be 11 hours','She should add 3'],reason:0,fix:'24 painter-hours ÷ 6 = 4 hours.'},{who:'Andre',q:'A : B = 3 : 5 and A gets $600. Find B.',lines:['Total parts = 8','1 part = $600 ÷ 8 = $75'],wrong:1,reasons:['A’s $600 is 3 parts, so 1 part = $600 ÷ 3 = $200','8 should be 15','He should multiply by 8'],reason:0,fix:'1 part = $200, so B = $1,000.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire ratio and proportion.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,5),b=R(2,7),k=R(2,8);if(a===b)b++;return{q:a+' : '+b+' = '+a*k+' : ?',o:[String(b*k),String(b+a*k-a),String(b*k+k)],a:0,why:'Scale factor '+k+'.'}}if(r===1){var n=R(2,6),p=R(2,9)*50,m=R(2,9);if(m===n)m++;return{q:n+' items cost $'+n*p+'. Cost of '+m+'?',o:['$'+m*p,'$'+n*p*m,'$'+(n*p+m)],a:0,why:'1 item = $'+p+'.'}}var w=R(2,6),d=R(2,6)*2,w2=[2,3,4,6,8,12,1].filter(function(x){return(w*d)%x===0&&x!==w})[0];return{q:w+' workers take '+d+' days. How long for '+w2+' workers?',o:[String(w*d/w2)+' days',String(d*w2/w)+' days',String(d+w2)+' days'],a:0,why:'Total '+w*d+' worker-days ÷ '+w2+'.'}}}},
