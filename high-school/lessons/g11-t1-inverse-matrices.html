var ISK={A:EQ('X = B ÷ A',false,'divide by the matrix?','Sketch A: X equals B divided by A'),B:EQ('X = B A⁻¹',false,'inverse on the right?','Sketch B: X equals B times the inverse of A'),C:EQ('X = A⁻¹ B',true,'inverse on the LEFT','Sketch C: X equals the inverse of A times B')};
var IFB={A:'Not this one. There is no such thing as dividing by a matrix. Instead, we multiply by its INVERSE, the matrix that undoes A, just as dividing by 5 is the same as multiplying by 1/5.',B:'Close, but the order matters. In AX = B, A is on the LEFT of X, so the inverse must go on the LEFT too: A⁻¹AX = A⁻¹B, so X = A⁻¹B. Here, B A⁻¹ cannot even be worked out: a 2 × 1 times a 2 × 2 is not conformable.',C:'Yes! Multiply both sides of AX = B on the LEFT by A⁻¹: A⁻¹AX = A⁻¹B, and A⁻¹A = I, so X = A⁻¹B. The inverse goes on the same side as A.'};
var STORY_I=STORYBLOCK({story:'"A shopper buys 2 patties and 1 juice for $650. Her friend buys 1 patty and 3 juices for $700. In matrix form: (2 1; 1 3)(p; j) = (650; 700), that is, AX = B." Which sketch shows how to find X, the prices?',sk:ISK,fb:IFB,correct:'C',p2title:'Test the prices.',p2lead:'Try prices for a patty (p) and a juice (j). The matrix A multiplies your guess, X, to give AX. When AX matches B = (650; 700) exactly, you have found the prices.',p2html:'<div class="controls"><label for="ipP">Patty price p ($):</label><input type="range" id="ipP" min="100" max="400" step="10" value="200"><output class="big ipPO"></output><label for="ipJ">Juice price j ($):</label><input type="range" id="ipJ" min="50" max="300" step="10" value="200"><output class="big ipJO"></output></div><div class="tile ipOut" aria-live="polite" style="font-size:1.05rem"></div>',goal:'find the prices that make AX exactly equal to B',done:'p = $250 and j = $150. Guessing took several tries; the inverse gives it at once: det A = 2 × 3 − 1 × 1 = 5, so A⁻¹ = (1/5)(3 −1; −1 2), and A⁻¹B = (1/5)(1,950 − 700; −650 + 1,400) = (250; 150).',

     init:function(box,api){var A=[[3,2],[1,4]],B=[[16],[12]];function grid(el,M){el.innerHTML='';M.forEach(function(r,i){r.forEach(function(x,j){var e=document.createElement('input');e.type='number';e.value=x;e.style.width='60px';e.setAttribute('aria-label','row '+(i+1)+' column '+(j+1));e.addEventListener('input',function(){M[i][j]=parseInt(e.value)||0;draw()});el.appendChild(e)})})}function draw(){var a=A[0][0],b=A[0][1],c=A[1][0],d=A[1][1],det=a*d-b*c,h='<strong>Equations:</strong> '+fi(a)+'x + '+fi(b)+'y = '+fi(B[0][0])+',  '+fi(c)+'x + '+fi(d)+'y = '+fi(B[1][0])+'<br><strong>|A|</strong> = ad − bc = ('+fi(a)+')('+fi(d)+') − ('+fi(b)+')('+fi(c)+') = <strong>'+fi(det)+'</strong><br>';if(det===0){h+='The determinant is 0, so A is <strong>singular</strong>: it has <strong>no inverse</strong>, and the equations do not have one unique solution (the lines are parallel or the same).'}else{var adj=[[d,-b],[-c,a]],inv=adj.map(function(r){return r.map(function(x){return FR(x,det)})}),x=(d*B[0][0]-b*B[1][0])/det,y=(-c*B[0][0]+a*B[1][0])/det;h+=MX(adj,'Adj(A)')+'  (swap a and d; change the signs of b and c)<br>'+MX(inv,'A⁻¹ = (1/'+fi(det)+') Adj(A)')+'<br>Check: AA⁻¹ = '+MX([[1,0],[0,1]])+' = I ✓<br><strong>X = A⁻¹B</strong>: x = '+fi(x)+', y = '+fi(y)}box.querySelector('.isOut').innerHTML=h}grid(box.querySelector('.isA'),A);grid(box.querySelector('.isB'),B);var T=[{t:'For A = (3 2; 1 4), what is the determinant?',ok:function(v){return parseFloat(v)===10}},{t:'What is the top-left element of A⁻¹, as a decimal?',ok:function(v){var m=v.match(/^(\d+)\/(\d+)$/);var n=m?m[1]/m[2]:parseFloat(v);return Math.abs(n-0.4)<0.001}},{t:'Solve 3x + 2y = 16 and x + 4y = 12. (Type x, y.)',ok:function(v){var n=v.replace(/[()\sxy=]/gi,'').split(',').map(Number);return n.length===2&&n[0]===4&&n[1]===2}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.isN').textContent='All done';box.querySelector('.isQ').textContent='You completed every challenge!';box.querySelector('.isC').disabled=true;return}box.querySelector('.isN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.isQ').textContent=T[q].t}box.querySelector('.isC').onclick=function(){var v=String(box.querySelector('.isIn').value).trim(),fb=box.querySelector('.isFb');if(T[q].ok(v)){fb.className='fb ok isFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.isIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no isFb';fb.textContent='Not yet. Use the starting values, A = (3 2; 1 4) and B = (16; 12), and read the results.'}};draw();task()}},
    {type:'recall',text:'We multiply by the inverse matrix A⁻¹, just as we multiply by 1/3 to undo multiplying by 3. If AX = B, then X = A⁻¹B. But if the determinant is 0, there is no inverse.'}]},
  {phase:'explain',name:'Teach: determinants and inverses',title:'Learn: the determinant and the inverse of a 2 × 2 matrix',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'ad minus bc. Swap a an d; change di sign a b an c.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The determinant',explain:PIC('A sign maker scans a square logo and stretches it on the computer with a matrix. The determinant of that matrix tells her, in one number, how much the AREA of the logo changes. A determinant of 6 means the stretched logo covers 6 times the area. A determinant of 0 means the logo has been squashed flat onto a line.',SCN['The determinant'])+'<p>Every square matrix has a single number attached to it, called its {{determinant|for (a b; c d), ad − bc}}. For a 2 × 2 matrix A = '+MX([['a','b'],['c','d']])+':</p><p><strong>|A| = det(A) = ad − bc</strong></p><p>Multiply down the leading diagonal (a × d), then subtract the product of the other diagonal (b × c).</p><p>If |A| = 0, the matrix is {{singular|determinant 0, no inverse}}: it has no inverse. If |A| ≠ 0, it is {{non-singular|determinant not 0, has an inverse}}. You will see in the next lesson on transformations that the determinant also tells you how much a shape’s area is scaled.</p>'+WHY('Why does ad − bc measure the change in area? The matrix (a b; c d) moves the unit square onto a parallelogram whose sides are the columns (a, c) and (b, d). Working out that parallelogram’s area gives exactly ad − bc. If it is 0, the two sides point along the same line, so the area has collapsed, and nothing can undo that.')+WORK('<strong>Computer graphics programmers</strong> use determinants to scale and flip images. <strong>Engineers</strong> check whether a system of equations has a unique solution. <strong>Map makers</strong> measure how much a map projection stretches areas.'),
     example:{q:'Find the determinants of P = (5 3; 2 4) and Q = (6 4; 3 2).',steps:[{do:'|P| = 5 × 4 − 3 × 2 = 20 − 6 = 14. Non-singular.'},{do:'|Q| = 6 × 2 − 4 × 3 = 12 − 12 = 0.'},{do:'Q is singular: it has no inverse.'}]},
     mistake:'Adding instead of subtracting: the determinant is ad − bc, not ad + bc.',
     check:{q:'Find |A| for A = (2 −1; 3 4).',o:['11','5','−11'],a:0,why:'8 − (−3) = 11.',hint:'ad − bc.'}},
    {title:'The multiplicative inverse',explain:PIC('Two friends send secret messages: they turn letters into numbers, then scramble pairs of numbers by multiplying them by a matrix A. To read a message, the friend needs a matrix that UNDOES A: its inverse, A⁻¹. Scramble with A, unscramble with A⁻¹, and the original message returns.',SCN['The multiplicative inverse'])+'<p>For numbers, the inverse of 5 is 1/5, because 5 × 1/5 = 1, and 1 is the identity for multiplication. For square matrices, the identity is I = '+MX([[1,0],[0,1]])+'.</p><p>So the syllabus defines the {{multiplicative inverse|A⁻¹ with AA⁻¹ = A⁻¹A = I}} of a non-singular square matrix A as the matrix <strong>A⁻¹</strong> such that:</p><p><strong>AA⁻¹ = A⁻¹A = I</strong></p><p>Only non-singular matrices have inverses, just as the number 0 has no reciprocal. To check whether two matrices are inverses of each other, multiply them: you should get I.</p>'+WHY('Why does A⁻¹A = I mean "undo"? The identity matrix I changes nothing, just like multiplying by 1. If A⁻¹A = I, then doing A and then A⁻¹ is the same as doing nothing at all. That is exactly what undoing means, and it is why 5 × 1/5 = 1 is the number version of the same idea.')+WORK('<strong>Cryptographers</strong> build codes that only the right key can undo. <strong>Computer graphics</strong> undo a transformation to move an object back. <strong>Engineers and economists</strong> use inverses to solve systems of equations.'),
     example:{q:'Show that (2 1; 1 1) and (1 −1; −1 2) are inverses.',steps:[{do:'Row 1: 2 × 1 + 1 × (−1) = 1; 2 × (−1) + 1 × 2 = 0.'},{do:'Row 2: 1 × 1 + 1 × (−1) = 0; 1 × (−1) + 1 × 2 = 1.'},{do:'The product is I, so they are inverses ✓'}]},
     mistake:'Thinking A⁻¹ means 1 ÷ each element. It is the matrix that multiplies with A to give I.',
     check:{q:'If AB = I, then B is…',o:['the inverse of A','the identity','the transpose of A'],a:0,why:'That is the definition.',hint:'AA⁻¹ = I.'}},
    {title:'Finding the inverse: determinant and adjoint',explain:PIC('Think of the inverse as a recipe with three steps. Swap the two numbers on the leading diagonal. Change the signs of the other two. Divide everything by the determinant. For A = (2 1; 1 3): swap to get (3 1; 1 2), change signs to get (3 −1; −1 2), and divide by the determinant, 5.',SCN['Finding the inverse: determinant and adjoint'])+'<p>The syllabus defines the {{adjoint|(d −b; −c a)}} of A = (a b; c d) as <strong>Adj(A) = (d −b; −c a)</strong>: <strong>swap</strong> a and d, and <strong>change the signs</strong> of b and c.</p><p>Then the inverse is:</p><p><strong>A⁻¹ = (1/|A|) × Adj(A)</strong></p><p>So the method is: <strong>1.</strong> Find the determinant (if it is 0, stop: there is no inverse). <strong>2.</strong> Write the adjoint. <strong>3.</strong> Multiply the adjoint by 1 over the determinant. <strong>4.</strong> Check that AA⁻¹ = I.</p>'+WHY('Why does this recipe work? Multiply A by the adjoint (d −b; −c a): the result is (ad − bc  0; 0  ad − bc), which is det A times the identity. Dividing by det A leaves exactly I. And it shows why det A = 0 is impossible: we cannot divide by zero.')+WORK('<strong>Programmers</strong> code this recipe into calculators and computer software. <strong>Engineers</strong> use it every time they solve a pair of linked equations. <strong>Scientists</strong> use it to separate two overlapping measurements.'),
     example:{q:'Find the inverse of A = (3 2; 1 4).',steps:[{do:'|A| = 12 − 2 = 10.'},{do:'Adj(A) = (4 −2; −1 3).'},{do:'A⁻¹ = (1/10)(4 −2; −1 3) = (0.4 −0.2; −0.1 0.3).'}]},
     mistake:'Swapping b and c instead of a and d. Swap the LEADING diagonal; change the signs of the other diagonal.',
     check:{q:'What is Adj(A) for A = (5 2; 3 1)?',o:['(1 −2; −3 5)','(5 −3; −2 1)','(−5 2; 3 −1)'],a:0,why:'Swap 5 and 1; negate 2 and 3.',hint:'Swap a and d.'}}]}]},
  {phase:'explain',name:'Teach: solving with matrices',title:'Learn: solving simultaneous equations with matrices',lead:'Next, the payoff: using the inverse to solve equations.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'X = A⁻¹B. Inverse pon di LEFT.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Writing equations in matrix form',explain:PIC('Two shopping receipts: 2 patties and 1 juice cost $650; 1 patty and 3 juices cost $700. The numbers of items make the matrix A = (2 1; 1 3), the unknown prices make X = (p; j), and the totals make B = (650; 700). The two equations become one matrix equation: AX = B.',SCN['Writing equations in matrix form'])+'<p>A pair of simultaneous equations can be written as one matrix equation. For:</p><p>3x + 2y = 16<br>x + 4y = 12</p><p>put the coefficients in a matrix A, the unknowns in a column X, and the right-hand sides in a column B:</p><p>'+MX([[3,2],[1,4]])+' '+MX([['x'],['y']])+' = '+MX([[16],[12]])+',  that is, <strong>AX = B</strong>.</p><p>Check by multiplying out the left side: row 1 gives 3x + 2y, and row 2 gives x + 4y. Make sure each equation is written with x first, then y, then the constant on the right.</p>'+WHY('Why does AX reproduce the equations? Row 1 of A times the column X is 2p + 1j: exactly the left side of the first receipt. Row 2 gives 1p + 3j. So writing AX = B is just a compact way of writing both equations at once, with the unknowns kept together.')+WORK('<strong>Shop owners and accountants</strong> work out unit prices and costs. <strong>Engineers</strong> write systems of equations for circuits and structures. <strong>Economists</strong> model linked markets with many equations at once.'),
     example:{q:'Write 2x − y = 7 and 5x + 3y = 1 in matrix form.',steps:[{do:'Coefficients: A = (2 −1; 5 3).'},{do:'Unknowns: X = (x; y). Right-hand sides: B = (7; 1).'},{do:'(2 −1; 5 3)(x; y) = (7; 1).'}]},
     mistake:'Forgetting the sign of a coefficient: in 2x − y, the coefficient of y is −1.',
     check:{q:'For x + 3y = 9 and 2x − y = 4, the matrix A is…',o:['(1 3; 2 −1)','(1 2; 3 −1)','(9; 4)'],a:0,why:'Rows are the equations.',hint:'Coefficients, row by row.'}},
    {title:'Solving: X = A⁻¹B',explain:PIC('Back to the receipts. Instead of guessing prices, the shopper uses the inverse: X = A⁻¹B = (1/5)(3 −1; −1 2)(650; 700) = (1/5)(1,250; 750) = (250; 150). A patty costs $250 and a juice $150, found in one calculation, with no guessing.',SCN['Solving: X = A⁻¹B'])+'<p>If AX = B, multiply both sides <strong>on the left</strong> by A⁻¹:</p><p>A⁻¹AX = A⁻¹B, so IX = A⁻¹B, so <strong>X = A⁻¹B</strong>.</p><p>The order matters, because matrix multiplication is not commutative: it must be A⁻¹B, not BA⁻¹ (which does not even exist here).</p><p>For our equations: A⁻¹ = (1/10)(4 −2; −1 3), so X = (1/10)(4 −2; −1 3)(16; 12) = (1/10)(64 − 24; −16 + 36) = (1/10)(40; 20) = (4; 2). So x = 4 and y = 2. Check: 3(4) + 2(2) = 16 ✓ and 4 + 4(2) = 12 ✓.</p>'+WHY('Why multiply on the LEFT? In AX = B, A sits on the left of X. To remove it, we must put A⁻¹ next to it, on the left: A⁻¹AX = A⁻¹B, and A⁻¹A = I, so IX = X. Putting A⁻¹ on the right would not cancel A, because matrix multiplication is not commutative.')+WORK('<strong>Engineers</strong> solve large systems this way on computers. <strong>Economists</strong> find prices that balance supply and demand. <strong>Nutritionists</strong> find how much of two foods gives a required diet.'),
     example:{q:'Use a matrix method to solve 2x + y = 7 and x + y = 4.',steps:[{do:'A = (2 1; 1 1), |A| = 2 − 1 = 1, A⁻¹ = (1 −1; −1 2).'},{do:'X = A⁻¹B = (1 −1; −1 2)(7; 4) = (7 − 4; −7 + 8) = (3; 1).'},{do:'x = 3, y = 1. Check: 6 + 1 = 7 ✓, 3 + 1 = 4 ✓.'}]},
     mistake:'Writing X = BA⁻¹. The inverse goes on the LEFT: X = A⁻¹B.',
     check:{q:'If AX = B and A⁻¹ exists, then X = …',o:['A⁻¹B','BA⁻¹','B/A'],a:0,why:'Multiply on the left by A⁻¹.',hint:'Inverse on the left.'}},
    {title:'Matrices in arithmetic, algebra and geometry problems',explain:PIC('A theatre in Kingston sells 250 tickets for a show, some at $2,000 for adults and some at $1,000 for children, and takes in $380,000. How many adults came? Two facts, two unknowns: a + c = 250 and 2,000a + 1,000c = 380,000. In matrix form, the inverse finds both numbers at once.',SCN['Matrices in arithmetic, algebra and geometry problems'])+'<p>The syllabus also asks you to use matrices for other simple problems.</p><p><strong>Algebra:</strong> find unknowns in matrix equations using equality and the determinant. For example, find k if (k 3; 2 4) is singular: 4k − 6 = 0, so k = 1.5.</p><p><strong>Arithmetic:</strong> data matrices, such as quantities × prices, and working backwards: if the totals and prices are known, the quantities can be found with an inverse.</p><p><strong>Geometry:</strong> matrices can describe transformations (you will study these in Term 2), and the determinant tells you how areas are scaled.</p>'+WHY('Why does det A = 0 mean "no unique answer"? If the determinant is 0, the two equations describe the same line or parallel lines: either they give no new information about each other (infinitely many solutions) or they contradict each other (no solution). Either way, there is no single answer, and no inverse.')+WORK('<strong>Event organisers</strong> work out ticket sales. <strong>Farmers</strong> mix two feeds to get the right protein. <strong>Computer graphics</strong> undo transformations of shapes.'),
     example:{q:'2 patties and 1 juice cost $650; 1 patty and 3 juices cost $700. Use matrices to find each price.',steps:[{do:'(2 1; 1 3)(p; j) = (650; 700). |A| = 6 − 1 = 5.'},{do:'A⁻¹ = (1/5)(3 −1; −1 2). X = (1/5)(1,950 − 700; −650 + 1,400) = (1/5)(1,250; 750).'},{do:'p = $250, j = $150.'}]},
     mistake:'Forgetting to multiply by 1/|A| at the end.',
     check:{q:'For which k is (k 2; 3 6) singular?',o:['1','2','3'],a:0,why:'6k − 6 = 0 gives k = 1.',hint:'Set ad − bc = 0.'}}]}]},

    {icon:'🎭',title:'The theatre manager: who came?',desc:'Find how many adults and children bought tickets.',level:'⭐⭐⭐ Events',mins:8,block:{type:'mission',story:'A theatre in Kingston sold 250 tickets: adults at $2,000 and children at $1,000, taking in $380,000. So a + c = 250 and 2,000a + 1,000c = 380,000. The theatre has seats for at most 150 adults in the best section.',parts:[{q:'For A = (1 1; 2000 1000), what is det A?',a:-1000,hint:'1 × 1,000 − 1 × 2,000.',sol:'−1,000.'},{q:'How many adults came?',a:130,hint:'From a + c = 250, c = 250 − a. Substitute, or use the inverse.',sol:'a = 130.'},{q:'How many children came?',a:120,hint:'250 − 130.',sol:'c = 120.'},{q:'Did all the adults fit in the 150-seat section? (Type yes or no.)',a:['yes'],hint:'Compare 130 with 150.',sol:'Yes: 130 adults, with 20 seats to spare.'}],done:'Two facts and one matrix equation told the manager exactly who came.'}},

    {icon:'🚫',title:'The analyst: can it be solved?',desc:'Spot a system with no unique solution.',level:'⭐⭐ Reasoning',mins:5,block:{type:'mission',story:'An analyst is given two equations: 2x + 4y = 10 and x + 2y = 5. She writes them as AX = B with A = (2 4; 1 2).',parts:[{q:'What is det A?',a:0,hint:'2 × 2 − 4 × 1.',sol:'0.'},{q:'Does A have an inverse? (Type yes or no.)',a:['no'],hint:'You cannot divide by 0.',sol:'No.'},{q:'The first equation is the second multiplied by which number?',a:2,hint:'Compare 2x + 4y = 10 with x + 2y = 5.',sol:'2: they are really the same equation.'},{q:'Is there exactly one solution? (Type yes or no.)',a:['no'],hint:'Same line twice.',sol:'No: every point on the line x + 2y = 5 works, so there are infinitely many solutions. She needs a genuinely different second fact.'}],done:'A zero determinant warned the analyst before she wasted time: the two facts were really one.'}}
