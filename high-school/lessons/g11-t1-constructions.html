var ARC=function(cx,cy,r,a0,a1,col){var p=function(a){return[(cx+r*Math.cos(a*Math.PI/180)).toFixed(1),(cy-r*Math.sin(a*Math.PI/180)).toFixed(1)]},P=p(a0),Q=p(a1);return'<path d="M'+P[0]+' '+P[1]+' A'+r+' '+r+' 0 0 0 '+Q[0]+' '+Q[1]+'" fill="none" stroke="'+(col||'#16766a')+'" stroke-width="1.8"/>'};

 pl:{name:'A line through P parallel to a line L',steps:[['Draw the line L and mark the point P above it. Draw any line through P that meets L at A.',LN([40,250],[440,250])+PT([300,90],'P',-20,-4)+LN([150,290],[352,20],'#5d5478',1.8)+PT([180,250],'A',-18,20)+'<text x="430" y="242" font-size="14" font-weight="700" fill="#3d2a73">L</text>'],['With the point on A, draw an arc cutting L at X and the line AP at Y.',ARC(180,250,70,-5,60)+PT([250,250],'X',-4,22)+PT([222,194],'Y',-20,0)],['Keep the SAME width. With the point on P, draw a matching arc, cutting AP above P at Y′.',ARC(300,90,70,-5,60)+PT([342,34],'Y′',6,0)],['Measure the distance XY with the compasses. From Y′, cut the arc at X′. Join P to X′: this line is parallel to L (equal corresponding angles).',ARC(342,34,62.6,-80,-45,'#c02d5f')+PT([370,90],'X′',6,-6)+LN([60,90],[460,90],'#c02d5f',2.5)]]},

var SR=function(s){var R1=[40,235],R2=[490,115],H=[170,55],d=[R2[0]-R1[0],R2[1]-R1[1]],dd=d[0]*d[0]+d[1]*d[1],s0=((H[0]-R1[0])*d[0]+(H[1]-R1[1])*d[1])/dd,P=[R1[0]+s*d[0],R1[1]+s*d[1]],F=[R1[0]+s0*d[0],R1[1]+s0*d[1]],len=Math.hypot(P[0]-H[0],P[1]-H[1]),minL=Math.hypot(F[0]-H[0],F[1]-H[1]),near=Math.abs(s-s0)<0.012,g='<svg viewBox="0 0 520 260" role="img" aria-label="A house and a slanting road; a path from the house meets the road at a chosen point"><rect width="520" height="260" fill="#e3f1fb"/><polygon points="0,260 0,245 520,107 520,260" fill="#9ccc7a"/>';g+='<line x1="'+(R1[0]-40)+'" y1="'+(R1[1]+10.7)+'" x2="'+(R2[0]+40)+'" y2="'+(R2[1]-10.7)+'" stroke="#777" stroke-width="20"/><line x1="'+(R1[0]-40)+'" y1="'+(R1[1]+10.7)+'" x2="'+(R2[0]+40)+'" y2="'+(R2[1]-10.7)+'" stroke="#fff" stroke-width="2" stroke-dasharray="16 12"/>'+SC.house(145,62,50,40)+SC.dot(H[0],H[1],'#c02d5f',5);g+='<line x1="'+H[0]+'" y1="'+H[1]+'" x2="'+P[0].toFixed(1)+'" y2="'+P[1].toFixed(1)+'" stroke="'+(near?'#155c35':'#c02d5f')+'" stroke-width="4" stroke-dasharray="9 5"/>'+SC.dot(P[0],P[1],'#3d2a73',6);if(near){var u=[d[0]/Math.sqrt(dd),d[1]/Math.sqrt(dd)],v=[(H[0]-F[0])/minL,(H[1]-F[1])/minL],k=12;g+='<path d="M'+(F[0]+u[0]*k)+' '+(F[1]+u[1]*k)+' L'+(F[0]+u[0]*k+v[0]*k)+' '+(F[1]+u[1]*k+v[1]*k)+' L'+(F[0]+v[0]*k)+' '+(F[1]+v[1]*k)+'" fill="none" stroke="#155c35" stroke-width="2"/>'}return{svg:g+'</svg>',len:len/4,min:minL/4,near:near,s0:s0}};

     init:function(box,api){var sel=box.querySelector('#cpK'),n=0;function draw(){var c=CS[sel.value];n=Math.max(0,Math.min(n,c.steps.length-1));box.querySelector('.cpSvg').innerHTML=DRAWC(sel.value,n);box.querySelector('.cpX').innerHTML='<strong>'+c.name+'</strong><br>Step '+(n+1)+' of '+c.steps.length+': '+c.steps[n][0];box.querySelector('.cpB').disabled=n===0;box.querySelector('.cpN').disabled=n===c.steps.length-1}box.querySelector('.cpN').onclick=function(){n++;draw()};box.querySelector('.cpB').onclick=function(){n--;draw()};sel.onchange=function(){n=0;draw()};var T=[{t:'In the perpendicular from P to L, are the arcs from A and B drawn on the SAME side of L as P, or the OTHER side? (Type same or other.)',ok:function(v){return/other|opposite/.test(v)}},{t:'In the regular hexagon, each side equals which length of the circle? (Type the word.)',ok:function(v){return/radius/.test(v)}},{t:'The 120° angle is made from how many 60° steps?',ok:function(v){return parseFloat(v)===2||v==='two'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.cpTN').textContent='All done';box.querySelector('.cpQ').textContent='You completed every challenge!';box.querySelector('.cpC').disabled=true;return}box.querySelector('.cpTN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.cpQ').textContent=T[q].t}box.querySelector('.cpC').onclick=function(){var v=String(box.querySelector('.cpA').value).trim().toLowerCase(),fb=box.querySelector('.cpFb');if(T[q].ok(v)){fb.className='fb ok cpFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.cpA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no cpFb';fb.textContent='Not yet. Step through that construction and read each step.'}};draw();task()}},
    {type:'recall',text:'The shortest path meets the road at 90°: it is the perpendicular from the house to the road. Any slanted path is the hypotenuse of a right triangle, so it is longer.'}]},
  {phase:'explain',name:'Teach: lines and angles',title:'Learn: measuring, bisectors, perpendiculars, parallels and angles',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Sharp pencil. Tight compass. Keep di arc.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Drawing and measuring accurately',explain:PIC('A carpenter in Linstead is cutting the parts for a cabinet. If one shelf is 3 mm too short, the whole cabinet wobbles. "Measure twice, cut once," she says. A sharp pencil, a ruler lined up at zero, and a protractor centred exactly on the corner make the difference between a cabinet that fits and one that does not.',SCN['Drawing and measuring accurately'])+'<p>CSEC expects lengths accurate to within 1 mm and angles to within 1°. Accuracy starts with good habits: a <strong>sharp pencil</strong>, a ruler whose zero mark is at the start of the line (not the edge of the ruler), and compasses that are tight enough not to slip.</p><p>When using a <strong>protractor</strong>, place its centre exactly on the vertex and line up the base line with one arm of the angle. Protractors have two scales, inner and outer. Start counting from the scale that reads <strong>0°</strong> on your arm, and check whether the angle should be acute or obtuse.</p><p>Remember the difference: to <strong>construct</strong> means using compasses and a ruler; a protractor is only used to <strong>measure</strong> or check.</p>'+WHY('Why does accuracy matter so much? Small errors add up. An angle that is 2° out at one corner of a frame pushes the far corner several millimetres out of place, and every part fitted to it inherits the error. That is why CSEC asks for lengths within 1 mm and angles within 1°.')+WORK('<strong>Carpenters and cabinet makers</strong> measure before every cut. <strong>Draughtsmen and engineers</strong> produce accurate scale drawings. <strong>Tailors and seamstresses</strong> measure and mark fabric precisely.'),
     example:{q:'A student measures an obviously acute angle and reads 130°. What has gone wrong?',steps:[{do:'An acute angle is less than 90°, so 130° cannot be right.'},{do:'She read the wrong scale: the other scale gives 180° − 130° = 50°.'},{do:'Always estimate first, then check your reading makes sense.'}]},
     mistake:'Reading the wrong protractor scale. Estimate first: is the angle acute or obtuse?',
     check:{q:'Where should the centre of the protractor go?',o:['Exactly on the vertex of the angle','At the end of one arm','Anywhere on the angle'],a:0,why:'The vertex is the centre of the angle.',hint:'The corner.'}},
    {title:'Bisectors and perpendiculars',explain:PIC('Two primary schools in a district are 2 km apart. The water authority wants to place a new storage tank exactly the same distance from both schools. Every point that is equally far from both lies on one special line: the perpendicular bisector of the line joining the schools.',SCN['Bisectors and perpendiculars'])+'<p>The {{perpendicular bisector|a line cutting a segment in half at 90°}} of AB: open the compasses to more than half of AB, draw arcs from A and B above and below, and join the crossing points.</p><p>The <strong>angle bisector</strong>: draw an arc from the vertex cutting both arms, then equal arcs from those two points; join the vertex to where they cross.</p><p>The syllabus specifically lists <strong>a perpendicular from a point P to a line L, where P is not on L</strong>. With the point on P, draw an arc that cuts L at A and B. Then, from A and B, draw equal arcs that cross on the <strong>other side</strong> of L at R. Join P to R. The point where PR meets L is the {{foot of the perpendicular|where a perpendicular meets the line}}, and PF is the shortest distance from P to L.</p>'+WHY('Why is every point on the perpendicular bisector the same distance from A and from B? Take any point P on it, and join P to A and to B. The two triangles formed are congruent (they share a side, they have equal halves of AB, and both have a right angle), so PA = PB. This is the reason the construction works.')+WORK('<strong>Town planners</strong> place schools, clinics and fire stations fairly between communities. <strong>Surveyors</strong> mark the boundary halfway between two properties. <strong>Engineers</strong> find the centre of a circular part by bisecting chords.'),visual:DRAWC('pf',3),
     example:{q:'Why does the perpendicular-from-a-point construction work?',steps:[{do:'P is the same distance from A and B (the first arc).'},{do:'R is the same distance from A and B (the equal arcs).'},{do:'So P and R both lie on the perpendicular bisector of AB, which meets L at 90°.'}]},
     mistake:'Drawing the arcs from A and B on the same side as P. They should cross on the OTHER side of L, for accuracy.',
     check:{q:'The shortest distance from a point to a line is along…',o:['the perpendicular','a 45° line','any line'],a:0,why:'A slanted line is a hypotenuse, so it is longer.',hint:'The shortest path.'}},
    {title:'Parallel lines, and angles and their combinations',explain:PIC('A supermarket car park in May Pen is being painted. Every parking bay must be at the same angle to the kerb, say 60°, and every bay line must be parallel to the next. The painter marks the first line at 60°, then copies that angle along the kerb to keep every line parallel.',SCN['Parallel lines, and angles and their combinations'])+'<p>To construct a <strong>line through P parallel to L</strong>: draw any line through P meeting L at A. At P, copy the angle that this line makes with L at A (using equal arcs and the same chord length). Equal corresponding angles mean the lines are parallel.</p><p>The syllabus angles: <strong>60°</strong> (equal arcs: an equilateral triangle); <strong>30°</strong> (bisect 60°); <strong>90°</strong> (the perpendicular); <strong>45°</strong> (bisect 90°); <strong>120°</strong> (step around the arc twice with the radius: 60° + 60°).</p><p><strong>Combinations</strong>: 75° = 60° + 15° (or halfway between 60° and 90°); 105° = 60° + 45°; 135° = 90° + 45°; 150° = 90° + 60° (or 180° − 30°); 15° = half of 30°. Plan the combination before you start.</p>'+WHY('Why do equal corresponding angles make lines parallel? If two lines cross the kerb at exactly the same angle, they point in exactly the same direction, so they can never meet. And why does stepping the radius around a circle give 60°? Each step makes a triangle with three equal sides (two radii and the step): an equilateral triangle, whose angles are all 60°.')+WORK('<strong>Car-park and road-marking crews</strong> paint parallel lines at fixed angles. <strong>Railway engineers</strong> lay parallel tracks. <strong>Sign makers and metalworkers</strong> construct brackets at 30°, 45°, 60° and their combinations.'),visual:DRAWC('a120',3),
     example:{q:'How would you construct 105°?',steps:[{do:'105° lies exactly halfway between 90° and 120°.'},{do:'Construct 90° and 120° at the same point, on the same base line.'},{do:'Bisect the 30° gap between them: 90° + 15° = 105°.'}]},
     mistake:'Changing the compass width when stepping around for 60° or 120°. The width must stay at the radius.',
     check:{q:'Which combination gives 150°?',o:['90° + 60°','90° + 45°','120° + 45°'],a:0,why:'90 + 60 = 150.',hint:'Add two constructible angles.'}}]}]},
  {phase:'explain',name:'Teach: triangles and polygons',title:'Learn: constructing triangles, quadrilaterals and polygons',lead:'Next, building complete shapes from your constructions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Sketch first. Den construct. Den check.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Constructing triangles',explain:PIC('A gardener wants a triangular flower bed with sides of 3 m, 4 m and 6 m. She pegs one 6 m side, then takes two strings, 3 m and 4 m long, tied at the ends of that side. Where the strings meet, pulled tight, is the third corner. That is exactly the SSS construction, done with string instead of compasses.',SCN['Constructing triangles'])+'<p>There are three standard cases. Always start with a labelled <strong>rough sketch</strong>, and usually draw the longest or the given base side first.</p><p><strong>Three sides (SSS):</strong> draw one side; from each end, draw an arc with the other two lengths; they cross at the third vertex.</p><p><strong>Two sides and the included angle (SAS):</strong> draw one side, construct the given angle at one end, and mark the second side along the new arm with compasses.</p><p><strong>Two angles and a side (ASA):</strong> draw the side, construct one angle at each end, and extend the arms until they meet. Remember: the three angles add to 180°, so you can find the third angle if you need it.</p>'+WHY('Why do three sides fix a triangle completely? The third corner must be 3 m from one end AND 4 m from the other. Each condition is a circle; two circles cross at just one point on each side of the base. So there is only one possible triangle (and its mirror image): the shape is fixed.')+WORK('<strong>Gardeners and landscapers</strong> lay out beds with pegs and string. <strong>Surveyors</strong> fix points on land by measuring distances from two known points. <strong>Roof-truss makers</strong> build triangles from three measured lengths.'),
     example:{q:'Construct triangle ABC with AB = 8 cm, angle A = 60° and angle B = 45°. What is angle C?',steps:[{do:'Draw AB = 8 cm.'},{do:'Construct 60° at A and 45° at B. Extend the arms to meet at C.'},{do:'Angle C = 180° − 60° − 45° = 75°. Check it with a protractor.'}]},
     mistake:'Constructing an angle at the wrong end of the base. Label the sketch and match it carefully.',
     check:{q:'Can you construct a triangle with sides 3 cm, 4 cm and 9 cm?',o:['No: the arcs will not meet','Yes','Only with a protractor'],a:0,why:'3 + 4 is less than 9.',hint:'Can the two short sides reach?'}},
    {title:'Constructing quadrilaterals',explain:PIC('A mason marks out the rectangular foundation of a house with string lines. She makes the first corner exactly 90°, measures the sides, and then checks her work: in a true rectangle, the two diagonals are exactly equal. If they are not, the corners are not square.',SCN['Constructing quadrilaterals'])+'<p>For quadrilaterals, combine side lengths and angles step by step. The key is a good sketch showing which sides and angles are given.</p><p>For a <strong>rectangle</strong> or <strong>square</strong>: draw one side, construct 90° at one end, mark the second side, then find the fourth corner with two arcs (lengths of the opposite sides). For a <strong>parallelogram</strong> or <strong>rhombus</strong>: the same, with the given angle instead of 90°. For a <strong>trapezium</strong>: construct the parallel side through a point (two equal corresponding angles, or two right angles).</p><p>Check with properties: a rectangle’s diagonals are equal; a rhombus’s diagonals cross at 90°.</p>'+WHY('Why do equal diagonals prove a rectangle? In a parallelogram, the diagonals are equal ONLY when the corners are right angles: the two triangles on either side of a diagonal are then congruent. So measuring two diagonals is a quick test that every corner is 90°.')+WORK('<strong>Masons and builders</strong> check foundations by measuring diagonals. <strong>Carpenters</strong> check door and window frames the same way. <strong>Sports-field markers</strong> lay out football and netball courts.'),
     example:{q:'Construct parallelogram PQRS with PQ = 7 cm, PS = 5 cm and angle P = 120°.',steps:[{do:'Draw PQ = 7 cm and construct 120° at P.'},{do:'Mark S on the arm, 5 cm from P.'},{do:'From S draw an arc of 7 cm, and from Q an arc of 5 cm; they meet at R. Join QR and SR.'}]},
     mistake:'Using the wrong radii for the final arcs. Opposite sides of a parallelogram are equal: SR = PQ and QR = PS.',
     check:{q:'In rectangle ABCD, how can you check your construction?',o:['The diagonals should be equal','The diagonals should be perpendicular','All sides should be equal'],a:0,why:'Rectangles have equal diagonals.',hint:'A rectangle property.'}},
    {title:'Regular and irregular polygons',explain:PIC('A builder lays out the floor of a hexagonal gazebo for a hotel garden. She drives a post at the centre, ties a rope equal to the length of one side, and walks it around the centre, marking six points on the ground, each one a rope-length from the last. Joining them gives a perfect regular hexagon.',SCN['Regular and irregular polygons'])+'<p>A {{regular polygon|all sides and all angles equal}} has all its sides and angles equal. The <strong>regular hexagon</strong> is a lovely construction: draw a circle, keep the compasses at the radius, and step around the circle six times. Joining the six points gives a regular hexagon, because each side equals the radius (making six equilateral triangles).</p><p>Joining every other point of the hexagon gives an <strong>equilateral triangle</strong>. Constructing two perpendicular diameters gives a <strong>square</strong>; bisecting their right angles gives a <strong>regular octagon</strong>.</p><p>An <strong>irregular polygon</strong> is built from its given sides and angles, one step at a time, as with quadrilaterals. Keep all arcs visible, and check the final shape against the given measurements.</p>'+WHY('Why does stepping the radius around a circle make exactly six points? Each step creates a triangle of three equal sides: two ropes from the centre and the step between them. Each of these equilateral triangles has a 60° angle at the centre, and 6 × 60° = 360°: exactly one full turn.')+WORK('<strong>Builders and landscapers</strong> lay out gazebos, fountains and roundabouts. <strong>Engineers</strong> design hexagonal bolts and nuts. <strong>Craftspeople</strong> make regular shapes for jewellery, quilts and tiles.'),visual:DRAWC('hex',3),
     example:{q:'Why does stepping the radius around a circle give exactly six points?',steps:[{do:'Each step makes a triangle with two radii and a chord equal to the radius: an equilateral triangle.'},{do:'Each centre angle is 60°.'},{do:'360° ÷ 60° = 6, so you return exactly to the start after six steps.'}]},
     mistake:'Letting the compass width slip while stepping round. Even a tiny change means you will not close up exactly.',
     check:{q:'In a regular hexagon drawn in a circle of radius 5 cm, each side is…',o:['5 cm','10 cm','2.5 cm'],a:0,why:'Each side equals the radius.',hint:'Equilateral triangles.'}}]}]},

    {icon:'🚰',title:'The water engineer: a fair place for the tank',desc:'Place a tank the same distance from two houses.',level:'⭐⭐ Water supply',mins:6,block:{type:'mission',story:'On a map grid (1 unit = 100 m), two houses are at A(2, 4) and B(8, 4). A water tank must be the same distance from both houses, and it must sit beside the road, which runs along the x-axis (y = 0).',parts:[{q:'What is the x-coordinate of the midpoint of AB?',a:5,hint:'(2 + 8) ÷ 2.',sol:'5.'},{q:'The perpendicular bisector of AB is a vertical line x = ? (Type the number.)',a:5,hint:'AB is horizontal, so its perpendicular bisector is vertical, through the midpoint.',sol:'x = 5.'},{q:'Where does it meet the road (y = 0)? Type the x-coordinate.',a:5,hint:'On the line x = 5, with y = 0.',sol:'(5, 0).'},{q:'How far is the tank from house A, in grid units?',a:5,hint:'√((5 − 2)² + (0 − 4)²).',sol:'√(9 + 16) = 5 units = 500 m.'},{q:'Is the tank the same distance from house B? (Type yes or no.)',a:['yes'],hint:'√((8 − 5)² + 4²).',sol:'Yes: also 5 units. Every point on the perpendicular bisector is equally far from A and B.'}],done:'The perpendicular bisector found the one fair place on the road for the tank.'}},
    {icon:'🛤️',title:'The council: the cheapest path',desc:'Compare the cost of two paths to the road.',level:'⭐⭐ Local government',mins:6,block:{type:'mission',story:'A farmhouse stands 40 m from a straight road, measured along the perpendicular. A slanting path to a point 30 m further along the road has also been suggested. Paving costs $1,500 per metre.',parts:[{q:'How much does the perpendicular path cost? ($)',a:60000,hint:'40 × 1,500.',sol:'$60,000.',placeholder:'dollars'},{q:'How long is the slanting path? (m)',a:50,hint:'√(40² + 30²).',sol:'50 m.',placeholder:'m'},{q:'How much does the slanting path cost? ($)',a:75000,hint:'50 × 1,500.',sol:'$75,000.',placeholder:'dollars'},{q:'How much does the council save by choosing the perpendicular path? ($)',a:15000,hint:'75,000 − 60,000.',sol:'$15,000.',placeholder:'dollars'}],done:'The perpendicular is the shortest path, so it is also the cheapest.'}},
    {icon:'⛺',title:'The gazebo builder: railings',desc:'Order railings for a hexagonal gazebo.',level:'⭐⭐ Construction',mins:5,block:{type:'mission',story:'A builder lays out a regular hexagonal gazebo by stepping a 3 m rope around a centre post. Railings are sold in 2 m lengths, and the builder needs railing on five of the six sides (one side is the entrance).',parts:[{q:'How long is each side of the hexagon? (m)',a:3,hint:'Each side equals the rope (the radius).',sol:'3 m.',placeholder:'m'},{q:'What is the perimeter of the hexagon? (m)',a:18,hint:'6 × 3.',sol:'18 m.',placeholder:'m'},{q:'How many metres of railing are needed for five sides? (m)',a:15,hint:'5 × 3.',sol:'15 m.',placeholder:'m'},{q:'How many 2 m lengths must the builder buy?',a:8,hint:'15 ÷ 2 = 7.5, rounded UP.',sol:'8 lengths.'}],done:'One rope and one construction gave every measurement the builder needed.'}},
    {icon:'🔩',title:'The metalworker: angled brackets',desc:'Plan brackets at angles made from 30°, 45° and 60°.',level:'⭐⭐ Metalwork',mins:5,block:{type:'mission',story:'A metalworker makes shelf brackets and constructs every angle with compasses, combining 30°, 45°, 60° and 90°.',parts:[{q:'A bracket needs 75°. Which angle is bisected between 60° and 90° to make it? Type the size of each half of the gap. (degrees)',a:15,hint:'The gap between 60° and 90° is 30°.',sol:'15°: 60° + 15° = 75°.',placeholder:'degrees'},{q:'What is 90° + 45°? (degrees)',a:135,hint:'Add.',sol:'135°.',placeholder:'degrees'},{q:'What angle is made by 180° − 30°? (degrees)',a:150,hint:'Subtract.',sol:'150°.',placeholder:'degrees'},{q:'A customer asks for 50°. Can it be constructed exactly from 30°, 45°, 60° and their halves? (Type yes or no.)',a:['no'],hint:'Every angle made this way is 15° halved some number of times (7.5°, 3.75°, …), then combined.',sol:'No: however many times you halve and combine, you can never land exactly on 50°. It must be measured with a protractor instead.'}],done:'Combining a few constructible angles covers many real jobs, and knowing the limits matters too.'}}

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire construction facts.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},Q=[['Bisect 120°','60°',['30°','90°']],['90° + 45°','135°',['125°','145°']],['Bisect 30°','15°',['10°','20°']],['60° + 45°','105°',['115°','95°']],['180° − 30°','150°',['120°','160°']],['Halfway between 60° and 90°','75°',['70°','80°']],['Steps of the radius around a circle','6',['5','8']],['Interior angle of a regular hexagon','120°',['108°','135°']]],q=Q[R(0,Q.length-1)];return{q:q[0]+'?',o:[q[1]].concat(q[2]),a:0,why:'The answer is '+q[1]+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Plan constructions that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Which two constructible angles add up to 165°? (Type a, b.)',placeholder:'a, b',check:function(v){var n=String(v).replace(/°/g,'').split(',').map(Number).sort(function(a,b){return a-b});return n.length===2&&n[0]+n[1]===165&&[15,30,45,60,75,90,105,120,135,150].indexOf(n[0])>=0&&[15,30,45,60,75,90,105,120,135,150].indexOf(n[1])>=0?{ok:true,msg:'Yes! '+n[0]+'° + '+n[1]+'° = 165°.'}:{ok:false,msg:'Try 120° + 45°, or 90° + 75°.'}}},{q:'A triangle has angles 60° and 45°. What is its third angle?',placeholder:'degrees',check:function(v){return parseFloat(v)===75?{ok:true,msg:'Correct! 180 − 105.'}:{ok:false,msg:'Angles add to 180°.'}}},{q:'Joining every other vertex of a regular hexagon makes which shape?',placeholder:'shape',check:function(v){return/equilateral/i.test(v)?{ok:true,msg:'Yes! An equilateral triangle.'}:{ok:false,msg:'Three points, equally spaced around a circle.'}}}]}},
    {icon:'🏡',title:'Mission: the St. Ann farm plan',desc:'Plan a farm layout with constructions.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A farmer in St. Ann is planning the layout of her land, drawn to a scale of 1 cm to 10 m. Construct each part on paper, then answer.',parts:[{q:'The access path from the house to the road must be as short as possible. At what angle should it meet the road?',a:90,hint:'The perpendicular.',sol:'90°.',placeholder:'degrees'},{q:'On the plan, the house is 4.5 cm from the road. How long is the real path, in metres?',a:45,hint:'1 cm = 10 m.',sol:'45 m.',placeholder:'metres'},{q:'A new fence must run parallel to the road through the water tank. If the fence line makes a 70° angle with a diagonal track, what angle does the road make with the same track (corresponding angles)?',a:70,hint:'Parallel lines make equal corresponding angles.',sol:'70°.',placeholder:'degrees'},{q:'A hexagonal gazebo is constructed inside a circle of radius 3 cm on the plan. What is each real side length, in metres?',a:30,hint:'Side = radius = 3 cm = 30 m.',sol:'30 m.',placeholder:'metres'},{q:'A triangular garden has sides 6 cm, 8 cm and 10 cm on the plan. What is its largest angle? (degrees)',a:90,hint:'6² + 8² = 10².',sol:'90°: it is a right triangle.',placeholder:'degrees'}],done:'You used perpendiculars, parallel lines, a regular hexagon and triangle constructions to plan a real farm.'}}
