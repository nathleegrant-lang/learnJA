<script>
var K=window.LessonKit;
var ARC=function(cx,cy,r,a0,a1,col){var p=function(a){return[(cx+r*Math.cos(a*Math.PI/180)).toFixed(1),(cy-r*Math.sin(a*Math.PI/180)).toFixed(1)]},P=p(a0),Q=p(a1);return'<path d="M'+P[0]+' '+P[1]+' A'+r+' '+r+' 0 0 0 '+Q[0]+' '+Q[1]+'" fill="none" stroke="'+(col||'#16766a')+'" stroke-width="1.8"/>'};
var LN=function(a,b,col,w,dash){return'<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(col||'#2f5fc4')+'" stroke-width="'+(w||3)+'"'+(dash?' stroke-dasharray="6 5"':'')+'/>'};
var PT=function(p,l,dx,dy){return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#3d2a73"/><text x="'+(p[0]+(dx===undefined?-16:dx))+'" y="'+(p[1]+(dy===undefined?18:dy))+'" font-size="15" font-weight="700" fill="#3d2a73">'+l+'</text>'};
var HX=function(){var o=[240,180],r=110,pts=[];for(var i=0;i<6;i++){var a=i*60;pts.push([o[0]+r*Math.cos(a*Math.PI/180),o[1]-r*Math.sin(a*Math.PI/180)])}return pts};
var CS={
 pb:{name:'Perpendicular bisector of AB',steps:[['Draw the line segment AB.',LN([120,200],[360,200])+PT([120,200],'A')+PT([360,200],'B',6)],['Open the compasses to MORE than half of AB. From A, draw arcs above and below the line.',ARC(120,200,160,30,52)+ARC(120,200,160,-52,-30)],['With the same width, draw arcs from B. They cross the first arcs at P and Q.',ARC(360,200,160,128,150)+ARC(360,200,160,-150,-128)+PT([240,94.2],'P',8,-4)+PT([240,305.8],'Q',8,14)],['Join P and Q. PQ cuts AB in half at 90°: it is the perpendicular bisector.',LN([240,60],[240,340],'#c02d5f',2.5)+'<path d="M240 188 h12 v12" fill="none" stroke="#3d2a73" stroke-width="1.5"/>']]},
 pf:{name:'Perpendicular from a point P to a line L (P not on L)',steps:[['Draw the line L and mark the point P above it.',LN([40,250],[440,250])+PT([240,60],'P',8,0)+'<text x="430" y="242" font-size="14" font-weight="700" fill="#3d2a73">L</text>'],['With the compass point on P, draw an arc that cuts L at two points, A and B.',ARC(240,60,230,-130,-50)+PT([110.4,250],'A',-6,22)+PT([369.6,250],'B',-6,22)],['From A and from B, draw arcs of equal radius that cross on the OTHER side of L, at R.',ARC(110.4,250,160,-50,-20)+ARC(369.6,250,160,-160,-130)+PT([240,343.8],'R',8,4)],['Join P to R. The line PR is perpendicular to L. F, where it meets L, is the foot of the perpendicular.',LN([240,60],[240,343.8],'#c02d5f',2.5)+PT([240,250],'F',8,-6)+'<path d="M240 238 h12 v12" fill="none" stroke="#3d2a73" stroke-width="1.5"/>']]},
 pl:{name:'A line through P parallel to a line L',steps:[['Draw the line L and mark the point P above it. Draw any line through P that meets L at A.',LN([40,250],[440,250])+PT([300,90],'P',-20,-4)+LN([150,290],[352,20],'#5d5478',1.8)+PT([180,250],'A',-18,20)+'<text x="430" y="242" font-size="14" font-weight="700" fill="#3d2a73">L</text>'],['With the point on A, draw an arc cutting L at X and the line AP at Y.',ARC(180,250,70,-5,60)+PT([250,250],'X',-4,22)+PT([222,194],'Y',-20,0)],['Keep the SAME width. With the point on P, draw a matching arc, cutting AP above P at Y′.',ARC(300,90,70,-5,60)+PT([342,34],'Y′',6,0)],['Measure the distance XY with the compasses. From Y′, cut the arc at X′. Join P to X′: this line is parallel to L (equal corresponding angles).',ARC(342,34,62.6,-80,-45,'#c02d5f')+PT([370,90],'X′',6,-6)+LN([60,90],[460,90],'#c02d5f',2.5)]]},
 a120:{name:'An angle of 120°',steps:[['Draw a line and mark the point A on it.',LN([60,250],[440,250])+PT([240,250],'A',-6,22)],['With the point on A, draw a large arc cutting the line at P.',ARC(240,250,100,-5,175)+PT([340,250],'P',-4,22)],['Keep the SAME width. From P, mark Q on the arc (that is 60°). From Q, mark R on the arc (another 60°).',ARC(340,250,100,105,135)+PT([290,163.4],'Q',6,-6)+ARC(290,163.4,100,165,195)+PT([190,163.4],'R',-20,-6)],['Join A to R. Angle PAR = 60° + 60° = 120°.',LN([240,250],[140,76.8],'#c02d5f',2.5)]]},
 hex:{name:'A regular hexagon in a circle',steps:[['Draw a circle with centre O. Keep the compasses at the radius.','<circle cx="240" cy="180" r="110" fill="none" stroke="#2f5fc4" stroke-width="2"/>'+PT([240,180],'O',-6,22)],['Mark any point A on the circle. From A, mark B on the circle using the same width (the radius).',PT(HX()[0],'A',8,4)+ARC(HX()[0][0],HX()[0][1],110,105,135)+PT(HX()[1],'B',6,-6)],['Keep stepping around the circle with the same width, marking C, D, E and F. You return exactly to A.',[2,3,4,5].map(function(i){var p=HX()[i],q=HX()[i-1];var ang=Math.atan2(-(p[1]-q[1]),p[0]-q[0])*180/Math.PI;return ARC(q[0],q[1],110,ang-15,ang+15)+PT(p,'CDEF'[i-2],i<4?-20:-6,i<4?-6:22)}).join('')],['Join the six points in order. ABCDEF is a regular hexagon: each side equals the radius.','<polygon points="'+HX().map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="#ffd98a" fill-opacity=".45" stroke="#c02d5f" stroke-width="2.5"/>']]}};
var DRAWC=function(k,n){var st=CS[k].steps,s='<svg viewBox="0 0 480 360" role="img" aria-label="'+CS[k].name+', step '+(n+1)+'"><rect width="480" height="360" fill="#faf8fe"/>';for(var i=0;i<=n;i++)s+=st[i][1];return s+'</svg>'};

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 1',unit:'Module 2: Geometry and Trigonometry 1',strand:'Geometry and Trigonometry',standard:'Module 2, Geometry and Trigonometry 1: understand the properties and relationship among geometrical objects; demonstrate the ability to use geometrical concepts to model and solve real world problems.',
  objectives:['4.2 draw angles and line segments accurately using appropriate instruments;','4.3 measure angles and line segments accurately using appropriate instruments;','4.4 construct lines, angles, and polygons using appropriate instruments;'],
  focus:'Accurate drawing and measuring with a ruler and protractor; parallel and perpendicular lines; bisecting line segments and angles; constructing a line perpendicular to another line, L, from a point that is not on L; triangles, quadrilaterals, regular and irregular polygons; angles of 30°, 45°, 60°, 90°, 120° and their combinations (as listed in the syllabus content).',

 glossary:[['Construct','Draw accurately using only a ruler and compasses (a protractor is used only to check).'],['Perpendicular bisector','A line that cuts a segment in half at 90°.'],['Angle bisector','A line that cuts an angle into two equal parts.'],['Foot of the perpendicular','The point where a perpendicular meets the line.'],['Parallel lines','Lines that never meet; they make equal corresponding angles with a transversal.'],['Regular polygon','A polygon with all sides and all angles equal.'],['Included angle','The angle between two given sides.']],
 teacher:{time:'about 120 minutes over three periods, with instruments',flow:[['Engage','8 min','The shortest path from a house to the road.','Make sure every student has compasses, a ruler, a protractor and a sharp pencil.'],['Explore','25 min','Construction player: five CSEC constructions.','Students construct each one on paper alongside the player.'],['Explain','45 min','Measuring, bisectors, perpendiculars, parallel lines and angles; triangles, quadrilaterals and polygons; I do, we do, you do.','Check accuracy: within 1 mm and 1°.'],['Elaborate','30 min','Challenge Zone and Bronze to Gold constructions.','Practise CSEC past-paper construction questions.'],['Evaluate','12 min','Quiz and reflection.','Collect constructions to check that the arcs are kept.']],
  misconceptions:['Reading the wrong scale on a protractor (inner versus outer).','Changing the compass width in the middle of a step.','Rubbing out construction arcs.','Measuring an angle with a protractor when the question says "construct".','For a perpendicular from an external point, drawing the final arcs on the same side as the point.'],
  extension:'Construct a regular octagon inside a circle. (Hint: construct two perpendicular diameters, then bisect the right angles.) Then construct a regular dodecagon.'},
 steps:[
  {phase:'engage',name:'The shortest path',title:'What is the shortest path to the road?',lead:'A farmer’s house in St. Ann stands back from a straight main road. The parish council will build a short access path from the house to the road, and wants it as short as possible.',
   mission:['Type your name.','Predict the direction of the shortest path.','Write what you already know about constructions.'],
   patois:'Di house deh back from di road. Which way di shortest path go?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'Which path from the house to the road is the shortest?',options:['The one that meets the road at 90°','The one that meets the road at 45°','All paths are the same length'],after:'You will construct the perpendicular from a point to a line.'},{type:'write',fields:[{id:'know',label:'Constructions I already know how to do:',placeholder:'Example: bisect an angle'},{id:'wonder',label:'Jobs where accurate constructions matter:',placeholder:'Example: surveying, carpentry'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'Two arcs of the same radius from A and P make which angle at A?',o:['60°','90°','45°'],a:0,why:'They make an equilateral triangle.',teach:'Equal arcs from A and P form an equilateral triangle, whose angles are all 60°.'},{q:'Half of 90° is…',o:['45°','30°','60°'],a:0,why:'90 ÷ 2.',teach:'Bisecting 90° gives 45°.'},{q:'Corresponding angles on parallel lines are…',o:['equal','supplementary','complementary'],a:0,why:'"F" angles are equal.',teach:'If corresponding angles are equal, the lines are parallel. That is how we construct parallel lines.'},{q:'Each interior angle of a regular hexagon is…',o:['120°','60°','108°'],a:0,why:'180 − 360/6.',teach:'Exterior angle 360 ÷ 6 = 60°, so interior = 120°.'}]}]},
  {phase:'explore',name:'Construction player',title:'Explore: the construction player',lead:'Choose a construction and step through it. Watch each arc and line appear. Construct each one on paper at the same time with your own instruments.',
   mission:['Step through all five constructions, building them on paper as you go.','In the perpendicular from a point, notice which side of L the second arcs are drawn on.','Complete all 3 challenges for a star.'],
   patois:'Step by step. Keep di arc dem.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="cpK">Construction:</label><select id="cpK"><option value="pb">Perpendicular bisector</option><option value="pf">Perpendicular from a point to a line</option><option value="pl">Parallel line through a point</option><option value="a120">Angle of 120°</option><option value="hex">Regular hexagon in a circle</option></select></div><div class="scene cpSvg"></div><div class="explain cpX" aria-live="polite"></div><div class="controls"><button type="button" class="cpB">◀ Back</button><button type="button" class="go cpN">Next step ▶</button></div><div class="tile"><p style="margin:0"><span class="badge cpTN"></span> <strong class="cpQ"></strong></p><div class="controls"><input type="text" class="cpA" aria-label="Your answer" placeholder="answer"><button type="button" class="go cpC">Check</button></div><div class="fb cpFb" aria-live="polite">Use the player to help you.</div></div>',
     init:function(box,api){var sel=box.querySelector('#cpK'),n=0;function draw(){var c=CS[sel.value];n=Math.max(0,Math.min(n,c.steps.length-1));box.querySelector('.cpSvg').innerHTML=DRAWC(sel.value,n);box.querySelector('.cpX').innerHTML='<strong>'+c.name+'</strong><br>Step '+(n+1)+' of '+c.steps.length+': '+c.steps[n][0];box.querySelector('.cpB').disabled=n===0;box.querySelector('.cpN').disabled=n===c.steps.length-1}box.querySelector('.cpN').onclick=function(){n++;draw()};box.querySelector('.cpB').onclick=function(){n--;draw()};sel.onchange=function(){n=0;draw()};var T=[{t:'In the perpendicular from P to L, are the arcs from A and B drawn on the SAME side of L as P, or the OTHER side? (Type same or other.)',ok:function(v){return/other|opposite/.test(v)}},{t:'In the regular hexagon, each side equals which length of the circle? (Type the word.)',ok:function(v){return/radius/.test(v)}},{t:'The 120° angle is made from how many 60° steps?',ok:function(v){return parseFloat(v)===2||v==='two'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.cpTN').textContent='All done';box.querySelector('.cpQ').textContent='You completed every challenge!';box.querySelector('.cpC').disabled=true;return}box.querySelector('.cpTN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.cpQ').textContent=T[q].t}box.querySelector('.cpC').onclick=function(){var v=String(box.querySelector('.cpA').value).trim().toLowerCase(),fb=box.querySelector('.cpFb');if(T[q].ok(v)){fb.className='fb ok cpFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.cpA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no cpFb';fb.textContent='Not yet. Step through that construction and read each step.'}};draw();task()}},
    {type:'recall',text:'The shortest path meets the road at 90°: it is the perpendicular from the house to the road. Any slanted path is the hypotenuse of a right triangle, so it is longer.'}]},
  {phase:'explain',name:'Teach: lines and angles',title:'Learn: measuring, bisectors, perpendiculars, parallels and angles',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Sharp pencil. Tight compass. Keep di arc.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Drawing and measuring accurately',explain:'<p>CSEC expects lengths accurate to within 1 mm and angles to within 1°. Accuracy starts with good habits: a <strong>sharp pencil</strong>, a ruler whose zero mark is at the start of the line (not the edge of the ruler), and compasses that are tight enough not to slip.</p><p>When using a <strong>protractor</strong>, place its centre exactly on the vertex and line up the base line with one arm of the angle. Protractors have two scales, inner and outer. Start counting from the scale that reads <strong>0°</strong> on your arm, and check whether the angle should be acute or obtuse.</p><p>Remember the difference: to <strong>construct</strong> means using compasses and a ruler; a protractor is only used to <strong>measure</strong> or check.</p>',
     example:{q:'A student measures an obviously acute angle and reads 130°. What has gone wrong?',steps:[{do:'An acute angle is less than 90°, so 130° cannot be right.'},{do:'She read the wrong scale: the other scale gives 180° − 130° = 50°.'},{do:'Always estimate first, then check your reading makes sense.'}]},
     mistake:'Reading the wrong protractor scale. Estimate first: is the angle acute or obtuse?',
     check:{q:'Where should the centre of the protractor go?',o:['Exactly on the vertex of the angle','At the end of one arm','Anywhere on the angle'],a:0,why:'The vertex is the centre of the angle.',hint:'The corner.'}},
    {title:'Bisectors and perpendiculars',explain:'<p>The {{perpendicular bisector|a line cutting a segment in half at 90°}} of AB: open the compasses to more than half of AB, draw arcs from A and B above and below, and join the crossing points.</p><p>The <strong>angle bisector</strong>: draw an arc from the vertex cutting both arms, then equal arcs from those two points; join the vertex to where they cross.</p><p>The syllabus specifically lists <strong>a perpendicular from a point P to a line L, where P is not on L</strong>. With the point on P, draw an arc that cuts L at A and B. Then, from A and B, draw equal arcs that cross on the <strong>other side</strong> of L at R. Join P to R. The point where PR meets L is the {{foot of the perpendicular|where a perpendicular meets the line}}, and PF is the shortest distance from P to L.</p>',visual:DRAWC('pf',3),
     example:{q:'Why does the perpendicular-from-a-point construction work?',steps:[{do:'P is the same distance from A and B (the first arc).'},{do:'R is the same distance from A and B (the equal arcs).'},{do:'So P and R both lie on the perpendicular bisector of AB, which meets L at 90°.'}]},
     mistake:'Drawing the arcs from A and B on the same side as P. They should cross on the OTHER side of L, for accuracy.',
     check:{q:'The shortest distance from a point to a line is along…',o:['the perpendicular','a 45° line','any line'],a:0,why:'A slanted line is a hypotenuse, so it is longer.',hint:'The shortest path.'}},
    {title:'Parallel lines, and angles and their combinations',explain:'<p>To construct a <strong>line through P parallel to L</strong>: draw any line through P meeting L at A. At P, copy the angle that this line makes with L at A (using equal arcs and the same chord length). Equal corresponding angles mean the lines are parallel.</p><p>The syllabus angles: <strong>60°</strong> (equal arcs: an equilateral triangle); <strong>30°</strong> (bisect 60°); <strong>90°</strong> (the perpendicular); <strong>45°</strong> (bisect 90°); <strong>120°</strong> (step around the arc twice with the radius: 60° + 60°).</p><p><strong>Combinations</strong>: 75° = 60° + 15° (or halfway between 60° and 90°); 105° = 60° + 45°; 135° = 90° + 45°; 150° = 90° + 60° (or 180° − 30°); 15° = half of 30°. Plan the combination before you start.</p>',visual:DRAWC('a120',3),
     example:{q:'How would you construct 105°?',steps:[{do:'105° lies exactly halfway between 90° and 120°.'},{do:'Construct 90° and 120° at the same point, on the same base line.'},{do:'Bisect the 30° gap between them: 90° + 15° = 105°.'}]},
     mistake:'Changing the compass width when stepping around for 60° or 120°. The width must stay at the radius.',
     check:{q:'Which combination gives 150°?',o:['90° + 60°','90° + 45°','120° + 45°'],a:0,why:'90 + 60 = 150.',hint:'Add two constructible angles.'}}]}]},
  {phase:'explain',name:'Teach: triangles and polygons',title:'Learn: constructing triangles, quadrilaterals and polygons',lead:'Next, building complete shapes from your constructions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Sketch first. Den construct. Den check.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Constructing triangles',explain:'<p>There are three standard cases. Always start with a labelled <strong>rough sketch</strong>, and usually draw the longest or the given base side first.</p><p><strong>Three sides (SSS):</strong> draw one side; from each end, draw an arc with the other two lengths; they cross at the third vertex.</p><p><strong>Two sides and the included angle (SAS):</strong> draw one side, construct the given angle at one end, and mark the second side along the new arm with compasses.</p><p><strong>Two angles and a side (ASA):</strong> draw the side, construct one angle at each end, and extend the arms until they meet. Remember: the three angles add to 180°, so you can find the third angle if you need it.</p>',
     example:{q:'Construct triangle ABC with AB = 8 cm, angle A = 60° and angle B = 45°. What is angle C?',steps:[{do:'Draw AB = 8 cm.'},{do:'Construct 60° at A and 45° at B. Extend the arms to meet at C.'},{do:'Angle C = 180° − 60° − 45° = 75°. Check it with a protractor.'}]},
     mistake:'Constructing an angle at the wrong end of the base. Label the sketch and match it carefully.',
     check:{q:'Can you construct a triangle with sides 3 cm, 4 cm and 9 cm?',o:['No: the arcs will not meet','Yes','Only with a protractor'],a:0,why:'3 + 4 is less than 9.',hint:'Can the two short sides reach?'}},
    {title:'Constructing quadrilaterals',explain:'<p>For quadrilaterals, combine side lengths and angles step by step. The key is a good sketch showing which sides and angles are given.</p><p>For a <strong>rectangle</strong> or <strong>square</strong>: draw one side, construct 90° at one end, mark the second side, then find the fourth corner with two arcs (lengths of the opposite sides). For a <strong>parallelogram</strong> or <strong>rhombus</strong>: the same, with the given angle instead of 90°. For a <strong>trapezium</strong>: construct the parallel side through a point (two equal corresponding angles, or two right angles).</p><p>Check with properties: a rectangle’s diagonals are equal; a rhombus’s diagonals cross at 90°.</p>',
     example:{q:'Construct parallelogram PQRS with PQ = 7 cm, PS = 5 cm and angle P = 120°.',steps:[{do:'Draw PQ = 7 cm and construct 120° at P.'},{do:'Mark S on the arm, 5 cm from P.'},{do:'From S draw an arc of 7 cm, and from Q an arc of 5 cm; they meet at R. Join QR and SR.'}]},
     mistake:'Using the wrong radii for the final arcs. Opposite sides of a parallelogram are equal: SR = PQ and QR = PS.',
     check:{q:'In rectangle ABCD, how can you check your construction?',o:['The diagonals should be equal','The diagonals should be perpendicular','All sides should be equal'],a:0,why:'Rectangles have equal diagonals.',hint:'A rectangle property.'}},
    {title:'Regular and irregular polygons',explain:'<p>A {{regular polygon|all sides and all angles equal}} has all its sides and angles equal. The <strong>regular hexagon</strong> is a lovely construction: draw a circle, keep the compasses at the radius, and step around the circle six times. Joining the six points gives a regular hexagon, because each side equals the radius (making six equilateral triangles).</p><p>Joining every other point of the hexagon gives an <strong>equilateral triangle</strong>. Constructing two perpendicular diameters gives a <strong>square</strong>; bisecting their right angles gives a <strong>regular octagon</strong>.</p><p>An <strong>irregular polygon</strong> is built from its given sides and angles, one step at a time, as with quadrilaterals. Keep all arcs visible, and check the final shape against the given measurements.</p>',visual:DRAWC('hex',3),
     example:{q:'Why does stepping the radius around a circle give exactly six points?',steps:[{do:'Each step makes a triangle with two radii and a chord equal to the radius: an equilateral triangle.'},{do:'Each centre angle is 60°.'},{do:'360° ÷ 60° = 6, so you return exactly to the start after six steps.'}]},
     mistake:'Letting the compass width slip while stepping round. Even a tiny change means you will not close up exactly.',
     check:{q:'In a regular hexagon drawn in a circle of radius 5 cm, each side is…',o:['5 cm','10 cm','2.5 cm'],a:0,why:'Each side equals the radius.',hint:'Equilateral triangles.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Use your instruments.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Do the "You do" constructions on paper, then answer the check question.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Accuracy',text:'Within 1 mm and 1°. Sharp pencil, tight compasses. Protractor: centre on the vertex, read the scale that starts at 0°.'},{title:'Lines',text:'Perpendicular bisector; angle bisector; perpendicular from P to L (arcs cross on the OTHER side); parallel line (copy the angle).'},{title:'Angles',text:'60° equal arcs; 30° bisect; 90° perpendicular; 45° bisect; 120° step twice. Combine: 75°, 105°, 135°, 150°.'},{title:'Shapes',text:'Triangles: SSS, SAS, ASA. Quadrilaterals: check with properties. Regular hexagon: step the radius six times.'}]},
