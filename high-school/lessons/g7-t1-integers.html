    spots:[{x:220,y:28,t:'A positive integer',d:'Blue Mountain Peak is <strong>2,256 metres above</strong> sea level. Heights above sea level are <strong>positive</strong>: +2,256 or just 2,256.'},{x:640,y:170,t:'Zero',d:'The boat floats at sea level. Sea level is our starting point: <strong>0 m</strong>. Zero is neither positive nor negative.'},{x:470,y:255,t:'A negative integer',d:'The diver is <strong>12 metres below</strong> sea level. Below zero is <strong>negative</strong>: we write <strong>−12</strong>.'},{x:700,y:345,t:'Further below means smaller',d:'The fish is 25 metres below sea level: <strong>−25</strong>. It is deeper than the diver, so −25 is <strong>less than</strong> −12.'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'This lesson builds on ideas from primary school. Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

   blocks:[{type:'mcq',star:true,questions:[{q:'Which number is greater: 47 or 74?',o:['47','74'],a:1,why:'74 has 7 tens; 47 has only 4 tens.',teach:'Compare the tens digits first. 74 has 7 tens and 47 has 4 tens, so 74 is greater.'},{q:'On a number line, as you move to the right, the numbers get…',o:['bigger','smaller'],a:0,why:'Number lines count up from left to right.',teach:'Picture a ruler: 1, 2, 3, 4… The numbers increase as you move to the right.',svg:K.numberLine(0,8,[],{h:90})},{q:'What does the symbol > mean?',o:['is less than','is greater than','is equal to'],a:1,why:'8 > 3 is read "8 is greater than 3".',teach:'The open end of > faces the bigger number, like a mouth opening toward the bigger meal. 8 > 3 means "8 is greater than 3".'},{q:'What is 8 − 8?',o:['16','0','1'],a:1,why:'Taking away everything leaves nothing: zero.',teach:'If you have 8 mangoes and give away all 8, you have none left. The number for "none" is 0.'}]}]},

  {phase:'explore',name:'Number line explorer',title:'Explore the number line',lead:'Move the point along the number line. Watch what happens to the number and its opposite.',

   patois:'Go right, di number get bigger. Go left, it get smaller.',
   blocks:[{type:'custom',star:true,
    html:'<div class="scene nl"></div><div class="controls"><label for="nlr">Move the point:</label><input type="range" id="nlr" min="-10" max="10" value="0"><output class="big nlo">0</output></div><div class="explain nlx" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge nlnum"></span> <strong class="nltask"></strong></p><div class="controls"><button type="button" class="go nlc">Check</button></div><div class="fb nlfb" aria-live="polite">Move the point, then check.</div></div>',
    init:function(box,api){var T=[{t:'Show −6 on the number line.',ok:function(v){return v===-6},hint:function(v){return v>-6?'Too far right. Negative numbers are to the left of zero.':'Too far left. Move one step at a time.'}},{t:'Show the opposite of 7.',ok:function(v){return v===-7},hint:function(){return'The opposite is the same distance from zero, on the other side.'}},{t:'Show an integer greater than −3 but less than 0.',ok:function(v){return v===-2||v===-1},hint:function(v){return v>=0?'It must be less than 0, so it is on the left of zero.':'It must be to the right of −3.'}},{t:'Show the integer that is 5 less than 2.',ok:function(v){return v===-3},hint:function(){return'Start at 2 and count 5 steps to the left.'}}];var k=api.get('step')||0,r=box.querySelector('#nlr');api.nudges(r);function draw(){var v=+r.value,m=[{v:v,label:(v<0?'−'+(-v):v)}];if(v!==0)m.push({v:-v,color:'#b3a6d6',label:'opposite'});box.querySelector('.nl').innerHTML=api.kit.numberLine(-10,10,m,{h:130,label:'Number line from −10 to 10'});var s=v<0?'−'+(-v):String(v);box.querySelector('.nlo').textContent=s;box.querySelector('.nlx').innerHTML=v===0?'<strong>Zero</strong> is the starting point. It is neither positive nor negative.':'<strong>'+s+'</strong> is a <strong>'+(v>0?'positive':'negative')+'</strong> integer, '+Math.abs(v)+' step'+(Math.abs(v)>1?'s':'')+' to the '+(v>0?'right':'left')+' of zero. Its opposite is <strong>'+(v>0?'−'+v:-v)+'</strong>.'}function task(){if(k>=T.length){box.querySelector('.nlnum').textContent='All done';box.querySelector('.nltask').textContent='You completed every challenge!';box.querySelector('.nlc').disabled=true;return}box.querySelector('.nlnum').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.nltask').textContent=T[k].t}r.addEventListener('input',draw);box.querySelector('.nlc').onclick=function(){var v=+r.value,fb=box.querySelector('.nlfb');if(T[k].ok(v)){fb.className='fb ok nlfb';fb.textContent='✓ Yes! Well done.';k++;api.set('step',k);task();if(k===T.length)api.complete()}else{fb.className='fb no nlfb';fb.textContent='Not yet. '+T[k].hint(v)}};draw();task()}}]},
  {phase:'explore',name:'Compare integers',title:'Which is greater?',lead:'On a number line, numbers get bigger as you move to the right. Use that to compare.',
   mission:['Look at each number line picture.','Choose your answer. If it is wrong, read the hint and try again.','Then check your prediction.'],
   patois:'Di number weh deh more to di right a di bigger one.',
   blocks:[{type:'mcq',star:true,questions:[{q:'Which is greater: −8 or −3?',svg:K.numberLine(-10,2,[{v:-8,label:'−8'},{v:-3,label:'−3'}],{h:110}),o:['−8','−3'],a:1,why:'−3 is further right, so it is greater: −3 > −8.',hint:'Which one is further to the right?'},{q:'Which is true?',o:['−5 > 2','−5 < 2'],a:1,why:'Every negative number is less than every positive number.',hint:'Negative numbers are on the left of zero, positive on the right.'},{q:'Which temperature is colder: −2 °C or −9 °C?',o:['−2 °C','−9 °C'],a:1,why:'−9 is further below zero, so it is colder.',hint:'Colder means further below zero.'}]},{type:'recall',text:'Were you right? The number further to the right is always greater, so −3 is greater than −8.'}]},
  {phase:'explain',name:'Teach: what integers are',title:'Learn: what integers are',lead:'Now let\'s learn the proper names and how integers work. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time. Answer di question fi open di next one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Positive and negative numbers',explain:'<p>{{Integers|whole numbers and their negatives: …, −3, −2, −1, 0, 1, 2, 3, …}} are whole numbers that can be positive, negative or zero. There are no fractions or decimals in the integers.</p><p>{{Positive integers|numbers greater than zero, such as 4 or 120}} are greater than zero. We use them for things that are <strong>above</strong>, <strong>gained</strong> or <strong>rising</strong>: a height above sea level, money you earn, a temperature above zero.</p><p>{{Negative integers|numbers less than zero, written with a minus sign, such as −4}} are less than zero. We write them with a minus sign. We use them for things that are <strong>below</strong>, <strong>lost</strong> or <strong>owed</strong>: a depth below sea level, money you owe, a temperature below zero.</p><p><strong>Zero</strong> is the starting point. It is neither positive nor negative.</p>',
     example:{q:'Write each situation as an integer: (a) a temperature 4 degrees below zero; (b) a deposit of $200 into a bank account.',steps:[{do:'(a) "Below zero" tells us the number is negative.',why:'Below, lost and owed are signal words for negative.'},{do:'So 4 degrees below zero is −4 °C.'},{do:'(b) A deposit means money is added: it is a gain.',why:'Gains, rises and "above" are signal words for positive.'},{do:'So a deposit of $200 is +200, or just 200.',why:'We usually leave out the + sign for positive numbers.'}]},
     mistake:'Thinking zero is positive. Zero is the dividing point between positive and negative, so it is <strong>neither</strong>.',
     check:{q:'Owing a friend $30 is written as…',o:['30','−30','0'],a:1,why:'Owing money is a loss, so it is negative: −30.',hint:'Is owing money a gain or a loss?'}},
    {title:'The number line',explain:'<p>A {{number line|numbers placed in order at equal spaces along a line}} shows integers in order. Zero sits in the middle.</p><p>Positive integers go to the <strong>right</strong> of zero: 1, 2, 3, … Negative integers go to the <strong>left</strong> of zero: −1, −2, −3, … Each step is the same size.</p><p>To find an integer, start at zero. The sign tells you which way to go (minus means left) and the number tells you how many steps.</p>',visual:K.numberLine(-10,10,[{v:-7,label:'−7'},{v:4,label:'4'}],{h:120,label:'Number line from −10 to 10 with −7 and 4 marked'}),
     example:{q:'Find −7 on the number line.',steps:[{do:'Start at 0.',why:'Every integer is measured from zero.'},{do:'The minus sign means move to the LEFT.',why:'Negative numbers are on the left side of zero.'},{do:'Count 7 equal steps to the left: −1, −2, −3, −4, −5, −6, −7.'},{do:'That point is −7. It is 7 steps from zero.'}]},
     mistake:'Counting the wrong way. −7 is on the LEFT of zero, not the right. If it is to the right, you have marked +7.',
     check:{q:'Which integer is 3 steps to the left of zero?',o:['3','−3','−4'],a:1,why:'Left of zero means negative, and 3 steps means −3.',hint:'Left of zero means a minus sign.'}},
    {title:'Opposites',explain:'<p>Two integers are {{opposites|integers the same distance from zero but on opposite sides, such as 4 and −4}} if they are the same distance from zero, but on <strong>opposite sides</strong>.</p><p>4 and −4 are opposites: both are 4 steps from zero. To find the opposite of a number, keep the digits and change the sign.</p><p>The opposite of 0 is 0, because zero has no side.</p>',visual:K.numberLine(-6,6,[{v:-4,label:'−4'},{v:4,label:'4'}],{h:110,label:'Number line with −4 and 4 marked, the same distance from zero'}),
     example:{q:'What is the opposite of −9?',steps:[{do:'−9 is 9 steps to the LEFT of zero.'},{do:'Its opposite is 9 steps to the RIGHT of zero.',why:'Opposites are the same distance from zero, on the other side.'},{do:'So the opposite of −9 is 9.'}]},
     mistake:'Thinking every opposite is negative. The opposite of a negative number is POSITIVE: the opposite of −9 is 9.',
     check:{q:'What is the opposite of 15?',o:['15','−15','0'],a:1,why:'15 is 15 steps right of zero, so its opposite is 15 steps left: −15.',hint:'Keep the digits; change the sign.'}}]}]},
  {phase:'explain',name:'Teach: comparing and ordering',title:'Learn: comparing, ordering and changes',lead:'Next, three skills: comparing two integers, putting a list in order, and working out rises and falls.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Di number weh deh more to di right a di bigger one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Comparing two integers',explain:'<p>On a number line, the number further to the <strong>right</strong> is always the <strong>greater</strong> one.</p><p>We use symbols to compare: {{>|"is greater than"}} and {{<|"is less than"}}. The open side of the symbol always faces the greater number. For example, 5 > −1 and −8 < −3.</p><p>Be careful with two negatives: the one <strong>closer to zero</strong> is greater. −2 is greater than −9, because −2 is further right.</p>',visual:K.numberLine(-10,1,[{v:-9,label:'−9'},{v:-2,label:'−2'}],{h:110,label:'Number line with −9 and −2 marked'}),
     example:{q:'Compare −9 and −2 using < or >.',steps:[{do:'Find both on the number line: −9 is 9 steps left of zero; −2 is 2 steps left.'},{do:'−2 is further to the right.',why:'Further right always means greater.'},{do:'So −2 is greater than −9. We write −9 < −2 (or −2 > −9).',why:'The open side of the symbol faces −2, the greater number.'},{do:'Check with temperature: −9 °C is colder than −2 °C.'}]},
     mistake:'Thinking −9 is greater than −2 because 9 is greater than 2. With negatives, the bigger the digits, the SMALLER the number.',
     check:{q:'Which statement is true?',o:['−10 > −1','−1 > −10','−1 = −10'],a:1,why:'−1 is closer to zero, so it is further right and greater.',hint:'Which one is closer to zero?'}},
    {title:'Putting integers in order',explain:'<p>{{Ascending order|from smallest to largest}} means smallest to largest: the order they appear on the number line from left to right.</p><p>A reliable method: first list the negative numbers (the one furthest from zero first), then zero, then the positive numbers (smallest first).</p>',
     example:{q:'Order from smallest to largest: 3, −5, 0, −9, 7',steps:[{do:'Negatives first: −9 and −5. −9 is further from zero, so it comes first: −9, −5.',why:'The negative furthest from zero is the smallest number.'},{do:'Zero comes next.',why:'Zero is bigger than every negative and smaller than every positive.'},{do:'Then the positives, smallest first: 3, 7.'},{do:'Answer: −9, −5, 0, 3, 7.'}]},
     mistake:'Ignoring the minus signs and ordering the digits only (0, 3, 5, 7, 9). The signs matter: −9 is the smallest number in the list.',
     check:{q:'Which list is in ascending order?',o:['−2, −6, 4','−6, −2, 4','4, −2, −6'],a:1,why:'−6 is furthest left, then −2, then 4.',hint:'Put the negative furthest from zero first.'}},
    {title:'Rises and falls',explain:'<p>Integers help us work out changes. A <strong>rise</strong> or <strong>gain</strong> means move <strong>right</strong> on the number line. A <strong>fall</strong> or <strong>loss</strong> means move <strong>left</strong>.</p><p>Start at the first number, then count the steps in the right direction. Crossing zero is fine: just keep counting.</p>',visual:K.numberLine(-4,7,[{v:6,label:'start 6'},{v:-3,label:'end −3',color:'#6a3fc0'}],{h:110,label:'Number line showing a fall from 6 to −3'}),
     example:{q:'The temperature on a mountain is 6 °C. It falls by 9 °C overnight. What is the new temperature?',steps:[{do:'Start at 6.'},{do:'"Falls" means move LEFT 9 steps.',why:'A fall makes the number smaller.'},{do:'6 steps left takes you to 0. You still have 3 more steps.'},{do:'3 more steps left takes you to −3. The new temperature is −3 °C.',why:'Check: 6 − 9 = −3.'}]},
     mistake:'Adding when the temperature falls (6 + 9 = 15). A fall means the number gets smaller, so you move left.',
     check:{q:'A diver is at −4 m. She swims 6 m UP. What is her new position?',o:['−10 m','2 m','10 m'],a:1,why:'Up means right: from −4, 4 steps reaches 0, and 2 more steps reach 2. So she is 2 m above sea level.',hint:'Start at −4 and move 6 steps to the right.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts to remember. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Bigger to the right',text:'Numbers get bigger as you move to the right on the number line, and smaller as you move to the left. For example, 3 is to the right of −1, so 3 is greater than −1. We write 3 > −1.',svg:K.numberLine(-4,4,[{v:-1,label:'−1'},{v:3,label:'3'}],{h:100})},{title:'Negatives are less than positives',text:'Every negative integer is less than zero, and less than every positive integer. For example, −50 is less than 1 (−50 < 1), even though 50 looks bigger than 1. This is because every negative number is on the left of zero and every positive number is on the right.'},{title:'Opposites',text:'An integer and its opposite are the same distance from zero, but on opposite sides. For example, −3 and 3 are both 3 steps from zero. So the opposite of 3 is −3, and the opposite of −3 is 3.',svg:K.numberLine(-5,5,[{v:-3,label:'−3'},{v:3,label:'3'}],{h:100})},{title:'Comparing two negatives',text:'For negative numbers, the bigger the digits, the smaller the number. For example, −9 is less than −2. We write −9 < −2. This is because −9 is 9 steps to the left of zero, which is further left than −2, which is only 2 steps to the left. Think of temperature: −9 °C is colder than −2 °C.',svg:K.numberLine(-10,1,[{v:-9,label:'−9'},{v:-2,label:'−2'}],{h:100})}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Order from smallest to largest: −3, 2, −7, 0',steps:[{do:'Negatives first: −7 is further from zero than −3, so −7, −3.',why:'The negative furthest from zero is the smallest.'},{do:'Then zero.'},{do:'Then the positive number: 2.'},{do:'Answer: −7, −3, 0, 2.'}]},
     {type:'fill',q:'Compare −8 and −3.',steps:[{text:'−8 is ___ steps to the left of zero.',blank:true,a:8,hint:'The digits tell you how many steps from zero.'},{text:'−3 is 3 steps to the left of zero.'},{text:'−8 is further left, so −8 < −3.'}],sol:'−8 is 8 steps left of zero, which is further left than −3, so −8 < −3.'},
     {type:'own',q:'The temperature is −2 °C and it rises by 5 °C. What is the new temperature?',a:3,hint:'Rises means move right. From −2, 2 steps reach 0. How many more?',sol:'−2 + 5 = 3, so the new temperature is 3 °C.',placeholder:'°C'},
     {type:'own',q:'Which is smaller: −15 or −12? Type it.',a:-15,hint:'Which one is further from zero on the left side?',sol:'−15 is further left, so −15 < −12.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order. Some are quick, some are tough. All of them make you think.',

    {icon:'🗂️',title:'Positive, negative or zero?',desc:'Sort real-life situations into the right box.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Ask: is it above zero, below zero, or exactly zero?',bins:[{id:'neg',label:'Negative',hint:'less than 0'},{id:'zero',label:'Zero',hint:'exactly 0'},{id:'pos',label:'Positive',hint:'more than 0'}],

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A negative number is less than zero.',a:'always',why:'Every negative number is to the left of zero on the number line.'},{s:'The opposite of a number is negative.',a:'sometimes',why:'The opposite of 4 is −4 (negative), but the opposite of −4 is 4 (positive), and the opposite of 0 is 0.',hint:'Try finding the opposite of a negative number.'},{s:'Zero is a positive number.',a:'never',why:'Zero is neither positive nor negative.'},{s:'The number further from zero is the greater number.',a:'sometimes',why:'5 is further from zero than 2 and is greater, but −5 is further from zero than −2 and is SMALLER.',hint:'Try two negative numbers, such as −5 and −2.'},{s:'Every positive integer is greater than every negative integer.',a:'always',why:'Positives are all to the right of zero and negatives are all to the left.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Tia',q:'Which is greater: −9 or −4?',lines:['9 is bigger than 4','so −9 is greater than −4'],wrong:1,reasons:['With negatives, the number closer to zero is greater','9 is not bigger than 4','The two numbers are equal'],reason:0,fix:'−4 is further right on the number line, so −4 is greater: −9 < −4.'},{who:'Jordan',q:'The temperature is 3 °C and it falls by 5 °C. What is the new temperature?',lines:['Start at 3','A fall of 5 means 3 + 5','= 8 °C'],wrong:1,reasons:['A fall means moving left, so subtract','He should have started at 5','The answer should be −8'],reason:0,fix:'3 − 5 = −2, so the new temperature is −2 °C.'},{who:'Kayla',q:'Order from smallest to largest: −1, −6, 4, 0',lines:['Ignore the signs: 1, 6, 4, 0','Order them: 0, 1, 4, 6','Put the signs back: 0, −1, 4, −6'],wrong:0,reasons:['You cannot ignore the minus signs','0 is not an integer','The question wanted largest to smallest'],reason:0,fix:'−6, −1, 0, 4.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire questions. Can you beat your best?',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:10,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},f=function(n){return n<0?'−'+(-n):String(n)},r=Math.floor(Math.random()*3);if(r===0){var a=R(-20,20),b=R(-20,20);while(b===a)b=R(-20,20);return{q:'Which is greater: '+f(a)+' or '+f(b)+'?',o:[f(a),f(b)],a:a>b?0:1,why:f(Math.max(a,b))+' is further right on the number line.'}}if(r===1){var n=R(-30,30);while(n===0)n=R(-30,30);return{q:'What is the opposite of '+f(n)+'?',o:[f(-n),f(n),'0'],a:0,why:'Same distance from zero, other side.'}}var t=R(-8,8),c=R(-9,9);while(c===0)c=R(-9,9);return{q:'It is '+f(t)+' °C. The temperature '+(c>0?'rises':'falls')+' by '+Math.abs(c)+' °C. What is it now?',o:(function(){var o=[f(t+c),f(t-c)],x=t+c+(c>0?2:-2);if(o.indexOf(f(-(t+c)))<0)o.push(f(-(t+c)));else o.push(f(x));return o})(),a:0,why:f(t)+(c>0?' + ':' − ')+Math.abs(c)+' = '+f(t+c)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent integers that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a negative integer that is greater than −5.',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(isNaN(x)||Math.round(x)!==x)return{ok:false,msg:'Type a whole number with a minus sign, such as −2.'};if(x<0&&x>-5)return{ok:true,msg:'Yes! '+v+' is negative, and it is to the right of −5 on the number line.'};if(x>=0)return{ok:false,msg:'That is not negative. Use a minus sign.'};return{ok:false,msg:v+' is not greater than −5. It is further left. Try a negative number closer to zero.'}}},{q:'Type an integer between −10 and −6.',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(isNaN(x)||Math.round(x)!==x)return{ok:false,msg:'Type a whole number, such as −8.'};if(x>-10&&x<-6)return{ok:true,msg:'Correct! '+v+' sits between −10 and −6 on the number line.'};return{ok:false,msg:'That is not between −10 and −6. The numbers that work are −9, −8 and −7.'}}},{q:'Type an integer that is exactly 7 steps from zero. (There are two possible answers!)',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(x===7||x===-7)return{ok:true,msg:'Yes! Both 7 and −7 are 7 steps from zero. They are opposites.'};return{ok:false,msg:'Count the steps from zero. Which integers are exactly 7 steps away?'}}}]}},
