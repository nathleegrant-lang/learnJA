window.LESSON={

task();if(k===T.length)api.complete()}else{fb.className='fb no nlfb';fb.textContent='Not yet. '+T[k].hint(v)}};draw();task()}}]},
  {phase:'explore',name:'Compare integers',title:'Which is greater?',lead:'On a number line, numbers get bigger as you move to the right. Use that to compare.',

    {type:'examples',star:true,examples:[{q:'Order from smallest to largest: 3, −5, 0, −9, 7',steps:['Negatives come first. The one furthest from zero is smallest: −9, then −5.','Zero comes next, because it is between the negatives and positives.','Then the positives: 3, then 7.','Answer: −9, −5, 0, 3, 7']},{q:'The temperature on a mountain is 6 °C. It falls by 9 °C overnight. What is the new temperature?',svg:K.numberLine(-4,7,[{v:6,label:'start 6'},{v:-3,label:'end −3',color:'#6a3fc0'}],{h:110}),steps:['Start at 6 on the number line.','Falling means moving left. Move 9 steps left.','6 steps left takes you to 0. 3 more steps takes you to −3.','Answer: −3 °C']},{q:'Fill in < or >: −12 ___ −4',steps:['Picture the number line. −12 is further left than −4.','Further left means smaller.','Answer: −12 < −4']}]}]},

   patois:'Tek yuh time. If yuh get it wrong, read di hint an try again.',
   blocks:[{type:'quiz',star:true,questions:[{q:'Which of these is a negative integer?',o:['7','0','−4','4.5'],a:2,hint:'Look for the minus sign.',why:'−4 is less than zero.',review:6},{q:'Is zero positive or negative?',o:['Positive','Negative','Neither'],a:2,hint:'Zero is the starting point.',why:'Zero is neither positive nor negative.',review:4},{q:'What is the opposite of −9?',o:['−9','9','0','1/9'],a:1,hint:'Same distance from zero, other side.',why:'The opposite of −9 is 9.',review:2},{q:'Which is greater?',o:['−6','−1'],a:1,hint:'Which is further right on the number line?',why:'−1 is further right, so −1 > −6.',review:3},{q:'Which is correct?',o:['−10 > −2','−10 < −2'],a:1,hint:'Further left means smaller.',why:'−10 is further left, so −10 < −2.',review:5},{q:'Order from smallest: 2, −3, 0',o:['0, −3, 2','−3, 0, 2','2, 0, −3'],a:1,hint:'Negatives first, then zero, then positives.',why:'−3 < 0 < 2.',review:5},{q:'The temperature is 3 °C and falls by 5 °C. What is it now?',o:['8 °C','2 °C','−2 °C','−8 °C'],a:2,hint:'Start at 3 and move 5 steps left.',why:'3 − 5 = −2.',review:7},{q:'A diver is 30 m below sea level. Which integer shows this?',o:['30','−30','0','−3'],a:1,hint:'Below sea level is negative.',why:'30 m below is −30.',review:0}]}]},
