  flow:[['Engage','8 min','Find above-zero and below-zero situations in a Jamaican scene; predict.','Ask: where else do we see numbers below zero?'],['Explore','18 min','Move a point on a number line; complete challenges; compare integers.','Prompt: "Which way do numbers get bigger?"'],['Explain','12 min','Key words, number line facts, worked examples.','Model ordering aloud; stress "further left is smaller".'],['Elaborate','14 min','Sort situations; temperature, height and money problems at 3 levels.','Push confident students to Gold.'],['Evaluate','8 min','Quiz with feedback; self-rating and 3-2-1.','Use review suggestions to group students.']],

  {phase:'explore',name:'Number line explorer',title:'Explore the number line',lead:'Move the point along the number line. Watch what happens to the number and its opposite.',

   blocks:[{type:'custom',star:true,
    html:'<div class="scene nl"></div><div class="controls"><label for="nlr">Move the point:</label><input type="range" id="nlr" min="-10" max="10" value="0"><output class="big nlo">0</output></div><div class="explain nlx" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge nlnum"></span> <strong class="nltask"></strong></p><div class="controls"><button type="button" class="go nlc">Check</button></div><div class="fb nlfb" aria-live="polite">Move the point, then check.</div></div>',
    init:function(box,api){var T=[{t:'Show −6 on the number line.',ok:function(v){return v===-6},hint:function(v){return v>-6?'Too far right. Negative numbers are to the left of zero.':'Too far left. Move one step at a time.'}},{t:'Show the opposite of 7.',ok:function(v){return v===-7},hint:function(){return'The opposite is the same distance from zero, on the other side.'}},{t:'Show an integer greater than −3 but less than 0.',ok:function(v){return v===-2||v===-1},hint:function(v){return v>=0?'It must be less than 0, so it is on the left of zero.':'It must be to the right of −3.'}},{t:'Show the integer that is 5 less than 2.',ok:function(v){return v===-3},hint:function(){return'Start at 2 and count 5 steps to the left.'}}];var k=api.get('step')||0,r=box.querySelector('#nlr');api.nudges(r);function draw(){var v=+r.value,m=[{v:v,label:(v<0?'−'+(-v):v)}];if(v!==0)m.push({v:-v,color:'#b3a6d6',label:'opposite'});box.querySelector('.nl').innerHTML=api.kit.numberLine(-10,10,m,{h:130,label:'Number line from −10 to 10'});var s=v<0?'−'+(-v):String(v);box.querySelector('.nlo').textContent=s;box.querySelector('.nlx').innerHTML=v===0?'<strong>Zero</strong> is the starting point. It is neither positive nor negative.':'<strong>'+s+'</strong> is a <strong>'+(v>0?'positive':'negative')+'</strong> integer, '+Math.abs(v)+' step'+(Math.abs(v)>1?'s':'')+' to the '+(v>0?'right':'left')+' of zero. Its opposite is <strong>'+(v>0?'−'+v:-v)+'</strong>.'}function task(){if(k>=T.length){box.querySelector('.nlnum').textContent='All done';box.querySelector('.nltask').textContent='You completed every challenge!';box.querySelector('.nlc').disabled=true;return}box.querySelector('.nlnum').textContent='Challenge '+(k+1)+' of '+T.length;box.querySelector('.nltask').textContent=T[k].t}r.addEventListener('input',draw);box.querySelector('.nlc').onclick=function(){var v=+r.value,fb=box.querySelector('.nlfb');if(T[k].ok(v)){fb.className='fb ok nlfb';fb.textContent='✓ Yes! Well done.';k++;api.set('step',k);task();if(k===T.length)api.complete()}else{fb.className='fb no nlfb';fb.textContent='Not yet. '+T[k].hint(v)}};draw();task()}}]},
  {phase:'explore',name:'Compare integers',title:'Which is greater?',lead:'On a number line, numbers get bigger as you move to the right. Use that to compare.',
   mission:['Look at each number line picture.','Choose your answer. If it is wrong, read the hint and try again.','Then check your prediction.'],
   patois:'Di number weh deh more to di right a di bigger one.',
   blocks:[{type:'mcq',star:true,questions:[{q:'Which is greater: −8 or −3?',svg:K.numberLine(-10,2,[{v:-8,label:'−8'},{v:-3,label:'−3'}],{h:110}),o:['−8','−3'],a:1,why:'−3 is further right, so it is greater: −3 > −8.',hint:'Which one is further to the right?'},{q:'Which is true?',o:['−5 > 2','−5 < 2'],a:1,why:'Every negative number is less than every positive number.',hint:'Negative numbers are on the left of zero, positive on the right.'},{q:'Which temperature is colder: −2 °C or −9 °C?',o:['−2 °C','−9 °C'],a:1,why:'−9 is further below zero, so it is colder.',hint:'Colder means further below zero.'}]},{type:'recall',text:'Were you right? The number further to the right is always greater, so −3 is greater than −8.'}]},
  {phase:'explain',name:'Teach: what integers are',title:'Learn: what integers are',lead:'Now let\'s learn the proper names and how integers work. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time. Answer di question fi open di next one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Positive and negative numbers',explain:'<p>Think about a hot afternoon in Kingston. The temperature might be 32 degrees. Now think about the top of Blue Mountain Peak on a cold night, or a freezer: the temperature can drop below zero. How do we write a temperature that is <em>below</em> zero? We need numbers on the other side of zero.</p><p>That is where {{negative integers|numbers less than zero, written with a minus sign, such as −4}} come in. We write them with a minus sign in front: −4 means “4 below zero”. The ordinary counting numbers, like 4 or 120, are {{positive integers|numbers greater than zero}}. Together with zero, they make the {{integers|whole numbers and their negatives: …, −2, −1, 0, 1, 2, …}}.</p><p>Here is a helpful way to decide. Words like <strong>below</strong>, <strong>owe</strong>, <strong>lose</strong> and <strong>fall</strong> usually point to a negative number. Words like <strong>above</strong>, <strong>earn</strong>, <strong>gain</strong> and <strong>rise</strong> point to a positive number. And zero sits right in the middle: it is the starting point, so it is neither positive nor negative.</p>',
     example:{q:'Write each situation as an integer: (a) a temperature 4 degrees below zero; (b) a deposit of $200 into a bank account.',steps:[{do:'(a) "Below zero" tells us the number is negative.',why:'Below, lost and owed are signal words for negative.'},{do:'So 4 degrees below zero is −4 °C.'},{do:'(b) A deposit means money is added: it is a gain.',why:'Gains, rises and "above" are signal words for positive.'},{do:'So a deposit of $200 is +200, or just 200.',why:'We usually leave out the + sign for positive numbers.'}]},
     mistake:'Thinking zero is positive. Zero is the dividing point between positive and negative, so it is <strong>neither</strong>.',
     check:{q:'Owing a friend $30 is written as…',o:['30','−30','0'],a:1,why:'Owing money is a loss, so it is negative: −30.',hint:'Is owing money a gain or a loss?'}},
    {title:'The number line',explain:'<p>A {{number line|numbers placed in order at equal spaces along a line}} is like a ruler that keeps going in both directions. Zero sits in the middle. As you walk to the <strong>right</strong>, the numbers get bigger: 1, 2, 3, … As you walk to the <strong>left</strong>, you pass zero and keep going: −1, −2, −3, …</p><p>Each step is exactly the same size, just like the marks on a ruler. That is important, because it means −3 is exactly as far from zero as 3 is; it is just on the other side.</p><p>To find any integer, always start at zero. The sign tells you which way to walk (minus means left), and the number tells you how many steps to take. So −7 means “start at zero, walk 7 steps to the left”. The number line is the best tool for understanding integers, so picture it whenever you feel unsure.</p>',visual:K.numberLine(-10,10,[{v:-7,label:'−7'},{v:4,label:'4'}],{h:120,label:'Number line from −10 to 10 with −7 and 4 marked'}),
     example:{q:'Find −7 on the number line.',steps:[{do:'Start at 0.',why:'Every integer is measured from zero.'},{do:'The minus sign means move to the LEFT.',why:'Negative numbers are on the left side of zero.'},{do:'Count 7 equal steps to the left: −1, −2, −3, −4, −5, −6, −7.'},{do:'That point is −7. It is 7 steps from zero.'}]},
     mistake:'Counting the wrong way. −7 is on the LEFT of zero, not the right. If it is to the right, you have marked +7.',
     check:{q:'Which integer is 3 steps to the left of zero?',o:['3','−3','−4'],a:1,why:'Left of zero means negative, and 3 steps means −3.',hint:'Left of zero means a minus sign.'}},
    {title:'Opposites',explain:'<p>Imagine two friends standing back to back at the zero mark. One walks 4 steps to the right, and the other walks 4 steps to the left. They have walked exactly the same distance, just in opposite directions. One is standing at 4, the other at −4.</p><p>Numbers like these are called {{opposites|integers the same distance from zero but on opposite sides, such as 4 and −4}}. They are the same distance from zero, but on opposite sides.</p><p>Finding an opposite is easy once you see it: keep the digits the same, and change the sign. The opposite of 9 is −9, and the opposite of −9 is 9. What about zero? Zero has no side, so its opposite is itself: 0.</p><p>One fun fact: if you add a number and its opposite, you always get zero. 4 + (−4) = 0. Walking 4 right and then 4 left brings you straight back to the start.</p>',visual:K.numberLine(-6,6,[{v:-4,label:'−4'},{v:4,label:'4'}],{h:110,label:'Number line with −4 and 4 marked, the same distance from zero'}),
     example:{q:'What is the opposite of −9?',steps:[{do:'−9 is 9 steps to the LEFT of zero.'},{do:'Its opposite is 9 steps to the RIGHT of zero.',why:'Opposites are the same distance from zero, on the other side.'},{do:'So the opposite of −9 is 9.'}]},
     mistake:'Thinking every opposite is negative. The opposite of a negative number is POSITIVE: the opposite of −9 is 9.',
     check:{q:'What is the opposite of 15?',o:['15','−15','0'],a:1,why:'15 is 15 steps right of zero, so its opposite is 15 steps left: −15.',hint:'Keep the digits; change the sign.'}}]}]},
  {phase:'explain',name:'Teach: comparing, ordering and operations',title:'Learn: comparing, ordering and calculating with integers',lead:'Next, three skills: comparing two integers, putting a list in order, and working out rises and falls.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Di number weh deh more to di right a di bigger one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Comparing two integers',explain:'<p>Which is bigger, −2 or −9? Many people say −9, because 9 is bigger than 2. But think about temperatures: is −9 degrees warmer or colder than −2 degrees? It is colder! −9 is the <em>smaller</em> number.</p><p>The number line makes this clear. Remember, numbers get bigger as you go to the right. −2 is only 2 steps left of zero, but −9 is 9 steps left, much further left. So −2 is greater than −9.</p><p>Here is the simple rule: <strong>the number further to the right is always the greater number.</strong> For two negative numbers, that means the one closer to zero is greater.</p><p>We use the symbols {{>|is greater than}} and {{<|is less than}} to compare. A good way to remember them: the open mouth of the symbol always faces the bigger number, as if it wants to eat the bigger meal. So we write −9 &lt; −2, or −2 &gt; −9.</p>',visual:K.numberLine(-10,1,[{v:-9,label:'−9'},{v:-2,label:'−2'}],{h:110,label:'Number line with −9 and −2 marked'}),
     example:{q:'Compare −9 and −2 using < or >.',steps:[{do:'Find both on the number line: −9 is 9 steps left of zero; −2 is 2 steps left.'},{do:'−2 is further to the right.',why:'Further right always means greater.'},{do:'So −2 is greater than −9. We write −9 < −2 (or −2 > −9).',why:'The open side of the symbol faces −2, the greater number.'},{do:'Check with temperature: −9 °C is colder than −2 °C.'}]},
     mistake:'Thinking −9 is greater than −2 because 9 is greater than 2. With negatives, the bigger the digits, the SMALLER the number.',
     check:{q:'Which statement is true?',o:['−10 > −1','−1 > −10','−1 = −10'],a:1,why:'−1 is closer to zero, so it is further right and greater.',hint:'Which one is closer to zero?'}},
    {title:'Putting integers in order',explain:'<p>Putting numbers in {{ascending order|from smallest to largest}} means lining them up from smallest to largest, just like the order they appear on the number line from left to right.</p><p>With a mix of positive and negative numbers, it is easy to get muddled, so here is a reliable plan. First, find all the <strong>negative</strong> numbers. The one furthest from zero is the smallest, so it goes first. Next comes <strong>zero</strong>, if it is in the list. Then the <strong>positive</strong> numbers, from smallest to largest.</p><p>For example, to order 3, −5, 0, −9, 7: the negatives are −9 and −5, and −9 is further from zero, so it comes first. Then −5, then 0, then 3, then 7.</p><p>If you ever get stuck, sketch a quick number line and place each number on it. Then just read them off from left to right.</p>',
     example:{q:'Order from smallest to largest: 3, −5, 0, −9, 7',steps:[{do:'Negatives first: −9 and −5. −9 is further from zero, so it comes first: −9, −5.',why:'The negative furthest from zero is the smallest number.'},{do:'Zero comes next.',why:'Zero is bigger than every negative and smaller than every positive.'},{do:'Then the positives, smallest first: 3, 7.'},{do:'Answer: −9, −5, 0, 3, 7.'}]},
     mistake:'Ignoring the minus signs and ordering the digits only (0, 3, 5, 7, 9). The signs matter: −9 is the smallest number in the list.',
     check:{q:'Which list is in ascending order?',o:['−2, −6, 4','−6, −2, 4','4, −2, −6'],a:1,why:'−6 is furthest left, then −2, then 4.',hint:'Put the negative furthest from zero first.'}},
    {title:'Rises and falls',explain:'<p>Integers really come alive when things change. A temperature rises or falls. A diver swims up or down. Your bank balance goes up when you get paid and down when you spend.</p><p>The number line turns these changes into simple walks. Start at the first number. A <strong>rise</strong>, <strong>gain</strong> or movement <strong>up</strong> means walk to the <strong>right</strong>. A <strong>fall</strong>, <strong>loss</strong> or movement <strong>down</strong> means walk to the <strong>left</strong>. Count the steps, and where you stop is your answer.</p><p>Don’t worry if you have to cross zero along the way; just keep counting. If the temperature is 6 degrees and it falls by 9, walk 6 steps left to reach 0, then 3 more steps left to reach −3. The new temperature is −3 degrees.</p>',visual:K.numberLine(-4,7,[{v:6,label:'start 6'},{v:-3,label:'end −3',color:'#6a3fc0'}],{h:110,label:'Number line showing a fall from 6 to −3'}),
     example:{q:'The temperature on a mountain is 6 °C. It falls by 9 °C overnight. What is the new temperature?',steps:[{do:'Start at 6.'},{do:'"Falls" means move LEFT 9 steps.',why:'A fall makes the number smaller.'},{do:'6 steps left takes you to 0. You still have 3 more steps.'},{do:'3 more steps left takes you to −3. The new temperature is −3 °C.',why:'Check: 6 − 9 = −3.'}]},
     mistake:'Adding when the temperature falls (6 + 9 = 15). A fall means the number gets smaller, so you move left.',
     check:{q:'A diver is at −4 m. She swims 6 m UP. What is her new position?',o:['−10 m','2 m','10 m'],a:1,why:'Up means right: from −4, 4 steps reaches 0, and 2 more steps reach 2. So she is 2 m above sea level.',hint:'Start at −4 and move 6 steps to the right.'}},{title:'Multiplying integers',explain:'<p><strong>Picture it:</strong> Kemar’s phone company takes $50 of credit for his data plan every week. Taking away $50 is −50. After 3 weeks, the change in his credit is 3 lots of −50: <strong>3 × (−50) = −150</strong>. He has $150 less. So a positive × a negative gives a negative.</p><p>But what is a negative × a negative, such as (−3) × (−2)? Look at the pattern in the table. As the second number goes down by 1, the answer goes UP by 3 every time. When the pattern continues past 0, the answers become positive: (−3) × (−1) = 3 and (−3) × (−2) = 6.</p><p><strong>The rules:</strong> when the signs are the SAME, the answer is positive; when the signs are DIFFERENT, the answer is negative.</p>',visual:'<svg viewBox="0 0 460 250" role="img" aria-label="Pattern table: negative 3 times 3, 2, 1, 0, minus 1, minus 2 gives minus 9, minus 6, minus 3, 0, 3, 6, going up by 3 each time"><rect width="460" height="250" fill="#faf8fe"/><text x="40" y="40" font-size="17" font-family="Arial" fill="#2a2140">(−3) × 3</text><text x="190" y="40" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="40" font-size="17" font-weight="700" font-family="Arial" fill="#2a2140">−9</text><text x="40" y="74" font-size="17" font-family="Arial" fill="#2a2140">(−3) × 2</text><text x="190" y="74" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="74" font-size="17" font-weight="700" font-family="Arial" fill="#2a2140">−6</text><text x="40" y="108" font-size="17" font-family="Arial" fill="#2a2140">(−3) × 1</text><text x="190" y="108" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="108" font-size="17" font-weight="700" font-family="Arial" fill="#2a2140">−3</text><text x="40" y="142" font-size="17" font-family="Arial" fill="#2a2140">(−3) × 0</text><text x="190" y="142" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="142" font-size="17" font-weight="700" font-family="Arial" fill="#2a2140">0</text><text x="40" y="176" font-size="17" font-family="Arial" fill="#2a2140">(−3) × (−1)</text><text x="190" y="176" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="176" font-size="17" font-weight="700" font-family="Arial" fill="#155c35">3</text><text x="40" y="210" font-size="17" font-family="Arial" fill="#2a2140">(−3) × (−2)</text><text x="190" y="210" font-size="17" font-family="Arial" fill="#2a2140">=</text><text x="220" y="210" font-size="17" font-weight="700" font-family="Arial" fill="#155c35">6</text><path d="M268 34 q22 17 0 34" fill="none" stroke="#a85d00" stroke-width="2"/><text x="294" y="56" font-size="13" fill="#7a4300">+3</text><path d="M268 68 q22 17 0 34" fill="none" stroke="#a85d00" stroke-width="2"/><text x="294" y="90" font-size="13" fill="#7a4300">+3</text><path d="M268 102 q22 17 0 34" fill="none" stroke="#a85d00" stroke-width="2"/><text x="294" y="124" font-size="13" fill="#7a4300">+3</text><path d="M268 136 q22 17 0 34" fill="none" stroke="#a85d00" stroke-width="2"/><text x="294" y="158" font-size="13" fill="#7a4300">+3</text><path d="M268 170 q22 17 0 34" fill="none" stroke="#a85d00" stroke-width="2"/><text x="294" y="192" font-size="13" fill="#7a4300">+3</text><text x="330" y="120" font-size="13" fill="#3d2a73">The answers go</text><text x="330" y="138" font-size="13" fill="#3d2a73">up by 3 each time,</text><text x="330" y="156" font-size="13" fill="#3d2a73">so the pattern</text><text x="330" y="174" font-size="13" font-weight="700" fill="#155c35">must carry on: 3, 6</text></svg>',example:{q:'The temperature in a freezer drops by 3 °C every hour. What is the change after 4 hours? And what was the change 2 hours AGO compared with now (time −2)?',steps:[{do:'A drop of 3 °C each hour is −3. After 4 hours: 4 × (−3) = −12 °C.',why:'Different signs: the answer is negative.'},{do:'2 hours ago is time −2: (−2) × (−3) = +6 °C.',why:'Same signs: the answer is positive. Two hours ago, the freezer was 6 °C WARMER than now.'}]},mistake:'Thinking that two negatives always give a negative. For multiplying, two negatives give a POSITIVE: (−4) × (−5) = 20.',check:{q:'What is (−6) × (−4)?',o:['24','−24','−10'],a:0,why:'Same signs give a positive answer: 6 × 4 = 24.',hint:'Are the signs the same or different?'}},{title:'Dividing integers',explain:'<p><strong>Picture it:</strong> On a cold night in Mandeville, the temperature falls by 12 °C over 4 hours, at the same rate each hour. The change each hour is −12 ÷ 4 = <strong>−3 °C</strong>: it fell 3 degrees every hour.</p><p>Dividing undoes multiplying. Because 4 × (−3) = −12, it must be true that −12 ÷ 4 = −3 and −12 ÷ (−3) = 4. So division follows exactly the <strong>same sign rules</strong> as multiplication: same signs give a positive answer; different signs give a negative answer.</p>',visual:'<svg viewBox="0 0 420 210" role="img" aria-label="Sign rules: same signs give a positive answer; different signs give a negative answer, for both multiplying and dividing"><rect width="420" height="210" fill="#faf8fe"/><g font-family="Arial"><rect x="20" y="20" width="185" height="80" rx="10" fill="#dff3e8" stroke="#16766a" stroke-width="2"/><text x="112" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#155c35">SAME signs → +</text><text x="112" y="74" text-anchor="middle" font-size="14" fill="#2a2140">(+) × (+) = +</text><text x="112" y="92" text-anchor="middle" font-size="14" fill="#2a2140">(−) × (−) = +</text><rect x="215" y="20" width="185" height="80" rx="10" fill="#fdecef" stroke="#c02d5f" stroke-width="2"/><text x="307" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#8f1f2b">DIFFERENT signs → −</text><text x="307" y="74" text-anchor="middle" font-size="14" fill="#2a2140">(+) × (−) = −</text><text x="307" y="92" text-anchor="middle" font-size="14" fill="#2a2140">(−) × (+) = −</text><text x="210" y="135" text-anchor="middle" font-size="14" fill="#3d2a73">The same rules work for dividing:</text><text x="210" y="162" text-anchor="middle" font-size="15" fill="#2a2140">(−12) ÷ (−4) = 3      (−12) ÷ 4 = −3      12 ÷ (−4) = −3</text><text x="210" y="192" text-anchor="middle" font-size="13" fill="#5d5478">Division undoes multiplication, so it follows the same sign rules.</text></g></svg>',example:{q:'Calculate (a) (−20) ÷ 5, (b) (−20) ÷ (−5), (c) 20 ÷ (−5).',steps:[{do:'(a) Different signs: −4.'},{do:'(b) Same signs: 4.'},{do:'(c) Different signs: −4.',why:'Check by multiplying back: (−5) × (−4) = 20 ✓'}]},mistake:'Using different rules for dividing. The sign rules are the SAME as for multiplying.',check:{q:'What is (−18) ÷ (−3)?',o:['6','−6','−15'],a:0,why:'Same signs give a positive answer: 18 ÷ 3 = 6.',hint:'Same signs, or different?'}},{title:'The order of operations',explain:'<p><strong>Picture it:</strong> Shanice buys 2 drinks at $150 each and has a $100 discount voucher. Her bill is 2 × 150 − 100 = 300 − 100 = $200. If she did the subtraction first, 150 − 100 = 50, then 2 × 50 = $100, she would think the bill was half what it really is! Everyone must work out a calculation in the same order, so that everyone gets the same answer.</p><p>The order is: <strong>1.</strong> Brackets; <strong>2.</strong> Powers; <strong>3.</strong> Multiply and divide, working from left to right; <strong>4.</strong> Add and subtract, working from left to right. Many people remember this as <strong>BODMAS</strong>.</p><p>With integers, take extra care with the signs at each step.</p>',visual:'<svg viewBox="0 0 460 250" role="img" aria-label="Order of operations ladder: brackets first, then powers, then multiply and divide from left to right, then add and subtract from left to right"><rect width="460" height="250" fill="#faf8fe"/><g font-family="Arial"><rect x="20" y="20" width="300" height="42" rx="8" fill="#e4ecfb" stroke="#3d2a73"/><text x="36" y="47" font-size="15" font-weight="700" fill="#2a2140">1. Brackets ( )</text><rect x="60" y="74" width="300" height="42" rx="8" fill="#efe8ff" stroke="#3d2a73"/><text x="76" y="101" font-size="15" font-weight="700" fill="#2a2140">2. Powers (indices)</text><rect x="100" y="128" width="300" height="42" rx="8" fill="#fff4e0" stroke="#3d2a73"/><text x="116" y="155" font-size="15" font-weight="700" fill="#2a2140">3. × and ÷, left to right</text><rect x="140" y="182" width="300" height="42" rx="8" fill="#dff3e8" stroke="#3d2a73"/><text x="156" y="209" font-size="15" font-weight="700" fill="#2a2140">4. + and −, left to right</text></g></svg>',example:{q:'Calculate −3 + 4 × (−2).',steps:[{do:'Multiply first: 4 × (−2) = −8.',why:'Multiplication comes before addition.'},{do:'Then add: −3 + (−8) = −11.'}]},mistake:'Working from left to right regardless of the operation: −3 + 4 = 1, then 1 × (−2) = −2 is WRONG. Multiply before you add.',check:{q:'What is 10 − 2 × (−3)?',o:['16','−24','4'],a:0,why:'Multiply first: 2 × (−3) = −6. Then 10 − (−6) = 16.',hint:'Multiply before you subtract.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts to remember. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Bigger to the right',text:'Numbers get bigger as you move to the right on the number line, and smaller as you move to the left. For example, 3 is to the right of −1, so 3 is greater than −1. We write 3 > −1.',svg:K.numberLine(-4,4,[{v:-1,label:'−1'},{v:3,label:'3'}],{h:100})},{title:'Negatives are less than positives',text:'Every negative integer is less than zero, and less than every positive integer. For example, −50 is less than 1 (−50 < 1), even though 50 looks bigger than 1. This is because every negative number is on the left of zero and every positive number is on the right.'},{title:'Opposites',text:'An integer and its opposite are the same distance from zero, but on opposite sides. For example, −3 and 3 are both 3 steps from zero. So the opposite of 3 is −3, and the opposite of −3 is 3.',svg:K.numberLine(-5,5,[{v:-3,label:'−3'},{v:3,label:'3'}],{h:100})},{title:'Comparing two negatives',text:'For negative numbers, the bigger the digits, the smaller the number. For example, −9 is less than −2. We write −9 < −2. This is because −9 is 9 steps to the left of zero, which is further left than −2, which is only 2 steps to the left. Think of temperature: −9 °C is colder than −2 °C.',svg:K.numberLine(-10,1,[{v:-9,label:'−9'},{v:-2,label:'−2'}],{h:100})}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Order from smallest to largest: −3, 2, −7, 0',steps:[{do:'Negatives first: −7 is further from zero than −3, so −7, −3.',why:'The negative furthest from zero is the smallest.'},{do:'Then zero.'},{do:'Then the positive number: 2.'},{do:'Answer: −7, −3, 0, 2.'}]},
     {type:'fill',q:'Compare −8 and −3.',steps:[{text:'−8 is ___ steps to the left of zero.',blank:true,a:8,hint:'The digits tell you how many steps from zero.'},{text:'−3 is 3 steps to the left of zero.'},{text:'−8 is further left, so −8 < −3.'}],sol:'−8 is 8 steps left of zero, which is further left than −3, so −8 < −3.'},
     {type:'own',q:'The temperature is −2 °C and it rises by 5 °C. What is the new temperature?',a:3,hint:'Rises means move right. From −2, 2 steps reach 0. How many more?',sol:'−2 + 5 = 3, so the new temperature is 3 °C.',placeholder:'°C'},
     {type:'own',q:'Which is smaller: −15 or −12? Type it.',a:-15,hint:'Which one is further from zero on the left side?',sol:'−15 is further left, so −15 < −12.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order. Some are quick, some are tough. All of them make you think.',

   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Positive, negative or zero?',desc:'Sort real-life situations into the right box.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Ask: is it above zero, below zero, or exactly zero?',bins:[{id:'neg',label:'Negative',hint:'less than 0'},{id:'zero',label:'Zero',hint:'exactly 0'},{id:'pos',label:'Positive',hint:'more than 0'}],
    items:[{label:'−7',bin:'neg'},{label:'12',bin:'pos'},{label:'0',bin:'zero'},{label:'5 m below sea level',bin:'neg'},{label:'A gain of $300',bin:'pos'},{label:'A temperature of 0 °C',bin:'zero'},{label:'Height of Blue Mountain Peak',bin:'pos'},{label:'Owing $50',bin:'neg'}]}},
    {icon:'🃏',title:'Match it',desc:'Match each situation to its integer.',level:'⭐ Warm-up',mins:3,block:{type:'match',pairs:[['5 m below sea level','−5'],['a gain of $50','50'],['3 degrees below zero','−3'],['sea level','0'],['a loss of $20','−20'],['4 floors up','4']]}},
    {icon:'📏',title:'Order it!',desc:'Put integers in order, from easy to tricky.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Tap the integers from smallest to largest.',rounds:[[{label:'−3',v:-3,show:'−3'},{label:'5',v:5,show:'5'},{label:'−8',v:-8,show:'−8'},{label:'0',v:0,show:'0'}],[{label:'−12',v:-12,show:'−12'},{label:'−2',v:-2,show:'−2'},{label:'−20',v:-20,show:'−20'},{label:'−9',v:-9,show:'−9'}],[{label:'−15',v:-15,show:'−15'},{label:'15',v:15,show:'15'},{label:'−51',v:-51,show:'−51'},{label:'5',v:5,show:'5'},{label:'−1',v:-1,show:'−1'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A negative number is less than zero.',a:'always',why:'Every negative number is to the left of zero on the number line.'},{s:'The opposite of a number is negative.',a:'sometimes',why:'The opposite of 4 is −4 (negative), but the opposite of −4 is 4 (positive), and the opposite of 0 is 0.',hint:'Try finding the opposite of a negative number.'},{s:'Zero is a positive number.',a:'never',why:'Zero is neither positive nor negative.'},{s:'The number further from zero is the greater number.',a:'sometimes',why:'5 is further from zero than 2 and is greater, but −5 is further from zero than −2 and is SMALLER.',hint:'Try two negative numbers, such as −5 and −2.'},{s:'Every positive integer is greater than every negative integer.',a:'always',why:'Positives are all to the right of zero and negatives are all to the left.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Tia',q:'Which is greater: −9 or −4?',lines:['9 is bigger than 4','so −9 is greater than −4'],wrong:1,reasons:['With negatives, the number closer to zero is greater','9 is not bigger than 4','The two numbers are equal'],reason:0,fix:'−4 is further right on the number line, so −4 is greater: −9 < −4.'},{who:'Jordan',q:'The temperature is 3 °C and it falls by 5 °C. What is the new temperature?',lines:['Start at 3','A fall of 5 means 3 + 5','= 8 °C'],wrong:1,reasons:['A fall means moving left, so subtract','He should have started at 5','The answer should be −8'],reason:0,fix:'3 − 5 = −2, so the new temperature is −2 °C.'},{who:'Kayla',q:'Order from smallest to largest: −1, −6, 4, 0',lines:['Ignore the signs: 1, 6, 4, 0','Order them: 0, 1, 4, 6','Put the signs back: 0, −1, 4, −6'],wrong:0,reasons:['You cannot ignore the minus signs','0 is not an integer','The question wanted largest to smallest'],reason:0,fix:'−6, −1, 0, 4.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire questions. Can you beat your best?',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:10,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},f=function(n){return n<0?'−'+(-n):String(n)},r=Math.floor(Math.random()*3);if(r===0){var a=R(-20,20),b=R(-20,20);while(b===a)b=R(-20,20);return{q:'Which is greater: '+f(a)+' or '+f(b)+'?',o:[f(a),f(b)],a:a>b?0:1,why:f(Math.max(a,b))+' is further right on the number line.'}}if(r===1){var n=R(-30,30);while(n===0)n=R(-30,30);return{q:'What is the opposite of '+f(n)+'?',o:[f(-n),f(n),'0'],a:0,why:'Same distance from zero, other side.'}}var t=R(-8,8),c=R(-9,9);while(c===0)c=R(-9,9);return{q:'It is '+f(t)+' °C. The temperature '+(c>0?'rises':'falls')+' by '+Math.abs(c)+' °C. What is it now?',o:(function(){var o=[f(t+c),f(t-c)],x=t+c+(c>0?2:-2);if(o.indexOf(f(-(t+c)))<0)o.push(f(-(t+c)));else o.push(f(x));return o})(),a:0,why:f(t)+(c>0?' + ':' − ')+Math.abs(c)+' = '+f(t+c)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent integers that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a negative integer that is greater than −5.',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(isNaN(x)||Math.round(x)!==x)return{ok:false,msg:'Type a whole number with a minus sign, such as −2.'};if(x<0&&x>-5)return{ok:true,msg:'Yes! '+v+' is negative, and it is to the right of −5 on the number line.'};if(x>=0)return{ok:false,msg:'That is not negative. Use a minus sign.'};return{ok:false,msg:v+' is not greater than −5. It is further left. Try a negative number closer to zero.'}}},{q:'Type an integer between −10 and −6.',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(isNaN(x)||Math.round(x)!==x)return{ok:false,msg:'Type a whole number, such as −8.'};if(x>-10&&x<-6)return{ok:true,msg:'Correct! '+v+' sits between −10 and −6 on the number line.'};return{ok:false,msg:'That is not between −10 and −6. The numbers that work are −9, −8 and −7.'}}},{q:'Type an integer that is exactly 7 steps from zero. (There are two possible answers!)',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(x===7||x===-7)return{ok:true,msg:'Yes! Both 7 and −7 are 7 steps from zero. They are opposites.'};return{ok:false,msg:'Count the steps from zero. Which integers are exactly 7 steps away?'}}}]}},
    {icon:'🤿',title:'Mission: from the reef to the peak',desc:'Follow a diver and a hiker, from below the sea to Blue Mountain Peak.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Keisha is diving on a reef off Ocho Rios, while her brother Dwayne is hiking up Blue Mountain Peak, 2,256 m above sea level. Use integers to follow their adventure.',parts:[{q:'Keisha dives to 18 m below sea level. Write her position as an integer.',a:-18,hint:'Below sea level is negative.',sol:'18 m below sea level is −18.'},{q:'She swims up 7 m. What is her new position?',a:-11,hint:'Up means move right on the number line: start at −18 and count 7 steps right.',sol:'−18 + 7 = −11 m.'},{q:'A parrotfish is at −15 m. Who is lower: Keisha at −11 m or the fish? Type the lower position.',a:-15,hint:'Lower means further below sea level: further left on the number line.',sol:'−15 < −11, so the fish is lower.'},{q:'Dwayne reaches the peak at 2,256 m while Keisha is at −11 m. How far above Keisha is Dwayne, in metres?',a:2267,hint:'From −11 up to 0 is 11 m. Then add the distance from 0 up to 2,256 m.',sol:'11 + 2,256 = 2,267 m.'},{q:'Keisha then dives 9 m deeper from −11 m. What is her new position?',a:-20,hint:'Deeper means move left: start at −11 and count 9 steps left.',sol:'−11 − 9 = −20 m.'}],done:'You used integers to describe positions, compare depths and find distances across zero.'}}
