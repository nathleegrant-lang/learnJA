 goals:['explain what makes a collection a well-defined set','describe a set in words, by listing, and in set builder notation','use set symbols such as ∈, ⊂, U, ∅ and A′ correctly','list all the subsets of a set and find how many there are'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Sets',strand:'Sets',standard:'Module 1, Sets: demonstrate the ability to communicate using set language and concepts; demonstrate the ability to reason logically; appreciate the importance and utility of sets in analysing and solving real-world problems.',

  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 1, Section 3. Venn diagrams and problem solving (3.4, 3.6–3.8) are covered in the next lesson.'},
 glossary:[['Set','A well-defined collection of objects.'],['Element (∈)','A member of a set. 3 ∈ {1, 2, 3} means 3 is an element of the set.'],['Cardinality n(A)','The number of elements in set A.'],['Finite set','A set you can count to the end.'],['Infinite set','A set that goes on forever, like the natural numbers.'],['Universal set (U)','The set of everything being considered in a question.'],['Empty set (∅ or { })','A set with no elements.'],['Subset (⊂)','A ⊂ B means every element of A is also in B.'],['Complement (A′)','Everything in the universal set that is NOT in A.'],['Equal sets','Sets with exactly the same elements.'],['Equivalent sets','Sets with the same number of elements.'],['Set builder notation','Describing a set by a rule, for example {x : 0 < x < 4, x ∈ ℕ}.']],
 teacher:{time:'about 60 minutes',flow:[['Engage','6 min','Decide if collections are well-defined; predict the number of subsets.','Discuss "best songs" vs "days of the week".'],['Explore','18 min','Build subsets of a set and look for the pattern.','Prompt: "What happens each time you add one element?"'],['Explain','14 min','Symbols cards, three ways to describe a set, worked examples.','Model reading set builder notation aloud.'],['Elaborate','12 min','Sort well-defined or not; problems.','Use class data (clubs, sports).'],['Evaluate','10 min','Quiz and reflection.','Watch for confusion between ∈ and ⊂.']],

  extension:'Investigate how many subsets a set of 10 elements has, and why the number doubles each time.'},
 steps:[
  {phase:'engage',name:'Is it a set?',title:'Is it a set?',lead:'In maths, a set must be well-defined: everyone must agree on exactly what belongs in it.',
   mission:['Type your name.','Make your prediction.','Write what you remember about sets.'],
   patois:'Fi be a set, everybody haffi agree pon wah inna it.',
   blocks:[{type:'name'},{type:'mcq',title:'Warm-up',questions:[{q:'"The days of the week" is…',o:['a well-defined set','not well-defined'],a:0,why:'Everyone agrees on the seven days.'},{q:'"The best dancehall songs" is…',o:['a well-defined set','not well-defined'],a:1,why:'"Best" is an opinion, so people would disagree.'}]},{type:'predict',star:true,q:'How many subsets does the set {mango, ackee, guava} have?',options:['3','6','8'],after:'You will find out in the Explore phase.'}]},
  {phase:'explore',name:'Subset builder',title:'Explore: how many subsets?',lead:'Choose how many fruits are in the set. The tool lists every subset. Look for the pattern.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="sbN">Number of elements:</label><input type="range" id="sbN" min="0" max="4" value="2"><output class="big sbO">2</output></div><div class="tile sbSet"></div><div class="tile"><p style="margin:0 0 6px"><strong>Subsets:</strong> <span class="sbCount"></span></p><div class="sbList" style="display:flex;flex-wrap:wrap;gap:6px"></div></div><div class="tile"><p style="margin:0 0 6px"><strong>Pattern question:</strong> A set with 5 elements has how many subsets?</p><div class="controls"><input type="number" class="sbAns" aria-label="Number of subsets" placeholder="subsets"><button type="button" class="go sbChk">Check</button></div><div class="fb sbFb" aria-live="polite">Use the pattern in the table you build.</div></div>',
     init:function(box,api){var F=['mango','ackee','guava','sorrel'],r=box.querySelector('#sbN');api.nudges(r);function draw(){var n=+r.value,els=F.slice(0,n),subs=[];for(var m=0;m<(1<<n);m++){var s=[];for(var j=0;j<n;j++)if(m&(1<<j))s.push(els[j]);subs.push(s)}subs.sort(function(a,b){return a.length-b.length});box.querySelector('.sbO').textContent=n;box.querySelector('.sbSet').innerHTML='<strong>A = </strong>'+(n?'{'+els.join(', ')+'}':'{ } (the empty set)')+'  n(A) = '+n;box.querySelector('.sbCount').textContent=subs.length+' subsets';box.querySelector('.sbList').innerHTML=subs.map(function(s){return'<span class="chip">'+(s.length?'{'+s.join(', ')+'}':'{ }')+'</span>'}).join('')}r.addEventListener('input',draw);box.querySelector('.sbChk').onclick=function(){var v=+box.querySelector('.sbAns').value,fb=box.querySelector('.sbFb');if(v===32){fb.className='fb ok sbFb';fb.textContent='✓ Correct! The number of subsets doubles each time: 1, 2, 4, 8, 16, 32. A set with n elements has 2ⁿ subsets.';api.complete()}else{fb.className='fb no sbFb';fb.textContent='Not yet. Look at the counts for 0, 1, 2, 3 and 4 elements: 1, 2, 4, 8, 16. What is the next number?'}};draw()}},
    {type:'recall',text:'A set with 3 elements has 2³ = 8 subsets, including the empty set { } and the whole set itself.'}]},
  {phase:'explain',name:'Set symbols',title:'Key words and symbols',lead:'Set language is short and exact. Learn each symbol and how to read it aloud.',

   blocks:[{type:'cards',star:true,need:8,cards:[{term:'∈',def:'"is an element of"',eg:'ackee ∈ {ackee, mango}'},{term:'∉',def:'"is not an element of"',eg:'7 ∉ {2, 4, 6}'},{term:'n(A)',def:'the number of elements in A',eg:'A = {a, b, c}, n(A) = 3'},{term:'U',def:'the universal set: everything being considered',eg:'U = {students in 10B}'},{term:'∅ or { }',def:'the empty set',eg:'{months with 40 days} = ∅'},{term:'⊂',def:'"is a subset of"',eg:'{1, 2} ⊂ {1, 2, 3}'},{term:'A′',def:'the complement of A: in U but not in A',eg:'U = {1,…,5}, A = {1, 2}, A′ = {3, 4, 5}'},{term:'Equal sets',def:'exactly the same elements',eg:'{1, 2} = {2, 1}'},{term:'Equivalent sets',def:'the same number of elements',eg:'{a, b} and {7, 9}'},{term:'Infinite set',def:'never ends',eg:'ℕ = {1, 2, 3, …}'}]}]},
  {phase:'explain',name:'Describing sets',title:'Three ways to describe a set, and worked examples',lead:'The same set can be written in words, by listing, or with a rule.',
   mission:['Read the three ways to describe a set.','Work out each next step, then press Show next step.','Finish all 3 examples for a star.'],
   patois:'Same set, three different way fi write it.',
   blocks:[{type:'facts',facts:[{text:'In words: A is the set of the first three natural numbers.'},{text:'By listing: A = {1, 2, 3}.'},{text:'Set builder notation: A = {x : 0 < x < 4, x ∈ ℕ}. Read it as "the set of all x such that x is greater than 0 and less than 4, and x is a natural number".'},{text:'A set with n elements has 2ⁿ subsets, including ∅ and the set itself.'}]},
    {type:'examples',star:true,examples:[{q:'List the set B = {x : 2 < x ≤ 7, x ∈ ℕ} and state n(B).',steps:['"2 < x" means x is bigger than 2, so 2 is NOT included.','"x ≤ 7" means x can equal 7, so 7 IS included.','B = {3, 4, 5, 6, 7}, so n(B) = 5.']},{q:'U = {1, 2, 3, 4, 5, 6, 7, 8}, E = {even numbers}. List E′.',steps:['E = {2, 4, 6, 8}.','E′ is everything in U that is not in E.','E′ = {1, 3, 5, 7}.']},{q:'List all the subsets of P = {a, b}.',steps:['Start with the empty set: { }.','Subsets with one element: {a}, {b}.','The whole set: {a, b}.','That makes 4 subsets, and 2² = 4 ✓']}]}]},
  {phase:'elaborate',name:'Well-defined or not?',title:'Sort: well-defined set or not?',lead:'Decide whether each collection is a well-defined set.',

  {phase:'elaborate',name:'Practice problems',title:'Practice with sets: choose your challenge',lead:'Pick a level. You can change level any time.',

    bronze:[{c:'J = {Kingston, St. Andrew, St. Catherine, Clarendon}.',q:'What is n(J)?',a:4,h:['n(J) means the number of elements in J.','Count the parishes listed.'],sol:'There are 4 elements, so n(J) = 4.'},{c:'A set has 3 elements.',q:'How many subsets does it have?',a:8,h:['Use the rule 2ⁿ.','2³ = 2 × 2 × 2.'],sol:'2³ = 8 subsets.'}],
    silver:[{c:'A = {x : 5 ≤ x < 12, x ∈ ℕ}.',q:'What is n(A)?',a:7,h:['5 ≤ x means 5 is included. x < 12 means 12 is not included.','List the elements: 5, 6, …, 11.'],sol:'A = {5, 6, 7, 8, 9, 10, 11}, so n(A) = 7.'},{c:'U = {1, 2, 3, …, 10}. M = {multiples of 3}.',q:'How many elements are in M′?',a:7,h:['M = {3, 6, 9}.','M′ is everything in U not in M: 10 − 3.'],sol:'n(M) = 3, so n(M′) = 10 − 3 = 7.'}],
    gold:[{c:'A sports club in Montego Bay offers 6 activities. A student may choose any combination, including choosing none.',q:'How many different choices are possible?',a:64,h:['Each possible choice is a subset of the 6 activities.','Number of subsets = 2⁶.'],sol:'2⁶ = 64 different choices.'},{c:'A set Q has 128 subsets.',q:'How many elements does Q have?',a:7,h:['2ⁿ = 128.','Keep doubling: 2, 4, 8, 16, 32, 64, 128.'],sol:'2⁷ = 128, so Q has 7 elements.'}]}}]},
  {phase:'evaluate',name:'Check your understanding',title:'Check your understanding',lead:'8 questions. If you get one wrong, you get a hint and a second try.',
