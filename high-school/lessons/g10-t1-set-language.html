 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Sets',strand:'Sets',standard:'Module 1, Sets: demonstrate the ability to communicate using set language and concepts; demonstrate the ability to reason logically; appreciate the importance and utility of sets in analysing and solving real-world problems.',

 glossary:[['Set','A well-defined collection of objects.'],['Element (∈)','A member of a set. 3 ∈ {1, 2, 3} means 3 is an element of the set.'],['Cardinality n(A)','The number of elements in set A.'],['Finite set','A set you can count to the end.'],['Infinite set','A set that goes on forever, like the natural numbers.'],['Universal set (U)','The set of everything being considered in a question.'],['Empty set (∅ or { })','A set with no elements.'],['Subset (⊂)','A ⊂ B means every element of A is also in B.'],['Complement (A′)','Everything in the universal set that is NOT in A.'],['Equal sets','Sets with exactly the same elements.'],['Equivalent sets','Sets with the same number of elements.'],['Set builder notation','Describing a set by a rule, for example {x : 0 < x < 4, x ∈ ℕ}.']],
 teacher:{time:'about 80 minutes, or two shorter periods split after the teaching pages',flow:[['Engage','6 min','Decide if collections are well-defined; predict the number of subsets.','Discuss "best songs" vs "days of the week".'],['Explore','18 min','Build subsets of a set and look for the pattern.','Prompt: "What happens each time you add one element?"'],['Explain','14 min','Symbols cards, three ways to describe a set, worked examples.','Model reading set builder notation aloud.'],['Elaborate','12 min','Sort well-defined or not; problems.','Use class data (clubs, sports).'],['Evaluate','10 min','Quiz and reflection.','Watch for confusion between ∈ and ⊂.']],
  misconceptions:['Forgetting that the empty set and the set itself are subsets.','Confusing ∈ (element of) with ⊂ (subset of).','Thinking equal and equivalent sets mean the same thing.','Including endpoints incorrectly in set builder notation (< versus ≤).'],

 steps:[

   blocks:[{type:'mcq',star:true,questions:[{q:'Which list shows the even numbers between 1 and 10?',o:['2, 4, 6, 8','1, 3, 5, 7, 9','2, 4, 6, 8, 10, 12'],a:0,why:'Even numbers divide exactly by 2, and 10 is not between 1 and 10.',teach:'Even numbers can be divided exactly by 2: 2, 4, 6, 8, … "Between 1 and 10" means bigger than 1 and smaller than 10, so 10 itself is not included.'},{q:'Which numbers are bigger than 3 and smaller than 8?',o:['3, 4, 5, 6, 7, 8','4, 5, 6, 7','4, 5, 6, 7, 8'],a:1,why:'3 and 8 are not included: only 4, 5, 6 and 7 fit.',teach:'"Bigger than 3" means 3 itself is not included. "Smaller than 8" means 8 is not included. So the numbers are 4, 5, 6 and 7.'},{q:'What is 2 × 2 × 2?',o:['6','8','222'],a:1,why:'2 × 2 = 4, and 4 × 2 = 8.',teach:'Multiply step by step: 2 × 2 = 4, then 4 × 2 = 8. We can write this as 2³.'},{q:'Which is a natural (counting) number?',o:['0','5','−2'],a:1,why:'Natural numbers are 1, 2, 3, …',teach:'Natural numbers are the counting numbers: 1, 2, 3, 4, … Zero and negative numbers are not natural numbers.'}]}]},

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="sbN">Number of elements:</label><input type="range" id="sbN" min="0" max="4" value="2"><output class="big sbO">2</output></div><div class="tile sbSet"></div><div class="tile"><p style="margin:0 0 6px"><strong>Subsets:</strong> <span class="sbCount"></span></p><div class="sbList" style="display:flex;flex-wrap:wrap;gap:6px"></div></div><div class="tile"><p style="margin:0 0 6px"><strong>Pattern question:</strong> A set with 5 elements has how many subsets?</p><div class="controls"><input type="number" class="sbAns" aria-label="Number of subsets" placeholder="subsets"><button type="button" class="go sbChk">Check</button></div><div class="fb sbFb" aria-live="polite">Use the pattern in the table you build.</div></div>',
     init:function(box,api){var F=['mango','ackee','guava','sorrel'],r=box.querySelector('#sbN');api.nudges(r);function draw(){var n=+r.value,els=F.slice(0,n),subs=[];for(var m=0;m<(1<<n);m++){var s=[];for(var j=0;j<n;j++)if(m&(1<<j))s.push(els[j]);subs.push(s)}subs.sort(function(a,b){return a.length-b.length});box.querySelector('.sbO').textContent=n;box.querySelector('.sbSet').innerHTML='<strong>A = </strong>'+(n?'{'+els.join(', ')+'}':'{ } (the empty set)')+'  n(A) = '+n;box.querySelector('.sbCount').textContent=subs.length+' subsets';box.querySelector('.sbList').innerHTML=subs.map(function(s){return'<span class="chip">'+(s.length?'{'+s.join(', ')+'}':'{ }')+'</span>'}).join('')}r.addEventListener('input',draw);box.querySelector('.sbChk').onclick=function(){var v=+box.querySelector('.sbAns').value,fb=box.querySelector('.sbFb');if(v===32){fb.className='fb ok sbFb';fb.textContent='✓ Correct! The number of subsets doubles each time: 1, 2, 4, 8, 16, 32. A set with n elements has 2ⁿ subsets.';api.complete()}else{fb.className='fb no sbFb';fb.textContent='Not yet. Look at the counts for 0, 1, 2, 3 and 4 elements: 1, 2, 4, 8, 16. What is the next number?'}};draw()}},
    {type:'recall',text:'A set with 3 elements has 2³ = 8 subsets, including the empty set { } and the whole set itself.'}]},
  {phase:'explain',name:'Teach: set language',title:'Learn: the language of sets',lead:'Sets have their own language and symbols. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Learn di set language one piece at a time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Sets and elements',explain:'<p>You use sets all the time without calling them that: your class register, your family’s phone contacts, the items on a shopping list. A {{set|a well-defined collection of objects}} is simply a collection of things.</p><p>There is one rule, though. A set must be {{well-defined|everyone can agree exactly what belongs in it}}: everyone must be able to agree exactly what belongs in it. “The vowels in English” is a set: a, e, i, o, u, and nobody can argue. But “the best singers in Jamaica” is not a set, because people would argue all day about who belongs!</p><p>We name sets with capital letters and list their members inside curly brackets: V = {a, e, i, o, u}. Each member is an {{element|a member of a set}}. We write <strong>e ∈ V</strong> to say “e is an element of V”, and <strong>b ∉ V</strong> to say “b is not an element of V”. And the number of elements in a set is written <strong>n(V)</strong>; here, n(V) = 5.</p>',
     example:{q:'V = {a, e, i, o, u}. Is "e ∈ V" true? Is "b ∈ V" true? Find n(V).',steps:[{do:'e is in the list, so e ∈ V is true.',why:'∈ means "is an element of".'},{do:'b is not in the list, so b ∈ V is false. We write b ∉ V.'},{do:'Count the elements: a, e, i, o, u. So n(V) = 5.'}]},
     mistake:'Thinking "the best songs" or "tall students" are sets. They are not well-defined, because people would disagree about what belongs in them.',
     check:{q:'A = {2, 4, 6, 8}. Which statement is true?',o:['5 ∈ A','6 ∈ A','n(A) = 8'],a:1,why:'6 is listed in A. 5 is not, and A has 4 elements, so n(A) = 4.',hint:'Check which numbers are actually in the list.'}},
    {title:'Universal, empty, finite and infinite sets',explain:'<p>Every set question happens inside a bigger “world” of things we are talking about. If we are discussing the students in 10B, then everything we say is about those students. That bigger collection is the {{universal set U|the set of everything being considered in a question}}. It is like the boundary of the conversation.</p><p>Sometimes a set has nothing in it at all. What about “the months with 40 days”? There are none! A set with no elements is the {{empty set|a set with no elements at all, written ∅}}, written ∅ or { }. Be careful: {0} is NOT empty. It contains one element, the number zero.</p><p>Sets can also be small or endless. A {{finite set|a set you can count to the end}} can be counted to the end, like the vowels or the students in your class. An {{infinite set|a set that goes on forever}} goes on forever, like the even numbers 2, 4, 6, 8, … You could never finish listing them.</p>',
     example:{q:'Describe each set: (a) {months with 40 days}; (b) {0}; (c) {even numbers}.',steps:[{do:'(a) No month has 40 days, so this is the empty set: ∅.'},{do:'(b) {0} has ONE element, the number zero. So it is NOT empty.',why:'Zero is a number, so it counts as an element.'},{do:'(c) Even numbers go on forever: 2, 4, 6, … So this is an infinite set.'}]},
     mistake:'Writing the empty set as {0} or {∅}. Both of those have one element. The empty set is just ∅ or { }.',
     check:{q:'Which of these is the empty set?',o:['{0}','{ }','{∅}'],a:1,why:'{ } has nothing inside. {0} and {∅} each contain one element.',hint:'Look for the set with nothing inside the brackets.'}},
    {title:'The complement of a set',explain:'<p>Imagine your class is the universal set, and the set F is the students who play football. Who is left over? Everyone in the class who does <em>not</em> play football. That leftover group is called the {{complement of F|everything in the universal set that is not in F}}, written <strong>F′</strong>.</p><p>So the complement of a set is everything in the universal set that is <strong>not</strong> in that set. To find it, start with the whole of U, then cross out every element of the set. Whatever is left is the complement.</p><p>Here is a nice check. Every element of U is either in the set or in its complement, never both and never neither. So n(F) + n(F′) always equals n(U). If 12 out of 30 students play football, then 18 do not.</p>',
     example:{q:'U = {1, 2, 3, 4, 5, 6, 7, 8} and E = {even numbers}. List E′.',steps:[{do:'First list E: E = {2, 4, 6, 8}.'},{do:'Cross these out of U. The numbers left are 1, 3, 5 and 7.',why:'A complement is everything in U that is NOT in the set.'},{do:'E′ = {1, 3, 5, 7}.'},{do:'Check: n(E) + n(E′) = 4 + 4 = 8 = n(U). ✓'}]},
     mistake:'Thinking A′ means "the elements of A". The dash means NOT in A.',
     check:{q:'U = {1, 2, 3, 4, 5}, A = {1, 2}. What is A′?',o:['{1, 2}','{3, 4, 5}','{ }'],a:1,why:'3, 4 and 5 are in U but not in A.',hint:'Cross 1 and 2 out of U.'}}]}]},
  {phase:'explain',name:'Teach: describing sets and subsets',title:'Learn: describing sets and finding subsets',lead:'Next, three ways to describe a set, then subsets and how to count them.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Same set, different way fi write it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Three ways to describe a set',explain:'<p>There is more than one way to describe the same set, just as there is more than one way to give directions to your house.</p><p>You can use <strong>words</strong>: “A is the set of natural numbers greater than 2 and up to 7.” You can <strong>list</strong> the elements: A = {3, 4, 5, 6, 7}. Or you can use {{set builder notation|describing a set by a rule that its elements must follow}}: A = {x : 2 &lt; x ≤ 7, x ∈ ℕ}.</p><p>Set builder notation looks scary at first, but read it slowly and it is just a sentence: “the set of all x, such that x is greater than 2 and less than or equal to 7, and x is a natural number.” The colon means “such that”.</p><p>Pay close attention to the end points. The symbol &lt; means the end number is <strong>not</strong> included. The symbol ≤ has a little line underneath, meaning “or equal to”, so the end number <strong>is</strong> included.</p>',
     example:{q:'List the set B = {x : 2 < x ≤ 7, x ∈ ℕ} and find n(B).',steps:[{do:'"x ∈ ℕ" means x is a natural number.'},{do:'"2 < x" means x is bigger than 2, so 2 is NOT included.',why:'The symbol < leaves the end number out.'},{do:'"x ≤ 7" means x can equal 7, so 7 IS included.',why:'The line under ≤ means "or equal to".'},{do:'B = {3, 4, 5, 6, 7}, so n(B) = 5.'}]},
     mistake:'Mixing up < and ≤. A quick check: ≤ has a line underneath, meaning "or equal to", so the end number is included.',
     check:{q:'{x : 4 ≤ x < 8, x ∈ ℕ} = ?',o:['{4, 5, 6, 7}','{5, 6, 7}','{4, 5, 6, 7, 8}'],a:0,why:'4 is included (≤) and 8 is not (<).',hint:'Check each end: is it < or ≤?'}},
    {title:'Subsets',explain:'<p>Think about your whole class as one set. The girls in the class form a smaller set inside it. So do the students who walk to school, and the students wearing glasses. Each of those smaller groups is a {{subset|A ⊂ B means every element of A is also in B}} of the class.</p><p>We write <strong>A ⊂ B</strong> to say “A is a subset of B”, which means every element of A is also an element of B.</p><p>Two subsets are easy to forget. The empty set ∅ is a subset of every set, because there is nothing in it that could break the rule. And every set is a subset of itself.</p><p>When you list all the subsets of a set, work in an organised way so you don’t miss any. Start with the empty set, then all the subsets with one element, then two elements, and so on, finishing with the whole set itself.</p>',
     example:{q:'List all the subsets of {a, b, c}.',steps:[{do:'Size 0: { }',why:'The empty set is a subset of every set.'},{do:'Size 1: {a}, {b}, {c}'},{do:'Size 2: {a, b}, {a, c}, {b, c}'},{do:'Size 3: {a, b, c}',why:'Every set is a subset of itself.'},{do:'That makes 1 + 3 + 3 + 1 = 8 subsets.'}]},
     mistake:'Forgetting the empty set { } and the whole set itself when listing subsets.',
     check:{q:'Is {2, 5} ⊂ {1, 2, 3, 4, 5}?',o:['Yes','No'],a:0,why:'Both 2 and 5 are in the bigger set.',hint:'Check that every element of {2, 5} is in the bigger set.'}},
    {title:'Counting subsets; equal and equivalent sets',explain:'<p>How many subsets does a set have? Here is a lovely way to think about it. When you build a subset, you go through the elements one by one and make a choice for each: is it in, or is it out? That is 2 choices for each element.</p><p>With 1 element, there are 2 choices, so 2 subsets. With 2 elements, there are 2 × 2 = 4. With 3 elements, 2 × 2 × 2 = 8. So a set with <strong>n</strong> elements has <strong>2ⁿ subsets</strong>. A set with 4 fruits has 2⁴ = 16 subsets.</p><p>Two more words to finish. {{Equal sets|sets with exactly the same elements}} have exactly the same elements; the order does not matter, so {1, 2} = {2, 1}. {{Equivalent sets|sets with the same number of elements}} just have the same <em>number</em> of elements. {1, 2, 3} and {a, b, c} are equivalent, because they both have 3 elements, but they are not equal, because the elements are different.</p>',
     example:{q:'How many subsets does {mango, ackee, guava, sorrel} have?',steps:[{do:'Count the elements: n = 4.'},{do:'Number of subsets = 2⁴.',why:'Each of the 4 elements is either in or out: 2 × 2 × 2 × 2 choices.'},{do:'2⁴ = 16 subsets.'}]},
     mistake:'Thinking equivalent means equal. {1, 2, 3} and {x, y, z} are equivalent (3 elements each) but not equal (different elements).',
     check:{q:'A set has 5 elements. How many subsets does it have?',o:['10','25','32'],a:2,why:'2⁵ = 2 × 2 × 2 × 2 × 2 = 32.',hint:'Use 2ⁿ with n = 5.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts to remember. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own. Each one unlocks the next.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'1. In words',text:'Describe the set in a sentence. For example: "A is the set of the first three natural numbers."'},{title:'2. By listing',text:'Write every element inside curly brackets { }, separated by commas. For example: A = {1, 2, 3}. The order does not matter, and each element is written only once.'},{title:'3. Set builder notation',text:'Describe the set with a rule. For example: A = {x : 0 < x < 4, x ∈ ℕ}. Read it aloud as "the set of all x such that x is greater than 0 and less than 4, and x is a natural number". The numbers that fit the rule are 1, 2 and 3.'},{title:'Counting subsets',text:'A set with n elements has 2ⁿ subsets, including the empty set { } and the set itself. For example, {a, b} has 2 elements, so it has 2² = 4 subsets: { }, {a}, {b} and {a, b}.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'List the set {x : 1 ≤ x < 5, x ∈ ℕ} and find n of the set.',steps:[{do:'1 ≤ x means 1 is included.'},{do:'x < 5 means 5 is not included.'},{do:'The set is {1, 2, 3, 4}, so n = 4.'}]},
     {type:'fill',q:'U = {1, 2, 3, …, 10} and M = {multiples of 4}. Find n(M′).',steps:[{text:'M = {4, 8}, so n(M) = 2.'},{text:'n(M′) = n(U) − n(M) = 10 − 2 = ___',blank:true,a:8,hint:'Everything in U that is not in M.'}],sol:'n(M′) = 10 − 2 = 8.'},
     {type:'own',q:'A set has 6 elements. How many subsets does it have?',a:64,hint:'2⁶ = 2 × 2 × 2 × 2 × 2 × 2.',sol:'2⁶ = 64.'},
     {type:'own',q:'Find n({x : −2 < x < 3, x ∈ ℤ}).',a:4,hint:'ℤ means integers. List them: −2 is not included, 3 is not included.',sol:'The set is {−1, 0, 1, 2}, so n = 4.'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order. Some are quick, some are tough. All of them make you think.',
   mission:['Choose a challenge card. Each one shows how hard it is and roughly how long it takes.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like. Try di hard one dem too!',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Well-defined or not?',desc:'Decide which collections are real sets.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Ask: would everyone agree on exactly what is in it?',bins:[{id:'y',label:'Well-defined set',hint:'everyone agrees'},{id:'n',label:'Not well-defined',hint:'opinion or unclear'}],items:[{label:'The parishes of Jamaica',bin:'y'},{label:'Tall students in your class',bin:'n'},{label:'Even numbers between 1 and 11',bin:'y'},{label:'The nicest beaches in Negril',bin:'n'},{label:'Months with 31 days',bin:'y'},{label:'Interesting books',bin:'n'},{label:'Prime numbers less than 20',bin:'y'},{label:'Popular songs this year',bin:'n'}]}},
    {icon:'🃏',title:'Match the symbols',desc:'Match each set symbol to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['∈','is an element of'],['∉','is not an element of'],['⊂','is a subset of'],['∅','the empty set'],['U','the universal set'],['A′','the complement of A'],['n(A)','the number of elements in A']]}},
    {icon:'📏',title:'Smallest to biggest',desc:'Order sets by how many elements they have.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out how many elements each set has, then tap them from fewest to most.',rounds:[[{label:'∅',v:0,show:'0 elements'},{label:'{a}',v:1,show:'1 element'},{label:'{x : 0 < x < 4, x ∈ ℕ}',v:3,show:'3 elements'},{label:'{vowels}',v:5,show:'5 elements'}],[{label:'{0}',v:1,show:'1 element'},{label:'{1, 2, 3}',v:3,show:'3 elements'},{label:'all subsets of {a, b}',v:4,show:'4 subsets'},{label:'{days of the week}',v:7,show:'7 elements'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement about sets is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The empty set is a subset of every set.',a:'always',why:'There is nothing in ∅ that could fail to be in another set, so ∅ is a subset of every set.'},{s:'Equal sets are equivalent.',a:'always',why:'If two sets have exactly the same elements, they must have the same number of elements.'},{s:'Equivalent sets are equal.',a:'sometimes',why:'{1, 2} and {2, 1} are equivalent and equal, but {1, 2} and {a, b} are equivalent and NOT equal.',hint:'Try two sets with the same number of different elements.'},{s:'A set has fewer subsets than elements.',a:'never',why:'A set with n elements has 2ⁿ subsets, and 2ⁿ is always more than n.'},{s:'{0} is the empty set.',a:'never',why:'{0} contains one element: zero.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Daniel',q:'List {x : 3 < x < 7, x ∈ ℕ}.',lines:['3 < x means 3 is included','So the set is {3, 4, 5, 6}'],wrong:0,reasons:['The symbol < means 3 is NOT included','x should be an integer, not a natural number','7 should be included'],reason:0,fix:'{4, 5, 6}.'},{who:'Rhea',q:'How many subsets does {p, q} have?',lines:['The subsets are {p} and {q}','So there are 2 subsets'],wrong:0,reasons:['She forgot the empty set and {p, q} itself','{p} is not a subset','There should be 3 subsets'],reason:0,fix:'{ }, {p}, {q}, {p, q}: 4 subsets, and 2² = 4.'},{who:'Malik',q:'U = {1, 2, 3, 4, 5, 6} and A = {2, 4, 6}. List A′.',lines:['A′ means the elements in A','A′ = {2, 4, 6}'],wrong:0,reasons:['A′ means the elements of U that are NOT in A','He should have used n(A)','A′ is always the empty set'],reason:0,fix:'A′ = {1, 3, 5}.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire set questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=Math.floor(Math.random()*3);if(r===0){var n=R(1,6),v=Math.pow(2,n);return{q:'A set has '+n+' element'+(n>1?'s':'')+'. How many subsets?',o:[String(v),String(v/2),String(v*2)],a:0,why:'2^'+n+' = '+v+'.'}}if(r===1){var lo=R(0,5),hi=lo+R(3,6),inc=Math.random()<0.5,c=hi-lo-1+(inc?1:0);return{q:'n({x : '+lo+' < x '+(inc?'≤':'<')+' '+hi+', x ∈ ℕ}) = ?',o:[String(c),String(c+1),String(c-1)],a:0,why:lo+' is not included; '+hi+(inc?' is':' is not')+' included.'}}var S=[1,3,5,7,9],x=R(1,9);return{q:'A = {1, 3, 5, 7, 9}. Is '+x+' ∈ A?',o:['Yes','No'],a:S.indexOf(x)>=0?0:1,why:x+(S.indexOf(x)>=0?' is':' is not')+' listed in A.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent sets that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:5,block:{type:'create',tasks:[{q:'Type a set with exactly 3 elements, using curly brackets. For example: {a, b, c}',placeholder:'{ … }',check:function(v){var m=String(v).trim().match(/^\{(.*)\}$/);if(!m)return{ok:false,msg:'Start with { and end with }.'};var e=m[1].split(',').map(function(x){return x.trim().toLowerCase()}).filter(Boolean),u=e.filter(function(x,i){return e.indexOf(x)===i});if(u.length!==e.length)return{ok:false,msg:'Each element should be written only once.'};return u.length===3?{ok:true,msg:'Yes! Your set has exactly 3 elements, so its n = 3.'}:{ok:false,msg:'Your set has '+u.length+' element'+(u.length===1?'':'s')+'. It needs exactly 3.'}}},{q:'Type a set that is equivalent to {red, blue} but NOT equal to it.',placeholder:'{ … }',check:function(v){var m=String(v).trim().match(/^\{(.*)\}$/);if(!m)return{ok:false,msg:'Use curly brackets { }.'};var e=m[1].split(',').map(function(x){return x.trim().toLowerCase()}).filter(Boolean);if(e.length!==2)return{ok:false,msg:'Equivalent sets need the same NUMBER of elements: 2.'};if(e.indexOf('red')>=0&&e.indexOf('blue')>=0)return{ok:false,msg:'That set is equal to {red, blue}. Use different elements.'};return{ok:true,msg:'Correct! Same number of elements (2), but different elements, so equivalent but not equal.'}}},{q:'Type a subset of {1, 2, 3, 4} that has exactly 2 elements.',placeholder:'{ … }',check:function(v){var m=String(v).trim().match(/^\{(.*)\}$/);if(!m)return{ok:false,msg:'Use curly brackets { }.'};var e=m[1].split(',').map(function(x){return x.trim()}).filter(Boolean);if(e.length!==2||e[0]===e[1])return{ok:false,msg:'Choose exactly 2 different elements.'};if(e.every(function(x){return['1','2','3','4'].indexOf(x)>=0}))return{ok:true,msg:'Yes! Both elements are in {1, 2, 3, 4}. There are 6 possible answers like this.'};return{ok:false,msg:'Every element must come from {1, 2, 3, 4}.'}}}]}},
    {icon:'🎪',title:'Mission: the clubs fair',desc:'Help plan the clubs fair at a Montego Bay high school.',level:'⭐⭐⭐ Real-world mission',mins:6,block:{type:'mission',story:'A Montego Bay high school is holding its clubs fair. The clubs on offer are C = {Chess, Drama, Football, Steel band, Robotics}. Use set language to help the organisers.',parts:[{q:'What is n(C)?',a:5,hint:'Count the clubs.',sol:'There are 5 clubs, so n(C) = 5.'},{q:'A student may join any combination of clubs, including none. How many different choices are there?',a:32,hint:'Each choice is a subset of C. Use 2ⁿ.',sol:'2⁵ = 32 choices.'},{q:'Robotics is cancelled this term. How many choices are there now?',a:16,hint:'Now there are 4 clubs.',sol:'2⁴ = 16 choices.'},{q:'Using all 5 clubs as the universal set, F = {Drama, Steel band} are the clubs that meet on Friday. How many clubs are in F′?',a:3,hint:'F′ is the clubs that do NOT meet on Friday.',sol:'n(F′) = 5 − 2 = 3.'},{q:'Is F ⊂ C? Type yes or no.',a:['yes','y'],hint:'Is every element of F also in C?',sol:'Yes. Drama and Steel band are both in C, so F ⊂ C.'}],done:'You used cardinality, subsets, 2ⁿ and complements to plan a real event.'}}
   ]}]},
