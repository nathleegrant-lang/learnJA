var QG=function(a,b,c,o){o=o||{};var W=360,H=340,xmin=-6,xmax=6,ymin=-10,ymax=10,X=function(x){return 30+(x-xmin)/(xmax-xmin)*(W-50)},Y=function(y){return 15+(ymax-y)/(ymax-ymin)*(H-40)},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.label||('Graph of '+QEQ(a,b,c)))+'"><defs><clipPath id="qc"><rect x="'+X(xmin)+'" y="'+Y(ymax)+'" width="'+(X(xmax)-X(xmin))+'" height="'+(Y(ymin)-Y(ymax))+'"/></clipPath></defs><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/>';for(var i=xmin;i<=xmax;i++){s+='<line x1="'+X(i)+'" y1="'+Y(ymin)+'" x2="'+X(i)+'" y2="'+Y(ymax)+'" stroke="#e6dff4"/>';if(i&&i%2===0)s+='<text x="'+X(i)+'" y="'+(Y(0)+13)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+fq(i)+'</text>'}for(var j=ymin;j<=ymax;j+=2){s+='<line x1="'+X(xmin)+'" y1="'+Y(j)+'" x2="'+X(xmax)+'" y2="'+Y(j)+'" stroke="#e6dff4"/>';if(j&&j%4===0)s+='<text x="'+(X(0)-4)+'" y="'+(Y(j)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">'+fq(j)+'</text>'}s+='<line x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" stroke="#3d2a73" stroke-width="2"/>';var pts=[];for(var x=xmin;x<=xmax+1e-9;x+=0.1)pts.push(X(x).toFixed(1)+','+Y(a*x*x+b*x+c).toFixed(1));s+='<polyline clip-path="url(#qc)" points="'+pts.join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/>';if(o.dots)for(var k=-4;k<=4;k++){var yy=a*k*k+b*k+c;if(yy>=ymin&&yy<=ymax)s+='<circle cx="'+X(k)+'" cy="'+Y(yy)+'" r="4" fill="#c02d5f"/>'}if(o.marks){if(c>=ymin&&c<=ymax)s+='<circle cx="'+X(0)+'" cy="'+Y(c)+'" r="6" fill="none" stroke="#16766a" stroke-width="3"/>';var D=b*b-4*a*c;if(D>=0){[(-b-Math.sqrt(D))/(2*a),(-b+Math.sqrt(D))/(2*a)].forEach(function(r){if(r>=xmin&&r<=xmax)s+='<circle cx="'+X(r)+'" cy="'+Y(0)+'" r="6" fill="none" stroke="#c02d5f" stroke-width="3"/>'})}}return s+'</svg>'};

 glossary:[['Quadratic function','A function whose highest power of x is x², such as y = x² − 2x − 3.'],['Parabola','The U-shaped (or upside-down U) curve of a quadratic graph.'],['Table of values','A table of x-values and their y-values, giving ordered pairs to plot.'],['Turning point','The lowest (minimum) or highest (maximum) point of a parabola.'],['Line of symmetry','The vertical line through the turning point; the graph is a mirror image either side.'],['y-intercept','Where the graph crosses the y-axis: the value of y when x = 0.'],['x-intercepts (roots)','Where the graph crosses the x-axis: the values of x that make y = 0.']],

     init:function(box,api){var B=box.querySelector('#qxB'),C=box.querySelector('#qxC'),N=box.querySelector('#qxN');api.nudges(B);api.nudges(C);function draw(){var a=N.checked?-1:1,b=+B.value,c=+C.value,D=b*b-4*a*c,roots=D<0?[]:D===0?[-b/(2*a)]:[(-b-Math.sqrt(D))/(2*a),(-b+Math.sqrt(D))/(2*a)].sort(function(p,q){return p-q}),tx=-b/(2*a),ty=a*tx*tx+b*tx+c;box.querySelector('.qxBO').textContent=fq(b);box.querySelector('.qxCO').textContent=fq(c);box.querySelector('.qxSvg').innerHTML=QG(a,b,c,{dots:true,marks:true});box.querySelector('.qxOut').innerHTML='<strong>'+QEQ(a,b,c)+'</strong><br>Ordered pairs: '+[-3,-2,-1,0,1,2,3].map(function(x){return'('+fq(x)+', '+fq(a*x*x+b*x+c)+')'}).join(', ')+'<br><strong>y-intercept:</strong> (0, '+fq(c)+')<br><strong>x-intercepts (roots):</strong> '+(roots.length?roots.map(function(r){return'x = '+fq(r)}).join(' and '):'none: the curve never reaches the x-axis')+'<br><strong>Turning point:</strong> ('+fq(tx)+', '+fq(ty)+'), a '+(a>0?'minimum (lowest point)':'maximum (highest point)')}[B,C,N].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var T=[{t:'For y = x² − x − 6, what is the y-intercept?',ok:function(v){return parseFloat(v.replace(/−/g,'-'))===-6}},{t:'For y = x² − x − 6, what are the x-intercepts? (Type them like −2, 3.)',ok:function(v){var n=v.replace(/−/g,'-').replace(/x=|\s|and/g,',').split(',').filter(function(z){return z!==''}).map(Number).sort(function(a,b){return a-b});return n.length===2&&n[0]===-2&&n[1]===3}},{t:'How many times does y = x² + 4 cross the x-axis?',ok:function(v){return v==='0'||v==='none'||v==='zero'}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.qxNum').textContent='All done';box.querySelector('.qxQ').textContent='You completed every challenge!';box.querySelector('.qxC').disabled=true;return}box.querySelector('.qxNum').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.qxQ').textContent=T[q].t}box.querySelector('.qxC').onclick=function(){var v=String(box.querySelector('.qxA').value).trim().toLowerCase(),fb=box.querySelector('.qxFb');if(T[q].ok(v)){fb.className='fb ok qxFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.qxA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no qxFb';fb.textContent='Not yet. Set the sliders to match the equation and read the results.'}};draw();task()}},
    {type:'recall',text:'The ball lands after 4 seconds. Setting y = 0: −x² + 4x = 0, so x(4 − x) = 0, giving x = 0 (when it is thrown) and x = 4 (when it lands). Those are the x-intercepts of the graph.'}]},
  {phase:'explain',name:'Teach: plotting quadratics',title:'Learn: quadratic functions, ordered pairs and plotting',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Smooth curve, not straight line. Negative squared a positive.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Quadratic functions and ordered pairs',explain:'<p>In Grade 8, you graphed straight lines like y = 2x + 1. Now we meet functions with an x² in them, like y = x² − 2x − 3. A function whose highest power of x is x² is called a {{quadratic function|a function whose highest power of x is x²}}.</p><p>To graph one, start just as before, with a {{table of values|x-values and their y-values}}. Choose x-values, often from −3 to 3 or −4 to 4, and work out y for each. Each pair gives an ordered pair (x, y).</p><p>The tricky part is negative numbers. Remember that a negative number squared is <strong>positive</strong>: (−3)² = 9. Using brackets on your calculator helps: type (−3)², not −3².</p>',
     example:{q:'Write y = x² − 2x − 3 as a set of ordered pairs for x = −2 to 4.',steps:[{do:'x = −2: 4 + 4 − 3 = 5. x = −1: 1 + 2 − 3 = 0. x = 0: −3.',why:'(−2)² = 4 and −2 × −2 = +4.'},{do:'x = 1: 1 − 2 − 3 = −4. x = 2: 4 − 4 − 3 = −3. x = 3: 9 − 6 − 3 = 0. x = 4: 16 − 8 − 3 = 5.'},{do:'{(−2, 5), (−1, 0), (0, −3), (1, −4), (2, −3), (3, 0), (4, 5)}'}]},
     mistake:'Getting (−2)² = −4. Squaring a negative number always gives a positive answer.',
     check:{q:'For y = x² + 1, what is y when x = −3?',o:['10','−8','7'],a:0,why:'9 + 1 = 10.',hint:'(−3)² = 9.'}},
    {title:'Plotting a smooth curve',explain:'<p>Plot each ordered pair carefully. You will notice the points do <strong>not</strong> lie in a straight line; instead they form a beautiful curve called a {{parabola|the U-shaped curve of a quadratic graph}}.</p><p>Join the points with a <strong>smooth curve</strong>, drawn freehand, not with a ruler. Do not join them with straight lines, and do not make a sharp point at the bottom: a parabola is always smoothly rounded. Turning your paper so your hand is on the inside of the curve can help.</p><p>Look for the pattern of symmetry: in y = x² − 2x − 3, the y-values go 5, 0, −3, −4, −3, 0, 5. The values on either side of the lowest point match, like a mirror. That symmetry is a good check: if one point breaks it, recheck that calculation.</p>',visual:QG(1,-2,-3,{dots:true,label:'Graph of y = x² − 2x − 3, a smooth U-shaped parabola'}),
     example:{q:'Describe how the graph of y = x² − 2x − 3 should look.',steps:[{do:'A U-shaped curve, lowest at (1, −4).'},{do:'It crosses the x-axis at (−1, 0) and (3, 0), and the y-axis at (0, −3).'},{do:'It is symmetrical about the vertical line x = 1.'}]},
     mistake:'Joining the points with a ruler. A quadratic graph is a smooth curve, not a set of straight lines.',
     check:{q:'What shape is the graph of a quadratic function?',o:['A parabola (a smooth U shape)','A straight line','A circle'],a:0,why:'Quadratics always make parabolas.',hint:'Think of the thrown ball.'}},
    {title:'The shape: turning point and symmetry',explain:'<p>Every parabola has a {{turning point|the lowest or highest point of a parabola}}, where the curve stops going down and starts going up (or the other way round).</p><p>When the x² term is <strong>positive</strong>, like y = x² − 2x − 3, the parabola is U-shaped, like a smile, and the turning point is a <strong>minimum</strong>: the lowest point. When the x² term is <strong>negative</strong>, like the ball’s path y = −x² + 4x, the parabola is upside down, like a hill, and the turning point is a <strong>maximum</strong>: the highest point.</p><p>The vertical line through the turning point is the {{line of symmetry|the vertical line through the turning point}}. The graph is a perfect mirror image on either side. For the ball, the maximum is at (2, 4): after 2 seconds, the ball reaches its greatest height of 4 m.</p>',visual:QG(-1,4,0,{dots:true,label:'Graph of y = −x² + 4x, an upside-down parabola with maximum at (2, 4)'}),
     example:{q:'Find the turning point of y = −x² + 4x from its table: x = 0, 1, 2, 3, 4 gives y = 0, 3, 4, 3, 0.',steps:[{do:'The y-values rise to 4, then fall again.'},{do:'The highest value, 4, is at x = 2.'},{do:'Turning point: (2, 4), a maximum. Line of symmetry: x = 2.'}]},
     mistake:'Expecting a negative x² graph to open upwards. A negative x² term turns the parabola upside down.',
     check:{q:'y = −x² + 9 has a turning point that is a…',o:['maximum','minimum','straight section'],a:0,why:'The x² term is negative, so it is upside down.',hint:'Look at the sign of x².'}}]}]},
  {phase:'explain',name:'Teach: intercepts',title:'Learn: where the graph meets the axes',lead:'Next, the points where the curve crosses the axes, and what they mean in real life.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Where di curve cut di x-axis, y equal zero.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The y-intercept',explain:'<p>The {{y-intercept|where the graph crosses the y-axis, when x = 0}} is where the graph crosses the y-axis. Every point on the y-axis has x = 0, so to find it, just put <strong>x = 0</strong> into the equation.</p><p>For y = x² + bx + c, putting x = 0 makes the x² and bx terms disappear, leaving y = c. So the y-intercept is simply the <strong>constant number at the end</strong>: (0, c).</p><p>In real life, the y-intercept often means the <strong>starting value</strong>. If a ball’s height is y = −x² + 3x + 2, the y-intercept (0, 2) means the ball starts 2 m above the ground, at the moment it is thrown.</p>',
     example:{q:'Find the y-intercept of y = x² − 5x + 6.',steps:[{do:'Put x = 0: y = 0 − 0 + 6.'},{do:'y = 6. The y-intercept is (0, 6).'}]},
     mistake:'Reading the y-intercept from where the curve crosses the x-axis. The y-intercept is on the y-AXIS.',
     check:{q:'What is the y-intercept of y = x² + 2x − 8?',o:['(0, −8)','(0, 2)','(−8, 0)'],a:0,why:'Put x = 0: y = −8.',hint:'The constant term.'}},
    {title:'The x-intercepts (roots)',explain:'<p>The {{x-intercepts|where the graph crosses the x-axis, when y = 0}}, also called the <strong>roots</strong>, are where the curve crosses the x-axis. Every point on the x-axis has <strong>y = 0</strong>.</p><p>So the x-intercepts are the x-values that make the equation equal to zero. You can read them straight off an accurate graph: look for where the curve cuts the x-axis. For y = x² − 2x − 3, the curve crosses at x = −1 and x = 3, so those are the solutions of x² − 2x − 3 = 0.</p><p>That is a powerful idea: a graph lets you <strong>solve</strong> a quadratic equation. Check by substituting: (−1)² − 2(−1) − 3 = 1 + 2 − 3 = 0 ✓.</p>',visual:QG(1,-2,-3,{marks:true,label:'Graph of y = x² − 2x − 3 with x-intercepts at −1 and 3 and y-intercept at −3 marked'}),
     example:{q:'A graph of y = x² − x − 6 crosses the x-axis at −2 and 3. What are the solutions of x² − x − 6 = 0?',steps:[{do:'The x-intercepts are where y = 0.'},{do:'So x = −2 or x = 3.'},{do:'Check x = 3: 9 − 3 − 6 = 0 ✓'}]},
     mistake:'Giving the roots as y-values. The roots are the x-values where the curve crosses the x-axis.',
     check:{q:'A parabola crosses the x-axis at (1, 0) and (5, 0). What are its roots?',o:['x = 1 and x = 5','y = 1 and y = 5','x = 0'],a:0,why:'The x-coordinates of the crossing points.',hint:'Where y = 0.'}},
    {title:'How many x-intercepts, and what they mean',explain:'<p>A parabola can cross the x-axis <strong>twice</strong>, touch it <strong>once</strong> (at its turning point), or <strong>not at all</strong> if it sits entirely above or below the axis. You saw all three in the explorer. For example, y = x² + 4 is always at least 4, so it never reaches the x-axis: the equation x² + 4 = 0 has no real solutions.</p><p>In real life, the intercepts tell a story. For the ball, y = −x² + 4x: the x-intercepts x = 0 and x = 4 are the moments the ball is at hand height, when it is thrown and when it comes back down. The maximum (2, 4) tells you the greatest height and when it happens.</p><p>So when you meet a quadratic graph, always ask: Where does it start? Where does it cross? Where is it highest or lowest?</p>',
     example:{q:'A ball’s height is y = −x² + 6x (metres, x in seconds). When does it land, and what is its greatest height?',steps:[{do:'Roots: −x² + 6x = 0, so x(6 − x) = 0: x = 0 or x = 6. It lands after 6 seconds.'},{do:'By symmetry, the maximum is halfway: x = 3.'},{do:'Height at x = 3: −9 + 18 = 9 m.'}]},
     mistake:'Assuming every parabola crosses the x-axis twice. Some touch it once, and some never reach it.',
     check:{q:'A parabola’s turning point is at (2, 3) and it is U-shaped. How many x-intercepts does it have?',o:['0','1','2'],a:0,why:'Its lowest point is above the x-axis.',hint:'Can it reach y = 0?'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Ordered pairs',text:'Make a table of values. Squares of negatives are positive: (−3)² = 9. Each (x, y) is a point to plot.'},{title:'Plotting',text:'Join the points with a smooth curve (a parabola), never with straight lines. Use symmetry to check.'},{title:'Shape',text:'Positive x²: U-shaped, turning point is a minimum. Negative x²: upside-down, turning point is a maximum.'},{title:'Intercepts',text:'y-intercept: put x = 0 (it is c). x-intercepts (roots): where y = 0. There can be 2, 1 or 0 of them.'}]},
