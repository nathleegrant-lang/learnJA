 '1A1':{topic:'Consumer Arithmetic and Number Theory',marks:9,stem:'Mrs. Campbell in Mandeville is buying a television and planning her savings.',parts:[

 '1A2':{topic:'Sets, Measurement, Algebra 1 and Graphs',marks:12,stem:'U = {1, 2, 3, …, 12}, A = {multiples of 3} and B = {even numbers}.',parts:[

 '1A3':{topic:'Investigation',marks:9,stem:'Matchsticks are used to make a row of triangles. 1 triangle uses 3 matches, 2 triangles use 5 matches, and 3 triangles use 7 matches (each new triangle shares one side with the one before).',parts:[

  {t:'(b) Write a rule for the number of matches, M, needed for n triangles. (Type it like M=…)',m:2,s:['m=2n+1','m=1+2n'],model:'M increases by 2 each time and M = 3 when n = 1, so M = 2n + 1. [B2]'},
  {t:'(c) How many matches are needed for 40 triangles?',m:1,a:81,model:'2(40) + 1 = 81. [B1]'},
  {t:'(d) What is the largest number of triangles that can be made with 100 matches?',m:2,a:49,model:'2n + 1 ≤ 100, so n ≤ 49.5. The largest whole number is 49 (using 99 matches). [M1 A1]'},
  {t:'(e) Explain why the number of matches is always an odd number.',m:2,self:true,model:'2n is always even (a multiple of 2), and adding 1 to an even number gives an odd number. [B1 for "2n is even", B1 for "+1 makes it odd"]'}]},
 '1B1':{topic:'Consumer Arithmetic and Number Theory',marks:9,stem:'Kemar earns a gross salary of $85,000 per month.',parts:[
  {t:'(a) He pays 3% of his gross salary for NIS. Calculate his monthly NIS deduction.',m:1,a:2550,model:'0.03 × 85,000 = $2,550. [B1]'},
  {t:'(b) He pays income tax of 25% on the part of his salary above a tax-free allowance of $40,000. Calculate the tax.',m:2,a:11250,model:'Taxable income = 85,000 − 40,000 = 45,000. Tax = 0.25 × 45,000 = $11,250. [M1 A1]'},
  {t:'(c) Calculate his take-home pay after NIS and income tax.',m:1,a:71200,model:'85,000 − 2,550 − 11,250 = $71,200. [B1]'},
  {t:'(d) He saves 15% of his take-home pay. How much does he save each month?',m:1,a:10680,model:'0.15 × 71,200 = $10,680. [B1]'},
  {t:'(e) Evaluate (2.4 × 10³) × (5 × 10⁻²). Give your answer as an ordinary number.',m:2,a:120,model:'2.4 × 5 = 12 and 10³ × 10⁻² = 10¹, so the answer is 12 × 10 = 120 (1.2 × 10² in standard form). [M1 A1]'},
  {t:'(f) A phone bought for $48,000 is sold at a loss of 12%. Calculate the selling price.',m:2,a:42240,model:'Loss = 0.12 × 48,000 = 5,760. Selling price = 48,000 − 5,760 = $42,240. [M1 A1]'}]},
 '1B2':{topic:'Sets, Measurement, Algebra 1 and Graphs',marks:12,stem:'In a class of 40 students, 25 play cricket, 18 play football and 7 play neither.',parts:[
  {t:'(a)(i) How many students play both cricket and football?',m:2,a:10,model:'25 + 18 − x + 7 = 40, so 50 − x = 40 and x = 10. [M1 A1]'},
  {t:'(a)(ii) How many play cricket only?',m:1,a:15,model:'25 − 10 = 15. [B1]'},
  {t:'(b)(i) A sector has radius 21 cm and angle 120°. Calculate its arc length. (Use π = 22/7.)',m:2,a:44,model:'(120/360) × 2 × 22/7 × 21 = ⅓ × 132 = 44 cm. [M1 A1]'},
  {t:'(b)(ii) Calculate the area of the sector. (cm²)',m:1,a:462,model:'(120/360) × 22/7 × 21² = ⅓ × 1,386 = 462 cm². [B1]'},
  {t:'(c) Make t the subject of v = u + at. (Type it like t=…)',m:1,s:['t=(v-u)/a'],model:'v − u = at, so t = (v − u)/a. [B1]'},
  {t:'(d) Write x/3 + (x − 1)/2 as a single fraction. (Type it like (ax−b)/c.)',m:2,s:['(5x-3)/6'],model:'LCD 6: 2x/6 + 3(x − 1)/6 = (2x + 3x − 3)/6 = (5x − 3)/6. [M1 A1]'},
  {t:'(e)(i) For the line 2y = 3x − 8, state the gradient.',m:1,a:1.5,tol:0.001,model:'y = 1.5x − 4, so the gradient is 1.5 (3/2). [B1]'},
  {t:'(e)(ii) State the y-intercept.',m:1,a:-4,model:'c = −4. [B1]'},
  {t:'(e)(iii) Does the point (4, 2) lie on the line? (Type yes or no.)',m:1,s:['yes'],model:'2(2) = 4 and 3(4) − 8 = 4. Both sides are equal, so yes. [B1]'}]},
 '1B3':{topic:'Investigation',marks:9,stem:'At a church fair in Linstead, square tables are joined in a row. One table seats 4 people, 2 joined tables seat 6, and 3 joined tables seat 8.',parts:[
  {t:'(a)(i) How many people can sit at 4 joined tables?',m:1,a:10,model:'Each extra table adds 2 seats: 8 + 2 = 10. [B1]'},
  {t:'(a)(ii) How many people can sit at 6 joined tables?',m:1,a:14,model:'10 + 2 + 2 = 14. [B1]'},
  {t:'(b) Write a rule for the number of people, P, who can sit at n joined tables. (Type it like P=…)',m:2,s:['p=2n+2','p=2(n+1)','p=2+2n'],model:'P goes up by 2 each time, and P = 4 when n = 1, so P = 2n + 2. [B2]'},
  {t:'(c) How many people can sit at 25 joined tables?',m:1,a:52,model:'2(25) + 2 = 52. [B1]'},
  {t:'(d) How many tables are needed to seat exactly 60 people?',m:2,a:29,model:'2n + 2 = 60, so 2n = 58 and n = 29. [M1 A1]'},
  {t:'(e) Explain why each extra table adds only 2 seats, not 4.',m:2,self:true,model:'When a table is joined, one side of the new table and one side of the last table are pushed together, so those two places are lost. 4 − 2 = 2 new seats. [B1 for the joined sides, B1 for 4 − 2]'}]},
 '2A1':{topic:'Algebra 2, and Relations, Functions and Graphs 1',marks:12,stem:'Answer every part. Show your working.',parts:[

  {t:'(d) Hence state the minimum value of y = x² − 4x + 1.',m:1,a:-3,model:'−3, when x = 2. [B1]'},
  {t:'(e) f(x) = 3x − 1 and g(x) = x + 4. Calculate fg(2).',m:2,a:17,model:'g(2) = 6; f(6) = 17. [M1 A1]'},

  {t:'(g) State the gradient of a line perpendicular to y = 2x + 3.',m:2,a:-0.5,tol:0.001,model:'m₁m₂ = −1, so m₂ = −½. [M1 A1]'}]},

 '2B1':{topic:'Algebra 2, and Relations, Functions and Graphs 1',marks:12,stem:'Answer every part. Show your working.',parts:[

 '2B2':{topic:'Geometry and Trigonometry 1',marks:9,stem:'Answer every part. Give angles to 1 decimal place unless told otherwise.',parts:[

 '2B3':{topic:'Statistics 1, and Vectors and Matrices 1',marks:9,stem:'The table shows the number of goals scored in 20 school football matches. Goals: 0, 1, 2, 3, 4. Number of matches: 3, 5, 6, 4, 2.',parts:[

 '3A1':{topic:'Vectors and Matrices 2',marks:9,stem:'A = (4 3; 2 2).',parts:[
