  {t:'(b) The exchange rate is US$1 = J$156. How many Jamaican dollars does she need to buy US$250?',m:1,a:39000,model:'250 × 156 = J$39,000.'},

 {mod:'Module 2: Algebra 2, and Relations, Functions and Graphs 1',marks:12,stem:'Answer every part. Show your working.',parts:[

  {t:'(c) Write x² − 4x + 1 in the form (x + h)² + k. State the value of k.',m:2,a:-3,model:'(x − 2)² = x² − 4x + 4, so x² − 4x + 1 = (x − 2)² − 3. k = −3.'},

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="sqQ">Question:</label><select id="sqQ"></select></div><div class="sqBody"></div><div class="tile sqRes" aria-live="polite"></div>',
     init:function(box,api){var sel=box.querySelector('#sqQ'),state={};SQ.forEach(function(q,i){var o=document.createElement('option');o.value=i;o.textContent='Question '+(i+1)+': '+q.mod+' ('+q.marks+' marks)';sel.appendChild(o)});function norm(v){return String(v).toLowerCase().replace(/−/g,'-').replace(/\s/g,'').replace(/[–]/g,'-')}function check(p,v){if(p.s)return p.s.indexOf(norm(v).replace(/[()]/g,function(c){return c}).replace(/^\(|\)$/g,function(c){return c}))>=0||p.s.map(function(x){return x.replace(/[()]/g,'')}).indexOf(norm(v).replace(/[()]/g,''))>=0;var n=parseFloat(norm(v).replace(/[$,%]/g,''));return!isNaN(n)&&Math.abs(n-p.a)<=(p.tol||0.001)}function draw(){var qi=+sel.value,q=SQ[qi];state[qi]=state[qi]||{};var h='<div class="tile"><p style="margin:0"><strong>'+q.mod+'</strong> — '+q.marks+' marks. Suggested time: about '+Math.round(q.marks*150/90)+' minutes.</p><p style="margin:6px 0 0">'+q.stem+'</p></div>';q.parts.forEach(function(p,k){var st=state[qi][k];h+='<div class="tile"><p style="margin:0 0 6px">'+p.t+' <span class="badge">['+p.m+' mark'+(p.m>1?'s':'')+']</span></p><div class="controls"><input type="text" class="sqA" data-k="'+k+'" aria-label="Answer to part '+(k+1)+'" value="'+(st?st.v.replace(/"/g,'&quot;'):'')+'" style="min-width:200px"><button type="button" class="go sqM" data-k="'+k+'">Mark this part</button></div>'+(st?'<div class="fb '+(st.ok?'ok':'no')+'">'+(st.ok?'✓ '+p.m+' / '+p.m:'✗ 0 / '+p.m+' (in the real exam, correct working could still earn method marks)')+'<br><strong>Model working:</strong> '+p.model+'</div>':'')+'</div>'});box.querySelector('.sqBody').innerHTML=h;[].forEach.call(box.querySelectorAll('.sqM'),function(b){b.onclick=function(){var k=+b.getAttribute('data-k'),v=box.querySelector('.sqA[data-k="'+k+'"]').value;if(!String(v).trim())return;state[qi][k]={v:v,ok:check(q.parts[k],v)};draw()}});var done=q.parts.every(function(p,k){return state[qi][k]}),score=q.parts.reduce(function(t,p,k){return t+(state[qi][k]&&state[qi][k].ok?p.m:0)},0);box.querySelector('.sqRes').innerHTML=done?'<strong>Question complete: '+score+' / '+q.marks+' marks.</strong> Compare your working with each model answer, and note any method you need to revise.':'Marked so far: '+score+' / '+q.marks+'.';if(done)api.complete()}sel.onchange=draw;draw()}},
    {type:'recall',text:'Kemar is likely to earn more. The syllabus glossary says that for "Calculate", steps should be shown. If an answer is wrong, correct working can still earn method marks; and examiners look for the method even when the answer is right.'}]},
  {phase:'explain',name:'Teach: the paper',title:'Learn: the format of Paper 02, marks and timing, and the investigation',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Read each example and the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Nine question. All compulsory.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The format of Paper 02',explain:'<p>{{Paper 02|the structured-question paper}} is the structured-question paper. From the syllabus:</p><p>• <strong>Regular sitting:</strong> <strong>nine compulsory</strong> {{structured questions|questions in several parts, with marks for each part}}, <strong>three from each module</strong> (the investigative question is included in Module 1), in <strong>2 hours 30 minutes</strong>.<br>• <strong>Modular sitting:</strong> one module has 3 questions in 50 minutes; two modules have 6 questions in 1 hour 40 minutes.<br>• Each module is worth <strong>30 marks</strong>, so the paper totals <strong>90 marks</strong>.</p><p>The syllabus also notes that a question may combine topics from within a module. For example, a Module 2 question might mix algebra and functions.</p>',
     example:{q:'A student sits Module 3 only. How many Paper 02 questions, and how long?',steps:[{do:'One module: 3 compulsory questions.'},{do:'Time: 50 minutes.'},{do:'Marks: 30.'}]},
     mistake:'Thinking you can choose which questions to answer. All nine questions are compulsory.',
     check:{q:'How many Paper 02 questions come from each module in the regular sitting?',o:['3','9','6'],a:0,why:'9 questions ÷ 3 modules.',hint:'Shared equally.'}},
    {title:'Marks and timing',explain:'<p>The syllabus shows how the 30 marks in each module are shared between topics, as in the chart. Notice the big ones: in Module 2, Algebra 2 with Relations, Functions and Graphs 1 is worth 12 marks; in Module 3, Vectors and Matrices 2 and Geometry and Trigonometry 2 are worth 9 each.</p><p>Plan your time by the <strong>marks</strong>: 150 minutes for 90 marks is about <strong>1⅔ minutes per mark</strong>. So a 9-mark question deserves about 15 minutes, and a 12-mark part about 20 minutes. Leave about 10 minutes at the end to check.</p><p>The marks next to each part also tell you how much to write: a 1-mark part needs a short answer; a 3-mark part needs several steps of working.</p>',visual:MBAR(),
     example:{q:'About how long should you spend on a 6-mark Statistics question?',steps:[{do:'1⅔ minutes per mark × 6 marks.'},{do:'= 10 minutes.'},{do:'If it takes much longer, move on and return later.'}]},
     mistake:'Spending 40 minutes on the first question. Use the marks to budget your time.',
     check:{q:'How many marks is each module worth on Paper 02?',o:['30','20','50'],a:0,why:'90 ÷ 3.',hint:'Total 90.'}},
    {title:'The investigation question',explain:'<p>Module 1 includes an {{investigation|exploring a pattern and generalising}} question worth <strong>9 marks</strong>, which may be set on any combination of Module 1 objectives. It usually asks you to explore a pattern or situation, fill in a table, spot a rule, and use it.</p><p>A reliable approach: <strong>1.</strong> Work out the first few cases carefully (draw them if helpful). <strong>2.</strong> Put the results in a table. <strong>3.</strong> Look for the pattern (what is added, multiplied or squared each time?). <strong>4.</strong> Write a general rule, often in terms of n. <strong>5.</strong> Test the rule on a case you know. <strong>6.</strong> Use it to answer the final question.</p><p>These match the syllabus’s problem-solving strategies: simple numbers, diagrams, tables, patterns and algebraic symbols.</p>',
     example:{q:'Squares are made in a row from matchsticks: 1 square uses 4 matches, 2 squares use 7, 3 squares use 10. Find a rule and the matches for 20 squares.',steps:[{do:'Table: n = 1, 2, 3 gives 4, 7, 10. It goes up by 3 each time.'},{do:'Rule: M = 3n + 1. Test: n = 2 gives 7 ✓.'},{do:'n = 20: M = 61 matches.'}]},
     mistake:'Guessing a rule from one case. Test the rule on at least two cases.',
     check:{q:'A pattern goes 5, 9, 13, 17, … What is the rule for the nth term?',o:['4n + 1','n + 4','5n'],a:0,why:'Up by 4; 4(1) + 1 = 5.',hint:'What is added each time?'}}]}]},
  {phase:'explain',name:'Teach: answering well',title:'Learn: command words, showing working, and exam strategy',lead:'Next, how to turn what you know into marks on Paper 02.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Read each example and the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Show yuh working. Every time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Command words',explain:'<p>The syllabus includes a glossary of examination terms. Each command word tells you what the examiner wants:</p><p>• {{Calculate|steps shown, units included}}: arrive at the solution to a numerical problem; <strong>steps should be shown; units must be included</strong>.<br>• {{Determine|find the value}}: find the value of a quantity.<br>• {{Construct|draw accurately to a format}}: draw accurately (a graph, histogram, pie chart or scale diagram), with a title, headings and legend where appropriate.<br>• {{Sketch|a simple freehand diagram}}: a simple freehand diagram showing the important details (not to scale).<br>• <strong>Explain</strong>: give reasons. <strong>Justify</strong>: explain the correctness of an answer. <strong>Estimate</strong>: make an approximate judgement.<br>• <strong>Deduce</strong>: make a logical connection between pieces of information, often from an earlier part (“hence”).</p>',
     example:{q:'"Hence solve 2x² + 5x − 3 = 0." What does "hence" tell you?',steps:[{do:'Use the result from the previous part.'},{do:'Here, the factorisation (2x − 1)(x + 3) from part (a).'},{do:'So x = ½ or x = −3, quickly, without the formula.'}]},
     mistake:'Ignoring "hence". It points you to a shortcut from the previous part.',
     check:{q:'According to the syllabus glossary, "Calculate" requires…',o:['steps shown and units included','only the final answer','a sketch'],a:0,why:'As defined in the glossary.',hint:'Working and units.'}},
    {title:'Showing working: method marks and accuracy',explain:'<p>Paper 02 marks are usually split into {{method marks|marks for a correct method}} (for a correct method, even if there is a slip later) and {{accuracy marks|marks for the correct final answer}} (for the correct answer). Writing only an answer is risky: if it is wrong, you get nothing; with working, you may still earn most of the marks.</p><p>Good habits:</p><p>• Write the formula, then substitute, then calculate.<br>• Keep full calculator values until the end, then <strong>round only the final answer</strong>, to the accuracy asked.<br>• Include <strong>units</strong> (cm, cm², m/s, $).<br>• Draw and label diagrams for geometry and trigonometry.<br>• Answer the actual question asked, in a sentence if needed.</p>',
     example:{q:'"Calculate the area of a circle of radius 6 cm, correct to 1 decimal place." Show a full-mark answer.',steps:[{do:'A = πr² = π × 6² = 36π.'},{do:'= 113.097… cm² (keep full accuracy).'},{do:'= 113.1 cm² (to 1 d.p., with units).'}]},
     mistake:'Rounding early (for example, using π = 3) and getting an inaccurate final answer.',
     check:{q:'A student’s final answer is wrong, but the method is correct. On Paper 02, the student may…',o:['still earn method marks','earn no marks at all','lose marks on other questions'],a:0,why:'Method marks reward correct working.',hint:'Working counts.'}},
    {title:'Exam-day strategy',explain:'<p>A calm plan helps:</p><p><strong>1. Read the whole paper</strong> quickly at the start, noting the questions you feel strongest on.<br><strong>2. Start with a strong question</strong> to build confidence; you do not have to answer in order (but label each answer clearly).<br><strong>3. Budget time by marks</strong> (about 1⅔ minutes per mark), and move on if stuck.<br><strong>4. Attempt every part.</strong> Later parts are often independent: you can answer part (d) even if part (c) went wrong, sometimes using a given result.<br><strong>5. Check:</strong> units, rounding, signs, and that each answer makes sense.</p><p>Bring the right equipment: pens, pencil, ruler, compasses, protractor, eraser, and a silent non-programmable calculator (with spare batteries), in degree mode.</p>',
     example:{q:'You cannot do part (b), but part (c) says "Hence, or otherwise, …". What should you do?',steps:[{do:'"Otherwise" means another method is allowed.'},{do:'Attempt part (c) by a different method.'},{do:'Never leave later parts blank because an earlier part went wrong.'}]},
     mistake:'Leaving a whole question blank because the first part is hard. Later parts may be easier.',
     check:{q:'On Paper 02, you should answer…',o:['all nine questions','any six questions','only Module 3'],a:0,why:'All questions are compulsory.',hint:'Compulsory.'}}]}]},
