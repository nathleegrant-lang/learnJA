<script>
var K=window.LessonKit;
var C0=[200,170],RR=115,DG=Math.PI/180;
var PTc=function(a){return[C0[0]+RR*Math.cos(a*DG),C0[1]-RR*Math.sin(a*DG)]};
var ANG=function(V,P,Q){var a=[P[0]-V[0],P[1]-V[1]],b=[Q[0]-V[0],Q[1]-V[1]],d=(a[0]*b[0]+a[1]*b[1])/(Math.hypot(a[0],a[1])*Math.hypot(b[0],b[1]));return Math.acos(Math.max(-1,Math.min(1,d)))/DG};
var r1=function(n){return Math.round(n*10)/10};
var CIR=function(inner,lbl){return'<svg viewBox="0 0 400 340" role="img" aria-label="'+(lbl||'A circle theorem diagram')+'"><rect width="400" height="340" fill="#faf8fe"/><circle cx="'+C0[0]+'" cy="'+C0[1]+'" r="'+RR+'" fill="#fff" stroke="#3d2a73" stroke-width="2.5"/>'+inner+'</svg>'};
var L=function(a,b,c,w,d){return'<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+(c||'#2f5fc4')+'" stroke-width="'+(w||2.5)+'"'+(d?' stroke-dasharray="6 4"':'')+'/>'};
var D=function(p,t,dx,dy,c){return'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+(c||'#3d2a73')+'"/><text x="'+(p[0]+(dx||8)).toFixed(1)+'" y="'+(p[1]+(dy||-6)).toFixed(1)+'" font-size="14" font-weight="700" fill="'+(c||'#3d2a73')+'">'+t+'</text>'};
var LAB=function(p,t,c){return'<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" font-size="13" font-weight="700" fill="'+(c||'#8f1f2b')+'" text-anchor="middle">'+t+'</text>'};
var near=function(V,P,Q,f){var a=Math.atan2(P[1]-V[1],P[0]-V[0])+Math.atan2(Q[1]-V[1],Q[0]-V[0]),m=[(P[0]+Q[0])/2-V[0],(P[1]+Q[1])/2-V[1]],l=Math.hypot(m[0],m[1])||1;return[V[0]+m[0]/l*(f||34),V[1]+m[1]/l*(f||34)+4]};
var MODES={
 centre:['Angle at the centre is twice the angle at the circumference',[30,150],function(t){var A=PTc(210),B=PTc(330),P=PTc(t),O=C0,c=ANG(O,A,B),p=ANG(P,A,B);return{svg:CIR(L(A,P)+L(B,P)+L(A,O,'#c02d5f')+L(B,O,'#c02d5f')+D(A,'A',-20,14)+D(B,'B',6,14)+D(P,'P',6,-8)+D(O,'O',-6,22,'#8f1f2b')+LAB(near(O,A,B,30),r1(c)+'°')+LAB(near(P,A,B,34),r1(p)+'°','#1f4a9c'),'Angle AOB at the centre and angle APB at the circumference'),txt:'Angle AOB (centre) = <strong>'+r1(c)+'°</strong>; angle APB (circumference) = <strong>'+r1(p)+'°</strong>. The centre angle is <strong>twice</strong> the circumference angle, wherever P is on the major arc. (The same arc AB gives the same angle APB everywhere: "angles in the same segment are equal".)'}}],
 semi:['The angle in a semicircle is a right angle',[15,165],function(t){var A=PTc(180),B=PTc(0),P=PTc(t),p=ANG(P,A,B);return{svg:CIR(L(A,B,'#c02d5f')+L(A,P)+L(B,P)+D(A,'A',-20,6)+D(B,'B',8,6)+D(P,'P',6,-8)+D(C0,'O',-6,20,'#8f1f2b')+LAB(near(P,A,B,30),r1(p)+'°','#1f4a9c'),'Angle in a semicircle'),txt:'AB is a diameter. Angle APB = <strong>'+r1(p)+'°</strong>, always <strong>90°</strong>, wherever P is on the circle.'}}],
 cyc:['Opposite angles of a cyclic quadrilateral add to 180°',[95,175],function(t){var A=PTc(200),B=PTc(320),Cc=PTc(40),Dd=PTc(t),a=ANG(A,B,Dd),b=ANG(B,A,Cc),c=ANG(Cc,B,Dd),d=ANG(Dd,Cc,A);return{svg:CIR('<polygon points="'+[A,B,Cc,Dd].map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="#e4ecfb" fill-opacity=".6" stroke="#2f5fc4" stroke-width="2.5"/>'+D(A,'A',-20,10)+D(B,'B',6,14)+D(Cc,'C',8,-4)+D(Dd,'D',-16,-8)+LAB(near(A,B,Dd,28),r1(a)+'°','#1f4a9c')+LAB(near(Cc,B,Dd,28),r1(c)+'°','#1f4a9c')+LAB(near(B,A,Cc,28),r1(b)+'°')+LAB(near(Dd,Cc,A,28),r1(d)+'°'),'A cyclic quadrilateral ABCD'),txt:'Angle A + angle C = '+r1(a)+'° + '+r1(c)+'° = <strong>'+r1(a+c)+'°</strong>.  Angle B + angle D = '+r1(b)+'° + '+r1(d)+'° = <strong>'+r1(b+d)+'°</strong>. Opposite angles are <strong>supplementary</strong>.'}}],
 alt:['The tangent–chord angle equals the angle in the alternate segment',[100,175],function(t){var T=PTc(270),A=PTc(30),P=PTc(t),tr=[T[0]+150,T[1]],tl=[T[0]-150,T[1]],ac=ANG(T,tr,A),p=ANG(P,T,A);return{svg:CIR(L(tl,tr,'#16766a',2.5)+L(T,A,'#c02d5f')+L(P,T)+L(P,A)+D(T,'T',-4,22)+D(A,'A',8,-4)+D(P,'P',-18,-8)+LAB([T[0]+46,T[1]-10],r1(ac)+'°','#155c35')+LAB(near(P,T,A,32),r1(p)+'°','#1f4a9c')+'<text x="'+(tr[0]-6)+'" y="'+(T[1]-6)+'" font-size="12" text-anchor="end" fill="#155c35">tangent</text>','Tangent at T, chord TA, and angle TPA in the alternate segment'),txt:'The angle between the tangent and chord TA = <strong>'+r1(ac)+'°</strong>. The angle TPA in the alternate segment = <strong>'+r1(p)+'°</strong>. They are equal, wherever P is on that arc.'}}]};
var TANG=function(){var O=C0,X=[C0[0]+260*0.92,C0[1]],th=Math.acos(RR/240),T1=[O[0]+RR*Math.cos(th),O[1]-RR*Math.sin(th)],T2=[O[0]+RR*Math.cos(th),O[1]+RR*Math.sin(th)];return'<svg viewBox="0 0 470 340" role="img" aria-label="Two tangents from an external point X, each perpendicular to a radius"><rect width="470" height="340" fill="#faf8fe"/><circle cx="'+O[0]+'" cy="'+O[1]+'" r="'+RR+'" fill="#fff" stroke="#3d2a73" stroke-width="2.5"/>'+L([O[0]+240,O[1]],T1,'#16766a')+L([O[0]+240,O[1]],T2,'#16766a')+L(O,T1,'#c02d5f')+L(O,T2,'#c02d5f')+D(O,'O',-18,6,'#8f1f2b')+D([O[0]+240,O[1]],'X',8,6)+D(T1,'P',2,-10)+D(T2,'Q',2,20)+'<text x="'+(T1[0]+4)+'" y="'+(T1[1]+24)+'" font-size="12" fill="#3d2a73">90°</text><text x="'+(T2[0]+4)+'" y="'+(T2[1]-12)+'" font-size="12" fill="#3d2a73">90°</text><text x="380" y="120" font-size="12" fill="#155c35">XP = XQ</text></svg>'};
var CHORD=function(){var A=PTc(150),B=PTc(30),M=[(A[0]+B[0])/2,(A[1]+B[1])/2];return CIR(L(A,B,'#2f5fc4')+L(C0,M,'#c02d5f',2.5,true)+D(A,'A',-18,-6)+D(B,'B',8,-6)+D(M,'M',4,-8)+D(C0,'O',-6,22,'#8f1f2b')+'<path d="M'+(M[0]-10)+' '+M[1]+' v10 h10" fill="none" stroke="#3d2a73" stroke-width="1.5"/>','The line from the centre O to the midpoint M of chord AB is perpendicular to AB')};
window.LESSON={
 id:'g11-t2-maths-csec-36',
 grade:11, term:2, subject:'Mathematics', strand:'Geometry and Trigonometry',
 title:'Circle Theorems',
 goals:['use the vocabulary of circles: radius, diameter, chord, arc, tangent, segment, sector and semicircle','use the theorems about angles at the centre, angles in the same segment and the angle in a semicircle','use the properties of cyclic quadrilaterals','use the tangent and chord theorems, and determine and justify angles with correct reasons'],
 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 2',unit:'Module 3: Geometry and Trigonometry 2',strand:'Geometry and Trigonometry',standard:'Module 3, Geometry and Trigonometry 2: understand the properties and relationship among geometrical objects; demonstrate the ability to use geometrical concepts to model and solve real world problems.',
  objectives:['3.1 solve geometric problems using properties of circles and circle theorems;'],
  focus:'Radius, diameter, chord, circumference, arc, tangent, segment, sector, semicircle, π. Determining and justifying angles using the circle theorems listed in the syllabus: the angle at the centre is twice the angle at the circumference; angles in the same segment are equal; the angle in a semicircle is a right angle; opposite angles of a cyclic quadrilateral are supplementary; the exterior angle of a cyclic quadrilateral equals the interior opposite angle; the angle between a tangent and a chord equals the angle in the alternate segment; a tangent is perpendicular to the radius at the point of contact; two tangents from an external point are equal in length; the line from the centre to the midpoint of a chord is perpendicular to the chord.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 3, Section 3 (3.1). The nine theorems are taken directly from the syllabus content notes. The syllabus suggests GeoGebra; the explorer works in the same way, keeping each theorem true as a point moves.'},
 glossary:[['Chord','A straight line joining two points on a circle.'],['Diameter','A chord through the centre; twice the radius.'],['Arc','Part of the circumference.'],['Tangent','A straight line that touches a circle at exactly one point.'],['Segment','The region between a chord and an arc.'],['Sector','The region between two radii and an arc.'],['Subtend','An arc or chord subtends an angle at a point when lines from its ends meet there.'],['Cyclic quadrilateral','A quadrilateral with all four vertices on a circle.'],['Alternate segment','The segment on the other side of a chord from the angle being considered.']],
 teacher:{time:'about 120 minutes over three periods',flow:[['Engage','8 min','The football camera: which seat sees the goal at the widest angle?','Use a photo of a circular stadium.'],['Explore','20 min','Circle theorem lab: move a point and watch the angles.','Ask: "What stays the same as P moves?"'],['Explain','50 min','Vocabulary, angle theorems, cyclic quadrilaterals; tangents, chords, problem-solving with reasons; I do, we do, you do.','Use GeoGebra, as the syllabus suggests.'],['Elaborate','30 min','Challenge Zone and Bronze to Gold problems.','Insist on a reason for every angle.'],['Evaluate','12 min','Quiz and reflection.','Mark reasons as well as answers.']],
  misconceptions:['Halving the circumference angle instead of doubling it to get the centre angle.','Applying the cyclic quadrilateral rule to a quadrilateral that is not cyclic (one vertex at the centre).','Using the angle in a semicircle when the chord is not a diameter.','Picking the wrong segment for the alternate segment theorem.','Giving angles without reasons.'],
  extension:'Prove the theorem "the angle at the centre is twice the angle at the circumference" using isosceles triangles formed by radii. Then use it to prove that the angle in a semicircle is 90°.'},
 steps:[
  {phase:'engage',name:'The camera angles',title:'Which seat sees the goal at the widest angle?',lead:'A TV crew filming a match at a circular venue in Kingston places cameras at different points on the edge. Each camera looks at the same goal mouth, which is a chord of the circle. They want the camera with the widest view of the goal.',
   mission:['Type your name.','Predict how the angle changes as the camera moves around the circle.','Write what you already know about circles.'],
   patois:'Camera dem round di circle a look pon di same goal. Which one see it widest?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'For cameras on the same arc of the circle, how does the angle they see the goal at compare?',options:['It is the same for all of them','It is widest in the middle','It is widest near the goal'],after:'The circle theorem lab will show you: angles in the same segment are equal.'},{type:'write',fields:[{id:'know',label:'Words I know for parts of a circle:',placeholder:'Example: radius, diameter'},{id:'wonder',label:'Circular objects or places I know:',placeholder:'Example: a roundabout, a drum'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'In an isosceles triangle, the base angles are…',o:['equal','supplementary','90°'],a:0,why:'Two equal sides give two equal angles.',teach:'An isosceles triangle has two equal sides, and the angles opposite them are equal.'},{q:'A triangle has angles 40° and 70°. The third angle is…',o:['70°','110°','30°'],a:0,why:'180 − 110.',teach:'The angles of a triangle add up to 180°.'},{q:'Two radii of the same circle are…',o:['equal','perpendicular','parallel'],a:0,why:'Every radius has the same length.',teach:'All radii of a circle are equal, which often makes isosceles triangles.'},{q:'Angles in a quadrilateral add up to…',o:['360°','180°','540°'],a:0,why:'Two triangles.',teach:'A quadrilateral splits into two triangles: 2 × 180° = 360°.'}]}]},
  {phase:'explore',name:'Circle theorem lab',title:'Explore: the circle theorem lab',lead:'Choose a theorem, then slide the moving point around the circle. The lab measures the angles as you go. Look for what stays the same.',
   mission:['Try all four theorems. Move the point slowly each time.','Write down what never changes in each one.','Complete all 3 challenges for a star.'],
   patois:'Move di point. Wah nuh change?',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="ctM">Theorem:</label><select id="ctM"></select></div><div class="controls"><label for="ctT">Move the point:</label><input type="range" id="ctT" min="0" max="100" value="50"></div><div class="scene ctSvg"></div><div class="explain ctX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge ctN"></span> <strong class="ctQ"></strong></p><div class="controls"><input type="number" class="ctIn" aria-label="Your answer" placeholder="degrees"><button type="button" class="go ctC">Check</button></div><div class="fb ctFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var M=box.querySelector('#ctM'),T=box.querySelector('#ctT');api.nudges(T);Object.keys(MODES).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=MODES[k][0];M.appendChild(o)});function draw(){var m=MODES[M.value],r=m[1],t=r[0]+(r[1]-r[0])*(+T.value)/100,res=m[2](t);box.querySelector('.ctSvg').innerHTML=res.svg;box.querySelector('.ctX').innerHTML=res.txt}M.onchange=draw;T.addEventListener('input',draw);var Q=[{t:'An angle at the circumference is 55°. What is the angle at the centre standing on the same arc?',a:110},{t:'One angle of a cyclic quadrilateral is 72°. What is the opposite angle?',a:108},{t:'What angle does a tangent make with the radius at the point of contact?',a:90}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.ctN').textContent='All done';box.querySelector('.ctQ').textContent='You completed every challenge!';box.querySelector('.ctC').disabled=true;return}box.querySelector('.ctN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ctQ').textContent=Q[q].t}box.querySelector('.ctC').onclick=function(){var v=parseFloat(box.querySelector('.ctIn').value),fb=box.querySelector('.ctFb');if(v===Q[q].a){fb.className='fb ok ctFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ctIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no ctFb';fb.textContent='Not yet. Choose the matching theorem in the lab and look at the pattern.'}};draw();task()}},
    {type:'recall',text:'All the cameras on the same arc see the goal at the same angle: angles in the same segment, standing on the same chord, are equal.'}]},
  {phase:'explain',name:'Teach: angles in circles',title:'Learn: circle vocabulary, angle theorems and cyclic quadrilaterals',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Every angle need a reason. Say which theorem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The language of circles',explain:'<p>The syllabus lists the parts of a circle you must know. The <strong>radius</strong> goes from the centre to the edge; the <strong>diameter</strong> goes right across through the centre (twice the radius); the <strong>circumference</strong> is the distance around.</p><p>A {{chord|a straight line joining two points on a circle}} joins two points on the circle. An {{arc|part of the circumference}} is part of the circumference. A {{tangent|a line touching a circle at exactly one point}} touches the circle at exactly one point. A {{segment|the region between a chord and an arc}} is the region between a chord and an arc; a {{sector|the region between two radii and an arc}} is the “pizza slice” between two radii; a <strong>semicircle</strong> is half a circle.</p><p>We say an arc or chord {{subtends|makes an angle at a point}} an angle at a point when lines from its two ends meet there.</p>',
     example:{q:'Name each: (a) a chord through the centre; (b) the region between a chord and an arc; (c) a line touching the circle once.',steps:[{do:'(a) A diameter.'},{do:'(b) A segment.'},{do:'(c) A tangent.'}]},
     mistake:'Confusing a segment with a sector. A sector is bounded by two RADII; a segment by a CHORD.',
     check:{q:'A slice of pizza bounded by two radii and the crust is a…',o:['sector','segment','chord'],a:0,why:'Two radii and an arc.',hint:'Pizza slice.'}},
    {title:'Angles at the centre, in the same segment, and in a semicircle',explain:'<p>Three related theorems, as written in the syllabus:</p><p>• <strong>The angle which an arc subtends at the centre is twice the angle it subtends at any point on the remaining part of the circumference.</strong> In short: centre angle = 2 × circumference angle.<br>• <strong>Angles at the circumference in the same segment, subtended by the same arc or chord, are equal.</strong> (That is the camera puzzle.)<br>• <strong>The angle at the circumference subtended by the diameter is a right angle.</strong> (The angle in a semicircle is 90°.)</p><p>The third follows from the first: a diameter makes an angle of 180° at the centre, so the angle at the circumference is half of 180°, which is 90°.</p>',visual:MODES.centre[2](90).svg,
     example:{q:'O is the centre. Angle AOB = 130°. P is on the major arc. Find angle APB, and give a reason.',steps:[{do:'Angle APB stands on the same arc AB.'},{do:'Angle APB = ½ × 130° = 65°.'},{do:'Reason: the angle at the centre is twice the angle at the circumference.'}]},
     mistake:'Halving when you should double (or the reverse). The CENTRE angle is the BIGGER one: twice the circumference angle.',
     check:{q:'AB is a diameter and P is on the circle. Angle PAB = 35°. Find angle PBA.',o:['55°','35°','90°'],a:0,why:'Angle APB = 90°, so 180 − 90 − 35 = 55.',hint:'The angle in a semicircle is 90°.'}},
    {title:'Cyclic quadrilaterals',explain:'<p>A {{cyclic quadrilateral|a quadrilateral with all four vertices on a circle}} has all four of its vertices on a circle. Two theorems apply:</p><p>• <strong>The opposite angles of a cyclic quadrilateral are supplementary</strong> (they add up to 180°).<br>• <strong>The exterior angle of a cyclic quadrilateral is equal to the interior opposite angle.</strong></p><p>The second follows from the first: the exterior angle at one vertex and the interior angle there add to 180° (angles on a straight line), and so do the interior angle and its opposite. So the exterior angle equals the interior opposite angle.</p><p>Be careful: a quadrilateral with one vertex at the centre is NOT cyclic.</p>',visual:MODES.cyc[2](140).svg,
     example:{q:'ABCD is a cyclic quadrilateral with angle A = 85° and angle B = 110°. Find angles C and D.',steps:[{do:'Angle C = 180° − 85° = 95° (opposite angles of a cyclic quadrilateral are supplementary).'},{do:'Angle D = 180° − 110° = 70° (same reason).'},{do:'Check: 85 + 110 + 95 + 70 = 360° ✓'}]},
     mistake:'Adding ADJACENT angles to 180°. It is the OPPOSITE angles that are supplementary.',
     check:{q:'In a cyclic quadrilateral, the exterior angle at C is 98°. What is the interior angle at A?',o:['98°','82°','180°'],a:0,why:'The exterior angle equals the interior opposite angle.',hint:'Exterior = interior opposite.'}}]}]},
  {phase:'explain',name:'Teach: tangents and chords',title:'Learn: tangents, chords, and solving problems with reasons',lead:'Next, the theorems about tangents and chords, and putting them together.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Tangent meet radius at 90°.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Tangents: perpendicular to the radius, and equal from a point',explain:'<p>Two theorems about tangents:</p><p>• <strong>A tangent of a circle is perpendicular to the radius (or diameter) of that circle at the point of contact.</strong> So there is always a 90° angle where a radius meets a tangent.<br>• <strong>The lengths of two tangents from an external point to the points of contact on the circle are equal.</strong></p><p>Together they make a lovely shape: from an external point X, the two tangents XP and XQ, with the radii OP and OQ, form a kite OPXQ with two right angles. The line OX is a line of symmetry, so it splits the kite into two congruent right triangles. You can use Pythagoras or trigonometry in them.</p>',visual:TANG(),
     example:{q:'A tangent from X touches a circle with centre O at P. OP = 5 cm and OX = 13 cm. Find XP.',steps:[{do:'Angle OPX = 90° (a tangent is perpendicular to the radius at the point of contact).'},{do:'By Pythagoras: XP² = 13² − 5² = 169 − 25 = 144.'},{do:'XP = 12 cm.'}]},
     mistake:'Forgetting the right angle between the tangent and the radius. Look for it every time there is a tangent.',
     check:{q:'Two tangents from X touch a circle at P and Q. XP = 9 cm. XQ = ?',o:['9 cm','18 cm','4.5 cm'],a:0,why:'Tangents from an external point are equal.',hint:'Equal tangents.'}},
    {title:'The alternate segment theorem',explain:'<p>This theorem connects a tangent with a chord: <strong>the angle between a tangent to a circle and a chord through the point of contact is equal to the angle in the alternate segment.</strong></p><p>Here is how to use it. At the point of contact T, find the angle between the tangent and the chord TA. The chord splits the circle into two segments. The “alternate segment” is the one on the <strong>other side</strong> of the chord from that angle. Any angle in that segment standing on chord TA (such as angle TPA) equals the tangent–chord angle.</p><p>It takes practice to spot. Look for a tangent and a chord meeting at the same point, then a triangle drawn on the other side.</p>',visual:MODES.alt[2](140).svg,
     example:{q:'A tangent at T makes an angle of 64° with the chord TA. P is a point on the major arc. Find angle TPA.',steps:[{do:'P is in the alternate segment (on the other side of TA from the 64° angle).'},{do:'Angle TPA = 64°.'},{do:'Reason: the angle between a tangent and a chord equals the angle in the alternate segment.'}]},
     mistake:'Choosing the angle in the wrong segment. It must be on the OTHER side of the chord from the tangent–chord angle.',
     check:{q:'The tangent–chord angle at T is 50°. The angle in the alternate segment is…',o:['50°','130°','40°'],a:0,why:'They are equal.',hint:'Alternate segment theorem.'}},
    {title:'Chords, and solving problems with reasons',explain:'<p>The last theorem in the syllabus: <strong>the line joining the centre of a circle to the midpoint of a chord is perpendicular to the chord.</strong> It also works the other way: the perpendicular from the centre to a chord cuts the chord in half. This often gives a right triangle (radius, half-chord, distance from the centre) for Pythagoras.</p><p>CSEC questions ask you to <strong>determine and justify</strong> angles. For every angle, write the value <strong>and</strong> the reason, using the theorem’s words, such as “angle in a semicircle” or “opposite angles of a cyclic quadrilateral”. Many problems also need older facts: isosceles triangles from two radii, angles in a triangle, angles on a straight line.</p>',visual:CHORD(),
     example:{q:'A chord AB is 16 cm long in a circle of radius 10 cm. How far is AB from the centre O?',steps:[{do:'The perpendicular from O bisects AB, so AM = 8 cm.'},{do:'Triangle OMA has a right angle at M, and OA = 10 cm (radius).'},{do:'OM = √(10² − 8²) = √36 = 6 cm.'}]},
