var HIST=function(f,lbl){var mx=Math.max.apply(null,f.concat([1])),W=540,H=270,X=function(b){return 50+(b-0.5)/50*450},Y=function(v){return 230-v/mx*190},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Histogram with frequency polygon')+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><line x1="50" y1="230" x2="510" y2="230" stroke="#3d2a73" stroke-width="2"/><line x1="50" y1="230" x2="50" y2="25" stroke="#3d2a73" stroke-width="2"/>',pts=[];CL.forEach(function(c,i){var x0=X(c[0]-0.5),x1=X(c[1]+0.5);s+='<rect x="'+x0+'" y="'+Y(f[i])+'" width="'+(x1-x0)+'" height="'+(230-Y(f[i]))+'" fill="#e4ecfb" stroke="#2f5fc4" stroke-width="2"/><text x="'+((x0+x1)/2)+'" y="'+(Y(f[i])-6)+'" text-anchor="middle" font-size="11" fill="#3d2a73">'+f[i]+'</text>';pts.push([(x0+x1)/2,Y(f[i])])});[0.5,10.5,20.5,30.5,40.5,50.5].forEach(function(b){s+='<text x="'+X(b)+'" y="246" text-anchor="middle" font-size="10" fill="#5d5478">'+b+'</text>'});var first=[X(-4.5),230],last=[X(55.5),230];s+='<polyline points="'+[first].concat(pts,[last]).map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="#c02d5f" stroke-width="2.5"/>';pts.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#c02d5f"/>'});return s+'<text x="280" y="264" text-anchor="middle" font-size="12" fill="#3d2a73">marks (class boundaries)</text></svg>'};
var OGV=function(f,mark,lbl){var T=f.reduce(function(a,b){return a+b},0)||1,cf=[0],acc=0;f.forEach(function(x){acc+=x;cf.push(acc)});var B=[0.5,10.5,20.5,30.5,40.5,50.5],W=540,H=270,X=function(b){return 50+(b-0.5)/50*450},Y=function(v){return 230-v/T*190},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Cumulative frequency curve (ogive)')+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><line x1="50" y1="230" x2="510" y2="230" stroke="#3d2a73" stroke-width="2"/><line x1="50" y1="230" x2="50" y2="25" stroke="#3d2a73" stroke-width="2"/>';B.forEach(function(b){s+='<text x="'+X(b)+'" y="246" text-anchor="middle" font-size="10" fill="#5d5478">'+b+'</text>'});[0,0.25,0.5,0.75,1].forEach(function(p){s+='<text x="44" y="'+(Y(p*T)+4)+'" text-anchor="end" font-size="10" fill="#5d5478">'+f2(p*T)+'</text>'});s+='<polyline points="'+B.map(function(b,i){return X(b).toFixed(1)+','+Y(cf[i]).toFixed(1)}).join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3" stroke-linejoin="round"/>';B.forEach(function(b,i){s+='<circle cx="'+X(b)+'" cy="'+Y(cf[i])+'" r="4" fill="#2f5fc4"/>'});if(mark!==undefined){var mk=mark,j=1;while(j<B.length-1&&B[j]<mk)j++;var cv=cf[j-1]+(mk-B[j-1])/(B[j]-B[j-1])*(cf[j]-cf[j-1]);s+='<line x1="'+X(mk)+'" y1="230" x2="'+X(mk)+'" y2="'+Y(cv)+'" stroke="#16766a" stroke-width="2" stroke-dasharray="5 4"/><line x1="'+X(mk)+'" y1="'+Y(cv)+'" x2="50" y2="'+Y(cv)+'" stroke="#16766a" stroke-width="2" stroke-dasharray="5 4"/>'}return s+'<text x="280" y="264" text-anchor="middle" font-size="12" fill="#3d2a73">upper class boundary</text><text x="16" y="128" font-size="12" fill="#3d2a73" text-anchor="middle" transform="rotate(-90 16 128)">cumulative frequency</text></svg>'};

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 3',unit:'Module 3: Statistics 2',strand:'Statistics',standard:'Module 3, Statistics 2: appreciate the advantages and disadvantages of the various ways of presenting and representing data; appreciate the necessity for taking precautions in collecting, analysing and interpreting statistical data, and making inferences.',

 glossary:[['Grouped data','Data organised into classes (intervals), such as 21–30.'],['Discrete data','Data that can only take separate values, such as numbers of people.'],['Continuous data','Data that can take any value in a range, such as height or time.'],['Class limits','The smallest and largest values written for a class, such as 21 and 30.'],['Class boundaries','The values halfway between classes, such as 20.5 and 30.5.'],['Class width','Upper boundary − lower boundary.'],['Class midpoint','(lower limit + upper limit) ÷ 2.'],['Modal class','The class with the highest frequency.'],['Median class','The class containing the middle value.'],['Cumulative frequency','A running total of the frequencies.'],['Ogive','A cumulative frequency curve.']],

 steps:[

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

   blocks:[{type:'mcq',star:true,questions:[{q:'What is halfway between 21 and 30?',o:['25.5','25','26'],a:0,why:'(21 + 30) ÷ 2.',teach:'Add and halve: 51 ÷ 2 = 25.5.'},{q:'Running total of 4, 7, 12?',o:['4, 11, 23','4, 7, 12','23'],a:0,why:'4, 4 + 7, 4 + 7 + 12.',teach:'A running total adds each new value to the total so far.'},{q:'From a table: x = 2, 3, 4 with f = 5, 3, 2. Σfx = ?',o:['27','9','10'],a:0,why:'10 + 9 + 8.',teach:'Multiply each value by its frequency and add: 10 + 9 + 8 = 27.'},{q:'Which data is continuous?',o:['Heights of students','Number of siblings','Shoe sizes'],a:0,why:'Height can take any value.',teach:'Continuous data can take any value in a range (like 156.37 cm). Counts are discrete.'}]}]},
  {phase:'explore',name:'Grouped-data lab',title:'Explore: the grouped-data lab',lead:'Change the frequencies of the five classes. The lab shows the class features, estimates the averages, and draws either a histogram with its frequency polygon, or a cumulative frequency curve (ogive).',

   blocks:[{type:'custom',star:true,html:'<div class="tile"><p style="margin:0 0 6px"><strong>Frequencies</strong> for marks 1–10, 11–20, 21–30, 31–40, 41–50:</p><div class="glF" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="controls"><label for="glV">Show:</label><select id="glV"><option value="h">Histogram and frequency polygon</option><option value="o">Ogive (cumulative frequency)</option></select><label for="glM">Read ogive at mark:</label><input type="range" id="glM" min="1" max="50" value="30"><output class="big glMO"></output></div><div class="scene glSvg"></div><div class="tile glOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge glN"></span> <strong class="glQ"></strong></p><div class="controls"><input type="number" step="0.01" class="glIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go glC">Check</button></div><div class="fb glFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var F=[4,7,12,9,8],V=box.querySelector('#glV'),Mk=box.querySelector('#glM');api.nudges(Mk);var wrap=box.querySelector('.glF');F.forEach(function(v,i){var e=document.createElement('input');e.type='number';e.min=0;e.value=v;e.style.width='64px';e.setAttribute('aria-label','Frequency for '+CL[i][0]+' to '+CL[i][1]);e.addEventListener('input',function(){F[i]=Math.max(0,parseInt(e.value)||0);draw()});wrap.appendChild(e)});function draw(){var T=F.reduce(function(a,b){return a+b},0),mids=CL.map(function(c){return(c[0]+c[1])/2}),fx=F.map(function(f,i){return f*mids[i]}),sfx=fx.reduce(function(a,b){return a+b},0),cf=[],acc=0;F.forEach(function(f){acc+=f;cf.push(acc)});var mi=F.indexOf(Math.max.apply(null,F)),half=T/2,medi=cf.findIndex(function(c){return c>=half}),mk=+Mk.value+0.5;box.querySelector('.glMO').textContent=(+Mk.value)+'.5';var B=[0.5,10.5,20.5,30.5,40.5,50.5],cfa=[0].concat(cf),j=1;while(j<5&&B[j]<mk)j++;var cv=cfa[j-1]+(mk-B[j-1])/(B[j]-B[j-1])*(cfa[j]-cfa[j-1]);box.querySelector('.glSvg').innerHTML=V.value==='h'?HIST(F):OGV(F,mk);box.querySelector('.glOut').innerHTML='<table class="rec" style="max-width:none"><thead><tr><th>Class</th><th>Boundaries</th><th>Midpoint x</th><th>f</th><th>fx</th><th>Cumulative f</th></tr></thead><tbody>'+CL.map(function(c,i){return'<tr'+(i===mi?' style="font-weight:700"':'')+'><td>'+c[0]+'–'+c[1]+'</td><td>'+(c[0]-0.5)+'–'+(c[1]+0.5)+'</td><td>'+mids[i]+'</td><td>'+F[i]+'</td><td>'+f2(fx[i])+'</td><td>'+cf[i]+'</td></tr>'}).join('')+'</tbody></table><p style="margin:6px 0 0">Class width = 10. Total Σf = '+T+', Σfx = '+f2(sfx)+'.<br><strong>Estimated mean</strong> = '+f2(sfx)+' ÷ '+T+' = <strong>'+(T?f2(sfx/T):'—')+'</strong> (only an estimate: we use midpoints).<br><strong>Modal class:</strong> '+CL[mi][0]+'–'+CL[mi][1]+'. <strong>Median class:</strong> '+(medi>=0?CL[medi][0]+'–'+CL[medi][1]:'—')+' (contains the '+f2(half)+'th value).<br><strong>Ogive reading:</strong> about '+f2(cv)+' students scored '+mk+' or less ('+(T?f2(cv/T*100):0)+'%).</p>'}V.onchange=draw;Mk.addEventListener('input',draw);var Q=[{t:'With the starting frequencies (4, 7, 12, 9, 8), what is the estimated mean?',a:28},{t:'What is the class width of these classes?',a:10},{t:'With the starting frequencies, how many students scored 30 or less (up to the boundary 30.5)?',a:23}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.glN').textContent='All done';box.querySelector('.glQ').textContent='You completed every challenge!';box.querySelector('.glC').disabled=true;return}box.querySelector('.glN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.glQ').textContent=Q[q].t}box.querySelector('.glC').onclick=function(){var v=parseFloat(box.querySelector('.glIn').value),fb=box.querySelector('.glFb');if(Math.abs(v-Q[q].a)<0.015){fb.className='fb ok glFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.glIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no glFb';fb.textContent='Not yet. Reset the frequencies to 4, 7, 12, 9, 8 and read the table.'}};draw();task()}},
    {type:'recall',text:'Only an estimate. In a grouped table, we do not know the exact marks inside each class, so we assume each student scored the class midpoint: Σfx ÷ Σf = 1,120 ÷ 40 = 28.'}]},
  {phase:'explain',name:'Teach: grouped tables and diagrams',title:'Learn: grouped frequency tables, class features and diagrams',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Boundaries close di gap between di class dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Grouped frequency tables',explain:'<p>When there are many different values, a frequency table with every single value would be huge. Instead, we put the data into classes, making {{grouped data|data organised into classes}}: 1–10, 11–20, 21–30, and so on. Count how many values fall into each class.</p><p>Data can be {{discrete|separate values, such as counts}} (it can only take separate values, like marks out of 50 or numbers of children) or {{continuous|any value in a range, such as height}} (it can take any value in a range, like height, mass or time). For continuous data, classes are often written like 150 ≤ h < 160, so that every value fits into exactly one class.</p><p>Choose classes of equal width that cover all the data with no gaps and no overlaps. Five to ten classes usually works well.</p>',
     example:{q:'Group these marks into the classes 1–10, 11–20, …, 41–50: 8, 15, 22, 25, 28, 33, 35, 41, 47, 3, 19, 26.',steps:[{do:'1–10: 8, 3 → 2. 11–20: 15, 19 → 2. 21–30: 22, 25, 28, 26 → 4.'},{do:'31–40: 33, 35 → 2. 41–50: 41, 47 → 2.'},{do:'Check: 2 + 2 + 4 + 2 + 2 = 12 values ✓'}]},
     mistake:'Using overlapping classes such as 10–20 and 20–30. Where would 20 go? Classes must not overlap.',
     check:{q:'Which of these is continuous data?',o:['The time to run 100 m','The number of goals scored','The number of siblings'],a:0,why:'Time can take any value.',hint:'Can it be any value in a range?'}},
    {title:'Class features: limits, boundaries, width and midpoint',explain:'<p>Each class has several features the syllabus names. The {{class limits|the smallest and largest values written for a class}} are the numbers written in the table, such as 21 and 30 for the class 21–30.</p><p>The {{class boundaries|values halfway between classes}} are halfway between one class and the next, so there are no gaps: for 21–30, the boundaries are <strong>20.5 and 30.5</strong>. The {{class width|upper boundary − lower boundary}} is upper boundary − lower boundary: 30.5 − 20.5 = <strong>10</strong>. (Not 30 − 21 = 9!)</p><p>The {{class midpoint|(lower limit + upper limit) ÷ 2}} is the middle of the class: (21 + 30) ÷ 2 = <strong>25.5</strong>. We use midpoints to stand for every value in the class when estimating the mean.</p>',
     example:{q:'For the class 45–59, find the class boundaries, width and midpoint.',steps:[{do:'Boundaries: 44.5 and 59.5.'},{do:'Width: 59.5 − 44.5 = 15.'},{do:'Midpoint: (45 + 59) ÷ 2 = 52.'}]},
     mistake:'Finding the width from the limits (30 − 21 = 9). Use the BOUNDARIES: 30.5 − 20.5 = 10.',
     check:{q:'For the class 11–20, the upper class boundary is…',o:['20.5','20','21'],a:0,why:'Halfway between 20 and 21.',hint:'Halfway to the next class.'}},
    {title:'Histograms, frequency polygons and line graphs',explain:'<p>A <strong>histogram</strong> shows grouped data with bars. The syllabus specifies bars of <strong>equal width</strong>. The bars sit on the <strong>class boundaries</strong>, so they touch with <strong>no gaps</strong> (unlike a bar chart). The height of each bar is the frequency.</p><p>A <strong>frequency polygon</strong> joins the midpoints of the tops of the bars with straight lines. It is often drawn on top of the histogram, and closed by joining to the axis at the midpoints of empty classes either side. It makes it easy to compare two sets of data on the same axes.</p><p>A <strong>line graph</strong> shows how something changes over time, such as monthly rainfall or sales, with time along the horizontal axis.</p>',visual:HIST([4,7,12,9,8],'Histogram of the marks with its frequency polygon'),
     example:{q:'How do you draw a frequency polygon for the marks table?',steps:[{do:'Plot (midpoint, frequency) for each class: (5.5, 4), (15.5, 7), (25.5, 12), (35.5, 9), (45.5, 8).'},{do:'Join the points with straight lines.'},{do:'Close it by joining to the horizontal axis at the midpoints −4.5 and 55.5.'}]},
     mistake:'Leaving gaps between histogram bars. The bars must touch, because the boundaries join the classes.',
     check:{q:'In a histogram, the bars are drawn between the…',o:['class boundaries','class midpoints','class limits only'],a:0,why:'So that there are no gaps.',hint:'They must touch.'}}]}]},
  {phase:'explain',name:'Teach: averages, ogives and inference',title:'Learn: grouped averages, the ogive and making inferences',lead:'Next, estimating averages and spread from grouped data.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Ogive: plot at di upper boundary.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Modal class, median class and the estimate of the mean',explain:'<p>With grouped data, we cannot find exact averages, but we can describe and estimate them.</p><p>The {{modal class|the class with the highest frequency}} is the class with the highest frequency. The {{median class|the class containing the middle value}} is the class that contains the middle value: find the position n/2 and use the running totals to see which class it falls in.</p><p>The <strong>estimate of the mean</strong> uses the midpoints: <strong>mean ≈ Σfx ÷ Σf</strong>, where x is each class midpoint. It is only an estimate, because we are assuming every value sits exactly at its class midpoint.</p>',
     example:{q:'For f = 4, 7, 12, 9, 8 in the classes 1–10 to 41–50, find the modal class, the median class and the estimated mean.',steps:[{do:'Modal class: 21–30 (frequency 12).'},{do:'n = 40, so the median is about the 20th value. Running totals 4, 11, 23: the 20th value is in 21–30.'},{do:'Σfx = 4(5.5) + 7(15.5) + 12(25.5) + 9(35.5) + 8(45.5) = 1,120. Mean ≈ 1,120 ÷ 40 = 28.'}]},
     mistake:'Using the class limits or boundaries in Σfx instead of the midpoints.',
     check:{q:'The class 31–40 has midpoint…',o:['35.5','35','40'],a:0,why:'(31 + 40) ÷ 2.',hint:'Add the limits and halve.'}},
    {title:'The cumulative frequency curve (ogive)',explain:'<p>The {{cumulative frequency|a running total of the frequencies}} is a running total of the frequencies: it tells you how many values are less than or equal to each upper boundary. For f = 4, 7, 12, 9, 8, the cumulative frequencies are 4, 11, 23, 32, 40.</p><p>To draw an {{ogive|a cumulative frequency curve}}: plot each cumulative frequency against its <strong>upper class boundary</strong> (the syllabus says “class boundaries as domain”), starting from zero at the first lower boundary. Join the points with a smooth curve (or straight lines), using sensible scales.</p><p>Then read from it: the <strong>median</strong> is at n/2 on the vertical axis; <strong>Q1</strong> at n/4; <strong>Q3</strong> at 3n/4. Go across to the curve, then down to read the value. IQR = Q3 − Q1, and the semi-IQR is half of that. To find how many values are below a mark, go up from that mark to the curve, then across.</p>',visual:OGV([4,7,12,9,8],30.5,'Ogive of the marks, read at 30.5'),
     example:{q:'From the ogive of 40 students, what percentage scored more than 30?',steps:[{do:'Go up from 30.5 to the curve, then across: 23 students scored 30 or less.'},{do:'So 40 − 23 = 17 students scored more than 30.'},{do:'17 ÷ 40 × 100 = 42.5%.'}]},
     mistake:'Plotting cumulative frequencies at the midpoints. On an ogive, plot at the UPPER CLASS BOUNDARIES.',
     check:{q:'For 80 students, the median is read at what cumulative frequency?',o:['40','20','60'],a:0,why:'n/2 = 40.',hint:'Half of n.'}},
    {title:'Comparing data sets and making inferences',explain:'<p>To compare two groups, always compare an <strong>average</strong> AND a <strong>measure of spread</strong>, in context. For example: “Class A has a higher median (32 compared with 27), so it did better on average; Class B has a smaller interquartile range, so its marks are more consistent.”</p><p>As in Statistics 1, you will not calculate the standard deviation, but you must use it: a smaller standard deviation means the data is more consistent.</p><p>When you make an inference, remember the limits: grouped data and ogives only give <strong>estimates</strong>, and a small or biased sample may not represent the whole population.</p>',
     example:{q:'Two schools: School X has median 45 and IQR 20; School Y has median 50 and IQR 8. Compare them.',steps:[{do:'Average: School Y has the higher median, so typically it did better.'},{do:'Spread: School Y has the smaller IQR, so its results are more consistent.'},{do:'Inference: School Y performed better and more consistently (based on these estimates).'}]},
     mistake:'Comparing only the averages. A full comparison includes the spread too.',
     check:{q:'Group A: SD 4; Group B: SD 11 (same mean). Which is more consistent?',o:['Group A','Group B','They are the same'],a:0,why:'A smaller standard deviation means less spread.',hint:'Smaller SD.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
