var HFB={A:'Not this one. Gaps between the bars suggest that times like 11.95 s do not exist. But time is continuous: every value between the classes is possible. The bars must touch.',B:'Not this one. A pie chart shows each class’s share, but it loses the ORDER of the times, from fastest to slowest. For grouped continuous data, we need the classes in order along an axis.',C:'Yes! A histogram: the classes sit in order along the time axis, and the bars touch, because time is continuous. Each bar’s height shows how many athletes ran a time in that class.'};
var TB=[10.95,11.95,12.95,13.95,14.95,15.95],TCF=[0,4,14,32,44,50];
var CFAT=function(t){for(var i=1;i<TB.length;i++)if(t<=TB[i])return TCF[i-1]+(t-TB[i-1])/(TB[i]-TB[i-1])*(TCF[i]-TCF[i-1]);return 50};
var OGR=function(t){var X=function(x){return 50+(x-10.95)/5*430},Y=function(c){return 220-c/50*190},s='<svg viewBox="0 0 520 268" role="img" aria-label="Ogive of 100 metre trial times with a reading line"><rect width="520" height="268" fill="#faf8fe"/>';TB.forEach(function(b){s+='<line x1="'+X(b)+'" y1="'+Y(0)+'" x2="'+X(b)+'" y2="'+Y(50)+'" stroke="#eee8f8"/><text x="'+X(b)+'" y="'+(Y(0)+14)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+b+'</text>'});[0,12.5,25,37.5,50].forEach(function(c){s+='<line x1="'+X(10.95)+'" y1="'+Y(c)+'" x2="'+X(15.95)+'" y2="'+Y(c)+'" stroke="#eee8f8"/><text x="'+(X(10.95)-5)+'" y="'+(Y(c)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">'+c+'</text>'});s+='<line x1="'+X(10.95)+'" y1="'+Y(0)+'" x2="'+X(15.95)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(10.95)+'" y1="'+Y(0)+'" x2="'+X(10.95)+'" y2="'+Y(50)+'" stroke="#3d2a73" stroke-width="2"/><polyline points="'+TB.map(function(b,i){return X(b)+','+Y(TCF[i])}).join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/>';TB.forEach(function(b,i){s+='<circle cx="'+X(b)+'" cy="'+Y(TCF[i])+'" r="4" fill="#2f5fc4"/>'});var c=CFAT(t);s+='<line x1="'+X(t)+'" y1="'+Y(0)+'" x2="'+X(t)+'" y2="'+Y(c)+'" stroke="#c02d5f" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="'+X(t)+'" y1="'+Y(c)+'" x2="'+X(10.95)+'" y2="'+Y(c)+'" stroke="#c02d5f" stroke-width="2.5" stroke-dasharray="6 4"/>';return s+'<text x="'+X(15.95)+'" y="'+(Y(0)+30)+'" font-size="11" text-anchor="end" fill="#3d2a73">time (seconds, upper class boundaries)</text><text x="14" y="'+(Y(25))+'" font-size="11" fill="#3d2a73" transform="rotate(-90 14 '+Y(25)+')" text-anchor="middle">cumulative frequency</text></svg>'};
var STORY_H=STORYBLOCK({story:'"At 100 m trials in St. Catherine, 50 athletes are timed. Their times are grouped: 11.0–11.9 s: 4 athletes; 12.0–12.9 s: 10; 13.0–13.9 s: 18; 14.0–14.9 s: 12; 15.0–15.9 s: 6." Which diagram should the coach draw to show these grouped times?',sk:HSK,fb:HFB,correct:'C',p2title:'Read the ogive.',p2lead:'The coach wants the fastest 25% of the 50 athletes (that is, 12.5 athletes, so the first 12 or 13). Move the red line along the time axis. The ogive shows how many athletes ran that time or faster.',p2html:'<div class="controls"><label for="ogT">Time (s):</label><input type="range" id="ogT" min="11" max="15.9" step="0.05" value="14"><output class="big ogTO"></output></div><div class="scene ogSvg"></div><div class="tile ogOut" aria-live="polite"></div>',goal:'find the qualifying time for the fastest 25% (a cumulative frequency of 12.5)',done:'About 12.8 s: athletes running 12.8 s or faster are in the fastest 25%. That time is the lower quartile, Q1, read from the ogive at n ÷ 4 = 12.5.',

 glossary:[['Grouped data','Data organised into classes (intervals), such as 21–30.'],['Discrete data','Data that can only take separate values, such as numbers of people.'],['Continuous data','Data that can take any value in a range, such as height or time.'],['Class limits','The smallest and largest values written for a class, such as 21 and 30.'],['Class boundaries','The values halfway between classes, such as 20.5 and 30.5.'],['Class width','Upper boundary − lower boundary.'],['Class midpoint','(lower limit + upper limit) ÷ 2.'],['Modal class','The class with the highest frequency.'],['Median class','The class containing the middle value.'],['Cumulative frequency','A running total of the frequencies.'],['Ogive','A cumulative frequency curve.']],

     init:function(box,api){var F=[4,7,12,9,8],V=box.querySelector('#glV'),Mk=box.querySelector('#glM');api.nudges(Mk);var wrap=box.querySelector('.glF');F.forEach(function(v,i){var e=document.createElement('input');e.type='number';e.min=0;e.value=v;e.style.width='64px';e.setAttribute('aria-label','Frequency for '+CL[i][0]+' to '+CL[i][1]);e.addEventListener('input',function(){F[i]=Math.max(0,parseInt(e.value)||0);draw()});wrap.appendChild(e)});function draw(){var T=F.reduce(function(a,b){return a+b},0),mids=CL.map(function(c){return(c[0]+c[1])/2}),fx=F.map(function(f,i){return f*mids[i]}),sfx=fx.reduce(function(a,b){return a+b},0),cf=[],acc=0;F.forEach(function(f){acc+=f;cf.push(acc)});var mi=F.indexOf(Math.max.apply(null,F)),half=T/2,medi=cf.findIndex(function(c){return c>=half}),mk=+Mk.value+0.5;box.querySelector('.glMO').textContent=(+Mk.value)+'.5';var B=[0.5,10.5,20.5,30.5,40.5,50.5],cfa=[0].concat(cf),j=1;while(j<5&&B[j]<mk)j++;var cv=cfa[j-1]+(mk-B[j-1])/(B[j]-B[j-1])*(cfa[j]-cfa[j-1]);box.querySelector('.glSvg').innerHTML=V.value==='h'?HIST(F):OGV(F,mk);box.querySelector('.glOut').innerHTML='<table class="rec" style="max-width:none"><thead><tr><th>Class</th><th>Boundaries</th><th>Midpoint x</th><th>f</th><th>fx</th><th>Cumulative f</th></tr></thead><tbody>'+CL.map(function(c,i){return'<tr'+(i===mi?' style="font-weight:700"':'')+'><td>'+c[0]+'–'+c[1]+'</td><td>'+(c[0]-0.5)+'–'+(c[1]+0.5)+'</td><td>'+mids[i]+'</td><td>'+F[i]+'</td><td>'+f2(fx[i])+'</td><td>'+cf[i]+'</td></tr>'}).join('')+'</tbody></table><p style="margin:6px 0 0">Class width = 10. Total Σf = '+T+', Σfx = '+f2(sfx)+'.<br><strong>Estimated mean</strong> = '+f2(sfx)+' ÷ '+T+' = <strong>'+(T?f2(sfx/T):'—')+'</strong> (only an estimate: we use midpoints).<br><strong>Modal class:</strong> '+CL[mi][0]+'–'+CL[mi][1]+'. <strong>Median class:</strong> '+(medi>=0?CL[medi][0]+'–'+CL[medi][1]:'—')+' (contains the '+f2(half)+'th value).<br><strong>Ogive reading:</strong> about '+f2(cv)+' students scored '+mk+' or less ('+(T?f2(cv/T*100):0)+'%).</p>'}V.onchange=draw;Mk.addEventListener('input',draw);var Q=[{t:'With the starting frequencies (4, 7, 12, 9, 8), what is the estimated mean?',a:28},{t:'What is the class width of these classes?',a:10},{t:'With the starting frequencies, how many students scored 30 or less (up to the boundary 30.5)?',a:23}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.glN').textContent='All done';box.querySelector('.glQ').textContent='You completed every challenge!';box.querySelector('.glC').disabled=true;return}box.querySelector('.glN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.glQ').textContent=Q[q].t}box.querySelector('.glC').onclick=function(){var v=parseFloat(box.querySelector('.glIn').value),fb=box.querySelector('.glFb');if(Math.abs(v-Q[q].a)<0.015){fb.className='fb ok glFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.glIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no glFb';fb.textContent='Not yet. Reset the frequencies to 4, 7, 12, 9, 8 and read the table.'}};draw();task()}},
    {type:'recall',text:'Only an estimate. In a grouped table, we do not know the exact marks inside each class, so we assume each student scored the class midpoint: Σfx ÷ Σf = 1,120 ÷ 40 = 28.'}]},
  {phase:'explain',name:'Teach: grouped tables and diagrams',title:'Learn: grouped frequency tables, class features and diagrams',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Boundaries close di gap between di class dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Grouped frequency tables',explain:PIC('A mango farmer in St. Mary weighs 50 East Indian mangoes. Every mango has a different mass: 187 g, 203 g, 251 g… Listing 50 different values would tell her nothing. So she sorts them into crates: 150–199 g, 200–249 g, 250–299 g, 300–349 g, and counts how many land in each crate. That is a grouped frequency table.',SCN['Grouped frequency tables'])+'<p>When there are many different values, a frequency table with every single value would be huge. Instead, we put the data into classes, making {{grouped data|data organised into classes}}: 1–10, 11–20, 21–30, and so on. Count how many values fall into each class.</p><p>Data can be {{discrete|separate values, such as counts}} (it can only take separate values, like marks out of 50 or numbers of children) or {{continuous|any value in a range, such as height}} (it can take any value in a range, like height, mass or time). For continuous data, classes are often written like 150 ≤ h < 160, so that every value fits into exactly one class.</p><p>Choose classes of equal width that cover all the data with no gaps and no overlaps. Five to ten classes usually works well.</p>'+WHY('Why group the data? With many different values, each value appears only once or twice, so no pattern shows. Grouping into classes shows the shape of the data at a glance: where most values lie, and how spread out they are. The price is that we lose the exact values inside each class.')+WORK('<strong>Farmers and exporters</strong> grade produce by mass. <strong>Health workers</strong> group patients by age band. <strong>Schools</strong> group exam marks into grade bands. <strong>STATIN</strong> groups households by income band in its surveys.'),
     example:{q:'Group these marks into the classes 1–10, 11–20, …, 41–50: 8, 15, 22, 25, 28, 33, 35, 41, 47, 3, 19, 26.',steps:[{do:'1–10: 8, 3 → 2. 11–20: 15, 19 → 2. 21–30: 22, 25, 28, 26 → 4.'},{do:'31–40: 33, 35 → 2. 41–50: 41, 47 → 2.'},{do:'Check: 2 + 2 + 4 + 2 + 2 = 12 values ✓'}]},
     mistake:'Using overlapping classes such as 10–20 and 20–30. Where would 20 go? Classes must not overlap.',
     check:{q:'Which of these is continuous data?',o:['The time to run 100 m','The number of goals scored','The number of siblings'],a:0,why:'Time can take any value.',hint:'Can it be any value in a range?'}},
    {title:'Class features: limits, boundaries, width and midpoint',explain:PIC('A nurse measures heights to the nearest centimetre. A student recorded as 30 cm taller than a table could really be anywhere from 29.5 cm to 30.5 cm taller, because the measurement was rounded. That is why a class written as 21–30 really runs from 20.5 to 30.5: its class boundaries.',SCN['Class features: limits, boundaries, width and midpoint'])+'<p>Each class has several features the syllabus names. The {{class limits|the smallest and largest values written for a class}} are the numbers written in the table, such as 21 and 30 for the class 21–30.</p><p>The {{class boundaries|values halfway between classes}} are halfway between one class and the next, so there are no gaps: for 21–30, the boundaries are <strong>20.5 and 30.5</strong>. The {{class width|upper boundary − lower boundary}} is upper boundary − lower boundary: 30.5 − 20.5 = <strong>10</strong>. (Not 30 − 21 = 9!)</p><p>The {{class midpoint|(lower limit + upper limit) ÷ 2}} is the middle of the class: (21 + 30) ÷ 2 = <strong>25.5</strong>. We use midpoints to stand for every value in the class when estimating the mean.</p>'+WHY('Why are boundaries halfway between the classes? The class 11–20 and the class 21–30 must meet with no gap and no overlap, so that every possible value belongs to exactly one class. Halfway, at 20.5, is the only fair place for the two classes to meet. And the width is measured between the boundaries (30.5 − 20.5 = 10), because that is the real space the class covers.')+WORK('<strong>Laboratory technicians and nurses</strong> record measurements to a stated accuracy. <strong>Engineers</strong> set tolerances: a bolt sold as 10 mm might really be 9.95 mm to 10.05 mm. <strong>Statisticians</strong> choose class widths when they design survey tables.'),
     example:{q:'For the class 45–59, find the class boundaries, width and midpoint.',steps:[{do:'Boundaries: 44.5 and 59.5.'},{do:'Width: 59.5 − 44.5 = 15.'},{do:'Midpoint: (45 + 59) ÷ 2 = 52.'}]},
     mistake:'Finding the width from the limits (30 − 21 = 9). Use the BOUNDARIES: 30.5 − 20.5 = 10.',
     check:{q:'For the class 11–20, the upper class boundary is…',o:['20.5','20','21'],a:0,why:'Halfway between 20 and 21.',hint:'Halfway to the next class.'}},
    {title:'Histograms, frequency polygons and line graphs',explain:PIC('The coach at the 100 m trials draws the grouped times as a histogram: the classes in order along the time axis, with bars that touch. Joining the midpoints of the bar tops gives a frequency polygon, which lets her compare this year’s trials with last year’s on the same axes.',SCN['Histograms, frequency polygons and line graphs'])+'<p>A <strong>histogram</strong> shows grouped data with bars. The syllabus specifies bars of <strong>equal width</strong>. The bars sit on the <strong>class boundaries</strong>, so they touch with <strong>no gaps</strong> (unlike a bar chart). The height of each bar is the frequency.</p><p>A <strong>frequency polygon</strong> joins the midpoints of the tops of the bars with straight lines. It is often drawn on top of the histogram, and closed by joining to the axis at the midpoints of empty classes either side. It makes it easy to compare two sets of data on the same axes.</p><p>A <strong>line graph</strong> shows how something changes over time, such as monthly rainfall or sales, with time along the horizontal axis.</p>'+WHY('Why must histogram bars touch? Time is continuous: between 11.9 s and 12.0 s there are times like 11.95 s. Each class runs from boundary to boundary, so the bars sit edge to edge, leaving no gap where no value could fall. A bar chart for separate categories (such as favourite sports) has gaps, because there is nothing between "cricket" and "football".')+WORK('<strong>Sports scientists</strong> chart athletes’ performances. <strong>Meteorologists</strong> draw rainfall histograms and line graphs of temperature over time. <strong>Hospital managers</strong> chart patients’ ages to plan wards.'),visual:HIST([4,7,12,9,8],'Histogram of the marks with its frequency polygon'),
     example:{q:'How do you draw a frequency polygon for the marks table?',steps:[{do:'Plot (midpoint, frequency) for each class: (5.5, 4), (15.5, 7), (25.5, 12), (35.5, 9), (45.5, 8).'},{do:'Join the points with straight lines.'},{do:'Close it by joining to the horizontal axis at the midpoints −4.5 and 55.5.'}]},
     mistake:'Leaving gaps between histogram bars. The bars must touch, because the boundaries join the classes.',
     check:{q:'In a histogram, the bars are drawn between the…',o:['class boundaries','class midpoints','class limits only'],a:0,why:'So that there are no gaps.',hint:'They must touch.'}}]}]},
  {phase:'explain',name:'Teach: averages, ogives and inference',title:'Learn: grouped averages, the ogive and making inferences',lead:'Next, estimating averages and spread from grouped data.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Ogive: plot at di upper boundary.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Modal class, median class and the estimate of the mean',explain:PIC('A teacher in Mandeville only has the class results in groups: 4 students scored 1–10, 7 scored 11–20, and so on. She does not know any single exact mark. To estimate the mean, she imagines every student in a class scoring the middle mark of that class, the midpoint.',SCN['Modal class, median class and the estimate of the mean'])+'<p>With grouped data, we cannot find exact averages, but we can describe and estimate them.</p><p>The {{modal class|the class with the highest frequency}} is the class with the highest frequency. The {{median class|the class containing the middle value}} is the class that contains the middle value: find the position n/2 and use the running totals to see which class it falls in.</p><p>The <strong>estimate of the mean</strong> uses the midpoints: <strong>mean ≈ Σfx ÷ Σf</strong>, where x is each class midpoint. It is only an estimate, because we are assuming every value sits exactly at its class midpoint.</p>'+WHY('Why is the mean only an estimate? Inside each class, some students scored above the midpoint and some below. Using the midpoint assumes they balance out, which is usually close, but not exact. That is why the answer is called an ESTIMATE of the mean.')+WORK('<strong>Exam boards and schools</strong> summarise grouped results. <strong>Insurance companies</strong> estimate average claims from grouped data. <strong>Economists</strong> estimate average income from income bands.'),
     example:{q:'For f = 4, 7, 12, 9, 8 in the classes 1–10 to 41–50, find the modal class, the median class and the estimated mean.',steps:[{do:'Modal class: 21–30 (frequency 12).'},{do:'n = 40, so the median is about the 20th value. Running totals 4, 11, 23: the 20th value is in 21–30.'},{do:'Σfx = 4(5.5) + 7(15.5) + 12(25.5) + 9(35.5) + 8(45.5) = 1,120. Mean ≈ 1,120 ÷ 40 = 28.'}]},
     mistake:'Using the class limits or boundaries in Σfx instead of the midpoints.',
     check:{q:'The class 31–40 has midpoint…',o:['35.5','35','40'],a:0,why:'(31 + 40) ÷ 2.',hint:'Add the limits and halve.'}},
    {title:'The cumulative frequency curve (ogive)',explain:PIC('The coach wants the fastest quarter of 50 athletes for the squad. A running total of how many athletes ran each time or faster, plotted as a curve, answers this directly: go up the cumulative frequency axis to 12.5 (a quarter of 50), across to the curve, and down to read the qualifying time, about 12.8 seconds.',SCN['The cumulative frequency curve (ogive)'])+'<p>The {{cumulative frequency|a running total of the frequencies}} is a running total of the frequencies: it tells you how many values are less than or equal to each upper boundary. For f = 4, 7, 12, 9, 8, the cumulative frequencies are 4, 11, 23, 32, 40.</p><p>To draw an {{ogive|a cumulative frequency curve}}: plot each cumulative frequency against its <strong>upper class boundary</strong> (the syllabus says “class boundaries as domain”), starting from zero at the first lower boundary. Join the points with a smooth curve (or straight lines), using sensible scales.</p><p>Then read from it: the <strong>median</strong> is at n/2 on the vertical axis; <strong>Q1</strong> at n/4; <strong>Q3</strong> at 3n/4. Go across to the curve, then down to read the value. IQR = Q3 − Q1, and the semi-IQR is half of that. To find how many values are below a mark, go up from that mark to the curve, then across.</p>'+WHY('Why plot at the UPPER class boundary? A cumulative frequency counts all the values UP TO a point. The 4 athletes in the class 11.0–11.9 s all ran 11.95 s or faster, so their total belongs at 11.95, the end of that class, not at its middle.')+WORK('<strong>Selectors</strong> set qualifying standards from ogives. <strong>Exam boards</strong> decide how many candidates achieve each grade. <strong>Doctors</strong> use percentile curves (a kind of ogive) to check whether a baby’s weight is healthy for its age.'),visual:OGV([4,7,12,9,8],30.5,'Ogive of the marks, read at 30.5'),
     example:{q:'From the ogive of 40 students, what percentage scored more than 30?',steps:[{do:'Go up from 30.5 to the curve, then across: 23 students scored 30 or less.'},{do:'So 40 − 23 = 17 students scored more than 30.'},{do:'17 ÷ 40 × 100 = 42.5%.'}]},
     mistake:'Plotting cumulative frequencies at the midpoints. On an ogive, plot at the UPPER CLASS BOUNDARIES.',
     check:{q:'For 80 students, the median is read at what cumulative frequency?',o:['40','20','60'],a:0,why:'n/2 = 40.',hint:'Half of n.'}},
    {title:'Comparing data sets and making inferences',explain:PIC('Two schools sit the same mock exam. At School X, the median mark is 45, with an interquartile range of 20. At School Y, the median is 50, with an IQR of only 8. School Y did better on average, AND its students’ marks were much closer together.',SCN['Comparing data sets and making inferences'])+'<p>To compare two groups, always compare an <strong>average</strong> AND a <strong>measure of spread</strong>, in context. For example: “Class A has a higher median (32 compared with 27), so it did better on average; Class B has a smaller interquartile range, so its marks are more consistent.”</p><p>As in Statistics 1, you will not calculate the standard deviation, but you must use it: a smaller standard deviation means the data is more consistent.</p><p>When you make an inference, remember the limits: grouped data and ogives only give <strong>estimates</strong>, and a small or biased sample may not represent the whole population.</p>'+WHY('Why compare BOTH an average and a spread? Two groups can have the same average but very different spreads, or the same spread but different averages. The average says where the middle is; the spread says how reliable that middle is. Together, they give a fair comparison.')+WORK('<strong>Education officers</strong> compare schools’ results. <strong>Medical researchers</strong> compare a new treatment with an old one. <strong>Managers</strong> compare two production lines for both output and consistency.'),
     example:{q:'Two schools: School X has median 45 and IQR 20; School Y has median 50 and IQR 8. Compare them.',steps:[{do:'Average: School Y has the higher median, so typically it did better.'},{do:'Spread: School Y has the smaller IQR, so its results are more consistent.'},{do:'Inference: School Y performed better and more consistently (based on these estimates).'}]},
     mistake:'Comparing only the averages. A full comparison includes the spread too.',
     check:{q:'Group A: SD 4; Group B: SD 11 (same mean). Which is more consistent?',o:['Group A','Group B','They are the same'],a:0,why:'A smaller standard deviation means less spread.',hint:'Smaller SD.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

   blocks:[{type:'facts',facts:[{title:'Class features',text:'Limits: as written. Boundaries: halfway between classes. Width = upper − lower boundary. Midpoint = (limits) ÷ 2.'},{title:'Diagrams',text:'Histogram: equal-width bars on the boundaries, no gaps. Frequency polygon: join the midpoints of the bar tops.'},{title:'Averages',text:'Modal class = highest frequency. Median class contains the (n/2)th value. Mean ≈ Σfx ÷ Σf with midpoints.'},{title:'Ogive',text:'Plot cumulative frequency at upper boundaries. Median at n/2, Q1 at n/4, Q3 at 3n/4. Semi-IQR = (Q3 − Q1) ÷ 2.'}]},

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, grouped data decides which mangoes are exported, whether a clinic meets its target, whether a discount scheme is affordable, and which class needs extra help. Choose a job, read the grouped data, and make the decision.',
   mission:['Choose a job card.','Find the class midpoints or cumulative frequencies first, where you need them.','Complete any 3 jobs for a star. Complete all 4 to become a Maths at Work Champion.'],

   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'🥭',title:'The mango exporter: export grade',desc:'Decide whether a batch meets an export order.',level:'⭐⭐ Agriculture',mins:7,block:{type:'mission',story:'A mango exporter in St. Mary weighs 50 mangoes: 150–199 g: 8; 200–249 g: 15; 250–299 g: 20; 300–349 g: 7. Export grade means at least 250 g. A buyer will take the batch only if at least half the mangoes are export grade.',parts:[{q:'What is the lower class limit of the modal class? (g)',a:250,hint:'The class with the highest frequency.',sol:'250–299 g (20 mangoes).',placeholder:'g'},{q:'Estimate the mean mass, to 1 decimal place. (Midpoints 174.5, 224.5, 274.5, 324.5.) (g)',a:250.5,tol:0.05,hint:'Σfx = 1,396 + 3,367.5 + 5,490 + 2,271.5 = 12,525. Divide by 50.',sol:'12,525 ÷ 50 = 250.5 g.',placeholder:'g'},{q:'How many mangoes are export grade (250 g or more)?',a:27,hint:'20 + 7.',sol:'27.'},{q:'What percentage is that?',a:54,hint:'27 ÷ 50 × 100.',sol:'54%.',placeholder:'%'},{q:'Will the buyer take the batch? (Type yes or no.)',a:['yes'],hint:'Is 54% at least half?',sol:'Yes: 54% is more than half.'}],done:'Grouping 50 mangoes into four classes was enough to make a business decision.'}},
    {icon:'🏥',title:'The clinic manager: grouped waiting times',desc:'Check a clinic against its waiting-time target.',level:'⭐⭐⭐ Health',mins:7,block:{type:'mission',story:'A clinic recorded the waiting times of 50 patients (minutes): 0–9: 12; 10–19: 18; 20–29: 10; 30–39: 6; 40–49: 4. The health board’s target: no more than 15% of patients wait 30 minutes or more.',parts:[{q:'What are the cumulative frequencies? Type the third one.',a:40,hint:'12, 30, ?',sol:'12, 30, 40, 46, 50.'},{q:'Which class contains the median? Type its lower limit.',a:10,hint:'The median is about the 25th value.',sol:'10–19 minutes.'},{q:'Estimate the mean waiting time, to 1 decimal place. (minutes)',a:18.9,tol:0.05,hint:'Midpoints 4.5, 14.5, 24.5, 34.5, 44.5: Σfx = 945.',sol:'945 ÷ 50 = 18.9 minutes.',placeholder:'minutes'},{q:'What percentage of patients waited 30 minutes or more?',a:20,hint:'(6 + 4) ÷ 50 × 100.',sol:'20%.',placeholder:'%'},{q:'Is the clinic meeting the target? (Type yes or no.)',a:['no'],hint:'Compare 20% with 15%.',sol:'No: 20% is more than 15%. The manager needs to reduce long waits.'}],done:'The grouped table showed that the clinic is missing its target, by how much, and where the problem lies.'}},
    {icon:'💡',title:'The utility planner: an electricity discount',desc:'Check whether a discount scheme fits the budget.',level:'⭐⭐ Energy',mins:6,block:{type:'mission',story:'An electricity company surveys 50 households’ monthly use (kWh): 0–99: 5; 100–199: 14; 200–299: 16; 300–399: 10; 400–499: 5. It plans a discount for households using under 200 kWh, and has budgeted for up to 40% of households to qualify.',parts:[{q:'How many households in the survey use under 200 kWh?',a:19,hint:'5 + 14.',sol:'19.'},{q:'What percentage is that?',a:38,hint:'19 ÷ 50 × 100.',sol:'38%.',placeholder:'%'},{q:'What is the upper class boundary of the class 100–199 (whole kWh)?',a:199.5,tol:0.001,hint:'Halfway between 199 and 200.',sol:'199.5 kWh.'},{q:'Estimate the mean monthly use, to 1 decimal place. (kWh)',a:241.5,tol:0.05,hint:'Midpoints 49.5, 149.5, 249.5, 349.5, 449.5: Σfx = 12,075.',sol:'12,075 ÷ 50 = 241.5 kWh.',placeholder:'kWh'},{q:'Is the budget (40%) enough for the discount? (Type yes or no.)',a:['yes'],hint:'Compare 38% with 40%.',sol:'Yes, just: 38% is below 40%, but only by 2%. The planner might allow a small margin.'}],done:'A survey of 50 homes let the company estimate the cost of a scheme for the whole island.'}},
    {icon:'📚',title:'The head of department: which class needs help?',desc:'Compare two classes using the mean and standard deviation.',level:'⭐⭐ Education',mins:5,block:{type:'mission',story:'Two Grade 10 classes sat the same mathematics test. Class P: mean 62, standard deviation 8. Class Q: mean 62, standard deviation 15. The head of department has one extra tutor for students who are struggling.',parts:[{q:'Which class did better on average? (Type P, Q or same.)',a:['same'],hint:'Compare the means.',sol:'The same: both have a mean of 62.'},{q:'Which class’s marks are more consistent? (Type P or Q.)',a:['p'],hint:'The smaller standard deviation.',sol:'Class P.'},{q:'Which class is likely to have more students with very low marks? (Type P or Q.)',a:['q'],hint:'More spread means more marks far from the mean.',sol:'Class Q: its marks are more spread out, so more fall far below 62.'},{q:'Which class should the extra tutor work with? (Type P or Q.)',a:['q'],hint:'Where are the struggling students more likely to be?',sol:'Class Q.'}],done:'The averages were identical. The standard deviation showed where help was needed.'}}
   ]}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The mean from a grouped table is exact.',a:'never',why:'It is an estimate based on midpoints.'},{s:'Histogram bars touch each other.',a:'always',why:'They are drawn on the class boundaries.'},{s:'The modal class contains the median.',a:'sometimes',why:'It did here, but not in every data set.'},{s:'An ogive always rises (or stays level) from left to right.',a:'always',why:'Cumulative totals never decrease.'},{s:'Class width = upper limit − lower limit.',a:'never',why:'Use the boundaries: upper boundary − lower boundary.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Width of the class 21–30.',lines:['30 − 21 = 9'],wrong:0,reasons:['Use the boundaries: 30.5 − 20.5 = 10','The width is 30','The width is 25.5'],reason:0,fix:'10.'},{who:'Tia',q:'Drawing an ogive.',lines:['Plot cumulative frequency at each class midpoint'],wrong:0,reasons:['Plot at the UPPER CLASS BOUNDARIES','Plot frequency, not cumulative frequency','Plot at the lower limits'],reason:0,fix:'Plot at the upper class boundaries.'},{who:'Andre',q:'Estimate the mean: classes 0–9, 10–19 with f = 2, 3.',lines:['Σfx = 2(9) + 3(19) = 75','Mean ≈ 75 ÷ 5 = 15'],wrong:0,reasons:['He used upper limits; use midpoints: 2(4.5) + 3(14.5) = 52.5, mean ≈ 10.5','He should divide by 2','The mean is 9'],reason:0,fix:'≈ 10.5.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire grouped data.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},w=[5,10,20][R(0,2)],lo=R(1,8)*w+1,hi=lo+w-1,r=R(0,2);if(r===0)return{q:'Midpoint of the class '+lo+'–'+hi+'?',o:[f2((lo+hi)/2),f2(lo+w/2+1),f2(hi)],a:0,why:'('+lo+' + '+hi+') ÷ 2.'};if(r===1)return{q:'Upper class boundary of '+lo+'–'+hi+'?',o:[f2(hi+0.5),String(hi),f2(hi+1)],a:0,why:'Halfway to the next class.'};var n=R(2,10)*8;return{q:'Ogive for '+n+' values: read Q3 at what cumulative frequency?',o:[String(3*n/4),String(n/2),String(n/4)],a:0,why:'3n/4.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent grouped data that fits each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Give 5 frequencies (for the classes 1–10 to 41–50) so that the modal class is 41–50.',placeholder:'f1, f2, f3, f4, f5',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==5||n.some(isNaN))return{ok:false,msg:'Type five numbers.'};var m=Math.max.apply(null,n);return n[4]===m&&n.filter(function(x){return x===m}).length===1?{ok:true,msg:'Yes! 41–50 has the highest frequency.'}:{ok:false,msg:'Make the last frequency the largest (and unique).'}}},{q:'A class has boundaries 59.5 and 69.5. What are its class limits? (Type lower, upper.)',placeholder:'lower, upper',check:function(v){var n=String(v).split(',').map(Number);return n.length===2&&n[0]===60&&n[1]===69?{ok:true,msg:'Correct! 60–69.'}:{ok:false,msg:'Move 0.5 inside each boundary.'}}},{q:'Classes 0–9 and 10–19 with f = 5 and 5. Estimate the mean.',placeholder:'mean',check:function(v){return parseFloat(v)===9.5?{ok:true,msg:'Yes! (5 × 4.5 + 5 × 14.5) ÷ 10 = 9.5.'}:{ok:false,msg:'Use the midpoints 4.5 and 14.5.'}}}]}},
    {icon:'🏃🏾',title:'Mission: the 100 m trials',desc:'Analyse 100 m trial times for a school track team.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A school in St. Catherine holds 100 m trials. Times (seconds) for 50 athletes: 11.0–11.9: 4; 12.0–12.9: 10; 13.0–13.9: 18; 14.0–14.9: 12; 15.0–15.9: 6.',parts:[{q:'What is the modal class? Type its lower limit.',a:13,tol:0.001,hint:'Highest frequency: 18.',sol:'13.0–13.9.'},{q:'What is the midpoint of the class 13.0–13.9? (Use boundaries 12.95 and 13.95.)',a:13.45,tol:0.001,hint:'(12.95 + 13.95) ÷ 2.',sol:'13.45 s.'},{q:'Estimate the mean time. (Midpoints 11.45, 12.45, 13.45, 14.45, 15.45.) (2 d.p.)',a:13.57,tol:0.01,hint:'Σfx ÷ 50 = 678.5 ÷ 50.',sol:'Σfx = 45.8 + 124.5 + 242.1 + 173.4 + 92.7 = 678.5, so mean ≈ 13.57 s.',placeholder:'seconds'},{q:'What are the cumulative frequencies? Type the third one.',a:32,hint:'4, 14, ?',sol:'4, 14, 32, 44, 50.'},{q:'The coach picks athletes faster than 13.0 s (13.0 s is the boundary 12.95). What percentage is that?',a:28,tol:0.01,hint:'14 of 50.',sol:'14 ÷ 50 × 100 = 28%.',placeholder:'%'}],done:'You used class features, the estimated mean, cumulative frequency and percentages on real trial data.'}}
