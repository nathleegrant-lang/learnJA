B:SKW('Sketch B: a 20 by 30 photo: both sides doubled, the same shape',PH(20,30,8,80)+SC.t(18,74,'10×15','#3d2a73',8,'middle')+PH(40,60,60,40)+SC.t(80,34,'20×30','#155c35',9,'middle',1)+SC.t(85,124,'double BOTH sides','#5d5478',8,'middle')),
C:SKW('Sketch C: a 20 by 15 photo, with only the width doubled',PH(20,30,8,80)+SC.t(18,74,'10×15','#3d2a73',8,'middle')+PH(40,30,60,80)+SC.t(80,74,'20×15','#8f1f2b',9,'middle',1)+SC.t(85,124,'double the width only?','#5d5478',8,'middle'))};
var EFB={A:'Not this one. Adding the same amount to each side changes the SHAPE: 10 × 15 becomes 15 × 20, which is squarer. In an enlargement, every length is MULTIPLIED by the same scale factor.',B:'Yes! Both sides are multiplied by 2: 10 × 15 becomes 20 × 30. The picture is the same shape, just bigger: the two photos are similar, with scale factor 2.',C:'Not this one. Doubling only the width stretches the picture sideways: everyone in it would look short and wide. Both lengths must be multiplied by the same scale factor.'};
var ENL=function(k){var s='<svg viewBox="0 0 520 250" role="img" aria-label="A 10 by 15 centimetre photo and its enlargement by scale factor '+k+'"><rect width="520" height="250" fill="#faf8fe"/>',u=4.4;s+=PH(10*u,15*u,20,240-15*u)+SC.t(20+5*u,232-15*u,'10 × 15 cm','#3d2a73',11,'middle',1)+PH(10*u*k,15*u*k,110,240-15*u*k,'#a85d00')+SC.t(110+5*u*k,232-15*u*k,(10*k)+' × '+(15*k)+' cm','#7a4300',12,'middle',1);return s+'</svg>'};
var STORY_E=STORYBLOCK({story:'"A photo studio in Half Way Tree enlarges a 10 cm × 15 cm photo by a scale factor of 2, so that it is the same picture, just bigger." Which sketch shows the enlargement?',sk:ESK,fb:EFB,correct:'B',p2title:'Enlarge the photo.',p2lead:'Change the scale factor. Watch the lengths, and how much PAPER (area) the enlargement needs compared with the original.',p2html:'<div class="controls"><label for="enK">Scale factor k:</label><input type="range" id="enK" min="1" max="3" step="0.5" value="1.5"><output class="big enKO"></output></div><div class="scene enSvg"></div><div class="tile enOut" aria-live="polite"></div>',goal:'find the scale factor that makes the photo use exactly 9 times as much paper',done:'Scale factor 3 multiplies each length by 3, but the AREA by 3 × 3 = 9. Lengths scale by k; areas scale by k².',
 p2init:function(box,api,ok){var K=box.querySelector('#enK');api.nudges(K);function draw(){var k=+K.value,a=150*k*k;box.querySelector('.enKO').textContent=k;box.querySelector('.enSvg').innerHTML=ENL(k);box.querySelector('.enOut').innerHTML='Lengths × '+k+': <strong>'+(10*k)+' cm × '+(15*k)+' cm</strong>.<br>Area: '+(10*k)+' × '+(15*k)+' = <strong>'+a+' cm²</strong>, which is <strong>'+(k*k)+' times</strong> the original 150 cm² (k² = '+k+'² = '+(k*k)+').';if(k===3)ok()}K.addEventListener('input',draw);draw()}});

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 1',unit:'Module 2: Geometry and Trigonometry 1',strand:'Geometry and Trigonometry',standard:'Module 2, Geometry and Trigonometry 1: understand the properties and relationship among geometrical objects; demonstrate the ability to use geometrical concepts to model and solve real world problems.',

  focus:'Cases of congruency (SSS, SAS, ASA/AAS, RHS); using congruent triangles to find lengths and angles; properties of similar triangles (equal angles, sides in the same ratio); finding missing lengths in similar figures; area and volume scale factors (k² and k³); faces, edges and vertices of solids (including Euler’s formula F + V − E = 2); classes of solids: prisms, pyramids, cylinders, cones and spheres.',

 glossary:[['Congruent','Exactly the same shape and size: one fits exactly on top of the other.'],['SSS','Three pairs of equal sides prove triangles congruent.'],['SAS','Two sides and the included angle prove triangles congruent.'],['ASA','Two angles and a corresponding side prove triangles congruent.'],['RHS','Right angle, hypotenuse and one other side prove right triangles congruent.'],['Similar','The same shape but not necessarily the same size: equal angles, sides in the same ratio.'],['Scale factor (k)','The number every length is multiplied by.'],['Prism','A solid with the same cross-section all the way through.'],['Pyramid','A solid with a polygon base and triangular faces meeting at a point (the apex).'],['Euler’s formula','For many solids: faces + vertices − edges = 2.']],

  {phase:'explore',name:'Picture it: the photo enlargement',title:'Picture it: what does "enlarge" really mean?',lead:'Enlarging a shape means MULTIPLYING every length by the same number, not adding to it. Start here: choose the correct enlargement of a photo, then scale it yourself and see what happens to the paper it needs.',

  {phase:'explore',name:'Similarity scaler',title:'Explore: the similarity scaler',lead:'The small triangle has sides 6 cm and 5 cm (and area 12 cm²). Change the scale factor k and see what happens to the lengths, the area, and the volume of a similar solid.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="ssK">Scale factor k:</label><input type="range" id="ssK" min="0.5" max="3" step="0.5" value="2"><output class="big ssKO"></output></div><div class="scene ssSvg"></div><div class="tile ssOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge ssN"></span> <strong class="ssQ"></strong></p><div class="controls"><input type="number" step="0.01" class="ssIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go ssC">Check</button></div><div class="fb ssFb" aria-live="polite">Use the scaler to help you.</div></div>',
     init:function(box,api){var K=box.querySelector('#ssK');api.nudges(K);function draw(){var k=+K.value;box.querySelector('.ssKO').textContent=k;box.querySelector('.ssSvg').innerHTML=SIM(k);box.querySelector('.ssOut').innerHTML='<strong>Lengths</strong> × '+k+': 6 cm → '+fz(6*k)+' cm, 5 cm → '+fz(5*k)+' cm<br><strong>Area</strong> × k² = × '+fz(k*k)+': 12 cm² → <strong>'+fz(12*k*k)+' cm²</strong><br><strong>Volume</strong> of a similar solid × k³ = × '+fz(k*k*k)+': a 10 cm³ solid → <strong>'+fz(10*k*k*k)+' cm³</strong><br>The angles do not change: similar shapes have equal angles.'}K.addEventListener('input',draw);var Q=[{t:'With k = 2, what does the 5 cm side become? (cm)',a:10},{t:'With k = 2, what does the 12 cm² area become? (cm²)',a:48},{t:'With k = 2, what does a 10 cm³ similar solid become? (cm³)',a:80}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.ssN').textContent='All done';box.querySelector('.ssQ').textContent='You completed every challenge!';box.querySelector('.ssC').disabled=true;return}box.querySelector('.ssN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ssQ').textContent=Q[q].t}box.querySelector('.ssC').onclick=function(){var v=parseFloat(box.querySelector('.ssIn').value),fb=box.querySelector('.ssFb');if(Math.abs(v-Q[q].a)<0.01){fb.className='fb ok ssFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ssIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no ssFb';fb.textContent='Not yet. Set k = 2 and read the results.'}};draw();task()}},
    {type:'recall',text:'It uses 4 times as much paper: the area of a 20 cm × 30 cm photo is 600 cm², which is 4 times 150 cm². When lengths are multiplied by k, areas are multiplied by k².'}]},
  {phase:'explain',name:'Teach: congruency and similarity',title:'Learn: congruent triangles and similar figures',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Congruent: same shape, same size. Similar: same shape, different size.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The cases of congruency',explain:PIC('A factory in Kingston makes roof trusses. Every truss for a housing scheme must be exactly the same: the same three lengths of timber, joined at the same angles, so that every roof sits level. The workers cut every truss from the same template: the triangles are congruent.',SCN['The cases of congruency'])+'<p>Two shapes are {{congruent|exactly the same shape and size}} if they are exactly the same shape and size: one would fit perfectly on top of the other (possibly after flipping it). All matching sides and angles are equal.</p><p>You do not need to check all six measurements of two triangles. Any one of these <strong>cases of congruency</strong> is enough:</p><p>• {{SSS|three pairs of equal sides}}: all three pairs of sides are equal.<br>• {{SAS|two sides and the included angle}}: two sides and the angle <strong>between</strong> them are equal.<br>• {{ASA|two angles and a corresponding side}}: two angles and a corresponding side are equal (also called AAS).<br>• {{RHS|right angle, hypotenuse, side}}: both triangles have a right angle, equal hypotenuses, and one other pair of equal sides.</p><p>Two cases do <strong>not</strong> work: AAA (equal angles only proves the triangles are similar, not the same size) and SSA (the angle is not between the sides).</p>'+WHY('Why are three pairs of equal sides (SSS) enough? Once the three lengths are fixed, there is only one way to join them into a triangle (as the string construction showed), so the angles are fixed too. Two sides with the angle BETWEEN them (SAS) also fix the triangle. But three equal angles (AAA) do not: a small triangle and a large one can have the same angles.')+WORK('<strong>Truss and furniture factories</strong> mass-produce congruent parts. <strong>Engineers</strong> use congruent triangles in bridges so that the loads balance. <strong>Quality inspectors</strong> check that copies match a template.'),visual:CONG(),
     example:{q:'In triangles ABC and PQR, AB = PQ = 9 cm, angle A = angle P = 50°, and AC = PR = 7 cm. Are they congruent?',steps:[{do:'Two pairs of sides are equal: AB = PQ and AC = PR.'},{do:'The equal angles (A and P) are BETWEEN those sides.'},{do:'So the triangles are congruent (SAS).'}]},
     mistake:'Using AAA as a case of congruency. Three equal angles only show the triangles are SIMILAR.',
     check:{q:'Which is NOT a case of congruency?',o:['AAA','SSS','RHS'],a:0,why:'Equal angles do not guarantee equal size.',hint:'Size matters.'}},
    {title:'Using congruent triangles to solve problems',explain:PIC('A bridge over a gully in St. Mary has a support frame made of two triangles that mirror each other on either side of the centre post. The engineer measures the left triangle carefully. Because the right triangle is congruent to it, every length and angle on the right is already known: no need to climb out over the gully to measure.',SCN['Using congruent triangles to solve problems'])+'<p>Once you have shown two triangles are congruent, <strong>all</strong> their matching parts are equal. That lets you find unknown lengths and angles, and prove geometric facts.</p><p>Write congruency statements in matching order: if triangle ABC ≡ triangle PQR, then A matches P, B matches Q, and C matches R. So BC = QR, angle C = angle R, and so on.</p><p>For example, in an isosceles triangle, the line from the apex to the midpoint of the base splits it into two congruent triangles (SSS). That proves the base angles are equal, and that the line meets the base at 90°.</p>'+WHY('Why do congruent triangles give us the missing measurements? If two triangles are congruent, one fits exactly on top of the other, so EVERY matching side and angle is equal, not just the ones used to prove it. The trick is to match the vertices in the right order.')+WORK('<strong>Civil engineers</strong> use symmetry and congruence to check structures. <strong>Surveyors</strong> find distances they cannot measure directly. <strong>Carpenters</strong> copy one half of a symmetrical design to build the other.'),
     example:{q:'Triangle ABC ≡ triangle PQR. AB = 8 cm, BC = 6 cm, angle B = 70°. Find QR and angle Q.',steps:[{do:'B matches Q, and BC matches QR.'},{do:'QR = BC = 6 cm.'},{do:'Angle Q = angle B = 70°.'}]},
     mistake:'Matching the wrong vertices. Keep the letters in matching order in the congruency statement.',
     check:{q:'If triangle XYZ ≡ triangle LMN, which side equals YZ?',o:['MN','LM','LN'],a:0,why:'Y matches M and Z matches N.',hint:'Match the letters in order.'}},
    {title:'Similar figures and missing lengths',explain:PIC('On a sunny afternoon in Mandeville, a 2 m pole casts a 1.5 m shadow. At the same moment, a tall tree beside it casts a 12 m shadow. The sun’s rays are parallel, so the pole, its shadow and the ray make a small triangle, and the tree makes a bigger triangle of exactly the same shape. The tree is 12 ÷ 1.5 = 8 times as tall as the pole: 16 m.',SCN['Similar figures and missing lengths'])+'<p>Two shapes are {{similar|same shape, not necessarily the same size}} if one is an enlargement of the other. For triangles, that means: <strong>all matching angles are equal</strong>, and <strong>all matching sides are in the same ratio</strong>, the {{scale factor|the number every length is multiplied by}} k.</p><p>Two triangles are similar if two pairs of angles are equal (the third pair is then equal too), or if all three pairs of sides are in the same ratio.</p><p>To find a missing length: match the corresponding sides (opposite equal angles), find k = big ÷ small from a known pair, then multiply or divide. A classic case: a line parallel to one side of a triangle cuts off a smaller, similar triangle.</p>'+WHY('Why are the two triangles similar? The pole and the tree are both vertical, so both triangles have a right angle. The sun’s rays are parallel, so they hit the ground at the same angle. Two equal angles mean the third angles are equal too: the triangles are the same shape, with every side in the same ratio.')+WORK('<strong>Surveyors and foresters</strong> measure tall trees and buildings using shadows and similar triangles. <strong>Map makers</strong> use similarity for scale drawings. <strong>Photographers and printers</strong> enlarge pictures without distorting them.'),
     example:{q:'Triangles ABC and ADE are similar, with DE parallel to BC. AD = 4 cm, AB = 10 cm and DE = 6 cm. Find BC.',steps:[{do:'Scale factor from the small triangle to the large: k = AB ÷ AD = 10 ÷ 4 = 2.5.'},{do:'BC matches DE.'},{do:'BC = 6 × 2.5 = 15 cm.'}]},
     mistake:'Using AD and DB (the parts) instead of AD and AB (the whole sides) for the scale factor.',
     check:{q:'Two similar triangles: sides 3 and 7.5 match. A side of 4 in the small one matches…',o:['10','8.5','12'],a:0,why:'k = 2.5; 4 × 2.5 = 10.',hint:'Find k first.'}}]}]},
  {phase:'explain',name:'Teach: scale factors and solids',title:'Learn: area and volume scale factors, and solids',lead:'Next, how areas and volumes scale, and the properties of solids.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'F + V − E = 2.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Area and volume scale factors',explain:PIC('A juice company sells two similar bottles: the large one is 15 cm tall and the small one 10 cm tall. The large bottle is 1.5 times as tall, but it holds far more than 1.5 times as much juice: about 3.4 times as much. Shoppers who only compare heights get the value wrong.',SCN['Area and volume scale factors'])+'<p>If similar shapes have a length scale factor of k, then:</p><p><strong>Areas</strong> are multiplied by <strong>k²</strong>, because area uses two lengths (length × width).<br><strong>Volumes</strong> are multiplied by <strong>k³</strong>, because volume uses three lengths.</p><p>That is why the photo uses 4 times as much paper: k = 2, so the area scale factor is 2² = 4. And a model car built at 1 : 10 has 1/100 of the real car’s paint area, and 1/1,000 of its volume.</p><p>You can also work backwards: if the areas are in the ratio 9 : 25, the lengths are in the ratio 3 : 5 (square-root).</p>'+WHY('Why does volume grow so much faster? Volume depends on three lengths: height, width and depth. When every length is multiplied by 1.5, the volume is multiplied by 1.5 × 1.5 × 1.5 = 3.375. Area depends on two lengths, so it is multiplied by 1.5 × 1.5 = 2.25.')+WORK('<strong>Packaging designers</strong> decide bottle and box sizes. <strong>Shoppers and consumer groups</strong> compare value for money. <strong>Engineers</strong> know that a model twice as big needs about 8 times the material.'),visual:SIM(2,'A triangle and a similar triangle twice as big'),
     example:{q:'Two similar bottles have heights 10 cm and 15 cm. The small one holds 400 mL. How much does the large one hold?',steps:[{do:'Length scale factor: k = 15 ÷ 10 = 1.5.'},{do:'Volume scale factor: k³ = 1.5³ = 3.375.'},{do:'Large bottle = 400 × 3.375 = 1,350 mL.'}]},
     mistake:'Multiplying the volume by k instead of k³. A bottle 1.5 times as tall holds 3.375 times as much, not 1.5 times.',
     check:{q:'Similar shapes: lengths × 3. Areas are multiplied by…',o:['9','3','27'],a:0,why:'k² = 9.',hint:'Square the scale factor.'}},
    {title:'Faces, edges and vertices',explain:PIC('Pick up a cardboard box from a supermarket. Count its flat faces (6), the edges where two faces meet (12), and the corners (8). A camping tent shaped like a triangular prism has 5 faces, 9 edges and 6 corners. For every such solid, faces + corners − edges = 2.',SCN['Faces, edges and vertices'])+'<p>A solid has <strong>faces</strong> (flat or curved surfaces), <strong>edges</strong> (where two faces meet) and <strong>vertices</strong> (corners where edges meet).</p><p>For solids with flat faces (polyhedra), a beautiful rule called {{Euler’s formula|faces + vertices − edges = 2}} connects them: <strong>F + V − E = 2</strong>. For a cube: 6 + 8 − 12 = 2 ✓.</p><p>You can use it to find a missing number. A shape with 12 faces and 30 edges must have V = 2 − 12 + 30 = 20 vertices. Count carefully, perhaps by imagining or handling a real model, as the syllabus suggests.</p>'+WHY('Why is F + V − E always 2 for these solids? Remove the edges one at a time. Removing an edge that separates two faces joins them into one: E and F each fall by 1. Removing an edge that ends at a corner with no other edges removes that corner too: E and V each fall by 1. Either way, F + V − E does not change. Keep going until only a single corner is left on one face: F = 1, V = 1 and E = 0, so F + V − E = 2, and it was 2 all along.')+WORK('<strong>Packaging designers</strong> plan the folds of boxes. <strong>Architects</strong> design buildings as combinations of solids. <strong>3D artists and game designers</strong> build shapes from faces, edges and vertices.'),
     example:{q:'A hexagonal prism: find F, E and V, and check Euler’s formula.',steps:[{do:'Faces: 2 hexagons + 6 rectangles = 8.'},{do:'Edges: 6 on each hexagon + 6 joining them = 18. Vertices: 6 on each hexagon = 12.'},{do:'Check: 8 + 12 − 18 = 2 ✓'}]},
     mistake:'Counting the same edge twice. Each edge is shared by exactly two faces.',
     check:{q:'A square-based pyramid has 5 faces and 5 vertices. How many edges?',o:['8','10','12'],a:0,why:'E = F + V − 2 = 8.',hint:'Use F + V − E = 2.'}},
    {title:'Classes of solids',explain:PIC('Look along a supermarket shelf: a tin of ackee is a cylinder; a party hat is a cone; a camping tent is a triangular prism; a football is a sphere; a paperweight might be a square-based pyramid. Each class of solid has its own properties, and its own formula for volume.',SCN['Classes of solids'])+'<p>The syllabus names five classes of solids.</p><p>• A {{prism|a solid with the same cross-section all the way through}} has the same cross-section all the way through: cubes, cuboids, triangular prisms.<br>• A {{pyramid|a polygon base with triangular faces meeting at an apex}} has a polygon base and triangular faces meeting at a point, the apex.<br>• A <strong>cylinder</strong> has two equal circular ends and a curved surface: like a prism, but with a circle.<br>• A <strong>cone</strong> has a circular base and a curved surface meeting at an apex: like a pyramid, but with a circle.<br>• A <strong>sphere</strong> is perfectly round, with every point on its surface the same distance from the centre.</p><p>Knowing the class tells you which formulas apply: prisms and cylinders use volume = cross-section area × length; pyramids and cones use volume = ⅓ × base area × height.</p>'+WHY('Why do prisms and cylinders share a volume formula? Both have the SAME cross-section all the way through, so the volume is the area of that cross-section × the length. Pyramids and cones narrow to a point, so they hold exactly one third of the prism or cylinder with the same base and height.')+WORK('<strong>Packaging engineers</strong> choose shapes that hold the most for the least material (which is why so many tins are cylinders). <strong>Water engineers</strong> calculate the volume of cylindrical tanks. <strong>Architects</strong> combine solids in their designs.'),
     example:{q:'Classify: a tin of ackee, a party hat, a Toblerone box, a football.',steps:[{do:'Tin of ackee: cylinder. Party hat: cone.'},{do:'Toblerone box: triangular prism.'},{do:'Football: sphere.'}]},
     mistake:'Calling a cone a pyramid. A pyramid has a POLYGON base; a cone has a circular base.',
     check:{q:'A solid with the same triangular cross-section all along its length is a…',o:['triangular prism','triangular pyramid','cone'],a:0,why:'Same cross-section throughout.',hint:'Prism.'}}]}]},

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, similarity and congruence decide whether a tree must be trimmed, which juice bottle is better value, what a print should cost, and whether trusses match. Choose a job, sketch it, and make the decision.',
   mission:['Choose a job card.','Sketch the two shapes and match the corresponding lengths first.','Complete any 3 jobs for a star. Complete all 4 to become a Maths at Work Champion.'],
   patois:'Same shape, different size: find di scale factor!',
   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'🌳',title:'The utility surveyor: trim the tree?',desc:'Use shadows to decide whether a tree is too tall.',level:'⭐⭐ Surveying',mins:6,block:{type:'mission',story:'A surveyor checks a tree growing near power lines in Mandeville. Trees within reach of the lines must be trimmed if they are taller than 15 m. At the same moment, a 2 m pole casts a 1.5 m shadow, and the tree casts a 12 m shadow.',parts:[{q:'What is the scale factor from the pole’s shadow to the tree’s shadow?',a:8,hint:'12 ÷ 1.5.',sol:'8.'},{q:'How tall is the tree? (m)',a:16,hint:'2 × 8.',sol:'16 m.',placeholder:'m'},{q:'Must the tree be trimmed? (Type yes or no.)',a:['yes'],hint:'Is 16 m taller than 15 m?',sol:'Yes: it is 1 m over the limit.'},{q:'How many metres must be trimmed off, at least, to bring it to 15 m? (m)',a:1,hint:'16 − 15.',sol:'1 m.',placeholder:'m'}],done:'Two shadows and similar triangles measured a tree that nobody had to climb.'}},
    {icon:'🧃',title:'The shopper: which bottle is better value?',desc:'Compare similar juice bottles fairly.',level:'⭐⭐ Consumer',mins:6,block:{type:'mission',story:'Two similar juice bottles: the small one is 10 cm tall, holds 400 mL and costs $150. The large one is 15 cm tall and costs $400.',parts:[{q:'What is the length scale factor from small to large?',a:1.5,tol:0.001,hint:'15 ÷ 10.',sol:'1.5.'},{q:'What is the volume scale factor?',a:3.375,tol:0.001,hint:'1.5³.',sol:'3.375.'},{q:'How much does the large bottle hold? (mL)',a:1350,hint:'400 × 3.375.',sol:'1,350 mL.',placeholder:'mL'},{q:'Cost per 100 mL of the small bottle, to the nearest cent? ($)',a:37.5,tol:0.01,hint:'150 ÷ 4.',sol:'$37.50.',placeholder:'dollars'},{q:'Cost per 100 mL of the large bottle, to the nearest cent? ($)',a:29.63,tol:0.01,hint:'400 ÷ 13.5.',sol:'About $29.63.',placeholder:'dollars'},{q:'Which bottle is better value? (Type small or large.)',a:['large'],hint:'The lower cost per 100 mL.',sol:'The large bottle, even though it costs more than twice as much: it holds over 3 times as much.'}],done:'Comparing heights would have fooled the shopper. The volume scale factor told the truth.'}},
    {icon:'🖼️',title:'The printer: pricing enlargements',desc:'Price photo enlargements fairly by area.',level:'⭐⭐ Business',mins:5,block:{type:'mission',story:'A photo printer charges by the amount of paper used. A 4 inch × 6 inch print costs $50. A customer wants enlargements with scale factors 2 and 3.',parts:[{q:'What are the dimensions of the scale factor 2 print? Type the longer side. (inches)',a:12,hint:'6 × 2.',sol:'8 × 12 inches.'},{q:'How many times as much paper does it use?',a:4,hint:'k² = 2².',sol:'4 times.'},{q:'What should it cost, charged by area? ($)',a:200,hint:'50 × 4.',sol:'$200.',placeholder:'dollars'},{q:'What should the scale factor 3 print cost? ($)',a:450,hint:'50 × 3².',sol:'$450.',placeholder:'dollars'}],done:'Pricing by area means multiplying by k², not by k.'}},
    {icon:'🏗️',title:'The truss inspector: do they match?',desc:'Check whether two roof trusses are congruent.',level:'⭐⭐ Quality control',mins:5,block:{type:'mission',story:'An inspector at a truss factory checks two triangular trusses. Truss 1 has sides 3 m, 4 m and 5 m. Truss 2 has sides 5 m, 3 m and 4 m, measured in a different order. Truss 3 has angles 37°, 53° and 90°, but its sides are 6 m, 8 m and 10 m.',parts:[{q:'Are trusses 1 and 2 congruent? (Type yes or no.)',a:['yes'],hint:'Compare the three side lengths, in any order.',sol:'Yes: the same three sides (SSS).'},{q:'Which case of congruency proves it? (Type SSS, SAS, ASA or RHS.)',a:['sss'],hint:'Three sides are known.',sol:'SSS.'},{q:'Truss 3 has the same angles as truss 1. Is it congruent to truss 1? (Type yes or no.)',a:['no'],hint:'Compare the side lengths.',sol:'No: its sides are twice as long. It is SIMILAR (scale factor 2), not congruent.'},{q:'What is the scale factor from truss 1 to truss 3?',a:2,hint:'6 ÷ 3.',sol:'2.'}],done:'Equal angles alone do not make trusses identical: the inspector checked the sides.'}}
   ]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',

    {icon:'🗂️',title:'Congruent or not proven?',desc:'Sort each piece of information.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'SSS, SAS, ASA and RHS prove congruency. AAA and SSA do not.',bins:[{id:'y',label:'Proves congruency'},{id:'n',label:'Does not prove it'}],items:[{label:'Three pairs of equal sides',bin:'y'},{label:'Three pairs of equal angles',bin:'n'},{label:'Two sides and the included angle',bin:'y'},{label:'Two sides and a non-included angle',bin:'n'},{label:'Right angle, hypotenuse and one side',bin:'y'},{label:'Two angles and a corresponding side',bin:'y'}]}},
    {icon:'🃏',title:'Match the solids',desc:'Match each solid to its faces, edges and vertices.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Cube','F 6, E 12, V 8'],['Triangular prism','F 5, E 9, V 6'],['Square-based pyramid','F 5, E 8, V 5'],['Tetrahedron','F 4, E 6, V 4'],['Hexagonal prism','F 8, E 18, V 12'],['Pentagonal prism','F 7, E 15, V 10']]}},
    {icon:'📏',title:'Order the volumes',desc:'Scale a 2 cm³ solid, then order the results.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'A 2 cm³ solid is enlarged by each length scale factor. Tap from smallest to largest new volume.',rounds:[[{label:'k = 0.5',v:0.25,show:'0.25 cm³'},{label:'k = 1.5',v:6.75,show:'6.75 cm³'},{label:'k = 2',v:16,show:'16 cm³'},{label:'k = 3',v:54,show:'54 cm³'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Congruent triangles are similar.',a:'always',why:'They have equal angles, with scale factor 1.'},{s:'Similar triangles are congruent.',a:'sometimes',why:'Only when the scale factor is 1.'},{s:'Doubling all lengths doubles the area.',a:'never',why:'The area is multiplied by 4.'},{s:'F + V − E = 2 for a cuboid.',a:'always',why:'6 + 8 − 12 = 2.'},{s:'A cylinder is a prism with a polygon cross-section.',a:'never',why:'Its cross-section is a circle, not a polygon.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Two triangles have angles 40°, 60°, 80°. Are they congruent?',lines:['All three angles match','So they are congruent (AAA)'],wrong:1,reasons:['AAA only proves they are SIMILAR; they could be different sizes','They are never related','They are congruent by SAS'],reason:0,fix:'They are similar, but not necessarily congruent.'},{who:'Tia',q:'Similar cans: heights 10 cm and 20 cm. Small can holds 300 mL.',lines:['k = 2','Large can = 300 × 2 = 600 mL'],wrong:1,reasons:['Volume scales by k³ = 8: 2,400 mL','It should be 300 × 4','It should be 150 mL'],reason:0,fix:'2,400 mL.'},{who:'Omar',q:'A shape has F = 6, V = 8. Find E.',lines:['E = F + V + 2 = 16'],wrong:0,reasons:['From F + V − E = 2, E = F + V − 2 = 12','E = 14','E = 2'],reason:0,fix:'12.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire scale factors.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},k=R(2,4),r=R(0,2),v=R(2,9);if(r===0)return{q:'Lengths × '+k+'. Area '+v+' cm² becomes?',o:[(v*k*k)+' cm²',(v*k)+' cm²',(v*k*k*k)+' cm²'],a:0,why:'× k² = '+(k*k)+'.'};if(r===1)return{q:'Lengths × '+k+'. Volume '+v+' cm³ becomes?',o:[(v*k*k*k)+' cm³',(v*k*k)+' cm³',(v*k)+' cm³'],a:0,why:'× k³ = '+(k*k*k)+'.'};var s=SOL[R(0,5)];return{q:s[0]+': how many edges?',o:[String(s[2]),String(s[1]+s[3]),String(s[2]+2)].filter(function(z,i,a){return a.indexOf(z)===i}).concat([String(s[2]-2)]).slice(0,3),a:0,why:'E = F + V − 2.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent shapes that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Two similar maps: one has 4 times the area of the other. What is the length scale factor?',placeholder:'k',check:function(v){return parseFloat(v)===2?{ok:true,msg:'Yes! √4 = 2.'}:{ok:false,msg:'Area factor = k², so k = √4.'}}},{q:'Name a solid with 5 faces, 9 edges and 6 vertices.',placeholder:'solid',check:function(v){return/triangular prism/i.test(v)?{ok:true,msg:'Correct! A triangular prism.'}:{ok:false,msg:'Two triangles and three rectangles…'}}},{q:'Give the length scale factor that multiplies volumes by 125.',placeholder:'k',check:function(v){return parseFloat(v)===5?{ok:true,msg:'Yes! 5³ = 125.'}:{ok:false,msg:'k³ = 125.'}}}]}},
    {icon:'🏠',title:'Mission: the model house',desc:'Use similarity and solids to plan a model of a house.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'An architecture student in Kingston builds a scale model of a house at a scale of 1 : 50 (every length on the model is 1/50 of the real length).',parts:[{q:'The real house is 12 m wide. How wide is the model, in cm?',a:24,hint:'1,200 cm ÷ 50.',sol:'24 cm.',placeholder:'cm'},{q:'The model’s floor area is 0.0576 m². What is the real floor area? (m²)',a:144,tol:0.01,hint:'× 50² = 2,500.',sol:'0.0576 × 2,500 = 144 m².',placeholder:'m²'},{q:'The model’s water tank holds 0.002 litres. How much does the real tank hold? (litres)',a:250,tol:0.01,hint:'× 50³ = 125,000.',sol:'0.002 × 125,000 = 250 litres.',placeholder:'litres'},{q:'The roof is a triangular prism. How many faces does a triangular prism have?',a:5,hint:'2 triangles + 3 rectangles.',sol:'5.'},{q:'Two roof trusses are triangles with sides 3 m, 4 m and 5 m. Which case proves they are congruent? (Type SSS, SAS, ASA or RHS.)',a:['sss'],hint:'All three sides are given.',sol:'SSS.'}],done:'You used length, area and volume scale factors, solids and congruency to plan a real model.'}}
   ]}]},
