 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 1',unit:'Module 2: Geometry and Trigonometry 1',strand:'Geometry and Trigonometry',standard:'Module 2, Geometry and Trigonometry 1: understand the properties and relationship among geometrical objects; demonstrate the ability to use geometrical concepts to model and solve real world problems.',

  focus:'Cases of congruency (SSS, SAS, ASA/AAS, RHS); using congruent triangles to find lengths and angles; properties of similar triangles (equal angles, sides in the same ratio); finding missing lengths in similar figures; area and volume scale factors (k² and k³); faces, edges and vertices of solids (including Euler’s formula F + V − E = 2); classes of solids: prisms, pyramids, cylinders, cones and spheres.',

 glossary:[['Congruent','Exactly the same shape and size: one fits exactly on top of the other.'],['SSS','Three pairs of equal sides prove triangles congruent.'],['SAS','Two sides and the included angle prove triangles congruent.'],['ASA','Two angles and a corresponding side prove triangles congruent.'],['RHS','Right angle, hypotenuse and one other side prove right triangles congruent.'],['Similar','The same shape but not necessarily the same size: equal angles, sides in the same ratio.'],['Scale factor (k)','The number every length is multiplied by.'],['Prism','A solid with the same cross-section all the way through.'],['Pyramid','A solid with a polygon base and triangular faces meeting at a point (the apex).'],['Euler’s formula','For many solids: faces + vertices − edges = 2.']],

 steps:[

  {phase:'explore',name:'Similarity scaler',title:'Explore: the similarity scaler',lead:'The small triangle has sides 6 cm and 5 cm (and area 12 cm²). Change the scale factor k and see what happens to the lengths, the area, and the volume of a similar solid.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="ssK">Scale factor k:</label><input type="range" id="ssK" min="0.5" max="3" step="0.5" value="2"><output class="big ssKO"></output></div><div class="scene ssSvg"></div><div class="tile ssOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge ssN"></span> <strong class="ssQ"></strong></p><div class="controls"><input type="number" step="0.01" class="ssIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go ssC">Check</button></div><div class="fb ssFb" aria-live="polite">Use the scaler to help you.</div></div>',
     init:function(box,api){var K=box.querySelector('#ssK');api.nudges(K);function draw(){var k=+K.value;box.querySelector('.ssKO').textContent=k;box.querySelector('.ssSvg').innerHTML=SIM(k);box.querySelector('.ssOut').innerHTML='<strong>Lengths</strong> × '+k+': 6 cm → '+fz(6*k)+' cm, 5 cm → '+fz(5*k)+' cm<br><strong>Area</strong> × k² = × '+fz(k*k)+': 12 cm² → <strong>'+fz(12*k*k)+' cm²</strong><br><strong>Volume</strong> of a similar solid × k³ = × '+fz(k*k*k)+': a 10 cm³ solid → <strong>'+fz(10*k*k*k)+' cm³</strong><br>The angles do not change: similar shapes have equal angles.'}K.addEventListener('input',draw);var Q=[{t:'With k = 2, what does the 5 cm side become? (cm)',a:10},{t:'With k = 2, what does the 12 cm² area become? (cm²)',a:48},{t:'With k = 2, what does a 10 cm³ similar solid become? (cm³)',a:80}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.ssN').textContent='All done';box.querySelector('.ssQ').textContent='You completed every challenge!';box.querySelector('.ssC').disabled=true;return}box.querySelector('.ssN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ssQ').textContent=Q[q].t}box.querySelector('.ssC').onclick=function(){var v=parseFloat(box.querySelector('.ssIn').value),fb=box.querySelector('.ssFb');if(Math.abs(v-Q[q].a)<0.01){fb.className='fb ok ssFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ssIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no ssFb';fb.textContent='Not yet. Set k = 2 and read the results.'}};draw();task()}},
    {type:'recall',text:'It uses 4 times as much paper: the area of a 20 cm × 30 cm photo is 600 cm², which is 4 times 150 cm². When lengths are multiplied by k, areas are multiplied by k².'}]},
  {phase:'explain',name:'Teach: congruency and similarity',title:'Learn: congruent triangles and similar figures',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Congruent: same shape, same size. Similar: same shape, different size.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The cases of congruency',explain:'<p>Two shapes are {{congruent|exactly the same shape and size}} if they are exactly the same shape and size: one would fit perfectly on top of the other (possibly after flipping it). All matching sides and angles are equal.</p><p>You do not need to check all six measurements of two triangles. Any one of these <strong>cases of congruency</strong> is enough:</p><p>• {{SSS|three pairs of equal sides}}: all three pairs of sides are equal.<br>• {{SAS|two sides and the included angle}}: two sides and the angle <strong>between</strong> them are equal.<br>• {{ASA|two angles and a corresponding side}}: two angles and a corresponding side are equal (also called AAS).<br>• {{RHS|right angle, hypotenuse, side}}: both triangles have a right angle, equal hypotenuses, and one other pair of equal sides.</p><p>Two cases do <strong>not</strong> work: AAA (equal angles only proves the triangles are similar, not the same size) and SSA (the angle is not between the sides).</p>',visual:CONG(),
     example:{q:'In triangles ABC and PQR, AB = PQ = 9 cm, angle A = angle P = 50°, and AC = PR = 7 cm. Are they congruent?',steps:[{do:'Two pairs of sides are equal: AB = PQ and AC = PR.'},{do:'The equal angles (A and P) are BETWEEN those sides.'},{do:'So the triangles are congruent (SAS).'}]},
     mistake:'Using AAA as a case of congruency. Three equal angles only show the triangles are SIMILAR.',
     check:{q:'Which is NOT a case of congruency?',o:['AAA','SSS','RHS'],a:0,why:'Equal angles do not guarantee equal size.',hint:'Size matters.'}},
    {title:'Using congruent triangles to solve problems',explain:'<p>Once you have shown two triangles are congruent, <strong>all</strong> their matching parts are equal. That lets you find unknown lengths and angles, and prove geometric facts.</p><p>Write congruency statements in matching order: if triangle ABC ≡ triangle PQR, then A matches P, B matches Q, and C matches R. So BC = QR, angle C = angle R, and so on.</p><p>For example, in an isosceles triangle, the line from the apex to the midpoint of the base splits it into two congruent triangles (SSS). That proves the base angles are equal, and that the line meets the base at 90°.</p>',
     example:{q:'Triangle ABC ≡ triangle PQR. AB = 8 cm, BC = 6 cm, angle B = 70°. Find QR and angle Q.',steps:[{do:'B matches Q, and BC matches QR.'},{do:'QR = BC = 6 cm.'},{do:'Angle Q = angle B = 70°.'}]},
     mistake:'Matching the wrong vertices. Keep the letters in matching order in the congruency statement.',
     check:{q:'If triangle XYZ ≡ triangle LMN, which side equals YZ?',o:['MN','LM','LN'],a:0,why:'Y matches M and Z matches N.',hint:'Match the letters in order.'}},
    {title:'Similar figures and missing lengths',explain:'<p>Two shapes are {{similar|same shape, not necessarily the same size}} if one is an enlargement of the other. For triangles, that means: <strong>all matching angles are equal</strong>, and <strong>all matching sides are in the same ratio</strong>, the {{scale factor|the number every length is multiplied by}} k.</p><p>Two triangles are similar if two pairs of angles are equal (the third pair is then equal too), or if all three pairs of sides are in the same ratio.</p><p>To find a missing length: match the corresponding sides (opposite equal angles), find k = big ÷ small from a known pair, then multiply or divide. A classic case: a line parallel to one side of a triangle cuts off a smaller, similar triangle.</p>',
     example:{q:'Triangles ABC and ADE are similar, with DE parallel to BC. AD = 4 cm, AB = 10 cm and DE = 6 cm. Find BC.',steps:[{do:'Scale factor from the small triangle to the large: k = AB ÷ AD = 10 ÷ 4 = 2.5.'},{do:'BC matches DE.'},{do:'BC = 6 × 2.5 = 15 cm.'}]},
     mistake:'Using AD and DB (the parts) instead of AD and AB (the whole sides) for the scale factor.',
     check:{q:'Two similar triangles: sides 3 and 7.5 match. A side of 4 in the small one matches…',o:['10','8.5','12'],a:0,why:'k = 2.5; 4 × 2.5 = 10.',hint:'Find k first.'}}]}]},
  {phase:'explain',name:'Teach: scale factors and solids',title:'Learn: area and volume scale factors, and solids',lead:'Next, how areas and volumes scale, and the properties of solids.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'F + V − E = 2.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Area and volume scale factors',explain:'<p>If similar shapes have a length scale factor of k, then:</p><p><strong>Areas</strong> are multiplied by <strong>k²</strong>, because area uses two lengths (length × width).<br><strong>Volumes</strong> are multiplied by <strong>k³</strong>, because volume uses three lengths.</p><p>That is why the photo uses 4 times as much paper: k = 2, so the area scale factor is 2² = 4. And a model car built at 1 : 10 has 1/100 of the real car’s paint area, and 1/1,000 of its volume.</p><p>You can also work backwards: if the areas are in the ratio 9 : 25, the lengths are in the ratio 3 : 5 (square-root).</p>',visual:SIM(2,'A triangle and a similar triangle twice as big'),
     example:{q:'Two similar bottles have heights 10 cm and 15 cm. The small one holds 400 mL. How much does the large one hold?',steps:[{do:'Length scale factor: k = 15 ÷ 10 = 1.5.'},{do:'Volume scale factor: k³ = 1.5³ = 3.375.'},{do:'Large bottle = 400 × 3.375 = 1,350 mL.'}]},
     mistake:'Multiplying the volume by k instead of k³. A bottle 1.5 times as tall holds 3.375 times as much, not 1.5 times.',
     check:{q:'Similar shapes: lengths × 3. Areas are multiplied by…',o:['9','3','27'],a:0,why:'k² = 9.',hint:'Square the scale factor.'}},
    {title:'Faces, edges and vertices',explain:'<p>A solid has <strong>faces</strong> (flat or curved surfaces), <strong>edges</strong> (where two faces meet) and <strong>vertices</strong> (corners where edges meet).</p><p>For solids with flat faces (polyhedra), a beautiful rule called {{Euler’s formula|faces + vertices − edges = 2}} connects them: <strong>F + V − E = 2</strong>. For a cube: 6 + 8 − 12 = 2 ✓.</p><p>You can use it to find a missing number. A shape with 12 faces and 30 edges must have V = 2 − 12 + 30 = 20 vertices. Count carefully, perhaps by imagining or handling a real model, as the syllabus suggests.</p>',
     example:{q:'A hexagonal prism: find F, E and V, and check Euler’s formula.',steps:[{do:'Faces: 2 hexagons + 6 rectangles = 8.'},{do:'Edges: 6 on each hexagon + 6 joining them = 18. Vertices: 6 on each hexagon = 12.'},{do:'Check: 8 + 12 − 18 = 2 ✓'}]},
     mistake:'Counting the same edge twice. Each edge is shared by exactly two faces.',
     check:{q:'A square-based pyramid has 5 faces and 5 vertices. How many edges?',o:['8','10','12'],a:0,why:'E = F + V − 2 = 8.',hint:'Use F + V − E = 2.'}},
    {title:'Classes of solids',explain:'<p>The syllabus names five classes of solids.</p><p>• A {{prism|a solid with the same cross-section all the way through}} has the same cross-section all the way through: cubes, cuboids, triangular prisms.<br>• A {{pyramid|a polygon base with triangular faces meeting at an apex}} has a polygon base and triangular faces meeting at a point, the apex.<br>• A <strong>cylinder</strong> has two equal circular ends and a curved surface: like a prism, but with a circle.<br>• A <strong>cone</strong> has a circular base and a curved surface meeting at an apex: like a pyramid, but with a circle.<br>• A <strong>sphere</strong> is perfectly round, with every point on its surface the same distance from the centre.</p><p>Knowing the class tells you which formulas apply: prisms and cylinders use volume = cross-section area × length; pyramids and cones use volume = ⅓ × base area × height.</p>',
     example:{q:'Classify: a tin of ackee, a party hat, a Toblerone box, a football.',steps:[{do:'Tin of ackee: cylinder. Party hat: cone.'},{do:'Toblerone box: triangular prism.'},{do:'Football: sphere.'}]},
     mistake:'Calling a cone a pyramid. A pyramid has a POLYGON base; a cone has a circular base.',
     check:{q:'A solid with the same triangular cross-section all along its length is a…',o:['triangular prism','triangular pyramid','cone'],a:0,why:'Same cross-section throughout.',hint:'Prism.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',

    {icon:'🗂️',title:'Congruent or not proven?',desc:'Sort each piece of information.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'SSS, SAS, ASA and RHS prove congruency. AAA and SSA do not.',bins:[{id:'y',label:'Proves congruency'},{id:'n',label:'Does not prove it'}],items:[{label:'Three pairs of equal sides',bin:'y'},{label:'Three pairs of equal angles',bin:'n'},{label:'Two sides and the included angle',bin:'y'},{label:'Two sides and a non-included angle',bin:'n'},{label:'Right angle, hypotenuse and one side',bin:'y'},{label:'Two angles and a corresponding side',bin:'y'}]}},
    {icon:'🃏',title:'Match the solids',desc:'Match each solid to its faces, edges and vertices.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Cube','F 6, E 12, V 8'],['Triangular prism','F 5, E 9, V 6'],['Square-based pyramid','F 5, E 8, V 5'],['Tetrahedron','F 4, E 6, V 4'],['Hexagonal prism','F 8, E 18, V 12'],['Pentagonal prism','F 7, E 15, V 10']]}},
    {icon:'📏',title:'Order the volumes',desc:'Scale a 2 cm³ solid, then order the results.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'A 2 cm³ solid is enlarged by each length scale factor. Tap from smallest to largest new volume.',rounds:[[{label:'k = 0.5',v:0.25,show:'0.25 cm³'},{label:'k = 1.5',v:6.75,show:'6.75 cm³'},{label:'k = 2',v:16,show:'16 cm³'},{label:'k = 3',v:54,show:'54 cm³'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Congruent triangles are similar.',a:'always',why:'They have equal angles, with scale factor 1.'},{s:'Similar triangles are congruent.',a:'sometimes',why:'Only when the scale factor is 1.'},{s:'Doubling all lengths doubles the area.',a:'never',why:'The area is multiplied by 4.'},{s:'F + V − E = 2 for a cuboid.',a:'always',why:'6 + 8 − 12 = 2.'},{s:'A cylinder is a prism with a polygon cross-section.',a:'never',why:'Its cross-section is a circle, not a polygon.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Two triangles have angles 40°, 60°, 80°. Are they congruent?',lines:['All three angles match','So they are congruent (AAA)'],wrong:1,reasons:['AAA only proves they are SIMILAR; they could be different sizes','They are never related','They are congruent by SAS'],reason:0,fix:'They are similar, but not necessarily congruent.'},{who:'Tia',q:'Similar cans: heights 10 cm and 20 cm. Small can holds 300 mL.',lines:['k = 2','Large can = 300 × 2 = 600 mL'],wrong:1,reasons:['Volume scales by k³ = 8: 2,400 mL','It should be 300 × 4','It should be 150 mL'],reason:0,fix:'2,400 mL.'},{who:'Omar',q:'A shape has F = 6, V = 8. Find E.',lines:['E = F + V + 2 = 16'],wrong:0,reasons:['From F + V − E = 2, E = F + V − 2 = 12','E = 14','E = 2'],reason:0,fix:'12.'}]}},
