     init:function(box,api){var k='par',T=box.querySelector('#sxT');var EX={par:'Cut a triangle off one end and slide it to the other end. Nothing is lost, so the area stays the same, but now it is a <strong>rectangle</strong> with the same base and height. So a parallelogram’s area is <strong>base × perpendicular height</strong>.',tri:'Two identical triangles fit together to make a <strong>parallelogram</strong> with area b × h. So one triangle is exactly half: <strong>½ × base × height</strong>.',trap:'Two identical trapezia, one turned upside down, make a <strong>parallelogram</strong> with base (a + b) and height h. So one trapezium is half: <strong>½ × (a + b) × h</strong>.'};function draw(){box.querySelector('.sxSvg').innerHTML=SHAPEX(k,+T.value/10);box.querySelector('.sxX').innerHTML=EX[k];[].forEach.call(box.querySelectorAll('.sxB'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-k')===k))})}[].forEach.call(box.querySelectorAll('.sxB'),function(b){b.onclick=function(){k=b.getAttribute('data-k');T.value=0;draw()}});T.addEventListener('input',draw);var Q=[{t:'A parallelogram has base 8 cm and perpendicular height 5 cm. Area?',a:40},{t:'A triangle has base 12 cm and height 7 cm. Area?',a:42},{t:'A trapezium has parallel sides 6 cm and 10 cm, and height 4 cm. Area?',a:32}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.sxN').textContent='All done';box.querySelector('.sxQ').textContent='You completed every challenge!';box.querySelector('.sxC').disabled=true;return}box.querySelector('.sxN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.sxQ').textContent=Q[q].t}box.querySelector('.sxC').onclick=function(){var v=+box.querySelector('.sxA').value,fb=box.querySelector('.sxFb');if(v===Q[q].a){fb.className='fb ok sxFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.sxA').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no sxFb';fb.textContent='Not yet. Choose that shape in the transformer and read the formula it reveals.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: deriving area formulas',title:'Learn: areas of parallelograms, triangles and trapezia',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Turn di new shape inna one yuh know already.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The parallelogram',explain:'<p>A {{parallelogram|a quadrilateral with two pairs of parallel sides}} looks like a rectangle that has been pushed over. How do we find its area? Here is a clever trick: turn it into something we already know how to measure.</p><p>Cut a right-angled triangle off one end, and slide it to the other end. Nothing is lost and nothing is added, so the area does not change. But now the shape is a rectangle, with the same base and the same height as the parallelogram!</p><p>So the area of a parallelogram is <strong>A = base × height</strong>. One important detail: the height must be the {{perpendicular height|the height measured at a right angle to the base}}, measured straight up from the base at a right angle, not along the slanted side.</p>',visual:SHAPEX('par',1),
     example:{q:'A parallelogram has a base of 9 cm, a slanted side of 6 cm, and a perpendicular height of 5 cm. Find its area.',steps:[{do:'Use base × perpendicular height.'},{do:'A = 9 × 5 = 45 cm².',why:'The slanted side (6 cm) is not the height, so we do not use it.'}]},
     mistake:'Multiplying by the slanted side instead of the perpendicular height. The height must meet the base at a right angle.',
     check:{q:'A parallelogram has base 10 m and perpendicular height 4 m. Area?',o:['40 m²','14 m²','20 m²'],a:0,why:'10 × 4 = 40 m².',hint:'Base × height.'}},
    {title:'The triangle',explain:'<p>Now that you know the parallelogram, triangles are easy. Take any triangle and make an identical copy. Turn the copy around and fit it against the first one. Together, they always make a parallelogram, with the same base and height as the triangle.</p><p>The parallelogram’s area is b × h, and it is made of exactly two triangles. So one triangle is half of it:</p><p><strong>A = ½ × base × height = ½bh</strong></p><p>This is why the triangle formula has a ½ in it. As with the parallelogram, the height is the perpendicular height, straight up from the base to the opposite corner.</p>',visual:SHAPEX('tri',1),
     example:{q:'A triangular garden bed has a base of 6 m and a height of 4 m. Find its area.',steps:[{do:'A = ½ × 6 × 4.'},{do:'= ½ × 24 = 12 m².',why:'A triangle is half of the matching parallelogram.'}]},
     mistake:'Forgetting the ½. Without it, you have found the area of the whole parallelogram, two triangles.',
     check:{q:'A triangle has base 14 cm and height 10 cm. Area?',o:['70 cm²','140 cm²','24 cm²'],a:0,why:'½ × 14 × 10 = 70.',hint:'Do not forget the ½.'}},
    {title:'The trapezium',explain:'<p>A {{trapezium|a quadrilateral with exactly one pair of parallel sides}} has two parallel sides of different lengths; let’s call them a and b. The same copy-and-flip trick works again.</p><p>Make a copy, turn it upside down, and fit it beside the first. Together they make a parallelogram. Its base is a + b, because the short side of one sits next to the long side of the other. Its height is h. So the parallelogram has area (a + b) × h, and one trapezium is half of that:</p><p><strong>A = ½ × (a + b) × h</strong></p><p>In words: add the parallel sides, multiply by the height, then halve.</p>',visual:SHAPEX('trap',1),
     example:{q:'A trapezium-shaped field has parallel sides of 30 m and 50 m, and a height of 20 m. Find its area.',steps:[{do:'Add the parallel sides: 30 + 50 = 80 m.'},{do:'Multiply by the height: 80 × 20 = 1,600.'},{do:'Halve it: 1,600 ÷ 2 = 800 m².'}]},
     mistake:'Using the slanted (non-parallel) sides. Only the two PARALLEL sides go in the bracket.',
     check:{q:'A trapezium has parallel sides 6 cm and 10 cm, and height 5 cm. Area?',o:['40 cm²','80 cm²','30 cm²'],a:0,why:'½ × 16 × 5 = 40.',hint:'Add the parallel sides first.'}}]}]},
  {phase:'explain',name:'Teach: surface area, volume and capacity',title:'Learn: surface area, volume, capacity and units',lead:'Next, solids: how much material covers them, how much they hold, and how to convert the units.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Surface area cover di outside. Volume fill up di inside.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Total surface area',explain:'<p>Imagine you need to paint the outside of a box, or wrap it like a gift. How much paint or paper do you need? That is its {{total surface area|the total area of all the faces of a solid}}: the total area of all its faces.</p><p>The easiest way is to picture the solid unfolded into its net, then add up the area of every piece. A <strong>cube</strong> has 6 equal square faces: 6 × side². A <strong>cuboid</strong> has 3 pairs of matching rectangles: 2(lw + lh + wh). A <strong>cylinder</strong> has 2 circles and 1 rectangle that wraps around: 2πr² + 2πrh. A <strong>triangular prism</strong> has 2 triangles (½bh each) and 3 rectangles.</p><p>The secret is to be organised: list every face, find each area, and add them all.</p>',
     example:{q:'Find the total surface area of a cuboid box 5 cm by 4 cm by 3 cm.',steps:[{do:'Top and bottom: 5 × 4 = 20 each, so 40.'},{do:'Front and back: 5 × 3 = 15 each, so 30. Two sides: 4 × 3 = 12 each, so 24.'},{do:'Total: 40 + 30 + 24 = 94 cm².'}]},
     mistake:'Counting only three faces. A cuboid has SIX faces, so remember to double.',
     check:{q:'What is the total surface area of a cube with sides of 4 cm?',o:['96 cm²','64 cm²','16 cm²'],a:0,why:'6 × 16 = 96.',hint:'6 faces, each 4 × 4.'}},
    {title:'Volume of prisms, cylinders and composite solids',explain:'<p>{{Volume|the space inside a solid, in cubic units}} is the space inside a solid, measured in cubic units, such as cm³ or m³.</p><p>For any {{prism|a solid with the same cross-section all along}}, a solid with the same shape all the way through, the rule is: <strong>volume = area of the cross-section × length</strong>. A cuboid is a prism with a rectangle cross-section, so V = l × w × h. A cylinder is a prism with a circle cross-section, so V = πr²h. A triangular prism has a triangle cross-section: V = ½bh × length.</p><p>For a {{composite solid|a solid made by joining simpler solids}}, made of two or more simpler solids, find each volume and add them.</p><p>And before calculating, it is smart to <strong>estimate</strong>: round the measurements to get a rough answer, so you can spot a mistake.</p>',visual:TANK,
     example:{q:'The school tank is 2 m long, 1.5 m wide and 1 m high. Find its volume.',steps:[{do:'It is a cuboid: V = l × w × h.'},{do:'V = 2 × 1.5 × 1 = 3 m³.'},{do:'Estimate check: about 2 × 2 × 1 = 4 m³, so 3 m³ is sensible.'}]},
     mistake:'Using the formula for area (square units) when you need volume (cubic units). Volume needs THREE measurements multiplied.',
     check:{q:'A cylinder has radius 7 cm and height 10 cm. Volume? (π = 22/7)',o:['1,540 cm³','440 cm³','154 cm³'],a:0,why:'154 × 10 = 1,540 cm³.',hint:'πr² × h.'}},
    {title:'Capacity and converting cubic units',explain:'<p>{{Capacity|how much a container holds, often in litres}} is how much a container can hold, usually in litres or millilitres. It links neatly to volume: <strong>1 cm³ holds exactly 1 mL</strong>, and so <strong>1,000 cm³ = 1 litre</strong>.</p><p>Converting cubic units needs care. In Grade 7 you saw that 1 m² = 100 × 100 = 10,000 cm², because an area has two directions. A volume has <strong>three</strong> directions, so 1 m³ = 100 × 100 × 100 = <strong>1,000,000 cm³</strong>.</p><p>Put those together: 1 m³ = 1,000,000 cm³ = 1,000,000 mL = <strong>1,000 litres</strong>. That is a handy fact to remember for water tanks.</p>',
     example:{q:'The school tank has a volume of 3 m³. How many litres does it hold?',steps:[{do:'1 m³ = 1,000 litres.',why:'1 m³ = 1,000,000 cm³, and 1,000 cm³ = 1 L.'},{do:'3 m³ = 3 × 1,000 = 3,000 litres.'},{do:'Was your prediction right?'}]},
     mistake:'Thinking 1 m³ = 100 cm³. A cubic metre is 100 cm long, 100 cm wide AND 100 cm high: 1,000,000 cm³.',
     check:{q:'How many litres are in 2,500 cm³?',o:['2.5 L','25 L','250 L'],a:0,why:'1,000 cm³ = 1 L, so 2,500 cm³ = 2.5 L.',hint:'Divide by 1,000.'}}]},{type:'recall',text:'The tank holds 3,000 litres: 2 × 1.5 × 1 = 3 m³, and each cubic metre holds 1,000 litres.'}]},

   blocks:[{type:'facts',facts:[{title:'Areas',text:'Parallelogram: bh. Triangle: ½bh. Trapezium: ½(a + b)h. Always use the perpendicular height.'},{title:'Surface area',text:'Add the area of every face. Cube: 6s². Cuboid: 2(lw + lh + wh). Cylinder: 2πr² + 2πrh.'},{title:'Volume',text:'Prism: cross-section area × length. Cuboid: lwh. Cylinder: πr²h. Composite: add the parts.'},{title:'Units',text:'1 cm³ = 1 mL; 1,000 cm³ = 1 L; 1 m³ = 1,000,000 cm³ = 1,000 L.'}]},
