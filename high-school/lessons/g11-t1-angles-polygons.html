B:GSK('Sketch B: the 110 degree label is on the angle BELOW the bottom bar, to the left of the brace',SC.arc(74.5,100,18,180,250,'#c02d5f'),'<text x="30" y="122" font-size="10" font-weight="700" fill="#8f1f2b">110°?</text>'),
C:GSK('Sketch C: the 110 degree label is on the angle between the bars, on the same side as the 70 degree angle',SC.arc(74.5,100,18,70,180,'#c02d5f'),'<text x="34" y="92" font-size="10" font-weight="700" fill="#8f1f2b">110°</text>')};
var GFB={A:'Not this one. That angle is between the bars but on the OTHER side of the brace from the 70°. With the 70° it makes a Z shape: they are alternate angles, so this one is also 70°, not 110°.',B:'Not this one. That angle is below the bottom bar, in the same position as the 70° at the top bar: they are corresponding angles (an F shape), so it is also 70°.',C:'Yes! This angle is between the bars and on the same side of the brace as the 70°: they are co-interior angles (a C shape), so they add to 180°. 180° − 70° = 110°.'};
var GATE=function(th){var R=Math.PI/180,T=[300,70],dx=-120/Math.tan(th*R),B=[T[0]+dx,190],s='<svg viewBox="0 0 520 250" role="img" aria-label="A gate with two parallel bars and a diagonal brace making '+th+' degrees with the top bar"><rect width="520" height="250" fill="#faf8fe"/>';s+='<rect x="30" y="64" width="460" height="12" rx="3" fill="#5d5478"/><rect x="30" y="184" width="460" height="12" rx="3" fill="#5d5478"/><rect x="24" y="52" width="10" height="160" fill="#3d2a73"/><rect x="486" y="52" width="10" height="160" fill="#3d2a73"/>';var ex=12/Math.tan(th*R);s+='<line x1="'+(B[0]-ex)+'" y1="202" x2="'+(T[0]+ex)+'" y2="58" stroke="#a85d00" stroke-width="9" stroke-linecap="round"/>';s+=SC.arc(T[0],T[1],34,180,180+th,'#155c35')+SC.t(T[0]-44,T[1]+30,th+'°','#155c35',15,'end',1)+SC.arc(B[0],B[1],34,th,180,'#c02d5f')+SC.t(B[0]-40,B[1]-14,(180-th)+'°','#8f1f2b',15,'end',1)+SC.arc(B[0],B[1],46,0,th,'#2f5fc4')+SC.t(B[0]+52,B[1]-10,th+'°','#1f4a9c',13,'start',1);return s+SC.t(260,236,'green + red: co-interior (add to 180°)   ·   blue: alternate to the green (equal)','#3d2a73',12,'middle')+'</svg>'};
var STORY_G=STORYBLOCK({story:'"A welder in Spanish Town builds a gate with two parallel bars and a diagonal brace. The brace meets the top bar at 70°, measured between the bars, to the left of the brace." Which sketch correctly marks the 110° angle at the bottom bar?',sk:GSKS,fb:GFB,correct:'C',p2title:'Swing the brace.',p2lead:'Change the angle the brace makes with the top bar. Watch the co-interior angle (red) and the alternate angle (blue) at the bottom bar.',p2html:'<div class="controls"><label for="gbT">Brace angle at the top bar:</label><input type="range" id="gbT" min="40" max="140" step="5" value="70"><output class="big gbTO"></output></div><div class="scene gbSvg"></div><div class="tile gbOut" aria-live="polite"></div>',goal:'set the brace so that the two co-interior angles are EQUAL',done:'At 90°, both co-interior angles are 90°: the brace is perpendicular to both bars. Whatever the angle, co-interior angles always add to 180°.',
 p2init:function(box,api,ok){var T=box.querySelector('#gbT');api.nudges(T);function draw(){var t=+T.value;box.querySelector('.gbTO').textContent=t+'°';box.querySelector('.gbSvg').innerHTML=GATE(t);box.querySelector('.gbOut').innerHTML='Top bar: <strong>'+t+'°</strong>. Bottom bar, same side (co-interior): <strong>'+(180-t)+'°</strong>, because '+t+' + '+(180-t)+' = 180. Bottom bar, other side (alternate): <strong>'+t+'°</strong>.';if(t===90)ok()}T.addEventListener('input',draw);draw()}});

 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 11, Term 1',unit:'Module 2: Geometry and Trigonometry 1',strand:'Geometry and Trigonometry',standard:'Module 2, Geometry and Trigonometry 1: appreciate the notion of space as a set of points with subsets of that set (space) having properties related to other mathematical systems; understand the properties and relationship among geometrical objects.',
  objectives:['4.1 explain concepts relating to geometry;','4.5 identify the type(s) of symmetry possessed by a given plane figure;','4.6 solve geometric problems using properties of: (a) lines, angles, and polygons;'],
  focus:'Points, lines, parallel, intersecting and perpendicular lines, line segments, rays, curves and planes; types of angles; faces, edges and vertices; adjacent angles, angles at a point, supplementary, complementary and vertically opposite angles; parallel lines and transversals (alternate, corresponding and co-interior angles); types of triangles and quadrilaterals and their properties; interior and exterior angles of polygons; lines of symmetry, rotational symmetry and its order.',

 glossary:[['Ray','Part of a line that starts at a point and goes on forever in one direction.'],['Line segment','Part of a line between two endpoints.'],['Plane','A flat surface that goes on forever.'],['Supplementary','Two angles that add up to 180°.'],['Complementary','Two angles that add up to 90°.'],['Vertically opposite angles','Equal angles opposite each other where two lines cross.'],['Transversal','A line that crosses two or more other lines.'],['Alternate angles','"Z" angles between parallel lines: equal.'],['Corresponding angles','"F" angles in matching positions: equal.'],['Co-interior angles','"C" angles between parallel lines: add up to 180°.'],['Line of symmetry','A line that divides a shape into two mirror-image halves.'],['Order of rotational symmetry','How many times a shape fits onto itself in one full turn.']],
 teacher:{time:'about 100 minutes over two or three periods',flow:[['Engage','8 min','The bridge railings: are all these angles really equal?','Photograph real railings or grilles.'],['Explore','20 min','Angle and polygon explorer.','Ask: "Which pairs are equal and which add to 180°?"'],['Explain','45 min','Basic concepts and angle facts; polygons and symmetry; I do, we do, you do.','Use GeoGebra as the syllabus suggests.'],['Elaborate','20 min','Challenge Zone and Bronze to Gold problems.','Students give reasons for every angle.'],['Evaluate','10 min','Quiz and reflection.','Insist on reasons, as CSEC requires.']],

  {phase:'explore',name:'Picture it: the welder’s gate',title:'Picture it: which angle is which?',lead:'Angle problems go wrong most often when the right angle is marked in the wrong place. Start here: choose the sketch that marks the gate’s 110° angle correctly, then swing the brace and watch the angle pairs.',

  {phase:'explore',name:'Angle and polygon explorer',title:'Explore: angles and polygons',lead:'Part 1: two parallel lines are cut by a transversal. Change its angle and choose a type of angle pair to highlight. Part 2: choose a regular polygon and see its angles and symmetry.',
   mission:['Highlight each pair type. Which pairs are equal, and which add up to 180°?','Try polygons with more and more sides. What happens to the exterior angle?','Complete all 3 challenges for a star.'],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="apT">Transversal angle:</label><input type="range" id="apT" min="30" max="150" value="70"><output class="big apTO"></output><label for="apP">Highlight:</label><select id="apP"><option value="alt">Alternate (Z): c and f</option><option value="cor">Corresponding (F): b and f</option><option value="co">Co-interior (C): d and f</option><option value="vo">Vertically opposite: b and c</option></select></div><div class="scene apSvg"></div><div class="explain apX" aria-live="polite"></div><div class="controls"><label for="apN">Regular polygon, number of sides:</label><input type="range" id="apN" min="3" max="12" value="6"><output class="big apNO"></output></div><div class="scene apPoly"></div><div class="tile apPO" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge apNN"></span> <strong class="apQ"></strong></p><div class="controls"><input type="number" class="apIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go apC">Check</button></div><div class="fb apFb" aria-live="polite">Use the explorer to help you.</div></div>',
     init:function(box,api){var T=box.querySelector('#apT'),P=box.querySelector('#apP'),N=box.querySelector('#apN');api.nudges(T);api.nudges(N);var pairs={alt:['c','f'],cor:['b','f'],co:['d','f'],vo:['b','c']};function draw(){var t=+T.value,p=P.value,n=+N.value;box.querySelector('.apTO').textContent=t+'°';box.querySelector('.apNO').textContent=n;box.querySelector('.apSvg').innerHTML=PAR(t,pairs[p]);var e={alt:'<strong>Alternate angles</strong> (a "Z" shape) are <strong>equal</strong>.',cor:'<strong>Corresponding angles</strong> (an "F" shape) are <strong>equal</strong>.',co:'<strong>Co-interior angles</strong> (a "C" or "U" shape) <strong>add up to 180°</strong>: '+t+'° + '+(180-t)+'° = 180°.',vo:'<strong>Vertically opposite angles</strong> are <strong>equal</strong>.'}[p];box.querySelector('.apX').innerHTML=e;box.querySelector('.apPoly').innerHTML=POLY(n);var sum=(n-2)*180;box.querySelector('.apPO').innerHTML='<strong>'+(PN[n]||n+'-sided regular polygon')+'</strong><br>Interior angle sum = ('+n+' − 2) × 180° = <strong>'+sum+'°</strong>; each interior angle = '+(Math.round(sum/n*100)/100)+'°<br>Each exterior angle = 360° ÷ '+n+' = <strong>'+(Math.round(360/n*100)/100)+'°</strong> (the exterior angles always add to 360°)<br><strong>Symmetry:</strong> '+n+' lines of symmetry (dashed); rotational symmetry of order '+n+'.'}[T,P,N].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var Q=[{t:'The transversal makes 70°. What is the co-interior angle to it?',a:110},{t:'What is each interior angle of a regular hexagon?',a:120},{t:'What is the order of rotational symmetry of a regular pentagon?',a:5}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.apNN').textContent='All done';box.querySelector('.apQ').textContent='You completed every challenge!';box.querySelector('.apC').disabled=true;return}box.querySelector('.apNN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.apQ').textContent=Q[q].t}box.querySelector('.apC').onclick=function(){var v=parseFloat(box.querySelector('.apIn').value),fb=box.querySelector('.apFb');if(v===Q[q].a){fb.className='fb ok apFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.apIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no apFb';fb.textContent='Not yet. Set up the explorer to match the question.'}};draw();task()}},
    {type:'recall',text:'The bottom angle is 110°: co-interior angles between parallel lines add up to 180°, so 180° − 70° = 110°.'}]},
  {phase:'explain',name:'Teach: concepts and angle facts',title:'Learn: basic geometry and angle facts',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Every angle need a reason.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The language of geometry',explain:PIC('Walk along a street in Kingston and geometry is everywhere. The two edges of a straight road are parallel lines. A side street crosses it: intersecting lines. A light pole stands perpendicular to the pavement. A beam of sunlight starts at the sun and travels on: a ray. A plank of wood has two ends: a line segment.',SCN['The language of geometry'])+'<p>Geometry has its own precise vocabulary. A <strong>point</strong> marks a position. A <strong>line</strong> goes on forever in both directions; a {{ray|starts at a point and goes on forever one way}} starts at a point and goes on forever in one direction; a {{line segment|part of a line between two endpoints}} has two endpoints. A {{plane|a flat surface that goes on forever}} is a flat surface that goes on forever, like an endless sheet of paper.</p><p>Lines can be <strong>parallel</strong> (never meet, always the same distance apart), <strong>intersecting</strong> (cross at a point) or <strong>perpendicular</strong> (cross at 90°).</p><p>Angles are named by size: <strong>acute</strong> (less than 90°), <strong>right</strong> (90°), <strong>obtuse</strong> (between 90° and 180°), <strong>straight</strong> (180°) and <strong>reflex</strong> (more than 180°). For solids, count the <strong>faces</strong> (flat surfaces), <strong>edges</strong> (where faces meet) and <strong>vertices</strong> (corners). A cube has 6 faces, 12 edges and 8 vertices.</p>'+WHY('Why so many precise words? In geometry, a small difference in meaning changes the answer. A line goes on forever, so it has no length; a segment has two endpoints, so it can be measured. Precise words let a builder, an architect and a student all mean exactly the same thing.')+WORK('<strong>Architects and draughtsmen</strong> use this vocabulary on every plan. <strong>Road engineers</strong> design parallel lanes and perpendicular junctions. <strong>Surveyors</strong> mark boundary lines and points on land titles.'),
     example:{q:'How many faces, edges and vertices does a triangular prism have?',steps:[{do:'Faces: 2 triangles + 3 rectangles = 5.'},{do:'Edges: 3 on each triangle + 3 joining them = 9.'},{do:'Vertices: 3 on each triangle = 6. (Check: faces + vertices − edges = 5 + 6 − 9 = 2 ✓)'}]},
     mistake:'Confusing a ray with a line segment. A ray has ONE endpoint; a segment has TWO.',
     check:{q:'An angle of 200° is…',o:['reflex','obtuse','straight'],a:0,why:'More than 180°.',hint:'Bigger than a straight line.'}},
    {title:'Angles at a point, on a line, and where lines cross',explain:PIC('Two roads cross at Half Way Tree. Stand in the middle of the junction and turn all the way round: you turn through 360°, the angles at a point. The corners opposite each other across the junction are equal: if one corner is 105°, the opposite corner is also 105°, and the two neighbouring corners are 75° each.',SCN['Angles at a point, on a line, and where lines cross'])+'<p>Three facts solve most angle problems:</p><p>• Angles on a straight line add to <strong>180°</strong>. Two angles that add to 180° are {{supplementary|adding to 180°}}.<br>• Angles at a point add to <strong>360°</strong>.<br>• Where two lines cross, the {{vertically opposite|equal angles opposite each other where lines cross}} angles are <strong>equal</strong>.</p><p>Two angles that add to <strong>90°</strong> are {{complementary|adding to 90°}}. <strong>Adjacent</strong> angles share a vertex and an arm, sitting side by side.</p><p>CSEC questions ask you to <strong>determine and justify</strong> angles, so always give a reason, such as “angles on a straight line”, next to each step.</p>'+WHY('Why are vertically opposite angles equal? Each angle and the angle next to it lie on a straight line, so they add to 180°. The opposite angle ALSO adds to 180° with that same neighbour. Two angles that make 180° with the same angle must be equal to each other.')+WORK('<strong>Road and traffic engineers</strong> design junction angles so that drivers can see and turn safely. <strong>Carpenters</strong> use angles on a straight line when cutting joints. <strong>Navigators</strong> use the full turn of 360°.'),
     example:{q:'Two lines cross. One angle is 3x and the angle next to it is x + 40. Find x and all four angles.',steps:[{do:'Adjacent angles on a straight line: 3x + x + 40 = 180, so 4x = 140 and x = 35.'},{do:'The angles are 3(35) = 105° and 35 + 40 = 75°.'},{do:'Vertically opposite angles are equal: 105°, 75°, 105°, 75°.'}]},
     mistake:'Writing an answer with no reason. CSEC marks the reasoning as well as the number.',
     check:{q:'Angles at a point are 90°, 130° and x. What is x?',o:['140°','40°','220°'],a:0,why:'360 − 90 − 130.',hint:'They add to 360°.'}},
    {title:'Parallel lines and transversals',explain:PIC('A welder builds a gate: two horizontal bars, perfectly parallel, and a diagonal brace across them. The brace is a transversal. Where it meets each bar, it makes four angles, and the angles at the top bar are copies of the angles at the bottom bar. Knowing one angle tells the welder all eight.',SCN['Parallel lines and transversals'])+'<p>A {{transversal|a line crossing two or more lines}} is a line that crosses two (or more) parallel lines. It creates eight angles, in two matching groups, as you saw in the explorer.</p><p>• {{Alternate angles|"Z" angles: equal}} (a “Z” shape) are <strong>equal</strong>.<br>• {{Corresponding angles|"F" angles: equal}} (an “F” shape) are <strong>equal</strong>.<br>• {{Co-interior angles|"C" angles: add to 180°}} (a “C” or “U” shape, between the lines on the same side) <strong>add up to 180°</strong>.</p><p>For the welder’s gate: the brace makes 70° with the top bar, so the co-interior angle at the bottom bar is 180° − 70° = 110°, and the alternate angle on the other side is 70°.</p>'+WHY('Why are corresponding angles equal? Slide the top bar straight down onto the bottom bar, keeping it parallel: the brace crosses it at exactly the same angle, so the angles in matching positions must be equal. Alternate angles are then equal because each one is vertically opposite a corresponding angle; and co-interior angles add to 180° because each pair makes a straight line with an equal angle.')+WORK('<strong>Welders and metalworkers</strong> cut braces at the right angle for gates and grilles. <strong>Carpenters</strong> build stair rails parallel to the stairs. <strong>Car-park designers</strong> paint parking bays as parallel lines at the same angle to the road.'),visual:PAR(70,['d','f']),
     example:{q:'Parallel lines are cut by a transversal. One angle is 2x + 10 and its co-interior angle is 3x − 30. Find x.',steps:[{do:'Co-interior angles add to 180°: 2x + 10 + 3x − 30 = 180.'},{do:'5x − 20 = 180, so 5x = 200.'},{do:'x = 40. The angles are 90° and 90°.'}]},
     mistake:'Thinking co-interior angles are equal. They ADD UP TO 180°.',
     check:{q:'Alternate angles between parallel lines are…',o:['equal','supplementary','complementary'],a:0,why:'"Z" angles are equal.',hint:'The Z shape.'}}]}]},
  {phase:'explain',name:'Teach: polygons and symmetry',title:'Learn: triangles, quadrilaterals, polygons and symmetry',lead:'Next, the properties of shapes, and their symmetry.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Exterior angle dem always add to 360.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Triangles and quadrilaterals',explain:PIC('Look up at the roof of a house: the end of the roof (the gable) is often an isosceles triangle, with two equal sloping sides. The windows are rectangles. And at Easter, the kites flying over Jamaica are, of course, kites: two pairs of equal sides next to each other. Each shape’s properties tell the builder what to measure.',SCN['Triangles and quadrilaterals'])+'<p><strong>Triangles</strong> are classified by sides: <strong>equilateral</strong> (3 equal sides, all angles 60°), <strong>isosceles</strong> (2 equal sides, 2 equal base angles) or <strong>scalene</strong> (no equal sides); and by angles: <strong>acute</strong>, <strong>right</strong> or <strong>obtuse</strong>. The angles add up to 180°, and the exterior angle of a triangle equals the sum of the two interior opposite angles.</p><p><strong>Quadrilaterals</strong> have angles adding to 360°. Key properties:<br>• <strong>Square</strong>: 4 equal sides, 4 right angles, diagonals equal and perpendicular.<br>• <strong>Rectangle</strong>: 4 right angles, diagonals equal.<br>• <strong>Rhombus</strong>: 4 equal sides, diagonals perpendicular.<br>• <strong>Parallelogram</strong>: opposite sides equal and parallel, opposite angles equal.<br>• <strong>Kite</strong>: two pairs of equal adjacent sides, diagonals perpendicular.<br>• <strong>Trapezium</strong>: exactly one pair of parallel sides.</p>'+WHY('Why do a triangle’s angles add to 180°? Draw a line through the top corner, parallel to the base. The two bottom angles of the triangle are alternate angles to the two angles beside the top corner, and together with the top angle they make a straight line: 180°. A quadrilateral splits into two triangles, so its angles add to 2 × 180° = 360°.')+WORK('<strong>Roofers and carpenters</strong> build isosceles roof trusses. <strong>Window makers</strong> check that frames are true rectangles by measuring the diagonals. <strong>Kite makers</strong> use the symmetry of the kite shape so the kite flies straight.'),
     example:{q:'In isosceles triangle PQR, PQ = PR and angle P = 40°. Find angle Q.',steps:[{do:'PQ = PR, so the base angles Q and R are equal.'},{do:'Q + R = 180° − 40° = 140°.'},{do:'Q = 70°. (Reason: base angles of an isosceles triangle.)'}]},
     mistake:'Thinking all parallelograms have right angles. Only rectangles and squares do.',
     check:{q:'A parallelogram has one angle of 65°. What is the angle next to it?',o:['115°','65°','25°'],a:0,why:'Co-interior angles: 180 − 65.',hint:'Adjacent angles in a parallelogram.'}},
    {title:'Interior and exterior angles of polygons',explain:PIC('Picture yourself walking around the outside of a hexagonal gazebo in a park in Montego Bay. At each corner, you turn a little to follow the next side. By the time you are back where you started, facing the same way, you have turned through exactly one full turn: 360°. Those turns are the exterior angles.',SCN['Interior and exterior angles of polygons'])+'<p>Any polygon with n sides can be split into (n − 2) triangles from one vertex, so its <strong>interior angles add up to (n − 2) × 180°</strong>. A pentagon: 3 × 180° = 540°. A hexagon: 720°.</p><p>The <strong>exterior angles</strong> of any polygon (one at each vertex) always add up to <strong>360°</strong>. Imagine walking around the shape: by the time you return to the start, you have turned through one full turn.</p><p>For a <strong>regular</strong> polygon (all sides and angles equal): each exterior angle = 360° ÷ n, and each interior angle = 180° − exterior angle. You can also work backwards: if each exterior angle is 30°, the polygon has 360 ÷ 30 = 12 sides.</p>'+WHY('Why do the exterior angles always add to 360°? Walking once around any polygon and returning to face your starting direction is exactly one full turn, whatever the shape. For the interior angles, split the polygon into triangles from one corner: an n-sided polygon makes n − 2 triangles, so the interior angles add to (n − 2) × 180°.')+WORK('<strong>Builders</strong> cut the joints of hexagonal gazebos and octagonal rooms at exact angles. <strong>Tile layers</strong> know which regular polygons fit together with no gaps. <strong>Game and logo designers</strong> draw regular polygons on computers.'),visual:POLY(8),
     example:{q:'Find each interior angle of a regular octagon.',steps:[{do:'Exterior angle = 360° ÷ 8 = 45°.'},{do:'Interior angle = 180° − 45° = 135°.'},{do:'Check: 8 × 135° = 1,080° = (8 − 2) × 180° ✓'}]},
     mistake:'Using (n − 2) × 180° for the EXTERIOR angles. Exterior angles always add to 360°.',
     check:{q:'Each exterior angle of a regular polygon is 40°. How many sides?',o:['9','40','140'],a:0,why:'360 ÷ 40.',hint:'Exterior angles add to 360°.'}},
    {title:'Line symmetry and rotational symmetry',explain:PIC('Look at the Jamaican flag. Fold it along its horizontal centre line and the two halves match; fold it along its vertical centre line and they match again: two lines of symmetry. Turn it upside down (a half turn) and it looks exactly the same: rotational symmetry of order 2. A ceiling fan with three identical blades fits onto itself three times in a full turn: order 3.',SCN['Line symmetry and rotational symmetry'])+'<p>A shape has a {{line of symmetry|a line dividing a shape into mirror-image halves}} if folding along that line makes the two halves match exactly. A square has 4; a rectangle has only 2 (the diagonals are NOT lines of symmetry); an isosceles triangle has 1.</p><p>A shape has <strong>rotational symmetry</strong> if it looks the same after being turned through less than a full turn about its centre. The {{order of rotational symmetry|how many times a shape fits onto itself in one full turn}} is the number of times it fits onto itself in one full turn. A square has order 4; a rectangle has order 2; a shape with no rotational symmetry has order 1.</p><p>A <strong>regular polygon</strong> with n sides has <strong>n lines of symmetry</strong> and rotational symmetry of <strong>order n</strong>.</p>'+WHY('Why does a regular polygon with n sides have n lines of symmetry and order n? All its sides and angles are equal, so turning it through 360° ÷ n moves every corner onto the next one, and it fits exactly, n times in a full turn. Each line through a corner (or the middle of a side) and the centre is a mirror line.')+WORK('<strong>Graphic designers</strong> use symmetry in logos and flags. <strong>Engineers</strong> design fans, wheels and propellers with rotational symmetry so that they spin smoothly. <strong>Fashion and fabric designers</strong> build repeating, symmetrical patterns.'),
     example:{q:'Describe the symmetry of a parallelogram (that is not a rectangle or rhombus).',steps:[{do:'Lines of symmetry: none. Folding never makes the halves match.'},{do:'Rotational symmetry: a half turn (180°) about the centre makes it fit onto itself.'},{do:'So: 0 lines of symmetry, rotational symmetry of order 2.'}]},
     mistake:'Thinking the diagonals of a rectangle are lines of symmetry. Fold one and see: the halves do not match.',
     check:{q:'What is the order of rotational symmetry of a regular hexagon?',o:['6','3','2'],a:0,why:'It fits onto itself 6 times in a full turn.',hint:'n for a regular n-gon.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Angle facts',text:'On a line: 180°. At a point: 360°. Vertically opposite: equal. Complementary: 90°.'},{title:'Parallel lines',text:'Alternate (Z): equal. Corresponding (F): equal. Co-interior (C): add to 180°.'},{title:'Polygons',text:'Triangle 180°; quadrilateral 360°; n-gon (n − 2) × 180°. Exterior angles add to 360°; regular: 360° ÷ n.'},{title:'Symmetry',text:'Regular n-gon: n lines, order n. Rectangle: 2 lines, order 2. No rotational symmetry = order 1.'}]},

    {icon:'🧱',title:'The tile layer: which tiles fit?',desc:'Decide which regular tiles can cover a floor with no gaps.',level:'⭐⭐ Building',mins:6,block:{type:'mission',story:'A tile layer in Portmore wants to cover a patio with identical regular tiles, meeting at points with no gaps. The angles that meet at each point must add up to exactly 360°.',parts:[{q:'What is each interior angle of a regular hexagon? (degrees)',a:120,hint:'180 − 360 ÷ 6.',sol:'120°.',placeholder:'degrees'},{q:'How many hexagons meet at each point?',a:3,hint:'360 ÷ 120.',sol:'3.'},{q:'What is each interior angle of a regular pentagon? (degrees)',a:108,hint:'180 − 360 ÷ 5.',sol:'108°.',placeholder:'degrees'},{q:'Can regular pentagons cover the patio with no gaps? (Type yes or no.)',a:['no'],hint:'Is 360 ÷ 108 a whole number?',sol:'No: 360 ÷ 108 ≈ 3.33, so pentagons leave gaps.'},{q:'Which regular tile with MORE sides than a square will work? (Type the number of sides.)',a:6,hint:'Its interior angle must divide exactly into 360.',sol:'The hexagon (6 sides): three 120° angles make 360°.'}],done:'The interior angle decided the tiles. That is why so many floors and honeycombs use hexagons.'}},
    {icon:'🏠',title:'The carpenter: a roof truss',desc:'Check a roof truss against the design brief.',level:'⭐⭐ Carpentry',mins:6,block:{type:'mission',story:'A carpenter in Mandeville builds an isosceles roof truss. The angle at the top (the apex) is 110°. The design brief asks for each sloping side to make an angle of at least 30° with the horizontal.',parts:[{q:'What do the two base angles add up to? (degrees)',a:70,hint:'180 − 110.',sol:'70°.',placeholder:'degrees'},{q:'What is each base angle? (degrees)',a:35,hint:'Isosceles: the base angles are equal.',sol:'35°.',placeholder:'degrees'},{q:'Does the truss meet the brief of at least 30°? (Type yes or no.)',a:['yes'],hint:'Compare 35° with 30°.',sol:'Yes: 35° is steeper than 30°.'},{q:'The client asks for a flatter roof with an apex of 130°. What would each base angle be? (degrees)',a:25,hint:'(180 − 130) ÷ 2.',sol:'25°.',placeholder:'degrees'},{q:'Would that flatter roof meet the brief? (Type yes or no.)',a:['no'],hint:'Compare 25° with 30°.',sol:'No: 25° is less than 30°, so the carpenter must explain that the apex cannot be wider than 120°.'}],done:'The angle sum of a triangle told the carpenter which designs meet the brief.'}},
    {icon:'⛺',title:'The gazebo builder: cutting the joints',desc:'Find the angles for an octagonal gazebo.',level:'⭐⭐⭐ Construction',mins:7,block:{type:'mission',story:'A builder in Ocho Rios is making a regular octagonal gazebo (8 equal sides) for a hotel garden. Each railing meets the next at a corner.',parts:[{q:'What do the interior angles of an octagon add up to? (degrees)',a:1080,hint:'(8 − 2) × 180.',sol:'1,080°.',placeholder:'degrees'},{q:'What is each interior angle? (degrees)',a:135,hint:'1,080 ÷ 8.',sol:'135°.',placeholder:'degrees'},{q:'What is each exterior angle? (degrees)',a:45,hint:'360 ÷ 8.',sol:'45°.',placeholder:'degrees'},{q:'Each railing is cut so that two meet to make the interior angle. At what angle is the end of each railing cut, if the two cuts are equal? (degrees)',a:67.5,tol:0.01,hint:'Half of 135°.',sol:'67.5°.',placeholder:'degrees'}],done:'Polygon angle facts became the exact cuts in the builder’s saw.'}},
    {icon:'🎨',title:'The logo designer: a turning logo',desc:'Design a logo with rotational symmetry.',level:'⭐⭐ Design',mins:5,block:{type:'mission',story:'A graphic designer creates a logo for a Kingston radio station: 6 identical sound-wave petals arranged evenly around a centre, like a regular hexagon.',parts:[{q:'What is the order of rotational symmetry of the logo?',a:6,hint:'How many times does it fit onto itself in a full turn?',sol:'6.'},{q:'Through what angle must it turn to fit onto itself the first time? (degrees)',a:60,hint:'360 ÷ 6.',sol:'60°.',placeholder:'degrees'},{q:'If each petal is itself symmetrical, how many lines of symmetry does the logo have?',a:6,hint:'Like a regular hexagon.',sol:'6.'},{q:'The station wants a version with exactly 4 petals. Through what angle does that turn to fit onto itself? (degrees)',a:90,hint:'360 ÷ 4.',sol:'90°.',placeholder:'degrees'}],done:'Rotational symmetry made the logo balanced, and the order told the designer how to space the petals.'}}

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire angle facts.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(20,160);return{q:'Co-interior to '+a+'°?',o:[(180-a)+'°',a+'°',(360-a)+'°'],a:0,why:'Add to 180°.'}}if(r===1){var n=[3,4,5,6,8,9,10,12][R(0,7)];return{q:'Each exterior angle of a regular '+n+'-sided polygon?',o:[(360/n)+'°',((n-2)*180/n)+'°',(180/n)+'°'],a:0,why:'360 ÷ '+n+'.'}}var m=R(5,10);return{q:'Interior angle sum of a '+m+'-sided polygon?',o:[((m-2)*180)+'°',(m*180)+'°','360°'],a:0,why:'('+m+' − 2) × 180.'}}}},

    {icon:'🔧',title:'Mission: the welder’s gate',desc:'Design a symmetrical gate for a client in Spanish Town.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A welder in Spanish Town designs a decorative gate. It has two parallel horizontal bars, diagonal braces, and a regular polygon ornament in the middle.',parts:[{q:'A brace meets the top bar at 65°. What is the alternate angle it makes with the bottom bar?',a:65,hint:'Alternate angles are equal.',sol:'65°.',placeholder:'degrees'},{q:'What is the co-interior angle at the bottom bar?',a:115,hint:'They add to 180°.',sol:'115°.',placeholder:'degrees'},{q:'The ornament is a regular octagon. What is each interior angle?',a:135,hint:'180 − 360/8.',sol:'135°.',placeholder:'degrees'},{q:'How many lines of symmetry does the octagon ornament have?',a:8,hint:'Regular n-gon.',sol:'8.'},{q:'Two braces cross, making an angle of 3x + 10 opposite an angle of 70°. Find x.',a:20,hint:'Vertically opposite angles are equal.',sol:'3x + 10 = 70, so x = 20.'}],done:'You used parallel-line angles, polygon angles and symmetry to design a real gate, with a reason for each step.'}}
