     init:function(box,api){var t=box.querySelector('#clT'),a=box.querySelector('#clA'),b=box.querySelector('#clB');api.nudges(a);api.nudges(b);var RULE={tr:'(x, y) → (x + a, y + b)',rx:'(x, y) → (x, −y): the y-coordinate changes sign',ry:'(x, y) → (−x, y): the x-coordinate changes sign',r90:'(x, y) → (−y, x)',r180:'(x, y) → (−x, −y)',r270:'(x, y) → (y, −x)'};function draw(){var k=t.value,o={a:+a.value,b:+b.value},img=TRI.map(function(p){return TF[k](p,o)});box.querySelector('.clV').hidden=k!=='tr';box.querySelector('.clAO').textContent=fm(o.a);box.querySelector('.clBO').textContent=fm(o.b);box.querySelector('.clSvg').innerHTML=PLANE(img,{mx:k==='rx',my:k==='ry',origin:/^r\d/.test(k),vec:k==='tr'});box.querySelector('.clTab').innerHTML='<table class="rec" style="max-width:none"><thead><tr><th>Object</th><th>Image</th></tr></thead><tbody>'+TRI.map(function(p,i){return'<tr><td>'+LAB[i]+pt(p)+'</td><td>'+LAB[i]+'′'+pt(img[i])+'</td></tr>'}).join('')+'</tbody></table><p style="margin:6px 0 0"><strong>Rule:</strong> '+RULE[k]+(k==='tr'?' with vector '+COLV(o.a,o.b):'')+'</p>'}[t,a,b].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});function parse(s){var m=String(s).replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?\d+),(-?\d+)\)?$/);return m?[+m[1],+m[2]]:null}var T=[{t:'Translate triangle ABC by the vector across −5, up 2. What are the coordinates of A′?',a:[-4,3]},{t:'Reflect triangle ABC in the y-axis. What are the coordinates of B′?',a:[-4,1]},{t:'Rotate triangle ABC 90° anticlockwise about the origin. What are the coordinates of B′?',a:[-1,4]}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.clN').textContent='All done';box.querySelector('.clTk').textContent='You completed every challenge!';box.querySelector('.clC').disabled=true;return}box.querySelector('.clN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.clTk').textContent=T[q].t}box.querySelector('.clC').onclick=function(){var p=parse(box.querySelector('.clIn').value),fb=box.querySelector('.clFb');if(!p){fb.className='fb no clFb';fb.textContent='Type coordinates like (2, −3).';return}if(p[0]===T[q].a[0]&&p[1]===T[q].a[1]){fb.className='fb ok clFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.clIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no clFb';fb.textContent='Not yet. Set up the lab for this challenge and read the image coordinates from the table.'}};draw();task()}},

  {phase:'explain',name:'Teach: translations and reflections',title:'Learn: translation vectors and reflections in the axes',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Top number fi across, bottom number fi up an dung.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Translation vectors',explain:'<p>Picture a game character standing on a grid. You press the arrow keys: 5 steps left, then 2 steps up. The character slides to a new spot, still facing the same way and still the same size. That slide is a translation.</p><p>To describe a translation exactly, mathematicians use a {{translation vector|two numbers in a column: the top says how far across, the bottom says how far up or down}}. It is two numbers stacked in a column. The <strong>top</strong> number tells you how far to move <strong>across</strong>: positive means right, negative means left. The <strong>bottom</strong> number tells you how far to move <strong>up or down</strong>: positive means up, negative means down.</p><p>To find where a point lands, just add the vector to its coordinates: add the top number to x, and the bottom number to y. The new shape is called the image, and we label its corners with a little dash: A becomes A′, which we read as “A dash”.</p>',visual:PLANE(TRI.map(function(p){return[p[0]-5,p[1]+2]}),{vec:true,label:'Triangle ABC translated 5 left and 2 up'}),
     example:{q:'Translate A(1, 1), B(4, 1) and C(1, 3) by the vector with top −5 and bottom 2.',steps:[{do:'The vector means 5 to the left and 2 up.',why:'Top = across (− is left); bottom = up (+ is up).'},{do:'A′ = (1 − 5, 1 + 2) = (−4, 3).'},{do:'B′ = (4 − 5, 1 + 2) = (−1, 3), and C′ = (1 − 5, 3 + 2) = (−4, 5).'}]},
     mistake:'Swapping the numbers: the TOP number is always across (x), and the BOTTOM number is always up or down (y).',
     check:{q:'Translate (2, −1) by the vector with top 3 and bottom 4.',o:['(5, 3)','(6, 3)','(5, −5)'],a:0,why:'(2 + 3, −1 + 4) = (5, 3).',hint:'Add the top number to x and the bottom number to y.'}},
    {title:'Finding the translation vector',explain:'<p>Sometimes you see the “before” and “after” pictures, and you have to work out the move. It is like looking at where a chess piece started and where it ended up, and asking, “How did it get there?”</p><p>Pick one corner of the shape, such as A, and find where it ended up, A′. Then ask two questions. How far across did it go? Work out <strong>image x − object x</strong>. How far up or down did it go? Work out <strong>image y − object y</strong>. Those two answers are the top and bottom of the vector.</p><p>Always subtract in that order: where it ended up, minus where it started. If you do it the other way round, you get the move backwards. And because every corner slides the same way in a translation, any corner will give you the same vector, so you can use a second corner to check your answer.</p>',
     example:{q:'A(1, 2) is translated to A′(4, −1). Find the translation vector.',steps:[{do:'Across: 4 − 1 = 3 (3 to the right).'},{do:'Up/down: −1 − 2 = −3 (3 down).'},{do:'The vector has top 3 and bottom −3.',why:'Check: (1 + 3, 2 − 3) = (4, −1) ✓'}]},
     mistake:'Subtracting the wrong way round (object − image). That gives the vector pointing backwards.',
     check:{q:'P(−2, 5) moves to P′(1, 5). What is the vector?',o:['top 3, bottom 0','top −3, bottom 0','top 0, bottom 3'],a:0,why:'Across: 1 − (−2) = 3. Up: 5 − 5 = 0.',hint:'Image minus object.'}},
    {title:'Reflections in the x-axis and y-axis',explain:'<p>Stand in front of a mirror and raise your right hand. Your reflection is exactly the same distance behind the mirror as you are in front of it, just flipped. Reflections on a grid work the same way, except the mirror is one of the axes.</p><p>When we reflect in the <strong>x-axis</strong> (the flat, horizontal line), points flip up and down. A point 2 squares above the line lands 2 squares below it. Its left-right position does not change, so x stays the same and <strong>y changes sign</strong>: (x, y) → (x, −y).</p><p>When we reflect in the <strong>y-axis</strong> (the upright, vertical line), points flip left and right. A point 3 squares to the right lands 3 squares to the left, at the same height. So y stays the same and <strong>x changes sign</strong>: (x, y) → (−x, y).</p><p>A good way to remember: the coordinate that changes is the one that goes ACROSS the mirror line.</p>',visual:PLANE(TRI.map(TF.ry),{my:true,label:'Triangle ABC reflected in the y-axis'}),
     example:{q:'The opening puzzle: reflect (3, 2) in the y-axis. Then reflect (3, 2) in the x-axis.',steps:[{do:'In the y-axis, the point flips left to right, so x changes sign: (−3, 2).',why:'It stays at the same height.'},{do:'In the x-axis, the point flips top to bottom, so y changes sign: (3, −2).'},{do:'Was your prediction right?'}]},
     mistake:'Mixing up the axes. Reflecting in the x-axis changes y (the point flips up or down), not x.',
     check:{q:'Reflect (−4, 5) in the x-axis.',o:['(4, 5)','(−4, −5)','(4, −5)'],a:1,why:'In the x-axis, y changes sign: (−4, −5).',hint:'Which coordinate changes in the x-axis?'}}]}]},
  {phase:'explain',name:'Teach: rotations, views and angles',title:'Learn: rotations about the origin, views of solids, and angle facts',lead:'Next, rotations on the coordinate plane, drawing solids from different viewpoints, and a recap of angle facts.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Anticlockwise mean di opposite way to di clock.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Rotations about the origin',explain:'<p>Think about the hands of a clock turning around the middle, or a fan blade spinning. A rotation turns a shape around a fixed point, called the {{centre of rotation|the fixed point that a shape turns around}}. In this lesson that point is the origin, (0, 0).</p><p>We describe a rotation by how far it turns (90°, 180° or 270°) and which way. {{Anticlockwise|turning the opposite way to the hands of a clock}} means the opposite way to a clock’s hands.</p><p>You could turn the shape with tracing paper every time, but there are handy rules for the coordinates. For a quarter turn (90°) anticlockwise, (x, y) → (−y, x): the numbers swap places and the new first number changes sign. For a half turn (180°), (x, y) → (−x, −y): both signs change, and the shape ends up upside down on the opposite side. For a three-quarter turn (270°) anticlockwise, which is the same as a quarter turn clockwise, (x, y) → (y, −x).</p><p>Do not just memorise these: test one with tracing paper and watch the rule come true.</p>',visual:PLANE(TRI.map(TF.r90),{origin:true,label:'Triangle ABC rotated 90 degrees anticlockwise about the origin'}),
     example:{q:'Rotate B(4, 1) through 90°, 180° and 270° anticlockwise about the origin.',steps:[{do:'90°: (x, y) → (−y, x) gives (−1, 4).'},{do:'180°: (x, y) → (−x, −y) gives (−4, −1).',why:'A half turn changes the sign of both coordinates.'},{do:'270°: (x, y) → (y, −x) gives (1, −4).'}]},
     mistake:'Turning the wrong way. Check: a 90° anticlockwise turn moves a point on the right side of the origin up toward the top.',
     check:{q:'Rotate (2, 5) through 180° about the origin.',o:['(−2, −5)','(5, −2)','(−5, 2)'],a:0,why:'180°: both coordinates change sign.',hint:'A half turn.'}},
    {title:'Views of solids',explain:'<p>Imagine you are designing a new house. The builder needs to know exactly what it looks like, but a 3-D sketch can be hard to measure from. So architects draw the building from three flat viewpoints instead.</p><p>The {{plan|the view of a solid looking straight down from above}} is what you would see if you were a bird flying directly overhead, looking straight down. The front {{elevation|the view of a solid from the front or from the side}} is what you see standing directly in front of it, and the side elevation is what you see from the side. Each view is a flat, 2-D shape.</p><p>Here is the clever part. Some edges are behind other parts of the solid, so you cannot see them from that viewpoint. They are still there, so we draw them, but as <strong>dotted lines</strong> to show they are {{hidden edges|edges that cannot be seen from that viewpoint}}. That way, the builder knows about every edge, even the ones out of sight.</p>',visual:VIEWS,
     example:{q:'Describe the views of the step-shaped block (a long cuboid with a cube on its left end).',steps:[{do:'Plan (top): a long rectangle, with a line where the top of the cube meets the lower part.',why:'From above you see both top surfaces, at different heights.'},{do:'Front: an L-shape, tall on the left (the cube) and lower on the right.'},{do:'Side (from the left): a rectangle the full height of the cube. The step behind it cannot be seen from this side, so its edge is drawn dotted.'}]},
     mistake:'Drawing hidden edges with solid lines. If you cannot see an edge from that viewpoint, it must be dotted.',
     check:{q:'What is the plan of a cylinder standing upright on a table?',o:['A rectangle','A circle','A triangle'],a:1,why:'From directly above, you see the circular top.',hint:'Look down from above.'}},
    {title:'Recap: angles with parallel and crossing lines',explain:'<p>This unit also asks you to work with angles made by crossing lines. You may have met these already in the Lines and Angles lesson, so here is a friendly reminder.</p><p>When two straight lines cross, they make an X shape with four angles. The angles opposite each other across the crossing point are called vertically opposite angles, and they are always <strong>equal</strong>. The angles next to each other sit on a straight line, so they add up to 180°.</p><p>When a third line, called a transversal, crosses two parallel lines, it makes some special pairs. Angles in the same position at each crossing (an F shape) are corresponding angles, and they are equal. Angles tucked inside the parallel lines on opposite sides (a Z shape) are alternate angles, and they are equal too. Angles inside the parallel lines on the same side (a C shape) are co-interior angles, and they add up to 180°.</p><p>For the full interactive lesson, open <strong>Lines and Angles</strong> from All lessons.</p>',
     example:{q:'A transversal crosses two parallel lines. One angle is 70°. Find the alternate angle and the co-interior angle.',steps:[{do:'Alternate angles are equal: 70°.'},{do:'Co-interior angles add up to 180°: 180° − 70° = 110°.'}]},
     mistake:'Thinking co-interior angles are equal. They ADD UP to 180°.',
     check:{q:'Two lines cross. One angle is 55°. What is the vertically opposite angle?',o:['55°','125°','35°'],a:0,why:'Vertically opposite angles are equal.',hint:'Opposite angles at a crossing.'}}]}]},

    {icon:'✏️',title:'Make your own',desc:'Design transformations that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a translation vector (across, up) that moves (1, 1) to (−2, 4). Type it like: −3, 3',placeholder:'across, up',check:function(v){var n=String(v).replace(/−/g,'-').replace(/[()\s]/g,'').split(',').map(Number);return n.length===2&&n[0]===-3&&n[1]===3?{ok:true,msg:'Correct! Across −3 (3 left) and up 3.'}:{ok:false,msg:'Image minus object: −2 − 1 and 4 − 1.'}}},{q:'Type a point (not the origin) that does NOT move when reflected in the y-axis.',placeholder:'(x, y)',check:function(v){var m=String(v).replace(/−/g,'-').replace(/\s/g,'').match(/^\(?(-?\d+),(-?\d+)\)?$/);if(!m)return{ok:false,msg:'Type a point like (0, 4).'};var x=+m[1],y=+m[2];if(x===0&&y===0)return{ok:false,msg:'Choose a point other than the origin.'};return x===0?{ok:true,msg:'Yes! Points on the y-axis (x = 0) stay where they are.'}:{ok:false,msg:'That point moves to ('+(-x)+', '+y+'). Which points sit ON the y-axis?'}}},{q:'Which single rotation about the origin has the same effect as reflecting in the x-axis and then in the y-axis? Type the angle.',placeholder:'degrees',check:function(v){return parseFloat(v)===180?{ok:true,msg:'Yes! (x, y) → (x, −y) → (−x, −y), which is a 180° rotation.'}:{ok:false,msg:'Follow a point through both reflections, then compare with the rotation rules.'}}}]}},
