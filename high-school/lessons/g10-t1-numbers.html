 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Number Theory and Computation',strand:'Number Theory and Computation',standard:'Module 1, Number Theory and Computation: demonstrate computational skills; demonstrate the ability to use rational approximations of real numbers; demonstrate the ability to use number properties to solve problems.',

 glossary:[['Natural numbers (ℕ)','The counting numbers: 1, 2, 3, …'],['Whole numbers (𝕎)','The natural numbers and zero: 0, 1, 2, 3, …'],['Integers (ℤ)','Whole numbers and their negatives: …, −2, −1, 0, 1, 2, …'],['Rational numbers (ℚ)','Numbers that can be written as p/q where p and q are integers and q is not 0. Their decimals end or repeat.'],['Irrational numbers','Numbers that cannot be written as a fraction. Their decimals never end and never repeat, for example √2 and π.'],['Real numbers (ℝ)','All the rational and irrational numbers together.'],['Perfect square','A number made by multiplying a whole number by itself: 1, 4, 9, 16, 25, …'],['Square root','A number that multiplies by itself to give the original number. √49 = 7.'],['Cube root','A number used three times in a multiplication to give the original number. ∛8 = 2.'],['Fractional power','x^(1/n) means the nth root of x. x^(m/n) means the nth root of x, raised to the power m.'],['Recurring decimal','A decimal with digits that repeat forever, such as 0.333…']],

 steps:[
  {phase:'engage',name:'Which is the odd one?',title:'Which number does not belong?',lead:'Look at these four numbers: ½, 0.75, √2 and −4. Three of them have something in common. One does not.',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'This lesson builds on a few ideas from earlier grades. Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],

   blocks:[{type:'mcq',star:true,questions:[{q:'Which of these is a fraction?',o:['7','3/4','−2'],a:1,why:'3/4 means 3 parts out of 4 equal parts.',teach:'A fraction is written as one number over another, like 3/4. The top number (numerator) tells how many parts you have; the bottom number (denominator) tells how many equal parts make a whole.'},{q:'What is 3²?',o:['6','9','32'],a:1,why:'3² means 3 × 3 = 9.',teach:'The small 2 is called a power. 3² means "3 multiplied by itself", so 3² = 3 × 3. It does NOT mean 3 × 2.'},{q:'Which decimal is bigger?',o:['0.45','0.5'],a:1,why:'0.5 = 0.50, and 50 hundredths is more than 45 hundredths.',teach:'To compare decimals, give them the same number of decimal places. 0.5 is the same as 0.50. Now compare 0.45 and 0.50: 50 hundredths is more than 45 hundredths. More digits does not mean bigger.'},{q:'What is √25?',o:['5','12.5','625'],a:0,why:'5 × 5 = 25, so √25 = 5.',teach:'√ means square root: the number that multiplies by itself to give the number underneath. Ask yourself: what number times itself makes 25? Try 5 × 5.'}]}]},
  {phase:'explore',name:'Why new numbers?',title:'Explore: why did people need new kinds of numbers?',lead:'Long ago, people only had counting numbers. Each time they met a problem their numbers could not solve, they invented a new kind of number. Work through these five situations and see what happens.',
   mission:['Read each situation carefully.','Choose your answer, then read the explanation. It tells you which new number family was born.','Work through all 5 situations.'],
   patois:'Every time di ole number dem couldn\'t solve a problem, people invent a new kind a number.',
   blocks:[{type:'text',html:'<p><strong>What you need to know:</strong> the <strong>counting numbers</strong> are 1, 2, 3, 4, and so on. They are what you use to count goats, mangoes or people. Mathematicians call them the {{natural numbers|The counting numbers 1, 2, 3, … Written with the symbol ℕ.}}.</p>'},{type:'mcq',star:true,questions:[{q:'Situation 1: A farmer in St. Elizabeth has 5 goats and sells all 5. How many goats are left?',o:['0','There is no counting number for this'],a:0,why:'We need zero! Zero is not a counting number, so adding 0 to the counting numbers gives a bigger family: the WHOLE numbers 0, 1, 2, 3, …'},{q:'Situation 2: Overnight in Manchester the temperature falls to 2 degrees below zero. Which whole number shows this?',o:['2','No whole number works; we need negative numbers'],a:1,why:'Whole numbers cannot go below zero. Adding negative numbers gives the INTEGERS: …, −2, −1, 0, 1, 2, …'},{q:'Situation 3: Three friends share 2 bullas equally. How much does each person get?',o:['An integer','2/3 of a bulla, which is a fraction'],a:1,why:'No integer works. Fractions like 2/3 join the integers to make the RATIONAL numbers: any number that can be written as one integer over another.'},{q:'Situation 4: A square tile has sides 1 m long. Its diagonal is √2 m ≈ 1.41421356… Can you find a fraction exactly equal to √2?',o:['Yes: 7/5','No: its decimal goes on forever with no repeating pattern'],a:1,why:'7/5 = 1.4, which is close but not exact. No fraction is exactly √2. Numbers like this are IRRATIONAL. Rational and irrational numbers together make the REAL numbers.'},{q:'Situation 5: Look back. Each new family included all the numbers from the family before it. So every whole number is also…',o:['an integer','an irrational number'],a:0,why:'Each family sits inside the next, like boxes inside boxes. You will see this as a picture on the next page.'}]}]},
  {phase:'explain',name:'Teach: number families',title:'Learn: the number families',lead:'Now let\'s name the families properly and learn how to sort any number. Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (use 🔊 Listen). Tap any highlighted word to see what it means.','Step through the worked example, reading the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time. Answer di question fi open di next one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The six number families',explain:'<p>Numbers were not all invented at once. People created new kinds of numbers whenever the old ones could not do a job. That is why numbers come in families that fit inside each other, like boxes inside boxes.</p><p>First came the {{natural numbers|the counting numbers 1, 2, 3, …}} ℕ, the counting numbers 1, 2, 3, … Add zero, for “nothing”, and you get the {{whole numbers|0, 1, 2, 3, …}} 𝕎. To handle debts and cold temperatures, people needed negatives, giving the {{integers|whole numbers and their negatives}} ℤ. To share things fairly, they needed fractions, giving the {{rational numbers|numbers that can be written as one integer over another, p/q}} ℚ: any number you can write as one integer over another, like ¾ or −5 (which is −5/1).</p><p>But some numbers, like π and √2, can never be written as a fraction. Their decimals go on forever without repeating. They are the {{irrational numbers|numbers that cannot be written as a fraction of two integers}}. Rational and irrational together make the {{real numbers|all rational and irrational numbers together}} ℝ. So ℕ ⊂ 𝕎 ⊂ ℤ ⊂ ℚ ⊂ ℝ: every natural number is also whole, an integer, rational and real.</p>',visual:NESTED,
     example:{q:'Which families does −5 belong to?',steps:[{do:'Is −5 a counting number? No.',why:'Counting numbers start at 1 and go up. They are never negative.'},{do:'Is it a whole number? No.',why:'Whole numbers are 0, 1, 2, … also never negative.'},{do:'Is it an integer? Yes.',why:'Integers include negative whole numbers.'},{do:'So −5 is also rational and real.',why:'The integer box sits inside the rational box, which sits inside the real box. If you are in a small box, you are in every bigger box around it.'},{do:'Answer: −5 is an integer, a rational number and a real number.'}]},
     mistake:'Thinking 0 is a natural number. Natural numbers are the counting numbers, and nobody starts counting at zero. Zero is the first <strong>whole</strong> number.',
     check:{q:'Which families does 12 belong to?',o:['Natural only','Natural, whole, integer, rational and real','Rational only'],a:1,why:'12 is a counting number, so it is in the smallest box (natural) and therefore in every box around it.',hint:'12 is in the smallest box. Which boxes surround it?'}},
    {title:'Rational or irrational?',explain:'<p>How can you tell whether a number is rational? Ask one question: <strong>can it be written as one integer over another?</strong> If yes, it is rational.</p><p>That includes every integer (7 = 7/1), every ordinary fraction, and every decimal that stops, like 0.75 = 3/4. It also includes decimals that go on forever but <em>repeat</em> a pattern, like 0.333… which is exactly 1/3. Repeating decimals can always be turned back into fractions.</p><p>An irrational number has a decimal that goes on forever <em>without ever repeating</em>. π = 3.14159265… never settles into a pattern. The most common irrational numbers you will meet are π and square roots of numbers that are not perfect squares, like √2, √3 and √10.</p><p>So when you meet a square root, ask: is the number under the root sign a {{perfect square|a number made by multiplying a whole number by itself, such as 16 = 4 × 4}}? √16 = 4, which is rational. But √15 is not a whole number, so it is irrational.</p>',
     example:{q:'Is √20 rational or irrational? Is 0.3636… (repeating) rational or irrational?',steps:[{do:'√20: list the perfect squares near 20: 16 and 25.',why:'If 20 were a perfect square, it would be on that list.'},{do:'20 is not a perfect square, so √20 ≈ 4.4721… is irrational.',why:'Its decimal never ends and never repeats.'},{do:'0.3636…: the digits 36 repeat forever.',why:'Repeating decimals can always be written as a fraction.'},{do:'0.3636… = 36/99 = 4/11, so it is rational.',why:'We found integers p = 4 and q = 11. That is the test for rational.'}]},
     mistake:'Thinking 22/7 is irrational. 22/7 is a fraction of two integers, so it is <strong>rational</strong>. It is only an approximation of π (22/7 = 3.142857…, but π = 3.141592…).',
     check:{q:'Which number is irrational?',o:['√36','√10','0.5'],a:1,why:'10 is not a perfect square, so √10 never ends or repeats. √36 = 6 and 0.5 = 1/2 are rational.',hint:'Check which number under the root sign is a perfect square.'}}]}]},
  {phase:'explain',name:'Teach: powers and order',title:'Learn: powers, roots and putting numbers in order',lead:'Next you will learn three skills: roots, fractional powers, and ordering. Each one builds on the one before.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Root, fraction power, an putting number in order. One step at a time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Squares, cubes and roots',explain:'<p>Squaring a number means multiplying it by itself: 6² = 6 × 6 = 36. We call it “squared” because a square with sides of 6 has an area of 36. Cubing means using the number three times: 3³ = 3 × 3 × 3 = 27, like the number of small cubes in a 3 by 3 by 3 block.</p><p>A root takes you backwards. The {{square root|the number that multiplies by itself to give the original number}} of 36 asks: “what number multiplied by itself gives 36?” The answer is 6, so √36 = 6. The {{cube root|the number used three times in a multiplication to give the original number}} of 27 asks: “what number used three times gives 27?” The answer is 3, so ∛27 = 3.</p><p>It really helps to know the first few squares (1, 4, 9, 16, 25, 36, 49, 64, 81, 100) and cubes (1, 8, 27, 64, 125) by heart. They make roots and powers much quicker.</p>',visual:SQ,
     example:{q:'Find √81 and ∛125.',steps:[{do:'√81: what number times itself makes 81?',why:'A square root undoes squaring.'},{do:'9 × 9 = 81, so √81 = 9.'},{do:'∛125: what number used three times makes 125?',why:'A cube root undoes cubing.'},{do:'5 × 5 × 5 = 125, so ∛125 = 5.',why:'Check: 5 × 5 = 25, and 25 × 5 = 125.'}]},
     mistake:'Thinking √16 means 16 ÷ 2 = 8. A square root is not half. Check by multiplying back: 8 × 8 = 64, not 16. The correct answer is 4, because 4 × 4 = 16.',
     check:{q:'What is ∛64?',o:['4','8','21.3'],a:0,why:'4 × 4 × 4 = 16 × 4 = 64.',hint:'Find a number that, used three times in a multiplication, gives 64. Try 4.'}},
    {title:'Fractional powers',explain:'<p>Powers can also be fractions, and they connect beautifully to roots. The bottom of the fraction is a root, and the top is a power.</p><p>Start simple. A power of ½ means a square root: 25^(1/2) = √25 = 5. A power of ⅓ means a cube root: 8^(1/3) = ∛8 = 2. Why? Because 25^(1/2) × 25^(1/2) should give 25^1, which is 25, and the only positive number that multiplies by itself to make 25 is 5.</p><p>Now put the two parts together. For 27^(2/3), the bottom number, 3, says “take the cube root”: ∛27 = 3. The top number, 2, says “then square it”: 3² = 9. So 27^(2/3) = 9.</p><p>A useful habit: always take the root first, then the power. It keeps the numbers small and friendly.</p>',
     example:{q:'Evaluate 8^(2/3).',steps:[{do:'Look at the fraction 2/3. The bottom number is 3, so take the cube root: ∛8 = 2.',why:'The denominator tells you which root. We do the root first so we work with a small number.'},{do:'The top number is 2, so square the result: 2² = 4.',why:'The numerator tells you the power.'},{do:'Answer: 8^(2/3) = 4.',why:'Check the other way: 8² = 64, and ∛64 = 4. Same answer, but bigger numbers along the way.'}]},
     mistake:'Multiplying the number by the fraction: 8^(2/3) is NOT 8 × 2/3 = 5.33. The fraction is a power, so it means "root, then power".',
     check:{q:'Evaluate 25^(3/2).',o:['37.5','125','15'],a:1,why:'Bottom 2: √25 = 5. Top 3: 5³ = 125.',hint:'Bottom number first: which root? Then use the top number as the power.'}},
    {title:'Putting real numbers in order',explain:'<p>Putting a mixture like 7/2, √2, 1.45 and π in order looks hard, because they are written in such different ways. It is a bit like comparing prices written in dollars, cents and pounds: you need a common currency.</p><p>For real numbers, the common currency is the <strong>decimal</strong>. Change each number into a decimal first. 7/2 = 3.5. √2 ≈ 1.414. π ≈ 3.142. Now they are easy to compare.</p><p>When two decimals look close, line them up by their decimal points and compare digit by digit from the left, adding zeros at the end if it helps: 1.450 versus 1.414. The first digit that differs decides which is bigger. Then write the numbers in order, using their <em>original</em> form: √2, 1.45, π, 7/2.</p>',
     example:{q:'Arrange in ascending order: 1.1, 7/2, √2, 1.45, π',steps:[{do:'Change each to a decimal: 1.1 → 1.100; 7/2 → 3.500; √2 → 1.414; 1.45 → 1.450; π → 3.142.',why:'Decimals with the same number of places are easy to compare digit by digit.'},{do:'Compare the whole-number parts first: 1.100, 1.414, 1.450 all start with 1; 3.142 and 3.500 start with 3.',why:'Numbers starting with 1 are smaller than those starting with 3.'},{do:'Then compare the decimal parts: 1.100 < 1.414 < 1.450 and 3.142 < 3.500.'},{do:'Answer: 1.1, √2, 1.45, π, 7/2.',why:'Write the answer using the ORIGINAL numbers, not the decimals.'}]},
     mistake:'Thinking a decimal with more digits is bigger. 1.45 is smaller than 1.5, because 1.5 = 1.50, and 50 hundredths is more than 45 hundredths.',
     check:{q:'Which list is in ascending order?',o:['1.5, √2, 1.45','√2, 1.45, 1.5','1.45, 1.5, √2'],a:1,why:'√2 ≈ 1.414 < 1.450 < 1.500.',hint:'Change √2 to a decimal (≈ 1.414) and write 1.5 as 1.500.'}}]}]},

    {type:'worked',q:'Evaluate 16^(3/4).',steps:[{do:'The bottom number is 4, so take the fourth root: ⁴√16 = 2.',why:'2 × 2 × 2 × 2 = 16.'},{do:'The top number is 3, so cube the result: 2³ = 8.',why:'The top number is the power.'},{do:'Answer: 16^(3/4) = 8.'}]},
    {type:'fill',q:'Evaluate 81^(3/4).',steps:[{text:'The bottom number is 4, so take the fourth root: ⁴√81 = ___',blank:true,a:3,hint:'Which number used four times in a multiplication gives 81? Try 3 × 3 × 3 × 3.'},{text:'The top number is 3, so cube the result.'},{text:'Answer: 81^(3/4) = 27.'}],sol:'⁴√81 = 3, because 3 × 3 × 3 × 3 = 81. Then 3³ = 27.'},
    {type:'own',q:'Evaluate 32^(2/5).',a:4,hint:'Bottom number 5: which number used five times gives 32? Then square it.',sol:'⁵√32 = 2, and 2² = 4.'},
    {type:'own',q:'Which is the largest: 1.7, √3 or 7/4? Type it exactly as shown.',a:['7/4',1.75],hint:'Change each to a decimal: √3 ≈ 1.732 and 7/4 = 1.75.',sol:'1.700 < 1.732 < 1.750, so 7/4 is the largest.',placeholder:'e.g. 7/4'}]}]},

     {icon:'🧩',title:'Number family sorter',desc:'Tick every family each number belongs to.',level:'⭐ Warm-up',mins:5,block:{type:'custom',star:true,html:'<div class="controls"><label for="nfPick">Number:</label><select id="nfPick"></select></div><div class="tile"><p style="margin:0 0 6px"><strong>This number belongs to:</strong></p><div class="choice-row nfSets" role="group" aria-label="Number sets"></div><div class="controls"><button type="button" class="go nfCheck">Check</button></div><div class="fb nfFb" aria-live="polite">Tick every family, then check.</div><p class="nfDone" style="margin:6px 0 0">Correct so far: <strong>0</strong> of 6</p></div>',
     init:function(box,api){var N=[['7',['N','W','Z','Q','R']],['0',['W','Z','Q','R']],['−3',['Z','Q','R']],['2/5',['Q','R']],['0.444… (repeating)',['Q','R']],['√2',['I','R']],['π',['I','R']],['√9',['N','W','Z','Q','R']],['−1.25',['Q','R']]];var S=[['N','Natural ℕ'],['W','Whole 𝕎'],['Z','Integer ℤ'],['Q','Rational ℚ'],['I','Irrational'],['R','Real ℝ']];var why={'0':'Zero is whole, but not natural.','√9':'√9 = 3, so it is a natural number even though it has a root sign.','√2':'2 is not a perfect square, so √2 is irrational.','π':'π never ends or repeats. (22/7 is only an approximation.)','0.444… (repeating)':'A repeating decimal is rational: 0.444… = 4/9.','−1.25':'−1.25 = −5/4, so it is rational but not an integer.','2/5':'A fraction of integers is rational.','−3':'Negative whole numbers are integers.','7':'A counting number belongs to every family except irrational.'};var done=api.get('done')||[];var pick=box.querySelector('#nfPick'),sets=box.querySelector('.nfSets'),fb=box.querySelector('.nfFb');N.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=n[0];pick.appendChild(o)});function draw(){sets.innerHTML='';S.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='pick';b.textContent=s[1];b.setAttribute('aria-pressed','false');b.dataset.k=s[0];b.onclick=function(){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'))};sets.appendChild(b)});fb.className='fb nfFb';fb.textContent='Tick every family, then check.'}function count(){box.querySelector('.nfDone strong').textContent=Math.min(done.length,6)}pick.onchange=draw;box.querySelector('.nfCheck').onclick=function(){var i=+pick.value,want=N[i][1],got=[].filter.call(sets.children,function(b){return b.getAttribute('aria-pressed')==='true'}).map(function(b){return b.dataset.k});var missing=want.filter(function(k){return got.indexOf(k)<0}),extra=got.filter(function(k){return want.indexOf(k)<0});var nm=function(k){return S.filter(function(s){return s[0]===k})[0][1]};if(!missing.length&&!extra.length){fb.className='fb ok nfFb';fb.textContent='✓ Correct! '+why[N[i][0]];if(done.indexOf(i)<0){done.push(i);api.set('done',done)}count();if(done.length>=6)api.complete()}else{fb.className='fb no nfFb';fb.textContent='Not yet. '+(missing.length?'You missed: '+missing.map(nm).join(', ')+'. ':'')+(extra.length?'It does not belong to: '+extra.map(nm).join(', ')+'. ':'')+'Remember: if a number is in a small box, it is in every bigger box around it.'}};draw();count()}}},
     {icon:'🗂️',title:'Rational or irrational?',desc:'Sort 8 tricky numbers into the right box.',level:'⭐ Warm-up',mins:4,block:{type:'sort',star:true,tip:'Ask: can I write it as a fraction? Does the decimal end or repeat? Is the number under the root a perfect square?',bins:[{id:'rat',label:'Rational',hint:'can be a fraction'},{id:'irr',label:'Irrational',hint:'cannot be a fraction'}],items:[{label:'3/7',bin:'rat'},{label:'√5',bin:'irr'},{label:'0.125',bin:'rat'},{label:'π',bin:'irr'},{label:'√16',bin:'rat'},{label:'22/7',bin:'rat'},{label:'0.2121… (repeating)',bin:'rat'},{label:'1.0100100010… (never repeats)',bin:'irr'}]}},
     {icon:'📏',title:'Order it!',desc:'Put mixed fractions, decimals, roots and π in order.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Tap the numbers from smallest to largest.',rounds:[[{label:'0.7',v:0.7,show:'0.700'},{label:'2/3',v:2/3,show:'0.667'},{label:'0.67',v:0.67,show:'0.670'},{label:'5/8',v:0.625,show:'0.625'}],[{label:'√2',v:Math.SQRT2,show:'1.414'},{label:'1.4',v:1.4,show:'1.400'},{label:'1.42',v:1.42,show:'1.420'},{label:'1⅓',v:4/3,show:'1.333'}],[{label:'π',v:Math.PI,show:'3.1416'},{label:'22/7',v:22/7,show:'3.1429'},{label:'3.14',v:3.14,show:'3.1400'},{label:'√10',v:Math.sqrt(10),show:'3.1623'}]]}},
     {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The square root of a whole number is irrational.',a:'sometimes',why:'√9 = 3 is rational, but √2 is irrational. It depends on whether the number is a perfect square.',hint:'Try √9 and then √2.'},{s:'An integer is a rational number.',a:'always',why:'Any integer n can be written as n/1, so every integer is rational.'},{s:'The square root of a number is smaller than the number.',a:'sometimes',why:'√9 = 3 is smaller than 9, but √0.25 = 0.5 is BIGGER than 0.25, and √1 = 1 is equal.',hint:'Try a number less than 1, such as 0.25.'},{s:'A negative number is a natural number.',a:'never',why:'Natural numbers are the counting numbers 1, 2, 3, … They are never negative.'},{s:'A decimal that goes on forever is irrational.',a:'sometimes',why:'0.333… goes on forever but is rational (1/3) because it repeats. π goes on forever without repeating, so it is irrational.',hint:'Does the decimal repeat?'}]}},
     {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Kemar',q:'Evaluate 27^(2/3).',lines:['27^(2/3) = 27 × 2/3','= 54 ÷ 3','= 18'],wrong:0,reasons:['He multiplied by the fraction instead of using it as a power','He took the square root instead of the cube root','He divided instead of multiplying'],reason:0,fix:'27^(2/3) = (∛27)² = 3² = 9.'},{who:'Shanice',q:'Arrange in ascending order: 1.5, 1.45, √2',lines:['Change to decimals: 1.5, 1.45, √2 ≈ 1.414','1.45 has more digits, so 1.45 is bigger than 1.5','Answer: √2, 1.5, 1.45'],wrong:1,reasons:['More digits does not mean bigger: 1.50 is bigger than 1.45','√2 is not about 1.414','The question wanted descending order'],reason:0,fix:'1.414 < 1.450 < 1.500, so the order is √2, 1.45, 1.5.'},{who:'Andre',q:'Name all the families −4 belongs to.',lines:['−4 is a whole number','so it is also an integer, a rational number and a real number'],wrong:0,reasons:['Whole numbers are never negative','−4 is irrational','−4 is a natural number'],reason:0,fix:'−4 is an integer, a rational number and a real number. It is not whole or natural.'}]}},
     {icon:'🃏',title:'Match it',desc:'Match each power to its value in as few tries as you can.',level:'⭐⭐ Skill builder',mins:4,block:{type:'match',pairs:[['8^(1/3)','2'],['16^(1/2)','4'],['27^(2/3)','9'],['125^(1/3)','5'],['4^(3/2)','8'],['81^(1/4)','3']]}},
     {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire questions. Can you beat your best?',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var r=Math.floor(Math.random()*3);if(r===0){var P=[['√16','Rational','√16 = 4'],['√7','Irrational','7 is not a perfect square'],['0.75','Rational','0.75 = 3/4'],['π','Irrational','π never ends or repeats'],['22/7','Rational','a fraction of integers'],['√50','Irrational','50 is not a perfect square'],['0.1212…','Rational','it repeats'],['−9','Rational','−9 = −9/1'],['√1','Rational','√1 = 1']],p=P[Math.floor(Math.random()*P.length)];return{q:'Is '+p[0]+' rational or irrational?',o:['Rational','Irrational'],a:p[1]==='Rational'?0:1,why:p[2]+'.'}}if(r===1){var T=[[4,2,2],[9,2,3],[25,2,5],[49,2,7],[8,3,2],[27,3,3],[64,3,4],[100,2,10],[125,3,5],[16,4,2]],t=T[Math.floor(Math.random()*T.length)],ans=t[2],o=[String(ans),String(Math.round(t[0]/t[1]*10)/10),String(ans+1)];if(o[1]===o[0]||o[1]===o[2])o[1]=String(ans*2);return{q:t[0]+'^(1/'+t[1]+') = ?',o:o,a:0,why:'The '+(t[1]===2?'square':t[1]===3?'cube':'fourth')+' root of '+t[0]+' is '+ans+'.'}}var C=[['0.5','0.45',0],['√2','1.5',1],['π','3.1',0],['2/3','0.6',0],['−3','−7',0],['1.09','1.1',1],['√9','2.9',0],['5/8','0.65',1]],c=C[Math.floor(Math.random()*C.length)];return{q:'Which is bigger?',o:[c[0],c[1]],a:c[2],why:'Compare them as decimals.'}}}},
     {icon:'✏️',title:'Make your own',desc:'Invent numbers that fit each rule. Many answers are possible!',level:'⭐⭐⭐ Creative',mins:5,block:{type:'create',tasks:[{q:'Type a rational number between 1 and 2 that is NOT a whole number.',placeholder:'e.g. a fraction or decimal',check:function(v,num){var x=num(v);if(isNaN(x))return{ok:false,msg:'Type a number, a fraction like 3/2, or a decimal.'};if(/√|pi|π/i.test(v))return{ok:false,msg:'Use a fraction or a decimal, so it is clearly rational.'};if(x>1&&x<2)return{ok:true,msg:'Great! '+v+' is between 1 and 2 and can be written as a fraction, so it is rational.'};return{ok:false,msg:'That is not between 1 and 2. Try something like 1.5 or 7/4.'}}},{q:'Type an irrational number between 3 and 4.',placeholder:'e.g. √something',check:function(v,num){var x=num(v);if(isNaN(x))return{ok:false,msg:'Try using √, for example √11.'};var m=String(v).replace(/\s/g,'').match(/^√\(?(\d+)\)?$/);if(/^(π|pi)$/i.test(String(v).trim()))return{ok:true,msg:'Yes! π ≈ 3.142 is irrational and between 3 and 4.'};if(m){var n=+m[1],r=Math.round(Math.sqrt(n));if(r*r===n)return{ok:false,msg:'√'+n+' = '+r+', a whole number, so it is rational. Choose a number that is not a perfect square.'};if(x>3&&x<4)return{ok:true,msg:'Excellent! √'+n+' ≈ '+x.toFixed(3)+'. '+n+' is not a perfect square, so √'+n+' is irrational.'};return{ok:false,msg:'√'+n+' ≈ '+x.toFixed(3)+', which is not between 3 and 4. Try a number between 9 and 16 under the root sign.'}}return{ok:false,msg:'Any decimal you can type in full ends, so it is rational. Try a square root such as √10.'}}},{q:'Type a number that is an integer but NOT a whole number.',placeholder:'e.g. …',check:function(v,num){var x=num(v);if(isNaN(x))return{ok:false,msg:'Type a number.'};if(x<0&&Math.round(x)===x)return{ok:true,msg:'Yes! '+v+' is a negative whole-number value, so it is an integer but not a whole number.'};if(Math.round(x)!==x)return{ok:false,msg:'That is not an integer. Integers have no fractions or decimals.'};return{ok:false,msg:'That is a whole number. Integers that are NOT whole numbers are the negative ones.'}}}]}},
     {icon:'🏗️',title:'Mission: the rooftop tank',desc:'Help a plumber in Mandeville plan a new water tank.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Mr. Brown is a plumber in Mandeville. A family wants to replace their small cube-shaped water tank with a bigger one on their flat roof. Help him plan the job, one step at a time.',parts:[{q:'The old tank is a cube that holds 8 m³. How long is each edge, in metres?',a:2,hint:'Volume of a cube = edge³, so edge = ∛8.',sol:'∛8 = 2 m, because 2 × 2 × 2 = 8.',placeholder:'metres'},{q:'The new tank is a cube that holds 27 m³. How long is each edge?',a:3,hint:'Find ∛27.',sol:'∛27 = 3 m.',placeholder:'metres'},{q:'How many times longer is the new edge than the old one? Give a decimal.',a:1.5,tol:0.001,hint:'Divide the new edge by the old edge: 3 ÷ 2.',sol:'3 ÷ 2 = 1.5 times longer.'},{q:'The flat roof is a square with an area of 20.25 m². How long is each side of the roof?',a:4.5,tol:0.001,hint:'Side = √20.25. Try 4.5 × 4.5.',sol:'√20.25 = 4.5 m.',placeholder:'metres'},{q:'Safety rule: the tank needs at least 0.5 m of clear space on every side. Will the new tank fit? Type yes or no.',a:['yes','y'],hint:'Width needed = 0.5 + 3 + 0.5. Compare it with 4.5 m.',sol:'Yes. 0.5 + 3 + 0.5 = 4 m, which is less than the 4.5 m roof side.'}],done:'You used cube roots, square roots and decimals to plan a real job. That is exactly how plumbers and builders work.'}}
    ]}]},
