 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Number Theory and Computation',strand:'Number Theory and Computation',standard:CSEC_STD,
  objectives:['1.1 distinguish among sets of numbers;','1.2 compute powers of real numbers of the form x^a, where a ∈ ℚ;','1.15 order a set of real numbers;'],
  focus:'Classifying real numbers, the inclusion relation ℕ ⊂ 𝕎 ⊂ ℤ ⊂ ℚ ⊂ ℝ, squares, cubes, roots and fractional powers, and ordering mixed sets of fractions, decimals, surds and π.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 1, Section 1.'},
 glossary:[['Natural numbers (ℕ)','The counting numbers: 1, 2, 3, …'],['Whole numbers (𝕎)','The natural numbers and zero: 0, 1, 2, 3, …'],['Integers (ℤ)','Whole numbers and their negatives: …, −2, −1, 0, 1, 2, …'],['Rational numbers (ℚ)','Numbers that can be written as p/q where p and q are integers and q is not 0. Their decimals terminate or recur.'],['Irrational numbers','Numbers that cannot be written as a fraction. Their decimals never end and never repeat, for example √2 and π.'],['Real numbers (ℝ)','All the rational and irrational numbers together.'],['Square root','A number that multiplies by itself to give the original number. √49 = 7.'],['Cube root','A number used three times in a multiplication to give the original number. ∛8 = 2.'],['Fractional power','x^(1/n) means the nth root of x. x^(m/n) means the nth root of x, raised to the power m.'],['Recurring decimal','A decimal with digits that repeat forever, such as 0.333…']],

    svg:'<svg viewBox="0 0 700 300"><rect width="700" height="300" fill="#faf8fe"/><rect x="10" y="10" width="680" height="280" rx="18" fill="#efe8fb" stroke="#6a3fc0" stroke-width="2"/><text x="24" y="36" font-size="18" font-weight="700" fill="#3d2a73">Real numbers ℝ</text><rect x="30" y="50" width="430" height="225" rx="16" fill="#dcf3ee" stroke="#16766a" stroke-width="2"/><text x="44" y="74" font-size="16" font-weight="700" fill="#0f5a50">Rational ℚ  (½, 0.75, 0.333…)</text><rect x="50" y="88" width="330" height="175" rx="14" fill="#e4ecfb" stroke="#2f5fc4" stroke-width="2"/><text x="64" y="112" font-size="16" font-weight="700" fill="#1f4a9c">Integers ℤ  (−4, −1)</text><rect x="70" y="126" width="240" height="125" rx="12" fill="#fff1dc" stroke="#a85d00" stroke-width="2"/><text x="84" y="150" font-size="16" font-weight="700" fill="#7a4300">Whole 𝕎  (0)</text><rect x="90" y="164" width="160" height="75" rx="10" fill="#fff" stroke="#c02d5f" stroke-width="2"/><text x="104" y="190" font-size="16" font-weight="700" fill="#8f1f45">Natural ℕ</text><text x="104" y="214" font-size="15" fill="#8f1f45">1, 2, 3, …</text><rect x="480" y="50" width="190" height="225" rx="16" fill="#fbe4ec" stroke="#c02d5f" stroke-width="2"/><text x="494" y="74" font-size="16" font-weight="700" fill="#8f1f45">Irrational</text><text x="494" y="104" font-size="15" fill="#8f1f45">√2, π, √5</text><text x="494" y="128" font-size="14" fill="#8f1f45">never end,</text><text x="494" y="148" font-size="14" fill="#8f1f45">never repeat</text></svg>'},

     init:function(box,api){var N=[['7',['N','W','Z','Q','R']],['0',['W','Z','Q','R']],['−3',['Z','Q','R']],['2/5',['Q','R']],['0.444… (recurring)',['Q','R']],['√2',['I','R']],['π',['I','R']],['√9',['N','W','Z','Q','R']],['−1.25',['Q','R']]];var S=[['N','Natural ℕ'],['W','Whole 𝕎'],['Z','Integer ℤ'],['Q','Rational ℚ'],['I','Irrational'],['R','Real ℝ']];var why={'0':'Zero is whole, but not natural: natural numbers start at 1.','√9':'√9 = 3, so it is a natural number even though it has a root sign.','√2':'√2 = 1.41421356… never ends or repeats, so it is irrational.','π':'π = 3.14159… never ends or repeats. (22/7 is only an approximation.)','0.444… (recurring)':'A recurring decimal is rational: 0.444… = 4/9.','−1.25':'−1.25 = −5/4, a fraction, so it is rational but not an integer.','2/5':'2/5 is a fraction of integers, so it is rational.','−3':'Negative whole numbers are integers.','7':'7 is a counting number, so it belongs to every set except irrational.'};var done=api.get('done')||[];var pick=box.querySelector('#nfPick'),sets=box.querySelector('.nfSets'),fb=box.querySelector('.nfFb');N.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=n[0];pick.appendChild(o)});function draw(){sets.innerHTML='';S.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='pick';b.textContent=s[1];b.setAttribute('aria-pressed','false');b.dataset.k=s[0];b.onclick=function(){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'))};sets.appendChild(b)});fb.className='fb nfFb';fb.textContent='Tick every set, then check.'}function count(){box.querySelector('.nfDone strong').textContent=Math.min(done.length,6)}pick.onchange=draw;box.querySelector('.nfCheck').onclick=function(){var i=+pick.value,want=N[i][1],got=[].filter.call(sets.children,function(b){return b.getAttribute('aria-pressed')==='true'}).map(function(b){return b.dataset.k});var missing=want.filter(function(k){return got.indexOf(k)<0}),extra=got.filter(function(k){return want.indexOf(k)<0});if(!missing.length&&!extra.length){fb.className='fb ok nfFb';fb.textContent='✓ Correct! '+why[N[i][0]];if(done.indexOf(i)<0){done.push(i);api.set('done',done)}count();if(done.length>=6)api.complete()}else{fb.className='fb no nfFb';var nm=function(k){return S.filter(function(s){return s[0]===k})[0][1]};fb.textContent='Not yet. '+(missing.length?'You missed: '+missing.map(nm).join(', ')+'. ':'')+(extra.length?'It does not belong to: '+extra.map(nm).join(', ')+'. ':'')+'Use the nested sets picture: if a number is in a small box, it is in every bigger box around it.'}};draw();count()}},

    {type:'examples',star:true,examples:[{q:'Evaluate 27^(2/3).',steps:['The denominator 3 means cube root: ∛27 = 3.','The numerator 2 means square it: 3² = 9.','Answer: 27^(2/3) = 9']},{q:'Evaluate 16^(3/4).',steps:['The denominator 4 means fourth root: ⁴√16 = 2, because 2 × 2 × 2 × 2 = 16.','The numerator 3 means cube it: 2³ = 8.','Answer: 16^(3/4) = 8']},{q:'Arrange in ascending order: 1.1, 7/2, √2, 1.45, π',steps:['Change each to a decimal: 1.1; 7/2 = 3.5; √2 ≈ 1.414; 1.45; π ≈ 3.142.','Compare the decimals: 1.1 < 1.414 < 1.45 < 3.142 < 3.5.','Answer: 1.1, √2, 1.45, π, 7/2']}]}]},
