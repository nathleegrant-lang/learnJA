     init:function(box,api){var p=box.querySelector('#srP'),r=box.querySelector('#srR'),t=box.querySelector('#srT');[p,r,t].forEach(function(e){api.nudges(e)});function draw(){var P=+p.value,R=+r.value,T=+t.value,si=P*R*T/100,ca=P*Math.pow(1+R/100,T);box.querySelector('.srPO').textContent='$'+P.toLocaleString('en-JM');box.querySelector('.srRO').textContent=R+'%';box.querySelector('.srTO').textContent=T;box.querySelector('.srSvg').innerHTML=GROWTH(P,R,T);box.querySelector('.srX').innerHTML='<strong>Simple:</strong> interest = '+money(si)+', amount = '+money(P+si)+'.<br><strong>Compound:</strong> amount = '+money(ca)+', interest = '+money(ca-P)+'.<br>Compound pays <strong>'+money(ca-P-si)+'</strong> more, because each year it earns interest on the interest too.'}[p,r,t].forEach(function(e){e.addEventListener('input',draw)});var T=[{t:'Set P = $20,000, R = 5%, T = 3 years. What is the SIMPLE interest?',a:3000,tol:0.01},{t:'With the same settings, what is the COMPOUND amount?',a:23152.5,tol:0.01},{t:'Set P = $100,000, R = 10%, T = 10 years. How much MORE does compound pay than simple? (to the nearest dollar)',a:59374.25,tol:1}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.srN').textContent='All done';box.querySelector('.srTask').textContent='You completed every challenge!';box.querySelector('.srC').disabled=true;return}box.querySelector('.srN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.srTask').textContent=T[k].t}box.querySelector('.srC').onclick=function(){var v=parseFloat(String(box.querySelector('.srA').value).replace(/[$,\s]/g,'')),fb=box.querySelector('.srFb');if(Math.abs(v-T[k].a)<=T[k].tol){fb.className='fb ok srFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.srA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no srFb';fb.textContent='Not yet. Set the sliders exactly as the challenge says, then read the result below the chart.'}};draw();task()}},

  {phase:'explain',name:'Teach: simple and compound interest',title:'Learn: simple interest and compound interest',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Simple interest only pon di start money. Compound pon di interest too.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Simple interest',explain:'<p>When you put money into a bank or credit union, they use it to make loans to other people. To say thank you for letting them use your money, they pay you extra money: {{interest|money paid for the use of money}}. It works the other way too: when you borrow money, you pay interest to the lender.</p><p>Three things decide how much interest there is. The {{principal|the amount invested or borrowed at the start}} (P) is the amount you start with. The {{rate|the percentage of the principal paid each year}} (R) is the percentage paid each year. And the {{time|how long the money is invested, in years}} (T) is how many years the money stays there.</p><p>With {{simple interest|interest calculated on the original principal only}}, you earn the same amount every year, because it is always worked out on the original principal. The formula is <strong>I = (P × R × T) ÷ 100</strong>. At the end, the {{amount|principal plus interest: the total at the end}} is the principal plus the interest. One thing to watch: T must be in years. If the time is 6 months, that is 0.5 years.</p>',
     example:{q:'Find the simple interest and the amount on $50,000 invested at 4% per year for 3 years.',steps:[{do:'P = 50,000, R = 4, T = 3.'},{do:'I = (50,000 × 4 × 3) ÷ 100 = $6,000.'},{do:'Amount = $50,000 + $6,000 = $56,000.',why:'The amount is the principal plus the interest.'}]},
     mistake:'Using months for T. If the time is 8 months, use T = 8/12 years.',
     check:{q:'What is the simple interest on $10,000 at 6% for 2 years?',o:['$120','$1,200','$12,000'],a:1,why:'(10,000 × 6 × 2) ÷ 100 = $1,200.',hint:'I = PRT ÷ 100.'}},
    {title:'Finding P, R or T',explain:'<p>Sometimes you already know the interest and want to find something else. Maybe you want to know what rate a bank is really paying, or how long it will take to earn a certain amount.</p><p>The good news is that you don’t need three new formulas. Just put everything you know into I = PRT ÷ 100, and solve for the missing letter, like solving an equation.</p><p>For example, if $30,000 earns $4,800 in 2 years, write 4,800 = (30,000 × R × 2) ÷ 100. Work out the numbers you can: 30,000 × 2 ÷ 100 = 600. So 4,800 = 600R. Divide both sides by 600, and R = 8%.</p><p>Read the question carefully, though. If it gives you the <em>amount</em> (the total at the end), subtract the principal first to find the interest.</p>',
     example:{q:'$30,000 earns $4,800 simple interest in 2 years. Find the rate.',steps:[{do:'Substitute: 4,800 = (30,000 × R × 2) ÷ 100.'},{do:'Simplify: 4,800 = 600R.',why:'30,000 × 2 ÷ 100 = 600.'},{do:'R = 4,800 ÷ 600 = 8%.'}]},
     mistake:'Using the amount instead of the interest. If you are given the amount, subtract the principal first to find I.',
     check:{q:'$20,000 earns $3,000 simple interest at 5% per year. For how many years was it invested?',o:['2','3','15'],a:1,why:'3,000 = (20,000 × 5 × T) ÷ 100 = 1,000T, so T = 3.',hint:'Substitute and solve for T.'}},
    {title:'Compound interest',explain:'<p>Simple interest pays you the same amount every year. Compound interest is cleverer, and much more powerful. With {{compound interest|interest calculated on the principal plus the interest already earned}}, the interest you earn each year is added to your balance. Next year, you earn interest on that bigger balance, including on the interest you earned before. Your interest earns interest!</p><p>Let’s see it with $20,000 at 5%. In year 1, you earn 5% of $20,000, which is $1,000, so you have $21,000. In year 2, you earn 5% of $21,000, which is $1,050. That is more than last year! In year 3, you earn 5% of $22,050. The amount you earn keeps growing.</p><p>Each year, you are multiplying by 1.05. So after n years, you have multiplied by 1.05 n times. That gives the formula <strong>A = P(1 + R/100)ⁿ</strong>. Over a long time, the difference is enormous, as you saw with the two banks.</p>',visual:GROWTH(100000,10,10),
     example:{q:'Find the compound interest on $20,000 at 5% per year for 3 years.',steps:[{do:'Year 1: $20,000 × 1.05 = $21,000.'},{do:'Year 2: $21,000 × 1.05 = $22,050.',why:'Interest is now earned on $21,000, not $20,000.'},{do:'Year 3: $22,050 × 1.05 = $23,152.50. (Formula: 20,000 × 1.05³ = 23,152.50.)'},{do:'Compound interest = $23,152.50 − $20,000 = $3,152.50. (Simple interest would be only $3,000.)'}]},
     mistake:'Multiplying by n instead of using a power: 20,000 × 1.05 × 3 is NOT the same as 20,000 × 1.05³.',
     check:{q:'$10,000 is invested at 10% compound interest for 2 years. What is the amount?',o:['$12,000','$12,100','$11,000'],a:1,why:'10,000 × 1.1 = 11,000; 11,000 × 1.1 = 12,100.',hint:'Multiply by 1.1 twice.'}}]}]},
  {phase:'explain',name:'Teach: appreciation and depreciation',title:'Learn: appreciation and depreciation',lead:'Next, how things gain and lose value over time.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Land go up inna value. Car go dung.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Appreciation',explain:'<p>Some things become <em>more</em> valuable as time goes by. Land in a growing town, a house near a new highway, or a rare collectible can be worth more each year. This increase in value is called {{appreciation|an increase in value over time}}.</p><p>When something appreciates by a percentage each year, it grows exactly like compound interest. Each year’s increase is worked out on the new, higher value, not on the original price. So we use the same formula: <strong>Value = P(1 + R/100)ⁿ</strong>.</p><p>For example, land worth $4,000,000 that appreciates 8% a year is worth 4,000,000 × 1.08 = $4,320,000 after one year, and 4,320,000 × 1.08 = $4,665,600 after two.</p>',
     example:{q:'A plot of land in St. Ann is worth $4,000,000. It appreciates by 8% each year. Find its value after 2 years.',steps:[{do:'Each year, multiply by 1.08.',why:'Adding 8% is the same as multiplying by 1.08.'},{do:'After 1 year: 4,000,000 × 1.08 = $4,320,000.'},{do:'After 2 years: 4,320,000 × 1.08 = $4,665,600.'}]},
     mistake:'Adding 8% of the ORIGINAL value each year (that would be simple growth). Appreciation compounds: each year uses the new value.',
     check:{q:'A house worth $10,000,000 appreciates by 5% in one year. What is it worth then?',o:['$10,050,000','$10,500,000','$15,000,000'],a:1,why:'10,000,000 × 1.05 = $10,500,000.',hint:'Multiply by 1.05.'}},
    {title:'Depreciation: reducing balance',explain:'<p>Other things lose value over time. A brand-new car is worth much less after a few years on the road. Phones, laptops and machines wear out and go out of date. This loss of value is called {{depreciation|a decrease in value over time}}.</p><p>One common way to calculate it is the {{reducing balance method|losing the same percentage of the current value each year}}. The item loses the same <em>percentage</em> of its value every year. If a car depreciates by 15% a year, it keeps 85% of its value each year, so you multiply by 0.85 each time.</p><p>Notice something interesting: because the percentage is taken from a smaller value each year, the car loses fewer dollars each year, even though the percentage stays the same. The formula is <strong>Value = P(1 − R/100)ⁿ</strong>. It looks just like compound interest, but with a minus sign, because the value is shrinking.</p>',
     example:{q:'A car bought for $2,000,000 depreciates by 15% each year. Find its value after 2 years.',steps:[{do:'Each year it keeps 85% of its value, so multiply by 0.85.',why:'100% − 15% = 85%.'},{do:'After 1 year: 2,000,000 × 0.85 = $1,700,000.'},{do:'After 2 years: 1,700,000 × 0.85 = $1,445,000.'}]},
     mistake:'Adding the depreciation instead of subtracting it. Depreciation always makes the value smaller.',
     check:{q:'A phone worth $80,000 depreciates by 25% in a year. What is it worth then?',o:['$20,000','$60,000','$100,000'],a:1,why:'80,000 × 0.75 = $60,000.',hint:'It keeps 75% of its value.'}},
    {title:'Depreciation: straight-line, and comparing methods',explain:'<p>There is a second, simpler way to work out depreciation. With the {{straight-line method|losing the same amount of money each year}}, the item loses the same <em>amount of money</em> every year. If a $600,000 machine loses $80,000 a year, it is worth $520,000 after one year, $440,000 after two, $360,000 after three, and so on. If you drew this on a graph, it would be a straight line going down, which is where the name comes from.</p><p>So how do the two methods compare? Reducing balance loses a lot in the early years and less later. Straight-line loses exactly the same every year. Businesses choose the method that best matches how their equipment really loses value.</p><p>In a question, read carefully. If it says a percentage of the value each year, use reducing balance. If it says the same amount each year, use straight-line.</p>',
     example:{q:'A $600,000 machine depreciates by $80,000 a year (straight-line). Find its value after 4 years.',steps:[{do:'Total depreciation over 4 years: 4 × $80,000 = $320,000.'},{do:'Value = $600,000 − $320,000 = $280,000.'},{do:'Compare: at 15% reducing balance, it would be worth 600,000 × 0.85⁴ ≈ $313,204.',why:'The two methods give different values.'}]},
     mistake:'Using the reducing balance formula when the question says the value falls by the same amount each year.',
     check:{q:'A van worth $1,500,000 loses $150,000 in value each year. What is it worth after 3 years?',o:['$1,050,000','$1,350,000','$450,000'],a:0,why:'3 × 150,000 = 450,000; 1,500,000 − 450,000 = $1,050,000.',hint:'Same amount each year.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key formulas. Then watch a full example, fill in a missing step, and try some on your own. Use a calculator.',

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'For the same rate and time (more than 1 year), compound interest gives more than simple interest.',a:'always',why:'From year 2 onwards, compound interest also earns interest on interest.'},{s:'After 1 year, simple and compound interest give the same amount.',a:'always',why:'In the first year, both calculate interest on the principal only.'},{s:'Depreciation increases the value of an item.',a:'never',why:'Depreciation is a loss of value.'},{s:'Reducing balance depreciation loses the same amount of money every year.',a:'never',why:'It loses the same PERCENTAGE, so the amount lost gets smaller each year.',hint:'Compare 15% of $2,000,000 with 15% of $1,700,000.'},{s:'An item that depreciates by 20% a year is worth nothing after 5 years.',a:'never',why:'It keeps 80% each year: 0.8⁵ ≈ 0.33, so it still has about a third of its value.',hint:'It keeps 80% each year.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Rohan',q:'Find the simple interest on $12,000 at 5% for 6 months.',lines:['T = 6','I = (12,000 × 5 × 6) ÷ 100 = $3,600'],wrong:0,reasons:['T must be in years: 6 months = 0.5 years','The rate should be 0.05','He should add the principal'],reason:0,fix:'I = (12,000 × 5 × 0.5) ÷ 100 = $300.'},{who:'Kerry-Ann',q:'Find the compound amount on $10,000 at 10% for 3 years.',lines:['Interest each year = $1,000','Amount = 10,000 + 3 × 1,000 = $13,000'],wrong:0,reasons:['With compound interest, each year\'s interest is on the new balance','10% of $10,000 is $100','She should subtract the interest'],reason:0,fix:'10,000 × 1.1³ = $13,310.'},{who:'Devon',q:'A car worth $1,000,000 depreciates by 10% in a year. Find its new value.',lines:['10% of $1,000,000 = $100,000','New value = $1,000,000 + $100,000 = $1,100,000'],wrong:1,reasons:['Depreciation should be subtracted','10% of $1,000,000 is $10,000','He should use simple interest'],reason:0,fix:'$1,000,000 − $100,000 = $900,000.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire interest and depreciation questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},m=function(n){return'$'+n.toLocaleString('en-JM')},r=R(0,2);if(r===0){var P=R(1,10)*10000,Rt=R(2,10),T=R(1,5),I=P*Rt*T/100;return{q:'Simple interest on '+m(P)+' at '+Rt+'% for '+T+' year'+(T>1?'s':'')+'?',o:[m(I),m(T===1?I*2:P*Rt/100),m(P+I)],a:0,why:'I = PRT ÷ 100 = '+m(I)+'.'}}if(r===1){var P2=R(1,20)*10000,R2=[5,10,20][R(0,2)],v=P2*(1+R2/100);return{q:m(P2)+' grows by '+R2+'% in one year. New value?',o:[m(v),m(P2-P2*R2/100),m(P2*R2/100)],a:0,why:'Multiply by '+(1+R2/100)+'.'}}var P3=R(2,20)*100000,R3=[10,20,25][R(0,2)],v3=P3*(1-R3/100);return{q:'A car worth '+m(P3)+' depreciates by '+R3+'% in a year. New value?',o:[m(v3),m(P3*(1+R3/100)),m(P3*R3/100)],a:0,why:'Multiply by '+(1-R3/100)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Choose numbers that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Choose a principal, rate and time that give exactly $1,200 simple interest. Type them as P, R, T (for example 10000, 4, 3).',placeholder:'P, R, T',check:function(v){var n=String(v).replace(/[$%\s]/g,'').split(',').map(Number);if(n.length!==3||n.some(function(x){return!(x>0)}))return{ok:false,msg:'Type three positive numbers separated by commas.'};var I=n[0]*n[1]*n[2]/100;return Math.abs(I-1200)<1e-6?{ok:true,msg:'Yes! ('+n[0]+' × '+n[1]+' × '+n[2]+') ÷ 100 = $1,200.'}:{ok:false,msg:'That gives $'+I.toLocaleString('en-JM')+' interest. Try again.'}}},{q:'At what simple interest rate (%) does money double in 10 years?',placeholder:'percent',check:function(v){return Math.abs(parseFloat(v)-10)<1e-6?{ok:true,msg:'Correct! The interest must equal the principal: P × R × 10 ÷ 100 = P, so R = 10%.'}:{ok:false,msg:'For money to double, the interest must equal the principal. Solve P × R × 10 ÷ 100 = P.'}}},{q:'A car depreciates by 50% each year. After how many years is it first worth less than one-tenth of its original price?',placeholder:'years',check:function(v){return+v===4?{ok:true,msg:'Yes! 0.5⁴ = 0.0625, which is less than 0.1, but 0.5³ = 0.125 is not.'}:{ok:false,msg:'Keep halving: 1 → 0.5 → 0.25 → … When is it first below 0.1?'}}}]}},
