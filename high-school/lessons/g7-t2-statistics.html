var STATS=function(a){var s=a.slice().sort(function(x,y){return x-y}),n=s.length,sum=s.reduce(function(p,c){return p+c},0),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,cnt={};s.forEach(function(v){cnt[v]=(cnt[v]||0)+1});var mx=Math.max.apply(null,Object.keys(cnt).map(function(k){return cnt[k]})),modes=Object.keys(cnt).filter(function(k){return cnt[k]===mx}).map(Number);return{s:s,n:n,sum:sum,mean:sum/n,med:med,modes:modes,mx:mx,range:s[n-1]-s[0],cnt:cnt}};
var DOTS=function(a){var st=STATS(a),min=st.s[0],max=st.s[st.n-1],span=Math.max(1,max-min),W=600,x=function(v){return 40+(v-min)/span*520},str='<svg viewBox="0 0 '+W+' 170" role="img" aria-label="A dot plot of the data"><rect width="'+W+'" height="170" fill="#faf8fe"/><line x1="30" y1="130" x2="570" y2="130" stroke="#3d2a73" stroke-width="2"/>';var seen={};st.s.forEach(function(v){seen[v]=(seen[v]||0)+1;str+='<circle cx="'+x(v)+'" cy="'+(130-seen[v]*18)+'" r="7" fill="'+(st.modes.indexOf(v)>=0?'#ffb02e':'#4b3aa8')+'"/>'});Object.keys(st.cnt).forEach(function(k){str+='<text x="'+x(+k)+'" y="150" text-anchor="middle" font-size="12" fill="#3d2a73">'+k+'</text>'});str+='<line x1="'+x(st.mean)+'" y1="20" x2="'+x(st.mean)+'" y2="135" stroke="#c02d5f" stroke-width="2" stroke-dasharray="6 4"/><text x="'+x(st.mean)+'" y="16" text-anchor="middle" font-size="12" fill="#c02d5f">mean</text>';return str+'</svg>'};

 glossary:[['Data','Facts or numbers collected to find something out.'],['Raw data','Data as it was collected, before it is sorted or organised.'],['Mode','The value that appears most often.'],['Median','The middle value when the data is in order.'],['Mean','The total of all the values divided by how many values there are.'],['Average','One number that represents a whole set of data: the mean, median or mode.'],['Range','The biggest value minus the smallest value: it shows how spread out the data is.'],['Frequency','How many times a value appears.'],['Tally','A quick way of counting in groups of five: four lines and a line across.'],['Outlier','A value that is very different from the rest.']],

 steps:[
  {phase:'engage',name:'The coach’s claim',title:'What does "average" really mean?',lead:'A football coach in Spanish Town says, "On average, my team scores 1 goal a game." His assistant says, "No, on average we score 1.5 goals!" They are looking at exactly the same 10 results.',

   blocks:[{type:'mcq',star:true,questions:[{q:'Put in order from smallest: 7, 3, 9, 1',o:['1, 3, 7, 9','9, 7, 3, 1','1, 7, 3, 9'],a:0,why:'Smallest to biggest.',teach:'Ordering from smallest to largest means starting with the smallest number and working up: 1, 3, 7, 9.'},{q:'What is 4 + 6 + 5 + 9?',o:['24','23','25'],a:0,why:'4 + 6 = 10, 10 + 5 = 15, 15 + 9 = 24.',teach:'Add step by step, or look for friendly pairs: 4 + 6 = 10, then 5 + 9 = 14, and 10 + 14 = 24.'},{q:'What is 30 ÷ 4?',o:['7.5','8','7'],a:0,why:'30 ÷ 4 = 7 remainder 2, which is 7.5.',teach:'4 goes into 30 seven times with 2 left over. 2 out of 4 is a half, so 30 ÷ 4 = 7.5.'},{q:'What is halfway between 6 and 8?',o:['7','14','6.5'],a:0,why:'(6 + 8) ÷ 2 = 7.',teach:'To find the halfway point, add the two numbers and divide by 2: (6 + 8) ÷ 2 = 7.'}]}]},

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="dlD">Data set:</label><select id="dlD"><option value="h">Heights of 9 students</option><option value="g">Goals in 10 matches</option><option value="s">Shoe sizes of 12 students</option></select></div><p class="dlT" style="font-weight:600"></p><div class="scene dlSvg"></div><div class="tile dlOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge dlN"></span> <strong class="dlQ"></strong></p><div class="controls"><input type="number" step="0.01" class="dlA" aria-label="Your answer" placeholder="answer"><button type="button" class="go dlC">Check</button></div><div class="fb dlFb" aria-live="polite">Use the lab to help you.</div></div>',
     init:function(box,api){var d=box.querySelector('#dlD');function draw(){var D=DATA[d.value],st=STATS(D[1]);box.querySelector('.dlT').textContent=D[0]+': '+D[1].join(', ');box.querySelector('.dlSvg').innerHTML=DOTS(D[1]);box.querySelector('.dlOut').innerHTML='<p style="margin:0 0 6px"><strong>In order:</strong> '+st.s.join(', ')+'</p><table class="rec" style="max-width:none"><tbody><tr><td><strong>Mode</strong> (most common)</td><td>'+st.modes.join(' and ')+' (appears '+st.mx+' times)</td></tr><tr><td><strong>Median</strong> (middle)</td><td>'+st.med+(st.n%2?' (the middle one of '+st.n+')':' (halfway between the two middle values)')+'</td></tr><tr><td><strong>Mean</strong> (share equally)</td><td>'+st.sum+' ÷ '+st.n+' = '+(Math.round(st.mean*100)/100)+'</td></tr><tr><td><strong>Range</strong> (spread)</td><td>'+st.s[st.n-1]+' − '+st.s[0]+' = '+st.range+'</td></tr></tbody></table>'}d.onchange=draw;var T=[{t:'What is the median height of the 9 students, in cm?',a:152,tol:0},{t:'What is the mean number of goals in the 10 matches?',a:1.5,tol:0.001},{t:'What is the range of the shoe sizes?',a:4,tol:0}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.dlN').textContent='All done';box.querySelector('.dlQ').textContent='You completed every challenge!';box.querySelector('.dlC').disabled=true;return}box.querySelector('.dlN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.dlQ').textContent=T[q].t}box.querySelector('.dlC').onclick=function(){var v=parseFloat(box.querySelector('.dlA').value),fb=box.querySelector('.dlFb');if(Math.abs(v-T[q].a)<=T[q].tol){fb.className='fb ok dlFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.dlA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no dlFb';fb.textContent='Not yet. Choose the right data set and read the table.'}};draw();task()}},
    {type:'recall',text:'Both are right! For the goals, the mode and median are 1, but the mean is 1.5. The coach used the median (or mode); the assistant used the mean.'}]},
  {phase:'explain',name:'Teach: mode, median and mean',title:'Learn: three kinds of average',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Mode, median an mean: three way fi describe di middle.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The mode: the most common value',explain:'<p>Imagine a shoe shop in Half Way Tree deciding which size of school shoe to order the most of. They do not need a calculation; they just need to know which size people buy most often. That is the {{mode|the value that appears most often}}: the value that appears <strong>most often</strong>.</p><p>To find the mode, count how many times each value appears. The one with the most is the mode. In the dot plot, it is the tallest pile of dots.</p><p>A set of data can have more than one mode, if two values tie for the most. And if every value appears only once, there is no mode at all. The mode is the only average that also works for things that are not numbers, like favourite colours or favourite fruits.</p>',
     example:{q:'Find the mode of the shoe sizes: 6, 7, 7, 8, 6, 9, 7, 8, 7, 10, 6, 8.',steps:[{do:'Count each size: 6 appears 3 times, 7 appears 4 times, 8 appears 3 times, 9 once, 10 once.'},{do:'7 appears most often.'},{do:'The mode is size 7.',why:'The mode is the value, not how many times it appears.'}]},
     mistake:'Giving the number of times instead of the value. The mode here is 7 (the size), not 4 (how many times it appears).',
     check:{q:'Find the mode: 3, 5, 5, 2, 9, 5, 3.',o:['5','3','3 and 5'],a:0,why:'5 appears three times, more than any other value.',hint:'Which value appears most often?'}},
    {title:'The median: the middle value',explain:'<p>Line up your class from shortest to tallest. The person standing exactly in the middle has the {{median|the middle value when the data is in order}} height. Half the class is shorter, and half is taller.</p><p>So to find the median: <strong>first put the data in order</strong>. Then find the middle value. With 9 values, the middle one is the 5th, because there are 4 on each side.</p><p>What if there is an even number of values, like 10? Then there are two middle values, the 5th and the 6th. The median is halfway between them: add them and divide by 2.</p><p>A handy trick for finding the middle position: add 1 to the number of values, then halve it. For 9 values: (9 + 1) ÷ 2 = 5th. For 10 values: (10 + 1) ÷ 2 = 5.5, which tells you it is halfway between the 5th and 6th.</p>',
     example:{q:'Find the median of the heights: 148, 152, 155, 150, 160, 152, 158, 145, 152.',steps:[{do:'Put them in order: 145, 148, 150, 152, 152, 152, 155, 158, 160.',why:'The median only works on ordered data.'},{do:'There are 9 values, so the middle is the 5th: (9 + 1) ÷ 2 = 5.'},{do:'The 5th value is 152, so the median is 152 cm.'}]},
     mistake:'Finding the middle of the list WITHOUT putting it in order first. Always order the data first.',
     check:{q:'Find the median: 4, 8, 2, 6.',o:['5','8','6'],a:0,why:'In order: 2, 4, 6, 8. Halfway between 4 and 6 is 5.',hint:'Order them first; there are two middle values.'}},
    {title:'The mean: sharing equally',explain:'<p>Imagine four friends picked mangoes: 3, 7, 2 and 8. They decide to pile them all together and share them out equally. How many does each person get? Altogether there are 3 + 7 + 2 + 8 = 20 mangoes, shared between 4 people, so each gets 5. That fair-share number is the {{mean|the total of all the values divided by how many values there are}}.</p><p>So the mean is: <strong>add up all the values, then divide by how many values there are</strong>.</p><p>The mean is often what people mean when they say “average”. Notice that it does not have to be one of the actual values. The football team’s mean was 1.5 goals, even though they never scored half a goal! It just tells you what each game would be if all the goals were spread evenly.</p>',
     example:{q:'Find the mean number of goals: 2, 0, 1, 3, 1, 1, 4, 0, 2, 1.',steps:[{do:'Add them: 2 + 0 + 1 + 3 + 1 + 1 + 4 + 0 + 2 + 1 = 15.'},{do:'Count the values: 10 matches.'},{do:'Mean = 15 ÷ 10 = 1.5 goals per match.'}]},
     mistake:'Dividing by the wrong number. Divide by how many VALUES there are, including any zeros. The two 0-goal games still count as games.',
     check:{q:'Find the mean of 4, 6, 8, 10.',o:['7','28','8'],a:0,why:'28 ÷ 4 = 7.',hint:'Total, then divide by 4.'}}]}]},
  {phase:'explain',name:'Teach: range and frequency tables',title:'Learn: the range and frequency tables',lead:'Next, how spread out data is, and a neat way to organise lots of data.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Range tell yuh how spread out di number dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The range: how spread out?',explain:'<p>Two classes both have a mean test score of 60. In one class, everyone scored between 55 and 65. In the other, scores went from 20 all the way to 100! The averages are the same, but the classes are very different.</p><p>The {{range|the biggest value minus the smallest value}} tells us how <strong>spread out</strong> the data is: <strong>range = biggest value − smallest value</strong>. The first class has a range of 65 − 55 = 10; the second has a range of 100 − 20 = 80.</p><p>A small range means the data is close together and consistent. A big range means it is widely spread. A cricket coach might prefer a batter whose scores have a small range, because that player is more reliable.</p>',
     example:{q:'Find the range of the heights: 145, 148, 150, 152, 152, 152, 155, 158, 160.',steps:[{do:'Biggest: 160 cm. Smallest: 145 cm.'},{do:'Range = 160 − 145 = 15 cm.'}]},
     mistake:'Writing the range as “145 to 160”. The range is ONE number: the difference.',
     check:{q:'Find the range: 12, 7, 20, 15, 9.',o:['13','8','20'],a:0,why:'20 − 7 = 13.',hint:'Biggest minus smallest.'}},
    {title:'Frequency tables',explain:'<p>When there is a lot of data, a list gets messy. A {{frequency|how many times a value appears}} table organises it neatly. It has a column for each possible value, a column for {{tallies|a quick way to count in groups of five}}, and a column for the frequency: how many times each value appears.</p><p>To make one, go through the data one value at a time and make a tally mark beside it. Tally in groups of five: four upright lines, then a fifth line across them. This makes counting quick and hard to get wrong. Then count the tallies to fill in the frequency column.</p><p>From a frequency table you can read lots of things: the <strong>mode</strong> is the value with the highest frequency, the total of the frequency column is how many values there are, and the <strong>range</strong> is the biggest value minus the smallest value (ignore the frequencies for that!).</p>',
     example:{q:'Make a frequency table for the shoe sizes 6, 7, 7, 8, 6, 9, 7, 8, 7, 10, 6, 8, and find the range.',steps:[{do:'Size 6: |||  → 3. Size 7: ||||  → 4. Size 8: |||  → 3. Size 9: |  → 1. Size 10: |  → 1.'},{do:'Check: 3 + 4 + 3 + 1 + 1 = 12 students ✓'},{do:'Range = biggest size − smallest size = 10 − 6 = 4.',why:'Use the values, not the frequencies.'}]},
     mistake:'Finding the range from the frequency column (4 − 1 = 3). The range uses the values: 10 − 6 = 4.',
     check:{q:'In a frequency table, the mode is…',o:['the value with the highest frequency','the highest value','the total frequency'],a:0,why:'The mode appears most often.',hint:'Most often = biggest frequency.'}},
    {title:'Choosing the best average',explain:'<p>Each average has its strengths. The <strong>mean</strong> uses every value, which is fair, but one very unusual value, an {{outlier|a value very different from the rest}}, can drag it a long way. The <strong>median</strong> is not affected much by outliers, so it is good for things like house prices or salaries. The <strong>mode</strong> is best when you want the most popular choice, like a shoe size or a favourite flavour.</p><p>Here is an example. Five people earn $40,000, $45,000, $50,000, $55,000 and $1,000,000 a month. The mean is $238,000, which describes nobody! The median, $50,000, is much more typical.</p><p>So always ask: what do I want to know, and is there an outlier pulling things one way?</p>',
     example:{q:'Weekly pocket money of 5 friends: $500, $600, $600, $700, $5,000. Which average best describes a typical friend?',steps:[{do:'Mean = 7,400 ÷ 5 = $1,480. That is higher than four of the five friends get.',why:'The $5,000 outlier drags the mean up.'},{do:'Median = $600 (the middle value). Mode = $600.'},{do:'The median (or mode), $600, is the best description of a typical friend.'}]},
     mistake:'Always using the mean. If there is an outlier, the median often gives a fairer picture.',
     check:{q:'Which average is best for the most popular school-shoe size to stock?',o:['Mode','Mean','Range'],a:0,why:'The mode tells you the most common value.',hint:'Most popular = most common.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Mode',text:'The value that appears most often. There can be more than one mode, or none.'},{title:'Median',text:'Order the data. The middle value is in position (n + 1) ÷ 2. For an even number of values, take halfway between the two middle ones.'},{title:'Mean',text:'Add all the values and divide by how many there are. It does not have to be one of the values.'},{title:'Range and frequency tables',text:'Range = biggest − smallest. In a frequency table, use tallies in fives; the mode has the highest frequency.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Test marks out of 10: 7, 9, 6, 8, 10. Find the mean, median and range.',steps:[{do:'Mean: 7 + 9 + 6 + 8 + 10 = 40, and 40 ÷ 5 = 8.'},{do:'Median: in order 6, 7, 8, 9, 10; the middle (3rd) value is 8.'},{do:'Range: 10 − 6 = 4.'}]},
     {type:'fill',q:'Find the median of 3, 9, 5, 11, 7, 1.',steps:[{text:'In order: 1, 3, 5, 7, 9, 11. The two middle values are 5 and 7.'},{text:'Median = (5 + 7) ÷ 2 = ___',blank:true,a:6,hint:'Halfway between 5 and 7.'}],sol:'6.'},
     {type:'own',q:'Find the mode of 4, 2, 4, 6, 2, 4, 8.',a:4,hint:'Count each value.',sol:'4 appears three times.'},

    {icon:'🗂️',title:'Which average?',desc:'Decide which average suits each situation best.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Most popular → mode. Outliers → median. Fair share of everything → mean.',bins:[{id:'mo',label:'Mode'},{id:'me',label:'Median'},{id:'mn',label:'Mean'}],items:[{label:'Most popular ice cream flavour',bin:'mo'},{label:'Typical house price in a parish with a few mansions',bin:'me'},{label:'Equal share of the class’s total savings',bin:'mn'},{label:'Most common shoe size to stock',bin:'mo'},{label:'Typical salary in a company with one very rich boss',bin:'me'},{label:'A batter’s runs per innings over the season',bin:'mn'}]}},

    {icon:'📏',title:'Order the averages',desc:'Work out each statistic, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'For the data 3, 3, 5, 9, 20, work out each statistic, then tap from smallest to largest.',rounds:[[{label:'Mode',v:3,show:'3'},{label:'Median',v:5,show:'5'},{label:'Mean',v:8,show:'8'},{label:'Range',v:17,show:'17'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The mean is one of the values in the data.',a:'sometimes',why:'For 2, 4, 6 the mean is 4 (a value), but for 1, 2 it is 1.5 (not a value).',hint:'Try 1 and 2.'},{s:'The median is found after putting the data in order.',a:'always',why:'You cannot find the middle until the data is in order.'},{s:'A data set has exactly one mode.',a:'sometimes',why:'It can have one, more than one, or none.'},{s:'The range can be negative.',a:'never',why:'Biggest − smallest is never below 0.'},{s:'One outlier changes the mean more than the median.',a:'always',why:'The mean uses every value’s size; the median only cares about the middle position.',hint:'Try changing the biggest value to 1,000.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Shanice',q:'Find the median of 9, 2, 7, 4, 5.',lines:['The middle number in the list is 7','So the median is 7'],wrong:0,reasons:['She did not order the data first: 2, 4, 5, 7, 9','The median is the biggest number','She should add them'],reason:0,fix:'In order: 2, 4, 5, 7, 9. The median is 5.'},{who:'Omar',q:'Find the mode of 6, 8, 8, 8, 9.',lines:['8 appears 3 times','So the mode is 3'],wrong:1,reasons:['The mode is the value (8), not how many times it appears','The mode is 9','There is no mode'],reason:0,fix:'The mode is 8.'},{who:'Keisha',q:'Find the mean of 0, 4, 5, 3.',lines:['4 + 5 + 3 = 12','12 ÷ 3 = 4'],wrong:1,reasons:['There are 4 values (including 0), so divide by 4','She should not add 0','She should multiply'],reason:0,fix:'12 ÷ 4 = 3.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire averages.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},n=[3,4,5][R(0,2)],a=[];for(var i=0;i<n;i++)a.push(R(1,12));var r=R(0,2),st,o,add=function(x){if(o.length<3&&o.indexOf(String(x))<0)o.push(String(x))};if(r===0){st=STATS(a);if(st.sum%n){a[0]+=n-st.sum%n;st=STATS(a)}o=[String(st.sum/n)];[st.sum,st.med,st.sum/n+1,st.sum/n+2].forEach(add);return{q:'Mean of '+a.join(', ')+'?',o:o,a:0,why:st.sum+' ÷ '+n+'.'}}if(r===1){st=STATS(a);o=[String(st.range)];[st.s[n-1],st.range+1,st.range+2].forEach(add);return{q:'Range of '+a.join(', ')+'?',o:o,a:0,why:st.s[n-1]+' − '+st.s[0]+'.'}}if(a.length%2===0)a.push(R(1,12));st=STATS(a);o=[String(st.med)];[a[Math.floor(a.length/2)],st.s[st.s.length-1],st.med+1,st.med+2].forEach(add);return{q:'Median of '+a.join(', ')+'?',o:o,a:0,why:'In order: '+st.s.join(', ')+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent data sets that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type five numbers with a mean of 6. (For example: a, b, c, d, e)',placeholder:'five numbers',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==5||n.some(isNaN))return{ok:false,msg:'Type five numbers separated by commas.'};var s=n.reduce(function(a,b){return a+b},0);return s===30?{ok:true,msg:'Yes! They add up to 30, and 30 ÷ 5 = 6.'}:{ok:false,msg:'Those add up to '+s+'. For a mean of 6, five numbers must add up to 30.'}}},{q:'Type four numbers with a median of 5 where NONE of the numbers is 5.',placeholder:'four numbers',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==4||n.some(isNaN))return{ok:false,msg:'Type four numbers separated by commas.'};if(n.indexOf(5)>=0)return{ok:false,msg:'None of the numbers can be 5.'};var st=STATS(n);return st.med===5?{ok:true,msg:'Clever! The two middle numbers average to 5.'}:{ok:false,msg:'The median is '+st.med+'. The two middle numbers must add up to 10.'}}},{q:'Type a set of numbers with a range of 10 and a mode of 7.',placeholder:'numbers',check:function(v){var n=String(v).split(',').map(Number);if(n.length<3||n.some(isNaN))return{ok:false,msg:'Type at least three numbers.'};var st=STATS(n);return st.range===10&&st.modes.length===1&&st.modes[0]===7?{ok:true,msg:'Yes! Range 10 and mode 7.'}:{ok:false,msg:'Your range is '+st.range+' and mode '+st.modes.join(' and ')+'.'}}}]}},
    {icon:'📏',title:'Mission: our class health survey',desc:'Analyse your class’s heights, like the NSC activity.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Following the NSC activity, a Grade 7 class in Ocho Rios measured the heights of 10 students (in cm): 150, 145, 160, 152, 148, 152, 155, 170, 152, 146.',parts:[{q:'What is the mode?',a:152,hint:'Which height appears most often?',sol:'152 cm (3 times).',placeholder:'cm'},{q:'What is the median? (Put them in order first.)',a:152,hint:'In order: 145, 146, 148, 150, 152, 152, 152, 155, 160, 170. Halfway between the 5th and 6th.',sol:'The 5th and 6th values are both 152, so the median is 152 cm.',placeholder:'cm'},{q:'What is the mean height?',a:153,hint:'Total = 1,530.',sol:'1,530 ÷ 10 = 153 cm.',placeholder:'cm'},{q:'What is the range?',a:25,hint:'170 − 145.',sol:'25 cm.',placeholder:'cm'},{q:'One student is 170 cm, much taller than the rest. Which average is least affected by this? Type mean, median or mode.',a:['median','mode'],hint:'Which averages only care about position or popularity?',sol:'The median (and the mode) are not dragged up by one tall student; the mean is.'}],done:'You collected and analysed real class data, just like the NSC activity.'}}
   ]}]},
