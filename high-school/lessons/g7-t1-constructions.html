<script>
var K=window.LessonKit;
var P2=function(cx,cy,r,a){return[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)]};
var ARC=function(cx,cy,r,a0,a1,col){var p=P2(cx,cy,r,a0),q=P2(cx,cy,r,a1);return'<path d="M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 0 '+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" fill="none" stroke="'+(col||'#c02d5f')+'" stroke-width="2.2"/>'};
var DOT=function(x,y,l,dx,dy){return'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#3d2a73"/>'+(l?'<text x="'+(x+(dx||8))+'" y="'+(y+(dy||-8))+'" font-size="16" font-weight="700" fill="#3d2a73">'+l+'</text>':'')};
var LN=function(x1,y1,x2,y2,w,c,d){return'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#4b3aa8')+'" stroke-width="'+(w||3)+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>'};
var RT=function(x,y){return'<path d="M'+x+' '+(y-14)+' h14 v14" fill="none" stroke="#16766a" stroke-width="2"/>'};
var CONS={
 circle:{name:'A circle of radius 3 cm',steps:[['Mark the centre point O with a sharp pencil.',DOT(300,170,'O')],['Place the compass point on 0 on a ruler and open the pencil to 3 cm. That distance is the radius.','<rect x="210" y="285" width="200" height="34" fill="#fff1dc" stroke="#a85d00"/>'+[0,1,2,3,4,5,6].map(function(i){return LN(220+i*30,285,220+i*30,298,1.5,'#a85d00')+'<text x="'+(216+i*30)+'" y="314" font-size="11" fill="#7a4300">'+i+'</text>'}).join('')+LN(220,282,310,282,2,'#c02d5f','5 4')+'<text x="230" y="276" font-size="13" fill="#c02d5f">compasses open 3 cm</text>'],['Without changing the width, put the compass point on O and turn it all the way around.','<circle cx="300" cy="170" r="90" fill="none" stroke="#c02d5f" stroke-width="2.5"/>'],['Label the radius. Every point on the circle is exactly 3 cm from O.',LN(300,170,390,170,2,'#16766a','6 4')+'<text x="325" y="162" font-size="14" fill="#16766a">r = 3 cm</text>']]},
 copy:{name:'Copy a line segment',steps:[['Here is line segment AB. Draw a longer line below it and mark a point C on it.',LN(100,90,260,90)+DOT(100,90,'A')+DOT(260,90,'B')+LN(80,230,540,230,2,'#5d5478')+DOT(150,230,'C',-6,24)],['Put the compass point on A and open the pencil to B. The compasses now hold the length AB.',ARC(100,90,160,-12,12,'#c02d5f')],['Without changing the width, put the compass point on C and draw an arc that crosses the line. Label the crossing D.',ARC(150,230,160,-12,12)+DOT(310,230,'D',-6,24)],['CD is exactly the same length as AB. You copied it without measuring.',LN(150,230,310,230,5,'#16766a')]]},
 bisector:{name:'Perpendicular bisector of AB',steps:[['Draw line segment AB.',LN(180,200,420,200)+DOT(180,200,'A',-22,-6)+DOT(420,200,'B',8,-6)],['Open the compasses to MORE than half of AB. With the point on A, draw arcs above and below the line.',ARC(180,200,160,-58,58)],['Without changing the width, put the point on B and draw arcs that cross the first two.',ARC(420,200,160,122,238)],['Join the two crossing points with a ruler. This line cuts AB in half at M, at a right angle.',LN(300,70,300,330,2.5,'#16766a')+DOT(300,200,'M',8,22)+RT(300,200)]]},
 perp:{name:'Perpendicular from a point on a line',steps:[['Here is a line with a point P on it.',LN(80,200,520,200,2.5,'#5d5478')+DOT(300,200,'P',-6,24)],['With the compass point on P, draw an arc that cuts the line on both sides. Label the cuts A and B.',ARC(300,200,90,-12,12)+ARC(300,200,90,168,192)+DOT(210,200,'A',-6,24)+DOT(390,200,'B',-6,24)],['Open the compasses wider. From A, then from B, draw arcs above P that cross. Label the crossing C.',ARC(210,200,150,35,70)+ARC(390,200,150,110,145)+DOT(300,80,'C',8,-6)],['Join P to C. PC is perpendicular to the line: it makes a right angle.',LN(300,200,300,50,2.5,'#16766a')+RT(300,200)]]},
 parallel:{name:'A parallel line through a point P',steps:[['Here is a line and a point P above it.',LN(60,240,540,240,2.5,'#5d5478')+DOT(240,120,'P',-14,-10)],['Choose a compass width. From P, draw an arc cutting the line at A.',ARC(240,120,150,220,240)+DOT(150,240,'A',-6,24)],['Keep the SAME width. From A, draw an arc cutting the line further along at B.',ARC(150,240,150,-10,10)+DOT(300,240,'B',-6,24)],['Keep the same width. Draw an arc from B and an arc from P. Label where they cross C.',ARC(300,240,150,40,65)+ARC(240,120,150,-12,12)+DOT(390,120,'C',8,-8)],['Join P and C and extend it. PC is parallel to the line, because PABC is a rhombus.',LN(60,120,540,120,2.5,'#16766a')]]}};
var CSVG=function(k,upto){var c=CONS[k],n=upto==null?c.steps.length:upto;return'<svg viewBox="0 0 600 340" role="img" aria-label="Construction: '+c.name+'"><rect width="600" height="340" fill="#faf8fe"/>'+c.steps.slice(0,n).map(function(s){return s[1]}).join('')+'</svg>'};

 id:'g7-t1-maths-constructions',
 grade:7, term:1, subject:'Mathematics', strand:'Geometry',
 title:'Geometric Constructions',
 goals:['use a ruler and compasses accurately, and explain what compasses do','construct a circle of a given radius','copy a line segment and construct the perpendicular bisector of a line segment','construct perpendicular and parallel lines'],
 curriculum:{framework:'NSC Mathematics, Grade 7',term:'Term 1',unit:'Unit 5: Geometric Construction',strand:'Geometry',standard:'Explore paths, geometric shapes, and space and make generalizations about geometric relationships within the environment.',
  objectives:['Construct, using appropriate geometric instruments, a circle of a given radius;','Construct, using ruler and compasses only: a) line segments; b) Perpendicular and parallel lines; c) Line bisectors.'],
  focus:'Using compasses, constructing circles, copying segments, perpendicular bisectors, perpendiculars from a point, and parallel lines (rhombus method), with the reasons each method works.',
  note:'Source: National Standards Curriculum Guide, Mathematics Grades 7-9 (MoEYI, 2018), Grade 7, Term 1, Unit 5. Students should carry out every construction on paper with real instruments alongside this lesson.'},
 glossary:[['Construct','To draw accurately using only a ruler (straight edge) and compasses.'],['Compasses','An instrument that keeps a fixed distance between its point and its pencil, used to draw circles and arcs.'],['Arc','Part of a circle.'],['Radius','The distance from the centre of a circle to its edge.'],['Diameter','The distance across a circle through its centre; twice the radius.'],['Perpendicular','Meeting at a right angle (90°).'],['Parallel','Always the same distance apart; never meeting.'],['Bisect','To cut into two equal parts.'],['Perpendicular bisector','A line that cuts a segment in half at a right angle.'],['Midpoint','The point exactly halfway along a line segment.'],['Rhombus','A quadrilateral with four equal sides; its opposite sides are parallel.']],
 teacher:{time:'about 80 minutes, plus time for students to construct on paper',flow:[['Engage','8 min','Predict how to find the exact middle of a line without measuring.','Hand out compasses, rulers and sharp pencils.'],['Explore','17 min','Construction player: step through five constructions.','Students copy each step on paper as they go.'],['Explain','30 min','Teaching pages on what compasses do and why each construction works; I do, we do, you do.','Demonstrate on the board; check compasses are tight.'],['Elaborate','15 min','Challenge Zone (including ordering construction steps) and problems.','Students who finish early construct a rhombus or a regular hexagon.'],['Evaluate','10 min','Quiz and reflection.','Collect paper constructions to check accuracy (within 1 mm).']],
  misconceptions:['Opening the compasses to the diameter instead of the radius.','Opening the compasses to less than half the segment when bisecting, so the arcs do not meet.','Changing the compass width part-way through a construction.','Rubbing out construction arcs (they should be left to show the method).'],
  extension:'Construct a regular hexagon inside a circle by stepping the radius around the circumference six times. Why does this work?'},
 steps:[
  {phase:'engage',name:'The exact middle',title:'Find the exact middle',lead:'A line is 7.3 cm long. You need its exact middle, but your ruler only marks every millimetre, and the middle is at 3.65 cm.',
   mission:['Type your name.','Predict the best way to find the exact middle.','Write what you already know about compasses and rulers.'],
   patois:'How yuh woulda find di exact middle a di line, widout measure?',
   blocks:[{type:'name'},{type:'predict',star:true,q:'What is the best way to find the EXACT middle of the line?',options:['Measure carefully and halve it','Use compasses to construct it','It cannot be done exactly'],after:'You will learn the construction that does it.'},{type:'write',fields:[{id:'know',label:'What I know about compasses and rulers:',placeholder:'Example: compasses draw circles'},{id:'wonder',label:'Something I wonder about drawing shapes accurately:',placeholder:'Example: how do architects draw plans?'}]}]},
  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],
   patois:'Mek wi check wah yuh know already.',
   blocks:[{type:'mcq',star:true,questions:[{q:'The radius of a circle is…',o:['the distance across it','the distance from the centre to the edge','the distance around it'],a:1,why:'The radius goes from the centre to the edge.',teach:'The radius is the distance from the centre of a circle to any point on its edge. The diameter goes right across, so it is twice the radius.'},{q:'A circle has a diameter of 8 cm. What is its radius?',o:['4 cm','8 cm','16 cm'],a:0,why:'The radius is half the diameter: 8 ÷ 2 = 4 cm.',teach:'The diameter is two radii joined end to end through the centre. So radius = diameter ÷ 2.'},{q:'Perpendicular lines meet at…',o:['45°','90°','180°'],a:1,why:'Perpendicular lines meet at a right angle.',teach:'Perpendicular lines meet at 90°, a right angle, like the corner of a page.'},{q:'Parallel lines…',o:['meet at a point','never meet and stay the same distance apart','cross at 90°'],a:1,why:'Parallel lines never meet.',teach:'Parallel lines, like railway tracks, stay the same distance apart and never meet.'}]}]},
  {phase:'explore',name:'Construction player',title:'Explore: watch the constructions step by step',lead:'Choose a construction and step through it. Have a ruler, compasses and a sharp pencil ready, and copy each step on paper as you go.',
   mission:['Choose a construction and press Next step until it is finished.','Copy each step on paper with real instruments.','Finish at least 3 constructions for a star.'],
   patois:'Step by step. Copy it pon yuh paper.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="cpK">Construction:</label><select id="cpK"></select></div><div class="scene cpSvg"></div><div class="explain cpTxt" aria-live="polite"></div><div class="controls"><button type="button" class="cpB">← Back</button><button type="button" class="go cpN">Next step →</button><span class="cpProg" style="font-weight:600;color:#4b2a9a"></span></div>',
     init:function(box,api){var keys=Object.keys(CONS),sel=box.querySelector('#cpK'),i=1,fin=api.get('f')||[];keys.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=CONS[k].name;sel.appendChild(o)});function draw(){var c=CONS[sel.value],n=c.steps.length;box.querySelector('.cpSvg').innerHTML=CSVG(sel.value,i);box.querySelector('.cpTxt').innerHTML='<strong>Step '+i+' of '+n+':</strong> '+c.steps[i-1][0];box.querySelector('.cpB').disabled=i===1;box.querySelector('.cpN').disabled=i===n;if(i===n&&fin.indexOf(sel.value)<0){fin.push(sel.value);api.set('f',fin);if(fin.length>=3)api.complete()}box.querySelector('.cpProg').textContent='Constructions finished: '+fin.length+' of '+keys.length}sel.onchange=function(){i=1;draw()};box.querySelector('.cpN').onclick=function(){i++;draw()};box.querySelector('.cpB').onclick=function(){i--;draw()};draw()}}]},
  {phase:'explain',name:'Teach: tools, circles and segments',title:'Learn: compasses, circles and copying lengths',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Di compasses keep di same distance. Dat a di secret.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What compasses do',explain:'<p>To {{construct|draw accurately using only a ruler and compasses}} means to draw accurately using only a ruler (as a straight edge) and {{compasses|an instrument that keeps a fixed distance between its point and its pencil}}.</p><p>The key idea: compasses <strong>keep a fixed distance</strong>. Every point an arc passes through is the same distance from the compass point. That is why every construction works.</p><p>Always use a sharp pencil, make sure the compasses are tight so the width does not slip, and <strong>leave your construction arcs</strong>: they show how you did it.</p>',
     example:{q:'Why does a compass draw a perfect circle?',steps:[{do:'The point stays fixed at the centre.'},{do:'The pencil stays at a fixed distance from the point.',why:'The width of the compasses does not change while you turn it.'},{do:'So every point on the curve is the same distance from the centre: that is exactly what a circle is.'}]},
     mistake:'Rubbing out the construction arcs. In tests and exams, the arcs must be left to show your method.',
     check:{q:'What is the main job of compasses in a construction?',o:['To measure angles','To keep a fixed distance','To draw straight lines'],a:1,why:'Compasses copy and keep a fixed distance; rulers draw straight lines; protractors measure angles.',hint:'What stays the same when you swing compasses?'}},
    {title:'Constructing a circle of a given radius',explain:'<p>To draw a circle with a given {{radius|the distance from the centre to the edge}}: mark the centre; open the compasses to the radius using a ruler; put the point on the centre and turn the compasses all the way around.</p><p>If you are given the {{diameter|the distance across a circle through its centre}}, halve it first, because the compasses must be set to the <strong>radius</strong>.</p>',visual:CSVG('circle'),
     example:{q:'Construct a circle with a diameter of 10 cm.',steps:[{do:'Radius = diameter ÷ 2 = 10 ÷ 2 = 5 cm.',why:'Compasses are always set to the radius.'},{do:'Open the compasses to 5 cm on a ruler.'},{do:'Mark the centre, place the point on it, and turn the compasses one full turn.'}]},
     mistake:'Opening the compasses to the diameter. A 10 cm opening draws a circle with a 20 cm diameter, twice as big.',
     check:{q:'To draw a circle with a diameter of 12 cm, open the compasses to…',o:['6 cm','12 cm','24 cm'],a:0,why:'The radius is 12 ÷ 2 = 6 cm.',hint:'Compasses are set to the radius.'}},
    {title:'Copying a line segment',explain:'<p>A {{line segment|part of a line with two endpoints}} can be copied without measuring: put the compass point on one end and the pencil on the other, so the compasses "hold" the length. Then move the compasses to the new line and draw an arc.</p><p>This works because compasses keep the distance exactly, which is often more accurate than measuring with a ruler.</p>',visual:CSVG('copy'),
     example:{q:'Copy segment AB onto a line starting at C.',steps:[{do:'Put the compass point on A and open the pencil to B.'},{do:'Keep the width. Put the point on C and draw an arc crossing the line. Label it D.'},{do:'CD = AB, because the compasses kept the distance the same.'}]},
     mistake:'Letting the compasses slip when you move them. Hold them by the top, not by the legs.',
     check:{q:'After copying AB to make CD, how do the lengths compare?',o:['CD is longer','CD = AB','CD is shorter'],a:1,why:'The compasses kept the distance fixed.',hint:'The compass width did not change.'}}]}]},
  {phase:'explain',name:'Teach: perpendiculars and parallels',title:'Learn: bisectors, perpendiculars and parallel lines',lead:'Next, three constructions that use crossing arcs. Each one works for a reason you can explain.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Di arc dem cross fi show yuh weh fi draw di line.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The perpendicular bisector',explain:'<p>To {{bisect|cut into two equal parts}} means to cut into two equal parts. The {{perpendicular bisector|a line that cuts a segment in half at a right angle}} of AB cuts it in half at a right angle.</p><p><strong>Method:</strong> open the compasses to more than half of AB. Draw arcs above and below from A, then from B with the same width. Join the two crossing points.</p><p><strong>Why it works:</strong> each crossing point is the same distance from A as from B. Every point the same distance from A and B lies on the perpendicular bisector.</p>',visual:CSVG('bisector'),
     example:{q:'Bisect a line segment AB that is 7.3 cm long (the opening puzzle).',steps:[{do:'Open the compasses to more than half of 7.3 cm, say 5 cm.',why:'If the width is less than half, the arcs from A and B will not meet.'},{do:'From A, draw arcs above and below the line. From B, with the same width, draw arcs that cross them.'},{do:'Join the two crossing points. Where this line crosses AB is the midpoint M.'},{do:'AM = MB = 3.65 cm exactly, with no measuring needed. Was your prediction right?'}]},
     mistake:'Opening the compasses to less than half of AB. The arcs from A and B will not reach each other.',
     check:{q:'The perpendicular bisector of a 9 cm segment cuts it into two parts. How long is each part?',o:['3 cm','4.5 cm','9 cm'],a:1,why:'Bisecting cuts it into two equal halves: 9 ÷ 2 = 4.5 cm.',hint:'Bisect means cut into two equal parts.'}},
    {title:'A perpendicular from a point on a line',explain:'<p>To construct a line {{perpendicular|meeting at a right angle (90°)}} to a line at a point P on it:</p><p><strong>1.</strong> From P, draw an arc cutting the line on both sides at A and B. Now P is the midpoint of AB. <strong>2.</strong> Open the compasses wider. From A and from B, draw arcs that cross above P at C. <strong>3.</strong> Join P to C.</p><p><strong>Why it works:</strong> it is the perpendicular bisector of AB, and P is the middle of AB.</p>',visual:CSVG('perp'),
     example:{q:'Construct a right angle at a point P on a line.',steps:[{do:'From P, arc the line on both sides: A and B, with PA = PB.'},{do:'Wider compasses: arcs from A and from B cross at C.'},{do:'Join PC. The angle between PC and the line is 90°. You have constructed a right angle without a protractor.'}]},
     mistake:'Using a different compass width for the arcs from A and from B. They must be equal, or C will not be directly above P.',
     check:{q:'What angle does PC make with the line?',o:['45°','60°','90°'],a:2,why:'PC is perpendicular to the line.',hint:'Perpendicular means…'}},
    {title:'A parallel line through a point',explain:'<p>To construct a line {{parallel|always the same distance apart; never meeting}} to a line through a point P:</p><p>Use <strong>one compass width the whole time</strong>. From P, arc the line at A. From A, arc the line at B. From B, draw an arc above, and from P draw an arc across, crossing at C. Join P and C.</p><p><strong>Why it works:</strong> PA, AB, BC and CP are all the same length, so PABC is a {{rhombus|a quadrilateral with four equal sides}}. The opposite sides of a rhombus are parallel, so PC is parallel to AB.</p>',visual:CSVG('parallel'),
     example:{q:'Explain why PC is parallel to the line.',steps:[{do:'All four arcs used the same compass width.'},{do:'So PA = AB = BC = CP: the four sides of PABC are equal.',why:'Equal compass widths make equal lengths.'},{do:'A shape with four equal sides is a rhombus, and opposite sides of a rhombus are parallel.'},{do:'So PC ∥ AB.'}]},
     mistake:'Changing the compass width part-way through. If the four sides are not equal, PABC is not a rhombus and PC will not be parallel.',
     check:{q:'In the parallel construction, why must the compass width stay the same?',o:['To make PABC a rhombus','To make a circle','To measure an angle'],a:0,why:'Equal sides make a rhombus, whose opposite sides are parallel.',hint:'What shape do the four equal lengths make?'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Construct each one on paper too!',

    {icon:'🗂️',title:'Which instrument?',desc:'Sort each task by the instrument you need.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Compasses keep distances, rulers make straight lines and measure, protractors measure angles.',bins:[{id:'c',label:'Compasses'},{id:'r',label:'Ruler'},{id:'p',label:'Protractor'}],items:[{label:'Draw a circle',bin:'c'},{label:'Draw a straight line',bin:'r'},{label:'Measure an angle',bin:'p'},{label:'Copy a length exactly',bin:'c'},{label:'Measure a length in cm',bin:'r'},{label:'Check that an angle is 60°',bin:'p'},{label:'Draw construction arcs',bin:'c'},{label:'Join two points',bin:'r'}]}},
    {icon:'🃏',title:'Match it',desc:'Match each construction word to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Perpendicular','meet at 90°'],['Parallel','never meet'],['Bisect','cut into two equal parts'],['Radius','centre to edge'],['Diameter','edge to edge through the centre'],['Compasses','keep a fixed distance']]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Every point on the perpendicular bisector of AB is the same distance from A and from B.',a:'always',why:'That is exactly what the perpendicular bisector is.'},{s:'The perpendicular bisector of a segment passes through its midpoint.',a:'always',why:'It cuts the segment in half, so it passes through the middle.'},{s:'You can bisect AB with the compasses opened to less than half of AB.',a:'never',why:'The arcs from A and B would not reach each other.'},{s:'A circle\'s diameter is twice its radius.',a:'always',why:'The diameter is two radii joined through the centre.'},{s:'Two lines that are both perpendicular to the same line are parallel to each other.',a:'always',why:'Both make 90° with the same line, so they go in the same direction and never meet.',hint:'Picture the rungs of a ladder.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s method and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Javon',q:'Construct a circle with a diameter of 8 cm.',lines:['Open the compasses to 8 cm','Turn them one full turn around the centre'],wrong:0,reasons:['The compasses should be set to the radius, 4 cm','He should use a protractor','A circle cannot be constructed'],reason:0,fix:'Open the compasses to 4 cm (the radius), then turn one full turn.'},{who:'Keisha',q:'Construct a line through P parallel to a given line.',lines:['From P, arc the line at A','Open the compasses a little wider. From A, arc the line at B','From B and from P, arcs cross at C. Join P and C'],wrong:1,reasons:['She changed the compass width, so PABC is not a rhombus','She should have started from B','She should not use arcs'],reason:0,fix:'Keep the same width for every arc, so PA = AB = BC = CP.'},{who:'Shawn',q:'Bisect a 6 cm line segment.',lines:['Open the compasses to 2 cm','Draw arcs from A and from B'],wrong:0,reasons:['2 cm is less than half of 6 cm, so the arcs will not meet','He should use 6 cm exactly','He should draw only one arc'],reason:0,fix:'Open the compasses to more than 3 cm, for example 4 cm.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire construction questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var d=R(2,20);return{q:'A circle has a diameter of '+d+' cm. Open the compasses to…',o:[d/2+' cm',d+' cm',2*d+' cm'],a:0,why:'Radius = '+d+' ÷ 2 = '+d/2+' cm.'}}if(r===1){var L=R(4,15);return{q:'A '+L+' cm segment is bisected. Each half is…',o:[L/2+' cm',L+' cm',(L/2+1)+' cm'],a:0,why:L+' ÷ 2 = '+L/2+' cm.'}}var L2=R(4,14),w=[L2/2-1,L2/2+1][R(0,1)];return{q:'To bisect a '+L2+' cm segment, will a compass width of '+w+' cm work?',o:['Yes','No'],a:w>L2/2?0:1,why:'It must be MORE than half: more than '+L2/2+' cm.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Choose measurements that make each construction work.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'What should the compasses be set to for a circle with a diameter of 11 cm?',placeholder:'cm',check:function(v){var x=parseFloat(v);return Math.abs(x-5.5)<1e-6?{ok:true,msg:'Yes! 11 ÷ 2 = 5.5 cm.'}:{ok:false,msg:'Set the compasses to the radius: half the diameter.'}}},{q:'Choose a compass width (in cm) that WILL work for bisecting an 8 cm line segment.',placeholder:'cm',check:function(v){var x=parseFloat(v);if(isNaN(x))return{ok:false,msg:'Type a number of centimetres.'};return x>4?{ok:true,msg:'That works: '+x+' cm is more than half of 8 cm, so the arcs will cross.'}:{ok:false,msg:x+' cm is not more than half of 8 cm (4 cm). The arcs would not meet.'}}},{q:'In the parallel-line construction, PA = 6 cm. How long is CP?',placeholder:'cm',check:function(v){var x=parseFloat(v);return x===6?{ok:true,msg:'Correct! All four sides of the rhombus PABC are 6 cm.'}:{ok:false,msg:'All four arcs used the same width. What does that make CP?'}}}]}},
    {icon:'🚜',title:'Mission: the farm plan',desc:'Draw a plan for a water tank and fence on a farm in St. Elizabeth.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'A farmer in St. Elizabeth wants a plan for a circular water tank and a new fence. On the plan, 1 cm stands for 1 m.',parts:[{q:'The tank has a diameter of 3 m. What should the compasses be set to on the plan, in cm?',a:1.5,tol:0.001,hint:'Radius = diameter ÷ 2, and 1 cm stands for 1 m.',sol:'3 ÷ 2 = 1.5 cm.',placeholder:'cm'},{q:'A gate goes exactly in the middle of a 12 m fence. Using a perpendicular bisector, how far from one end is the gate, in metres?',a:6,hint:'The perpendicular bisector cuts the fence in half.',sol:'12 ÷ 2 = 6 m.',placeholder:'metres'},{q:'A post stands at the gate, perpendicular to the fence. What angle does it make with the fence?',a:90,hint:'Perpendicular means…',sol:'90°.',placeholder:'degrees'},{q:'A water pipe runs parallel to the fence. If the fence is 30 m long, how long is the matching section of pipe beside it, in metres?',a:30,hint:'The pipe runs alongside the whole fence, the same distance away all along.',sol:'30 m: parallel lines run side by side for the same length here.',placeholder:'metres'},{q:'A sprinkler sprays in a circle of radius 4 m. What is the diameter of the watered circle, in metres?',a:8,hint:'Diameter = 2 × radius.',sol:'2 × 4 = 8 m.',placeholder:'metres'}],done:'You used circles, bisectors, perpendiculars and parallel lines to plan a real farm.'}}
   ]}]},
