     init:function(box,api){var bal=10000,log=[];function chq(){var a=parseFloat(box.querySelector('#mbA').value)||0;box.querySelector('.mbChq').innerHTML=CHEQUE(box.querySelector('#mbP').value,a,'23/10/2026')}function show(){box.querySelector('.mbLog').innerHTML='<strong>Balance: '+m8(bal)+'</strong>'+(log.length?'<br>'+log.join('<br>'):'<br>Opening balance $10,000.00')}box.querySelector('#mbP').addEventListener('input',chq);box.querySelector('#mbA').addEventListener('input',chq);box.querySelector('.mbDep').onclick=function(){var t=parseFloat(box.querySelector('#mbT').value)||0;if(t<=0)return;bal+=t;log.push('Deposit slip: + '+m8(t)+' → '+m8(bal));show()};box.querySelector('.mbWd').onclick=function(){var t=parseFloat(box.querySelector('#mbT').value)||0;if(t<=0)return;if(t>bal){log.push('Withdrawal of '+m8(t)+' refused: not enough money in the account.');show();return}bal-=t;log.push('Withdrawal slip: − '+m8(t)+' → '+m8(bal));show()};box.querySelector('.mbRs').onclick=function(){bal=10000;log=[];show()};var T=[{t:'Start at $10,000. Deposit $5,000, then withdraw $1,200. What is the balance?',a:13800},{t:'Write a cheque for $2,450. How many THOUSANDS are in the amount in words? (Type the number.)',a:2},{t:'A savings account pays 4% simple interest a year. How much interest does $10,000 earn in 1 year?',a:400}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.mbN').textContent='All done';box.querySelector('.mbQ').textContent='You completed every challenge!';box.querySelector('.mbC').disabled=true;return}box.querySelector('.mbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.mbQ').textContent=T[q].t}box.querySelector('.mbC').onclick=function(){var v=parseFloat(box.querySelector('.mbIn').value),fb=box.querySelector('.mbFb');if(v===T[q].a){fb.className='fb ok mbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.mbIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no mbFb';fb.textContent=q===2?'4% of $10,000 = 0.04 × 10,000.':'Not yet. Use the mini bank: reset, then follow the steps.'}};chq();show();task()}},
    {type:'recall',text:'A fixed deposit suits Grandma best: she does not need the money for a year, and fixed deposits usually pay the highest interest for locking the money away.'}]},
  {phase:'explain',name:'Teach: banking',title:'Learn: bank accounts, forms and cheques',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Different account fi different need.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Types of bank accounts',explain:'<p>Banks offer different accounts for different needs, a bit like different bags for different trips.</p><p>A {{savings account|an account for keeping money safe that pays interest}} is for keeping money safe and letting it grow. The bank pays you {{interest|money the bank pays you for keeping your money there}} for leaving your money with them, and you can usually take money out when you need it. Many students open one.</p><p>A {{chequing account|an account for everyday payments, with a cheque book}} (also called a current account) is for everyday spending and paying bills. It comes with a cheque book and debit card, but usually pays little or no interest. Businesses use them a lot.</p><p>A {{fixed deposit|money locked in for a fixed time at a higher interest rate}} locks your money away for a set time, such as 6 months or a year. In return, the bank pays a <strong>higher</strong> interest rate. But if you take the money out early, you may lose some interest.</p>',
     example:{q:'Match an account to each person: (a) a shop owner who pays suppliers every week; (b) a student saving pocket money; (c) Grandma, who will not need $200,000 for a year.',steps:[{do:'(a) Frequent payments and cheques: a chequing account.'},{do:'(b) Small regular savings with easy access: a savings account.'},{do:'(c) Money not needed for a year, earning the most interest: a fixed deposit.'}]},
     mistake:'Thinking every account earns the same interest. Fixed deposits usually pay the most, and chequing accounts the least.',
     check:{q:'Which account comes with a cheque book?',o:['Chequing account','Fixed deposit','Savings account'],a:0,why:'Chequing accounts are for everyday payments by cheque.',hint:'The name gives it away.'}},
    {title:'Deposit and withdrawal slips',explain:'<p>When you go into a bank, every transaction starts with a form. A {{deposit slip|a form for putting money into an account}} is for putting money <strong>in</strong>. A {{withdrawal slip|a form for taking money out of an account}} is for taking money <strong>out</strong>.</p><p>Both forms ask for the same kind of information: the <strong>date</strong>, your <strong>name</strong>, your <strong>account number</strong> (so the money goes to the right account), and the <strong>amount</strong>. A deposit slip also asks how much is in cash and how much is in cheques, and the total. A withdrawal slip needs your <strong>signature</strong>, to prove it is really you.</p><p>Accuracy matters: one wrong digit in an account number could send your money to a stranger!</p>',
     example:{q:'Tia deposits two $1,000 notes, three $500 notes and a cheque for $2,500. What total goes on the deposit slip?',steps:[{do:'Cash: 2 × $1,000 + 3 × $500 = $2,000 + $1,500 = $3,500.'},{do:'Cheques: $2,500.'},{do:'Total deposit: $3,500 + $2,500 = $6,000.'}]},
     mistake:'Leaving out the account number or writing it wrongly. Always copy it carefully from your bank book or card.',
     check:{q:'Which form do you use to take money out of your account?',o:['Withdrawal slip','Deposit slip','Cheque to yourself only'],a:0,why:'Withdraw = take out.',hint:'Withdraw means take out.'}},
    {title:'Writing a cheque',explain:'<p>A {{cheque|a written order telling a bank to pay someone money from your account}} is a written instruction to your bank: “Please pay this person this amount from my account.” A page from a cheque book is called a cheque leaf.</p><p>To fill one in correctly: write the <strong>date</strong>; write the name of the {{payee|the person or business being paid}}, the person or business being paid, after “Pay”; write the amount in <strong>figures</strong> in the box; write the amount in <strong>words</strong> on the line; and <strong>sign</strong> it.</p><p>Why words AND figures? Figures are easy to change: a 1 can be turned into a 7, or an extra 0 added. Words are much harder to alter, so they protect you. That is also why people draw a line after the words, so nothing can be squeezed in. The words and figures must always match.</p>',visual:CHEQUE('Jamaica Public Service',8600,'23/10/2026'),
     example:{q:'Write $3,075 in words for a cheque.',steps:[{do:'3 thousands: “Three thousand”.'},{do:'0 hundreds and 75: “and seventy-five”.'},{do:'In full: “Three thousand and seventy-five dollars only”.',why:'“Only” and a line afterwards stop anyone adding more.'}]},
     mistake:'Writing different amounts in words and figures. If they do not match, the bank may refuse the cheque.',
     check:{q:'Why is the amount written in words on a cheque?',o:['Words are harder to change than figures','It looks nicer','The bank cannot read numbers'],a:0,why:'It protects the cheque from being altered.',hint:'Think about safety.'}}]}]},
  {phase:'explain',name:'Teach: interest and buying',title:'Learn: simple and compound interest, hire purchase, discounts and taxes',lead:'Next, how money grows in an account, and how to work out what you really pay when you shop.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Compound interest pay interest pon di interest.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Simple interest, built from proportion',explain:'<p>Let’s work out the simple interest formula ourselves, using proportion. Suppose a bank pays <strong>5% a year</strong>. That means for every $100 deposited, you earn $5 in 1 year.</p><p>Now think in proportion. $200 is twice as much as $100, so it earns twice as much: $10. Any amount P earns <strong>P ÷ 100 × 5</strong> in one year. And if the money stays for 3 years, it earns that 3 times. So for principal P, rate R% and time T years:</p><p><strong>I = (P × R × T) ÷ 100</strong></p><p>That is {{simple interest|interest calculated on the principal only}}: the {{principal|the money deposited or borrowed at the start}} earns the same interest every year. It works for loans too: when you borrow money, you pay interest to the bank instead.</p>',
     example:{q:'Kemar borrows $50,000 at 8% simple interest for 2 years. How much interest does he pay, and what does he pay back altogether?',steps:[{do:'I = (50,000 × 8 × 2) ÷ 100.'},{do:'= 800,000 ÷ 100 = $8,000 interest.'},{do:'Total to pay back: $50,000 + $8,000 = $58,000.'}]},
     mistake:'Using months for T. If the time is 6 months, T = 0.5 years.',
     check:{q:'Simple interest on $20,000 at 3% for 2 years?',o:['$1,200','$600','$12,000'],a:0,why:'20,000 × 3 × 2 ÷ 100 = 1,200.',hint:'I = PRT ÷ 100.'}},
    {title:'Compound interest, year by year',explain:'<p>With {{compound interest|interest added each year, so next year’s interest is on a bigger amount}}, the bank adds your interest to your account at the end of each year. The next year, you earn interest on that bigger amount, including the interest you already earned.</p><p>The guide asks you to calculate it <strong>recursively</strong>: that just means one year at a time, using last year’s answer as this year’s starting point. On a calculator: start with the principal, multiply by (1 + R/100), and repeat once for each year.</p><p>For $10,000 at 10%: Year 1: 10,000 × 1.1 = $11,000. Year 2: 11,000 × 1.1 = $12,100. Year 3: 12,100 × 1.1 = $13,310. Notice that each year the interest gets bigger ($1,000, then $1,100, then $1,210), because it is calculated on a bigger amount.</p>',
     example:{q:'Grandma puts $200,000 in a fixed deposit at 6% compound interest. How much is there after 2 years?',steps:[{do:'Year 1: 200,000 × 1.06 = $212,000.',why:'Multiplying by 1.06 adds 6%.'},{do:'Year 2: 212,000 × 1.06 = $224,720.',why:'This year’s interest is on $212,000, not $200,000.'},{do:'After 2 years: $224,720. (Simple interest would give only $224,000.)'}]},
     mistake:'Calculating every year’s interest on the original amount. That is simple interest; compound interest uses the NEW total each year.',
     check:{q:'$1,000 at 10% compound interest. Amount after 2 years?',o:['$1,210','$1,200','$1,100'],a:0,why:'1,000 → 1,100 → 1,210.',hint:'Multiply by 1.1 twice.'}},
    {title:'Hire purchase, discounts and taxes',explain:'<p>When you shop, the price on the tag is not always what you pay.</p><p>With <strong>hire purchase</strong>, you pay a deposit and then instalments. The <strong>hire purchase price</strong> = deposit + all the instalments. Compare it with the <strong>cost price</strong> (the cash price): the difference is the extra you pay for not paying all at once.</p><p>A <strong>discount</strong> takes money off: for 20% off a $5,000 item, the discount is $1,000, so you pay $4,000. A <strong>tax</strong>, such as GCT, adds money on: 15% tax on $4,000 is $600, so you pay $4,600. Always follow the instructions in the question: if it says take the discount first, then add tax, do it in that order.</p>',
     example:{q:'A fridge costs $90,000 cash, or $18,000 down and 12 payments of $7,000. Compare the prices.',steps:[{do:'Instalments: 12 × $7,000 = $84,000.'},{do:'HP price: $18,000 + $84,000 = $102,000.'},{do:'Extra: $102,000 − $90,000 = $12,000 more than cash.'}]},
     mistake:'Forgetting the deposit in the hire purchase price. Everything paid counts: the deposit AND every instalment.',
     check:{q:'A $6,000 bag has 25% off. What is the sale price?',o:['$4,500','$1,500','$5,975'],a:0,why:'25% of $6,000 = $1,500; $6,000 − $1,500 = $4,500.',hint:'Find 25% first, then subtract.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Accounts',text:'Savings: safe, earns interest. Chequing: everyday payments, cheque book, little interest. Fixed deposit: locked in for a time, higher interest.'},{title:'Forms and cheques',text:'Deposit slip: money in. Withdrawal slip: money out (signed). Cheque: date, payee, amount in figures AND words, signature.'},{title:'Interest',text:'Simple: I = PRT ÷ 100 (T in years). Compound: multiply by (1 + R/100) once for each year, using the new amount each time.'},{title:'Shopping',text:'HP price = deposit + all instalments. Discount: subtract. Tax: add. Follow the order the question gives.'}]},

   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire money questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var P=R(1,10)*10000,Rt=R(2,9),T=R(2,4),I=P*Rt*T/100;return{q:'Simple interest on $'+P.toLocaleString('en-JM')+' at '+Rt+'% for '+T+' years?',o:['$'+I.toLocaleString('en-JM'),'$'+(P*Rt/100).toLocaleString('en-JM'),'$'+(P+I).toLocaleString('en-JM')],a:0,why:'PRT ÷ 100.'}}if(r===1){var p=R(2,20)*1000,d=[10,20,25,50][R(0,3)],s=p*(100-d)/100;return{q:'$'+p.toLocaleString('en-JM')+' with '+d+'% off. Sale price?',o:['$'+s.toLocaleString('en-JM'),'$'+(p*d/100).toLocaleString('en-JM'),'$'+(p-d).toLocaleString('en-JM')],a:0,why:'Take off '+d+'%.'}}var dep=R(1,5)*5000,n=[6,10,12][R(0,2)],ins=R(2,8)*1000;return{q:'Deposit $'+dep.toLocaleString('en-JM')+' and '+n+' payments of $'+ins.toLocaleString('en-JM')+'. HP price?',o:['$'+(dep+n*ins).toLocaleString('en-JM'),'$'+(n*ins).toLocaleString('en-JM'),'$'+(dep*n+ins).toLocaleString('en-JM')],a:0,why:'Deposit + all instalments.'}}}},
