 curriculum:{framework:'NSC Mathematics, Grade 9',term:'Term 1',unit:'Unit 2: Indices',strand:'Number',standard:'Use the basic operations, number relationships, patterns, number facts, calculators and software to compute and estimate in order to solve real world problems involving fractions, percentages and decimals.',

 glossary:[['Base','The number or letter being multiplied, such as 2 in 2⁵.'],['Index (power, exponent)','The small raised number that says how many times the base is used, such as 5 in 2⁵.'],['Law of multiplication','aᵐ × aⁿ = aᵐ⁺ⁿ: when multiplying powers of the same base, add the indices.'],['Law of division','aᵐ ÷ aⁿ = aᵐ⁻ⁿ: when dividing powers of the same base, subtract the indices.'],['Zero power','a⁰ = 1, for any non-zero a.'],['Power of one','a¹ = a.'],['Power to a power','(aᵐ)ⁿ = aᵐⁿ: multiply the indices.'],['Simplify','Write an expression in a shorter, neater way.']],

  {phase:'explore',name:'Index law discoverer',title:'Explore: discover the laws of indices',lead:'Choose a base, two indices and an operation. The discoverer writes out every factor so you can count them. Look for a shortcut each time.',

     init:function(box,api){var B=box.querySelector('#ilB'),O=box.querySelector('#ilO'),M=box.querySelector('#ilM'),N=box.querySelector('#ilN');api.nudges(M);api.nudges(N);var sup=function(n){return'<sup>'+n+'</sup>'};function draw(){var b=B.value,o=O.value,m=+M.value,n=+N.value,html,res,txt;box.querySelector('.ilMO').textContent=m;box.querySelector('.ilNO').textContent=n;if(o==='m'){res=m+n;html='<strong>'+b+sup(m)+' × '+b+sup(n)+'</strong> = ('+CHIPS(b,m,'#e4ecfb')+') × ('+CHIPS(b,n,'#ffd98a')+')';txt='Count the '+b+'s: '+m+' + '+n+' = <strong>'+res+'</strong>. So '+b+sup(m)+' × '+b+sup(n)+' = <strong>'+b+sup(res)+'</strong>. Shortcut: <strong>add the indices</strong>.'}else if(o==='d'){if(n>m){N.value=m;n=m;box.querySelector('.ilNO').textContent=n}res=m-n;html='<strong>'+b+sup(m)+' ÷ '+b+sup(n)+'</strong> = '+CHIPS(b,m,'#e4ecfb')+' ÷ '+CHIPS(b,n,'#fbe4ec')+'<br>Cancel '+n+' pair'+(n>1?'s':'')+' of '+b+'s: '+(res?CHIPS(b,res,'#dcf3ee'):'<strong>1</strong> (everything cancels)');txt=m+' − '+n+' = <strong>'+res+'</strong>. So '+b+sup(m)+' ÷ '+b+sup(n)+' = <strong>'+b+sup(res)+'</strong>'+(res===0?' = 1':'')+'. Shortcut: <strong>subtract the indices</strong>.'}else{res=m*n;var grp='';for(var i=0;i<n;i++)grp+='('+CHIPS(b,m,['#e4ecfb','#ffd98a','#dcf3ee','#fbe4ec','#efe8fb'][i])+')'+(i<n-1?' × ':'');html='<strong>('+b+sup(m)+')'+sup(n)+'</strong> = '+grp;txt=n+' groups of '+m+': '+n+' × '+m+' = <strong>'+res+'</strong>. So ('+b+sup(m)+')'+sup(n)+' = <strong>'+b+sup(res)+'</strong>. Shortcut: <strong>multiply the indices</strong>.'}box.querySelector('.ilShow').innerHTML=html;box.querySelector('.ilX').innerHTML=txt}[B,O,M,N].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var T=[{t:'3² × 3⁴ = 3 to the power of what?',a:6},{t:'5⁷ ÷ 5³ = 5 to the power of what?',a:4},{t:'(2³)² = 2 to the power of what?',a:6}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ilNum').textContent='All done';box.querySelector('.ilT').textContent='You completed every challenge!';box.querySelector('.ilC').disabled=true;return}box.querySelector('.ilNum').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ilT').textContent=T[q].t}box.querySelector('.ilC').onclick=function(){var v=+box.querySelector('.ilA').value,fb=box.querySelector('.ilFb');if(v===T[q].a){fb.className='fb ok ilFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ilA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ilFb';fb.textContent='Not yet. Set up the discoverer with these numbers and count the factors.'}};draw();task()}},
    {type:'recall',text:'The photos use 2³ × 2⁴ = 2⁷ = 128 MB. Multiplying powers of the same base means ADDING the indices, not multiplying them.'}]},
  {phase:'explain',name:'Teach: multiplying and dividing powers',title:'Learn: what powers mean, and the first two laws',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Same base: multiply mean add, divide mean subtract.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What aᵐ means, and evaluating powers',explain:'<p>You met powers in Grade 8, so here is a quick reminder before we go further. A power is a short way to write repeated multiplication. In <strong>aᵐ</strong>, the {{base|the number or letter being multiplied}} a is the number being multiplied, and the {{index|the small raised number that says how many times the base is used}} m tells you how many times it is used. So 3⁴ = 3 × 3 × 3 × 3 = 81.</p><p>When an expression has powers with <em>different</em> bases, such as 2³ × 3² or 5³ ÷ 5², just work out each power on its own first, then do the multiplying or dividing. 2³ × 3² = 8 × 9 = 72.</p><p>Why can’t we combine 2³ and 3² into one power? Because they are made of different building blocks: 2s and 3s. That is a really important idea for this lesson. The laws of indices you are about to learn only work when the bases are the <strong>same</strong>.</p>',
     example:{q:'Evaluate 2⁴ × 3² and 6³ ÷ 2³.',steps:[{do:'2⁴ = 16 and 3² = 9, so 2⁴ × 3² = 16 × 9 = 144.'},{do:'6³ = 216 and 2³ = 8.'},{do:'6³ ÷ 2³ = 216 ÷ 8 = 27.',why:'Different bases: work out each power first.'}]},
     mistake:'Combining different bases: 2³ × 3² is NOT 6⁵. Work out each power separately.',
     check:{q:'Evaluate 2³ × 5².',o:['200','10⁵','100'],a:0,why:'8 × 25 = 200.',hint:'Work out each power first.'}},
    {title:'The law of multiplication',explain:'<p>Now for the exciting part: a shortcut. Look at 2³ × 2⁴. Write out what it really means: (2 × 2 × 2) × (2 × 2 × 2 × 2). How many 2s are being multiplied altogether? Three from the first power, and four from the second: 3 + 4 = 7. So 2³ × 2⁴ = 2⁷.</p><p>You did not need to work out any big numbers! You just <strong>added the indices</strong>. This works every time the bases are the same, so we write it as a law: <strong>aᵐ × aⁿ = aᵐ⁺ⁿ</strong>.</p><p>It works with letters too: x² × x⁵ = x⁷. And if there are numbers in front, multiply those numbers as normal, then add the indices: 2x³ × 5x⁴ = 10x⁷.</p><p>That explains Brianna’s photos. 2³ MB each × 2⁴ photos = 2⁷ MB. Her friend multiplied the indices, which gives far too much.</p>',
     example:{q:'Simplify 3x² × 4x⁵.',steps:[{do:'Multiply the numbers: 3 × 4 = 12.'},{do:'Same base x, so add the indices: 2 + 5 = 7.',why:'x² × x⁵ means two x’s times five x’s: seven x’s.'},{do:'3x² × 4x⁵ = 12x⁷.'}]},
     mistake:'Multiplying the indices: 2³ × 2⁴ = 2¹². Count the factors: there are only seven 2s, so the answer is 2⁷.',
     check:{q:'Simplify a⁴ × a³.',o:['a⁷','a¹²','2a⁷'],a:0,why:'Add the indices: 4 + 3 = 7.',hint:'Same base: add the indices.'}},
    {title:'The law of division',explain:'<p>What about dividing? Look at 5⁶ ÷ 5². Write it as a fraction, with six 5s on top and two 5s underneath. Now you can cancel: each 5 underneath cancels one 5 on top, just like cancelling in a fraction. Two pairs cancel, leaving 6 − 2 = 4 fives on top. So 5⁶ ÷ 5² = 5⁴.</p><p>Again, there is a shortcut: when dividing powers of the same base, <strong>subtract the indices</strong>. As a law: <strong>aᵐ ÷ aⁿ = aᵐ⁻ⁿ</strong>.</p><p>With numbers in front, divide the numbers as normal, then subtract the indices: 12x⁸ ÷ 3x² = 4x⁶.</p>',
     example:{q:'Simplify 15y⁷ ÷ 5y³.',steps:[{do:'Divide the numbers: 15 ÷ 5 = 3.'},{do:'Same base y, so subtract the indices: 7 − 3 = 4.',why:'Three y’s underneath cancel three of the seven on top.'},{do:'15y⁷ ÷ 5y³ = 3y⁴.'}]},
     mistake:'Dividing the indices: x⁸ ÷ x² = x⁴. Cancel the factors and count: eight x’s minus two x’s leaves x⁶.',
     check:{q:'Simplify 7⁹ ÷ 7⁴.',o:['7⁵','7¹³','1⁵'],a:0,why:'Subtract the indices: 9 − 4 = 5.',hint:'Same base: subtract the indices.'}}]}]},
  {phase:'explain',name:'Teach: zero, one and power to power',title:'Learn: the zero power, the power of one, and power to a power',lead:'Next, three more laws. Each one comes straight out of the patterns you have already seen.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Power pon power: multiply di index dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The zero power and the power of one',explain:'<p>Here is a puzzle. What is 4³ ÷ 4³? Any number divided by itself is 1, so the answer must be 1. But the law of division says 4³ ÷ 4³ = 4³⁻³ = 4⁰. Both answers must be right, so <strong>4⁰ = 1</strong>!</p><p>That is the {{zero power|any non-zero number to the power 0 equals 1}} law: <strong>a⁰ = 1</strong>, for any base a that is not zero. It surprises a lot of people, but now you can see exactly where it comes from.</p><p>The {{power of one|a number to the power 1 is just itself}} is simpler: <strong>a¹ = a</strong>. If you use the base only once, you just have the base itself: 9¹ = 9 and x¹ = x. That is why we usually do not bother writing the 1: x is the same as x¹.</p>',
     example:{q:'Evaluate 7⁰ + 3¹ and simplify x⁵ ÷ x⁵.',steps:[{do:'7⁰ = 1 and 3¹ = 3, so 7⁰ + 3¹ = 4.'},{do:'x⁵ ÷ x⁵ = x⁵⁻⁵ = x⁰.'},{do:'x⁰ = 1.',why:'Anything (except 0) divided by itself is 1.'}]},
     mistake:'Thinking a⁰ = 0. Any non-zero number to the power 0 is 1, not 0.',
     check:{q:'What is 100⁰?',o:['0','1','100'],a:1,why:'Any non-zero number to the power 0 is 1.',hint:'Think of 100³ ÷ 100³.'}},
    {title:'Power to a power',explain:'<p>What happens when you raise a power to another power, like (2³)²? The outside power 2 says “use the inside thing twice”: (2³)² = 2³ × 2³. And you already know what to do with that: add the indices, 3 + 3 = 6. So (2³)² = 2⁶.</p><p>Think of it as groups. (2³)² is 2 groups of three 2s. 2 groups × 3 in each group = 6 twos altogether. So the shortcut is to <strong>multiply the indices</strong>: <strong>(aᵐ)ⁿ = aᵐⁿ</strong>.</p><p>If there is a number inside the bracket, it gets raised to the power too: (3x²)² = 3² × x⁴ = 9x⁴.</p>',
     example:{q:'Simplify (x⁴)³ and (2y³)².',steps:[{do:'(x⁴)³: three groups of four x’s, so multiply: 4 × 3 = 12. Answer: x¹².'},{do:'(2y³)²: square the 2 and square the y³.',why:'Everything inside the bracket is raised to the power.'},{do:'2² = 4 and (y³)² = y⁶, so (2y³)² = 4y⁶.'}]},
     mistake:'Adding the indices for a power of a power: (x²)³ = x⁵. It is three groups of two, so multiply: x⁶.',
     check:{q:'Simplify (a²)⁵.',o:['a⁷','a¹⁰','a²⁵'],a:1,why:'Multiply the indices: 2 × 5 = 10.',hint:'Five groups of two.'}},
    {title:'Choosing the right law',explain:'<p>Now you have five laws, and the real skill is choosing the right one. Here is a quick guide.</p><p><strong>Multiplying</strong> powers of the same base? <strong>Add</strong> the indices. <strong>Dividing</strong>? <strong>Subtract</strong> them. A power <strong>inside a bracket</strong> raised to another power? <strong>Multiply</strong> them. Power of 0? The answer is 1. Power of 1? The answer is the base.</p><p>For longer expressions, work step by step, just like the order of operations: deal with brackets first, then multiplication and division. For example, (x³)² × x ÷ x⁴: first (x³)² = x⁶, then x⁶ × x¹ = x⁷, then x⁷ ÷ x⁴ = x³.</p><p>And remember the golden rule: the laws only work when the bases are the same.</p>',
     example:{q:'Simplify (2a³)² × a ÷ a⁴.',steps:[{do:'Bracket first: (2a³)² = 4a⁶.'},{do:'Multiply by a (which is a¹): 4a⁶ × a¹ = 4a⁷.',why:'Add the indices: 6 + 1.'},{do:'Divide by a⁴: 4a⁷ ÷ a⁴ = 4a³.',why:'Subtract the indices: 7 − 4.'}]},
     mistake:'Using a law when the bases are different: x² × y³ cannot be simplified into one power.',
     check:{q:'Simplify m⁶ × m² ÷ m³.',o:['m⁵','m⁴','m¹¹'],a:0,why:'6 + 2 − 3 = 5.',hint:'Add for ×, subtract for ÷.'}}]}]},
  {phase:'explain',name:'Teach: negative and fractional indices',title:'Learn: negative indices, fractional indices and standard form',lead:'So far, every index has been a whole number. But what if the index is negative, or a fraction? The laws you already know will show us the answer.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Negative index mean one over. Half index mean square root.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Negative indices',explain:'<p>Here is a puzzle. What is 2³ ÷ 2⁵? Write it as a fraction: three 2s on top and five 2s underneath. Cancel three pairs, and you are left with nothing but 1 on top and two 2s underneath: 1/(2 × 2) = 1/2² = 1/4.</p><p>Now use the division law instead: 2³ ÷ 2⁵ = 2³⁻⁵ = 2⁻². Both methods must give the same answer, so <strong>2⁻² = 1/2²</strong> = 1/4.</p><p>That is what a {{negative index|a⁻ⁿ means 1 divided by aⁿ}} means: it tells you to take the <strong>reciprocal</strong>, one over the power. In general, <strong>a⁻ⁿ = 1/aⁿ</strong>. So 5⁻¹ = 1/5, 10⁻³ = 1/1,000 = 0.001, and x⁻⁴ = 1/x⁴.</p><p>A negative index does NOT make the number negative. 2⁻² is a small positive number, a quarter.</p>',
     example:{q:'Evaluate 4⁻² and simplify x³ ÷ x⁷.',steps:[{do:'4⁻² = 1/4² = 1/16.',why:'A negative index means one over the power.'},{do:'x³ ÷ x⁷ = x³⁻⁷ = x⁻⁴.',why:'Subtract the indices, as usual.'},{do:'x⁻⁴ = 1/x⁴.'}]},
     mistake:'Thinking a negative index makes the answer negative: 2⁻³ is NOT −8. It is 1/2³ = 1/8.',
     check:{q:'What is 3⁻²?',o:['−9','1/9','−6'],a:1,why:'3⁻² = 1/3² = 1/9.',hint:'One over 3².'}},
    {title:'Fractional indices',explain:'<p>What could 9^(1/2) possibly mean? Let’s use the multiplication law to find out. 9^(1/2) × 9^(1/2) = 9^(1/2 + 1/2) = 9¹ = 9. So 9^(1/2) is a number that, multiplied by itself, gives 9. That is exactly the square root! <strong>9^(1/2) = √9 = 3</strong>.</p><p>In the same way, 8^(1/3) × 8^(1/3) × 8^(1/3) = 8¹ = 8, so 8^(1/3) is the cube root: ∛8 = 2.</p><p>So a {{fractional index|a power that is a fraction: the bottom is a root and the top is a power}} links powers and roots. The <strong>bottom</strong> of the fraction is the root, and the <strong>top</strong> is the power. For 27^(2/3): take the cube root first (∛27 = 3), then square it (3² = 9). Doing the root first keeps the numbers small.</p>',
     example:{q:'Evaluate 16^(1/2), 125^(1/3) and 8^(2/3).',steps:[{do:'16^(1/2) = √16 = 4.'},{do:'125^(1/3) = ∛125 = 5.'},{do:'8^(2/3): cube root first, ∛8 = 2, then square: 2² = 4.',why:'Bottom of the fraction = root; top = power.'}]},
     mistake:'Multiplying by the fraction: 16^(1/2) is NOT 16 × ½ = 8. It is the square root, 4.',
     check:{q:'What is 25^(1/2)?',o:['12.5','5','625'],a:1,why:'The power ½ means square root: √25 = 5.',hint:'A half power is a square root.'}},
    {title:'Standard form for any number',explain:'<p>In Grade 8 you wrote big numbers in standard form, like 384,000 = 3.84 × 10⁵. Now that you understand negative indices, you can do tiny numbers too.</p><p>A grain of sand might be 0.00045 m wide. Put the decimal point just after the first non-zero digit: 4.5. Now count how many places the point moved to get there: 4 places to the right. Moving right means the number was small, so the power is negative: <strong>0.00045 = 4.5 × 10⁻⁴</strong>.</p><p>Why does that work? 10⁻⁴ = 1/10,000, so 4.5 × 10⁻⁴ = 4.5 ÷ 10,000 = 0.00045. ✓</p><p>And what about numbers that are already between 1 and 10, like 7.2? They need no moving at all, so the power is 10⁰ = 1: 7.2 = 7.2 × 10⁰. Every number can be written in {{standard form|A × 10ⁿ, where A is from 1 up to (but not including) 10 and n is an integer}}.</p>',
     example:{q:'Write 0.0062 and 58,000 in standard form.',steps:[{do:'0.0062: the point moves 3 places right to make 6.2, so 6.2 × 10⁻³.',why:'Small numbers have negative powers.'},{do:'58,000: the point moves 4 places left to make 5.8, so 5.8 × 10⁴.'}]},
     mistake:'Using a positive power for a small number: 0.0062 is NOT 6.2 × 10³ (that is 6,200).',
     check:{q:'Write 0.07 in standard form.',o:['7 × 10⁻²','7 × 10²','0.7 × 10⁻¹'],a:0,why:'The point moves 2 places right: 7 × 10⁻².',hint:'Small number, negative power.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the five laws in one place. Then watch a full example, fill in a missing step, and try some on your own.',

   blocks:[{type:'facts',facts:[{title:'Multiplication law',text:'aᵐ × aⁿ = aᵐ⁺ⁿ: add the indices. For example, 2³ × 2⁴ = 2⁷ and 3x² × 4x⁵ = 12x⁷.'},{title:'Division law',text:'aᵐ ÷ aⁿ = aᵐ⁻ⁿ: subtract the indices. For example, 5⁶ ÷ 5² = 5⁴ and 12x⁸ ÷ 3x² = 4x⁶.'},{title:'Zero power and power of one',text:'a⁰ = 1 (a ≠ 0) and a¹ = a. For example, 9⁰ = 1 and 9¹ = 9.'},{title:'Power to a power',text:'(aᵐ)ⁿ = aᵐⁿ: multiply the indices. For example, (x⁴)³ = x¹² and (2y³)² = 4y⁶.'},{title:'Negative and fractional',text:'a⁻ⁿ = 1/aⁿ, so 2⁻³ = 1/8. a^(1/2) = √a and a^(1/3) = ∛a, so 27^(2/3) = 9. Small numbers in standard form have negative powers: 0.00045 = 4.5 × 10⁻⁴.'}]},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'aᵐ × aⁿ = aᵐⁿ.',a:'sometimes',why:'Generally it is aᵐ⁺ⁿ. It only matches aᵐⁿ in special cases, such as m = n = 2 (2 + 2 = 2 × 2), or a = 1.',hint:'Try 2² × 2² and 2³ × 2⁴.'},{s:'Any non-zero number to the power 0 equals 1.',a:'always',why:'a⁰ = aᵐ ÷ aᵐ = 1.'},{s:'(aᵐ)ⁿ = (aⁿ)ᵐ.',a:'always',why:'Both equal aᵐⁿ, because m × n = n × m.'},{s:'2³ × 3² can be written as a single power of 6.',a:'never',why:'The bases are different; 2³ × 3² = 72, which is not a whole-number power of 6.'},{s:'aᵐ ÷ aⁿ is smaller than aᵐ (for a > 1).',a:'sometimes',why:'It is smaller when n > 0, but when n = 0, aᵐ ÷ a⁰ = aᵐ.',hint:'Try n = 0.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jordan',q:'Simplify x³ × x⁴.',lines:['Multiply the indices: 3 × 4 = 12','x³ × x⁴ = x¹²'],wrong:0,reasons:['When multiplying powers, ADD the indices: x⁷','He should subtract','He should multiply the x’s'],reason:0,fix:'x⁷.'},{who:'Sasha',q:'Simplify (y²)³.',lines:['Add the indices: 2 + 3 = 5','(y²)³ = y⁵'],wrong:0,reasons:['Power to a power: MULTIPLY the indices: y⁶','She should subtract','The answer should be 3y²'],reason:0,fix:'y⁶.'},{who:'Omar',q:'Evaluate 8⁰.',lines:['Anything times 0 is 0','So 8⁰ = 0'],wrong:1,reasons:['A power of 0 is not multiplying by 0; 8⁰ = 1','8⁰ = 8','8⁰ = 80'],reason:0,fix:'8⁰ = 1.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire index laws.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},sp=function(n){return String(n).split('').map(function(d){return'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]}).join('')},L=['x','y','a','2','3'][R(0,4)],m=R(2,7),n=R(1,6),r=R(0,2);if(m===2&&n===2)n=3;if(r===0)return{q:L+sp(m)+' × '+L+sp(n)+' = ?',o:[L+sp(m+n),L+sp(m*n),L+sp(Math.abs(m-n)||m+n+1)],a:0,why:'Add the indices.'};if(r===1){if(n>m){var t=m;m=n;n=t}if(m===n)m++;return{q:L+sp(m)+' ÷ '+L+sp(n)+' = ?',o:[L+sp(m-n),L+sp(m+n),L+sp(m*n)],a:0,why:'Subtract the indices.'}}return{q:'('+L+sp(m)+')'+sp(n)+' = ?',o:[L+sp(m*n),L+sp(m+n),L+sp(m*n+1)],a:0,why:'Multiply the indices.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent expressions that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type two indices m and n (m, n) so that x^m × x^n = x^10, with m ≠ n.',placeholder:'m, n',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==2||n.some(isNaN))return{ok:false,msg:'Type two numbers separated by a comma.'};if(n[0]===n[1])return{ok:false,msg:'Choose two different indices.'};return n[0]+n[1]===10?{ok:true,msg:'Yes! '+n[0]+' + '+n[1]+' = 10.'}:{ok:false,msg:'Those add to '+(n[0]+n[1])+'. You need 10.'}}},{q:'Type m and n so that (2^m)^n = 2^12, with m and n both bigger than 1.',placeholder:'m, n',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==2||n.some(function(x){return!(x>1)}))return{ok:false,msg:'Type two numbers bigger than 1, separated by a comma.'};return n[0]*n[1]===12?{ok:true,msg:'Correct! '+n[0]+' × '+n[1]+' = 12.'}:{ok:false,msg:'Those multiply to '+n[0]*n[1]+'. You need 12.'}}},{q:'Without a calculator: what is 5^9 ÷ 5^7?',placeholder:'value',check:function(v){return+v===25?{ok:true,msg:'Yes! 5⁹ ÷ 5⁷ = 5² = 25.'}:{ok:false,msg:'Subtract the indices first, then evaluate.'}}}]}},
    {icon:'🧫',title:'Mission: the science lab',desc:'Track bacteria growing in a Grade 9 science experiment.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Mr. Thompson’s Grade 9 science class in Mandeville is growing harmless bacteria in a dish. The number doubles every hour. They start with 2⁵ bacteria.',parts:[{q:'After 3 hours, there are 2⁵ × 2³ bacteria. Write this as a single power of 2. Type just the index.',a:8,hint:'Add the indices.',sol:'2⁸.'},{q:'How many bacteria is that?',a:256,hint:'2⁸ = 2 × 2 × … eight times.',sol:'256.'},{q:'They split the 2⁸ bacteria equally into 2² dishes. How many in each dish, as a power of 2? Type the index.',a:6,hint:'2⁸ ÷ 2².',sol:'2⁶ = 64 per dish.'},{q:'A huge sample would hold (2⁴)³ bacteria. Write it as a power of 2 and type the index.',a:12,hint:'Multiply the indices.',sol:'2¹².'},{q:'Before the experiment started, the dish had 2⁰ bacteria colonies being tested. How many is that?',a:1,hint:'Zero power.',sol:'2⁰ = 1.'}],done:'You used every law of indices to track a real science experiment.'}}
