   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="esE">Experiment:</label><select id="esE"><option value="coin">Toss a coin: heads?</option><option value="die">Roll a die: a 6?</option><option value="spin">Spinner (2 of 5 parts red): red?</option><option value="card">Pick a card: a heart?</option></select></div><div class="controls"><button type="button" class="go esR" data-n="1">Run 1</button><button type="button" class="go esR" data-n="10">Run 10</button><button type="button" class="go esR" data-n="100">Run 100</button><button type="button" class="esZ">↺ Reset</button></div><div class="tile esOut" aria-live="polite"></div><div class="scene esSvg"></div><div class="tile"><p style="margin:0"><span class="badge esN"></span> <strong class="esQ"></strong></p><div class="controls"><input type="text" class="esA" aria-label="Your answer" placeholder="answer"><button type="button" class="go esC">Check</button></div><div class="fb esFb" aria-live="polite">Use the simulator to help you.</div></div>',

    {type:'recall',text:'Your cousin is wrong. A die has 6 equally likely faces and only one is a 6, so the probability is 1/6, about 17%, much less than fifty-fifty.'}]},
  {phase:'explain',name:'Teach: probability',title:'Learn: what probability means, and how to calculate it',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Probability tell yuh how likely sinting fi happen.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The probability scale',explain:'<p>Every day we talk about chance. “It will probably rain this afternoon.” “There’s no way we lose this match.” “It’s fifty-fifty.” {{Probability|how likely something is to happen, from 0 to 1}} turns these feelings into numbers, so we can compare them exactly.</p><p>Probabilities go on a scale from <strong>0 to 1</strong>. Something <strong>impossible</strong>, like rolling a 7 on a normal die, has a probability of 0. Something <strong>certain</strong>, like the sun rising tomorrow, has a probability of 1. An <strong>even chance</strong>, like a coin landing heads, is ½. Everything else sits somewhere in between: the closer to 1, the more likely.</p><p>We can write probabilities as fractions, decimals or percentages. ½ = 0.5 = 50%. They all mean the same thing. A probability can never be less than 0 or more than 1 (100%).</p>',visual:SCALEP(0.5,'a coin landing heads'),
     example:{q:'Place these on the probability scale: (a) it snows in Kingston tomorrow; (b) a newborn baby is a boy; (c) you roll a number less than 7 on a die.',steps:[{do:'(a) Practically impossible in Kingston’s climate: very close to 0.'},{do:'(b) About an even chance: about ½.'},{do:'(c) Every face of a die is less than 7: certain, so 1.'}]},
     mistake:'Giving a probability greater than 1, such as 3/2 or 120%. Nothing can be more than certain.',
     check:{q:'Which is impossible?',o:['Rolling a 0 on a normal die','Tossing heads','Rolling an even number'],a:0,why:'A normal die has no 0, so the probability is 0.',hint:'Which can never happen?'}},
    {title:'Outcomes, events and theoretical probability',explain:'<p>When you roll a die, there are 6 possible {{outcomes|possible results}}: 1, 2, 3, 4, 5 or 6. If the die is {{fair|every outcome is equally likely}}, every outcome is {{equally likely|having the same chance}}.</p><p>An {{event|the result you are interested in}} is the result you care about, such as “rolling a 6” or “rolling an even number”. The outcomes that make the event happen are called the <strong>favourable</strong> outcomes.</p><p>When all outcomes are equally likely, we can work out the probability just by thinking, without doing any experiment. This is the {{theoretical probability|favourable outcomes ÷ total outcomes}}:</p><p><strong>P(event) = number of favourable outcomes ÷ total number of possible outcomes</strong></p><p>For rolling a 6: there is 1 favourable outcome out of 6, so P(6) = 1/6. That is why your cousin was wrong: “it happens or it doesn’t” is not two equally likely outcomes!</p>',
     example:{q:'A bag holds 3 red, 5 blue and 2 green marbles. One is picked at random. Find P(blue).',steps:[{do:'Total outcomes: 3 + 5 + 2 = 10 marbles.'},{do:'Favourable outcomes (blue): 5.'},{do:'P(blue) = 5/10 = 1/2, which is 50%.'}]},
     mistake:'Counting “happens or doesn’t happen” as two equally likely outcomes. Count all the real outcomes first.',
     check:{q:'What is the probability of rolling an even number on a fair die?',o:['1/2','1/6','1/3'],a:0,why:'3 even numbers (2, 4, 6) out of 6: 3/6 = 1/2.',hint:'How many even numbers are there from 1 to 6?'}},
    {title:'Fractions, percentages, and the probability of “not”',explain:'<p>Weather forecasters usually give probabilities as percentages: “There is a 70% chance of rain.” Other times you will see fractions or decimals. You should be able to move easily between them: 7/10 = 0.7 = 70%.</p><p>Here is a very useful idea. Something either happens or it does not, and those two probabilities always add up to 1 (or 100%). So:</p><p><strong>P(not A) = 1 − P(A)</strong></p><p>If the chance of rain is 70%, the chance of no rain is 100% − 70% = 30%. If P(rolling a 6) = 1/6, then P(not rolling a 6) = 1 − 1/6 = 5/6.</p>',
     example:{q:'The probability that a bus is late is 0.15. What is the probability that it is NOT late, as a percentage?',steps:[{do:'P(not late) = 1 − 0.15 = 0.85.'},{do:'As a percentage: 0.85 × 100 = 85%.'}]},
     mistake:'Forgetting that the two probabilities must add to exactly 1. If P(A) = 0.3, then P(not A) is 0.7, not 0.3.',
     check:{q:'P(win) = 2/5. What is P(not win)?',o:['3/5','2/5','5/2'],a:0,why:'1 − 2/5 = 3/5.',hint:'They add up to 1.'}}]}]},
  {phase:'explain',name:'Teach: experiments',title:'Learn: experiments, relative frequency and conclusions',lead:'Next, finding probabilities by experimenting, and using them to draw conclusions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Do di experiment nuff time an count.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Designing and conducting an experiment',explain:'<p>Sometimes we cannot work out a probability by reasoning. Is a drawing pin more likely to land point up or point down? Will a slice of hard-dough bread land butter side down? Nobody can just “count the outcomes”. Instead, we do an {{experiment|an activity repeated to collect data}}.</p><p>A good experiment has a clear question (“How often does the pin land point up?”), a fair method that is the same every time, and plenty of {{trials|single goes of an experiment}}. Record the results as you go in a <strong>tally table</strong>, so nothing is lost or counted twice.</p><p>It also helps to make a <strong>prediction</strong> before you start, as the guide suggests for the pulse experiment. Then you can compare what you thought would happen with what really happened.</p>',
     example:{q:'Plan an experiment to find how often a bottle cap lands face up.',steps:[{do:'Question: what fraction of throws land face up?'},{do:'Method: drop the cap from the same height (say 1 m) onto the same floor every time.',why:'Keeping things the same makes the experiment fair.'},{do:'Trials: at least 50 drops, tallying face up and face down.'},{do:'Prediction first, then compare.'}]},
     mistake:'Doing only a few trials. With 5 throws, the results can be very misleading.',
     check:{q:'Why should you do many trials in an experiment?',o:['The results become more reliable','It makes the event more likely','It changes the theoretical probability'],a:0,why:'More trials give a better estimate.',hint:'Think of the simulator.'}},
    {title:'Experimental probability (relative frequency)',explain:'<p>Once your experiment is done, you can estimate the probability from your results. The {{experimental probability|how often something happened ÷ number of trials}} (also called the <strong>relative frequency</strong>) is:</p><p><strong>Experimental probability = number of times the event happened ÷ total number of trials</strong></p><p>If a bottle cap landed face up 18 times in 50 drops, the experimental probability is 18/50 = 0.36, or 36%.</p><p>In the simulator, you saw something important: with few trials, the results jump around a lot. With lots of trials, the experimental probability settles down close to the theoretical one. That is why scientists and insurance companies collect so much data.</p>',
     example:{q:'A coin was tossed 40 times and landed heads 23 times. Find the experimental probability of heads, and compare it with the theoretical probability.',steps:[{do:'Experimental P(heads) = 23/40 = 0.575 = 57.5%.'},{do:'Theoretical P(heads) = 1/2 = 50%.'},{do:'They are close but not equal, which is normal for 40 trials. With more tosses, we would expect to get closer to 50%.'}]},
     mistake:'Expecting the experiment to match theory exactly. Small differences are normal, especially with few trials.',
     check:{q:'A spinner landed on blue 12 times in 60 spins. Experimental P(blue)?',o:['1/5','1/12','12'],a:0,why:'12/60 = 1/5.',hint:'Times it happened ÷ trials.'}},
    {title:'Interpreting probabilities and drawing conclusions',explain:'<p>Probabilities help us make decisions. A 90% chance of rain means you should take an umbrella. A 2% chance means you probably will not need one, although it could still rain.</p><p>To interpret a probability, connect it to the real situation. A probability of 3/10 means that if the situation happened 10 times, we would expect the event about 3 times, or 30 times out of 100. It does not promise exactly 3 times!</p><p>We can also use experiments to check whether something is <strong>fair</strong>. If a die rolled 600 times gave 250 sixes, instead of about 100, we would suspect the die is loaded. And remember: dice and coins have no memory. After five tails in a row, the next toss is still 50% heads.</p>',
     example:{q:'A die is rolled 300 times and shows a 6 on 52 rolls. Is the die likely to be fair?',steps:[{do:'Expected number of 6s: 1/6 × 300 = 50.'},{do:'Actual: 52, which is very close to 50.'},{do:'Conclusion: the die appears to be fair.'}]},
     mistake:'Thinking a result is “due”. After 5 heads in a row, the chance of heads on the next toss is still exactly 1/2.',
     check:{q:'The chance of rain tomorrow is 85%. What is the best conclusion?',o:['Rain is very likely, so take an umbrella','It will definitely rain','It will rain for 85% of the day'],a:0,why:'85% is very likely, but not certain.',hint:'Likely is not the same as certain.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'The scale',text:'0 = impossible, ½ = even chance, 1 = certain. Write probabilities as fractions, decimals or percentages, never more than 1.'},{title:'Theoretical probability',text:'P(event) = favourable outcomes ÷ total outcomes, when outcomes are equally likely.'},{title:'Experimental probability',text:'Times it happened ÷ number of trials. More trials give a more reliable estimate.'},{title:'Not and conclusions',text:'P(not A) = 1 − P(A). Expected number = probability × number of trials. Dice have no memory.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A bag has 4 red and 6 yellow sweets. Find P(red) as a fraction, decimal and percentage, and P(not red).',steps:[{do:'Total: 10 sweets. P(red) = 4/10 = 2/5.'},{do:'As a decimal: 0.4. As a percentage: 40%.'},{do:'P(not red) = 1 − 2/5 = 3/5 = 60%.'}]},
     {type:'fill',q:'A die is rolled 120 times. How many 4s would you expect?',steps:[{text:'P(4) = 1/6.'},{text:'Expected = 1/6 × 120 = ___',blank:true,a:20,hint:'120 ÷ 6.'}],sol:'20.'},

    {icon:'🗂️',title:'Likely or unlikely?',desc:'Sort each event by how likely it is.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Compare each probability with ½.',bins:[{id:'i',label:'Impossible (0)'},{id:'u',label:'Unlikely'},{id:'e',label:'Even chance (½)'},{id:'l',label:'Likely'},{id:'c',label:'Certain (1)'}],items:[{label:'Rolling a 7 on a normal die',bin:'i'},{label:'Rolling a 6',bin:'u'},{label:'A coin landing heads',bin:'e'},{label:'Rolling a number bigger than 1',bin:'l'},{label:'Rolling a number less than 10',bin:'c'},{label:'Picking a heart from a full pack of cards',bin:'u'}]}},
    {icon:'🃏',title:'Match the probabilities',desc:'Match each fraction to its percentage.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['1/2','50%'],['1/4','25%'],['3/4','75%'],['1/5','20%'],['1/10','10%'],['2/5','40%']]}},
    {icon:'📏',title:'Most likely',desc:'Order the events from least to most likely.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out each probability for one roll of a fair die, then tap from least likely to most likely.',rounds:[[{label:'Rolling a 6',v:1/6,show:'1/6'},{label:'Rolling a 5 or 6',v:2/6,show:'2/6'},{label:'Rolling an even number',v:3/6,show:'3/6'},{label:'Rolling more than 1',v:5/6,show:'5/6'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'A probability is between 0 and 1.',a:'always',why:'0 is impossible and 1 is certain; nothing is outside that.'},{s:'Tossing a coin 10 times gives exactly 5 heads.',a:'sometimes',why:'It can happen, but often you get 4, 6 or other numbers.',hint:'Try it in the simulator.'},{s:'P(A) + P(not A) = 1.',a:'always',why:'Either A happens or it does not.'},{s:'After 4 tails in a row, heads is more likely next.',a:'never',why:'A coin has no memory; it is still ½.'},{s:'The experimental probability equals the theoretical probability.',a:'sometimes',why:'They are often close, and get closer with more trials, but are rarely exactly equal.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'P(rolling a 6 on a fair die)?',lines:['It is either a 6 or not a 6','So the probability is 1/2'],wrong:0,reasons:['There are 6 equally likely outcomes, not 2','A 6 is impossible','He should use percentages'],reason:0,fix:'P(6) = 1/6.'},{who:'Tia',q:'A bag has 2 red and 3 blue balls. P(red)?',lines:['P(red) = 2/3'],wrong:0,reasons:['Divide by the TOTAL (5), not by the number of blue balls','It should be 3/2','It should be 2/2'],reason:0,fix:'P(red) = 2/5.'},{who:'Andre',q:'P(rain) = 0.3. P(no rain)?',lines:['P(no rain) = 0.3 as well'],wrong:0,reasons:['P(not A) = 1 − P(A) = 0.7','It should be 1.3','It should be 0.03'],reason:0,fix:'0.7 (70%).'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire probability.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var a=R(1,6),b=R(1,6),t=a+b;return{q:'A bag has '+a+' red and '+b+' blue balls. P(red)?',o:[a+'/'+t,a+'/'+b,b+'/'+t],a:0,why:'Red ÷ total.'}}if(r===1){var p=R(1,9)*10;return{q:'P(event) = '+p+'%. P(not event)?',o:[(100-p)+'%',p+'%',(100+p)+'%'],a:0,why:'100% − '+p+'%.'}}var n=[60,120,180,300][R(0,3)];return{q:'A fair die is rolled '+n+' times. Expected number of 3s?',o:[String(n/6),String(n/3),String(n/2)],a:0,why:'1/6 × '+n+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Design bags and spinners that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Design a bag of red and blue marbles where P(red) = 3/4. (Type red, blue.)',placeholder:'red, blue',check:function(v){var n=String(v).split(',').map(Number);if(n.length!==2||n.some(function(x){return!(x>=0)||x%1}))return{ok:false,msg:'Type two whole numbers.'};return n[0]+n[1]>0&&n[0]*4===(n[0]+n[1])*3?{ok:true,msg:'Yes! '+n[0]+' out of '+(n[0]+n[1])+' = 3/4.'}:{ok:false,msg:'P(red) = '+n[0]+'/'+(n[0]+n[1])+'. You need red to be 3 out of every 4.'}}},{q:'A spinner has 10 equal sections. How many should be green so that P(green) = 30%?',placeholder:'sections',check:function(v){return+v===3?{ok:true,msg:'Correct! 3/10 = 30%.'}:{ok:false,msg:'30% of 10.'}}},{q:'A coin is tossed 500 times. About how many heads would you expect?',placeholder:'heads',check:function(v){return+v===250?{ok:true,msg:'Yes! ½ × 500 = 250 (the real number will be close to this, not exactly).'}:{ok:false,msg:'Multiply the probability by the number of trials.'}}}]}},
    {icon:'❤️',title:'Mission: every beat of your heart',desc:'Run the guide’s pulse-rate experiment.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Following the NSC activity, a Grade 9 class measured their pulse rates after resting. (Students with asthma or heart conditions sat out the active part, as the guide advises.) Of 30 students, 12 had a resting pulse above 80 beats per minute.',parts:[{q:'What is the experimental probability that a student’s resting pulse is above 80? (Type a fraction in its simplest form.)',a:['2/5'],hint:'12/30, simplified.',sol:'12/30 = 2/5.'},{q:'Write that probability as a percentage.',a:40,tol:0.01,hint:'2/5 × 100.',sol:'40%.',placeholder:'%'},{q:'What is the probability that a student’s resting pulse is NOT above 80, as a percentage?',a:60,tol:0.01,hint:'100% − 40%.',sol:'60%.',placeholder:'%'},{q:'The school has 600 Grade 9 students. About how many would you expect to have a resting pulse above 80?',a:240,hint:'2/5 × 600.',sol:'About 240.'},{q:'After stepping up and down for 2 minutes, 27 of 30 students had a pulse above 80. What was the experimental probability, as a percentage?',a:90,tol:0.01,hint:'27 ÷ 30 × 100.',sol:'90%. Exercise makes a fast pulse much more likely!'}],done:'You designed and analysed a real experiment, and used probability to draw conclusions, just like the NSC activity.'}}
