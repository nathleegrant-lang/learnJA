 steps:[

   blocks:[{type:'mcq',star:true,questions:[{q:'What is 12 × $11,500?',o:['$138,000','$128,000','$115,000'],a:0,why:'11,500 × 12 = 138,000.',teach:'Break it up: 11,500 × 10 = 115,000 and 11,500 × 2 = 23,000. Add: 138,000.'},{q:'What is 20% of $150,000?',o:['$3,000','$30,000','$300,000'],a:1,why:'0.2 × 150,000 = 30,000.',teach:'20% = 0.2 = one fifth. One fifth of 150,000 = 30,000.'},{q:'What is $78,500 ÷ 157?',o:['$500','$50','$5,000'],a:0,why:'157 × 500 = 78,500.',teach:'Check by multiplying back: 157 × 500 = 78,500, so 78,500 ÷ 157 = 500.'},{q:'What is 1.5 × $600?',o:['$900','$601.50','$1,500'],a:0,why:'1.5 × 600 = 600 + 300.',teach:'1.5 times means the whole amount plus half of it: 600 + 300 = 900.'}]}]},
  {phase:'explore',name:'Hire purchase calculator',title:'Explore: hire purchase or cash?',lead:'Set the cash price, the deposit, the instalment and the number of payments. The calculator compares the hire purchase price with the cash price.',
   mission:['Try different deposits and instalments. When does HP cost a lot more?','Use the calculator to answer each challenge.','Complete all 3 challenges for a star.'],
   patois:'Add up di deposit an all di payment. Den compare.',
   blocks:[{type:'custom',star:true,html:'<div class="grid2"><div class="controls"><label for="hpC">Cash price ($)</label><input type="number" id="hpC" value="150000" step="1000"></div><div class="controls"><label for="hpD">Deposit ($)</label><input type="number" id="hpD" value="30000" step="1000"></div><div class="controls"><label for="hpI">Each instalment ($)</label><input type="number" id="hpI" value="11500" step="100"></div><div class="controls"><label for="hpN">Number of instalments</label><input type="number" id="hpN" value="12" min="1" max="60"></div></div><div class="explain hpX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge hpNum"></span> <strong class="hpT"></strong></p><div class="controls"><input type="text" class="hpA" aria-label="Your answer" placeholder="dollars"><button type="button" class="go hpCk">Check</button></div><div class="fb hpFb" aria-live="polite">Use the calculator to help you.</div></div>',
     init:function(box,api){var ids=['hpC','hpD','hpI','hpN'];function v(id){return+box.querySelector('#'+id).value||0}function draw(){var c=v('hpC'),d=v('hpD'),i=v('hpI'),n=v('hpN'),hp=d+i*n,x=hp-c;box.querySelector('.hpX').innerHTML='<strong>Hire purchase price</strong> = deposit + instalments = '+$m(d)+' + '+n+' × '+$m(i)+' = <strong>'+$m(hp)+'</strong><br><strong>Extra cost of HP</strong> = '+$m(hp)+' − '+$m(c)+' = <strong>'+$m(x)+'</strong>'+(c?' ('+(Math.round(1000*x/c)/10)+'% more than cash)':'')}ids.forEach(function(id){box.querySelector('#'+id).addEventListener('input',draw)});var T=[{t:'The fridge: cash $150,000; $30,000 down and 12 payments of $11,500. What is the hire purchase price?',a:168000},{t:'How much extra does the fridge cost on hire purchase?',a:18000},{t:'A TV: cash $90,000; $10,000 down and 18 payments of $5,500. What is the hire purchase price?',a:109000}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.hpNum').textContent='All done';box.querySelector('.hpT').textContent='You completed every challenge!';box.querySelector('.hpCk').disabled=true;return}box.querySelector('.hpNum').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.hpT').textContent=T[k].t}box.querySelector('.hpCk').onclick=function(){var a=parseFloat(String(box.querySelector('.hpA').value).replace(/[$,\s]/g,'')),fb=box.querySelector('.hpFb');if(Math.abs(a-T[k].a)<0.01){fb.className='fb ok hpFb';fb.textContent='✓ Correct!';k++;api.set('k',k);box.querySelector('.hpA').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no hpFb';fb.textContent='Not yet. Enter the numbers from the challenge into the calculator.'}};draw();task()}},
    {type:'recall',text:'Hire purchase costs $168,000 altogether: $18,000 more than paying cash.'}]},
  {phase:'explain',name:'Teach: credit and currency',title:'Learn: hire purchase, mortgages and currency',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Credit cost more in di long run.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Hire purchase',explain:'<p>Many people cannot pay for a big item, like a fridge or a TV, all at once. Stores offer {{hire purchase|paying a deposit, then regular instalments}} (HP) instead: you take the item home now and pay for it bit by bit. You make a first payment, called the {{deposit|the first payment}}, and then a series of equal payments, called {{instalments|a series of equal payments}}, every week or month.</p><p>It sounds like a great deal, and it is convenient. But to find out what you really pay, you must add everything up: the deposit plus all the instalments. That total is the hire purchase price.</p><p>Usually, the HP price is <strong>more</strong> than the cash price. The extra is really the store charging you interest for waiting to be paid. To see how much extra, subtract: HP price − cash price. Knowing this helps families make smart choices instead of being tempted by “small down, small weekly”.</p>',
     example:{q:'The fridge: cash price $150,000, or $30,000 down and 12 payments of $11,500. Compare.',steps:[{do:'Instalments: 12 × $11,500 = $138,000.'},{do:'HP price: $30,000 + $138,000 = $168,000.',why:'Always add the deposit.'},{do:'Extra cost: $168,000 − $150,000 = $18,000. Hire purchase costs $18,000 more.'}]},
     mistake:'Forgetting the deposit: 12 × $11,500 = $138,000 looks cheaper than cash, but the $30,000 deposit must be added.',
     check:{q:'A phone costs $5,000 down and 10 payments of $3,000. What is the HP price?',o:['$30,000','$35,000','$50,000'],a:1,why:'5,000 + 10 × 3,000 = $35,000.',hint:'Deposit + all the instalments.'}},
    {title:'Mortgages',explain:'<p>A house costs millions of dollars, and very few people have that much saved. So most families buy a house with a {{mortgage|a long-term loan used to buy a house or land}}: a long-term loan from a bank or building society.</p><p>It works a lot like hire purchase, but over a much longer time. The buyer pays a deposit, often called a down payment, and then makes monthly payments, usually for 20, 25 or even 30 years.</p><p>To find the total paid, add the deposit to all the monthly payments. Be careful with the time: payments are monthly, so you must change the years into months first. 25 years is 25 × 12 = 300 monthly payments. Because the loan lasts so long, the interest adds up, and families often end up paying back far more than the price of the house.</p>',
     example:{q:'A house costs $20,000,000. The buyer pays a 10% deposit, then $180,000 a month for 25 years. Find the total paid.',steps:[{do:'Deposit: 10% of $20,000,000 = $2,000,000.'},{do:'Number of payments: 25 × 12 = 300 months.',why:'Monthly payments, so convert years to months.'},{do:'Monthly payments total: 300 × $180,000 = $54,000,000.'},{do:'Total paid: $2,000,000 + $54,000,000 = $56,000,000, much more than the price.'}]},
     mistake:'Multiplying the monthly payment by the number of years instead of the number of months.',
     check:{q:'A mortgage is paid at $100,000 a month for 20 years. How much do the monthly payments total?',o:['$2,000,000','$24,000,000','$20,000,000'],a:1,why:'20 × 12 = 240 months; 240 × 100,000 = $24,000,000.',hint:'Change years to months first.'}},
    {title:'Converting currency',explain:'<p>If you travel to Miami, shop online from an American store, or receive money from a relative abroad, you will need to change between currencies. An {{exchange rate|how much of one currency equals one unit of another}} tells you how much one unit of a currency is worth in another. In this lesson we use the example rate US$1 = J$157. Real rates change every day, so always check the latest rate from the Bank of Jamaica or your bank.</p><p>Here is how to decide whether to multiply or divide. One US dollar is worth many Jamaican dollars. So when you change US$ into J$, you will get a <strong>bigger</strong> number: <strong>multiply</strong> by the rate. When you change J$ into US$, you will get a <strong>smaller</strong> number: <strong>divide</strong> by the rate.</p><p>Always ask yourself if the answer makes sense. If US$100 comes out as J$0.64, something has gone wrong!</p>',
     example:{q:'Using US$1 = J$157: change US$250 to J$, and J$78,500 to US$.',steps:[{do:'US$250 → J$: 250 × 157 = J$39,250.',why:'Each US dollar is worth J$157, so the J$ number is bigger.'},{do:'J$78,500 → US$: 78,500 ÷ 157 = US$500.',why:'Divide, because you need fewer US dollars.'}]},
     mistake:'Multiplying when changing J$ to US$. That gives a far too big answer. Check: is the answer sensible?',
     check:{q:'Using US$1 = J$157, how many US$ is J$15,700?',o:['US$100','US$2,464,900','US$157'],a:0,why:'15,700 ÷ 157 = 100.',hint:'J$ → US$: divide.'}}]}]},
  {phase:'explain',name:'Teach: bills, pay and protection',title:'Learn: bills, wages, taxes and insurance',lead:'Next, the money calculations every household and worker meets.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Light bill, pay slip an insurance. Mek wi work dem out.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Utility bills and invoices',explain:'<p>Every month, households get bills for {{utilities|services such as electricity, water or internet}} such as electricity and water. Have you ever looked closely at one? Your light bill is worked out from your electricity meter.</p><p>The meter counts up all the time, like a car’s odometer, and never goes back to zero. So the reading on it is NOT what you used this month. To find what you used, subtract last month’s reading from this month’s: units used = present reading − previous reading. Then the bill is the units used × the cost per unit, plus any fixed charge (and tax, if the question says so).</p><p>Shopping bills and {{invoices|bills that list items, quantities, prices and the total due}} work in a similar step-by-step way. For each item, multiply the quantity by the unit price. Add those up to get the subtotal. Then add any tax, such as GCT, to get the total to pay.</p>',visual:METER,
     example:{q:'Electricity: previous reading 24,350, present reading 24,530. The charge is $45 per kWh plus a fixed charge of $500. Find the bill.',steps:[{do:'Units used: 24,530 − 24,350 = 180 kWh.',why:'The meter counts up all the time; the difference is what was used this month.'},{do:'Energy charge: 180 × $45 = $8,100.'},{do:'Total: $8,100 + $500 = $8,600.'}]},
     mistake:'Using the present reading (24,530) as the number of units. Units used is the DIFFERENCE between readings.',
     check:{q:'A water bill: 18 cubic metres at $250 each, plus a $1,200 service charge. What is the total?',o:['$4,500','$5,700','$1,450'],a:1,why:'18 × 250 = 4,500; 4,500 + 1,200 = $5,700.',hint:'Units × rate, then add the fixed charge.'}},
    {title:'Wages and salaries',explain:'<p>People can be paid in different ways. A {{wage|pay calculated by the hour or week}} is paid by the hour or by the week, so the more hours you work, the more you earn. A {{salary|a fixed amount of pay per year, usually paid monthly}} is a fixed amount for the whole year, usually paid in 12 monthly parts. Some salespeople also earn commission: a percentage of what they sell.</p><p>Many hourly workers can earn extra by working {{overtime|extra hours beyond normal hours, often paid at a higher rate}}: hours beyond their normal week. Overtime is often paid at <strong>time-and-a-half</strong>, which means 1.5 times the normal hourly rate, as a thank-you for the extra effort.</p><p>The total pay before anything is taken off is the {{gross pay|total pay before deductions}}. But some money is deducted first, such as income tax and contributions. What is left, the money that actually reaches your bank account, is the {{net pay|take-home pay after deductions}}.</p>',
     example:{q:'A security guard earns $600 an hour for 40 normal hours a week, and time-and-a-half for overtime. One week she works 46 hours, and $4,600 is deducted. Find her gross and net pay.',steps:[{do:'Normal pay: 40 × $600 = $24,000.'},{do:'Overtime rate: 1.5 × $600 = $900 an hour. Overtime: 6 × $900 = $5,400.',why:'46 − 40 = 6 hours of overtime.'},{do:'Gross pay: $24,000 + $5,400 = $29,400.'},{do:'Net pay: $29,400 − $4,600 = $24,800.'}]},
     mistake:'Paying overtime at the normal rate, or forgetting that 46 hours means only 6 hours of overtime.',
     check:{q:'A teacher\'s salary is $3,600,000 a year. What is the gross monthly pay?',o:['$300,000','$360,000','$30,000'],a:0,why:'3,600,000 ÷ 12 = $300,000.',hint:'Salaries are usually paid monthly: ÷ 12.'}},
    {title:'Rates, taxes and insurance',explain:'<p>Owning things comes with some regular costs. If you own land or a house, you pay a yearly {{property tax|a yearly tax on land or buildings}}, which is usually a percentage of what the property is worth. This money helps pay for local services.</p><p>People also buy insurance to protect themselves against losses, such as a car accident or a fire. The amount you pay for insurance is called the {{premium|the amount paid for insurance}}. Insurance companies often set the premium as a rate for every $100 of value. For a car worth $3,500,000 insured at $1.20 per $100, first find how many hundreds there are (35,000), then multiply by the rate: 35,000 × $1.20 = $42,000 a year.</p><p>Insurance protects what you have; investments, like the savings accounts from the last lesson, help what you have grow. Both are important parts of managing money wisely.</p>',
     example:{q:'A car worth $3,500,000 is insured at $1.20 per $100 of value. Find the yearly premium.',steps:[{do:'How many hundreds in the value: 3,500,000 ÷ 100 = 35,000.',why:'The rate is per $100.'},{do:'Premium: 35,000 × $1.20 = $42,000 a year.'}]},
     mistake:'Multiplying the whole value by the rate (3,500,000 × 1.20). The rate is per $100, so divide by 100 first.',
     check:{q:'Land is valued at $5,000,000. Property tax is 0.5% of the value. What is the tax?',o:['$2,500','$25,000','$250,000'],a:1,why:'0.005 × 5,000,000 = $25,000.',hint:'0.5% = 0.005.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Instalments',text:'HP price = deposit + all instalments. Mortgage total = deposit + monthly payment × (years × 12). Extra cost = total − cash price.'},{title:'Currency',text:'Foreign → J$: multiply by the rate. J$ → foreign: divide. Check the answer makes sense.'},{title:'Bills',text:'Units used = present − previous reading. Bill = units × rate + fixed charges + tax. Invoice: quantity × unit price, subtotal, tax, total.'},{title:'Pay, tax and insurance',text:'Overtime at time-and-a-half = 1.5 × rate. Net = gross − deductions. Premium = (value ÷ 100) × rate per $100.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'An invoice: 3 bags of cement at $1,800, 2 buckets of paint at $6,500, and 1 roller at $1,200. GCT is 15%. Find the total.',steps:[{do:'Cement: 3 × $1,800 = $5,400. Paint: 2 × $6,500 = $13,000. Roller: $1,200.'},{do:'Subtotal: $5,400 + $13,000 + $1,200 = $19,600.'},{do:'GCT: 15% of $19,600 = $2,940.'},{do:'Total: $19,600 + $2,940 = $22,540.'}]},
     {type:'fill',q:'A worker earns $500 an hour and works 6 hours of overtime at time-and-a-half.',steps:[{text:'Overtime rate: 1.5 × $500 = $750 an hour.'},{text:'Overtime pay: 6 × $750 = $___',blank:true,a:4500,hint:'6 × 750.'}],sol:'6 × $750 = $4,500.'},
     {type:'own',q:'Electricity: previous reading 24,350, present reading 24,530, charged at $45 per kWh plus a $500 fixed charge. What is the bill?',a:8600,hint:'Units used = 180.',sol:'180 × 45 = 8,100; + 500 = $8,600.',placeholder:'dollars'},
     {type:'own',q:'Using US$1 = J$157, change US$250 to Jamaican dollars.',a:39250,hint:'Multiply.',sol:'250 × 157 = J$39,250.',placeholder:'J$'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Money in or money out?',desc:'Sort each item for a household budget.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Does the money come to the household, or go out of it?',bins:[{id:'in',label:'Money coming in'},{id:'out',label:'Money going out'}],items:[{label:'Monthly salary',bin:'in'},{label:'Light bill',bin:'out'},{label:'Commission on sales',bin:'in'},{label:'Car insurance premium',bin:'out'},{label:'Hire purchase instalment',bin:'out'},{label:'Interest earned on savings',bin:'in'},{label:'Property tax',bin:'out'},{label:'Overtime pay',bin:'in'}]}},
    {icon:'🃏',title:'Match the words',desc:'Match each money word to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Deposit','the first payment'],['Instalment','one of the regular payments'],['Premium','what you pay for insurance'],['Gross pay','pay before deductions'],['Net pay','take-home pay'],['Exchange rate','value of one currency in another']]}},
    {icon:'📏',title:'Cheapest overall',desc:'Order ways of buying a $100,000 washing machine.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out the total cost of each option, then tap them from cheapest to dearest.',rounds:[[{label:'Cash, $100,000',v:100000,show:'$100,000'},{label:'$20,000 down + 12 × $7,500',v:110000,show:'$110,000'},{label:'$10,000 down + 24 × $4,500',v:118000,show:'$118,000'},{label:'Cash with 5% discount',v:95000,show:'$95,000'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Buying on hire purchase costs more than paying cash.',a:'sometimes',why:'It usually does, but stores sometimes offer interest-free plans where the HP price equals the cash price.',hint:'Think of "interest-free" offers.'},{s:'Net pay is more than gross pay.',a:'never',why:'Net pay is gross pay MINUS deductions.'},{s:'Changing US$ to J$ gives a bigger number.',a:'always',why:'One US dollar is worth many Jamaican dollars.'},{s:'Overtime is paid at a higher rate than normal hours.',a:'sometimes',why:'Often it is time-and-a-half or double, but it depends on the job and the agreement.',hint:'Is it the same for every job?'},{s:'The units on a light bill are the present meter reading.',a:'never',why:'Units used are the DIFFERENCE between the present and previous readings.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Brianna',q:'Change J$31,400 to US$, using US$1 = J$157.',lines:['31,400 × 157 = 4,929,800','So it is US$4,929,800'],wrong:0,reasons:['To change J$ to US$, divide by the rate','She should add 157','The rate is wrong'],reason:0,fix:'31,400 ÷ 157 = US$200.'},{who:'Omar',q:'A TV is $15,000 down and 12 payments of $6,000. Find the HP price.',lines:['12 × $6,000 = $72,000','HP price = $72,000'],wrong:1,reasons:['He forgot to add the $15,000 deposit','12 × 6,000 is $7,200','He should subtract the deposit'],reason:0,fix:'$15,000 + $72,000 = $87,000.'},{who:'Sasha',q:'Previous reading 3,215, present reading 3,395, at $45 per kWh. Find the energy charge.',lines:['Units used = 3,395','Charge = 3,395 × $45 = $152,775'],wrong:0,reasons:['Units used is the difference: 3,395 − 3,215 = 180','The rate should be $4.50','She should add the readings'],reason:0,fix:'180 × $45 = $8,100.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire money questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,3);if(r===0){var d=R(1,5)*5000,n=[6,10,12][R(0,2)],i=R(2,9)*1000;return{q:'Deposit '+$m(d)+' and '+n+' payments of '+$m(i)+'. HP price?',o:[$m(d+n*i),$m(n*i),$m(d*n+i)],a:0,why:'Deposit + '+n+' × '+$m(i)+'.'}}if(r===1){var u=R(1,20)*10;return{q:'US$'+u+' in J$ (US$1 = J$157)?',o:['J$'+(u*157).toLocaleString('en-JM'),'J$'+(u+157),'J$'+(Math.round(u/157*100)/100)],a:0,why:'Multiply by 157.'}}if(r===2){var p=R(5,9)*100,h=R(2,8);return{q:'Overtime: '+h+' hours at time-and-a-half. Normal rate '+$m(p)+'/hour. Overtime pay?',o:[$m(h*p*1.5),$m(h*p),$m(h*p*2)],a:0,why:h+' × 1.5 × '+$m(p)+'.'}}var pr=R(100,400)*10,u2=R(80,300),rate=[40,45,50][R(0,2)];return{q:'Readings: '+pr.toLocaleString('en-JM')+' then '+(pr+u2).toLocaleString('en-JM')+' kWh at $'+rate+'/kWh. Energy charge?',o:[$m(u2*rate),$m((pr+u2)*rate),$m(u2+rate)],a:0,why:u2+' kWh × $'+rate+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Design deals and pay that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Design a hire purchase plan for a $60,000 stove that costs exactly $72,000 in total. Type it as deposit, number of payments, each payment (for example 12000, 10, 6000).',placeholder:'deposit, n, payment',check:function(v){var n=String(v).replace(/[$\s]/g,'').split(',').map(Number);if(n.length!==3||n.some(function(x){return!(x>=0)}))return{ok:false,msg:'Type three numbers separated by commas.'};var t=n[0]+n[1]*n[2];return Math.abs(t-72000)<0.01?{ok:true,msg:'Yes! '+$m(n[0])+' + '+n[1]+' × '+$m(n[2])+' = $72,000, which is $12,000 more than cash.'}:{ok:false,msg:'That plan costs '+$m(t)+' altogether. You need $72,000.'}}},{q:'A worker earns $800 an hour, with time-and-a-half overtime after 40 hours. How many hours must she work in a week to earn exactly $44,000 gross?',placeholder:'hours',check:function(v){return+v===50?{ok:true,msg:'Correct! 40 hours earn $32,000. The other $12,000 is overtime at $1,200 an hour: 10 hours. 40 + 10 = 50 hours.'}:{ok:false,msg:'Normal pay for 40 hours is $32,000. Overtime pays $1,200 an hour. How many overtime hours make up the rest?'}}},{q:'Using US$1 = J$157, type a whole number of US dollars that is worth MORE than J$100,000 but less than J$101,000.',placeholder:'US$',check:function(v){var x=+v,j=x*157;return x%1===0&&j>100000&&j<101000?{ok:true,msg:'Yes! US$'+x+' = J$'+j.toLocaleString('en-JM')+'.'}:{ok:false,msg:'US$'+x+' = J$'+(j||0).toLocaleString('en-JM')+'. Try a number around 640.'}}}]}},
