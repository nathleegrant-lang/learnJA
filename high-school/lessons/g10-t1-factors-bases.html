 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 1',unit:'Module 1: Number Theory and Computation',strand:'Number Theory and Computation',standard:'Module 1, Number Theory and Computation: demonstrate computational skills; understand and appreciate the decimal numeration system; appreciate the development of different numeration systems; demonstrate the ability to use number properties to solve problems.',
  objectives:['1.5 list the set of factors and multiples of a given integer;','1.6 compute the H.C.F. or L.C.M. of two or more positive integers;','1.7 state the value of a digit of a numeral in a given base;','1.10 use properties of numbers and operations in computational tasks;'],

 glossary:[['Factor','A number that divides exactly into another number. 6 is a factor of 18.'],['Multiple','The result of multiplying a number by an integer. 18 is a multiple of 6.'],['Prime number','A number with exactly two factors: 1 and itself. 2, 3, 5, 7, 11, …'],['Prime factorisation','Writing a number as a product of prime numbers, such as 72 = 2³ × 3².'],['HCF','Highest common factor: the biggest number that divides exactly into all the given numbers.'],['LCM','Lowest common multiple: the smallest number that all the given numbers divide into exactly.'],['Base','The number of digits a number system uses. Base 10 uses 0 to 9; base 2 uses 0 and 1.'],['Place value','The value of a position in a number, such as 2³ = 8 in base 2.'],['Face value','The digit itself, whatever its position.'],['Commutative','The order does not matter: a + b = b + a and a × b = b × a.'],['Associative','The grouping does not matter: (a + b) + c = a + (b + c).'],['Distributive','a × (b + c) = a × b + a × c.']],

 steps:[
  {phase:'engage',name:'The bus puzzle',title:'When do the buses meet again?',lead:'Two buses leave Half Way Tree at 6:00 a.m. Route A leaves every 12 minutes. Route B leaves every 18 minutes.',

   blocks:[{type:'mcq',star:true,questions:[{q:'Which number is a factor of 20?',o:['3','5','8'],a:1,why:'20 ÷ 5 = 4 exactly.',teach:'A factor divides exactly into a number. The factors of 20 are 1, 2, 4, 5, 10 and 20.'},{q:'Which number is a multiple of 6?',o:['3','16','24'],a:2,why:'6 × 4 = 24.',teach:'Multiples are the numbers in a times table: 6, 12, 18, 24, 30, …'},{q:'Which number is prime?',o:['9','11','15'],a:1,why:'11 has only two factors: 1 and 11.',teach:'A prime number has exactly two factors: 1 and itself. 9 = 3 × 3 and 15 = 3 × 5 are not prime.'},{q:'What is 2 × 2 × 2?',o:['6','8','222'],a:1,why:'2 × 2 = 4, 4 × 2 = 8. We write it as 2³.',teach:'Multiply step by step: 2 × 2 = 4, then 4 × 2 = 8. A short way to write it is 2³.'}]}]},
  {phase:'explore',name:'Bus timetable explorer',title:'Explore: when do the buses meet?',lead:'Set how often each bus route leaves. The timeline shows every departure for two hours. Gold marks show when both routes leave together.',

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="btA">Route A every</label><input type="range" id="btA" min="2" max="30" value="12"><output class="big btAO"></output><span>minutes</span></div><div class="controls"><label for="btB">Route B every</label><input type="range" id="btB" min="2" max="30" value="18"><output class="big btBO"></output><span>minutes</span></div><div class="scene btSvg"></div><div class="explain btX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge btN"></span> <strong class="btT"></strong></p><div class="controls"><input type="number" class="btAns" aria-label="Minutes after 6:00" placeholder="minutes"><button type="button" class="go btC">Check</button></div><div class="fb btFb" aria-live="polite">Set the sliders, then type your answer.</div></div>',
     init:function(box,api){var a=box.querySelector('#btA'),b=box.querySelector('#btB');api.nudges(a);api.nudges(b);var g=function(x,y){while(y){var t=y;y=x%y;x=t}return x};function draw(){var A=+a.value,B=+b.value,L=A*B/g(A,B),W=600,X=function(t){return 40+t*W/120},s='<svg viewBox="0 0 680 150" role="img" aria-label="Timeline of departures for two bus routes"><rect width="680" height="150" fill="#faf8fe"/><line x1="40" y1="50" x2="640" y2="50" stroke="#b3a6d6"/><line x1="40" y1="100" x2="640" y2="100" stroke="#b3a6d6"/><text x="6" y="55" font-size="14" font-weight="700" fill="#2f5fc4">A</text><text x="6" y="105" font-size="14" font-weight="700" fill="#16766a">B</text>';for(var t=0;t<=120;t+=A)s+='<circle cx="'+X(t)+'" cy="50" r="6" fill="#2f5fc4"/>';for(t=0;t<=120;t+=B)s+='<circle cx="'+X(t)+'" cy="100" r="6" fill="#16766a"/>';for(t=0;t<=120;t+=L)s+='<rect x="'+(X(t)-4)+'" y="36" width="8" height="78" fill="#ffb02e" opacity=".6"/>';for(t=0;t<=120;t+=20)s+='<text x="'+X(t)+'" y="138" font-size="12" text-anchor="middle" fill="#5d5478">'+t+' min</text>';box.querySelector('.btSvg').innerHTML=s+'</svg>';box.querySelector('.btAO').textContent=A;box.querySelector('.btBO').textContent=B;box.querySelector('.btX').innerHTML='Both routes leave together every <strong>'+L+' minutes</strong>'+(L>120?' (after the end of this timeline).':'.')+' Notice: '+L+' is the smallest number that is in BOTH the '+A+' times table and the '+B+' times table.'}a.addEventListener('input',draw);b.addEventListener('input',draw);var T=[{t:'Route A every 12 minutes, Route B every 18. When do they first leave together after 6:00?',A:12,B:18,ans:36},{t:'Every 8 minutes and every 10 minutes. When do they first leave together?',A:8,B:10,ans:40},{t:'Every 6 minutes and every 9 minutes. When do they first leave together?',A:6,B:9,ans:18}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.btN').textContent='All done';box.querySelector('.btT').textContent='You completed every challenge!';box.querySelector('.btC').disabled=true;return}box.querySelector('.btN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.btT').textContent=T[k].t}box.querySelector('.btC').onclick=function(){var v=+box.querySelector('.btAns').value,fb=box.querySelector('.btFb');if(v===T[k].ans){fb.className='fb ok btFb';fb.textContent='✓ Correct! '+T[k].ans+' minutes after 6:00.';k++;api.set('k',k);box.querySelector('.btAns').value='';task();if(k===T.length)api.complete()}else{fb.className='fb no btFb';fb.textContent='Not yet. Set Route A to '+T[k].A+' and Route B to '+T[k].B+', then look for the first gold mark after 0.'}};draw();task()}},
    {type:'recall',text:'The buses first leave together 36 minutes after 6:00, at 6:36 a.m. 36 is the lowest common multiple (LCM) of 12 and 18.'}]},
  {phase:'explain',name:'Teach: factors, HCF and LCM',title:'Learn: factors, primes, HCF and LCM',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'HCF a di biggest one weh share. LCM a di smallest one dem meet.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Factors and multiples',explain:'<p>A {{factor|a number that divides exactly into another}} divides exactly into a number. Factors come in pairs: 18 = 1 × 18 = 2 × 9 = 3 × 6, so the positive factors of 18 are 1, 2, 3, 6, 9 and 18.</p><p>Integers also have <strong>negative factors</strong>: −1, −2, −3, −6, −9 and −18 are factors of 18 too, because (−2) × (−9) = 18.</p><p>A {{multiple|the result of multiplying a number by an integer}} is in a number\'s times table: the multiples of 6 are 6, 12, 18, 24, …</p>',
     example:{q:'List the positive factors of 36 and its first five multiples.',steps:[{do:'Find factor pairs: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6.',why:'Working in pairs means you will not miss any. Stop when the pairs meet.'},{do:'Factors: 1, 2, 3, 4, 6, 9, 12, 18, 36.'},{do:'Multiples: 36, 72, 108, 144, 180.'}]},
     mistake:'Mixing up factors and multiples. Factors are smaller (they go INTO the number); multiples are bigger (the number goes into them).',
     check:{q:'Which list shows all the positive factors of 15?',o:['1, 3, 5, 15','15, 30, 45','3, 5'],a:0,why:'1 × 15 and 3 × 5.',hint:'Find the factor pairs.'}},
    {title:'Prime factorisation',explain:'<p>A {{prime number|a number with exactly two factors: 1 and itself}} has exactly two factors. The primes start 2, 3, 5, 7, 11, 13, … (1 is not prime.)</p><p>Every whole number greater than 1 can be written as a product of primes: its {{prime factorisation|writing a number as a product of primes}}. Use a <strong>factor tree</strong>: split the number into any factor pair, and keep splitting until every branch ends in a prime.</p>',visual:TREE,
     example:{q:'Write 72 as a product of its prime factors.',steps:[{do:'Split 72 into 8 × 9.',why:'Any factor pair works; you always end with the same primes.'},{do:'8 = 2 × 4 = 2 × 2 × 2, and 9 = 3 × 3.'},{do:'72 = 2 × 2 × 2 × 3 × 3 = 2³ × 3².'}]},
     mistake:'Stopping at a number that is not prime, such as 72 = 8 × 9. Keep going until every factor is prime.',
     check:{q:'What is the prime factorisation of 60?',o:['6 × 10','2² × 3 × 5','2 × 30'],a:1,why:'60 = 2 × 2 × 3 × 5 = 2² × 3 × 5.',hint:'Keep splitting until every factor is prime.'}},
    {title:'HCF and LCM',explain:'<p>The {{HCF|highest common factor}} (highest common factor) is the <strong>biggest</strong> number that divides into all the numbers. The {{LCM|lowest common multiple}} (lowest common multiple) is the <strong>smallest</strong> number they all divide into.</p><p>Using prime factors: <strong>HCF</strong> = multiply the primes they <strong>share</strong>, using the lowest powers. <strong>LCM</strong> = multiply <strong>every</strong> prime that appears, using the highest powers.</p><p>Use HCF for sharing or cutting into equal groups; use LCM for things that repeat and line up again, like the buses.</p>',
     example:{q:'Find the HCF and LCM of 12 and 18.',steps:[{do:'12 = 2² × 3 and 18 = 2 × 3².'},{do:'HCF: shared primes at the lowest power: 2¹ × 3¹ = 6.',why:'6 is the biggest number that divides into both 12 and 18.'},{do:'LCM: every prime at the highest power: 2² × 3² = 36.',why:'36 is the smallest number in both times tables: the bus answer!'},{do:'Check: HCF × LCM = 6 × 36 = 216 = 12 × 18 ✓'}]},
     mistake:'Mixing them up. The HCF can never be bigger than the smallest number; the LCM can never be smaller than the biggest number.',
     check:{q:'What is the HCF of 24 and 40?',o:['4','8','120'],a:1,why:'24 = 2³ × 3 and 40 = 2³ × 5; they share 2³ = 8.',hint:'Which primes do they share?'}}]}]},
  {phase:'explain',name:'Teach: bases and properties',title:'Learn: number bases and number properties',lead:'Next, how numbers work in other bases, and the properties that make calculating easier.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Computer count wid only 0 an 1. Dat a base 2.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Place value in base 10 and base 2',explain:'<p>Our normal numbers are in <strong>base 10</strong>: each place is worth 10 times the place to its right (1, 10, 100, 1,000, …), and we use the digits 0 to 9.</p><p>In <strong>base 2</strong> (binary), each place is worth 2 times the place to its right: 1, 2, 4, 8, 16, … and we use only the digits 0 and 1. Computers store everything in binary.</p><p>The {{place value|the value of a position}} is what a position is worth; the {{face value|the digit itself}} is the digit itself. A small number after a numeral shows its base: 1011₂ means base 2.</p>',visual:PV(2,['1','0','1','1']),
     example:{q:'In 1011₂, find the place value of the first 1, and change 1011₂ to base 10.',steps:[{do:'The places, from the right, are worth 1, 2, 4 and 8.'},{do:'The first 1 is in the 8s place, so its place value is 8 and its face value is 1.'},{do:'1011₂ = 1 × 8 + 0 × 4 + 1 × 2 + 1 × 1 = 11.',why:'Multiply each digit by its place value and add.'}]},
     mistake:'Reading 1011₂ as "one thousand and eleven". It is "one, zero, one, one, base two", and it equals 11 in base 10.',
     check:{q:'What is 110₂ in base 10?',o:['6','110','3'],a:0,why:'1 × 4 + 1 × 2 + 0 × 1 = 6.',hint:'The places are worth 4, 2, 1.'}},
    {title:'Bases 4 and 8',explain:'<p>The same idea works in any base. In <strong>base 4</strong> the places are worth 1, 4, 16, 64, … and the digits are 0 to 3. In <strong>base 8</strong> the places are worth 1, 8, 64, 512, … and the digits are 0 to 7.</p><p>A digit can never be as big as the base: there is no digit 8 in base 8.</p>',visual:PV(8,['1','5','7']),
     example:{q:'Change 157₈ to base 10, and state the place value of the 5.',steps:[{do:'The places, from the right, are worth 1, 8 and 64.'},{do:'The 5 is in the 8s place, so its value is 5 × 8 = 40.'},{do:'157₈ = 1 × 64 + 5 × 8 + 7 × 1 = 64 + 40 + 7 = 111.'}]},
     mistake:'Using powers of 10 for every base. In base 8, the second place is worth 8, not 10.',
     check:{q:'What is 213₄ in base 10?',o:['39','213','27'],a:0,why:'2 × 16 + 1 × 4 + 3 × 1 = 39.',hint:'The places are worth 16, 4, 1.'}},
    {title:'Properties of numbers',explain:'<p>These properties make mental calculation easier:</p><p>{{Commutative|order does not matter}}: a + b = b + a and a × b = b × a.<br>{{Associative|grouping does not matter}}: (a × b) × c = a × (b × c).<br>{{Distributive|a × (b + c) = ab + ac}}: a × (b + c) = a × b + a × c.<br><strong>Identity:</strong> a + 0 = a and a × 1 = a. <strong>Inverse:</strong> a + (−a) = 0 and a × (1/a) = 1.<br><strong>Closure:</strong> adding two integers always gives an integer.</p><p>Subtraction and division are <strong>not</strong> commutative: 5 − 3 ≠ 3 − 5.</p>',
     example:{q:'Work out 25 × 37 × 4 and 8 × 99 in your head.',steps:[{do:'25 × 37 × 4 = (25 × 4) × 37 = 100 × 37 = 3,700.',why:'Commutative and associative: change the order and grouping to make 100.'},{do:'8 × 99 = 8 × (100 − 1).'},{do:'= 800 − 8 = 792.',why:'Distributive property.'}]},
     mistake:'Assuming every operation is commutative. 12 ÷ 4 = 3, but 4 ÷ 12 = 1/3.',
     check:{q:'Which property is shown by 6 × (10 + 3) = 60 + 18?',o:['Commutative','Distributive','Identity'],a:1,why:'The 6 is multiplied by each part of the bracket.',hint:'Multiplying over a bracket.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Factors and primes',text:'Factors divide in exactly; multiples are in the times table. Primes have exactly two factors. 1 is not prime.'},{title:'HCF and LCM',text:'HCF: shared primes, lowest powers (for sharing). LCM: all primes, highest powers (for repeating events). For 12 and 18: HCF 6, LCM 36.'},{title:'Bases',text:'Places are powers of the base. Base 2: 1, 2, 4, 8, … Base 4: 1, 4, 16, … Base 8: 1, 8, 64, … Digits are always less than the base.'},{title:'Properties',text:'Commutative (order), associative (grouping), distributive (over a bracket), identity (0 and 1), inverse (opposite and reciprocal), closure.'}]},

     {type:'worked',q:'A carpenter has planks of 84 cm and 126 cm. He wants to cut both into equal pieces that are as long as possible, with no waste. How long is each piece?',steps:[{do:'"As long as possible" and "equal pieces" point to the HCF.'},{do:'84 = 2² × 3 × 7 and 126 = 2 × 3² × 7.'},{do:'HCF = 2 × 3 × 7 = 42. Each piece is 42 cm long.'}]},

     {type:'own',q:'Change 10110₂ to base 10.',a:22,hint:'The places are worth 16, 8, 4, 2, 1.',sol:'16 + 4 + 2 = 22.'},

    {icon:'🗂️',title:'HCF or LCM?',desc:'Decide which one each problem needs.',level:'⭐⭐ Skill builder',mins:5,block:{type:'sort',tip:'Sharing or cutting into equal groups → HCF. Events repeating and lining up → LCM.',bins:[{id:'h',label:'HCF'},{id:'l',label:'LCM'}],items:[{label:'Biggest equal groups from 24 boys and 36 girls',bin:'h'},{label:'Two lighthouses flash every 8 s and 12 s: when together?',bin:'l'},{label:'Longest equal pieces cut from 60 cm and 75 cm ribbon',bin:'h'},{label:'Two runners lap a track every 4 and 6 minutes: when level?',bin:'l'},{label:'Largest square tiles to cover a 120 × 90 floor exactly',bin:'h'},{label:'Hot dogs in packs of 10, buns in packs of 8: fewest to match',bin:'l'}]}},

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The HCF of two numbers is smaller than both numbers.',a:'sometimes',why:'The HCF of 6 and 18 is 6, which equals one of them; the HCF of 8 and 12 is 4, smaller than both.',hint:'Try 6 and 18.'},{s:'The LCM of two numbers is their product.',a:'sometimes',why:'LCM of 4 and 5 is 20 = 4 × 5, but LCM of 4 and 6 is 12, not 24.',hint:'Try 4 and 6.'},{s:'A prime number greater than 2 is odd.',a:'always',why:'Every even number greater than 2 has 2 as a factor, so it is not prime.'},{s:'Subtraction is commutative.',a:'never',why:'a − b = b − a only when a = b; in general the order changes the answer.',hint:'Try 5 − 3 and 3 − 5. (They are only equal if the numbers are the same.)'},{s:'HCF × LCM equals the product of the two numbers.',a:'always',why:'For any two positive integers a and b, HCF × LCM = a × b.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Akeem',q:'Find the LCM of 6 and 8.',lines:['6 × 8 = 48','So the LCM is 48'],wrong:1,reasons:['The product is a common multiple, but not always the lowest one','6 × 8 is 56','He found the HCF'],reason:0,fix:'6 = 2 × 3 and 8 = 2³, so LCM = 2³ × 3 = 24.'},{who:'Tia',q:'Change 101₂ to base 10.',lines:['The places are worth 100, 10 and 1','101₂ = 100 + 0 + 1 = 101'],wrong:0,reasons:['In base 2 the places are worth 4, 2 and 1','The places are worth 3, 2 and 1','101₂ is not a valid number'],reason:0,fix:'1 × 4 + 0 × 2 + 1 × 1 = 5.'},{who:'Marcus',q:'Write 36 as a product of primes.',lines:['36 = 4 × 9','So the prime factorisation is 4 × 9'],wrong:1,reasons:['4 and 9 are not prime; keep splitting','36 is prime','He should add the factors'],reason:0,fix:'36 = 2 × 2 × 3 × 3 = 2² × 3².'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire HCF, LCM and base questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},g=function(x,y){while(y){var t=y;y=x%y;x=t}return x},r=R(0,2);if(r===0){var a=R(2,12)*R(1,4),b=R(2,12)*R(1,4);if(a===b)b+=R(1,5);var h=g(a,b);return{q:'HCF of '+a+' and '+b+' = ?',o:[String(h),String(a*b/h),String(h+1===a*b/h?h+2:h+1)],a:0,why:'The biggest number dividing both is '+h+'.'}}if(r===1){var c=R(2,15),d=R(2,15);if(c===d)d++;var l=c*d/g(c,d);return{q:'LCM of '+c+' and '+d+' = ?',o:[String(l),String(g(c,d)),String(l===c*d?l*2:c*d)],a:0,why:'The smallest number both divide into is '+l+'.'}}var base=[2,4,8][R(0,2)],n=R(base,base*base*2-1),digits=n.toString(base);return{q:'Change '+digits+' (base '+base+') to base 10.',o:[String(n),digits,String(n+base)],a:0,why:'Multiply each digit by its place value.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent numbers that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type two numbers whose HCF is 6. (For example: a, b)',placeholder:'a, b',check:function(v){var n=String(v).split(',').map(Number),g=function(x,y){while(y){var t=y;y=x%y;x=t}return x};if(n.length!==2||n.some(function(x){return!(x>0)||x%1}))return{ok:false,msg:'Type two positive whole numbers separated by a comma.'};var h=g(n[0],n[1]);return h===6?{ok:true,msg:'Yes! HCF('+n[0]+', '+n[1]+') = 6.'}:{ok:false,msg:'Their HCF is '+h+'. Try two multiples of 6 that share no other factor, like 12 and 18.'}}},{q:'Type a number in base 2 that equals 13 in base 10.',placeholder:'e.g. …',check:function(v){var t=String(v).replace(/[₂\s]/g,'');if(!/^[01]+$/.test(t))return{ok:false,msg:'Base 2 numbers use only 0 and 1.'};var n=parseInt(t,2);return n===13?{ok:true,msg:'Correct! 1101₂ = 8 + 4 + 1 = 13.'}:{ok:false,msg:t+'₂ = '+n+'. You need 8 + 4 + 1.'}}},{q:'Type the largest digit you can use in base 8.',placeholder:'digit',check:function(v){return String(v).trim()==='7'?{ok:true,msg:'Yes! Base 8 uses the digits 0 to 7.'}:{ok:false,msg:'A digit must always be less than the base.'}}}]}},
    {icon:'🎉',title:'Mission: the school fun day',desc:'Plan packs, groups and a timetable for a school fun day.',level:'⭐⭐⭐ Real-world mission',mins:7,block:{type:'mission',story:'Your school in May Pen is holding a fun day. Help the organisers use factors and multiples to plan it.',parts:[{q:'There are 48 Grade 10 students and 60 Grade 11 students. They are split into teams with the same number in each team and no mixing of grades. What is the biggest possible team size?',a:12,hint:'Biggest equal groups → HCF of 48 and 60.',sol:'48 = 2⁴ × 3 and 60 = 2² × 3 × 5, so HCF = 2² × 3 = 12.'},{q:'How many teams will there be altogether?',a:9,hint:'48 ÷ 12 + 60 ÷ 12.',sol:'4 + 5 = 9 teams.'},{q:'Juice boxes come in packs of 6 and cups of cake come in packs of 8. What is the smallest number of each you can buy to have exactly the same number of juices and cakes?',a:24,hint:'LCM of 6 and 8.',sol:'LCM(6, 8) = 24.'},{q:'A bell rings every 15 minutes and a whistle blows every 20 minutes. Both start at 9:00 a.m. How many minutes after 9:00 do they next sound together?',a:60,hint:'LCM of 15 and 20.',sol:'LCM(15, 20) = 60 minutes, so at 10:00 a.m.'},{q:'The computer club writes the number of teams (9) in binary. What is it in base 2?',a:['1001'],hint:'9 = 8 + 1.',sol:'9 = 8 + 1 = 1001₂.'}],done:'You used HCF, LCM and binary to plan a real school event.'}}
