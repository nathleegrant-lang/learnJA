 goals:['use consumer arithmetic to solve real-life problems','calculate the total utility bill from meter readings and given rates','explain and correctly use the words for wages and salaries: basic pay, overtime, commission, bonus, gross pay, deductions, taxable income, tax allowance and net pay','calculate the wage or salary of an employee from given instructions'],
 curriculum:{framework:'NSC Mathematics, Grade 9',term:'Term 2',unit:'Unit 3B: Consumer Arithmetic',strand:'Consumer Arithmetic',standard:'Number Operation and Application: Use the basic operations, number relationships, patterns, number facts, calculators and software to compute and estimate in order to solve real world problems involving fractions, percentages and decimals.',
  objectives:['Use consumer arithmetic to solve real life problems;','Calculate the total utility bill to be paid from given instructions;','Explain and use in the proper context terms relating to the computation of wages and salaries (wages, salaries, bonuses, commissions, basic pay, overtime pay, gross pay, net pay, statutory and non-statutory deductions, taxable income, tax allowance);','Calculate the wage and/ or salary of an employee from given instructions.'],
  focus:'Meter readings and units used; tiered rates, fixed charges and tax on utility bills; wages and salaries; basic pay, overtime, commission and bonuses; gross pay; statutory and non-statutory deductions; tax allowance and taxable income; net pay.',
  note:'Source: National Standards Curriculum Guide, Mathematics Grades 7-9 (MoEYI, 2018), Grade 9, Term 2, Numbers unit: Consumer Arithmetic. The guide suggests setting up a business such as growing and selling exotic flowers, with salaries and utility bills; the mission is based on that. All rates in this lesson (utility rates, deduction percentages and the tax allowance) are EXAMPLE rates for practice. Real rates change; check current figures with JPS, the NWC and Tax Administration Jamaica.'},
 glossary:[['Utility','A service such as electricity, water or internet.'],['Meter reading','The number shown on a meter. It keeps counting up.'],['kWh','Kilowatt-hour: the unit electricity is measured and charged in.'],['Fixed charge','An amount paid every month, however much you use.'],['Wage','Pay calculated by the hour or week.'],['Salary','A fixed yearly amount, usually paid monthly.'],['Basic pay','Pay for the normal working hours.'],['Overtime','Extra hours beyond the normal hours, often paid at a higher rate, such as time-and-a-half.'],['Commission','A percentage of the value of sales, paid to a salesperson.'],['Bonus','An extra payment, often for good performance or at Christmas.'],['Gross pay','Total pay before any deductions.'],['Statutory deductions','Deductions required by law, such as income tax, NIS, NHT and Education Tax.'],['Non-statutory deductions','Voluntary deductions, such as union dues, savings or loan repayments.'],['Tax allowance','The part of your income that is not taxed (the tax-free amount).'],['Taxable income','The income that tax is charged on: income above the tax allowance.'],['Net pay','Take-home pay, after all deductions.']],
 teacher:{time:'about 100 minutes over two periods: utility bills, then wages and salaries',flow:[['Engage','8 min','Light bill prediction.','Bring a real (blank or anonymised) JPS or NWC bill.'],['Explore','15 min','Payslip builder: see how gross pay becomes net pay.','Ask: "Why is take-home pay less than gross pay?"'],['Explain','40 min','Meter readings and bills; wages, salaries and their terms; full payslips; I do, we do, you do.','Stress that rates in questions are examples; check current rates.'],['Elaborate','25 min','Challenge Zone, the guide’s flower business, and Bronze to Gold problems.','Groups run the guide’s business project.'],['Evaluate','12 min','Quiz and reflection.','Watch for using the meter reading as the units used.']],

 steps:[
  {phase:'engage',name:'The light bill',title:'Why is the light bill so high?',lead:'Mrs. Clarke in Old Harbour gets her monthly light bill. Her meter now reads 45,630, and last month it read 45,350. Her son says, "We must have used 45,630 units this month!"',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',
   mission:['Answer each question.','If you get it wrong, read the refresher, then try again.','Answer all 4 to continue with confidence.'],

   blocks:[{type:'mcq',star:true,questions:[{q:'What is 1.5 × $800?',o:['$1,200','$1,600','$800.50'],a:0,why:'800 + 400 = 1,200.',teach:'1.5 times means the whole amount plus half of it: $800 + $400 = $1,200.'},{q:'What is 3% of $50,000?',o:['$1,500','$150','$15,000'],a:0,why:'0.03 × 50,000 = 1,500.',teach:'3% is 0.03. Multiply: 0.03 × 50,000 = 1,500.'},{q:'What is 45,630 − 45,350?',o:['280','380','220'],a:0,why:'45,630 − 45,350 = 280.',teach:'Subtract the smaller from the larger: 45,630 − 45,350 = 280.'},{q:'A worker earns $750 an hour for 40 hours. Pay?',o:['$30,000','$3,000','$7,540'],a:0,why:'750 × 40 = 30,000.',teach:'Multiply the hourly rate by the hours: 750 × 40 = 30,000.'}]}]},
  {phase:'explore',name:'Payslip builder',title:'Explore: the payslip builder',lead:'Build a weekly payslip for a worker at a flower farm. Change the hours, overtime and sales, and watch how gross pay becomes take-home (net) pay. All rates here are example rates for practice.',
   mission:['Change the hours, overtime and sales. Watch each line of the payslip change.','Notice which deductions are statutory and which are not.','Complete all 3 challenges for a star.'],
   patois:'See how di money go from gross to net.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="pbH">Normal hours:</label><input type="number" id="pbH" value="40" style="width:80px"><label for="pbR">Rate per hour ($):</label><input type="number" id="pbR" value="600" style="width:100px"></div><div class="controls"><label for="pbO">Overtime hours (paid at time-and-a-half):</label><input type="number" id="pbO" value="5" style="width:80px"><label for="pbS">Flower sales made ($):</label><input type="number" id="pbS" value="40000" style="width:110px"></div><table class="rec pbT" style="max-width:none"></table><p style="font-size:.88rem;margin:6px 0 0">Example rates: commission 5% of sales; NIS 3%, NHT 2% and Education Tax 2.25% of gross pay; tax allowance $30,000 a week; income tax 25% of taxable income; union dues $500. Real rates are different and change over time.</p><div class="tile"><p style="margin:0"><span class="badge pbN"></span> <strong class="pbQ"></strong></p><div class="controls"><input type="number" class="pbA" aria-label="Your answer" placeholder="dollars"><button type="button" class="go pbC">Check</button></div><div class="fb pbFb" aria-live="polite">Use the payslip builder to help you.</div></div>',
     init:function(box,api){var g=function(id){return parseFloat(box.querySelector(id).value)||0};function draw(){var h=g('#pbH'),r=g('#pbR'),o=g('#pbO'),s=g('#pbS'),basic=h*r,ot=o*r*1.5,com=s*0.05,gross=basic+ot+com,nis=gross*0.03,nht=gross*0.02,ed=gross*0.0225,taxable=Math.max(0,gross-30000),tax=taxable*0.25,union=500,net=gross-nis-nht-ed-tax-union;box.querySelector('.pbT').innerHTML='<tbody><tr><td>Basic pay ('+h+' h × '+J(r)+')</td><td>'+J(basic)+'</td></tr><tr><td>Overtime ('+o+' h × '+J(r*1.5)+')</td><td>'+J(ot)+'</td></tr><tr><td>Commission (5% of '+J(s)+')</td><td>'+J(com)+'</td></tr><tr><td><strong>Gross pay</strong></td><td><strong>'+J(gross)+'</strong></td></tr><tr><td>Statutory: NIS (3%)</td><td>− '+J(nis)+'</td></tr><tr><td>Statutory: NHT (2%)</td><td>− '+J(nht)+'</td></tr><tr><td>Statutory: Education Tax (2.25%)</td><td>− '+J(ed)+'</td></tr><tr><td>Taxable income (gross − '+J(30000)+' allowance)</td><td>'+J(taxable)+'</td></tr><tr><td>Statutory: Income tax (25% of taxable income)</td><td>− '+J(tax)+'</td></tr><tr><td>Non-statutory: Union dues</td><td>− '+J(union)+'</td></tr><tr><td><strong>Net pay (take-home)</strong></td><td><strong>'+J(net)+'</strong></td></tr></tbody>'}['#pbH','#pbR','#pbO','#pbS'].forEach(function(id){box.querySelector(id).addEventListener('input',draw)});var T=[{t:'With 40 hours at $600 and 5 overtime hours, what is the basic pay plus overtime pay? (Ignore commission.)',a:28500},{t:'What is the commission on $40,000 of sales at 5%?',a:2000},{t:'With the default settings, what is the gross pay?',a:30500}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.pbN').textContent='All done';box.querySelector('.pbQ').textContent='You completed every challenge!';box.querySelector('.pbC').disabled=true;return}box.querySelector('.pbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.pbQ').textContent=T[q].t}box.querySelector('.pbC').onclick=function(){var v=parseFloat(String(box.querySelector('.pbA').value).replace(/,/g,'')),fb=box.querySelector('.pbFb');if(Math.abs(v-T[q].a)<0.01){fb.className='fb ok pbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.pbA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no pbFb';fb.textContent='Not yet. Reset to 40 h, $600, 5 overtime hours and $40,000 sales, then read the payslip.'}};draw();task()}}]},
  {phase:'explain',name:'Teach: utility bills',title:'Learn: reading meters and calculating utility bills',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Present reading minus previous reading. Dat a wah yuh use.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Reading a meter',explain:'<p>Every home with electricity has a meter, usually on an outside wall. It counts how much electricity the household uses, in units called {{kWh|kilowatt-hours, the unit electricity is charged in}}. Water meters work the same way, counting litres or cubic metres.</p><p>Here is the key thing to understand: a meter is like a car’s odometer. It <strong>keeps counting up</strong> and never goes back to zero. So the number on the meter is the total since it was installed, not what you used this month.</p><p>To find this month’s usage, subtract: <strong>units used = present reading − previous reading</strong>. For Mrs. Clarke: 45,630 − 45,350 = 280 kWh. Her son was very wrong: the family used 280 units, not 45,630!</p>',visual:METER(45350,45630),
     example:{q:'A water meter read 1,284 cubic metres last month and 1,302 cubic metres this month. How much water was used?',steps:[{do:'Units used = present − previous.'},{do:'1,302 − 1,284 = 18 cubic metres.'}]},
     mistake:'Using the present reading as the amount used. Always subtract the previous reading first.',
     check:{q:'Previous reading 23,410, present 23,655. Units used?',o:['245','23,655','47,065'],a:0,why:'23,655 − 23,410 = 245.',hint:'Present − previous.'}},
    {title:'Calculating an electricity bill',explain:'<p>Once you know the units used, the bill follows the instructions on the rate card. Many electricity companies use <strong>tiered rates</strong>: the first block of units is charged at a lower rate, and any units above that at a higher rate. This helps families that use only a little.</p><p>Most bills also have a {{fixed charge|an amount paid every month however much you use}}, a customer charge you pay every month however little you use. And there may be a tax added at the end.</p><p>So work in order: units used; then the cost of each block of units; then add the fixed charge; then add any tax. Laying it out like a real bill, line by line, helps you avoid mistakes.</p>',
     example:{q:'Example rates: first 100 kWh at $30 each, then $45 per kWh after that, plus a fixed charge of $1,200. Mrs. Clarke used 280 kWh. Find her bill.',steps:[{do:'First 100 kWh: 100 × $30 = $3,000.'},{do:'The rest: 280 − 100 = 180 kWh × $45 = $8,100.',why:'Only the units ABOVE 100 are charged at the higher rate.'},{do:'Add the fixed charge: $3,000 + $8,100 + $1,200 = $12,300.'}]},
     mistake:'Charging every unit at the higher rate. In a tiered bill, only the units above the first block cost more.',
     check:{q:'Example: 150 kWh used; first 100 at $30, the rest at $45, fixed charge $1,000. Bill?',o:['$6,250','$7,750','$5,500'],a:0,why:'3,000 + 50 × 45 + 1,000 = 6,250.',hint:'Two blocks, then the fixed charge.'}},
    {title:'Following the instructions on any bill',explain:'<p>Water, gas and internet bills each have their own rules, but the method is always the same: <strong>read the instructions carefully, and follow them step by step</strong>.</p><p>A water bill might charge per 1,000 litres used, plus a sewerage charge that is a percentage of the water charge, plus a service charge. An internet bill might have a monthly plan price plus a charge for extra data.</p><p>A helpful habit is to write each line separately with a label, just like a real bill: “Water: $…”, “Sewerage: $…”, “Service charge: $…”, and then add them up. And if a tax such as GCT is added, check whether it applies to the whole bill or only part of it.</p>',
     example:{q:'Example water rates: $250 per cubic metre; sewerage charge 50% of the water charge; service charge $800. A home used 18 m³. Find the bill.',steps:[{do:'Water: 18 × $250 = $4,500.'},{do:'Sewerage: 50% of $4,500 = $2,250.'},{do:'Total: $4,500 + $2,250 + $800 = $7,550.'}]},
     mistake:'Taking a percentage of the wrong amount. Read whether the percentage is of the water charge or of the whole bill.',
     check:{q:'Internet: $5,000 plan plus $200 for each extra GB. 6 extra GB used. Bill?',o:['$6,200','$5,200','$30,200'],a:0,why:'5,000 + 6 × 200 = 6,200.',hint:'Plan price plus the extra.'}}]},{type:'recall',text:'The family used 280 kWh, not 45,630: the meter keeps counting, so subtract last month’s reading: 45,630 − 45,350 = 280.'}]},
  {phase:'explain',name:'Teach: wages and salaries',title:'Learn: wages, salaries, deductions and net pay',lead:'Next, how people are paid, and why take-home pay is less than what they earn.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Gross pay before dem tek out. Net pay a wah reach yuh pocket.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Wages, salaries, overtime, commission and bonuses',explain:'<p>People are paid in different ways. A {{wage|pay calculated by the hour or week}} is paid by the hour or week: the more hours you work, the more you earn. Farm workers, factory workers and shop assistants are often paid wages. A {{salary|a fixed yearly amount, usually paid monthly}} is a fixed amount for the year, usually paid in 12 monthly parts. Teachers and managers are often paid salaries.</p><p>Your {{basic pay|pay for the normal working hours}} is your pay for the normal hours, for example 40 hours a week. Hours beyond that are {{overtime|extra hours beyond the normal hours, often paid at a higher rate}}, often paid at <strong>time-and-a-half</strong> (1.5 times the normal rate) or <strong>double time</strong> (2 times).</p><p>Salespeople may also earn {{commission|a percentage of the value of sales}}: a percentage of what they sell. And many workers get a {{bonus|an extra payment, often for good performance}}, an extra payment, perhaps at Christmas or for good work.</p>',
     example:{q:'Kemar is paid $650 an hour for a 40-hour week, and time-and-a-half for overtime. One week he works 46 hours. Find his pay.',steps:[{do:'Basic pay: 40 × $650 = $26,000.'},{do:'Overtime rate: 1.5 × $650 = $975. Overtime: 6 hours × $975 = $5,850.'},{do:'Total: $26,000 + $5,850 = $31,850.'}]},
     mistake:'Paying overtime at the normal rate. Time-and-a-half means multiply the hourly rate by 1.5 first.',
     check:{q:'A salesperson earns 4% commission on $250,000 of sales. Commission?',o:['$10,000','$1,000','$100,000'],a:0,why:'0.04 × 250,000 = 10,000.',hint:'4% of the sales.'}},
    {title:'Gross pay, deductions and net pay',explain:'<p>Your {{gross pay|total pay before deductions}} is everything you earn before anything is taken out: basic pay + overtime + commission + bonuses. But that is not what reaches your bank account. Some money is <strong>deducted</strong> first.</p><p>{{Statutory deductions|deductions required by law}} are required by law. In Jamaica these include <strong>income tax</strong> (PAYE), <strong>NIS</strong> (National Insurance Scheme, which pays pensions), <strong>NHT</strong> (National Housing Trust, which helps people buy homes) and <strong>Education Tax</strong>. {{Non-statutory deductions|voluntary deductions such as union dues, savings or loan repayments}} are voluntary: union dues, savings plans, health insurance or loan repayments that you agreed to.</p><p>What is left is your {{net pay|take-home pay after all deductions}}, your take-home pay: <strong>net pay = gross pay − all deductions</strong>.</p>',
     example:{q:'Tia’s gross pay is $60,000 a month. Her deductions are: income tax $5,000, NIS $1,800, NHT $1,200, Education Tax $1,350 and a credit union savings of $2,000. Find her net pay, and say which deduction is non-statutory.',steps:[{do:'Total deductions: 5,000 + 1,800 + 1,200 + 1,350 + 2,000 = $11,350.'},{do:'Net pay = $60,000 − $11,350 = $48,650.'},{do:'The credit union savings is non-statutory (she chose it); the others are required by law.'}]},
     mistake:'Mixing up gross and net. Gross is BEFORE deductions; net is AFTER. Net is always the smaller one.',
     check:{q:'Which is a statutory deduction?',o:['NIS','Union dues','A loan repayment'],a:0,why:'NIS is required by law.',hint:'Required by law.'}},
    {title:'Tax allowance and taxable income',explain:'<p>Income tax is not charged on every dollar you earn. The government lets each person earn a certain amount tax-free. This tax-free amount is the {{tax allowance|the part of income that is not taxed}} (in Jamaica, it is often called the income-tax threshold).</p><p>Only the income <strong>above</strong> the allowance is taxed. This is called the {{taxable income|the income that tax is charged on: income above the tax allowance}}: <strong>taxable income = income − tax allowance</strong>. Then <strong>income tax = tax rate × taxable income</strong>.</p><p>This makes the system fairer: people who earn very little pay little or no income tax. The exact allowance and rates change from year to year, so a question will always tell you which ones to use. The numbers below are example rates.</p>',
     example:{q:'Example rates: tax allowance $30,000 a week; income tax 25% of taxable income. Andre’s gross pay is $42,000 a week. Find his income tax.',steps:[{do:'Taxable income = $42,000 − $30,000 = $12,000.',why:'Only income above the allowance is taxed.'},{do:'Income tax = 25% of $12,000 = $3,000.'},{do:'Notice: he pays $3,000, not 25% of the whole $42,000 ($10,500).'}]},
     mistake:'Taxing the whole income. Subtract the tax allowance first; only the rest is taxed.',
     check:{q:'Example: allowance $30,000, tax 25%, gross $38,000. Income tax?',o:['$2,000','$9,500','$8,000'],a:0,why:'(38,000 − 30,000) × 25% = 2,000.',hint:'Find the taxable income first.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. All rates are example rates.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Utility bills',text:'Units used = present − previous reading. Charge each block at its own rate, add the fixed charge, then add tax if told.'},{title:'Earnings',text:'Basic pay + overtime (× 1.5 for time-and-a-half) + commission (% of sales) + bonus = gross pay.'},{title:'Deductions',text:'Statutory (by law): income tax, NIS, NHT, Education Tax. Non-statutory (voluntary): union dues, savings, loans.'},{title:'Tax and net pay',text:'Taxable income = income − tax allowance. Income tax = rate × taxable income. Net pay = gross − all deductions.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Example rates: first 100 kWh at $30, then $45; fixed charge $1,200. Readings: 12,050 then 12,250. Find the bill.',steps:[{do:'Units: 12,250 − 12,050 = 200 kWh.'},{do:'100 × $30 = $3,000; 100 × $45 = $4,500.'},{do:'Bill: $3,000 + $4,500 + $1,200 = $8,700.'}]},
     {type:'fill',q:'Shanice earns $700 an hour for 40 hours, plus 4 hours of overtime at time-and-a-half.',steps:[{text:'Basic: 40 × $700 = $28,000.'},{text:'Overtime: 4 × $1,050 = $___',blank:true,a:4200,hint:'1.5 × 700 = 1,050.'},{text:'Gross: $32,200.'}],sol:'$4,200 overtime, so $32,200 gross.'},
     {type:'own',q:'Example rates: allowance $30,000; tax 25%. Gross pay $50,000. Income tax? ($)',a:5000,hint:'(50,000 − 30,000) × 0.25.',sol:'$5,000.',placeholder:'dollars'},
     {type:'own',q:'Gross pay $45,000. Deductions total $7,800. Net pay? ($)',a:37200,hint:'Gross − deductions.',sol:'$37,200.',placeholder:'dollars'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order. All rates are example rates.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
   patois:'Pick di challenge dem weh yuh like.',
   blocks:[{type:'board',star:true,need:4,activities:[
    {icon:'🗂️',title:'Statutory or not?',desc:'Sort each deduction.',level:'⭐ Warm-up',mins:4,block:{type:'sort',tip:'Required by law → statutory. Chosen by the worker → non-statutory.',bins:[{id:'s',label:'Statutory (required by law)'},{id:'n',label:'Non-statutory (voluntary)'}],items:[{label:'Income tax (PAYE)',bin:'s'},{label:'Union dues',bin:'n'},{label:'NIS',bin:'s'},{label:'Credit union savings',bin:'n'},{label:'NHT',bin:'s'},{label:'Loan repayment',bin:'n'},{label:'Education Tax',bin:'s'},{label:'Health insurance plan',bin:'n'}]}},
    {icon:'🃏',title:'Match the terms',desc:'Match each pay word to its meaning.',level:'⭐ Warm-up',mins:4,block:{type:'match',pairs:[['Gross pay','total pay before deductions'],['Net pay','take-home pay'],['Commission','a percentage of sales'],['Overtime','extra hours at a higher rate'],['Tax allowance','income that is not taxed'],['Salary','a fixed yearly amount']]}},
    {icon:'📏',title:'Order the pay',desc:'Work out each weekly pay, then order them.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Work out each person’s gross weekly pay, then tap from lowest to highest.',rounds:[[{label:'40 h at $600',v:24000,show:'$24,000'},{label:'40 h at $550 + 5 h overtime at time-and-a-half',v:26125,show:'$26,125'},{label:'Salary of $1,300,000 a year ÷ 52',v:25000,show:'$25,000'},{label:'Basic $18,000 + 5% commission on $200,000',v:28000,show:'$28,000'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Net pay is less than or equal to gross pay.',a:'always',why:'Deductions can only take money away.'},{s:'The meter reading is the number of units used this month.',a:'never',why:'You must subtract the previous reading (unless it was a brand-new meter starting at 0).'},{s:'A worker pays income tax on all of their income.',a:'never',why:'The tax allowance is not taxed.'},{s:'Overtime is paid at a higher rate than basic pay.',a:'sometimes',why:'Often (time-and-a-half or double), but it depends on the job and contract.'},{s:'A salesperson’s commission goes up when sales go up.',a:'always',why:'Commission is a percentage of sales.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Example: first 100 kWh at $30, rest at $45. 160 kWh used.',lines:['160 × $45 = $7,200'],wrong:0,reasons:['Only the 60 units above 100 cost $45; the first 100 cost $30','He should use $30 for all','He should add 160 and 45'],reason:0,fix:'$3,000 + $2,700 = $5,700 (plus any fixed charge).'},{who:'Tia',q:'$600/h, 3 h overtime at time-and-a-half. Overtime pay?',lines:['3 × $600 = $1,800'],wrong:0,reasons:['Time-and-a-half means $900 an hour: 3 × $900 = $2,700','It should be $600','It should be 3 × 1.5'],reason:0,fix:'$2,700.'},{who:'Andre',q:'Example: allowance $30,000; tax 25%. Gross $40,000. Tax?',lines:['25% of $40,000 = $10,000'],wrong:0,reasons:['Only the $10,000 above the allowance is taxed: 25% of $10,000 = $2,500','The tax should be $30,000','The tax should be 25% of $30,000'],reason:0,fix:'$2,500.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire bills and pay.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2),f=function(n){return'$'+n.toLocaleString('en-JM')};if(r===0){var p=R(10000,40000),u=R(100,400);return{q:'Previous reading '+p.toLocaleString('en-JM')+', present '+(p+u).toLocaleString('en-JM')+'. Units used?',o:[String(u),(p+u).toLocaleString('en-JM'),String(u+100)],a:0,why:'Present − previous.'}}if(r===1){var rt=R(5,9)*100,o=R(2,8);return{q:'Rate $'+rt+'/h. '+o+' h overtime at time-and-a-half. Overtime pay?',o:[f(o*rt*1.5),f(o*rt),f(o*rt*2)],a:0,why:o+' × '+f(rt*1.5)+'.'}}var g=R(35,60)*1000;return{q:'Example: allowance $30,000, tax 25%. Gross '+f(g)+'. Tax?',o:[f((g-30000)/4),f(g/4),f((g-30000)/4+1000)],a:0,why:'25% of '+f(g-30000)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Work backwards to fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Example rates: first 100 kWh at $30, rest at $45, fixed charge $1,200. How many kWh give a bill of exactly $9,600?',placeholder:'kWh',check:function(v){return+v===220?{ok:true,msg:'Yes! 3,000 + 120 × 45 + 1,200 = 9,600.'}:{ok:false,msg:'Take off the fixed charge and the first $3,000, then divide what is left by 45.'}}},{q:'A worker earns $800 an hour for 40 hours. How many overtime hours at time-and-a-half give a gross pay of $41,600?',placeholder:'hours',check:function(v){return+v===8?{ok:true,msg:'Correct! 32,000 + 8 × 1,200 = 41,600.'}:{ok:false,msg:'Basic pay is $32,000. Overtime rate is $1,200 an hour.'}}},{q:'Example: allowance $30,000, tax 25%. What gross pay gives exactly $4,000 of income tax?',placeholder:'dollars',check:function(v){return+String(v).replace(/[$,]/g,'')===46000?{ok:true,msg:'Yes! Taxable income $16,000 × 25% = $4,000.'}:{ok:false,msg:'Taxable income must be $4,000 ÷ 0.25. Then add the allowance.'}}}]}},
    {icon:'🌺',title:'Mission: the exotic flower business',desc:'Run the guide’s exotic-flower business.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'Your group runs an exotic-flower farm in the hills of St. Andrew, growing anthuriums and ginger lilies for sale locally and abroad, as the NSC project suggests. All rates are example rates.',parts:[{q:'The greenhouse meter read 8,420 kWh last month and 8,900 kWh this month. How many units were used?',a:480,hint:'Present − previous.',sol:'480 kWh.'},{q:'Example rates: first 100 kWh at $30, the rest at $45, plus a $1,200 fixed charge. What is the electricity bill?',a:21300,hint:'3,000 + 380 × 45 + 1,200.',sol:'$3,000 + $17,100 + $1,200 = $21,300.',placeholder:'dollars'},{q:'A farm worker earns $650 an hour for 40 hours, plus 6 hours of overtime at time-and-a-half. What is her gross pay?',a:31850,hint:'26,000 + 6 × 975.',sol:'$31,850.',placeholder:'dollars'},{q:'The sales manager earns a basic $25,000 a week plus 3% commission on $500,000 of export sales. What is his gross pay?',a:40000,hint:'3% of 500,000 = 15,000.',sol:'$40,000.',placeholder:'dollars'},{q:'Example: allowance $30,000, tax 25%. How much income tax does the sales manager pay that week?',a:2500,hint:'(40,000 − 30,000) × 0.25.',sol:'$2,500.',placeholder:'dollars'}],done:'You calculated a real utility bill, wages, commission and income tax for a business, just like the NSC project.'}}
