  {phase:'explain',name:'Teach: relations and functions',title:'Learn: relations, functions and their graphs',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Every input mus get one, an only one, output.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Relations: linking two sets',explain:'<p>Life is full of links. Each student is linked to a class. Each person is linked to a birthday. Each number is linked to its double. In maths, any rule that links items in one set to items in another is called a {{relation|a rule that links items in one set to items in another}}.</p><p>We can show a relation in a few ways. A {{mapping diagram|a picture of a relation with arrows from inputs to outputs}} has two ovals: the inputs on the left and the outputs on the right, with arrows joining them. Or we can list {{ordered pairs|an input and its output written together, such as (3, 7)}}, each input with its output in brackets: (Ava, 9A), (Brian, 9A), (Chen, 9B).</p><p>Ordered pairs are just like coordinates, so a relation can also be drawn as a graph, with the inputs along the x-axis and the outputs up the y-axis.</p>',visual:MAP(REL.cls[1],REL.cls[2],REL.cls[3],'Mapping diagram: students to their class',['Students','Classes']),
     example:{q:'The relation "is double" links {1, 2, 3} to {2, 4, 6}. Write it as ordered pairs.',steps:[{do:'1 is linked to 2, 2 to 4, and 3 to 6.'},{do:'Ordered pairs: (1, 2), (2, 4), (3, 6).',why:'Input first, then output.'}]},
     mistake:'Writing an ordered pair the wrong way round. The input always comes first: (input, output).',
     check:{q:'In the ordered pair (Tia, 9C), which is the input?',o:['Tia','9C','Both'],a:0,why:'The input always comes first.',hint:'(input, output).'}},
    {title:'What makes a function',explain:'<p>A {{function|a relation where every input has exactly one output}} is a special kind of relation with one strict rule: <strong>every input has exactly one output</strong>. No input is left without an arrow, and no input has two arrows.</p><p>Functions come in two kinds. In a {{one-to-one|each input has its own output, and no outputs are shared}} function, every input has its own output, and no two inputs share one, like students and their ID numbers. In a {{many-to-one|different inputs can share the same output}} function, several inputs can share the same output, like students and their classes. That is still fine: each student is in exactly one class.</p><p>But a {{one-to-many|one input linked to more than one output}} relation is <strong>not</strong> a function, because one input has more than one output. “Each class → its students” is like this: ask “Who is in 9A?” and you get several answers.</p>',
     example:{q:'Is "each person → their mother" a function? What type?',steps:[{do:'Every person has exactly one (biological) mother, so each input has exactly one output: it is a function.'},{do:'Brothers and sisters share the same mother, so different inputs can share an output.'},{do:'It is a many-to-one function.'}]},
     mistake:'Thinking a many-to-one relation is not a function. Sharing outputs is allowed; only one input with MANY outputs breaks the rule.',
     check:{q:'"Each mother → her children" (for a mother with 3 children) is…',o:['one-to-many: not a function','many-to-one: a function','one-to-one: a function'],a:0,why:'One mother has several children: one input, many outputs.',hint:'How many arrows leave one input?'}},
    {title:'Graphs of functions: the vertical line test',explain:'<p>When a relation is drawn as a graph, there is a quick way to check whether it is a function: the {{vertical line test|if any vertical line crosses a graph more than once, it is not a function}}.</p><p>Imagine sliding a ruler, held straight up and down, across the graph from left to right. A vertical line is one particular x-value, one input. If the line ever crosses the graph <strong>more than once</strong>, that input has more than one output, so the graph is <strong>not a function</strong>.</p><p>A straight line (that is not vertical) and the U-shaped curve of y = x² pass the test: every vertical line crosses them only once. A circle fails the test, because most vertical lines cross it twice, once at the top and once at the bottom.</p>',visual:GRAPH('f'),
     example:{q:'Does the circle x² + y² = 25 represent a function?',steps:[{do:'Draw the vertical line x = 3.'},{do:'It crosses the circle at (3, 4) and at (3, −4): twice.'},{do:'So one input (3) has two outputs. The circle is NOT a function.'}]},
     mistake:'Using a horizontal line instead of a vertical one. The test uses VERTICAL lines, because each vertical line is one input.',
     check:{q:'A vertical line crosses a graph at two points. The graph is…',o:['not a function','a function','one-to-one'],a:0,why:'One input has two outputs.',hint:'Each vertical line is one input.'}}]}]},
  {phase:'explain',name:'Teach: notation, domain and range',title:'Learn: function notation, domain and range',lead:'Next, the special notation mathematicians use for functions, and the sets of inputs and outputs.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'f(3) mean put 3 inna di function.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Function notation and evaluating',explain:'<p>Instead of saying “the function that doubles a number and adds 1”, mathematicians give functions short names, usually a letter like f. There are three common ways to write the same function:</p><p><strong>f: x → 2x + 1</strong> (read “f maps x to 2x + 1”)<br><strong>f(x) = 2x + 1</strong> (read “f of x equals 2x + 1”)<br><strong>y = f(x)</strong>, with y = 2x + 1</p><p>Here is the important bit: <strong>f(x) does NOT mean f times x</strong>. It means “the output of f when the input is x”. So f(3) means “put 3 into the function”: f(3) = 2 × 3 + 1 = 7. Finding an output like this is called <strong>evaluating</strong> the function.</p><p>The guide gives a real example. A labourer paid $2,000 an hour earns W(t) = 2,000t. So W(8) = 2,000 × 8 = $16,000 for an 8-hour day.</p>',
     example:{q:'Given g(x) = x² − 3, find g(4) and g(−2).',steps:[{do:'g(4): replace every x with 4: 4² − 3 = 16 − 3 = 13.'},{do:'g(−2): replace x with −2: (−2)² − 3 = 4 − 3 = 1.',why:'Use brackets around negative numbers when squaring.'}]},
     mistake:'Reading f(3) as f × 3. It means the output when the input is 3.',
     check:{q:'f(x) = 5x − 2. What is f(4)?',o:['18','22','20'],a:0,why:'5 × 4 − 2 = 18.',hint:'Replace x with 4.'}},
    {title:'Domain and range',explain:'<p>Every function has two important sets. The {{domain|the set of all inputs}} is the set of all the inputs you are allowed to put in. The {{range|the set of all outputs}} is the set of all the outputs that come out.</p><p>Think of a vending machine. The domain is the buttons you can press; the range is the snacks that can come out. If you only press certain buttons, only certain snacks can appear.</p><p>To find the range from a given domain, evaluate the function for every input in the domain, then list the outputs (each only once). For f(x) = 2x + 1 on the domain {1, 2, 3, 4}: f(1) = 3, f(2) = 5, f(3) = 7, f(4) = 9. So the range is {3, 5, 7, 9}.</p>',visual:MAP([1,2,3,4],[3,5,7,9],[[1,3],[2,5],[3,7],[4,9]],'Mapping diagram for f(x) = 2x + 1'),
     example:{q:'Find the range of f(x) = x² on the domain {−2, −1, 0, 1, 2}.',steps:[{do:'f(−2) = 4, f(−1) = 1, f(0) = 0, f(1) = 1, f(2) = 4.'},{do:'List each output once: {0, 1, 4}.',why:'Repeated outputs are written only once in a set.'},{do:'Range = {0, 1, 4}. (It is many-to-one, because −2 and 2 share 4.)'}]},
     mistake:'Mixing up the domain and range. Domain = inputs (going in); range = outputs (coming out).',
     check:{q:'h(x) = x + 10, domain {0, 5, 10}. What is the range?',o:['{10, 15, 20}','{0, 5, 10}','{10}'],a:0,why:'0 + 10, 5 + 10, 10 + 10.',hint:'Evaluate each input.'}},
    {title:'Same formula, different domains',explain:'<p>Here is a subtle but important idea. Two functions can have exactly the same formula and still be <strong>different functions</strong>, if their domains are different.</p><p>Look at f(x) = x² on the domain {1, 2, 3}: the range is {1, 4, 9}, and it is one-to-one. Now take g(x) = x² on the domain {−3, −2, −1, 1, 2, 3}: the range is still {1, 4, 9}, but now it is many-to-one, because −3 and 3 both give 9. Same formula, but different behaviour!</p><p>Domains also matter in real life. The guide’s fuel example: a car that travels 8 km for every litre has D(g) = 8g. If its tank holds 40 litres, the sensible domain is 0 to 40 litres. Putting in g = 100 makes no sense, because the tank cannot hold it.</p>',
     example:{q:'W(t) = 2,000t gives a labourer’s pay for t hours. He works between 0 and 10 hours a day. What is the range of daily pay?',steps:[{do:'Domain: 0 to 10 hours.'},{do:'Smallest pay: W(0) = $0. Largest: W(10) = $20,000.'},{do:'Range: from $0 to $20,000.'}]},
     mistake:'Thinking that the same formula always gives the same function. The domain is part of the function.',
     check:{q:'f(x) = x² on domain {1, 2} and g(x) = x² on domain {−2, 2}. Which is one-to-one?',o:['f','g','both'],a:0,why:'In g, −2 and 2 both give 4.',hint:'Check whether any outputs are shared.'}}]}]},
