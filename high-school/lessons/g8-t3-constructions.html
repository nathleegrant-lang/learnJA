  {phase:'engage',name:'No protractor',title:'How do you make 30° without a protractor?',lead:'A carpenter in Linstead is building a roof frame. The plan says the roof must slope at exactly 30°, but he has lost his protractor. He only has a straight piece of wood and a pair of compasses made from a nail and string.',

  {phase:'engage',name:'Before we start',title:'Before we start: what you need to know',lead:'Answer these four questions. If you get one wrong, you will get a quick refresher right away.',

   blocks:[{type:'mcq',star:true,questions:[{q:'Half of 60° is…',o:['30°','120°','20°'],a:0,why:'60 ÷ 2 = 30.',teach:'To bisect means to cut in half: 60° ÷ 2 = 30°.'},{q:'Each angle of an equilateral triangle is…',o:['60°','90°','45°'],a:0,why:'180 ÷ 3 = 60.',teach:'The three equal angles of an equilateral triangle share 180°: 180 ÷ 3 = 60° each.'},{q:'What do compasses keep the same?',o:['The distance between the point and the pencil','The angle','The colour'],a:0,why:'That is why they draw circles.',teach:'Compasses keep a fixed distance between the point and the pencil, so they can draw circles and copy lengths.'},{q:'An angle of 90° is called…',o:['a right angle','an acute angle','a straight angle'],a:0,why:'A square corner.',teach:'A 90° angle is a right angle, like the corner of a page.'}]}]},

     init:function(box,api){var sel=box.querySelector('#ckK'),n=0;function draw(){var c=CK[sel.value];n=Math.max(0,Math.min(n,c.steps.length-1));box.querySelector('.ckSvg').innerHTML=DRAWK(sel.value,n);box.querySelector('.ckX').innerHTML='<strong>'+c.name+'</strong><br>Step '+(n+1)+' of '+c.steps.length+': '+c.steps[n][0];box.querySelector('.ckB').disabled=n===0;box.querySelector('.ckN').disabled=n===c.steps.length-1}box.querySelector('.ckN').onclick=function(){n++;draw()};box.querySelector('.ckB').onclick=function(){n--;draw()};sel.onchange=function(){n=0;draw()};var T=[{t:'Which angle do you construct first, and then bisect, to get 30°? (degrees)',ok:function(v){return parseFloat(v)===60}},{t:'Which angle do you bisect to get 45°? (degrees)',ok:function(v){return parseFloat(v)===90}},{t:'For triangle ABC (6 cm, 5 cm, 4 cm), what radius do you set the compasses to for the arc from B? (cm)',ok:function(v){return parseFloat(v)===4}}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ckTN').textContent='All done';box.querySelector('.ckQ').textContent='You completed every challenge!';box.querySelector('.ckC').disabled=true;return}box.querySelector('.ckTN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ckQ').textContent=T[q].t}box.querySelector('.ckC').onclick=function(){var v=String(box.querySelector('.ckA').value).replace(/[°cm\s]/g,''),fb=box.querySelector('.ckFb');if(T[q].ok(v)){fb.className='fb ok ckFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ckA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no ckFb';fb.textContent='Not yet. Step through that construction and read each step.'}};draw();task()}},
    {type:'recall',text:'Yes! He can construct 60° with two equal arcs (an equilateral triangle), then bisect it to get exactly 30°. No protractor needed.'}]},
  {phase:'explain',name:'Teach: angles',title:'Learn: bisecting and constructing angles',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Two special angle, 60 an 90, mek all di rest.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Bisecting an angle',explain:'<p>To {{bisect|cut into two equal parts}} an angle means to cut it into two exactly equal parts. The line that does this is called the {{angle bisector|a line that cuts an angle into two equal angles}}.</p><p>Here is how. Put the compass point on the corner of the angle, A, and draw an {{arc|part of a circle drawn with compasses}} that cuts both arms; call the points P and Q. Then, from P and from Q, draw two arcs of the same width that cross inside the angle at R. Join A to R.</p><p>Why does this work? A is the same distance from P and Q (the first arc), and R is the same distance from P and Q (the equal arcs). That makes two identical triangles, APR and AQR, so the two angles at A must be equal.</p>',visual:DRAWK('bis',3),
     example:{q:'An angle of 110° is bisected. What size is each new angle?',steps:[{do:'Bisecting cuts it into two equal parts.'},{do:'110° ÷ 2 = 55°.'},{do:'You can check each half with a protractor after constructing.'}]},
     mistake:'Using different widths for the arcs from P and Q. They must be the same width, or the line will not cut the angle exactly in half.',
     check:{q:'Bisecting an angle of 80° gives two angles of…',o:['40°','80°','160°'],a:0,why:'80 ÷ 2 = 40.',hint:'Half of the angle.'}},
    {title:'Constructing 60° and 30°',explain:'<p>The 60° angle comes from a beautiful idea. Draw a line and mark A. With the compass point on A, draw a long arc that cuts the line at P. Now, <strong>without changing the width</strong>, put the point on P and draw an arc that crosses the first one at C. Join A to C.</p><p>Why is it 60°? AP and AC are both the compass width, and so is PC. So triangle APC has three equal sides: it is an {{equilateral triangle|three equal sides and three 60° angles}}, and every angle in it is 60°.</p><p>Once you have 60°, you can make <strong>30°</strong> by bisecting it. That is how the carpenter gets his roof slope!</p>',visual:DRAWK('s30',2),
     example:{q:'How could you construct a 120° angle?',steps:[{do:'Construct 60° at A, giving point C on the arc.'},{do:'Keep the same width. From C, step around the arc again to a new point D.',why:'Each step around the arc adds another 60°.'},{do:'Join A to D: angle DAP is 60° + 60° = 120°.'}]},
     mistake:'Changing the compass width between the two arcs for 60°. The triangle must have three equal sides.',
     check:{q:'Why is the angle in the 60° construction exactly 60°?',o:['It is part of an equilateral triangle','Because the arcs are curved','Because the line is horizontal'],a:0,why:'All three sides are the compass width.',hint:'Three equal sides.'}},
    {title:'Constructing 90° and 45°',explain:'<p>A <strong>90°</strong> angle is a right angle, and you already know the construction from Grade 7: it is the {{perpendicular|at right angles to a line}}. To make 90° at a point A on a line: draw arcs from A that cut the line on both sides, at P and Q. Then open the compasses wider and draw arcs from P and Q that cross above A at R. Join A to R.</p><p>Why does it work? R is the same distance from P and Q, and so is A. So AR is the perpendicular bisector of PQ, which meets PQ at 90°.</p><p>And <strong>45°</strong> is half of 90°, so you bisect the right angle. Bisecting again would give 22.5°. Combining angles gives even more: 90° + 45° = 135°, and 90° + 60° = 150°.</p>',visual:DRAWK('s45',3),
     example:{q:'List the steps to construct a 45° angle at a point A on a line.',steps:[{do:'Construct 90° at A.'},{do:'Draw an arc from A cutting both arms of the right angle.'},{do:'From those two points, draw equal arcs that cross. Join A to the crossing point: that is 45°.'}]},
     mistake:'Opening the compasses too little for the arcs from P and Q. They must be wide enough to cross; make them wider than half of PQ.',
     check:{q:'How do you get 135°?',o:['90° + 45°','60° + 60°','Bisect 90°'],a:0,why:'90 + 45 = 135.',hint:'Combine two angles you can construct.'}}]}]},
  {phase:'explain',name:'Teach: triangles',title:'Learn: constructing triangles',lead:'Next, putting your constructions together to build accurate triangles.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Sketch first. Draw di longest side first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'A triangle from three sides',explain:'<p>If you know all three sides of a triangle, you can construct it exactly, using only a ruler and compasses.</p><p>Start with a quick <strong>rough sketch</strong>, labelled with the lengths, so you know what you are aiming for. Then draw the <strong>longest side</strong> first with a ruler; it gives the most room. Set your compasses to the second length and draw an arc from one end. Set them to the third length and draw an arc from the other end. Where the two arcs cross is the third corner. Join it up.</p><p>Why does this work? The third corner must be the right distance from BOTH ends at the same time. The first arc is every point the right distance from A; the second arc is every point the right distance from B. Only where they cross does both happen.</p>',visual:DRAWK('sss',3),
     example:{q:'Construct triangle PQR with PQ = 7 cm, PR = 5 cm and QR = 6 cm.',steps:[{do:'Sketch first. Draw the longest side, PQ = 7 cm.'},{do:'Compasses at 5 cm: arc from P. Compasses at 6 cm: arc from Q.'},{do:'The arcs cross at R. Join PR and QR.'}]},
     mistake:'Putting the arcs on the wrong ends. The 5 cm arc goes from P (because PR = 5), and the 6 cm arc from Q.',
     check:{q:'Can you construct a triangle with sides 2 cm, 3 cm and 8 cm?',o:['No: the arcs will not meet','Yes, easily','Only with a protractor'],a:0,why:'2 + 3 is less than 8, so the two short sides cannot reach each other.',hint:'Can the two shorter sides reach?'}},
    {title:'Triangles from sides and angles',explain:'<p>Sometimes you are given angles as well as sides. Then you use your angle constructions.</p><p><strong>Two sides and the angle between them</strong> (the {{included angle|the angle between two given sides}}): draw the first side, AB. Construct the angle at A. Measure the second side along the new arm with compasses to get C. Join BC.</p><p><strong>Two angles and the side between them</strong>: draw the side AB. Construct one angle at A and the other at B. Extend both arms until they cross: that is C.</p><p>In every case, a sketch first helps you decide which side to draw and where each angle goes. Make sure the angles you need are ones you can construct: 90°, 60°, 45°, 30°, or combinations of them.</p>',
     example:{q:'Construct triangle ABC with AB = 6 cm, angle A = 60° and AC = 4 cm.',steps:[{do:'Draw AB = 6 cm.'},{do:'Construct 60° at A.',why:'60° is made with two equal arcs.'},{do:'Mark C on the 60° arm, 4 cm from A, with compasses. Join BC.'}]},
     mistake:'Constructing the angle at the wrong end of the side. Read the question carefully: angle A goes at A.',
     check:{q:'Triangle with AB = 7 cm, angle A = 45°, angle B = 90°. What do you construct at B?',o:['90°','45°','60°'],a:0,why:'Angle B = 90°.',hint:'Read which angle belongs where.'}},
    {title:'Designing with constructions',explain:'<p>Constructions are not just for exercises; architects, carpenters and engineers use them to design real things. The guide suggests designing the <strong>front view of a house</strong> using only constructed angles.</p><p>Think about it. The walls meet the ground at <strong>90°</strong>. A roof might slope at <strong>30°</strong> (a gentle roof) or <strong>45°</strong> (a steep roof that sheds heavy rain quickly). A decorative triangular window might use <strong>60°</strong> angles, making an equilateral triangle.</p><p>Plan your design with a rough sketch first, label every angle and length, then construct it accurately. Keep all your construction arcs: they show how you made each angle.</p>',visual:HOUSE8,
     example:{q:'A roof is an isosceles triangle on top of a house 8 m wide, with base angles of 30°. What is the angle at the top of the roof?',steps:[{do:'The angles of a triangle add up to 180°.'},{do:'Two base angles of 30° make 60°.'},{do:'Top angle = 180° − 60° = 120°.'}]},
     mistake:'Forgetting that the angles of the roof triangle must add up to 180°. Check your design adds up.',
     check:{q:'A roof triangle has base angles of 45°. What is the top angle?',o:['90°','45°','135°'],a:0,why:'180 − 90 = 90.',hint:'Angles in a triangle add up to 180°.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Use your instruments.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Do the "You do" constructions on paper, then answer the check question.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Bisecting',text:'Arc from the corner cutting both arms; equal arcs from those points; join the corner to the crossing.'},{title:'60° and 30°',text:'60°: two arcs of the SAME width (an equilateral triangle). 30°: bisect 60°. 120°: step around the arc twice.'},{title:'90° and 45°',text:'90°: the perpendicular at a point. 45°: bisect 90°. Combine: 135° = 90° + 45°; 150° = 90° + 60°.'},{title:'Triangles',text:'Sketch first; draw the longest (or given) side first; use arcs for sides and constructed angles; keep all arcs.'}]},
