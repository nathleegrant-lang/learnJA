  {phase:'explain',name:'Teach: the four transformations',title:'Learn: translations, reflections, rotations and enlargements',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Slide, flip, turn, resize.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Translations as vectors',explain:'<p>A {{translation|a slide, described by a column vector}} slides every point the same distance in the same direction, without turning or flipping. CSEC represents it with a <strong>column vector</strong> (x; y): the top number is across (+ right, − left), the bottom is up or down (+ up, − down).</p><p>To find the image, <strong>add</strong> the vector to each point: translating (3, 1) by (2; −3) gives (5, −2).</p><p>The syllabus also asks you to find an <strong>object given its image</strong>. Work backwards: <strong>subtract</strong> the vector. If an image is at (5, −2) after a translation by (2; −3), the object was at (3, 1).</p>',
     example:{q:'Triangle P has an image at (4, 1), (6, 1), (4, 5) after a translation by (−3; 2). Find the object.',steps:[{do:'Subtract the vector from each image point.'},{do:'(4 + 3, 1 − 2) = (7, −1); (6 + 3, 1 − 2) = (9, −1); (4 + 3, 5 − 2) = (7, 3).'},{do:'The object is (7, −1), (9, −1), (7, 3).'}]},
     mistake:'Adding the vector when finding the OBJECT from the image. Work backwards: subtract.',
     check:{q:'Translate (−2, 5) by (4; −1).',o:['(2, 4)','(−6, 6)','(2, 6)'],a:0,why:'(−2 + 4, 5 − 1).',hint:'Add the vector.'}},
    {title:'Reflections and rotations',explain:'<p>A {{reflection|a flip in a mirror line}} flips a shape in a mirror line: every point ends up the same distance on the other side. Rules for common lines: x-axis (x, y) → (x, −y); y-axis (x, y) → (−x, y); y = x (x, y) → (y, x); y = −x (x, y) → (−y, −x). For other lines, count squares perpendicular to the mirror line.</p><p>A {{rotation|a turn about a centre, through an angle, in a direction}} turns a shape about a <strong>centre</strong>, through an <strong>angle</strong>, in a <strong>direction</strong>. About the origin:</p><p>• 90° anticlockwise: (x, y) → (−y, x)<br>• 90° clockwise: (x, y) → (y, −x)<br>• 180° (either way): (x, y) → (−x, −y)</p><p>For other centres, use tracing paper: trace the shape, put a pencil point on the centre, and turn the paper.</p>',
     example:{q:'Rotate B(3, 1) through 90° clockwise about the origin.',steps:[{do:'Rule: (x, y) → (y, −x).'},{do:'(3, 1) → (1, −3).'},{do:'Check with tracing paper: a quarter turn clockwise moves B from the first quadrant to the fourth ✓'}]},
     mistake:'Mixing up the clockwise and anticlockwise rules. Check with a sketch or tracing paper.',
     check:{q:'Rotate (2, 5) through 180° about the origin.',o:['(−2, −5)','(5, 2)','(−5, 2)'],a:0,why:'Both coordinates change sign.',hint:'(−x, −y).'}},
    {title:'Enlargements, including fractional scale factors',explain:'<p>An {{enlargement|a change of size from a centre, by a scale factor k}} changes the size of a shape from a <strong>centre</strong> by a <strong>scale factor k</strong>. From the origin, multiply both coordinates by k: (x, y) → (kx, ky).</p><p>The syllabus includes scale factors with |k| > 1 (the image is bigger) and 0 < |k| < 1 (the image is <strong>smaller</strong>, but it is still called an enlargement). With k = ½, C(1, 2) goes to (0.5, 1), and every side is halved.</p><p>If k is negative, the image is on the opposite side of the centre and upside down: with k = −2, (1, 2) → (−2, −4). The angles stay the same, so the image is always similar to the object.</p>',
     example:{q:'Enlarge the triangle (4, 2), (6, 2), (4, 8) by scale factor ½, centre O.',steps:[{do:'Multiply each coordinate by ½.'},{do:'Image: (2, 1), (3, 1), (2, 4).'},{do:'Each side is half as long, and the area is ¼ as big (k² = ¼).'}]},
     mistake:'Thinking a scale factor less than 1 is not an enlargement. In maths it is still an enlargement, just a reduction in size.',
     check:{q:'Enlarge (6, −4) by scale factor ½, centre O.',o:['(3, −2)','(12, −8)','(6.5, −3.5)'],a:0,why:'Halve both.',hint:'Multiply by ½.'}}]}]},
  {phase:'explain',name:'Teach: relationships, descriptions and combinations',title:'Learn: object–image relationships, describing and combining transformations',lead:'Next, comparing objects with images, describing a transformation fully, and doing two in a row.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Do di FIRST one first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Orientation, congruency and similarity',explain:'<p>The syllabus asks you to state the relationship between an object and its image.</p><p>• <strong>Translations, reflections and rotations</strong> keep the size and shape: the image is {{congruent|same shape and size}} to the object.<br>• <strong>Enlargements</strong> keep the shape but change the size: the image is {{similar|same shape, different size}} (unless k = ±1).</p><p>{{Orientation|the way a shape faces}} is the way a shape faces. If the object’s vertices A, B, C go anticlockwise, a translation, rotation or enlargement keeps them anticlockwise. Only a <strong>reflection reverses</strong> orientation: A′, B′, C′ go clockwise.</p><p>Some points may not move at all: {{invariant points|points that do not move}}. For a reflection, every point on the mirror line is invariant; for a rotation, the centre is invariant.</p>',
     example:{q:'State the relationship between an object and its image after a reflection in y = x.',steps:[{do:'Size and shape unchanged: congruent.'},{do:'Orientation: reversed (a reflection flips it).'},{do:'Invariant points: every point on the line y = x.'}]},
     mistake:'Thinking a rotation reverses orientation. Only REFLECTIONS reverse orientation.',
     check:{q:'Which transformation can produce an image that is similar but NOT congruent?',o:['Enlargement','Rotation','Translation'],a:0,why:'It changes the size.',hint:'Size changes.'}},
    {title:'Describing a transformation fully',explain:'<p>When CSEC asks you to “describe fully” a single transformation, you must give its name <strong>and every detail</strong>:</p><p>• <strong>Translation</strong>: the vector, such as (2; −3).<br>• <strong>Reflection</strong>: the mirror line, such as y = x.<br>• <strong>Rotation</strong>: the centre, the angle, and the direction, such as “90° anticlockwise about (0, 0)”.<br>• <strong>Enlargement</strong>: the centre and the scale factor, such as “scale factor ½, centre (0, 0)”.</p><p>To find these from a diagram: for a translation, find the vector from any point to its image; for a reflection, find the line halfway between matching points; for a rotation, use tracing paper or the coordinate rules; for an enlargement, join matching points and extend the lines to find the centre, and compare side lengths for k.</p>',
     example:{q:'A(1, 1) maps to (−1, 1), B(3, 1) maps to (−1, 3), and C(1, 2) maps to (−2, 1). Describe the transformation fully.',steps:[{do:'Compare with the rules: (x, y) → (−y, x).'},{do:'That is the rule for a rotation of 90° anticlockwise about the origin.'},{do:'Answer: a rotation through 90° anticlockwise about (0, 0).'}]},
     mistake:'Writing only "rotation". Without the centre, angle and direction, you lose marks.',
     check:{q:'Which description of a reflection is complete?',o:['A reflection in the line y = −x','A reflection','A flip to the left'],a:0,why:'It names the mirror line.',hint:'Give the line.'}},
    {title:'Combinations of two transformations',explain:'<p>The syllabus asks you to find the image under a <strong>combination</strong> of two transformations. Do them <strong>in order</strong>: apply the first transformation to the object to get an image, then apply the second transformation to that image.</p><p>CSEC often writes combinations with letters. For example, if M is a reflection and R is a rotation, “MR” usually means <strong>R first, then M</strong> (like composite functions: the one next to the object acts first). Read the question carefully.</p><p>The order usually matters. Translate B(3, 1) by (2; −3) to get (5, −2), then reflect in the x-axis to get (5, 2). Reflecting first gives (3, −1), then translating gives (5, −4): a different point.</p>',visual:GT([OB,OB.map(TR.tv[1]),OB.map(TR.tv[1]).map(TR.rx[1])],'Triangle ABC translated by (2, −3), then reflected in the x-axis'),
     example:{q:'Reflect C(1, 2) in the y-axis, then rotate the image 180° about the origin. Find the final image.',steps:[{do:'Reflection in the y-axis: (1, 2) → (−1, 2).'},{do:'Rotation 180°: (−1, 2) → (1, −2).'},{do:'Final image: (1, −2). (This equals a single reflection in the x-axis.)'}]},
     mistake:'Applying both transformations to the original object. The second acts on the FIRST IMAGE.',
     check:{q:'Translate (1, 1) by (3; 0), then reflect in the y-axis. Final image?',o:['(−4, 1)','(2, 1)','(4, −1)'],a:0,why:'(4, 1), then x changes sign.',hint:'Do them in order.'}}]}]},
