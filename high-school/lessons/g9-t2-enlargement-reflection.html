').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.tlQ').textContent=T[q].t}box.querySelector('.tlC').onclick=function(){var p=parse(box.querySelector('.tlA').value),fb=box.querySelector('.tlFb');if(!p){fb.className='fb no tlFb';fb.textContent='Type coordinates like (2, −3).';return}if(p[0]===T[q].a[0]&&p[1]===T[q].a[1]){fb.className='fb ok tlFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.tlA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no tlFb';fb.textContent='Not yet. Choose that transformation and read the image coordinates.'}};draw();task()}},
    {type:'recall',text:'The angle stays 50°. An enlargement makes every length bigger, but the shape stays the same, so the angles never change.'}]},
  {phase:'explain',name:'Teach: enlargement',title:'Learn: enlargement',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Bigger size, same shape, same angle.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What an enlargement does',explain:'<p>When you zoom in on a photo, or a projector throws a picture onto a screen, the picture gets bigger but keeps exactly the same shape. That is an {{enlargement|a transformation that changes the size of a shape but keeps its shape}}.</p><p>An enlargement is measured from a fixed point called the {{centre of enlargement|the fixed point the enlargement is measured from}}, a bit like the bulb in a projector. The {{scale factor|how many times bigger the image is}}, k, tells you how many times bigger the image is.</p><p>Here are the relationships between an object and its image, the ones the guide asks you to state:</p><p>• Each image point lies on the straight line from the centre through the object point.<br>• Each image point is <strong>k times as far</strong> from the centre as the object point.<br>• Every side of the image is <strong>k times as long</strong>, and parallel to the matching side of the object.<br>• All the <strong>angles stay the same</strong>, so the object and image are {{similar|the same shape, with equal angles and sides in the same ratio}}.</p>',visual:GRID9(OBJ9.map(function(p){return[2*p[0],2*p[1]]}),{rays:true,label:'Triangle ABC enlarged by scale factor 2 from the origin, with rays from the origin'}),
     example:{q:'A triangle with sides 3 cm, 4 cm and 5 cm, and a 90° angle, is enlarged by scale factor 2. Describe the image.',steps:[{do:'Every side is doubled: 6 cm, 8 cm and 10 cm.'},{do:'The angles do not change: there is still a 90° angle.'},{do:'The image is similar to the object, twice as big.'}]},
     mistake:'Thinking the angles change in an enlargement. Only the lengths change; the shape (and every angle) stays the same.',
     check:{q:'A shape is enlarged by scale factor 4. A side of 3 cm becomes…',o:['12 cm','7 cm','3 cm'],a:0,why:'3 × 4 = 12 cm.',hint:'Multiply by k.'}},
    {title:'Enlarging from the origin',explain:'<p>When the centre of enlargement is the origin, (0, 0), there is a very neat rule. Each point moves k times as far from the origin along the same line, and that is the same as multiplying both coordinates by k:</p><p><strong>(x, y) → (kx, ky)</strong></p><p>So with scale factor 2, the point (3, 1) goes to (6, 2). With scale factor 3, it goes to (9, 3).</p><p>To draw the enlargement, multiply the coordinates of every corner, plot the new points, and join them up in the same order. A good check: draw a line from the origin through each object corner; the image corner should lie on the same line.</p>',
     example:{q:'Enlarge the triangle P(1, 2), Q(3, 2), R(1, 4) by scale factor 2, centre (0, 0).',steps:[{do:'Multiply each coordinate by 2.'},{do:'P′ = (2, 4), Q′ = (6, 4), R′ = (2, 8).'},{do:'Check: PQ is 2 units long, and P′Q′ is 4 units long: twice as long ✓'}]},
     mistake:'Adding the scale factor to the coordinates: (1, 2) with k = 2 does NOT go to (3, 4). Multiply: (2, 4).',
     check:{q:'Enlarge (−2, 3) by scale factor 3, centre (0, 0).',o:['(−6, 9)','(1, 6)','(−6, 3)'],a:0,why:'Multiply both coordinates by 3.',hint:'(kx, ky).'}},
    {title:'Finding the centre and scale factor',explain:'<p>Sometimes you are given an object and its image, and you need to work out the enlargement. This is like being a detective, working backwards from the clues.</p><p><strong>The scale factor:</strong> compare a pair of matching sides. k = image side length ÷ object side length.</p><p><strong>The centre:</strong> remember that each image point lies on a straight line from the centre through its object point. So draw a line through each pair of matching points (A to A′, B to B′) and extend it. Where all the lines meet is the centre of enlargement.</p><p>If you have two lines crossing, you have found it. A third line is a good check: it should pass through the same point.</p>',
     example:{q:'A(1, 1) maps to A′(3, 3) and B(2, 1) maps to B′(6, 3). Find the scale factor and the centre.',steps:[{do:'AB is 1 unit long; A′B′ is 3 units long. So k = 3.'},{do:'The line through A and A′ passes through (0, 0). So does the line through B and B′.',why:'(1, 1) → (3, 3) and (2, 1) → (6, 3) are both × 3 from the origin.'},{do:'Centre: (0, 0). Scale factor: 3.'}]},
     mistake:'Finding the scale factor from the coordinates instead of the side lengths, when the centre is not the origin. Always compare matching lengths.',
     check:{q:'An object side is 4 cm, and the matching image side is 10 cm. Scale factor?',o:['2.5','6','14'],a:0,why:'10 ÷ 4 = 2.5.',hint:'Image ÷ object.'}}]}]},
  {phase:'explain',name:'Teach: reflection in any line',title:'Learn: reflection in any line',lead:'Next, reflections in lines other than the axes, and finding the mirror line.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Same distance pon di odda side a di mirror.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What every reflection does',explain:'<p>You met reflections in the x-axis and y-axis in Grade 8. Now we can reflect in <strong>any</strong> line. The same rule always applies: every point lands the <strong>same distance</strong> on the other side of the {{mirror line|the line a shape is reflected in}}, measured at a right angle to the line.</p><p>That gives some useful facts. The line joining a point to its image always crosses the mirror line at <strong>90°</strong>, and the mirror line cuts it exactly in half. In other words, the mirror line is the {{perpendicular bisector|a line that cuts a segment in half at a right angle}} of every object–image segment.</p><p>A point that is <strong>on</strong> the mirror line does not move at all; it is called an {{invariant point|a point that does not move under a transformation}}. And the image is always the same size and shape as the object, just flipped.</p>',
     example:{q:'A point is 3 units from a mirror line. Where is its image?',steps:[{do:'On the other side of the mirror line.'},{do:'Also 3 units away, measured at right angles to the line.'},{do:'The line joining the point and image is 6 units long and crosses the mirror line at 90°.'}]},
     mistake:'Measuring across a sloping mirror line horizontally. Always measure at right angles (perpendicular) to the mirror line.',
     check:{q:'Which points stay where they are in a reflection?',o:['Points on the mirror line','Points far from the line','No points'],a:0,why:'They are 0 distance from the line.',hint:'Invariant points.'}},
    {title:'Reflecting in vertical and horizontal lines',explain:'<p>A vertical mirror line has an equation like <strong>x = a</strong>, and a horizontal one has an equation like <strong>y = b</strong>.</p><p>When you reflect in a <strong>vertical</strong> line x = a, points move left and right, so only the x-coordinate changes; y stays the same. Count how far the point is from the line, then go the same distance on the other side.</p><p>When you reflect in a <strong>horizontal</strong> line y = b, points move up and down, so only the y-coordinate changes; x stays the same.</p><p>For example, reflect (2, 1) in x = −1. The point is 3 units to the right of the line (from −1 to 2). So the image is 3 units to the left of the line: x = −1 − 3 = −4. The image is (−4, 1).</p>',visual:GRID9(OBJ9.map(RF.xm1),{mirror:'xm1',label:'Triangle ABC reflected in the line x = −1'}),
     example:{q:'Reflect the point (4, 5) in the line y = 2.',steps:[{do:'y = 2 is horizontal, so only y changes.'},{do:'The point is 5 − 2 = 3 units above the line.'},{do:'The image is 3 units below the line: y = 2 − 3 = −1. Image: (4, −1).'}]},
     mistake:'Changing the wrong coordinate. A vertical line (x = a) changes only x; a horizontal line (y = b) changes only y.',
     check:{q:'Reflect (5, 3) in the line x = 2.',o:['(−1, 3)','(5, 1)','(−5, 3)'],a:0,why:'3 units right of x = 2, so 3 units left: x = −1.',hint:'Only x changes.'}},
    {title:'Reflecting in y = x and y = −x, and finding the mirror line',explain:'<p>The diagonal lines y = x and y = −x have lovely rules. Reflecting in <strong>y = x</strong> simply swaps the coordinates: <strong>(x, y) → (y, x)</strong>. Reflecting in <strong>y = −x</strong> swaps them and changes both signs: <strong>(x, y) → (−y, −x)</strong>. You saw both in the lab.</p><p>And if you are given an object and its image, you can find the mirror line. Join a point to its image, and find the <strong>midpoint</strong> of that segment. The mirror line passes through the midpoints, at right angles to the segments. Do this for two points and join the midpoints.</p><p>For example, if (1, 4) reflects to (5, 4), the midpoint is (3, 4), and the segment is horizontal, so the mirror line is the vertical line x = 3.</p>',visual:GRID9(OBJ9.map(RF.yx),{mirror:'yx',label:'Triangle ABC reflected in the line y = x'}),
     example:{q:'Reflect A(1, 1), B(2, 1), C(2, 2) in y = −x.',steps:[{do:'Rule: (x, y) → (−y, −x).'},{do:'A′ = (−1, −1), B′ = (−1, −2), C′ = (−2, −2).',why:'Swap the coordinates and change both signs.'}]},
     mistake:'Using the y = x rule for y = −x. For y = −x, you must change the signs as well as swap.',
     check:{q:'Reflect (3, −2) in the line y = x.',o:['(−2, 3)','(2, −3)','(−3, 2)'],a:0,why:'Swap the coordinates.',hint:'(x, y) → (y, x).'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Enlargement properties',text:'Image points lie on lines from the centre, k times as far. Lengths × k; sides parallel; angles unchanged (similar shapes).'},{title:'Enlarging from the origin',text:'(x, y) → (kx, ky). To find k: image length ÷ object length. To find the centre: join matching points and extend the lines.'},{title:'Vertical and horizontal mirrors',text:'x = a changes only x; y = b changes only y. Same distance on the other side.'},{title:'Diagonal mirrors',text:'y = x: (x, y) → (y, x). y = −x: (x, y) → (−y, −x). Mirror line: through the midpoints, at right angles.'}]},
