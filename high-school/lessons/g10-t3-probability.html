 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 3',unit:'Module 2: Statistics 1; Module 3: Statistics 2',strand:'Statistics',standard:'Modules 2 and 3, Statistics: demonstrate the ability to use concepts in statistics and probability to describe, model and solve real-world problems.',

     init:function(box,api){var E=box.querySelector('#ssE'),sim=null;Object.keys(EV).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=EV[k][0];E.appendChild(o)});function draw(){var k=E.value,f=EV[k][1],n=0;for(var i=1;i<=6;i++)for(var j=1;j<=6;j++)if(f(i,j))n++;box.querySelector('.ssSvg').innerHTML=GRID(k);box.querySelector('.ssOut').innerHTML='<strong>Theoretical:</strong> P('+EV[k][0]+') = '+n+'/36 = <strong>'+FRC(n,36)+'</strong> ≈ '+(n/36).toFixed(3)+(sim&&sim.k===k?'<br><strong>Experimental</strong> (600 simulated rolls): '+sim.h+'/600 ≈ '+(sim.h/600).toFixed(3)+'. Close to the theory, but not exactly equal.':'')}E.onchange=function(){sim=null;draw()};box.querySelector('.ssR').onclick=function(){var f=EV[E.value][1],h=0;for(var t=0;t<600;t++){var a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);if(f(a,b))h++}sim={k:E.value,h:h};draw()};function val(v){var m=String(v).replace(/\s/g,'').match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(v)}var Q=[{t:'What is P(the sum is 7)? (Type a fraction.)',a:1/6},{t:'What is P(a double)?',a:1/6},{t:'What is P(at least one 6)?',a:11/36}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.ssN').textContent='All done';box.querySelector('.ssQ').textContent='You completed every challenge!';box.querySelector('.ssC').disabled=true;return}box.querySelector('.ssN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ssQ').textContent=Q[q].t}box.querySelector('.ssC').onclick=function(){var v=val(box.querySelector('.ssIn').value),fb=box.querySelector('.ssFb');if(Math.abs(v-Q[q].a)<0.002){fb.className='fb ok ssFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.ssIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no ssFb';fb.textContent='Not yet. Highlight that event and count the cells out of 36.'}};draw();task()}},
    {type:'recall',text:'7 is the most likely total: 6 of the 36 outcomes give 7 ((1,6), (2,5), (3,4), (4,3), (5,2), (6,1)), but only 1 outcome gives 2 or 12.'}]},
  {phase:'explain',name:'Teach: sample spaces',title:'Learn: sample spaces and simple probability',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'List every outcome first. Den count.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Sample spaces for coins, dice and cards',explain:'<p>An {{experiment|an activity with uncertain results}} is anything with an uncertain result. Each possible result is an {{outcome|one possible result}}, and the set of <strong>all</strong> possible outcomes is the {{sample space|the set of all possible outcomes}}.</p><p>The syllabus names three classic experiments. Tossing a <strong>coin</strong>: {H, T}. Rolling a <strong>die</strong>: {1, 2, 3, 4, 5, 6}. Drawing from a standard <strong>pack of 52 cards</strong>: 4 suits (spades ♠ and clubs ♣ are black; hearts ♥ and diamonds ♦ are red), each with 13 cards: Ace, 2 to 10, Jack, Queen and King. There are 12 <strong>picture cards</strong> (J, Q, K in each suit) and 4 aces.</p><p>For two coins, list systematically: {HH, HT, TH, TT}. Notice HT and TH are different outcomes.</p>',visual:CARDS,
     example:{q:'List the sample space for tossing a coin and rolling a die together. How many outcomes?',steps:[{do:'With heads: H1, H2, H3, H4, H5, H6.'},{do:'With tails: T1, T2, T3, T4, T5, T6.'},{do:'12 outcomes (2 × 6).'}]},
     mistake:'Counting HT and TH as the same outcome. For two coins there are 4 outcomes, not 3.',
     check:{q:'How many outcomes are there when two coins are tossed?',o:['4','3','2'],a:0,why:'HH, HT, TH, TT.',hint:'List them all.'}},
    {title:'Simple probabilities',explain:'<p>When all the outcomes are equally likely, the {{theoretical probability|favourable outcomes ÷ total equally likely outcomes}} of an {{event|a set of outcomes}} is:</p><p><strong>P(event) = number of favourable outcomes ÷ total number of outcomes</strong></p><p>Probabilities go from 0 (impossible) to 1 (certain), and P(not A) = 1 − P(A).</p><p>With cards: P(a heart) = 13/52 = 1/4. P(a king) = 4/52 = 1/13. P(a red picture card) = 6/52 = 3/26 (J, Q, K of hearts and diamonds). P(not a king) = 1 − 1/13 = 12/13.</p>',
     example:{q:'A card is drawn from a pack of 52. Find P(a black ace) and P(a picture card).',steps:[{do:'Black aces: ace of spades and ace of clubs: 2. P = 2/52 = 1/26.'},{do:'Picture cards: J, Q, K × 4 suits = 12.'},{do:'P(picture card) = 12/52 = 3/13.'}]},
     mistake:'Forgetting that the ace is not a picture card. There are 12 picture cards, not 16.',
     check:{q:'P(drawing a diamond from a pack of 52)?',o:['1/4','1/13','1/52'],a:0,why:'13 diamonds out of 52.',hint:'13 of each suit.'}},
    {title:'Sample space tables for two events',explain:'<p>When an experiment has two parts, like rolling two dice, a <strong>sample space table</strong> (a grid) shows every combination. With two dice there are 6 × 6 = <strong>36</strong> equally likely outcomes, as in the explorer.</p><p>To find a probability, count the cells that match the event, and divide by 36. For example, the sum is 7 in 6 cells, so P(sum of 7) = 6/36 = 1/6. A double (1,1), (2,2) … (6,6) appears in 6 cells too.</p><p>That answers the opening question: totals are <strong>not</strong> equally likely. 7 can be made in 6 ways, but 2 (1 + 1) and 12 (6 + 6) in only one way each.</p>',visual:GRID('s7'),
     example:{q:'Two dice are rolled. Find P(the sum is greater than 8).',steps:[{do:'Sums of 9: 4 ways. 10: 3 ways. 11: 2 ways. 12: 1 way.'},{do:'Total: 4 + 3 + 2 + 1 = 10 cells.'},{do:'P = 10/36 = 5/18.'}]},
     mistake:'Using 12 as the total number of outcomes for two dice (thinking 6 + 6). It is 6 × 6 = 36.',
     check:{q:'Two dice: P(the sum is 2)?',o:['1/36','1/12','2/36'],a:0,why:'Only (1, 1).',hint:'How many cells?'}}]}]},
  {phase:'explain',name:'Teach: experiments and rules',title:'Learn: experimental probability, contingency tables, and the addition and multiplication rules',lead:'Next, probability from data, and combining events.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'"Or" wid exclusive: add. "And" wid independent: multiply.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Experimental versus theoretical probability',explain:'<p>Theoretical probability comes from <strong>reasoning</strong> about equally likely outcomes. {{Experimental probability|times the event happened ÷ number of trials}} comes from actually doing the experiment:</p><p><strong>Experimental probability = number of times the event happened ÷ number of trials</strong></p><p>In the explorer, 600 simulated rolls gave an experimental probability close to the theoretical one, but rarely exactly equal. The more trials, the closer they tend to get.</p><p>Experimental probability is essential when there is no way to reason it out, such as the chance that a bus is late, or that a seed germinates. You can also use it to predict: <strong>expected number = probability × number of trials</strong>.</p>',
     example:{q:'A drawing pin is dropped 200 times and lands point up 74 times. Find the experimental probability, and predict the number of times it lands point up in 500 drops.',steps:[{do:'Experimental P = 74/200 = 0.37.'},{do:'Prediction: 0.37 × 500.'},{do:'≈ 185 times.'}]},
     mistake:'Expecting experimental results to match theory exactly. Small differences are normal.',
     check:{q:'A coin lands heads 54 times in 100 tosses. Experimental P(heads)?',o:['0.54','0.5','54'],a:0,why:'54 ÷ 100.',hint:'Times ÷ trials.'}},
    {title:'Contingency tables',explain:'<p>The syllabus mentions {{contingency tables|two-way tables showing counts for two categories}}: two-way tables that count people or things by two categories at once. The row and column totals help you find many probabilities.</p><p>For “P(a randomly chosen student is a girl who plays sport)”, use the cell where the “girls” row meets the “plays sport” column, divided by the grand total.</p><p>Read carefully when the question limits the group. “Given that the student is a boy, find P(plays sport)” means only look at the boys’ row: divide by the number of boys, not by everyone.</p>',visual:CT,
     example:{q:'Using the table, find (a) P(girl who plays sport) and (b) P(plays sport, given the student is a boy).',steps:[{do:'(a) Girls who play sport: 12 out of 50. P = 12/50 = 6/25.'},{do:'(b) Only the boys: 18 out of 25 play sport.'},{do:'P = 18/25.'}]},
     mistake:'Dividing by the grand total when the question restricts the group ("given that…"). Divide by that group’s total.',
     check:{q:'Using the table, P(a randomly chosen student plays no sport)?',o:['2/5','7/25','13/50'],a:0,why:'20 out of 50.',hint:'Column total ÷ grand total.'}},
    {title:'The addition and multiplication rules',explain:'<p>Two events are {{mutually exclusive|events that cannot happen at the same time}} if they cannot happen at the same time, like rolling a 2 and rolling a 5 on one die. For mutually exclusive events, the <strong>addition rule</strong> says:</p><p><strong>P(A or B) = P(A) + P(B)</strong></p><p>Two events are {{independent|one does not affect the probability of the other}} if one does not affect the other, like tossing a coin and rolling a die, or two separate rolls. For independent events, the <strong>multiplication rule</strong> says:</p><p><strong>P(A and B) = P(A) × P(B)</strong></p><p>A quick guide: “<strong>or</strong>” with mutually exclusive events → <strong>add</strong>; “<strong>and</strong>” with independent events → <strong>multiply</strong>. Check the conditions first: you cannot just add the probabilities of a heart and a king, because the king of hearts is both!</p>',
     example:{q:'(a) One die: P(2 or 5)? (b) A coin and a die: P(heads and a 6)?',steps:[{do:'(a) Mutually exclusive: 1/6 + 1/6 = 2/6 = 1/3.'},{do:'(b) Independent: 1/2 × 1/6.'},{do:'= 1/12. (It matches the 12-outcome sample space: only H6.)'}]},
     mistake:'Adding when you should multiply. P(heads AND a 6) is 1/12, not 1/2 + 1/6.',
     check:{q:'Two separate rolls of a die. P(a 6 both times)?',o:['1/36','1/3','2/6'],a:0,why:'1/6 × 1/6.',hint:'Independent: multiply.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Give fractions in their simplest form.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],

  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',

    {icon:'📏',title:'Order the dice totals',desc:'Order totals from least to most likely with two dice.',level:'⭐⭐ Skill builder',mins:5,block:{type:'order',prompt:'Two dice are rolled. Tap from the least likely total to the most likely.',rounds:[[{label:'Total 12',v:1,show:'1/36'},{label:'Total 10',v:3,show:'3/36'},{label:'Total 5',v:4,show:'4/36'},{label:'Total 8',v:5,show:'5/36'},{label:'Total 7',v:6,show:'6/36'}]]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Experimental probability equals theoretical probability.',a:'sometimes',why:'They are usually close, but rarely exactly equal.'},{s:'A probability is between 0 and 1 inclusive.',a:'always',why:'From impossible to certain.'},{s:'P(A or B) = P(A) + P(B).',a:'sometimes',why:'Only when A and B are mutually exclusive.'},{s:'Two dice give 12 equally likely outcomes.',a:'never',why:'There are 36.'},{s:'P(A and B) = P(A) × P(B) for independent events.',a:'always',why:'That is the multiplication rule.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Two dice: P(sum of 7)?',lines:['There are 11 possible totals (2 to 12)','So P(7) = 1/11'],wrong:0,reasons:['The totals are not equally likely; use the 36 outcomes: 6/36 = 1/6','P(7) = 7/12','P(7) = 1/12'],reason:0,fix:'1/6.'},{who:'Tia',q:'P(a heart or a king) from 52 cards.',lines:['13/52 + 4/52 = 17/52'],wrong:0,reasons:['They are not mutually exclusive: the king of hearts is counted twice. It is 16/52','It should be 13/52 × 4/52','It should be 4/52'],reason:0,fix:'16/52 = 4/13.'},{who:'Omar',q:'A coin and a die: P(heads and a 6)?',lines:['1/2 + 1/6 = 4/6'],wrong:0,reasons:['For "and" with independent events, MULTIPLY: 1/12','It should be 1/6','It should be 1/2'],reason:0,fix:'1/12.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire probability.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var t=R(2,12),n=6-Math.abs(7-t);return{q:'Two dice: P(total '+t+')?',o:[FRC(n,36),FRC(1,11),FRC(t,36)===FRC(n,36)?FRC(n+1,36):FRC(t,36)],a:0,why:n+' of 36 cells.'}}if(r===1){var C=[['a spade',13],['an ace',4],['a red card',26],['a picture card',12],['a black king',2]],c=C[R(0,4)];return{q:'From 52 cards: P('+c[0]+')?',o:[FRC(c[1],52),FRC(c[1]+1,52),'1/'+c[1]],a:0,why:c[1]+' of 52.'}}var p=[2,3,4,5][R(0,3)],q=[2,3,6][R(0,2)];return{q:'Independent: P(A) = 1/'+p+', P(B) = 1/'+q+'. P(A and B)?',o:['1/'+(p*q),FRC(p+q,p*q),'1/'+(p+q)],a:0,why:'Multiply.'}}}},

    {icon:'🎲',title:'Mission: the school fair',desc:'Design fair games for a school fair.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A school in Ocho Rios runs games at its fair to raise money. Each game costs $100 to play. Type fractions in simplest form, or decimals.',parts:[{q:'Game 1: roll two dice; win if the total is 11 or 12. What is P(win)? (Type a fraction.)',a:['1/12','3/36'],hint:'2 ways for 11, 1 way for 12.',sol:'3/36 = 1/12.'},{q:'If 120 people play Game 1, about how many win?',a:10,hint:'1/12 × 120.',sol:'About 10.'},{q:'Game 2: draw a card; win with a picture card. What is P(win)? (Type a fraction.)',a:['3/13','12/52'],hint:'12 picture cards.',sol:'12/52 = 3/13.'},{q:'Game 3: toss a coin AND roll a die; win with heads and a number greater than 4. What is P(win)? (Type a fraction.)',a:['1/6','2/12'],hint:'1/2 × 2/6.',sol:'1/2 × 1/3 = 1/6.'},{q:'In a trial run of Game 3, 13 of 60 players won. What was the experimental probability, to 2 decimal places?',a:0.22,tol:0.006,hint:'13 ÷ 60.',sol:'≈ 0.22, close to 1/6 ≈ 0.17.'}],done:'You used sample spaces, card probabilities, the multiplication rule, expected numbers and experimental probability to design real fair games.'}}
