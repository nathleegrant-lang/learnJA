var PW=function(a,n,lbl){var W=360,H=280,xmin=-4,xmax=4,ymin=-8,ymax=8,X=function(x){return 20+(x-xmin)/(xmax-xmin)*(W-30)},Y=function(y){return 10+(ymax-y)/(ymax-ymin)*(H-20)},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Graph of y = '+a+'x to the power '+n)+'"><defs><clipPath id="pwc"><rect x="'+X(xmin)+'" y="'+Y(ymax)+'" width="'+(X(xmax)-X(xmin))+'" height="'+(Y(ymin)-Y(ymax))+'"/></clipPath></defs><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/>';for(var i=xmin;i<=xmax;i++){s+='<line x1="'+X(i)+'" y1="'+Y(ymin)+'" x2="'+X(i)+'" y2="'+Y(ymax)+'" stroke="#eee8f8"/>';if(i)s+='<text x="'+X(i)+'" y="'+(Y(0)+13)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+fn(i)+'</text>'}s+='<line x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" stroke="#3d2a73" stroke-width="2"/>';var seg=function(x0,x1){var p=[];for(var x=x0;x<=x1+1e-9;x+=0.02){var y=a*Math.pow(x,n);if(Math.abs(y)<40)p.push(X(x).toFixed(1)+','+Y(y).toFixed(1))}return'<polyline clip-path="url(#pwc)" points="'+p.join(' ')+'" fill="none" stroke="#2f5fc4" stroke-width="3"/>'};if(n>0)s+=seg(xmin,xmax);else s+=seg(xmin,-0.12)+seg(0.12,xmax);return s+'<text x="'+(W-10)+'" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#3d2a73">y = '+(n===3?(a===1?'':a)+'x³':a+(n===-1?'/x':'/x²'))+'</text></svg>'};
var ST=function(v,t1,t2,t3,lbl){var T=t1+t2+t3,W=520,H=260,X=function(t){return 50+t/Math.max(T,1)*440},Y=function(s){return 220-s/25*190},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Speed-time graph')+'"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/><polygon points="'+X(0)+','+Y(0)+' '+X(t1)+','+Y(v)+' '+X(t1+t2)+','+Y(v)+' '+X(T)+','+Y(0)+'" fill="#ffd98a" fill-opacity=".6"/><polyline points="'+X(0)+','+Y(0)+' '+X(t1)+','+Y(v)+' '+X(t1+t2)+','+Y(v)+' '+X(T)+','+Y(0)+'" fill="none" stroke="#2f5fc4" stroke-width="3"/><line x1="50" y1="220" x2="500" y2="220" stroke="#3d2a73" stroke-width="2"/><line x1="50" y1="220" x2="50" y2="20" stroke="#3d2a73" stroke-width="2"/><text x="275" y="252" text-anchor="middle" font-size="13" fill="#3d2a73">time (s)</text><text x="18" y="120" font-size="13" fill="#3d2a73" text-anchor="middle" transform="rotate(-90 18 120)">speed (m/s)</text>';[0,5,10,15,20,25].forEach(function(z){s+='<text x="44" y="'+(Y(z)+4)+'" text-anchor="end" font-size="10" fill="#5d5478">'+z+'</text>'});[0,t1,t1+t2,T].forEach(function(z,i){if(i===0||z!==[0,t1,t1+t2,T][i-1])s+='<text x="'+X(z)+'" y="236" text-anchor="middle" font-size="10" fill="#5d5478">'+z+'</text>'});return s+'<text x="'+((X(t1)+X(t1+t2))/2)+'" y="'+(Y(v)-8)+'" text-anchor="middle" font-size="12" fill="#3d2a73">'+v+' m/s</text></svg>'};

var DFB={A:'Not this one. After the flat part, the line keeps rising, which means she is getting FURTHER from home. But she walked back home, so her distance from home must come back down to 0.',B:'Not this one. Here the line turns back to the LEFT, which would mean time running backwards. On any travel graph, time only moves forward (to the right). Coming home shows as the line coming DOWN, while still moving right.',C:'Yes! Going to the shop: the distance from home rises. Waiting at the shop: the distance stays the same, so the line is flat. Walking home: the distance falls back to 0, while time keeps moving forward.'};
var WALK=function(vo,w,vb){var D=1,to=D/vo*60,tb=D/vb*60,T=to+w+tb,W=430,H=260,X=function(t){return 50+t/80*360},Y=function(d){return 220-d/1.2*190},s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Distance-time graph of a walk to the shop and back"><rect width="'+W+'" height="'+H+'" fill="#faf8fe"/>';for(var t=0;t<=80;t+=10)s+='<line x1="'+X(t)+'" y1="'+Y(0)+'" x2="'+X(t)+'" y2="'+Y(1.2)+'" stroke="#eee8f8"/><text x="'+X(t)+'" y="'+(Y(0)+14)+'" font-size="10" text-anchor="middle" fill="#5d5478">'+t+'</text>';s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(80)+'" y2="'+Y(0)+'" stroke="#3d2a73" stroke-width="2"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(1.2)+'" stroke="#3d2a73" stroke-width="2"/><text x="'+(X(0)-6)+'" y="'+(Y(1)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">1 km</text><text x="'+(X(0)-6)+'" y="'+(Y(0)+4)+'" font-size="10" text-anchor="end" fill="#5d5478">0</text><text x="'+X(80)+'" y="'+(Y(0)+30)+'" font-size="11" text-anchor="end" fill="#3d2a73">time (minutes)</text><polyline points="'+X(0)+','+Y(0)+' '+X(to)+','+Y(D)+' '+X(to+w)+','+Y(D)+' '+X(T)+','+Y(0)+'" fill="none" stroke="#2f5fc4" stroke-width="3"/><g font-size="11" font-weight="700"><text x="'+(X(to/2)-12)+'" y="'+(Y(D/2)-8)+'" text-anchor="end" fill="#155c35">to the shop</text><text x="'+X(to+w/2)+'" y="'+(Y(D)-8)+'" text-anchor="middle" fill="#a85d00">waiting</text><text x="'+X(to+w+tb/2)+'" y="'+(Y(D/2)-8)+'" fill="#8f1f2b">home</text></g>';return s+'</svg>'};
var STORY_D=STORYBLOCK({story:'"Shanice walks from home to a shop 1 km away. She waits in the shop, then walks back home." Which graph shows her DISTANCE FROM HOME against TIME?',sk:DSK,fb:DFB,correct:'C',p2title:'Build her journey.',p2lead:'Choose how fast Shanice walks there, how long she waits, and how fast she walks back. Watch how the steepness of each part shows her speed.',p2html:'<div class="controls"><label for="wkO">Speed to the shop (km/h):</label><input type="range" id="wkO" min="2" max="8" value="4"><output class="big wkOO"></output><label for="wkW">Wait (min):</label><input type="range" id="wkW" min="0" max="20" step="5" value="10"><output class="big wkWO"></output><label for="wkB">Speed home (km/h):</label><input type="range" id="wkB" min="2" max="8" value="4"><output class="big wkBO"></output></div><div class="scene wkSvg"></div><div class="tile wkOut" aria-live="polite"></div>',goal:'make her walk home exactly twice as fast as her walk to the shop, and see the steeper line',done:'Twice the speed means twice the gradient: the line home is twice as steep, and she covers the same 1 km in half the time.',

  misconceptions:['Reading a distance–time graph as a picture of a hill or a road, or drawing a return journey as a line going backwards in time. Time always moves to the right; coming back shows as the line coming down.','Joining the two branches of y = 1/x across x = 0.','Thinking a horizontal line on a speed–time graph means the object has stopped (it means constant speed).','Using the gradient instead of the area to find distance on a speed–time graph.','Finding average speed by averaging the speeds instead of total distance ÷ total time.','Forgetting to convert minutes to hours (or seconds) before calculating speed.'],
  extension:'Draw y = x³ and y = 2x + 1 on the same axes for −2 ≤ x ≤ 2. Use the graph to estimate the solutions of x³ − 2x − 1 = 0. Check one of them algebraically.'},

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="jbV">Top speed (m/s):</label><input type="range" id="jbV" min="5" max="25" value="10"><output class="big jbVO"></output></div><div class="controls"><label for="jb1">Speeding up (s):</label><input type="range" id="jb1" min="1" max="20" value="5"><output class="big jb1O"></output><label for="jb2">Steady (s):</label><input type="range" id="jb2" min="0" max="40" value="20"><output class="big jb2O"></output><label for="jb3">Slowing (s):</label><input type="range" id="jb3" min="1" max="20" value="5"><output class="big jb3O"></output></div><div class="scene jbSvg"></div><div class="tile jbOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge jbN"></span> <strong class="jbQ"></strong></p><div class="controls"><input type="number" step="0.01" class="jbIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go jbC">Check</button></div><div class="fb jbFb" aria-live="polite">Use the builder to help you.</div></div>',
     init:function(box,api){var g=function(id){return+box.querySelector(id).value};['#jbV','#jb1','#jb2','#jb3'].forEach(function(id){api.nudges(box.querySelector(id))});function draw(){var v=g('#jbV'),t1=g('#jb1'),t2=g('#jb2'),t3=g('#jb3'),d1=v*t1/2,d2=v*t2,d3=v*t3/2,D=d1+d2+d3,T=t1+t2+t3;['V','1','2','3'].forEach(function(k){box.querySelector('.jb'+k+'O').textContent=g('#jb'+k)});box.querySelector('.jbSvg').innerHTML=ST(v,t1,t2,t3);box.querySelector('.jbOut').innerHTML='<strong>Acceleration</strong> (gradient of the first part) = '+v+' ÷ '+t1+' = <strong>'+fn(v/t1)+' m/s²</strong><br><strong>Deceleration</strong> (last part) = '+v+' ÷ '+t3+' = '+fn(v/t3)+' m/s²<br><strong>Distance</strong> = area under the graph = '+fn(d1)+' + '+fn(d2)+' + '+fn(d3)+' = <strong>'+fn(D)+' m</strong><br><strong>Average speed</strong> = '+fn(D)+' ÷ '+T+' = '+fn(D/T)+' m/s'}['#jbV','#jb1','#jb2','#jb3'].forEach(function(id){box.querySelector(id).addEventListener('input',draw)});var Q=[{t:'With top speed 10 m/s, speeding up for 5 s: what is the acceleration? (m/s²)',a:2},{t:'With 10 m/s, 5 s, 20 s and 5 s: what is the total distance? (m)',a:250},{t:'For the same journey, what is the average speed, to 2 decimal places? (m/s)',a:8.33}],q=api.get('k')||0;function task(){if(q>=Q.length){box.querySelector('.jbN').textContent='All done';box.querySelector('.jbQ').textContent='You completed every challenge!';box.querySelector('.jbC').disabled=true;return}box.querySelector('.jbN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.jbQ').textContent=Q[q].t}box.querySelector('.jbC').onclick=function(){var v=parseFloat(box.querySelector('.jbIn').value),fb=box.querySelector('.jbFb');if(Math.abs(v-Q[q].a)<0.006){fb.className='fb ok jbFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.jbIn').value='';task();if(q===Q.length)api.complete()}else{fb.className='fb no jbFb';fb.textContent='Not yet. Set the sliders to 10, 5, 20 and 5, then read the results.'}};draw();task()}},
    {type:'recall',text:'The taxi travelled 250 m: the area under the speed–time graph is 25 m (speeding up) + 200 m (steady) + 25 m (slowing down).'}]},
  {phase:'explain',name:'Teach: non-linear graphs',title:'Learn: cubic and reciprocal graphs',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Never join di two branch across x = 0.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Cubic graphs: y = ax³',explain:PIC('Picture cube-shaped water tanks. A tank 1 m on each side holds 1 m³; a tank 2 m on each side holds 2 × 2 × 2 = 8 m³; a tank 3 m on each side holds 27 m³. The volume is V = s³. Doubling the side does not double the water: it multiplies it by 8. The graph of y = x³ shows how fast that grows.',SCN['Cubic graphs: y = ax³'])+'<p>When the highest power of x is 3, the graph is a {{cubic graph|the graph of y = ax³: an S-shaped curve}}. The graph of y = x³ is an S-shaped curve that passes through the origin.</p><p>Unlike a square, a cube keeps the sign: (−2)³ = −8. So for negative x, y is negative, and for positive x, y is positive. The curve rises steeply on the right, flattens out near the origin, and falls steeply on the left.</p><p>The constant a stretches the curve: y = 2x³ is steeper. If a is negative, like y = −x³, the curve is flipped: it falls from left to right. As always, draw it from a table of values with a smooth curve.</p>'+WHY('Why the S-shape? A cube keeps the sign: a negative number multiplied by itself three times is still negative (−2 × −2 × −2 = −8). So for negative x the graph is below the axis, and for positive x it is above. Near 0, cubes are tiny (0.5³ = 0.125), so the curve flattens out there; further away, they grow very fast.')+WORK('<strong>Engineers and packaging designers</strong> know that scaling up a container multiplies its volume by the cube of the scale factor. <strong>Water engineers</strong> size tanks for homes and schools this way.'),visual:PW(1,3,'Graph of y = x³'),
     example:{q:'Complete a table for y = x³ for x = −2 to 2.',steps:[{do:'x = −2: (−2)³ = −8. x = −1: −1. x = 0: 0.'},{do:'x = 1: 1. x = 2: 8.'},{do:'Points: (−2, −8), (−1, −1), (0, 0), (1, 1), (2, 8). Join with a smooth S-shaped curve.'}]},
     mistake:'Making cubes of negatives positive: (−2)³ = −8, not 8.',
     check:{q:'For y = 2x³, what is y when x = −1?',o:['−2','2','−6'],a:0,why:'2 × (−1) = −2.',hint:'(−1)³ = −1.'}},
    {title:'Reciprocal graphs: y = a/x and y = a/x²',explain:PIC('A $12,000 prize is shared equally among a group of friends. With 2 friends, each gets $6,000; with 4, $3,000; with 12, $1,000. Each share is y = 12,000/x. The more friends, the smaller each share, but it never reaches 0. And you cannot share among 0 people, so there is no point at x = 0.',SCN['Reciprocal graphs: y = a/x and y = a/x²'])+'<p>The graph of y = a/x (that is, axⁿ with n = −1) is a {{reciprocal graph|the graph of y = a/x: two separate branches}}. You met it as inverse variation. It has <strong>two separate branches</strong>, because you cannot divide by 0, so there is no point at x = 0.</p><p>The branches get closer and closer to the x-axis and the y-axis, but never touch them. These axes are called {{asymptotes|lines a curve gets closer to but never touches}}. For a > 0, the branches are in the first and third quadrants.</p><p>The graph of y = a/x² (n = −2) is similar, but because x² is always positive, <strong>both branches are above the x-axis</strong> (for a > 0). Never join the two branches across x = 0.</p>'+WHY('Why does the curve get closer and closer to the axes without touching them? As x gets very large, 12,000/x gets very small but is never exactly 0. As x gets close to 0, 12,000/x gets enormous. Those axes are the asymptotes. For y = a/x², x² is never negative, so both branches stay above the x-axis.')+WORK('<strong>Transport planners</strong> know that the time for a fixed journey is distance ÷ speed, a reciprocal graph: doubling the speed halves the time. <strong>Sound engineers</strong> setting up speakers at a stage show know that loudness falls with 1/x² as you move away (the inverse-square law).'),visual:PW(4,-1,'Graph of y = 4/x with two branches'),
     example:{q:'Make a table for y = 4/x for x = −4, −2, −1, 1, 2, 4.',steps:[{do:'x = −4: −1. x = −2: −2. x = −1: −4.'},{do:'x = 1: 4. x = 2: 2. x = 4: 1.'},{do:'Plot and draw two separate smooth curves, one in each quadrant. Do not cross x = 0.'}]},
     mistake:'Joining the two branches through the origin. y = a/x has no value at x = 0.',
     check:{q:'For y = 4/x², what is y when x = −2?',o:['1','−1','−2'],a:0,why:'(−2)² = 4, and 4/4 = 1.',hint:'Square first.'}},
    {title:'Using graphs to solve equations',explain:PIC('A small business plots its income (a curve) and its costs (a straight line) on the same axes. Where the two graphs cross, income equals costs: the business breaks even. Solving an equation graphically means finding where two graphs meet.',SCN['Using graphs to solve equations'])+'<p>Graphs can solve equations that are hard to solve algebraically. The idea: if you want to solve “f(x) = g(x)”, draw y = f(x) and y = g(x) on the same axes. The <strong>x-coordinates where they cross</strong> are the solutions.</p><p>For example, to solve x³ = 2x + 1, draw the cubic y = x³ and the straight line y = 2x + 1. They cross at three points, giving three solutions (about x = −1, x ≈ −0.62 and x ≈ 1.62). This is the syllabus idea of a combination of linear and non-linear functions.</p><p>A graph gives approximate answers, so read carefully, and check by substituting when you can.</p>'+WHY('Why do the crossing points solve the equation? A point on the first graph satisfies the first equation; a point on the second graph satisfies the second. A crossing point is on BOTH, so it satisfies both at once, which is exactly what f(x) = g(x) asks for.')+WORK('<strong>Business owners and economists</strong> find break-even points graphically. <strong>Engineers</strong> find where two changing quantities become equal, such as when a cooling tank reaches room temperature.'),
     example:{q:'The line y = 4 crosses y = 4/x at one point. Find it.',steps:[{do:'Where they cross, 4/x = 4.'},{do:'So x = 1.'},{do:'The point is (1, 4).'}]},
     mistake:'Giving the y-coordinate as the solution. The solutions of the equation are the x-coordinates of the crossing points.',
     check:{q:'To solve x³ = 5 graphically, draw y = x³ and…',o:['y = 5','x = 5','y = 5x'],a:0,why:'The horizontal line y = 5.',hint:'The right side of the equation.'}}]}]},
  {phase:'explain',name:'Teach: travel graphs',title:'Learn: distance–time and speed–time graphs',lead:'Next, graphs that tell the story of a journey.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Distance–time: gradient a speed. Speed–time: area a distance.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Distance–time graphs',explain:PIC('Remember Shanice’s walk to the shop. When the line rises, she is moving away from home; when it is flat, she is standing still in the shop; when it falls, she is walking home. The graph is not a picture of a hill: it is the story of her journey, minute by minute.',SCN['Distance–time graphs'])+'<p>A {{distance–time graph|a graph of distance against time; its gradient is speed}} shows how far something is from its starting point as time goes on.</p><p>The key idea: <strong>the gradient is the speed</strong>. A steeper line means faster. A <strong>horizontal</strong> line means the distance is not changing, so the object is <strong>stopped</strong>. A line going <strong>down</strong> means the object is coming back towards the start.</p><p>To find a speed, find the gradient of that part: change in distance ÷ change in time. Watch the units: if time is in minutes and you want km/h, convert first.</p>'+WHY('Why is the gradient the speed? The gradient is the change in distance ÷ the change in time, which is exactly the definition of speed. A steeper line covers more distance in each minute, so it is faster. A flat line covers no distance at all: speed 0.')+WORK('<strong>JUTC and route-taxi planners</strong> use distance–time graphs to build timetables. <strong>Delivery companies</strong> track drivers. <strong>Fitness apps</strong> on your phone draw these graphs of your runs and walks.'),visual:DT,
     example:{q:'From the graph: Kemar walks 3 km in 30 minutes, rests for 18 minutes, then returns home in 24 minutes. Find his walking speed and return speed in km/h.',steps:[{do:'Walking out: 3 km in 0.5 h, so speed = 3 ÷ 0.5 = 6 km/h.'},{do:'Resting: the line is horizontal, speed 0.'},{do:'Returning: 3 km in 24 min = 0.4 h, so speed = 3 ÷ 0.4 = 7.5 km/h (faster: a steeper line).'}]},
     mistake:'Thinking a horizontal line on a distance–time graph means "moving at a steady speed". It means STOPPED.',
     check:{q:'On a distance–time graph, a steeper line means…',o:['a higher speed','a lower speed','stopped'],a:0,why:'The gradient is the speed.',hint:'Gradient = speed.'}},
    {title:'Speed–time graphs: gradient and area',explain:PIC('Picture the route taxi leaving Half Way Tree: it speeds up, cruises at a steady speed, then slows to a stop at Cross Roads. On a speed–time graph, the shape shows the speed at each moment, and the area underneath shows how far it travelled.',SCN['Speed–time graphs: gradient and area'])+'<p>A {{speed–time graph|a graph of speed against time}} tells a different story. Here, a horizontal line means <strong>constant speed</strong> (not stopped!).</p><p>The <strong>gradient</strong> is the {{acceleration|the rate of change of speed, in m/s²}}: how quickly the speed changes. A line going up means speeding up; a line going down means slowing down, or {{deceleration|slowing down}}. If the speed rises from 0 to 10 m/s in 5 s, the acceleration is 10 ÷ 5 = 2 m/s².</p><p>The <strong>area under the graph</strong> is the <strong>distance</strong> travelled. Why? Distance = speed × time, which is a rectangle’s area when the speed is constant. Split the area into rectangles, triangles and trapezia, and add them up. For the taxi: 25 + 200 + 25 = 250 m.</p>'+WHY('Why is the area the distance? At a constant speed, distance = speed × time, which is the area of a rectangle on the graph. When the speed changes, imagine slicing the area into very thin strips; each strip is a tiny rectangle (speed × a tiny time), so adding all the strips (the area) gives the total distance.')+WORK('<strong>Police accident investigators</strong> work out how fast a car was going from the length of its skid marks. <strong>Airport engineers</strong> work out how long a runway must be for a plane to reach take-off speed. <strong>Bus and train designers</strong> calculate safe braking distances.'),visual:ST(10,5,20,5,'Speed-time graph of the taxi journey'),
     example:{q:'A bus speeds up from 0 to 12 m/s in 6 s, then keeps that speed for 10 s. Find its acceleration and the total distance.',steps:[{do:'Acceleration = 12 ÷ 6 = 2 m/s².'},{do:'Distance: triangle ½ × 6 × 12 = 36 m; rectangle 10 × 12 = 120 m.'},{do:'Total distance = 156 m.'}]},
     mistake:'Using the gradient to find distance on a speed–time graph. Distance is the AREA; the gradient is acceleration.',
     check:{q:'On a speed–time graph, a horizontal line at 15 m/s means…',o:['moving at a constant 15 m/s','stopped','accelerating'],a:0,why:'The speed is not changing.',hint:'The speed stays the same.'}},
    {title:'Average speed, and solving problems',explain:PIC('A family drives from Kingston to Ocho Rios and stops for 20 minutes at Faith’s Pen to buy food. Their average speed for the trip includes that stop: it is the total distance divided by the total time, including the time they were parked.',SCN['Average speed, and solving problems'])+'<p>The {{average speed|total distance ÷ total time}} of a journey is <strong>total distance ÷ total time</strong>, including any time spent stopped. It is NOT the average of the different speeds.</p><p>For the taxi: 250 m in 30 s gives an average speed of 250 ÷ 30 ≈ 8.33 m/s, even though its top speed was 10 m/s.</p><p>CSEC problems often combine several skills: reading a graph, finding a gradient, finding an area, and working backwards. For example: “The area under the graph is 300 m. Find the top speed.” Write the area in terms of the unknown, then solve.</p>'+WHY('Why not just average the speeds? Because the car spends different amounts of time at each speed. The average speed is the single steady speed that would cover the same distance in the same total time. That is total distance ÷ total time.')+WORK('<strong>Transport planners</strong> and <strong>delivery companies</strong> quote journey times using average speeds, including stops. <strong>Coaches</strong> use average speeds to compare athletes’ race performances.'),
     example:{q:'A cyclist accelerates from rest to v m/s in 10 s, then rides at v m/s for 30 s. The total distance is 280 m. Find v.',steps:[{do:'Area = ½ × 10 × v + 30 × v = 5v + 30v = 35v.'},{do:'35v = 280.'},{do:'v = 8 m/s.'}]},
     mistake:'Averaging the speeds: (0 + 10 + 10 + 0)/4 is NOT the average speed. Use total distance ÷ total time.',
     check:{q:'A runner covers 400 m in 50 s, then walks 100 m in 50 s. Average speed?',o:['5 m/s','6 m/s','4 m/s'],a:0,why:'500 ÷ 100.',hint:'Total distance ÷ total time.'}}]}]},

   blocks:[{type:'facts',facts:[{title:'Non-linear graphs',text:'y = ax³: S-shape through the origin. y = a/x: two branches, asymptotes on the axes. y = a/x²: both branches above the x-axis (a > 0).'},{title:'Solving with graphs',text:'To solve f(x) = g(x), draw both; the x-coordinates of the crossing points are the solutions.'},{title:'Distance–time',text:'Gradient = speed. Horizontal = stopped. Down = returning.'},{title:'Speed–time',text:'Gradient = acceleration. Horizontal = constant speed. Area = distance. Average speed = total distance ÷ total time.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'A train speeds up from 5 m/s to 25 m/s in 10 s. Find its acceleration and the distance in that time.',steps:[{do:'Acceleration = (25 − 5) ÷ 10 = 2 m/s².'},{do:'The area is a trapezium: ½ × (5 + 25) × 10.'},{do:'Distance = 150 m.'}]},
     {type:'fill',q:'For y = 6/x, find y when x = −3.',steps:[{text:'6 ÷ (−3) = ___',blank:true,a:-2,hint:'A positive ÷ a negative.'}],sol:'−2.'},

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, travel graphs and non-linear graphs decide whether a runway is long enough, whether a driver was speeding, whether a bus keeps to its timetable, and how a prize can be shared. Choose a job, sketch the graph, and make the decision.',
   mission:['Choose a job card.','Sketch the graph first: is it distance–time, speed–time, or a non-linear graph?','Complete any 3 jobs for a star. Complete all 4 to become a Maths at Work Champion.'],
   patois:'Gradient a speed (or acceleration). Area a distance. Real life!',
   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'✈️',title:'The airport engineer: a long enough runway?',desc:'Check whether a runway is long enough for take-off.',level:'⭐⭐⭐ Aviation',mins:7,block:{type:'mission',story:'A plane accelerates uniformly from rest to its take-off speed of 75 m/s in 30 seconds. A safety rule says a runway must be at least 1.5 times the take-off distance.',parts:[{q:'What is the plane’s acceleration? (m/s²)',a:2.5,tol:0.001,hint:'75 ÷ 30.',sol:'2.5 m/s².',placeholder:'m/s²'},{q:'How far does it travel before take-off? (m)',a:1125,hint:'Area of the triangle: ½ × 30 × 75.',sol:'1,125 m.',placeholder:'m'},{q:'What is the shortest runway allowed by the safety rule? (m)',a:1687.5,tol:0.1,hint:'1.5 × 1,125.',sol:'1,687.5 m.',placeholder:'m'},{q:'Is a runway 1,500 m long safe for this plane? (Type yes or no.)',a:['no'],hint:'Compare 1,500 with 1,687.5.',sol:'No: it is about 190 m too short.'}],done:'The area under the speed–time graph told the engineer the take-off distance, and the safety rule decided the runway.'}},
    {icon:'🚓',title:'The accident investigator: was the driver speeding?',desc:'Find a car’s speed from its skid marks.',level:'⭐⭐⭐ Police',mins:7,block:{type:'mission',story:'After a crash, a police investigator measures skid marks 40 m long. Tests show the car slowed uniformly to rest in 4 seconds. The speed limit on that road is 50 km/h.',parts:[{q:'The area under the speed–time graph is ½ × 4 × v = 40. What was the speed v when braking began? (m/s)',a:20,hint:'2v = 40.',sol:'20 m/s.',placeholder:'m/s'},{q:'Convert this speed to km/h. (Multiply m/s by 3.6.)',a:72,hint:'20 × 3.6.',sol:'72 km/h.',placeholder:'km/h'},{q:'What was the deceleration? (m/s²)',a:5,hint:'20 ÷ 4.',sol:'5 m/s².',placeholder:'m/s²'},{q:'Was the driver speeding? (Type yes or no.)',a:['yes'],hint:'Compare 72 km/h with 50 km/h.',sol:'Yes: 22 km/h over the limit.'}],done:'The skid marks gave the area, and the area gave the speed: evidence that can be used in court.'}},
    {icon:'🚌',title:'The bus planner: on time?',desc:'Check a JUTC bus against its timetable.',level:'⭐⭐ Transport',mins:6,block:{type:'mission',story:'A JUTC bus leaves Half Way Tree and travels 6 km in 15 minutes to Cross Roads, where it stops for 5 minutes. It then travels 4 km in 10 minutes to Downtown.',parts:[{q:'What is its speed on the first leg? (km/h)',a:24,hint:'6 km in ¼ hour.',sol:'24 km/h.',placeholder:'km/h'},{q:'What is its speed on the second leg? (km/h)',a:24,hint:'4 km in ⅙ hour.',sol:'24 km/h.',placeholder:'km/h'},{q:'What is its average speed for the whole trip, including the stop? (km/h)',a:20,hint:'10 km in 30 minutes.',sol:'20 km/h.',placeholder:'km/h'},{q:'The timetable allows 25 minutes from Half Way Tree to Downtown. Is the bus on time? (Type yes or no.)',a:['no'],hint:'The trip takes 30 minutes.',sol:'No: it is 5 minutes late, exactly the length of the stop. The planner might shorten the stop or allow 30 minutes.'}],done:'The stop does not change the bus’s driving speed, but it does change the average speed, and that is what the timetable depends on.'}},
    {icon:'🏆',title:'The treasurer: sharing a prize',desc:'Share prize money equally with a reciprocal graph.',level:'⭐⭐ Community',mins:5,block:{type:'mission',story:'A community group in Spanish Town wins a $120,000 prize, to be shared equally among n members. Each member gets y = 120,000 ÷ n dollars.',parts:[{q:'How much does each member get if there are 8 members? ($)',a:15000,hint:'120,000 ÷ 8.',sol:'$15,000.',placeholder:'dollars'},{q:'How many members are there if each gets $6,000?',a:20,hint:'120,000 ÷ 6,000.',sol:'20 members.'},{q:'The group hopes each of its 18 members gets at least $7,000. Is that possible? (Type yes or no.)',a:['no'],hint:'120,000 ÷ 18 ≈ 6,667.',sol:'No: each would get about $6,667.'},{q:'What is the largest number of members for which each gets at least $7,000?',a:17,hint:'120,000 ÷ 7,000 ≈ 17.1, rounded DOWN.',sol:'17 members.'}],done:'More members means a smaller share: the reciprocal graph never reaches zero, but it falls quickly.'}}

    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Speed–time graph: 0 to 10 m/s in 5 s. Distance?',lines:['Distance = gradient = 10 ÷ 5 = 2 m'],wrong:0,reasons:['Distance is the AREA: ½ × 5 × 10 = 25 m (2 m/s² is the acceleration)','Distance = 50 m','Distance = 15 m'],reason:0,fix:'25 m.'},{who:'Tia',q:'Draw y = 2/x.',lines:['Plot points for x = −2, −1, 1, 2','Join them with one smooth curve through the origin'],wrong:1,reasons:['There are two separate branches; never join across x = 0','The curve should be straight','The curve should be U-shaped'],reason:0,fix:'Two separate branches.'},{who:'Omar',q:'60 km/h for 1 h, then 30 km/h for 3 h. Average speed?',lines:['Average = (60 + 30) ÷ 2 = 45 km/h'],wrong:0,reasons:['Use total distance ÷ total time: (60 + 90) ÷ 4 = 37.5 km/h','It should be 90 km/h','It should be 30 km/h'],reason:0,fix:'37.5 km/h.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire travel graphs.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var v=R(2,6)*5,t=R(2,10);return{q:'0 to '+v+' m/s in '+t+' s. Distance?',o:[fn(v*t/2)+' m',fn(v*t)+' m',fn(v/t)+' m'],a:0,why:'½ × '+t+' × '+v+'.'}}if(r===1){var v2=R(2,8)*5,t2=R(1,10);return{q:'0 to '+v2+' m/s in '+t2+' s. Acceleration?',o:[fn(v2/t2)+' m/s²',fn(v2*t2)+' m/s²',fn(v2*t2/2)+' m/s²'].filter(function(z,i,a){return a.indexOf(z)===i}).concat([fn(v2/t2+1)+' m/s²']).slice(0,3),a:0,why:v2+' ÷ '+t2+'.'}}var x=[1,2,-1,-2][R(0,3)],a=R(1,4);return{q:'y = '+a+'x³. y when x = '+fn(x)+'?',o:[fn(a*x*x*x),fn(-a*x*x*x),fn(a*x*3)===fn(a*x*x*x)?fn(a*x*x*x+1):fn(a*x*3)],a:0,why:fn(x)+'³ = '+fn(x*x*x)+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent journeys that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'A car accelerates from rest to v m/s in 10 s and travels 150 m in that time. What is v?',placeholder:'m/s',check:function(v){return+v===30?{ok:true,msg:'Yes! ½ × 10 × 30 = 150.'}:{ok:false,msg:'½ × 10 × v = 150.'}}},{q:'Give a speed and a time (speed, time) for a constant-speed journey of exactly 600 m.',placeholder:'speed, time',check:function(v){var n=String(v).split(',').map(parseFloat);return n.length===2&&n[0]>0&&n[1]>0&&Math.abs(n[0]*n[1]-600)<1e-9?{ok:true,msg:'Correct! '+n[0]+' × '+n[1]+' = 600.'}:{ok:false,msg:'Speed × time must equal 600.'}}},{q:'Where does y = 8/x meet y = 2x (x > 0)? Type the x-value.',placeholder:'x',check:function(v){return+v===2?{ok:true,msg:'Yes! 8/x = 2x gives x² = 4, so x = 2 (and y = 4).'}:{ok:false,msg:'Solve 8/x = 2x.'}}}]}},
