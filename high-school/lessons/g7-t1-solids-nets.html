   blocks:[{type:'mcq',star:true,questions:[{q:'How many sides does a triangle have?',o:['3','4','5'],a:0,why:'Tri- means three.',teach:'A triangle is a flat shape with 3 straight sides and 3 corners. "Tri" means three, as in tricycle.'},{q:'A rectangle has…',o:['4 equal sides','4 right angles, with opposite sides equal','3 sides'],a:1,why:'A rectangle has four right angles; opposite sides are equal.',teach:'A rectangle has 4 sides and 4 right angles (square corners). Its opposite sides are equal in length. A square is a special rectangle with all four sides equal.'},{q:'What shape has 5 sides?',o:['Hexagon','Pentagon','Octagon'],a:1,why:'Penta- means five.',teach:'Shape names tell you the number of sides: penta = 5, hexa = 6, octa = 8.'},{q:'What is the difference between a square and a cube?',o:['They are the same','A square is flat (2-D); a cube is solid (3-D)','A cube is flat'],a:1,why:'A square is flat; a cube is a solid with six square faces.',teach:'Flat shapes, like squares, have only length and width (2-D). Solids, like cubes, also have height or depth (3-D). A cube is made from six square faces.'}]}]},

     init:function(box,api){var S=[['cube','Cube',6,8,12],['cuboid','Cuboid',6,8,12],['prism','Triangular prism',5,6,9],['sqpyr','Square-based pyramid',5,5,8],['tripyr','Triangular pyramid',4,4,6]],done=api.get('d')||[],sel=box.querySelector('#euS');S.forEach(function(x,i){var o=document.createElement('option');o.value=i;o.textContent=x[1];sel.appendChild(o)});function pic(){var s=S[+sel.value];box.querySelector('.euPic').innerHTML=SVG1(s[0],s[1]+' drawn with hidden edges dotted');['euF','euV','euE'].forEach(function(id){box.querySelector('#'+id).value=''})}function table(){box.querySelector('.euT tbody').innerHTML=done.map(function(i){var s=S[i];return'<tr><td>'+s[1]+'</td><td>'+s[2]+'</td><td>'+s[3]+'</td><td>'+s[4]+'</td><td><strong>'+(s[2]+s[3]-s[4])+'</strong></td></tr>'}).join('');box.querySelector('.euQ').hidden=done.length<5}sel.onchange=pic;box.querySelector('.euC').onclick=function(){var s=S[+sel.value],F=+box.querySelector('#euF').value,V=+box.querySelector('#euV').value,E=+box.querySelector('#euE').value,fb=box.querySelector('.euFb'),w=[];if(F!==s[2])w.push('faces');if(V!==s[3])w.push('vertices');if(E!==s[4])w.push('edges');if(!w.length){fb.className='fb ok euFb';fb.textContent='✓ Correct! '+s[1]+': F = '+s[2]+', V = '+s[3]+', E = '+s[4]+'.';if(done.indexOf(+sel.value)<0){done.push(+sel.value);api.set('d',done)}table();if(done.length<5){for(var i=0;i<5;i++)if(done.indexOf(i)<0){sel.value=i;pic();break}}}else{fb.className='fb no euFb';fb.textContent='Check your count of '+w.join(' and ')+'. Remember the hidden (dotted) edges and the faces at the back and bottom.'}};box.querySelector('.euQC').onclick=function(){var fb=box.querySelector('.euQF');if(+box.querySelector('.euA').value===2){fb.className='fb ok euQF';fb.textContent='✓ Yes! For every one of these solids, F + V − E = 2. This is called Euler\'s formula.';api.complete()}else{fb.className='fb no euQF';fb.textContent='Look again at the last column of the table.'}};pic();table()}}]},
  {phase:'explain',name:'Teach: solids',title:'Learn: describing and naming solids',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Tek one idea at a time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Faces, edges and vertices',explain:'<p>Pick up a box, a tin or a dice and turn it slowly in your hands. These are {{solids|3-D shapes that take up space}}: shapes that take up space, with length, width and height.</p><p>We describe solids by counting three things. Run your hand flat over the box: each flat surface you feel is a {{face|a flat surface of a solid}}. Now run your finger along the place where two faces meet: that line is an {{edge|a line where two faces meet}}. Finally, touch a pointy corner where edges come together: that is a {{vertex|a corner where edges meet; plural vertices}}. When there is more than one, we say vertices.</p><p>When we draw a solid on flat paper, some faces and edges are hidden at the back. We draw hidden edges with <strong>dotted lines</strong> so we remember they are there. When you count, always include the hidden ones; if you can, hold a real object to check.</p>',visual:SVG1('cube','A cube with its hidden edges dotted'),
     example:{q:'Count the faces, edges and vertices of a cube.',steps:[{do:'Faces: front, back, top, bottom, left, right = 6.',why:'Think of the six sides of a dice.'},{do:'Vertices: 4 corners on the front face and 4 on the back = 8.'},{do:'Edges: 4 around the front, 4 around the back, and 4 joining front to back = 12.',why:'Counting in groups makes it easier not to miss any.'}]},
     mistake:'Counting only what you can see in the picture. A drawing hides some faces, edges and vertices. Picture the whole solid, or hold a real one.',
     check:{q:'How many vertices does a square-based pyramid have?',o:['4','5','8'],a:1,why:'4 corners on the square base, plus 1 at the top (the apex) = 5.',hint:'Count the base corners, then the point at the top.'}},
    {title:'Prisms, pyramids and curved solids',explain:'<p>Think about a loaf of bread. If you slice it anywhere along its length, every slice is the same shape. A solid like that is a {{prism|a solid with two identical end faces joined by rectangles}}: it has two identical ends, joined by rectangles, and the same shape goes all the way through. A cereal box is a prism with rectangle ends, and a box of chocolate with triangle ends is a triangular prism. Prisms are named after the shape of their ends.</p><p>Now think about the famous pyramids of Egypt. A {{pyramid|a solid with a flat base and triangular faces meeting at one point}} has a flat base, and its sloping triangle sides all meet at a single point at the top, called the apex.</p><p>Some solids have curved surfaces instead of flat ones. A tin of ackee is a {{cylinder|a solid with two circular ends and one curved surface}}. An ice cream cone is a {{cone|a solid with a circular base and a curved surface that meets at a point}}. And a ball is a sphere.</p>',visual:CURVED,
     example:{q:'Name the solid shape of: (a) a tin of corned beef; (b) a chocolate bar box with triangular ends; (c) a sugar cube.',steps:[{do:'(a) Two circular ends and a curved side: a cylinder.'},{do:'(b) Two triangular ends joined by rectangles: a triangular prism.',why:'Prisms are named after their end shape.'},{do:'(c) Six equal square faces: a cube.'}]},
     mistake:'Thinking a cube is not a prism. A cube has two identical square ends joined by squares, so it is a special prism.',
     check:{q:'A solid has a square base and four triangular faces that meet at a point. What is it?',o:['Triangular prism','Square-based pyramid','Cube'],a:1,why:'Triangles meeting at an apex over a square base make a square-based pyramid.',hint:'Do the faces meet at a point?'}},
    {title:'Euler\'s formula',explain:'<p>In the Euler explorer you found a pattern: for every prism and pyramid, <strong>F + V − E = 2</strong>.</p><p>This is {{Euler\'s formula|faces + vertices − edges = 2}}, named after the Swiss mathematician Leonhard Euler. You can use it to check your counting, or to find a missing number.</p><p>It works for solids with flat faces and straight edges. It does not apply to cylinders, cones or spheres.</p>',
     example:{q:'A solid has 7 faces and 10 vertices. How many edges does it have?',steps:[{do:'Write the formula: F + V − E = 2.'},{do:'Substitute: 7 + 10 − E = 2, so 17 − E = 2.'},{do:'E = 17 − 2 = 15 edges.',why:'This solid is a pentagonal prism.'}]},
     mistake:'Using F + V + E. It is faces plus vertices MINUS edges.',
     check:{q:'A triangular prism has 5 faces and 6 vertices. How many edges?',o:['9','11','13'],a:0,why:'5 + 6 − E = 2, so E = 9.',hint:'F + V − E = 2.'}}]}]},
  {phase:'explain',name:'Teach: nets',title:'Learn: nets of solids',lead:'Next, how solids are made from flat shapes, like cereal boxes and tins.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'A net a di flat shape weh yuh fold fi mek di solid.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'What is a net?',explain:'<p>Have you ever carefully unfolded an empty juice box or cereal box? When you open it out flat, you get a funny-looking shape made of rectangles. That flat shape is called a {{net|a flat shape that folds to make a solid}}.</p><p>A net is a flat pattern that can be folded up to make a solid. Every face of the solid appears exactly once in the net. A cube has 6 square faces, so its net has 6 squares. Factories print nets on big sheets of card, cut them out, and fold them up to make boxes. (Real boxes also have little extra flaps for gluing.)</p><p>The best way to understand nets is to make some. If you have card and scissors, try drawing a net, cutting it out and folding it up. You will quickly get a feel for which shapes work.</p>',visual:NET([[1,0],[0,1],[1,1],[2,1],[3,1],[1,2]],'A net of a cube'),
     example:{q:'How many faces must a net of a cube have, and what shape are they?',steps:[{do:'A cube has 6 faces.'},{do:'Each face is a square, and all six squares are the same size.'},{do:'So a net of a cube is 6 equal squares joined edge to edge.'}]},
     mistake:'Forgetting that every face must appear exactly once. A cube net with 5 squares leaves a hole; one with 7 squares has an extra face.',
     check:{q:'How many faces does the net of a cuboid have?',o:['4','6','8'],a:1,why:'A cuboid has 6 faces, so its net has 6 rectangles.',hint:'Count the faces of a cuboid.'}},
    {title:'Which nets fold into a cube?',explain:'<p>Here is a question that sounds easy but is surprisingly tricky: will any 6 squares joined together fold up into a cube? Try imagining it. The answer is no! Only certain arrangements work. In fact, there are exactly 11 different nets of a cube.</p><p>To test a net in your head, choose one square to be the bottom of the box. Then imagine folding the other squares up around it to make the sides and the lid. If two squares would try to land on the same side of the cube, the net does not work, because that leaves a gap somewhere else.</p><p>There are a couple of quick rules. A row of four squares, with one square above it and one square below it, always works; it wraps around like a belt, with a lid and a base. But six squares in a straight row never works, and neither does a block of two rows of three.</p>',visual:NETS3,
     example:{q:'Which of shapes A, B and C fold into a cube?',steps:[{do:'A (the cross): four in a row make the sides; the squares above and below fold over as the top and bottom. ✓'},{do:'B (two rows of three): when you fold it, two squares end up on the same side and two faces of the cube are missing. ✗'},{do:'C (six in a row): rolling it up only goes around four sides; the last two overlap and there is no top or bottom. ✗'},{do:'So only shape A folds into a cube. Was your prediction right?'}]},
     mistake:'Thinking any six joined squares fold into a cube. You must check that no two squares fold onto the same face.',
     check:{q:'Four squares in a row, with one square above the first and one below the last. Does it fold into a cube?',o:['Yes','No'],a:0,why:'Any net with four squares in a row and one square on each side (above and below) folds into a cube.',hint:'Remember the quick check for "1-4-1" nets.'}},
    {title:'Nets of other solids',explain:'<p>Every solid has a net, not just cubes. The trick is to think about what faces the solid has, and then picture them laid out flat.</p><p>A cuboid, like a shoebox, has 6 rectangles in 3 matching pairs: top and bottom, front and back, left and right. A triangular prism, like a tent, has 2 triangle ends and 3 rectangles for the sides. A square-based pyramid has 1 square base and 4 triangles that fold up to meet at the top.</p><p>Curved solids are interesting. Imagine peeling the label off a tin. It comes off as a rectangle! So a cylinder’s net is 2 circles (the top and bottom) and 1 rectangle. Because the rectangle wraps all the way around the circle, its length must match the distance around the circle, the {{circumference|the distance around a circle}}. A cone’s net is a circle and a fan-shaped piece that curls up into the point.</p>',visual:OTHERNETS,
     example:{q:'A tin of milk has a circular top with a circumference of 22 cm and a height of 10 cm. Describe its net.',steps:[{do:'A tin is a cylinder, so the net has 2 circles and 1 rectangle.'},{do:'The rectangle wraps around the circular top, so its length is the circumference: 22 cm.',why:'The rectangle\'s long edge must fit exactly around the circle.'},{do:'The rectangle\'s width is the height of the tin: 10 cm. So the net is two circles and a 22 cm × 10 cm rectangle.'}]},
     mistake:'Making the rectangle of a cylinder net as long as the diameter. It must be as long as the circumference, which is about 3 times longer.',
     check:{q:'How many faces does the net of a square-based pyramid have?',o:['4','5','6'],a:1,why:'1 square base + 4 triangles = 5.',hint:'Count the base and the triangles.'}}]},{type:'recall',text:'The answer to the opening question is Shape A. The cross shape folds into a cube; shapes B and C do not.'}]},
