  {phase:'explain',name:'Teach: symbols and directed numbers',title:'Learn: symbols, translation and directed numbers',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Algebra a jus a language. Learn fi read it an write it.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Symbols, and translating between words and algebra',explain:'<p>Algebra is a language. Just as road signs and safety symbols give information quickly, algebra uses symbols to say mathematical things in a short, exact way. A letter such as m is a {{variable|a letter that stands for a number that can change}}: it stands for a number that can change.</p><p>Be careful with units. The syllabus gives a lovely example: <strong>5 m</strong> (with a space) means 5 metres, but <strong>5m</strong> means 5 × m, such as 5 times the number of mangoes bought. In algebra, we leave out the × sign: 5m means 5 × m, and ab means a × b.</p><p>Translating means turning words into algebra and back. “Three more than twice a number” becomes 2n + 3. “The product of x and y, divided by 4” becomes xy/4. Read slowly, and turn each word into its symbol: sum (+), difference (−), product (×), quotient (÷), squared (²).</p>',
     example:{q:'Write in algebra: (a) "7 less than the square of a number"; (b) "the sum of p and q, all multiplied by 3".',steps:[{do:'(a) The square of a number: n². 7 less than that: n² − 7.',why:'"7 less than" means take 7 away from it.'},{do:'(b) The sum first: p + q. Then multiply all of it by 3: 3(p + q).',why:'"All multiplied" needs brackets.'}]},
     mistake:'Getting "less than" backwards. "7 less than n²" is n² − 7, not 7 − n².',
     check:{q:'Which means "the product of 4 and the sum of x and 5"?',o:['4(x + 5)','4x + 5','4 + x + 5'],a:0,why:'Find the sum first, then multiply by 4.',hint:'"Sum" goes in brackets.'}},
    {title:'Directed numbers',explain:'<p>{{Directed numbers|numbers with a sign showing direction: positive or negative}} have a sign that shows direction: above or below zero, gain or loss, up or down. You use them for temperatures, bank balances and heights above and below sea level.</p><p><strong>Adding and subtracting:</strong> picture a number line. Adding a positive moves right; adding a negative moves left. Subtracting a negative is the same as adding: <strong>5 − (−3) = 5 + 3 = 8</strong>. Think of it as “taking away a debt”, which makes you better off.</p><p><strong>Multiplying and dividing:</strong> if the signs are the <strong>same</strong>, the answer is <strong>positive</strong>; if the signs are <strong>different</strong>, the answer is <strong>negative</strong>. So −6 × −2 = 12, but −6 × 2 = −12 and 12 ÷ −3 = −4.</p>',visual:NL(-4,9,'Number line: −4 + 9 = 5'),
     example:{q:'Evaluate (−3)² − 4 × (−2) ÷ (−1).',steps:[{do:'Powers first: (−3)² = 9.',why:'Negative × negative = positive.'},{do:'Then × and ÷ from left to right: 4 × (−2) = −8, and −8 ÷ (−1) = 8.'},{do:'Finally: 9 − 8 = 1.'}]},
     mistake:'Thinking −3 − (−5) = −8. Subtracting a negative ADDS: −3 + 5 = 2.',
     check:{q:'What is −7 − (−10)?',o:['3','−17','−3'],a:0,why:'−7 + 10 = 3.',hint:'Subtracting a negative is adding.'}},
    {title:'Simplifying expressions',explain:'<p>To simplify an expression means to write it in the shortest, neatest way.</p><p><strong>Adding and subtracting:</strong> only {{like terms|terms with exactly the same letters and powers}} can be combined: terms with exactly the same letters and powers. 5ab − 2ab = 3ab, but 5ab + 2a cannot be combined. Keep each term’s sign with it as you collect.</p><p><strong>Multiplying:</strong> multiply the numbers, then the letters, adding the powers of the same letter: 3x × 4xy = 12x²y. <strong>Dividing:</strong> divide the numbers and cancel the letters: 12x²y ÷ 4x = 3xy.</p><p>Directed-number rules apply to the numbers in front of the letters too: −2a × −5b = 10ab.</p>',
     example:{q:'Simplify 4x² − 3x + 2x² + 7x − 5.',steps:[{do:'x² terms: 4x² + 2x² = 6x².'},{do:'x terms: −3x + 7x = 4x.',why:'Keep each sign with its term.'},{do:'Answer: 6x² + 4x − 5.'}]},
     mistake:'Combining x² and x terms: 6x² + 4x is NOT 10x³. Different powers are unlike terms.',
     check:{q:'Simplify −3a × 4ab.',o:['−12a²b','12a²b','a²b'],a:0,why:'−3 × 4 = −12; a × ab = a²b.',hint:'Numbers first, then letters.'}}]}]},
  {phase:'explain',name:'Teach: substitution and binary operations',title:'Learn: substitution and binary operations',lead:'Next, putting numbers into expressions, and working with new operations.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Put brackets round di negative number dem.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Substitution',explain:'<p>To {{substitute|replace each letter with a given number}} means to replace each letter in an expression with a given number, then work out the value.</p><p>The secret to getting it right every time: <strong>put brackets around each number you substitute</strong>, especially negative ones. Then follow the order of operations (BODMAS).</p><p>Why do brackets matter so much? If x = −3, then x² means (−3)² = 9. Without brackets, you might type −3² into a calculator, which it reads as −(3²) = −9. That one slip is one of the most common mistakes in CSEC algebra.</p>',
     example:{q:'If a = −2, b = 3 and c = −1, find 2a² − 3bc.',steps:[{do:'Substitute with brackets: 2(−2)² − 3(3)(−1).'},{do:'Powers first: (−2)² = 4, so 2 × 4 = 8.'},{do:'3(3)(−1) = −9, so 8 − (−9) = 8 + 9 = 17.'}]},
     mistake:'Writing 2a² as (2a)². In 2a², only a is squared: 2 × (−2)² = 8, not (−4)² = 16.',
     check:{q:'If x = −3, what is x² + 2x?',o:['3','15','−15'],a:0,why:'9 + (−6) = 3.',hint:'(−3)² = 9 and 2(−3) = −6.'}},
    {title:'Binary operations',explain:'<p>Addition, subtraction, multiplication and division all combine two numbers to make one. Any rule that does this is called a {{binary operation|a rule that combines two numbers to give one answer}} (“binary” means “two”). CSEC questions often invent new ones, using symbols like ∗, ⊕ or ∘.</p><p>To evaluate one, simply <strong>substitute</strong>: the first number replaces a and the second replaces b. If a ∗ b = 2a + b, then 5 ∗ (−1) = 2(5) + (−1) = 9.</p><p>If there are brackets, like (2 ∗ 1) ∗ 3, work out the bracket first and use its answer as the new first number: 2 ∗ 1 = 5, then 5 ∗ 3 = 13.</p>',
     example:{q:'Given p ⊕ q = p² − 3q, evaluate 4 ⊕ (−2).',steps:[{do:'p = 4 and q = −2.'},{do:'4² − 3(−2) = 16 + 6.',why:'−3 × −2 = +6.'},{do:'= 22.'}]},
     mistake:'Swapping the order of the numbers. In a ∗ b, the FIRST number always replaces a.',
     check:{q:'If a ∗ b = a + 3b, what is 2 ∗ 5?',o:['17','11','15'],a:0,why:'2 + 3(5) = 17.',hint:'a = 2, b = 5.'}},
    {title:'Properties of binary operations',explain:'<p>The syllabus asks you to think about three properties of binary operations.</p><p>An operation is {{commutative|the order does not matter: a ∗ b = b ∗ a}} if the order never matters: <strong>a ∗ b = b ∗ a</strong> for all numbers. Addition and multiplication are commutative; subtraction is not. To show an operation is NOT commutative, one counterexample is enough: 3 ∗ 4 ≠ 4 ∗ 3.</p><p>An operation is {{associative|the grouping does not matter}} if the grouping never matters: <strong>(a ∗ b) ∗ c = a ∗ (b ∗ c)</strong>.</p><p>The distributive property connects two operations: for ordinary numbers, a × (b + c) = a × b + a × c. With a new operation, you can test whether it distributes in the same way by calculating both sides.</p>',
     example:{q:'Is a ∗ b = ab + a + b commutative?',steps:[{do:'b ∗ a = ba + b + a.'},{do:'Since ab = ba and a + b = b + a, b ∗ a = ab + a + b = a ∗ b.'},{do:'So yes, it is commutative for all numbers.',why:'This is a general proof, not just one example.'}]},
     mistake:'Deciding an operation is commutative after testing just one pair. A single matching pair proves nothing; you need a general reason.',
     check:{q:'For a ∗ b = a − 2b, is 1 ∗ 1 equal to 1 ∗ 1?',o:['Yes, but that does not prove the operation is commutative','Yes, so the operation is commutative','No'],a:0,why:'Testing one pair where a = b proves nothing; try 3 ∗ 1 and 1 ∗ 3.',hint:'One example cannot prove "always".'}}]}]},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire directed numbers and substitution.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2),o,add=function(z){if(o.length<3&&o.indexOf(fd(z))<0)o.push(fd(z))};if(r===0){var a=R(-9,9),b=R(-9,9),op=['+','−','×'][R(0,2)],v=op==='+'?a+b:op==='−'?a-b:a*b;o=[fd(v)];[-v,v+2,v-2].forEach(add);return{q:'('+fd(a)+') '+op+' ('+fd(b)+') = ?',o:o,a:0,why:'Use the sign rules.'}}if(r===1){var x=R(-5,-1),c=R(1,5),v2=x*x+c*x;o=[fd(v2)];[-x*x+c*x,x*x-c*x,v2+1].forEach(add);return{q:'x = '+fd(x)+'. x² + '+c+'x = ?',o:o,a:0,why:'('+fd(x)+')² = '+x*x+'.'}}var p=R(-4,5),q=R(-4,5),v3=2*p+q;o=[fd(v3)];[2*q+p,p+q,v3+1].forEach(add);return{q:'a ∗ b = 2a + b. '+fd(p)+' ∗ '+fd(q)+' = ?',o:o,a:0,why:'2('+fd(p)+') + ('+fd(q)+').'}}}},
