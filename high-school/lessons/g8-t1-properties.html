 glossary:[['Closed','A set is closed under an operation if combining any two of its members always gives a member of the same set.'],['Counterexample','One example that shows a statement is false.'],['Relation','A rule that links members of a set, such as "is equal to" or "is taller than".'],['Reflexive','A relation is reflexive if every member is related to itself: a R a.'],['Symmetric','A relation is symmetric if a R b always means b R a.'],['Transitive','A relation is transitive if a R b and b R c always mean a R c.'],['Trichotomy law','For any two real numbers a and b, exactly one is true: a < b, a = b, or a > b.'],['Equivalence relation','A relation that is reflexive, symmetric and transitive, such as "is equal to".']],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="ctS">Set:</label><select id="ctS"></select><label for="ctO">Operation:</label><select id="ctO"><option>+</option><option>−</option><option>×</option><option>÷</option></select><button type="button" class="go ctRun">Test 6 pairs</button></div><div class="tile ctOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge ctB"></span> <strong class="ctT"></strong></p><div class="choice-row ctOpts"><button type="button" data-v="yes">Yes, closed</button><button type="button" data-v="no">No, not closed</button></div><div class="fb ctFb" aria-live="polite">Use the tester, then choose.</div></div>',
     init:function(box,api){var s=box.querySelector('#ctS'),o=box.querySelector('#ctO');Object.keys(SETS).forEach(function(k){var e=document.createElement('option');e.value=k;e.textContent=SETS[k][0];s.appendChild(e)});var fmt=function(x){return isNaN(x)?'undefined':(Math.round(x*1000)/1000).toString().replace('-','−')};function members(k){var r=SETS[k][2],m=[];for(var x=r[0];x<=r[1];x++)if(SETS[k][1](x))m.push(x);return m}function run(){var k=s.value,op=o.value,f=OPS[op],M=members(k),rows=[],bad=null;for(var i=0;i<6;i++){var a=M[Math.floor(Math.random()*M.length)],b=M[Math.floor(Math.random()*M.length)],v=f(a,b);rows.push([a,b,v,!isNaN(v)&&SETS[k][1](v)])}for(var i2=0;i2<M.length&&!bad;i2++)for(var j=0;j<M.length;j++){var w=f(M[i2],M[j]);if(isNaN(w)||!SETS[k][1](w)){bad=[M[i2],M[j],w];break}}box.querySelector('.ctOut').innerHTML='<table class="rec" style="max-width:none"><thead><tr><th>Pair</th><th>Result</th><th>Still in the set?</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td>'+fmt(r[0])+' '+op+' '+fmt(r[1])+'</td><td>'+fmt(r[2])+'</td><td style="font-weight:700;color:'+(r[3]?'#155c35':'#8f1f2b')+'">'+(r[3]?'✓ Yes':'✗ No')+'</td></tr>'}).join('')+'</tbody></table><p style="margin:8px 0 0">'+(bad?'<strong>Counterexample:</strong> '+fmt(bad[0])+' '+op+' '+fmt(bad[1])+' = '+fmt(bad[2])+', which is NOT in the set. So this set is <strong>not closed</strong> under '+op+'.':'No counterexample found among the members tested: this set <strong>is closed</strong> under '+op+'.')+'</p>'}box.querySelector('.ctRun').onclick=run;s.onchange=run;o.onchange=run;var T=[{t:'Are the natural numbers closed under subtraction?',a:'no'},{t:'Are the integers closed under subtraction?',a:'yes'},{t:'Are the odd natural numbers closed under addition?',a:'no'}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.ctB').textContent='All done';box.querySelector('.ctT').textContent='You completed every challenge!';[].forEach.call(box.querySelectorAll('.ctOpts button'),function(b){b.disabled=true});return}box.querySelector('.ctB').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.ctT').textContent=T[q].t}[].forEach.call(box.querySelectorAll('.ctOpts button'),function(b){b.onclick=function(){var fb=box.querySelector('.ctFb');if(b.getAttribute('data-v')===T[q].a){fb.className='fb ok ctFb';fb.textContent='✓ Correct!';q++;api.set('k',q);task();if(q===T.length)api.complete()}else{fb.className='fb no ctFb';fb.textContent='Not quite. Set up the tester for this set and operation and look for a counterexample.'}}});run();task()}}]},
  {phase:'explain',name:'Teach: closure and trichotomy',title:'Learn: closure, counterexamples and the trichotomy law',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'One counterexample enough fi show it nuh work.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Closure',explain:'<p>Imagine a club with a strict rule: whatever you make from two members must also be a member. Mathematicians ask the same kind of question about sets of numbers. If you take any two numbers from a set and combine them, does the answer stay inside the set?</p><p>Try it with the natural numbers, the counting numbers 1, 2, 3, … Add any two of them: 3 + 4 = 7, 10 + 25 = 35. You always land on another counting number; you never fall out of the set. When that happens every single time, we say the set is {{closed|combining any two members always gives a member of the same set}} under addition.</p><p>Now try subtraction with the same set. 9 − 4 = 5 is fine. But what about 3 − 4? The answer is −1, and −1 is not a counting number. We have fallen out of the set! So the natural numbers are <strong>not</strong> closed under subtraction.</p><p>So closure is always about two things together: a <em>set</em> and an <em>operation</em>. The same set can be closed under one operation and not closed under another.</p>',
     example:{q:'Are the even numbers {2, 4, 6, …} closed under addition?',steps:[{do:'Try some pairs: 2 + 4 = 6, 8 + 10 = 18. Each answer is even.'},{do:'Think about why: two even numbers are 2a and 2b, and 2a + 2b = 2(a + b), which is also even.',why:'A reason that works for every pair is stronger than examples.'},{do:'So the even numbers ARE closed under addition.'}]},
     mistake:'Deciding a set is closed after trying only a few examples. Examples suggest it, but you need a reason that works for every pair.',
     check:{q:'Are the natural numbers closed under multiplication?',o:['Yes','No'],a:0,why:'Multiplying two counting numbers always gives a counting number.',hint:'Can a product of two counting numbers ever be 0, negative or a fraction?'}},
    {title:'Counterexamples',explain:'<p>Suppose a friend says, “Every bird can fly.” You do not need to check every bird in the world to prove them wrong. You only need to show them one penguin. One example that breaks a rule is called a {{counterexample|one example that shows a statement is false}}.</p><p>The same idea works with closure. To show that a set is <em>not</em> closed, you only need <strong>one</strong> pair of numbers whose answer falls outside the set. For example, are the whole numbers closed under division? Try 1 ÷ 2. The answer, 0.5, is not a whole number. That single example settles it: the whole numbers are not closed under division.</p><p>But be careful. Going the other way is harder. A few examples that DO work are not enough to prove a set is closed, because the very next pair might break the rule. To be sure a set is closed, you need a reason that works for every pair.</p>',
     example:{q:'Are the odd numbers {1, 3, 5, …} closed under addition?',steps:[{do:'Try a pair: 1 + 3 = 4.'},{do:'4 is even, not odd.',why:'This one pair is a counterexample.'},{do:'So the odd numbers are NOT closed under addition.'}]},
     mistake:'Saying "no" without giving a counterexample. Always show the pair that breaks the rule.',
     check:{q:'Which is a counterexample showing the integers are NOT closed under division?',o:['6 ÷ 3 = 2','1 ÷ 2 = 0.5','4 ÷ 4 = 1'],a:1,why:'0.5 is not an integer.',hint:'Look for an answer that is not an integer.'}},
    {title:'The trichotomy law',explain:'<p>Pick any two numbers, say 7 and 12. Before you even think about it, you know something must be true: either 7 is less than 12, or 7 equals 12, or 7 is greater than 12. There is no fourth choice, and only one of the three can happen at a time.</p><p>That simple idea has a name: the {{trichotomy law|for any two real numbers, exactly one is true: the first is less than, equal to, or greater than the second}}. “Tri” means three, as in triangle or tricycle. The law says that for any two real numbers a and b, <strong>exactly one</strong> of these is true: a &lt; b, or a = b, or a &gt; b.</p><p>Why is this useful? Because if you can rule out two of the possibilities, the third one must be true. If you know x is not less than 5, and x is not equal to 5, then x must be greater than 5. It is like a detective eliminating suspects until only one is left.</p>',
     example:{q:'Use the trichotomy law: if x is not less than 5, and x is not equal to 5, what can you say?',steps:[{do:'Exactly one of x < 5, x = 5 or x > 5 must be true.'},{do:'Two of them are ruled out.'},{do:'So x > 5.',why:'Only one possibility is left.'}]},
     mistake:'Thinking two numbers might not be comparable. For real numbers, one of <, = or > is always true.',
     check:{q:'For −3 and −7, which ONE statement is true?',o:['−3 < −7','−3 = −7','−3 > −7'],a:2,why:'−3 is further right on the number line, so −3 > −7.',hint:'Which is closer to zero?'}}]}]},
  {phase:'explain',name:'Teach: relations',title:'Learn: reflexive, symmetric and transitive relations',lead:'Next, three properties that describe how a relation links members of a set.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Test di rule wid real people an real number.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Reflexive',explain:'<p>In maths, a {{relation|a rule that links members of a set, such as is equal to or is taller than}} is any rule that links members of a set, such as “is equal to”, “is taller than” or “lives in the same parish as”. Over the next three ideas, we will ask three questions about relations.</p><p>The first question is: is every member related to <em>itself</em>? If the answer is always yes, the relation is {{reflexive|every member is related to itself}}.</p><p>Let’s test some. “Is equal to”: is 5 equal to 5? Yes, and that works for every number, so “is equal to” is reflexive. “Lives in the same parish as”: do you live in the same parish as yourself? Of course you do, so that relation is reflexive too. Now try “is taller than”: are you taller than yourself? No, nobody is! So “is taller than” is <strong>not</strong> reflexive. Whenever you test reflexive, always compare a member with itself.</p>',visual:REL('ref'),
     example:{q:'Is "is less than or equal to" (≤) reflexive on the numbers?',steps:[{do:'Test any number with itself: is 4 ≤ 4?'},{do:'Yes, because 4 = 4.',why:'≤ includes "equal to".'},{do:'This works for every number, so ≤ is reflexive.'}]},
     mistake:'Testing two different members. Reflexive is about each member compared with ITSELF.',
     check:{q:'Is "is the sister of" reflexive?',o:['Yes','No'],a:1,why:'Nobody is their own sister.',hint:'Can a person be related this way to themselves?'}},
    {title:'Symmetric',explain:'<p>The second question is: does the relation work <em>both ways</em>? If a is related to b, is b always related to a in the same way? If yes, the relation is {{symmetric|whenever a is related to b, b is related to a}}.</p><p>Think about cousins. If Tia is Kemar’s cousin, then Kemar is Tia’s cousin. The relationship works in both directions, so “is a cousin of” is symmetric. The same is true for “is equal to”: if x = 5, then 5 = x.</p><p>Now think about “is the father of”. If Mr. Brown is Tom’s father, is Tom Mr. Brown’s father? Definitely not! So “is the father of” is <strong>not</strong> symmetric. Numbers can fail too: 9 is greater than 4, but 4 is not greater than 9. A quick way to test symmetry is to swap the two names around and see if the sentence is still true.</p>',visual:REL('sym'),
     example:{q:'Is "is a classmate of" symmetric?',steps:[{do:'Suppose Kemar is a classmate of Andre.'},{do:'Then Andre is in the same class as Kemar, so Andre is a classmate of Kemar.'},{do:'This always works, so "is a classmate of" is symmetric.'}]},
     mistake:'Thinking "is greater than" is symmetric. If a > b, then b < a, not b > a.',
     check:{q:'Is "is the father of" symmetric?',o:['Yes','No'],a:1,why:'If Mr. Brown is Tom\'s father, Tom is not Mr. Brown\'s father.',hint:'Reverse it and see if it is still true.'}},
    {title:'Transitive',explain:'<p>The third question is about chains. If a is related to b, and b is related to c, does it follow that a is related to c? If that is always true, the relation is {{transitive|if a is related to b and b to c, then a is related to c}}.</p><p>Take “is taller than”. If Andre is taller than Kemar, and Kemar is taller than Jordan, then Andre must be taller than Jordan. The relation “passes along the chain”, so it is transitive. “Is greater than” and “is equal to” work the same way.</p><p>Now think back to the opening puzzle about friends. Kayla is friends with Brianna, and Brianna is friends with Shanice. Does that force Kayla and Shanice to be friends? Not at all: they might never have met! So “is a friend of” is <strong>not</strong> transitive. Notice it IS symmetric, though: friendship goes both ways. A relation can have some of these properties without having all of them. When a relation has all three, like “is equal to”, it is called an equivalence relation.</p>',visual:REL('tra'),
     example:{q:'The opening puzzle: is "is a friend of" transitive?',steps:[{do:'Kayla is friends with Brianna, and Brianna is friends with Shanice.'},{do:'Kayla and Shanice may never have met, or may not get along.',why:'One case where it fails is enough: a counterexample.'},{do:'So "is a friend of" is NOT transitive. It is symmetric (friendship goes both ways), but not transitive. Was your prediction right?'}]},
     mistake:'Assuming every relation is transitive because "is equal to" and "is greater than" are.',
     check:{q:'Is "is older than" transitive?',o:['Yes','No'],a:0,why:'If A is older than B and B is older than C, then A is older than C.',hint:'Try three people of different ages.'}}]}]},

    {icon:'🕵🏾',title:'Property detective',desc:'Name the property in each statement.',level:'⭐⭐ Skill builder',mins:5,block:{type:'mcq',questions:[{q:'If Andre is taller than Kemar and Kemar is taller than Jordan, then Andre is taller than Jordan.',o:['Reflexive','Symmetric','Transitive'],a:2,why:'a R b and b R c give a R c.'},{q:'Every number is equal to itself.',o:['Reflexive','Symmetric','Closure'],a:0,why:'a = a.'},{q:'If Sasha is Tia\'s cousin, then Tia is Sasha\'s cousin.',o:['Reflexive','Symmetric','Transitive'],a:1,why:'The relation works both ways.'},{q:'Adding any two integers gives an integer.',o:['Closure','Trichotomy','Symmetric'],a:0,why:'The answer stays in the set.'},{q:'For the numbers 4 and 9, exactly one of 4 < 9, 4 = 9, 4 > 9 is true.',o:['Trichotomy','Transitive','Reflexive'],a:0,why:'Exactly one of three possibilities.'}]}},
    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'Subtracting two natural numbers gives a natural number.',a:'sometimes',why:'9 − 4 = 5 is natural, but 4 − 9 = −5 is not.',hint:'Try a smaller number minus a bigger one.'},{s:'Multiplying two integers gives an integer.',a:'always',why:'The integers are closed under multiplication.'},{s:'"Is greater than" is reflexive.',a:'never',why:'No number is greater than itself.'},{s:'The friend of your friend is your friend.',a:'sometimes',why:'It can happen, but it is not guaranteed: friendship is not transitive.'},{s:'For two real numbers, a < b and a > b are both true.',a:'never',why:'The trichotomy law says exactly one is true.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s reasoning and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Rohan',q:'Are the whole numbers closed under division?',lines:['6 ÷ 2 = 3, 8 ÷ 4 = 2, 9 ÷ 3 = 3','All the answers are whole numbers, so they are closed'],wrong:1,reasons:['A few examples do not prove closure; 1 ÷ 2 = 0.5 is a counterexample','He divided wrongly','Division is always closed'],reason:0,fix:'Not closed: 1 ÷ 2 = 0.5 is not a whole number.'},{who:'Keisha',q:'Is "is greater than" symmetric?',lines:['7 > 3','so 3 > 7 as well','Yes, it is symmetric'],wrong:1,reasons:['If 7 > 3, then 3 < 7, not 3 > 7','7 is not greater than 3','She should test 7 > 7'],reason:0,fix:'It is NOT symmetric: 7 > 3 but 3 is not > 7.'},{who:'Andre',q:'Is "lives next door to" transitive?',lines:['A lives next door to B, and B lives next door to C','so A lives next door to C','It is transitive'],wrong:1,reasons:['A and C can live on opposite sides of B, two houses apart','B cannot have two neighbours','"Next door" is reflexive'],reason:0,fix:'Not transitive: A and C can be two houses apart, on either side of B.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire property questions.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var Q=[['Natural numbers under +: closed?','Yes'],['Natural numbers under −: closed?','No'],['Integers under −: closed?','Yes'],['Integers under ÷: closed?','No'],['Even numbers under ×: closed?','Yes'],['Odd numbers under +: closed?','No'],['Whole numbers under ×: closed?','Yes'],['"Is equal to": transitive?','Yes'],['"Is greater than": symmetric?','No'],['"Is a cousin of": symmetric?','Yes'],['"Is taller than": reflexive?','No'],['"Lives in the same parish as": reflexive?','Yes'],['"Is a friend of": transitive?','No'],['"Is older than": transitive?','Yes']],x=Q[Math.floor(Math.random()*Q.length)];return{q:x[0],o:['Yes','No'],a:x[1]==='Yes'?0:1,why:'The answer is '+x[1].toLowerCase()+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent counterexamples and relations.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type a counterexample showing the natural numbers are NOT closed under division. (For example: a ÷ b)',placeholder:'a ÷ b',check:function(v){var m=String(v).replace(/\s/g,'').match(/^(\d+)[÷\/](\d+)$/);if(!m)return{ok:false,msg:'Type it like 3 ÷ 4.'};var a=+m[1],b=+m[2];if(a<1||b<1)return{ok:false,msg:'Both numbers must be natural numbers (1, 2, 3, …).'};var r=a/b;return r%1!==0?{ok:true,msg:'Yes! '+a+' ÷ '+b+' = '+(Math.round(r*1000)/1000)+', which is not a natural number.'}:{ok:false,msg:a+' ÷ '+b+' = '+r+', which IS a natural number. Try one that does not divide exactly.'}}},{q:'Type a counterexample showing the odd numbers are NOT closed under subtraction. (For example: a − b)',placeholder:'a − b',check:function(v){var m=String(v).replace(/\s/g,'').replace(/−/g,'-').match(/^(\d+)-(\d+)$/);if(!m)return{ok:false,msg:'Type it like 5 − 3.'};var a=+m[1],b=+m[2];if(a%2!==1||b%2!==1)return{ok:false,msg:'Both numbers must be odd.'};var r=a-b;return r<1||r%2===0?{ok:true,msg:'Yes! '+a+' − '+b+' = '+r+', which is not an odd natural number.'}:{ok:false,msg:'Hmm, '+a+' − '+b+' = '+r+'. Try again.'}}},{q:'Name a relation between people that is symmetric. (Describe it in words.)',placeholder:'e.g. "is a … of"',check:function(v){var t=String(v).toLowerCase();return /(cousin|classmate|sibling|neighbour|neighbor|friend|married|teammate|same)/.test(t)?{ok:true,msg:'Good choice! If A is related to B this way, B is related to A in the same way.'}:{ok:false,msg:'Think of a relationship that works both ways, such as being cousins or classmates.'}}}]}},
