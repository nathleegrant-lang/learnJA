 glossary:[['Expression','A group of terms joined by + or −, such as 3x + 5.'],['Term','One part of an expression, such as 3x or 5.'],['Like terms','Terms with exactly the same letters and powers, such as 3x and 7x.'],['Distributive property','a(b + c) = ab + ac: the number outside multiplies everything inside the bracket.'],['Expand','Multiply out the brackets.'],['Binomial','An expression with two terms, such as x + 5.'],['Factor','A number or term that divides exactly into another.'],['HCF','Highest common factor: the biggest factor shared by all the numbers or terms.'],['Factorise','Write an expression as a product, by taking out a common factor. The reverse of expanding.']],

  {phase:'engage',name:'The garden plot',title:'Who is right about the garden?',lead:'A school in St. Ann is planning a vegetable garden. It is 7 m wide, and its length is x metres plus an extra 3 metres for a herb strip. Two students write an expression for the area.',

  {phase:'explore',name:'Area model explorer',title:'Explore: the area model',lead:'Every multiplication can be drawn as a rectangle: one side times the other side gives the area. Split the sides into parts, and you can see every piece of the answer.',
   mission:['Try a single bracket first, then two brackets. Watch how the rectangle splits into pieces.','Add up the pieces to get the expanded answer.','Complete all 3 challenges for a star.'],
   patois:'Brok up di rectangle an add up di piece dem.',
   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="amM">Model:</label><select id="amM"><option value="one">A number times a bracket: a(x + b)</option><option value="two">Two brackets: (x + a)(x + b)</option></select></div><div class="controls"><label for="amA">a:</label><input type="range" id="amA" min="1" max="6" value="7"><output class="big amAO"></output><label for="amB">b:</label><input type="range" id="amB" min="1" max="6" value="3"><output class="big amBO"></output></div><div class="scene amSvg"></div><div class="explain amX" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge amN"></span> <strong class="amT"></strong></p><div class="controls"><input type="text" class="amIn" aria-label="Your answer" placeholder="e.g. x^2 + 7x + 10"><button type="button" class="go amC">Check</button></div><div class="fb amFb" aria-live="polite">Type x² as x^2 if you like.</div></div>',
     init:function(box,api){var m=box.querySelector('#amM'),a=box.querySelector('#amA'),b=box.querySelector('#amB');a.max=8;a.value=7;api.nudges(a);api.nudges(b);function draw(){var A=+a.value,B=+b.value,svg,txt;box.querySelector('.amAO').textContent=A;box.querySelector('.amBO').textContent=B;if(m.value==='one'){svg=AREA({cols:[['x',4],[B+'',Math.max(1.4,B*0.5)]],rows:[[A+'',Math.max(1.6,A*0.55)]],cells:[[A+'x',A*B+'']],label:A+' times x plus '+B});txt='<strong>'+A+'(x + '+B+')</strong>: the rectangle is '+A+' tall and (x + '+B+') wide. It splits into two pieces: '+A+' × x = <strong>'+A+'x</strong> and '+A+' × '+B+' = <strong>'+A*B+'</strong>.<br>So '+A+'(x + '+B+') = <strong>'+A+'x + '+A*B+'</strong>. The '+A+' multiplies <em>both</em> parts of the bracket.'}else{svg=AREA({cols:[['x',3.2],[B+'',Math.max(1.2,B*0.45)]],rows:[['x',3.2],[A+'',Math.max(1.2,A*0.45)]],cells:[['x²',B+'x'],[A+'x',A*B+'']],label:'x plus '+A+' times x plus '+B});txt='<strong>(x + '+A+')(x + '+B+')</strong>: the rectangle splits into four pieces: <strong>x²</strong>, <strong>'+B+'x</strong>, <strong>'+A+'x</strong> and <strong>'+A*B+'</strong>.<br>Collect the like terms: '+B+'x + '+A+'x = '+(A+B)+'x. So (x + '+A+')(x + '+B+') = <strong>x² + '+(A+B)+'x + '+A*B+'</strong>.'}box.querySelector('.amSvg').innerHTML=svg;box.querySelector('.amX').innerHTML=txt}m.onchange=function(){if(m.value==='two'&&+a.value>6)a.value=2;a.max=m.value==='one'?8:6;draw()};a.addEventListener('input',draw);b.addEventListener('input',draw);var T=[{t:'Expand 3(x + 4).',a:['3x+12','12+3x']},{t:'Expand (x + 2)(x + 5).',a:['x²+7x+10','x^2+7x+10']},{t:'Expand (x + 3)(x + 4).',a:['x²+7x+12','x^2+7x+12']}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.amN').textContent='All done';box.querySelector('.amT').textContent='You completed every challenge!';box.querySelector('.amC').disabled=true;return}box.querySelector('.amN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.amT').textContent=T[q].t}box.querySelector('.amC').onclick=function(){var v=NORM(box.querySelector('.amIn').value),fb=box.querySelector('.amFb');if(T[q].a.indexOf(v)>=0){fb.className='fb ok amFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.amIn').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no amFb';fb.textContent='Not yet. Set up the area model with these numbers and add up the pieces.'}};draw();task()}},
    {type:'recall',text:'Shanice is right: 7(x + 3) = 7x + 21. The 7 multiplies BOTH the x and the 3, so the herb strip adds 7 × 3 = 21 m², not just 3.'}]},
  {phase:'explain',name:'Teach: expanding brackets',title:'Learn: expanding brackets',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Di number outside multiply everyting inside.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The distributive property',explain:'<p>Try this in your head: what is 7 × 23? It is a bit awkward. But you could think of 23 as 20 + 3. Then 7 × 20 = 140 and 7 × 3 = 21, and 140 + 21 = 161. You have just used the {{distributive property|a(b + c) = ab + ac: the number outside multiplies everything inside}}!</p><p>In algebra, it looks like this: <strong>a(b + c) = ab + ac</strong>. The number outside the bracket must multiply <em>everything</em> inside it. Think of a teacher handing out worksheets: everyone in the group gets one, not just the first person.</p><p>Doing this is called {{expanding|multiplying out the brackets}} the brackets. Look at the garden: 7(x + 3) means 7 rows of (x + 3). The 7 multiplies the x, giving 7x, and it also multiplies the 3, giving 21. So 7(x + 3) = 7x + 21.</p><p>Watch out for negative numbers outside the bracket. The sign goes with the number, so −3(x − 2) means −3 × x and −3 × −2, which gives −3x + 6.</p>',visual:AREA({cols:[['x',4],['3',1.6]],rows:[['7',3.2]],cells:[['7x','21']],label:'7 times x plus 3 as a rectangle split into 7x and 21'}),
     example:{q:'Expand 4(2x − 5) and −3(x − 2).',steps:[{do:'4(2x − 5): 4 × 2x = 8x and 4 × −5 = −20.',why:'The 4 multiplies every term inside the bracket.'},{do:'So 4(2x − 5) = 8x − 20.'},{do:'−3(x − 2): −3 × x = −3x and −3 × −2 = +6.',why:'A negative times a negative is positive.'},{do:'So −3(x − 2) = −3x + 6.'}]},
     mistake:'Multiplying only the first term: 3(x + 4) = 3x + 4. The 3 must multiply the 4 as well: 3x + 12.',
     check:{q:'Expand 5(x + 6).',o:['5x + 6','5x + 30','x + 30'],a:1,why:'5 × x = 5x and 5 × 6 = 30.',hint:'The 5 multiplies both terms.'}},
    {title:'Expanding with powers',explain:'<p>Sometimes the thing outside the bracket includes a letter, like x(x + 4). The distributive property works exactly the same way; you just need the laws of indices for the letters.</p><p>Remember that x × x = x², because a number times itself is squared. And x² × x = x³, because when you multiply powers of the same letter, you <strong>add the indices</strong> (2 + 1 = 3).</p><p>So x(x + 4) = x × x + x × 4 = x² + 4x. And 2a(3a² − 5) means 2a × 3a² and 2a × −5. Multiply the numbers (2 × 3 = 6) and add the powers of a (1 + 2 = 3) to get 6a³, then 2a × −5 = −10a. So 2a(3a² − 5) = 6a³ − 10a.</p>',
     example:{q:'Expand 3x(2x + 5).',steps:[{do:'3x × 2x: multiply the numbers (3 × 2 = 6) and the letters (x × x = x²): 6x².'},{do:'3x × 5 = 15x.'},{do:'So 3x(2x + 5) = 6x² + 15x.'}]},
     mistake:'Writing x × x as 2x. x × x is x squared, x²; 2x means x + x.',
     check:{q:'Expand x(x − 7).',o:['x² − 7x','2x − 7','x² − 7'],a:0,why:'x × x = x² and x × −7 = −7x.',hint:'x times x is x².'}},
    {title:'Multiplying two binomials',explain:'<p>A {{binomial|an expression with two terms, such as x + 5}} is an expression with two terms, like x + 2. What happens when you multiply two of them, like (x + 2)(x + 5)?</p><p>The area model shows it beautifully. Draw a rectangle with sides (x + 2) and (x + 5). Split each side into its two parts, and the rectangle splits into four smaller pieces: x × x = x², x × 5 = 5x, 2 × x = 2x, and 2 × 5 = 10.</p><p>So every term in the first bracket multiplies every term in the second bracket. That gives four answers. Then tidy up by collecting the {{like terms|terms with exactly the same letters and powers}}: 5x + 2x = 7x. So (x + 2)(x + 5) = x² + 7x + 10.</p><p>Some people remember the four multiplications with the word <strong>FOIL</strong>: First, Outer, Inner, Last.</p>',visual:AREA({cols:[['x',3.2],['5',2.2]],rows:[['x',3.2],['2',1.2]],cells:[['x²','5x'],['2x','10']],label:'x plus 2 times x plus 5 as four pieces: x squared, 5x, 2x and 10'}),
     example:{q:'Expand (x + 3)(x − 4).',steps:[{do:'First: x × x = x². Outer: x × −4 = −4x.'},{do:'Inner: 3 × x = 3x. Last: 3 × −4 = −12.',why:'Keep the sign with each number.'},{do:'Collect like terms: −4x + 3x = −x.'},{do:'So (x + 3)(x − 4) = x² − x − 12.'}]},
     mistake:'Only multiplying the firsts and the lasts: (x + 2)(x + 5) = x² + 10. That misses the two middle pieces of the rectangle.',
     check:{q:'Expand (x + 1)(x + 6).',o:['x² + 6','x² + 7x + 6','x² + 6x + 7'],a:1,why:'x² + 6x + x + 6 = x² + 7x + 6.',hint:'Four multiplications, then collect like terms.'}}]}]},
  {phase:'explain',name:'Teach: HCF and factorising',title:'Learn: HCF and factorising',lead:'Next, the reverse journey: taking an expanded expression and putting the brackets back in.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Factorise a di opposite a expand.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'The HCF of numbers and terms',explain:'<p>Before we can put brackets back, we need to find what the terms have in common. You met the {{HCF|highest common factor: the biggest factor shared by all the numbers or terms}} in Grade 8: it is the biggest number that divides exactly into all your numbers. For 12 and 18, the HCF is 6.</p><p>Algebraic terms have common factors too. Think of 6x² as 2 × 3 × x × x, and 9x as 3 × 3 × x. What do they share? A 3 and an x. So the HCF of 6x² and 9x is <strong>3x</strong>.</p><p>A simple way to find the HCF of terms: first find the HCF of the numbers, then, for each letter, take the lowest power that appears in every term. Multiply them together.</p>',
     example:{q:'Find the HCF of 8a³ and 12a².',steps:[{do:'Numbers: the HCF of 8 and 12 is 4.'},{do:'Letters: a³ and a² share a² (the lower power).',why:'a² divides into both a³ and a².'},{do:'So the HCF is 4a².'}]},
     mistake:'Taking the HIGHER power of the letter. a³ does not divide into a², so the common factor is a², the lower power.',
     check:{q:'What is the HCF of 10x and 15x²?',o:['5x','5x²','30x²'],a:0,why:'HCF of 10 and 15 is 5; x and x² share x.',hint:'Numbers first, then the lowest power of x.'}},
    {title:'Factorising: the reverse of expanding',explain:'<p>Expanding takes brackets away: 3(2x + 5) becomes 6x + 15. To {{factorise|write an expression as a product, by taking out a common factor}} means doing the opposite: starting with 6x + 15 and putting the brackets back.</p><p>Here is how to think about it. Find the HCF of the terms; that goes outside the bracket. Then ask, for each term, “what do I multiply the HCF by to get this term?” Those answers go inside the bracket.</p><p>For 6x + 15, the HCF of 6x and 15 is 3. 3 × 2x = 6x, and 3 × 5 = 15. So 6x + 15 = 3(2x + 5).</p><p>The best part: you can always check your answer by expanding it again. If you get back to where you started, you are right.</p>',
     example:{q:'Factorise 12x + 18.',steps:[{do:'The HCF of 12x and 18 is 6.',why:'6 is the biggest number that divides into 12 and 18. Only one term has x, so x is not common.'},{do:'12x ÷ 6 = 2x and 18 ÷ 6 = 3.'},{do:'So 12x + 18 = 6(2x + 3).'},{do:'Check: 6 × 2x + 6 × 3 = 12x + 18 ✓'}]},
     mistake:'Taking out a common factor that is not the highest: 12x + 18 = 2(6x + 9). It is not wrong, but it is not fully factorised; 6x + 9 still has a common factor of 3.',
     check:{q:'Factorise 5x + 20.',o:['5(x + 4)','5(x + 20)','x(5 + 20)'],a:0,why:'The HCF is 5: 5 × x and 5 × 4.',hint:'What goes into both 5x and 20?'}},
    {title:'Factorising with an algebraic common factor',explain:'<p>Sometimes the terms share a letter as well as a number. Then the letter comes outside the bracket too.</p><p>Look at 4x² − 10x. Write each term out: 4x² is 2 × 2 × x × x, and 10x is 2 × 5 × x. They share a 2 and an x, so the HCF is <strong>2x</strong>. Now divide each term by 2x: 4x² ÷ 2x = 2x, and 10x ÷ 2x = 5. Keep the minus sign. So 4x² − 10x = 2x(2x − 5).</p><p>This kind of factorising is used everywhere in algebra: to simplify fractions, to solve equations, and to make formulas neater. Always finish by expanding to check.</p>',
     example:{q:'Factorise 3a² + 9a.',steps:[{do:'HCF: the numbers 3 and 9 share 3; a² and a share a. So the HCF is 3a.'},{do:'3a² ÷ 3a = a and 9a ÷ 3a = 3.'},{do:'So 3a² + 9a = 3a(a + 3).'},{do:'Check: 3a × a + 3a × 3 = 3a² + 9a ✓'}]},
     mistake:'Leaving a 0 or forgetting a term inside the bracket. If a whole term is taken out, a 1 is left behind: x² + x = x(x + 1), not x(x).',
     check:{q:'Factorise x² + 6x.',o:['x(x + 6)','6(x² + x)','x(6x)'],a:0,why:'Both terms share x: x × x and x × 6.',hint:'What do x² and 6x have in common?'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own. Type x² as x^2 if you like.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Expanding one bracket',text:'a(b + c) = ab + ac. The outside term multiplies EVERY term inside. For example, −3(x − 2) = −3x + 6.'},{title:'With powers',text:'x × x = x²; add the indices for the same letter. For example, 2a(3a² − 5) = 6a³ − 10a.'},{title:'Two brackets',text:'Every term times every term (FOIL), then collect like terms. (x + 2)(x + 5) = x² + 7x + 10.'},{title:'Factorising',text:'Take out the HCF; divide each term by it to fill the bracket. 4x² − 10x = 2x(2x − 5). Check by expanding.'}]},
    {type:'guided',star:true,items:[
     {type:'worked',q:'Expand and simplify 2(x + 3) + 4(x − 1).',steps:[{do:'2(x + 3) = 2x + 6.'},{do:'4(x − 1) = 4x − 4.'},{do:'Add: 2x + 6 + 4x − 4 = 6x + 2.',why:'Collect the x terms and the number terms separately.'}]},
     {type:'fill',q:'Expand (x + 4)(x + 3).',steps:[{text:'x × x = x², x × 3 = 3x, 4 × x = 4x, 4 × 3 = 12.'},{text:'Collect like terms: 3x + 4x = ___x',blank:true,a:7,hint:'Add the x terms.'},{text:'(x + 4)(x + 3) = x² + 7x + 12.'}],sol:'3x + 4x = 7x.'},
     {type:'own',q:'Factorise 8x + 12. Type it like 4(2x + 3).',a:['4(2x+3)','4(3+2x)'],hint:'The HCF of 8 and 12 is 4.',sol:'4(2x + 3).'},
     {type:'own',q:'Factorise 5x² − 15x.',a:['5x(x-3)'],hint:'The HCF is 5x.',sol:'5x(x − 3).'}]}]},
  {phase:'elaborate',name:'Challenge Zone',title:'Challenge Zone: put your skills to work',lead:'Eight different challenges. Pick the ones that interest you, in any order.',
   mission:['Choose a challenge card.','Complete it, then come back and pick another.','Complete any 4 for a star. Complete all 8 to become a Challenge Champion.'],
