 steps:[

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="daS">Data set:</label><select id="daS"><option value="marks">CSEC mock scores</option><option value="rain">Monthly rainfall</option><option value="shoes">Shoe sizes</option></select><label><input type="checkbox" id="daX" checked> Include the largest value</label><label for="daV">Above value:</label><input type="number" id="daV" value="25" style="width:80px"></div><div class="tile daList" aria-live="polite"></div><div class="scene daSvg"></div><div class="tile daOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge daN"></span> <strong class="daQ"></strong></p><div class="controls"><input type="number" step="0.01" class="daIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go daC">Check</button></div><div class="fb daFb" aria-live="polite">Use the analyser to help you.</div></div>',
     init:function(box,api){var S=box.querySelector('#daS'),Xc=box.querySelector('#daX'),V=box.querySelector('#daV');function draw(){var d=DS[S.value][1].slice().sort(function(a,b){return a-b});if(!Xc.checked)d=d.slice(0,-1);var q=QS(d),n=d.length,sum=d.reduce(function(a,b){return a+b},0),v=+V.value,above=d.filter(function(x){return x>v}).length;box.querySelector('.daList').innerHTML='<strong>'+DS[S.value][0]+'</strong> (n = '+n+', in order): '+d.join(', ');box.querySelector('.daSvg').innerHTML=BOX(q.s,q,'Box plot of '+DS[S.value][0]);box.querySelector('.daOut').innerHTML='<strong>Mean</strong> = '+sum+' ÷ '+n+' = '+fs1(sum/n)+'  |  <strong>Median</strong> = '+fs1(q.med)+'  |  <strong>Mode</strong> = '+MODE(d)+'<br><strong>Range</strong> = '+d[n-1]+' − '+d[0]+' = '+(d[n-1]-d[0])+'  |  <strong>Q1</strong> = '+fs1(q.q1)+', <strong>Q3</strong> = '+fs1(q.q3)+'<br><strong>IQR</strong> = '+fs1(q.q3-q.q1)+'  |  <strong>Semi-interquartile range</strong> = '+fs1((q.q3-q.q1)/2)+'<br><strong>Above '+v+':</strong> '+above+' of '+n+' = '+fs1(above/n*100)+'%'}[S,Xc,V].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var Q=[{t:'Mock scores (with the 45): what is the median?',a:21},{t:'Mock scores (with the 45): what is the interquartile range?',a:13},{t:'Mock scores (with the 45): what percentage of scores are above 25, to 2 decimal places?',a:27.27}],qq=api.get('k')||0;function task(){if(qq>=Q.length){box.querySelector('.daN').textContent='All done';box.querySelector('.daQ').textContent='You completed every challenge!';box.querySelector('.daC').disabled=true;return}box.querySelector('.daN').textContent='Challenge '+(qq+1)+' of 3';box.querySelector('.daQ').textContent=Q[qq].t}box.querySelector('.daC').onclick=function(){var v=parseFloat(box.querySelector('.daIn').value),fb=box.querySelector('.daFb');if(Math.abs(v-Q[qq].a)<0.015){fb.className='fb ok daFb';fb.textContent='✓ Correct!';qq++;api.set('k',qq);box.querySelector('.daIn').value='';task();if(qq===Q.length)api.complete()}else{fb.className='fb no daFb';fb.textContent='Not yet. Choose the mock scores, include the 45, and read the results.'}};draw();task()}},

  {phase:'explain',name:'Teach: data and averages',title:'Learn: data, diagrams and averages',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Order di data first, every time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Samples, populations and levels of measurement',explain:'<p>A {{population|the whole group being studied}} is the whole group you want to know about, such as every Grade 10 student in Jamaica. It is usually too big to survey everyone, so we take a {{sample|a smaller group chosen from the population}}: a smaller group, chosen fairly. A number describing a population is a {{parameter|a number describing a population}}; the same number worked out from a sample is a {{statistic|a number calculated from a sample}}, an estimate of the parameter.</p><p>The syllabus also asks about four <strong>levels of measurement</strong>. {{Nominal|categories with no order}} data are categories with no order (favourite sport). {{Ordinal|categories with an order}} data have an order but uneven gaps (grades A, B, C). {{Interval|equal gaps, no true zero}} data have equal gaps but no true zero (temperature in °C). {{Ratio|equal gaps and a true zero}} data have equal gaps and a true zero (height, mass, money).</p><p>The level matters, because it decides which average makes sense: you cannot find the mean of favourite sports!</p>',
     example:{q:'Classify: (a) parishes students live in; (b) positions in a race (1st, 2nd, 3rd); (c) times to run 100 m.',steps:[{do:'(a) Categories, no order: nominal.'},{do:'(b) Ordered, but the gaps between places are not equal: ordinal.'},{do:'(c) Numbers with a true zero (0 seconds): ratio.'}]},
     mistake:'Calling ordered categories like grades "interval". The gap between A and B is not a fixed amount, so grades are ordinal.',
     check:{q:'Temperature in °C is…',o:['interval','ratio','nominal'],a:0,why:'Equal gaps, but 0 °C is not "no temperature".',hint:'Is there a true zero?'}},
    {title:'Frequency tables, pie charts and bar charts',explain:'<p>A <strong>frequency table</strong> organises raw data: list each value (or category) and count how often it appears, using tally marks. The frequencies should add up to the total number of data values.</p><p>A <strong>bar chart</strong> shows frequencies as bars of equal width, with gaps between them (for discrete data). Label both axes and give a title.</p><p>A <strong>pie chart</strong> shows each category as a share of a circle. Each angle = <strong>(frequency ÷ total) × 360°</strong>. Check that the angles add up to 360°. Pie charts are good for showing proportions, while bar charts are better for comparing exact amounts.</p>',visual:PIE(),
     example:{q:'36 students chose their favourite sport: cricket 12, football 15, netball 6, athletics 3. Find the pie-chart angles.',steps:[{do:'Each student is 360 ÷ 36 = 10°.'},{do:'Cricket 120°, football 150°, netball 60°, athletics 30°.'},{do:'Check: 120 + 150 + 60 + 30 = 360° ✓'}]},
     mistake:'Using percentages as degrees. A frequency of 12 out of 36 is 33.3%, but the angle is 120°.',
     check:{q:'In a pie chart of 60 people, 15 chose red. What angle is red?',o:['90°','15°','25°'],a:0,why:'15/60 × 360 = 90°.',hint:'Fraction × 360.'}},
    {title:'Mean, median and mode, and choosing the right one',explain:'<p>The <strong>mean</strong> = sum ÷ number of values. The <strong>median</strong> is the middle value when the data is in <strong>order</strong> (with an even number of values, it is halfway between the middle two). The <strong>mode</strong> is the most frequent value.</p><p>Which should you use? The syllabus asks you to decide:</p><p>• Use the <strong>mean</strong> when the data is numerical and has no extreme values: it uses every value.<br>• Use the <strong>median</strong> when there are <strong>extreme values</strong> (outliers), like the score of 45, or house prices and salaries: it is not pulled by them.<br>• Use the <strong>mode</strong> for nominal data, or when the most common value matters, such as which shoe size a shop should stock most. It also suits data with <strong>recurring values</strong>.</p>',
     example:{q:'Five salaries at a small business: $60,000, $65,000, $70,000, $72,000 and $500,000 a month. Which average best describes a typical worker?',steps:[{do:'Mean = $767,000 ÷ 5 = $153,400: higher than four of the five salaries!'},{do:'Median = $70,000: the middle value.'},{do:'The median is best: the $500,000 (perhaps the owner) is an extreme value.'}]},
     mistake:'Always using the mean. When there are extreme values, the mean can be misleading.',
     check:{q:'A shoe shop wants to know which size to stock most. Which average?',o:['Mode','Mean','Median'],a:0,why:'The most common size.',hint:'Most frequent.'}}]}]},
  {phase:'explain',name:'Teach: spread and inference',title:'Learn: spread, standard deviation and making inferences',lead:'Next, measuring how spread out data is, comparing data sets, and drawing conclusions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Average tell yuh di middle. Spread tell yuh how consistent.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Range, quartiles and the interquartile range',explain:'<p>Two classes can have the same average but very different results: one with everyone near the middle, the other with some very high and some very low. That is why we also measure <strong>spread</strong>.</p><p>The <strong>range</strong> = largest − smallest. It is quick, but one extreme value changes it a lot.</p><p>The {{quartiles|Q1 and Q3 split ordered data into quarters}} split the ordered data into four equal parts. The <strong>median</strong> splits it in half. The <strong>lower quartile Q1</strong> is the median of the lower half, and the <strong>upper quartile Q3</strong> is the median of the upper half. The {{interquartile range|Q3 − Q1, the spread of the middle half}} is <strong>IQR = Q3 − Q1</strong>, the spread of the middle 50% of the data. The {{semi-interquartile range|half the IQR}} is <strong>(Q3 − Q1) ÷ 2</strong>. The IQR ignores the extreme values at each end, so it is more reliable than the range.</p>',visual:BOX([12,15,15,18,20,21,22,25,28,30,45],QS([12,15,15,18,20,21,22,25,28,30,45]),'Box plot of the mock scores'),
     example:{q:'Find the quartiles and IQR of the mock scores 12, 15, 15, 18, 20, 21, 22, 25, 28, 30, 45.',steps:[{do:'There are 11 values; the median is the 6th: 21.'},{do:'Lower half: 12, 15, 15, 18, 20, so Q1 = 15. Upper half: 22, 25, 28, 30, 45, so Q3 = 28.'},{do:'IQR = 28 − 15 = 13; semi-interquartile range = 6.5. (The range is 33, inflated by the 45.)'}]},
     mistake:'Finding quartiles from unordered data. Always order the data first.',
     check:{q:'Q1 = 20 and Q3 = 34. What is the semi-interquartile range?',o:['7','14','27'],a:0,why:'(34 − 20) ÷ 2.',hint:'Half the IQR.'}},
    {title:'Comparing data sets with standard deviation',explain:'<p>The {{standard deviation|how spread out data is around the mean}} measures how spread out the data is around the mean. You will <strong>not</strong> be asked to calculate it (the syllabus says so), but you must use it to <strong>compare</strong> data sets.</p><p>The rule is simple: a <strong>smaller</strong> standard deviation means the data is more <strong>consistent</strong> (clustered closely around the mean). A <strong>larger</strong> standard deviation means the data is more <strong>spread out</strong> (more variable).</p><p>For example, two cricketers both average 40 runs. Batsman A has a standard deviation of 5; Batsman B has 25. A scores close to 40 almost every innings; B scores a lot sometimes and very little at other times. A selector who wants reliability picks A.</p>',
     example:{q:'Two classes took the same test. Class P: mean 62, standard deviation 8. Class Q: mean 62, standard deviation 15. Compare them.',steps:[{do:'The means are equal, so on average both did equally well.'},{do:'Class P’s standard deviation is smaller, so its marks are more consistent.'},{do:'Class Q’s marks are more spread out: some very high and some very low.'}]},
     mistake:'Thinking a larger standard deviation means higher marks. It means MORE SPREAD, not bigger values.',
     check:{q:'Which data set is more consistent?',o:['Standard deviation 3','Standard deviation 12','You cannot tell'],a:0,why:'Smaller standard deviation, less spread.',hint:'Smaller is more consistent.'}},
    {title:'Proportions above a value, and making inferences',explain:'<p>The syllabus asks you to find the <strong>proportion or percentage</strong> of the data above or below a given value. Count how many values are above (or below) it, divide by the total, and multiply by 100 for a percentage. For the mock scores, 3 of the 11 scores are above 25: 3/11 ≈ 27.27%.</p><p>From a frequency table, add up the frequencies of the values above (or below) the given value.</p><p>Finally, <strong>make inferences</strong>: use the statistics to draw sensible conclusions, and say how sure you can be. A conclusion from a small or biased sample may not be true of the whole population. Good inferences compare an average AND a measure of spread, and mention the context.</p>',
     example:{q:'Shoe sizes: 6, 7, 7, 8, 8, 8, 9, 9, 10, 11. What percentage of the class wears size 9 or larger? What could a shop infer?',steps:[{do:'Sizes 9 or more: 9, 9, 10, 11, which is 4 of 10 students.'},{do:'4 ÷ 10 × 100 = 40%.'},{do:'Inference: about 40% of similar students need size 9 or larger, and size 8 (the mode) should be stocked most, though the sample is small.'}]},
     mistake:'Making a big claim from a tiny sample. Say how reliable your inference is.',
     check:{q:'In a frequency table, 6 of 24 students scored above 80. What percentage is that?',o:['25%','6%','30%'],a:0,why:'6 ÷ 24 × 100.',hint:'Fraction × 100.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',
   mission:['Read the key facts.','Step through "I do", then fill in the missing value in "We do".','Solve the "You do" questions on your own.'],
   patois:'Fus yuh watch, den wi do it togedda, den yuh do it yuhself.',
   blocks:[{type:'facts',facts:[{title:'Data',text:'Population (parameter) vs sample (statistic). Levels: nominal, ordinal, interval, ratio.'},{title:'Diagrams',text:'Frequency table with tallies. Bar chart: equal widths, gaps. Pie chart angle = frequency ÷ total × 360°.'},{title:'Averages',text:'Mean: no extremes. Median: extreme values. Mode: nominal data, or the most common value.'},{title:'Spread and inference',text:'Range = max − min. IQR = Q3 − Q1; semi-IQR = half. Smaller standard deviation = more consistent. % above = count ÷ total × 100.'}]},

    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire statistics.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var d=[R(1,9),R(1,9),R(1,9),R(1,9),R(1,9)].sort(function(a,b){return a-b}),m=d[2],sh=d.slice();sh.sort(function(){return Math.random()-0.5});var o=[String(m)];[String(sh[2]),String(Math.round(d.reduce(function(a,b){return a+b},0)/5*10)/10),String(m+1)].forEach(function(z){if(o.length<3&&o.indexOf(z)<0)o.push(z)});return{q:'Median of '+sh.join(', ')+'?',o:o,a:0,why:'Order first: '+d.join(', ')+'.'}}if(r===1){var T=[24,36,40,60,72,90][R(0,5)],f=T/[2,3,4,6][R(0,3)];return{q:f+' out of '+T+' in a pie chart. Angle?',o:[fs1(f/T*360)+'°',fs1(f)+'°',fs1(f/T*100)+'°'],a:0,why:f+'/'+T+' × 360.'}}var a=R(5,20),b=a+R(4,20);return{q:'Q1 = '+a+', Q3 = '+b+'. IQR?',o:[String(b-a),String((b-a)/2),String(a+b)],a:0,why:b+' − '+a+'.'}}}},
