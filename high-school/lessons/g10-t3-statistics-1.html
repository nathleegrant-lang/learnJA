 curriculum:{framework:'CSEC Mathematics (examinations from May–June 2027)',term:'Grade 10, Term 3',unit:'Module 2: Statistics 1',strand:'Statistics',standard:'Module 2, Statistics 1: appreciate the advantages and disadvantages of the various ways of presenting and representing data; appreciate the necessity for taking precautions in collecting, analysing and interpreting statistical data, and making inferences; understand the four levels/scales of measurement that inform the collection of data.',
  objectives:['1.1 differentiate between sample and population attributes;','1.2 construct a frequency table for a given set of data;','1.3 construct statistical diagrams;','1.4 determine measures of central tendency for raw ungrouped data;','1.5 determine when it is most appropriate to use the mean, median and mode as the average for a set of data;','1.6 determine the measures of dispersion (spread) for raw, ungrouped data;','1.7 analyse statistical diagrams;','1.8 use standard deviation to compare sets of ungrouped data;','1.9 determine the proportion or percentage of the sample above or below a given value from raw ungrouped data or frequency table;','1.11 make inference(s) from statistics.'],
  focus:'Sample statistics and population parameters; nominal, ordinal, interval and ratio scales; frequency tables for discrete, ungrouped data; pie charts and bar charts; mean, median and mode; choosing an average (sets with extreme or recurring values); range, interquartile range and semi-interquartile range; comparing spread using a given standard deviation (no calculation required); percentages above or below a value; making inferences.',
  note:'Source: CXC CSEC Mathematics Syllabus, CXC 05/G/SYLL 16 (amended 2025), Module 2, Section 1 (1.1–1.9, 1.11). Objective 1.10 (sample spaces and simple probability) is taught in the Probability lesson. The syllabus suggests using the class as a population and taking samples, and discussing when to use each level of measurement.'},
 glossary:[['Population','The whole group being studied.'],['Sample','A smaller group chosen from the population.'],['Parameter','A number that describes a population.'],['Statistic','A number calculated from a sample.'],['Nominal','Categories with no order, such as favourite sport.'],['Ordinal','Categories with an order, such as grades A, B, C.'],['Interval','Numbers with equal gaps but no true zero, such as temperature in °C.'],['Ratio','Numbers with equal gaps and a true zero, such as height or mass.'],['Quartiles','Q1 (lower quartile) and Q3 (upper quartile) split ordered data into quarters.'],['Interquartile range (IQR)','Q3 − Q1: the spread of the middle half of the data.'],['Semi-interquartile range','Half the IQR: (Q3 − Q1) ÷ 2.'],['Standard deviation','A measure of how spread out data is around the mean.']],

  misconceptions:['Believing that "the average" always means the mean, and that it always describes a typical value. With extreme values, the mean can be misleading; the median is often the fairer choice.','Finding the median without putting the data in order first.','Thinking the mean is always the best average.','Thinking a bigger standard deviation means bigger values (it means more spread).','Calculating pie-chart angles as percentages instead of degrees.','Calling grades (A, B, C) interval data.'],

  {phase:'explore',name:'Picture it: what is typical?',title:'Picture it: which average tells the truth?',lead:'Statistics can tell the truth or mislead, depending on which number you choose. Start here: decide which arrow marks a typical worker’s pay, then move the owner’s salary and watch the averages.',

  {phase:'explore',name:'Data analyser',title:'Explore: the data analyser',lead:'Choose a data set. The analyser orders it and works out every measure CSEC asks for, with a box plot showing the quartiles. Switch the largest value on and off to see what an outlier does.',
   mission:['For the mock scores, switch the 45 off. Which measures change most?','Compare the spread of the three data sets.','Complete all 3 challenges for a star.'],

   blocks:[{type:'custom',star:true,html:'<div class="controls"><label for="daS">Data set:</label><select id="daS"><option value="marks">CSEC mock scores</option><option value="rain">Monthly rainfall</option><option value="shoes">Shoe sizes</option></select><label><input type="checkbox" id="daX" checked> Include the largest value</label><label for="daV">Above value:</label><input type="number" id="daV" value="25" style="width:80px"></div><div class="tile daList" aria-live="polite"></div><div class="scene daSvg"></div><div class="tile daOut" aria-live="polite"></div><div class="tile"><p style="margin:0"><span class="badge daN"></span> <strong class="daQ"></strong></p><div class="controls"><input type="number" step="0.01" class="daIn" aria-label="Your answer" placeholder="answer"><button type="button" class="go daC">Check</button></div><div class="fb daFb" aria-live="polite">Use the analyser to help you.</div></div>',
     init:function(box,api){var S=box.querySelector('#daS'),Xc=box.querySelector('#daX'),V=box.querySelector('#daV');function draw(){var d=DS[S.value][1].slice().sort(function(a,b){return a-b});if(!Xc.checked)d=d.slice(0,-1);var q=QS(d),n=d.length,sum=d.reduce(function(a,b){return a+b},0),v=+V.value,above=d.filter(function(x){return x>v}).length;box.querySelector('.daList').innerHTML='<strong>'+DS[S.value][0]+'</strong> (n = '+n+', in order): '+d.join(', ');box.querySelector('.daSvg').innerHTML=BOX(q.s,q,'Box plot of '+DS[S.value][0]);box.querySelector('.daOut').innerHTML='<strong>Mean</strong> = '+sum+' ÷ '+n+' = '+fs1(sum/n)+'  |  <strong>Median</strong> = '+fs1(q.med)+'  |  <strong>Mode</strong> = '+MODE(d)+'<br><strong>Range</strong> = '+d[n-1]+' − '+d[0]+' = '+(d[n-1]-d[0])+'  |  <strong>Q1</strong> = '+fs1(q.q1)+', <strong>Q3</strong> = '+fs1(q.q3)+'<br><strong>IQR</strong> = '+fs1(q.q3-q.q1)+'  |  <strong>Semi-interquartile range</strong> = '+fs1((q.q3-q.q1)/2)+'<br><strong>Above '+v+':</strong> '+above+' of '+n+' = '+fs1(above/n*100)+'%'}[S,Xc,V].forEach(function(e){e.addEventListener('input',draw);e.addEventListener('change',draw)});var Q=[{t:'Mock scores (with the 45): what is the median?',a:21},{t:'Mock scores (with the 45): what is the interquartile range?',a:13},{t:'Mock scores (with the 45): what percentage of scores are above 25, to 2 decimal places?',a:27.27}],qq=api.get('k')||0;function task(){if(qq>=Q.length){box.querySelector('.daN').textContent='All done';box.querySelector('.daQ').textContent='You completed every challenge!';box.querySelector('.daC').disabled=true;return}box.querySelector('.daN').textContent='Challenge '+(qq+1)+' of 3';box.querySelector('.daQ').textContent=Q[qq].t}box.querySelector('.daC').onclick=function(){var v=parseFloat(box.querySelector('.daIn').value),fb=box.querySelector('.daFb');if(Math.abs(v-Q[qq].a)<0.015){fb.className='fb ok daFb';fb.textContent='✓ Correct!';qq++;api.set('k',qq);box.querySelector('.daIn').value='';task();if(qq===Q.length)api.complete()}else{fb.className='fb no daFb';fb.textContent='Not yet. Choose the mock scores, include the 45, and read the results.'}};draw();task()}},
    {type:'recall',text:'The median (21) is the most typical value. The mean (22.8) is pulled up by the one high score of 45, and the mode (15) is just two students. With an extreme value, the median is usually the best average.'}]},
  {phase:'explain',name:'Teach: data and averages',title:'Learn: data, diagrams and averages',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Order di data first, every time.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Samples, populations and levels of measurement',explain:PIC('The Ministry of Education wants to know how many hours Grade 10 students in Jamaica spend on homework each night. There are tens of thousands of them: far too many to ask everyone. So it chooses a sample of a few hundred students from schools across the island, and uses their answers to estimate the whole population.',SCN['Samples, populations and levels of measurement'])+'<p>A {{population|the whole group being studied}} is the whole group you want to know about, such as every Grade 10 student in Jamaica. It is usually too big to survey everyone, so we take a {{sample|a smaller group chosen from the population}}: a smaller group, chosen fairly. A number describing a population is a {{parameter|a number describing a population}}; the same number worked out from a sample is a {{statistic|a number calculated from a sample}}, an estimate of the parameter.</p><p>The syllabus also asks about four <strong>levels of measurement</strong>. {{Nominal|categories with no order}} data are categories with no order (favourite sport). {{Ordinal|categories with an order}} data have an order but uneven gaps (grades A, B, C). {{Interval|equal gaps, no true zero}} data have equal gaps but no true zero (temperature in °C). {{Ratio|equal gaps and a true zero}} data have equal gaps and a true zero (height, mass, money).</p><p>The level matters, because it decides which average makes sense: you cannot find the mean of favourite sports!</p>'+WHY('Why can a small sample tell us about a big population? If the sample is chosen fairly (every student has a chance to be picked, and no group is left out), it tends to look like a smaller copy of the population. A biased sample, such as asking only students at one school, can give a misleading picture.')+WORK('<strong>STATIN</strong> (the Statistical Institute of Jamaica) runs surveys of households across the island. <strong>Opinion pollsters</strong> ask a sample of voters. <strong>Market researchers</strong> sample customers before a company launches a new product.'),
     example:{q:'Classify: (a) parishes students live in; (b) positions in a race (1st, 2nd, 3rd); (c) times to run 100 m.',steps:[{do:'(a) Categories, no order: nominal.'},{do:'(b) Ordered, but the gaps between places are not equal: ordinal.'},{do:'(c) Numbers with a true zero (0 seconds): ratio.'}]},
     mistake:'Calling ordered categories like grades "interval". The gap between A and B is not a fixed amount, so grades are ordinal.',
     check:{q:'Temperature in °C is…',o:['interval','ratio','nominal'],a:0,why:'Equal gaps, but 0 °C is not "no temperature".',hint:'Is there a true zero?'}},
    {title:'Frequency tables, pie charts and bar charts',explain:PIC('A Grade 10 class votes for its favourite sport. The teacher writes a tally on the board: cricket 12, football 15, netball 6, athletics 3. The tally becomes a frequency table, and the table becomes a picture: a bar chart to compare the sports, or a pie chart to show each sport’s share of the class.',SCN['Frequency tables, pie charts and bar charts'])+'<p>A <strong>frequency table</strong> organises raw data: list each value (or category) and count how often it appears, using tally marks. The frequencies should add up to the total number of data values.</p><p>A <strong>bar chart</strong> shows frequencies as bars of equal width, with gaps between them (for discrete data). Label both axes and give a title.</p><p>A <strong>pie chart</strong> shows each category as a share of a circle. Each angle = <strong>(frequency ÷ total) × 360°</strong>. Check that the angles add up to 360°. Pie charts are good for showing proportions, while bar charts are better for comparing exact amounts.</p>'+WHY('Why multiply by 360° for a pie chart? A full circle is 360°, and the whole class must fill the whole circle. Each student gets the same slice: 360 ÷ 36 = 10°. So cricket, with 12 students, gets 12 × 10 = 120°. The angles always add up to 360°, which is a quick check.')+WORK('<strong>Journalists and news graphics teams</strong> turn data into charts for the public. <strong>Business managers</strong> show sales by product in pie and bar charts. <strong>Health officials</strong> chart cases by parish to decide where clinics are needed.'),visual:PIE(),
     example:{q:'36 students chose their favourite sport: cricket 12, football 15, netball 6, athletics 3. Find the pie-chart angles.',steps:[{do:'Each student is 360 ÷ 36 = 10°.'},{do:'Cricket 120°, football 150°, netball 60°, athletics 30°.'},{do:'Check: 120 + 150 + 60 + 30 = 360° ✓'}]},
     mistake:'Using percentages as degrees. A frequency of 12 out of 36 is 33.3%, but the angle is 120°.',
     check:{q:'In a pie chart of 60 people, 15 chose red. What angle is red?',o:['90°','15°','25°'],a:0,why:'15/60 × 360 = 90°.',hint:'Fraction × 360.'}},
    {title:'Mean, median and mode, and choosing the right one',explain:PIC('Remember the small business: four workers earn between $60,000 and $72,000 a month, and the owner earns $500,000. The mean is $153,400, higher than four of the five salaries. The median, $70,000, sits right in the middle of the workers. Same data, very different "averages".',SCN['Mean, median and mode, and choosing the right one'])+'<p>The <strong>mean</strong> = sum ÷ number of values. The <strong>median</strong> is the middle value when the data is in <strong>order</strong> (with an even number of values, it is halfway between the middle two). The <strong>mode</strong> is the most frequent value.</p><p>Which should you use? The syllabus asks you to decide:</p><p>• Use the <strong>mean</strong> when the data is numerical and has no extreme values: it uses every value.<br>• Use the <strong>median</strong> when there are <strong>extreme values</strong> (outliers), like the score of 45, or house prices and salaries: it is not pulled by them.<br>• Use the <strong>mode</strong> for nominal data, or when the most common value matters, such as which shoe size a shop should stock most. It also suits data with <strong>recurring values</strong>.</p>'+WHY('Why is the median not pulled by extreme values? The median only depends on POSITION: it is the middle value when the data is in order. Making the largest value even larger does not change which value is in the middle. The mean adds up every value, so one huge value pulls it up.')+WORK('<strong>Real estate agents</strong> report median house prices, because a few mansions would distort the mean. <strong>Trade unions and employers</strong> argue about mean and median pay. <strong>Shop owners</strong> use the mode to decide which size or flavour to stock most.'),
     example:{q:'Five salaries at a small business: $60,000, $65,000, $70,000, $72,000 and $500,000 a month. Which average best describes a typical worker?',steps:[{do:'Mean = $767,000 ÷ 5 = $153,400: higher than four of the five salaries!'},{do:'Median = $70,000: the middle value.'},{do:'The median is best: the $500,000 (perhaps the owner) is an extreme value.'}]},
     mistake:'Always using the mean. When there are extreme values, the mean can be misleading.',
     check:{q:'A shoe shop wants to know which size to stock most. Which average?',o:['Mode','Mean','Median'],a:0,why:'The most common size.',hint:'Most frequent.'}}]}]},
  {phase:'explain',name:'Teach: spread and inference',title:'Learn: spread, standard deviation and making inferences',lead:'Next, measuring how spread out data is, comparing data sets, and drawing conclusions.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Average tell yuh di middle. Spread tell yuh how consistent.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Range, quartiles and the interquartile range',explain:PIC('Two classes sit the same test, and both have a median of 25 marks. In one class, almost everyone scored between 22 and 28. In the other, marks ranged from 5 to 45. The average is the same, but the classes are very different. Spread tells that part of the story.',SCN['Range, quartiles and the interquartile range'])+'<p>Two classes can have the same average but very different results: one with everyone near the middle, the other with some very high and some very low. That is why we also measure <strong>spread</strong>.</p><p>The <strong>range</strong> = largest − smallest. It is quick, but one extreme value changes it a lot.</p><p>The {{quartiles|Q1 and Q3 split ordered data into quarters}} split the ordered data into four equal parts. The <strong>median</strong> splits it in half. The <strong>lower quartile Q1</strong> is the median of the lower half, and the <strong>upper quartile Q3</strong> is the median of the upper half. The {{interquartile range|Q3 − Q1, the spread of the middle half}} is <strong>IQR = Q3 − Q1</strong>, the spread of the middle 50% of the data. The {{semi-interquartile range|half the IQR}} is <strong>(Q3 − Q1) ÷ 2</strong>. The IQR ignores the extreme values at each end, so it is more reliable than the range.</p>'+WHY('Why use quartiles instead of just the range? The range uses only the two most extreme values, so one unusual mark can change it a lot. The quartiles split the ordered data into quarters, and the IQR measures the spread of the middle half, ignoring the most extreme quarter at each end. So it is a fairer measure of how spread out most of the data is.')+WORK('<strong>Teachers</strong> compare the spread of marks between classes. <strong>Doctors</strong> use quartiles on growth charts to see whether a child’s height is typical for their age. <strong>Engineers</strong> check that parts made in a factory vary as little as possible.'),visual:BOX([12,15,15,18,20,21,22,25,28,30,45],QS([12,15,15,18,20,21,22,25,28,30,45]),'Box plot of the mock scores'),
     example:{q:'Find the quartiles and IQR of the mock scores 12, 15, 15, 18, 20, 21, 22, 25, 28, 30, 45.',steps:[{do:'There are 11 values; the median is the 6th: 21.'},{do:'Lower half: 12, 15, 15, 18, 20, so Q1 = 15. Upper half: 22, 25, 28, 30, 45, so Q3 = 28.'},{do:'IQR = 28 − 15 = 13; semi-interquartile range = 6.5. (The range is 33, inflated by the 45.)'}]},
     mistake:'Finding quartiles from unordered data. Always order the data first.',
     check:{q:'Q1 = 20 and Q3 = 34. What is the semi-interquartile range?',o:['7','14','27'],a:0,why:'(34 − 20) ÷ 2.',hint:'Half the IQR.'}},
    {title:'Comparing data sets with standard deviation',explain:PIC('Two batsmen both average 40 runs over five innings. Batsman A scored 38, 42, 40, 39 and 41: almost the same every time. Batsman B scored 5, 80, 10, 75 and 30: brilliant one day, out cheaply the next. Same mean, very different players.',SCN['Comparing data sets with standard deviation'])+'<p>The {{standard deviation|how spread out data is around the mean}} measures how spread out the data is around the mean. You will <strong>not</strong> be asked to calculate it (the syllabus says so), but you must use it to <strong>compare</strong> data sets.</p><p>The rule is simple: a <strong>smaller</strong> standard deviation means the data is more <strong>consistent</strong> (clustered closely around the mean). A <strong>larger</strong> standard deviation means the data is more <strong>spread out</strong> (more variable).</p><p>For example, two cricketers both average 40 runs. Batsman A has a standard deviation of 5; Batsman B has 25. A scores close to 40 almost every innings; B scores a lot sometimes and very little at other times. A selector who wants reliability picks A.</p>'+WHY('Why does a small standard deviation mean "consistent"? The standard deviation measures how far, on average, the values are from the mean. When the values cluster closely around the mean (like Batsman A), the distances are small, so the standard deviation is small. When the values are scattered (like Batsman B), it is large.')+WORK('<strong>Cricket selectors and coaches</strong> look for consistency as well as a high average. <strong>Factory quality controllers</strong> want a small standard deviation in the weight of every bag of flour. <strong>Investors</strong> treat a large standard deviation in returns as a sign of risk.'),
     example:{q:'Two classes took the same test. Class P: mean 62, standard deviation 8. Class Q: mean 62, standard deviation 15. Compare them.',steps:[{do:'The means are equal, so on average both did equally well.'},{do:'Class P’s standard deviation is smaller, so its marks are more consistent.'},{do:'Class Q’s marks are more spread out: some very high and some very low.'}]},
     mistake:'Thinking a larger standard deviation means higher marks. It means MORE SPREAD, not bigger values.',
     check:{q:'Which data set is more consistent?',o:['Standard deviation 3','Standard deviation 12','You cannot tell'],a:0,why:'Smaller standard deviation, less spread.',hint:'Smaller is more consistent.'}},
    {title:'Proportions above a value, and making inferences',explain:PIC('A shoe shop owner records the shoe sizes of 10 students: 6, 7, 7, 8, 8, 8, 9, 9, 10 and 11. Four of the ten (sizes 9, 9, 10 and 11) wear size 9 or larger. If this sample is typical, about 40% of similar students would need size 9 or larger, and she can order stock to match.',SCN['Proportions above a value, and making inferences'])+'<p>The syllabus asks you to find the <strong>proportion or percentage</strong> of the data above or below a given value. Count how many values are above (or below) it, divide by the total, and multiply by 100 for a percentage. For the mock scores, 3 of the 11 scores are above 25: 3/11 ≈ 27.27%.</p><p>From a frequency table, add up the frequencies of the values above (or below) the given value.</p><p>Finally, <strong>make inferences</strong>: use the statistics to draw sensible conclusions, and say how sure you can be. A conclusion from a small or biased sample may not be true of the whole population. Good inferences compare an average AND a measure of spread, and mention the context.</p>'+WHY('Why is an inference only an estimate? The sample is only part of the population. A different sample of 10 students might give 30% or 50%. Larger, fairly chosen samples give more reliable inferences, which is why good conclusions always mention how big the sample was.')+WORK('<strong>Shop owners</strong> order stock from sales data. <strong>Public health officers</strong> estimate how many people in a parish need a vaccine. <strong>Exam boards</strong> use the percentage of candidates above a mark to set grade boundaries.'),
     example:{q:'Shoe sizes: 6, 7, 7, 8, 8, 8, 9, 9, 10, 11. What percentage of the class wears size 9 or larger? What could a shop infer?',steps:[{do:'Sizes 9 or more: 9, 9, 10, 11, which is 4 of 10 students.'},{do:'4 ÷ 10 × 100 = 40%.'},{do:'Inference: about 40% of similar students need size 9 or larger, and size 8 (the mode) should be stocked most, though the sample is small.'}]},
     mistake:'Making a big claim from a tiny sample. Say how reliable your inference is.',
     check:{q:'In a frequency table, 6 of 24 students scored above 80. What percentage is that?',o:['25%','6%','30%'],a:0,why:'6 ÷ 24 × 100.',hint:'Fraction × 100.'}}]}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',

   blocks:[{type:'facts',facts:[{title:'Data',text:'Population (parameter) vs sample (statistic). Levels: nominal, ordinal, interval, ratio.'},{title:'Diagrams',text:'Frequency table with tallies. Bar chart: equal widths, gaps. Pie chart angle = frequency ÷ total × 360°.'},{title:'Averages',text:'Mean: no extremes. Median: extreme values. Mode: nominal data, or the most common value.'},{title:'Spread and inference',text:'Range = max − min. IQR = Q3 − Q1; semi-IQR = half. Smaller standard deviation = more consistent. % above = count ÷ total × 100.'}]},

  {phase:'elaborate',name:'Maths at work',title:'Maths at work: real jobs, real decisions',lead:'In these jobs, averages and spread decide what a shop stocks, who runs in a relay, whether a news report is fair, and whether a clinic is meeting its target. Choose a job, look at the data, and make the decision.',

   blocks:[{type:'board',star:true,need:3,activities:[
    {icon:'👟',title:'The shoe shop: what to stock',desc:'Use last month’s sales to plan the next order.',level:'⭐⭐ Retail',mins:6,block:{type:'mission',story:'A shoe shop in May Pen sold 50 pairs of school shoes last month: size 6: 4 pairs, size 7: 9, size 8: 15, size 9: 11, size 10: 6, size 11: 5. The owner is ordering 100 pairs for next month.',parts:[{q:'What is the modal size?',a:8,hint:'The size sold most often.',sol:'Size 8 (15 pairs).'},{q:'What percentage of sales were size 10 or larger?',a:22,hint:'(6 + 5) ÷ 50 × 100.',sol:'11 ÷ 50 × 100 = 22%.',placeholder:'%'},{q:'If she orders in the same proportions as last month, how many pairs of size 8 should she order?',a:30,hint:'15 out of every 50 is 30 out of every 100.',sol:'30 pairs.'},{q:'Why is the MODE the right average here, not the mean? Type the size she should stock most.',a:8,hint:'A shop cannot stock size 8.6.',sol:'Size 8. The mean shoe size might be 8.6, which no customer wears; the mode tells her the most popular real size.'}],done:'The mode turned last month’s sales into next month’s order.'}},
    {icon:'🏃🏾‍♀️',title:'The coach: who runs the relay?',desc:'Choose the more reliable sprinter.',level:'⭐⭐ Sport',mins:6,block:{type:'mission',story:'A coach in Spanish Town must choose one sprinter for the last leg of a relay. Their last five 100 m times (seconds): Sprinter A: 11.2, 11.4, 11.3, 11.3, 11.3. Sprinter B: 10.9, 11.8, 11.0, 11.9, 10.9.',parts:[{q:'What is Sprinter A’s mean time? (s)',a:11.3,tol:0.001,hint:'56.5 ÷ 5.',sol:'11.3 s.',placeholder:'seconds'},{q:'What is Sprinter B’s mean time? (s)',a:11.3,tol:0.001,hint:'56.5 ÷ 5.',sol:'11.3 s: the same!',placeholder:'seconds'},{q:'What is the range of Sprinter A’s times? (s)',a:0.2,tol:0.001,hint:'11.4 − 11.2.',sol:'0.2 s.',placeholder:'seconds'},{q:'What is the range of Sprinter B’s times? (s)',a:1,tol:0.001,hint:'11.9 − 10.9.',sol:'1.0 s.',placeholder:'seconds'},{q:'The team needs a reliable runner who will not have a bad day. Who should run? (Type A or B.)',a:['a'],hint:'Same mean, but who is more consistent?',sol:'Sprinter A: the same average, but far more consistent.'}],done:'The means could not separate the sprinters. The spread did.'}},
    {icon:'📰',title:'The fact-checker: is the headline fair?',desc:'Check a newspaper’s claim about pay.',level:'⭐⭐ Journalism',mins:6,block:{type:'mission',story:'A newspaper headline says: "Average pay at this company is $153,400 a month." The five people there earn $60,000, $65,000, $70,000, $72,000 and $500,000 (the owner).',parts:[{q:'Check the headline: what is the mean pay? ($)',a:153400,hint:'767,000 ÷ 5.',sol:'$153,400: the arithmetic is right.',placeholder:'dollars'},{q:'What is the median pay? ($)',a:70000,hint:'The middle value of the ordered data.',sol:'$70,000.',placeholder:'dollars'},{q:'What percentage of the people earn MORE than the mean?',a:20,hint:'Only one person.',sol:'1 of 5 = 20%.',placeholder:'%'},{q:'Is the headline a fair description of what a typical worker earns? (Type yes or no.)',a:['no'],hint:'Four of five earn less than half of the mean.',sol:'No. The number is correct, but misleading: the median, $70,000, describes a typical worker far better.'}],done:'A statistic can be accurate and still misleading. Choosing the right average is part of telling the truth.'}},
    {icon:'🏥',title:'The clinic manager: meeting the target?',desc:'Check waiting times against a target.',level:'⭐⭐⭐ Health',mins:8,block:{type:'mission',story:'A health clinic in Ocho Rios recorded the waiting times (minutes) of 10 patients: 5, 8, 12, 12, 15, 18, 20, 25, 30, 55. Its target is that at least 75% of patients are seen within 30 minutes.',parts:[{q:'What is the median waiting time? (minutes)',a:16.5,tol:0.001,hint:'The mean of the 5th and 6th values: (15 + 18) ÷ 2.',sol:'16.5 minutes.',placeholder:'minutes'},{q:'What is the lower quartile, Q1? (minutes)',a:12,hint:'The median of 5, 8, 12, 12, 15.',sol:'12 minutes.',placeholder:'minutes'},{q:'What is the upper quartile, Q3? (minutes)',a:25,hint:'The median of 18, 20, 25, 30, 55.',sol:'25 minutes.',placeholder:'minutes'},{q:'What is the interquartile range? (minutes)',a:13,hint:'Q3 − Q1.',sol:'13 minutes.',placeholder:'minutes'},{q:'What percentage of patients were seen within 30 minutes?',a:90,hint:'Count the times of 30 or less.',sol:'9 of 10 = 90%.',placeholder:'%'},{q:'Is the clinic meeting its target? (Type yes or no.)',a:['yes'],hint:'Compare 90% with 75%.',sol:'Yes: 90% is above 75%, although one patient waited 55 minutes, which the manager may want to investigate.'}],done:'The quartiles and the percentage told the manager how the clinic is really doing, and where to look next.'}}

    {icon:'🤔',title:'Always, sometimes or never?',desc:'Decide if each statement is always, sometimes or never true.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'asn',statements:[{s:'The median is one of the data values.',a:'sometimes',why:'With an even number of values, it may be halfway between two.'},{s:'An extreme value affects the mean more than the median.',a:'always',why:'The mean uses every value; the median only depends on position.'},{s:'The pie-chart angles add up to 360°.',a:'always',why:'They make a full circle.'},{s:'A larger standard deviation means larger data values.',a:'never',why:'It means more spread, not larger values.'},{s:'You can find the mean of nominal data.',a:'never',why:'Categories like favourite sport have no numerical value.'}]}},
    {icon:'🔍',title:'Spot the mistake',desc:'Find the error in each student\'s working and fix it.',level:'⭐⭐⭐ Deep thinking',mins:6,block:{type:'spot',problems:[{who:'Jaden',q:'Median of 9, 3, 7, 5, 1.',lines:['The middle value is 7'],wrong:0,reasons:['He did not order the data: 1, 3, 5, 7, 9 gives 5','The median is 9','The median is 25'],reason:0,fix:'5.'},{who:'Tia',q:'Pie chart: 8 of 40 people. Angle?',lines:['8/40 = 20%','Angle = 20°'],wrong:1,reasons:['The angle is 20% of 360°, which is 72°','The angle is 8°','The angle is 40°'],reason:0,fix:'72°.'},{who:'Andre',q:'Team A: SD 2. Team B: SD 9. Same mean.',lines:['Team B is more consistent because 9 is bigger'],wrong:0,reasons:['A SMALLER standard deviation means more consistent: Team A','They are equally consistent','You need the median'],reason:0,fix:'Team A is more consistent.'}]}},
    {icon:'⏱️',title:'Beat the clock',desc:'60 seconds of quick-fire statistics.',level:'⭐⭐ Speed and accuracy',mins:2,block:{type:'sprint',seconds:60,target:8,gen:function(){var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))},r=R(0,2);if(r===0){var d=[R(1,9),R(1,9),R(1,9),R(1,9),R(1,9)].sort(function(a,b){return a-b}),m=d[2],sh=d.slice();sh.sort(function(){return Math.random()-0.5});var o=[String(m)];[String(sh[2]),String(Math.round(d.reduce(function(a,b){return a+b},0)/5*10)/10),String(m+1)].forEach(function(z){if(o.length<3&&o.indexOf(z)<0)o.push(z)});return{q:'Median of '+sh.join(', ')+'?',o:o,a:0,why:'Order first: '+d.join(', ')+'.'}}if(r===1){var T=[24,36,40,60,72,90][R(0,5)],f=T/[2,3,4,6][R(0,3)];return{q:f+' out of '+T+' in a pie chart. Angle?',o:[fs1(f/T*360)+'°',fs1(f)+'°',fs1(f/T*100)+'°'],a:0,why:f+'/'+T+' × 360.'}}var a=R(5,20),b=a+R(4,20);return{q:'Q1 = '+a+', Q3 = '+b+'. IQR?',o:[String(b-a),String((b-a)/2),String(a+b)],a:0,why:b+' − '+a+'.'}}}},
    {icon:'✏️',title:'Make your own',desc:'Invent data sets that fit each rule.',level:'⭐⭐⭐ Creative',mins:4,block:{type:'create',tasks:[{q:'Type 5 whole numbers with a mean of 10 and a median of 8.',placeholder:'a, b, c, d, e',check:function(v){var n=String(v).split(',').map(Number).filter(function(x){return!isNaN(x)});if(n.length!==5)return{ok:false,msg:'Type five numbers.'};var s=n.slice().sort(function(a,b){return a-b}),mean=n.reduce(function(a,b){return a+b},0)/5;return mean===10&&s[2]===8?{ok:true,msg:'Yes! Mean 10, median 8.'}:{ok:false,msg:'Your mean is '+mean+' and median is '+s[2]+'. The five must add to 50, with 8 in the middle.'}}},{q:'Type 5 numbers whose mode is 4 and whose range is 6.',placeholder:'a, b, c, d, e',check:function(v){var n=String(v).split(',').map(Number).filter(function(x){return!isNaN(x)});if(n.length!==5)return{ok:false,msg:'Type five numbers.'};var c={};n.forEach(function(x){c[x]=(c[x]||0)+1});var best=Math.max.apply(null,Object.keys(c).map(function(k){return c[k]})),modes=Object.keys(c).filter(function(k){return c[k]===best}).map(Number),range=Math.max.apply(null,n)-Math.min.apply(null,n);return modes.length===1&&modes[0]===4&&best>1&&range===6?{ok:true,msg:'Correct! Mode 4, range 6.'}:{ok:false,msg:'Make 4 appear most often, and the largest minus the smallest equal 6.'}}},{q:'A data set has an extreme value. Which average should you use? (Type mean, median or mode.)',placeholder:'average',check:function(v){return/median/i.test(v)?{ok:true,msg:'Yes! The median is not pulled by extreme values.'}:{ok:false,msg:'Which average ignores extreme values?'}}}]}},
    {icon:'🌧️',title:'Mission: rainfall report',desc:'Analyse Kingston rainfall data for a farmers’ report.',level:'⭐⭐⭐ Real-world mission',mins:8,block:{type:'mission',story:'A farmers’ cooperative near Kingston studies 12 months of rainfall (mm, example data): 18, 22, 30, 35, 40, 55, 60, 75, 90, 110, 150, 180.',parts:[{q:'What is the mean monthly rainfall? (mm, 2 d.p.)',a:72.08,tol:0.01,hint:'865 ÷ 12.',sol:'865 ÷ 12 ≈ 72.08 mm.',placeholder:'mm'},{q:'What is the median? (mm)',a:57.5,tol:0.01,hint:'Halfway between the 6th and 7th values.',sol:'(55 + 60) ÷ 2 = 57.5 mm.',placeholder:'mm'},{q:'What is the interquartile range? (Q1 = 32.5, Q3 = 100) (mm)',a:67.5,tol:0.01,hint:'Q3 − Q1.',sol:'67.5 mm.',placeholder:'mm'},{q:'What percentage of months had more than 100 mm?',a:25,tol:0.01,hint:'3 of 12.',sol:'25%.',placeholder:'%'},{q:'Which average better describes a typical month here? (Type mean or median.)',a:['median'],hint:'The wettest months are extreme values.',sol:'The median: 150 and 180 mm pull the mean up.'}],done:'You found averages, quartiles and percentages, and made an inference from real-world data.'}}
