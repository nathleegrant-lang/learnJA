     init:function(box,api){var a=box.querySelector('#vbA'),b=box.querySelector('#vbB');Object.keys(PROPS).forEach(function(k){[a,b].forEach(function(s){var o=document.createElement('option');o.value=k;o.textContent=PROPS[k][0];s.appendChild(o)})});a.value='even';b.value='m3';function draw(){var U=[];for(var i=1;i<=20;i++)U.push(i);var fa=PROPS[a.value][1],fb=PROPS[b.value][1],ao=U.filter(function(n){return fa(n)&&!fb(n)}),ab=U.filter(function(n){return fa(n)&&fb(n)}),bo=U.filter(function(n){return!fa(n)&&fb(n)}),ne=U.filter(function(n){return!fa(n)&&!fb(n)}),nA=ao.length+ab.length,nB=bo.length+ab.length;box.querySelector('.vbSvg').innerHTML=VENN({A:'A',B:'B',U:'{1, 2, …, 20}',a:chunk(ao),ab:chunk(ab),b:chunk(bo),n:[ne.length+' outside: '+ne.slice(0,6).join(', ')+(ne.length>6?', …':'')],small:true,label:'Venn diagram of '+PROPS[a.value][0]+' and '+PROPS[b.value][0]});box.querySelector('.vbX').innerHTML='A = '+PROPS[a.value][0].toLowerCase()+', B = '+PROPS[b.value][0].toLowerCase()+'.<br>n(A) = '+nA+', n(B) = '+nB+', n(A ∩ B) = '+ab.length+'.<br>n(A ∪ B) = '+nA+' + '+nB+' − '+ab.length+' = <strong>'+(nA+nB-ab.length)+'</strong>. The middle is subtracted once because it was counted twice. n((A ∪ B)′) = '+ne.length+'.'}a.onchange=draw;b.onchange=draw;var T=[{t:'A = even numbers, B = multiples of 3. What is n(A ∩ B)?',ans:3},{t:'With the same sets, what is n(A ∪ B)?',ans:13},{t:'A = prime numbers, B = odd numbers. How many numbers are in B but NOT in A?',ans:3}],k=api.get('k')||0;function task(){if(k>=T.length){box.querySelector('.vbN').textContent='All done';box.querySelector('.vbT').textContent='You completed every challenge!';box.querySelector('.vbC').disabled=true;return}box.querySelector('.vbN').textContent='Challenge '+(k+1)+' of 3';box.querySelector('.vbT').textContent=T[k].t}box.querySelector('.vbC').onclick=function(){var v=+box.querySelector('.vbAns').value,f=box.querySelector('.vbFb');if(v===T[k].ans){f.className='fb ok vbFb';f.textContent='✓ Correct!';k++;ap   {phase:'explain',name:'Teach: intersection, union and complement',title:'Learn: intersection, union, complement and the formula',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'∩ mean both. ∪ mean either one.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Intersection and union',explain:'<p>Think about your class. Some students play football, some play cricket, and some play both. Venn diagrams help us see these groups clearly, with a circle for each set, overlapping where they share members.</p><p>The overlap in the middle holds the students who play <strong>both</strong> sports. This is the {{intersection|the elements in both sets}}, written <strong>A ∩ B</strong>. A good way to remember it: ∩ looks like a little “n” for “and”: in A <em>and</em> in B.</p><p>Now think about everyone who plays at least one of the sports: football, cricket, or both. That is everything inside the two circles. It is the {{union|the elements in either set or both}}, written <strong>A ∪ B</strong>. The ∪ symbol looks like a cup that holds everything from both sets. When you list a union, write each element only once, even if it is in both sets.</p>',visual:VENN({hiAB:true,label:'The overlap of A and B is shaded: this is A intersection B'}),
     example:{q:'A = {1, 2, 3, 4, 6}, B = {2, 4, 6, 8}. Find A ∩ B and A ∪ B.',steps:[{do:'A ∩ B: the numbers in BOTH lists: {2, 4, 6}.'},{do:'A ∪ B: every number in either list, written once: {1, 2, 3, 4, 6, 8}.',why:'Each element is written only once, even if it is in both sets.'}]},
     mistake:'Mixing up ∩ and ∪. The ∩ symbol looks like an "n" for "and both"; ∪ looks like a cup that holds everything.',
     check:{q:'P = {a, b, c}, Q = {b, c, d}. What is P ∩ Q?',o:['{b, c}','{a, b, c, d}','{a, d}'],a:0,why:'b and c are in both.',hint:'Which letters are in BOTH sets?'}},
    {title:'Complements and disjoint sets',explain:'<p>You already know that the complement A′ is everything in the universal set that is not in A. With two sets, we can take complements of the bigger groups too.</p><p><strong>(A ∪ B)′</strong> is everything that is not in either set: the region outside both circles. In the sports example, these are the students who play neither football nor cricket. <strong>(A ∩ B)′</strong> is everything except the overlap: everyone who does not play both sports.</p><p>Sometimes two sets have nothing in common at all. The odd numbers and the even numbers, for example: no number is both. Sets like these are called {{disjoint sets|sets with no elements in common}}. Their intersection is empty: A ∩ B = ∅. In a Venn diagram, their circles do not overlap.</p>',
     example:{q:'U = {1, 2, …, 10}, A = {even numbers}, B = {multiples of 3}. Find (A ∪ B)′.',steps:[{do:'A = {2, 4, 6, 8, 10}, B = {3, 6, 9}.'},{do:'A ∪ B = {2, 3, 4, 6, 8, 9, 10}.'},{do:'(A ∪ B)′ = the numbers in U not in A ∪ B = {1, 5, 7}.',why:'These are outside both circles.'}]},
     mistake:'Forgetting that the complement depends on U. Always check what the universal set is.',
     check:{q:'A = {odd numbers} and B = {even numbers}. What is A ∩ B?',o:['∅','{1, 2}','U'],a:0,why:'No number is both odd and even, so the sets are disjoint.',hint:'Can a number be odd AND even?'}},
    {title:'Counting: n(A ∪ B)',explain:'<p>Here is where the opening puzzle gets solved. The survey said 25 students play football and 18 play cricket. But 25 + 18 = 43, and there are only 33 students who play a sport. How?</p><p>The answer is in the overlap. Students who play <em>both</em> sports were counted twice: once in the 25 footballers, and once again in the 18 cricketers. To find how many students play at least one sport, we must take away that double count once.</p><p>That gives a very useful formula: <strong>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</strong>. Add the two sets, then subtract the overlap, because it was counted twice. It works in any direction: if you know three of the numbers, you can find the fourth.</p>',
     example:{q:'The opening survey: 40 students; 25 play football, 18 play cricket, 7 play neither. How many play both?',steps:[{do:'Students who play at least one sport: 40 − 7 = 33. So n(F ∪ C) = 33.'},{do:'Use the formula: 33 = 25 + 18 − n(F ∩ C).'},{do:'33 = 43 − n(F ∩ C), so n(F ∩ C) = 10.',why:'The 10 students who play both were counted twice in 25 + 18.'},{do:'10 play both: that explains the extra 10! Was your prediction right?'}]},
     mistake:'Adding n(A) + n(B) for the union without subtracting the overlap.',
     check:{q:'n(A) = 12, n(B) = 9, n(A ∩ B) = 4. What is n(A ∪ B)?',o:['21','17','25'],a:1,why:'12 + 9 − 4 = 17.',hint:'Subtract the overlap once.'}}]}]},
  {phase:'explain',name:'Teach: drawing and solving',title:'Learn: drawing Venn diagrams and solving problems',lead:'Next, drawing Venn diagrams and using them to solve survey problems.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Always start wid di middle.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Drawing a Venn diagram',explain:'<p>A {{Venn diagram|a rectangle for U, with circles for the sets}} has a rectangle for the universal set and a circle for each set inside it. Filling one in correctly is all about the <strong>order</strong> you do it in.</p><p>Always start in the <strong>middle</strong>, with the overlap. Why? Because the totals you are given usually include the overlap. If 25 students play football and 10 play both sports, then the “football only” region is not 25; it is 25 − 10 = 15, because 10 of those footballers are already in the middle.</p><p>So the method is: fill in the middle first. Then work out each “only” region by subtracting the middle from that set’s total. Then fill in the region outside the circles. Finally, add up every region and check that it matches the size of the universal set. If it does not, something has gone wrong.</p>',visual:VENN({A:'F',B:'C',a:'15',ab:'10',b:'8',n:'7',label:'Venn diagram: football only 15, both 10, cricket only 8, neither 7'}),
     example:{q:'Draw the Venn diagram for the sports survey: 40 students, 25 football (F), 18 cricket (C), 10 both, 7 neither.',steps:[{do:'Middle first: F ∩ C = 10.'},{do:'Football only: 25 − 10 = 15. Cricket only: 18 − 10 = 8.',why:'The totals 25 and 18 include the 10 in the middle.'},{do:'Outside: 7.'},{do:'Check: 15 + 10 + 8 + 7 = 40 ✓'}]},
     mistake:'Writing 25 in the "football only" region. The 25 includes the 10 who play both, so football only is 15.',
     check:{q:'n(A) = 20, n(A ∩ B) = 6. How many are in A only?',o:['26','14','6'],a:1,why:'20 − 6 = 14.',hint:'Subtract the middle from the total.'}},
    {title:'Survey problems with an unknown',explain:'<p>Sometimes a survey does not tell you how many people are in the overlap; that is exactly what you have to find. Here is a neat strategy: call the unknown overlap <strong>x</strong>.</p><p>Then write every region in terms of x. If 18 students like mango and x like both, then “mango only” is 18 − x. If 15 like guinep, then “guinep only” is 15 − x. The middle is x, and the outside is however many like neither.</p><p>Now add up all the regions and set the total equal to the number of people surveyed. You get an equation, and solving it gives you x. This is a great example of how algebra and sets work together.</p>',
     example:{q:'30 students: 18 like mango, 15 like guinep, x like both, 5 like neither. Find x.',steps:[{do:'Mango only: 18 − x. Guinep only: 15 − x. Both: x. Neither: 5.'},{do:'Total: (18 − x) + x + (15 − x) + 5 = 30.'},{do:'Simplify: 38 − x = 30, so x = 8.',why:'Collect the numbers and the x terms.'},{do:'Check: 10 + 8 + 7 + 5 = 30 ✓'}]},
     mistake:'Writing 18 and 15 in the "only" regions and then adding x. The "only" regions must be 18 − x and 15 − x.',
     check:{q:'50 students: 30 study Spanish, 25 study French, 10 study both. How many study neither?',o:['5','15','0'],a:0,why:'Spanish or French: 30 + 25 − 10 = 45; neither: 50 − 45 = 5.',hint:'Find n(S ∪ F) first.'}},
    {title:'Three sets, and sets in number and geometry',explain:'<p>With three overlapping sets, a Venn diagram has more regions: eight in total. There is one region in the very middle, inside all three circles. There are three regions where exactly two circles overlap, three regions inside just one circle, and the outside.</p><p>It looks busy, but you can handle it if you read each question carefully. To find n(A), add up <em>every</em> region inside circle A, including the parts it shares. To find the number in exactly one set, add only the three “only” regions.</p><p>Sets also help describe facts in number and geometry. For example, every square is a rectangle, because it has four right angles and opposite sides equal. So the set of squares is a subset of the set of rectangles. In a Venn diagram, the squares circle sits completely inside the rectangles circle.</p>',visual:VENN3,
     example:{q:'Using the three-set diagram, find n(A) and n(A ∩ B).',steps:[{do:'n(A) = all the regions inside circle A: 5 + 3 + 2 + 2 = 12.',why:'Include the regions A shares with B, with C, and with both.'},{do:'n(A ∩ B) = the regions inside BOTH A and B: 3 + 2 = 5.',why:'The centre region (2) is in A and B as well as C.'}]},
     mistake:'Using only the "A only" region (5) for n(A). n(A) includes every region inside circle A.',
     check:{q:'Using the same diagram, how many elements are in exactly one set?',o:['15','6','25'],a:0,why:'5 + 4 + 6 = 15.',hint:'Add the three "only" regions.'}}]},{type:'recall',text:'10 students play both sports. They were counted in both the 25 and the 18, which is why the total came to 50.'}]},
  {phase:'explain',name:'Practise with support',title:'Practise with support: I do, we do, you do',lead:'Here are the key facts. Then watch a full example, fill in a missing step, and try some on your own.',

   blocks:[{type:'facts',facts:[{title:'Symbols',text:'A ∩ B: in both. A ∪ B: in either or both. A′: not in A. Disjoint: A ∩ B = ∅.'},{title:'The formula',text:'n(A ∪ B) = n(A) + n(B) − n(A ∩ B). For example, 25 + 18 − 10 = 33.'},{title:'Drawing',text:'Middle first, then each "only" region (total − middle), then the outside. Check the regions add to n(U).'},{title:'Unknowns',text:'Call the middle x. Write each region in terms of x, add them, set equal to n(U), and solve.'}]},

     {type:'own',q:'30 students: 18 like mango, 15 like guinep, 5 like neither. How many like both?',a:8,hint:'Either = 30 − 5 = 25. Then 18 + 15 − both = 25.',sol:'33 − 25 = 8.'},
     {type:'own',q:'Using the three-set diagram (only A 5, only B 4, only C 6, A∩B only 3, A∩C only 2, B∩C only 1, all three 2, none 7), how many are in B?',a:10,hint:'Add every region inside circle B.',sol:'4 + 3 + 1 + 2 = 10.'}]}]},
