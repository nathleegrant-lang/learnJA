     init:function(box,api){var sel=box.querySelector('#phO'),done=api.get('d')||[];OBJ.forEach(function(o,i){var e=document.createElement('option');e.value=i;e.textContent=o[0];sel.appendChild(e)});function table(){box.querySelector('.phT tbody').innerHTML=done.map(function(i){var o=OBJ[i];return'<tr><td>'+o[0]+'</td><td>'+o[1]+'</td><td>'+o[2]+'</td><td><strong>'+(o[2]/o[1]).toFixed(2)+'</strong></td></tr>'}).join('');if(done.length>=3)box.querySelector('.phX').innerHTML='Look at the last column! For every circle, big or small, C ÷ d comes out at about <strong>3.14</strong>. This special number is called <strong>π</strong> (pi). So the circumference is always about 3.14 times the diameter.';else if(done.length)box.querySelector('.phX').textContent='Keep measuring. Do you notice anything about the last column?'}box.querySelector('.phM').onclick=function(){var i=+sel.value;if(done.indexOf(i)<0){done.push(i);api.set('d',done)}table()};var T=[{t:'For the dinner plate, what is C ÷ d, to 2 decimal places?',a:3.14,tol:0.011},{t:'Using π = 3.14, what is the circumference of a circle with a diameter of 10 cm?',a:31.4,tol:0.05},{t:'Using C = π × d, how far does Andre’s 70 cm bicycle wheel travel in one turn, to the nearest cm? (π = 3.14)',a:220,tol:0.6}],q=api.get('k')||0;function task(){if(q>=T.length){box.querySelector('.phN').textContent='All done';box.querySelector('.phQ').textContent='You completed every challenge!';box.querySelector('.phC').disabled=true;return}box.querySelector('.phN').textContent='Challenge '+(q+1)+' of 3';box.querySelector('.phQ').textContent=T[q].t}box.querySelector('.phC').onclick=function(){var v=parseFloat(box.querySelector('.phA').value),fb=box.querySelector('.phFb');if(Math.abs(v-T[q].a)<=T[q].tol){fb.className='fb ok phFb';fb.textContent='✓ Correct!';q++;api.set('k',q);box.querySelector('.phA').value='';task();if(q===T.length)api.complete()}else{fb.className='fb no phFb';fb.textContent='Not yet. Look at your table, or multiply the diameter by 3.14.'}};table();task()}},
    {type:'recall',text:'One turn of a 70 cm wheel moves the bike π × 70 ≈ 220 cm: more than three times the width of the wheel!'}]},
  {phase:'explain',name:'Teach: circumference and area',title:'Learn: π, circumference and area',lead:'Work through each idea in order. A new idea unlocks when you answer the "Your turn" question.',
   mission:['Read or listen to each idea (🔊 Listen). Tap any highlighted word to see its meaning.','Step through the worked example and read the "Why?" for each step.','Answer "Your turn" to unlock the next idea.'],
   patois:'Circumference go round. Area fill up di inside.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'π, and the circumference',explain:'<p>Let’s name the parts first. The {{radius|the distance from the centre to the edge}} goes from the centre to the edge. The {{diameter|the distance across a circle through its centre; twice the radius}} goes all the way across, through the centre, so it is two radii long. The {{circumference|the distance all the way around a circle}} is the distance all the way around.</p><p>In the π hunt, you found something remarkable. For every circle, from a bottle cap to a bicycle wheel, the circumference divided by the diameter came out at about 3.14. Mathematicians call this number {{π|circumference ÷ diameter for any circle: about 3.14 or 22/7}} (pi). Its decimals actually go on forever without repeating: 3.14159265… So we round it to 3.14, or use the fraction 22/7.</p><p>Because C ÷ d = π, we can turn it around: <strong>C = πd</strong>. And since d = 2r, we can also write <strong>C = 2πr</strong>. We can even go backwards: if you know the circumference, <strong>d = C ÷ π</strong>.</p>',visual:CIRC('parts','A circle showing the radius, diameter and circumference'),
     example:{q:'A round table top has a circumference of 220 cm. What is its diameter? (π = 22/7)',steps:[{do:'d = C ÷ π.',why:'C ÷ d = π, so rearranging gives d = C ÷ π.'},{do:'d = 220 ÷ 22/7 = 220 × 7/22.'},{do:'= 10 × 7 = 70 cm.'}]},
     mistake:'Using the radius in C = πd (or the diameter in C = 2πr). Match the formula to the measurement you are given.',
     check:{q:'A circle has a radius of 7 cm. What is its circumference? (π = 22/7)',o:['22 cm','44 cm','154 cm'],a:1,why:'2 × 22/7 × 7 = 44 cm.',hint:'C = 2πr.'}},
    {title:'Why the area is πr²',explain:'<p>The area of a circle is the space inside it, like the amount of pizza you get. Here is a beautiful way to see where the formula comes from.</p><p>Cut a pizza into lots of thin slices. Lay them in a row, pointing up and down alternately, like teeth. The shape you get is almost a rectangle. The more slices you use, the more it looks exactly like one.</p><p>How tall is that “rectangle”? Each slice is as long as the radius, so the height is <strong>r</strong>. How long is it? Half of the crust is along the top and half along the bottom, so the length is half the circumference: ½ × 2πr = <strong>πr</strong>. So the area is length × height = πr × r = <strong>πr²</strong>.</p><p>Another way to picture it: draw a square on the radius. The circle’s area is about 3.14 of those “radius squares”.</p>',
     example:{q:'Find the area of a round mat with a radius of 5 m. (π = 3.14)',steps:[{do:'A = πr² = 3.14 × 5².'},{do:'5² = 25.',why:'Square the radius first.'},{do:'A = 3.14 × 25 = 78.5 m².'}]},
     mistake:'Using the diameter instead of the radius in A = πr². Halve the diameter first.',
     check:{q:'A circle has a radius of 10 cm. What is its area? (π = 3.14)',o:['62.8 cm²','314 cm²','100 cm²'],a:1,why:'3.14 × 100 = 314 cm².',hint:'A = πr².'}},
    {title:'Calculating with the diameter',explain:'<p>In real life, it is usually easier to measure the diameter of something round. You can lay a ruler straight across a plate, but it is hard to find the exact centre for the radius. So many questions give you the diameter.</p><p>For the <strong>circumference</strong>, that is easy: just use C = πd. For the <strong>area</strong>, there is one extra step: <strong>halve the diameter</strong> to get the radius, then use A = πr².</p><p>And always check your units. The circumference is a length, so it is in cm or m. The area is in square units, cm² or m².</p>',
     example:{q:'A circular garden bed has a diameter of 14 m. Find its circumference and area. (π = 22/7)',steps:[{do:'Circumference: C = πd = 22/7 × 14 = 44 m.'},{do:'Radius: 14 ÷ 2 = 7 m.',why:'The area formula needs the radius.'},{do:'Area: A = 22/7 × 7² = 22/7 × 49 = 154 m².'}]},
     mistake:'Squaring the diameter: π × 14² gives an area four times too big.',
     check:{q:'A circle has a diameter of 20 cm. What is its area? (π = 3.14)',o:['314 cm²','1,256 cm²','62.8 cm²'],a:0,why:'Radius 10, so 3.14 × 100 = 314 cm².',hint:'Halve the diameter first.'}}]}]},
  {phase:'explain',name:'Teach: arcs, sectors and segments',title:'Learn: arcs, sectors and segments',lead:'Next, parts of a circle. The key idea: each part is a fraction of the whole circle.',
   mission:['Read or listen to each idea. Tap highlighted words for their meaning.','Step through each worked example and read the "Why?".','Answer "Your turn" to unlock the next idea.'],
   patois:'Find di fraction a di circle first.',
   blocks:[{type:'teach',star:true,chunks:[
    {title:'Arcs, sectors and segments',explain:'<p>Think about a round pizza again. The crust along the edge of one slice is part of the circumference: that curved piece is an {{arc|part of the circumference}}. The whole slice, from the point in the middle out to the crust, is a {{sector|a slice of a circle between two radii and an arc}}. A sector always has two straight sides, and both are radii.</p><p>Now imagine cutting straight across the pizza, but not through the middle. That straight cut is a {{chord|a straight line joining two points on a circle}}. The smaller piece between the chord and the crust is a {{segment|the region between a chord and an arc}}. It is shaped a bit like a slice of orange.</p><p>Here is how to tell them apart. A sector reaches all the way to the <strong>centre</strong>. A segment does not; it is cut off by a straight chord.</p>',visual:CIRC('segment','A circle with a chord and a segment shaded'),
     example:{q:'Decide whether each is a sector or a segment: (a) one slice of a round cake cut from the middle; (b) the piece left when you cut straight across near the edge of a tortilla.',steps:[{do:'(a) It reaches the centre and has two straight sides that are radii: a sector.'},{do:'(b) It is cut off by one straight line that does not pass through the centre: a segment.'}]},
     mistake:'Calling every piece of a circle a sector. If it is cut off by a chord and does not reach the centre, it is a segment.',
     check:{q:'A piece of a circle between two radii and an arc is a…',o:['segment','sector','chord'],a:1,why:'Two radii plus an arc make a sector.',hint:'Does it reach the centre?'}},
    {title:'Arc length',explain:'<p>How long is the crust on one slice of pizza? It depends on how big the slice is, and we measure that by its angle at the centre, the {{subtended angle|the angle at the centre made by an arc or sector}}, θ.</p><p>A whole circle is 360°. So a slice with an angle of 90° is 90/360 = <strong>¼</strong> of the circle. Its arc is therefore ¼ of the whole circumference. A 60° slice is 60/360 = 1/6 of the circle, so its arc is 1/6 of the circumference.</p><p>That gives the formula: <strong>arc length = (θ/360) × 2πr</strong>. But you do not need to memorise it if you remember the idea: work out what fraction of the circle you have, then take that fraction of the circumference.</p>',visual:CIRC('arc','A circle with one arc highlighted'),
     example:{q:'Find the arc length of a sector with radius 21 cm and angle 60°. (π = 22/7)',steps:[{do:'Fraction of the circle: 60/360 = 1/6.'},{do:'Whole circumference: 2 × 22/7 × 21 = 132 cm.'},{do:'Arc length: 1/6 × 132 = 22 cm.'}]},
     mistake:'Forgetting to divide by 360. The arc is only part of the circumference.',
     check:{q:'A sector has a radius of 7 cm and an angle of 90°. What is its arc length? (π = 22/7)',o:['11 cm','44 cm','22 cm'],a:0,why:'¼ of 44 cm = 11 cm.',hint:'Find the circumference, then take a quarter.'}},
    {title:'Areas of sectors and segments',explain:'<p>The area of a sector works exactly the same way. Find what fraction of the circle it is, then take that fraction of the whole area: <strong>sector area = (θ/360) × πr²</strong>.</p><p>A segment takes one more step. Look at the picture of a sector with a chord across it. The sector is made of two parts: a triangle (from the centre to the two ends of the chord) and the segment. So to find the segment, take the triangle away from the sector: <strong>segment = sector − triangle</strong>.</p><p>When the angle is 90°, the triangle is a right-angled triangle with both short sides equal to the radius, so its area is ½ × r × r.</p>',visual:CIRC('sector','A circle with a sector shaded'),
     example:{q:'A sector has a radius of 10 cm and an angle of 90°. Find the area of the sector, and of the segment cut off by the chord. (π = 3.14)',steps:[{do:'Sector: 90/360 = ¼ of the circle. ¼ × 3.14 × 10² = ¼ × 314 = 78.5 cm².'},{do:'Triangle: a right-angled triangle with sides 10 and 10: ½ × 10 × 10 = 50 cm².'},{do:'Segment = sector − triangle = 78.5 − 50 = 28.5 cm².',why:'The sector is the triangle plus the segment.'}]},
     mistake:'Giving the sector area when the question asks for the segment. Remember to subtract the triangle.',
     check:{q:'A sector is 1/6 of a circle of area 150.72 cm². What is the sector’s area?',o:['25.12 cm²','75.36 cm²','904.32 cm²'],a:0,why:'150.72 ÷ 6 = 25.12 cm².',hint:'Take 1/6 of the whole area.'}}]}]},
